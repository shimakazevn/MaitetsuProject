102 = "Kế hoạch sửa chữa \\x%l8620;#00ffc040;8620%l;#; hiện tại chưa đủ vững chắc để chống chọi lại những hành động phá hoại.\\nNếu vậy, chúng ta nên bắt đầu từ những chỗ khó khăn nhất."
