[script]
# JP: (つぅっ――)
31 = "(Phụt——)"
# JP: \x%l8620;#00ffc040;8620%l;#;の修復にはもう、完全に目途がついている。\nならば、僕のなすべきことは――
84 = "Việc tu sửa \\x%l8620;#00ffc040;8620%l;#; đã hoàn toàn có hướng giải quyết.\\nNếu vậy, điều tôi cần làm là——"
# JP: \x%l8620;#00ffc040;8620%l;#;改修は、予想以上の協力の手と、募金までをも\n得たことにより、驚異的なペースで進捗している。
86 = "Việc tu sửa \\x%l8620;#00ffc040;8620%l;#;, nhờ nhận được sự giúp đỡ và cả tiền quyên góp\\nvượt ngoài dự kiến, đang tiến triển với tốc độ đáng kinh ngạc."
# JP: \x%l8620;#00ffc040;8620%l;#;の[キャブ,2]運転台は狭い。
87 = "Buồng lái của \\x%l8620;#00ffc040;8620%l;#; rất chật hẹp."
# JP: \x%lキハ07;#00ffc040;キハ07%l;#;は停止した。\n――衝撃音は聞こえてこない。
90 = "\\x%lキハ07;#00ffc040;KiHa 07%l;#; đã dừng lại.\\n——Không nghe thấy tiếng va chạm."
# JP: “早く”は実際――\nもはや目に見える範囲の目標なのだ。
1507 = "\"Nhanh chóng\" trên thực tế——\\nđã trở thành một mục tiêu có thể nhìn thấy được rồi."
# JP: ……ハチロクの小さな指が、\n僕の強張った筋肉たちをほぐして隙間に血を通していく。
1513 = "……Những ngón tay nhỏ nhắn của Hachiroku,\\nđang xoa dịu những bó cơ căng cứng của tôi, giúp máu lưu thông qua các khe hở."
# JP: ……さすがに、まばたきをしてしまう。\nしかし、見え方は少しも変わらない。
1516 = "……Quả nhiên, tôi không khỏi chớp mắt mấy cái.\\nNhưng mà, cảnh tượng trước mắt vẫn chẳng thay đổi chút nào."
# JP: ……登呂流湯のばあさんの短い検査と問診、触診。\n専用らしい機械にかけての機能確認。
1519 = "……Bà lão ở nhà tắm Tororyu-yu đã tiến hành kiểm tra ngắn, hỏi bệnh và sờ nắn.\\nSau đó xác nhận chức năng bằng một cỗ máy có vẻ là đồ chuyên dụng."
# JP: ……誰かが斧でも使っているのだろうか。\n木を切るような音がだんだん、大きくなってくる。
1522 = "……Có ai đó đang dùng rìu hay sao.\\nÂm thanh như đang chặt cây ngày càng lớn dần."
# JP: 「急勾配が苦手なのか？　\x%l8620;#00ffc040;8620%l;#;は」
1532 = "「\\x%l8620;#00ffc040;8620%l;#; không giỏi leo dốc cao sao?」"
# JP: 「\x%l8620;#00ffc040;8620%l;#;は\x%l客車;#00ffc040;客車%l;#;を引くことを主目的に作られたので、\n足がいささか、大きいのです」
1535 = "「\\x%l8620;#00ffc040;8620%l;#; được chế tạo với mục đích chính là kéo \\x%l客車;#00ffc040;toa hành khách%l;#;,\\nnên bánh xe có hơi lớn một chút ạ.」"
# JP: 「\x%l保線;#00ffc040;[ほせん,1]保線%l;#;だ。鉄道に\x%l保線;#00ffc040;保線%l;#;は欠かせぬと」
1537 = "「\\x%l保線;#00ffc040;Bảo trì đường ray%l;#; đấy. Em bảo đường sắt thì không thể thiếu \\x%l保線;#00ffc040;bảo trì đường ray%l;#; mà.」"
# JP: 「\x%l共感;#00ffc040;共感%l;#;――なんでとおらないっ――なぜっ！？」
1541 = "「\\x%l共感;#00ffc040;Cộng cảm%l;#;——sao lại không kết nối được——tại sao!?」"
# JP: 「\x%l共感;#00ffc040;共感%l;#;が通らぬなら、れいなが居眠りしているのだ！\nならば\x%l列車;#00ffc040;列車%l;#;は、他の方法で止める他ないっ！！」
1542 = "「Nếu \\x%l共感;#00ffc040;cộng cảm%l;#; không kết nối được, thì tức là Reina đang ngủ gật!\\nNếu vậy thì không còn cách nào khác ngoài việc dùng cách khác để dừng \\x%l列車;#00ffc040;đoàn tàu%l;#; lại!!」"
# JP: 「\x%l動輪;#00ffc040;動輪%l;#;直径が大きいと――乗り心地が良くなる反面、\nパワーは発揮しづらくなる……のか？」
1547 = "「Đường kính \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; lớn thì——tuy mang lại cảm giác thoải mái khi ngồi, nhưng bù lại\\nsẽ khó phát huy được sức mạnh…… đúng không?」"
# JP: 「\x%l勾配千分率;#00ffc040;勾配千分率%l;#;1.6。\x%l施工基面高;#00ffc040;施工基面高%l;#;[イチニイサンテンマルキュウ,5]123.09」。\n\x%l勾配距離;#00ffc040;勾配距離%l;#;が、149.23。\x%lレール種別;#00ffc040;レール種別%l;#;は[さんじゅっ,1]30キロままです」
1550 = "「\\x%l勾配千分率;#00ffc040;Độ dốc phần nghìn%l;#; 1.6. \\x%l施工基面高;#00ffc040;Cao độ mặt nền đường sắt%l;#; 123.09. \\x%l勾配距離;#00ffc040;Chiều dài đoạn dốc%l;#; là 149.23. \\x%lレール種別;#00ffc040;Loại ray%l;#; vẫn là 30 ký.」"
# JP: 「\x%l勾配変更点;#00ffc040;勾配変更点%l;#;、837.11」
1553 = "「\\x%l勾配変更点;#00ffc040;Điểm thay đổi độ dốc%l;#;, 837.11.」"
# JP: 「…………」
1557 = "「…………」"
# JP: 「……しかし、凪様には驚かされました」
1566 = "「……Nhưng mà, cô Nagi làm em bất ngờ thật đấy.」"
# JP: 「……お前は、物で、道具なのだな」
1568 = "「……Em quả thực là một đồ vật, một công cụ nhỉ.」"
# JP: 「……綺麗……です。」
1571 = "「……Đẹp quá…… ạ.」"
# JP: 「……なるほどな」
1572 = "「……Ra là vậy.」"
# JP: 「……見違えるほど良くなりました。\nおまけせず、公平な採点で５１点を差し上げます」
1575 = "「……Đã tiến bộ đến mức không nhận ra luôn ạ.\\nKhông châm chước, em chấm điểm công bằng là 51 điểm.」"
# JP: 「……ふむ……ふむ」
1576 = "「……Hừm…… hừm.」"
# JP: 「……ふむ？　ふむ。おお、なるほど、観光の連携か」
1577 = "「……Hừm? Hừm. Ồ, ra là vậy, liên kết du lịch sao.」"
# JP: 「……考えとは、知性の産物だ。\nそして知性は容易に連鎖し、時に暴走さえするからな」
1580 = "「……Suy nghĩ, là sản phẩm của trí tuệ.\\nVà trí tuệ thì rất dễ tạo ra chuỗi phản ứng dây chuyền, thậm chí đôi khi còn vượt ngoài tầm kiểm soát.」"
# JP: 「……いまのわたくしの計測ですと、\nある程度の誤差は否めないかもしれませんが」
1581 = "「……Với khả năng đo lường của em hiện tại,\\ncó lẽ không thể tránh khỏi một sai số nhất định.」"
# JP: 「大正解です。\x%l粘着力;#00ffc040;粘着力%l;#;も小さい方が得やすいですから……\n急勾配は、できることなら避けたいのです」
1865 = "「Chính xác hoàn toàn ạ. \\x%l粘着力;#00ffc040;Lực bám đường%l;#; thì bánh nhỏ cũng dễ đạt được hơn……\\nNên nếu có thể, em rất muốn tránh những con dốc cao.」"
# JP: 「ちがうばい！　特訓ばいっ！」
1867 = "「Không phải! Là đặc huấn!」"
# JP: 「勝手に……\n何を考えてしまうのでしょうか？」
1869 = "「Tự ý……\\nEm đã suy nghĩ về chuyện gì cơ chứ?」"
# JP: 「いけんばい。\nにーさんにも、汗と汚れがうつっちゃうばい」
1872 = "「Không được đâu.\\nAnh hai cũng sẽ bị dính mồ hôi và bụi bẩn mất.」"
# JP: 「ダメです！　完全に幹で塞がれていま――っ！！？」
1874 = "「Không xong rồi! Bị thân cây chắn ngang hoàn toàn rồi——Ư!!?」"
# JP: 「しかし、運転[ボディ]体のセンサーというのは大した物だな。\n器具なしで勾配を測定できるとは」
1878 = "「Nhưng mà, cảm biến của thân vận hành tuyệt thật đấy. Không cần dụng cụ mà vẫn đo được độ dốc cơ mà.」"
# JP: 「とはいえ、この程度でしたら上出来です。\n\x%lフライアッシュ;#00ffc040;[フライアッシュ,2]燃え殻%l;#;が些か無様になる程度。走行には支障は出ません」
1879 = "「Mặc dù vậy, ở mức độ này là rất xuất sắc rồi ạ.\\nChỉ là \\x%lフライアッシュ;#00ffc040;tro bay%l;#; trông hơi khó coi một chút thôi. Sẽ không ảnh hưởng đến việc chạy tàu đâu ạ.」"
# JP: 「無数ではない、数えきれるさ。\nゆえに、ひとつずつ潰していける」
1881 = "「Không phải vô số đâu, đếm được cả đấy.\\nVì vậy, chúng ta có thể giải quyết từng việc một.」"
# JP: 「そう大したものでもないですよ？　走行中は確認までで。\n実地を歩いて止まってみて、やっと精度が出せる程です」
1882 = "「Cũng không tuyệt đến thế đâu ạ? Lúc đang chạy thì chỉ có thể xác nhận thôi.\\nPhải đi bộ thực tế rồi dừng lại thì mới có thể đo chính xác được.」"
# JP: 「なになに？　デートのお話ばい？」
1886 = "「Gì thế gì thế? Đang nói chuyện hẹn hò hả?」"
# JP: 「しかしハチロク、僕は僕以外の何者でもない。\nお前の代わりに、お前の答えを考えてはやれんぞ？」
1892 = "「Nhưng Hachiroku này, tôi không phải ai khác ngoài chính tôi. Tôi không thể suy nghĩ thay em để tìm ra câu trả lời cho em được đâu?」"
# JP: 「ですが双鉄様といればわたくし、少しも怖くありません。\nきっと、考えすぎずにすみます」
1895 = "「Nhưng nếu ở cùng ngài Soutetsu, em sẽ không sợ hãi chút nào.\\nChắc chắn, em sẽ không phải suy nghĩ quá nhiều nữa.」"
# JP: 「保護者にきちんと説明をして問い合わせてくれ。\n許諾が出たなら、登呂流湯には僕から掛け合おう」
1898 = "「Hãy giải thích rõ ràng và hỏi ý kiến người giám hộ đi.\\nNếu được cho phép, anh sẽ đứng ra nói chuyện với nhà tắm Tororyu-yu.」"
# JP: 「この程度の道理、少し考えればわかるだろうが！」
1900 = "「Chút đạo lý cỡ này, chỉ cần suy nghĩ một chút là hiểu ngay mà!」"
# JP: 「しっかりしろ、ふかみ。\nさっきから『そういう』ばかりを言っているぞ」
1903 = "「Tỉnh táo lại đi, Fukami.\\nTừ nãy giờ em cứ nói 'như thế' suốt đấy.」"
# JP: 「ショックではなかったのか？」
1904 = "「Em không thấy sốc sao?」"
# JP: 「お前がコントロール出来ない部分がおそらく、\n勝手に考えてしまうがゆえの、“考えすぎ”だ」
1906 = "「Những phần mà em không thể kiểm soát có lẽ là, do em tự ý suy nghĩ, nên mới thành ra \"suy nghĩ quá nhiều\".」"
# JP: 「そら、つかまれ」
1907 = "「Đây, bám vào anh đi.」"
# JP: 「無理！　わたし。チャレンジは、無理。です」
1912 = "「Không được đâu! Em. Thử thách là, không thể nào. Ạ.」"
# JP: 「止めましたっ！\nわたくしたち――わたくしたちは止めましたっ！」
1913 = "「Dừng lại được rồi!\\nChúng ta——chúng ta đã dừng được nó rồi!」"
# JP: 「止まったよな、止まったんだよな。\n頼む――頼むよっ！」
1914 = "「Dừng lại rồi nhỉ, đã dừng lại rồi đúng không.\\nLàm ơn——làm ơn đi!」"
# JP: 「止まれっ！　止まるんだっ！　止まってくれ！！！\n止まらねば！　止まらねばまた事故になるっ！！！！」
1915 = "「Dừng lại! Dừng lại đi! Xin hãy dừng lại!!!\\nPhải dừng lại! Không dừng lại thì sẽ lại xảy ra tai nạn mất!!!!」"
# JP: 「止まれっ！！！」
1916 = "「Dừng lại!!!」"
# JP: 「ハチロク――」
1923 = "「Hachiroku——」"
# JP: 「ハチロク――見ろ、凪だ」
1924 = "「Hachiroku——nhìn kìa, là Nagi.」"
# JP: 「なぁ、ハチロク。お前がいっていたとおりだな」
1925 = "「Này, Hachiroku. Đúng như những gì em đã nói nhỉ.」"
# JP: 「ハチロクから先に――っ！」\n「双鉄様からお先に――っ！」
1927 = "「Hachiroku nói trước đi——Ư!」\\n「Ngài Soutetsu nói trước đi ạ——Ư!」"
# JP: 「ハチロクっ！　ハチロクっ！！！」
1931 = "「Hachiroku! Hachiroku!!!」"
# JP: 「ハチロク！　どうした、\x%lキハ07;#00ffc040;キハ07%l;#;が来ているのかっ！？」
1934 = "「Hachiroku! Có chuyện gì vậy, \\x%lキハ07;#00ffc040;KiHa 07%l;#; đang đến sao!?」"
# JP: 「ハチロク！　\x%l列車;#00ffc040;列車%l;#;を止める方法を！」
1938 = "「Hachiroku! Cách để dừng \\x%l列車;#00ffc040;đoàn tàu%l;#; lại!」"
# JP: 「ハチロク！　レールはっ！！」
1940 = "「Hachiroku! Đường ray thì sao!!」"
# JP: 「目を覚ませっ！！」
1950 = "「Tỉnh táo lại đi!!」"
# JP: 「凪……お前――\n昨日、倒すといっていた大物は、まさか」
1955 = "「Nagi…… em——\\nTên khổng lồ mà em nói sẽ hạ gục ngày hôm qua, không lẽ nào.」"
# JP: 「凪様？　――って、えええええええっ！！？」
1962 = "「Cô Nagi? ——Hả, êêêêêêê!!?」"
# JP: 「喋るな。まして慌てて動くな。\nゆっくりと――風呂から上がって、体を冷やせ」
1965 = "「Đừng nói gì cả. Càng không được cuống cuồng cử động.\\nTừ từ——ra khỏi bồn tắm, làm mát cơ thể đi.」"
# JP: 「貸し切りばい！　面白そうばい！\n絶対はいらせてもらうばーーーいっ！！」
1978 = "「Bao trọn phòng! Nghe thú vị quá!\\nNhất định em phải vào tắm mớiiiiiiiiii đượccc!!」"
# JP: 「貸し切り！？」\n「お、女湯――って」
1979 = "「Bao trọn phòng!?」\\n「Ph, phòng tắm nữ——sao.」"
# JP: 「十、九、八、七――」
1981 = "「Mười, chín, tám, bảy——」"
# JP: 「なるほど。勾配の断面図で、\x%l勾配図;#00ffc040;勾配図%l;#;か」
1985 = "「Ra là vậy. Bản đồ mặt cắt của độ dốc, nên gọi là \\x%l勾配図;#00ffc040;bản đồ độ dốc%l;#; sao.」"
# JP: 「なるほど、\x%l機関助士;#00ffc040;機関助士%l;#;候補か」
1987 = "「Ra là vậy, ứng cử viên \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; sao.」"
# JP: 「くっ――そっ！」
2016 = "「Chết——tiệt!」"
# JP: 「口先だけではない。\nあれは、相当に鍛え込んでいる」
2017 = "「Không phải chỉ nói suông đâu.\\nĐứa trẻ đó đã rèn luyện rất nhiều đấy.」"
# JP: 「くそっ！」
2020 = "「Chết tiệt!」"
# JP: 「デカブツたい！　もうちょっとのとこで倒せそうたい」
2022 = "「Một tên khổng lồ! Chỉ một chút nữa thôi là em có thể hạ gục được rồi.」"
# JP: 「ひあっ！？　ひあああっ！？　エラいことばいっ！！」
2023 = "「Hia!? Hiaaa!? Chuyện lớn rồi!!」"
# JP: 「ひゃうっ！？　これ、あのっ――もっと、鼻血っ」
2025 = "「Hya!? Thế này, cái đó——máu mũi, lại càng.」"
# JP: 「ふ～～っ」
2028 = "「Phù~~Ư」"
# JP: 「う、ウチっ！　この木ばどけるばいっ！！」
2029 = "「E, em! Em sẽ dọn cái cây này ra!!」"
# JP: 「わ、いいな凪ちゃん」
2031 = "「Oa, thích thật đấy bé Nagi.」"
# JP: 「は……ふぁ……やっぱり、ふたりって、そういう～」
2033 = "「Hả…… phà…… quả nhiên, hai người, là mối quan hệ như thế~」"
# JP: 「えええ――この辺で――んしょっ――\nわたし――んっ――結構――げん、かいっ――かもっ」
2037 = "「Êêê——Cỡ này——hây dô——\\nChị——ưm——chắc cũng——đến giới, hạn——rồi.」"
# JP: 「ふぇぇぇええっ！？　だいじょうぶっ！　\n大丈夫っ！　です」
2038 = "「Phuêêêêê!? Không sao đâu! Không sao đâu! Ạ.」"
# JP: 「ひえっ！！？」
2040 = "「Hí!!?」"
# JP: 「ああ」
