2295 = "「Ra là vậy. Trong buồng lái thì vóc dáng nhỏ bé lại là một lợi thế nhỉ.\\nHừm——nếu như Nagi tỏ ra hứng thú.」"
# JP: 「そう……ですか。\nけれど、それでしたら安心です」
2296 = "「Vậy…… sao ạ.\\nNhưng mà, nếu là vậy thì em yên tâm rồi.」"
# JP: 「そうなのですか？\n双鉄様には出来ましたのに」
2297 = "「Vậy sao ạ?\\nNhưng ngài Soutetsu đã làm được đấy ạ.」"
# JP: 「はい、そうですね。れいなさんたちの\x%l勾配図;#00ffc040;勾配図%l;#;では、\nわたくしたちには、いささか大雑把にすぎますから」
2298 = "「Vâng, đúng vậy ạ. \\x%l勾配図;#00ffc040;Bản đồ độ dốc%l;#; của bé Reina và mọi người,\\nđối với chúng ta thì có hơi quá sơ sài.」"
# JP: 「はい、双鉄さまっ！」
2301 = "「Vâng, ngài Soutetsu!」"
# JP: 「終了です。お疲れ様でした、双鉄様」
2302 = "「Kết thúc rồi ạ. Ngài đã vất vả rồi, ngài Soutetsu.」"
# JP: 「お怪我は、お怪我はないですか！？\nお怪我をなさったお客様はいませんか」
2304 = "「Có ai bị thương, có ai bị thương không!?\\nCó hành khách nào bị thương không ạ.」"
# JP: 「やっぱり……そういう……ふたり、そういう――」
2312 = "「Quả nhiên…… hai người…… là mối quan hệ như thế——」"
# JP: 「倒れるぞっ！　来いっ！！！！」
2318 = "「Cây đổ đấy! Lại đây!!!!」"
# JP: 「奥正面が一番薄く、手前が厚く――\n良い石炭の敷き方ですね、基本どおりです」
2327 = "「Mặt trong cùng mỏng nhất, phía trước thì dày——\\nCách rải than rất tốt, đúng theo cơ bản đấy ạ.」"
# JP: 「さっきよりは遥かに良くなっています。\n１００点満点中、２２点は差し上げられます」
2329 = "「Đã tốt hơn lúc nãy rất nhiều rồi ạ. Trên thang điểm 100, em có thể cho ngài 22 điểm.」"
# JP: 「『この記憶は事故と関係が深すぎる。\n思い出させては危ない』――などとな」
2330 = "「Kiểu như 『Ký ức này có liên quan quá sâu sắc đến vụ tai nạn.\\nĐể nhớ lại thì nguy hiểm lắm』――chẳng hạn.」"
# JP: 「望むところだ。\n厳しい指導は、よりよい成長に繋がろうから」
2333 = "「Tôi đang mong thế đây. Sự chỉ bảo nghiêm khắc sẽ dẫn đến sự trưởng thành tốt hơn mà.」"
# JP: 「悩むことはない。文字通りだろう」
2334 = "「Không có gì phải phiền não cả. Chỉ là đúng như nghĩa đen thôi.」"
# JP: 「そうだ。知性や……理性すら本当は制御しがたいものだ。\n僕にとっても――恐らくは、ハチロク、お前にとっても」
2335 = "「Đúng vậy. Trí tuệ hay…… ngay cả lý trí thực chất cũng rất khó kiểm soát. Đối với tôi——và có lẽ, đối với cả em nữa, Hachiroku.」"
# JP: 「はい。小さく薄いお体ですし」
2336 = "「Vâng. Cơ thể cô ấy lại nhỏ nhắn và mỏng manh nữa.」"
# JP: 「はい。初めてで、しかもあの小柄さであそこまでとは」
2337 = "「Vâng. Mới lần đầu, lại với vóc dáng nhỏ bé như vậy mà làm được đến thế.」"
# JP: 「構わん。\nどうせこの図は、僕たち専用となるのだろう？」
2338 = "「Không sao.\\nDù gì thì bản đồ này cũng chỉ dành riêng cho chúng ta thôi mà?」"
# JP: 「大丈夫だ。ハチロク。任せておけ」
2339 = "「Không sao đâu. Hachiroku. Cứ giao cho tôi.」"
# JP: 「湯あたりか？　それはいかんな」
2347 = "「Say nước nóng à? Thế thì không ổn rồi.」"
# JP: 「のぼせた……う～～っ、かなり、\nのぼせて、アテられたかも～」
2349 = "「Ngâm nóng quá…… ư~~, chắc là, bị ngâm nóng quá nên choáng váng luôn rồi~」"
# JP: 「体は洗い終わったのか？」
2354 = "「Tắm rửa xong hết rồi à?」"
# JP: 「ふかみはどうする？\nそれなりに時間がかかってしまうが」
2356 = "「Fukami tính sao?\\nCũng sẽ mất kha khá thời gian đấy.」"
# JP: 「ふかみ？」
2357 = "「Fukami?」"
# JP: 「それを確かめてみるためにも。\n早く、試運転ができるようになればいいな」
2359 = "「Cũng là để kiểm chứng điều đó.\\nGiá mà chúng ta có thể nhanh chóng chạy thử thì tốt biết mấy.」"
# JP: 「なんでばい！　この格好でも動けるばいっ」
2360 = "「Tại sao chứ! Mặc thế này em vẫn cử động được mà.」"
# JP: 「そんなことっ――\nああ、もう、こんなになるまで」
2361 = "「Chuyện đó thì nhằm nhò gì——\\nTrời ơi, thật tình, sao lại đến nông nỗi này.」"
# JP: 「構わん。元より汚れているし、\n送り届けたあとは登呂流湯に直行だからな」
2362 = "「Không sao. Vốn dĩ anh đã bẩn sẵn rồi,\\nsau khi đưa em về, anh sẽ đi thẳng đến nhà tắm Tororyu-yu mà.」"
# JP: 「それは徒歩でも、\x%lキハ07;#00ffc040;キハ07%l;#;に乗せてもらってでも構わん」
2366 = "「Chuyện đó đi bộ cũng được, hay đi nhờ \\x%lキハ07;#00ffc040;KiHa 07%l;#; cũng chẳng sao.」"
# JP: 「で、これが\x%l投炭;#00ffc040;投炭%l;#;練習機」
2370 = "「Còn đây là máy tập \\x%l投炭;#00ffc040;xúc than%l;#;.」"
# JP: 「特訓？」
2372 = "「Đặc huấn?」"
# JP: 「スコップで石炭をすくい、逆の手で鎖を引き戸を開け、\n入れると同時にスコップを伏せ、石炭を床に叩きつける」
2374 = "「Dùng xẻng xúc than, tay kia kéo xích mở cửa,\\nvừa đưa vào thì đồng thời úp xẻng xuống, đập than xuống sàn.」"
# JP: 「もっちろん！　いくらでん見てよかばいっ！」
2376 = "「Tất nhiên rồi! Anh muốn xem bao nhiêu cũng được!」"
# JP: 「そんなの当然、この木ばい！」
2377 = "「Đương nhiên là cái cây này rồi!」"
# JP: 「よろしいですよ。それでは凪様、\n\x%l投炭;#00ffc040;投炭%l;#;について簡単に説明させていただきます」
2378 = "「Được thôi ạ. Vậy thì cô Nagi,\\nem xin phép giải thích ngắn gọn về việc \\x%l投炭;#00ffc040;xúc than%l;#; nhé.」"
# JP: 「もちろん、僕も付き合おう」
2380 = "「Tất nhiên rồi, tôi sẽ đi cùng em.」"
# JP: 「登呂流湯だけは例外だ。\nあそこは、女湯を貸し切りにして入らせてくれる」
2383 = "「Nhà tắm Tororyu-yu là ngoại lệ.\\nỞ đó, họ cho phép anh bao trọn phòng tắm nữ để tắm.」"
# JP: 「登呂流湯？　さっきにーさん、\n石炭汚れは銭湯もいやがるゆーてなかったと？」
2384 = "「Nhà tắm Tororyu-yu? Lúc nãy anh hai bảo,\\nnhà tắm công cộng cũng ghét vết bẩn than đá mà?」"
# JP: 「１００点満点中９２点。合格です、双鉄様」
2390 = "「92 trên thang điểm 100. Đạt yêu cầu rồi ạ, ngài Soutetsu.」"
# JP: 「確かに、人間にでしたらありそうな話ですが――\nそれが、物であるわたくしにも」
2392 = "「Quả thực, nếu là con người thì có thể sẽ có chuyện đó——\\nNhưng điều đó, lại xảy ra với một đồ vật như em sao.」"
# JP: 「面白そうばい！　やらせてばいっ！！」
2395 = "「Trông thú vị quá! Cho em làm thử với!!」"
# JP: 「こっちはすごく面白そうばい！\nなんだか修行に役立ちそうばい！」
2396 = "「Cái này trông thú vị cực kỳ!\\nCó vẻ như sẽ giúp ích cho việc tu hành đấy!」"
# JP: 「わかったばい！」
2398 = "「Rõ rồi!」"
# JP: 「わかったばい！　一キロのスコップで百杯なら、\n百キロの石炭投げ込むばいね！」
2399 = "「Hiểu rồi! Nếu xúc 100 xẻng bằng cái xẻng 1 ký,\\nthì tức là ném vào 100 ký than đúng không!」"
# JP: 「処理するべきを処理しおえたら、\n帰りは、\x%lエアクラ;#00ffc040;エアクラ%l;#;に乗っていこう」
2407 = "「Sau khi xử lý xong những việc cần xử lý,\\nlúc về, chúng ta hãy đi bằng \\x%lエアクラ;#00ffc040;Aircra%l;#; nhé.」"
# JP: 「やっと……半分、こえた――ばーいっ」
2412 = "「Cuối cùng…… cũng qua được, một nửa——rồi.」"
# JP: 「大したものだ。\nこんなになるまで、本当によく頑張った」
2418 = "「Giỏi lắm.\\nĐến mức này thì, em thực sự đã rất cố gắng rồi.」"
# JP: 「シャツを脱いで、\x%l列車;#00ffc040;列車%l;#;に大きく振って合図を！」
2419 = "「Hãy cởi áo sơ mi ra, vẫy thật mạnh để ra hiệu cho \\x%l列車;#00ffc040;đoàn tàu%l;#;!」"
# JP: 「はぁっ――はあっ――はあっ――はあっ――\nこれ、で――どう――ばいっ！」
2431 = "「Hà——hà——hà——hà——\\nThế này, thì——sao——hả!」"
# JP: 「は……ふぇ？」
2432 = "「Hả…… phuê?」"
# JP: 「飛行不能区域外まで、\nまた徒歩で出るということですか？」
2433 = "「Chúng ta lại phải đi bộ,\\nra ngoài khu vực cấm bay sao ạ?」"
# JP: 「なければいいな、湯医まで」
2436 = "「Đến Yunoi mà không có thì tốt nhỉ.」"
# JP: 「\x%l投炭;#00ffc040;投炭%l;#;練習を見ていくということか？\nそれとも、ふかみもチャレンジ」
2437 = "「Nghĩa là em sẽ ở lại xem tập \\x%l投炭;#00ffc040;xúc than%l;#; sao?\\nHay là, Fukami cũng muốn thử thách.」"
# JP: 「木を切るのなら、今どき斧も無かろう――がっ！？」
2442 = "「Nếu là chặt cây thì thời đại này làm gì còn dùng rìu nữa——hả!?」"
# JP: 「服と肌とが石炭汚れにまみれること。\n一時間程度かかることも、きちんと伝えるんだぞ」
2443 = "「Nhớ nói rõ là quần áo và da dẻ sẽ bị bẩn lem luốc vì than đá.\\nVà cũng mất khoảng một tiếng đồng hồ đấy nhé.」"
# JP: 「約束通り、送り届けよう」
2444 = "「Như đã hứa, anh sẽ đưa em về.」"
# JP: 「そ、そんなに、見つめ、られちゃうと――\nわたし、わたし――やばい、です。はうっ」
2445 = "「B, bị anh, nhìn chằm chằm, như thế——\\nem, em——tiêu mất, ạ. Hau.」"
# JP: 「泣かないでください、双鉄様。やったのですから！\nわたくしたちは、事故を未然に防いだのですから」
2446 = "「Xin ngài đừng khóc, ngài Soutetsu. Chúng ta đã làm được rồi mà!\\nChúng ta đã ngăn chặn được tai nạn trước khi nó xảy ra rồi mà.」"
# JP: 「こちらへ回って、\n仕上がりをご自分でお確かめください」
2447 = "「Xin hãy qua bên này,\\nvà tự mình kiểm tra thành quả đi ạ.」"
# JP: 「おまかせください。双鉄様」
2448 = "「Xin cứ giao cho em. Ngài Soutetsu.」"
# JP: 「はじめてください」
2449 = "「Xin hãy bắt đầu đi ạ.」"
# JP: 「それもありますし――\x%lブレーキ;#00ffc040;ブレーキ%l;#;性能などもきっと、\n\x%l8620;#00ffc040;8620%l;#;より大幅に向上しているのでしょう」
2473 = "「Cũng có lý do đó nữa——và hiệu suất \\x%lブレーキ;#00ffc040;phanh%l;#; chắc chắn cũng\\nđã được cải thiện đáng kể so với \\x%l8620;#00ffc040;8620%l;#; rồi ạ.」"
# JP: 「それ何ばい？」
2475 = "「Cái đó là gì vậy?」"
# JP: 「冗談ではないっ！」
2476 = "「Không phải trò đùa đâu!」"
# JP: 「変な名前ばい」
2477 = "「Cái tên nghe kỳ cục quá.」"
# JP: 「これはワンスコ。\n石炭を投げ込むためのスコップだ」
2478 = "「Đây là wansuko.\\nLà cái xẻng dùng để xúc than vào lò.」"
# JP: 「石炭が燃えるためには、吸気と排気とが必要。よって、\n燃焼中の釜の中は、ある種の吹き抜けとなるからだ」
2479 = "「Để than cháy được thì cần có khí nạp và khí thải. Do đó,\\nbên trong lò khi đang cháy sẽ trở thành một loại thông gió.」"
# JP: 「もちろんですとも、双鉄様」
2480 = "「Tất nhiên rồi ạ, ngài Soutetsu.」"
# JP: 「そうか、ここから湯医まで。\nなんだかんだで、未だ乗ってはいなかったのだな」
2481 = "「Ra là vậy, từ đây đến Yunoi. Tính ra thì, chúng ta vẫn chưa đi chuyến nào nhỉ.」"
# JP: 「ほう」
2482 = "「Ra vậy.」"
# JP: 「このあたりは……不時着のときに来た場所ですね」
2483 = "「Khu vực này là…… nơi chúng ta đã đến lúc hạ cánh khẩn cấp nhỉ.」"
# JP: 「あと一分」
2484 = "「Còn một phút nữa.」"
# JP: 「それも丁度いい修行ばい！\nひらりとかわしてみせるばいっ！！」
2486 = "「Thế thì lại càng hợp để tu hành!\\nEm sẽ né tránh một cách nhẹ nhàng cho xem!!」"
# JP: 「では今度、体操着でも着てきたときにやるといい」
2493 = "「Vậy để lần sau, khi nào em mặc đồ thể dục đến thì hẵng làm.」"
# JP: 「ええと、凪ちゃんのおじいさん――\nすごく、凪ちゃんに甘い、です。だから」
2494 = "「À thì, ông của bé Nagi——\\nrất là, chiều chuộng bé Nagi, ạ. Nên là.」"
# JP: 「あの……双鉄おにいさん」
2495 = "「Dạ…… anh Soutetsu.」"
# JP: 「あの、こんばんわ。です。わたし――えと、\nポーレットさんと、その、相談、あって」
2496 = "「Dạ, chào buổi tối. Ạ. Em——ừm,\\ncó chuyện, muốn bàn bạc với chị Paulette.」"
# JP: 「ならば、ハチロク。頼めるか」
2498 = "「Nếu vậy thì, Hachiroku. Nhờ em được không.」"
# JP: 「ならオッケーばい！　服が汚れてもオッケーばい！\n帰り、夜中でもオッケーばい！！」
2499 = "「Vậy là ok rồi! Quần áo bẩn cũng ok!\\nLúc về, có là nửa đêm cũng ok luôn!!」"
# JP: 「ならば無理には誘うまい。\nともかく、怪我だけはせぬようにな」
2501 = "「Nếu vậy thì anh không ép đâu.\\nNói chung là, nhớ cẩn thận đừng để bị thương nhé.」"
# JP: 「あそこの主人は鉄道に大変に理解があるのだ。が、\n広い男湯を汚されてしまってはかなわんとのことでな」
2503 = "「Bà chủ ở đó rất thấu hiểu cho ngành đường sắt. Nhưng mà,\\nbà ấy bảo nếu làm bẩn phòng tắm nam rộng lớn thì phiền lắm.」"
# JP: 「でしたら、そのうちの一つとして。\nわたくし、\x%l勾配図;#00ffc040;[こうばいず,2]勾配図%l;#;を作成いたしたく思います」
2505 = "「Nếu vậy, như một trong số những việc đó.\\nEm muốn tiến hành lập \\x%l勾配図;#00ffc040;bản đồ độ dốc%l;#; ạ.」"
# JP: 「それから、ふかみは――」
2507 = "「Còn Fukami thì——」"
# JP: 「悪いのはウチばい！\nウチが、考えなしだったせいばいっ」
2508 = "「Người có lỗi là em!\\nLà do em, đã không suy nghĩ thấu đáo.」"
# JP: 「お前ならどんな格好でも動けるだろうが――\nほれ」
2510 = "「Nếu là em thì mặc kiểu gì chẳng cử động được——\\nĐây này.」"
# JP: 「“そのとき”を迎えるためには、\nまだまだ無数に、こなすべきことがありますけれど」
2511 = "「Để đón chờ \"lúc đó\",\\nchúng ta vẫn còn vô số việc phải hoàn thành.」"
# JP: 「１００キロ\x%l投炭;#00ffc040;投炭%l;#;とはいえ、連続で３セットですからね。\n……わたくし、最後は\x%l機関助士;#00ffc040;機関助士%l;#;候補と見ておりました」
2512 = "「Tuy chỉ là \\x%l投炭;#00ffc040;xúc than%l;#; 100 ký, nhưng lại làm liên tục 3 set cơ mà. ……Đến cuối cùng, em đã xem em ấy như một ứng cử viên cho vị trí \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; rồi đấy ạ.」"
# JP: 「ああ、頼む――と言いたいところではあるが、\n今日のところは僕より凪にしてやってくれ」
2514 = "「À, nhờ em——tôi rất muốn nói vậy, nhưng hôm nay em hãy làm cho Nagi thay vì tôi đi.」"
# JP: 「それは当然のことです。\nと、申しますか――」
2515 = "「Đó là điều đương nhiên ạ.\\nNói sao nhỉ——」"
# JP: 「急勾配を得意とする\x%l蒸気機関車;#00ffc040;蒸気機関車%l;#;などおりません。\nが――その中でも、やはり不得意な部類でしょうね」
2516 = "「Chẳng có \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; nào lại giỏi leo dốc cao cả đâu ạ.\\nNhưng mà——trong số đó, thì chắc cũng thuộc nhóm không giỏi lắm thật.」"
# JP: 「双鉄様――それをいうなら、\nわたくしは、物以外の何者でもありません」
2518 = "「Ngài Soutetsu——nếu ngài nói vậy thì,\\nem cũng không là gì khác ngoài một đồ vật cả.」"
# JP: 「双鉄様。お体をお揉みいたします」
2519 = "「Ngài Soutetsu. Em sẽ xoa bóp cơ thể cho ngài.」"
# JP: 「双鉄様が考えて、与えてくださるご指示こそが、\nそのまま、わたくしの求める答えなのです」
2520 = "「Chính những chỉ thị mà ngài Soutetsu đã suy nghĩ và đưa ra,\\nđó mới là câu trả lời mà em đang tìm kiếm.」"
# JP: 「双鉄様！」
2521 = "「Ngài Soutetsu!」"
# JP: 「双鉄様っ！！！」
2522 = "「Ngài Soutetsu!!!」"
# JP: 「双鉄様。わたくし、失念してしまったのですが――\n何故、\x%l火床;#00ffc040;[かしょう,1]火床%l;#;の手前を厚く、奥を薄くとするのでしたか？」
2523 = "「Ngài Soutetsu. Em vô tình quên mất rồi——\\nTại sao lại phải rải than ở \\x%l火床;#00ffc040;buồng lửa%l;#; phía trước dày, phía trong mỏng vậy ạ?」"
# JP: 「と、いうことでしたら、双鉄様。\nこの状態の方がよりよいのでは？」
2525 = "「Nếu là như vậy, ngài Soutetsu.\\nChẳng phải trạng thái này sẽ tốt hơn sao?」"
# JP: 「双鉄様、線路上に下ろしてください」
2526 = "「Ngài Soutetsu, xin hãy đặt em xuống đường ray.」"
# JP: 「初めてでそんなんよーできんばい！」
2528 = "「Mới lần đầu sao mà làm được như thế chứ!」"
# JP: 「まっくろばい！　なにやってそぎゃんと汚れとーと！」
2532 = "「Đen thui luôn kìa! Anh làm gì mà bẩn dữ vậy!」"
# JP: 「っ！」
2533 = "「Ư!」"
# JP: 「っ！！」
2534 = "「Ư!!」"
# JP: 「っ！！！！！」
2535 = "「Ư!!!!!」"
# JP: 「1.6の123.09。ここまでの\x%l勾配距離;#00ffc040;勾配距離%l;#;が149.23で、\n\x%lレール種別;#00ffc040;レール種別%l;#;は変化なし――と」
2538 = "「1.6 và 123.09. \\x%l勾配距離;#00ffc040;Chiều dài đoạn dốc%l;#; đến đây là 149.23, \\x%lレール種別;#00ffc040;loại ray%l;#; không đổi——xong.」"
# JP: 「２２っ！？　たったそれだけとっ！？」
2545 = "「22 á!? Chỉ được chừng đó thôi sao!?」"
# JP: 左右に、初めは少しだけ。\nそうしてすぐさま線路側へと、軋みをあげて傾きを増す！
2686 = "Lúc đầu chỉ nghiêng sang hai bên một chút.\\nNhưng rồi ngay lập tức, nó phát ra tiếng răng rắc và ngày càng nghiêng hẳn về phía đường ray!"
# JP: これはいかん。\n体を支え、とにもかくにも顔を上へとあげさせる。
2690 = "Không ổn rồi.\\nTôi vội đỡ lấy cơ thể em ấy, trước mắt cứ phải cho em ấy ngẩng mặt lên đã."
# JP: 怖いのか、安堵したのか、喜んでるのか……\n多分すべてが同時に混じり、いささか混乱しているのだ。
2692 = "Là sợ hãi, là an tâm, hay là đang vui sướng……\\nCó lẽ tất cả cùng lúc đan xen, khiến tôi có chút hỗn loạn."
# JP: が――凪はまったく、怯む気配すら見せない。
2696 = "Nhưng——Nagi hoàn toàn không có vẻ gì là chùn bước."
# JP: が、凪の教育より先に、\n今は為すべきことがあるっ！！
2697 = "Nhưng mà, trước khi dạy dỗ Nagi,\\nbây giờ có việc phải làm ngay lập tức!!"
# JP: かといって、僕に足せるような事は無い。\n過去にはなにもしてやれないし――
2698 = "Nói là vậy, nhưng tôi cũng chẳng thể làm gì thêm.\\nTôi chẳng thể can thiệp gì vào quá khứ cả——"
# JP: 赤井宮司にいただいたご助言に従って、\n今日にでも、登呂流湯に行っておくべきだろう。
2707 = "Theo lời khuyên của Đền chủ Akai, có lẽ ngay trong hôm nay, tôi nên đến nhà tắm Tororyu-yu."
# JP: 大声と同時に凪が、それをたしなめながらふかみが、\n\x%l投炭;#00ffc040;投炭%l;#;練習場へと入り込んでくる。
2712 = "Cùng lúc với tiếng hét lớn của Nagi, Fukami vừa khuyên can\\nvừa bước vào bãi tập \\x%l投炭;#00ffc040;xúc than%l;#;."
# JP: が、顔をふかれる凪はいかにも、\n心地よさげに目を細めている。
2715 = "Thế nhưng, Nagi được lau mặt\\nlại nheo mắt lại với vẻ vô cùng dễ chịu."
# JP: その\x%l勾配図;#00ffc040;勾配図%l;#;を作るついでに、\n\x%l機関助士;#00ffc040;機関助士%l;#;の話をしてみても悪くなかろう。
2721 = "Nhân tiện lúc làm \\x%l勾配図;#00ffc040;bản đồ độ dốc%l;#; đó,\\nthử nói chuyện về vị trí \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; xem sao cũng không tệ."
# JP: ため息のようなその“ああ”は、\n感心したようにも呆れたようにも聞こえる。
2734 = "Tiếng \"À\" nghe như một tiếng thở dài đó,\\nvừa giống như đang thán phục, lại vừa giống như đang cạn lời."
# JP: 言いながら、\nハチロクは手にした小スコップを巧みに操る。
2736 = "Vừa nói,\\nHachiroku vừa điêu luyện thao tác chiếc xẻng nhỏ trên tay."
# JP: ハチロクは嫌がりもせず、\n僕に頭をあずけてくる。
2737 = "Hachiroku không hề tỏ ra khó chịu,\\nmà còn tựa đầu vào tay tôi."
# JP: また線路へと顔をつけ、\nハチロクが勾配を数値化していく。
2740 = "Hachiroku lại áp mặt xuống đường ray,\\nvà bắt đầu chuyển đổi độ dốc thành những con số."
# JP: 跳ね上げ扉の向こうでは、ハチロクが床を確認している。\n床の上、石炭は黒く隙間なく、マスの全てを埋めている。
2742 = "Phía bên kia cánh cửa lật, Hachiroku đang kiểm tra mặt sàn.\\nTrên sàn, than đen phủ kín không một khe hở, lấp đầy toàn bộ các ô."
# JP: 転がるように、\n小さな小さなハチロクが僕へとまっすぐ駆けてくる。
2744 = "Hachiroku nhỏ xíu, bé tẹo\\nchạy thẳng về phía tôi như thể lăn lông lốc."
# JP: ハチロクが、僕へとまっすぐ手を伸ばす。
2746 = "Hachiroku, vươn tay thẳng về phía tôi."
# JP: 大きくうなずき、\nそのはずみで、ハチロクの顔がいくらか、湯船の中を揺らす。
2749 = "Cô ấy gật đầu thật mạnh,\\ntheo đà đó, khuôn mặt của Hachiroku tạo ra vài gợn sóng trong bồn tắm."
# JP: ハチロクの手は、いつもと同じ強さと熱さだ、\n動揺を、しているようには感じられない。
2752 = "Đôi tay của Hachiroku vẫn mang sức mạnh và độ ấm như mọi khi,\\ntôi không hề cảm thấy cô ấy đang có chút dao động nào."
# JP: プライドと不安とが入り混じる声。\nだから、ハチロクの頭を撫でる。
2753 = "Giọng nói lẫn lộn giữa niềm tự hào và sự bất an.\\nVì vậy, tôi xoa đầu Hachiroku."
# JP: ハチロクの目は凪とふかみとを見送って、\nそれからまっすぐ、僕へと戻る。
2755 = "Ánh mắt Hachiroku dõi theo Nagi và Fukami,\\nrồi lại hướng thẳng về phía tôi."
# JP: ハチロクの足がぴたりと止まる。\n試すような目が僕を見る。
2757 = "Bước chân của Hachiroku đột ngột dừng lại.\\nÁnh mắt mang vẻ dò xét nhìn tôi."
# JP: ごくごく自然に、僕の方へとハチロクが腕を伸ばしてくる。\nそのまま抱き上げ、左手をハチロクの椅子にする。
2758 = "Hachiroku vươn tay về phía tôi một cách vô cùng tự nhiên.\\nTôi cứ thế bế cô ấy lên, lấy tay trái làm ghế ngồi cho Hachiroku."
# JP: ハチロクの驚愕の声。\nさすがに耳に届いたらしく、凪がこちらへゆっくりと向く。
2760 = "Giọng nói đầy kinh ngạc của Hachiroku.\\nChắc hẳn đã lọt vào tai, Nagi từ từ quay về phía chúng tôi."
# JP: するりと、ハチロクが僕の手をほどき地面に落ちる。\n意図を察してくれている。
2761 = "Hachiroku tuột khỏi tay tôi và đáp xuống đất một cách mượt mà.\\nCô ấy đã nhận ra ý định của tôi."
# JP: 声と同時にワンスコが、\n握力の消えた指から勝手に抜け落ちていく。
2762 = "Cùng lúc với giọng nói đó,\\nchiếc xẻng wansuko tự động tuột khỏi những ngón tay đã mất hết lực nắm."
# JP: 速く、遠くへ、できるだけ――\n倒木から少しでも距離をとるためっ――
2770 = "Nhanh hơn, xa hơn, hết mức có thể——\\nĐể cách xa cái cây đổ ra thêm một chút nữa——"
# JP: 無茶苦茶なことを言いながら、\nワンスコを取ろうとしがみついてくる。
2792 = "Vừa nói những lời vô lý,\\nem ấy vừa bám lấy tôi đòi lấy chiếc xẻng wansuko."
# JP: 凪が心底、驚いている。\n呆気にとられ、[たまげ,1]魂消ている。
2795 = "Nagi thực sự đang vô cùng kinh ngạc.\\nEm ấy sững sờ, hồn bay phách lạc."
# JP: 凪が必死に木に取り付くが、全長があまりに長すぎる。\n多少動かすことが出来ても、とても全ては除去しきれない。
2796 = "Nagi liều mạng bám lấy cái cây, nhưng chiều dài của nó quá lớn.\\nDù có xê dịch được đôi chút, thì cũng không thể nào dọn sạch hoàn toàn được."
# JP: 凪がふかみに手をのばす。\n体温を計りたいのか、首筋にぴたり手を当てる。
2799 = "Nagi vươn tay về phía Fukami.\\nNhư muốn đo thân nhiệt, em ấy áp sát tay vào cổ Fukami."
# JP: 凪が近い。\n僕の手元に、息がかかるほど近づき熱心に覗きこんでいる。
2800 = "Nagi đang ở rất gần.\\nĐến mức hơi thở phả vào tay tôi, em ấy đang say sưa nhìn chằm chằm."
# JP: すぐさま凪もその後を追う。\n波立ちまくった湯船が程無く、静かに収まる。
2804 = "Nagi cũng lập tức đuổi theo sau.\\nBồn tắm đang nổi sóng cuồn cuộn chẳng mấy chốc đã trở lại tĩnh lặng."
# JP: 鼓動を呼吸を乱せばその分、速度が落ちる。\n事故の危険を増させてしま――っ！！？
2810 = "Nếu để nhịp tim và nhịp thở rối loạn, tốc độ sẽ giảm đi tương ứng. Sẽ làm tăng nguy cơ xảy ra tai nạn mất——Ư!!?"
# JP: 足、腰、腕、そして背中を酷使することは間違いない。\n言われてみれば、剣術修行にも役立つようにも思える。
2811 = "Việc phải dùng lực quá độ ở chân, eo, tay và cả lưng là điều chắc chắn.\\nNghe em ấy nói vậy, tôi cũng thấy có vẻ sẽ giúp ích cho việc tu hành kiếm thuật."
# JP: 苦笑に緩んだ顔がキリリと引き締まる。
2821 = "Khuôn mặt đang giãn ra vì cười khổ bỗng trở nên căng thẳng."
# JP: またかぶった。\nいかん。これでは堂々めぐりだ。
2823 = "Lại trùng nữa rồi.\\nKhông ổn. Cứ thế này thì sẽ luẩn quẩn mất."
# JP: 跳ね上げ扉を開けばそこから、\n猛烈な勢いで新鮮な空気が釜の中へと雪崩れ込む。
2829 = "Khi mở cánh cửa lật ra, từ đó,\\nkhông khí trong lành sẽ tràn vào trong lò với thế mãnh liệt."
# JP: 鼻息が荒い。\nよほど手強い相手なのだろう。
2830 = "Thở hồng hộc.\\nChắc hẳn đó là một đối thủ rất đáng gờm."
# JP: おっと、タイミングがかぶってしまった。\n僕の話は、夜までにすれば構わぬことだし――
2835 = "Ây da, lại trùng thời điểm mất rồi.\\nChuyện của tôi thì để đến tối nói cũng chẳng sao——"
# JP: その不安定な状態で、過去に縛られ苦しめられて……\nそれを“考えすぎ”と切り捨てるのは、言葉不足だ。
2838 = "Trong trạng thái bất ổn đó, cô ấy bị quá khứ trói buộc và hành hạ……\\nNếu chỉ dùng một câu \"suy nghĩ quá nhiều\" để gạt bỏ điều đó, thì thật là thiếu sót."
# JP: ごく単純な喜びが、スカスカになった体を埋めんばかりの\n達成感が、腹の底から沸き起こってくる。
2839 = "Một niềm vui hết sức giản đơn, cùng cảm giác thành tựu\\nnhư lấp đầy cơ thể trống rỗng, trào dâng từ tận đáy lòng."
# JP: 練習と同じく投げ込めば、実際の釜の\x%l火床;#00ffc040;火床%l;#;においては、\n空気の流れが石炭を、まんべんなく散りばめてくれるのだ。
2843 = "Nếu xúc vào giống hệt như lúc tập luyện, thì ở \\x%l火床;#00ffc040;buồng lửa%l;#; của lò thực tế,\\nluồng không khí sẽ giúp phân tán than ra đều khắp nơi."
# JP: 広い湯船の反対側の端で、\nふかみが凪を、熱心にもみほぐしてやっている。
2845 = "Ở phía đầu bên kia của bồn tắm rộng lớn,\\nFukami đang nhiệt tình xoa bóp cho Nagi."
# JP: 雨が、ぼとぼと、倒れた僕の顔の上へと降り注ぐ。
2857 = "Những giọt mưa, lộp bộp, trút xuống khuôn mặt của tôi khi tôi đang ngã lăn ra."
# JP: 全身が、ゆでダコのように赤くなっている。\n一刻も早く、湯から出してやった方が良かろう。
2858 = "Toàn thân em ấy đỏ rực như con bạch tuộc luộc.\\nTốt nhất là nên đưa em ấy ra khỏi bồn tắm càng sớm càng tốt."
# JP: “平常の”という一言が、耳に気持ちに引っかかる。
2861 = "Từ \"lúc bình thường\" cứ vướng bận trong tai, trong tâm trí tôi."
# JP: 真面目な顔でそこまで言って、\nハチロクはハっと何かに気付いたように苦笑する。
2862 = "Nói đến đó với vẻ mặt nghiêm túc,\\nHachiroku bỗng giật mình như nhận ra điều gì đó rồi cười khổ."
# JP: 凪の正面には巨大な老木。\nそして、右手には樫の木刀。
2865 = "Trước mặt Nagi là một cây cổ thụ khổng lồ.\\nVà trên tay phải, là một thanh mộc kiếm bằng gỗ sồi."
# JP: 誇らしげな声。\nハチロクは胸を張っている。
2867 = "Giọng nói đầy tự hào.\\nHachiroku ưỡn ngực kiêu hãnh."
# JP: 様子がおかしい。\n言葉が、まるでうわごとだ。
2869 = "Dáng vẻ em ấy lạ lắm.\\nLời nói nghe cứ như đang mê sảng vậy."
# JP: 歓喜に満ちた涙声。
2871 = "Giọng nói đẫm nước mắt ngập tràn niềm vui sướng."
# JP: 声には色濃い安堵。\nならば、理由はひとつだろう。
2873 = "Giọng nói mang đậm vẻ an tâm.\\nNếu vậy, lý do chắc chỉ có một."
# JP: 真っ赤になって目が泳いでいる。\n呼吸は荒らぎ、せわしない。
2875 = "Mặt em ấy đỏ bừng, ánh mắt đảo liên tục.\\nHơi thở gấp gáp, dồn dập."
# JP: ハチロクは小さく頷いて、\nそれからまっすぐ、僕を見上げる。
2876 = "Hachiroku khẽ gật đầu,\\nrồi ngước nhìn thẳng vào tôi."
# JP: 至極真面目に、僕にしたのと同じ説明を、\nより噛み砕いた表現をもって凪へと行う。
2878 = "Cô ấy giải thích cho Nagi một cách cực kỳ nghiêm túc,\\ngiống hệt như đã giải thích với tôi nhưng bằng những từ ngữ dễ hiểu hơn."
# JP: 怖い。怖い怖い怖い怖い怖い怖い。\n\x%l脱線転覆;#00ffc040;脱線転覆%l;#;。その四文字が頭を体を埋め尽くす。
2880 = "Đáng sợ. Sợ quá sợ quá sợ quá sợ quá sợ quá sợ quá.\\n\\x%l脱線転覆;#00ffc040;Trật bánh lật tàu%l;#;. Bốn chữ đó lấp đầy tâm trí và cơ thể tôi."
# JP: 疾い！　まさしく火の出るような一撃だ。\nこの状況でないのなら、絶賛を僕も惜しまぬのだがっ！
2885 = "Nhanh quá! Quả thực là một đòn đánh như xẹt lửa.\\nNếu không phải trong hoàn cảnh này, tôi đã không tiếc lời khen ngợi rồi!"
# JP: 熱い雨。\x%l蒸気排水;#00ffc040;蒸気排水%l;#;――\nああ、ハチロクはまた泣いている。
2888 = "Một cơn mưa nóng hổi. \\x%l蒸気排水;#00ffc040;Xả nước ngưng hơi nước%l;#;——\\nÀ, Hachiroku lại khóc rồi."
# JP: 近い。ふかみがいつの間に。\n凪と並んで、僕らの方へと寄ってきている。
2890 = "Gần quá. Fukami từ lúc nào đã\\ncùng Nagi xích lại gần phía chúng tôi."
# JP: あそこにハチロクが入っていっても、\nかえって邪魔になるだけだろう。
2892 = "Hachiroku mà xen vào chỗ đó,\\nthì khéo lại thành kỳ đà cản mũi mất."
# JP: スコップの中の石炭を何も考えず投げ込んだなら、\n排気口――煙突に繋がる\x%l火床;#00ffc040;火床%l;#;の奥へと吸い集められる。
2896 = "Nếu cứ vô tư ném than trong xẻng vào,\\nchúng sẽ bị hút tụ lại phía trong \\x%l火床;#00ffc040;buồng lửa%l;#; nối với cửa xả——tức là ống khói."
# JP: 屏風絵か？　\nなんとも雅な――ある意味ハチロクらしくはあるが……
2899 = "Tranh bình phong sao?\\nThật là tao nhã——ở một khía cạnh nào đó thì đúng là phong cách của Hachiroku thật, nhưng……"
# JP: 掃除機のスイッチをいれれば、\n掃除機は、愚直に吸引を始めるはずだ。
2902 = "Giống như máy hút bụi, chỉ cần bật công tắc,\\nlà nó sẽ ngoan ngoãn bắt đầu hút."
# JP: 肉がスカスカになってしまって、\nその空隙に、湯がしみこんでいってるようだ。
2905 = "Da thịt như trống rỗng,\\nvà nước nóng đang thấm dần vào những khoảng không ấy."
# JP: ノズルの先に待つものが、\n例えその身を溶かしてしまう、濃硫酸であろうとも。
2906 = "Cho dù thứ chờ đợi trước vòi hút,\\ncó là axit sunfuric đặc sẽ làm tan chảy cả cơ thể nó đi chăng nữa."
# JP: 幸いなのは、怒号も、悲鳴もせぬことだ。\n血のあの臭いが、ほんのわずかも流れぬことだ。
2914 = "Điều may mắn là, không có tiếng la mắng, cũng chẳng có tiếng la hét thảm thiết.\\nVà mùi máu tươi đó, không hề thoảng qua dù chỉ một chút."
# JP: 人員、予算。\nボランティアや寄付に、これ以上の負担は求められない。
2920 = "Nhân sự, ngân sách.\\nKhông thể đòi hỏi thêm gánh nặng nào từ tình nguyện viên hay quyên góp nữa."
# JP: １セットから３セット、\nその全てで合格点を貰えたのは、これが初めてだ。
2921 = "Từ set 1 đến set 3,\\nđây là lần đầu tiên tôi đạt điểm đỗ cho tất cả các set."
# JP: 二番のマスからは一番に、四番のマスからは五番へと、\n半杯ずつほどの石炭を、掬って移し、じっと眺める。
2922 = "Từ ô số hai sang ô số một, từ ô số bốn sang ô số năm,\\ncô ấy xúc và chuyển khoảng nửa xẻng than, rồi đứng nhìn chằm chằm."
# JP: 確かに見ていた、問題を感じていたはずなのに、\n僕ら関係者全員が、見て見ぬふりで先延ばしていた。
2932 = "Rõ ràng là đã nhìn thấy, đã cảm nhận được vấn đề,\\nnhưng tất cả những người liên quan chúng tôi, lại nhắm mắt làm ngơ và trì hoãn nó."
# JP: 歩く。\n線路についた勾配が変化する次の地点まで。
2933 = "Bước đi.\\nCho đến điểm tiếp theo nơi độ dốc của đường ray thay đổi."
# JP: 言われた数字をメモにとり、\nハチロクを手に抱き、歩き始める。
2935 = "Tôi ghi lại những con số cô ấy đọc vào sổ tay,\\nrồi lại bế Hachiroku lên và tiếp tục bước đi."
# JP: 脱ぎ捨てたシャツを片手に走り始める。
2937 = "Tôi vội vàng cởi phăng chiếc áo sơ mi, cầm trên tay và bắt đầu chạy."
# JP: 23:00すぎの登呂流湯のことを説明すれば、どんどんと、\n凪の鼻息が荒くなり、ふかみの顔が赤くなっていく。
2939 = "Khi tôi giải thích về nhà tắm Tororyu-yu sau 23:00,\\nhơi thở của Nagi dần trở nên gấp gáp, còn mặt Fukami thì ngày càng đỏ lựng."
# JP: 赤井宮司に言われたことを思い出す。\n未来など、人にも物にも、誰にとっても手探りなのだと。
2941 = "Tôi nhớ lại những lời Đền chủ Akai đã nói. Tương lai, dù là con người hay đồ vật, dù là ai đi nữa cũng đều phải tự mình mò mẫm."
# JP: 理解した。\nこちらの方が、よほどハチロクらしくある。
2943 = "Tôi hiểu rồi.\\nCái này thì đúng là phong cách của Hachiroku hơn nhiều."
# JP: 長く、だらしない声が出てしまう。\n体が、それほどに疲労している。
2945 = "Một tiếng thở dài não nề buột ra khỏi miệng.\\nCơ thể tôi đã mệt mỏi đến nhường ấy."
# JP: 決して、それだけはしてはならぬと教わったこと。\n産まれてこの方、一度も破ったことの無い禁忌。
2947 = "Điều mà tôi đã được dạy là tuyệt đối không bao giờ được làm.\\nMột điều cấm kỵ mà từ khi sinh ra tôi chưa từng phá vỡ."
# JP: 線路にそっと\x%l運転体;#00ffc040;運転体%l;#;のハチロクを下ろしてやれば、\n小さな顔の右頬がぴたり、レールにくっつけられる。
2948 = "Tôi nhẹ nhàng đặt \\x%l運転体;#00ffc040;thân vận hành%l;#; của Hachiroku xuống đường ray, má phải trên khuôn mặt nhỏ nhắn của cô ấy áp sát vào thanh ray."
# JP: 言われた通りの数字をメモへと書き落とす。\nこの数字をもとに、あとでハチロクが作図するそうだ。
2952 = "Tôi ghi lại những con số đúng như cô ấy nói vào sổ tay.\\nDựa trên những con số này, lát nữa Hachiroku sẽ vẽ bản đồ."
# JP: 揉まれている腕を持ち上げ、\nハチロクの、濡れている髪に手櫛をかける。
2956 = "Tôi nhấc cánh tay đang được xoa bóp lên,\\ndùng tay luồn qua mái tóc ướt của Hachiroku như một chiếc lược."
# JP: それを、この手でかなぐり捨てる。\nハチロクの頬を平手打ちして、正気に戻れと呼びかける。
2957 = "Bằng chính đôi tay này, tôi đã gạt phăng nó đi.\\nTát một bạt tai vào má Hachiroku, gọi cô ấy tỉnh lại."
# JP: わかる。\n僕も同じであるから。
2959 = "Tôi hiểu.\\nBởi vì tôi cũng giống như vậy."
# JP: ハチロクの傷。僕自身の傷。\nそのかさぶたを剥がさぬようにと、言葉を探る。
2961 = "Vết thương của Hachiroku. Vết thương của chính tôi.\\nTôi thận trọng tìm kiếm từ ngữ, để không bóc lớp vảy của chúng ra."
# JP: その手を取って立ち上がり、\nともかくポーレットのところに向かう。
2963 = "Tôi nắm lấy tay cô ấy đứng dậy,\\nvà tiến về phía Paulette."
# JP: アホウ！　と、\n蓑笠老人が凪の頭を叩く気持ちがよくわかる。
2965 = "Đồ ngốc! \\nGiờ thì tôi đã rất hiểu cảm giác của ông lão Minokasa mỗi khi gõ đầu Nagi rồi."
# JP: ぐい、と指先で自分の頬を強めにぬぐう。\nその指先を見せればふたりは、うわ、と飾らぬ声を出す。
2967 = "Tôi dùng đầu ngón tay quệt mạnh một cái lên má mình.\\nKhi đưa ngón tay đó ra cho hai người xem, họ liền buột miệng thốt lên \"Oa\" một cách tự nhiên."
# JP: 僕の方へと飛んだ体を、\n腕で攫って、そのまま横へと倒れ伏すっ！！！
2968 = "Tôi dang tay đón lấy cơ thể đang bay về phía mình,\\nrồi cứ thế ngã lăn ra sang một bên!!!"
# JP: ハチロクを見れば、小さな頷き。\nが、凪はどうみても、普段着だ。
2970 = "Nhìn sang Hachiroku, cô ấy khẽ gật đầu.\\nNhưng mà, nhìn kiểu gì thì Nagi cũng đang mặc đồ thường ngày."
# JP: 洗い場にいる凪を見る。\n服を着ているときより、さらに小さく見える、が――
2973 = "Tôi nhìn Nagi đang ở khu vực tắm tráng.\\nTrông em ấy còn nhỏ bé hơn cả lúc mặc quần áo, nhưng——"
# JP: 実演をするやいなやのふかみの声に、\n気分がよくなる。
2974 = "Giọng nói của Fukami vang lên ngay khi tôi vừa làm mẫu xong,\\nkhiến tâm trạng tôi trở nên vui vẻ."
# JP: 立ち上がる。\n目の前にはもう何もない。
2975 = "Tôi đứng dậy.\\nTrước mắt đã không còn gì nữa."
# JP: やがて――車体が見えてくる。\n\x%lキハ07;#00ffc040;キハ07%l;#;の前後変らぬ丸顔が、驚いたように停止している。
2977 = "Cuối cùng——thân xe cũng hiện ra.\\nKhuôn mặt tròn trịa không phân biệt trước sau của \\x%lキハ07;#00ffc040;KiHa 07%l;#; đang đỗ lại như thể bị kinh ngạc."
# JP: 背負えば凪は、拍子抜けするほどに軽く小さい。
2981 = "Khi cõng lên lưng, Nagi nhẹ và nhỏ bé đến mức khiến tôi hụt hẫng."
# JP: だから、凪の木刀でも、巨体を傾がせ得るほどの、\n有効打撃を重ねることが出来たのだろう。
2983 = "Do đó, dù chỉ bằng thanh mộc kiếm của Nagi,\\nem ấy vẫn có thể liên tiếp tung ra những đòn đánh hiệu quả đủ để làm nghiêng cả thân cây khổng lồ."
# JP: だから口から出て行くのはただ、\n感じたそのままのことだけだ。
2985 = "Vì vậy, những lời buột ra khỏi miệng tôi,\\nchỉ là những gì tôi cảm nhận được ngay lúc này."
# JP: ゆえに、吸排気の発生しない練習場では、\n手前を厚く、奥が薄くと敷かれた床が、上等となる。
2988 = "Do đó, ở bãi tập không có hiện tượng nạp xả khí,\\nmặt sàn được rải phía trước dày, phía trong mỏng sẽ là đạt chuẩn cao nhất."
# JP: 必死で走るその足に、腰から頭に振動が来るっ！
2996 = "Những chấn động truyền từ chân, lên hông, rồi đến tận đầu khi tôi đang liều mạng chạy!"
# JP: ならばハチロクの言葉に甘え、
3002 = "Nếu vậy thì cứ nghe theo lời Hachiroku,"
# JP: 血の臭いがせぬ場所でなら、少しは休んでもいいだろう。
3004 = "Nếu ở một nơi không có mùi máu, thì nghỉ ngơi một chút cũng được nhỉ."
# JP: 素人目に綺麗と映る動作であるなら、\n僕の投げ込みもある程度、形が出来てきたのだろう。
3005 = "Nếu những động tác ấy trông đẹp mắt ngay cả với người ngoài ngành,\\nthì chắc hẳn kỹ năng xúc than của tôi cũng đã thành hình ở một mức độ nào đó rồi."
# JP: \x%lタイフォン;#00ffc040;タイフォン%l;#;の音。鼓膜が、脳が、記憶が激しく揺すられる。\n猛烈な吐き気がこみあげてきて、目の前が暗く、重くなる。
3007 = "Âm thanh của \\x%lタイフォン;#00ffc040;còi hơi%l;#;. Màng nhĩ, não bộ, ký ức bị rung lắc dữ dội.\\nMột cơn buồn nôn mãnh liệt trào lên, trước mắt tôi tối sầm và nặng trĩu."
# JP: 何が、などとは聞くまでもない。\nハチロクも、当然のように答えてくれる。
3010 = "Chẳng cần phải hỏi là chuyện gì.\\nHachiroku cũng đáp lại như một lẽ đương nhiên."
# JP: 砂利の味。\x%lバラスト;#00ffc040;バラスト%l;#;の味かと一瞬思い。\nそんな場合ではないことをすぐ思い出す。
3013 = "Vị của sỏi đá. Trong khoảnh khắc, tôi tự hỏi liệu có phải là vị của \\x%lバラスト;#00ffc040;đá ba-lát%l;#;.\\nNhưng rồi tôi lập tức nhớ ra đây không phải lúc để nghĩ về điều đó."
# JP: ふかみだ。\n絵に描いたような苦笑をしている。
3016 = "Là Fukami.\\nEm ấy đang nở một nụ cười gượng gạo y như trong tranh vẽ."
# JP: まして、凪のような学園生、しかも女でそう出来るものが、\n果たして何人いることだろうか。
3020 = "Huống hồ, một học sinh như Nagi, lại còn là con gái mà làm được như vậy,\\nthì rốt cuộc có được bao nhiêu người cơ chứ."
# JP: 老木の巨体が地面にどんどん近づく。\n凪が、飛ぶ。
3029 = "Thân cây cổ thụ khổng lồ ngày càng tiến gần mặt đất.\\nNagi, bay người tới."
# JP: その結果、ハチロクにくだされた診断は、\n『全ての機能に異常なし』というものだった。
3030 = "Kết quả là, chẩn đoán được đưa ra cho Hachiroku là,\\n『Tất cả các chức năng đều không có gì bất thường』."
# JP: だから、叫ぶ！\nだからこそ、力の限りにシャツを振るっ！
3033 = "Vì thế, tôi gào lên!\\nChính vì thế, tôi vẫy chiếc áo sơ mi bằng tất cả sức lực!"
# JP: ちょうどいい。
3034 = "Vừa đúng lúc."
# JP: 電話を貸そうとするより早く、\n凪がシンプルな携帯を取り出す。
3039 = "Còn nhanh hơn cả việc tôi định cho mượn điện thoại,\\nNagi đã rút ra một chiếc điện thoại di động kiểu dáng đơn giản."
# JP: ふかみは大きく手を横に振り、\n凪は縦へと、面を打つように振り下ろす。
3047 = "Fukami xua tay nguầy nguậy,\\ncòn Nagi thì vung tay chém dọc xuống như đang đánh vào mặt đối thủ."
# JP: 僕の差し出す手からビビビと激しく跳ね逃れ、\nそのままふかみは、自力で洗い場へと上がる。
3049 = "Em ấy giật nảy mình né tránh bàn tay tôi đưa ra,\\nrồi tự mình trèo lên khu vực tắm tráng."
# JP: ふかみがハンカチで凪をぬぐうが、\n炭塵汚れは少しも落ちない。
3051 = "Fukami dùng khăn tay lau cho Nagi,\\nnhưng vết bẩn do bụi than chẳng sạch đi chút nào."
# JP: 床へと崩れた凪にふかみが駆け寄り支える。
3052 = "Nagi gục xuống sàn, Fukami vội chạy đến đỡ lấy."
# JP: 柔らかな声、穏やかな口調。\nけれども、断固とした響き。
3055 = "Giọng nói dịu dàng, điệu bộ ôn hòa.\\nNhưng lại vang lên một cách kiên quyết."
# JP: それをどうにか振り払いたく、\n死に物狂いでシャツを振るっ！！
3056 = "Muốn bằng cách nào đó rũ bỏ nó đi,\\ntôi điên cuồng vẫy chiếc áo sơ mi!!"
# JP: そして今、そのうるささは会話に支障を\n来しかねない域にまで達しつつある。
3064 = "Và bây giờ, sự ồn ào đó đang dần đạt đến mức\\ncó thể gây cản trở cho cuộc trò chuyện."
# JP: 喧騒だ。\nかしましいこと、この上ない。
3065 = "Thật ồn ào.\\nKhông gì có thể ầm ĩ hơn thế này nữa."
# JP: 凪をささえて拭いてやるうち、\nふかみにもかなり汚れがついた。
3069 = "Trong lúc đỡ Nagi và lau mặt cho em ấy,\\nFukami cũng bị dính khá nhiều vết bẩn."
# JP: 僕の復唱を確認し終え、\nハチロクは、優しい視線をレールへ落とす。
3094 = "Sau khi xác nhận lại những gì tôi vừa đọc lại,\\nHachiroku đưa ánh mắt dịu dàng nhìn xuống đường ray."
# JP: 移動経路は問題ではない。\nただ、僕は――
3096 = "Lộ trình di chuyển không phải là vấn đề.\\nChỉ là, tôi——"
# JP: ぎょっと、ハチロクの体が固まる。\n視線がレールの、遥か先を睨んで止まる。
3099 = "Cơ thể Hachiroku giật thót rồi cứng đờ.\\nÁnh mắt cô ấy dừng lại, nhìn chằm chằm vào khoảng không xa xăm trên đường ray."
# JP: 初回メニューも、僕と同じだ。\n百キロと聞き、ふかみがうへぇと声を出す。
3106 = "Bài tập đầu tiên cũng giống hệt tôi.\\nNghe thấy 100 ký, Fukami buột miệng kêu lên một tiếng \"Oái\"."
# JP: 倒れるまで力を尽くす――口で言うのは容易いことだが、\n実際にそう出来る人間は、ほとんどいない。
3114 = "Dốc hết sức lực cho đến khi gục ngã——nói bằng miệng thì dễ,\\nnhưng những người thực sự làm được điều đó, hầu như không có mấy ai."
# JP: 結局のところ、図面を含めた全ての情報は、\n究極的には、運転を補助する素材にすぎない。
3117 = "Rốt cuộc thì, mọi thông tin bao gồm cả bản vẽ,\\nsuy cho cùng cũng chỉ là tài liệu hỗ trợ cho việc lái tàu mà thôi."
# JP: 線路に近い大木のこと。\n\x%lバラスト;#00ffc040;バラスト%l;#;が砕けきるほどの消耗のこと。
3124 = "Về cái cây lớn nằm gần đường ray.\\nVề sự hao mòn đến mức \\x%lバラスト;#00ffc040;đá ba-lát%l;#; vỡ vụn."
# JP: かなり、疲れた。\nだが、これだけは確認せねば。
3134 = "Tôi khá là, mệt rồi.\\nNhưng mà, chỉ điều này là tôi phải xác nhận."
# JP: 凪の身体能力は、端的にいって破格のものだ。\n取り押さえるには、もういくらかは近づかなければ。
3135 = "Nói tóm lại, thể chất của Nagi là một thứ gì đó vượt xa mức bình thường.\\nĐể khống chế được em ấy, tôi cần phải tiến lại gần thêm một chút nữa."
# JP: 木が揺れる。
3139 = "Cái cây rung chuyển."
# JP: 腕とか足とか、これ以上太くしたくないし――\nボソリと呟き、ふかみはすがるような目で僕を見る。
3140 = "Tay với chân, em không muốn làm cho to thêm nữa đâu——\\nFukami lầm bầm nói nhỏ, rồi nhìn tôi bằng ánh mắt như van nài."
# JP: ポイントは、手首の返し。スコップを釜へ突っ込む瞬間に、\n手首を返して勢い良く伏せ、石炭を叩きつけることだ。
3145 = "Điểm mấu chốt là động tác lật cổ tay. Ngay khoảnh khắc thọc xẻng vào lò,\\nphải lật cổ tay úp mạnh xuống, đập than vào đó."
# JP: その狭さを少しでも軽減するため、\n運転モードの\x%lレイルロオド;#00ffc040;レイルロオド%l;#;が人形サイズであるほどに。
3146 = "Để giảm bớt sự chật hẹp đó dù chỉ một chút,\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; ở chế độ lái mới có kích thước như búp bê."
# JP: 聞いた瞬間、もうくたくたと全身の力が抜けおちかけるが、\nもう何十歩を駆け抜けて、ハチロクの元へたどり着く。
3150 = "Ngay khoảnh khắc nghe thấy điều đó, toàn thân tôi rã rời như muốn đổ gục,\\nnhưng tôi vẫn cố chạy thêm vài chục bước nữa để đến bên Hachiroku."
# JP: 言われて、感じる、自分の涙。\n何年ぶり――何十年ぶりのことだろう。
3151 = "Được cô ấy nói, tôi mới cảm nhận được nước mắt của chính mình.\\nĐã mấy năm rồi——mấy chục năm rồi nhỉ."
# JP: 事故の記憶に触れずにいれば、大事な記憶も失いそうで。\nそれを失ってしまったのなら、生きる理由を見失うから。
3179 = "Nếu không chạm vào ký ức về vụ tai nạn, dường như tôi sẽ đánh mất cả những ký ức quan trọng.\\nBởi vì nếu đánh mất nó, tôi sẽ không còn lý do để sống nữa."
# JP: ゆでダコ訂正、ゆでエビだ。
3190 = "Xin đính chính lại, không phải bạch tuộc luộc, mà là tôm luộc."
# JP: 答えた瞬間、凪は大きくＶサイン。
3195 = "Ngay khoảnh khắc tôi trả lời, Nagi giơ tay hình chữ V thật lớn."
# JP: 自分で言っておきながら、\nハチロクはすぐ、唇をきゅっと結んでしまう。
3196 = "Dù tự mình nói ra điều đó,\\nnhưng Hachiroku lập tức mím chặt môi lại."
# JP: 言い切り、そしてハチロクは、\n採点者の顔を溶かして、ひだまりのような笑顔を浮かべる。
3197 = "Nói dứt lời, Hachiroku\\nrũ bỏ vẻ mặt của người chấm điểm, nở một nụ cười ấm áp như tia nắng."
# JP: いうやいなやで、凪は木刀を上段に！
3198 = "Vừa dứt lời, Nagi đã vung mộc kiếm lên cao!"
# JP: のぼせるという言葉が示す範囲を越えて、\nこれは……“ゆだる”というものだろう。
3226 = "Vượt qua cả mức độ \"ngâm nóng quá\",\\nthế này phải gọi là…… \"bị luộc chín\" mất rồi."
# JP: さっきからずっと気になっていた。
3227 = "Tôi đã để ý từ nãy đến giờ rồi."
# JP: 三杯、二杯――\n投げ込むことより、引き抜く力を振り絞る。
3230 = "Ba xẻng, hai xẻng——\\nThay vì xúc than vào, tôi dồn toàn bộ sức lực để rút xẻng ra."
# JP: ならばどうする？　簡単だ。足りない金は、借りればいい。\nそして人手は、金から変換できるのだ。
3233 = "Nếu vậy thì phải làm sao? Đơn giản thôi. Thiếu tiền thì đi vay.\\nVà nhân lực thì có thể dùng tiền để đổi lấy."
# JP: なら――物の身でありながら、主に捨てられたハチロクは、\n判断の基準を失くしたままで、眠り続けていたのだろう。
3234 = "Vậy thì——dù mang thân phận đồ vật, nhưng lại bị chủ nhân vứt bỏ, Hachiroku\\nchắc hẳn đã chìm trong giấc ngủ dài khi đánh mất đi tiêu chuẩn phán đoán."
# JP: ボイラの中、釜の底――\x%l火床;#00ffc040;[かしょう,1]火床%l;#;に見立てて、\n五列五行に分割した、一から二十五までのマスの全てを。
3235 = "Bên trong nồi hơi, đáy lò——được mô phỏng thành \\x%l火床;#00ffc040;buồng lửa%l;#;,\\nchia thành 5 hàng 5 cột, toàn bộ từ ô số 1 đến ô số 25."
# JP: レールショップでクマ川下りの、\n発船所では御一夜鉄道一日乗車の割引券をそれぞれ配る。
3237 = "Ở cửa hàng đường sắt thì phát vé giảm giá xuôi dòng sông Kuma, còn ở bến thuyền thì phát vé giảm giá đi tàu đường sắt Ohitoyo một ngày."
# JP: 単純な４００杯\x%l投炭;#00ffc040;投炭%l;#;も、３セット目の終わり――\n１．２トンともなれば、心身ともに摩耗し切る。
3243 = "Dù chỉ là bài tập \\x%l投炭;#00ffc040;xúc than%l;#; 400 xẻng đơn giản, nhưng khi kết thúc set thứ 3——\\nkhối lượng lên tới 1.2 tấn, cả thể xác lẫn tinh thần đều bị bào mòn đến kiệt quệ."
# JP: 素人の遊び半分の訓練志願を、\nハチロクはしかし嫌がらない。
3244 = "Một người nghiệp dư tình nguyện xin huấn luyện với nửa phần đùa giỡn,\\nnhưng Hachiroku lại không hề tỏ ra khó chịu."
# JP: そこまでやりたいものならば、やらせてやっても構わんが、\n服を汚して、蓑笠老人の不興を買うのは望ましくない。
3246 = "Nếu em ấy đã muốn làm đến thế thì cho làm cũng chẳng sao,\\nnhưng tôi không muốn em ấy làm bẩn quần áo rồi chuốc lấy sự phật ý của ông lão Minokasa."
# JP: 蓑笠老人の許可とふかみは、関係無い。
3247 = "Sự cho phép của ông lão Minokasa và Fukami, chẳng liên quan gì đến nhau."
# JP: 立派な木だが朽ちている。\n中が乾いて、スカスカになってしまっている。
3248 = "Dù là một cái cây bề thế nhưng nó đã mục nát.\\nBên trong khô khốc và trống rỗng."
# JP: 単純なだけに、効果がありそうな試みだ。
3249 = "Dù đơn giản, nhưng lại là một thử nghiệm có vẻ sẽ mang lại hiệu quả."
# JP: 頭ではわかっているのだが、疲労が蓄積してきてしまうと、\nどうにも甘くなってしまう。
3250 = "Trong đầu thì hiểu rõ, nhưng khi sự mệt mỏi tích tụ,\\nđộng tác kiểu gì cũng trở nên thiếu dứt khoát."
# JP: もう感覚の無い腰と腕とを、\nその間正確に動かすようにと、ただそれだけを意識する。
3251 = "Tôi chỉ tập trung ý thức vào một việc duy nhất,\\nlà phải điều khiển cái lưng và đôi tay đã mất cảm giác di chuyển thật chính xác trong khoảng thời gian đó."
# JP: 真っ黒なまま帰してもさぞ迷惑だろうが、\n勝手に風呂に入れるというのもまた迷惑なことかもしれん。
3252 = "Để các em ấy đen nhẻm như vậy đi về thì chắc sẽ gây phiền phức lắm,\\nnhưng tự ý đưa đi tắm thì có khi lại càng phiền phức hơn."
# JP: どこでどれだけの強さの\x%lブレーキ;#00ffc040;ブレーキ%l;#;をかければいいか。\nその基本要領を作成するに足りる精度なら問題ないのだ。
3258 = "Phải đạp \\x%lブレーキ;#00ffc040;phanh%l;#; ở đâu và với lực bao nhiêu.\\nChỉ cần độ chính xác đủ để xây dựng các thao tác cơ bản đó là không có vấn đề gì."
# JP: 計算通りのペースで来れてる。\nあと一分で二十七杯――
3264 = "Mọi thứ vẫn diễn ra theo đúng nhịp độ đã tính toán.\\nCòn một phút nữa là đủ 27 xẻng——"
# JP: 風圧。一瞬、誰かの声。\n金属音、\x%lブレーキ;#00ffc040;ブレーキ%l;#;音。足元が揺れ、地に倒れこむ。
3269 = "Áp lực gió. Một thoáng, tiếng của ai đó.\\nÂm thanh kim loại, tiếng \\x%lブレーキ;#00ffc040;phanh%l;#;. Dưới chân chao đảo, tôi ngã gục xuống đất."
# JP: 血の臭い、鼻の奥から突き上げてきて、\n呼吸がどんどん苦しくなって――
3277 = "Mùi máu tươi xộc lên từ sâu trong khoang mũi,\\nhơi thở ngày càng trở nên khó nhọc——"
# JP: （ガツンっ！！！！！）
3292 = "（Chát!!!!!）"
# JP: （ゴゴンっ！　ゴトンっ！　ガタンっ！　ゴトンっ！）
3296 = "（Cạch cạch! Xình xịch! Cạch cạch! Xình xịch!）"
# JP: （コキンッ！）
3297 = "（Keng!）"
# JP: （ガランっ）
3298 = "（Keng）"
# JP: （コンっ！！）
3299 = "（Cạch!!）"
# JP: （ゴンッ！）
3300 = "（Keng!）"
# JP: （サク――カパっ――ザバっ）
3301 = "（Phập——Cạch——Rào）"
# JP: （パンっ！）
3302 = "（Bốp!）"
# JP: （ぷおんっ！！！）
3303 = "（Poooon!!!）"
# JP: （ひょいっ）
3304 = "（Nhấc bổng）"
# JP: （落ち着くんだ、僕っ――）
3307 = "（Bình tĩnh lại nào, mày ơi——）"
# JP: （物とは……そうか。\n主の求めに、ただ答えようとするものなのか）
3308 = "（Đồ vật là…… ra là vậy sao.\\nLà thứ chỉ biết đáp lại yêu cầu của chủ nhân thôi sao.）"
# JP: （もみゅっ、もみゅっ、くにゅっ、もみぃっ）
3310 = "（Nắn nắn, bóp bóp, nhào nhào, nắn nắn）"
# JP: （かぽんっ）
3313 = "（Cạch）"

[selections]
