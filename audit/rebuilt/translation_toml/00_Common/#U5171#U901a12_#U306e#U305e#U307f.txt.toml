[script]
# JP: \x%l8620;#00ffc040;8620%l;#;は答えない。\nただただ巨体を、無造作にさらけ出してるだけだ。
88 = "\\x%l8620;#00ffc040;8620%l;#; không trả lời.\\nChỉ im lìm phơi bày thân hình khổng lồ một cách thô kệch."
# JP: \x%l8620;#00ffc040;8620%l;#;の修復・稼働を果たせれば、\n負担をいくらか、僕とハチロクとで請け負えるのだが――
91 = "Nếu có thể hoàn thành việc phục hồi và vận hành \\x%l8620;#00ffc040;8620%l;#;,\\ntôi và Hachiroku có thể gánh vác phần nào gánh nặng đó, nhưng mà――"
# JP: \x%l石造機関庫;#00ffc040;石造機関庫%l;#;は人と声とで埋め尽くされ、\n\x%l8620;#00ffc040;8620%l;#;がその中心になっている。
96 = "\\x%l石造機関庫;#00ffc040;Xưởng đầu máy bằng đá%l;#; tràn ngập người và tiếng nói,\\n\\x%l8620;#00ffc040;8620%l;#; đang trở thành trung tâm của nơi này."
# JP: ガランとしている。\n\x%l石造機関庫;#00ffc040;石造機関庫%l;#;が果てなく広い。人気がまるで消えている。
97 = "Vắng tanh vắng ngắt.\\n\\x%l石造機関庫;#00ffc040;Xưởng đầu máy bằng đá%l;#; rộng thênh thang. Bóng người như biến mất hoàn toàn."
# JP: ――『8620改修公開と、蒸気焼酎製造販売に関する私案』。
1513 = "――『Bản đề xuất cá nhân về việc công khai phục hồi 8620 và sản xuất, bán Shochu Hơi Nước』."
# JP: ――僕ひとりだけが大きくなってしまっても。
1515 = "――Cho dù chỉ có mình tôi lớn lên."
# JP: ――ダメージの無い機関士側に公開展示の導線を引き、\n傷の激しい助士側への一般客の立ち入りはご遠慮いただく。
1517 = "――Kéo dây hướng dẫn khách tham quan công khai về phía ghế lái không bị hư hại,\\nvà từ chối khách tham quan thông thường bước vào phía ghế phụ lái bị hư hỏng nặng."
# JP: ――良い循環が産まれてきている。
1519 = "――Một vòng tuần hoàn tốt đẹp đang được sinh ra."
# JP: ――腰から体を真っ二つに折る。
1521 = "――Gập người làm đôi từ thắt lưng."
# JP: ――　8620復活準備展示会　――
1523 = "――　Triển lãm chuẩn bị phục hồi 8620　――"
# JP: “答えを押し付けたつもりでは無い”。
1531 = "\"Tôi không có ý định áp đặt câu trả lời đâu\"."
# JP: ならば、それでいいではないか。\n僕の理性はそう言っている。
1536 = "Nếu vậy, thì tốt quá rồi còn gì.\\nLý trí của tôi đang nói như vậy."
# JP: ……しかし、なんともすごい人だ。\n時間の経過につれてどんどん、増えてるようだが――
1541 = "……Tuy nhiên, người đông thật đấy.\\nCàng về sau có vẻ như càng tăng lên thì phải——"
# JP: ……事故の傷跡。その深さ。\nある程度なら、僕にも共感できるつもりだ。
1545 = "……Vết sẹo của vụ tai nạn. Sự sâu sắc của nó.\\nỞ một mức độ nào đó, tôi nghĩ mình có thể đồng cảm được."
# JP: ……今度は、古びた備品と壁か。\nカメラというのも、なかなかに業が深そうだ。と！
1549 = "……Lần này lại chụp thiết bị cũ kỹ và bức tường sao.\\nMáy ảnh quả thực là một sở thích khá sâu sắc. Á!"
# JP: ……真っ赤な顔から、一言絞り出す度に、\nふかみの背筋が伸びていく。
1551 = "……Từ khuôn mặt đỏ bừng, mỗi khi nặn ra được một lời,\\nlưng Fukami lại thẳng lên một chút."
# JP: 「…………」
1569 = "「…………」"
# JP: 「……」
1570 = "「……」"
# JP: 「……[くら]比ぶることは……\nズルかことじゃなかと？」
1577 = "「……Việc so sánh……\\nKhông phải là gian xảo sao?」"
# JP: 「……お前もけんけん言っているではないか」
1579 = "「……Em cũng đang cằn nhằn đấy thôi.」"
# JP: 「……うむ。見せる」
1581 = "「……Ừm. Sẽ cho xem.」"
# JP: 「……でっかかぁ～」
1583 = "「……To quá~」"
# JP: 「……優しいな。路子は」
1584 = "「……Michiko, thật tốt bụng.」"
# JP: 「……そーなんだ」
1586 = "「……Ra là vậy.」"
# JP: 「そ、そんな――こんなこと、単なる、慣れ、です」
1901 = "「Kh, không đâu ạ——chuyện này, chỉ đơn giản là, quen tay thôi, ạ.」"
# JP: 「真っ先にですよ。３００カットは撮りましたか」
1903 = "「Tôi đã chụp đầu tiên rồi. Chắc cũng phải 300 kiểu rồi nhỉ.」"
# JP: 「に、に――にげない。です」
1904 = "「Kh, kh――không bỏ chạy. Ạ.」"
# JP: 「いや。やめておこう。\n稀咲がどうこう、誘致がどうこうという話ではなく」
1906 = "「Không. Bỏ đi.\\nGiờ không phải lúc nói chuyện Kisaki thế nào, hay thu hút đầu tư ra sao.」"
# JP: 「いえいえ、普通のことです――というか、\n双鉄君は、カメラをやらないのですか？」
1908 = "「Không không, chuyện bình thường thôi――mà này,\\ncậu Soutetsu, không chơi máy ảnh sao?」"
# JP: 「比べないのは、最初から機会を奪うことであり――\n同時に、思考の放棄に等しいと僕は考える」
1909 = "「Không so sánh, tức là tước đoạt cơ hội ngay từ đầu――\\nĐồng thời, anh nghĩ nó cũng tương đương với việc từ bỏ suy nghĩ.」"
# JP: 「ごめんなさい。凪ちゃんも誘ったんですけど、\n剣術修行をするって、どっか行っちゃった――です」
1911 = "「Em xin lỗi. Em cũng đã rủ Nagi rồi,\\nnhưng em ấy bảo đi tu luyện kiếm thuật, rồi chạy đi đâu mất tiêu――rồi ạ.」"
# JP: 「違いますよ、兄さん。\nコンは、キツネ。ですから駅長キツネです」
1914 = "「Không phải đâu anh trai.\\nKon là cáo. Nên phải là cáo trưởng ga chứ.」"
# JP: 「\x%l8620;#00ffc040;8620%l;#;は撮らんのですか？」
1916 = "「Ngài không chụp \\x%l8620;#00ffc040;8620%l;#; sao?」"
# JP: 「恐縮です」
1920 = "「Cháu thật ngại quá.」"
# JP: 「礼には、まだまだ早すぎる」
1922 = "「Cảm ơn lúc này vẫn còn quá sớm.」"
# JP: 「いえいえ」
1924 = "「Không có gì không có gì.」"
# JP: 「\x%l電車;#00ffc040;電車%l;#;であれ、機関車であれ、経験でしか運転できない。\n周辺状況の記録は、習熟訓練段階では非常に効果的です」
1926 = "「Dù là \\x%l電車;#00ffc040;tàu điện%l;#; hay đầu máy, đều chỉ có thể lái bằng kinh nghiệm.\\nViệc ghi chép tình hình xung quanh rất có hiệu quả trong giai đoạn huấn luyện làm quen.」"
# JP: 「計画がどんなに優れたものに思えても、\n実感がないと、人はなかなか動き出せないとも思います」
1927 = "「Dù kế hoạch có vẻ xuất sắc đến đâu,\\nnhưng nếu không có cảm nhận thực tế, tôi nghĩ mọi người sẽ rất khó để bắt tay vào hành động.」"
# JP: 「だが、そこは大丈夫。大丈夫になったんだ。\nやはり、議論になってしまってな」
1930 = "「Nhưng, chuyện đó thì không sao đâu. Đã không sao rồi.\\nQuả nhiên là, đã xảy ra tranh luận mà.」"
# JP: 「いいや、違う」
1932 = "「Không, nhầm rồi.」"
# JP: 「お久しぶりです、[せき]堰さん。\n川下りのときは、トラックでありがとうございました」
1936 = "「Đã lâu không gặp, ông Seki.\\nLúc xuôi dòng trên sông, cảm ơn ông vì chuyến xe tải ạ.」"
# JP: 「なになに凪ちゃん、どぎゃんしたと？」
1942 = "「Gì vậy gì vậy Nagi, sao thế?」"
# JP: 「おもしろい、とはどういう」
1943 = "「Thú vị, là ý gì cơ?」"
# JP: 「トップナンバーって、いったいなんね！？」
1944 = "「Số hiệu đầu tiên, rốt cuộc là cái gì vậy!?」"
# JP: 「これが、今日見に来た汽車ぽっぽばい？」
1946 = "「Đây là, chiếc xe lửa xình xịch hôm nay chúng ta đến xem sao?」"
# JP: 「男と女、その二人連れでここに来ているという話でだ」
1955 = "「Là chuyện một nam một nữ, hai người họ đang đi cùng nhau đến đây.」"
# JP: 「が、それに固執し、その他を頭から否定するのでは、\n最初に出会ったあの時のわがままなハチロクと同じだぞ」
1960 = "「Nhưng, nếu cứ cố chấp với nó, và phủ nhận những thứ khác ngay từ đầu,\\nthì em cũng giống hệt Hachiroku bướng bỉnh lúc chúng ta mới gặp nhau thôi.」"
# JP: 「ですが、これだけはわかります。\n[ハチロクニイマル,3]8620の望みでしたら――わかります」
1962 = "「Nhưng, chỉ điều này là tôi hiểu.\\nNếu là mong muốn của 8620――thì tôi hiểu.」"
# JP: 「おまえは、ずっと――\nこんな気持ちで、ずうっとここに止まっていたの？」
1966 = "「Mày đã, luôn——\\nmang tâm trạng thế này, và đỗ ở đây suốt sao?」"
# JP: 「兄さんたちの自由時間は、まだ一時間以上ありますよ？\nいまは、ふかみちゃんに交代してもらってるんです」
1968 = "「Thời gian tự do của bọn anh vẫn còn hơn một tiếng nữa mà?\\nHiện tại, em đang nhờ bé Fukami đổi ca trông giúp rồi.」"
# JP: 「それこそ甘いな。考えが」
1970 = "「Suy nghĩ của em ngây thơ quá đấy.」"
# JP: 「心配してくれているのか」
1972 = "「Em đang lo lắng cho anh sao.」"
# JP: 「やっと言ったな。お前の望みを」
1973 = "「Cuối cùng em cũng chịu nói ra rồi. Mong muốn của em.」"
# JP: 「比べることを、ズルいと考える気持ちもわかる。\nだが、それを言うなら、比べぬことも、またズルい」
1975 = "「Anh cũng hiểu cảm giác coi việc so sánh là gian xảo.\\nNhưng, nếu nói vậy thì, việc không so sánh, cũng là một sự gian xảo.」"
# JP: 「そうだったな」
1976 = "「Đúng vậy nhỉ.」"
# JP: 「いやご謙遜。ボイラ屋の[はた]秦さんがほめとりましたですよ。\n双鉄君ば、後継ぎにしたいくらいの熱心さやいうて」
1977 = "「Không, cậu khiêm tốn quá. Anh Hata thợ sửa lò hơi đã khen ngợi cậu đấy.\\nBảo là cậu Soutetsu, nhiệt tình đến mức anh ấy muốn nhận làm người kế vị luôn.」"
# JP: 「意地悪？　ああ」
1985 = "「Trêu ác ý? À.」"
# JP: 「きずは、こわいよ。あんなのみえたら、きっとみんな、てつどう事故のことをおもって、こわがるよ」
1989 = "「Vết thương, đáng sợ lắm. Nếu thấy những thứ như thế, chắc chắn mọi người, sẽ nhớ đến tai nạn đường sắt, và sẽ sợ hãi đó.」"
# JP: 「\x%lエアクラ;#00ffc040;エアクラ%l;#;を[おんてき,1]怨敵とまで言っていたハチロクは、しかし\n\x%lエアクラ;#00ffc040;エアクラ%l;#;の利便性を認め、共存を考えるようになった」
2003 = "「Hachiroku từng gọi \\x%lエアクラ;#00ffc040;Aircra%l;#; là kẻ thù không đội trời chung, nhưng\\nem ấy đã công nhận sự tiện lợi của \\x%lエアクラ;#00ffc040;Aircra%l;#;, và bắt đầu suy nghĩ đến việc chung sống.」"
# JP: 「他には何……あ、双鉄様、あちら」
2007 = "「Những chỗ khác thì có gì…… a, ngài Soutetsu, đằng kia.」"
# JP: 「本当は、賑やかすぎてコンが全然落ち着かなくて。\nですから、散歩を少しさせようと出てきただけです」
2009 = "「Thật ra là do ồn ào quá nên Kon hoàn toàn không thể bình tĩnh được.\\nThế nên em mới đưa bé ra ngoài đi dạo một chút thôi.」"
# JP: 「やめてください、お礼だなんて。\n兄妹ですよ？　水臭い」
2020 = "「Đừng có cảm ơn em nữa.\\nChúng ta là anh em mà? Khách sáo quá đi.」"
# JP: 「なに食べようか悩むばい！\nなやんだ時は全部いけってじいちゃん――がっ！？」
2023 = "「Đau đầu không biết nên ăn gì đây!\\nÔng nội bảo lúc nào đau đầu thì cứ quất hết――hả!?」"
# JP: 「先だってのお会合には行かれんでしたが、\n今日はなんとか、時間ば作って寄らせてもらいました」
2025 = "「Lần họp mặt trước tôi không đi được,\\nnhưng hôm nay tôi đã cố gắng, sắp xếp thời gian để ghé qua.」"
# JP: 「がんばった？　って、きゃっ！？」
2029 = "「Đã cố gắng? Á, á!?」"
# JP: 「罪の深さに[おのの]慄きながら、それでも求めてしまうのです。\nもう一度――ただもう一度……人と笑顔を運びたいと」
2031 = "「Dù run rẩy trước tội lỗi sâu nặng, nhưng em vẫn khao khát.\\nMột lần nữa——chỉ một lần nữa thôi…… em muốn được chở mọi người và những nụ cười」"
# JP: 「なるほど。人気があるという凪に学友を誘ってもらえば、\nその保護者達にも自然、周知が出来るというわけか」
2032 = "「Ra là vậy. Nếu nhờ Nagi, người rất được yêu mến, rủ rê bạn học,\\nthì tự nhiên cũng sẽ thông báo được cho cả phụ huynh của các em ấy nhỉ.」"
# JP: 「なるほど。かなり頑張ったのだな」
2033 = "「Ra là vậy. Em ấy đã rất cố gắng nhỉ.」"
# JP: 「なるほど。そうした日がイベントか。\nん？　ならば、今日もそうではないか？　鉄道イベント」
2034 = "「Ra là vậy. Những ngày như thế gọi là sự kiện sao.\\nHửm? Nếu vậy, hôm nay chẳng phải cũng thế sao? Sự kiện đường sắt.」"
# JP: 「仕事のようばい。\nまたの、双鉄」
2038 = "「Đến giờ làm việc rồi.\\nGặp lại sau nhé, Soutetsu.」"
# JP: 「どうみても、あのお二人、単なる仕事仲間ですが。\nいわゆる恋人同士のような、甘い雰囲気には見えませぬ」
2052 = "「Dù nhìn thế nào thì hai người họ cũng chỉ là đồng nghiệp thôi mà.\\nKhông hề thấy bầu không khí ngọt ngào kiểu như những cặp đôi yêu nhau.」"
# JP: 「ケンっ！」
2057 = "「Ẳng!」"
# JP: 「あっ」
2058 = "「A.」"
# JP: 「はうっ！！？」
2059 = "「Hau!!?」"
# JP: 「ひゃあっ！？」
2060 = "「Hyaa!?」"
# JP: 「ぇ――わ、わたし――とか、無理」
2061 = "「Hả――mi, mình――sao, không làm được đâu.」"
# JP: 「う、うん。あの、ね？」
2063 = "「Ư, ừm. À, ừm, các cậu biết không?」"
# JP: 「あはっ」
2065 = "「Hơ hơ.」"
# JP: 「うおっほん、えへん！　えへんえへん！！」
2066 = "「E hèm, e hèm! E hèm e hèm!!」"
# JP: 「はてさて、そうなりますでしょうか？\nハチロクには、少し難しすぎるようです」
2068 = "「Chà chà, liệu có đúng là như vậy không nhỉ?\\nĐối với Hachiroku thì có vẻ hơi quá khó hiểu rồi.」"
# JP: 「これはこれは、\n赤井宮司に足をお運びいただけるとは、光栄です」
2069 = "「Ái chà ái chà,\\nĐược đền chủ Akai cất công đến đây, thật là vinh hạnh.」"
# JP: 「えっ！？」
2071 = "「Hả!?」"
# JP: 「え？」
2072 = "「Hả?」"
# JP: 「え？　なんね、企画からって」
