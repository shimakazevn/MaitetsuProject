2468 = "「Chào mừng đến với Ohitoyo. Và, chào mừng đến với Đường sắt Ohitoyo!\\nTừ nay về sau, mong cô giúp đỡ nhiều hơn!」"
# JP: 「ではそれで。\n私的な場では、好きに呼んでくれてかまわない」
2470 = "「Vậy quyết định thế nhé.\\nCòn ở những nơi riêng tư, em muốn gọi sao cũng được.」"
# JP: 「大丈夫！　衝突してない！　\nっていうか、今のなに？　イノシシかなんか！？」
2472 = "「Em không sao! Không đâm phải gì cả!\\nMà nãy là cái gì vậy? Lợn rừng hay gì á!?」"
