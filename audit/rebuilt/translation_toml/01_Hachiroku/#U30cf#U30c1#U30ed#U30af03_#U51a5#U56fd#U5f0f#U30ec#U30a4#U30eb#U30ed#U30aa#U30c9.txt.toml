2477 = "「Đúng vậy. Vì tiền đề là sản xuất hàng loạt, tiêu thụ hàng loạt,\\nnên cả đầu máy và \\x%lレイルロオド;#00ffc040;Railord%l;#; đều được coi là thứ có thể tiêu thụ và thay thế.」"
# JP: 「はい。正真正銘の天然温泉の大浴場。\n標準的な駅施設の沸かし湯よりも、何百倍も素敵かと」
2479 = "「Vâng. Là nhà tắm lớn với suối nước nóng thiên nhiên chính hiệu đó ạ.\\nTuyệt vời hơn gấp hàng trăm lần so với nước đun sôi ở các cơ sở nhà ga tiêu chuẩn đấy ạ.」"
# JP: 「オンセンオンセンー！！」
2491 = "「Suối nước nóng, suối nước nóng!!」"
