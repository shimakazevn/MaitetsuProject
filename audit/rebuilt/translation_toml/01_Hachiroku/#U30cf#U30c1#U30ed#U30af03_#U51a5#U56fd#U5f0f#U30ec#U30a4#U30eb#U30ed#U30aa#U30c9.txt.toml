2503 = "「Nhưng mà, ưu tiên hàng đầu trong vận tải đường sắt luôn là an toàn.\\nNhìn về lâu dài, ưu điểm của kiểu Hinomoto sẽ nổi bật hơn ạ.」"
# JP: 「れいなも、ぜーんぜん気にしてませんよぉ。\nおひっこしは、かなしくてさみしいですもんねぇ」
2505 = "「Reina cũng, hoàn toàn không để bụng đâu nha~\\nChuyển nhà thì, buồn và cô đơn lắm mà~」"
# JP: 「[めいじ,1]明智45年から、百年以上だものな。\nずっと現役でいるだけでも、大変な偉業だろうに」
2507 = "「Từ năm Minh Trị 45 đến nay, đã hơn trăm năm rồi mà.\\nChỉ riêng việc luôn hoạt động trên tuyến đầu cũng đã là một kỳ tích rồi.」"
