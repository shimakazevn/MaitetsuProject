# JP: 「わたくしと双鉄さまも、\n始末書を済ませてしまいますので」
2376 = "「Em và ngài Soutetsu cũng\\nphải hoàn thành bản kiểm điểm sự cố nữa ạ.」"
# JP: 「えっと――　一番簡単にいえば、大量生産、大量消費です。\n作りはシンプル。それで、互換性をとても大事にします」
2380 = "「Ừm—— Nói một cách đơn giản nhất thì là sản xuất hàng loạt, tiêu thụ hàng loạt.\\nCấu tạo đơn giản. Vì vậy, họ rất coi trọng tính tương thích.」"
# JP: 「えっと……ちょっと待ってね？\n正確に答えたほうが良さそうだから」
2382 = "「Ừm…… đợi một chút nhé?\\nCó lẽ tôi nên trả lời chính xác thì hơn.」"
# JP: 「僕も他をよく知らんゆえ、断言はできんが――\n多分、どこでもそのようなものだと思う」
2383 = "「Anh cũng không rành những người khác nên không dám khẳng định——\\nNhưng có lẽ, ở đâu cũng vậy thôi.」"
# JP: 「わかっている。お前が最高の性能を発揮できるのは\n僕と組んでいるときだ。そして、その逆もまた真実だ」
2386 = "「Tôi hiểu. Lúc em có thể phát huy tối đa hiệu suất\\nlà khi bắt cặp với tôi. Và ngược lại cũng đúng như vậy.」"
# JP: 「開拓当初の北開道は、広大な土地と低い輸送密度ゆえに、冥国式をお手本として採用したとも聞いておりますが」
2388 = "「Em cũng nghe nói rằng ở Hokkaido thời kỳ đầu khai phá, do đất đai rộng lớn và mật độ vận chuyển thấp nên họ đã áp dụng kiểu Minh Quốc làm hình mẫu ạ.」"
# JP: 「冥国では、それで十分なんだと思います。\n国土も広大で、輸送密度も相当に薄いはずですし」
2389 = "「Ở Minh Quốc, như vậy chắc là đủ rồi.\\nLãnh thổ rộng lớn, mật độ vận chuyển chắc chắn cũng khá thưa thớt.」"
# JP: 「いただきます」「いただきます」\n「いっただっきまーす！」
2391 = "「Mời mọi người ăn cơm.」「Mời mọi người ăn cơm ạ.」\\n「Mời mọi người ăn cơm nha~!」"
# JP: 「かもしれません」
2393 = "「Có lẽ vậy.」"
# JP: 「でしたら、どうぞ仲直りしていただけますと嬉しいです。\nいかがでしょう？　オリヴィさん」
2396 = "「Nếu vậy, em sẽ rất vui nếu chúng ta có thể làm hòa ạ.\\nChị thấy sao ạ? Chị Olivy.」"
# JP: 「だから、冥国式の蒸機と\x%lレイルロオド;#00ffc040;レイルロオド%l;#;とは、\n日ノ本式のお手本にはなれなかったというわけか」
2399 = "「Nên đầu máy hơi nước và \\x%lレイルロオド;#00ffc040;Railord%l;#; kiểu Minh Quốc,\\nđã không thể trở thành hình mẫu cho kiểu Hinomoto sao.」"
# JP: 「互換性とは、そうした点も含めてという意味か。\n専門性を諦めて、そのかわりに汎用性を高める」
2401 = "「Tính tương thích là bao gồm cả những điểm đó sao.\\nTừ bỏ tính chuyên môn, đổi lại là nâng cao tính đa dụng.」"
# JP: 「すまん。大丈夫か日々姫」
2403 = "「Xin lỗi. Em không sao chứ, Hibiki?」"
# JP: 「まっかせろばーい！」
2406 = "「Cứ giao cho em á!」"
# JP: 「もちろん。いいこで待っててね？」
2408 = "「Tất nhiên rồi. Em ngoan ngoãn chờ nhé?」"
# JP: 「専用設計を採らず、ボディもワンボディで済ませる。\n……安全面ではどうなのか、そこがいささか不安だが」
2409 = "「Không áp dụng thiết kế chuyên dụng, cơ thể cũng chỉ cần một là đủ.\\n……Về mặt an toàn thì sao nhỉ, chỗ đó hơi đáng lo ngại.」"
# JP: 「すごーいヒビキ！　卵わるの上手ー！」
2411 = "「Tuyệt quá Hibiki! Đập trứng giỏi ghê!」"
# JP: 「ああいうの――あのれんけーって、どこでもそう？\n[ヒノモト,2]日ノ本式の――マスターシステムの\x%lレイルロオド;#00ffc040;レイルロオド%l;#;って」
2412 = "「Cái kiểu——phối hợp ăn ý như vậy, ở đâu cũng thế hả?\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; của hệ thống Master——kiểu Hinomoto ấy.」"
# JP: 「おはよう！　あなたがソーテツサマだよねっ？」
2417 = "「Chào buổi sáng! Anh là ngài Soutetsu đúng không?」"
# JP: 「リョーカイ！　ヒビキ\x%l機関士;#00ffc040;機関士%l;#;！！」
2420 = "「Đã rõ! \\x%l機関士;#00ffc040;Lái tàu%l;#; Hibiki!!」"
# JP: 「ゆうべはほんっと！　ごめんなさい！！！」
2424 = "「Tối hôm qua thật sự! Xin lỗi mọi người ạ!!!」"
# JP: 「か、どうかはまだわかりません。\n双鉄さまはキャブ内を。日々姫は、わたくしを連れて」
2426 = "「Có sao hay không thì vẫn chưa biết được đâu ạ.\\nNgài Soutetsu cứ ở trong buồng lái ạ. Hibiki, hãy đưa em đi xem thử.」"
# JP: 「だな。昨日の態度はよくなかった」
2428 = "「Đúng vậy. Thái độ hôm qua của em không tốt đâu.」"
# JP: 「オリヴィのことか？」
2430 = "「Là chuyện của Olivy sao?」"
# JP: 「何があった？」
2432 = "「Đã có chuyện gì xảy ra?」"
# JP: 「転んで、どこか打ったりしたか？」
2433 = "「Em bị ngã rồi va đập vào đâu à?」"
# JP: 「はい――」
2435 = "「Vâng——」"
# JP: 「はい。国は[えいこく,1]詠国式をお手本にしましたし、大手私鉄も\n[どっこく,1]髑国や詠国が主流。[めいこく,1]冥国式は、そもそも少数派でした」
2437 = "「Vâng. Quốc gia đã lấy kiểu Anh làm hình mẫu, các tuyến đường sắt tư nhân lớn\\ncũng chủ yếu dùng kiểu Đức và Anh. Kiểu Minh Quốc vốn dĩ đã là thiểu số rồi.」"
# JP: 「はい」
2438 = "「Vâng.」"
# JP: 「はい、左様です。双鉄さま」
2440 = "「Vâng, đúng vậy ạ. Ngài Soutetsu.」"
# JP: 「凪ともだけど、一日交代で私ともだよ？」
2442 = "「Bắt cặp với Nagi là đúng rồi, nhưng cũng sẽ luân phiên bắt cặp với em theo từng ngày nữa đó?」"
# JP: 「そうなのか。\nでは、そこでのオリヴィの活躍は短かったのか？」
2445 = "「Vậy sao.\\nThế thì thời gian Olivy hoạt động ở đó khá ngắn nhỉ?」"
# JP: 「そーなんだ！」
2446 = "「Ra là vậy!」"
# JP: 「いや、湯医線の習熟運転には、ハチロクも同乗する。\nみかん鉄道では、先任\x%lレイルロオド;#00ffc040;レイルロオド%l;#;の同乗は無いのか？」
2449 = "「Không, trong chuyến chạy làm quen Tuyến Yunoi, Hachiroku cũng sẽ đi cùng.\\nỞ Đường sắt Mikan, không có chuyện \\x%lレイルロオド;#00ffc040;Railord%l;#; tiền nhiệm đi cùng sao?」"
# JP: 「えー、このくらい普通だよー」
2452 = "「Ể, cỡ này là bình thường thôi á~」"
# JP: 「確かにだ。それが、日ノ本人の一般的な感覚にも[がっち,1]合致\n――ああ、いや」
2454 = "「Đúng vậy. Điều đó cũng phù hợp với cảm nhận chung của người Hinomoto\\n——à, không.」"
# JP: 「凪さまちょこっとムカついたばってん、\n謝るんなら許すばい！　ざばっと水に流すばい！」
2456 = "「Bổn tiểu thư đây có hơi bực mình một tẹo,\\nnhưng mà đã xin lỗi rồi thì tha cho á! Cho trôi tuột đi hết luôn á!」"
# JP: 「凪さま！　凪さまと組んで乗務するばい！」
2458 = "「Thì Bổn tiểu thư đây! Sẽ bắt cặp với Bổn tiểu thư để làm nhiệm vụ á!」"
# JP: 「見てきたー！　オッケー！　衝突回避！\nで、故障も脱線もなんにもなし！」
2466 = "「Em xem rồi! OK! Tránh được va chạm!\\nVà cũng không có hỏng hóc hay trật bánh gì cả!」"
