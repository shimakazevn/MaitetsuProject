1551 = "「Có vẻ như bên trong buồng lái cũng không có vấn đề gì.\\nVậy thì chúng ta hãy nhanh chóng tăng tốc chạy bù giờ đến Yunoi thôi ạ.」"
# JP: 「\x%l前進フルギア;#00ffc040;前進フルギア%l;#;！　\x%l自弁;#00ffc040;自弁%l;#;、運転！」
1554 = "「\\x%l前進フルギア;#00ffc040;Cài hết số tiến%l;#;! \\x%l自弁;#00ffc040;Van hãm tự động%l;#;, vị trí chạy tàu!」"
# JP: 「…………」
1557 = "「…………」"
# JP: 「……む？」
