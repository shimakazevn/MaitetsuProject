1580 = "「……\\x%lレイルロオド;#00ffc040;Railord%l;#; kiểu Minh Quốc khác biệt rất lớn so với \\x%lレイルロオド;#00ffc040;Railord%l;#;\\nkiểu Hinomoto, kiểu Anh hay kiểu Đức, họ thường xuyên thay ca làm nhiệm vụ ạ.」"
