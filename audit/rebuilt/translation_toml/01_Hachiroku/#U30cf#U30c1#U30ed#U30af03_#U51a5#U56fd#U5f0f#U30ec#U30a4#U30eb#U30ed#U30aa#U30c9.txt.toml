2697 = "「OK đã rõ! Bắt cặp với ai cũng được hết á!\\nVì Olivy là kiểu Meriken mà!」"
# JP: 「オッケー！　けど、雨だったら？」
2703 = "「OK! Nhưng lỡ trời mưa thì sao?」"
# JP: 「オッケー！　わかった！」
2705 = "「OK! Hiểu rồi nha!」"
# JP: 「おっけ！　じゃ、行こーっ！」
2706 = "「OK! Vậy đi thôi!」"
# JP: 「オッケー！　じゃ、ソーテツとヒビキでっ！\n乗務のときはソーテツ\x%l機関士;#00ffc040;機関士%l;#;とヒビキ\x%l機関士;#00ffc040;機関士%l;#;っ！」
2709 = "「OK! Vậy, gọi là Soutetsu và Hibiki nha!\\nKhi làm nhiệm vụ thì là \\x%l機関士;#00ffc040;lái tàu%l;#; Soutetsu và \\x%l機関士;#00ffc040;lái tàu%l;#; Hibiki!」"
# JP: 「Ｗｈａｔ　ｈａｐｐｅｎｅｄ！！？」
2711 = "「What happened!!?」"
