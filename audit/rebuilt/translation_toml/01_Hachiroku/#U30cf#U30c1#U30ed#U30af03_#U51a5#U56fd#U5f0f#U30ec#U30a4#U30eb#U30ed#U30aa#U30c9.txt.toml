2661 = "「Còn em thì——\\nờm……cách gọi là gì ạ.」"
# JP: 「じゃ、ソーテツサマのことなんて呼べばいい？\nミギタ\x%l機関士;#00ffc040;機関士%l;#;？　ソーテツサン？」
2663 = "「Vậy, em nên gọi ngài Soutetsu là gì đây?\\n\\x%l機関士;#00ffc040;Lái tàu%l;#; Migita? Anh Soutetsu?」"
# JP: 「真っ黒くまとわりつくような感情が――\nわたくしさえも知らないような――」
