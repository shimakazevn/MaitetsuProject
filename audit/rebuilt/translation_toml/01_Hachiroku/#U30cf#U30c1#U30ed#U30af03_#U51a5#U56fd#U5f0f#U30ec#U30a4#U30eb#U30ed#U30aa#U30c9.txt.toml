# JP: 「ほんとにほんとに、おつかれさまでぇす」
2518 = "「Mọi người thực sự, thực sự vất vả rồi ạ~」"
# JP: 「アイスピックは――\nああ、そのまま持ち帰ってきていたか」
2522 = "「Dùi đập đá thì——\\nÀ, anh cứ thế mang về luôn rồi.」"
# JP: 「だな」
2529 = "「Đúng vậy.」"
# JP: 「左様ですね。わたくしたちも、もちろんどなたとでも、\n最低限のお仕事はきっちりと果たせますが――」
