2635 = "「Vậy thì, dù là trong công việc hay đời tư.\\nTừ nay về sau, một lần nữa mong chị giúp đỡ nhé?」"
# JP: 「つまり、オリヴィたち冥国式\x%lレイルロオド;#00ffc040;レイルロオド%l;#;は、\nマスター、――いや、\x%l機関士;#00ffc040;機関士%l;#;が誰であれ、組めるのか」
2636 = "「Nói cách khác, những \\x%lレイルロオド;#00ffc040;Railord%l;#; kiểu Minh Quốc như Olivy,\\ncó thể bắt cặp với bất kỳ Master——à không, bất kỳ \\x%l機関士;#00ffc040;lái tàu%l;#; nào sao?」"
# JP: 「それじゃ、今日はここまでにしましょう。\nわたしは、少し残業をしていきますね」
2641 = "「Vậy thì, hôm nay chúng ta dừng ở đây nhé.\\nTôi sẽ ở lại làm thêm một chút.」"
# JP: 「ね？　オリヴィどこすわったらいい？」
2645 = "「Nha? Olivy ngồi đâu thì được?」"
# JP: 「それで、なんの仕事からすればいいの？\n\x%l罐磨;#00ffc040;罐磨%l;#;き？　[こないせいり,3]庫内整理？」
2646 = "「Vậy, Olivy nên bắt đầu từ công việc gì đây?\\n\\x%l罐磨;#00ffc040;Cọ rửa lò hơi%l;#;? Dọn dẹp trong kho đầu máy?」"
# JP: 「晴れるまでは添乗だな。ともかく晴れたら一度歩いて、\nⅨ号をどう走らせるかのプランを立ててくれ」
2649 = "「Thì sẽ đi theo tàu cho đến khi trời tạnh. Nói chung khi nào nắng lên thì hãy đi bộ một vòng,\\nrồi lập kế hoạch xem nên vận hành đầu máy số 9 như thế nào nhé.」"
# JP: 「まぁよかった！」
2650 = "「Chà, may quá!」"
