2510 = "「Em cũng nghe nói vậy. Do em chỉ chủ yếu giao lưu với\\nRailord kiểu Hinomoto nên cũng không rành lắm ạ.」"
# JP: 「互換性」
2511 = "「Tính tương thích.」"
