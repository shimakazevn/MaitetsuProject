2176 = "Thứ cảm xúc này mang tên là gì,\\ntôi có cảm giác mình đã hiểu ra rồi."
# JP: 女の子と男の子。どういうふうに仲良くなるか。\n完璧すぎる。これこそ。マニュアル！
2179 = "Con gái và con trai. Làm thế nào để trở nên thân thiết.\\nQuá hoàn hảo. Đây chính là. Sổ tay hướng dẫn!"
# JP: ない。ない。ない。信じられない。ありえない。\n手順ばかりを意識して、必要装備を忘れるだとか。
2190 = "Không có. Không có. Không có. Không thể tin được. Không thể nào.\\nChỉ chăm chăm vào các bước mà quên mất trang bị cần thiết."
# JP: のぼせる――そう、自分はとっくにのぼせてる。\n清春に。清春をもっと、知りたくて――
2193 = "Choáng――đúng vậy, tôi đã bị choáng từ lâu rồi.\\nVì Kiyoharu. Vì muốn biết nhiều hơn, về Kiyoharu――"
# JP: わかってくれてる。わかってくれてる。\n清春。すごく自分のこと。
2198 = "Anh ấy hiểu mình. Anh ấy hiểu mình.\\nKiyoharu. Rất hiểu về mình."
# JP: 清春の声。心配そう。\n自分を、心配してくれてる声。
2200 = "Giọng của Kiyoharu. Nghe có vẻ lo lắng.\\nGiọng nói đang lo lắng cho mình."
# JP: いま、言った。\n清春、言った。
2201 = "Vừa nãy, đã nói.\\nKiyoharu, đã nói."
# JP: 第一印象は最悪のアイツ。\nけど、放課後の体育館で一人で秘密の特訓。
2205 = "Ấn tượng đầu tiên về hắn ta cực kỳ tồi tệ.\\nNhưng, hắn lại bí mật tập luyện một mình trong nhà thể chất sau giờ học."
# JP: それから可能な限り多数回の実践をして、\n分散分析して、必要があれば多重比較。
2207 = "Sau đó thực hành nhiều lần nhất có thể,\\nphân tích phương sai, nếu cần thiết thì so sánh đa chiều."
# JP: この流れなら、絶対言える。\nいうだけ。『傘ないの？』って
2209 = "Theo mạch này, chắc chắn có thể nói được.\\nChỉ cần nói. 'Anh không có ô sao?'"
# JP: 信じられないようなフリースローが鮮やかに決まって\nヒロインの胸がきゅん！　ってなる。
2214 = "Cú ném phạt đẹp mắt đến khó tin đã ghi bàn\\nkhiến trái tim nữ chính rung động! Là vậy đó."
# JP: すごく、いい。\nおねだり、したい。おねだり、すごく、恋な感じ。
2215 = "Rất, tốt.\\nMuốn, đòi hỏi. Đòi hỏi, cảm giác rất giống, đang yêu."
# JP: 電車区長の缶は、そういえばバラバラだった。\nみんなから集めた缶を、順番に渡してただけだから。
2228 = "Nhắc mới nhớ, những chiếc lon của Đoạn trưởng xe điện rất lộn xộn.\\nBởi vì ông ấy chỉ nhận lần lượt những chiếc lon được thu thập từ mọi người."
# JP: 計算を実践するだけの高度な身体機能も、\n最新鋭で最高性能の自分には備わってる――から！
2229 = "Chức năng cơ thể ở mức độ cao đủ để thực hành tính toán,\\nbản thân tôi, một cỗ máy hiện đại nhất và có hiệu suất cao nhất, cũng được trang bị――đầy đủ!"
# JP: そのための方法だったら、\nこの中に、きっとたくさん詰まってる。
2232 = "Nếu là phương pháp để làm điều đó,\\nthì trong cuốn sách này, chắc chắn có chứa rất nhiều."
# JP: バレバレ。\n言われた。"誰の目にも"って。
2238 = "Rõ mồn một.\\nBị nói rồi. 'Ai nhìn vào cũng thấy rõ' cơ đấy."
# JP: 今ここで告白をして失敗したら、\n帰りの旅が――きっと、ものすごく真っ暗になる。
2241 = "Nếu bây giờ tỏ tình ở đây mà thất bại,\\nchuyến đi về――chắc chắn, sẽ trở nên vô cùng tăm tối."
# JP: 計算はこれで間違いないし、\nそのための特訓も十分にした。
2249 = "Tính toán như vậy là không sai,\\nmình cũng đã tập luyện đủ cho việc đó rồi."
# JP: っていうかこれ、途中からスポ根になっちゃってた。\n自分は、ラブコメしたいのに！
2254 = "Nói đúng hơn là, từ giữa chừng nó đã biến thành manga thể thao nhiệt huyết mất rồi.\\nTrong khi mình, lại muốn diễn một bộ hài kịch lãng mạn cơ mà!"
# JP: 普段読む技術書とか仕様書とくらべると、\n情報密度、マンガ、かなり薄そう。
2268 = "So với các sách kỹ thuật hay tài liệu đặc tả thường đọc,\\nmật độ thông tin trong manga có vẻ khá mỏng."
# JP: ケラケラと、シロおねえちゃんの笑いの共感。\n笑われる理由が不明。だから聞く。
2274 = "Qua cộng cảm, tôi nghe thấy tiếng cười khanh khách của chị Shiro.\\nKhông rõ lý do tại sao chị ấy lại cười. Nên tôi phải hỏi."
# JP: レビュー貰うのシロおねえちゃんって思ってたけど、\n電車区長からも貰えば精度はもっとあがるし。
2275 = "Dù định nhờ chị Shiro đánh giá,\\nnhưng nếu có thêm đánh giá từ Đoạn trưởng xe điện thì độ chính xác sẽ càng cao hơn."
# JP: そんなの絶対。あるわけない。\nけど――やっぱり、ない。
2276 = "Chuyện đó tuyệt đối. Không thể nào xảy ra.\\nNhưng――quả nhiên là, không có."
# JP: もっと多面的に情報を得て、整理して、\n第三者レビューももらうのがいい。
2278 = "Tốt nhất là nên thu thập thông tin đa chiều hơn, tổng hợp lại,\\nvà nhờ bên thứ ba đánh giá."
# JP: なら、なら――赤井運転士も、気づいてる？\nあ、っていうか――なら！
2279 = "Vậy, vậy thì――lái tàu Akai, cũng nhận ra rồi sao?\\nA, mà nói đúng hơn là――nếu vậy!"
# JP: だったら、だったら！　\nみっつめもすぐにお願いしちゃう！
2281 = "Nếu vậy, nếu vậy thì!\\nMình sẽ xin luôn cái thứ ba!"
# JP: 冗談っぽく言ってるけど、\n清春の言ってることは、本当のこと。
2283 = "Dù nói với giọng điệu đùa cợt,\\nnhưng những lời Kiyoharu nói, là sự thật."
# JP: わかってないかもしれないけれど、\n間違いだったら、恥ずかしいけど、それも楽しい。
2284 = "Dù có thể tôi vẫn chưa hiểu rõ,\\ndù có nhầm lẫn thì sẽ rất xấu hổ, nhưng thế cũng vui."
# JP: 怖いのはずっとあるけどそれでも、\n心の中に、閉じ込めてなんておけないくらいに！
2285 = "Dù nỗi sợ hãi vẫn luôn hiện hữu nhưng,\\nđã đến mức không thể nhốt chặt trong lòng được nữa!"
# JP: 電車区長が傘をさす。\n雨の中、どんどん先に進んでく。
2298 = "Đoạn trưởng xe điện bung ô.\\nĐi thẳng về phía trước trong màn mưa."
# JP: 電車区長の目隠し。分厚い。\n外さないままでも、自分の方を正確に向いてる。
2299 = "Bịt mắt của Đoạn trưởng xe điện. Rất dày.\\nDù không tháo ra, ông ấy vẫn hướng mặt chính xác về phía mình."
# JP: 恋かどうかを確かめる。まずはそこから。
2302 = "Xác nhận xem đó có phải là tình yêu hay không. Trước tiên bắt đầu từ đó."
