1851 = "「Cơ hội đó~, cơ hội ngàn năm có một!\\nHay là nhân dịp này, chốt hạ tỏ tình luôn đi??」"
# JP: 「どぎゃんしたとよ？\n動作不良じゃったらエラいこと」
1852 = "「Sao vậy?\\nNếu là trục trặc thì rắc rối to đấy.」"
# JP: 「そうなんだ」
1853 = "「Ra là vậy.」"
# JP: 「聞けない。そんなの。だって。そんなの」
1854 = "「Không hỏi được. Chuyện đó. Bởi vì. Chuyện đó.」"
# JP: 「男女を入換え、自分がフリースローする。\n赤井運転士の胸がきゅん！　好感度は確実に上昇」
1855 = "「Hoán đổi nam nữ, mình sẽ là người ném phạt.\\nTrái tim lái tàu Akai sẽ rung động! Độ hảo cảm chắc chắn sẽ tăng.」"
# JP: 「それほどでも――！！？」
1856 = "「Cũng bình thường th――!!?」"
# JP: 「あの……ええと……その。\nもし、迷惑じゃ、なかったら――だけど」
1857 = "「Cái đó...... ừm...... thì.\\nNếu, không phiền――thì」"
# JP: 「じゃあ、なんでシロおねえちゃんは」
1860 = "「Vậy, tại sao chị Shiro lại...」"
# JP: 「それで？　ニイロク。\nみっつめ、今日の最後のおねだりは？」
1865 = "「Vậy thì? Niiroku.\\nCái thứ ba, đòi hỏi cuối cùng của ngày hôm nay là gì?」"
# JP: 「ええと……お天気」
1866 = "「Cái đó...... Thời tiết」"
# JP: 「缶。それ、捨てる？」
1867 = "「Cái lon. Anh, vứt đi sao?」"
# JP: 「あの。おねだり――ええと――\nいくつ、平気？」
1868 = "「Cái đó. Đòi hỏi――ừm――\\nBao nhiêu cái, thì được?」"
# JP: 「そら、赤井くんに聞くしかなかばい。\nあん男なら、まぁ正直に答えてくれよーよ」
1870 = "「Thì, chỉ còn cách hỏi cậu Akai thôi.\\nNếu là cậu ta, chà, chắc sẽ trả lời thành thật thôi.」"
# JP: 「仮説をたてて検証する。いつものルーチン。\n大丈夫。自分のスペックなら必ず矛盾を解消できる」
1872 = "「Lập giả thuyết và kiểm chứng. Vẫn là quy trình thường ngày.\\nKhông sao. Với thông số kỹ thuật của mình, nhất định có thể giải quyết được mâu thuẫn này.」"
# JP: 「なら呼ぶ！　いま呼ぶ！　ええと――ええと！\nきよはる――清春！」
1875 = "「Vậy thì gọi! Gọi bây giờ luôn! Ừm――ừm!\\nKiyoharu――Kiyoharu!」"
# JP: 「じゃあひとつめ！　自分は、その――\n赤井運転士のこと、下のお名前で呼びたい――です」
1877 = "「Vậy thì cái đầu tiên! Tôi, ừm――\\nMuốn gọi lái tàu Akai, bằng tên――được không.」"
# JP: 「決まってる。赤井運転士のこと。\n自分はもっと、赤井運転士とお話ししたい」
1878 = "「Rõ ràng quá rồi. Chuyện của lái tàu Akai.\\nTôi muốn được nói chuyện nhiều hơn với lái tàu Akai.」"
# JP: 「おねだり！　ふたつめ！　あの、ふたつめ！」
1880 = "「Đòi hỏi! Cái thứ hai! Cái đó, cái thứ hai!」"
# JP: 「なら、貸して」
1881 = "「Vậy, cho tôi mượn.」"
# JP: 「長く不在にさせたの、テスト頑張ってくれたから。\nだから、自分が、その分お掃除するの、当然」
1886 = "「Anh vắng nhà lâu như vậy, là vì đã cố gắng cho cuộc thử nghiệm.\\nNên, việc tôi dọn dẹp bù lại, là chuyện đương nhiên.」"
# JP: 「鉄道は経験工学。自分はその集大成。大丈夫――\nこのプランなら、ただ赤井運転士を待てばいい」
1891 = "「Đường sắt là ngành kỹ thuật dựa trên kinh nghiệm. Mình chính là sự đúc kết của những điều đó. Không sao――\\nVới kế hoạch này, chỉ cần đợi lái tàu Akai là được.」"
# JP: 「観光もいいけど、してみたいけど。\nそれよりも、おうち――清春のお家、見てみたい！」
1897 = "「Tham quan cũng được, tôi cũng muốn thử.\\nNhưng hơn thế nữa, nhà――tôi muốn xem nhà của Kiyoharu!」"
# JP: 「電車区長！？\nなんで！？　なんで電車区長！？」
1900 = "「Đoạn trưởng xe điện!?\\nTại sao!? Tại sao lại là Đoạn trưởng xe điện!?」"
# JP: 「おねだり！」
1903 = "「Đòi hỏi!」"
# JP: 「ウソ！？　外したっ！！？」
1904 = "「Không thể nào!? Trượt rồi!!?」"
# JP: 体って言われたら、なんだか急に恥ずかしくなる。
2008 = "Nghe nhắc đến cơ thể, tự dưng lại thấy xấu hổ."
# JP: 知りたいし、知らなきゃいけない。\nそうしなくっちゃ、きっとずうっと、悔み続ける。
2009 = "Muốn biết, và bắt buộc phải biết.\\nNếu không làm vậy, chắc chắn mình sẽ hối hận mãi mãi."
# JP: \x%l電車;#00ffc040;電車%l;#;だけじゃない。気動車も。機関車も。\n鉄道要素がまるでない。
2012 = "Không chỉ \\x%l電車;#00ffc040;tàu điện%l;#;. Toa xe tự hành cũng không. Đầu máy cũng không.\\nHoàn toàn không có chút yếu tố đường sắt nào."
# JP: せっかくの楽しい思い出を、\n暗転させずにすむように、って。
2015 = "Để những kỷ niệm vui vẻ này,\\nkhông bị chuyển thành tồi tệ."
# JP: いや、諦めるのよくない。\nギリギリまで、粘ってみるべき。
2018 = "Không, bỏ cuộc là không tốt.\\nNên kiên trì thử cho đến phút cuối cùng."
# JP: 言ってくれた！　ニイロクって。\n嬉しい、嬉しい、嬉しい、嬉しい！！
2026 = "Anh ấy gọi rồi! Là Niiroku.\\nVui quá, vui quá, vui quá, vui quá!!"
# JP: 最後の前に、今日の、って。\n今日の最後のおねだりって！！
2027 = "Trước chữ 'cuối cùng', là chữ 'hôm nay'.\\nĐòi hỏi cuối cùng của 'hôm nay'!!"
# JP: 今までの９本と、変わらぬ挙動。\n落ち着いて、それをトレースすればいいだけ。
2035 = "Hành động giống hệt như 9 lần trước.\\nChỉ cần bình tĩnh và lặp lại y như vậy là được."
# JP: もやもやしてたのが、ちょっと変わる。\nなくなったんじゃなくって、もっと膨らんで。
2038 = "Cảm giác bứt rứt trong lòng, đã có chút thay đổi.\\nKhông phải là biến mất, mà là phình to hơn."
# JP: 一緒に旅行したらこんなに！\n赤井運転士――ううん、清春が近くなった！！
2040 = "Chỉ cần đi du lịch cùng nhau là thế này đây!\\nLái tàu Akai――không, Kiyoharu đã trở nên gần gũi hơn rồi!!"
# JP: けど――聞きたいって、\nやっぱり深く、自分の[コア]核が、囁いてる。
2043 = "Nhưng――vẫn muốn hỏi,\\ntừ sâu thẳm, [lõi] cốt lõi của mình, đang thì thầm như vậy."
# JP: だけど、言いたい。伝えたい。\nこんなに熱くなるくらい、清春のこと好きだから。
2044 = "Nhưng, tôi muốn nói. Muốn cho anh ấy biết.\\nBởi vì tôi thích Kiyoharu đến mức cơ thể trở nên nóng ran thế này cơ mà."
# JP: トーストを口にくわえたままだと、\n『いっけーない！　遅刻遅刻っ』って、言えない。
2047 = "Nếu cứ ngậm bánh mì trong miệng,\\nthì không thể nói 'Chết rồi! Trễ mất trễ mất' được."
# JP: 近くになったら、もっと、もっとって。\n気持ち、どんどんふくらんでいく。
2051 = "Khi đã trở nên gần gũi hơn, lại muốn thêm, thêm nữa.\\nCảm xúc, ngày càng phình to."
# JP: うん、完璧。\nけど……一点だけ、自分のスペックでは無理だった。
2053 = "Ừm, hoàn hảo.\\nNhưng...... có một điểm duy nhất, với thông số kỹ thuật của tôi thì không thể làm được."
# JP: ん？　でも、この流れだと、\n会話、全然つながってない。
2055 = "Hửm? Nhưng mà, theo mạch này thì,\\ncâu chuyện hoàn toàn không ăn nhập với nhau."
# JP: だって――だって――
2065 = "Bởi vì――bởi vì――"
# JP: 回路、いま自分焼き切れた。\n熱暴走してエラー出て頭ぶんぶん振るしか出来ない！
2066 = "Mạch điện, giờ chắc cháy rụi luôn rồi.\\nQuá nhiệt sinh ra lỗi, chỉ có thể lắc đầu nguầy nguậy thôi!"
# JP: よかった。そうだ。そうだった。\n清春もほんとににこにこしてた、はしゃいでた。
2070 = "Tốt quá. Đúng rồi. Là vậy mà.\\nKiyoharu cũng thực sự tươi cười, rất hào hứng."
# JP: よかった。シロおねえちゃん粉蔵にいた。\n共感、邪魔にならないみたい。
2072 = "May quá. Chị Shiro đang ở Kokura.\\nCộng cảm, có vẻ không làm phiền chị ấy."
# JP: 失敗の理由は、ひどく単純。\nしかも相手は電車区長。人間だから、疲労する。
2075 = "Lý do thất bại, cực kỳ đơn giản.\\nHơn nữa đối thủ lại là Đoạn trưởng xe điện. Là con người, nên sẽ mệt mỏi."
# JP: 恥ずかしい。集中して頑張ってたのは当然のこと。\nだけど、だけど、その前に自分、寝不足だった。
2079 = "Xấu hổ quá. Việc tập trung cố gắng là điều đương nhiên.\\nNhưng mà, nhưng mà, trước đó mình đã bị thiếu ngủ."
# JP: 恥ずかしい。ほんとにぐっすり寝ちゃってたんだ。\nけど――ええと――。
2080 = "Xấu hổ quá. Mình thực sự đã ngủ say sưa.\\nNhưng――ừm――."
# JP: すごい、電車区長。\nさすがトップって初めて思った。感心した。
2086 = "Tuyệt quá, Đoạn trưởng xe điện.\\nLần đầu tiên tôi thấy ông ấy đúng là người đứng đầu. Thật đáng khâm phục."
# JP: すごい。情報密度。濃い。\nすごい、マンガ。感動的によくわかる。
2087 = "Tuyệt quá. Mật độ thông tin. Dày đặc.\\nTuyệt quá, manga. Hiểu rõ đến mức cảm động luôn."
# JP: すごい。電車区長のいってたとおり。\nシロおねえちゃんの共感どおり！
2088 = "Tuyệt quá. Đúng như lời Đoạn trưởng xe điện nói.\\nĐúng như những gì chị Shiro chia sẻ qua cộng cảm!"
# JP: 言いたい。好きって。だけど、言えない。\n怖いの、ぶくぶく湧きだしちゃう。
2089 = "Muốn nói. Là thích anh ấy. Nhưng, không thể nói.\\nSự sợ hãi, cứ sùng sục trào dâng."
# JP: 知りたい、もっと。\n自分の今の気持ちが――これが、恋なのか。
2092 = "Muốn biết, nhiều hơn nữa.\\nCảm xúc hiện tại của mình――đây, có phải là tình yêu không."
# JP: 楽しい。幸せ。\nわからないものがわかるの、楽しい。
2094 = "Vui quá. Hạnh phúc quá.\\nHiểu được những điều mình chưa biết, thật là vui."
# JP: 膨らんで――そう。\nもやもやじゃなくて、ふわふわになってる。
2098 = "Phình to hơn——đúng vậy.\\nKhông còn là bứt rứt nữa, mà trở nên lâng lâng."
# JP: ページを先までめくってみても、やっぱりおなじ。\nシロおねえちゃんが、なんか勘違いしたのかも。
2102 = "Lật tiếp mấy trang nữa, kết quả vẫn y như vậy.\\nChắc là chị Shiro đã nhầm lẫn ở đâu đó rồi."
# JP: もう少しだけ組み立てないと――
2104 = "Phải sắp xếp lại một chút mới được――"
# JP: 電車区長。また。\nああ――しかも――傘……置き傘、足しに来たんだ。
2109 = "Đoạn trưởng xe điện. Lại nữa.\\nA――hơn nữa――ô...... ông ấy mang ô dùng chung đến bổ sung."
# JP: 怖くなんてない。\n検証しなくちゃ、修正できない。
2110 = "Đâu có sợ.\\nNếu không kiểm chứng, thì không thể sửa chữa được."
# JP: 赤井運転士ともっと仲良くなるためのヒント。\nそれがもし、この中にこめられているなら――！
2119 = "Những gợi ý để trở nên thân thiết hơn với lái tàu Akai.\\nNếu như chúng được ẩn chứa trong cuốn sách này――!"
# JP: 言いたい。言えない。言えない。言いたい。\n暑い。熱い――どんどん頭がぐちゃぐちゃしてくる。
2124 = "Muốn nói. Không thể nói. Không thể nói. Muốn nói.\\nNóng quá. Nóng quá――Đầu óc tôi ngày càng trở nên rối bời."
# JP: 本当にそうか、自信がもてない。\n最新鋭機の自分がもしも、勘違いしたら恥ずかしい。
2127 = "Tôi không tự tin, liệu có thực sự là vậy không.\\nNếu cỗ máy hiện đại nhất là tôi mà lại hiểu nhầm thì xấu hổ lắm."
# JP: 一ページだって、一コマだって無駄にしない。\n全部のセリフを、全ての行動を暗記する。
2128 = "Dù chỉ một trang, hay một khung hình cũng không được bỏ lỡ.\\nPhải học thuộc lòng toàn bộ lời thoại, toàn bộ hành động."
# JP: 手を伸ばす。缶を受け取る――受け取れてるはず。\n触感・重量センサーもオフにしてるけど、大丈夫。
2131 = "Đưa tay ra. Nhận lấy cái lon――chắc là nhận được rồi.\\nDù đã tắt cảm biến xúc giác và trọng lượng, nhưng không sao."
# JP: 同じ失敗を繰り返すなんて、最新鋭機には――\nううん、鉄道従事者には許されないこと。
2133 = "Lặp lại cùng một sai lầm, đối với cỗ máy hiện đại nhất――\\nKhông, đối với người làm đường sắt là điều không thể chấp nhận được."
# JP: 回路をパチンと切り替える。\n鉄道のお勉強のためじゃなく。
2135 = "Đóng ngắt mạch điện cái tách.\\nKhông phải để học về đường sắt."
# JP: 嬉しい。ぽかぽかどんどんしてくる。\nぽかぽかが、熱くて暑くてあつくて――
2137 = "Vui quá. Cảm giác ấm áp ngày càng lan tỏa.\\nSự ấm áp đó, trở nên nóng, nóng, nóng quá――"
# JP: 終業後すぐの外出予定は確認してる。\n赤井運転士が傘を持って出てないことも。
2138 = "Đã xác nhận lịch trình đi ra ngoài ngay sau giờ làm việc.\\nCả việc lái tàu Akai không mang theo ô khi ra ngoài nữa."
# JP: プラン。実行。そこから検証した結果。\nそれを順番に話してく。
2140 = "Kế hoạch. Thực hiện. Kết quả kiểm chứng từ đó.\\nTôi kể lại mọi chuyện theo trình tự."
# JP: 清春、今。自分が「清春」っていったのに、\nニイロクって言ってくれなかった。
2143 = "Kiyoharu, lúc nãy. Mình đã gọi 'Kiyoharu' rồi,\\nmà anh ấy không chịu gọi mình là Niiroku."
# JP: 怖い、って思う。\nそれはなんだか、回路外の、もっと深くで思ってる。
2146 = "Thấy sợ.\\nCảm giác đó như đến từ một nơi sâu thẳm hơn, nằm ngoài mạch điện."
# JP: ダメ。無理。\n一番最初に、思考しちゃう。
2148 = "Không được. Không thể nào.\\nĐó là suy nghĩ đầu tiên nảy ra trong đầu tôi."
# JP: 回路が勝手に加熱して、\n論理的には飛んだ結論を勝手に出しちゃう。
2149 = "Mạch điện tự động nóng lên,\\nvà tự đưa ra một kết luận vượt xa khỏi tính logic."
# JP: 赤井運転士のことをもっと知りたい。\nもっとどんどん仲良くなりたい、この感情。
2150 = "Muốn biết nhiều hơn về lái tàu Akai.\\nMuốn ngày càng trở nên thân thiết hơn, thứ cảm xúc này."
# JP: 壁一枚の向こうには、清春がいて、\n薪を焚いてくれてるって、改めて思っちゃって。
2153 = "Nghĩ lại thì, chỉ cách một bức tường, Kiyoharu đang ở đó,\\nvà đang đun củi cho mình."
# JP: ここなら絶対、赤井運転士が通るはずだし、\nこの雨で、こんなところで長話する人もいないはず。
2154 = "Ở đây thì chắc chắn lái tàu Akai sẽ đi ngang qua,\\nvà với cơn mưa này, cũng sẽ chẳng có ai đứng nói chuyện phiếm ở một nơi như thế này."
# JP: 弾道計算。\n全ての演算機器の原点。
2157 = "Tính toán đường đạn.\\nKhởi điểm của mọi thiết bị tính toán."
# JP: 本来だったら、こんな視察に自分がいけてる事自体、\n絶対、ありえないようなこと。
2165 = "Đáng lẽ ra, việc mình có thể đi chuyến thị sát này,\\ntuyệt đối, là chuyện không thể nào xảy ra."
# JP: あとは、終業時間をまって……\nさん、にぃ、いち――よし！
2167 = "Việc còn lại là đợi đến giờ tan làm......\\nBa, hai, một――được rồi!"
# JP: 前提条件が間違ってたから、\n適切ではない結果が返った。それだけのこと。
2170 = "Vì điều kiện tiền đề đã sai,\\nnên kết quả trả về không phù hợp. Chỉ vậy thôi."
# JP: 決めたら、するだけ。自分だったら、必ず出来る。\n最新鋭で最優秀。帝鉄史上最高スペックなんだから。
2171 = "Đã quyết định rồi thì cứ làm thôi. Nếu là tôi, chắc chắn sẽ làm được.\\nLà hiện đại nhất, xuất sắc nhất. Sở hữu thông số kỹ thuật cao nhất trong lịch sử Teitetsu cơ mà."
# JP: 論理ではそう追えるのに、\n頭が勝手に、壊れたみたいにうなずいちゃってる。
2174 = "Dù logic bảo là vậy,\\nnhưng cái đầu lại tự động gật lia lịa như bị hỏng."
