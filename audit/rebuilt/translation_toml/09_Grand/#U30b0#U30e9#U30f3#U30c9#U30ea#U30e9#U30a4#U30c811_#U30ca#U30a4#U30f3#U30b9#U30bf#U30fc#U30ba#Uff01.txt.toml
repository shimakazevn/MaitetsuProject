3971 = "（Bịch, bịch, bịch, bịch）"
# JP: （ぽっ！）
3972 = "（Bộp!）"
# JP: （がちっ！）
3973 = "（Cạch!）"
# JP: （ボウっ！）
3974 = "（Phừng!）"
