2700 = "「Còn lễ kỷ niệm thì sao?\\nỞ ga Ohitoyo cũng có đúng không?」"
# JP: 「記念写真だ！\nナインスターズ一号列車が無事に走った、その記念の！」
2701 = "「Chụp ảnh lưu niệm!\\nKỷ niệm chuyến tàu Nine Stars số 1 đã chạy thành công tốt đẹp!」"
# JP: 「これです」
2702 = "「Là cái này ạ.」"
# JP: 「線路も、駅も、なにもかも。君が守ってくれていた。\nそれがなければ、何ひとつさえ始まらなかった」
2708 = "「Đường ray, nhà ga, mọi thứ. Em đã luôn bảo vệ chúng.\\nNếu không có điều đó, thì đã chẳng có chuyện gì bắt đầu cả.」"
# JP: 「ネクタイなんて、何のため――\nあ！　そっか、[やつしろ,2]八ツ城駅でのリレーのときの」
2709 = "「Thắt cà vạt làm gì chứ——\\nA! Ra vậy, là cho lúc chuyển tiếp ở ga Yatsushiro.」"
# JP: 「みくろも、知ってること全部――\nお友達にもきいて、お伝えしますね」
2715 = "「Mikuro cũng sẽ hỏi bạn bè——\\nrồi nói lại tất cả những gì mình biết cho mọi người nhé.」"
# JP: 「みくろたち、足ひっぱっちゃいませんでしたか？」
2717 = "「Bọn em có cản trở gì không ạ?」"
# JP: 「みくろ。わたくしと並びましょう」
2718 = "「Mikuro. Hãy đứng cạnh chị nào.」"
# JP: 「いつも本当にすまんが――頼む」
2722 = "「Lúc nào cũng làm phiền em thật ngại quá——nhờ em nhé.」"
# JP: 「イェイ！」
2725 = "「Yeah!」"
# JP: 「きっとだせちゃいますぅ！　だって、れいなの妹、\nガスタービンに改造されて時速150キロ出しましたから」
2727 = "「Chắc chắn là được đó nha! Vì em gái của Reina,\\nsau khi được cải tạo thành tuabin khí đã đạt vận tốc 150 km/h rồi mà.」"
# JP: 「かかるだろう。が――たとえどれほどかかろうと、\nそれを埋められる人脈と地歩を、僕らは築いている筈だ」
2729 = "「Chắc chắn là sẽ tốn. Nhưng——dù có tốn bao nhiêu đi chăng nữa,\\nchúng ta hẳn đã xây dựng được những mối quan hệ và vị thế đủ để bù đắp lại.」"
# JP: 「嬉しく楽しいことですね。\n新しい線路を走るのは」
2730 = "「Thật là một điều vui vẻ và hạnh phúc nhỉ.\\nKhi được chạy trên một đoạn đường ray mới.」"
# JP: 「はぁい！　さがしたらすぐ出せますよぉ」
2733 = "「Vâng! Nếu tìm thì sẽ ra ngay đó nha~」"
# JP: 「試験時と変わりません。機関庫を出て入換線を進み、\n後進で本線に入り、待ち受けている車輌群と連結」
2734 = "「Không có gì thay đổi so với lúc thử nghiệm ạ. Rời khỏi xưởng đầu máy, tiến vào đường dồn toa,\\nlùi vào đường chính và nối với nhóm toa xe đang chờ sẵn.」"
# JP: 「ございますが、わたくしたちは直後に運転ですので、\n参加はしないことになっております」
2735 = "「Có ạ, nhưng vì chúng ta phải lái tàu ngay sau đó,\\nnên đã được quyết định là sẽ không tham gia ạ.」"
# JP: 「\x%lブレーキ;#00ffc040;ブレーキ%l;#;、運転～～～っ――今っ！」
2738 = "「\\x%lブレーキ;#00ffc040;Phanh%l;#;, vị trí lái~~~——Ngay bây giờ!」"
# JP: 「高架標準軌専用線による、旅客超特急電車」
2739 = "「Tàu điện siêu tốc chở khách chạy trên tuyến đường ray khổ tiêu chuẩn trên cao.」"
# JP: 「試験走行は、苦労の連続だったものな」
2740 = "「Quá trình chạy thử nghiệm đúng là một chuỗi ngày vất vả mà.」"
# JP: 「あのですねぇ！\nれいな、帰りも[きょうちょう,1]協調したいですぅ」
2745 = "「Này nha!\\nLúc về Reina cũng muốn điều khiển phối hợp nữa cơ~」"
# JP: 「それを言うなら日々姫の方こそだろう。\nそのナッパ服も、実に見事に着こなしている」
2748 = "「Nói vậy thì phải là Hibiki mới đúng chứ.\\nBộ đồ bảo hộ đó, em mặc cũng cực kỳ đẹp đấy.」"
# JP: 「商談相手」
2752 = "「Đối tác làm ăn.」"
