# JP: 「ふぅん？\nねぇねぇに避けられとったと？」
1676 = "「Hừm?\\nAnh bị chị Mayami tránh mặt sao?」"
# JP: 「ああ、[いかい,1]異界シリーズの[こうぶ,1]甲部さん。\nって、え？　[さが,1]嵯峨県ゆうたら」
1678 = "「À, xưởng Koubu của dòng rượu Ikai đó hả.\\nKhoan, hả? Nhắc tới tỉnh Saga thì」"
# JP: 「それで僕は疑問に思った。何故僕は、\n真闇姉にだけ、頼らずいようと、思っていたかを」
1686 = "「Và rồi anh tự hỏi. Tại sao anh,\\nlại luôn nghĩ rằng mình không được dựa dẫm vào chị Mayami chứ.」"
# JP: 「だって、これ……すごく偏ってるから。\n[えいこく,1]詠国、フランク、[どっこく,1]髑国、[らんこく,1]乱国、イスパニャ――」
1687 = "「Bởi vì, danh sách này…… thiên vị quá.\\nEikoku (Vương quốc Anh), Frank (Pháp), Dokkoku (Đức), Rankoku (Hà Lan), Ispania (Tây Ban Nha)――」"
# JP: 「恋愛とか……今まで、全然したことないから……\nきっと、うち、めんどくさくて、ややこしかとよ？」
1688 = "「Chuyện yêu đương……từ trước đến giờ chị chưa từng trải qua……\\nChắc chắn, chị sẽ rất phiền phức và rắc rối đấy?」"
# JP: 「右田が、恩が理由であるなら。\n真闇姉だけじゃなく自分も、願いを叶えて欲しいと」
1689 = "「Nếu ân huệ của nhà Migita là lý do.\\nThì không chỉ chị Mayami, em ấy cũng muốn được tôi thực hiện ước nguyện của mình.」"
# JP: 「わたくしは、双鉄様の所有物ですから。\n双鉄様が幸せになられる道を、望むのみです」
1690 = "「Em là vật sở hữu của ngài Soutetsu.\\nEm chỉ mong ngài Soutetsu bước đi trên con đường hạnh phúc mà thôi.」"
# JP: 「日々姫が僕に、恋愛の――\n恋心の告白をしてくれた」
1691 = "「Hibiki đã tỏ tình――\\nthổ lộ tình cảm với tôi.」"
# JP: 「だって、にぃに。\nおんなじことば、二回言うけん」
1692 = "「Tại vì anh hai á.\\nCùng một câu mà anh nói tận hai lần liền.」"
# JP: 「一緒に酒を作っていて。たくさん話して、強く感じた。\n僕は真闇姉のことをもっと知りたい。近くに行きたい」
1694 = "「Cùng nhau làm rượu. Nói chuyện rất nhiều, và anh cảm nhận rất rõ.\\nAnh muốn biết nhiều hơn về chị Mayami. Muốn đến gần chị hơn.」"
# JP: 「おるとよー」
1696 = "「Chị đây~」"
# JP: 「新しか子に、タンクの清掃ば教えとったけん」
1698 = "「Chị đang dạy mấy đứa mới cách vệ sinh bồn ủ.」"
# JP: 「輸出か。僕はまったく未経験だが――\n浅野酒造さんが、確か[めいこく,1]冥国に出荷してるよな」
1699 = "「Xuất khẩu sao. Tôi hoàn toàn chưa có kinh nghiệm trong chuyện này――\\nNhưng hình như hãng rượu Asano có xuất hàng sang Minh Quốc thì phải.」"
# JP: 「やったばーい！」
1705 = "「Tuyệt quá rồi nè!」"
# JP: 「すごかよねぇ。ほんまこつ、\n九洲ぐるり、焼酎\x%l列車;#00ffc040;列車%l;#;でめぐれる日も近かとかもねぇ」
1708 = "「Đỉnh thật đấy. Cứ đà này,\\nngày mà \\x%l列車;#00ffc040;đoàn tàu%l;#; shochu chạy một vòng quanh Kyushu chắc cũng không còn xa nữa đâu nhỉ.」"
# JP: 「はい、喜んで。ISCと、恋の話と。\nうふふ、ダブルの祝杯ですね」
1714 = "「Vâng, rất sẵn lòng ạ. Chúc mừng ISC, và cả chuyện tình cảm nữa.\\nUfufu, nâng ly chúc mừng kép luôn nhỉ.」"
# JP: 「よしっ！」
1715 = "「Tốt!」"
# JP: 「僕でよければ、話を聞くぞ？\n話せば、思考を整頓できる」
1716 = "「Nếu không phiền, em có thể nói cho anh nghe không?\\nNói ra rồi, em sẽ sắp xếp lại được những suy nghĩ của mình đấy.」"
# JP: 「優勝したら、徹夜で祝杯も大歓迎やったとけどねぇ」
1719 = "「Nếu mà vô địch thì chị rất sẵn lòng thức trắng đêm để nâng ly chúc mừng đấy.」"
# JP: 「背中ば誰かが押さんと――きっと、\nふたりとも、幸せば我慢しちゃうもんねぇ」
1720 = "「Nếu không có ai đẩy lưng họ―― chắc chắn,\\ncả hai người đó, sẽ lại nhẫn nhịn hạnh phúc của chính mình mất.」"
# JP: 「それを知ったら――」
1722 = "「Nếu biết được điều đó――」"
# JP: 「それが何なのかわかったら――\n兄さんは、どうするつもりなんですか？」
1724 = "「Nếu biết được thứ đó là gì――\\nAnh hai, định sẽ làm gì?」"
# JP: 「なにが、右田と？」
1726 = "「Cái gì mà, nhà Migita cơ?」"
# JP: 「本当にだな。と、いうことでポーレットから、\nさらなる話を預かってきている」
1727 = "「Đúng là vậy. Và, Paulette\\ncòn gửi gắm thêm một chuyện nữa.」"
# JP: 「すみません。\n立ち聞きするつもりはなかったのですが――」
1733 = "「Em xin lỗi.\\nEm không cố ý nghe lén đâu ạ――」"
# JP: 「ところで、何と？」
1734 = "「Thế, có chuyện gì vậy?」"
# JP: 「そう、七県めの参加だ。\nこれで九洲全県に、焼酎\x%l列車;#00ffc040;列車%l;#;が走ることになる」
1735 = "「Đúng vậy, tỉnh thứ bảy tham gia rồi.\\nThế này thì \\x%l列車;#00ffc040;đoàn tàu%l;#; shochu sẽ chạy khắp toàn bộ các tỉnh ở Kyushu luôn.」"
# JP: 「ポーちゃん、ちょこっとお願いできる？　フランク語か、\nでなけりゃ、あきらめるしかなか言葉やけん」
1738 = "「Pau-chan, giúp chị một chút được không? Hình như là tiếng Frank (tiếng Pháp),\\nnếu không phải thì đành chịu thua thôi, vì chị chẳng hiểu từ nào cả.」"
# JP: 「ふかみちゃん。にーさん。どぎゃんして\n呆れたような顔しとーと？」
1740 = "「Fukami. Anh hai. Sao hai người\\nlại làm cái mặt ngạc nhiên thế kia?」"
# JP: 「好きに……ゆーても――」
1743 = "「Dù em có bảo là……thoải mái chọn――」"
# JP: 「ラムネどこばい？　うちたちお酒ばまだのめんばい」
1753 = "「Nước Ramune đâu rồi nè? Tụi em chưa được uống rượu đâu nha.」"
# JP: 「なになに、なんね？」
1760 = "「Gì thế gì thế, là gì vậy?」"
# JP: 「どうした？　真闇姉」
1761 = "「Sao vậy? Chị Mayami.」"
# JP: 「なになに、なにが起きるんですかぁ？」
1762 = "「Sao sao, có chuyện gì xảy ra vậy ạ?」"
# JP: 「焼酎\x%l列車;#00ffc040;列車%l;#;、また参加者が増えてくれたと？」
1768 = "「\\x%l列車;#00ffc040;Đoàn tàu%l;#; shochu, lại có thêm người tham gia sao?」"
# JP: 「わ、わたくしは\n皆を止めようとしたのでございますよ！？」
1771 = "「E-Em\\nđã cố cản mọi người lại rồi đấy ạ!?」"
# JP: 「多分、異性への憧れ程度なのだと思う。\n他に何かが起きていたなら、消し飛んでしまう程度の」
1773 = "「Chắc là, chỉ ở mức độ ngưỡng mộ người khác phái thôi.\\nNếu có chuyện gì khác xảy ra, thì cũng chỉ đến mức tan biến mất thôi.」"
# JP: 「僕もわからん。が、ポーレット、ハチロク、れいなは、\n『Ｆ・スコッティ』という\x%lレイルロオド;#00ffc040;レイルロオド%l;#;を推していた」
1776 = "「Tôi cũng không rõ. Nhưng mà, Paulette, Hachiroku và Reina,\\nđều đề cử một \\x%lレイルロオド;#00ffc040;Railord%l;#; 『F. Scotty』.」"
# JP: 「手配しておこう。\nっと……ひとまずはこんなところかな」
1778 = "「Để tôi sắp xếp cho.\\nỪm……trước mắt thì chắc là đến đây thôi.」"
# JP: 「代わるか？\n掃除番の仕事であれば、僕にも教えられる」
1779 = "「Để tôi thay chị nhé?\\nNếu là việc hướng dẫn dọn dẹp thì tôi cũng làm được.」"
# JP: 「私、兄さんに教えてあげたかっただけですから」
1780 = "「Em, chỉ là muốn cho anh hai biết thôi mà.」"
# JP: 「あなたが好きです。家族としてってだけじゃなく、\n女として、恋人になりたいっていう意味で。好きです」
1783 = "「Em thích anh. Không chỉ như một người thân trong gia đình,\\nmà với tư cách là một người phụ nữ, em muốn trở thành người yêu của anh. Em thích anh.」"
# JP: 「僕の前では、どんな我慢もしてほしくない。\n僕は――真闇姉が大好きだから、甘やかしたい」
1785 = "「Trước mặt tôi, tôi không muốn chị phải kìm nén bất cứ điều gì.\\nVì tôi――rất thích chị Mayami, nên tôi muốn chiều chuộng chị.」"
# JP: 「出来る男と思われたいし、格好いいと感じて欲しい。\nだから僕は、真闇姉には、頼っちゃだめだと思ってた」
1786 = "「Tôi muốn được chị nghĩ là một người đàn ông có năng lực, muốn được chị thấy tôi thật ngầu.\\nVì thế nên tôi mới nghĩ rằng, mình không được phép dựa dẫm vào chị Mayami.」"
# JP: 「にぃに――ううん、兄さんと、恋を。\n恋人同士に――ずっと、なりたいって思ってて」
1788 = "「Anh hai―― à không, với anh, một tình yêu.\\nEm đã luôn, luôn muốn chúng ta―― trở thành người yêu của nhau.」"
# JP: 「僕は右田の養子で、真闇姉に守ってもらった恩がある。\nそれを返すのは、ごく当然のことだろう」
1791 = "「Tôi là con nuôi của nhà Migita, mang ơn chị Mayami đã che chở cho tôi.\\nNên việc đền đáp lại ân huệ đó, là chuyện hết sức hiển nhiên thôi.」"
# JP: 「好きというのは、異性として、側にいたいという好きだ。\n何故そう思うようになったかというと、気づいたからだ」
1794 = "「Thích ở đây là tình cảm nam nữ, là mong muốn được ở bên cạnh chị.\\nLý do tôi bắt đầu nghĩ như vậy, là vì tôi đã nhận ra.」"
# JP: 「帰った。ナビにも送らせた」
1795 = "「Về hết rồi. Tôi cũng bảo Navi đưa họ về rồi.」"
# JP: 「選べんよ。わからんもん。\n双ちゃんとポーちゃんのおすすめは？」
1799 = "「Chị không chọn được đâu. Chị có hiểu gì đâu chứ.\\nSou-chan và Pau-chan có đề xuất ai không?」"
# JP: 「ねぇねぇ、なんば言いよったと？」
1800 = "「Chị Mayami, đã nói gì vậy?」"
# JP: 「だから、ね？　にぃにっ」
1802 = "「Nên là, nhé? Anh hai.」"
# JP: 「だから、私の――願いは」
1804 = "「Nên, ước muốn―― của em là」"
# JP: 「新工場は千内で確定したという話だ。\n結果としては、三方一両得となったのではなかろうか」
1813 = "「Nghe nói nhà máy mới đã được chốt xây ở Sendai rồi.\\nKết quả là, cả ba bên đều có lợi mà.」"
# JP: 「新しい流れ、か――」
1818 = "「Luồng gió mới, sao――」"
# JP: 「八位入賞の祝杯だったら、\nコップいっぱいくらいが良かかねぇ」
1821 = "「Nếu là nâng ly chúc mừng cho vị trí thứ 8,\\nthì uống một cốc đầy là được rồi nhỉ.」"
# JP: 「携帯ば教えていいなんて言わんと、\n最初から父さんに丸投げしとけばよかったぁ」
1825 = "「Biết thế chị đã không cho số điện thoại,\\nmà cứ đùn đẩy hết cho bố từ đầu luôn cho rồi.」"
# JP: 「だな」
1826 = "「Đúng vậy.」"
# JP: 「そうか」
1827 = "「Vậy sao.」"
# JP: 「大事な話なんだ。\nつまり――僕は、真闇姉を好きだという」
1829 = "「Là một chuyện rất quan trọng.\\nNói tóm lại―― anh thích chị Mayami.」"
# JP: 「ああ。[さが,1]嵯峨県は[からつ,1]殻津鉄道と[こうぶ,1]甲部酒造さんのコンビだ」
1830 = "「Ừ. Là sự kết hợp giữa Đường sắt Karatsu và Xưởng rượu Koubu ở tỉnh Saga.」"
# JP: 「[えいこく,1]詠国の、プレジデンツファインリカーさんて。\n最低注文は何本からか問い合わせ」
1833 = "「Của hãng President Fine Liquor bên Anh Quốc.\\nHọ hỏi xem đơn hàng tối thiểu là từ bao nhiêu chai.」"
# JP: 「にぃにが言うたよ？\n話せば整頓ばできるって」
1834 = "「Anh hai nói mà?\\nChỉ cần nói ra là có thể sắp xếp lại được mà.」"
# JP: 「何が面白かったのだ？」
1837 = "「Có chuyện gì đáng cười sao?」"
# JP: 「あるぞ。当然のことだろう」
1839 = "「Có chứ. Đó là chuyện đương nhiên mà.」"
# JP: 「せっかくだ。\n祝杯を、共に願えるか？」
1843 = "「Nhân dịp này.\\nMọi người cùng nâng ly chúc mừng nhé?」"
# JP: 「平気。\n多分、ちょっと考え過ぎちゃっとるだけやけん」
1847 = "「Em không sao đâu.\\nChắc là do em suy nghĩ hơi nhiều chút thôi.」"
# JP: 「なんとまぁ、醸造タンクの中にいたのか」
1848 = "「Trời ạ, chị chui vào trong bồn ủ rượu luôn sao.」"
# JP: 「そんなことは無いし、そんなことは無い」
1849 = "「Không có chuyện đó đâu, làm gì có chuyện đó.」"
# JP: 「平気よ。双ちゃん。\nそういうとこも、みぃんなまとめて好きやけん」
1850 = "「Không sao đâu. Sou-chan.\\nĐiểm đó của em, mọi người cũng đều thích cả mà.」"
# JP: 「ポーレットはそのつもりのようだ。\nまずは、[せんだい,1]千内までを復線させると」
1856 = "「Paulette có vẻ cũng định như vậy.\\nTrước mắt, cô ấy bảo sẽ khôi phục lại tuyến đường đến tận Sendai.」"
# JP: 「流れからきっと、またいくつものひとしずくがわかれ、\nそれがまた、さらなる流れを産み出していく」
1861 = "「Từ luồng gió này chắc chắn sẽ lại tách ra thành vô số giọt nước khác,\\nvà chúng sẽ lại tạo ra những luồng gió mới mạnh mẽ hơn.」"
# JP: 「どうして……\n無論、なんですか？」
1862 = "「Tại sao lại……\\nlà tất nhiên, vậy?」"
# JP: 「描けんとは、ラベルデザインか？」
1864 = "「Không vẽ nổi, là thiết kế nhãn hiệu sao?」"
# JP: 「それともうひとつ理由があると聞かせてもらって――\nそのときは僕も酔ってた気分で、何となく受け答えたが」
1869 = "「Anh còn được nghe nói là có một lý do khác nữa――\\nLúc đó anh cũng đang say, nên chỉ trả lời qua loa thôi.」"
# JP: 「それで、気づいた。義理だの恩だの関係なしに。\n僕は、真闇姉に。僕を認めてもらいたいんだ」
1870 = "「Thế nên, anh đã nhận ra. Chẳng liên quan gì đến nghĩa lý hay ân huệ cả.\\nAnh, muốn được chị Mayami. Muốn được chị công nhận.」"
# JP: 「悩んどるのって……どぎゃんこと？」
1873 = "「Phiền muộn của anh là…… chuyện gì vậy?」"
# JP: 「なにせ、鉄道と\x%lレイルロオド;#00ffc040;レイルロオド%l;#;の発祥の地だ。\n大廃線後、楽隠居をしていた\x%lレイルロオド;#00ffc040;レイルロオド%l;#;も多いらしい」
1877 = "「Dù sao thì, đó cũng là nơi bắt nguồn của đường sắt và \\x%lレイルロオド;#00ffc040;Railord%l;#; mà.\\nSau đợt đại bãi bỏ tuyến, có vẻ cũng có rất nhiều \\x%lレイルロオド;#00ffc040;Railord%l;#; lui về ở ẩn.」"
# JP: 「無論だ。僕にできることなら」
1879 = "「Tất nhiên rồi. Nếu đó là việc anh có thể làm.」"
# JP: 「当然よぉ。優勝しか狙っとらんかったけんね」
1880 = "「Tất nhiên rồi. Chị chỉ nhắm đến chức vô địch thôi mà.」"
# JP: 「無論、真闇姉の願いを叶えるべく、手伝いたい」
1881 = "「Tất nhiên là, anh muốn giúp đỡ, để biến ước muốn của chị Mayami thành hiện thực.」"
# JP: 「き、きづい――た？」
1882 = "「Nhận, nhận ra―― sao?」"
# JP: 「もう、凪ちゃん。割り込みしたらダメだよう」
1883 = "「Thôi nào, Nagi. Không được chen ngang như thế đâu.」"
# JP: 「そんな化け物の筈もあるまい。\n僕とて、一人の人間だ」
1886 = "「Làm gì có chuyện anh là quái vật như thế.\\nAnh cũng chỉ là một con người thôi.」"
# JP: 「真闇姉、いるか？」
1891 = "「Chị Mayami, có ở đó không?」"
# JP: 「真闇姉。\n僕は真闇姉に、僕の恋人になって欲しいと望んでいる」
1893 = "「Chị Mayami.\\nTôi mong chị Mayami sẽ trở thành người yêu của tôi.」"
# JP: 「わかった。気ぃつけて戻ってね。あ、せっかくやけん、\nお土産に――ああ、うん。はぁい。お願いします」
1895 = "「Con hiểu rồi. Bố đi đường cẩn thận nhé. A, nhân tiện,\\nmua quà lưu niệm cho―― a, vâng. Vâng. Con nhờ bố nhé.」"
# JP: 「八位入賞、か」
1899 = "「Lọt vào top 8, sao.」"
# JP: 「その、ＩＳＣで評価ばするお酒、\nそこと日ノ本でしか作られとらんの？」
1902 = "「Những loại rượu được ISC đánh giá,\\nchỉ được sản xuất ở những nước đó và Hinomoto thôi sao?」"
# JP: 「[えいこく,1]詠国の」
1905 = "「Anh Quốc á.」"
# JP: 「にぃににも、抱えとるような悩みって、あると？」
1907 = "「Anh hai cũng có, những phiền muộn đang phải gánh vác sao?」"
# JP: 「はぁあ――\nざぁんねん。優勝ばできんかったとかー」
1912 = "「Haaa――\\nTiếc thật đấy. Không vô địch được sao.」"
# JP: 「はぁぁ」
1913 = "「Hảảả」"
# JP: 「注文か？」
1917 = "「Đơn đặt hàng sao?」"
# JP: 「やだ、水臭かとよ、にぃに。\n私とにぃにの仲やけん」
1918 = "「Thôi đi, khách sáo quá đấy, anh hai.\\nGiữa em và anh hai với nhau mà.」"
# JP: 「ね？　双ちゃん」
1921 = "「Nhỉ? Sou-chan.」"
# JP: 「ありがとうな。日々姫」
1923 = "「Cảm ơn em nhé. Hibiki.」"
# JP: 「少しどころか、大いにだ。\x%l機関助士;#00ffc040;機関助士%l;#;としてはもちろん、\n御一夜のことを教えてもくれたし――助かってるさ」
1928 = "「Không chỉ ít nhiều đâu, mà là rất nhiều đấy. Với tư cách là \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; thì đã đành,\\nem còn dạy anh biết bao điều về Ohitoyo nữa―― anh thực sự rất biết ơn em.」"
# JP: 「お疲れ様、真闇姉」
1933 = "「Chị vất vả rồi, chị Mayami.」"
# JP: 「な――あっ――」
1947 = "「Nà――á――」"
# JP: 「それ……ば。それっ、って」
1948 = "「Cái đó…… thì. Chuyện đó, là」"
# JP: 「それだけ、\n歴史と伝統を大事にしているということなのだろう」
1949 = "「Điều đó chứng tỏ,\\nhọ rất coi trọng lịch sử và truyền thống.」"
# JP: 「これ……青か目の――\n外国の\x%lレイルロオド;#00ffc040;レイルロオド%l;#;と？」
1950 = "「Đây là……mắt xanh――\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; nước ngoài sao?」"
# JP: 「それは大丈夫。兄さんになら叶えられる……\n兄さんにしか、叶えられない願いです」
1952 = "「Chuyện đó thì không sao đâu. Nếu là anh hai thì chắc chắn sẽ làm được……\\nĐó là ước muốn mà chỉ có anh hai, mới có thể thực hiện được thôi.」"
# JP: 「そんなことなら、僕も同じだ。\n面倒でややこしくても、僕は、真闇姉と恋をしたい」
1953 = "「Chuyện đó thì anh cũng giống em thôi.\\nDù có phiền phức và rắc rối, anh vẫn muốn yêu chị Mayami.」"
# JP: 「まぁ、それはそうだな」
1954 = "「Chà, cũng đúng nhỉ.」"
# JP: 「これは――」
1955 = "「Cái này là――」"
# JP: 「それもありえん。酒は全て、同じグラスに注がれた状態、\nつまり、完全に周辺情報を遮断されて審査されるから」
1956 = "「Cũng không thể nào. Tất cả các loại rượu đều được rót vào cùng một loại ly,\\nnói cách khác, chúng được đánh giá trong tình trạng hoàn toàn bị che giấu mọi thông tin xung quanh.」"
# JP: 「なら――にぃに。これって――\nひとしずくの八位って」
1957 = "「Nếu vậy―― anh hai. Chuyện này――\\nViệc Hitoshizuku đạt hạng 8 ấy.」"
# JP: 「だったら、私も。右田日々姫も右田の娘で――\n少しは……何かで、兄さんの役にとか立ちましたよね？」
1958 = "「Nếu vậy thì, cả em nữa. Migita Hibiki cũng là con gái nhà Migita――\\nÍt nhiều gì…… em cũng từng giúp ích được gì đó cho anh hai, đúng không?」"
# JP: 「ひーちゃんがデザインしてくれたラベルも。まっこと、\n“ひとしずく”にふさわしかものになったけん」
1961 = "「Cả nhãn hiệu mà bé Hii thiết kế cho nữa. Thật sự,\\nnó đã trở thành một thứ vô cùng xứng đáng với \"Hitoshizuku\" rồi.」"
# JP: 「なら――」
1962 = "「Vậy thì――」"
# JP: 「あ、あの。わたしも、帰ろうってして。でも、\nナビさんが、『見逃すと損ですよ』っていって、それで」
1964 = "「A, à. Em cũng, định đi về rồi. Nhưng mà,\\nNavi bảo là, 『Bỏ lỡ thì phí lắm đó』, nên là」"
# JP: 「そのとき、日々姫は問うてきた。\n右田というなら、自分も同じじゃないのか――と」
1970 = "「Lúc đó, Hibiki đã hỏi tôi.\\nNếu lý do là vì nhà Migita, thì chẳng phải bản thân em ấy cũng giống vậy sao――」"
# JP: 「あのっ、私。描けそう。すごく。\nちょっと、一人にしてくれる？」
1971 = "「À này, em. Có vẻ vẽ được rồi. Rất nhiều ý tưởng luôn.\\nAnh để em một mình một lát được không?」"
# JP: 「あの、携帯。ええと、充電きれてたり、とか――」
1972 = "「À này, điện thoại. Ờm, có khi nào bị hết pin, hay gì đó――」"
# JP: 「ならば、良かった」
1973 = "「Vậy thì, tốt rồi.」"
# JP: 「でしたら、差別のような何かが？」
1975 = "「Nếu vậy, có phải là do phân biệt đối xử hay gì đó không ạ?」"
# JP: 「やったら、その子で。\n受け入れ体制のことやなんやら、先様と相談せんとね」
1976 = "「Vậy thì, chọn cô bé đó đi.\\nChắc là phải bàn bạc với bên kia về quy trình tiếp nhận và mấy thứ khác nữa nhỉ.」"
# JP: 「それでは、ひとしずくのＩＳＣ８位入賞と、\n僕と真闇姉との恋愛成就とを祝って、乾杯！」
1977 = "「Vậy thì, chúc mừng Hitoshizuku đạt giải 8 tại ISC, và\\nchúc mừng tình yêu của tôi và chị Mayami đã đơm hoa kết trái, cạn ly!」"
# JP: 「携帯を切って正解だったな。\nあのままでは、きっと寝かせてももらえなくなる」
1978 = "「Chị tắt điện thoại là đúng đắn đấy.\\nCứ để vậy thì chắc chắn đêm nay khỏi ngủ luôn.」"
# JP: 「にぃに頭よかけんね、そいで解決するだろうけど――\n私は頭わるかけん、きっと余計にぐちゃぐちゃしよると」
1980 = "「Anh hai thông minh mà, nên chắc anh sẽ giải quyết được thôi――\\nNhưng em thì ngốc lắm, chắc chắn sẽ càng làm mọi thứ rối tung lên cho xem.」"
# JP: 「ねぇねぇ――にぃにも。おめでとう」
1982 = "「Chị hai――và cả anh hai nữa. Chúc mừng hai người.」"
# JP: 「止めるフリして、一番熱心に見てたばい」
1984 = "「Ngoài miệng thì bảo cản, nhưng mà chị lại là người xem chăm chú nhất đó nha」"
# JP: 「そう考えても、やはり、悔しさも強いのか？」
1985 = "「Dù nghĩ vậy, nhưng quả nhiên sự tiếc nuối vẫn lớn hơn sao?」"
# JP: 「双鉄様、おめでとうございます」
1986 = "「Ngài Soutetsu, xin chúc mừng ngài.」"
# JP: 「せっかく――\nまた任せてもらえたけん」
1987 = "「Cất công――\\nđược mọi người tin tưởng giao phó thêm lần nữa mà.」"
# JP: 「特に肩ラベルがいい。\n“繋がっている”という感じを受ける」
1989 = "「Đặc biệt là nhãn dán ở vai chai rất đẹp.\\nNó mang lại cảm giác \"đang kết nối\".」"
# JP: 「まず、整頓できることと解決できることとは別だ。\n次に、日々姫の頭は悪くない」
1994 = "「Thứ nhất, việc sắp xếp lại suy nghĩ và việc giải quyết vấn đề là hai chuyện khác nhau.\\nThứ hai, Hibiki không hề ngốc.」"
# JP: 「っ！」
1995 = "「Ư!」"
# JP: 「っ！！！」
1996 = "「Ư!!!」"
# JP: 「っ！！？」
1997 = "「Ư!!?」"
# JP: 「ナビが？　ああ……そうか――\n僕はおそらく、わかりやすい類の人間なのだな」
1999 = "「Navi á? A……Ra vậy――\\nCó lẽ anh thuộc tuýp người dễ đoán quá nhỉ.」"
# JP: 「Yes――Yes――\nThank you for your Inquiry.BYE」
2000 = "「Yes――Yes――\\nThank you for your Inquiry. BYE.」"
# JP: 『「かんぱーい！」\n「かんぱーい！」』
2005 = "『「Cạn ly!」\\n「Cạn ly!」』"
# JP: 『「うおっ！？」\n「きゃっ！？」』
2007 = "『「Uây!?」\\n「Á!?」』"
# JP: 安全圏の義妹のポジションにサラリと戻って、\n義妹として今までどおり、大事にされたがっている。
2168 = "Nhanh chóng quay trở lại vị trí an toàn là một cô em gái nuôi,\\ntôi lại muốn được anh nâng niu, chiều chuộng như từ trước đến nay với tư cách là em gái."
# JP: 雪崩れ込む。
2172 = "Cả đám ùa vào."
# JP: 放っておけば、チャンスはあるって。\n挽回できるかもしれないって。
2174 = "Cứ mặc kệ đi, rồi sẽ có cơ hội.\\nBiết đâu lại có thể vãn hồi được."
# JP: いけん――もうダメ。
2175 = "Không được rồi―― tôi không chịu nổi nữa."
# JP: さすがは老舗の酒問屋――\n蛇の道は蛇、というヤツらしい。
2180 = "Quả không hổ danh là cửa hàng bán buôn rượu lâu đời――\\nĐúng là người trong nghề có khác."
# JP: 何年も離れて暮らしても、にぃにはやっぱりにぃにやけん。\n私の一番弱いとこ、見守ってくれとった人やけん。
2184 = "Dù có sống xa nhau bao nhiêu năm đi nữa, anh hai vẫn là anh hai.\\nLà người đã luôn dõi theo những mặt yếu đuối nhất của tôi."
# JP: 鉄道も、酒造りも。\nきっと全てが、そうして変わっていくものだろう。
2185 = "Cả đường sắt, lẫn việc nấu rượu.\\nChắc chắn mọi thứ đều sẽ thay đổi theo cách như vậy."
# JP: ゆーか、え？\n整頓と解決ば別って、ほんなら――
2188 = "Ý anh là, ủa?\\nSắp xếp lại suy nghĩ và giải quyết vấn đề là khác nhau, nếu vậy thì――"
# JP: 乾杯の声、\nちりんちりんと鳴るグラスたち。
2199 = "Tiếng hô cạn ly,\\ncùng tiếng ly thủy tinh chạm nhau leng keng."
# JP: ゆっくりゆっくり、\nゆっくり私の頭ば、撫でる。
2211 = "Thật chậm rãi, thật chậm rãi,\\nchậm rãi xoa đầu tôi."
# JP: ねぇねぇと夜、会って話ばしとること。\n少しも隠さず、聞かせてくれる。
2212 = "Chuyện anh gặp và nói chuyện với chị Mayami vào ban đêm.\\nAnh kể cho tôi nghe mà không giấu giếm chút nào."
# JP: あらたまられると、自分がさっき何を言ったか――
2215 = "Bị hỏi vặn lại, tôi mới chợt nhận ra mình vừa nói cái gì――"
# JP: が――それが真闇姉の願いなら、\nもちろん、僕は叶えるのみだ。
2221 = "Nhưng――nếu đó là mong muốn của chị Mayami,\\ntất nhiên, tôi chỉ có việc đáp ứng thôi."
# JP: だけど、もうそれだけじゃなくなった――\nにぃに自身が、今はまだ気づいていなくても。
2222 = "Nhưng, giờ không chỉ có thế nữa rồi――\\nDù bản thân anh hai, hiện tại vẫn chưa nhận ra."
# JP: だが、素面でだ。\n素面で言わねば、せっかくの気持ちを歪めてしまう。
2225 = "Nhưng phải nói lúc tỉnh táo.\\nNếu không nói lúc tỉnh táo, thì tình cảm khó khăn lắm mới nhận ra này sẽ bị bóp méo mất."
# JP: だけれどやっぱり笑顔の方が見たくって、\n言葉を慌てて継ぎ足していく。
2227 = "Nhưng mà tôi vẫn muốn nhìn thấy nụ cười của chị hơn,\\nnên vội vàng nói tiếp."
# JP: けど、真闇姉だけ……\nずっと、例外だと感じてたのは――
2229 = "Nhưng, chỉ riêng chị Mayami……\\nTôi đã luôn cảm thấy chị là một ngoại lệ, là bởi vì――"
# JP: だけれど、今は――\n立派じゃなくて、全然いいから――
2232 = "Nhưng mà, hiện tại thì――\\nKhông tuyệt vời cũng chẳng sao cả――"
# JP: けれど日々姫は今はすっかり、\n元の日々姫に戻ってくれてる。
2233 = "Nhưng hiện tại, Hibiki đã hoàn toàn\\ntrở lại là Hibiki của ngày xưa."
# JP: なんだ、肝心の真闇姉がグラスを手放してしまってる。
2235 = "Sao vậy, nhân vật chính là chị Mayami lại bỏ ly xuống mất rồi."
# JP: のににぃにぃは、きょとんって、\nすごく不思議そうな顔しよる。
2237 = "Vậy mà anh hai lại tròn xoe mắt,\\ntrông ngơ ngác cực kỳ."
# JP: だけど、言う。だから、言う。\nやめろって、すごくおっきな声がガンガン聞こえてるけど。
2238 = "Nhưng, tôi vẫn sẽ nói. Chính vì vậy, tôi mới nói.\\nDù cho có một giọng nói rất lớn đang vang vọng bên tai bảo tôi dừng lại."
# JP: けど、にぃにの顔が心配そうにくもってしまって、\n私、よっぽど酷か顔ばしとった？　って、恥ずかしぅなる。
2241 = "Nhưng, vẻ mặt anh hai lại lộ rõ sự lo lắng,\\nlàm tôi tự hỏi bộ dạng mình thê thảm lắm sao? Cảm thấy xấu hổ quá đi mất."
# JP: が、今は昼間で、蔵の中。\n真闇姉の望みにすぐには、応えられない。から――
2243 = "Nhưng, bây giờ đang là ban ngày, lại ở trong xưởng rượu.\\nTôi không thể đáp ứng mong muốn của chị Mayami ngay lập tức được. Thế nên――"
# JP: だけど、尋ねずにいられない。\n答えが、多分わかってて――
2249 = "Nhưng, tôi không thể không hỏi.\\nDù có lẽ đã biết trước câu trả lời――"
# JP: ハチロク、日々姫、ポーレット、れいな、凪、ふかみ――\nたくさんの思いが、しずくが、今の流れを作ってくれたと。
2252 = "Hachiroku, Hibiki, Paulette, Reina, Nagi, Fukami――\\nRất nhiều tâm tư, rất nhiều giọt nước đã tạo nên luồng gió hiện tại."
# JP: ハチロクはわかってくれとる。\n\x%lレイルロオド;#00ffc040;レイルロオド%l;#;も、人も、そんなの関係無かけん。
2253 = "Hachiroku luôn thấu hiểu tôi.\\nDù là \\x%lレイルロオド;#00ffc040;Railord%l;#; hay con người, thì những chuyện đó cũng chẳng liên quan gì cả."
# JP: きっと、十年くらいたったら、\n私も私を、立派だった、頑張ったって振り返れる。
2259 = "Chắc chắn, khoảng mười năm nữa,\\nkhi nhìn lại, tôi cũng sẽ tự nhủ rằng mình đã rất tuyệt vời, đã rất cố gắng."
# JP: ひとしずくが一気に世界的知名度を得た影響は、\n\x%lエアクラ;#00ffc040;エアクラ%l;#;社の判断にまで、及んだのだから。
2263 = "Tầm ảnh hưởng từ việc Hitoshizuku bất ngờ nổi tiếng trên toàn thế giới,\\nđã tác động đến cả quyết định của công ty \\x%lエアクラ;#00ffc040;Aircra%l;#;."
# JP: 凪が、ふかみが、ハチロクが、\n日々姫にポーレットに、れいなまでもが。
2267 = "Nagi, Fukami, Hachiroku,\\nHibiki, Paulette, và cả Reina nữa."
# JP: 教えていい、と真闇姉が義父に言っていたのは、\nあの携帯の番号で。
2278 = "Số điện thoại mà chị Mayami bảo cha nuôi có thể tiết lộ,\\nchính là số của chiếc điện thoại di động đó."
# JP: 右田の娘と、右田の養子と。
2322 = "Con gái nhà Migita, và con nuôi nhà Migita."
# JP: いつもと同様、その推測も的を射ている。
2326 = "Vẫn như mọi khi, suy đoán đó hoàn toàn chính xác."
# JP: ああ、ほら、やっぱり。\nにぃにの顔ば、驚いて……困っとる。
2327 = "A, nhìn kìa, quả nhiên là vậy.\\nKhuôn mặt anh hai, đang ngạc nhiên…… và bối rối."
# JP: それが無理でも、振られるんでも告白は、\nもっと綺麗に、ドラマチックにしたかった。
2329 = "Dù cho điều đó là không thể, dù cho có bị từ chối đi chăng nữa, thì lời tỏ tình này,\\ntôi cũng muốn nó được diễn ra một cách đẹp đẽ và kịch tính hơn."
# JP: それは私を傷つけるって、\nそんな気がしても、どうしても。
2331 = "Dù tôi có cảm giác rằng,\\nđiều đó sẽ làm tổn thương chính mình, nhưng dù thế nào đi nữa."
# JP: 些細なドキドキさえもきっとねぇねぇは、\n大人びた仕草と余裕で、誤魔化し隠しつづけて。
2334 = "Chắc chắn chị Mayami đã luôn che giấu,\\nlấp liếm đi cả những nhịp đập con tim nhỏ bé nhất bằng phong thái người lớn và sự điềm tĩnh của mình."
# JP: ああ――私、作り笑いでこらえてる。\n自分の弱さが情けなくって、だけれどやっぱりそうしてる。
2338 = "A―― tôi, đang cố gắng gượng cười để kìm nén.\\nThấy sự yếu đuối của bản thân thật thảm hại, nhưng rốt cuộc tôi vẫn làm như vậy."
# JP: ああ――順番を間違えた。\n間違えたのだが、今さらやりなおせる筈もない。
2339 = "A―― tôi nói sai trình tự mất rồi.\\nSai thì cũng sai rồi, giờ có muốn làm lại cũng chẳng được."
# JP: これ、やばい――
2341 = "Thế này, tệ thật――"
# JP: ああ、それに――
2342 = "À, hơn nữa――"
# JP: 好きなのは、幸せになって欲しいのは、\nにぃに一人だけじゃないから。
2348 = "Người mà tôi thích, người mà tôi mong muốn được hạnh phúc,\\nkhông chỉ có một mình anh hai."
# JP: 突っ伏しとるとこ見せたくなかけん、\n体ば一気に跳ね起こす。
2352 = "Không muốn bị nhìn thấy bộ dạng đang gục mặt xuống bàn,\\ntôi lập tức bật người ngồi thẳng dậy."
# JP: ズルかことして落ち込ませて、それで勝ったって思うほど、\nねぇねぇのことを、侮辱みたいにしたくないから――
2353 = "Dùng thủ đoạn hèn hạ để làm chị ấy suy sụp, rồi tự cho mình là người chiến thắng,\\ntôi không muốn sỉ nhục chị Mayami đến mức đó――"
# JP: にぃに、だって……にぃにって、だって、\nこっちが悲しくなるくらい、自分を殺す人やったけん。
2354 = "Anh hai, bởi vì…… anh hai, bởi vì,\\nlà người luôn kìm nén bản thân đến mức khiến người khác phải thấy xót xa mà."
# JP: それほどまでに伝統的で保守的なISCで――\n日ノ本の国の[スピリッツ,1]焼酎が果たして受け入れられるものか。
2361 = "Tại một ISC mang đậm tính truyền thống và bảo thủ đến mức đó――\\nLiệu shochu của đất nước Hinomoto có thực sự được chấp nhận hay không."
# JP: このタイミングは、あるいは非常識なのだろうか。\nわからない。経験が無いし、勉強できることでも無いし。
2363 = "Lựa chọn thời điểm này, liệu có phải là thiếu suy nghĩ không.\\nTôi không biết. Tôi chẳng có kinh nghiệm, mà đây cũng không phải thứ có thể học được."
# JP: 凪とふかみにもそわそわが伝染してしまう。
2364 = "Sự bồn chồn đó cũng lây sang cả Nagi và Fukami."
# JP: 恩。義務。役に立つ。\nにぃにの、いつでも言っていること。
2366 = "Ân huệ. Nghĩa vụ. Trở nên có ích.\\nNhững điều mà anh hai lúc nào cũng nói."
# JP: 言いつつ、ボトルの口を切る。
2374 = "Vừa nói, chị vừa mở nắp chai."
# JP: 大事なことを教えてもらって、\n２、３日だけはぎくしゃくとして。
2375 = "Sau khi được dạy cho một bài học quan trọng,\\nchỉ trong 2, 3 ngày chúng tôi đã có chút ngượng ngùng."
# JP: 耳打ち。\n途端、耳から僕は酔わされる。
2378 = "Chị ấy thì thầm vào tai tôi.\\nNgay lập tức, tôi như bị chuốc say từ đôi tai."
# JP: きょとんとした目が僕へ向く。\n途端に、頭がぐるぐる回る。
2380 = "Đôi mắt tròn xoe ngơ ngác hướng về phía tôi.\\nNgay lập tức, đầu óc tôi quay cuồng."
# JP: 片手の全てを折りたたみ、\nそして、一、ニ――
2382 = "Gập hết một bàn tay,\\nrồi, một, hai――"
# JP: がっかりした声。\nそれにぞわぞわ、心が弾む。
2384 = "Giọng điệu thất vọng của chị ấy.\\nLại làm trái tim tôi rộn ràng, xao xuyến."
# JP: 既に酔ってしまったように、\n濡れて揺れてる大きな瞳が。
2386 = "Đôi mắt to tròn, ươn ướt và rung rinh,\\nnhư thể chị đã say mèm từ lúc nào."
# JP: 何に？　と瞳が問うてくる。
2387 = "Nhận ra điều gì? Đôi mắt chị như đang gặng hỏi."
# JP: 喉が、動く。\nごくりと大きな音をたて、真闇姉がつばを飲み落とす。
2390 = "Cổ họng chị ấy chuyển động.\\nChị Mayami nuốt nước bọt, phát ra một tiếng ực rõ to."
# JP: 小さな頷き。\n真闇姉の唇が、声を出さずに形を変える。
2391 = "Một cái gật đầu nhẹ.\\nĐôi môi chị Mayami mấp máy nhưng không phát ra thành tiếng."
# JP: 言って、こくこく小さな頷き。
2394 = "Nói rồi, chị ấy gật đầu nhè nhẹ."
# JP: 泣き声になったら、きっともっと困らせちゃうけん――\nぐって、お腹の底に力ばいれて、言う。
2398 = "Nếu bật khóc thì chắc chắn sẽ càng làm anh ấy bối rối hơn――\\nTôi lấy hết sức bình sinh, dồn nén xuống tận đáy lòng, và nói."
# JP: “右田”であることが理由なら、\n日々姫にだって、僕は頼らずいたはずだ。
2400 = "Nếu lý do là vì \"nhà Migita\",\\nthì đáng ra tôi cũng không được dựa dẫm vào Hibiki mới phải."
# JP: そこをもう少し考えたのなら、\nもっと、ずうっと悲しくなる。
2401 = "Cứ suy nghĩ thêm về điều đó,\\ntôi lại càng thấy buồn hơn nữa."
# JP: にぃにを幸せにできるのが。隣でずうっと笑ってるのが。\n……私だったら、もっと良かった。
2403 = "Người có thể mang lại hạnh phúc cho anh hai. Người luôn cười đùa bên cạnh anh.\\n……Giá như là tôi, thì tốt biết mấy."
# JP: 泣いてるとこば見せたらきっと、\nにぃにぃ、余計な気遣いするけん――
2404 = "Nếu để anh hai thấy mình khóc, chắc chắn,\\nanh ấy sẽ lại bận tâm những chuyện không đâu mất――"
# JP: 切羽詰まったような顔。\nひどく、出しづらそうな声。
2412 = "Gương mặt như thể bị dồn vào đường cùng.\\nGiọng nói cất lên đầy khó khăn."
# JP: 喜ぶべきか、悔やむべきか。\n戸惑っている間隙に、またも携帯が鳴り響く。
2413 = "Nên vui mừng, hay nên tiếc nuối.\\nGiữa lúc còn đang bối rối, điện thoại lại một lần nữa đổ chuông."
# JP: 履歴書、というか身上書。\n分厚い束をまとめて渡せば、真闇姉の目が丸くなる。
2419 = "Sơ yếu lý lịch, hay đúng hơn là hồ sơ cá nhân.\\nKhi tôi đưa cho chị Mayami một xấp dày cộp, mắt chị ấy tròn xoe."
# JP: 年長組はひとしずく、学園生たちは蒸気ラムネで、\nそれぞれコップをなみなみ満たす。
2423 = "Nhóm người lớn thì dùng Hitoshizuku, còn nhóm học sinh thì dùng nước Ramune hơi nước,\\nrót đầy tràn vào cốc của mỗi người."
# JP: 心が、痛い。\nわかっていても、やっぱり泣きそう。
2429 = "Trái tim tôi, đau nhói.\\nDù đã biết trước kết quả, nhưng quả nhiên tôi vẫn chực trào nước mắt."
# JP: 放っておけって、\n冷えた心が囁いてくる。
2432 = "Mặc kệ đi,\\ntrái tim nguội lạnh của tôi thì thầm."
# JP: 部屋におってもなーんも浮かんで来やせんけん、\n居間ば来たけど、やっぱり変わらん。
2437 = "Dù có ở trong phòng cũng chẳng nghĩ ra được gì,\\nnên tôi mới xuống phòng khách, nhưng rốt cuộc vẫn chẳng có gì thay đổi."
# JP: 欲しがるものって――\nそれでにぃにぃを避けていたって――
2441 = "Thứ mà em gái đang muốn có――\\nVì vậy nên chị ấy mới tránh mặt anh hai sao――"
# JP: 伝わる。\nだから、僕も受け取る。
2442 = "Đã truyền đạt được.\\nVì vậy, tôi cũng đón nhận."
# JP: なんとも、微妙だ。
2445 = "Thật sự, rất khó nói."
# JP: その中僕は、\nひとり一気にコップの中身を口へと移す。
2448 = "Trong lúc đó, tôi\\nmột mình uống cạn ly rượu vào miệng."
# JP: 呼べばすぐさま、答えが返る。\nが、姿が見えるのはしばらくしてから。
2450 = "Vừa gọi một tiếng, đã có tiếng đáp lại ngay lập tức.\\nNhưng phải một lúc sau mới thấy bóng dáng chị ấy."
# JP: にぃにが戻ってくれたのかって一瞬思って、\nだけど、わたしを撫でてくれる手ば、ちいちゃくて。
2451 = "Trong một khoảnh khắc, tôi đã tưởng anh hai quay lại,\\nnhưng, bàn tay đang xoa đầu tôi, lại thật nhỏ bé."
# JP: 唇同士を密着させて、\nゆるゆる、僕は流しこむ。
2455 = "Hai đôi môi dính chặt vào nhau,\\ntôi từ từ, truyền rượu sang."
# JP: 一応は携帯を確認し、\n真闇姉は大丈夫だと、ゆったり頷き返してやる。
2458 = "Tôi cẩn thận kiểm tra lại điện thoại,\\nchị Mayami từ tốn gật đầu đáp lại rằng không sao cả."
# JP: 何をどぎゃんと描くもんか、\nちぃとも浮かんで来やせんもん。
2459 = "Phải vẽ cái gì và vẽ như thế nào,\\ntrong đầu tôi chẳng nảy ra được một chút ý tưởng nào cả."
# JP: 祝いの酒を、真闇姉へと。
2462 = "Truyền chén rượu mừng, sang cho chị Mayami."
# JP: 今だけは、私のことを見ていてもらいたくて、\nねぇねぇの名前は、口に出さない。
2464 = "Chỉ lúc này thôi, tôi muốn anh ấy chỉ nhìn về phía mình,\\nnên tôi không nói ra tên của chị Mayami."
# JP: 思わず噴き出す。\n真面目な顔して、ちょっとおかしなこというけん。
2466 = "Bất giác tôi bật cười.\\nLàm cái mặt nghiêm túc thế kia, mà lại nói ra mấy lời hơi kỳ cục."
# JP: 過去形ではなく、現在形で。
2468 = "Không phải ở thì quá khứ, mà là ở thì hiện tại."
# JP: 自分の気持ちを見つめに見つめ、\nある程度、整頓できたつもりになれた。
2472 = "Tôi đã nhìn sâu, thật sâu vào cảm xúc của chính mình,\\nvà có lẽ đã sắp xếp lại được phần nào."
# JP: 想いが、熱が、\n大好きだという気持ちによって、蒸留される。
2474 = "Tâm tư, sự nồng nhiệt,\\nđang được chưng cất bởi tình cảm vô bờ bến."
# JP: 震えている、あの真闇姉が。\nそれでも少しも、瞳は僕から逸らさずにいる。
2475 = "Chị Mayami đang run rẩy.\\nDù vậy, ánh mắt chị ấy không hề rời khỏi tôi."
# JP: 言われたら、そうなんだなぁって思わされちゃう。
2477 = "Nghe anh ấy nói vậy, tôi lại cảm thấy đúng là như thế thật."
# JP: 右田に請われ、婿入りしてきたと聞いている。\n酒問屋としての義父のスキルは、ゆえに当然、超一流だ。
2478 = "Nghe nói ông được nhà Migita mời về làm rể.\\nDo đó, kỹ năng của cha nuôi với tư cách là một người bán buôn rượu, đương nhiên là cực kỳ xuất sắc."
# JP: 声をかければ、真闇姉は携帯の電源をようやく落とし、\n長ーく体と息とを伸ばす。
2479 = "Khi tôi cất tiếng gọi, chị Mayami cuối cùng cũng tắt nguồn điện thoại,\\nvà vươn vai thở hắt ra một hơi thật dài."
# JP: 頷けばすぐコップが渡され、\nひとしずくがなみなみ注がれる。
2480 = "Vừa gật đầu, chiếc cốc đã được đưa sang,\\nvà Hitoshizuku được rót đầy ăm ắp."
# JP: あるいは、だからかえってだろうか、\nポーレットはそわそわ、落ち着かん。
2481 = "Hoặc có lẽ chính vì vậy,\\nmà Paulette lại bồn chồn, không thể ngồi yên."
# JP: だから……聞いてみたくなる。\n酷かことかも、知れんけど。
2484 = "Chính vì thế…… tôi lại muốn hỏi chị ấy.\\nDù biết đó có thể là một điều tàn nhẫn."
# JP: こっくり、頷く。\n無言で、揃って――ぽかんとしてるれいなを除いて。
2485 = "Mọi người đồng loạt gật đầu.\\nTrong im lặng, tất cả cùng lúc――ngoại trừ Reina đang ngơ ngác."
# JP: 皆が一瞬硬直する中、\nのどかにさえも聞こえる声がゆったり流れる。
2487 = "Giữa lúc mọi người đều cứng đờ trong giây lát,\\nmột giọng nói thong thả, thậm chí có phần bình thản vang lên."
# JP: 胸と胸とがくっつきそうな近くまで。\n真闇姉はそのまま僕を、見上げてくれる。
2490 = "Gần đến mức ngực hai người sắp chạm vào nhau.\\nChị Mayami cứ thế ngước lên nhìn tôi."
# JP: ＩＳＣの八位入賞。\n西鴎州の外では、初の。
2499 = "Hạng 8 ISC.\\nLà loại rượu đầu tiên ngoài khu vực Tây Oushu đạt được thành tích này."
# JP: 新入りはまず掃除番から。
2502 = "Lính mới thì bắt đầu từ việc dọn dẹp trước."
# JP: 確かに、来ている。\n僕らの想像していたよりも、ずっと大きく、強い流れが。
2505 = "Chắc chắn là nó đang đến.\\nMột luồng gió lớn và mạnh mẽ hơn rất nhiều so với những gì chúng tôi từng tưởng tượng."
# JP: 困ってくれる分だけは、にぃににとって、\n義妹じゃない私のことが、きっと残ると思うから。
2509 = "Vì sự bối rối đó chứng tỏ rằng, đối với anh hai,\\nhình bóng của tôi với tư cách không phải là em gái nuôi, chắc chắn vẫn còn đọng lại."
# JP: 与えられ、だから従ってきた関係を、\n日々姫は自ら――踏み出し、変えた。
2521 = "Mối quan hệ được ban cho, và vì thế mà tuân theo đó,\\nHibiki đã tự mình―― bước tới, và thay đổi nó."
# JP: 日々姫にぐい、と袖を引かれる。
2523 = "Hibiki giật mạnh tay áo tôi."
# JP: 日々姫の顔が曇りはじめて、凪の顔色も悪化していく。\n僕も……同じく感じてる。
2525 = "Nét mặt Hibiki bắt đầu tối sầm lại, sắc mặt Nagi cũng trở nên tệ đi.\\nTôi cũng…… có cùng cảm giác đó."
# JP: すっごく嬉しかことなのに、\nもっと良くって思うと頭ば、真っ白になってしまって。
2530 = "Rõ ràng là một chuyện vô cùng đáng mừng,\\nnhưng cứ nghĩ đến việc phải làm tốt hơn nữa, đầu óc tôi lại trở nên trống rỗng."
# JP: 時差が九時間だからええっと……\n詠国は、まだ夜六時ということになる。
2533 = "Chênh lệch múi giờ là chín tiếng, vậy thì……\\nBên Anh Quốc mới chỉ sáu giờ tối thôi."
# JP: 時計の針は、午前三時だ。
2535 = "Kim đồng hồ đã chỉ ba giờ sáng."
# JP: ふかみの手が力なく落ち、\n途端にぶはぁ、と凪が大きな息を吐く。
2552 = "Bàn tay Fukami thõng xuống một cách vô lực,\\nvà ngay lập tức, Nagi thở hắt ra một hơi thật lớn."
# JP: ＩＳＣの出展準備を邪魔しないよう、\n伝えることを、今日の今日まで我慢してきた。
2554 = "Để không làm phiền đến quá trình chuẩn bị cho ISC,\\ntôi đã kìm nén việc thổ lộ cho đến tận hôm nay."
# JP: なんでそんな――と考えたらもう、\n答えなんかは、ひとつしか無い。
2555 = "Tại sao lại làm như vậy―― khi nghĩ đến đó,\\ncâu trả lời chỉ có một mà thôi."
# JP: ここまで言って、\nどうして気づいてくれないのかって悲しくなって――
2556 = "Nói đến mức này rồi,\\nmà tại sao anh ấy vẫn không nhận ra chứ, tôi thấy thật buồn――"
# JP: 新しい命を、つなぐのだ。
2557 = "Nuôi dưỡng mầm sống mới."
# JP: 困ってる。困らせたくなんてなかったのに、\n困ってくれて、正直嬉しい。
2558 = "Anh ấy đang bối rối. Rõ ràng là tôi không hề muốn làm khó anh ấy,\\nnhưng thấy anh bối rối vì mình, thành thật mà nói tôi lại thấy vui."
# JP: 熱っぽい唇はそのままそっと、\n僕の耳元によせられる。
2563 = "Đôi môi nóng hổi ấy cứ thế nhẹ nhàng,\\nghé sát vào tai tôi."
# JP: ひどいときなんて目までキイって釣り上がりよるけん――\nにぃにぃに見せたくなかとも、わかる気がする。
2566 = "Những lúc tệ nhất, mắt chị ấy còn trợn ngược lên cơ――\\nNên em cũng hiểu được phần nào lý do chị ấy không muốn cho anh hai thấy."
# JP: ポーレットの膝の上でくたりと、\nれいなは崩れて寝こけてる。
2572 = "Nằm gọn trên đùi Paulette,\\nReina đang ngủ say sưa."
# JP: 瓶をぐるりと一周している肩ラベルでは、\n\x%l8620;#00ffc040;8620%l;#;が、周回しているレールの上を走り続ける。
2573 = "Trên nhãn dán vòng quanh vai chai,\\n\\x%l8620;#00ffc040;8620%l;#; đang tiếp tục chạy trên những đường ray uốn lượn."
# JP: そして胴ラベルでは、クマ川の水と稲穂とのイメージ上に、\n墨痕も鮮やかな『蒸気焼酎・精髄　-ひとしずく-』の名。
2578 = "Và trên nhãn dán ở thân chai, nổi bật trên hình ảnh dòng nước sông Kuma và những bông lúa trĩu hạt,\\nlà dòng chữ thư pháp sắc nét mang tên \"Shochu hơi nước・Tinh túy -Hitoshizuku-\"."
# JP: 大歓迎だ。\n是非も無い。
2579 = "Hoàn toàn hoan nghênh.\\nKhông có lý do gì để từ chối."
# JP: 真闇姉だな、とつくづく思う。\nどうせやるなら、優勝を――
2583 = "Quả đúng là chị Mayami, tôi thầm nghĩ.\\nĐã cất công làm, thì phải giành chức vô địch――"
# JP: うんうんと何度も頷き、\nそして、真闇姉はまた感嘆の息を吐く。
2599 = "Chị Mayami gật gù liên tục,\\nrồi lại thở ra một hơi cảm thán."
# JP: くったりと、真闇姉が僕に体を預けてくる。\n……この忙しさだ、無理もなかろう。
2601 = "Chị Mayami mệt mỏi dựa hẳn người vào tôi.\\n……Bận rộn đến mức này, cũng không trách được."
# JP: アルコール度数90度の一気飲みでもしたかのように、\nボっと、真闇姉が指先まで赤くなる。
2603 = "Như thể vừa nốc cạn một hơi loại rượu mạnh 90 độ,\\nchị Mayami đỏ bừng mặt, lan đến tận đầu ngón tay."
# JP: 真闇姉が指を折る。
2605 = "Chị Mayami gập ngón tay lại đếm."
# JP: 真闇姉の携帯が鳴る。
2608 = "Điện thoại của chị Mayami đổ chuông."
# JP: 真闇姉の言葉にはまるで力みが無い。\n目はやわらかに、日々姫の方へと向けられる。
2609 = "Trong lời nói của chị Mayami không hề có chút căng thẳng nào.\\nÁnh mắt chị dịu dàng, hướng về phía Hibiki."
# JP: パラパラと、書類をめくり、\nほどなく真闇姉はお手上げをする。
2612 = "Lật lật vài trang hồ sơ,\\nchẳng mấy chốc chị Mayami đã bó tay."
# JP: 人差し指を唇にやれば、\n凪もふかみもすぐさま黙る。
2613 = "Tôi đặt ngón trỏ lên môi,\\ncả Nagi và Fukami đều lập tức im lặng."
# JP: 感嘆、と。\n真闇姉は、その言葉をまさに体現している。
2615 = "Kinh ngạc, và thán phục.\\nChị Mayami đang thể hiện chính xác những từ đó."
# JP: 本当にそうだと、しみじみ感じる。\n僕というひとしずく、真闇姉というひとしずく。
2619 = "Tôi cảm nhận sâu sắc rằng điều đó hoàn toàn đúng.\\nMột giọt mang tên tôi, một giọt mang tên chị Mayami."
# JP: 不意に、猛烈に飲みたくなる。\n恥ずかしいし、いたたまれないし、息苦しい。
2626 = "Đột nhiên, tôi muốn uống một ngụm rượu thật mạnh.\\nTôi đang rất xấu hổ, bồn chồn và gần như nghẹt thở."
# JP: ひとつは……やっぱり、にぃにのこと。
2629 = "Một trong số đó…… quả nhiên là chuyện của anh hai."
# JP: そうして、それはひとしずくとなり――
2632 = "Cứ thế, nó sẽ trở thành một giọt tinh túy――"
# JP: 酒造りには一番関与の薄かった――
2639 = "Dù là người ít tham gia vào quá trình nấu rượu nhất――"
# JP: かすめるような、一瞬のキス。
2654 = "Một nụ hôn phớt qua trong khoảnh khắc."
# JP: 比べられるのが嫌なのは、認められなくて悲しかったのは、\nだって――大好きで憧れてるから。
2661 = "Lý do tôi ghét bị đem ra so sánh, lý do tôi buồn khi không được công nhận,\\nlà bởi vì―― tôi rất yêu quý và ngưỡng mộ chị ấy."
# JP: 蒸気焼酎のラベルの、新しかとを任せてもらえる。\nそれは、前のが認めてもらえたってこと。
2662 = "Được giao phó vẽ nhãn hiệu mới cho shochu hơi nước.\\nĐiều đó có nghĩa là nhãn hiệu trước đó đã được công nhận."
# JP: それがどれほど凄いことかを、\n止まない電話は、なにより雄弁に語ってくれた。
2669 = "Tiếng điện thoại reo không ngớt,\\nlà minh chứng hùng hồn nhất cho thấy điều đó tuyệt vời đến nhường nào."
# JP: 初めて話を聞いてもらった時からずっと、\nずっとずうっと、願ってたこと。
2670 = "Kể từ lần đầu tiên được anh lắng nghe tâm sự,\\ntôi đã luôn, luôn luôn ao ước điều đó."
# JP: 今度は僕からキスをして、\n真闇姉へと、言葉の代わりの答えを返す。
2671 = "Lần này tôi chủ động hôn,\\nnhư một câu trả lời thay cho lời nói gửi đến chị Mayami."
# JP: これはどうにも……\n朗報という口調ではない。
2672 = "Dù có nghĩ thế nào thì……\\nGiọng điệu này cũng không giống như đang báo tin vui."
# JP: なら、ねぇねぇも？\nけど……そぎゃんと素振り、いっかいも――っ！
2675 = "Vậy thì, cả chị Mayami cũng?\\nNhưng…… thái độ như vậy, chưa một lần nào――Ư!"
# JP: 酒の匂い。米の匂い。\n真闇姉は、飾り気の無いガラスコップを持ってくる。
2681 = "Mùi rượu. Mùi gạo.\\nChị Mayami mang ra một chiếc cốc thủy tinh giản dị."
# JP: 鉄の掟は、\x%lレイルロオド;#00ffc040;レイルロオド%l;#;が相手であっても、\n変わらず適用されるらしい。
2687 = "Quy tắc thép này, dù đối phương có là \\x%lレイルロオド;#00ffc040;Railord%l;#; đi chăng nữa,\\ncó vẻ vẫn được áp dụng không ngoại lệ."
# JP: 長い、息。\nつながっちゃったなぁ、って、思う。
2693 = "Một tiếng thở dài.\\nVậy là kết nối được rồi nhỉ, tôi nghĩ thầm."
# JP: にぃにが行っちゃう。\nあっさりと。
2696 = "Anh hai rời đi.\\nMột cách thật dễ dàng."
# JP: にぃにぃの手が伸びかけて、\n遠慮をしてるみたいにそこで、ぴたって止まる。
2698 = "Bàn tay anh hai khẽ vươn ra,\\nnhưng rồi lại khựng lại đó, như thể đang ngần ngại."
# JP: ここのところずっと、にぃにとねぇねぇ、\n真夜中の蔵で楽しげに、なんか、お話ばしとること。
2700 = "Dạo gần đây, anh hai và chị Mayami,\\nđêm nào cũng ở trong hầm rượu trò chuyện vui vẻ với nhau."
# JP: 困ったみたいに少し笑って、にぃにが話す。
2703 = "Nở nụ cười gượng gạo, anh hai bắt đầu kể."
# JP: にぃにぃの手。\nおっきな手。
2704 = "Bàn tay của anh hai.\\nMột bàn tay thật lớn."
# JP: そうしてきっと、同じくらいに長い時間を、\nねぇねぇに、我慢させて、隠させてたこと。
2706 = "Và chắc chắn, trong một khoảng thời gian dài tương đương,\\ntôi đã khiến chị Mayami phải nhẫn nhịn, phải che giấu điều đó."
# JP: 横取りのことと、わたしの告白。\n兄さんの中で、もう捻じれずに。
2708 = "Chuyện nẫng tay trên, và lời tỏ tình của tôi.\\nTrong tâm trí anh hai, chắc hẳn không còn vướng mắc gì nữa."
# JP: 事前情報に惑わされては、と、\nいままで遮断していたものだが――
2709 = "Vì sợ bị những thông tin trước đó làm phân tâm,\\nnên từ trước đến nay tôi đã cố tình không xem chúng, nhưng――"
# JP: 無論、選外よりは喜ばしいが……
2710 = "Tất nhiên là đáng mừng hơn việc bị trượt, nhưng……"
# JP: にぃにじゃなくってよかったって思ってホっとして\nだけど残念で――
2711 = "Tôi thở phào nhẹ nhõm vì may quá không phải là anh hai,\\nnhưng đồng thời cũng thấy có chút tiếc nuối――"
# JP: 蔵人たちの目は気になるが、\n後ろ頭をゆっくり撫でる。
2712 = "Dù hơi để ý ánh mắt của những người thợ nấu rượu,\\nnhưng tôi vẫn nhẹ nhàng xoa đầu chị ấy."
# JP: 私がそうしてって言ったけど、\nそれでもやっぱり本当は――っ！！？
2713 = "Rõ ràng là do tôi bảo anh ấy làm vậy,\\nnhưng sự thật là tôi vẫn――Ư!!?"
# JP: 不満顔のポーレットをなだめたつもりの言葉にけれど、\n不安を掻き立てられてしまう。
2714 = "Những lời nói nhằm xoa dịu vẻ mặt bất mãn của Paulette,\\nlại vô tình làm dấy lên sự bất an trong tôi."
# JP: いささか驚いてしまったが、\n報告をする手間がはぶけたというものだ。
2715 = "Dù có hơi bất ngờ một chút,\\nnhưng cũng đỡ mất công phải đi thông báo cho mọi người."
# JP: 口で言うのは簡単だけれど、これほどまでの難関に、\n本気の本気で挑めるものが、果たしてどれほどいるだろう。
2716 = "Nói thì dễ, nhưng với một thử thách khó khăn đến nhường này,\\nrốt cuộc có bao nhiêu người dám thực sự dốc hết sức mình để đương đầu chứ."
# JP: きっと私は傷ついて、\n兄さんのことも、傷つけるけど。
2717 = "Chắc chắn tôi sẽ bị tổn thương,\\nvà cũng sẽ làm tổn thương cả anh hai nữa."
# JP: 日々姫が指さすタブレットの画面上には、\nISCの歴代受賞酒のリストが表示されている。
2723 = "Trên màn hình máy tính bảng mà Hibiki đang chỉ vào,\\nhiển thị danh sách các loại rượu từng đoạt giải của ISC qua các năm."
# JP: 会員か会員招待でしか入れないコンテスト会場には、\n義父が向かってくれている。
2730 = "Tại hội trường cuộc thi, nơi chỉ có hội viên hoặc người được hội viên mời mới có thể vào,\\ncha nuôi đang thay chúng tôi có mặt ở đó."
# JP: 頷き。それだけ。\nだけど、受け入れてもらえた気がして、一歩近づく。
2731 = "Gật đầu. Chỉ có vậy.\\nNhưng tôi cảm giác như đã được chấp nhận, nên bước tới một bước."
# JP: （♪～～）
2743 = "（♪～～）"
# JP: （ドドドドドっ！）
2744 = "（Rầm rầm rầm rầm rầm!）"
# JP: （し～っ）
2746 = "（Suỵt~）"
# JP: （今日。だ。たとえどのようなものであれ――\n結果が出たなら、伝えるのだ）
2747 = "（Hôm nay. Chính là hôm nay. Dù cho kết quả có ra sao――\\nChỉ cần có kết quả, tôi sẽ nói ra.）"
# JP: （僕も……日々姫を見習おう）
2750 = "（Tôi cũng…… phải học tập Hibiki thôi.）"
# JP: （プツっ）
2752 = "（Tút）"
# JP: （ほんとに……ただの一回だけも……\nそんなの、だって――すごく不自然――ありえない）
2754 = "（Thật sự…… chỉ một lần cũng chưa từng……\\nNhư thế, bởi vì―― quá không tự nhiên―― không thể nào.）"
# JP: （兄さんは……自分が誰かに愛される人間なんだって――\nその考えを、きっと、どこかで見失ってるんだ）
2756 = "（Anh hai…… chắc chắn đã đánh mất đi suy nghĩ rằng――\\nbản thân mình cũng là một người được ai đó yêu thương.）"

[selections]
