# JP: 「おねえちゃんも、そうして欲しか。奥さんだけじゃ、\n全然、ちょっともたりんけん」
1202 = "\"「Chị cũng, muốn được như vậy. Chỉ làm vợ thôi thì,\\nhoàn toàn, không đủ chút nào.」\""
# JP: 「おねーちゃん、まだミルクだしてあげられんけん。\nそんかわり、ね？　こっちのミルクば」
1204 = "\"「Chị vẫn chưa có sữa cho em bú được.\\nThay vào đó, nhé? Sữa bên này của chị.」\""
# JP: 「そうちゃっ――ねっ！　ねえっ！　おね、ちゃっ――ん、\nイっちゃっ――あっ――もう、イッちゃう――からぁ！」
1213 = "\"「Sou-chan——nè! Nè! Chị——ưm,\\nRa mất——a——sắp, ra mất——rồi!」\""
# JP: 「そ、ちゃっ――フッ――はっ――あっ――んグッ――\nおね、ちゃ――っ――いっぱい――――すぎ、てっっ」
1214 = "\"「Sou, chan——phù——ha——a——ưm hự——\\nChị——Ư——đầy――――quá, rồi.」\""
# JP: 「そうちゃ――双、ちゃんっ――んっ――あっ――\n赤ちゃんば――そぎゃん、エッチな――もみもみっ」
1215 = "\"「Sou-cha——Sou, chan——ưm——a——\\nEm bé——hư hỏng quá——bóp bóp.」\""
# JP: 「双ちゃんっ――双ちゃん――双ちゃんっ――双ちゃん」
1216 = "\"「Sou-chan——Sou-chan——Sou-chan——Sou-chan.」\""
# JP: 「双ちゃん……ね――っ――は、あっ――そう、ちゃん」
1217 = "\"「Sou-chan……nè——Ư——ha, a——Sou, chan.」\""
# JP: 「双ちゃんっ！　そうちゃんっ――んっ――ふっ――あっ\nしゅきっ――好きっ――好きっ――好きぃっ！！！！」
1218 = "\"「Sou-chan! Sou-chan——ưm——phù——a\\nIêu——Yêu——Yêu——Yêu lắmmmmm!!!!」\""
# JP: 「双ちゃん、おくち……ん……\nまぁるく、もっとまあるく開いて」
1219 = "\"「Sou-chan, miệng em……ưm……\\nMở tròn ra, mở tròn ra thêm chút nữa đi.」\""
# JP: 「そーちゃんが、ずーっとそぎゃんつもりなら、\nおねーちゃんも」
1220 = "\"「Nếu Sou-chan cứ định làm thế mãi,\\nthì chị cũng...」\""
# JP: 「上側の合わせ目から……\nこの先っちょの割れ目をつうって――」
1222 = "\"「Từ rãnh nối phía trên……\\nTrượt qua cái rãnh ở phần đỉnh này——」\""
# JP: 「そん……なんっ、最初、から――やけん――んっ――\n双ちゃん、ばっ――おねーちゃんの――たったひとりの」
1224 = "\"「Chuyện……đó, ngay từ, đầu——đã vậy rồi——ưm——\\nSou-chan, là——của chị——duy nhất——」\""
# JP: 「こぎゃん、だったか」
1228 = "\"「Là thế này, phải không.」\""
# JP: 「僕も全く、同じ気持ちだ」
1230 = "\"「Tôi cũng, hoàn toàn có cùng suy nghĩ đó.」\""
# JP: 「うちも、ほしかと。\n双ちゃんとおねえちゃんの赤ちゃん」
1232 = "\"「Chị cũng, muốn có.\\nEm bé của Sou-chan và chị.」\""
# JP: 「ね？　双ちゃん。したかと？　射精。\nぴゅっぴゅっぴゅーって、たくさんたぁくさん」
1234 = "\"「Nè? Sou-chan. Em muốn làm không? Bắn tinh ấy.\\nPhụt phụt phụt, bắn thật nhiều, thật nhiều ra.」\""
# JP: 「もっと深い、取り返しのつかない刻印を、\n僕は、これから、真闇姉に――」
1236 = "\"「Một dấu ấn sâu sắc hơn, không thể xóa nhòa,\\ntôi, từ giờ, sẽ khắc lên người chị Mayami——」\""
# JP: 「僕は、真闇姉と一緒に親になりたい。\nそうして、僕らの家族を、もう一段階成長させたい」
1238 = "\"「Tôi muốn cùng chị Mayami trở thành cha mẹ.\\nVà muốn gia đình của chúng ta, phát triển thêm một bậc nữa.」\""
# JP: 「僕は、欲しい。真闇姉と僕とのこどもが」
1239 = "\"「Tôi, muốn có. Một đứa con của tôi và chị Mayami.」\""
# JP: 「愛している――」
1240 = "\"「Tôi yêu em——」\""
# JP: 「愛している。真闇」
1241 = "\"「Tôi yêu em. Mayami.」\""
# JP: 「愛しています。双鉄さん」
1242 = "\"「Em yêu anh. Anh Soutetsu.」\""
# JP: 「たくさん、たぁくさん、揉んでシゴいてあっためて、\nぎゅってぎゅーって、濃縮してあげるけんねぇ」
1243 = "\"「Chị sẽ nắn bóp, tuốt lột, ủ ấm thật nhiều, thật nhiều,\\nrồi vắt thật chặt, thật chặt, cô đặc nó lại cho em nhé.」\""
# JP: 「飽きるなどということはありえん。が――\nもし本当に、完全に好きにしてもかまわんのなら」
1245 = "\"「Không bao giờ có chuyện tôi chán đâu. Nhưng mà——\\nNếu thực sự tôi có thể hoàn toàn tùy ý làm gì cũng được.」\""
# JP: 「精液はもう、煮えたぎってる。\n真闇姉の準備がもしも整ってるなら――」
1249 = "\"「Tinh dịch đã sôi sùng sục cả lên rồi.\\nNếu chị Mayami đã chuẩn bị xong xuôi——」\""
# JP: 「わかっとぉ。そーちゃん」
1252 = "\"「Chị biết mà. Sou-chan.」\""
# JP: 「そうちゃ、の――んっ――ふっ――赤ちゃん、のっ――\nうち――がっ――おかあさんっ――なってっ――っ！！」
1254 = "\"「Của Sou-chan——ưm——phù——em bé, của——\\nChị——sẽ——trở thành——mẹ——Ư!!」\""
# JP: 「なぁ、真闇姉」
1255 = "\"「Này, chị Mayami.」\""
# JP: 「いつでも、僕は種付けできる。真闇姉の一番奥に、\nどろっどろに粘っこい精子を、いくらだって射精する」
1259 = "\"「Bất cứ lúc nào, tôi cũng có thể gieo giống được. Vào tận nơi sâu nhất của chị Mayami,\\ntôi sẽ bắn ra bao nhiêu tinh trùng đặc sệt và nhớp nháp cũng được.」\""
# JP: 「しないよな。するわけがない。\nこれは男の、雄の――僕の、愛撫だ」
1264 = "\"「Sẽ không làm thế đâu nhỉ. Làm sao mà làm thế được.\\nĐây là màn dạo đầu của một người đàn ông, của một giống đực——của tôi.」\""
# JP: 「そぎゃんと！　――だって、だって、おねえちゃん」
1266 = "\"「Đúng thế đấy! ——Tại vì, tại vì, chị.」\""
# JP: 「だな、僕もそう感じている」
1268 = "\"「Đúng vậy, tôi cũng cảm thấy thế.」\""
# JP: 「この角度なら、精液が極めて逆流しづらい。\nそう考えてくれてのことか」
1270 = "\"「Với góc độ này, tinh dịch sẽ rất khó bị chảy ngược ra ngoài.\\nLà chị đã nghĩ như vậy sao.」\""
# JP: 「母乳……ん――\nおねえちゃん、今はまだ出せんばってん」
1275 = "\"「Sữa mẹ……ưm——\\nBây giờ chị vẫn chưa có sữa đâu.」\""
# JP: 「準備――ん……っふ、あ――\nおね、ちゃんの――からだも――こころ、も――」
1276 = "\"「Chuẩn bị——ưm……Fu, a——\\nCơ thể——của chị——cả trái tim, nữa——」\""
# JP: 「今は僕だけが独占している真闇姉のおっぱいを、\nいずれ僕らの赤ちゃんと共有するのかと思って少し……」
1282 = "\"「Đôi gò bồng đảo của chị Mayami mà hiện tại chỉ mình tôi được độc chiếm,\\nrồi sẽ có lúc phải chia sẻ với em bé của chúng ta, nghĩ đến đó tôi có chút……」\""
# JP: 「いいこ、いいこ。なでなで、くりくり。\nんふふっ、びくびく、気持ちよかとねー」
1283 = "\"「Ngoan lắm, ngoan lắm. Vuốt vuốt, xoa xoa.\\nƯm fufu, giật giật rồi kìa, sướng lắm đúng không.」\""
# JP: 「んもう」
1284 = "\"「Thật tình.」\""
# JP: 「真闇……」
1285 = "\"「Mayami……」\""
# JP: 「真闇姉も、だっ――くっ――はっ――\nじゅくじゅくで、どろ、どろ、で――」
1292 = "\"「Chị Mayami cũng, vậy——Ku——Ha——\\nƯớt sũng, nhầy, nhụa, rồi——」\""
# JP: 「真闇姉……」
1293 = "\"「Chị Mayami……」\""
# JP: 「真闇姉」
1294 = "\"「Chị Mayami.」\""
# JP: 「真闇っ！　真闇っ！　真闇っ！　真闇っ！！！」
1295 = "\"「Mayami! Mayami! Mayami! Mayami!!!」\""
# JP: 「双ちゃんの精子ば、ぎゅうぎゅうみちみちに濃くなって、\nおねえちゃんの卵子、間違いなく受精させてくれるまで」
1296 = "\"「Cho đến khi tinh trùng của Sou-chan trở nên đặc sệt chật ních,\\nvà chắc chắn sẽ thụ tinh cho trứng của chị mới thôi.」\""
# JP: 「見ゆるや？　ね？　双ちゃん……」
1300 = "\"「Nhìn thấy không? Nè? Sou-chan……」\""
# JP: 「あぎゃんというのは」
1302 = "\"「Như thế là sao cơ.」\""
# JP: 「ありがとう」
1305 = "\"「Cảm ơn chị.」\""
# JP: 「それっ――しゅごっ！　んっ！　ふううっ！！！\nしきゅう！　おねえちゃんの子宮！　子宮、ばっ！！！」
1313 = "\"「Cái đó——tuyệt quá! Ưm! Phùuu!!!\\nTử cung! Tử cung của chị! Tử cung, bị!!!」\""
# JP: 「よかとよ？　双ちゃん」
1314 = "\"「Không sao đâu? Sou-chan.」\""
# JP: 「新婚旅行を通じて、つくづく強く思ったのだが」
1316 = "\"「Qua chuyến tuần trăng mật này, tôi đã suy nghĩ rất nhiều.」\""
# JP: 「赤ちゃんっ――つくって――んっ――ううっ――\n双ちゃんのこと――おとうさん――にっ――して――」
1318 = "\"「Em bé——tạo ra đi——ưm——Uu——\\nLàm cho Sou-chan——trở thành——cha——đi——」\""
# JP: 「ね？　待って、いまは、おねえちゃん――\nいま、おねえちゃんぺろぺろされたらっ」
1320 = "\"「Nè? Đợi đã, bây giờ, chị——\\nBây giờ, nếu bị liếm láp thế này thì.」\""
# JP: 「ほんなら、ね？　双ちゃん」
1321 = "\"「Nếu vậy thì, nhé? Sou-chan.」\""
# JP: 「ならば存分に練習してくれ。\n僕も喜んで練習台にならせてもらう」
1322 = "\"「Vậy thì chị cứ thỏa sức luyện tập đi.\\nTôi rất sẵn lòng làm vật thí nghiệm cho chị.」\""
# JP: 「！」
1327 = "\"「!」\""
# JP: 「！？」
1328 = "\"「!?」\""
# JP: 「（はむっ）」
1330 = "\"「（Ngoạm）」\""
# JP: 熱くなってる。僕だけじゃなく、真闇姉も。\n乳首にずっと甘えていたい、その欲望に勝るほど――！！
1390 = "Nóng quá. Không chỉ mình tôi, mà cả chị Mayami cũng vậy.\\nĐến mức vượt qua cả khao khát muốn làm nũng mãi với đầu ngực của chị——!!"
# JP: 油断をすればすぐさま精を絞られる。\nけれどもまさか、こんなに早く、浅くでイケない。
1392 = "Chỉ cần lơ là một chút là tinh dịch sẽ bị vắt kiệt ngay lập tức.\\nNhưng không thể nào, không thể ra nhanh và nông thế này được."
# JP: 僕がか、あるいは真闇姉がか。\n腰を止めているのに勝手に、膣と勃起が擦り合っている。
1394 = "Là do tôi, hay là do chị Mayami.\\nDù đã dừng hông lại nhưng âm đạo và dương vật vẫn tự động cọ xát vào nhau."
# JP: 乳首が固く凝ってきたゆえ、歯を唇で包んだうえで、\nかるぅく噛みつき、自然と離れる強さで引っ張る。
1401 = "Đầu ngực đã bắt đầu cương cứng lại, tôi bọc răng bằng môi,\\ncắn nhẹ một cái, rồi kéo với lực vừa đủ để nó tự nhiên tuột ra."
# JP: 舌の上、自然に乳首がのっかっている。\n再び勝手に、唇が喉が吸引しだす。
1402 = "Đầu ngực nằm gọn gàng trên lưỡi tôi một cách tự nhiên.\\nMột lần nữa, môi và cổ họng tôi lại tự động mút mát."
# JP: 出ない母乳を、どうしても飲みたくなるのは本能だ。\nゆえ、様々に工夫を凝らし、刺激せずにはいられないのだ。
1412 = "Dù sữa không ra, nhưng bản năng vẫn khao khát được uống.\\nThế nên, tôi không thể không dùng đủ mọi cách để kích thích nó."
# JP: ぷっくり膨らみきってる乳首。全身の汗、濃い匂い。\nわかりきってる答えだけれども、声で聞きたい。
1428 = "Đầu ngực đã sưng phồng lên hết cỡ. Mồ hôi ướt đẫm toàn thân, mùi hương nồng nặc.\\nMột câu trả lời đã quá rõ ràng, nhưng tôi vẫn muốn được nghe chính miệng chị nói ra."
# JP: ああ、勝手にでは全くなかった。真闇姉が、だ――\nしづらい姿勢であろう中、それでも腰を動かして。
1458 = "À, hoàn toàn không phải tự động. Là do chị Mayami——\\nDù đang ở một tư thế khó khăn, chị ấy vẫn đang cố gắng chuyển động hông."
# JP: 唇が、喉が、思考するより早く反応してしまっている。\n本能的なものなのだろう――ならば、それに全てを任せる。
1460 = "Môi và cổ họng tôi đã phản ứng nhanh hơn cả suy nghĩ.\\nChắc hẳn là do bản năng——nếu vậy, tôi sẽ phó mặc tất cả cho nó."
# JP: 感謝とともに、熱い血が、どっと股間に流れ込む。\nガチガチになった勃起を真闇姉のおまんこに押し付ける。
1462 = "Cùng với sự biết ơn, dòng máu nóng rực cuồn cuộn dồn xuống đũng quần.\\nTôi áp dương vật đã cương cứng vào âm đạo của chị Mayami."
# JP: 精液を濃縮しているその間、真闇姉もずっと我慢していた。\n理解はすぐさまこころへ身体へ伝わっていく。
1465 = "Trong lúc cô đặc tinh dịch của tôi, chị Mayami cũng đã luôn cố gắng nhẫn nhịn.\\nSự thấu hiểu đó lập tức truyền đến cả trái tim và cơ thể tôi."
# JP: 亀頭をすりすり撫でてる指が、\nやんわり包皮から竿へと下がる。
1466 = "Ngón tay đang mơn trớn quy đầu,\\nnhẹ nhàng trượt từ bao quy đầu xuống dọc thân dương vật."
# JP: 義姉ではなく、妻でもなく、母でさえなく。\n真闇という名の、ただのおんなに。僕の、おんなに。
1472 = "Không phải chị nuôi, không phải vợ, thậm chí không phải mẹ.\\nChỉ là một người đàn bà mang tên Mayami. Người đàn bà, của tôi."
# JP: ひどく、ゆるくしかシゴいてくれない。\nあれほど望んだ直接刺激が、けれど拷問になっている。
1473 = "Chị ấy chỉ tuốt lột một cách cực kỳ hờ hững.\\nKích thích trực tiếp mà tôi khao khát đến thế, giờ đây lại trở thành một cực hình."
# JP: ごくごくゆるい一シゴキ。\nただそれだけで、精液がグっとこみ上げてくる。
1475 = "Một cú tuốt cực kỳ nhẹ nhàng.\\nChỉ vậy thôi mà tinh dịch đã cuồn cuộn dâng lên."
# JP: 同じ気持ちと感じてる。\nゆえ、布団の中で思いっきりに身を寄せていく。
1478 = "Tôi cảm nhận được chúng tôi đang có cùng chung một tâm trạng.\\nVì thế, tôi nép sát người vào chị trong lớp chăn."
# JP: 囁き。そうして指は残酷に、僕の竿から離されて――
1480 = "Tiếng thì thầm. Rồi những ngón tay tàn nhẫn rời khỏi dương vật của tôi——"
# JP: べとりと張り付くようなキス。\nそうして静かな言葉が流れる。
1483 = "Một nụ hôn dính chặt lấy nhau.\\nVà rồi những lời nói êm đềm cất lên."
# JP: 叱る口調と裏腹に、声音は色を帯びている。\n母乳を飲みたい欲求に、不純な欲が混ぜられる。
1485 = "Trái ngược với giọng điệu quở trách, âm sắc của chị lại nhuốm màu dục vọng.\\nKhao khát được uống sữa mẹ bị pha lẫn với những ham muốn không trong sáng."
# JP: わかっているといいつつ刺激は強くならない。\n腰が勝手に暴れるけれど、ゆるすぎる指は反応しない。
1486 = "Miệng thì bảo biết, nhưng kích thích vẫn chẳng mạnh lên chút nào.\\nHông tôi tự động nảy lên dữ dội, nhưng những ngón tay quá đỗi hời hợt kia chẳng hề đáp lại."
# JP: 幸せな笑み。僕の全部を包んでくれる、真闇姉の笑み。
1488 = "Một nụ cười hạnh phúc. Nụ cười của chị Mayami, bao bọc lấy toàn bộ con người tôi."
# JP: じれったい、もどかしい、亀頭だけしか弄ってもらえない。\n不満を言葉にしたいのにっ――
1490 = "Thật bứt rứt, thật khó chịu, chị ấy chỉ mơn trớn mỗi quy đầu.\\nTôi muốn thốt lên sự bất mãn này——"
# JP: 乳房に乳首にそうしたように、\nまぁるくあけた口でぺっとり、陰核周辺を包み込む。
1492 = "Giống như những gì đã làm với bầu ngực và đầu ngực,\\ntôi há to miệng tròn vo rồi mút trọn lấy vùng xung quanh âm vật."
# JP: すっかり固くなってる乳首と柔らかすぎる乳房とを、\n僕は口から離せずにいる。
1506 = "Đầu ngực đã trở nên cứng ngắc và bầu ngực thì quá đỗi mềm mại,\\nkhiến tôi không thể nào rời môi ra được."
# JP: あまりの衝動をほんの僅かでも鎮めたくって、\n亀頭ギリギリまでを引き抜き――
1511 = "Muốn làm dịu đi dù chỉ một chút sự bốc đồng quá đỗi mãnh liệt này,\\ntôi rút ra cho đến tận sát quy đầu——"
# JP: 恥ずかしい――その感覚がぞわりと強い快感に\nすぐさま変化していくことが、よりいっそうに恥ずかしい。
1512 = "Xấu hổ quá——cảm giác đó lập tức chuyển hóa thành một khoái cảm mãnh liệt,\\nđiều đó lại càng khiến tôi thấy xấu hổ hơn nữa."
# JP: 耐えていた分、揉みしだく。両手をつかってやわらかに、\n揉めば揉むほど指の隙間から溢れる乳房を
1516 = "Bù đắp cho khoảng thời gian nhẫn nhịn, tôi ra sức nắn bóp. Dùng cả hai tay nhào nặn thật mềm mại,\\ncàng bóp, bầu ngực càng trào ra qua kẽ tay."
# JP: 快感が徐々に落ち着けば、愛おしさだけが膨らんでいく。\n真闇姉の温もりが、匂いが僕に染み込んでくる。
1520 = "Khi khoái cảm dần lắng xuống, chỉ còn lại sự yêu thương dâng trào.\\nHơi ấm, mùi hương của chị Mayami thấm đẫm vào người tôi."
# JP: 絶対、真闇姉を妊娠させる。\n改めて強く意識をすれば、意識が次なる理解を招く。
1526 = "Nhất định, sẽ làm cho chị Mayami mang thai.\\nKhi ý thức mãnh liệt điều đó một lần nữa, nó lại dẫn đến một sự thấu hiểu tiếp theo."
# JP: ゆえ、吸い付きながら高速で舌を動かせば、\n真闇姉から甘やかな声が、息が漏れ出す。
1529 = "Vì thế, tôi vừa mút vừa đảo lưỡi ở tốc độ cao,\\nkhiến những âm thanh ngọt ngào và hơi thở của chị Mayami bật ra."
# JP: 動かきが再び呼応していく。\n身体が溶け合っていくごとに、気持ちも深く重なっていく。
1534 = "Những chuyển động lại một lần nữa hô ứng với nhau.\\nMỗi khi cơ thể hòa quyện, cảm xúc cũng ngày càng gắn kết sâu đậm hơn."
# JP: 重なりあってキスをする。
1535 = "Hòa quyện vào nhau và trao nhau nụ hôn."
# JP: 舌と舌とを絡め合い、唾液を呼吸を交換しまう。
1536 = "Hai chiếc lưỡi quấn quýt lấy nhau, trao đổi nước bọt và hơi thở."
# JP: 胸をもみ、腰を動かすだけしか出来ない。\n身体も心も脳内も、性欲と独占欲で埋め尽くされてる。
1538 = "Chỉ có thể nắn bóp ngực và chuyển động hông.\\nCả cơ thể, trái tim lẫn tâm trí đều bị lấp đầy bởi dục vọng và tính chiếm hữu."
# JP: 頷くかわりに乳首を吸ってべろりとねぶる。\n親指と人差し指で、ようやく締めてくれた輪は――
1540 = "Thay cho cái gật đầu, tôi mút lấy đầu ngực rồi liếm một vòng.\\nCuối cùng thì vòng tròn được tạo bởi ngón cái và ngón trỏ của chị cũng siết lại——"
# JP: 濃縮、と今聞こえた気がした。\n僕はてっきり、絞ってもらえるものだとばかり――っ！
1542 = "Cô đặc, hình như tôi vừa nghe thấy từ đó.\\nTôi cứ tưởng là sẽ được vắt kiệt chứ——Ư!"
# JP: 乾いているゆえ、欲しくなる。\n垂れる唾液を舐め取りたくて、必死になって吸い付いて
1544 = "Vì khát, nên tôi càng thèm muốn hơn.\\nMuốn liếm sạch những giọt nước bọt đang nhỏ giọt kia, tôi điên cuồng mút mát."
# JP: 揉みしだいている手のひらも切なる願いを受け取っている。\nひどく暑い。鼓動が早い。僕も真闇姉も、重なっている。
1546 = "Bàn tay đang nắn bóp cũng tiếp nhận được niềm mong mỏi tha thiết ấy.\\nNóng quá. Nhịp tim đập dồn dập. Cả tôi và chị Mayami, đang hòa làm một."
# JP: 名前を呼びたい、けれども今は声などだせない。\nだからひたすら、全部の想いを指先に込めっ――
1548 = "Tôi muốn gọi tên chị, nhưng lúc này chẳng thể cất nên lời.\\nThế nên tôi đành dồn hết mọi tâm tư vào những ngón tay——"
# JP: なにか言わねばと思うが口は、乳首と乳房に塞がれている。
1550 = "Tôi định nói gì đó nhưng miệng đã bị đầu ngực và bầu ngực chặn lại mất rồi."
# JP: いわれたとおりに口を大きく丸く開けば、\n頭を支える左手が、ゆするようにして導いてくれる。
1551 = "Tôi há to miệng tròn vo theo lời chị nói,\\nbàn tay trái đang đỡ đầu tôi khẽ đung đưa dẫn lối."
# JP: 僕もとっくにおかしくなってる。神経全部が勃起にいって、\n頭がちかちかくらんでしまい、呼吸も浅くしかできない。
1553 = "Tôi cũng phát điên từ lâu rồi. Toàn bộ dây thần kinh đều dồn vào dương vật,\\nđầu óc choáng váng, chỉ có thể thở những nhịp ngắn."
# JP: 照れを感じる。抵抗も。\nけれども父となるのなら、義弟のままでいてはいけない。
1556 = "Cảm thấy xấu hổ. Cũng có chút kháng cự.\\nNhưng nếu sắp trở thành một người cha, tôi không thể cứ mãi làm một đứa em trai nuôi được."
# JP: というか、無理だ。この乳房を乳首を、舐め回しもせず\n無心に吸い続けるなどは、それこそ赤子にも無理だろう。
1558 = "Hay nói đúng hơn là, không thể nào. Không liếm láp bầu ngực và đầu ngực này\\nmà cứ vô tư mút mãi, thì đến trẻ con cũng chẳng làm được."
# JP: 左手だけで腰を支えて、\n柔らかに押しつぶされてる乳房を思い切り揉みしだく！
1560 = "Chỉ dùng tay trái đỡ lấy hông,\\ntôi ra sức nhào nặn bầu ngực đang bị ép mềm nhũn!"
# JP: 指の間から乳首を零して挟む。\nたっぷりとした重み自体に、指を埋めさせぐにぐに弄る。
1562 = "Để đầu ngực lọt qua kẽ tay rồi kẹp chặt lại.\\nChôn vùi những ngón tay vào sức nặng đẫy đà ấy mà nắn bóp liên tục."
# JP: ぐしょ濡れの膣口に亀頭を接触させて、けれど、挿れない。\n大陰唇の割れ目に添わせ、長さいっぱいに遅く擦る。
1564 = "Áp quy đầu vào cửa mình ướt sũng, nhưng tôi không đút vào.\\nTôi trượt dọc theo rãnh môi lớn, cọ xát thật chậm rãi hết chiều dài của nó."
# JP: 単調に、ただ単調に、真闇の一番好きなリズムと速さとで。\nけれどもこの先、ここから先はっ――
1567 = "Đơn điệu, chỉ đơn điệu với nhịp điệu và tốc độ mà Mayami thích nhất.\\nThế nhưng tiếp theo đây, từ lúc này trở đi——"
# JP: 舌が勝手に動いてしまう。求める母乳は出て来ぬし、\n汗の味しかしないけれども、耳から甘味が流れ込んでくる。
1569 = "Lưỡi tôi tự động cử động. Sữa mẹ tôi mong muốn chẳng thấy đâu,\\nchỉ thấy toàn vị mồ hôi, nhưng vị ngọt ngào lại chảy vào từ đôi tai tôi."
# JP: それでも、ようやく、陰毛の先は真闇姉へと触れてくれる。\nここまでくれば、本当にあと僅か――なの、だがっ――
1571 = "Dù vậy, cuối cùng, lông mu của tôi cũng chạm vào chị Mayami.\\nĐến mức này rồi, thực sự chỉ còn một chút nữa thôi——nhưng mà——"
# JP: ひくつきとろける性器に鼻先を近づける。\nむわりと感じる雌臭さは、勃起をさらに固くさせる。
1573 = "Tôi kề mũi lại gần bộ phận sinh dục đang co giật và ướt đẫm.\\nMùi hương ngai ngái phả vào mũi càng làm dương vật của tôi thêm cương cứng."
# JP: 乳房を、乳首を、思う存分弄びつつ、\n思いっきりに腰を打ち付け最奥を押しつつグラインドする。
1574 = "Vừa thỏa sức trêu đùa bầu ngực và đầu ngực,\\ntôi vừa ra sức dập hông, ép sâu vào tận cùng rồi xoáy mạnh."
# JP: 止める。ひととき。\n腰の動きも。胸を揉む手も。
1575 = "Dừng lại. Một chốc.\\nCả chuyển động của hông. Cả bàn tay đang nắn bóp ngực."
# JP: 膣のわななきにいざなわれるまま一ミリ一ミリ進むごと、\n吐きそうな程強い射精感がこみ上げてくる。
1577 = "Mỗi một milimet tiến vào theo sự mời gọi của âm đạo đang co bóp,\\ncảm giác muốn bắn tinh lại trào dâng mãnh liệt đến mức buồn nôn."
# JP: 伝わってくる。鼓動も。熱も。切なる願いも。\n潰れる胸のやわらかさから、トクトクと流れ込んでくる。
1580 = "Tôi cảm nhận được. Nhịp đập. Hơi nóng. Cả niềm mong mỏi tha thiết.\\nTừ sự mềm mại của bộ ngực đang bị ép chặt, những cảm xúc ấy tuôn trào mạnh mẽ."
# JP: はっきり欲しがってくれている。\nきゅんきゅんわなないてるのを感じる。
1581 = "Chị ấy đang khao khát một cách rõ ràng.\\nTôi có thể cảm nhận được sự co bóp thắt chặt."
# JP: 声を出せない。歯を食いしばってしまってる。\n腰ではなくて尻の穴。そこを意識し、引き締める。
1583 = "Không thể thốt nên lời. Tôi đang phải cắn chặt răng.\\nKhông phải hông mà là lỗ hậu môn. Tôi tập trung ý thức vào đó và siết chặt lại."
# JP: 行き道をそのまま戻り、膣口へ僅かに食い込ませた亀頭に、\n真闇姉の震えが、期待が伝わってくる。
1584 = "Trượt ngược lại đường cũ, khi quy đầu vừa hơi lún vào cửa mình,\\ntôi cảm nhận được sự run rẩy, sự mong đợi của chị Mayami truyền đến."
# JP: 頷きながら、つまらぬ嫉妬を感じてしまう。\n密着しあう体と体が、あまりにやわらかく温もるゆえに。
1587 = "Vừa gật đầu, tôi lại vừa cảm thấy một sự ghen tị vô cớ.\\nBởi vì hai cơ thể đang dán sát vào nhau này quá đỗi mềm mại và ấm áp."
# JP: 新婚旅行を終えてもどった、夫婦の寝室。\nご近所とはいえ旅は旅、帰ってっきたと強く感じる。
1594 = "Phòng ngủ của hai vợ chồng sau khi kết thúc tuần trăng mật.\\nDù chỉ là đi du lịch ở gần đây, nhưng chuyến đi vẫn là chuyến đi, tôi cảm nhận rõ rệt cảm giác trở về nhà."
# JP: まだ柔らかな乳首が唇に押し付けられる。途端――
1600 = "Đầu ngực hãy còn mềm mại áp vào môi tôi. Ngay lập tức——"
# JP: すでに堪えてる射精の代わりというように、\n汗がぶわぶわ、毛穴という毛穴から吹き出してくる。
1607 = "Như để thay thế cho tinh dịch đang bị kìm nén,\\nmồ hôi túa ra đầm đìa từ từng lỗ chân lông."
# JP: にちにちと、ちゅぷちゅぷと、室内に満ちる水音は、\nその粘度と湿度を一秒ごとに増していく。のに――
1611 = "Tiếng nhóp nhép, chùn chụt của nước vang dội khắp căn phòng,\\nđộ nhớt và độ ẩm cứ tăng lên theo từng giây. Thế mà——"
# JP: 迫り上がってくる。ぐつぐつに煮えた精子が猛然と――\n真闇姉の子宮の入り口、そこにびったり亀頭を押し付けっ
1613 = "Đang trào dâng. Tinh dịch sôi sùng sục mãnh liệt trào lên——\\nCửa tử cung của chị Mayami, áp chặt quy đầu vào chỗ đó"
# JP: 愛おしすぎてなにかが爆ぜる、止まらなくなるっ！
1628 = "Đáng yêu quá mức khiến thứ gì đó bùng nổ, không thể dừng lại được nữa!"
# JP: 真闇姉が指を咥える。咥えた先から溢れる唾液が、\nおっぱいの丸みにそってとろりと流れる。
1629 = "Chị Mayami ngậm ngón tay vào miệng. Nước bọt trào ra từ ngón tay chị ngậm,\\nchảy ròng ròng dọc theo độ cong của bầu ngực."
# JP: 枕を背中の下に敷き、そこから皿に腰を高くへ――\n真闇姉は股間を掲げて、僕の眼前に差し出している。
1632 = "Kê gối dưới lưng, từ đó nâng hông lên cao hơn nữa——\\nChị Mayami nâng cao hạ bộ, phơi bày ra ngay trước mắt tôi."
# JP: 真闇姉が僕を包んでくれる。\nおっぱいで、こえで、ぬくもりで。
1634 = "Chị Mayami ôm trọn lấy tôi.\\nBằng bộ ngực, bằng giọng nói, bằng hơi ấm của chị."
# JP: 柔らかな声。小さな頷き。\nふるりとふるえた乳房が優しく、僕の顔面を擦ってくれる。
1635 = "Giọng nói dịu dàng. Một cái gật đầu khẽ. \\nBầu ngực rung rinh nhẹ nhàng cọ vào mặt tôi."
# JP: タマから肛門。両者の間を四本指が、\nわさわさ蠢く。弄くりまわす。
1638 = "Từ tinh hoàn đến hậu môn. Bốn ngón tay\\nnhung nhúc luồn lách giữa hai nơi đó. Trêu đùa vần vò."
# JP: 布団の中で、真闇姉の指が静かに動く。\nそうっと僕の勃起を取り出し、くびれに指を滑らせる。
1642 = "Trong chăn, những ngón tay của chị Mayami khẽ khàng chuyển động.\\nChị nhẹ nhàng lấy dương vật đang cương cứng của tôi ra, rồi trượt ngón tay dọc theo rãnh quy đầu."
# JP: 熱くしっとり湿る息。\nほんのわずかに、亀頭にかかりくすぐったくなる。
1644 = "Hơi thở nóng hổi và ẩm ướt.\\nPhả nhẹ vào quy đầu khiến tôi cảm thấy nhồn nhột."
# JP: 声がもう、しっとり潤い僕を湿らす。
1645 = "Giọng nói của chị ấy đã đượm vẻ ướt át, làm ướt sũng cả người tôi."
# JP: いつもながらにまろやかな真闇姉の声。\nけれども今夜混じっているのは、まどろみではなく潤いだ。
1646 = "Giọng nói của chị Mayami vẫn êm ái như mọi khi.\\nNhưng đêm nay, pha lẫn trong đó không phải là sự ngái ngủ, mà là sự ướt át."
# JP: 言葉の代わり。\nぎゅっと、ぎゅうっと、真闇姉が僕を抱きしめる。
1648 = "Thay cho lời nói.\\nChị Mayami ôm chầm lấy tôi thật chặt, thật chặt."
# JP: のろのろと真闇姉が姿勢を変える。\nおっぱいが僕から離れてしまい。その代わり――
1649 = "Chị Mayami chậm chạp thay đổi tư thế.\\nBầu ngực rời khỏi tôi. Thay vào đó——"
# JP: 叱られて、勃起が大きく震えてしまう。\nどくん、どくんと脈動だけを強く感じる。
1663 = "Bị mắng, dương vật đang cương cứng của tôi khẽ run lên.\\nTôi chỉ cảm nhận rõ từng nhịp đập thình thịch, thình thịch."
# JP: 同時にぎゅうぎゅう絞られている。発熱をしたナメクジが、\n密集しすぎて逃げ出す先を求めてうねっているような――
1665 = "Đồng thời tôi cũng bị siết chặt. Cảm giác như những con sên đang phát sốt\\nvì quá đông đúc mà quằn quại tìm đường thoát thân vậy——"
# JP: じわ、じわと。勃起が膣に呑み込まれていく。\n真闇姉の膣のわななきが、僕を招いてくれている。
1666 = "Chầm chậm, chầm chậm. Dương vật cương cứng đang dần bị âm đạo nuốt chửng.\\nSự co bóp của âm đạo chị Mayami đang mời gọi tôi."
# JP: 受け入れられる。膣の最奥、子宮口。\n途端、まるでそこに、認証装置があったかのように――
1669 = "Được tiếp nhận. Nơi sâu nhất của âm đạo, cổ tử cung.\\nNgay lập tức, như thể ở đó có một thiết bị xác thực vậy——"
