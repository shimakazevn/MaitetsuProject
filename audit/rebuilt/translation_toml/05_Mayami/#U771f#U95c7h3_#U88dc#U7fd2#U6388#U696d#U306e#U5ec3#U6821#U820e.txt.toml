2405 = "「À, cũng liên quan đến chuyện roleplay nữa nhỉ.」"
# JP: 「なるほど。やはり真闇姉に話してよかった。\n僕には全く、そうしたイメージがわかなかった」
2408 = "「Ra là vậy. Quả nhiên nói chuyện với chị Mayami là đúng đắn.\\nTôi hoàn toàn không thể tưởng tượng ra những thứ như vậy.」"
# JP: 「なるほど。そういわれれば、その通りかと思う」
2410 = "「Ra là vậy. Nghe chị nói thế, tôi nghĩ cũng đúng.」"
# JP: 「ああ、そぎゃんとだ。で、あるのにもかかわらず、\nなぜ、何の躊躇もなくヘルメットを――」
2412 = "「Đúng vậy, là thế đó. Vậy mà,\\ntại sao chị lại không hề do dự khi đội mũ bảo hiểm――」"
# JP: 「うむ？――目にゴミでも入ったのか？」
2413 = "「Hửm?――Bụi bay vào mắt à?」"
# JP: 「うむ？　……白ワイシャツに黒いスラックス――\nといった程度で問題なければ」
2416 = "「Hửm? ……Áo sơ mi trắng với quần âu đen――\\nCỡ đó thì không vấn đề gì.」"
# JP: 「む？　あれ？」
2417 = "「Hử? Ủa?」"
# JP: 「ふむ？　むぐっ」
2419 = "「Hửm? Mugu.」"
# JP: 「んー？　見どころ？」
2420 = "「Hửm? Điểm tham quan á?」"
# JP: 「うむ？」
2422 = "「Hửm?」"
# JP: 「ぴちょ、ぺちょ――ちゅうっ――ぺろろろっ！」
2424 = "「Picho, Pecho――chụụt――Perororo!」"
# JP: 「へぇーえ、ポーちゃんが」
2425 = "「Hêê, Pau-chan sao.」"
# JP: 「それはほら。おねーちゃんの腕のおかげ？」
2429 = "「Đó là nhờ. Tay nghề của chị đúng không?」"
# JP: 「それは、真闇姉が好きだからだ。好きだから、\nどうしようもなく色々な感情が沸き起こってくる」
2430 = "「Đó là vì, tôi thích chị Mayami. Vì thích,\\nnên vô vàn cảm xúc cứ thế tuôn trào không sao kiềm chế được.」"
# JP: 「そんなんは、『知っとるから』」
2431 = "「Cái đó là vì, 'Chị biết rõ' mà.」"
# JP: 「教室内では、『先生』でしょ？」
2432 = "「Trong lớp học thì phải gọi là 『Cô giáo』 chứ?」"
# JP: 「乗り疲れたか？」
2434 = "「Đi tàu mệt rồi à?」"
# JP: 「まさにだ」
2439 = "「Chính xác là vậy.」"
# JP: 「は……ぁ……」
2440 = "「Vâng……」"
# JP: 「はぁい」
2441 = "「Vâng ạ.」"
# JP: 「よかよ」
2442 = "「Được đó.」"
# JP: 「よかよ？　ぜぇんぶ、ぶつけてくれて」
2444 = "「Được chứ? Cứ trút hết vào chị đi.」"
# JP: 「そーね、双ちゃん」
2446 = "「Ừ nhỉ, Sou-chan.」"
# JP: 「おっきか――熱か――ほっぺば、焼けてしまいそお」
2448 = "「To quá――nóng quá――má chị, sắp cháy đến nơi rồi.」"
# JP: 「はぁい」
2449 = "「Vâng~」"
# JP: 「はい、双鉄さん」
2451 = "「Vâng, anh Soutetsu.」"
# JP: 「大変だった。\n妹なんていらないと、何度も何度も思ったが――」
2453 = "「Vất vả lắm chứ.\\nĐã bao lần tôi nghĩ giá như không có em gái thì tốt biết mấy――」"
# JP: 「安全が第一の使命。\n双ちゃんが、口癖みたいにいうとることよね」
2457 = "「An toàn là sứ mệnh hàng đầu.\\nCâu cửa miệng của Sou-chan mà nhỉ.」"
# JP: 「安全第一」
2458 = "「An toàn là trên hết.」"
# JP: 「全く？」
2459 = "「Hoàn toàn không á?」"
# JP: 「宝生稀咲も賛同してくれている話らしい。\n頭取――宝生元忠も巻き込めそうだと」
2469 = "「Nghe nói Houshou Kisaki cũng tán thành chuyện này.\\nCó vẻ như sẽ lôi kéo được cả Tổng giám đốc――Houshou Mototada vào nữa.」"
# JP: 「来てっ！　双ちゃんんっ！　おね、ちゃんっ、\nもう―イク――イっちゃう――けんっ――ふあっ！！」
2472 = "「Đến đi! Sou-chann! Chị, chị,\\nsắp―ra――ra mất――rồi――Fua!!」"
# JP: 「ぴゅぴゅってして、いいこいいこして、\nかわいいって、好きってたくさんいうて欲しかと！」
2474 = "「Hãy bắn vào đi, hãy dỗ dành chị đi,\\nhãy nói chị dễ thương, nói thích chị thật nhiều vào!」"
# JP: 「そ。女の子やけん、どぎゃんしてもねー」
2475 = "「Đúng rồi. Con gái mà, dù thế nào cũng sẽ để ý thôi.」"
# JP: 「そ、双ちゃん――んっ――はっ――あっ――\nだめっ――そんなのっ――んっ――おねえ、ちゃんっ」
2477 = "「S, Sou-chan――ưm――há――á――\\nkhông được――thế này――ưm――chị, á.」"
# JP: 「小さいころに、か」
2489 = "「Hồi nhỏ sao.」"
# JP: 「ね、双ちゃんっ――」
2490 = "「Này, Sou-chan――」"
# JP: 「双ちゃん……」
2491 = "「Sou-chan……」"
# JP: 「双ちゃんは……\nちっちゃかころ、どぎゃんテレビ番組見とったと？」
2492 = "「Sou-chan……\\nHồi nhỏ em hay xem chương trình tivi gì thế?」"
# JP: 「双ちゃん、双ちゃん！　おね、おねっちゃん！\nもうっ――ふ、あっ！　あっ！　もうっ、ねっ！？」
2493 = "「Sou-chan, Sou-chan! Chị, chị!\\nSắp――fua, á! Á! Sắp, rồi!?」"
# JP: 「双ちゃん、普通に男の子しとったらモテモテやけん。\nおねーちゃんのことなんて、絶対に相手になんて」
2494 = "「Sou-chan, nếu là một chàng trai bình thường thì chắc chắn sẽ đào hoa lắm.\\nLàm gì đến lượt người chị này, chắc chắn là không thèm ngó ngàng tới đâu.」"
# JP: 「難しいこと、双ちゃんはいつも、\n考えすぎてしまうけん」
2495 = "「Sou-chan lúc nào cũng,\\nnghĩ ngợi những chuyện phức tạp quá nhiều.」"
# JP: 「双ちゃん、あれ。\nあの深緑のカーテンのお部屋」
2496 = "「Sou-chan, nhìn kìa.\\nCăn phòng có rèm cửa màu xanh lá đậm đó.」"
# JP: 「双ちゃん？　はい、あーん」
2497 = "「Sou-chan? Nào, a nào.」"
# JP: 「ね？　双ちゃん。\n学園生っぽい服、用意できると？」
2498 = "「Nè? Sou-chan.\\nEm có chuẩn bị được bộ quần áo nào giống học sinh không?」"
# JP: 「そうしよう。交通困難区域であるのが幸いするぞ。\n陸の孤島の廃炭鉱。一日まるごと一組限定貸し切りだ」
2500 = "「Cứ quyết định vậy đi. Nằm trong khu vực giao thông khó khăn lại hóa ra may mắn đấy.\\nMột mỏ than bỏ hoang như ốc đảo trên cạn. Cho thuê trọn gói nguyên một ngày, giới hạn chỉ một nhóm.」"
# JP: 「廃校舎……ああ、あの規模の町ならもちろん、\n学園もあったとよねえ」
2513 = "「Trường học bỏ hoang……À, với quy mô thị trấn như vậy thì dĩ nhiên\\nlà phải có trường học rồi nhỉ.」"
# JP: 「長くても数年だろうに……\nそれほどに荒廃のペースが速いのか？」
2518 = "「Dù lâu thì cũng chỉ vài năm thôi mà……\\nTốc độ hoang tàn nhanh đến thế sao?」"
# JP: 「あさっての午後でどう？　十四時以降とか」
2520 = "「Chiều ngày mốt thì sao? Khoảng sau 14 giờ.」"
# JP: 「ならば、廃宿舎の方から抜けていこう。\nあそこも、一部の安全性は確認されてるそうだしな」
2521 = "「Vậy thì, chúng ta đi xuyên qua khu ký túc xá bỏ hoang nhé.\\nNghe nói một phần khu vực đó cũng đã được xác nhận là an toàn rồi.」"
# JP: 「御一夜市と御一夜鉄道とのさらなる発展に繋がる\n可能性のあることだからな。無論、快諾した」
2524 = "「Bởi vì chuyện này có khả năng dẫn đến sự phát triển xa hơn nữa của thành phố Ohitoyo và Đường sắt Ohitoyo mà.\\nTất nhiên là tôi đã vui vẻ nhận lời.」"
# JP: 「早、く――直接。さらけ出して」
2528 = "「Nhanh, lên――trực tiếp. Bộc lộ ra đi.」"
# JP: 「なにか……あったか？」
2532 = "「Có chuyện……gì sao?」"
# JP: 「おねえちゃんだけ、気持ちよくしてもらっちゃって」
2533 = "「Chỉ có mình chị, được sướng thôi sao.」"
# JP: 「なんというか……\nそれは――時間がもったいないような気がするな」
2534 = "「Nói sao nhỉ……\\nNhư thế――có vẻ hơi lãng phí thời gian thì phải.」"
# JP: 「発想の流れはわかるばってん、術仙廃炭鉱は……\n万が一の事故でもあったら、良か流れも水の泡とよ？」
2539 = "「Ý tưởng thì chị hiểu, nhưng mà mỏ than Jutsusen bỏ hoang thì……\\nNgộ nhỡ có tai nạn gì xảy ra, luồng sinh khí tốt đẹp này cũng đổ sông đổ bể hết đó?」"
# JP: 「知っとる、とは何をだ？」
2541 = "「Biết rõ, là biết cái gì?」"
# JP: 「なのだと思う。感謝している」
2542 = "「Tôi cũng nghĩ vậy. Cảm ơn chị nhiều.」"
# JP: 「僕も、同じだ」
2544 = "「Tôi cũng, vậy.」"
# JP: 「僕とて、こんなに綺麗な真闇姉を、\n他の誰にも見せたくはない。独り占めしたい」
2545 = "「Ngay cả tôi cũng không muốn cho ai khác nhìn thấy\\nmột chị Mayami xinh đẹp thế này đâu. Tôi muốn độc chiếm chị.」"
# JP: 「僕は、無意識に意識していた。真闇姉だけは。\nだから、甘えてはいかんと思い、背伸びをしていた」
2548 = "「Tôi đã luôn để tâm một cách vô thức. Chỉ duy nhất chị Mayami.\\nThế nên, tôi mới nghĩ mình không được phép làm nũng, và luôn cố gồng mình lên.」"
# JP: 「ならば、帰ろう。真闇姉。\n帰って一緒に、レビューを作ろう」
2551 = "「Vậy thì, về thôi. Chị Mayami.\\nVề rồi cùng nhau làm bản đánh giá nào.」"
# JP: 「かえろ、おうちに」
2552 = "「Về thôi, về nhà nào.」"
# JP: 「ほんなら、嬉しか。\n双ちゃんと、学園生活ば共有できて」
2554 = "「Vậy thì, chị vui lắm.\\nĐược chia sẻ cuộc sống học đường cùng Sou-chan.」"
# JP: 「僕は、真闇姉に甘えたい。同時に、真闇姉の前では、\nせいいっぱいに格好をつけた男でいたい」
2557 = "「Tôi muốn làm nũng với chị Mayami. Đồng thời, trước mặt chị Mayami,\\ntôi cũng muốn trở thành một người đàn ông ra dáng nhất có thể.」"
# JP: 「僕は――真闇姉を――いいや、右田真闇を、\n僕、右田双鉄の、おんなにしたい」
2559 = "「Tôi muốn――biến chị Mayami――không, Migita Mayami,\\nthành người phụ nữ của tôi, Migita Soutetsu.」"
# JP: 「おっぱいを、さらけ出したいです」
2560 = "「Em muốn bộc lộ, ngực ạ.」"
# JP: 「双ちゃんのこと」
2561 = "「Về Sou-chan đó.」"
# JP: 「していた――いや、そうできていたかはわからんが。\n恋人にしたいと望んで、努力したことは確実だろう」
2563 = "「Sẽ ngó ngàng tới chứ――không, tôi không biết mình có làm được vậy không.\\nNhưng chắc chắn tôi sẽ nỗ lực vì mong muốn được làm người yêu của chị.」"
# JP: 「わかった。遠足は楽しいものだな。\nただ、歩き。そうしながら話すというだけで、十分に」
2565 = "「Tôi hiểu rồi. Dã ngoại thật sự rất vui.\\nChỉ cần đi bộ. Vừa đi vừa trò chuyện như vậy, cũng đã quá đủ rồi.」"
# JP: 「真闇姉の弟とはいえ、僕は日々姫の兄でもあるのだ。\n上の兄弟の大変さを、振り返るにはまだまだ早いさ」
2567 = "「Dù là em trai của chị Mayami, nhưng tôi cũng là anh trai của Hibiki.\\nVẫn còn quá sớm để nhìn lại nỗi vất vả của người làm anh chị lớn.」"
# JP: 「見ていたな。確かに。夢中だった。\n路子と、テレビのチャンネルを奪い合っていた」
2569 = "「Có xem. Chắc chắn rồi. Say mê là đằng khác.\\nTôi từng tranh giành kênh tivi với Michiko.」"
# JP: 「そうしたいのはやまやまだが――\nそうしてしまえば、僕は間違いなく遅刻する」
2571 = "「Tôi cũng muốn lắm chứ――\\nNhưng nếu làm vậy, chắc chắn tôi sẽ bị muộn mất.」"
# JP: 「僕は最後までみたいのだが、路子は最初から見たい。\nその上、僕にはそこまで見ていた弱みもあったから」
2572 = "「Tôi muốn xem đến cuối, nhưng Michiko lại muốn xem từ đầu.\\nHơn nữa, tôi cũng yếu thế vì đã được xem nãy giờ rồi.」"
# JP: 「案外、ニーズがあるのかもしれんな。\n『学園生活をもう一度やりなおせる』そんな空間は」
2573 = "「Không chừng lại có nhu cầu bất ngờ đấy.\\nMột không gian có thể 『làm lại cuộc sống học đường một lần nữa』 như thế.」"
# JP: 「以前に来たのは、学園の、\n遠足かなにかでという話だったか？」
2575 = "「Lần trước chị đến đây,\\nlà đi dã ngoại của trường hay gì đó phải không?」"
# JP: 「手放しで褒めている。\n叶うのならば、モデルになって欲しいくらいだ」
2578 = "「Tôi đang khen hết lời luôn đó.\\nNếu được, tôi còn muốn nhờ chị làm người mẫu nữa cơ.」"
# JP: 「僕は――最初に……」
2579 = "「Em――đầu tiên……」"
# JP: 「僕を？」
2580 = "「Tôi á?」"
# JP: 「とても良く似合っている。かぶりこなす？　\nというと妙だが……まるでベテランのようにみえるぞ」
2582 = "「Chị đội hợp lắm đấy. Đội sành điệu?\\nNói vậy thì hơi lạ……nhưng trông chị hệt như một chuyên gia thực thụ vậy.」"
# JP: 「だから仮に僕が、平常の学園生活を送れていたら、\nまっさきに真闇姉に恋をして、焦がれていたさ」
2585 = "「Vì vậy, giả sử tôi có một cuộc sống học đường bình thường,\\nthì người đầu tiên tôi đem lòng yêu và nhung nhớ, chắc chắn là chị Mayami.」"
# JP: 「ゆえ、真闇姉に頼みたいと思っている。\n良ければ、僕と一緒に廃校舎の視察をしてほしい」
2586 = "「Thế nên, tôi muốn nhờ chị Mayami.\\nNếu được, mong chị hãy cùng tôi đi khảo sát khu trường học bỏ hoang đó.」"
# JP: 「手を、つくんだ。\nそうして、尻を――僕へと向けろ」
2590 = "「Chống tay xuống.\\nSau đó, hướng mông――về phía tôi.」"
# JP: 「ごめんね？　双ちゃん。\nけど、まだ昼間で――居間やけん」
2595 = "「Xin lỗi nhé? Sou-chan.\\nNhưng mà, vẫn đang là ban ngày――lại còn ở phòng khách nữa.」"
# JP: 「甘え、導かれるセックスだけでは――\nもう、物足りない」
2599 = "「Chỉ làm nũng, và được dẫn dắt trong tình dục thì――\\nđã không còn đủ thỏa mãn nữa rồi.」"
# JP: 「あえてのノープラン？」
2601 = "「Cố tình không lên kế hoạch à?」"
# JP: 「教える？　とは――」
2605 = "「Dạy á? Là sao――」"
# JP: 「文化祭やら、体育祭やら……例えば、御一夜鉄道の\nメンツでそれを行えるのなら、楽しそうだ」
2608 = "「Nào là lễ hội văn hóa, đại hội thể thao……Ví dụ như, nếu có thể tổ chức cùng\\nnhững thành viên của Đường sắt Ohitoyo, thì chắc sẽ vui lắm.」"
# JP: 「うむ。ゆえに、視察・レビューと言われても、\nどうしていいものか、いささか途方にくれていた」
2614 = "「Ừm. Do đó, dù có bị bảo đi khảo sát hay đánh giá,\\ntôi cũng hơi lúng túng không biết phải làm sao.」"
# JP: 「そーね」
2616 = "「Đúng vậy ha.」"
# JP: 「だな。予断を持たず、素人の目で気付きがあれば、\nそれを素直に報告すればいいかと思っている」
2618 = "「Đúng vậy. Không phán đoán trước, nếu phát hiện được gì bằng con mắt nghiệp dư,\\nthì cứ thế báo cáo lại là được.」"
# JP: 「そ。双ちゃんなら、ウチがどれほどぺしゃんこな\n髪型になったとしても、少しも変わらんいうことを」
2620 = "「Ừ. Nếu là Sou-chan, thì dù tóc chị có xẹp lép đến mức nào,\\nthái độ của em đối với chị cũng sẽ không hề thay đổi.」"
# JP: 「そうだな。ずっと良くなった。\n[うち,5]右田一酒蔵元だけを見てもそうだが――」
2624 = "「Đúng vậy. Tốt hơn rất nhiều.\\nChỉ nhìn vào xưởng rượu Migita Ichi nhà mình thôi cũng thấy vậy rồi――」"
# JP: 「ふむふむ」
2627 = "「Hừm hừm.」"
# JP: 「そぎゃんと？　嬉しかぁ。\nほんなら――このまま食べちゃお！　あむっ！」
