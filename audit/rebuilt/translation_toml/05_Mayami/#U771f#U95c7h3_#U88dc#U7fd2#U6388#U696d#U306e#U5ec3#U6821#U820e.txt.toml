2866 = "「Cứ bị――làm thế――nếu cứ tiếp tục――thế này!\\nChị sẽ, tự mình――lên đỉnh, mất thôi.」"
# JP: 「やったら、ちょこっとだけでも遠足、してみよ？\nこれも、視察のひとつになるけん」
2867 = "「Nếu vậy, thử đi dã ngoại một chút xem sao nhé?\\nĐây cũng là một phần của chuyến khảo sát mà.」"
# JP: 「やったら、その――」
2869 = "「Vậy thì, chuyện đó――」"
# JP: 「ならば――さらけ出してくれ。\n真闇姉が、真闇姉自身の――欲望を」
2870 = "「Nếu vậy――hãy bộc lộ ra đi.\\nChị Mayami, dục vọng của chính――chị Mayami.」"
# JP: 「あ、ほんなら」
2871 = "「A, nếu vậy thì.」"
# JP: 「やったら……うん。\nうちらはそん目で、視察、がんばってみよ？」
2872 = "「Nếu vậy thì……ừm.\\nChúng ta hãy thử cố gắng khảo sát với góc nhìn đó xem sao nhé?」"
# JP: 「そんなら、双ちゃん」
2873 = "「Nếu vậy thì, Sou-chan.」"
# JP: 「で、今度は学園、校舎内でしょ？　視察方針も\nあるけん――できたら、着替えたいかなって」
2874 = "「Thế, lần này là trong trường, trong phòng học nhỉ? Cũng có phương hướng khảo sát\\nrồi――nên nếu được, chị muốn thay đồ.」"
# JP: 「何年ぶりかなー。\n前来たときと、ぜぇんぜん景色が違うて見ゆるー」
2875 = "「Mấy năm rồi nhỉ.\\nSo với lần trước đến đây, cảnh sắc trông khác hẳn luôn á.」"
# JP: 「直接、子宮、に――精液、どんど、んっ、赤ちゃん、\n赤ちゃん――うちの――卵子、に、精液、きて、るっ」
2878 = "「Trực tiếp, vào tử cung――tinh dịch, ồ ạt, ưm, em bé,\\nem bé――tinh dịch, đang tiến vào, trứng――của chị, rồi.」"
# JP: 「宿舎ば出て、五分で学校。この辺の子ば、\nちょこーっと、通学路、短すぎかなー」
2882 = "「Ra khỏi ký túc xá, năm phút là đến trường. Bọn trẻ quanh đây,\\nđường đến trường có hơi quá ngắn không nhỉー.」"
# JP: 「そぎゃーんと？」
2886 = "「Thế á?」"
# JP: 「それで頼む。同じ意識で見てみても、\n僕と真闇姉とでは、やはり見えるものが違おうからな」
2888 = "「Nhờ chị vậy. Dù cùng một cách nhìn,\\nnhưng những gì tôi và chị Mayami thấy chắc chắn sẽ khác nhau.」"
# JP: 「っ！」
2889 = "「Ư!」"
# JP: 「っ！！」
2890 = "「Ư!!」"
# JP: 「っ！！？」
2891 = "「Ư!!?」"
# JP: 「！？」
2892 = "「!?」"
# JP: 「（ごくっ、ごく）――んっ！？　ん――ぷえっ！？」
2896 = "「（Ực, ực）――ưm!? Ưm――pue!?」"
# JP: 「（ごくっ）」
2897 = "「(Ực)」"
# JP: 「へーんふ、ほふひひはひへ、ひょはよよ？」
2898 = "「Hén fư, hô fư hi hi ha hi hê, hyô ha yo yo?」"
# JP: 睾丸が、片方ちゅるんと呑まれてしまう。
3053 = "Một bên tinh hoàn bị nuốt chửng cái chụt."
# JP: 一日一組の貸し切りならば、\n治安や教育的見地の問題も、自動で最小に制限できる。
3061 = "Nếu cho thuê trọn gói mỗi ngày một nhóm,\\nthì các vấn đề về trị an hay góc độ giáo dục cũng tự động được hạn chế ở mức tối thiểu."
# JP: ぽとりと、雫が床へと落ちる。\n二滴、三適。ぽたり、ぽとりと。
3063 = "Tí tách, những giọt nước rơi xuống sàn.\\nHai giọt, ba giọt. Tí tách, tí tách."
# JP: 揺すりつつ、上への動きを加えてく。\n真闇姉のおまんこを、ごしごしごしと押し上げていく。
3065 = "Vừa cọ xát, vừa đẩy ngược lên trên.\\nChà xát mạnh bạo, ép sát vào âm hộ của chị Mayami."
# JP: 通学途中のおしゃべりが、\nどれほど素敵なものであるかを、僕も体験できたから。
3068 = "Bởi vì tôi cũng đã được trải nghiệm\\nnhững cuộc trò chuyện trên đường đến trường tuyệt vời đến nhường nào."
# JP: 笑いもせず、驚きもせず、怒りもせず、迷いもせず。\n僕の欲を、真闇姉はただそのままに受け止めてくれる。
3070 = "Không cười cợt, không ngạc nhiên, không tức giận, không do dự.\\nChị Mayami cứ thế đón nhận dục vọng của tôi."
# JP: 頼まれずとも、揉む。ひたすらに。
3071 = "Không cần nhờ, tôi vẫn sẽ xoa bóp. Một cách say sưa."
# JP: 目的などは関係なしに、恋人と、友人と――\nただただ同じ時間をすごして、語らって。
3074 = "Chẳng màng đến mục đích, cùng người yêu, cùng bạn bè――\\nchỉ đơn giản là trải qua khoảng thời gian bên nhau, cùng nhau trò chuyện."
# JP: ふいに、泣きそうになってしまう。
3088 = "Đột nhiên, tôi chực trào nước mắt."
# JP: が――しかし。\nこれは……ヤる。
3090 = "Nhưng――\\nCái này……có thể làm được."
# JP: なれど、あまりに僕が不出来であった。
3092 = "Tuy nhiên, tôi lại thể hiện quá tệ."
# JP: とはいえ、真闇姉の提案だ。\nわからぬことであるからこそ、まずは素直に従おう。
3094 = "Dù sao thì, đây cũng là đề xuất của chị Mayami.\\nChính vì không hiểu, nên trước mắt cứ ngoan ngoãn nghe theo vậy."
# JP: 考え込む――その何気ない仕草からさえ、\n花の香のような色香がこぼれる。
3109 = "Đang chìm trong suy nghĩ――nhưng ngay cả cử chỉ vô tình đó,\\ncũng toát lên vẻ quyến rũ như hương hoa."
# JP: 真闇姉になら、読んでもらった方が早いし、確実だ。\n資料を渡せば真闇姉は、いったん座卓においてから、
3112 = "Nếu là chị Mayami, để chị ấy đọc sẽ nhanh và chắc chắn hơn.\\nKhi tôi đưa tài liệu, chị Mayami đặt tạm lên bàn trà, rồi,"
# JP: 精液全部を、真闇姉に呑んでもらえ――っ！？
3114 = "Toàn bộ tinh dịch, đều đã được chị Mayami nuốt trọn――Ư!?"
# JP: ガラス破損の危険を僕は思っていたが――\nなるほど確かに。その意味でも危険はあったか。
3118 = "Tôi vốn đang nghĩ đến nguy cơ vỡ kính cơ――\\nRa vậy. Nguy hiểm theo nghĩa đó cũng có nữa à."
# JP: さらけ出すより、触りたい。\nけれども、今は授業中。
3119 = "Thay vì bộc lộ, tôi muốn chạm vào hơn.\\nNhưng, bây giờ đang trong giờ học."
# JP: どれほどの無様を晒しても、\n為さねば為らぬことは、ある。
3122 = "Cho dù có phơi bày bộ dạng thảm hại đến đâu,\\ncũng có những việc bắt buộc phải làm."
# JP: 抑えようとしても顔がニヤける、\n頬が染まるのを自覚する。
3123 = "Dù cố kiềm chế nhưng mặt tôi vẫn cứ cười toe toét,\\ntôi tự nhận thức được hai má mình đang ửng đỏ."
# JP: 前のボタンが外される。\n露出した赤いブラジャーを――
3130 = "Hàng cúc trước ngực được tháo ra.\\nChiếc áo lót màu đỏ lộ ra――"
# JP: ほんの僅かを進んだ途端、真闇姉の、甘い声。\n勃起から背骨を抜けて、脳をガンガン揺らす声。
3131 = "Vừa tiến vào một chút, giọng nói ngọt ngào của chị Mayami vang lên.\\nÂm thanh truyền từ dương vật dọc theo sống lưng, làm rung chuyển cả não bộ."
# JP: 言った途端に、笑ってくれる。\nまぶしいほどに明るい顔で。
3132 = "Vừa dứt lời, chị ấy liền mỉm cười.\\nBằng một gương mặt rạng rỡ đến chói lóa."
# JP: 卵子。精液。\nその声に、精液が勢いを取り戻す。
3145 = "Trứng. Tinh dịch.\\nNhững từ ấy khiến tinh dịch lại tuôn trào mãnh liệt."
# JP: 舐め取り、呑んでくれている。\nその淫猥な光景に、萎えてた欲がすぐ立ち戻る。
3148 = "Chị ấy đang liếm sạch, rồi nuốt xuống.\\nTrước cảnh tượng dâm đãng đó, dục vọng vừa xìu xuống ngay lập tức trỗi dậy."
# JP: 肉厚の襞が指となり、\nぽてぽてぎゅうぎゅう僕の勃起を乳搾りする。
3150 = "Những nếp gấp dày cộm hóa thành những ngón tay,\\nliên tục vắt kiệt sự cương cứng của tôi."
# JP: 納得だ。凪やれいなは性差だなんだを、\n恐らくは、ほとんど意識してないのだろうし。
3151 = "Ra là vậy. Nagi và Reina có lẽ,\\nhầu như không để tâm đến những khác biệt giới tính đó."
# JP: それを感じてしまうほど――\nいつの間に、僕は完全に……勃起、している。
3152 = "Đến mức có thể cảm nhận được điều đó――\\nTừ lúc nào, tôi đã hoàn toàn……cương cứng."
# JP: なにゆえ僕に、と正直戸惑った依頼だったが、\nやる気が一気に高まってくる。
3154 = "Thành thật mà nói, lúc đầu tôi còn bối rối không hiểu sao họ lại nhờ mình,\\nnhưng giờ thì động lực đã tăng lên vùn vụt."
# JP: 逆側の玉は、やさしく揉まれる。\nふっくらあたたかな指先が、精液だまりを弄ぶ。
3161 = "Hòn ngọc bên kia, được xoa bóp nhẹ nhàng.\\nĐầu ngón tay mềm mại ấm áp, đang đùa giỡn với bầu chứa tinh dịch."
# JP: 触れ合うより先、\nヘルメット同士があたってしまう。
3163 = "Chỉ tiếc là trước khi chạm vào nhau,\\nhai chiếc mũ bảo hiểm đã đụng nhau mất rồi."
# JP: 単純すぎる前後動き。\n単純がゆえに、気持ちいい。
3165 = "Chuyển động tới lui quá đỗi đơn giản.\\nNhưng chính vì đơn giản, nên mới sướng."
# JP: 安心しきって無様を晒せる。\n安心しきって無様を晒して、相手が、そばにいる。
3167 = "Hoàn toàn an tâm để phơi bày sự thảm hại của mình.\\nCó một người ở bên cạnh để ta có thể hoàn toàn an tâm phơi bày sự thảm hại đó."
# JP: 亀頭の先端。それだけを唇でホールドされる。\nぺとりと舌が、裏筋側にくっついてくる。
3168 = "Đỉnh quy đầu. Chỉ riêng chỗ đó bị giữ chặt bởi đôi môi.\\nLưỡi áp sát vào, liếm dọc theo phần dây chằng."
# JP: 来たかと思えば緩急がつく。\n舌の動きが、頭の動作と呼応する。
3179 = "Tưởng chừng như đã đến giới hạn thì nhịp điệu lại thay đổi.\\nChuyển động của lưỡi hô ứng nhịp nhàng với chuyển động của đầu."
# JP: 真闇姉とふたりでいることの効果は極めて大きく、\nレビューの素材を有り余るほどに収集できた。
3185 = "Hiệu quả khi ở cùng chị Mayami là vô cùng lớn,\\ntôi đã thu thập được dư thừa tư liệu đánh giá."
# JP: 息を、飲む。言葉にできない。\nなんという豊かさ――美しさだろう。
3187 = "Nín thở. Không thốt nên lời.\\nThật là đầy đặn――đẹp đẽ biết bao."
# JP: じんわり、嬉しい。\n愛されてる、信頼されてると実感できる。
3188 = "Niềm vui, khẽ lan tỏa.\\nTôi thực sự cảm nhận được mình đang được yêu thương, được tin tưởng."
# JP: キスを解いて。ようやく。気づく。\n気づけぬほどに、僕も、真闇姉も熱くなってた。
3191 = "Dứt nụ hôn. Cuối cùng. Tôi cũng nhận ra.\\nTôi và chị Mayami đã nóng bừng lên đến mức không hề hay biết."
# JP: 優しく優しく舐められて、玉を舌先で転がされ、\nあげく――強く、痛いくらいに強く吸われる。
3195 = "Được liếm láp thật dịu dàng, hòn ngọc bị lăn qua lăn lại trên đầu lưỡi,\\ncuối cùng――bị mút mạnh, mạnh đến mức phát đau."
# JP: それに煽られ、唇を割り舌を絡める。\n温度が、密度が高まっていく。
3196 = "Bị kích thích bởi điều đó, tôi hé môi và đan lưỡi vào nhau.\\nNhiệt độ và cường độ ngày càng tăng cao."
# JP: 廃宿舎まわりをただブラつけば、\n景色もゆるゆる、変化していく。
3199 = "Cứ đi dạo quanh khu ký túc xá bỏ hoang,\\ncảnh sắc cũng chầm chậm thay đổi."
# JP: お盆におせんべいとお茶を乗せ、\n真闇姉が腰を下ろす。
3201 = "Đặt khay bánh gạo và trà xuống,\\nchị Mayami ngồi xuống."
# JP: 示された状況下で、与えられた役割を演じることで、\n当該状況への対処方法などを学習する。
3202 = "Bằng cách đóng vai được giao trong một tình huống cụ thể,\\nđể học cách xử lý tình huống đó."
# JP: 大の大人が、もう一度の学園生活を楽しんだなら、\nかならず、セックスに繋がるだろう。
3216 = "Nếu những người trưởng thành muốn tận hưởng lại cuộc sống học đường một lần nữa,\\nthì chắc chắn, nó sẽ dẫn đến tình dục."
# JP: 女教師だ。\nその言葉しか、でてこない。
3220 = "Nữ giáo viên.\\nChỉ có từ đó là bật ra được."
# JP: 醸造管理の方針で、今日も今日とてハチロクと、\n仲良くけんかしているらしい。
3223 = "Có vẻ như hôm nay cô ấy lại đang cãi nhau thân thiện với Hachiroku\\nvề phương châm quản lý quá trình ủ rượu."
# JP: 心地よさげに、もう一度、伸び。
3225 = "Chị vươn vai thêm một lần nữa, trông có vẻ rất dễ chịu."
# JP: 今度は、頬ずり。
3227 = "Lần này, là cọ má."
# JP: 名を呼ばれる。そうだけでくらくらしてしまう。\nこれが男の本懐か――そんなことすら思ってしまう。
3230 = "Được gọi tên. Chỉ vậy thôi cũng đủ làm tôi chếnh choáng.\\nĐây là khao khát lớn nhất của đàn ông sao――tôi thậm chí đã nghĩ như vậy."
# JP: フェラチオ。されてる。\n口唇で、僕の勃起を支配されてる。
3233 = "Blowjob. Đang được làm.\\nSự cương cứng của tôi đang bị chi phối bởi đôi môi ấy."
# JP: 僕の隣に、\n恋人同士の寄り添う距離で。
3235 = "Ngay bên cạnh tôi,\\nở một khoảng cách kề vai sát cánh của những người đang yêu."
# JP: 甲高い。\n余裕もなにも感じられない、裏返った声。雌の声。
3238 = "Cao vút.\\nMột giọng nói lạc đi, không còn chút thong dong nào. Tiếng kêu của con cái."
# JP: 言葉を探しているのだろうか。
3239 = "Có lẽ chị đang tìm từ ngữ thích hợp chăng."
# JP: 納得される。\n所定の出勤時刻まで、ゆうに一時間はあるというのに。
3241 = "Chị ấy gật đầu đồng ý.\\nMặc dù vẫn còn dư dả một tiếng đồng hồ nữa mới đến giờ đi làm."
# JP: わかってくれて、許されている。\n泣いてもいいと誘ってくれて――だから、とぼける。
3242 = "Chị ấy thấu hiểu và bao dung cho tôi.\\nChị bảo tôi cứ khóc cũng không sao――thế nên, tôi mới giả vờ ngơ ngác."
# JP: 余裕のフリで、髪を手で払い、照れ隠し。\nそんなところにも、どうしようもなく女性を感じる。
3246 = "Tỏ vẻ thong dong, chị đưa tay vuốt tóc để che giấu sự bối rối.\\nNgay cả những hành động như vậy, cũng khiến tôi cảm nhận được nét nữ tính không thể chối từ."
# JP: 触れられ、初めて自覚する。\n気づかぬままに、全身全霊で勃起していた。
3247 = "Bị chạm vào, tôi mới lần đầu nhận ra.\\nTrong lúc không hay biết, tôi đã cương cứng hết mức có thể."
# JP: くすりと、笑う。\nその息が、僕の股間をくすぐってくる。
3249 = "Khẽ cười khúc khích.\\nHơi thở ấy cù lét hạ bộ của tôi."
# JP: 外さず、無理やりにずりあげる。\n持ち上げられた胸がぶるん、と、震え放れる。
3250 = "Không tháo ra mà miễn cưỡng kéo ngược lên.\\nBầu ngực bị nâng lên rung bần bật, rồi tuột ra."
# JP: ほんのつかの間のためらいは、\n抵抗感ではなく恥じらいから。
3253 = "Sự do dự trong thoáng chốc ấy,\\nkhông phải vì phản kháng mà là vì xấu hổ."
# JP: 言葉と同時、勃起がずりずりこすられる。\n真闇姉の腰が蠢き、必死になっておねだりしてる。
3256 = "Cùng lúc với lời nói, sự cương cứng bị cọ xát liên tục.\\nHông chị Mayami uốn éo, tuyệt vọng cầu xin."
# JP: たくさんの言葉と沈黙。不安と安心。\nきっと全てを、瞳の中に閉じ込めている。
3257 = "Rất nhiều ngôn từ và cả sự im lặng. Nỗi bất an và sự an lòng.\\nChắc hẳn tất cả đều được gói gọn trong ánh mắt ấy."
# JP: 頭の動きをぴたりととめて、\n代わりに素早く舌が蠢き、亀頭を責める。
3259 = "Chuyển động của đầu đột ngột dừng lại,\\nthay vào đó là chiếc lưỡi luồn lách nhanh nhẹn, tấn công quy đầu."
# JP: 焦らすように唇を離されて、\nだからすぐさま、また追い求める。
3261 = "Bị dứt môi ra như thể đang trêu ngươi,\\nthế nên tôi lập tức đuổi theo."
# JP: 即答だ。いつもながらの包みこみような笑顔を浮かべ。\n――けれども頬は、僅かな薔薇色を覗かせている。
3263 = "Trả lời ngay lập tức. Cùng với nụ cười bao dung như mọi khi.\\n――Nhưng đôi gò má lại thoáng ửng lên sắc hồng."
# JP: 指が、ようやく、\n触ってくれるが、睾丸だ――っ！？。
3264 = "Cuối cùng, ngón tay,\\ncũng chịu chạm vào, nhưng lại là tinh hoàn――Ư!?"
# JP: 嚥下を待っての問いかけだから、\n僕もすらすら答えられる。
3267 = "Vì chị đợi tôi nuốt xong mới hỏi,\\nnên tôi cũng có thể trả lời trôi chảy."
# JP: 学園に入ってきたばかりの無愛想な僕を、\n親切に案内してくれた。
3268 = "Chị ấy đã ân cần hướng dẫn\\nmột kẻ khó gần vừa mới bước chân vào trường như tôi."
# JP: 丁寧にベルトを外し、ズボンの前を大きく開ける。
3270 = "Cẩn thận tháo thắt lưng, mở toang phần trước quần."
# JP: ふざけた口調。\nが、何故だろう。どこか悲しげに聞こえてしまう。
3271 = "Giọng điệu đùa cợt.\\nNhưng, tại sao nhỉ. Nghe lại có vẻ buồn bã đến lạ."
# JP: 戸惑ったように漏れ出た声は、\nけれども熱を帯びている。
3272 = "Tiếng thốt ra như có vẻ bối rối,\\nnhưng lại mang theo sự nóng bỏng."
# JP: もういっかい着替えてくる。と、待たされている。
3273 = "Chị ấy bảo đi thay đồ lại một lần nữa, và bắt tôi phải chờ."
# JP: しゃがみこむ。\n僕の股間の、目の前に。
3277 = "Ngồi xổm xuống.\\nNgay trước hạ bộ của tôi."
# JP: 軽やかに身を翻し、\n真闇姉は、また僕の手を引き、先程の窓へ歩み寄る。
3279 = "Chị Mayami nhẹ nhàng xoay người,\\nlại kéo tay tôi, bước tới bên cửa sổ ban nãy."
# JP: 玄関先まで見送って、\nカチカチ、火打ち石を鳴らしてくれる。
3281 = "Tiễn tôi ra tận cửa,\\nchị đánh đá lửa lách cách cầu may cho tôi."
# JP: ほうっと、嬉しげな息を吐き、\n真闇姉はゆるゆるお茶を飲む。
3283 = "Chị Mayami thở ra một hơi đầy vui vẻ,\\nrồi từ từ nhấp một ngụm trà."
# JP: ぽおんと両手があわせられる。\n穏やかな目が、いたずらっぽくわずかに細まる。
3284 = "Chị chắp hai tay lại với nhau đánh bộp một cái.\\nĐôi mắt hiền hòa hơi nheo lại một cách đầy tinh nghịch."
# JP: そのまま大きく両手を広げ、\nこどものように、ぐるり、大きくあたりを見渡す。
3285 = "Cứ thế dang rộng hai tay,\\nchị đảo mắt nhìn quanh một vòng hệt như một đứa trẻ."
# JP: 支えてもらえる。\nこれは授業で、先生の指導だ。
3287 = "Được hỗ trợ.\\nĐây là lớp học, là sự chỉ bảo của cô giáo."
# JP: 懐かしげな声。\nそういえば真闇姉は、確か……
3289 = "Giọng nói đầy hoài niệm.\\nNhắc mới nhớ, hình như chị Mayami……"
# JP: 見栄を張ることも、ある種甘えのうちなのだろうが、\n真闇姉の前ではやはり、僕は背伸びをしていたい。
3291 = "Có lẽ sĩ diện cũng là một kiểu làm nũng,\\nnhưng trước mặt chị Mayami, tôi vẫn muốn tỏ ra chín chắn hơn."
# JP: 自分から望んで、こころを、体を動かさなければ、\n思い出は残らぬものだと――今ならわかる。
3293 = "Nếu không tự mình mong muốn, không để tâm trí và cơ thể cùng vận động,\\nthì sẽ chẳng đọng lại được kỷ niệm nào cả――Bây giờ thì tôi đã hiểu."
# JP: 学園時代も、帝都に引っ越し帝大に進学してのちも、\n指示されたことをただこなしていただけだった。
3299 = "Dù là thời còn đi học, hay sau khi chuyển đến Đế đô học Đại học Đế quốc,\\ntôi cũng chỉ biết làm theo những gì được bảo."
# JP: 心を閉ざしていてもなお――真闇姉だけは特別だった。
3303 = "Dù đã khép chặt trái tim――chỉ riêng chị Mayami là ngoại lệ."
# JP: 股間の布を大きくずらす。\n真闇姉のおまんこを、僕の視線に、外気に晒す。
3309 = "Kéo lệch mảng vải ở đũng quần sang một bên.\\nPhơi bày âm hộ của chị Mayami trước ánh mắt tôi, và không khí bên ngoài."
# JP: 股間の部分を、思い切りよく――
3310 = "Nắm lấy phần đũng quần, kéo thật mạnh――"
# JP: そうした手段のことではあるが、\nレジャーにも、なるほど、活用できそうだ。
3311 = "Dù là một phương pháp học tập,\\nnhưng đúng là có vẻ cũng áp dụng được cho giải trí."
# JP: うわずった声。\nとろんと潤んでいる瞳。
3316 = "Giọng nói lanh lảnh.\\nĐôi mắt long lanh ướt át."
# JP: たったこれだけのスキンシップが、\n遠足気分を、いっきに吹き飛ばしてしまう。
3319 = "Chỉ một chút tiếp xúc cơ thể thế này,\\nđã thổi bay tâm trạng dã ngoại trong phút chốc."
# JP: 弱いところも欲望も全部重なりあって――\nだからこそ、足りない部分を補いあえる。
3347 = "Cả điểm yếu lẫn dục vọng đều hòa quyện vào nhau――\\nChính vì vậy, chúng tôi mới có thể bù đắp những phần còn thiếu cho nhau."
# JP: ドラマのワンシーンのようだと思う。\nまるきり僕は――先生に告白してる、生徒だと。
3348 = "Cứ như một cảnh phim truyền hình vậy.\\nTôi hoàn toàn giống như――một học sinh, đang tỏ tình với cô giáo."
# JP: 緩い、弛い。勃起が呑まれる速度は余りに遅すぎて、\n神経全部が、唇と舌と、触れ合う部分に集中していく。
3350 = "Chậm chạp, lỏng lẻo. Tốc độ sự cương cứng bị nuốt vào quá chậm,\\nkhiến toàn bộ dây thần kinh đều tập trung vào phần tiếp xúc với môi và lưỡi."
# JP: 細やかな目配りに驚かされつつ、\nならばとバリボリいかせてもらう。
3361 = "Vừa ngạc nhiên trước sự tinh tế của chị,\\ntôi vừa nhai rồm rộp không khách sáo nữa."
# JP: 思えば、発想は連鎖する。
3363 = "Nghĩ lại thì, các ý tưởng cứ thế nối tiếp nhau."
# JP: 同じことを考えていた嬉しさと、\nそこから導く真闇姉の解の、鮮やかさ。
3365 = "Niềm vui khi có cùng chung suy nghĩ,\\nvà sự nhạy bén trong giải pháp mà chị Mayami rút ra từ đó."
# JP: もう止まらない。体液全部が精子になってる。\n限界だ――ならば――ただただ、一番奥の深くへと！
3371 = "Không thể dừng lại nữa. Toàn bộ dịch thể đều biến thành tinh trùng.\\nĐến giới hạn rồi――vậy thì――chỉ việc đâm vào tận nơi sâu nhất!"
# JP: 腰から下が白くなってる。\nあまりに強い快感に、完全にしびれて麻痺してる。
3372 = "Từ thắt lưng trở xuống trở nên trắng xóa.\\nKhoái cảm quá mãnh liệt khiến tôi hoàn toàn tê dại và tê liệt."
# JP: 腰が、ふくれる。\n体全部が、精液でパンパンになっている。
3373 = "Hông, căng phồng lên.\\nToàn bộ cơ thể như đang căng cứng vì tinh dịch."
# JP: まったく役に入り込めずに戸惑って、\n真闇姉に気をつかわせ、余計な手数をかけてしまった。
3374 = "Hoàn toàn không thể nhập vai, tôi cứ lúng túng,\\nkhiến chị Mayami phải bận tâm và tốn công vô ích."
# JP: ゆるく、軽く、焦らすようにして触れ、撫でる。\n刺激のたびに、ピクン、ピクンと真闇姉の肌が喜ぶ。
3379 = "Chạm vào, vuốt ve một cách hờ hững, nhẹ nhàng như trêu chọc.\\nMỗi lần bị kích thích, làn da của chị Mayami lại giật nảy lên sung sướng."
# JP: ゆっくり、進む。腰を押し下げるようにして、\nクリトリスの裏、そこに勃起を当てていく。
3382 = "Chậm rãi, tiến vào. Như thể ép hông xuống,\\nđể sự cương cứng chạm vào mặt sau của âm vật."
# JP: レトロ、骨董――\nそうした趣味を持つ層は、経済的にも余裕があろう。
3387 = "Hoài cổ, đồ cổ――\\nNhững tầng lớp có sở thích như vậy, hẳn là có dư dả về mặt kinh tế."
# JP: 双ちゃんに、これほどすぐに戻ってしまった。
3389 = "Lại quay về làm Sou-chan nhanh đến thế này sao."
# JP: 自覚はなかった。\n恋して初めて、そうだったのだと理解した。
3390 = "Tôi không hề tự nhận thức được điều đó.\\nChỉ khi yêu, tôi mới hiểu ra mọi chuyện là như vậy."
# JP: 解せん。
3392 = "Khó hiểu thật."
# JP: カーテンの質などわからんが、\n古びてもなお、重厚さとしなやかさを感じさせる。
3394 = "Dù không rõ chất liệu rèm cửa,\\nnhưng dẫu đã cũ kỹ, nó vẫn mang lại cảm giác dày dặn và mềm mại."
# JP: その告白を、おおげさなものとは思わない。
3395 = "Lời tỏ tình ấy, tôi không nghĩ là nói quá."
# JP: 僕も、全てを射精しきった。\n鼓動と、体温。いまはそれしか感じない。
3398 = "Tôi cũng đã xuất tinh đến cạn kiệt.\\nNhịp đập và nhiệt độ cơ thể. Giờ đây tôi chỉ cảm nhận được những thứ đó."
# JP: 僕も確かに経験している――\nしかし、何の思い出も残っていない、学園イベント。
3400 = "Tôi chắc chắn cũng đã từng trải qua――\\nnhưng lại chẳng đọng lại chút ký ức nào về các sự kiện ở trường."
# JP: 求められるまま体をずらし、キスをする。
3406 = "Thuận theo khao khát của chị ấy, tôi khẽ nhích người và trao một nụ hôn."
# JP: 手をつないだまま、のんびり歩く。
3407 = "Vẫn nắm tay nhau, chúng tôi thong thả rảo bước."
# JP: 手をつなぐ。\nふたり同時に、差し出し合って。
3408 = "Nắm tay nhau.\\nCả hai cùng lúc đưa tay ra."
# JP: 手を引き、歩く。\n今度は僕がリードして。
3409 = "Nắm tay và bước đi.\\nLần này tôi là người dẫn đường."
# JP: 求めあってる。体だけでなく、こころも等しく。
3410 = "Cùng khao khát nhau. Không chỉ thể xác, mà cả tâm hồn cũng vậy."
# JP: どぎゃん顔をいま、僕はしてしまっていたのだろう。
3412 = "Lúc nãy tôi đã làm ra vẻ mặt như thế nào vậy nhỉ."
# JP: 指を動かし、腰を動かす。\n真闇姉の反応をみつつ、ゆっくり、焦らず。
3414 = "Ngón tay chuyển động, hông cũng chuyển động theo.\\nVừa quan sát phản ứng của chị Mayami, vừa từ từ, không vội vã."
# JP: 惹かれあってる。どうしようもなく。\nだから、自然と唇が――
3416 = "Chúng tôi đang thu hút lẫn nhau. Một cách không thể cưỡng lại.\\nThế nên, đôi môi tự nhiên xích lại――"
# JP: スカートを思い切りまくりあげ、待つ。\nゆるゆるとしか、真闇姉の足はひらかない。
3418 = "Tôi vén tung váy lên và chờ đợi.\\nChân chị Mayami chỉ hé mở từng chút một."
# JP: 解せぬ。とはもう思わない。
3419 = "Tôi không còn nghĩ là khó hiểu nữa."
# JP: あーんにつられて口をあければ、\n何かがそっと押し当てられる。
3422 = "Bị tiếng 'a' dụ dỗ mà há miệng ra,\\nchị ấy liền nhét nhẹ một thứ gì đó vào miệng tôi."
# JP: これから、僕のおんなにすると――\n僕が主導権を取るのだと、強く願って。
3423 = "Từ giờ, tôi sẽ biến chị thành người phụ nữ của tôi――\\nVới mong muốn mãnh liệt rằng mình sẽ nắm thế chủ đạo."
# JP: それが嬉しくて、ほっとして、\nようやく自分のリズムに戻れる。
3426 = "Điều đó khiến tôi vui sướng, nhẹ nhõm,\\nvà cuối cùng cũng lấy lại được nhịp độ của mình."
# JP: 甘えたいし、甘えさせたい。\nそれが僕らの、一番釣り合う気持ちだと知る。
3428 = "Muốn làm nũng, và cũng muốn được làm nũng.\\nTôi nhận ra đó là thứ tình cảm tương xứng nhất của chúng tôi."
# JP: 感動のあまり、声がでる。\nやはり――最高のおっぱいだ。
3430 = "Quá đỗi cảm động, tôi thốt lên thành tiếng.\\nQuả nhiên――bầu ngực tuyệt vời nhất."
# JP: 視察用にと持ってきていたヘルメットを渡す。
3432 = "Tôi đưa cho chị chiếc mũ bảo hiểm mang theo để dùng cho việc khảo sát."
# JP: 差し伸べられた手を受け取る。\n熱い。真闇姉のてのひらも、いつもより。
3433 = "Tôi đón lấy bàn tay đang chìa ra.\\nNóng quá. Lòng bàn tay chị Mayami cũng nóng hơn mọi khi."
# JP: 力みが、抜ける。\nただただ自然に、体が動く。
3436 = "Buông lỏng sức lực.\\nCơ thể chuyển động một cách tự nhiên."
# JP: 少し、驚く。\n宿舎群のはずれまで、全く時間を感じなかった。
3438 = "Tôi hơi ngạc nhiên.\\nĐi đến tận rìa khu ký túc xá mà hoàn toàn không cảm nhận được thời gian trôi qua."
# JP: まさに遠慮をしようとしていた。
3439 = "Tôi đang định giữ ý tứ."
# JP: 僕じゃない。真闇姉の腰が回ってる。\n貪欲に快感を貪って、僕の勃起と呼応している。
3441 = "Không phải tôi. Mà là hông chị Mayami đang xoay tròn.\\nTham lam tận hưởng khoái cảm, hòa nhịp cùng sự cương cứng của tôi."
# JP: 射精前より、強い欲。\n針より尖った欲望が、僕の喉から溢れ出ていく。
3445 = "Dục vọng còn mãnh liệt hơn cả trước khi xuất tinh.\\nKhao khát nhọn hơn cả kim châm, đang trào dâng khỏi cổ họng tôi."
# JP: ぶんぶん、全力で頷いている。\n全部を。お口に。真闇姉の。その誘惑に抗えない。
3447 = "Tôi gật đầu liên tục, bằng tất cả sức lực.\\nToàn bộ. Vào trong miệng. Của chị Mayami. Tôi không thể cưỡng lại sự cám dỗ đó."
# JP: 解せぬ気持ちが、どうやら顔に出たらしい。
3448 = "Có vẻ như sự khó hiểu đã hiện rõ trên mặt tôi."
# JP: ドキン、と大きく、胸が高鳴る。\n禁欲を重ね、溜めてる股間が、ずくりとざわめく。
3450 = "Thịch, tim tôi đập rộn ràng.\\nNơi hạ bộ dồn nén dục vọng bấy lâu nay bỗng nhói lên rạo rực."
# JP: 確かに、目だけで済ませてしまっていた。
3453 = "Quả thực, tôi mới chỉ hôn lên mắt thôi."
# JP: 弱い部分ならわかっている。\n手を動かしてクリトリス、その上の包皮のコリコリを。
3455 = "Điểm nhạy cảm thì tôi biết rõ.\\nTôi di chuyển tay, xoa nắn âm vật và lớp bao quy đầu sần sật phía trên nó."
# JP: 即座に答えが喉からでてきて、ならば、と思う。
3457 = "Câu trả lời lập tức bật ra khỏi cổ họng, nếu vậy thì, tôi nghĩ."
# JP: ふわんと、笑う。\n精液で汚れた顔に――聖なるものを感じさえする。
3459 = "Khẽ mỉm cười.\\nTrên gương mặt vấy bẩn tinh dịch ấy――tôi thậm chí còn cảm nhận được sự thánh thiện."
# JP: 濃密すぎるおんなの――いいや、雌の匂いに煽られて、\n僕も完全に一匹の、単なる雄になっていた。
3461 = "Bị kích động bởi mùi hương phụ nữ――không, là mùi hương của con cái quá đỗi nồng nàn,\\ntôi cũng hoàn toàn biến thành một con đực thuần túy."
# JP: 素直になれてる。\n性の興奮が去った今でも。
3462 = "Tôi đã có thể thành thật với lòng mình.\\nNgay cả khi sự hưng phấn tình dục đã qua đi."
# JP: いいこいいこもしてあげる。\n頭ではなくクリトリスへと。
3464 = "Tôi dỗ dành chị ấy.\\nKhông phải xoa đầu, mà là xoa âm vật."
# JP: 自分自身のことさえ満足に理解できていない僕が、\n他の誰かを演じるなどは、無理だったのかもしれん。
3469 = "Một kẻ ngay cả bản thân mình còn chưa hiểu rõ như tôi,\\nviệc đóng vai một ai khác có lẽ là điều không tưởng."
# JP: 何をしたのだ？　と聞くより早くの答えにけれど、\nしばし、言葉をなくしてしまう。
3470 = "Chưa kịp hỏi 'Vậy mọi người đã làm gì?', tôi đã có câu trả lời,\\nnhưng nó khiến tôi cạn lời trong chốc lát."
# JP: そうであるなら、気持ちを全部言葉に直そう。
3471 = "Nếu đã vậy, hãy chuyển hết những cảm xúc này thành lời."
# JP: 大きく頷き、その瞬間にそうかと思う。
3472 = "Tôi gật đầu mạnh, và ngay khoảnh khắc đó bỗng chợt nhận ra."
# JP: だからキスする。目蓋に、目尻に。
3475 = "Vì thế, tôi đặt nụ hôn. Lên mí mắt, lên khóe mắt chị."
# JP: だから。言う。自分の言葉で、感じたままに。\n先生は同時に真闇姉で。生徒は同時に僕なのだから。
3476 = "Vì vậy. Tôi nói. Bằng chính ngôn từ của mình, đúng như những gì tôi cảm nhận.\\nVì cô giáo đồng thời cũng là chị Mayami. Còn học sinh đồng thời cũng là tôi."
# JP: 手は、休めない。\n真闇姉は、僕におっぱいを揉まれるままに――
3488 = "Tay, không thể dừng lại.\\nChị Mayami, cứ để mặc tôi nhào nặn bầu ngực――"
# JP: 手を繋いだまま、歩き出す。
3491 = "Vẫn nắm chặt tay nhau, chúng tôi bắt đầu rảo bước."
# JP: 真闇姉のふっくらとした手触りの、\n温度の高い手のひらが、亀頭をいいこと、撫でている。
3512 = "Lòng bàn tay mềm mại,\\nấm áp của chị Mayami đang âu yếm vuốt ve quy đầu như dỗ dành trẻ nhỏ."
# JP: 抱き締める。\n豊かな胸が、僕の胸板で形を変える。
3513 = "Tôi ôm chặt lấy chị.\\nBầu ngực căng đầy biến dạng khi ép sát vào vòm ngực tôi."
# JP: そうして僕らは、ごっこ遊びの――\nロールプレイの学園生活へと、一歩踏み出す。
3516 = "Và thế là chúng tôi――\\nbước một bước vào trò chơi nhập vai cuộc sống học đường."
# JP: そうして僕は、真闇姉と初めて過ごす放課後を、\n手を取り合って――終わらせる。
3517 = "Cứ như vậy, tôi và chị Mayami tay trong tay――\\nkhép lại buổi chiều tan học đầu tiên bên nhau."
# JP: 理解できれば、嬉しさが増す。\n僕らは、本当に呼応するのだ。
3518 = "Thấu hiểu được nhau, niềm vui lại càng nhân lên.\\nChúng tôi, thực sự rất đồng điệu."
# JP: ただでさえみっちりとした肉感たっぷりの膣壁が、\nきゅううっと、一気に締めてくる。
3520 = "Vách âm đạo vốn đã chật chội và đầy đặn,\\nbỗng chốc siết chặt lại."
# JP: 夢中になって這い回っていた舌先を、\nほんの僅かに噛まれてようやく――正気に返る。
3525 = "Đầu lưỡi đang say sưa trườn đi,\\nbị cắn nhẹ một cái, cuối cùng tôi cũng――tỉnh táo lại."
# JP: 真闇姉がそう選択して――僕を選んでくれたから、\n僕らは、こうして寄り添いあえているのだから。
3527 = "Bởi vì chị Mayami đã lựa chọn như vậy――đã chọn tôi,\\nnên chúng tôi mới có thể ở bên nhau như thế này."
# JP: 計ったように、蔵から声が響いてくる。\nF・スコッティ。詠国産まれのレイルロオドだ。
3529 = "Như đã hẹn trước, từ trong xưởng rượu vang lên một giọng nói.\\nF. Scotty. Một Railord sinh ra ở Anh Quốc."
# JP: 飲みきれなかった精液が、真闇姉を染め、汚してる。\nそれを指先で拭っては――
3533 = "Tinh dịch không thể nuốt hết, đã vấy bẩn, làm dơ chị Mayami.\\nDùng đầu ngón tay lau đi thì――"
# JP: 一挙動ごとに精液が、\n出番はまだかと、イカせてくれと悲鳴を上げる。
3535 = "Mỗi một cử động, tinh dịch lại gào thét,\\nnhư muốn hỏi đã đến lượt chưa, hãy cho nó xuất ra đi."
# JP: 舌に持ち上げられる度、自分の睾丸の圧を感じる。\nやはり、どうしようもなく溜まっているのだ。
3538 = "Mỗi lần được nâng lên bằng lưỡi, tôi lại cảm nhận được áp lực từ tinh hoàn của chính mình.\\nQuả nhiên, nó đã tích tụ đến mức không thể kiềm chế nổi nữa."
# JP: 着用時や外したときなど、目に見えて神経質になる。\n例外といえば――
3539 = "Mỗi khi đội vào hay cởi ra, họ đều lộ rõ vẻ khó chịu.\\nNếu nói đến ngoại lệ thì――"
# JP: 一度目より濃い。粘ってる。\nその感触が尿道口をドロリと抜けて、脳を焼く。
3541 = "Đậm đặc hơn lần đầu. Nhầy nhụa hơn.\\nCảm giác ấy sền sệt trào ra khỏi lỗ niệu đạo, thiêu đốt cả não bộ."
# JP: 汗が、匂いが、言葉が、全てが、\n僕をギリギリに尖らせている。
3549 = "Mồ hôi, mùi hương, lời nói, tất cả mọi thứ,\\nđều đang kích thích tôi đến tột độ."
# JP: 恋愛経験がなかったことを、\n真闇姉は、意外と気にしているのかもしれん。
3550 = "Việc chưa từng có kinh nghiệm yêu đương,\\ncó lẽ chị Mayami lại bận tâm hơn tôi nghĩ."
# JP: 焦ってしまう指先に、\nふわり、温かさが触れてくる。
3568 = "Nơi đầu ngón tay đang nôn nóng,\\nchợt chạm vào một hơi ấm mềm mại."
# JP: 同時に、苦笑が湧いてくる。\nああ、これこそが僕の学園時代だったと。
3570 = "Đồng thời, một nụ cười gượng gạo hiện lên.\\nA, đây mới chính là thời đi học của tôi."
# JP: ここは静かに邪魔せぬことが\n結局は、ふたりの時間の節約になる。
3574 = "Lúc này giữ im lặng, không làm phiền chị ấy,\\nrốt cuộc lại là cách tiết kiệm thời gian cho cả hai."
# JP: 歩幅を合わせる必要がない。\n自分のペースで歩けばそれは、真闇姉のペースだ。
3580 = "Không cần phải điều chỉnh bước chân.\\nChỉ cần bước theo nhịp độ của mình, thì đó cũng chính là nhịp độ của chị Mayami."
# JP: いいこいいこを、されている。\nズボンの上から、僕の亀頭へ、的確に。
3584 = "Đang được dỗ dành như trẻ ngoan.\\nChính xác từ bên ngoài quần, vuốt ve quy đầu của tôi."
# JP: そうと感じる証拠なら、\n僕の眼下に示されている。
3587 = "Bằng chứng cho cảm giác đó,\\nđang hiện ra ngay dưới tầm mắt tôi."
# JP: 真闇姉ほど魅力的な女性を――\nまして恋人を目の前にして、これほどの失礼も無い。
3588 = "Đứng trước một người phụ nữ quyến rũ như chị Mayami――\\nhuống hồ lại là người yêu, thì không còn sự thất lễ nào lớn hơn thế."
# JP: 真闇姉をリードするには、\nまだまだ僕の器では足りてないらしい。が――
3593 = "Để có thể dẫn dắt chị Mayami,\\ncó vẻ bản lĩnh của tôi vẫn chưa đủ. Nhưng――"
# JP: いささか恥ずかしい気もするが、\nその恥ずかしささえも、どこか嬉しい。
3596 = "Tuy có chút xấu hổ,\\nnhưng ngay cả sự xấu hổ đó cũng khiến tôi cảm thấy vui vui."
# JP: かわいい。かわいい。\nおかえしの、おかえしをせずにはいられない。
3597 = "Dễ thương quá. Đáng yêu quá.\\nKhông thể không đáp lại cái đáp lại này được."
# JP: 補習授業が、現実で。\n真闇姉が先生、僕が生徒だ。
3600 = "Lớp học bổ túc, ở ngay hiện thực.\\nChị Mayami là cô giáo, tôi là học sinh."
# JP: さらけ出したいもの、であるなら――
3602 = "Nếu là thứ muốn bộc lộ――"
# JP: 真闇姉――の声ではあるが、流れるような標準語だ。\nどう反応を返せばいいか――
3685 = "Chị Mayami――giọng thì đúng là của chị ấy, nhưng lại là tiếng phổ thông trôi chảy.\\nTôi nên phản ứng thế nào đây――"
# JP: 真闇姉も、おねーちゃんで。\nその上、真闇姉ほどに優秀ならば……
3688 = "Chị Mayami cũng là một người chị.\\nHơn nữa, nếu xuất sắc như chị Mayami thì……"
# JP: 真闇姉はよほど落ち着かないのか、\nしきりに瞬きを繰り返す。
3690 = "Có vẻ chị Mayami đang rất bồn chồn,\\nchị chớp mắt liên tục."
# JP: 真闇姉はその長い指を唇にあて、\n少しの間、だまりこむ。
3691 = "Chị Mayami đặt những ngón tay thon dài lên môi,\\nim lặng trong giây lát."
# JP: 真闇姉の手が動く。\n僕の手を、優しく優しく導いてくれる。
3694 = "Tay chị Mayami chuyển động.\\nDịu dàng, ân cần dẫn dắt tay tôi."
# JP: 真闇姉は一瞬、ためらい――
3696 = "Chị Mayami thoáng chốc, do dự――"
# JP: 真闇姉はもう、資料を読み進めに入ってる。
3697 = "Chị Mayami đã bắt đầu đọc tài liệu."
# JP: 考え事をするときに、\nいつでも真闇姉のくちびるに添えられている長い指が。
3699 = "Ngón tay thon dài lúc nào cũng kề bên môi chị Mayami\\nmỗi khi chị ấy suy nghĩ."
# JP: さすがは、真闇姉。\n言わずともあご紐までをしっかり締める。
3702 = "Quả không hổ danh là chị Mayami.\\nKhông cần nhắc cũng tự cài chặt quai hàm."
# JP: 真闇姉は、本当に最高の先生だ。\nだからこそ、僕はここまで、自分を出せる。
3704 = "Chị Mayami, thực sự là một người cô giáo tuyệt vời nhất.\\nChính vì thế, tôi mới có thể bộc lộ bản thân đến mức này."
# JP: そう思う間にも、真闇姉は僕へと\nつかつか寄ってきて――
3705 = "Trong lúc tôi còn đang nghĩ vậy, chị Mayami\\nđã xăm xăm tiến lại gần――"
# JP: 真闇姉が小首をかしげ、人差し指を唇にあてる。
3708 = "Chị Mayami hơi nghiêng đầu, đặt ngón trỏ lên môi."
# JP: 真闇姉は瞳を閉じない。\nそのまま涙を――見えない涙を拭い取る。
3709 = "Chị Mayami không nhắm mắt lại.\\nCứ thế lau đi những giọt nước mắt――những giọt nước mắt vô hình."
# JP: 真闇姉は、僕に発情してくれている。\n『先生』であることを、つかの間忘れてしまうほど。
3713 = "Chị Mayami đang phát tình vì tôi.\\nĐến mức thoáng chốc quên mất mình là 『cô giáo』."
# JP: 真闇姉の爪が小さな穴を穿ってくれる。\nならば、ここを手がかりにすれば――
3715 = "Móng tay chị Mayami chọc thủng một lỗ nhỏ.\\nNếu vậy, chỉ cần men theo chỗ này――"
# JP: 真闇姉の真っ白な肌を、柔らかでもっちりした頬を、\n亀頭の先から溢れた汁が、ベタベタにして汚してく。
3717 = "Làn da trắng ngần, gò má mềm mại căng mọng của chị Mayami,\\nđang bị thứ dịch rỉ ra từ đầu quy đầu làm cho bẩn và dính nhớp nháp."
# JP: 真闇姉の唇からは、僕の精液の匂いが漂う。\nそれごと、味も、ねばつきも何もかも拭い取る。
3720 = "Từ đôi môi chị Mayami, phảng phất mùi tinh dịch của tôi.\\nTôi lau sạch tất cả, cả hương vị, cả sự nhớp nháp."
# JP: 真闇姉の指が、ちょん、ちょん、ちょん、と、\n頭上のヘルメットを指し示す。
3723 = "Ngón tay chị Mayami chọc chọc\\nvào chiếc mũ bảo hiểm trên đầu."
# JP: 真闇姉の匂いが立ち上る。\n成熟しきった、けれども青い、女の匂い。
3726 = "Mùi hương của chị Mayami bốc lên.\\nMùi hương của một người phụ nữ trưởng thành, nhưng vẫn còn đôi chút thanh xuân."
# JP: 真闇姉の息が切れ切れになる。\nきゅんきゅんしてる。膣内が。
3727 = "Hơi thở của chị Mayami đứt quãng.\\nBên trong âm đạo đang co thắt liên hồi."
# JP: 真闇姉の目が、ふっと柔らかに――\nあるいは少し、さみしげになる。
3729 = "Ánh mắt chị Mayami bỗng trở nên dịu dàng――\\nhay nói đúng hơn là có chút đượm buồn."
# JP: 真闇姉の瞳が揺れている。
3731 = "Đôi mắt chị Mayami khẽ rung động."
# JP: 瞬間、真闇姉の表情が驚いたようになる。\nとろけきってた瞳がふたたび、僕へ向く。
3733 = "Trong khoảnh khắc, vẻ mặt chị Mayami lộ vẻ ngạc nhiên.\\nĐôi mắt đang đờ đẫn lại hướng về phía tôi."
# JP: 真闇姉の声があんまり優しくて――\nかえって、不安になってしまう。
3734 = "Giọng nói của chị Mayami quá đỗi dịu dàng――\\nngược lại, khiến tôi cảm thấy bất an."
# JP: ぷくっと、真闇姉の頬がふくれる。\nそれが、嬉しい。愛らしい。
3736 = "Hai má chị Mayami phồng lên.\\nĐiều đó khiến tôi thấy vui. Thật đáng yêu."
# JP: 真闇姉の舌がレールになってる。
3738 = "Lưỡi của chị Mayami đã trở thành đường ray."
# JP: 真闇姉の表情がふいに固くなる。\n余裕の笑みが掻き消える。
3740 = "Biểu cảm của chị Mayami chợt cứng đờ.\\nNụ cười thong dong vụt tắt."
# JP: 真闇姉の人差し指が、僕のくちびるにあてられる。
3741 = "Ngón trỏ của chị Mayami chạm vào môi tôi."
# JP: 真闇姉の温度が上がる。
3743 = "Nhiệt độ của chị Mayami tăng lên."
# JP: 勃起に、鼻先が押し当てられる。
3744 = "Chóp mũi ép sát vào sự cương cứng."
# JP: 真闇姉はそれを知っている。\n真闇姉ほどではなかろうが、僕も多少は、知っている。
3747 = "Chị Mayami biết điều đó.\\nTuy không bằng chị, nhưng tôi ít nhiều cũng hiểu được."
# JP: 真闇姉が、軽く姿勢を整え直す。\nそわっ、と音が聞こえてきそうな、少女じみた仕草。
3749 = "Chị Mayami nhẹ nhàng sửa lại tư thế.\\nMột cử chỉ hệt như thiếu nữ, đến mức dường như có thể nghe thấy cả tiếng xào xạc háo hức."
# JP: 真闇姉は完璧に、学園制服に着替えまでして、\n『優しい先輩』を演じてくれた。
3751 = "Chị Mayami đã thay đồng phục học sinh một cách hoàn hảo,\\nvà vào vai một 『tiền bối dịu dàng』."
# JP: 真闇姉のおっぱいの手触りが。
3753 = "Xúc cảm từ bầu ngực của chị Mayami."
# JP: 真闇姉が、照れてくれる。はにかんでくれる。\nこころが、ふわりとあたたかくなる。
3755 = "Chị Mayami ngại ngùng. Chị ấy thẹn thùng.\\nTrái tim tôi chợt ấm áp lạ thường."
# JP: 真闇姉が小さく頷く。\nその横顔に、ハっとする。
3756 = "Chị Mayami khẽ gật đầu.\\nGóc nghiêng ấy khiến tôi bất chợt sững sờ."
# JP: 頷いて、けれども真闇姉はまだ外さない。\nなるほど――これも乙女心か。
3757 = "Gật đầu, nhưng chị Mayami vẫn chưa cởi ra.\\nRa vậy――đây cũng là tâm tư thiếu nữ sao."
# JP: 持ち上げられて、舐められる。\nゆるゆる、ゆるゆる、ゆるゆると。
3763 = "Được nâng lên, và liếm láp.\\nThật chậm rãi, thật chậm rãi, thật chậm rãi."
# JP: 確かに学園制服のままでは、\n帰途に人目を引いてしまおうが――
3772 = "Quả thực nếu cứ mặc nguyên đồng phục học sinh,\\nlúc về sẽ rất thu hút sự chú ý――"
# JP: 急に、来る。\n真闇姉は激しく口を前後に動かしっ！
3776 = "Đột ngột, ập đến.\\nChị Mayami bắt đầu di chuyển miệng tới lui một cách mãnh liệt!"
# JP: 少し待ち。真闇姉が目を開けるのを見て、\n舌先を軽く尖らせる。
3781 = "Đợi một chút. Thấy chị Mayami mở mắt,\\ntôi hơi thè đầu lưỡi ra."
# JP: 誤答をしても、必ず正解を教えてもらえる。\n――安心感が、喉の緊張をほぐしてくれる。
3782 = "Dù trả lời sai, chắc chắn sẽ được dạy cho đáp án đúng.\\n――Cảm giác an tâm, đã xua tan sự căng thẳng nơi cổ họng."
# JP: 精液が、内から勃起を膨らませてる。\n密着感が凄すぎて、勃起と膣との境界線が判らない。
3788 = "Tinh dịch làm dương vật sưng tấy từ bên trong.\\nCảm giác khít khao đến mức không phân biệt được ranh giới giữa dương vật và âm đạo."
# JP: 視察自体は、大成功したといえよう。
3806 = "Bản thân chuyến khảo sát có thể nói là thành công rực rỡ."
# JP: その上を、勃起がゆるゆる――\nゼロノッチ――惰性走行で呑み込まれていく。
3809 = "Sự cương cứng từ từ lướt trên đó――\\nKhông tay ga――đang bị nuốt chửng bằng đà chạy quán tính."
# JP: 命令されれば、体は自動で動いてくれる。\n自分自身に号令をかけ、立ち上がる。
3812 = "Khi bị ra lệnh, cơ thể tự động di chuyển.\\nTự hô khẩu lệnh cho bản thân, tôi đứng bật dậy."
# JP: 大きな声に振り返りみれば、\n真闇姉は、どこかスネたような顔をしている。
3813 = "Quay lại vì tiếng gọi lớn,\\ntôi thấy chị Mayami đang làm vẻ mặt có chút hờn dỗi."
# JP: 勃起を思い切り擦り付け、揺らす。\nせめてセックスは主導したいと、願って揺らす。
3817 = "Cọ xát sự cương cứng thật mạnh và lắc lư.\\nVới mong muốn ít nhất có thể chủ đạo trong tình dục, tôi không ngừng lắc lư."
# JP: ぶくりと、はっきり、膨らんでいる――\n僕の先端の状態を、確かめてでもいるかのように。
3819 = "Phình to, rõ ràng, đang sưng lên――\\nNhư thể đang xác nhận trạng thái phần đỉnh của tôi vậy."
# JP: 着替えるときに、あわせ髪型を直すつもりで……\nゆえ、僕の目の前では外さんのだろう。
3824 = "Chắc là định sửa lại kiểu tóc lúc thay đồ luôn……\\nnên mới không tháo ra trước mặt tôi đây mà."
# JP: 萎えてる。\nあれほど溜めていたのに。
3844 = "Xìu xuống rồi.\\nDù đã tích tụ nhiều đến thế."
# JP: 伸びる。分厚い、破けない。
3854 = "Nó giãn ra. Dày quá, không rách được."
# JP: キス。
3859 = "Hôn."
# JP: 耳元へキス。後ろ髪にも。\n鼻先を使い髪を割り、髪ごとうなじをぞろリと舐める。
3860 = "Hôn lên tai. Lên cả mái tóc phía sau.\\nDùng chóp mũi rẽ tóc ra, liếm láp gáy cùng với những lọn tóc."
# JP: だから、自然と声がでる。
3879 = "Thế nên, những lời ấy bật ra thật tự nhiên."
# JP: セックスに疲れていた心身に、\n爽やかな風が吹くようだ。
3883 = "Như có một làn gió mát lành thổi qua\\ntâm trí và cơ thể đang rã rời sau cuộc ân ái."
# JP: 踏み出す一歩も、おんなじだ。\n並んで――どちらもリードをせずに。
3887 = "Bước chân đầu tiên, cũng giống hệt nhau.\\nSóng vai――không ai dẫn trước ai."
# JP: 言葉が、歩みに連れてでてくる。\nなにか、つかえが取れたみたいに。
3889 = "Lời nói cứ thế tuôn ra theo từng bước chân.\\nGiống như có thứ gì đó nghẹn lại vừa được gỡ bỏ."
# JP: 演じよう、と思えば思うほど力んでしまう。
3892 = "Càng muốn diễn, lại càng gượng gạo."
# JP: 生唾がわく。慌てて飲み込む。\nさっきの醜態が頭をよぎる。
3893 = "Nước bọt tứa ra. Vội vàng nuốt xuống.\\nBộ dạng khó coi lúc nãy thoáng qua trong đầu."
# JP: さっきのおっぱいと正反対だ。\n僕の勃起は、押し下げられて跳ね上がった。
3895 = "Hoàn toàn trái ngược với bộ ngực ban nãy.\\nSự cương cứng của tôi bị đè xuống rồi bật tung lên."
# JP: そんな仕草は、もう完全に普段通りの真闇姉だ。\nだからこそ。溜めたその先への期待も膨らむ。
3897 = "Cử chỉ đó, hoàn toàn là chị Mayami như thường ngày.\\nChính vì vậy. Sự mong đợi về những gì được tích tụ lại càng phình to hơn."
# JP: 何度も何度も愚直に揺すり、もう蕩けてるおまんこを、\nしつこくしつこく愛撫していく。
3900 = "Tôi ngây ngô cọ xát hết lần này đến lần khác, dai dẳng\\nái ân cái âm hộ vốn đã ướt đẫm nhầy nhụa kia."
# JP: 言われて、瞬間、体が震える。\n思い出が、あまりに鮮明に蘇ってきて。
3903 = "Nghe hỏi vậy, trong thoáng chốc, cơ thể tôi khẽ run lên.\\nKý ức ùa về quá đỗi sống động."
# JP: 臨時停車のキハ07sを見送り、駅舎を出る。\n途端、真闇姉は大きく大きく伸びをする。
3917 = "Tiễn chiếc KiHa 07S dừng đỗ tạm thời đi, chúng tôi rời khỏi nhà ga.\\nNgay lúc đó, chị Mayami vươn vai thật dài."
# JP: これは――これは――これはいかん。\n照れくさい、などという言葉では到底足りん。
3922 = "Cái này――cái này――thế này thì không được rồi.\\nNhững từ như 'xấu hổ' hoàn toàn không đủ để diễn tả."
# JP: 発情している。今の時点で。ふたりとも。\nゆえに、それをできるだけ熟成させたい。
3923 = "Đang phát tình. Ngay lúc này. Cả hai chúng tôi.\\nThế nên, tôi muốn ủ nó chín muồi hết mức có thể."
# JP: 真闇姉が流さず我慢してきた涙を、\n眼球を舐め、ゆっくり、ゆっくり舐め取っていく。
3924 = "Những giọt nước mắt mà chị Mayami đã cố kìm nén không rơi,\\ntôi liếm lên nhãn cầu, từ từ, từ từ liếm sạch chúng."
# JP: ロールプレイの、これは、補習か。
3925 = "Đây là lớp học bổ túc, của trò chơi nhập vai sao."
# JP: 蕩ける柔らさかと張りと、勃起した乳首の手触りと。\n手のひらが、幸せすぎて煮崩れそうだ。
3926 = "Sự mềm mại như tan chảy cùng độ căng tròn, và cảm giác khi chạm vào núm vú đang cương cứng.\\nLòng bàn tay tôi như muốn tan nhừ vì quá đỗi hạnh phúc."
# JP: そうか。\nまともな学園生活とはこういうものであったのか。
3927 = "Ra vậy.\\nCuộc sống học đường bình thường là như thế này sao."
# JP: それがどれほどの幸せか――\n今の僕になら、しみじみわかる。
3928 = "Điều đó hạnh phúc đến nhường nào――\\nVới tôi của hiện tại, đã thấu hiểu sâu sắc."
# JP: これほど大きく、けれども垂れぬ。\nなんと見事な張りだろう。
3929 = "To đến thế này, vậy mà không hề chảy xệ.\\nĐộ căng tròn mới tuyệt mỹ làm sao."
# JP: 建物や坑道内の見学もできず、ただ歩き回ることに、\n一体、どれほどの楽しみがあるというのか。
3933 = "Không được tham quan bên trong tòa nhà hay hầm mỏ, chỉ đi dạo vòng quanh,\\nthì rốt cuộc có gì vui cơ chứ."
# JP: 慣れているはずのポーレットやハチロクでさえも、\n例外ではない。
3934 = "Ngay cả những người đáng lẽ đã quen như Paulette hay Hachiroku,\\ncũng không phải là ngoại lệ."
# JP: ならばと、乳輪をこねるようにし、\nじわじわ、揉み上げる範囲を広げる。
3936 = "Thấy vậy, tôi bắt đầu nhào nặn quầng vú,\\ntừ từ mở rộng phạm vi xoa bóp lên trên."
# JP: ならば演じる必要などはない。\nただただ素直に、状況を追認すればいい。
3937 = "Nếu vậy thì không cần phải diễn nữa.\\nChỉ cần thành thật, chấp nhận tình huống này là được."
# JP: 途端、ひろがる醤油味。\nああ……これは上等のおせんべいだ。
3940 = "Ngay lập tức, vị nước tương lan tỏa.\\nÀ……đây là loại bánh gạo thượng hạng."
# JP: 美人は得だと、つくづく思う。\nヘルメットなど、被ったこともほぼなかろうに――
3943 = "Người đẹp đúng là có lợi thế thật.\\nChắc chị ấy hầu như chưa từng đội mũ bảo hiểm bao giờ――"
# JP: ごにょごにょと、語尾が珍しく濁ってしまう。\nそこでようやく、思い当たる。
3947 = "Lúng búng, đuôi câu mờ đi một cách hiếm thấy.\\nĐến lúc đó, tôi mới sực nhận ra."
# JP: 凛と締まった――蔵での顔になっている。
3949 = "Nét mặt điềm tĩnh, uy nghiêm――giống hệt như khi ở nhà xưởng ủ rượu."
# JP: 真闇姉の奥に当たってる。\n子宮をどんどん、僕の精子が埋めている。
3950 = "Chạm đến tận sâu bên trong chị Mayami.\\nTinh trùng của tôi đang không ngừng lấp đầy tử cung."
# JP: 大きく、震え。\nくたりと、真闇姉の体から力が抜ける。
3957 = "Rung lên bần bật.\\nCơ thể chị Mayami mềm nhũn, mất hết sức lực."
# JP: キスをほどいて。\n呼び捨てる。
3962 = "Dứt nụ hôn.\\nGọi trống không tên chị ấy."
# JP: ねっとりと――\nその言葉を意識したなら、指の動きは緩慢になる。
3964 = "Nhớp nháp――\\nKhi ý thức được từ đó, chuyển động của ngón tay trở nên chậm chạp."
# JP: 亀頭全部を呑んで貰えて、それでも速度は上がらない。\nじわじわ、ずるずる、真闇姉の口へ埋没し――っ！？
3965 = "Toàn bộ quy đầu đã được nuốt trọn, nhưng tốc độ vẫn không tăng lên.\\nCứ từ từ, chầm chậm, chìm dần vào trong miệng chị Mayami――Ư!?"
# JP: （っ――プッ――）
3967 = "（Ư――Phập――）"
# JP: （ばじゅ！　ぐりゅっっ！　ごちゅっ！　じゅぬ！）
4008 = "（Bạch! Phập! Phịch! Sục!）"
# JP: （ずばっ！　じゅばっ！　ぶちゅっ！　ごしゅっ！）
4010 = "（Phập! Bạch! Phịch! Phịch!）"
# JP: （ずぶっ！　じゅばっ！　じゅぼっ！　じゅちゅっ！）
4011 = "（Phập! Bạch! Phập! Sục!）"
# JP: （ずりゅっ――ぬぐっ――こしゅんっ――ぐいっ！)
4012 = "（Phập――sục――phịch――hự!)"
# JP: （ずりゅうううううううう――――ばぢゅんっ！！）
4014 = "（Phậpppppppp――――bạch!!）"
# JP: （ずりゅっ――）
4015 = "（Phập――）"
# JP: （つうううっ）
4016 = "（Trượttt）"
# JP: （こりゅっ――こりゅっ――ごしゅっ――ぐにゅっ）
4017 = "（Sần sật――sần sật――nắn nắn――bóp bóp）"
# JP: （こりゅっ）
4018 = "（Sần sật）"
# JP: （ぐうううっ！　ごちゅうううううううううっん！！）
4019 = "（Guuuu! Phập!!）"
# JP: （びゅぶっ！　びゅぐんっ！　びゅぶっ！　びゅる！）
4021 = "（Byubu! Byugun! Byubu! Byuru!）"
# JP: （ぴとっ）
4022 = "（Chạm nhẹ）"
# JP: （ばぢゅっ！　ずばっ！　じゅぶっ！　ごりゅんっ！）
4024 = "（Bạch! Phập! Sục! Sần sật!）"
# JP: （じゅぶっ！　ずぢゅっ！　じゅばっ！　ごちゅっ！）
4025 = "（Sục! Phập! Bạch! Phịch!）"
# JP: （じゅっ！　ばぢゅっ！　ごりゅっ！　じゅぼっ！）
4027 = "（Sục! Bạch! Sần sật! Phập!）"
# JP: （ちゅっ）
4028 = "（Chụt）"
# JP: （ガラッ）
4029 = "（Cạch）"
# JP: （びりり――びりりいりっ――）
4030 = "（Xoẹt――xoẹt roạt――）"
# JP: （びゅるっ！　びゅっ！　びゅぶっ！　びゅくっ！）
4034 = "（Byuru! Byu! Byubu! Byuku!）"
# JP: （びゅるっ！　びゅううっ！　びゅっ――びゅるっ）
4035 = "（Byuru! Byuuu! Byu――byuru）"
# JP: （びゅるうっ！　びゅっ！　びゅるるっ！　びゅぶっ！）
4036 = "（Byuruu! Byu! Byururu! Byubu!）"
# JP: （びゅっ！　ぶびゅっ！　びゅるっ！　びゅううっ！）
4038 = "（Byu! Bubyu! Byuru! Byuuu!）"
# JP: （びゅううっ！　ぴゅっ！　びゅびゅっ！　――びゅ」
4039 = "（Byuuu! Pyu! Byubyu! ――byu」"
# JP: （びゅうっ！　びゅっ！　ぶびゅっ！　びゅるるっ！）
4041 = "（Byuu! Byu! Bubyu! Byururu!）"
# JP: （きゅうううううんんっ！！）
4042 = "（Siết chặttttt!!）"
# JP: （きゅううううううううっ！）
4043 = "（Siết chặtttttttt!）"
# JP: （むにっ――もみっ――さわっ――さすっ――）
4047 = "（Nắn bóp――xoa nắn――sờ nhẹ――vuốt nhẹ――）"
# JP: （もみゅっ）
4048 = "（Xoa nắn）"
# JP: （ぷにゅっ）
4049 = "（Nắn bóp）"
# JP: （さすっ）
4050 = "（Vuốt nhẹ）"
# JP: （かちゃ、カチャっ）
4051 = "（Lách cách, lách cách）"
# JP: （こつん）
4052 = "（Cộc）"
# JP: （すりっ）
4053 = "（Cọ cọ）"
# JP: （ぐいっ！　ずりゅっ！　こしゅっ――こりゅん）
4054 = "（Giật! Trượt! Vuốt――sần sật）"

