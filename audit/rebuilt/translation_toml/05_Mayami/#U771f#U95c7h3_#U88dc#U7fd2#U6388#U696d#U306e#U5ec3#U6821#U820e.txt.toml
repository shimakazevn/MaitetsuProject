# JP: 「ゆーても、うちから誘っておいて……ねぇ」
2051 = "「Nói thế chứ, là do chị chủ động quyến rũ em trước mà……nhỉ.」"
# JP: 「いや、そんなことは無いだろう」
2053 = "「Không, làm gì có chuyện đó.」"
# JP: 「乗務に穴はあけられんし――久々のデート前だ。\nせっかくだから、溜めておきたいような気もする」
2060 = "「Không thể để lỡ chuyến trực được――hơn nữa sắp đến buổi hẹn hò sau bao lâu chờ đợi rồi.\\nNhân cơ hội này, tôi cũng muốn để dành thêm một chút.」"
