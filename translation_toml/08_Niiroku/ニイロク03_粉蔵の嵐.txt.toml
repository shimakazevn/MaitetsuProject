[script]
1013 = "――A, không! Không sao."
1016 = "――Giọng của Kiyoharu. Thật bình tĩnh. Nghe thấy vậy, mình cũng bình tĩnh lại một chút."
1017 = "――Nói dối, bởi vì, chuyện đó―― Bởi vì, mình, vẫn còn chưa được ra tuyến chính mà――"
1033 = "......Cảm thấy, hơi xấu hổ. Xấu hổ thật đấy, nhưng lỡ nói ra rồi, thì nói cho hết luôn."
1036 = "......Không kết nối được. Mở rộng kênh tần số hơn nữa――!!!?"
1037 = "......Không thể nào, tuyệt quá. Tất cả, hoàn toàn khác với shoujo manga mà."
1044 = "「――Nếu khiến họ nghĩ rằng Kiyoharu đang tiêu cực―― Thì có thể họ sẽ giở trò gì đó sao?」"
1045 = "「――Ừm.」"
1046 = "「――Ý anh là họ luôn sẵn sàng quay xe bất cứ lúc nào sao?」"
1048 = "「――Đoạn trưởng, đúng là người chịu trách nhiệm cao nhất của Kokura. Nhưng, ông ấy cũng chỉ là người chịu trách nhiệm cao nhất của Kokura mà thôi?」"
1057 = "「'Giải thể Đường sắt Hoàng gia. Bãi bỏ toàn bộ tuyến đường - Chuyển đổi thành đường bộ'! 'Hướng tới sự ra đời của công ty Xe buýt Aircra'」"
1059 = "「............」"
1074 = "「......Thông thường thì, tư nhân hóa và chia tách công ty là một đề xuất có lợi cho cả Đường sắt Hoàng gia.」"
1077 = "「......Niiroku. Đó chính là, thứ gọi là trách nhiệm. Công việc, và cuộc sống, nặng nề đến mức như vậy đấy.」"
1079 = "「......Tôi và cậu Akai, đã bàn bạc về chuyện khi tình huống này xảy ra, từ rất lâu rồi.」"
1081 = "「......Nhưng Đường sắt Hoàng gia đã không thể làm như vậy. Có lẽ, chính phủ hoặc là Meikoku, đã không cho phép họ làm điều đó.」"
1082 = "「......Ừm.」"
1084 = "「......Nếu Đường sắt Hoàng gia đứng ra chủ đạo, thì chuyện này rất dễ dàng. Vì sự tồn tại của đường sắt, tôi cứ nghĩ đương nhiên họ sẽ làm như vậy.」"
1086 = "「......Mức thâm hụt trong một năm vừa qua của Đường sắt Hoàng gia là hơn 830 tỷ yên. Khoản nợ lũy kế thực tế đã lên tới 37 nghìn tỷ yên.」"
1093 = "「......Quay lại câu chuyện lúc đầu, tư nhân hóa và chia tách công ty là một thành công lý tưởng.」"
1095 = "「......Ra là vậy, nếu biến thành một cuộc đấu tranh việc làm sa lầy, thì việc nhậm chức quản lý ở công ty mới sẽ trở nên khó khăn nhỉ.」"
1097 = "「......Bắt được Đoạn trưởng xe điện rồi, mọi người định sẽ làm gì?」"
1103 = "「......Để xem nào. Vậy, chúng ta vừa sắp xếp chữ ký vừa nói chuyện nhé.」"
1105 = "「......Ừm, thì――nếu có người của phía ban quản lý, họ sẽ báo cáo lại thái độ của Kiyoharu――sao?」"
1318 = "「Chuyện chi tiết để sau. Tóm lại hãy đến nơi an toàn nhất―― Đúng rồi, lái tàu Akai. Hãy đến chỗ của anh Akai đi!」"
1321 = "「Không――nhưng mà」"
1323 = "「Không――tiền bối hãy đứng ra dẫn đầu đi. Tôi sẽ dốc toàn lực hỗ trợ anh.」"
1325 = "「Cô vui là tôi thấy vinh hạnh rồi. Niiroku――Railord cuối cùng của tôi.」"
1327 = "「Không thể nào! Chuyện này tiến triển đến mức này, là vì bọn họ đã nắm chắc vị trí trong công ty mới rồi.」"
1329 = "「Lúc đó vì tôi xen vào―― Nên Kiyoharu mới không thể từ chối được đúng không?」"
1330 = "「Không thua kém Aircra sao―― À, đúng rồi――nó được phát triển vì mục đích đó mà.」"
1332 = "「Không biết. Tự nhiên nghe thấy tiếng động lớn, rồi tỉnh dậy. Vừa tỉnh dậy thì chị Shiro đã bảo tôi đến đây ngay.」"
1334 = "「Không!!!」"
1335 = "「Không phải là chắc chắn nữa. Tôi――đang yêu Kiyoharu.」"
1337 = "「Không, phía ban quản lý cũng muốn có vị trí trong thể chế mới―― Một khi họ muốn đạt được đánh giá cao, thì chúng ta có thể đưa ra điều kiện trao đổi.」"
1339 = "「Không, từ từ đã.」"
1341 = "「Từ trước đó nữa cơ. Kể từ khi xe tải động cơ diesel vươn lên trở thành phương tiện vận chuyển hàng hóa chủ lực, thì chuyện này đã diễn ra rồi.」"
1343 = "「Niiroku. Bây giờ thì――」"
1345 = "「Niiroku này――cô, định gánh vác trách nhiệm của cậu Akai theo cách nào đây?」"
1346 = "「Niiroku!! May quá! Em dậy rồi à!」"
1347 = "「Niiroku!?」"
1349 = "「Không sao đâu, Niiroku.」"
1351 = "「Cô đúng là đứa trẻ thích làm nũng nhỉ, Niiroku.」"
1352 = "「Niiroku, lùi lại đi.」"
1354 = "「Niiroku! May quá! Mau vào trong đi!」"
1356 = "「Niiroku. Tôi cũng――thích cô.」"
1359 = "「Bức tường người」"
1363 = "「Cái gì!?」"
1366 = "「Nhưng, tôi thích. Thích Kiyoharu. Dù không thuần khiết tôi vẫn thích. Rất thích. Cực kỳ thích.」"
1368 = "「Anh cũng biết ngại sao? Kiyoharu.」"
1369 = "「Nếu giải thể một lần, chúng ta có thể cắt bỏ những chỗ không sinh lời, và chỉ mua lại những chỗ sinh lời thôi sao!」"
1371 = "「Cô không sao chứ!? Thật may quá, tôi vừa định đi tìm cô đấy.」"
1374 = "「Cậu đọc cái này chưa!?」"
1375 = "「Quả thực, là vậy nhỉ. Chỉ có một điều duy nhất, là tôi hiểu rõ.」"
1378 = "「Cô hiểu được điều đó, tôi thấy nhẹ nhõm hẳn.」"
1380 = "「Không phải là rào chắn, nhưng về thực chất thì cũng giống vậy. Các cán bộ đang thay phiên nhau, tạo thành một bức tường người.」"
1386 = "「Chia tách tư nhân hóa. Nếu không có ai phất cờ khởi xướng và thống nhất phong trào, thì chuyện có thể thành cũng sẽ hóa hư không thôi.」"
1389 = "「Chuyện đó thì không ai biết được đâu. Ngoại trừ chính bản thân họ. Vì vậy, ở trước mặt người khác, tuyệt đối không được phản bác hay hùa theo.」"
1391 = "「Thế tóm lại tiền bối đứng về phe nào vậy!」"
1393 = "「Chưa biết vị gì cả. Lúc nãy ấy. Nên là, Kiyoharu――nếu được, thêm một lần nữa đi.」"
1394 = "「Ra là vậy, ra là vậy. Thật sự, rất hữu ích đấy.」"
1395 = "「Ra là vậy! Vì thế nên mới gọi là tàu tốc hành Executive [Express] à! Cô――à không, mấy gã [cấp trên] phía ban quản lý cũng khá đấy chứ.」"
1396 = "「Đó là. Choáng vì ngâm nước nóng? Sao? Không hiểu nữa. Lát nữa phải hỏi chị Shiro xem sao.」"
1403 = "「Có khi đã có người theo phe ban quản lý rồi cũng nên. Nỗi lo đó, cũng là một trong những lý do khiến tôi thử làm mình làm mẩy.」"
1404 = "「Sau khi hoàn thành thử nghiệm ở các nơi, tuyến đường thương mại cũng sẽ được mở rộng. Teiou - Nagoya - Osaka. Và từ Hakata, cũng sẽ mở rộng ngược lại.」"
1406 = "「Nhưng, mọi chuyện đã không diễn ra như vậy. Tức là bọn họ, ở một mức độ nào đó, cũng đang chờ xem tình hình thế nào.」"
1409 = "「Nhưng, chuyện lần này lại khác. Công ty Aircra―― Không, đúng hơn là, chính sách này được đưa ra theo mệnh lệnh của Meikoku.」"
1410 = "「Nhưng mà!」"
1412 = "「Nhưng, nếu bị đánh giá là không có dư địa đàm phán thì sẽ bị đè bẹp. Với quốc sách có liên quan đến Meikoku, những kẻ ở tầm cỡ như chúng ta không thể chống cự được đâu.」"
1413 = "「Nhưng mà! Cũng có những người nói xấu Master của chị Shiro! Bảo là 'Đã quay xe' rồi.」"
1416 = "「Bên kia có thế mạnh là giao hàng tận nơi (door-to-door) đấy. Làm sao mà thắng được điểm đó chứ?」"
1425 = "「Hí!!?」"
1426 = "「!!?」"
1429 = "「Fu kyu!!?」"
1434 = "「Là đối chiếu với những chữ ký tôi đã thu thập được. Sắp xếp lại theo thứ tự bảng chữ cái, loại bỏ những cái trùng lặp rồi lập thành danh sách.」"
1435 = "「!!?」"
1436 = "「!?」"
1438 = "「Hả? Chỗ của Akai á? Vâng? Tập hợp trước khi đến đó sao? ――Vâng, tôi hiểu rồi.」"
1440 = "「Ơ? Gì――gì vậy? Kiyoharu, ở đâu―― Là giấc mơ!!?」"
1441 = "「Những giao dịch kiểu đó, bọn tôi không thể nghĩ ra ngay được. Chỉ tổ bị bọn họ qua mặt thôi. Nên là, trăm sự nhờ cậu.」"
1444 = "「Nếu làm được thì tôi đã làm rồi. Nhưng, tôi là cán bộ của Công đoàn Đường sắt Hoàng gia. Với phía ban quản lý thì như nước với lửa vậy.」"
1446 = "「Đã nhờ vả đến mức này rồi, sao cậu vẫn không chịu nhận lời chứ.」"
1447 = "「Oa」"
1448 = "「Oa!?」"
1450 = "「Hả? Gì cơ.」"
1451 = "「!」"
1452 = "「!!!」"
1453 = "「A――」"
1454 = "「À――ra là cậu đã giấu cô ta đi.」"
1456 = "「A――aa!」"
1457 = "「A.」"
1458 = "「A!」"
1460 = "「! Hãy trốn ở đây một lát nhé. Được chứ? Tuyệt đối không được lên tiếng đâu.」"
1462 = "「A! Vì vậy nên mới là Akai nhỉ! Vì anh ấy luôn giữ khoảng cách với mọi tổ chức công đoàn và cả phía ban quản lý.」"
1463 = "「!!?」"
1464 = "「!?」"
1466 = "「!? Cô vẫn chưa biết sao?」"
1468 = "「Không――Niiroku. Không đâu――. Cái đó...... thành thật mà nói――tôi chỉ thấy hơi ngại thôi.」"
1469 = "「A! Đợi đã.」"
1471 = "「Hả? Của \\x%lクハ26;#00ffc040;Kuha 26%l;#;!?」"
1474 = "「Này? Chị Shiro.」"
1477 = "「A――Đã biết lo lắng đến mức đó rồi sao. Niiroku――cô, đã trưởng thành hơn rồi nhỉ.」"
1480 = "「A――không, tuyệt vời lắm, Niiroku. Hơn một trăm người rồi này.」"
1481 = "「Ừm.」"
1482 = "「Ừm!!!」"
1484 = "「Chà, là như vậy đấy. Còn có làm được hay không, lại là một chuyện hoàn toàn khác.」"
1485 = "「E he...... e hehehe......」"
1487 = "「Master của chị ấy làm sao có thể làm ra chuyện như vậy chứ!」"
1489 = "「Nghĩa là sẽ chia tách ngay trong nội bộ Kokura. Với điều kiện là thừa nhận quan điểm của nhau, chúng ta sẽ phân chia ranh giới hoạt động.」"
1491 = "「Vâng, tôi ra ngay.」"
1493 = "「May quá. Không phải là mơ.」"
1496 = "「Cứ làm vậy đi. Nhờ cô nhé.」"
1497 = "「Nếu không được như vậy――thì cứ thế mà kết thúc. Trong trường hợp đó, cũng chỉ có tôi, là Master của cô thôi.」"
1506 = "「Là chuyện đó! Này, rốt cuộc là sao vậy, Kiyoharu! Đã có chuyện gì xảy ra?」"
1508 = "「Tức là giải thể Đường sắt Hoàng gia một lần, rồi chia nhỏ nó ra. Sau khi làm vậy, sẽ thành lập các công ty mới.」"
1510 = "「Đúng vậy! Nếu việc giải thể Đường sắt Hoàng gia là không thể tránh khỏi thì chỉ còn cách làm thôi!!」"
1513 = "「Đúng vậy! Điện khí hóa được đẩy mạnh, \\x%l電車;#00ffc040;tàu điện%l;#; chạy khắp nơi thì」"
1515 = "「Dù không thuần khiết――dù không hiểu rõ」"
1518 = "「Dù không lật ngược được quyết định, thì ông ta cũng phải làm người trung gian chứ! Thế nên, phải bắt ông ta tập hợp ý kiến của chúng ta lại.」"
1520 = "「Dù trong trường hợp xấu nhất, chỉ cần cô còn ở lại, Đường sắt Hoàng gia――không, mồi lửa cho sự phục sinh của đường sắt, sẽ tiếp tục tồn tại.」"
1529 = "「Khoản thâm hụt từ thời xa xưa như vậy...... tích tụ đến mức này rồi, thì làm sao mà trả nổi chứ.」"
1533 = "「Là sao? Đã có chuyện gì xảy ra vậy??」"
1534 = "「Chuyện ngu ngốc này là sao chứ!? Mấy lão cấp trên đang nghĩ cái quái gì vậy!!!」"
1535 = "「Có lẽ là vậy. Công ty Xe buýt Aircra, nơi tiếp nhận sau khi giải thể, cũng sẽ trở thành biểu tượng cho sự chuyển đổi từ đường sắt sang Aircra.」"
1539 = "「Ý nghĩa là gì?」"
1541 = "「Tôi...... Niiroku. Là một kẻ nhát gan.」"
1542 = "「Không sao?」"
1544 = "「Như tôi đã nói, đằng nào tôi cũng định nhận lời. Nếu mất đi đường sắt, mọi thứ tôi đã chọn sẽ trở nên vô nghĩa.」"
1547 = "「Không vui! Không phải! Vui thì có vui nhưng mà phí quá! Rõ ràng là cơ hội để được nói chuyện nhiều hơn với Kiyoharu mà.」"
1548 = "「Việc đó, không hợp với tôi. Tôi không đủ mạnh mẽ để gánh vác trách nhiệm đó.」"
1550 = "「Một trong những lý do tôi tỏ vẻ không đồng ý là để xem quyết tâm của họ. Tôi muốn xem liệu có ai đứng ra nói 'Nếu vậy thì để tôi làm' hay không.」"
1552 = "「Ngay cả sự yêu thích của tôi, cũng không biết có thuần khiết hay không mà.」"
1553 = "「Tôi muốn giữ lại \\x%lクハ26;#00ffc040;Kuha 26%l;#;. Nếu có thể, cả tuyến đường Kokura - Hakata nữa. Như vậy đấy, thành công cũng có nhiều cấp độ khác nhau.」"
1557 = "「Tôi cũng nghĩ vậy. Vì cẩn trọng và nhát gan, nên Kiyoharu mới là lái tàu thử nghiệm tuyệt vời nhất.」"
1560 = "「Tôi cũng nghĩ vậy. So với việc biến thành sắt vụn để xử lý, thì bán cho những người cần chắc chắn sẽ được giá cao hơn.」"
1566 = "「Chỉ có anh Akai mới làm được thôi.」"
1567 = "「Chuyện đó chúng tôi sẽ hỗ trợ, cậu hãy nhận lời đi. Vì Kokura――vì muốn giữ lại tuyến đường sắt ở đây, hãy phất cờ khởi xướng đi.」"
1568 = "「Ghế ngồi rộng rãi thoải mái. \\x%lビュッフェ;#00ffc040;Quầy ăn nhẹ%l;#;. Rèm che. Cung cấp một chuyến đi vừa có thể thưởng thức bữa ăn nhẹ, vừa có thể làm việc.」"
1570 = "「Vừa làm việc thong thả――vừa thoải mái, khởi hành từ Teiou...... và cuối cùng là đến Hakata.」"
1571 = "「Tôi bảo từ từ đã mà.」"
1574 = "「Kiyoharu. Thích――rất thích anh.」"
1576 = "「Tôi có tình yêu, có sự cố chấp, và cả dục vọng đối với cô. Nhưng đối với tôi, liệu đó có còn là tình yêu thuần khiết hay không thì」"
1578 = "「Đúng là vậy, Niiroku. ......Tôi là kẻ nhát gan, tuyệt đối không thể trở thành anh hùng được.」"
1580 = "「Tôi hiểu rồi! Nếu có người như vậy, anh sẽ để người đó đứng ra dẫn đầu sao?」"
1582 = "「Tôi không hiểu hết về con người đâu. Nhưng―― Nếu là về Kiyoharu, thì tôi hiểu, vì tôi luôn quan sát anh mà.」"
1584 = "「Tôi hiểu rồi.」"
1586 = "「Tôi hiểu rồi. Chắc vậy. Cả chữ ký này, cả việc làm mình làm mẩy nữa. Tất cả――đều là để nâng cao mức độ thành công.」"
1588 = "「Tôi biết đó là mệnh lệnh, nên phải tuân theo. Nhưng mà――chị Shiro, trông có vẻ rất đau khổ.」"
1589 = "「Railord, của Kiyoharu?」"
1592 = "「Thứ mà tôi tuyệt đối không thể nhượng bộ chính là Niiroku――cô. Cô chính là kết tinh của những gì tôi đã dốc cả cuộc đời vào.」"
1595 = "「Tôi hiểu. Tôi là một cỗ máy như vậy. Chỉ cần có tôi, \\x%lクハ26;#00ffc040;Kuha 26%l;#; cũng có thể được phục nguyên cả đoàn.」"
1598 = "「Tôi biết. Nên tôi mới thích.」"
1599 = "「Trước cầu thang lên tầng ba, các cán bộ đang dựng rào chắn, là thật sao?」"
1601 = "「Vì vậy, chúng tôi đã bàn bạc với nhau. Đường sắt Hoàng gia nên phát triển theo hướng tư nhân hóa và chia tách thành các công ty con.」"
1603 = "「Chính vì vậy, tôi mới tỏ vẻ không đồng ý. Việc thể hiện thái độ không đồng ý đó, là có ý nghĩa của nó.」"
1604 = "「Nên, không ai có thể lên tầng ba được? Không thể nói chuyện với các cán bộ.」"
1607 = "「Nên là――không được nói 'Không phải!' sao? Đó cũng là, trách nhiệm sao?」"
1608 = "「Không, không phải!」"
1610 = "「Sắp xếp chữ ký?」"
1612 = "「Một khi đã nhận lời thì tôi sẽ làm cho thành công. Dù sao thì, ngay từ đầu tôi đã định nhận lời rồi.」"
1613 = "「Tôi hiểu rồi. Tôi sẽ nhập liệu, nên Kiyoharu hãy kiểm tra giúp nhé.」"
1615 = "「A――e hèm.」"
1617 = "「Đúng vậy. Nhưng chỉ có chỉ thị là được truyền xuống. Nếu có ý định chống đối, thì cũng sẽ bị cách chức ngay lập tức.」"
1619 = "「Đúng vậy. Việc Đoạn trưởng xe điện và những người khác từ chối gặp mặt, cũng đang thổi bùng lên sự bất an của mọi người.」"
1620 = "「Đúng vậy.」"
1622 = "「Đúng vậy, Niiroku là biểu tượng cho sự tái sinh của Đường sắt Hoàng gia―― Trong tình huống này, cô rất có thể sẽ trở thành mục tiêu công kích đầu tiên.」"
1624 = "「Vì nếu đường sắt bị tiêu diệt, thì việc phổ cập Aircra sẽ được tăng tốc sao?」"
1626 = "「Là vậy đấy. Nếu công ty mới được thành lập suôn sẻ, tôi sẽ không buông tay cô đâu. Tuyệt đối sẽ không giao cho bất cứ ai.」"
1628 = "「Ra là vậy―― Ừm, tôi nên bắt đầu giải thích từ đâu đây.」"
1630 = "「Chà, là chuyện đó đấy. Vì muốn bàn bạc chuyện đó, nên tôi mới dẫn mọi người đến chỗ cậu Akai.」"
1634 = "「Tốt nhất thì, tất nhiên là bắt họ rút lại quyết định giải thể Đường sắt Hoàng gia rồi.」"
1641 = "「Chỉ cần tham gia vào chủ đề đó thôi, cũng sẽ làm cho lập trường của đối phương trở nên tồi tệ hơn. Những chuyện như vậy, trên đời này có rất nhiều.」"
1644 = "「Tư nhân hóa――là ý gì vậy?」"
1651 = "「Đúng vậy. Vì Niiroku là Railord của tôi mà. Nên cũng phải gánh vác trách nhiệm giống như tôi.」"
1652 = "「Là vậy đó. Trăm sự nhờ cậu!」"
1653 = "「Đúng vậy. Việc vận hành được dự tính để chiến thắng Aircra. Với tư cách là một tàu tốc hành Executive [Express], bổ sung thêm sự thoải mái vào tốc độ.」"
1657 = "「Kiyoha」"
1659 = "「Kiyoharu――Tôi, thích Kiyoharu. Chắc chắn, tôi đang yêu Kiyoharu rồi.」"
1662 = "「Kiyoharu. Kiyoharu.」"
1667 = "「Kiyoharu.」"
1673 = "「Kiyoharu!?」"
1675 = "「Kiyoharu. Không sao đâu. Hãy đùn đẩy trách nhiệm của Kiyoharu cho tôi đi.」"
1679 = "「Vui quá! Kiyoharu! Không phải――My Master! Master đầu tiên và cũng là cuối cùng, của riêng mình tôi.」"
1683 = "「Kiyoharu. Chữ ký, chừng này đủ chưa?」"
1686 = "「Kiyoharu? Tôi, nói sai gì sao??」"
1693 = "「Tàu tốc hành? ......Nếu chỉ xét về mặt tốc độ của vận chuyển điểm cố định, thì đúng là sẽ không thua kém Aircra đâu nhưng mà」"
1702 = "「Tình hình hiện tại là như vậy. Đoạn trưởng xe điện――phía ban quản lý, cả Hiệp hội Cơ khí hay Công đoàn Hiện trường cũng vậy, hãy gác lại những đối đầu từ trước đến nay mà nói chuyện」"
1706 = "「Rất dễ để dự đoán rằng trong trường hợp xấu nhất mọi chuyện sẽ thành ra thế này. Lúc đó, chúng tôi đã suy nghĩ xem làm thế nào mới là tốt nhất.」"
1707 = "「Mục tiêu công kích á」"
1709 = "「Vâng, tôi đọc rồi. Không ngờ lại nhanh đến vậy, hành động cực đoan đến thế này.」"
1711 = "「Tuyệt thật đấy, Niiroku. Quả không hổ danh là cỗ máy hiện đại nhất. Mới đi vào hoạt động được hơn nửa năm, mà đã hiểu con người đến mức này rồi.」"
1724 = "「Đợi đã! Chị Shiro! ――Chị Shiro??」"
1731 = "「Không có chuyện đó đâu.」"
1734 = "「Nghe này? Tóm lại cứ đến chỗ anh Akai đi. Sẽ bị cuốn theo mất nên hãy ngắt cộng cảm ngay! Nhanh lên!」"
1735 = "「Còn phải hỏi sao! Yêu cầu rút lại quyết định ngu xuẩn này!」"
1740 = "「Sự thoải mái, chính là sự rộng rãi. Hướng tới những người coi trọng sự thoải mái hơn là lợi ích thực tế, nhắm vào tầng lớp thượng lưu đó để đảm bảo thị phần.」"
1744 = "「Phát điên mất thôi. ......Nếu cứ tiếp tục tiếp nhận những thứ như vậy.」"
1746 = "「Nếu có thời gian, tôi muốn nghe trong tư thế này. ――Cứ như thế này, hãy kể cho tôi nghe...... tất cả.」"
1748 = "「Nếu có trùng lặp sẽ có nguy cơ bị coi là chữ ký không hợp lệ. Những cái có mục chưa điền cũng hãy loại ra nhé.」"
1749 = "「Giải thể á!」"
1752 = "「Chuyện đó thì có lẽ là vậy, nhưng mà」"
1757 = "「Nói thẳng ra là vậy. Tùy thuộc vào điều kiện, cả bốn người bọn họ, ai cũng có khả năng quay xe.」"
1758 = "「Bắt cô ta im miệng đi! Chuyện này không đến lượt Railord xen vào đâu.」"
1762 = "「Nếu được thanh lý, chúng ta có thể nhận chuyển nhượng, hoặc mua lại. 'Chỉ những khu vực tuyến đường và toa xe mà chúng ta cần'.」"
1768 = "「Nếu là anh Akai thì chắc chắn làm được! Anh là niềm hy vọng của Đường sắt Hoàng gia, là lái tàu thử nghiệm được giao phó dòng \\x%lクハ26;#00ffc040;Kuha 26%l;#; mà!!」"
1780 = "「Cậu Akai!」"
1781 = "「Akai! Có ở đó không!?」"
1782 = "「Cậu Akai! Cậu Akai!」"
1784 = "「Cậu Akai. Lý do tôi đưa bọn họ đến đây, là vì chuyện đó đấy.」"
1785 = "「Cậu Akai. Railord đã nói đến mức này rồi đấy. Sao nào――cậu nhận lời giúp chúng tôi nhé.」"
1788 = "「Akai, cậu...... không lẽ đã thỏa thuận với phía ban quản lý rồi」"
1801 = "「Phía ban quản lý, làm sao mà chấp nhận chuyện đó được chứ.」"
1802 = "「Không, anh hỏi chúng tôi chuyện đó thì――」"
1803 = "「Làm được hay không làm được không quan trọng! Vấn đề là có làm hay không!!」"
1804 = "「Đó cũng là một trong những lựa chọn. Tôi là kẻ nhát gan. Hoàn toàn không hợp với việc đứng mũi chịu sào.」"
1805 = "「Đó là」"
1806 = "「Đó là, có ý gì――」"
1807 = "「Đây là quyết định của chính phủ. Không phải là thứ mà một Đoạn trưởng xe điện có thể lật ngược được đâu.」"
1808 = "「Tức là, vứt bỏ đường sắt sao!」"
1809 = "「Ra là vậy!」"
1810 = "「Thời gian hôn. Dài thêm――một chút nữa được không?」"
1811 = "「Vì Kiyoharu là thủ lĩnh mà. Hơn nữa...... dù không muốn nói nhưng, tôi nghĩ sự gia tăng của hoạt động [hồi tống phế xa] cũng là một động lực lớn.」"
1812 = "「!!!」"
1813 = "「Vậy thì nói cho tôi biết đi? Để thành lập công ty mới thì phải làm gì. Vì tương lai, vì để tiếp tục chạy cùng nhau.」"
1816 = "「Chuyện tốt đấy! Nếu làm được như vậy, Kokura sẽ sống sót!」"
1817 = "「Vậy thì! Xin anh đấy, anh Akai!!」"
1822 = "「Nếu vậy, với điều kiện là chấp nhận chuyển đổi sang thể chế mới, chúng ta chỉ cần bắt họ chấp nhận chuyện chia tách công ty là được.」"
1823 = "「Ngại chứ. Chuyện đó――tất nhiên rồi.」"
1824 = "「Đã quyết định rồi. Sẽ đưa \\x%lクハ26;#00ffc040;Kuha 26%l;#; vào vận hành thương mại trên tuyến chính. Tàu tốc hành của tôi――tàu tốc hành được tạo ra để không thua kém Aircra.」"
1826 = "「Cứ cho \\x%l電車;#00ffc040;tàu điện%l;#; chạy ầm ầm――rồi kiếm được bao nhiêu lợi nhuận, thì mới bù đắp được hết số thâm hụt của các tuyến đường địa phương chứ.」"
1828 = "「Vậy thì, việc tư nhân hóa và chia tách công ty sẽ rất khó khăn sao?」"
1833 = "「Ảnh hưởng của việc phổ cập Aircra――đã đẩy đường sắt đến mức đó sao.」"
1839 = "「Không phải chuyện đùa đâu!!」"
1840 = "「Tất nhiên, bình thường mọi người đều là những người tốt. Nhưng――con người, một khi đã rơi vào trạng thái hoảng loạn thì」"
1841 = "「Dù nguyên thủy nhưng lại rất hiệu quả. Chỉ cần chạm một ngón tay vào thôi là sẽ bị cảnh sát sờ gáy vì tội hành hung. Tiền trợ cấp thôi việc cũng sẽ không được nhận nữa.」"
1846 = "「Đoạn trưởng xe điện có vẻ đang lẩn trốn―― Akai, cậu, có biết gì không?」"
1847 = "「Đoạn trưởng xe điện đâu rồi! Phải hỏi cho ra nhẽ!!」"
1857 = "「37 nghìn tỷ!!?」"
1964 = "Không biết phải làm sao―― Không, nếu hỏi phải làm sao thì, mình biết!"
1968 = "Nhưng, không sao đâu. Nếu là hai người cùng với Kiyoharu, thì chuyện gì cũng làm được."
1969 = "Nhưng, vì là phương tiện cá nhân và có số lượng lớn, nên Aircra cá nhân không thể làm lớn được. Không có sự rộng rãi."
1980 = "Xoa xoa, rồi vò đầu mình một cách thô bạo."
1982 = "Anh ấy xoa đầu mình. Tay làm việc, phải dừng lại thôi. Xử lý song song, không thể nào làm được nữa rồi."
1984 = "Những cái xoa đầu trở nên mạnh mẽ hơn. Thật dễ chịu. Cảm giác hạnh phúc cứ thế lớn dần, lớn dần."
1985 = "Rõ ràng ông ấy đã đối xử tốt với mình như vậy mà―― Cảm thấy có chút bất an, và sợ hãi."
1986 = "Chỉ từ lúc này trở đi, chắc chắn sẽ giống hệt. Mình biết. Chuyện này, không thể nào nhầm được."
2004 = "Cộng cảm, đột nhiên bị ngắt rồi."
2009 = "Tiền bối, cùng ba người đi theo ngồi phịch xuống."
2010 = "Tiền bối im lặng. Mọi người, chăm chú nhìn Kiyoharu."
2011 = "Tiền bối nhìn Kiyoharu."
2012 = "Tiền bối, quay sang phía này. Đang cười――nhưng lại không mang đến cảm giác tốt lành."
2018 = "Lúc nãy, lúc nãy, Kiyoharu―― Chắc chắn đã nói! Chắc chắn, chắc chắn đã nói rồi!!!"
2019 = "Cảm giác vừa rồi――chắc chắn là thứ gọi là hoảng loạn. Tôi đã hiểu được lý do tại sao chị Shiro lại vội vàng đến thế."
2022 = "Vậy mà, tại sao những người này lại――"
2024 = "Nhưng, Kiyoharu vẫn tỏ ra bình thường. Nếu vậy, mình cũng sẽ nói chuyện bình thường."
2026 = "Nhưng Kiyoharu không hề hoảng hốt. Tiền bối cũng nhìn ba người với vẻ mặt bảo họ hãy bình tĩnh."
2028 = "Nhưng nhìn vào tình hình hiện tại thì chỉ có thể nghĩ như vậy thôi. Kiyoharu đã đưa mình về và đặt mình nằm ngủ."
2035 = "Thích. Thích. Thích. Thích. Cảm xúc trào dâng, không thể nào ngăn lại được."
2037 = "Chị Shiro, đã bảo rồi. Chỗ của Kiyoharu, là nơi an toàn nhất."
2040 = "Sự dồn dập đáng kinh ngạc. Tràn vào như thác đổ. Chị Shiro――đang hoảng hốt."
2041 = "Bởi vì chị ấy đang kéo những chuyến tàu hồi tống phế xa. Vì đó là công việc đau khổ nhất――nên chị ấy đã nhận lấy."
2045 = "Mọi người, giờ đây, đã bắt đầu gọi chị ấy là Tử thần."
2046 = "Có lẽ, với cùng một ánh mắt như khi nhìn mình. Bằng ánh mắt đáng sợ đó."
2050 = "Sợ quá. Cảm giác rất đáng sợ."
2052 = "Khó chịu quá. Không muốn đâu. Sợ quá. Không biết đã xảy ra chuyện gì nữa."
2057 = "Vui quá. Vui quá. Tủm tỉm cười mất thôi. Mình làm cho Kiyoharu ngại ngùng rồi!"
2058 = "Vui quá. Vui quá. Vui quá. Vui quá! Mạch điện, đang hoạt động hết công suất!"
2059 = "Vui quá. Cảm thấy nhẹ nhõm hẳn."
2066 = "Đúng rồi, hoảng loạn. Các chị, tất cả đều đang khóc――đang la hét."
2072 = "Công đoàn Đường sắt Hoàng gia. Tổ chức công đoàn lớn nhất của Đường sắt Hoàng gia. Luôn đối lập với phía ban quản lý, chị Shiro đã dạy mình như vậy."
2080 = "Hồi tống phế xa. Mỗi ngày vài toa, vẫn đang được tiến hành một cách chắc chắn. Cất công đưa từ Kokura, vận chuyển đến tận Moji."
2083 = "Cuộn xoáy, rất nhiều, vô số――cùng một lúc―― Tức giận, khóc lóc, hoang mang――!!?"
2086 = "Sâu trong bụng nhói lên một cái. Hơi đau âm ỉ một chút."
2088 = "Cả các chị, cả mình, và cả toa xe. Bị tháo dỡ――tất cả sẽ trở về con số không."
2090 = "Ép buộc bản thân cắt đứt cộng cảm―― Sau đó, nỗi sợ hãi từ từ ập đến."
2092 = "Mình là Railord hiện đại nhất, hiệu suất cao nhất. Là kiệt tác tuyệt vời nhất do Kiyoharu sinh ra mà."
2096 = "Vì vậy, mình mới thích Kiyoharu. Nghĩ vậy――cơ thể dần trở nên ấm áp. Cảm giác đong đầy."
2097 = "Không thể nghĩ được gì khác nữa. Muốn mãi mãi ở bên Kiyoharu. Muốn bảo vệ Kiyoharu."
2101 = "Cảm nhận được điều đó, mình càng bình tĩnh hơn. Tóm lại cứ lắng nghe đã, mình có thể tập trung rồi."
2104 = "Mình hiểu rồi. Lý do Kiyoharu giấu mình đi. Hoảng loạn, rốt cuộc là như thế nào."
2106 = "Mình đã thực sự hiểu về Kiyoharu. Dù trong hoàn cảnh này, chỉ riêng điều đó thôi cũng khiến mình thấy vui lây."
2107 = "Không thể, lý giải nổi. Khi chưa tìm ra nguyên nhân, thì làm sao có thể giải quyết được chứ."
2108 = "Mình, biết điều đó. Kiyoharu tất nhiên, cũng biết."
2110 = "Mục đích của bản thân, những điều cần đạt được. Vì đã được nhồi nhét kỹ lưỡng, nên có thể truyền đạt lại không sai một ly."
2112 = "Mình biết. Vì chị Shiro từng than vãn rồi. Thị phần hàng hóa bị xe tải cướp mất, Vận tải hàng hóa Đường sắt Hoàng gia bị tách riêng."
2113 = "Giọng nói lớn. Tiếng bước chân. Đúng rồi, mình――chắc chắn đã bị đánh thức bởi những âm thanh đó."
2115 = "Bị đẩy vào――bị giấu đi, là ở bên trong tủ âm tường. Chỉ có một khe hở nhỏ...... cái này, có nên đóng lại không nhỉ?"
2116 = "Vì vậy, phải đi thôi. Dù không được bảo, mình cũng nhất định sẽ đi."
2118 = "Mình đã đến nhà Kiyoharu, đi tắm. Sau đó, mình bị choáng váng――"
2121 = "Trách nhiệm, mình đã dần dần thực sự hiểu được nó là gì ――và cũng vì thế mà dần trở nên bất an."
2122 = "Nhưng, mình hiểu. Mình đã hiểu rồi."
2130 = "Những cái xoa đầu, dừng lại. Mình được ôm vào lòng."
2138 = "Có rất nhiều điều tôi muốn Kiyoharu làm cho mình, đó là dục vọng hay tình yêu, tôi cũng không rõ nữa."
2143 = "Thay vì mình, thì Kiyoharu, hiện tại đang bị lôi ra làm mục tiêu công kích."
2174 = "Kiyoharu cũng hiểu điều đó. Nên mới vừa làm việc vừa nói chuyện với mình."
2176 = "Kiyoharu không nói gì. Cũng không rót trà."
2180 = "Cuối cùng, Kiyoharu vừa nói từ cuối cùng! Như vậy chắc chắn có nghĩa là, ở công ty mới cũng là cuối cùng!!"
2181 = "Kiyoharu, đáng yêu quá. Đang cố che giấu sự ngại ngùng kìa."
2183 = "Vẫn còn đó. Nhà của Kiyoharu, bùa hộ mệnh của Đền Akai Aso."
2186 = "Kiyoharu định rời người ra, mình không muốn thế nên đã buột miệng kêu lên."
2188 = "Ôm thật chặt. Kiyoharu ôm lấy mình."
2189 = "Bàn tay, bàn tay đang xoa đầu mình, dừng lại rồi."
2190 = "Kiyoharu, sẽ sử dụng mình và \\x%lクハ26;#00ffc040;Kuha 26%l;#;, cho đến tận lúc bị phế bỏ, tháo dỡ luôn!!"
2193 = "Ôm thật chặt, thật chặt. Thật mạnh. Thật mạnh. Nhưng không hề thấy khó thở. Mình còn muốn anh ấy ôm chặt hơn nữa cơ."
2194 = "Bàn tay của Kiyoharu, thật to, thật ấm áp."
2196 = "Khuôn mặt của Kiyoharu, đang tiến lại gần. Râu ria lởm chởm. Làn da, hơi sần sùi một chút."
2198 = "Bị Kiyoharu kéo mạnh vào trong. ――Đang được ôm chặt."
2199 = "Khuôn mặt Kiyoharu, trông rất đau khổ. Khuôn mặt giống như lúc anh ấy nói về 'trách nhiệm'――."
2201 = "Kiyoharu, cười. Cười khúc khích thật dịu dàng."
2204 = "Giọng của Kiyoharu. Không phải nói với bốn người trước mặt―― Mà là đang nói với mình."
2209 = "Nếu là Kiyoharu, dù có chuyện gì xảy ra đi chăng nữa―― anh ấy cũng sẽ bảo vệ mình khỏi sự hoảng loạn này."
2212 = "――Khác với những gì mình đọc trong shoujo manga. Không phải là kiểu tim đập thình thịch, mà là một sự thích ấm áp. Một sự thích tĩnh lặng."
2213 = "Cảm giác lâng lâng, tim đập thình thịch. Chỉ có hai người ở bên nhau, thật sự rất hạnh phúc."
2217 = "Vì vậy, mình có thể ngoan ngoãn đòi hỏi."
2223 = "Quyết định đó, chẳng những không giúp giải quyết thâm hụt, mà còn hoàn toàn phản tác dụng."
2226 = "'Quyết định'――nếu quyết định giải thể Đường sắt Hoàng gia là thật. Thì người có thể làm được chuyện đó――"
2227 = "Và, đôi môi――đôi môi, đôi môi!"
2228 = "Và bởi vì mình, là Railord điều khiển tổng hợp \\x%lクハ26;#00ffc040;Kuha 26%l;#;. Chính là biểu tượng hy vọng cho sự phục sinh của Đường sắt Hoàng gia."
2232 = "Trước câu nói của tiền bối, cả ba người đồng loạt im bặt."
2233 = "Trước câu nói của tiền bối, tất cả mọi người trừ Kiyoharu đều gật đầu với vẻ mặt 'À ra thế'."
2234 = "Còn có rất nhiều tổ chức công đoàn khác, và các công đoàn cũng đối lập với nhau. Mình đã nghe kể rồi."
2244 = "Đoạn trưởng xe điện. Kể từ khi có tin tức giải thể Đường sắt Hoàng gia, ông ấy thực sự không gặp bất cứ ai, kể cả Kiyoharu."
2249 = "Hôn. Một nụ hôn chụt. Chỉ một lần, rất ngắn ngủi."
2251 = "Xoa xoa. Nhẹ nhàng. Cơ thể, cũng dần trở nên ấm áp."
2253 = "Được khen, mình thấy rất vui. Nhưng dữ liệu, thì phải đưa ra một cách chính xác."
2254 = "Mọi người, bởi vì. Nếu không có chuyện này xảy ra thì vẫn mãi là đồng đội mà."
2261 = "Giải thể Đường sắt Hoàng gia? Bãi bỏ toàn bộ tuyến đường?"
2262 = "Có lẽ đã xảy ra chuyện gì đó. Thử hỏi chị Shiro xem sao."
2263 = "Nếu chuyện đó xảy ra―― Nghĩ đến đó thôi, mình lại thấy vô cùng sợ hãi."
2268 = "Trách nhiệm. Quả nhiên, Kiyoharu đang nghĩ như vậy. Anh ấy đang đau khổ vì điều đó."
2276 = "Tháo dỡ xong là lập tức chất lên tàu, rồi chở đi. Nghe nói Moji bây giờ, chỉ còn làm mỗi việc đó thôi."
2288 = "Vì vậy――vì vậy. Quá ngắn, chưa kịp hiểu gì, nên lại muốn biết thêm."
2289 = "Một từ mới học được. Quay xe. Chuyển hướng. Một từ rất đáng ghét. Từ phe công đoàn, chuyển sang làm đồng minh cho phía ban quản lý."
2290 = "Khác với trong manga. Trong manga thì ngực mới là chỗ đau. Nhưng, mình hiểu. Nói ra thành lời rồi, lại càng hiểu rõ hơn."
2291 = "Làm như vậy, sẽ đảm bảo được công việc ở công ty mới ――tức là vứt bỏ công việc từ trước đến nay, vứt bỏ đường sắt."
2292 = "Như vậy là không đúng. Hoàn toàn ngược lại. Vì mình, chỉ là một công cụ thôi mà."
2293 = "Xoa đầu, xoa đầu. Lần này thì chậm rãi, thật dịu dàng, thật dịu dàng."
2294 = "Loại công việc này, Railord nào cũng giỏi cả. Huống hồ mình còn là cỗ máy hiện đại nhất. Xử lý song song cũng dư sức."
2295 = "Quần áo...... chắc chắn là Kiyoharu đã mặc cho mình rồi. Hơi xộc xệch một chút. Nhưng mà, mình thấy vui――không!"
2296 = "Người bước vào, là một gương mặt quen thuộc. Lái tàu thử nghiệm toa xe tự hành. Tiền bối của Kiyoharu――của lái tàu Akai."
2298 = "Còn có cả các thợ máy――và lái tàu nữa, chắc vậy?"
2300 = "Ba người nhỏm dậy. Đáng sợ quá. Mắt họ, như hằn lên những tia máu."
2302 = "Cái gì kia? Báo à? Hình như, có in hình một đoàn tàu rất lớn――"
2304 = "Vì đã được dạy cho rất nhiều điều khó hiểu. Vì suy nghĩ ngày càng trở nên rườm rà phức tạp."
2305 = "Mình rất hiểu đây không phải là lúc cho chuyện đó. Nhưng mà――vui quá không kìm lại được!!!"
2306 = "Nghe nói Aircra cũng là lái tự động, nên nếu muốn thì làm việc hay ăn uống đều được cả."
2307 = "Cố tỏ ra nói chuyện bình thường――nhưng giọng nói vẫn có vẻ buồn bã. Chuyện đó cũng là đương nhiên thôi."
2322 = "（Soạt――）"
2323 = "（Lạch cạch lạch cạch lạch cạch）"
2325 = "（Ừm. Tuyệt đối không phải lúc để đối đầu nhau. Bởi vì đây là thời khắc sinh tử, Đường sắt Hoàng gia có thể sẽ biến mất）"
2327 = "（Thích Kiyoharu. Thích Kiyoharu. Thích Kiyoharu. Thích Kiyoharu）"
2328 = "（Tôi không muốn bị tháo dỡ đâu! Không muốn! Tôi muốn trốn chạy）"
2330 = "（Nên mới trở thành――'Mục tiêu công kích'）"
2331 = "（Cứu tôi với. Cứu tôi với. Cứu tôi với――Cứu tôi với!!!）"
2333 = "（Tại sao lại thành ra thế này――tôi đã cố gắng hết sức rồi mà）"
2338 = "（Đây chính là, hoảng loạn. Đây chính là――'Mục tiêu công kích'）"
2340 = "（Ngừng đưa ra phán đoán của bản thân, và tìm một nơi để trút giận―― Nếu không thì, sẽ tìm kiếm sự cứu rỗi từ một ai đó）"

[selections]
