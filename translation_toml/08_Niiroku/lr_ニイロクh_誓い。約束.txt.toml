1562 = "「Từ trước khi mở niêm phong, chỉ có chỗ này là...」"
1563 = "「Việc cơ chế niêm phong được mở ra là thế này đây, Niiroku.」"
1569 = "「Âm, vật cũng──phù──a──ngực, cũng── rồi cả, âm đạo, nữa──lúc nãy, vẫn còn──ưm!」"
1570 = "「Âm, vật──phù──âm vật, thích lắm. Được liếm láp──sướng, lắm──ưm.」"
1571 = "「Âm, vật, cũng──phù! A! Cửa, âm đạo, cũng──cả lỗ, đi tiểu──tất cả, tất cả」"
1572 = "「Âm, vật──chỗ──phồng──lên── á──ưm──hà──nữa đi, nữa đi」"
1573 = "「Sâu bên trong cửa âm đạo, có âm đạo. Đó là nơi, dùng để làm tình.」"
1574 = "「Vậy thì, trước tiên──」"
1578 = "「!」"
1580 = "「~~~~~~~~~~~~~~~~~~~~~~~~~!!!!」"
1667 = "Trong nháy mắt, núm vú đã nảy bật lên đầu ngón tay. Bầu ngực cũng lún xuống mềm mại hơn nhiều so với ấn tượng bề ngoài."
1673 = "Không chút ngại ngùng, Niiroku phơi bày bộ ngực trần cùng cơ thể mỏng manh của mình trước mắt tôi."
1675 = "Như để đáp lại chuyển động ngón tay tôi, Niiroku cũng bắt đầu uốn éo hông. Dòng ái dịch tuôn trào làm ướt đẫm ngón tay tôi."
1677 = "Hông của Niiroku chuyển động. Chỉ một chút thôi. Nhưng rất rõ ràng. Cô ấy đẩy sâu khe hở của mình──vào dương vật của tôi."
1679 = "Tốc độ và nhịp điệu này, có lẽ chính là thứ mà vòng eo đang uốn éo vụng về của Niiroku khao khát."
1681 = "Niiroku đang do dự điều gì đó. Cảm nhận được điều đó, dù rất khổ sở, tôi vẫn phải huy động toàn bộ lý trí."
1684 = "Niiroku lót chiếc gối nệm yêu thích xuống dưới mông. Và rồi làm theo chỉ dẫn của tôi──"
1686 = "Kinh ngạc và thán phục. Đó là tất cả những gì hiện lên trên nét mặt cô ấy. Quả thật cô ấy vô cùng trong sáng đối với chuyện tình dục... Tôi cảm thấy điều đó cùng với sự nhẹ nhõm."
1688 = "Chuyển động hông vô cùng vụng về của Niiroku, lại càng thổi bùng lên dục vọng thấp hèn và ham muốn xuất tinh trong tôi."
1689 = "Đang nói dở, cô ấy giật mình nuốt lại lời."
1693 = "Trái tim Niiroku khẽ run lên. Đến mức ngón tay kẹt giữa khe thịt cũng cảm thấy đau nhói."
1696 = "Giọng nói của Niiroku. Hơi ấm của Niiroku. Mùi hương thoang thoảng. Mồ hôi và sự trơn ướt. Cảm giác áp sát đến phát điên, và hương vị của làn da."
1697 = "Cô ấy dụi đầu cọ cọ vào tôi như một con thú nhỏ, làm nũng một cách vô cùng dễ hiểu."
1698 = "Niiroku đã bắt đầu biết xấu hổ về chuyện tình dục── Sự thấu hiểu đó tự ý khiến dương vật tôi giật nảy và run lên bần bật."
1700 = "Nơi \"tận cùng\" nằm ở cuối âm đạo của Niiroku. Nhưng đó không thể nào là tử cung được."
1702 = "Niiroku thoáng lộ vẻ ngạc nhiên. Sau đó cô ấy gật đầu thật sâu."
1703 = "Gật đầu. Niiroku khẽ nhắm mắt lại. Nhắc mới nhớ──dù chúng tôi đã trao nhau không biết bao nhiêu nụ hôn rồi."
1713 = "Hơi ấm mộc mạc của chất vải cotton, có vẻ hơi dày so với đồ lót thông thường. Men theo cảm giác phía sau lớp vải ấy, tôi di chuyển ngón tay lên xuống."
1721 = "Đôi mắt màu táo xanh đang ngấn lệ và dao động trước khoái cảm tình dục có lẽ là lần đầu tiên được nếm trải, đã nhìn thẳng, bắt trọn lấy ánh mắt tôi."
1723 = "Nếu cấu tạo giống hệt con người──ý nghĩ thoáng qua đó tôi không nói thành lời. Tôi từng nghe nói là gần như giống hệt nhau."
1724 = "Cửa âm đạo vừa đạt cực khoái lại càng thêm tan chảy bởi nụ hôn dồn dập."
1731 = "Dù Niiroku không vòi vĩnh, tôi cũng mong muốn điều đó. Cả tâm hồn, lẫn thể xác. Muốn được lâu hơn. Sâu hơn và mạnh mẽ hơn."
1733 = "Dù xấu hổ, nhưng Niiroku không hề né tránh ánh nhìn. Cô ấy nhìn chằm chằm vào thứ xấu xí đó với vẻ đầy hứng thú và vui sướng."
1741 = "Cảm giác chèn ép và khít khao không hề suy giảm chút nào. Toàn bộ dương vật vẫn tiếp tục bị siết chặt gắt gao──"
1746 = "Nuốt nước bọt cái ực, đôi mắt trông có vẻ thích thú nhìn xuống bộ phận sinh dục của chính mình."
1749 = "Không cần cô ấy nói, tôi cũng không thể dừng lại được nữa. Tôi đã vượt qua cả nhịp điệu và tốc độ mà Niiroku yêu thích."
1750 = "Tiếp nhận và mô phỏng theo chuyển động lưỡi của tôi, cô ấy thay đổi từng chút một, rồi đánh giá phản ứng của tôi."
1753 = "Được đòi hôn, bị cuốn theo hơi nóng của nhau, chìm đắm trong sung sướng── Chính vì quá háo hức... mà tôi vẫn chưa nói ra những điều cần phải nói."
1754 = "Không phải nhìn tôi. Mà cô ấy đang nhìn chằm chằm vào cơ thể mình. Bàn tay trắng trẻo rụt rè chạm vào bụng dưới, rồi lần dần xuống."
1758 = "Miệng há hốc thở dốc, thè cả chiếc lưỡi ngắn ra, Niiroku thở hổn hển từng nhịp lớn."
1759 = "Kỳ vọng. Khoái cảm. Sự tò mò. Tôi cảm giác có chút e sợ lẫn lộn trong đó."
1762 = "Cô ấy khẳng định dứt khoát bằng ánh mắt không chút chần chừ. Đuôi mắt dịu dàng cong lên."
1764 = "Chuyển động của lưỡi dừng lại. Khẽ mở hờ đôi mắt, Niiroku đang──"
1765 = "Dù nhỏ nhắn──hay có lẽ chính vì nhỏ nhắn, mà khoái cảm tình dục dường như rất mạnh mẽ."
1767 = "Những ngón tay ngắn ngủn chặn lấy môi tôi."
1769 = "Áp lực lên ngón tay tôi mạnh hơn, như thể muốn tôi ngoáy sâu hơn nữa. Nhưng lúc này tôi vẫn chưa đáp ứng, chỉ nhẹ nhàng, đều đặn."
1771 = "Những cơn run rẩy nhỏ như co giật. Ái dịch trào ra ướt át. Có lẽ Niiroku đã đạt đến cao trào nhẹ."
1772 = "Bật cười khúc khích. Ngón tay lướt dọc theo đường nét đôi môi tôi một lần."
1774 = "Nghe đến đó, tôi mới chợt nhận ra sự ngu ngốc của bản thân."
1792 = "Dương vật đã cương cứng tột độ run lên vì những kỳ vọng đen tối. Đúng là bây giờ, tôi có thể bắt cô ấy làm bất cứ chuyện gì. Nhưng."
1794 = "Bắt đầu giải thích từ đâu, như thế nào mới là cách tốt nhất đây── Vì không biết, nên tôi cứ để mặc lưỡi và môi cử động theo bản năng."
1795 = "Ham muốn dâng cao tột độ, khiến tôi thậm chí cảm thấy nó nặng trĩu. Đã bao nhiêu năm rồi nó mới lại nóng hổi và cương cứng đến thế này nhỉ."
1801 = "Chìm đắm, tan chảy vào tất cả mọi thứ. Tôi muốn hòa tan chính bản thân mình, hòa quyện vào Niiroku."
1804 = "Chuyển động của hông tự nhiên trở nên mạnh bạo hơn. Sự ngọ nguậy bên trong âm đạo của Niiroku đang đòi hỏi tôi làm thế."
1805 = "Liệu bản thân tôi có ôm ấp thứ tình cảm thuần khiết── đúng như những gì Niiroku tưởng tượng hay không, tôi không biết nữa."
1811 = "Áp sát cơ thể, trao nhau nụ hôn ngắn ngủi, hông tôi tự nhiên cử động. Sự chênh lệch về thể trạng. Sự khác biệt giữa con người và Railord."
1812 = "Thật tĩnh lặng. Như một lời nguyện cầu. Nụ hôn thề ước đầu tiên của hai chúng tôi──."
1813 = "Về tư thế thì đây là mô phỏng làm tình. Dương vật xấu xí của tôi đang áp sát, như thể muốn đâm xuyên vào khe hở dọc đáng yêu của Niiroku."
1814 = "Vốn đã áp sát vào nhau, cộng thêm ái dịch tuôn trào không ngừng, biến phần da cọ xát vào nhau thành một khoang âm đạo giả."
1816 = "Khi tôi dừng ngón tay lại, một tiếng thở hắt nóng bỏng nhưng có vẻ nuối tiếc vang lên. Và rồi Niiroku từ từ──"
1818 = "Trao nhau nụ hôn── Đồng thời Niiroku run lên từng cơn dữ dội."
1820 = "Suýt chút nữa tôi đã căm ghét bản thân vì đem so sánh với vợ cũ. Chính vì thế, tôi làm nũng với Niiroku. Làm nũng, và chìm đắm──"
1822 = "Muốn dạy cho cô ấy những cái tên thô tục. Tôi hòa tan dục vọng đó vào từng nhịp đẩy hông để xua tan nó đi."
1824 = "Tôi gần như đã chắc chắn chuyện gì đang xảy ra. Không── là do tôi gây ra mới đúng. Bởi vì tôi đã khao khát được hòa làm một với cô ấy."
1826 = "Muốn tăng tốc. Muốn mạnh bạo hơn. Kìm nén khao khát đó lại, tôi chỉ một mực duy trì nhịp điệu và tốc độ mà Niiroku mong muốn."
1827 = "Một cảm giác kháng cự mãnh liệt khác thường, và cảm giác như vừa cắt đứt một thứ gì đó mỏng manh."
1829 = "Khoái cảm mãnh liệt đến mức tưởng chừng như ruột gan đều bị lôi tuột ra theo dòng tinh dịch, khiến cơ thể tôi bất giác sụp xuống──"
1831 = "Cởi bỏ quần áo của Niiroku, ôm lấy eo cô ấy, và để lưng cô chìm vào chiếc gối nệm."
1834 = "Tôi ôm chặt cô ấy vào lòng, ép sát đầu cô ấy vào ngực mình. Như muốn dùng nhịp tim và hơi ấm để truyền đạt rằng, cô là của tôi, và tôi cũng là của cô."
1835 = "Tôi luồn ngón tay vào khe hở dọc, bắt đầu di chuyển chầm chậm. Màu đỏ chứng minh cho việc mở niêm phong dần bị rửa trôi bởi những giọt sương trong vắt."
1839 = "Ôm chặt lấy vòng eo đang nảy lên mạnh mẽ, tôi dồn hết sức đâm sâu dương vật vào!"
1840 = "Tôi siết chặt lực ôm eo Niiroku, gần như cố định cô ấy lại."
1841 = "Tôi cố kìm nén để đôi tay đang ôm cô ấy không trở nên thô bạo. Nhưng hông tôi lại cứ liên tục thúc về phía làn da mềm mại của Niiroku──"
1843 = "Biết rõ không phải vậy, nhưng tôi vẫn cố tình hỏi. Bởi vì đường âm đạo chật hẹp của Niiroku đang run rẩy đầy ngọt ngào."
1846 = "Tôi thoáng bối rối về từ ngữ và cách truyền đạt, nhưng rồi nhanh chóng gạt đi."
1848 = "Ôm chặt lấy eo cô ấy và ép sát vào, tôi dùng toàn bộ phần cương cứng chậm rãi cọ xát vào âm vật của Niiroku."
1850 = "Khi tôi áp lưỡi mình lên chiếc lưỡi ấy, Niiroku lập tức mút lấy. Nụ hôn hòa quyện nụ hôn. Làn da chạm lấy làn da, tất cả hòa làm một ở khoảng cách bằng không."
1852 = "Niiroku hơi cứng người lại trong khoảnh khắc khi lưỡi tôi quấn lấy. Nhưng ngay sau đó, cô ấy rụt rè bắt đầu cử động chiếc lưỡi ngắn của mình."
1855 = "Trái tim tôi giật thót, đập liên hồi. Sức nóng của cơ thể, lan truyền thẳng đến tận sâu thẳm trong tim."
1856 = "Dùng xương mu kích thích âm vật. Chuyển động vốn dĩ vì mục đích đó, nhưng lại biến thành sự xoa dịu cho âm đạo."
1858 = "Ánh mắt tôi bị hút chặt vào đó. Chiếc quần lót vô cùng giản dị, có vẻ như là hàng được cấp phát, và rồi──"
1860 = "Dương vật đau nhức và cương cứng, đòi hỏi chiếc lưỡi của Niiroku. Khao khát được bao bọc trong hơi nóng, sự trơn trượt và độ ẩm ướt đó."
1862 = "Hai bàn tay vốn đang xoa nắn bầu ngực để nới lỏng âm đạo, nay lại tóm chặt lấy eo Niiroku một cách thô bạo."
1863 = "Tôi tiếp tục nhẹ nhàng di chuyển ngón tay lên xuống, làm nhòe đi đường viền màu đỏ thấm trên quần lót."
1864 = "Chính vì vậy, tôi tiếp tục giải thích. Bởi vì tôi muốn cô ấy làm tình──trong sự hiểu biết."
1867 = "Khoái cảm đã bắt đầu lấn át sự bối rối. Nhận thức đó đã khơi dậy ham muốn──nhục dục và cả dục vọng chiếm hữu trong tôi."
1870 = "Khi tôi lướt lưỡi liếm tiền đình âm đạo đang mở rộng và phơi bày ra đó, Niiroku cất lên tiếng rên rỉ đầy nũng nịu."
1872 = "Dùng lưỡi lau đi những giọt nước mắt rơm rớm trên khóe mi, tôi ép sát hai cơ thể vào nhau, dùng xương mu kích thích âm vật của cô ấy."
1873 = "Chính vì vậy, những lời nói thốt ra để không bị cuốn trôi theo dục vọng, lại đổi lấy một nụ cười rạng rỡ ngoài mong đợi từ Niiroku."
1875 = "Phần giữa quần lót. Khi tôi nhẹ nhàng vuốt ve chỗ thấm đỏ, giọng nói của Niiroku cũng nhuốm một sắc thái mới lạ."
1888 = "Không phải để sau, mà cô ấy muốn được sướng hơn ngay bây giờ. Thứ cảm xúc phơi bày quá đỗi rõ ràng ấy, tôi cảm thấy thật đáng yêu."
1891 = "Tôi đón nhận sự mềm mại đang dần trở nên táo bạo ấy vào khoang miệng mình. Niêm mạc và nước bọt quấn quýt lấy nhau, phát ra những tiếng lép nhép."
1896 = "Có lẽ đó là năng lực học hỏi vô cùng cao siêu và bình tĩnh của một tạo vật. Nhưng thành quả của nó lại tác động đến tôi một cách vô cùng nguyên thủy."
1900 = "Tôi hoàn toàn không thể tin được Railord là một tạo vật nữa. Âm đạo này──sự ngọ nguậy này đang đòi hỏi tôi phải phóng tinh."
1901 = "Nếu bộ phận sinh dục nam là bé trai, thì bộ phận sinh dục nữ là bé gái. Một cách gọi thật đáng yêu và vô cùng phù hợp."
1920 = "Tinh dịch tụ lại thành một khối lớn nóng rực, chực chờ tuôn trào ra khỏi niệu đạo. Nhưng, nhưng mà──thêm một chút nữa thôi──"
1925 = "Nói ra rồi tôi mới chợt hiểu. Có thể là tôi hiểu lầm, nhưng lý do Niiroku do dự không dám hỏi là vì──"
1938 = "Nếu tăng tốc, tôi sẽ xuất tinh mất. Nên tôi chỉ cọ xát nhẹ nhàng, thật chậm rãi, thế mà──"
1946 = "Nói rồi, Niiroku nuốt nước bọt cái ực rõ to."
1955 = "Vì câu hỏi hoàn toàn ngoài dự đoán, nên tôi gần như trả lời theo phản xạ."
1956 = "Sao thế nhỉ, không phải là bối rối, cũng chẳng phải sợ hãi── À, ra là..."
1957 = "Nụ hôn nhễ nhại mồ hôi trong trạng thái kiệt sức. Một nụ hôn dài."
1959 = "Những cơn co giật khe khẽ truyền đến dương vật đang kẹt chặt bên trong. Thế này──cứ thế này──chỉ cần tiếp tục chuyển động thế này──"
1962 = "Ẩn sâu bên dưới lớp đồ lót được cởi ra chậm rãi, là một khe thịt vô cùng giản dị."
1963 = "Dù tôi hiểu tất cả những điều đó chỉ là chuyện nhỏ nhặt── Nhưng cửa âm đạo quá đỗi chật hẹp dường như không muốn tiếp nhận quy đầu của tôi."
