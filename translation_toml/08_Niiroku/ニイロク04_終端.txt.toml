1922 = "「Vì vậy, ở công ty đường sắt mới,\\ntôi muốn trân trọng việc cùng nhau trò chuyện, cùng nhau truyền đạt.」"
1924 = "「Toàn bộ thủ đoạn sao!」"
1930 = "「Vậy nha, chị. Bye bye, hẹn gặp lại!\\n——Ưm.」"
1932 = "「Em hiểu rồi. Nếu tiến hành công tác một cách bất cẩn đến tận Moji,\\nthì khả năng bị lộ chắc chắn sẽ tăng vọt.」"
1934 = "「Em hiểu rồi. Cảm ơn chị Shiro. Ưm, ưm.\\nEm yêu chị lắm! Vậy nha, hẹn gặp lại!」"
1937 = "「Đúng——vậy nhỉ.\\nChỉ còn cách làm quen thôi——với mọi thứ, và với cả môi trường mới nữa.」"
