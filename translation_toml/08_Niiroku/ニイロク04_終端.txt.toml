2010 = "「Để xoa dịu tình hình——\\nhọ sẽ cắt nhượng những tuyến đường sắt có thể tồn tại tạm thời, cùng với các toa xe kiểu cũ.」"
2011 = "「Nếu đã làm đến mức đó——thì anh Goto,\\ntại sao lại không cứu cả \\x%l操作板;#00ffc040;thẻ bảng%l;#;?」"
2023 = "「Tất nhiên rồi.」"
2024 = "「Tất nhiên là được rồi. Tôi mở \\x%l乗務鞄;#00ffc040;túi phi hành đoàn%l;#; ra nhé.」"
2025 = "「Chạy rồi sao?」"
2027 = "「Quả thực, có được liệt kê ra nhỉ. Tuyến Yunoi. Tuyến Takamori.\\nTuyến Matsuura, tuyến Karagi. Tuyến chính Kagoshima đoạn từ Sendai đến Yatsushiro.」"
2029 = "「Thật sao!? Cho tôi xem với.」"
2039 = "「Tệ quá. Kiyoharu. Anh không có cười.」"
2041 = "「Toa xe, \\x%l運転体;#00ffc040;kíp lái%l;#; Railord, \\x%l整備体;#00ffc040;thân chính%l;#; Railord.\\nTrước tiên, họ sẽ xác nhận xem tất cả những thứ đó có đầy đủ hay không.」"
2043 = "「Vào lúc phế thải hồi tống \\x%lクハ26;#00ffc040;Kuha 26%l;#;, đương nhiên,\\nánh mắt giám sát đó, cũng sẽ trở nên nghiêm ngặt hơn một bậc.」"
2044 = "「Chuyện đó, để xong xuôi mọi việc rồi hãy tính.」"
2054 = "「Kết quả là, một \\x%l運転体;#00ffc040;kíp lái%l;#; trống rỗng đã bị bỏ lại.\\nMột \\x%l運転体;#00ffc040;kíp lái%l;#; không có \\x%l操作板;#00ffc040;thẻ bảng%l;#;, không có \\x%l整備体;#00ffc040;thân chính%l;#; cũng không có toa xe.」"
2056 = "「Quá rộng lớn, và tôi nghe nói ảnh hưởng của tuyết là rất nghiêm trọng.\\nChưa nói đến việc điện khí hóa, chi phí \\x%l保線;#00ffc040;bảo trì đường ray%l;#; có lẽ sẽ cực kỳ đắt đỏ.」"
2061 = "「\\x%l運転体;#00ffc040;Kíp lái%l;#; và \\x%l操作板;#00ffc040;thẻ bảng%l;#;. Chỉ cần bảo vệ được tối thiểu những thứ đó.」"
2063 = "「Sẽ bị tách khỏi đầu máy kéo, bị lưu giữ lại, và tháo dỡ.\\nNhưng, trong trường hợp các thủ tục chính quy được áp dụng nghiêm ngặt thì」"
2065 = "「Nếu gián đoạn, thì ngay cả sự giác ngộ của Shiro cũng sẽ trở nên vô ích.\\nVì vậy, đừng ngăn cản——mà hãy cổ vũ.」"
2068 = "「Ngăn chặn sự phân tán của các nhân sự có kỹ thuật và kiến thức.\\nVì sự phục hưng của đường sắt vào một ngày nào đó, giá trị của việc đó là không thể đong đếm được.」"
2074 = "「Người giám sát có đi cùng trên tàu không?」"
2079 = "「Ở cùng với Kiyoharu, thì không sợ.」"
2104 = "「Chuyện đó——quả thực là như vậy nhưng mà.」"
2105 = "「Nằm rải rác tứ tung khắp nơi mà! Hơn nữa,\\ntoàn là các đoạn đường đơn không điện khí hóa!!!」"
2106 = "「Vì thời khắc phục sinh lại Nhà máy Kokura, và các tuyến đường sắt điện khí hóa.\\nDù là đồng minh, nhưng về mặt hành động thì không thể làm liều được.」"
2107 = "「Đây là——sổ tay đối phó của phía ban điều hành sao?」"
2108 = "「Đó là——ừm, tại sao chứ?\\nDù không làm chuyện đó, thì kết quả cũng giống nhau mà?」"
2109 = "「Bị ngu à!! Làm mấy cái trò đó thì được tích sự gì chứ.\\nDù có lột sạch toàn bộ đường ray rồi biến thành đường bộ đi chăng nữa」"
2110 = "「Đây là chữ ký của 338 nhân viên Đường sắt Hoàng gia hiện tại.\\nVà, đây là bản đề xuất mục đích.」"
2111 = "「Vậy sao, thế thì giao cho cậu đấy.」"
2112 = "「Không có viết là 『Toàn bộ』 đâu.\\nNhững tuyến đường sắt không ngại bán đi, cũng được liệt kê ra đấy.」"
2113 = "「Đó là bằng chứng cho thấy rất nhiều người cảm thấy việc bãi bỏ tuyến đường giữa Moji, Kokura và Hakata\\nlà một việc vô nghĩa――thật vô lý.」"
2114 = "「っ!!!」"
2115 = "「っ!!!?」"
2119 = "「Những tiền lệ như vậy, đã từng xảy ra trong quá khứ.\\nMỗi lần như thế, các thủ tục lại càng trở nên nghiêm ngặt hơn.」"
2120 = "「Còn 5 phút nữa.」"
2121 = "「Và còn nữa? Kiyoharu.」"
2123 = "「Nói gì thì nói, dù thế nào cũng phải kế thừa kỹ thuật chứ——\\nĐường sắt, là kỹ thuật đúc kết từ kinh nghiệm mà.」"
2128 = "「Nhưng mà——」"
2129 = "「Chuyện đó……hãy nói với cô Shiro, là 『Cảm ơn』.\\nVà 『Chắc chắn, sẽ tiếp tục kết nối đường ray』.」"
2131 = "「Vậy còn Hokkaido thì sao?\\nRộng lớn và có nhiều đất đai lắm đúng không?」"
2132 = "「Thì chỉ còn cách bỏ trốn thôi.\\nKhông sao đâu, đến lúc đó thì tùy cơ ứng biến.」"
2135 = "「Quyết liệt đi! Kháng chiến triệt để!\\nKhông để chúng dùng vũ lực, chỉ cần bảo vệ đường dây tiếp điện trên cao là được!!」"
2137 = "「Nếu vậy thì, Niiroku.\\nHãy cổ vũ cho Shiro——bằng toàn bộ sức lực.」"
2138 = "「Là việc chuyển càng nhiều người càng tốt sang công ty Aircra Bus.\\nBằng cách đó, bảo vệ họ khỏi đợt sa thải được dự báo trước.」"
2143 = "「Nếu vậy thì, hãy cùng trò chuyện nhé.\\nTừ phần tiếp theo của câu chuyện lúc nãy——về công ty đường sắt mới.」"
2145 = "「Chuyện đó……là do bây giờ, tôi vẫn chưa,\\nquen——với việc đó, mà thôi.」"
2146 = "「Chuyện đó thì rõ rồi. Làm gì có chuyện ngu xuẩn đến thế chứ.\\nĐến con nít cũng hiểu được mà.」"
2147 = "「Tất nhiên là,\\nvì không thể gánh chịu rủi ro khi tiến hành công tác ở phía Moji được.」"
2148 = "「Nếu vậy thì, tốt rồi.」"
2149 = "「Vậy thì……không có, lối thoát nào sao?」"
2150 = "「Nếu vậy! Railord của anh Goto,\\nchỉ cứu được mỗi \\x%l運転体;#00ffc040;kíp lái%l;#; thôi sao?」"
2151 = "「Nếu vậy,\\n\\x%l操作板;#00ffc040;thẻ bảng%l;#; sau khi xác nhận hoạt động xong, sẽ để nguyên như thế à?」"
2152 = "「Railord tự mình ném \\x%l操作板;#00ffc040;thẻ bảng%l;#; ra bên ngoài.\\n\\x%l機関助士;#00ffc040;Phụ lái tàu%l;#;, hoặc kẻ đi lậu vé cũng có thể làm hành động tương tự.」"
2153 = "「Railord thì,\\nsẽ được xác nhận hoạt động thông qua việc hoán đổi \\x%l操作板;#00ffc040;thẻ bảng%l;#;.」"
2160 = "「Dù từ nãy đến giờ toàn là mớ hỗn độn,\\nnhưng chữ 『Yeah!』 đó, đã được truyền đạt rất rõ ràng!」"
