1856 = "「Sao thế? Bộ có chữ nào không đọc được à?」"
1857 = "「Không thể nào có chuyện hy sinh kỹ thuật \\x%l電車;#00ffc040;tàu điện%l;#; được!\\nSẽ trở nên không thể lấy lại được lần thứ hai đâu đấy.」"
1859 = "「Làm sao mà tiếp tục được với mấy thứ đó chứ!\\nCuối cùng thì vẫn là bãi bỏ toàn bộ đường sắt sao! Chết tiệt!!」"
1860 = "「Chắc hẳn là đã kết thúc trong nháy mắt.\\nShiro, chắc chắn không thể……gửi \\x%l共感;#00ffc040;cộng cảm%l;#; được nữa.」"
1861 = "「Có lẽ, là vậy. Chị ấy,\\nnói 『Yeah!』, rồi rơi vào trạng thái ngủ luôn rồi.」"
1863 = "「Tôi cũng không rành lắm.\\nEm có nơi nào muốn đi thử không?」"
1866 = "「Em cũng, nghĩ như vậy.\\nBởi vì tuyến đường sắt mà \\x%lクハ26;#00ffc040;Kuha 26%l;#; có thể chạy, sẽ không còn nữa mà.」"
1874 = "「Không chỉ có chữ ký từ các nhân viên hiện trường đâu.\\nCòn có cả chữ ký của các nhân viên tổng hợp và cán bộ nữa.」"
1875 = "「Sẽ suôn sẻ đúng không?」"
1876 = "「Trò chuyện……sự thiếu hụt giao tiếp.」"
1877 = "「Từ từ, làm quen dần nhé.\\nTừng chút một, cùng nhau hồi phục nhé.」"
1878 = "「Không phải là không làm được! Đừng, ra lệnh cho em!\\nEm làm được——em sẽ làm——mà, vì em muốn làm!!」"
1879 = "「Chuyện đó thì. Có thể hỏi được, dễ dàng thôi.」"
1884 = "「Em hiểu. Em nghĩ vậy. Khi thời khắc đó đến\\ndù \\x%lクハ26;#00ffc040;Kuha 26%l;#; có thể phục sinh, nhưng chỉ có vậy thôi thì cũng vô nghĩa.」"
1887 = "「Em vui lắm. Kiyoharu. ——Kiyoharu. Kiyoharu.」"
1889 = "「Tôi nghĩ, chắc là vậy.\\nNhưng mà——」"
1891 = "「Tokaido! Là tuyến chính số một ở Hinomoto đúng không?\\nNếu vậy, em muốn thử chạy trên đó!!!」"
1892 = "「Em hiểu rồi.」"
1893 = "「Em hiểu rồi! Chị nè? Chị Shiro.\\nKiyoharu nói là? ——Ưm——ưm! Em hiểu rồi!」"
1895 = "「Là chuyện về công ty đường sắt, mới đấy.」"
1897 = "「Tôi sẽ đọc! Tôi sẽ đọc to lên cho mọi người nghe!!」"
1898 = "「Em sẽ làm vậy. Cùng với Kiyoharu, làm như vậy.」"
1900 = "「Em hơi mệt rồi. Em ngủ một chút được không?」"
1902 = "「Cơ thể này. \\x%l整備体;#00ffc040;Thân chính%l;#; này.\\nĐến ngày mai là, sẽ biến mất đúng không?」"
1903 = "「Chỉ riêng em, là tôi tuyệt đối không thể nhượng bộ.\\nĐó chính là, phòng tuyến phòng thủ tuyệt đối của tôi.」"
1905 = "「Tôi nghe nói đã có chỉ thị yêu cầu gửi nội dung kiểm tra của phía Moji\\nnhưng——liệu họ có thể làm được đến mức đó hay không.」"
1906 = "「Tôi nghĩ rằng Kyushu, là vùng đất có thể trở thành vương quốc đường sắt.\\nNên, chỉ cần không đi sai hướng trong quá trình tái cơ cấu——」"
1907 = "「Nè? Kiyoharu muốn đi đâu?」"
1910 = "「Cũng có thể. Bởi vì dù không có lời hứa nào,\\nđó cũng là điều mà tôi chắc chắn, sẽ hoàn thành mà.」"
