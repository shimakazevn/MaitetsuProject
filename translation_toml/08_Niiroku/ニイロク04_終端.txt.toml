2170 = "「Trưởng khu tàu điện, ngài mong muốn đường sắt tiếp tục tồn tại phải không?」"
2175 = "「Nếu là \\x%l運転体;#00ffc040;kíp lái%l;#; thì, bộ phận nhận diện cá thể rất ít.\\nNếu nhờ những người ở bộ phận cơ khí Railord thì.」"
2176 = "「Nói dối. Kiyoharu. Khác với mọi khi.」"
2182 = "「338! Cậu thu thập cả từ những người xung quanh nữa sao.\\nKhông, dù vậy thì con số này cũng lớn đấy.」"
2349 = "Không——thứ lấp đầy không phải là sự căng thẳng,\\nmà là bốn chữ bán tín bán nghi."
2352 = "Tôi nhận ra những lời mình vừa buột miệng nói ra.\\nSự phân biệt đối xử đã ăn sâu vào trong tôi từ lúc nào không hay."
2354 = "Để không làm cho Niiroku thêm bất an nữa.\\nNghĩ như vậy, tôi mới nhận ra Shiro đã mạnh mẽ đến nhường nào——"
2357 = "Không được rồi, sẽ hỏng mất! Niiroku sẽ hỏng mất!!\\n\\x%l共感;#00ffc040;Cộng cảm%l;#;——ngắt kết nối! Ngắt kết nối cưỡng chế!!!!"
2362 = "Niiroku——biểu cảm của Niiroku từ nãy đến giờ,\\nhoàn toàn không thay đổi chút nào."
2364 = "Có lẽ em ấy đã kết nối \\x%l共感;#00ffc040;cộng cảm%l;#; ngay lập tức.\\nCơ thể Niiroku bỗng trở nên ấm áp——っ!!?"
2368 = "Niiroku ngây thơ mở bản đồ ra.\\nBản đồ tuyến đường, thứ sẽ bị chia cắt tơi tả chỉ trong vài ngày tới."
2370 = "Cựa quậy một chút, Niiroku ngước nhìn tôi.\\nNhìn thẳng, nhìn chằm chằm vào tôi."
2372 = "Niiroku lặng lẽ gật đầu.\\nVới vẻ mặt hoàn toàn không thay đổi so với trước khi tôi bắt đầu giải thích."
2373 = "Niiroku, luồn ra khỏi vòng tay tôi.\\nĐứng đối diện. Một lần nữa, nhìn thẳng vào tôi."
2375 = "Niiroku lấy hộp phấn trang điểm ra——\\nVà rồi, lặng lẽ, cất nó đi."
2377 = "Niiroku, không hất tay tôi ra,\\nchỉ là, tiếng hét thảm thiết——vẫn tiếp tục run rẩy dưới ngón cái của tôi."
2379 = "Niiroku thả lỏng toàn bộ sức lực.\\nNhưng mí mắt, lại không hề nhúc nhích."
2380 = "Niiroku là một Railord.\\nMột sự thật hiển nhiên, nhưng giờ đây, tôi lại cảm nhận được nó một cách vô cùng mạnh mẽ."
2382 = "Từ miệng Niiroku, vang lên tiếng thở phào nhẹ nhõm.\\nMail thì――――không sao, vẫn chưa thấy gửi đến."
2386 = "Ngón tay của Niiroku lặng lẽ, lướt qua má tôi."
2387 = "Niiroku, bỗng chốc nở nụ cười.\\nTrong vòng tay tôi, hơi ấm nhẹ nhàng, lan tỏa."
2390 = "Niiroku——dù cho tinh thần vẫn còn non nớt,\\nnhưng năng lực tính toán lại cao đến mức đáng buồn."
2392 = "Với Niiroku mang cơ thể nhỏ bé hơn mọi khi rất nhiều,\\nchúng tôi dính sát vào nhau như thường lệ."
2393 = "Niiroku, dang hai tay về phía tôi.\\nTôi biết, em ấy đang mong muốn điều gì."
2394 = "Bàn tay của Niiroku đáp lại.\\nEm ấy ôm chầm lấy tôi."
2395 = "Phản ứng ngây thơ của Niiroku đã cho tôi biết,\\nShiro là một Railord dịu dàng và mạnh mẽ đến nhường nào."
2398 = "Nhiệt độ cơ thể bỗng chốc lạnh toát, sắc mặt trông có vẻ nhợt nhạt,\\nđã nói lên tiếng lòng của Niiroku, hùng hồn hơn bất cứ lời nói nào."
2400 = "Việc ôm lấy nhau, chính là bảo vệ lẫn nhau.\\nLần đầu tiên trong đời, tôi có suy nghĩ như vậy."
2403 = "Tiếng xì xào bàn tán vừa chực bùng lên,\\nĐám đông vừa định ùa tới――"
2406 = "Thứ được ném qua, là một tập tài liệu.\\nTrên trang bìa, có viết chữ 'Tuyệt mật' bằng mực đỏ."
2409 = "Đã trả giá bằng sự hy sinh, để đổi lấy một lời hứa duy nhất——\\nNếu là cậu ta, có lẽ cậu ta sẽ biến quá trình đó thành món hàng, chứ không phải là kết quả."
2411 = "Là một \\x%l機関士;#00ffc040;lái tàu%l;#; và Railord tuyệt vời đến thế cơ mà.\\nNếu tùy cơ ứng biến, và thu hồi được cả \\x%l操作板;#00ffc040;thẻ bảng%l;#; của Shiro thì——"
2413 = "Cho những người mong muốn cứu Niiroku,\\ncậu ta đã bán đi bán lại, chỉ một món hàng duy nhất."
2415 = "Câu trả lời mà Niiroku đưa ra, chính xác đến mức đáng buồn."
2417 = "Là biện pháp khẩn cấp, đặt việc duy trì sự an toàn của Railord——\\nlên mức ưu tiên hàng đầu."
2421 = "Nhưng tôi đã nhầm.\\nỞ đó có một niềm tự hào cao quý."
2423 = "Dù vậy, khi nghe thấy tiếng hét của Niiroku,\\ntrái tim tôi vẫn như bị xé toạc ra."
2424 = "Nhưng——dù có nói thế nào đi chăng nữa,\\nđây cũng chỉ có thể là một câu chuyện nặng nề."
2426 = "Nhưng——cậu ta đã có được sự tin tưởng."
2429 = "Tuy nhiên, nhưng mà——nếu \\x%lマスター;#00ffc040;Master%l;#; của Shiro\\nlà kiểu người sẵn sàng đón nhận mong muốn của Shiro thì——"
2431 = "Tuy nhiên tôi có thể hiểu rõ.\\nRằng Niiroku, chỉ đang giả vờ mà thôi."
2433 = "Tuy nhiên, Niiroku vẫn còn, quá đỗi nhỏ bé.\\nHoàn toàn không thể hiểu được ý nghĩa của từ “chết”."
2451 = "\\x%l共感;#00ffc040;Cộng cảm%l;#; đã trở lại——\\nCó lẽ Shiro, đã phục hồi từ trạng thái ngủ."
2460 = "Tiếng gầm lên tức giận của tiền bối làm xáo trộn sự xôn xao, gây ra sự hỗn loạn lớn.\\nChẳng bao lâu sau, nó hội tụ thành một sự im lặng đầy căng thẳng."
2463 = "Niiroku, vừa mới,\\nmỉm cười với tôi."
2467 = "Từ đám đông đang chìm trong im lặng,\\ntiếng xôn xao, từng chút, từng chút một trở lại."
2469 = "Vùng vẫy và sau đó——chỉ còn cách bám víu vào."
2471 = "Có lẽ tôi đã sai lầm, trong cách dẫn dắt câu chuyện."
2484 = "Ngay cả trong thời kỳ mà tình hình tốt hơn bây giờ rất nhiều,\\nvà sĩ khí của các nhân viên vẫn còn cao."
2488 = "Cạch, một cảm giác click rõ ràng."
2489 = "Shiro. Shiro của D60."
2491 = "Những phương án cải thiện tự phát đã bị bóp nghẹt tận gốc đến nhường nào\\n……Nếu nhìn lại, sắc đen của sự tuyệt vọng càng thêm đậm đặc."
2493 = "Bởi vì sẽ chẳng có ai, lại đi kiểm tra Railord của đầu máy kéo,\\nhay bên trong buồng lái đó cả."
2498 = "Nhìn từ bên ngoài, tư thế này chẳng khác nào đang bóp cổ.\\nMột tư thế mà bất cứ ai nhìn thấy cũng sẽ cảm thấy bất thường, và báo cảnh sát ngay lập tức."
2501 = "Tôi đã chọn những người có vẻ đáng tin cậy, từ nhiều bộ phận khác nhau,\\nmà không thể xác nhận được mối liên hệ lẫn nhau, và nhờ vả họ."
2502 = "Em ấy không còn hoảng loạn nữa."
2505 = "Bằng cách giả vờ bình tĩnh đó,\\nem ấy đang cố gắng làm giảm bớt cảm giác tội lỗi mà tôi đang cảm thấy."
2507 = "Nghe em ấy nói vậy——tôi mới nhận ra. Tôi nhận ra."
2510 = "Nếu chúng tôi có sự kết nối, hợp tác cùng nhau,\\nvà có thể trải ra, một đường ray khác——"
2511 = "Nếu bỏ trốn, thì phía trước chỉ toàn là bóng tối.\\nKhông còn cách nào khác ngoài việc cầu nguyện, cho sự thành công."
2513 = "Nếu việc xác nhận kết thúc,\\nnếu đầu máy bắt đầu chạy——"
2514 = "Vì mục đích thúc đẩy Aircra, đường sắt, đang dần dần——\\nbị làm cho suy yếu, bao gồm cả hình ảnh của nó……"
2517 = "Bỏ qua kiểm tra và phá hủy ngay lập tức."
2519 = "Những con người xuất sắc, những Railord ưu tú,\\nchắc chắn, đã ở khắp nơi trong Nhà máy Kokura."
2521 = "Ngay cả khi đang hôn, Niiroku cũng không nhắm mắt lại.\\nKhuôn mặt em ấy, đã hoàn toàn cứng đờ."
2525 = "Chia nhỏ ra, chuyên môn hóa, và không còn sự kết nối ngang.\\nCứng nhắc với ý thức lãnh thổ, chỉ bảo vệ lĩnh vực công việc của riêng mình."
2534 = "Ánh sáng vừa mới lóe lên——\\nKhông, ánh sáng ảo ảnh ấy đã bị nuốt chửng một cách vô vọng."
2535 = "10 giây.\\nTôi có cảm giác như thời gian đó đã trôi qua rồi."
2549 = "Trước tiếng gầm giận dữ của Goto, tuy nhiên, không một ai hưởng ứng."
2550 = "Hậu Đông Khối Thái――\\nTrong số những người cùng thời, không ai khó đối phó bằng cậu ta."
2551 = "Goto. Tiền bối. Bọn họ sẽ đi đâu?\\nBọn họ có thực sự, là những người đáng tin cậy hay không?"
2552 = "Bất chợt, tôi ngửi thấy một mùi hương.\\n……Giống như mùi của nước, lại cũng giống như mùi của máu."
2556 = "Không có vấn đề gì——\\nchuyện như vậy tuyệt đối không thể nào xảy ra được."
2560 = "Là biện pháp cưỡng chế duy nhất và cuối cùng,\\nđể dừng vô điều kiện các chức năng của Railord."
2561 = "Như thể đó là điều hiển nhiên,\\ntrong vòng tay tôi, Niiroku lại gật đầu."
2563 = "Kìm nén giọng nói như sắp run rẩy,\\ntôi hướng ánh mắt về phía Trưởng khu tàu điện."
2565 = "Tôi truyền đạt lại một cách đầy đủ và chính xác,\\nnhững điều mà tôi buộc phải nắm rõ do tính chất công việc."
2566 = "Tôi nhận ra một cách nghịch lý rằng,\\n\\x%lクハ26;#00ffc040;Kuha 26%l;#;, và Niiroku——chính là một biểu tượng."
2570 = "Hơi ấm trong vòng tay này, sự đáng yêu này,\\nđể tuyệt đối không đánh mất, trong thâm tâm, tôi nguyện cầu một cách mạnh mẽ."
2573 = "Cảm giác tội lỗi, và sự hối hận——\\nTôi không thể kìm nén được những cảm xúc chỉ làm khổ Niiroku."
2574 = "Biểu cảm hoàn toàn không thay đổi.\\nNhưng mà, không thể nào tôi lại không nhận ra."
2577 = "Tôi lật lại tài liệu một chút.\\nKhông thể truyền đạt sai lệch được."
2579 = "Từ Niiroku, một mùi hương mà tôi chưa từng ngửi thấy bao giờ——\\nMùi của sự sống, mùi của sinh mệnh."
2582 = "Cái gật đầu mà tôi cảm nhận được trên cánh tay, mạnh mẽ đến mức không ngờ."
2583 = "Nên đi cùng một nơi, hay chọn một tuyến đường khác.\\nChuyện đó, cần phải suy nghĩ thật cẩn thận."
2584 = "Tôi ôm chặt lấy em ấy."
2586 = "Tôi bế em ấy lên.\\nTrong vòng tay tôi, Niiroku cọ cọ đầu vào."
2587 = "Đỡ lấy cơ thể em ấy, và đặt nằm xuống——"
2589 = "Vòng tay ôm em ấy càng thêm siết chặt——\\nTôi cố che giấu đi sự bất lực của bản thân khi chỉ có thể làm được bấy nhiêu."
2592 = "Nhìn quanh, vô số ánh mắt đáp lại tôi.\\nCủa những người thuộc Kokura――không nói quá đâu, là của toàn bộ lái tàu và thợ máy."
2594 = "Từ chính diện, sâu bên trong, cổ họng. Dùng ngón cái ấn mạnh vào đó.\\nDù là \\x%l運転体;#00ffc040;kíp lái%l;#; hay \\x%l整備体;#00ffc040;thân chính%l;#;, cũng không có gì khác biệt."
2595 = "Tôi đưa tay lên, vuốt mí mắt em ấy xuống.\\nNhẹ nhàng khép lại đôi mắt ấy."
2597 = "Cắm vào ổ cắm.\\nĐưa chiếc chốt mỏng manh, vào sâu trong tai em ấy."
2600 = "Cơ thể, và lời nói của tôi đều run rẩy.\\nSuy nghĩ của tôi cũng đang run lên bần bật."
2601 = "Tất cả mọi người đều nghi ngờ lẫn nhau——\\nChỉ có các Railord, là tin tưởng lẫn nhau."
2603 = "Tôi lục lọi trong \\x%l乗務鞄;#00ffc040;túi phi hành đoàn%l;#;."
2605 = "Tôi, sẽ cười.\\nNhếch khóe miệng lên——hạ đuôi mắt xuống."
2606 = "Làm thế nào——có thể làm thế nào đây.\\nTôi chỉ nhìn thấy một câu trả lời duy nhất, nhưng đối với tôi thì tuyệt đối——"
2609 = "Rằng cơ thể Niiroku đang lạnh toát,\\nlúc đó tôi mới nhận ra."
2611 = "Tự nhủ với chính mình như vậy,\\ntôi ôm lại cơ thể Niiroku."
2612 = "Hoặc là, ngay cả cuộc đấu tranh của chúng tôi,\\ncó lẽ cũng đã nằm trong kịch bản từ đầu rồi."
2614 = "Vì vậy, Niiroku hiểu được.\\nRằng dù có thế nào đi chăng nữa, Shiro cũng sẽ kết thúc."
2617 = "Vì vậy, tôi truyền đạt lại.\\nHơi ấm của tôi, lời cầu nguyện của tôi——và tâm tư của tôi."
2624 = "\\x%l操作板;#00ffc040;Thẻ bảng%l;#; của Shiro, vào \\x%l運転体;#00ffc040;kíp lái%l;#; mô hình trống rỗng,\\nvà sau đó, là vào \\x%l整備体;#00ffc040;thân chính%l;#; của Niiroku."
2636 = "Số lượng lớn chữ ký, bao gồm cả của các nhân viên cán bộ,\\ncó vẻ như đã trở thành một thứ vũ khí đáng kể."
2638 = "Sự đồng tình, hay phản đối, đều không nghe thấy.\\n——Không một ai, nói bất cứ điều gì."
2640 = "Một khi mục đích là để che giấu,\\nthì phải làm càng nhanh càng tốt, không để lại nguyên dạng, một cách triệt để."
2646 = "Có nên nói cho em ấy biết hay không,\\ntôi……tôi hoàn toàn……không thể đưa ra quyết định."
2648 = "Mặc dù đã ấn mạnh đến thế,\\nnhưng trên cổ em ấy, không lưu lại dù chỉ là một vết bầm tím."
2650 = "Mặc dù là một \\x%l運転士;#00ffc040;lái tàu%l;#;,\\nnhưng tôi lại đang đánh mất cảm giác về thời gian."
2652 = "Đúng vậy. Ở đâu việc điện khí hóa cũng khó khăn cả.\\nBởi vì họ chỉ cắt nhượng những tuyến đường như thế thôi mà."
2654 = "Đến giờ rồi."
2656 = "Tối tân nhất, và hiệu suất cao nhất.\\nÝ nghĩa của nó, tôi là người biết rõ hơn ai hết."
2661 = "Bởi vì đang ôm nhau, nên tôi mới có thể nhận ra——\\nmột sự run rẩy vô cùng nhỏ bé."
2672 = "Để xua tan đi sự bất an, và nỗi đau đớn——\\nChỉ một câu nói thôi, cô ấy đã phải gửi đi trong muôn vàn gánh nặng."
2673 = "Dù nghĩ thế nào, thì cũng quá sức chịu đựng.\\nĐến mức dù \\x%l操作板;#00ffc040;thẻ bảng%l;#; có bị phá hủy ngay tức khắc, thì cũng không có gì lạ."
2676 = "Và rồi——cuối cùng, em ấy cũng đổ gục xuống.\\nTrong tay tôi, sự kháng cự biến mất, và sức nặng tăng lên."
2677 = "Và rồi, giọt nước mắt——\\nĐược chuyển sang, má của em ấy."
2682 = "Chỉ còn cách để em ấy đối mặt trực tiếp. Tôi đã chuẩn bị tinh thần rằng,\\nchỉ bằng lời giải thích thì không thể làm cho em ấy hiểu được."
2689 = "Dù cho điều đó bắt đầu trở nên rõ ràng trên toàn quốc,\\nvà làn sóng “chỉ trích Teitetsu” bùng nổ đồng loạt ở nhiều nơi——"
2693 = "Nhìn vào phản ứng của Niiroku,\\ncó vẻ như lần này, Shiro cũng đã ổn định lại rồi sao?"
2705 = "Tôi cũng nghĩ rằng, chúng tôi đã bán \\x%lクハ26;#00ffc040;Kuha 26%l;#;,\\nvới một cái giá rất cao."
2713 = "Kết cục, lại thành ra thế này.\\nPhơi bày, và cuốn Niiroku vào——\\x%l共感;#00ffc040;cộng cảm%l;#; của cái “chết”."
2714 = "Kinh doanh bắt đầu sa sút, đãi ngộ trở nên tồi tệ, dịch vụ đi xuống.\\nKinh doanh càng thêm suy sụp, một vòng luẩn quẩn điển hình."
2723 = "Không một ai trong số họ mang theo Railord.\\nBởi vì đó là điều kiện của cuộc gặp mặt này."
2724 = "Và lỡ như bị gián đoạn, khiến cho công tác bị bại lộ,\\nthì mọi nỗ lực, và sự giác ngộ của Shiro, sẽ tan thành mây khói."
2726 = "Bàn tay ấy vươn ra, làm nũng, và bám víu lấy tôi.\\n——Niềm vui sướng trào dâng!!"
2728 = "Đã bị dập tắt bởi tiếng quát và một lời nói của Đoạn trưởng xe điện."
2729 = "Lời nói đó đã làm tôi tin chắc.\\n——Mọi thứ đã kết nối lại với nhau."
2735 = "So với việc bị nghiền nát bởi sự kéo dài sự sống mang tính hình thức và nhất thời,\\nthì việc chiến đấu trực diện sẽ tốt hơn rất nhiều."
2751 = "Và dặn họ rằng, nếu lỡ thất bại, hãy gửi mail ngay lập tức."
2770 = "Không phải là hẹn gặp lại, mà là vĩnh biệt.\\nĐến khoảnh khắc đó, ngay cả \\x%l共感;#00ffc040;cộng cảm%l;#; cũng không thể trao đổi được nữa——"
2771 = "Nếu dùng cách đó, thì có thể lọt qua mọi vòng kiểm tra.\\nNhưng mà——Shiro sẽ không được cứu."
2772 = "Là cơ chế để bảo toàn dữ liệu, và đưa Railord vào trạng thái chết lâm sàng,\\ntrước khi bị những kẻ có ác ý phá hoại."
2773 = "Chỉ làm cho Niiroku thêm đau khổ và phiền não mà thôi.\\nĐiều đó là quá rõ ràng."
2774 = "Đây là lần đầu tiên, nhỉ?\\nTôi nói dối Niiroku."
2775 = "Là sự khác biệt về hệ giá trị, hay chỉ đơn thuần là sự đa sầu đa cảm của tôi——\\nKhông, dù là cái nào đi nữa, thì cũng giống nhau cả thôi."
2776 = "Để xua tan đi sự bất an của Niiroku,\\nvà để nguyện vọng của Shiro, tuyệt đối không trở nên vô ích."
2777 = "Một 『Kế hoạch vận tải』 được nhìn nhận một cách thấu đáo đến mức tàn nhẫn,\\nkhông chỉ trong nước Hinomoto mà còn mang góc nhìn từ nước ngoài."
2778 = "Sâu thẳm, đen kịt, đặc quánh, nặng nề.\\nVào bóng tối lạnh lẽo mang tên tuyệt vọng."
2779 = "Tôi chỉ cảm thấy muốn bảo vệ em ấy.\\nTôi chỉ cảm thấy em ấy thật đáng yêu."
2780 = "Vẫn là căn phòng quen thuộc. Chỉ có hai người, tôi và Niiroku.\\nHành lý, đã được thu dọn gọn gàng ở gần đó."
2789 = "Những điều mà tôi tuyệt đối không muốn truyền đạt——\\nNhưng dù vậy, vẫn phải nói ra để tìm kiếm sự khôn ngoan."
2790 = "Nếu là giữa lúc hỗn loạn này, nếu chỉ là một toa xe bình thường——\\nGoto đã bày ra ván cược đó, và đã giành chiến thắng."
2791 = "Nếu vậy, cứ giữ nguyên thế này——\\nKhông cho em ấy biết gì cả, cứ thế tiến hành thì sẽ tốt hơn…… sao."
2793 = "Công tắc khởi động lại nằm sâu trong tai.\\nSâu tận cùng của một khe hở, nơi đáng lẽ ra không cần thiết đối với Railord."
2796 = "Một gã đàn ông mạnh mẽ, thậm chí còn bị gọi là Cường Đạo Khối Thái......\\nNhưng có lẽ người tôi thực sự nên bàn bạc, không phải là tiền bối mà là――"
2797 = "Dù giọng điệu có vẻ ngạc nhiên,\\nnhưng trong ánh mắt, trên nét mặt, không hề có chút bối rối nào."
2798 = "Đứng ở lập trường đối lập, tôi lại một lần nữa cảm nhận được rằng, ông ấy không chỉ là người quản lý nhà máy toa xe,\\nmà còn là người thống lĩnh toàn bộ Đoạn xe điện."
2799 = "Hy vọng, là kẻ thù của sự đánh giá lạnh lùng——\\nDù biết vậy, nhưng tôi vẫn không thể không nghĩ đến."
2808 = "Trưởng khu tàu điện, Trưởng bộ phận cơ khí Railord, rồi đến tôi,\\nvà ngoài ra, có lẽ còn nhiều người khác nữa——"
2809 = "Khi Đoạn trưởng xe điện đảo mắt nhìn quanh, một vài nhân viên đã lảng tránh ánh mắt ông.\\nĐó không phải là một phản ứng tốt, tôi vội vàng nói tiếp."
2810 = "Ánh mắt của Đoạn trưởng xe điện đổ dồn vào tờ giấy có chữ ký mà tôi vừa đưa.\\nKhóe miệng ông ấy, khẽ nhếch lên."
2811 = "Việc công bố tài liệu này, sự đánh giá đối với việc ký tên, và mọi thứ khác.\\nLời nói và hành động của Trưởng khu tàu điện, đã vẽ nên một đường ray duy nhất."
2815 = "Cơ thể nhỏ bé của \\x%l運転体;#00ffc040;kíp lái%l;#;, gật đầu thật mạnh, thật mạnh."
2820 = "（Không——nói như vậy, thì quá ngây thơ rồi.\\nHình ảnh trở nên tồi tệ đi, chỉ là do sự yếu kém của chính chúng ta mà thôi）"
2823 = "（——Bằng năng lực của một Railord sản xuất hàng loạt cho \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; \\x%lD60;#00ffc040;D60%l;#;,\\nmà phải vận hành cơ thể của \\x%lクハ26;#00ffc040;Kuha 26%l;#;, một Railord tối tân nhất）"
2830 = "（......Là do ông ấy tính toán trước, hay là bản năng tự nhiên vậy）"
2847 = "（Nhưng——dù vậy.\\nDù vậy tôi cũng không thể từ bỏ Niiroku được）"
2848 = "（Nhưng mà——dù tôi có áp đặt điều đó đi chăng nữa——）"
2853 = "（Kiểm tra ở phía Moji——\\nChỉ cần vượt qua được chỗ đó thì）"
2854 = "（A……）"
2855 = "（Được rồi.）"
2857 = "（Nếu như, tôi đã nói chuyện với Shiro, và \\x%lマスター;#00ffc040;Master%l;#; của cô ấy.\\n……Nếu như, tôi đã dành thời gian cho những việc như thế.）"
2861 = "（Teitetsu, dù chỉ một chút,\\ncũng không thể thay đổi——đã không thay đổi）"
2866 = "（Nhanh lên——hãy mau tắt đi!!!）"
2867 = "（Xin hãy——nhanh lên!!!）"
2869 = "（Vận chuyển toa xe vào trong nhà máy, rồi lại mang ra ngoài.\\nTôi đã nghĩ tổ chở hàng, chỉ là những tồn tại như thế mà thôi.）"
2872 = "（Thời gian thì……có lẽ, ổn rồi.\\nHít thở sâu——dù sao thì cũng phải——hít thở sâu một lần đã.）"
2875 = "（Nếu bị chia cắt thì chỉ còn nước bị nghiền nát mà thôi.\\nĐường ray——dù thế nào cũng phải kết nối lại.）"
2878 = "（Vẫn như mọi khi, với chính bản thân mình như mọi khi——）"
2879 = "（Nếu như, họ đã chuẩn bị hết lần này đến lần khác,\\n”vì mục đích đó” thì——）"
2883 = "（Cái này——một thứ như thế này mà Trưởng khu tàu điện——\\nKhông, ngay cả tầng lớp thượng tầng của Teitetsu cũng không thể chuẩn bị được）"
2884 = "（Vẫn chưa, xong sao——vẫn chưa sao.）"

[selections]
