1961 = "「Ra là vậy.」"
1962 = "「Ra là vậy!」"
1963 = "「Vậy à, đi đâu thì tốt nhỉ?」"
1964 = "「Vậy……sao.\\nNgười có thể nuôi dưỡng một Railord đến mức đó, lại ở bên chở hàng——」"
1965 = "「Vậy sao.」"
1966 = "「Vậy sao? \\x%lマスター;#00ffc040;Master%l;#; cũng sẽ nghỉ hưu à?\\nNếu vậy thì, không có vấn đề gì cả?」"
1967 = "「Ngủ ngon nhé.」"
1968 = "「Ngủ ngon nhé, Niiroku.」"
1969 = "「Sẽ không có lưu giữ, mà bị đem đi tháo dỡ ngay lập tức.\\nĐể tránh việc xảy ra gian lận trong thời gian lưu giữ.」"
1972 = "「Tokaido có lẽ,\\nsẽ là tuyến đường ray bị lột bỏ đầu tiên đấy——」"
1973 = "「Thật vinh hạnh. Hãy an tâm ngủ đi nhé.」"
1977 = "「Không sao đâu tiền bối. Tôi không bận tâm đâu.\\nĐó chỉ đơn thuần là sự thật, và là đối tượng để đánh giá mà thôi.」"
1978 = "「Cái đó là tùy ý. Dù là theo thứ tự \\x%l運転体;#00ffc040;kíp lái%l;#; - \\x%l整備体;#00ffc040;thân chính%l;#;,\\nhay ngược lại cũng không sao. Vì kết quả đều giống nhau mà.」"
1979 = "「Đúng là như vậy. Hơn nữa, ở phía Moji sẽ tiến hành\\nxác nhận hoạt động của Railord lần cuối cùng.」"
1980 = "「Đúng là như vậy. Và dù mức độ có khác nhau——\\nnhưng đối với tiền bối, hay những người khác, cũng có thể nói điều tương tự.」"
1988 = "「Kiyo——haru. Kiyoharu. Kiyoharu.」"
1991 = "「Kiyoharu——em——có đang cười không?」"
1994 = "「Kiyoharu.」"
1999 = "「Em sẽ làm theo những gì Kiyoharu mong muốn.\\nNếu có thể giúp ích cho Kiyoharu, thì đó chính là, hạnh phúc của em.」"
2000 = "「Kiyoharu đã cứu em.\\nNếu cứ để như vậy. Em cũng sẽ. Hỏng toàn bộ.」"
2003 = "「Kiyoharu. Em hỏng mất rồi.」"
2005 = "「Kiyoharu? Kiyoharu? Anh đau ở đâu à?」"
