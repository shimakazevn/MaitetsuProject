1941 = "「Đúng vậy. Sự thông minh theo kiểu đó,\\ncó lẽ là điều cần thiết, để đường sắt tiếp tục tồn tại.」"
1944 = "「Đúng vậy. Dù vậy, Shiro đã rất xuất sắc——.\\nHy sinh bản thân mình, vì cả Niiroku, và cả đường sắt!」"
1946 = "「Đúng vậy. Mãi mãi, ở cùng nhau.」"
