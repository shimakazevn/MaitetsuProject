1128 = "...Niiroku bồn chồn, không yên.\\nTrông cô ấy có vẻ gì đó bất an."
1130 = "......Giọng nói náo nhiệt và tiếng bước chân của Niiroku,\\ndần dần nhỏ lại——rồi biến mất."
1131 = "...Chà, một khuôn mặt thật đẹp."
1133 = "......Có lẽ, khi nhận được lời mời,\\ntôi cũng đã có ánh mắt như vậy."
1138 = "......Chỉ là tôi không còn trẻ đến mức bộc lộ hết ra ngoài,\\nchứ tất nhiên là tôi cũng biết tổn thương, biết suy sụp chứ."
1141 = "...Đã sáu tháng trước rồi sao.\\nCái ngày đầu tiên Niiroku đến thăm căn phòng này."
1144 = "......Một chiếc ly và một tách trà.\\nMột bát súp miso, một cái đĩa và một cái bát nhỏ."
1149 = "「——A.」"
1151 = "「——Ừm——Đúng rồi——Thế nhé? ——Ừm——\\n......Củ cải hầm? ......Chỉ em với! ......Cảm ơn......Ừm!」"
1152 = "「——Ừm.」"
1153 = "「——Đúng vậy.」"
1155 = "「——Ra là vậy.\\nNếu thế thì, đó là điều đương nhiên. Tôi cũng giống như vậy.」"
1164 = "「............」"
1174 = "「...Phù.」"
1176 = "「...Nhân tiện thì cô Niiroku. Về lần lái thử tiếp theo.」"
1177 = "「......Chà, ai biết được chứ.」"
1179 = "「......Tôi cũng nghĩ vậy.\\nChỉ riêng điều đó, tôi có thể tự hào mà không chút do dự.」"
1181 = "「......Trước đây tôi cũng từng nhắc đến một chút rồi,\\ntôi xuất thân từ một gia đình làm Thần quan.」"
1182 = "「...Tôi sẽ pha trà. Đợi một chút nhé.」"
1184 = "「......Thử nghiệm đòi hỏi sự an toàn khắt khe đến mức nào.\\nTôi đã không thực sự hiểu được.」"
1375 = "「Lúc đầu, kỳ vọng được tăng lương là rất lớn.\\nNếu nhờ đó mà cuộc sống khấm khá hơn——tôi đã mang suy nghĩ mãnh liệt như vậy.」"
1376 = "「Rượu Thần?」"
1379 = "「Không phải của tôi, mà là của con trai tôi.」"
1381 = "「Không phải thế――a!? Không.\\nThế cũng được. Thế cũng... rất tuyệt.」"
1382 = "「Không thất lễ đâu. Chỉ là——bản thân tôi.\\nỪm. Chỉ là do bản thân tôi thiếu hiểu biết sự đời thôi.」"
1383 = "「Được rồi. Một ngụm là đủ.\\nNên, cho tôi cốc đó được không?」"
1386 = "「Chà...... vì đã là quá khứ rồi mà.\\nChuyện hồi đó, tôi cũng không thể nhớ rõ được nữa.」"
1388 = "「Không phiền đâu. Nhưng——nếu vậy thì. Đúng rồi.\\nHai người cùng làm, chắc chắn sẽ xong nhanh gấp đôi.」"
1389 = "「Không——tôi không cảm thấy thế.」"
1392 = "「Không phải. Vẫn chưa. Vẫn còn chuyện quan trọng khác.\\nCái đó——ừm——」"
1397 = "「Niiroku... cô biết nấu ăn nhỉ.」"
1398 = "「Niiroku——Cô」"
1399 = "「Niiroku? Chắc cũng sắp...」"
1400 = "「Niiroku?」"
1405 = "「Con người khi đói bụng thì tâm trạng sẽ chùng xuống.\\nTôi đã được các chị dạy như vậy.」"
1416 = "「Nhưng mà, anh nên ăn một chút đi.」"
1418 = "「Dù vậy, tôi vẫn muốn nghe.」"
1420 = "「Nhưng, khi đang băn khoăn về tương lai, tôi chợt nghĩ.\\nNếu rời khỏi đền thờ, rốt cuộc tôi còn lại gì.」"
1422 = "「Nhưng, trong lúc học lại lịch sử Đường sắt Hoàng gia.\\nMột khao khát hoàn toàn khác đã nảy mầm trong tôi.」"
1426 = "「Ở bên nhau, đã trở nên đau khổ đến mức đó sao?」"
1428 = "「Cô đến đây để truyền đạt chuyện đó đúng không?」"
1431 = "「Rõ ràng là anh nghĩ nhiều đến vậy mà.\\nTại sao lại không thể ở bên nhau nữa?」"
1432 = "「Cô chưa uống bao giờ sao?」"
1434 = "「Cô đã lo lắng cho tôi sao?」"
1436 = "「Công việc của lái tàu Akai thật đáng ngưỡng mộ.\\nBởi vì anh đã góp phần to lớn đẩy nhanh sự ra đời của tôi!」"
1438 = "「Cô được dạy cả những điều như vậy sao.」"
1439 = "「Vâng, của cô đây.」"
1442 = "「Giáo dân? Trà Kuma?」"
1456 = "「Có được bằng lái vào thời điểm đó đã là rất tuyệt rồi.\\nAnh đã tham gia kỳ thi ngay sao?」"
1458 = "「Con trai? Của ai?」"
1460 = "「Vợ... cũ——?」"
1461 = "「Vợ cũ?」"
1463 = "「Cùng cố gắng nhé. Niiroku.\\nCho đến một ngày nào đó, khi cô được gọi là 'xe cũ'.」"
1465 = "「Số lượng toa xe động lực tăng lên,\\nkhối lượng tính toán của Niiroku chắc cũng sẽ tăng theo nhỉ——」"
1466 = "「Ra...... là vậy.」"
1467 = "「Ra là vậy. Railord của đầu máy hàng hóa sao.」"
1471 = "「Hãy cứ ghen tị đi. Hãy cứ khao khát đi.\\nChúng ta nhất định sẽ chứng kiến một sự tiến bộ to lớn như thế.」"
1473 = "「Trong phạm vi không vi phạm nghĩa vụ bảo mật, tôi sẽ trả lời bất cứ điều gì.\\nĐó cũng là công việc của tôi mà.」"
1474 = "「Không sao đâu.」"
1478 = "「Fufu.」"
1480 = "「Vui lắm. Được nói chuyện nhiều thế này tôi rất vui.\\nCảm ơn anh.」"
1482 = "「Tôi gặp vợ cũ vào khoảng thời gian đó——\\nkhông lâu sau khi lấy được bằng lái tàu điện.」"
1483 = "「Hả? Nhưng mà, sinh nhật của lái tàu Akai là vào tháng Chín——」"
1484 = "「Hừm.」"
1485 = "「À, là cô Niiroku sao.\\nXin mời vào.」"
1488 = "「À, ra là vậy. Thế thì――」"
1489 = "「Vâng?」"
1490 = "「Dù tình yêu thương có là vô hạn.\\nThì thời gian, dù thế nào đi nữa cũng chỉ có giới hạn thôi.」"
1492 = "「!!?」"
1493 = "「Hứ. Phản ứng của anh còn tốt hơn lúc ăn đồ tôi nấu nữa.」"
1495 = "「A——」"
1496 = "「A.」"
1497 = "「Aaaaaa——————Ngon tuyệt.」"
1498 = "「A!」"
1499 = "「!!?」"
1501 = "「!!? Lái tàu Akai mà cũng vậy sao?」"
1503 = "「À, không cần đâu. Cứ nhắm với rượu Thần là được.」"
1504 = "「A, tự rót rượu, không được.」"
1506 = "「A——quên nấu cơm mất rồi.」"
1509 = "「Ưm...」"
1510 = "「Ừm...... ừm. Ư fufu.」"
1511 = "「Ừm. ——Ừm. Vậy, lần sau tôi lại nấu nữa.」"
1514 = "「Ừm...... năm Taisho thứ 35 là năm Showa thứ nhất.\\nLà năm mà Hinomoto thua trận sao?」"
1515 = "「Ưm...\\nThanh đạm thật. Ấm áp nữa. Có mùi hương rất dịu nhẹ.」"
1518 = "「Đúng vậy.\\nVì tôi cũng chỉ là một con người hết sức bình thường thôi mà.」"
1519 = "「Ừ.」"
1520 = "「Ừm!」"
1522 = "「Ừm, lúc nào đó, lại nhờ cô nhé.」"
1525 = "「Ừm. Cái đó. Tuyệt thật đấy.\\nTôi muốn thử dốc toàn lực ghen tị với cỗ máy hiện đại nhất lúc bấy giờ xem sao.」"
1527 = "「Ừm. Tôi ngạc nhiên lắm.」"
1528 = "「Ừm. Tôi sẽ cố gắng.」"
1529 = "「Ừm. Tôi nghĩ lái tàu Akai là một lái tàu bẩm sinh.\\nAnh luôn lái tàu một cách êm ái, chu đáo với cả hành khách lẫn phía toa xe chúng tôi.」"
1535 = "「Ồ. Trông ngon quá nhỉ.」"
1545 = "「Bởi vì tôi, người được sinh ra bởi lái tàu Akai. Cùng với \\x%lクハ26;#00ffc040;Kuha 26%l;#; và đoàn tàu của nó.\\nLà toa xe thử nghiệm tàu điện tốc hành xuất sắc nhất, hiện đại nhất.」"
1547 = "「Nếu được dạy đàng hoàng, tôi sẽ làm được đàng hoàng.\\nVới hiệu suất của tôi, dù là nấu ăn hay bất cứ việc gì. Xong rồi đây.」"
1548 = "「Lo chứ. Lúc nào tôi cũng lo cho lái tàu Akai hết.」"
1549 = "「Bởi vì những dữ liệu tôi báo cáo,\\nRailord đồng hành cùng tôi hôm nay, ngày mai có thể sẽ biến mất.」"
1550 = "「Bởi vì đôi khi, mãi về sau người ta mới nhận ra rằng\\ndữ liệu đó đã dự báo trước một mối nguy hiểm lớn.」"
1551 = "「Cô và tôi đã tích lũy đủ dữ liệu để có thể đưa ra câu trả lời đó.\\nChỉ riêng điều đó, tôi có thể tự tin khẳng định.」"
1552 = "「Vì lúc đó số người có bằng lái tàu điện vốn đã ít.\\nNên chắc là gần như tất cả đều được ngỏ lời mời.」"
1554 = "「Đường sắt Hoàng gia vốn đang trên đà phát triển không ngừng qua các thời kỳ \\x%l明智;#00ffc040;Meiji%l;#; và \\x%l大詔;#00ffc040;Taisho%l;#;,\\nnhưng bước vấp ngã đầu tiên đã ập đến vào năm \\x%l大詔;#00ffc040;Taisho%l;#; thứ 35.」"
1556 = "「Và, trước khi thưởng thức rượu shochu——\\n（Sụp sụp）Ừm. Ngon lắm.」"
1559 = "「Sau khi được bổ nhiệm và bắt đầu làm việc.\\nTôi mới nhận ra trách nhiệm gắn liền với 'thử nghiệm', dù đã muộn màng.」"
1561 = "「Tốt quá rồi.\\nCũng hiểu được lý do tại sao anh lại không có tinh thần.」"
1563 = "「Thành công rồi! Thành công rồi! A, chị Shiro!?\\nỪm, em bảo này! Tốt lắm luôn! Có hi vọng!!!」"
1568 = "「Quả thực, có vẻ như tôi đã dọn dẹp quá mức rồi.」"
1570 = "「Tuyệt quá. Thăng tiến vượt bậc luôn.」"
1573 = "「Nếu được như vậy......\\nNghe cô nói thế, tôi cảm thấy như được cứu rỗi vậy.」"
1574 = "「Nếu đoạn đường điện hóa được mở rộng thì một ngày nào đó sẽ đi được thôi.\\nChắc chắn sẽ có tàu điện tốc hành chạy tuyến Kumamoto - Ohimitera.」"
1577 = "「Vợ cũ, nghĩa đúng như mặt chữ thôi.\\nTức là, chữ 'cũ' mang nghĩa là trước đây, cộng với chữ...」"
1579 = "「Không lâu sau đó.\\nTôi nhận được lời mời tham gia kỳ thi tuyển 'Lái tàu thử nghiệm tàu điện'.」"
1580 = "「Đứa trẻ, ừm, đang ở cùng vợ cũ sao?」"
1587 = "「Đúng vậy. Vì đoàn tàu \\x%lクハ26;#00ffc040;Kuha 26%l;#; sẽ là chuyến tàu tốc hành nhanh nhất.\\nTrong lúc hành khách thưởng thức bữa ăn thì tàu đã đến Hakata rồi. Nên mới là quầy ăn nhẹ.」"
1589 = "「Xin lỗi.」"
1590 = "「Đúng rồi, ngày nghỉ!\\nNgày nghỉ tiếp theo của lái tàu Akai...... là」"
1592 = "「Mạch thì——đúng là có đập thật.」"
1593 = "「Hi vọng...... sao.」"
1596 = "「Lịch sử Đường sắt Hoàng gia——」"
1597 = "「Điện khí hóa toàn tuyến vì sự phục hưng của đường sắt, ước nguyện tha thiết của Đường sắt Hoàng gia.\\nSự phát triển của tàu điện tốc hành chính là biểu tượng và cũng là con át chủ bài cho điều đó.」"
1609 = "「Từ lần sau, đoàn tàu sẽ dài ra. Thêm \\x%lモハシ21試験車両;#00ffc040;Toa xe thử nghiệm Mohashi 21%l;#;\\nvào đội hình 4 toa cơ bản.」"
1617 = "「Thành công rồi! May quá!!」"
1622 = "「Sự tiếp xúc thưa dần, những cuộc trò chuyện ít đi, sự hiện diện của đối phương trở nên nặng nề.\\nNhưng tôi lại không thể tự mình mở lời ly hôn.」"
1623 = "「Chúng tôi kết hôn trong sự chúc phúc mà không gặp trở ngại gì đáng kể,\\nvà đến năm thứ hai thì có được một đứa con.」"
1625 = "「Đầu tiên là đặt mục tiêu đã.\\nVì tôi thích đường sắt, nên tôi muốn làm công việc liên quan đến nó.」"
1627 = "「Đó chỉ là dấu hiệu để tôi không quên gửi quà thôi——\\nTôi làm cô ngạc nhiên rồi sao?」"
1628 = "「Của tôi và vợ cũ của tôi.」"
1630 = "「Hơn cả vợ cũ, là đối với đứa con. Tôi cảm thấy rất có lỗi.\\n......Giá như tôi có thể dành nhiều tình yêu thương hơn cho thằng bé.」"
1632 = "「Anh hiểu được thì tôi rất vui.\\nVì dạo gần đây, trông anh có vẻ không được khỏe.」"
1633 = "「Những áp lực cảm nhận được trong công việc,\\ntôi không mang về nhà.」"
1635 = "「Tôi muốn đến đó thử. Anh dẫn tôi đi nhé.」"
1637 = "「Tôi muốn nghe. Tôi muốn anh kể cho tôi nghe.」"
1638 = "「Tôi muốn tham gia vào đó, muốn gánh vác một phần công cuộc phục hưng đường sắt.\\nCảm nhận được khát khao ấy, tôi đã nghĩ 'dù phải làm bất cứ điều gì'.」"
1640 = "「Ra là vậy.」"
1641 = "「Tôi mới là người phải nói thế. Cảm ơn cô.\\nVà, cảm ơn vì bữa ăn. Rất ngon.」"
1643 = "「Tôi sẽ nói bao nhiêu lần cũng được.\\n'Vì vậy'. 'Tôi'. 'Mới ở đây'.」"
1644 = "「Tôi chưa học qua nhiều lắm.」"
1647 = "「Tôi từng tin rằng làm như vậy là một phép lịch sự.\\nNhưng...... sự lựa chọn đó chỉ mang lại sự im lặng.」"
1649 = "「Tôi biết rồi. An toàn là sứ mệnh đặt lên hàng đầu.」"
1651 = "「Tôi biết. Ý tưởng điện khí hóa toàn bộ các tuyến đường chính.」"
1653 = "「Tôi biết chứ. Dù biết là vậy——\\nnhưng thành thật mà nói, đó là một áp lực rất lớn.」"
1655 = "「Tôi biết rồi. Vậy thì, chào nhé!」"
1659 = "「Dù chỉ là tưởng tượng của một kẻ thiếu hiểu biết sự đời.\\nNhưng tôi nghĩ...... điều đó chắc hẳn đau khổ lắm.」"
1660 = "「Tôi cũng lần lượt lấy được bằng lái toa xe tự hành và bằng lái tàu điện.\\nCó lẽ công việc lái tàu rất hợp với tôi.」"
1661 = "「Rời khỏi Ohimitera, đến sống ở Kokura.\\nHoạt động tìm việc thực sự bắt đầu từ đó.」"
1663 = "「Vì vậy, anh đã trở thành lái tàu?」"
1664 = "「Vì vậy, tôi chỉ còn cách quên đi.\\nBiến mọi thứ thành quá khứ——và giờ chỉ còn lại vết tích trên tờ lịch.」"
1667 = "「Vì vậy. Anh không cần phải. Đau khổ nữa đâu.」"
1669 = "「Cho nên, ừm——tôi muốn biết. Chi tiết hơn.\\nVì đây là chuyện có vẻ không dễ gì nghe được.」"
1670 = "「Giáo dân, có nghĩa là――」"
1671 = "「Hiện đại nhất, chính là kế thừa——\\ntất cả mọi thứ của quá khứ nhỉ.」"
1672 = "「Hiện đại nhất, chính là như vậy.\\nVô số những kỷ niệm, những dữ liệu. Đã sinh ra tôi.」"
1677 = "「Phần tiếp theo thì tôi đã học rồi. Năm Showa thứ 30,\\nngân sách liên quan đến Đường sắt Hoàng gia bị cắt giảm đáng kể.」"
1681 = "「Quyền nuôi dưỡng thuộc về bên đó, hơn nữa vợ cũ tôi cũng không thích.\\nCô ấy không cho tôi gặp con.」"
1682 = "「Việc dọn dẹp thì để tôi tự làm.\\nKhông thể làm phiền cô đến mức đó được.」"
1684 = "「Ngăn nắp quá, thì chán ngắt. Sao.」"
1689 = "「V-Vậy sao. Nếu thế——ừm. Tôi rất vui.」"
1693 = "「Đúng vậy. Cùng cố gắng nhé, Niiroku.」"
1695 = "「Đúng vậy. Nếu thế thì——」"
1696 = "「Đúng vậy nhỉ.」"
1697 = "「Chính xác là vậy, Niiroku.\\nTôi, đã rất muốn gặp cô.」"
1699 = "「Đúng vậy. Chỉ mất năm năm, tôi đã làm được điều đó.」"
1700 = "「Đúng vậy, thật sự là thế. Vì là 'thử nghiệm' nên——\\ndù là dữ liệu nhỏ nhặt đến đâu cũng cần phải báo cáo chính xác.」"
1702 = "「Vậy sao?」"
1703 = "「Vậy sao. Dù vậy cũng không được lơ là đâu nhé?」"
1704 = "「Vậy sao. Cảm ơn cô.」"
1705 = "「Là sinh nhật đấy.」"
1708 = "「Đúng vậy. Khi cô ấy mở lời, tôi vừa sốc, vừa cam chịu.\\nVà đồng thời...... thành thật mà nói, tôi cũng cảm thấy nhẹ nhõm.」"
1709 = "「Đúng vậy. Trong vận tải, 'An toàn là sứ mệnh hàng đầu'.\\nTất nhiên, tôi cứ nghĩ là mình đã hiểu điều đó, nhưng——」"
1710 = "「Đúng vậy. Tôi đã đáp ngay 'Tôi sẽ tham gia',\\nvà từ đó là những ngày tháng học tập và rèn luyện không ngừng nghỉ.」"
1713 = "「Đúng vậy. Năm Showa thứ nhất. Trên mảnh đất đã biến thành tro bụi,\\nthứ vang lên âm thanh của sự phục hưng chính là đường sắt.」"
1715 = "「Ra là vậy. Đền Akai Aso. Ohimitera. Kuma.\\nQuê hương của loại trà này, và của tài xế Akai――(Ực)」"
1716 = "「Thông qua sự giới thiệu của một lái tàu tiền bối, anh ấy bảo 'bố cô ấy cũng là nhân viên đường sắt'.\\nThực tế, cô ấy rất thấu hiểu công việc đường sắt.」"
1743 = "「Sự im lặng dần trở nên nặng nề, việc trở về nhà cũng trở nên đau khổ.\\nTôi ngày càng đâm đầu vào công việc.」"
1744 = "「Không sao không sao, may mà tách trà đã cạn rồi.」"
1745 = "「Chưa.\\nĐây cũng là lần đầu tiên tôi thấy tài xế Akai pha trà.」"
1746 = "「Không vấn đề gì.」"
1747 = "「Đúng vậy. Dù gặp nhiều khó khăn,\\nnhưng ý tưởng đó vẫn từng bước, từng bước tiến tới hiện thực.」"
1748 = "「Đúng là vậy.」"
1749 = "「Đúng vậy, đó được coi là khởi đầu của\\ncái gọi là 'Thời đại Đại bãi bỏ các tuyến đường sắt'.」"
1757 = "「Tôi nghe đây.」"
1759 = "「Cũng có khi phương tiện thử nghiệm được đưa thẳng vào vận hành thương mại.\\nNhưng, những trường hợp không được như vậy cũng rất nhiều.」"
1761 = "「Để chống lại làn sóng đó, Đường sắt Hoàng gia đã đánh một canh bạc lớn.」"
1765 = "「Mười tám năm sau đó, động cơ Aircra được đưa vào thực tiễn.\\nNăm Showa thứ 21, Luật Aircra được ban hành và thực thi.」"
1768 = "「Món hầm cũng...... ồ, mềm quá——. Ừm. Ừm!\\nThật bất ngờ. Rất ngon, đúng chuẩn luôn.」"
1770 = "「Cả sinh nhật cũng...」"
1772 = "「Anh đã biến nó thành quá khứ——\\nđến mức sinh nhật cũng sẽ quên nếu không ghi lên lịch sao?」"
1773 = "「Là rượu dâng lên thần linh.\\nTuy không phải là thanh tựu, mà là rượu shochu Kuma.」"
1775 = "「Vì giáo viên dạy tốt,\\nvà tôi cũng có hiệu suất để tái hiện lại những gì đã được học.」"
1776 = "「Quả thực là rất đau khổ.\\nĐến mức nếu không quên đi, tôi sẽ không thể sống một cuộc sống bình thường.」"
1777 = "「Không sao đâu.」"
1779 = "「Chán ngắt. Lúc nào cũng ngăn nắp quá mức.」"
1790 = "「Quả thực. Nếu xét đến việc đoạn đường điện hóa hiện tại còn ngắn,\\nthì dù là góc ăn nhẹ cũng là một trang bị quá mức rồi.」"
1799 = "「Vì những dữ liệu được tích lũy sẽ được kế thừa và phản ánh lại.\\nBởi vì Railord——chúng tôi, có sự cộng cảm.」"
1801 = "「Và thời gian của lái tàu Akai,\\nđã được dốc cạn vì chúng tôi rồi.」"
1804 = "「Được nghe cô nói vậy, tôi rất vinh hạnh.」"
1811 = "「Trà, có vị như thế nào vậy?」"
1816 = "「Tôi hiểu rồi. Vậy cứ làm thế đi.」"
1817 = "「Phải mất đến năm năm, mới có thể biến nó thành quá khứ.」"
1820 = "「Lái tàu thử nghiệm.\\nTrách nhiệm đó, không thể nào nhẹ nhàng được.」"
1829 = "「Tôi muốn vào.」"
1839 = "「Lái tàu Akai, đã dành thời gian cho chúng tôi.」"
1840 = "「Lái tàu Akai. Anh đói bụng rồi sao?」"
1841 = "「Tài xế Akai. Đệm.」"
1857 = "「Và điều đó——cũng dẫn đến sự ra đời của tôi.」"
1858 = "「Tôi nghĩ cỡ này thì cứ vứt lăn lóc ở ngoài cũng được mà.」"
1859 = "「Là trà được giáo dân biếu tặng mà lị.\\nThuộc loại thượng hạng trong số các loại trà Kuma đấy.」"
1860 = "「Là rượu 'Migita Ichi' của nhà Migita Ichi.\\nĐúng chuẩn rượu shochu Kuma đấy.」"
1861 = "「Cái đó là vì.\\nLà do Niiroku rót rượu cho tôi đấy.」"
1862 = "「Đó là biểu hiện của sự kỳ vọng. Biểu hiện của ý chí. Hướng tới điện hóa toàn tuyến\\n――hướng tới sự hồi sinh của Teitetsu. Tôi muốn đáp lại điều đó.」"
1863 = "「Tôi đến để truyền đạt chuyện đó \"nữa\".」"
1864 = "「Đó là để ngăn chặn nguy hiểm từ trong trứng nước.\\nMột công việc rất quan trọng và có giá trị.」"
1865 = "「Đó là điều hiển nhiên. Bất kỳ dữ liệu nào cũng có giá trị.\\nDù tại thời điểm đó, nó có vẻ vô nghĩa đi chăng nữa——」"
1866 = "「Ra là vậy, ra là vậy.」"
1867 = "「Cũng hết cách mà. Cô mới đi vào hoạt động được nửa năm thôi.」"
1868 = "「Việc vận hành này đã nằm trong dự tính ngay từ đầu.\\nKhả năng của tôi vẫn còn dư dả lắm. Lái tàu Akai cứ yên tâm.」"
1871 = "「Điều đó là không thể nào.」"
1875 = "「Cái 'Bảy' kia là sao vậy?\\nRõ ràng là ngày hai mươi sáu, vậy mà lại viết là 'Bảy'.」"
1876 = "「Cái đó... vợ cũ... có nghĩa là,\\nlái tàu Akai trước đây đã từng kết hôn. Còn bây giờ——là người độc thân.」"
1878 = "「Vậy là, từ phía bên kia sao?」"
1879 = "「Sẽ là một câu chuyện dài đấy nhé?」"
1882 = "「Vậy thì tôi cũng rất vui.」"
1883 = "「Vậy, tôi sẽ hỏi.」"
1886 = "「Vậy thì thất lễ quá.」"
1887 = "「Vậy thì, tôi xin phép.」"
1892 = "「Đau khổ...... sao.」"
1907 = "「Chị D60 46 bảo rằng,\\nchắc chắn sẽ có ích, nên là.」"
1911 = "「Mohashi――\\x%l合造車;#00ffc040;Toa xe hỗn hợp%l;#; giữa toa động lực hạng thường và toa ăn\\n...à không, là \\x%lビュッフェ;#00ffc040;quầy ăn nhẹ%l;#; chứ.」"
2011 = "Và rồi, khi uống vào tôi mới nhận ra."
2014 = "――Nếu tưởng tượng đến những ảnh hưởng xấu mà điều đó mang lại,\\nthì chút đa cảm nhỏ nhặt của tôi chẳng đáng để bận tâm."
2020 = "Thế nhưng, với chừng đó sự chu đáo,\\ncó lẽ giới hạn của tôi đã đạt đến mức tối đa rồi."
2023 = "Vừa nói, cô ấy vừa thuần thục cắm dây sạc của mình\\nvào ổ điện rồi ngồi xuống."
2026 = "Niiroku vừa bước vào đã nhìn quanh quan sát tỉ mỉ.\\nDáng vẻ hệt như một con thú nhỏ vừa trở về hang ổ của mình."
2028 = "Niiroku, lại nhìn tôi.\\nNhư thể muốn bảo tôi hãy nhìn vào đôi mắt ấy."
2030 = "Rút phích cắm, Niiroku đứng dậy."
2032 = "Niiroku khép lại đôi môi vừa hé mở.\\nSau đó, cô ấy từ từ mở miệng ra lần nữa."
2037 = "Đôi mắt Niiroku sáng rực lên."
2038 = "Đôi mắt Niiroku sáng rực lên.\\nCô ấy rướn người về phía trước, đoạn dây cáp chùng cũng bị kéo căng ra."
2039 = "Có lẽ giọng điệu có chủ ý của tôi đã phát huy tác dụng,\\nlời nói của Niiroku cũng đã lấy lại được chút sức sống."
2041 = "Niiroku, nhìn tôi.\\nBằng đôi mắt như mặt hồ ấy——một đôi mắt sâu thẳm, có chút gì đó hoài niệm."
2042 = "Niiroku đứng dậy——a!"
2044 = "Niiroku bước ra hành lang.\\nĐóng cửa lại——nhưng tôi vẫn chưa khóa vội."
2046 = "Niiroku nhắm mắt lại trong một khoảnh khắc ngắn ngủi."
2048 = "Niiroku gật đầu.\\nÁnh mắt cô ấy vô cùng thẳng thắn."
2050 = "Ánh mắt của Niiroku đảo quanh.\\nCô ấy liên tục đưa mắt nhìn qua lại giữa những món đồ nội thất ít ỏi trong căn phòng này——"
2052 = "Niiroku chăm chú nhìn tôi.\\nĐôi mắt ấy tĩnh lặng, thỉnh thoảng lại gợn sóng——như một mặt hồ."
2053 = "Không thèm giấu đi vẻ mặt bất mãn,\\ncô ấy gật đầu một cách miễn cưỡng."
2055 = "Đến mức tuyệt đối không thể nói bằng thì quá khứ."
2058 = "Nhưng nếu bây giờ nói ra điều đó,\\ntôi không muốn làm lu mờ đi nụ cười rạng rỡ này."
2060 = "Nhưng, cô ấy lại không phải như vậy.\\nVà——tôi đã không hiểu được điều gì cả."
2063 = "Nhưng tôi đã kéo cả con mình vào.\\nDù cho phải ôm lấy nỗi đau đó suốt cả cuộc đời này đi chăng nữa."
2064 = "Nhưng những lời của Niiroku quả thực\\nđã làm dịu đi nỗi đau đó."
2070 = "Con của nhà Akai. Con của nhà đền.\\nLiên tục được gọi như vậy, cho đến tuổi dậy thì, đó vẫn là niềm tự hào của tôi."
2073 = "Cô ấy không phải là một người phụ nữ đủ mạnh mẽ để phá vỡ cục diện đó.\\nHoặc đơn giản là chúng tôi đã không thể trở thành một cặp vợ chồng đúng nghĩa."
2075 = "Vô vàn sắc màu, thoáng chốc lóe lên trên mặt hồ.\\nLà ánh mắt của những cỗ máy thử nghiệm, đã từng kề vai sát cánh bên tôi."
2078 = "Ra là vậy, quả thực là......\\nChỉ cần cái bụng được lấp đầy, cõi lòng cũng tự nhiên dịu lại."
2083 = "Chỉ một chiếc đệm cũng đủ tạo ra một chốn dừng chân.\\nMột chốn dừng chân có thể sẻ chia cùng ai đó."
2084 = "Nếu là một Railord.\\nNếu là người đã chọn cách sống cống hiến bản thân cho đường sắt."
2088 = "Chỉ cần thốt ra thành lời thế này thôi,\\ndạ dày tôi cũng đã quặn thắt lại——"
2090 = "Dù mục tiêu hướng tới là như nhau,\\nnhưng độ sâu yêu cầu lại hoàn toàn khác biệt."
2097 = "Do đó, chúng tôi hầu như không thể cùng nhau ra ngoài——\\nDù vậy, cô ấy vẫn chấp nhận tôi."
2098 = "Trong tủ lạnh chỉ có củ cải, miso và trứng thôi,\\nvậy mà cô ấy đã làm rất tốt."
2099 = "Trong mắt Niiroku,\\nchắc hẳn tôi trông vô cùng điềm tĩnh nhỉ?"
2101 = "Việc phải hy sinh ngày nghỉ để làm nhiệm vụ là chuyện đương nhiên.\\nVào ngày nghỉ, nếu không ngủ thì cơ thể sẽ không trụ nổi."
2107 = "Thời đại Đại bãi bỏ các tuyến đường sắt.\\nMột cụm từ đáng ghét mà tôi chẳng bao giờ muốn thốt ra."
2111 = "Có lẽ là do sự chỉ dẫn của Railord đầu máy hàng hóa."
2113 = "Chiếc tách trà đến tay tôi cầm còn thấy lớn,\\nđược hai bàn tay nhỏ bé ôm trọn lấy một cách nâng niu, cẩn thận."
2115 = "Cô ấy lắng nghe tôi một cách rất tự nhiên.\\nVì vậy, tôi cũng có thể kể chuyện một cách tự nhiên."
2117 = "Chắc hẳn cô ấy đang lựa lời để nói."
2119 = "――Railord chuyên dụng của \\x%lクハ26;#00ffc040;Kuha 26%l;#;.\\nModule hình người chuyên dụng cho hệ thống điều khiển tổng hợp tàu điện tốc hành tối tân nhất."
2123 = "Sự tự tin, niềm tự hào.\\nDường như đang tuôn trào qua giọng nói của cô ấy."
2124 = "Tờ lịch. Ánh mắt cô ấy dừng lại ở một điểm.\\n......Chắc là cô ấy sẽ hỏi đây."
2127 = "Một nụ cười đầy tự tin, tự hào đến chói lóa.\\nA――Tôi đã nhìn thấy nụ cười ấy bao nhiêu lần rồi nhỉ."
2128 = "Nhận lại được nhiều hơn những gì mình đã nói, và được hồi đáp.\\nTôi đã quên mất rằng điều đó lại đáng vui mừng đến nhường này."
2137 = "Điều đó đương nhiên sẽ được tha thứ——\\nBây giờ nghĩ lại, có lẽ tôi đã ỷ lại như thế."
2139 = "Bàn giao Niiroku cho một ai đó khác.\\n――Đó là bổn phận của tôi."
2143 = "Giữa hai sự lựa chọn quá đỗi kinh điển 'công việc và gia đình',\\ntôi chỉ đơn giản là liên tục chọn vế trước mà thôi."
2145 = "Chính là như vậy.\\nNghĩ cho cùng, thực sự chỉ có vậy thôi."
2147 = "Teitetsu đã nhồi nhét biết bao nhiêu thứ vào cơ thể nhỏ bé ấy,\\ntôi cảm giác như mình có thể hiểu được phần nào qua lời lẩm bẩm nhỏ nhặt vừa rồi."
2153 = "May mắn được tuyển dụng làm thợ rửa lò,\\ntrải qua kỳ thi, tôi trở thành phụ lái tàu. Rồi sau đó là lái tàu."
2157 = "Hiếm khi thấy Niiroku ngập ngừng như vậy."
2163 = "Nhận ra đó chính là những lời của Niiroku――\\ntôi cảm thấy một niềm vui sướng trào dâng."
2165 = "Đang nghĩ xem phải làm sao đây,\\ntôi vô thức nắm lấy cổ tay mình."
2168 = "Tôi cứ nghĩ rằng, mình đang bị oán hận.\\nThậm chí có lẽ tôi còn nghĩ, bị oán hận chính là một cách để chuộc tội."
2171 = "Mối quan hệ này chỉ kéo dài trong một khoảng thời gian ngắn ngủi,\\ncho đến khi Niiroku, và \\x%lクハ26;#00ffc040;Kuha 26%l;#; chuyển sang vận hành trên tuyến chính――vậy mà."
2174 = "Vợ tôi là người lớn, đó là kết quả từ sự lựa chọn của chính cô ấy.\\nBản thân tôi, tất nhiên, cũng vậy."
2177 = "Dù không khát nước,\\nnhưng tôi làm vậy để ngầm bảo cô ấy hãy cứ tự nhiên đi."
2179 = "'An toàn' cảm nhận trên tuyến chính, và 'An toàn' mà thử nghiệm yêu cầu."
2181 = "Tôi thở phào nhẹ nhõm. Đồng thời, cũng cảm thấy có chút cô đơn."
2184 = "Tôi quyết định lấy rượu Thần\\nđược dâng trước ngự thần trát thay cho bàn thờ Thần đạo."
2185 = "Dù có trở thành kẻ bỏ bê đứa con mới chào đời,\\ntôi vẫn đặt việc thi đỗ làm ưu tiên hàng đầu."
2187 = "Cái gai đó tất nhiên vẫn còn ghim chặt.\\nVì tôi——vẫn đang tiếp tục gây phiền phức cho con trai mình."
2188 = "Có lẽ tôi đã lỡ lời mất rồi.\\nTôi là tài xế lái thử."
2191 = "Nhận lấy chén rượu Niiroku rót cho,\\ntôi để rượu Migita Ichi lấp đầy khoang miệng."
2192 = "Cảm thấy vui sướng vì điều đó, tôi tự nhắc nhở bản thân mình."
2195 = "Cố gắng, nói nhẹ nhàng nhất có thể."
2198 = "Tôi nhìn vào mắt Niiroku.\\nTrong đó giờ đây chỉ còn lại màu sắc nguyên bản."
2200 = "Suýt nữa thì thốt ra thành tiếng, tôi vội nuốt ngược vào trong."
2202 = "Nụ cười mới hôm qua vẫn còn tỏa sáng bên cạnh tôi,\\ntôi đã đánh mất nó——bao nhiêu lần rồi."
2203 = "Đối với tàu hàng hóa, việc không đổi lái tàu\\nmà phải làm nhiệm vụ trên chặng đường dài, thời gian dài, nghe nói là chuyện thường tình."
2205 = "Giả vờ như không nhận ra sự nhấn mạnh đó và giục cô ấy nói tiếp,\\nNiiroku thở hắt ra, lấy lại giọng điệu nghiêm túc của công việc."
2206 = "Một cách máy móc. Chỉ đơn thuần là máy móc.\\nKhông xen lẫn bất kỳ sự chủ quan nào, không bỏ sót bất cứ điều gì."
2208 = "Âm thanh đó——âm thanh khiến người ta cảm thấy như bị nhốt ở ngoài,\\ntôi không muốn Niiroku phải nghe thấy."
2210 = "Tôi gật đầu.\\nSuy nghĩ một chút, rồi chọn điểm bắt đầu câu chuyện."
2211 = "Nếu không có vấn đề gì thì câu chuyện đến đây là kết thúc.\\nTách trà cũng đã cạn từ lâu, và việc sạc pin thì vốn dĩ đã đủ rồi."
2224 = "Một tiếng xả khí nhẹ nhàng vang lên."
2227 = "Bầu không khí vừa mới giãn ra lại trở nên lạnh lẽo,\\ncô ấy lại chìm vào sự ủ rũ."
2229 = "Thử nghiệm bị hủy bỏ. Và toa xe sẽ——\\nbị tháo dỡ cùng với cả Railord."
2233 = "Trứng cuộn cũng được nêm nếm đậm đà,\\nnhờ vậy mà củ cải bào ăn kèm lại mang đến cảm giác rất thanh mát."
2237 = "Bị cô ấy nằng nặc đòi \"Ít ra cũng phải có cái đệm chứ\",\\nthế là hai chúng tôi cùng nhau ra ngoài mua về, một chiếc đệm thật đáng yêu."
2240 = "Chỉ trong chớp mắt đã dọn dẹp xong,\\nNiiroku thản nhiên đặt tay lên tay nắm cửa."
2253 = "Đột nhiên.\\nÁnh mắt Niiroku dịu lại."
2256 = "Bất giác, tôi muốn uống súp miso.\\nThêm một ngụm nữa. Không phải rượu shochu, mà là súp miso."
2258 = "Đang trò chuyện――\\nBất chợt nhận ra điều đó, một niềm vui sướng trào dâng trong tôi."
2260 = "Giống như sự nhẹ nhõm, lại giống như sự thất vọng——\\nMột âm thanh nghe như tiếng thở dài."
2268 = "Nếu tôi giữ im lặng,\\nđối phương cũng đành phải giữ im lặng theo."
2270 = "Ngay cả việc tiếp tục thử nghiệm cũng nguy hiểm.\\nNếu báo cáo những dữ liệu như vậy, thì mọi chuyện sẽ kết thúc."
2274 = "Đối với tôi thì hơi mặn một chút,\\nnhưng nếu coi là đồ nhắm thì lại rất hợp."
2276 = "Canh súp miso củ cải. Củ cải hầm trứng.\\nTrứng cuộn ăn kèm củ cải bào."
2281 = "――Nếu nói về lý do khiến tôi trông có vẻ phiền não\\nđến mức làm Niiroku phải lo lắng, thì lại là một chuyện khác."
2293 = "Uống. Ăn. Thỏa mãn.\\nĐến mức khiến tôi nhớ lại rằng đó chính là niềm vui."
2303 = "Đó là một niềm hạnh phúc đích thực――\\nTôi đã lãng quên điều đó từ bao giờ nhỉ."
2305 = "Đã hoạt động bao nhiêu năm, quá khứ đã in hằn trong tâm trí,\\ntôi chợt có ảo giác như vậy."
2306 = "Tranh thủ lúc nghỉ ngơi ở kho đầu máy, mượn nhà bếp làm chút đồ ăn nhẹ——\\nChắc hẳn cô ấy cũng đã học được cách giúp đỡ lái tàu theo cách đó."
2309 = "Rằng tôi đã quên mất,\\ncả hương vị súp miso mà người từng là vợ tôi nấu mỗi ngày."
2311 = "Đôi mắt như mặt hồ ấy, nhìn tôi.\\nBề mặt của nó, khẽ dao động."
2312 = "Dù chỉ là những câu chuyện vặt vãnh,\\nnhưng biểu cảm của Niiroku lại thay đổi liên tục."
2313 = "Vất vả thì nhiều, nhưng niềm vui lại nhiều hơn hẳn.\\nVì vậy, mỗi ngày đều trôi qua nhanh như chớp."
2314 = "Không có thiệt hại gì thực tế cả.\\nNhưng Niiroku lại tỏ ra vô cùng ủ rũ."
2315 = "Một Railord mới đi vào hoạt động được nửa năm,\\nvậy mà lại bị Master, dù chỉ là tạm thời, giấu giếm."
2321 = "Trước tiên phải giữ tỉnh táo. Để không bị cuốn theo những lời nói đó.\\nSau đó, chỉ cần trả lời một cách thành thật."
2323 = "Thứ thôi thúc Niiroku.\\nCó lẽ chỉ là trí tò mò thuần túy mà thôi."
2331 = "（Ọt~~~~~）"
2332 = "（Lộc cộc lộc cộc lộc cộc lộc cộc）"
2333 = "（A......）"
2334 = "(A)"
2335 = "（Lạch cạch）"
2337 = "（Hi vọng, sao）"
2339 = "（Đợi đến khi tiếng bước chân khuất hẳn rồi hẵng——）"

