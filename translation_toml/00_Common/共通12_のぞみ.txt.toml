2190 = "「Giống như lúc có sự kiện vậy nhỉ.」"
2193 = "「Chuyện là như vậy đấy. Hachiroku. Nếu em cũng mong muốn,\\nanh muốn tổ chức trưng bày \\x%l8620;#00ffc040;8620%l;#; trước khi phục hồi.」"
