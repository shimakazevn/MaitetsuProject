2228 = "「Vâng ạ.」"
2232 = "「Em, em đã cố gắng. Ạ.」"
2233 = "「Không phải là anh đang âm mưu lung lạc em đâu.\\nDù Hibiki có tiếp tục thuộc phe ủng hộ, anh cũng hoàn toàn không bận tâm.」"
2241 = "「Chúng ta——chắc chắn sẽ đến được ga cuối cùng.」"
2242 = "「Nếu là chuyện về nước và đất ấy mà.\\nBọn ta, so với người thường thì, cũng rành hơn một chút.」"
2243 = "「Nếu cùng chung mục đích, anh nghĩ liệu em có thể cho anh mượn sức không.\\n……Mục đích của Hibiki, không phải là bản thân việc thu hút nhà máy đúng không?」"
2244 = "「Đúng là, với mục đích lôi kéo toàn bộ thị trấn,\\ntôi nghĩ truyền miệng từ học sinh sẽ mang lại hiệu quả lớn.」"
2246 = "「Giống như lúc ngài hỏi tôi trước đây――\\nTôi vẫn chỉ có thể nói những điều không thay đổi.」"
2248 = "「Em đang đi cùng bé này ạ.」"
2250 = "「Cả tôi, và 8620,\\nđều là tài sản của ngài Soutetsu, là tài nguyên kinh doanh. Vì vậy đương nhiên――」"
2251 = "「Anh đang hỏi về phần vượt lên trên một đồ vật. Về trí tuệ làm nên con người em.\\nVề chính bản thân em――anh đang hỏi mong muốn của em là gì.」"
2252 = "「Tôi, đã nói rồi mà.」"
2257 = "「Vì em chưa từng thấy \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; thật bao giờ.\\nNên, em khá là……có hứng thú. Ạ.」"
2260 = "「Em nghĩ Nagi cũng sẽ đến nếu được xem tận mắt.\\nNagi rất được yêu mến, nên chắc sẽ có nhiều người đến, cả phụ huynh nữa.」"
2261 = "「Ta có trêu chọc ác ý gì đâu chứ.」"
2266 = "「Tôi là chủ sở hữu của cô.\\nTôi đã hứa với cô rồi.」"
2267 = "「Em là…… một \\x%lレイルロオド;#00ffc040;Railord%l;#; đáng khinh…… đã gây ra cho đứa trẻ này\\n……và rất nhiều người, những tổn thương không thể nào cứu vãn——」"
2269 = "「Tôi sẽ biến mong muốn của cô thành hiện thực.」"
2270 = "「Anh dự định sẽ mang phương án này đến ngân hàng――\\nĐến chỗ Houshou Kisaki.」"
2271 = "「Tất nhiên là tôi phải đến rồi. Bên trong \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#;,\\ncơ hội được nhìn ngắm kỹ lưỡng thế này là rất hiếm có.」"
2273 = "「Tôi hơi lỡ lời quá rồi.\\nCứ nhắc đến sở thích là cái miệng lại không kìm lại được.」"
2276 = "「Cháu á, chỉ toàn kéo chân mọi người thôi.」"
2278 = "「Mong muốn của mình là gì……trước khi trả lời,\\nviệc cố gắng suy nghĩ――có vẻ như rất khó đối với tôi.」"
2279 = "「Bản thân, tôi……\\nMong muốn, của tôi――」"
2280 = "「Tôi nghĩ, nếu chỉ dựa vào những con số thì người bình thường sẽ không thể\\ncảm nhận được thực tế \\x%l8620;#00ffc040;8620%l;#; là một chiếc đầu máy như thế nào đâu.」"
2284 = "「À này!」"
2285 = "「Thế? Bạn Hayase.\\nCái anh Soutetsu đó, là người đó sao?」"
2290 = "「Bị kích thích bởi sự nỗ lực của cậu Soutetsu,\\nlão già này cũng chỉ cố gắng thêm một chút thôi.」"
2291 = "「Không có gì không có gì, lão già như tôi.」"
2292 = "「Vì vậy……\\nTôi, với tư cách là tài sản của ngài Soutetsu――」"
2295 = "「Người đeo kính có lẽ là thư ký đấy ạ.\\nMỗi khi cô Kisaki nói gì đó, người ấy có vẻ đều ghi chép lại.」"
2298 = "「Vì thế……nếu có thể tái thiết kinh tế\\nmà không cần thu hút nhà máy, với hình thức ít rủi ro hơn……thì thật lý tưởng, nhưng mà……」"
2300 = "「Vì vậy Hachiroku, tôi sẽ làm cho cô chạy lại một lần nữa.\\nSẽ làm cho cô và \\x%l8620;#00ffc040;8620%l;#; lại được chở mọi người, và những nụ cười.」"
2302 = "「Vì vậy, tôi đã nghĩ――trước khi bắt tay vào phục hồi,\\nhay là chúng ta tổ chức trưng bày công khai 8620 một lần xem sao?」"
2304 = "「Ra là vậy, bốn chai Ramune sao.」"
2305 = "「Vậy nên anh hai――anh trai, mới bảo em, một người thuộc phe ủng hộ thu hút nhà máy,\\nvẽ nhãn hiệu cho Shochu Hơi Nước sao?」"
2307 = "「Việc tiếp tục bị sử dụng đến mức gây bất tiện cho chủ nhân,\\ncông cụ, phương tiện――tuyệt đối không hề mong muốn điều đó.」"
2312 = "「Phương tiện chỉ là công cụ. Chỉ cần chọn cái tối ưu nhất để mang lại kết quả là được.\\nNếu không thể đánh giá ngay cái nào là tối ưu nhất thì――」"
2314 = "「Vậy thì, anh Soutetsu.」"
2317 = "「Kéo \\x%l客車;#00ffc040;toa hành khách%l;#;, một lần nữa――chạy cùng với hành khách.\\nChỉ điều đó thôi, chắc chắn, đứa trẻ đó sẽ mong muốn.」"
2320 = "「Dù là cô đi, hay ai đi thì cũng thế thôi.\\nNhững tinh tế giữa nam và nữ, có vẻ là như vậy đấy.」"
2322 = "「Từ bỏ, suy nghĩ……」"
2332 = "「Hibiki!」"
2333 = "「Hibiki, phương tiện chỉ là công cụ thôi.」"
2336 = "「Bạn Hayase……?」"
2337 = "「Bạn Hayase giải thích sao~?」"
2340 = "「Là \\x%l列車;#00ffc040;tàu%l;#; đấy. Xe của ngài thị trưởng đã quay về rồi.」"
2348 = "「Đúng vậy nhỉ, Reina. Một ý tưởng rất tuyệt vời.\\nNếu là dòng 8620, chắc chắn sẽ có rất nhiều ảnh chụp lúc đang chạy.」"
2349 = "「Ừ.」"
2353 = "「Ra là vậy, nếu chúng ta quảng bá cho cả khách du lịch,\\nthì khi \\x%l8620;#00ffc040;8620%l;#; thực sự chạy, có thể hy vọng họ sẽ quay lại nhỉ.」"
2355 = "「Vâng, hoàn toàn không.」"
2357 = "「A, đúng là như vậy thật.」"
2358 = "「Ồ. Nếu được vậy thì tốt quá.」"
2359 = "「Ra là vậy.」"
2360 = "「Vậy sao, giúp anh nhiều lắm.」"
2362 = "「Đúng, vậy nhỉ.\\nNếu là tiền bối Kisaki, tuyệt đối, chắc chắn chị ấy sẽ làm vậy.」"
2363 = "「Vâng, đúng vậy.」"
2364 = "「Vâng. Vâng.」"
2365 = "「Ồ, Kon. Mày cũng đi cùng Hibiki à.」"
2366 = "「Đây là, ông Minokasa.\\nCảm ơn ông đã cất công đến đây.」"
2368 = "「Là người của ngân hàng…… phải không nhỉ?\\nMặc vest, lại còn rất hợp với cặp kính nữa.」"
2371 = "「Vâng, thưa ngài Soutetsu. Em nhất định sẽ dốc toàn lực.\\nDù có hèn hạ, dù có khó coi đến đâu——」"
2375 = "「Nagi là ồn ào nhất đấy.\\nNhé? Nhỏ giọng xuống một chút nào?」"
2377 = "「Có cái gì đến kìa! Trông vui quá!」"
2385 = "「Tự nhiên đói bụng quá! Yubeshi! (Bánh nếp yuzu)\\nA, cũng muốn ăn cả đá bào nữa!」"
2393 = "「Vào lúc khai trương tuyến mới, hay ngược lại là khi \\x%l列車;#00ffc040;tàu%l;#; bị ngừng hoạt động,\\nsân ga sẽ chật kín những người đam——những người hâm mộ đường sắt ạ.」"
2397 = "「Không không, tôi cũng mải chụp ảnh――ô kìa, cậu Soutetsu.」"
2398 = "「Không ạ——em chỉ đang nghĩ,\\nkhông biết người đó có nghe thấy không.」"
2399 = "「Chẳng để làm gì, sao?」"
2400 = "「Đúng vậy. Phải thế chứ.\\nDù có hèn hạ, dù có khó coi đến đâu.」"
2401 = "「Ừ, bởi vì thứ anh muốn mọi người thấy, là hy vọng về sự phục sinh của đường sắt mà.\\nCòn ký ức về Đại bãi bỏ tuyến, chỉ những ai quan tâm thì xem là được.」"
2402 = "「Đúng là như vậy.」"
2403 = "「Đúng vậy, đây chính là chiếc máy hơi nước quốc sản đầu tiên.\\nCỗ máy chuyên dụng số hiệu đầu tiên đầy vinh quang của dòng 8620, 8620.」"
2404 = "「Không sao. Chỉ cần Fukami đến là tôi đã biết ơn lắm rồi.」"
2415 = "「Ngài Hinai, cựu thị trưởng.\\nCha của cô Paulette là một Tori-tetsu chân chính đấy.」"
2416 = "「Paulette, chữ này đọc là gì vậy ạ?」"
2419 = "「Ông Nagare!」"
2422 = "「Dù thật hèn hạ——nhưng em vẫn không ngừng ước ao——\\nĐược một lần nữa…… quay trở lại những ngày trước hôm đó——」"
2424 = "「Đúng là với thế hệ của Fukami thì là vậy nhỉ.\\nNgay cả thế hệ của tôi, cũng chỉ may mắn được thấy hồi còn nhỏ thôi.」"
2425 = "「Fukami. Bình tĩnh lại.\\nBình tĩnh lại――『Chỉ nghĩ đến chuyện kinh doanh thôi』.」"
2427 = "「Fukami sao?」"
2428 = "「Ch, chỉ vì chuyện của nhà thôi. Chỉ vì chuyện của mẹ thôi.\\nChuyện công việc――để không làm sập, thuyền xuôi dòng Kuma.」"
2431 = "「Vậy mà——em lại khao khát một cách hèn hạ.\\nKhi được chạm vào sự náo nhiệt và những nụ cười…… của rất nhiều người」"
2434 = "「Gian hàng của tiệm rượu ấy!\\nNghe nói Ramune Hơi Nước ngon lắm!」"
2437 = "「Ông nội! Ramune! Mua Ramune đi, bốn chai!!」"
2438 = "「Ông ơi, đừng có trêu ác ý như thế nữa đi.」"
2443 = "「Là men kōji đó, Reina.\\nCủa việc nấu rượu shochu……ừm, là một trong những nguyên liệu. Chắc vậy?」"
2444 = "「Quầy hàng của cửa hàng đường sắt.\\nBây giờ đến đó sẽ thấy cảnh hơi bị thú vị đấy ạ?」"
2449 = "「Em sẽ vẽ hình ảnh chủ đạo, rồi thay đổi các biến thể và bố cục\\nđể tận dụng cho nhãn hiệu, áp phích, tờ rơi.」"
2450 = "「Dù cười rất tươi nhưng trông em ấy có vẻ mệt mỏi rã rời.\\nEm ấy bảo 『Nếu được thì xin hãy để em trông quán một lúc ạ. Vâng』.」"
2451 = "「Tất nhiên rồi ạ.\\nNgài trưởng ga và cô họa sĩ làm thuê mà.」"
2453 = "「Ngoài ra, nếu có áp phích hay tờ rơi,\\nthì ở bến xuất phát cũng sẽ phát. Ạ. Thế thì, lúc đó.」"
2455 = "「Trong số phụ huynh chắc cũng có nhiều thế hệ khác nhau nhỉ.」"
2458 = "「Anh đã nghĩ vậy khi xem bản đồ minh họa do ngân hàng chủ đạo mà Hibiki vẽ.\\nRằng mong muốn tái thiết Ohimitera của chúng ta là giống nhau.」"
2459 = "「Dạo gần đây, mình đã cố gắng quá sức rồi sao.\\nNhững việc phải làm, những việc phải chuẩn bị, nhiều hơn mình nghĩ quá.」"
2461 = "「Mang dáng dấp như cánh tay phải của Kisaki vậy.」"
2463 = "「Tôi đã được xem vài lần rồi mà.\\nNhưng khi đứng giữa đám đông thì quả nhiên, nhìn cũng thấy khác hẳn nhỉ.」"
2465 = "「Thật là ấn tượng.」"
2466 = "「Thật tình, đã bảo ông đừng có trêu nữa mà.」"
2473 = "「Chuyện đó, cũng đúng.」"
2478 = "「Xin lỗi vì đã giữ mày lại nhé, Kon.\\nHibiki, chuyện này để nói sau nhé.」"
2480 = "「Hô hô, hợp lắm đấy chứ.\\nRa dáng một chú chó trưởng ga phết.」"
2482 = "「Dù sao thì, cũng phải thông báo rộng rãi. Nâng cao độ nhận diện. Hơn nữa, quan trọng nhất là\\nphải thu hút càng nhiều người dân tham gia vào việc phục hồi càng tốt.」"
2487 = "「Và, anh tin chắc. Houshou Kisaki chắc chắn.\\nSẽ không nới lỏng tay trong việc thu hút nhà máy, mà vẫn sẽ hợp tác với phương án của chúng ta――」"
2489 = "「Vậy mà——tao thì——tao thì」"
2492 = "「Cô Paulette là một Sharyo-tetsu thuộc phái \\x%l乗り鉄;#00ffc040;người thích đi tàu%l;#; mà.\\nCô ấy hầu như không dùng máy ảnh, có vẻ cứ để nó nằm im lìm như vậy thôi.」"
2495 = "「Nghe thấy? Cái gì cơ.」"
2496 = "「Gì vậy gì vậy, nghe có vẻ tuyệt quá!」"
2497 = "「Có tàu đang chạy à? Đi xem thôi!」"
2507 = "「Shochu Hơi Nước, mới ở giai đoạn thử nghiệm mà đã ngon thế này rồi.\\nChà chà, lò hơi than cũng khá là tốt đấy nhỉ.」"
2510 = "「Được rồi được rồi, Ramune à, bán ở đâu thế?」"
2511 = "「Bị dùng thử và so sánh, là số mệnh của chúng tôi.\\nNếu sau đó mà được chọn, thì đó mới chính là niềm tự hào.」"
2513 = "「Nếu đến chào hỏi một đôi nam nữ trẻ tuổi đang đi cùng nhau.\\nChắc chắn người nam sẽ tỏ thái độ khó chịu với tôi.」"
2516 = "「Về áp phích và tờ rơi, nếu không quá sức,\\nanh rất vui nếu có thể nhờ Hibiki.」"
2521 = "「Thì cứ dùng thử rồi so sánh là được ạ.」"
2522 = "「Vị trí \\x%lブレーキ;#00ffc040;phanh%l;#;, các điểm tăng giảm tốc, v.v. đều phải học bằng cách\\ntận mắt nhìn thấy và ghi nhớ bằng cơ thể, là vì vậy đúng không ạ.」"
2524 = "「Đúng là vậy. Ngay cả tôi, cũng chỉ thực sự cảm nhận được độ lớn và sự tuyệt vời của nó,\\nkhi tận mắt chứng kiến.」"
2525 = "「Cảm ơn mọi người.」"
2526 = "「Cảm ơn ngài…… ngài Soutetsu.」"
2527 = "「Cảm ơn cậu đã chăm sóc con bé Fukami.\\nCó chuyện gì cứ nói, đừng có ngại.」"
2538 = "「Chạy thôi Hachiroku. Để biến mong muốn của cô thành hiện thực.\\nĐể làm được điều đó——cô cũng phải chạy đi. Bằng toàn bộ sức lực.」"
2540 = "「Michiko――」"
2544 = "「Michiko, chuyện đó và chuyện này là――」"
2545 = "「Michiko?」"
2568 = "「Thế này…… thì. Đúng là bị bỏ lại chỏng chơ rồi.」"
2569 = "「Chuyện đó……việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;, tất nhiên,\\nem coi đó là phương tiện để tái thiết kinh tế Ohimitera.」"
2571 = "「Đây là một ý tưởng hay. Tôi nghĩ là hoàn toàn tuyệt vời.\\nTừ thời điểm phục hồi \\x%l8620;#00ffc040;8620%l;#;, nếu làm thế này, có thể coi như một nửa là dự án công cộng――」"
2573 = "「Không phải là đầu máy bình thường đâu nhé? Số hiệu đầu tiên đầy vinh quang,\\nđây chính là Hachirokuniimaru đó!」"
2574 = "「Thế này không được rồi. Nếu cậu định trở thành \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#;,\\nthì nên làm quen với máy ảnh từ sớm đi.」"
2576 = "「Đây cũng là, tiếp khách để quảng cáo đấy.\\nNếu học sinh đến làm khách thì em sẽ làm gì. Bỏ chạy sao?」"
2577 = "「Vậy sao.」"
2578 = "「À, là lái \\x%l気動車;#00ffc040;toa xe tự hành%l;#; sao.\\nThị trưởng, quả thật là rất bận rộn nhỉ.」"
2580 = "「Vậy sao~ ra là vậy~, nếu thế thì, hiểu rồi.\\nHoàn toàn hiểu rồi!」"
2581 = "「Có ổn không? Fukami.\\nNếu em bỏ mặc, Nagi sẽ gặp rắc rối đấy.」"
2582 = "「Làm như vậy, sự gia tăng gánh nặng sẽ được giữ ở mức tối thiểu.\\nEm sẽ chứng minh cho anh thấy em có thể đáp lại kỳ vọng của anh.」"
2583 = "「Đáng tin cậy thật đấy.」"
2584 = "「Chú cáo Kon đó đóng vai chính,\\ncòn con người là em đóng vai phụ sao?」"
2587 = "「Đó là những lời khen ngợi quá lời rồi――\\nNhưng cháu cảm thấy rất vui.」"
2590 = "「Chắc chắn sẽ rất tuyệt nếu trang trí thật nhiều ảnh đấy ạ.\\nẢnh của chú, hay ảnh của các bạn \\x%lまいてつ;#00ffc040;chủ tàu%l;#; của Paulette chẳng hạn.」"
2596 = "「Chuyện đó…… cháu cảm ơn ạ.」"
2597 = "「Mình cũng, à ừm, không rành lắm đâu.\\nVì mình tham gia, ừm, từ lúc lên kế hoạch, triển lãm 8620, nên là.」"
2600 = "「Đó là bộ dạng không phải để ra ngoài của Houshou Kisaki sao.\\nÁnh mắt sắc bén đó——không hề thua kém những người mua hàng đang định giá đâu.」"
2601 = "「Trông cậy vào em đấy, Hibiki.」"
2603 = "「Vậy thì, chúng ta hãy chuẩn bị cả phiếu khảo sát khách tham quan tại địa điểm trưng bày,\\nđể có thể liên lạc với những người cần hướng dẫn nhé.」"
2604 = "「Nếu vậy, tôi sẽ thử bàn với cô ấy một lần xem sao.\\nThực sự cảm ơn thầy vì lời khuyên.」"
2606 = "「Chiếc đầu máy đó. Anh định cho mọi người xem sao?」"
2608 = "「Nếu vậy, quầy hàng của cửa hàng đường sắt ai trông——á!?」"
2610 = "「Thế? Anh hai――ưm,\\nanh trai, tại sao lại gọi mọi người tập trung lại vậy?」"
2612 = "「Chỉ vì tao đã phá hỏng mọi thứ——mà mày, đã luôn\\n——mang tâm trạng thế này——bị bỏ lại chỏng chơ」"
2617 = "「Mặc dù vậy, hiện tại cũng không có điều kiện để phục hồi đầy đủ.\\nDo đó, chúng ta đã quyết định khéo léo che giấu những vết thương để trưng bày.」"
2618 = "「Ngài, Soutetsu……」"
2619 = "「Quả thực là sẽ thành ra như vậy nhỉ. Nếu là ngài Soutetsu.\\nRa là vậy, em hiểu rồi ạ.」"
2620 = "「Ngài Soutetsu!?」"
2623 = "「Những việc cần phục hồi, sẽ được giải thích trên bảng trưng bày.\\nVì có cho những người đang có tâm trạng lễ hội xem vết thương cũng chẳng để làm gì.」"
2626 = "「Nên, em sẽ tuân theo mong muốn của tôi.\\nAnh hiểu đó là tâm nguyện của các em với tư cách là một đồ vật.」"
2627 = "「Cái đó――cái đó!\\nFukami sẽ giải thích cho!」"
2628 = "「Số hiệu đầu tiên! Dù không hiểu ý nghĩa của từ đó,\\nnhưng cảm giác rất là, rất là tuyệt vời!!」"
2632 = "「!」"
2633 = "「!?」"
2820 = "Một giọt——\\nRồi ngay lập tức, tuôn rơi như mưa."
2823 = "Một lúc sau, Paulette ngẩng mặt lên,\\nnhìn tôi bằng đôi mắt lấp lánh――"
2824 = "Một lúc sau, tôi ngẩng đầu lên,\\nlặng lẽ hướng về phía Hachiroku."
2826 = "Không chỉ riêng Hibiki. Cả Paulette, Fukami,\\nthậm chí cả Reina trông có vẻ yếu ớt, cũng là những chuyên gia đích thực."
2828 = "Không xong rồi, tôi hoàn toàn bị áp đảo.\\nSự lấn lướt kiểu như vậy, tôi chưa từng trải nghiệm bao giờ."
2829 = "Không xong rồi, đạp trúng mìn rồi——\\nKhông, có khi là giẫm phải đá chèn trên đường ray cũng nên."
2831 = "Trong lúc tôi không hay biết,\\nHibiki đã có thể hoàn thành công việc của một chuyên gia."
2834 = "Có vẻ xấu hổ, hoặc có lẽ hơi dỗi,\\nánh mắt Hachiroku hướng đi chỗ khác."
2837 = "Dù sở hữu trí tuệ phong phú đến đâu,\\nHachiroku vẫn là một đồ vật——một \\x%lレイルロオド;#00ffc040;Railord%l;#;."
2841 = "Tuy nhiên…… sau khi phát hiện ra \\x%l8620;#00ffc040;8620%l;#;, Hachiroku\\ncó vẻ không còn chú tâm vào vai trò giáo viên cho lắm."
2850 = "Nagi không biết là có nhận ra hay không,\\ntiến lại gần đám học sinh và ưỡn ngực tự hào."
2856 = "Vết thương của vụ tai nạn.\\nNgay cả tôi, cũng liên tưởng đến vụ tai nạn của chúng tôi, và cảm thấy vô cùng tồi tệ."
2869 = "Máy ảnh trên tay."
2871 = "Giọng nói điềm tĩnh.\\nNhưng, có vẻ hơi phấn khích một chút."
2877 = "Nhưng――tôi có thể hiểu rõ.\\nCông khai trước khi phục hồi, nghĩa là phơi bày những vết tích của vụ tai nạn."
2879 = "Nhưng cảm xúc thì――không chỉ riêng tôi,\\nmà cả Hachiroku, cũng có."
2881 = "Nhưng, nhìn Fukami có vẻ mãn nguyện,\\ntôi lại cảm thấy xin lỗi thì cũng hơi kỳ."
2883 = "Không chỉ hai thế hệ mà là ba thế hệ――\\nCó lẽ chúng ta sẽ có thể lôi kéo được cả gia đình."
2885 = "Vẫn giữ vẻ mặt nghiêm trọng, Hibiki khẽ lầm bầm."
2895 = "Dù vậy, Hachiroku vẫn hướng về phía trước."
2896 = "Dù ở khoảng cách xa, chẳng nghe thấy gì cả,\\nnhưng chính vì thế, lại có những thứ nhìn rõ hơn."
2901 = "Có một sự khác biệt rất lớn, nhưng\\nđầu óc đang rối bời, không thể tìm ra từ ngữ thích hợp."
2905 = "Hachiroku, gọi tên \\x%l8620;#00ffc040;8620%l;#;."
2908 = "Bên cạnh tôi, Hachiroku đang im lặng."
2911 = "Ở mức độ có thể hiểu ngay lập tức lý do tại sao,\\nsự giáo dục \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; của Hachiroku cũng đã ngấm vào người tôi."
2914 = "Bình tĩnh, và dứt khoát,\\nHachiroku tiếp nối lời của tôi."
2916 = "Hachiroku càng run rẩy mạnh hơn.\\nNỗi đau đớn dữ dội, sự hối hận tột cùng, truyền đến tận vết thương của tôi."
2918 = "Giữa đám đông mà Hachiroku chỉ tay vào.\\nCó thể nhận ra ngay lập tức, một bầu không khí khác biệt với xung quanh——"
2920 = "Hachiroku yếu ớt thốt ra những lời từ đôi môi."
2921 = "Hachiroku nheo mắt nhìn về phía nhóm Kisaki,\\nrồi lại ngơ ngác nhìn tôi."
2925 = "Những ngón tay của Hachiroku, vuốt ve vết thương của \\x%l8620;#00ffc040;8620%l;#; như để xoa dịu."
2929 = "Tiếng cười khúc khích nhẹ nhàng đã quay trở lại."
2930 = "Giọng Hachiroku rất bình tĩnh.\\nSắc mặt hay dáng vẻ, không có sự thay đổi nào đặc biệt."
2932 = "Hachiroku đang nhìn chằm chằm vào bóng lưng ông ấy.\\nMột tấm lưng thịt dày cộp, tròn xoe."
2934 = "Ánh mắt Hachiroku nhìn tôi\\ntừ \"ngơ ngác\" chuyển sang \"chăm chú\"."
2936 = "Giọng nói vô cùng bình thản,\\nlại một lần nữa khiến tôi thấm thía nhận ra rằng, Hachiroku là một đồ vật."
2937 = "Hachiroku chạy đi. Chạy thẳng một mạch.\\nNhư thể tất cả những gì cô ấy kìm nén, tích tụ nãy giờ đã đồng loạt vỡ tung."
2942 = "Nếu việc công khai, đào xới vết thương của Hachiroku một cách tàn nhẫn,\\nthì điều đó ngược lại, sẽ chỉ làm cho sự phục sinh ngày càng xa vời."
2955 = "Đối với thế hệ của Nagi và Fukami, đó là một thứ mới mẻ chưa từng thấy.\\nĐối với thế hệ của ông lão Minokasa, chắc chắn đó sẽ là một thứ đầy hoài niệm."
2965 = "Nagi há hốc miệng,\\nquay lại nhìn về phía chúng tôi với ánh mắt như cầu cứu."
2967 = "Nagi cũng đang nhìn. Trông rất vui vẻ.\\nThế này thì, Fukami chắc sẽ ổn thôi."
2968 = "Về 8620 thì Nagi vốn dĩ đã không thể giải thích được rồi.\\nBên trong hội trường trưng bày, Hachiroku vẫn luôn giữ im lặng."
2973 = "Khựng lại.\\nCả hành động, lẫn giọng nói."
2982 = "Và rồi một ngày nào đó, dù không thể chạy được nữa,\\ndù có phải bò trườn trên mặt đất một cách thảm hại đi chăng nữa——"
2983 = "Ra là vậy, mọi chuyện đã xâu chuỗi lại rồi.\\nHèn chi Hibiki lại hào hứng bảo 'hơi bị thú vị đấy'."
2984 = "Ra là vậy, cái này sao, là \\x%lタイフォン;#00ffc040;còi hơi%l;#; à."
2986 = "\"Chú\" mà Reina nhắc đến lúc bàn về việc trưng bày ảnh\\nlà cha của Paulette——cựu thị trưởng sao."
3000 = "Nhưng, em ấy không bảo tôi dừng lại.\\nĐiểm này thì, vẫn chẳng khác gì hồi còn nhỏ."
3002 = "Nhưng mà, máy ảnh sao——\\nCòn cả chi phí sửa chữa nữa. Tôi muốn tránh phát sinh thêm chi phí hết mức có thể."
3008 = "Lắc lư theo tiếng tàu chạy, tôi chợt nhận ra.\\nTừ lúc nào, tôi đã ngủ thiếp đi mất rồi."
3011 = "Dòng người ồ ạt kéo đi rầm rập.\\nRồi sau đó, xung quanh lập tức trở nên vắng lặng."
3015 = "Vừa nói, tách.\\nKhông hiểu sao lại chụp trần nhà, rồi đến cột――"
3019 = "Vì ông ấy bị cháy nắng bởi ngọn lửa lò,\\nnên tôi đã không nhận ra khuôn mặt ông ấy đang đỏ lên."
3022 = "Không chỉ giúp hoàn toàn định hướng cho việc phục hồi khu vực \\x%l動輪;#00ffc040;bánh xe chủ động%l;#;,\\nmà ông ấy còn giới thiệu cho chúng tôi biết bao nhiêu người, bao gồm cả những việc liên quan đến Shochu Hơi Nước――"
3025 = "Cho đến khi chạm tới đích——\\nCho đến lúc đó, tất cả chỉ là quá trình mà thôi."
3027 = "Có vẻ như cô ấy còn mù mờ về những tinh tế trong tình yêu\\nhơn cả tôi một bậc."
3028 = "Người không chỉ là chỗ dựa lý luận cho việc ủng hộ thu hút \\x%lエアクラ;#00ffc040;Aircra%l;#; của Hibiki,\\nmà còn là chỗ dựa tinh thần, chính là Houshou Kisaki."
3033 = "Nhờ xác nhận các đặc điểm cơ thể trong quá trình đó,\\nmà đã chắc chắn được rằng \"Bé này là cáo. Tên là Kon\"."
3038 = "Chắc là đi đón Paulette hết rồi.\\nThầy Akai, ông lão Minokasa——ngay cả Hibiki cũng không còn ở lại."
3040 = "Đối tượng quá to lớn so với tưởng tượng,\\ncó lẽ phải đến gần, mới nhận ra được điều đó."
3041 = "Những giọt nước mắt to tướng lã chã rơi xuống sàn vỡ tan."
3046 = "Giọng điệu tươi sáng đầu tiên trong ngày hôm nay.\\nCó vẻ như sự căng thẳng tột độ của cô ấy đã được thả lỏng đôi chút."
3050 = "Hít một hơi thật sâu, xem lại tài liệu,\\nuống một ngụm nước rồi từ từ tiếp lời."
3053 = "Suốt cả ngày hôm nay, cô ấy chưa một lần bước đến gần,\\nthế mà giờ lại lao thẳng về phía thân xe \\x%l8620;#00ffc040;8620%l;#;."
3056 = "Gọi người bạn đồng hành mang cùng tên với mình——\\nKhông, có lẽ là, gọi một nửa sinh mệnh của mình."
3057 = "Vì dáng vẻ khi làm nhiệm vụ của cô ấy quá vui vẻ nên tôi đã vô ý không để tâm,\\nnhưng quả thực, Paulette đang làm việc không ngừng nghỉ."
3059 = "Từ khi còn nhỏ, Hibiki đã cực kỳ mắc chứng sạch sẽ ở một khía cạnh nào đó.\\nNói cách khác, em ấy cực kỳ vụng về trong cách xử thế."
3060 = "Fukami, bước ra khỏi lưng tôi."
3062 = "Ngẩng khuôn mặt đang cúi gầm lên, thật tĩnh lặng, em ấy tiếp lời."
3064 = "Nắm chặt. Nắm đấm siết lại."
3066 = "Fukami nhận ra chúng tôi liền vẫy tay,\\nnhưng rồi lại ngượng ngùng rụt lại ngay."
3069 = "Thậm chí trên thực tế,\\nem ấy còn tự mình ngồi lên chiếc \\x%lエアクラ;#00ffc040;Aircra%l;#; bay của tôi nữa."
3072 = "Cảm thấy lời nói của mình còn thiếu sót,\\ntôi tự ngẫm lại từng chút một trong đầu."
3075 = "Bàn tay nhỏ bé của cô ấy đặt lên.\\nHachiroku nắm chặt lấy bàn tay đang ôm cô ấy của tôi."
3076 = "Giọng nói, run rẩy."
3077 = "Những vết xước, vết móp, vết nứt được che đậy khéo léo,\\ncô ấy tháo găng tay ra, dùng đầu ngón tay nhẹ nhàng vuốt ve hết lần này đến lần khác."
3079 = "Từ vé kỷ niệm đến hàng hóa độc quyền——\\nPhong thái bán hàng của em ấy còn sành sỏi hơn tôi nhiều."
3082 = "Bằng bàn tay nhỏ bé không hề thay đổi từ hồi đó,\\nem ấy vẫn đang, liều mạng cố gắng bảo vệ tôi."
3085 = "Một bước chân run rẩy――\\nNhưng lại là một bước tiến rất, rất lớn."
3087 = "Cứ hết ngó vào gian hàng này đến gian hàng khác bên trong \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#;,\\nvà đang rất phấn khích."
3090 = "Nếu em ấy đã phụ giúp bán hàng từ thời kỳ hoàng kim,\\nthì ra là vậy, quen tay cũng là điều dễ hiểu."
3108 = "Cảm giác tội lỗi vì đã cuốn những người không thể thay thế vào vụ tai nạn.\\nChính vì có nó, nên việc mong muốn điều đó, mới thật đáng sợ."
3110 = "Thực tế, tôi đã học về lò hơi với quyết tâm muốn chết. Tôi đã rất cố gắng.\\n\\x%l8620;#00ffc040;8620%l;#;――Vì tôi muốn hiểu sâu hơn, dù chỉ một chút, về trái tim của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;."
3125 = "Dù có trí tuệ không khác gì con người, nhưng vẫn――\\nKhông, chính vì……có trí tuệ, nên mới càng nổi bật."
3126 = "Dù là trên danh nghĩa, nhưng chúng tôi là anh em.\\nDù hơi muộn màng, nhưng tôi đã hiểu được điều Hibiki mong muốn là gì."
3129 = "Dù có dùng \\x%l非常;#00ffc040;phanh khẩn cấp%l;\\x%lブレーキ;#;#00ffc040;phanh%l;#; để \\x%l制動;#00ffc040;hãm phanh%l;#; tối đa đi nữa,\\ncũng có khi chạy hơn một cây số mới dừng lại được. Do đó."
3133 = "Giả sử tiền trợ cấp có ít đi chăng nữa, nhưng nếu có được danh nghĩa “thành phố tài trợ”,\\nthì độ tin cậy sẽ tăng lên đáng kể, và chắc chắn sẽ dễ dàng kêu gọi người tham gia hơn."
3137 = "Rằng việc phơi bày vết thương của vụ tai nạn, có thể dẫn đến kết quả\\ngợi nhớ lại sự mất lòng tin vào đường sắt thời kỳ cuối của Đại bãi bỏ tuyến."
3140 = "Ngay khi vừa lách qua đám đông,\\nNagi nắm lấy tay ông lão Minokasa và đồng thời, kéo mạnh."
3151 = "Nỗi sợ hãi, trong tôi. Nỗi đau đớn, trong tôi.\\nKý ức về vụ tai nạn của Hachiroku đang vắt kiệt máu tươi từ vết thương cũ của tôi."
3158 = "Âm thanh của đường ray khi \\x%lキハ07;#00ffc040;KiHa 07%l;#; quay về,\\nHachiroku đã nghe thấy từ trước rồi sao."
3161 = "Ước gì mọi vết thương đều chưa từng tồn tại——\\nƯớc gì có thể làm bất cứ giá nào để quay về cuộc sống một ngày trước vụ tai nạn."
3162 = "Trước lời cảm thán vô vị lỡ buột miệng của tôi,\\nHachiroku khẽ bật cười."
3166 = "Không phải em gái mình, mà lại có hành động suồng sã mất rồi."
3167 = "Tôi tóm tắt lại những điểm chính của kế hoạch này bằng lời và truyền đạt lại."
3169 = "Tôi hiểu, hiểu đến mức quá rõ.\\nTôi cũng từng ước như vậy. Rất nhiều, rất nhiều lần."
3173 = "Xoa, xoa, xoa.\\nTôi xoa đầu Hibiki một cách hào sảng như đang gãi."
3174 = "Lý do tôi không có hứng thú với những việc như vậy là……\\nÀ, ra là vậy. Là từ sau vụ tai nạn sao."
3175 = "Bị đối xử hệt như một đứa trẻ.\\nBị làm như thế này, đã mấy năm——mười mấy năm rồi nhỉ."
3177 = "Thế nên, tôi ôm chầm lấy cô ấy từ phía sau.\\nÔm thật chặt——áp sát vết thương của cả hai, để kìm nén nỗi đau."
3179 = "Tôi cúi đầu.\\nMột cách rất tự nhiên."
3180 = "Tôi muốn nói là khác nhau. Tôi muốn phủ nhận.\\nNhưng, tôi không thể giải thích được là khác nhau ở chỗ nào."
3182 = "Nỗi sợ hãi “bị lãng quên”,\\ncó lẽ, tôi đã gieo rắc nó cho Michiko mất rồi."
3184 = "Tự nhủ với lòng mình.\\nMột lần nữa. Bao nhiêu lần cũng được, tự nhủ với chính mình."
3186 = "Khi tôi xoa lên mái đầu ở vị trí khá cao, Fukami giật mình một thoáng,\\nnhưng ngay lập tức nheo mắt lại vẻ thoải mái."
3188 = "Chính điều đó, chính sự do dự đó\\ntôi cảm nhận mạnh mẽ rằng đó là phần vượt lên trên đồ vật, là phần của Hachiroku."
3191 = "Bị thu hút bởi khuôn mặt như đang mong được khen ngợi,\\ntôi bất giác vươn tay ra."
3192 = "Giống như tôi. Giống như tôi của quá khứ.\\nTôi trực giác cảm thấy như vậy."
3195 = "Ít nhất tôi muốn biến ánh mắt bất an của Michiko thành nụ cười――\\nNhưng chưa kịp làm được điều đó, tôi đã, tỉnh giấc."
3197 = "Tôi thực sự cảm nhận được sự sợ hãi của Michiko.\\nNhưng, tôi vẫn truyền đạt sự thật như nó vốn có."
3199 = "Tôi lỡ buột miệng phát ra một âm thanh kỳ quặc.\\nBị một bàn tay to lớn, dày cộp vò rối tung cả đầu."
3201 = "Tôi hơi luống cuống nhìn đồng hồ.\\nHibiki lập tức cười khúc khích."
3203 = "Vừa hỏi xong.\\nHachiroku đưa mắt nhìn quanh với vẻ bối rối."
3205 = "Tôi đặt tay lên bờ vai nhỏ bé của Hachiroku.\\nKhông nói lời nào, chỉ khẽ đặt lên."
3209 = "Vì vậy thay vào đó, giống như Hachiroku thường làm,\\ntôi cất giọng đầy tự tin và đậm chất kịch."
3210 = "Vì vậy, tôi vẫn cứ ôm cô ấy từ phía sau——\\nKhông sao, nếu chỉ là giọng nói. Tôi chắc chắn sẽ giữ cho nó không run rẩy."
3213 = "Dù đã thừa nhận là lý tưởng, nhưng vẫn ngập ngừng với từ “nhưng mà”.\\nRa là vậy. Tôi đã lờ mờ đoán được lý do cho sự do dự của Hibiki."
3216 = "Chụp ảnh.\\nLưu giữ kỷ lục, ký ức, hoặc kỷ niệm thành hình hài."
3219 = "Đột nhiên mặt đỏ bừng, rồi lắc đầu nguầy nguậy."
3220 = "Và rồi ánh mắt Nagi từ từ di chuyển lên trên, lên trên, lên trên nữa."
3239 = "Nếu là Hibiki, người biết được sự thật đó,\\nchắc chắn sẽ hiểu được mà không có sự hiểu lầm nào."
3241 = "Hibiki giật nảy mình ngẩng mặt lên.\\nPhản ứng đó càng làm tôi thêm 확 tín."
3244 = "Hibiki rất thông minh.\\nPhần sau chắc không cần nói em ấy cũng đã hiểu rồi."
3245 = "Vừa bước đi, Hibiki bỗng quay đầu lại."
3247 = "Chắc là do đang phấn khích quá mức hay sao,\\nmà Hibiki cứ lúng túng thay đổi cách gọi tôi liên tục."
3250 = "Mọi sự u ám đã biến mất khỏi đôi mắt từng bối rối.\\nÁnh sáng hoạt bát, đặc trưng của Hibiki đã quay trở lại."
3251 = "Câu trả lời không chút chần chừ của Hibiki."
3252 = "Hibiki nhẹ nhàng ngồi xổm xuống,\\nôm lấy cục bông đang mặc bộ đồng phục trưởng ga."
3254 = "Hibiki nói đùa rồi khẽ cười,\\nđặt Kon xuống sàn."
3256 = "Khuôn mặt có vẻ ngạc nhiên, xen lẫn chút gì đó cô đơn."
3261 = "Không, ra là vậy.\\nCó lẽ đây mới chính là sự cứu rỗi."
3264 = "À, tôi cứ nghĩ hôm nay ông ấy nói nhiều hơn thường lệ,\\nra là ông ấy đã nhâm nhi một ly rồi sao."
3269 = "Tại hội trường đó,\\ntức là bên trong \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#;, một giọng nói lanh lảnh vang lên."
3272 = "À, quả nhiên là vậy.\\nHibiki đã bị vướng mắc và đau khổ ở điểm đó."
3274 = "Quả nhiên niềm yêu thích đường sắt của người này,\\ncũng đã vượt xa một công việc đơn thuần."
3278 = "Chính vì bình thường họ luôn suy nghĩ và tìm tòi cho công việc của mình,\\nnên mới có thể liên tục đưa ra những ý tưởng hữu ích như vậy."
3280 = "Nhờ có thêm sự ngụy trang của Hibiki và ông lão Minokasa,\\ntrong mắt những người nghiệp dư, 8620 giờ chỉ còn là một 『SL tuyệt đẹp』."
3288 = "Dưới sự tập trung ánh nhìn của Paulette, Reina, Hachiroku,\\nHibiki gật đầu. Một cách mơ hồ."
3289 = "Giọng nói sắc sảo của chế độ giám đốc,\\nkhiến tôi dừng tay và chỉnh lại tư thế."
3290 = "Paulette và Reina thì đang ở ngoài,\\ncòn Hibiki thì đang hoàn thành trọn vẹn vai trò của mình."
3291 = "Nói đến đó, cô ấy lại ngậm miệng.\\nSau khi xác nhận lại tài liệu một lần nữa, cô ấy gật đầu cái rụp."
3292 = "Paulette bảo là để chuẩn bị cho chức trưởng ga,\\ncô ấy đã tự tay đo kích thước và dùng máy khâu may bộ đồng phục này."
3294 = "Ông Nagare bế bổng Fukami lên một cách nhẹ nhàng rồi đặt lên vai."
3302 = "Là Fukami. Cùng với đám học sinh lúc nãy.\\nVừa liếc nhìn về phía tôi, vừa đuổi theo bóng lưng của Nagi."
3303 = "Ực, tiếng nuốt nước bọt."
3305 = "Hình ảnh của Fukami ở trường, chắc chắn lúc nào cũng như thế này.\\nNhưng――nếu vậy, đây chính là lúc Fukami phải cố gắng."
3307 = "Đôi tay Fukami thoăn thoắt, dứt khoát di chuyển."
3309 = "Khuôn mặt đỏ bừng và những lời nói đầy nỗ lực của Fukami,\\nlại khiến tôi dễ dàng hiểu ra vấn đề."
3310 = "Fukami là người đầu tiên tỏ ý tán thành,\\ncòn bên cạnh, Hibiki đang nhăn mặt suy nghĩ."
3313 = "Fukami càng lúc càng thu mình lại.\\nGiọng nói cũng gần như, sắp tắt lịm."
3315 = "Cái cúi chào của Fukami, là sự hòa quyện giữa dáng người cao ráo và sự lễ phép,\\nmang một sức hút khá mạnh mẽ."
3316 = "Khoảnh khắc đó, Fukami cứng đờ người."
3319 = "Lưng Fukami nhanh chóng cong lại,\\nvà trốn ra phía sau tôi."
3321 = "Nagi không nghe lời can ngăn đầy xấu hổ của Fukami.\\nĐúng nghĩa đen là, không thèm nghe."
3330 = "Bởi vì để đưa Michiko đến ga cuối,\\ntôi nghĩ việc trưng bày công khai, chắc chắn cũng là một hành động cần thiết."
3334 = "Reina đang dò dẫm từng chữ một,\\ncòn Paulette thì đang đọc tài liệu cẩn thận hơn thế nữa."
3336 = "Tôi lặp lại điều đó một lần nữa."
3337 = "Có thể nói là bán rẻ kiến thức học mót――\\nVới khí thế đó, những thiếu nữ có vẻ là bạn học cũng bị lây nhiễm."
3346 = "Học mót một cách xuất sắc.\\nCòn hùng hồn hơn cả giọng nói tôi vừa cất lên."
3349 = "Những ý tưởng nảy ra từ lời khuyên của chị Mayami tạm thời\\nđược tổng hợp thành tài liệu, Hachiroku lần lượt phát cho mọi người."
3351 = "Sự phấn khích vừa dâng cao của Hachiroku\\nlại xìu xuống trông thấy."
3366 = "Chắc là chán việc phải chờ đợi chúng tôi đứng nói chuyện,\\nKon cứ kéo giật sợi dây dắt."
3371 = "Đầu tiên, một giọng nói vang lên từ nơi không ngờ tới."
3373 = "Cho đến khi cô ấy ngừng run rẩy.\\nCho đến khi những giọt nước mắt rơi cạn."
3380 = "Ngược lại, Hibiki thì như thể đã hiểu ra,\\nlần này em ấy gật đầu mạnh mẽ và dứt khoát."
3381 = "Reina cũng gật đầu trước lời của Hachiroku.\\nVới một phong thái như thể đó là điều hiển nhiên."
3382 = "Vừa hỏi xong, ánh mắt Hachiroku bỗng trở nên dịu dàng."
3384 = "Một ông lão béo tốt, tóc bạc trắng——trông như ông già Noel vậy.\\nĐộ dày này, nhìn một lần là không thể nào quên."
3388 = "Lồng ngực xôn xao.\\nMột lời nói vô ý của tôi, đã khiến Michiko cảm thấy buồn bã."
3391 = "Nếu có thể đưa \\x%l8620;#00ffc040;8620%l;#; đến được Yui,\\nthì có lẽ——Michiko cũng có thể bước xuống từ chuyến \\x%l列車;#00ffc040;tàu%l;#; đó."
3400 = "Ông lão Minokasa mỉm cười hiền hòa,\\nvà đưa mắt nhìn bao quát xung quanh một vòng lớn."
3401 = "Chỉ để lại một cái gật đầu chào nhẹ,\\nbị Nagi kéo đi, ông lão Minokasa biến mất vào sâu bên trong \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#;."
3410 = "Ông lão Minokasa,\\nđang đứng đó, đúng với cụm từ “ông lão hiền hậu”."
3412 = "Giọng nói hơi run rẩy, yếu ớt.\\nTại sao chứ. Michiko có vẻ đang sợ hãi."
3430 = "Nhắc mới nhớ, ở bến thuyền cũng có quầy bán hàng.\\nDù bây giờ thì vắng tanh, ế ẩm đến mức quạ kêu——"
3433 = "Cứ như thể đang định ghi lại tất cả mọi thứ,\\ncung tư tế Akai liên tục chụp ảnh các chi tiết bên trong xưởng đầu máy."
3435 = "Thầy Akai đưa ngón tay tạo thành hình chữ X trước miệng như muốn nói vậy,\\nrồi quay lưng rời đi."
3436 = "Cung tư tế Akai đã thẳng thắn đưa ra ý kiến."
3445 = "Thầy Akai gật đầu vẻ hài lòng.\\nTôi cũng đã rất hiểu tầm quan trọng của việc ghi chép tình hình xung quanh."
3447 = "Nếu không thể vượt qua được chướng ngại này,\\nthì sẽ không thể cứu được Ohimitera——và cả Michiko nữa."
3457 = "Michiko đang dao động.\\nTôi trong mắt Michiko có lẽ cũng đang, dao động."
3460 = "Có lẽ Michiko cũng vậy,\\nthông qua tôi, đã nhìn thấy những vết thương đó sao?"
3472 = "Những lời đã từng truyền đạt một lần.\\nMột lần Fukami cũng đã tiếp nhận."
3473 = "Tôi cũng đã học điều đó. Một lực quán tính cực lớn sẽ tác động lên \\x%l列車;#00ffc040;tàu%l;#;.\\nDù còn tùy thuộc vào trọng lượng \\x%l列車;#00ffc040;tàu%l;#;, tốc độ, tình trạng đường ray, v.v.——"
3475 = "Một dấu hiệu tốt.\\nĐến cả tôi cũng cảm thấy vui lây."
3476 = "Những lời đó thốt ra từ tận đáy lòng."
3477 = "Dù là một bước tiến vô cùng lớn,\\nnhưng suy cho cùng, đây cũng chỉ mới là một bước."
3478 = "Sự vướng mắc đó chắc chắn là biểu hiện của chứng sạch sẽ.\\nNhưng, tôi không công nhận thứ chứng sạch sẽ cản trở sự trưởng thành của Hibiki là một mỹ đức."
3483 = "Thế nhưng, khi vẫn chưa hết run rẩy,\\nHachiroku đã cố vắt kiệt giọng nói."
3484 = "Nếu vậy thì, tốt rồi.\\nMột trong bốn chai đó, chắc chắn Fukami sẽ uống rất ngon lành."
3490 = "Từ dưới chiếc bàn dài,\\nmột khối khổng lồ lù lù nhô lên."
3494 = "Vừa đặt lên xong là ông ấy bước đi huỳnh huỵch,\\ntiến về phía sân ga."
3495 = "Ông lão Minokasa khiêm tốn, nhưng tính đến thời điểm hiện tại,\\nmức độ cống hiến của ông ấy chắc chắn là cực kỳ lớn."
3509 = "Ý tưởng này gọi ý tưởng khác,\\nnhờ đó cuộc thảo luận trở nên sôi nổi."
3517 = "（Không――）"
3520 = "（Bịch）"
3522 = "（Cọc cạch, cọc cạch,\\nxình xịch, xình xịch――）"
3523 = "（Bộp）"
3524 = "（Tách——tách）"
3525 = "（Poooon!!!!）"
3526 = "100 người――không, có lẽ phải đến 200 người."

[selections]
