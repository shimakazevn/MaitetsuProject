2101 = "「Chắc chắn là có ở trong đó rồi. 8620.」"
2253 = "Trên sàn nhà, lù lù—— Một thiếu nữ đang nằm gục ở đó."
2254 = "Từng chữ từng chữ, nhai nuốt."
2258 = "Cửa cuốn lối vào đóng kín thì là lẽ đương nhiên rồi, nhưng tất cả các cửa sổ đều bị đóng ván, chốt gậy và đóng đinh kỹ càng."
2262 = "Không cần tôi phải ra hiệu, Hibiki đang đứng nhìn cũng làm theo tôi."
2267 = "Thành thật mà nói, không hỏi được em lại thấy nhẹ nhõm hơn."
2268 = "Nhưng ẩn ý trong câu nói đó là, em ấy vẫn chưa cảm nhận được sự tồn tại của \\x%l8620;#00ffc040;8620%l;#;."
2270 = "Nhưng điều quan trọng bây giờ không phải là độ chính xác, mà là tập trung vào những gì trước mắt, chỉ vậy thôi."
2278 = "Vụ tai nạn. Của anh hai. Của Hachiroku. Chắc chắn có thể xác nhận ngay được là hai vụ khác nhau, không hề giống nhau."
2285 = "Toa xe gặp tai nạn. Tai nạn đường sắt. Những dòng chữ cứ quay cuồng trong đầu tôi."
2298 = "Nhưng mà——"
2300 = "Nhưng anh trai không hề nhìn. Cả Hachiroku……lẫn em."
2302 = "Nhưng mà, anh hai thì—— Anh hai thì hoàn toàn chẳng thay đổi chút nào."
2304 = "Vậy mà, tại sao chỉ có vết sẹo là, dù bao lâu đi nữa——cũng không thể bị gột rửa và biến mất đi nhỉ?"
2306 = "Nhưng nếu không bỏ cuộc—— thì con đường để tiến bước, lúc nào cũng chỉ có một mà thôi."
2333 = "Toàn thân vẫn đang run rẩy. Nước mắt vẫn tuôn rơi."
2335 = "Cứ để tâm đến mấy chuyện vớ vẩn cũng chẳng ích gì. Quan trọng hơn là Hachiroku bây giờ——hửm?"
2338 = "Hoàn toàn khác với dáng đứng, dáng đi uyển chuyển thường ngày, một bộ dạng vụng về, nhưng Hachiroku vẫn bước đi không ngừng nghỉ."
2340 = "Một cái bắt tay thật chặt."
2343 = "Lảo đảo, chao đảo. Hachiroku bước đi với nguyên tư thế đó."
2345 = "Hachiroku đón nhận điều đó bằng một nụ cười trưởng thành, dịu dàng."
2346 = "Hachiroku dứt khoát đứng lên."
2347 = "Hachiroku khẽ thốt lên."
2348 = "Có lẽ em ấy đã cảm nhận được điều gì đó."
2351 = "Đôi tay Hachiroku vẫn tiếp tục di chuyển."
2354 = "Khuôn mặt ngạc nhiên như thể được tạo ra. Nhưng Hachiroku không hề cười."
2355 = "Hachiroku mềm nhũn, gục vào vòng tay tôi."
2357 = "Tiếng than thở của Hachiroku khiến tôi chuyển dời ánh mắt. Tôi bắt đầu lờ mờ hiểu được ý nghĩa của cảnh tượng đang hiện ra trước mắt."
2360 = "Giọng Hachiroku chợt khựng lại. Cơ thể vẫn không ngừng run rẩy, nước mắt vẫn tuôn rơi."
2361 = "Giọng Hachiroku rất bình tĩnh."
2363 = "Đầu gối Hachiroku đang run rẩy bần bật. Nước mắt vẫn không có dấu hiệu ngừng rơi."
2365 = "Hachiroku biến mất vào trong buồng lái, và lập tức quay lại với một tập hồ sơ, giấy và bút trên tay."
2367 = "Cơ thể của Hachiroku. Nếu nhìn từ chỗ anh trai, chắc chắn sẽ thấy rất đẹp."
2368 = "Hachiroku mỉm cười."
2370 = "Hachiroku đã tự mình bước lên một bước, và chỉ ra con đường mà em ấy nên đi."
2381 = "Dù thế nào đi nữa thì chuyện này cũng không thể chấp nhận được! Tóc tai dính đầy bột đen thế này, lỡ không gội sạch được thì phải làm sao đây~."
2387 = "Sẽ bị tổn thương sâu sắc, rất sâu sắc, ngay cả khi nghe những đánh giá khách quan về vụ tai nạn, hay chỉ đơn thuần là xác nhận sự thật."
2389 = "Nơi đôi tay đang buông thõng vô lực, bàn tay em ấy khẽ nắm chặt lại thành nắm đấm."
2390 = "Hachiroku đang cúi gằm mặt, khẽ lắc đầu thật nhẹ——rồi khó nhọc thốt lên từng lời."
2391 = "Trước khi tôi kịp tìm ổ khóa, Paulette đã chỉ chỗ cho tôi."
2399 = "Sợi xích kéo bên cạnh cửa cuốn có vẻ cũng không bị hư hỏng gì mấy."
2405 = "Nếu chỉ là trêu đùa thì em còn bỏ qua được, chứ anh hai——anh trai và cả Hachiroku, đều cực kỳ cực kỳ nghiêm túc nên mới đáng sợ."
2406 = "Nếu sử dụng tối đa tay và trí óc, thì có thể xua đuổi mọi thứ thừa thãi."
2417 = "Anh trai cũng im lặng đi ra chỗ tắm rửa. Anh ấy không che đậy gì cả nên em có thể nhìn thấy toàn bộ cơ thể anh."
2419 = "Nhìn thấy chúng chồng lên nhau khiến em rùng mình, em rửa mặt để xua đi ý nghĩ đó. ——Vết sẹo. Của anh trai, và của Hachiroku."
2422 = "Nhớ lại cảm giác khi chạm vào nó, một thắc mắc chợt nảy lên trong tôi."
2425 = "Nghe nói là \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#;, nên tôi cứ tưởng nó phải được khóa bằng then cài và ổ khóa nặng nề cơ."
2429 = "Phía sau bé Reina là chị Paulette."
2435 = "May quá, dù đối phương là chị Paulette, phản ứng của anh hai vẫn y như vậy——không đúng……"
2437 = "Ngã hết lần này đến lần khác, rồi lại cố gắng đứng lên—— Cuối cùng, Hachiroku cũng dùng hai tay giữ chặt hai đầu gối, và đứng lên được."
2439 = "Qua khe hở nhỏ xíu khi cửa cuốn vừa được nâng lên, Hachiroku không nói một lời, lách người vào trong rồi chạy vụt đi."
2442 = "Em ấy chỉ tay kiểm tra từng ngóc ngách của \\x%l運転台;#00ffc040;buồng lái%l;#;, rồi cứ thế tự mình bước xuống."
2446 = "Vừa bước từ buồng lái xuống xưởng đầu máy, Reina đã lạch bạch chạy vội đến chỗ Hachiroku và cúi đầu."
2447 = "Cố gắng đứng lên rồi lại ngã, mặt Hachiroku đập mạnh xuống sàn nhà."
2449 = "Lại ngã. Đôi đầu gối run rẩy đó hoàn toàn không thể chống đỡ được cơ thể."
2453 = "Em ấy mở phần ngực áo của \\x%l整備体;#00ffc040;thân chính%l;#; đang nằm gục ra, rút từ đó ra một thứ gì đó giống như một chiếc vòng cổ——"
2455 = "Con bé kìm nén cảm giác muốn chạy đến giúp Hachiroku, và tin tưởng Hachiroku——tin tưởng tôi."
2458 = "Phía sau bức màn nước mắt, thế nhưng, ánh sáng đã trở lại trong đôi mắt Hachiroku."
2460 = "Đón nhận lời cảm ơn chân thành từ tận đáy lòng tôi bằng một nụ cười rạng rỡ."
2463 = "Một tiếng thốt lên đầy vẻ ghen tị."
2464 = "Giọng nói đó đã giải thoát tôi khỏi lời nguyền. Tôi lắc mạnh cái đầu đang hỗn loạn, cố gắng điều hòa nhịp thở đang dồn dập."
2465 = "Nghe câu trả lời của tôi, em ấy nở một nụ cười nhẹ nhõm."
2467 = "Thân hình thon thả, xinh đẹp đến mức ngay cả người cùng giới như em cũng—— Ơ!!!!?"
2469 = "Thoải mái thật. Cả vết bẩn, cả bụi bặm, tất cả đều có thể được gột rửa sạch sẽ."
2471 = "Nếu không tự nhủ với bản thân hết lần này đến lần khác, thì sự \"rạch ròi\" mà tôi tưởng mình đã có sẽ sụp đổ mất."
2475 = "Sự an tâm, và sự thấu hiểu. Cả hai cảm giác đó đồng thời lan tỏa trong tôi."
2476 = "Thiếu nữ vừa trả lời——"
2478 = "Ngay cả những thứ nhỏ nhặt như vậy, chắc hẳn cũng đã bị bỏ mặc, không ai đụng đến."
2482 = "Giọng nói không chút thay đổi của Reina vang lên từ phía bên kia cỗ thân xe khổng lồ. Nhưng Hachiroku lại giật bắn mình, khựng lại."
2486 = "Như thể nếu không làm vậy, thì sẽ không thể nào hiểu được."
2487 = "Như để chứng minh cho điều đó, dù đã đổi cơ thể, sự run rẩy nhẹ vẫn chưa hoàn toàn biến mất."
2488 = "Từ dưới vai phải đến tận khuỷu tay—— Vết thương giống hệt như vết thương trên đầu máy \\x%l8620;#00ffc040;8620%l;#;."
2495 = "Có lẽ, Hachiroku bây giờ——"
2499 = "Tôi đã không nhìn thấy. Tôi đã không nghe thấy."
2502 = "Tôi cũng muốn vào ngay lập tức, nhưng không thể để cửa cuốn lơ lửng giữa chừng thế này được——hử?"
2505 = "Tôi vừa dứt lời, Hachiroku khẽ thở phào nhẹ nhõm sao cho Reina không nghe thấy."
2507 = "Có lẽ do tôi cũng đang căng thẳng, nên những suy nghĩ vớ vẩn cứ xẹt qua trong đầu."
2509 = "Máu vẫn đang túa ra từ vết sẹo của vụ tai nạn, nhưng tôi vẫn dùng những dòng chữ khắc cốt ghi tâm đó ném vào em ấy."
2513 = "Điều mà tôi đã tự hỏi bản thân vô số lần. Tôi ném thẳng điều đó vào cơ thể nhỏ bé của Hachiroku."
2514 = "Tôi lùi lại một khoảng khá xa, giữ khoảng cách với Hachiroku vẫn đang ngồi bệt trên đất."
2517 = "Khi tôi mở cặp ra, Hachiroku nhẹ nhàng trao \\x%l運転体;#00ffc040;kíp lái%l;#; cho tôi. Cho vào trong cặp——à, quả thực là vừa khít luôn."
2519 = "Thử diễn đạt ấn tượng mình cảm nhận được thành lời, nhưng Hachiroku lại lặng lẽ lắc đầu."
2522 = "Ôm em ấy vào lòng, tôi cảm nhận được sự lạnh lẽo. Đến giờ tôi mới chợt nhận ra, Hachiroku thường ngày ấm áp đến nhường nào."
2523 = "Tôi bế Hachiroku, đặt chân lên bậc thang dẫn lên \\x%l運転台;#00ffc040;buồng lái%l;#;."
2527 = "Lấy chìa khóa ra cầm trên tay."
2529 = "Làm theo yêu cầu của Hachiroku, tôi đặt \\x%l運転体;#00ffc040;kíp lái%l;#; xuống sàn nhà, cơ thể nhỏ bé đó lặng lẽ, lặng lẽ tiến lại gần cơ thể đang nằm gục kia."
2533 = "Tôi nắm lấy nó, cẩn thận kéo thử."
2536 = "Hachiroku với vẻ mặt bất mãn định xé bản vẽ, nhưng tôi đã nhanh tay giật lấy."
2538 = "Dù biết thừa là bất lịch sự, nhưng em vẫn cứ quậy, cứ quậy."
2540 = "Tôi ôm chặt lấy em ấy và hét lên."
2541 = "Em từng nghe Hachiroku nói rằng, vào cuối thời kỳ Đại bãi bỏ các tuyến, tai nạn đường sắt cũng xảy ra thường xuyên……"
2542 = "Có tiếng nghiến răng ken két. Hibiki, dù vậy vẫn cố gắng kìm nén."
2544 = "Đương nhiên bản thân tôi cũng đang rất nóng lòng, nhưng chính vì vậy, tôi càng phải từ từ, cẩn thận kéo lên."
2547 = "Được Paulette và Reina dẫn đường, chúng tôi đi qua sân ga Ohimitera, tiến sâu hơn vào bên trong khuôn viên."
2548 = "Nói xong, tôi chờ đợi phản ứng của Hachiroku."
2549 = "Tôi để những lời nói phát ra với Hachiroku, cũng thấm sâu vào tận đáy lòng mình."
2553 = "Nghe tôi hỏi vậy, Reina mỉm cười hiền lành."
2555 = "Tôi không biết giọng mình đang run rẩy, hay đang khản đặc đi nữa."
2556 = "Tôi vẫn luôn biết con bé rất thông minh, nhưng…… không ngờ con bé đã trưởng thành đến mức biết quan tâm chu đáo như vậy."
2558 = "Nên em ấy mới không rơi nước mắt được——"
2570 = "Và thế là Paulette cũng vội vã chui vào bên trong cửa cuốn."
2572 = "Nếu em ấy chà lưng cho mình, thì nhân tiện hỏi han vài chuyện cũng chẳng có gì lạ."
2584 = "Hibiki hắng giọng một cái, rồi ưu nhã gập người xuống."
2586 = "Rõ ràng là đang nhìn thấy, nhưng lại không thể xử lý nổi thông tin. Chắc chắn là một phần nào đó trong não tôi đang từ chối tiếp nhận nó."
2591 = "Bên trong xưởng đầu máy mát lạnh và mờ ảo. Ánh sáng lọt qua những ô cửa sổ bị bịt kín tạo nên một khung cảnh huyền ảo."
2603 = "Cả vùng bụng mỏng đầy cơ bắp, cả lồng ngực, và cả……vết sẹo lớn do tai nạn để lại trên đó nữa."
2612 = "Paulette thì đứng chết trân, cứ nhìn chằm chằm vào đầu máy, còn Hibiki đang cố gắng lay gọi để hai người họ tỉnh lại."
2613 = "Hướng về phía tôi, rồi Hachiroku, Hibiki."
2614 = "Chị Paulette cuống cuồng, mặt đỏ bừng lên."
2615 = "Nhìn tôi, nhìn vào khoảng tối sau cửa cuốn, rồi lại nhìn tôi—— Paulette bồn chồn nhấp nhổm, có vẻ cô ấy đang phải kiềm chế bằng cả cơ thể."
2616 = "Bởi vì Paulette cũng hiểu tình trạng hiện tại của Hachiroku—— và ngầm cho thấy cô ấy sẽ chờ đợi mà không hối thúc."
2617 = "Chữ \"nếu có\" đó khiến tôi thấy an tâm."
2622 = "Không thể cử động. Không thể nói nên lời. Chỉ có đôi mắt là không ngừng đảo quanh, cố gắng thu thập thông tin."
2632 = "Rồi lập cập—— Toàn thân em ấy bắt đầu run rẩy bần bật đến mức phát ra thành tiếng."
2633 = "Sau đó, Hachiroku quỳ hai gối xuống với tư thế cầu nguyện, và lôi ra một chiếc đĩa tròn lớn từ dưới lớp áo."
2634 = "Rồi Hachiroku đặt giấy lên tập hồ sơ, vẽ một đường thẳng tuyệt đẹp bằng tay không chỉ trong một nét."
2635 = "Rồi một bóng dáng lờ mờ hiện ra. Một cỗ \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; khổng lồ, tỏa ra thứ ánh sáng đen mờ đục, lạnh lẽo."
2637 = "Rồi Hibiki sải bước dài, rời khỏi xưởng đầu máy mà không ngoái lại nhìn."
2638 = "Sau đó Reina buông tay ra, vỗ tay cái bốp, vẻ mặt tươi rói."
2640 = "Lúc này dường như mới nhận ra, Reina thốt lên \"Hawaa\" với một chất giọng có phần kéo dài."
2643 = "Reina lạch bạch lạch bạch bước tới. Lạch bạch lạch bạch, bước đi mà không hề tỏ ra căng thẳng hay sợ hãi."
2646 = "Vừa đi một vòng quanh thân xe, Reina vừa lần lượt báo cáo lại cho tôi."
2647 = "Dù Reina chẳng nói gì, nhưng chỉ cần có người đứng nhìn, thật kỳ lạ là tôi lại không hề thấy nhàm chán."
2648 = "Có đông người thế này thì không hỏi được."
2662 = "Nhìn cô bé, tôi cũng bình tĩnh lại được đôi chút. Nó giúp tôi nhớ ra rằng cuộc sống thường ngày và xưởng đầu máy này vẫn đang tiếp diễn."
2663 = "Trông cứ như anh hai ngày xưa vậy, làm em cũng có cảm giác bị kéo theo, em ghét điều đó."
2664 = "Tôi lẩm bẩm như vậy, để nói với Hachiroku, với Hibiki, với Paulette, với Reina. Và với chính bản thân mình."
2672 = "Lần đầu tiên tôi bước vào \\x%l運転台;#00ffc040;buồng lái%l;#; của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; \\x%l8620;#00ffc040;8620%l;#;."
2677 = "Cuối cùng cửa cuốn cũng được kéo lên đủ để một người chui qua."
2678 = "Nghe em ấy nói vậy, tôi mới nhận ra những nét vẽ có hơi run rẩy một chút."
2686 = "Mọi người đều gật đầu đồng tình với lời của Hibiki. Chỉ riêng Hachiroku là không nhúc nhích."
2687 = "Lời nói của Hibiki khiến tôi kinh ngạc trong lòng."
2692 = "So với độ nặng trịch của \\x%l乗務鞄;#00ffc040;túi phi hành đoàn%l;#;, thì \\x%l運転体;#00ffc040;kíp lái%l;#; lại quá đỗi nhẹ nhàng."
2700 = "Mùi máu tanh. Tiếng kim loại cọt kẹt, tiếng đứt gãy đinh ốc. Tôi có thể cảm nhận rõ mồn một những thứ đó từ tận sâu thẳm trong mình."
2703 = "Sẽ tốn bao nhiêu tiền, sẽ cần bao nhiêu công sức. Nếu muốn tìm cớ để bỏ cuộc thì có vô số."
2715 = "Nói đoạn, Hibiki cũng chui tọt qua cửa cuốn."
2716 = "Nói rồi, cô bé thở dài một hơi rõ to."
2723 = "Bánh xe——không, Hachiroku gọi nó là bánh xe chủ động thì phải. Nó đã bị uốn cong một cách dị dạng."
2730 = "Cảm giác chốt khóa nhẹ nhàng khớp vào khớp. Cửa cuốn đã được cuộn lên hoàn toàn."
2740 = "Quả thực, đó là việc chỉ có đồ vật mới làm được, nhưng mà……"
2741 = "Chắc hẳn là loại cửa cuốn thượng hạng."
2742 = "Nguyên nhân chung của việc Hachiroku bị mất trí nhớ, việc nhóm Hachiroku được ông Taito mua lại, và rồi bị bỏ xó……chính là nó."
2743 = "Thế này là được rồi. Nếu đặt ra một khoảng thời gian eo hẹp, tôi sẽ chỉ có thể tập trung vào những việc trước mắt."
2744 = "Thế này thì làm sao mà quay bình thường được nữa. Kéo một vật không thể quay, thì đó gọi là \"kéo lê\"."
2745 = "Mặc dù cánh cửa cuốn này to hơn của xưởng rượu rất nhiều, nhưng cấu trúc cơ bản có vẻ không khác biệt mấy."
2749 = "Trải qua ngần ấy thời gian, chắc sự kích động của Hachiroku cũng sẽ lắng xuống phần nào."
2751 = "Vậy nên, tôi chỉ còn cách xác nhận lại."
2753 = "Nếu vậy, với tư cách là người sở hữu, tôi cũng sẽ giúp đỡ Hachiroku hết mức có thể để em ấy đạt được ước nguyện."
2755 = "Bằng một giọng nói mà tôi chưa từng nghe thấy bao giờ, như thể mọi lòng tự tôn đều đã bị mài mòn đến mức kiệt quệ."
2757 = "Vậy thì, Hachiroku, người trong cuộc, sẽ còn đau khổ và bối rối đến nhường nào."
2770 = "Cả anh hai và Hachiroku, dù có ngâm mình trong nước nóng thì mặt mũi vẫn đen thui thùi lùi mà."
2772 = "Anh hai cứ thế quay mặt đi, và tiếp tục tắm rửa."
2775 = "Khẽ cúi đầu chào, Paulette dẫn Reina rời khỏi xưởng đầu máy."
2776 = "Tầm nhìn mở rộng, tôi thấy Reina với khuôn mặt bối rối, và Paulette đang nép sát bên cạnh cô bé."
2777 = "Dù nghe nói đã bị bỏ hoang nhiều năm, nhưng ổ khóa lại xoay rất trơn tru, dễ dàng giải phóng phong ấn."
2778 = "Dù không phải là câu trả lời trực tiếp cho câu hỏi của tôi, nhưng đó cũng có thể coi là một câu trả lời."
2779 = "Dù \"trông có vẻ\" không bị hư hỏng, nhưng biết đâu những chỗ khuất tầm nhìn đã bị xuống cấp rồi."
2782 = "Rút linh hồn ra, rồi đưa vào một cơ thể khác."
2786 = "Lái tàu, bảo trì. Tùy theo từng hành động mà thay thế toàn bộ bộ não vào một cơ thể phù hợp."
2790 = "Bên cạnh bánh xe khổng lồ của cỗ đầu máy đen kịt, lạnh lẽo, Hachiroku đang ngồi bệt xuống đó."
2792 = "Làm bằng da thật màu đen. Nặng trịch."
2802 = "（……Ngay cả với một người không liên quan đến vụ tai nạn của Hachiroku như tôi—— những dấu vết tai nạn chân thực này cũng khiến tôi buồn nôn mà.）"
2803 = "（……Nếu chìa khóa này mà không đúng, thì chắc ngượng chết mất.）"
2815 = "（Kéééét）"
2819 = "（A……）"
2820 = "（Lạch cạch）"
2821 = "（Cạch）"
2823 = "（Ừm. Đúng rồi. Như vậy là được.）"
2824 = "（Ào!）"
2826 = "（Nếu muốn chạy trốn, thì phải chạy thẳng về phía trước. Nếu không, sẽ bị sự sâu hoắm của vết thương nuốt chửng mất.）"
2828 = "（Chẳng có gì tốt đẹp cả, thật sự đấy, tuyệt đối không. Em đã được học ở trường rồi. ——Tình dục chính là sự sống.）"
2830 = "（Quả nhiên là vậy.）"
2836 = "（Đó là cái gọi là \\x%lタブレット;#00ffc040;thẻ bảng%l;#; sao? Hachiroku có nói là đổi, nhưng mà……）"

