[script]
78 = "\\x%lエアクラ;#00ffc040;Aircra%l;#;——tên chính thức là Động cơ Aero-Craftech. Là phát minh \"thay đổi thế giới\" của công ty Aero-Craftech."
992 = "…………………………………………………………………… ……………………………………………………………………"
996 = "…………Tại sao, lại buồn ngủ thế này—— Rõ ràng, lúc nãy mình……vẫn còn đang……ngủ, cơ, mà…………"
1000 = "……Không, được rồi. Những gì mình nghe thấy, chẳng, hiểu gì cả."
1004 = "……Chảy máu, từ……đầu, của mình. Vậy thì, cứ thế này——nhưng mà……………………"
1009 = "……Trò chuyện với đồ vật. Hay có lẽ, chỉ là độc thoại."
1012 = "……Tiếng nói, tôi nghe thấy tiếng ai đó. ……Cảm nhận được……bàn tay……ai đó, đang……lay tôi."
1023 = "「Đã rõ \\x%l制動;#00ffc040;hãm phanh%l;#;. Với tốc độ này thì \\x%l非常;#00ffc040;phanh khẩn cấp%l;#; là không thể——rồi.」"
1027 = "「\\x%l粘着力;#00ffc040;Lực bám đường%l;#; đang sụt giảm nghiêm trọng. Kiến nghị phun cát dồn toa.」"
1029 = "「『Xin ngài hãy bảo trọng, đi đường bình an』」"
1032 = "「『Ngài đã vất vả rồi』 và 『Chúc ngài đi đường bình an』. Câu chào nào mới là phù hợp?」"
1033 = "「…………」"
1041 = "「……Hơn nữa sẽ bị \\x%l滑走;#00ffc040;trượt bánh%l;#; mất. Đến giới hạn rồi. Lực hãm phanh không đủ.」"
1045 = "「……Đã bao nhiêu năm rồi nhỉ.」"
1047 = "「……Hết cách rồi. Tôi không muốn làm chậm trễ việc \\x%l接続;#00ffc040;kết nối chuyển tàu%l;#; ở Shizuoka đâu.」"
1150 = "「Không được đâu! Như thế thì thằng bé không trụ nổi mất.」"
1151 = "「Sẽ không để thằng bé chết đâu! Tuyệt đối không để chết đâu!!」"
1152 = "「Không được! Đừng động vào thằng bé! Đầu đang chảy máu kìa.」"
1155 = "「Cứ cho bay không người lái. Dù có rơi thì cũng chẳng ai chết. Cứ bỏ mặc thì đứa bé này sẽ chết. Còn thời gian để mà do dự sao?」"
1157 = "「Tuy nhiên, xin ngài từ nay về sau đừng ra lệnh xuyên qua mây mưa nữa. Navi luôn đưa ra quyết định với ưu tiên hàng đầu là mạng sống của ngài Soutetsu.」"
1160 = "「Không, lật rồi! \\x%l脱線転覆;#00ffc040;Trật bánh lật tàu%l;#;!! Nhưng thế này vẫn còn tốt chán so với bị diệt vong toàn bộ!!」"
1163 = "「Không, lỡ làm phiền công việc của họ thì——ồ?」"
1166 = "「Hành khách, không biết đã ngồi vững hết chưa.」"
1168 = "「Cũng được, trước khi hạ cánh xuống nước thì nhìn từ trên cao một chút vậy.」"
1170 = "「Tôi hiểu rồi. Sắp tới điểm đến là xưởng rượu Migita System. Ngài có muốn bay qua không phận một lần không?」"
1173 = "「Hôm nay là bộ đôi \\x%l車掌;#00ffc040;trưởng tàu%l;#; Seki và \\x%l車販;#00ffc040;nhân viên bán hàng%l;#; Mayuzumi mà nhỉ? Họ đang làm đấy. Chắc chắn họ sẽ hoàn thành tốt công việc của mình.」"
1176 = "「Có vẻ là người sau, ngài Soutetsu.」"
1181 = "「Các cô quả thực là những vật phẩm tiện lợi. Nếu không có Navi và \\x%lエアクラ;#00ffc040;Aircra%l;#;, chỉ di chuyển thôi cũng là cả một vấn đề lớn.」"
1184 = "「Cô cố tình đúng không? Chắc là tôi lại gặp ác mộng rồi.」"
1185 = "「Làm thôi. Đánh cược cả đời vào lần này!」"
1189 = "「Cầm máu đi! Phải cứu thằng bé! Nhanh lên!」"
1194 = "「Sáu năm bốn tháng.」"
1195 = "「Đã sáu năm bốn tháng rồi, ngài Soutetsu.」"
1196 = "「Chi tiết về việc đó thì tôi không rõ.」"
1204 = "「Bình tĩnh lại và báo cáo đi!」"
1207 = "「Có chuyện gì vậy? Báo cáo đi.」"
1208 = "「Ở chi nhánh có \\x%lエアクラ;#00ffc040;Aircra%l;#;——loại bay được, có máy thử nghiệm đúng không. Yêu cầu điều động nó đi.」"
1213 = "「Đã đến không phận điểm đến.」"
1217 = "「Ngoài việc, dừng lại——. Nếu vậy thì, làm ngược lại!」"
1219 = "「Toàn bộ mười lăm toa!? Báo cáo chi tiết đi!」"
1223 = "「Hạ cánh xuống nước. Ngài Soutetsu——」"
1224 = "「Ra là vậy. Vì thế nên Ohimitera mới suy thoái, và câu chuyện thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; mới được đưa ra bàn tán sao?」"
1234 = "「Chà chà. Tôi đã đánh thức ngài sao. Xin lỗi ngài.」"
1236 = "「Ngài đùa rồi, làm gì có chuyện cố tình. Navi chỉ là đồ vật. Là vật phẩm. Hoàn toàn không có chủ đích làm bất cứ điều gì.」"
1238 = "「Ối chà.」"
1239 = "「Hừm.」"
1240 = "「A——ra là vậy, đúng thật.」"
1242 = "「À.」"
1244 = "「Aaa thật tình! Đúng lúc này lại còn có gió tạt ngang nữa.」"
1246 = "「A! Đúng rồi, ngược lại——chỉ còn cách này thôi.」"
1247 = "「っ! ——Xin hãy dùng \\x%l制動;#00ffc040;hãm phanh%l;#; tối đa. Tôi sẽ hỗ trợ để không bị \\x%l滑走;#00ffc040;trượt bánh%l;#;.」"
1252 = "「Ừm. Xin lỗi. Tôi vừa chợp mắt một chút.」"
1254 = "「Ừm. Nhờ cô.」"
1256 = "「Ừm, vậy sao. Nếu cô đã nói vậy thì chắc là thế rồi.」"
1258 = "「Vì tôi là vật phẩm mà.」"
1260 = "「Việc đưa ra quyết định trong sự mâu thuẫn đòi hỏi năng lực tính toán lớn, và khối lượng công việc đó sẽ đe dọa đến sự an toàn của ngài Soutetsu…… Ngài Soutetsu?」"
1262 = "「Ở đây! Không bị rơi! Không bị rơi xuống sông!」"
1266 = "「Đúng là kỳ tích. Dừng lại được rồi sao.」"
1268 = "「Hiểu rồi! Tôi sẽ yêu cầu với ưu tiên hàng đầu là mạng sống của đứa bé này. Này nhóc, cố lên. Cho đến khi máy thử nghiệm tới thì không được chết đâu đấy.」"
1271 = "「Fujikawa!? Không thể nào! Gần quá rồi!!」"
1275 = "「Còn 120 giây nữa sẽ hạ cánh xuống nước. Sau khi hạ cánh, chuyển sang chế độ \\x%l駐機;#00ffc040;đỗ tàu bay%l;#; có được không?」"
1278 = "「Đã rõ mệnh lệnh. Xin báo cáo những thay đổi của thành phố Ohimitera trong cùng khoảng thời gian.」"
1280 = "「Đã rõ mệnh lệnh. Vậy thì, ngài Soutetsu.」"
1282 = "「Đã rõ mệnh lệnh. Đang tìm kiếm địa điểm hạ cánh.」"
1285 = "「Đã rõ mệnh lệnh. Sau khi hạ cánh, sẽ chuyển sang chế độ \\x%l駐機;#00ffc040;đỗ tàu bay%l;#;.」"
1288 = "「Đã rõ mệnh lệnh. Navi, theo tiêu chuẩn của ngài Soutetsu, là thiết bị điều khiển cao cấp nhất.」"
1289 = "「Đã rõ mệnh lệnh.」"
1292 = "「Thông tin tiếp theo——Hãy gửi thông tin tiếp theo ngay lập tức! Không được phép im lặng! Nhanh lên, mau gửi thông tin tiếp theo đi!」"
1299 = "「Sao thế, Navi?」"
1300 = "「Chuyển đi bằng cách nào!? Xe cứu hộ gần nhất cũng ở tận Kozu đấy! Đi bộ về căn cứ \\x%l保線;#00ffc040;bảo trì đường ray%l;#; còn nhanh hơn!」"
1308 = "「Bởi vì tôi không muốn đối đầu với một hệ thống dẫn đường xuất sắc như cô đâu.」"
1309 = "「Có người! Người sống sót! Vẫn còn thở nhưng——bị thương nặng lắm.」"
1317 = "「Chắc rắc xuống cái là bị cuốn trôi đi ngay thôi. Nhưng mà, có làm còn hơn không——っ」"
1323 = "「Vậy thì, hãy tự mình xác nhận xem sao. Navi, hạ cánh xuống nước tại địa điểm tối ưu đi.」"
1326 = "「Hibiki à. Vẫn y như xưa nhỉ. Tôi còn tưởng con bé đã trưởng thành hơn chút rồi chứ.」"
1329 = "「Vâng. Là con gái của ngài ấy. Tuy nhiên, có nhiều đánh giá cho rằng năng lực hành chính không được di truyền.」"
1332 = "「Vâng, chính xác là vậy. Navi chỉ đơn thuần là thiết bị điều khiển thôi.」"
1335 = "「Báo cáo sự cố tình trạng chưa xác định. \\x%l発報;#00ffc040;Phát tín hiệu báo động%l;#; từ \\x%lレイルロオド;#00ffc040;Railord%l;#; 9642. \\x%l帝鉄貨物;#00ffc040;Vận tải hàng hóa Đường sắt Hoàng gia%l;#;. \\x%l編成;#00ffc040;Đoàn tàu%l;#; mười lăm toa. Có khả năng toàn bộ toa xe đã bị tổn thất.」"
1337 = "「Chuyến tàu này đã không còn cách dừng lại. Dù có dùng lực \\x%l制動;#00ffc040;hãm phanh%l;#; tối đa đi chăng nữa…… thì 75 giây sau, cũng không thể dừng hẳn lại mà——」"
1344 = "「Không giận thì tốt rồi.」"
1350 = "「Địch hay bạn, đều tùy thuộc vào mệnh lệnh của ngài Soutetsu. Navi suy cho cùng chỉ là vật phẩm thôi.」"
1352 = "「Thế mà ngài Soutetsu lại nói, không muốn thu hút nhà máy sản xuất những vật phẩm tiện lợi đó về Ohimitera.」"
1359 = "「Không thể không mong muốn họ xây dựng nó ở nơi khác ngoài Ohimitera. Bởi vì nơi này, là quê hương thứ hai của tôi.」"
1361 = "「Đen đủi thật đấy. Không ngờ lại hứng trọn cơn bão thế này.」"
1363 = "「Đúng là chẳng đáng yêu chút nào.」"
1371 = "「Xác nhận \\x%l砂撒き;#00ffc040;phun cát%l;#;. ……Không thấy \\x%l粘着力;#00ffc040;lực bám đường%l;#; tăng lên. Có nguy cơ trật bánh. Đề xuất giảm tốc độ.」"
1375 = "「Tôi sẽ lập tức kết nối \\x%l共感;#00ffc040;cộng cảm%l;#; với \\x%lレイルロオド;#00ffc040;Railord%l;#; phía trước để thông báo việc chậm trễ ——っ!? Gì cơ!? Hả? Xin hãy nhắc lại!?」"
1382 = "「Tiếp tục \\x%l制動;#00ffc040;hãm phanh%l;#;. ——Thêm chút nữa——áp suất, thêm một chút nữa thôi——っ!!!」"
1390 = "「Sự thay đổi lớn nhất về mặt hành chính, chính là thị trưởng. Thị trưởng hiện tại do Hinai Paulette đảm nhiệm.」"
1391 = "「Dư luận đánh giá là vô năng, là người tiền nhiệm? Hay người hiện tại?」"
1394 = "「Làm gì có chuyện đó. Navi chỉ là vật phẩm thôi.」"
1397 = "「Nói cũng phải. Chúng ta cũng phải, làm tốt công việc của chúng ta.」"
1398 = "「Báo cáo đi. Hết cách gì? Báo cáo chậm một giây thôi là nguy hiểm sẽ tiến gần thêm bao nhiêu mét, cô biết rõ mà.」"
1401 = "「Cho bay đi, cho loại bay được cất cánh đi. Mạng sống của đứa bé này là ưu tiên hàng đầu, dù thế nào cũng phải cho cất cánh!」"
1403 = "「Mi……chi……」"
1404 = "「Trên tàu vẫn còn hành khách, không thể cũng phải dừng lại!! Tiếp tục giảm tốc! Cô làm chủ đạo đi!!」"
1421 = "「Thế này thì……hết cách rồi.」"
1422 = "「Đúng là ích kỷ thật. Nhưng một khi đã chứng kiến khung cảnh này thì——」"
1423 = "「Ư……ừm——Đây là——\\x%l客車;#00ffc040;toa hành khách%l;#; dẫn đầu, tình trạng tồi tệ quá—— Này, mau tìm đi. Tìm xem có người sống sót không rồi cứu hộ.」"
1425 = "「Đính chính lại đi. Cô——Navi, không phải \"đơn thuần\", mà là thiết bị điều khiển cao cấp nhất.」"
1426 = "「Không cần cô nói tôi cũng biết.」"
1427 = "「Thế này mà cũng bị \\x%lロック;#00ffc040;bó bánh%l;#; á? \\x%l粘着力;#00ffc040;Lực bám đường%l;#; rốt cuộc đã giảm đến mức nào rồi.」"
1429 = "「Là khoảng thời gian đủ để một điều gì đó thay đổi——không. Có lẽ là quá dài để mọi thứ vẫn giữ nguyên như cũ.」"
1430 = "「Đã rõ tiếp tục giảm tốc. \\x%l圧;#00ffc040;Áp suất%l;#; hãm phanh, tăng cường——っ!」"
1432 = "「Vẫn còn là một đứa trẻ mà! Này, nhóc!」"
1433 = "「Có thể thấy rõ sự thay đổi. Đây là hành động mà trước kia Hibiki không hề có.」"
1434 = "「Vậy cậu bảo phải làm sao!!」"
1437 = "「Cái máy thử nghiệm đó á! Không, nhưng mà——mưa to gió lớn thế này cơ mà!?」"
1438 = "「Thế thì cách khác! Tìm cách khác ngoài việc dừng tàu đi! Cách gì cũng được! Mục tiêu là tránh rơi xuống sông!!!」"
1440 = "「Tất nhiên rồi! Nhưng mà——, phải đưa đến bệnh viện càng sớm càng tốt.」"
1443 = "「A Di Đà Phật!!!」"
1445 = "「Tùy cô chọn. Câu nào cũng chẳng khác biệt mấy đâu.」"
1447 = "「Mệnh lệnh 『Đang vội, nên dù có phải gắng sức』 của ngài Soutetsu, và việc ưu tiên mạng sống của ngài Soutetsu lên hàng đầu, có sự mâu thuẫn với nhau.」"
1448 = "「Ngài Soutetsu. Chúng ta đã an toàn vượt qua mây mưa rồi.」"
1450 = "「Hinai à, là của thị trưởng tiền nhiệm sao?」"
1452 = "「Ngài có muốn hạ độ cao xuống không?」"
1457 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#; 9642 truyền đạt qua \\x%l共感;#00ffc040;cộng cảm%l;#; lúc hấp hối rằng 『Cầu sắt sập』. ……Nội dung là cầu sắt Fujikawa đã sập.」"
1461 = "「Navi. Cô cũng là đồng loại của \\x%lエアクラ;#00ffc040;Aircra%l;#; mà nhỉ. Có thấy phật ý không?」"
1514 = "Nhưng——nghe có vẻ hơi tức giận, không biết có phải do tôi tưởng tượng không."
1516 = "Tất cả các phương tiện sử dụng động cơ \\x%lエアクラ;#00ffc040;Aircra%l;#;, cũng giống như động cơ, đều được gọi chung là \"\\x%lエアクラ;#00ffc040;Aircra%l;#;\"."
1521 = "Dù là vậy, trái tim đang dần trở nên chai sạn, u ám và chìm nghỉm của tôi cũng được vực dậy đôi chút."
1533 = "Loại động cơ siêu hiệu suất sử dụng địa từ và ánh sáng mặt trời đó, gần như đã loại bỏ hoàn toàn động cơ nhiên liệu hóa thạch."
1535 = "Tinh hoa công nghệ từ mười mấy năm trước, đến nay vẫn không hề có lấy một vết rỉ sét."
1550 = "Khi về đến nhà thì là 『Ngài đã vất vả rồi』. Khi đến đích thì là 『Chúc ngài đi đường bình an』."
1551 = "Nên ánh mắt tôi lập tức bắt lấy——dải sáng lấp lánh chảy dưới tầm mắt. Con sông Kuma, biểu tượng của Ohimitera, phản chiếu rực rỡ ánh mặt trời."
1554 = "Phương tiện di chuyển trên mặt đất, trên mặt nước, hay trên bầu trời——"
1560 = "Nhảy cẫng lên liên tục, rồi vút một cái, lao thẳng vào trong nhà xưởng."
1562 = "Cũng giống như lúc xảy ra tai nạn năm đó, tôi lại được Navi cứu vớt."
1584 = "Cùng lắm là cứ thế đuổi theo bóng máy bay…… Còn nếu tâm trạng không tốt, có khi con bé còn làm ngơ luôn ấy chứ."
1589 = "Đặc điểm lớn nhất của nó là \"vận hành \\x%l共感;#00ffc040;cộng cảm%l;#;\", đã biến khái niệm tắc nghẽn giao thông trở thành dĩ vãng."
1592 = "Nhìn từ trên cao, quang cảnh thành phố Ohimitera có vẻ như chẳng hề thay đổi so với lúc tôi rời đi."
1593 = "Không thể nào nhìn nhầm được. Mái ngói cũ kỹ, những chiếc bồn chứa xếp hàng dài trong sân."
1597 = "Chiếc \\x%lエアクラ;#00ffc040;Aircra%l;#; từng là \"máy thử nghiệm\", lặng lẽ hạ độ cao."
1601 = "Ngay lập tức điều chỉnh lại tư thế máy bay, nhưng không thay đổi đường bay."
1606 = "Im lặng. Một sự im lặng kéo dài đến khó tin đối với Navi."
1610 = "Nhưng——bên trong nó đang dần thay đổi. Đến mức buộc tôi phải trở về."
1614 = "So với những hệ thống Navi thông thường ngoài kia, của tôi cứ có cảm giác sặc mùi con người thế nào ấy."
1616 = "Có vẻ như \"mệnh lệnh\" của tôi, đã được dự đoán từ trước rồi."
1621 = "Xác nhận sự thật. Đội lốt dưới lớp vỏ bọc đó, nghe chẳng khác gì một lời chất vấn."
1623 = "Hiểu được ý tôi, Navi nghiêng thân máy bay."
1628 = "Và lúc này, Ohimitera—— thành phố trải dài dưới tầm mắt kia, cũng đã từng cứu rỗi tôi."
1632 = "Nếu là Hibiki của trước kia, chắc chắn sẽ không bao giờ có chuyện \"lao vào xưởng để báo cáo\"."
1634 = "Nếu dùng từ nhà đẻ, thì đây chính là nhà nuôi của tôi ——hình dáng của xưởng rượu Migita System."
1637 = "Vật phẩm mang tên Navi. \\x%lエアクラ;#00ffc040;Aircra%l;#; Navi. Trí tuệ nhân tạo phát triển nhanh chóng cùng với \\x%lエアクラ;#00ffc040;Aircra%l;#;, và đã trở nên phổ biến trong đại chúng."
1641 = "Giọng điệu không hề thay đổi."
1646 = "Đó là câu chào mặc định của Navi."
1647 = "Vậy ra, mình……vẫn còn sống…… Chỉ có mình……còn, một nửa của mình——"
1648 = "Tít dưới tầm mắt, có một bóng người bé như hạt đậu, thế nhưng lại đang chuyển động rất mạnh."
1652 = "Như thế thì, Michi—— Michiko, đứa em gái đã đẩy mình ra sẽ——"
1659 = "Hạ cánh xuống nước, đi bộ qua \\x%l翼端;#00ffc040;đầu cánh%l;#; của Navi rồi bước lên bờ—— là Ohimitera."
1662 = "Nước sông Kuma ngày càng gần. Từ trên cao nhìn xuống màu xanh dương, giờ lại hiện ra màu xanh lục đậm."
1668 = "（Tu! Tuuu! Tu! Tuúúúúúúúúúúú!）"
1671 = "（Tỉnh giấc từ cơn mơ…… Liệu hiện thực, cũng là sự tiếp nối của giấc mơ chăng）"
1674 = "Những lời lẩm bẩm có lẽ quá đỗi đa cảm của tôi—— đã bị Navi \"cố tình\" hiểu sai và đáp lại."
1677 = "Và rồi, hạ cánh xuống nước. Tiếng nước bắn lên có lẽ đã bị dòng chảy của con sông nhấn chìm."

[selections]
