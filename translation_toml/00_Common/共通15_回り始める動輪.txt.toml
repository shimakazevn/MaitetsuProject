2055 = "「Anh sẽ cố gắng, hãy dõi theo anh nhé.\\nNhất định——anh sẽ làm cho nó chạy lại.」"
2057 = "「Hướng đi cơ bản của tôi cũng giống với Hibiki,\\nnhưng tôi nghĩ có lẽ một cách tiếp cận khác sẽ tốt hơn.」"
2060 = "「Nếu là ngài Soutetsu, chỉ cần nửa năm, ngài sẽ có thể vận hành đầu máy xe lửa\\nmà không cần \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; giống như Lái tàu Kiyomi.」"
2063 = "「Anh biết rồi. Phải từ từ, từng chút một, và trải đều ra.」"
2064 = "「Em nghĩ anh nên tìm hiểu thêm về Ohimitera.\\nNếu anh thực sự muốn phục hưng Ohimitera.」"
2066 = "「Nè? Sou-chan.\\nVết thương. Của cái đầu máy xe lửa đó.」"
2069 = "「Anh chỉ vừa tỉnh mộng và nhận ra thôi.\\nChúng ta vẫn chưa hề rời khỏi sân ga xuất phát.」"
2071 = "「Vì vậy, chúng ta phải thử nghiệm cẩn thận. Từng chút, từng chút một.\\nChậm rãi, từ từ, không được vội vã.」"
2073 = "「Tất cả các vị trí cần tra dầu! \\nĐã tra dầu và hoàn tất kiểm tra chéo rồi ạ~」"
2076 = "「Hãy chia sẻ ngọn lửa, sức nóng và hơi nước của \\x%l8620;#00ffc040;8620%l;#; vừa mới hồi sinh này.\\nĐể đánh thức——những người đồng đội đang say giấc của em.」"
2078 = "「Xin lỗi em. Anh lỡ quên mất.\\nTại kỹ năng \\x%l投炭;#00ffc040;xúc than%l;#; của Nagi tiến bộ quá nhanh, làm anh mờ cả mắt.」"
2082 = "「Tôi nghĩ là sẽ ổn vì sổ tay hướng dẫn rất rõ ràng……\\nNhưng vì hoàn toàn chưa có kinh nghiệm, nên tôi có chút bất an.」"
2086 = "「\\x%lウェス;#00ffc040;Vải lau máy%l;#; đã lau dầu sẽ được dùng khi nhóm lửa.\\nĐừng vứt nhầm nhé.」"
2091 = "「Rồi sao? Anh hai, anh gọi em có chuyện gì nè?」"
2103 = "「V-vậy sao?」\\n「Ngài Soutetsu……」"
2110 = "「Đúng vậy.」"
2112 = "「Đúng vậy đó! Vất vả rồi nha!!」"
2113 = "「Vậy sao. Nếu thế thì!」"
2114 = "「Ra vậy. Đúng vậy.」"
2115 = "「Hô. Vậy thì, đúng như mong muốn của chúng,\\nhãy biến chúng thành những con chim sẻ đen kịt nào!」"
2116 = "「Vậy sao.」"
2117 = "「Vậy sao, thế thì giúp anh nhiều lắm.」"
2118 = "「Hibiki à.」"
2119 = "「Đúng vậy. Anh đã sửa nó.」"
2121 = "「Đúng vậy. Mọi người đang chuẩn bị sẵn sàng.\\nĐể chúng ta có thể hoàn thành tốt buổi chạy thử nghiệm này.」"
2123 = "「Vâng.\\nVâng! Ngài Soutetsu.」"
2126 = "「Đúng vậy, anh Soutetsu.\\n\\x%lトレインマーク;#00ffc040;Biểu trưng tàu%l;#; gắn ở đầu \\x%l列車;#00ffc040;tàu%l;#; được gọi là \\x%lヘッドマーク;#00ffc040;biểu trưng đầu tàu%l;#;.」"
2128 = "「Kể cả sau khi kỳ nghỉ hè kết thúc á? Vậy thì không được đâu nha.\\nSau giờ học em còn có công việc chèo thuyền xuôi dòng nữa nè.」"
2130 = "「Cách tiếp cận khác?」"
2132 = "「Nếu có quy định gì đó thì có thể chị đã làm sai,\\nvà vì chị vẽ bằng sơn dầu trên tấm nhựa dẻo nên thú thật chị cũng không rõ độ bền của nó đâu.」"
2133 = "「Đúng vậy.」"
2136 = "「Phục vụ người hâm mộ cũng là một công việc quan trọng của \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; đấy ạ?\\nNgài Soutetsu.」"
2138 = "「Củi đây!」"
2148 = "「Ví dụ như, tôi muốn anh Soutetsu trở thành thư ký chính sách,\\nvà tập trung nỗ lực chấn hưng du lịch ở cấp độ chính quyền thành phố.」"
2155 = "「Áp suất xi lanh tốt. Mở \\x%lバイパス弁;#00ffc040;van bypass%l;#; và \\x%lドレンコック;#00ffc040;van xả nước ngưng%l;#;.」"
2157 = "「Tất nhiên rồi ạ, chị Hibiki.」"
2158 = "「Được chưa? Tốt rồi tốt rồi.\\nSoutetsu! Ông Hata nói là xong rồi đó!」"
2161 = "「Những lúc nước sông dâng cao không thể chèo thuyền được,\\ntất nhiên em sẽ đến giúp anh nha!」"
2165 = "「Dầu máy, \\x%l走行部;#00ffc040;bộ phận chuyển động%l;#; kiểm tra tốt.\\n\\x%l溶栓;#00ffc040;Nút chảy an toàn%l;#; bình thường. Mực nước lò hơi tốt.」"
2170 = "「Nước, sẽ đọng lại đấy ạ.」"
2171 = "「Vậy thì, việc giám sát bơm nước xin nhờ Thị trưởng Paulette ạ.\\nCứ làm theo hướng dẫn, chị làm được chứ ạ?」"
2173 = "「Tiến vào ga suối nước nóng Ohimitera. Sân ga số 1. Chuẩn bị dừng lại.」"
2182 = "「Để phòng hờ trường hợp có sự cố bất thường xảy ra.」"
2183 = "「Để giảm bớt gánh nặng cho đứa trẻ này dù chỉ một chút——\\nMọi người đã chia sẻ cho chúng ta nhiều đến vậy.」"
2184 = "「Xin ngài hãy châm lửa. Cho 8620.」"
2190 = "「Vẫn còn quá sớm để khóc nhỉ.」"
2191 = "「Vẫn còn quá sớm để cảm ơn đấy.」"
2192 = "「Hiện tại, vẫn chưa có khí nạp hay khí xả đâu ạ.」"
2196 = "「Về mặt lý thuyết thì chắc chắn nó sẽ chạy được——\\nNhưng điều này thì, nếu không thực sự chạy thử thì không thể biết được.」"
2198 = "「Tất nhiên rồi.\\nPhía tôi cũng đã chuẩn bị mọi thứ chu toàn theo như lời em nói.」"
2203 = "「Mọi người đều đang đặt rất nhiều kỳ vọng\\nvào \\x%l8620;#00ffc040;8620%l;#; nhỉ.」"
2205 = "「Navi cũng đang chúc mừng chúng ta đấy nhỉ.」"
2210 = "「Kỳ ghê. Sou-chan tự nhiên nói lớn tiếng quá.」"
2212 = "「Thật sự rất biết ơn ạ.\\nĐược mọi người giúp đỡ đến mức này——thật sự là quá đỗi ưu ái.」"
2216 = "「Rõ rồi ạ~, chị Hachiroku~」"
2222 = "「Quả thực, ý kiến của cả hai người\\nđều có những cái lý riêng.」"
2225 = "「Ông Hata, lò hơi chuẩn bị thế nào rồi ạ?」"
2230 = "「Kon, bị sao vậy? Có chuyện gì mà ồn ào thế——\\nOa!?」"
2231 = "「Vâng, thưa ngài Soutetsu.」"
2233 = "「\\x%l加減弁;#00ffc040;Van tiết lưu hơi%l;#;, từ từ mở ra, điều chỉnh \\x%l逆転機;#00ffc040;cần đảo chiều%l;#; cho phù hợp.」"
2238 = "「Được chứ.」"
2239 = "「Nhất định, nó sẽ chạy lại được một lần nữa.」"
2266 = "「Dầu bị tràn ra phải dùng \\x%lウェス;#00ffc040;vải lau máy%l;#; lau cẩn thận đó nha~」"
2272 = "「Cảm ơn ông.」"
2273 = "「Cảm ơn chị Mayami.\\nNhờ có chị, bây giờ chúng ta có thể bắt đầu bơm nước. Hachiroku?」"
2274 = "「Cảm ơn ngài, ngài Soutetsu.」"
2275 = "「Cảm ơn ông, ông Minokasa.\\nXin ông tiếp tục kiểm tra các bộ phận khác ạ.」"
2286 = "「Michiko! Em ở đâu!」"
2287 = "「Michiko! Michiko!!」"
2288 = "「Mọi người vất vả rồi!」"
2305 = "「Chắc cũng có phần vì điều đó, và cũng vì tinh thần trách nhiệm nữa.」"
2306 = "「Một ý kiến cực đoan, nhưng cũng có lý.」"
2307 = "「Đây là, Ohimitera——\\nLà thị trấn và những con người mà ngài Soutetsu đang cố gắng bảo vệ đúng không ạ.」"
2308 = "「Đây là Ohimitera, thị trấn đã nuôi dưỡng anh khôn lớn.\\nNói là bảo vệ thì có vẻ hơi kiêu ngạo nhưng——」"
2309 = "「Đây là——」"
2310 = "「Điều đó có nghĩa là xưởng đầu máy cũng đã sống lại rồi.」"
2312 = "「Cho đến cuộc chạy thử nghiệm lần này, tôi nghĩ đã có rất nhiều nhân vật chủ chốt của Ohimitera\\ntin tưởng anh Soutetsu, và cả những mối quan hệ đó nữa.」"
2313 = "「Thổi gió!」"
2316 = "「Vẫn chưa. Phải đợi tra dầu và bơm nước xong đã.」"
2317 = "「Còn lâu lắm á!? Tại sao vậy!」"
2318 = "「Vẫn chưa đâu ạ, ngài Soutetsu——chưa đâu, chưa đâu——một chút nữa thôi.」"
2323 = "「À này! Nếu vậy thì tôi cũng có một mong muốn,\\nhay đúng hơn là một ý kiến——」"
2324 = "「Dạ, anh ha——ưm, anh trai?\\n\\x%l機関助士;#00ffc040;Phụ lái tàu%l;#; là công việc mà anh vẫn luôn luyện tập——」"
2326 = "「Vậy thì làm thôi! Nhanh làm thôi!!」"
2328 = "「Nếu vậy thì, nhé?\\nCố lên nha, Sou-chan.」"
2331 = "「Cụ thể thì anh nên làm gì?」"
2332 = "「Vậy thì, em. Em sẽ thử luyện tập, nếu thấy làm được,\\nem sẽ trở thành \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; của anh ha——ưm——anh trai.」"
2336 = "「Vậy thì tốt quá. Thật sự cảm ơn em.」"
2338 = "「Nếu vậy thì Hachiroku.\\nTiếp theo, hãy để chúng ta trở thành người chia sẻ.」"
2339 = "「Chuyện xưởng rượu, chuyện vẽ biển hiệu của em và mọi thứ khác,\\nđều là những công việc gắn liền với người dân Ohimitera đúng không? Vì vậy——」"
2344 = "「Anh hai——anh trai, để em chà lưng cho anh nhé?」"
2346 = "「Anh hai! Dù có quấn khăn tắm đi nữa,\\nanh cũng không được nhìn chằm chằm con gái người ta như thế!」"
2347 = "「Tuy vất vả, nhưng chúng ta sẽ phục hồi từng thứ một như vậy.\\nNếu điều đó thành hiện thực——」"
2348 = "「Dù vẫn còn đang dang dở——」"
2349 = "「Anh Soutetsu, trông mặt anh vẫn còn vẻ mệt mỏi lắm.\\nAnh nên ngâm mình trong bồn tắm từ từ thêm một lúc nữa đi.」"
2350 = "「Ngài Soutetsu.」"
2351 = "「Ngài Soutetsu! Ngài Soutetsu!\\nGắn lên đi ạ! Xin ngài hãy gắn nó lên!」"
2352 = "「Ngài Soutetsu, ngài vất vả rồi ạ.」"
2353 = "「Ngài Soutetsu. Ngài có thể nắm tay gạt mềm mại hơn một chút cũng không sao đâu ạ.」"
2354 = "「Ngài Soutetsu. \\x%l加減弁;#00ffc040;Van tiết lưu hơi%l;#;.\\nThật chậm rãi, chậm rãi đến mức tối đa.」"
2356 = "「Ngài, Soutetsu?」"
2360 = "「Tuyết!!?——\\nA, không phải ạ, là hoa giấy.」"
2365 = "「Sắp được rồi nhỉ.」"
2366 = "「Sắp rồi, Nagi.\\nSắp rồi, “từ bây giờ” sẽ bắt đầu.」"
2370 = "「Lũ chim sẻ đặc biệt thích sức nóng của hơi nước.\\nNhững con chim sẻ ở một xưởng đầu máy còn hoạt động sẽ bị nhuộm đen kịt bởi bụi than.」"
2371 = "「Chim sẻ?」"
2372 = "「Đánh lửa tốt!」"
2373 = "「Đánh lửa tốt!」"
2374 = "「Chuẩn bị đánh lửa tốt!」"
2375 = "「Chuẩn bị đánh lửa tốt!」"
2376 = "「Đánh lửa tốt!」"
2377 = "「!」"
2378 = "「Gừ gừ gừ gừ gừ」"
2381 = "「20 giây một xẻng, rõ rồi!」"
2582 = "Vậy thì, mọi thứ đã sẵn sàng.\\nNhìn sang Hachiroku, em ấy khẽ gật đầu."
2584 = "Không úp xẻng, không ném vào,\\ntôi rải than từng chút một lên \\x%l火床;#00ffc040;buồng lửa%l;#; như thể đang rót xuống."
2589 = "Không được, trong chốc lát, tôi đã lơ đễnh."
2590 = "Ái chà, không xong rồi, đúng thế."
2594 = "Khoan đã!? Nếu đưa vị trí \\x%lブレーキ;#00ffc040;phanh%l;#; về chạy tàu——\\nTức là, nếu để ở trạng thái không tác dụng \\x%l圧;#00ffc040;áp lực%l;#; \\x%lブレーキ;#00ffc040;phanh%l;#; thì!"
2597 = "Từ lúc nào, ngay phía sau tôi,\\nPaulette và Reina đang đứng đó."
2599 = "Là Paulette, hay là Hibiki đây."
2601 = "Cho dù nghĩ rằng đã phục hồi hoàn hảo,\\nnhưng khi thực sự vận hành thì không biết chuyện gì sẽ xảy ra."
2603 = "Ngay lập tức, Hachiroku chạy đến nơi phát ra tiếng nói\\nvà tiến hành kiểm tra."
2605 = "Không, có lẽ là, cả hai người họ——tất cả mọi người,\\nđã cùng nhau chuẩn bị."
2611 = "Con bé bảo 『Em sẽ giúp những gì em có thể làm』,\\nrồi nhốt mình trong phòng, lục đục làm gì đó——"
2613 = "Hoặc có lẽ, đôi mắt của Hachiroku như một tấm gương,\\nchỉ đang phản chiếu lại sự bất an của chính tôi mà thôi."
2619 = "Cạch, \\x%lタブレット;#00ffc040;thẻ bảng%l;#; được hoán đổi.\\nChớp chớp, đôi mắt của Hachiroku \\x%l運転体;#00ffc040;thân chính%l;#; mở ra."
2626 = "Hachiroku ngoài miệng thì nói là \\x%l蒸気排水;#00ffc040;xả nước ngưng hơi nước%l;#;, nhưng lại có thể khóc một cách thành thật,\\nhôm nay, tôi cảm thấy có chút ghen tị với em ấy."
2640 = "Họ không đến để chúc mừng, mà là để thị sát.\\nDáng vẻ đậm chất công sở của họ đang nói lên điều đó."
2641 = "——Sức mạnh và tâm tư của tất cả những con người đó.\\nChắc chắn đều được gửi gắm một cách bình đẳng vào trong cơ thể của chiếc \\x%l8620;#00ffc040;8620%l;#; mới sinh này."
2644 = "Từ những người thợ thủ công tình nguyện, đứng đầu là ông lão Minokasa.\\nTừ vô số những tình nguyện viên là người dân trong thành phố."
2645 = "Đừng nói đến việc kết nối với chấn hưng du lịch,\\nngay lúc này, chúng tôi thậm chí còn chưa chở được một vị khách du lịch nào."
2648 = "Thế nhưng, nếu không thể bước đi bước chân nhỏ bé này——\\nChúng tôi sẽ chẳng thể tiến thêm được bước nào nữa từ đây."
2650 = "Khi nới lỏng bàn tay đang nắm chặt tay gạt,\\ntôi bắt đầu để ý đến cả những điều vớ vẩn."
2651 = "Nhưng nếu vậy thì, tôi muốn được\\ntận hưởng việc tắm rửa một cách yên tĩnh và thư thái thêm một chút nữa."
2653 = "Không phải là tôi sửa,\\nmà là có thể sửa được, và được người khác sửa cho——được giúp đỡ."
2656 = "Có lẽ chọn những từ ngữ như vậy sẽ thể hiện chính xác hơn\\ntâm trạng của cá nhân tôi. Nhưng——"
2670 = "Mặc dù vậy, Hachiroku lại chỉ định sử dụng \\x%lブレーキ;#00ffc040;phanh%l;#; tự động\\ntác động lên toàn bộ đoàn tàu là vì……"
2672 = "Dù không hoàn toàn tiếp thu từng ý kiến một,\\nnhưng việc dùng chúng làm tài liệu tham khảo cho phương hướng sắp tới sẽ rất hữu ích."
2673 = "Cùng có chung mục đích là chấn hưng du lịch, tái thiết Ohimitera,\\nnhưng phương tiện lại khác nhau 180 độ."
2674 = "Thật đáng xấu hổ, nhưng đối với những phần còn thiếu, chúng tôi không còn cách nào khác\\nngoài việc dựa vào “thiện chí và nỗ lực cá nhân” của mỗi người."
2681 = "Có lẽ vì quá xúc động,\\nHachiroku vùi mặt vào ngực tôi, đôi vai run rẩy."
2682 = "Hachiroku bước lại gần Hibiki."
2683 = "Lấy từ trong túi ra một chiếc khăn tay nhỏ,\\nHachiroku nhẹ nhàng lau khóe mắt."
2686 = "Không báo trước, Hachiroku bắt đầu \\x%l喚呼;#00ffc040;chỉ tay hô xác nhận%l;#;."
2689 = "Hachiroku gật đầu thật mạnh."
2692 = "Nhận được ánh mắt khẩn cầu,\\ntôi bế Hachiroku lên để em ấy nhìn ra ngoài qua cửa sổ buồng lái."
2693 = "Một giọng nói vui vẻ.\\nCùng cái chào nghiêm trang với sống lưng thẳng tắp."
2695 = "Điều Hachiroku đang nói là, hãy đột phá ở một điểm và giương cao ngọn cờ\\nở một nơi thật cao, nơi mà ai cũng có thể nhìn thấy."
2697 = "Đôi mắt của Hachiroku đang ngấn lệ."
2699 = "Một nụ cười điềm tĩnh.\\nCùng một giọng nói rộn ràng không thể giấu giếm."
2701 = "Lời của Hachiroku không phải là một lời nhờ vả.\\nChỉ đơn giản là đang trình bày một sự thật mà em ấy tin tưởng."
2702 = "Khuôn mặt rạng rỡ hẳn lên.\\nHachiroku nở một nụ cười rạng rỡ đến mức tít cả mắt."
2705 = "Nụ cười hướng thẳng về phía tôi.\\nNhưng tận sâu trong đôi mắt ấy, tôi nhìn thấy nét bất an."
2706 = "Có vẻ như em ấy đã tắm rửa xong cho Reina."
2708 = "Khi kết thúc việc xác nhận cùng Hachiroku,\\nem ấy nhìn tôi một thoáng, rồi quay lại nhìn về hướng di chuyển qua cửa sổ phía trước."
2710 = "Thay vì nói với Nagi,\\nnghe có vẻ như Hachiroku đang tự nhủ với chính mình hơn."
2736 = "Ngay lập tức, Nagi cầm chiếc xẻng xúc than trên tay làm động tác như đang ném vào."
2738 = "Nhoài người ra khỏi cửa sổ buồng lái,\\nNagi ngước nhìn lên bầu trời rộng lớn."
2741 = "Giọng nói tràn đầy quyết tâm của Nagi."
2743 = "Nagi đi trước tiên.\\nTiếp theo, tôi ôm Hachiroku bước lên buồng lái."
2744 = "Nagi mở tung cánh cửa bật lên.\\nSắc đỏ và sức nóng ngay lập tức nhuộm kín bên trong buồng lái."
2747 = "Đó là những kỹ năng được tích lũy của riêng Hibiki và Paulette.\\nTôi không nghĩ nó dễ dàng đến mức tôi có thể học được ngay lập tức."
2754 = "Tôi có cảm giác như ánh mắt chúng tôi vừa chạm nhau——không, đúng là vậy.\\nHoushou Kisaki cười nhếch mép, khẩu hình miệng mở thật to."
2770 = "Cứ như thế, không vội vã, từng chút một,\\nnếu chúng ta có thể chữa lành những vết thương vô hình——"
2771 = "Và khi \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;#; cũng được đóng lại, hơi nước đẩy bánh xe chủ động sẽ không còn nữa,\\n\\x%l8620;#00ffc040;8620%l;#; sẽ rơi vào trạng thái \\x%l絶気運転;#00ffc040;chạy cắt hơi%l;#;——chỉ chạy bằng lực quán tính."
2774 = "Có tiếng xình, xịch, xình, xịch."
2777 = "Bên phải và bên trái."
2783 = "Và đồng thời,\\nđể khởi hành từ đây——tiến xa hơn nữa."
2792 = "Xình, xịch, xình, xịch——\\nTiếng \\x%lブラスト;#00ffc040;khí thải xi lanh%l;#; chính là thước đo để nhận biết chuyển động quay của \\x%l動輪;#00ffc040;bánh xe chủ động%l;#;."
2794 = "Không——đây mới thực sự là điểm mù sao?\\nVề thể hình, Hibiki cũng đủ nhỏ nhắn——"
2797 = "A. Đúng vậy.\\nCả tôi và Michiko, nếu điều đó thành hiện thực."
2798 = "Hửm? À."
2800 = "Cho đến khi nước trong lò hơi của \\x%l8620;#00ffc040;8620%l;#; sôi lên, và hơi nước lan tỏa đến mọi bộ phận."
2803 = "Từ lối vào \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#;,\\nHibiki ngược sáng bước lại gần chỗ chúng tôi."
2810 = "Việc siết lại sẽ làm giảm thất thoát,\\nchuyển hướng lực của hơi nước từ mô-men xoắn sang gia tốc."
2822 = "Một tấm bảng lớn được trang trí bằng ruy băng,\\nđược giương lên bởi rất nhiều cánh tay——cùng những nụ cười của mọi người."
2823 = "Ngây thơ, hòa thuận.\\nThật tốt."
2826 = "Hachiroku bước vào bồn tắm với vẻ mặt đầy tự hào,\\nvà đồng thời ngồi lên đùi tôi."
2829 = "Bởi vì hai em ấy đang chui lọt thỏm trong không gian gọi là \\x%lピット;#00ffc040;hố kiểm tra%l;#;,\\nvà đang tra dầu vào các bộ phận của \\x%l8620;#00ffc040;8620%l;#; từ ngay bên dưới."
2832 = "Hachiroku quay lại nhìn tôi,\\nánh mắt nhìn thẳng, thật thẳng vào tôi."
2834 = "Trên tay cô ấy là cuốn sổ tay bảo dưỡng do chính Hachiroku làm.\\nCó vẻ như cô ấy đã đọc nó cho đến tận phút chót."
2836 = "Bước chân của em ấy, vượt qua cả sự nhẹ nhàng, cứ như đang bay vậy."
2838 = "Có vẻ như việc chà lưng qua lại\\nthân thiết với Fukami đã xong."
2840 = "Cho em ấy mượn bờ ngực và vuốt ve mái tóc,\\ntôi chợt ngước mắt lên và——nhìn thấy."
2841 = "Đã một thời gian rồi, tôi không gặp giấc mơ này."
2845 = "Để kéo dài cự ly chạy thử nghiệm và tiến tới vận hành thương mại,\\nsự hỗ trợ của \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; là tuyệt đối cần thiết."
2850 = "Các học sinh, những người lớn tuổi, và cả người dân trong thị trấn cũng tham gia tình nguyện,\\nmỗi người một tay giải quyết vô số những công việc lặt vặt."
2858 = "Chuyển \\x%l逆転機;#00ffc040;cần đảo chiều%l;#; về \\x%lミッドギア;#00ffc040;tầm trung%l;#;, không tiến cũng không lùi,\\nnói cách khác là về trạng thái số 0."
2860 = "Mà khoan, đúng rồi.\\nPaulette đang ở đây, điều đó có nghĩa là——"
2864 = "Cứ như thể tôi đã làm vậy ngay từ đầu……\\nTôi cũng ngồi xuống đối diện con bé."
2867 = "\\x%l汽笛;#00ffc040;Còi hơi nước%l;#; vang rền!\\nNgay khi van \\x%lブロワー;#00ffc040;thiết bị thổi gió%l;#; được mở, âm thanh cất lên thật cao!!"
2870 = "Đúng lúc này.\\nKhi tôi đưa tay ra, Nagi cũng im lặng đưa cho tôi chiếc xẻng xúc than."
2874 = "Chậm rãi đến mức ấy——\\n\\x%l8620;#00ffc040;8620%l;#; đang dần được kéo ra khỏi sự tĩnh lặng kéo dài."
2876 = "Ngay cả Nagi vốn luôn háo hức muốn làm mọi thứ, cũng không hề hé môi hay động tay,\\nchỉ nín thở, lặng lẽ dõi theo chúng tôi."
2884 = "Đối với quỹ quyên góp tự phát từ buổi triển lãm, dù là với tư cách cá nhân,\\nnhưng Kisaki, anh Uragami, và cả ông Mototada cũng đã giúp đỡ."
2888 = "Một vài doanh nghiệp đường sắt có mối liên hệ với Paulette,\\nđã cử nhân viên bảo dưỡng đến dưới hình thức thực tập."
2895 = "Từ \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#; đến sân ga Ohimitera.\\nToàn bộ hành trình chưa đến 1 km, chuyến đi đầu tiên của \\x%l8620;#00ffc040;8620%l;#; mới sinh."
2896 = "Từ xi lanh đến piston, và rồi từ từ, truyền đến \\x%l動輪;#00ffc040;bánh xe chủ động%l;#;——\\nHơi nước bắt đầu truyền lực."
2898 = "Khoảnh khắc này——từ đây trở đi, mới là phần chính!"
2903 = "Xung quanh Ohimitera——dọc theo tuyến Yui và trên một khu vực rộng lớn của lưu vực sông Kuma,\\nchúng tôi đã nhận được vô số sự ủng hộ, động viên và giúp đỡ."
2910 = "Bằng cách sử dụng thiết bị thổi gió và cấp than hợp lý,\\nchu trình hút khí - đốt cháy - xả khí có thể được vận hành trơn tru."
2913 = "Sự ấm áp dịu dàng của Reina, dường như đang từng chút một\\nlàm tan chảy những điều cứng nhắc bên trong Hachiroku."
2916 = "Tôi hạ quyết tâm và bước ra khỏi bồn tắm."
2919 = "Đúng như Hachiroku đã chỉ dạy, cứ mỗi vòng quay,\\ntôi lại tăng lực kéo đòn bẩy \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;#;, và siết tay gạt đảo chiều lại."
2923 = "Chúng tôi, mới chỉ làm cho \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; quay được mà thôi.\\nĐó quả thực, quả thực là một điều vĩ đại nhưng——"
2927 = "Tôi không vội vã di chuyển tay gạt, đưa nó về \\x%l常用;#00ffc040;phanh thường%l;#;——\\nĐặt nó vào vị trí mà \\x%l圧;#00ffc040;áp lực%l;#; \\x%lブレーキ;#00ffc040;phanh%l;#; được tác động một cách nhẹ nhàng."
2931 = "Cơ thể tôi phản xạ lại tiếng \\x%l喚呼;#00ffc040;hô xác nhận%l;#; đúng như những gì đã được huấn luyện."
2934 = "Van hãm tự động và van hãm đơn,\\ntôi đã nhả cả hai."
2938 = "Tôi mở rộng chiếc cặp \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#;,\\nlấy Hachiroku \\x%l運転体;#00ffc040;thân chính%l;#; từ bên trong ra."
2942 = "Tôi kéo \\x%l汽笛;#00ffc040;còi hơi nước%l;#;.\\nGửi gắm vào đó tất cả lòng biết ơn chân thành nhất đến những người dân Ohimitera trên sân ga."
2945 = "Miếng \\x%lウェス;#00ffc040;vải lau máy%l;#; tôi nhận lấy nặng trĩu."
2949 = "Khi tôi hướng ánh mắt định cất tiếng gọi,\\nHachiroku nhanh nhẹn chỉ tay vào tay tôi."
2950 = "Tôi không thể trả lời.\\nMục tiêu dừng đang ngày càng tiến lại gần."
2953 = "Toàn thân tôi ướt đẫm mồ hôi dính dớp.\\nNhưng tôi thậm chí không hiểu tại sao mình lại đổ nhiều mồ hôi đến vậy."
2954 = "Tất nhiên, tôi cũng hiểu Nagi là nhân tài cần thiết cho việc chèo thuyền xuôi dòng.\\nTôi hoàn toàn không có ý định cướp người. Tốt nhất là nên rút lui một cách dứt khoát ở đây."
2955 = "Tôi tin chắc rằng mình sẽ có một buổi sáng thức dậy thật sảng khoái.\\nCho dù khi thức dậy, tôi có quên mất giấc mơ này đi chăng nữa."
2958 = "Rời mắt hẳn khỏi Nagi, tôi nhìn thấy Hachiroku và Reina,\\nđược truyền cảm hứng từ Nagi và Fukami, cũng đang thân thiết chà lưng cho nhau."
2959 = "Những suy nghĩ tự nhiên hóa thành lời nói.\\nNhững suy nghĩ đã thành lời ấy tiếp tục kéo theo những dòng suy tưởng khác."
2961 = "Hình như đây là kiểu vẽ chibi,\\ntôi nhớ trước đây Hibiki từng nói con bé không giỏi vẽ kiểu này."
2963 = "Khi bước xuống khỏi buồng lái và tiến lại gần, tôi ngay lập tức hiểu ra.\\nCũng hiểu luôn lý do cho nụ cười của Hachiroku."
2967 = "Nghe nói vậy tôi mới nhận ra.\\nTay tôi đang cứng đờ."
2968 = "Đến tận bây giờ tôi mới nhận ra, \\nHibiki vẫn luôn là Hibiki, muốn nói mà không thể nói ra."
2970 = "Một điểm mù.\\nTôi hoàn toàn quên mất chuyện đó."
2971 = "Tôi chợt nghĩ, có lẽ là vì em ấy đang giả định\\ncho lúc kéo \\x%l客車;#00ffc040;toa hành khách%l;#; sau này chăng."
2976 = "Muốn thử đốt than cháy rực đỏ trên đó——\\nTôi cũng có chung cảm giác ấy, nhưng thời cơ vẫn chưa đến."
2978 = "Vì vậy, tôi không chơi chữ nữa.\\nĐây chắc chắn là một thành quả đáng để ngẩng cao đầu tự hào."
2988 = "Cảm giác như đầu ngón tay sắp run rẩy, tôi dồn lực vào.\\nQuẹt một cái, ngọn lửa bùng lên."
2989 = "Và sau khi đưa số về 0,\\ncuối cùng tôi cũng có thể rời tay khỏi tay gạt \\x%lブレーキ;#00ffc040;phanh%l;#;."
2991 = "Tôi thu người lại từ cửa sổ buồng lái,\\nvà quay lại đối diện với \\x%l火室;#00ffc040;buồng đốt%l;#;."
2995 = "Còn lại là hộp số——vào \\x%l逆転機;#00ffc040;cần đảo chiều%l;#;,\\nchỉ cần cho hơi nước chảy vào xi lanh, \\x%l8620;#00ffc040;8620%l;#; sẽ bắt đầu chạy!"
3004 = "Rồi với một nụ cười,\\nem ấy thì thầm vào tai tôi."
3005 = "Tôi lần lượt xếp những miếng vải đã thấm đẫm dầu loang lổ đó,\\nlên trên \\x%l火格子;#00ffc040;ghi lò%l;#; đang trống rỗng."
3007 = "Tôi ném nó thẳng lên lớp \\x%lウェス;#00ffc040;vải lau máy%l;#; được xếp trên \\x%l火格子;#00ffc040;ghi lò%l;#;,\\nnhững miếng \\x%lウェス;#00ffc040;vải lau máy%l;#; ngấm dầu bắt đầu bốc cháy dữ dội."
3010 = "Nếu đó là ngọn cờ chỉ ra con đường đúng đắn, thì những người nhìn thấy nó\\nchắc chắn sẽ lấy đó làm mục tiêu và đi theo sau."
3028 = "Không chỉ Hibiki,\\nmà cả Hachiroku cũng xấu hổ, đôi má ửng hồng đầy vẻ say sưa."
3031 = "Từ ngay sát bên cạnh, Hibiki và Paulette\\nđang bắt chuyện đủ thứ."
3033 = "Có vẻ như Hibiki cũng chưa nhận ra——\\nHọ đã đứng xem từ bao giờ, và từ đâu vậy."
3035 = "Con bé đang ôm một thứ gì đó hình tròn khá lớn.\\nHibiki nói 「Đây」 rồi đưa nó cho Hachiroku."
3037 = "Hibiki là phương pháp đi từ dưới lên một cách chậm rãi.\\nPaulette là phương pháp đi từ trên xuống một cách dứt khoát."
3039 = "Giọng nói như đã an tâm của Hibiki.\\nHòa cùng với đó là tiếng nước khẽ khàng róc rách."
3040 = "Nụ cười nhẹ nhõm của Hibiki."
3046 = "Hibiki, Paulette, Hachiroku."
3050 = "Dù nhỏ bé và cơ bắp cũng mỏng manh,\\nnhưng bí mật về khả năng vận động này rốt cuộc nằm ở đâu cơ chứ——"
3051 = "Có lẽ câu trả lời của tôi nghe hơi kỳ quặc chăng?\\nMichiko cười khúc khích."
3053 = "Là tiếng tàu chạy.\\nNgay khoảnh khắc nghĩ vậy, tôi lao đi tìm Michiko."
3056 = "Là Reina và Fukami. Có tiếng nói nhưng không thấy bóng dáng đâu.\\nCái rãnh nằm giữa các đường ray trong xưởng đầu máy——"
3058 = "Là cơm nắm và súp miso.\\nChị Mayami đã nấu ăn phát cho mọi người."
3064 = "Một cái gật đầu mạnh mẽ."
3069 = "Vị trí dừng, nó đã dừng lại chính xác ngay tại đó."
3070 = "Vô số ánh mắt trong xưởng đầu máy\\nđều hướng về phía hai người họ."
3071 = "Không có một chấn động nào xảy ra.\\nBởi vì nó đã dừng lại nhờ ma sát và trọng lượng bản thân, chứ không phải do \\x%lブレーキ;#00ffc040;phanh%l;#;."
3085 = "Vì hiểu rõ điều đó——\\nNên tôi tuyệt đối sẽ không than vãn."
3088 = "Chính những lúc thế này, những ý kiến chân thật nhất mới được thốt ra.\\nTạm thời gác lại mọi chuyện, hãy tập trung lắng nghe xem sao."
3096 = "Những điều tôi đang cố gắng truyền đạt,\\nkhông sao cả, Michiko không hề sợ hãi mà đã đón nhận chúng."
3097 = "Thế này là ổn rồi.\\nCứ thế này thì chẳng mấy chốc, nó sẽ có thể tự vận hành bằng hơi nước của chính mình."
3098 = "Tôi giật mình thon thót trong tích tắc vì không ngờ đã đến nơi.\\nNhưng cơ thể đã được huấn luyện tự động cử động."
3108 = "Những người bạn \\x%lまいてつ;#00ffc040;chủ tàu%l;#; của Paulette, cùng với các kỹ sư và nhân viên của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; cũ\\nđược tập hợp lại thông qua mạng lưới quan hệ của đền chủ Akai."
3110 = "Paulette phụng phịu phồng má."
3116 = "Fukami đang chằm chằm nhìn chúng tôi với đôi mắt đầy vẻ bất an."
3117 = "Hơi nước chảy vào xi lanh lạnh ngắt sẽ biến thành nước,\\nnên tôi mở rồi lại đóng \\x%lドレンコック;#00ffc040;van xả nước ngưng%l;#; để thoát nước."
3119 = "Nói đúng hơn là “của 8620” chứ không phải “của anh”,\\nnhưng giờ để tâm đến những chi tiết nhỏ nhặt đó cũng chẳng ích gì."
3128 = "Để tránh việc nó tự chạy do tác động từ bên ngoài,\\nphải tác dụng \\x%lブレーキ;#00ffc040;phanh%l;#; nhẹ lên đầu máy."
3137 = "Rồi Hachiroku lấy từ trong túi ra,\\nmột hộp diêm hết sức bình thường, có thể tìm thấy ở bất cứ đâu."
3138 = "Sau đó, Hachiroku thu lại miếng \\x%lウェス;#00ffc040;vải lau máy%l;#; thấm đẫm dầu từ Reina,\\nvà cúi chào tôi một cách đầy kịch tính."
3140 = "Tôi đỡ lấy Hachiroku \\x%l整備体;#00ffc040;thân chính%l;#; đang đổ gục xuống,\\nvà đặt em ấy ngồi vào chiếc ghế chuyên dụng được chuẩn bị sẵn trong xưởng đầu máy."
3143 = "Chỉ cần ném than vào ở mức độ vừa phải là được,\\nnên dù chỉ có một mình tôi cũng chẳng có vấn đề gì."
3145 = "Than đá, vốn dĩ đã là loại than Kyushu thượng hạng,\\nnay lại càng được tuyển chọn kỹ lưỡng hơn."
3147 = "Trên tấm bảng, những dòng chữ đầy màu sắc và tràn đầy sức sống——"
3155 = "Chắc hẳn con bé vẫn đang mải mê ngắm nhìn \\x%lヘッドマーク;#00ffc040;biểu trưng đầu tàu%l;#;.\\nReina đang ngẩn ngơ cũng vội vàng chỉnh đốn lại tư thế."
3158 = "Cảm giác lúc này, chỉ là một sự giải thoát mãnh liệt,\\nvà một chút——"
3159 = "Bây giờ tạm thời——"
3160 = "Giọng nói và khuôn mặt như hiện thân của sự tự mãn.\\nNagi ưỡn bộ ngực phẳng lì của mình ra."
3161 = "Tôi bây giờ, chỉ mới là một người mới bắt đầu,\\nmột \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; gần như nghiệp dư."
3163 = "Có lẽ là do những ngày tháng mệt mỏi rã rời, cứ đặt lưng xuống là ngủ thiếp đi\\nđã kéo dài suốt mấy tuần, mấy tháng qua."
3164 = "Đương nhiên rồi.\\nBộ Nagi không nhận ra vòng quay đầu tiên của bánh xe chủ động sao."
3184 = "Mặt sàn của \\x%l火室;#00ffc040;buồng đốt%l;#;——nơi được gọi là \\x%l火格子;#00ffc040;ghi lò%l;#; đang trống rỗng,\\ncó vẻ làm Nagi không sao yên tâm được."
3186 = "Kim đồng hồ đo áp suất vốn dĩ không hề nhúc nhích, cuối cùng\\ncũng đã đạt đến mức áp suất bình thường."
3210 = "Thiêng liêng, tĩnh lặng——\\nNhững từ ngữ như vậy bất chợt hiện lên trong tâm trí tôi."
3215 = "Hơi nước từ lò hơi di động của ông Hata cung cấp,\\nđi qua \\x%l煙管;#00ffc040;ống lò hơi%l;#; và thoát thẳng ra ống khói."
3219 = "Kisaki dĩ nhiên không đưa ra câu trả lời,\\ncô quay lưng lại và rời đi cùng với Uragami."
3222 = "Sự vất vả đó,\\ncả tôi và Michiko đều hiểu rõ bằng chính cơ thể mình theo đúng nghĩa đen."
3225 = "Hình như đây là lần đầu tiên tôi thấy\\ncô ấy có biểu cảm tự nhiên đến vậy, không hiểu sao lại khiến tim tôi đập thình thịch."
3229 = "Việc xây dựng các mối quan hệ một cách chậm rãi.\\nViệc sử dụng công cụ là chính quyền thành phố."
3232 = "Mà là lò hơi hạng trung di động dùng cho trường hợp khẩn cấp,\\nđã được nhờ ông Hata ở cửa hàng lò hơi mang đến."
3235 = "Những người tập trung trong xưởng đầu máy vẫn đang tiếp tục chờ đợi, không thiếu một ai.\\nMột mùi hương thoang thoảng, ấm áp vẫn còn vương vấn quanh đây."
3236 = "Nghe tiếng Hachiroku,\\nPaulette ngẩng mặt lên như chợt bừng tỉnh."
3237 = "Nghe tiếng kêu từ bên ngoài vọng vào,\\nHibiki và Reina vội vàng chạy ra."
3238 = "Đáp lại tiếng gọi của tôi, Nagi\\nbước nhanh thoăn thoắt về phía này."
3239 = "Nghe giọng điệu nghiêm túc của Paulette, tôi thẳng lưng lên."
3244 = "Tác động liên kết lên chính bản thân đầu máy, và các \\x%l貨車;#00ffc040;toa chở hàng%l;#; hay \\x%l客車;#00ffc040;toa hành khách%l;#; đang kéo theo——\\n\\x%lブレーキ;#00ffc040;Phanh%l;#; tự động tác động lên toàn bộ \\x%l列車;#00ffc040;đoàn tàu%l;#;."
3252 = "Nếu phải đau đầu lựa chọn, thay vì dành thời gian để suy nghĩ,\\ntốt hơn hết là quyết định và hành động, nếu không được thì sửa chữa."
3253 = "Cùng lúc hô lên, tôi khóa \\x%lバイパス弁;#00ffc040;van bypass%l;#; và \\x%lドレンコック;#00ffc040;van xả nước ngưng%l;#; lại.\\nKéo \\x%l汽笛;#00ffc040;còi hơi nước%l;#; để cảnh báo!"
3261 = "Nước cất, củi, và cả hơi nước——tất cả đều như vậy.\\nDù không cần chất lượng cao đến thế, cũng đã quá đủ cho buổi thử nghiệm này."
3269 = "Thêm cả Nagi đang rất háo hức muốn giúp đỡ,\\nba người chúng tôi cùng ông lão Minokasa đi về phía trước \\x%l8620;#00ffc040;8620%l;#;."
3278 = "Rốt cuộc là gắn cái gì lên cơ chứ——"
3294 = "Nói rồi, Nagi ngồi phịch xuống.\\nCon bé đặt cái dáng vẻ nhẹ tênh ấy xuống ghế bên phía \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;."
3296 = "Nghe em ấy nói vậy, có lẽ tôi cũng có xu hướng đó thật."
3297 = "Nói một cách dứt khoát như vậy,\\nHachiroku lần lượt nhìn quanh tôi, Hibiki và Paulette."
3307 = "Kỹ sư thời ở nhà máy bột mà đền chủ Akai mời đến,\\nlại tiếp tục rủ thêm các kỹ sư đồng nghiệp đến Ohimitera."
3312 = "Thành công của cuộc chạy thử nghiệm đã làm tâm trạng mọi người phấn khích.\\nTôi tuy tửu lượng kém, nhưng chắc cũng đang ở trạng thái tương tự như say rượu."
3313 = "Bị cuốn theo bầu không khí ăn mừng thành công của buổi chạy thử nghiệm,\\nđến tận bây giờ tôi mới có dịp nói chuyện này——"
3323 = "Michiko tan dần vào ánh sáng.\\nÁnh sáng buổi sáng chiếu rọi vào Michiko, và cả tôi."
3325 = "Michiko khẽ gật đầu.\\n——Tôi thở phào nhẹ nhõm."
3328 = "Tiếng reo hò vui sướng vang lên từ phía sau."
3351 = "Tất cả những thứ đó, tạm thời đã được chuẩn bị xong.\\nKhông——đã được chuẩn bị giúp."
3352 = "Những thanh củi được đưa vào lập tức chìm trong ngọn lửa,\\nphía trên \\x%l火格子;#00ffc040;ghi lò%l;#; bắt đầu biến thành một \\x%l火床;#00ffc040;buồng lửa%l;#; đúng nghĩa."
3354 = "Trong số mọi người, cũng có tôi.\\nTôi tin rằng, cùng với tôi, Michiko cũng đã ở đó."
3355 = "Nói là lò hơi, nhưng không phải là cái gắn trên \\x%l8620;#00ffc040;8620%l;#;."
3357 = "Chuyện đó thì khỏi phải bàn.\\nHibiki vốn dĩ văn võ song toàn, tính cách lại không ngừng nỗ lực mà."
3358 = "Dùng chúng làm mồi lửa thì thật lãng phí,\\nđây là món đồ được quyên góp từ mọi người trong Hiệp hội Lâm nghiệp Ohimitera."
3359 = "Những thanh củi chất lượng cao, khô khốc."
3360 = "Mắt tôi lúc này cũng đã nhìn ra phía trước qua cửa sổ.\\nTín hiệu xuất phát đang hiển thị màu xanh——“Tiến lên”!"
3361 = "Đồng thời, Nagi cũng tỉnh giấc.\\nTừ giấc ngủ dài và yên tĩnh kể từ năm phút sau khi bắt đầu giải thích."
3362 = "Không phải là \\x%l蒸気排水;#00ffc040;xả nước ngưng hơi nước%l;#; hay gì nữa,\\nHachiroku nói rõ ràng là 『khóc』."
3364 = "Lần này tôi cẩn thận lựa chọn từ ngữ.\\nTôi không muốn một lần nữa làm Michiko sợ hãi bởi những lời nói thiếu suy nghĩ."
3365 = "Với một dáng vẻ có vẻ khó di chuyển,\\nmà sao bước chân lại nhẹ nhàng đến vậy."
3373 = "Vẫn chưa sao, vẫn chưa sao——\\nNhững lời đó bắt đầu cứ luẩn quẩn trong đầu tôi."
3376 = "Vừa thức dậy đã hỏi ngay câu đó.\\nThay vì trả lời, tôi đưa chiếc xẻng xúc than vào tay con bé."
3382 = "Điều quan trọng là, với việc này, chúng ta đã tiến thêm một bước lớn\\nđến việc vận hành thương mại an toàn cho \\x%l8620;#00ffc040;8620%l;#;."
3386 = "Việc khôi phục đường sắt đáng lẽ chỉ là một trong những phương tiện\\nđể chấn hưng du lịch, nhằm rút lại việc mời gọi nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;. Nhưng——"
3393 = "Cùng với sự xả khí đột ngột,\\nkhông khí ùa vào bên trong \\x%l火室;#00ffc040;buồng đốt%l;#; như tuyết lở!"
3395 = "Thật đáng thương khi phải phủ nhận điều đó,\\nnhưng đây cũng không phải là sự thật mà tôi có thể thay đổi."
3396 = "Chỉ có thể nói là thiếu thốn cả về ngân sách lẫn thời gian."
3399 = "Thời gian lái tàu, có lẽ chưa đầy năm phút.\\nVậy mà——"
3401 = "Từ đen chuyển sang đỏ.\\nVà chỉ trong chớp mắt, biến thành ngọn lửa nóng hừng hực táp vào mặt!!"
3406 = "（『O, n, a, o, o, a, i』——\\nĐang nói là 「Chỉ đến mức này thôi sao?」 à?）"
3407 = "（……Tuyệt vời. Không còn lời nào khác để diễn tả.）"
3429 = "（Tuy nhiên…… thành thật mà nói, rắc rối thật.）"
3431 = "（Mà, hôm nay mình cũng đã cố gắng hết sức rồi.\\nChắc là họ định an ủi mình đây mà.）"
3435 = "（Cọc cạch, cọc cạch,\\nxình xịch, xình xịch——）"
3437 = "（Tuúúúúúúúúúúú!）"
3438 = "（Tuúúúúúúúúúúú!!!）"
3439 = "（Rào）"
3441 = "（Rất nhiều bàn tay đã chung sức.\\nNhờ đó, cuối cùng chúng tôi cũng đã tiến đến bước chạy thử nghiệm.）"
3445 = "（Nếu chỉ có một đầu máy đơn độc, thì \\x%lブレーキ;#00ffc040;phanh%l;#; tự động\\nhay \\x%lブレーキ;#00ffc040;phanh%l;#; đơn độc cũng chẳng khác gì nhau sao.）"
3448 = "（Houshou Kisaki và Uragami sao.）"
3456 = "（Đây là…… cái gọi là căng thẳng sao——\\nHay là, tôi đã sợ hãi?）"
3457 = "（Cũng phải thôi.\\nCuối cùng——cũng đã đến được bước này rồi mà.）"
3458 = "（Chỉ là một que diêm thôi mà.\\nChỉ có vậy thôi sao——）"
3460 = "（Vậy thì, ý kiến của ai có vẻ phù hợp với mình nhất đây——）"

[selections]
