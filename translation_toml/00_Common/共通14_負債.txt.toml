[script]
1075 = "——Chức danh trên danh thiếp, rõ ràng được viết như vậy."
1079 = "Đúng là vậy nhỉ, Reina gật gù."
1082 = "Đã từng có, là thì quá khứ.\\nBàn quay đầu máy ở ga Ohimitera hiện tại vẫn còn tồn tại."
1084 = "Một từ quá đỗi trực tiếp là \"quy đổi thành tiền\", khiến tôi nhận ra."
1087 = "……Không, quả thực nếu nhìn kỹ lại,\\năn mặc và ngoại hình đều chỉnh tề, phong thái cũng rất điềm tĩnh——"
1089 = "……Nếu không cho vay,\\nthì có thể dễ dàng dồn phe phản đối thu hút nhà máy vào đường cùng——"
1095 = "……Toàn bộ phí kho bãi tích lũy từ trước đến nay,\\nsẽ được dùng để đắp vào chi phí dự toán cho \\x%l保線;#00ffc040;bảo trì đường ray%l;#;."
1105 = "「\\x%l8620;#00ffc040;8620%l;#; cũng không phải là không thể chạy lùi——tức là đi lùi,\\nnhưng mà tầm nhìn sẽ cực kỳ tệ, đơn giản là rất nguy hiểm ạ.」"
1109 = "「『Không』, gì cơ?」"
1111 = "「『Nhưng』, gì cơ?」"
1112 = "「'Nếu không phải người dưng thì đừng có khách sáo'——\\nChẳng phải chính ngài chủ tịch đã nói vậy sao?」"
1114 = "「Cứ thẳng thắn đi.\\nKhông phải là từ cậu không biết chứ?」"
1116 = "「…………」"
1117 = "「…………」"
1126 = "「……Làm thế này là nhanh nhất mà.」"
1128 = "「……Tôi cũng sinh ra ở Ohimitera. Tôi hiểu lập trường của cậu.\\nChính vì hiểu, nên tôi mới chấp thuận khoản vay này.」"
1130 = "「……Hibiki, chẳng phải em ghét Navi sao?」"
1134 = "「……Đây là, của \\x%l保線;#00ffc040;bảo trì đường ray%l;#;……\\nĐây là…… bản dự toán ở mức tối thiểu.」"
1137 = "「……Anh hai cứ làm theo ý mình đi.\\nOhimitera phồn vinh, là hy vọng chung của tất cả mọi người mà.」"
1404 = "「Cả ba lần, cậu đều không hé môi lấy một lời.\\nThật khó quên nhỉ. Bị đối xử như vậy, ngược lại càng nhớ rõ.」"
1407 = "「Không…… Không có gì đặc biệt cả.\\nAnh nghĩ là em ấy không nói gì.」"
1409 = "「Không——」"
1411 = "「Không phải. Ohimitera là quê hương thứ hai của tôi.\\nBảo vệ nguồn nước và môi trường nơi đây không bị ô nhiễm——đó mới là mục đích của tôi.」"
1414 = "「Không phải đâu, anh Migita. Công việc của tôi là,\\n『Xây dựng nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; ở một địa điểm phù hợp』.」"
1416 = "「Không có gì.」"
1418 = "「Anh không biết. Vì anh hoàn toàn không có ý định thất bại,\\nnên cũng không nghĩ đến việc xác nhận lại.」"
1420 = "「Không nhớ cũng là lẽ đương nhiên sao? Mà, chắc là vậy rồi.\\nThành thật mà nói, ngay cả ta cũng từng nghĩ 'Thằng bé này hết cách rồi'.」"
1423 = "「Không, tôi đã được chỉ thị làm người đại diện cho cô Houshou,\\nđể lắng nghe câu chuyện của anh.」"
1424 = "「Không, không sao. Vì quá tò mò nên tôi đã điều tra và biết được.\\nRằng cậu, là nạn nhân của một vụ tai nạn đường sắt nghiêm trọng.」"
1434 = "「Ý anh là, công việc của anh là phán đoán xem,\\nđó có phải là địa điểm phù hợp hay không sao?」"
1435 = "「Nghĩa là, trước đây ở Yui cũng từng có bàn quay đầu máy,\\nnhưng mà, nó đã bị mất rồi sao?」"
1442 = "「Sao thế, Soutetsu không nhớ à.\\nHồi cậu mới được nhận nuôi, ta đã cho hai đứa gặp nhau mấy lần rồi mà.」"
1443 = "「Gì chứ! Cả bố lẫn cái ông chú Mototada đó,\\nhoàn toàn coi anh hai như đồ vật vậy～っ」"
1447 = "「Ông ấy cười lớn ha hả——\\n『Nếu vậy thì tôi sẽ đi nói chuyện với Kenzo』」"
1448 = "「Ông ta định nói chuyện kiểu gì chứ!?」"
1451 = "「Nhưng mà…… cái đó——」"
1453 = "「Nhưng mà, này Soutetsu. Cuối cùng tôi cũng nhớ ra rồi.\\nTôi và cậu, hồi nhỏ đã từng gặp nhau ba lần.」"
1456 = "「Nhưng mà Hibiki này. Navi——\\nnó không hề quên mục đích tôi quay lại đây đâu.」"
1458 = "「Nhưng mà này, Soutetsu. Vượt quá 200 triệu là không thể đâu.\\nVì nếu là thẩm định liên quan đến \\x%lエアクラ;#00ffc040;Aircra%l;#;, thì giao cho Urakami là không sai vào đâu được.」"
1461 = "「Nhưng mà, chủ sở hữu hiện tại của nhà kho——tức là Đường sắt Ohimitera,\\nđã được công nhận là người nhận hợp pháp rồi đúng không?」"
1463 = "「Nhưng mà, chúng tôi đã ở đó. Tai nạn đã được hạn chế ở mức tối thiểu.\\nNgược lại, nếu không có chúng tôi thì có khi tai nạn đã chẳng xảy ra.」"
1465 = "「Nhưng mà, nếu vậy thì——\\nTôi không hiểu tại sao lại không cần phải tự lo toàn bộ số tiền dự toán.」"
1467 = "「Nhưng mà, ừm——em xin phép quay lại chủ đề chính một chút,\\nđúng như Hibiki đã nói, đây là vấn đề của Đường sắt Ohimitera.」"
1469 = "「Nhưng mà, Navi——từ những lúc tôi tồi tệ nhất,\\nnó đã luôn dõi theo tôi——luôn bảo vệ tôi.」"
1471 = "「Với điều kiện là bảo lưu kết quả học tập ở Đại học Đế quốc, và xin nghỉ việc ở xưởng rượu,\\nem đã hứa với cha nuôi vài điều.」"
1473 = "「Làm gì mà phải khách sáo thế.\\nHai người đâu phải người dưng nước lã.」"
1474 = "「Được giúp đỡ để trưởng thành?」"
1487 = "「Các giao dịch cá nhân sẽ được thực hiện riêng biệt.\\nChỉ cần như vậy, Đường sắt Ohimitera có thể duy trì được tính độc lập của mình.」"
1491 = "「Đừng bận tâm. Vấn đề về chức năng của Reina,\\nchính bản thân Reina cũng chẳng thể làm gì được mà.」"
1492 = "「Đừng có lo lắng thái quá như vậy.\\nKhông phải là chuyện buôn bán người đâu.」"
1495 = "「Dù đã dùng \\x%l三角線;#00ffc040;đường tam giác%l;#; để ép giá xuống rất nhiều rồi——\\nmà tổng chi phí vẫn lên đến mức này sao.」"
1499 = "「Ra là vậy.\\nVì thế nên ga Ohimitera mới có \\x%l転車台;#00ffc040;bàn quay đầu máy%l;#; nhỉ?」"
1501 = "「Ra là vậy.」"
1502 = "「Ra là vậy, nếu làm thế này thì chỉ cần xây thêm hai đoạn vào đường ray cũ,\\nlà có thể giúp \\x%l8620;#00ffc040;8620%l;#; đổi hướng được rồi nhỉ.」"
1515 = "「Nếu Sou-chan ký vào đây, hai trăm triệu yên,\\nchị sẽ cho Sou-chan vay không lãi suất, không cần thế chấp.」"
1516 = "「Nếu anh hai thấy được,\\nthì để em liên lạc với tiền bối Kisaki cho.」"
1519 = "「Gọi Kisaki là được rồi.\\nTôi cũng sẽ gọi cậu là Soutetsu.」"
1520 = "「Nhưng mà——ngoài tài sản của Đường sắt Ohimitera ra,\\nthì làm gì còn thứ gì có thể làm tài sản thế chấp lớn đến vậy chứ.」"
1523 = "「Nhưng mà, nếu không có anh Soutetsu và chị Hachiroku,\\nReina……」"
1527 = "「Đồng thời, nó cũng là vấn đề của tôi. Paulette.\\nVì vậy, tôi mới định đề xuất một phương án thỏa hiệp.」"
1529 = "「Hả? A! Ra là vậy, đúng vậy nhỉ!! Trong trường hợp xấu nhất,\\nmình chỉ cần lấy Đường sắt Ohimitera làm tài sản thế chấp để vay một khoản tiền mới.」"
1531 = "「Ha ha ha, bầu không khí đã trở nên cởi mở hẳn rồi nhỉ.」"
1532 = "「Hừm?」"
1533 = "「Không sao, cảm ơn cô đã dành thời gian dù đang bận rộn.」"
1535 = "「Ừm.」"
1536 = "「A——」"
1537 = "「À——」"
1539 = "「À…… của cha nuôi tôi.」"
1540 = "「A!」"
1542 = "「A, gì vậy, anh từ chối rồi à.」"
1543 = "「À, ra là vậy! Chị Mayami đã từng nói,\\n『Vẫn luôn trả tiền cho thành phố』 mà——」"
1546 = "「Vâng, hạn mức cho vay là 200 triệu và——」"
1548 = "「À. Đúng là vậy nhỉ.\\n\\x%l8620;#00ffc040;8620%l;#; có phân biệt trước sau, còn KiHa 07 thì có thể nói là hai mặt đều là phía trước.」"
1549 = "「Aー……aー……a～～っ」"
1550 = "「A～～っ」"
1551 = "「Này này giám đốc chi nhánh Ohimitera.\\nNói với chủ tịch mà lại dùng từ 'được không' sao.」"
1554 = "「Vâng. À không, chuyện này,\\nlẽ ra em nên nói cho mọi người biết sớm hơn mới phải——」"
1555 = "「Vâng. Em đã từ chối, bảo là không thể nhận lời được.」"
1558 = "「Ừm. Quả là một lời đề nghị đáng quý đến mức lãng phí.」"
1559 = "「Ừm. Cảm ơn cô.」"
1561 = "「Ừm.」"
1562 = "「Ừm ừm.」"
1564 = "「Vâng. Từ đầu em cũng đã định như vậy rồi.」"
1566 = "「Vâng. Em biết——em biết chứ.\\nNavi đã dõi theo anh trai suốt bao lâu nay mà.」"
1567 = "「Hửm?」"
1569 = "「Hửm? Hình như tôi nghe nói Đường sắt Ohimitera đang chịu lỗ mà.\\nCó thể xin được tiền trợ cấp từ thành phố sao?」"
1571 = "「Hửm?\\nCái 'Xây mới \\x%l三角線;#00ffc040;đường tam giác%l;#; ga Yui' này là sao?」"
1573 = "「400 triệu——sao ạ.」"
1575 = "「Mục đích quay lại……\\nĐó chẳng phải là, phản đối việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; sao.」"
1582 = "「Vì vậy nên Sou-chan đã từ chối đúng không? Nói trắng ra thì,\\nbản thân Sou-chan đã bị đem ra làm tài sản thế chấp mất rồi.」"
1583 = "「Có phải vì Navi——\\nbuộc phải thay thế Navi của \\x%lエアクラ;#00ffc040;Aircra%l;#; không?」"
1586 = "「Việc trải qua một tai nạn mang tính chất cảnh báo vào thời điểm này.\\nTôi nghĩ đây ngược lại lại là một điều thực sự may mắn.」"
1589 = "「Về cơ bản là vậy ạ.\\n……Mặc dù đường ray cũ cũng cần phải kéo dài thêm.」"
1594 = "「Kỳ diệu thay chỉ có một người bị thương nhẹ, cũng không có khiếu nại nào.\\nNhưng mà, vụ tai nạn hôm nọ——là điều không bao giờ được phép xảy ra.」"
1599 = "「Nếu để chậm trễ việc trả nợ, tôi sẽ đòi gắt gao đấy.\\nCho dù có tôi ở giữa, thì trách nhiệm của Paulette vẫn không thay đổi đâu nhé?」"
1601 = "「Nếu chị gặp khó khăn,\\nSou-chan, em có giúp chị không?」"
1602 = "「Nếu không đạt được kết quả thì anh hai sẽ ra sao?」"
1605 = "「Chị cũng vậy.\\nChỉ vậy thôi.」"
1606 = "「Còn một điều nữa.\\nChị sẽ cho Sou-chan một lựa chọn nhé.」"
1608 = "「\"Mạng sống của tôi\" mà nó nói, không đơn thuần chỉ là sinh mạng.\\nTất cả những gì nó đánh giá là làm nên con người tôi, đều là mạng sống.」"
1612 = "「Cô Houshou cũng rất mong chờ cuộc gặp này,\\nnhưng không may, lại có cuộc họp giám đốc chi nhánh khẩn cấp.」"
1617 = "「Sơ sơ thì, cũng phải tầm 400 triệu nhỉ.」"
1618 = "「Đã hẹn trước rồi,\\nmà còn để anh phải chờ đợi, thật vô cùng xin lỗi.」"
1624 = "「Gì thế bé Hi, tự dưng hét toáng lên.」"
1631 = "「Xin lỗi anh Migita, để anh phải đợi lâu rồi.」"
1637 = "「Đường sắt Ohimitera đã thành lập bộ phận \\x%l保線;#00ffc040;bảo trì đường ray%l;#; rồi sao.\\nĐó là do ảnh hưởng từ sự cố hôm nọ à?」"
1643 = "「Làm gì có chuyện đó.」"
1644 = "「Làm gì có chuyện đó! Tiền bối Kisaki không phải là người\\ndùng nợ nần làm lá chắn để ép buộc những yêu cầu vô lý đâu!」"
1645 = "「Anh đã bàn với Urakami đến đâu rồi?」"
1648 = "「Cảm nhận được điều đó, tôi hoàn toàn mất hứng thú với cậu.\\nVì thế, bây giờ, tôi đang vô cùng ngạc nhiên đây.」"
1650 = "「Em nghĩ đúng như những gì ngài Soutetsu nói ạ.」"
1652 = "「Em cũng vậy! Em cũng tuyệt đối tuyệt đối sẽ giúp!」"
1653 = "「Ta cũng đã từng gặp ông Taito.\\nTa và Kenzo, từng là bạn học rất thân với nhau mà.」"
1655 = "「Tôi cũng nghĩ là nên đưa ra bàn bạc đàng hoàng trước hội đồng.\\nDù có bị nghi ngờ là công tư lẫn lộn, hay bị soi mói những chuyện không đâu.」"
1657 = "「Hôm nay, tôi đến không phải với tư cách là nhân viên xưởng rượu,\\nmà là để bàn bạc với tư cách Trưởng bộ phận \\x%l保線;#00ffc040;bảo trì đường ray%l;#; của Đường sắt Ohimitera.」"
1662 = "「Tôi sẽ dùng Navi làm tài sản thế chấp để vay 400 triệu từ Kisaki.\\nSau đó, với cùng điều kiện đó, tôi sẽ cho Đường sắt Ohimitera vay lại.」"
1664 = "「Tôi và Hibiki quen nhau từ trường học.\\nHồi nhỏ chúng tôi chưa từng gặp nhau.」"
1665 = "「Em sẽ, luôn luôn, sát cánh cùng ngài Soutetsu.」"
1667 = "「Tôi đã hoàn toàn bị thuyết phục.\\nCảm ơn anh vì câu trả lời thẳng thắn.」"
1669 = "「Tôi cũng đã nghe qua khái quát từ cô Houshou rồi.\\nTài liệu anh gửi trước tôi cũng đã xem qua.」"
1671 = "「Ngược lại…… có lẽ chính vì có bàn quay đầu máy,\\nngười ta mới đưa 8620 vào chạy tuyến Ohimitera - Yui đấy ạ.」"
1673 = "「Tôi xin nhận.」"
1674 = "「Tôi hiểu rồi. Thứ thay thế cho bàn quay đầu máy,\\nchính là cái gọi là '\\x%l三角線;#00ffc040;đường tam giác%l;#;' này đúng không?」"
1679 = "「Tôi là Urakami, hiện đang làm thư ký cho cô Houshou.」"
1681 = "「Tôi rất tự tin vào mắt nhìn người của mình. Nhưng mà này, Soutetsu.\\nỞ đền Akai Aso, tôi đã không nhận ra cậu là cậu.」"
1682 = "「Tôi nghĩ giá trị của bản thân thân máy,\\ncũng khá lớn đấy chứ.」"
1686 = "「Vì thế nên đương nhiên, toàn bộ chi phí liên quan đến \\x%l保線;#00ffc040;bảo trì đường ray%l;#;,\\nCông ty Cổ phần Đường sắt Ohimitera dự định sẽ chi trả toàn bộ. Nhưng mà——」"
1688 = "「Vì thế nên, dù không có thiết bị bảo dưỡng đặc biệt nào,\\nvẫn có thể dễ dàng đổi hướng được ạ.」"
1693 = "「Xin thất lễ.」"
1695 = "「Phương án thỏa hiệp sao ạ?」"
1697 = "「Xin lỗi vì giới thiệu chậm trễ. Tôi là Migita Soutetsu,\\nngười của tửu điếm Migita Ichi.」"
1700 = "「Xin lỗi cha. Con sẽ gọi lại sau ạ.」"
1705 = "「Nếu Hibiki đã nói vậy, thì cá nhân Kisaki có lẽ là thế thật.\\nNhưng mà, nếu là ngân hàng với tư cách một tổ chức, thì câu chuyện lại khác.」"
1707 = "「Nếu vậy thì, Sou-chan à.」"
1715 = "「Vâng. Nhưng mà——」"
1717 = "「Vâng, kể từ sau khi \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; giải thể, số tiền đó,\\nthành phố có vẻ đã giữ lại dưới dạng khoản thu không rõ người nhận.」"
1721 = "「Để lo liệu được số tiền đó, có vẻ sẽ cực kỳ khó khăn đấy ạ.」"
1723 = "「Ghét chứ. Tại nó cứ ra vẻ người giám hộ của anh hai.\\nNhưng mà! Chuyện đó và chuyện này là hai chuyện khác nhau!」"
1725 = "「Là phí kho bãi ạ. Chị Mayami đã trả giúp chúng ta trong nhiều năm qua.」"
1727 = "「Đúng vậy.」"
1728 = "「Vậy sao.」"
1730 = "「Có lẽ do đã nghe Hibiki kể về cậu đến phát chán rồi chăng?\\nKhông ngờ 'anh trai của Hibiki', lại chính là cậu thiếu niên lầm lì đó.」"
1731 = "「Việc bỏ mặc đường ray xuống cấp là lỗi của Đường sắt Ohimitera mà!\\nTại sao anh hai lại phải làm đến mức đó chứ!?」"
1734 = "「Đúng vậy ạ. Nhưng mà, việc lắp đặt bàn quay đầu máy,\\nsẽ tốn một khoản tiền lớn đến mức không thể nào lập dự toán nổi.」"
1735 = "「Vâng. Thẳng thắn mà nói thì,\\nlà do tôi đánh giá hệ thống \\x%l保線;#00ffc040;bảo trì đường ray%l;#; hiện tại của Đường sắt Ohimitera vẫn chưa đủ tốt.」"
1740 = "「Đúng vậy. Việc thay thế Navi bay là công nghệ mới nhất,\\nnên sẽ tốn một khoản chi phí khá lớn.」"
1742 = "「Vâng, tôi được công ty Aero-Craftech phái cử đến,\\nvà hiện đang làm thư ký cho cô Houshou Kisaki.」"
1744 = "「Đúng vậy ạ, vì thế, phần tiền kể từ khi trở thành công ty cổ phần,\\nchúng ta có thể nhận lại toàn bộ mà không bị tính thời hiệu.」"
1746 = "「Vâng, chính là như vậy ạ.」"
1748 = "「Ra là vậy.」"
1750 = "「Vâng. Đúng vậy nhỉ.」"
1752 = "「Vâng ạ, anh Soutetsu, chị Hachiroku.\\nReina, hiểu rồi ạ!」"
1754 = "「Có chứ. Chiếc \\x%lエアクラ;#00ffc040;Aircra%l;#; của tôi.」"
1759 = "「\\x%l列車;#00ffc040;Tàu%l;#; di chuyển theo hướng mũi tên,\\ntrước tiên sẽ đi hết cạnh đáy của hình tam giác △.」"
1766 = "「Tại Ohimitera, nơi có khu vực \\x%lエアクラ;#00ffc040;Aircra%l;#; không thể hoạt động,\\nngân hàng chúng tôi cũng đánh giá cao tính công cộng của đường sắt.」"
1773 = "「Đúng vậy. Nếu có thể phán đoán là không phù hợp, thì việc\\nrút lui khỏi đó cũng là một thành quả trong công việc của tôi.」"
1775 = "「Đúng vậy ạ. Ngài Soutetsu.」"
1780 = "「Ông ấy không nói rõ thời hạn.\\nChỉ bảo là \"Lương sẽ được trả đúng theo quy định\".」"
1781 = "「Không đâu, anh đã sắp xếp lịch hẹn\\nnhanh chóng thế này, tôi thực sự rất biết ơn.」"
1782 = "「Đúng vậy. Nhưng mà, đời máy đã quá cũ rồi.\\nThêm vào đó, tổng quãng đường bay cũng khá lớn.」"
1783 = "「Đúng là vậy.」"
1784 = "「Đúng vậy, việc trả nợ cho tôi sẽ được thực hiện bằng nguồn tiền đó,\\nvà tôi sẽ có thể hoàn tất việc trả nợ cho ngân hàng một cách suôn sẻ.」"
1791 = "「Paulette thì, mối quan hệ với ngân hàng thế nào.」"
1797 = "「Anh Urakami, anh được phái cử đến đây,\\nlà để xây dựng nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; ở Ohimitera đúng không?」"
1801 = "「Anh Urakami đây,\\nlà người của công ty Aero-Craftech nhỉ.」"
1805 = "「Khu vực rộng lớn quanh ga Yui đều là đất của Đường sắt Ohimitera,\\nnên so với bàn quay đầu máy thì sẽ rẻ hơn rất nhiều…… nhưng mà.」"
1806 = "「Để phục vụ người dân tốt hơn,\\ntôi cho rằng việc tăng cường \\x%l保線;#00ffc040;bảo trì đường ray%l;#; và đảm bảo an toàn là điều bắt buộc.」"
1808 = "「Tại sao làm vậy,\\nlại là bảo vệ anh Soutetsu ạ?」"
1809 = "「Vì lý do gì, mà em lại không thể nhận lời đề nghị đó?」"
1811 = "「Vô thời hạn sao?」"
1819 = "「Th, thế!? Anh hai!\\nBản thân anh hai làm tài sản thế chấp rốt cuộc là sao hả!?」"
1820 = "「Vậy sao? Thế em đã trả lời lời đề nghị đó thế nào?」"
1821 = "「Thế là, tôi đã nghĩ thế này.\\n『Nếu vết thương quá sâu, con người ta sẽ sống không bằng chết』.」"
1822 = "「Sau khi đến đó, cứ thế lùi lại tiến vào cạnh huyền bên trái,\\ntiếp tục lùi cho đến khi vượt qua đỉnh của hình tam giác △.」"
1824 = "「Reina cũng sẽ, cố gắng hơn nữa nha~」"
1831 = "「Ohimitera đã nhận được sự tiến cử từ điều phối viên địa phương,\\nnhư một ứng cử viên vô cùng tiềm năng. Nhưng mà.」"
1832 = "「Đương nhiên rồi. Em sẽ dốc toàn lực để giúp đỡ.」"
1833 = "「Tất nhiên là, có giao dịch bình thường ạ.」"
1834 = "「Tất nhiên, giả sử việc thu hút nhà máy bị cưỡng chế tiến hành, sông Kuma bị ô nhiễm,\\nthị trấn Ohimitera bị tàn phá, thì tôi cũng chẳng chết được.」"
1835 = "「Tất nhiên. Tôi sẽ không để việc trả nợ bị chậm trễ đâu.\\nTôi sẽ khiến mọi chuyện diễn ra suôn sẻ, không để tổn thất bất cứ thứ gì.」"
1836 = "「Thực sự——thực sự em xin lỗi ạ.」"
1838 = "「Cũng có thể lắm chứ. Người đã châm ngòi cho ngọn lửa tu hành của Nagi,\\nkhông ai khác chính là anh mà.」"
1840 = "「Chị Mayami, Hibiki——」"
1855 = "「Bé Kisaki có nói gì không?」"
1858 = "「Trong thời gian ngắn như vậy mà cô đã đưa ra được bản dự toán này, làm tốt lắm.」"
1862 = "「Kết hôn á!? Kết hôn, ý anh là——với ai cơ!?\\nNgười mà bố chọn là ai vậy!?」"
1870 = "「Bây giờ, tình hình vẫn cho phép điều đó. Chỗ nào hỏng thì sửa là được.\\nNếu cảm thấy có trách nhiệm——thì hãy bù đắp bằng cách cải thiện nó.」"
1871 = "「Ngược lại với trường hợp đạt được kết quả. Thời gian thực tập của anh sẽ tiếp tục.\\nThêm vào đó, anh sẽ phải kết hôn với người mà bố nuôi chọn.」"
1872 = "「Ngược lại, 8620 chỉ có một \\x%l運転台;#00ffc040;buồng lái%l;#; duy nhất.\\nTức là——\\x%l8620;#00ffc040;8620%l;#; có phân biệt trước sau rõ ràng ạ.」"
1874 = "「Nếu trong thời hạn đó có thể hủy bỏ việc thu hút nhà máy,\\ncha hứa sẽ kết thúc thời gian học việc và cho phép em tự lập.」"
1877 = "「Nếu tai nạn xảy ra sau khi du lịch đã phát triển,\\nthì cả thiệt hại lẫn ảnh hưởng, có lẽ sẽ mang tính chí mạng.」"
1879 = "「Trong trường hợp chậm trễ trả nợ, tôi sẽ phải vào làm ở Ngân hàng Kumamoto,\\nvà học hỏi về quản lý kinh doanh dưới trướng ông Mototada——ông ấy bảo vậy.」"
1882 = "「Kính chào ngài chủ tịch.」\\n「Xin ông đừng làm phiền công việc của tôi được không.」"
1884 = "「Chủ tịch?」"
1889 = "「Hồi mới được nhận nuôi——nếu vậy thì——」"
1890 = "「Cậu có muốn thêm một tài sản thế chấp nữa không?\\nNếu làm vậy, ta sẽ cho vay đủ 400 triệu——với lãi suất thấp nhất.」"
1893 = "「Để xác định xem nơi đây có thực sự phù hợp hay không——\\nThành thật mà nói, động thái của nhóm anh Migita lại là một điều đáng mừng đấy.」"
1894 = "「Hứa?」"
1896 = "「Với số tiền đó, thì chỉ còn cách đi vay thôi.\\nVì vậy, việc dùng một phần cơ sở vật chất của Đường sắt Ohimitera làm tài sản thế chấp thì.」"
1899 = "「Ông nói vậy, nhưng tôi nghĩ chúng tôi 'cũng chẳng khác gì người dưng' đâu.\\nTôi và Kisaki——cô Kisaki ấy.」"
1900 = "「Cảm ơn mọi người.」"
1923 = "「Thế thì——giúp ích được nhiều lắm. Giúp được nhiều lắm, nhưng——」"
1924 = "「Tôi cũng đã trưởng thành hơn đôi chút——\\nKhông, không phải. Có lẽ là nhờ được mọi người giúp đỡ để trưởng thành.」"
1925 = "「Ông ấy không giải thích gì thêm. Chỉ bảo là\\nsẽ đi nói chuyện nên cứ yên tâm mà làm tài sản thế chấp đi, chỉ vậy thôi.」"
1926 = "「À——ừm.」"
1927 = "「Đó là nếu có thể thông qua hội đồng để lập ngân sách tạm thời ạ.\\n——Đường sắt tuy có tính công cộng cao, nhưng mà, quả nhiên là.」"
1928 = "「Không được.\\nĐể cho ngân hàng, thuộc phe ủng hộ nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nnắm giữ huyết mạch của Đường sắt Ohimitera - thành trì của phe phản đối thì.」"
1930 = "「Vậy sao!\\nHa ha, bị chiếu tướng mất rồi.」"
1931 = "「Nếu là vậy thì tôi có thể hiểu được.\\nVậy, giả sử tôi vay 200 triệu, thì lãi suất sẽ là.」"
1932 = "「Chuyện đó…… dù là chuyện ngày xưa, nhưng tôi đã thất lễ rồi.」"
1933 = "「Đó là một lời hứa tuyệt vời đấy!」"
1934 = "「Đương nhiên rồi!」"
1935 = "「Đi rồi lại lùi——ra là vậy, làm thế thì,\\ntừ cạnh bên phải có thể đổi hướng tiến lên để quay lại đường ray cũ.」"
1940 = "「Chỉ còn một điều nữa thôi——\\nĐó là điều kiện trong trường hợp không đạt được kết quả đúng thời hạn.」"
1941 = "「Rồi sao nữa?」"
1954 = "「Nè, Sou-chan?」"
1955 = "「Ông chủ tiệm rượu đó, \\nđã bắt Sou-chan hứa thêm điều gì nữa?」"
1957 = "「À ừm……\\nKiHa 07 thì, có \\x%l運転台;#00ffc040;buồng lái%l;#; ở cả hai mặt đúng không ạ?」"
1959 = "「Nhưng, nhưng mà——như thế thì, chuyện đó.」"
1960 = "「À, nhưng mà, số tiền đó……\\nkhông có nghĩa là chúng ta phải tự lo toàn bộ đâu ạ.」"
1963 = "「Thế nên ta có một đề nghị thế này.」"
1965 = "「Hoặc là cũng có thể nghĩ thế này.\\n『Nếu vụ tai nạn này không xảy ra, thì sau này sẽ có một tai nạn lớn hơn xảy ra』.」"
1966 = "「Vậy thì, cứ thẳng thắn đi.\\nSoutetsu cũng làm thế nhé.」"
1967 = "「Vậy thì, ông Mototada nói sao?」"
1968 = "「Vậy Soutetsu này.\\nTài sản thế chấp là em thì sẽ được quy đổi thành tiền như thế nào?」"
1969 = "「Nếu vậy, tôi xin phép tiến hành theo phương án này.」"
1970 = "「Nếu vậy, tôi nên đổi sang ngày khác chăng?」"
1971 = "「Nói vậy tức là,\\ncô Kisaki và Hibiki cũng là bạn bè từ ngày xưa sao?」"
1972 = "「Vậy thì——chủ tịch——\\nÔng Mototada, có quan hệ thế nào với ông Taito?」"
1973 = "「Nếu vậy thì Navi…… anh hai——không, anh trai——\\nNếu như, thất bại trong việc phản đối nhà máy——」"
1975 = "「Một nhà máy có thể hoạt động ổn định, hiệu quả trong thời gian dài,\\nkhông phải là thứ dễ dàng xây dựng được, nên tôi phải điều tra.」"
1979 = "「Nó hay lo lắng và bảo vệ quá mức đến nhường nào,\\nchắc Hibiki cũng biết mà đúng không?」"
1980 = "「Về chiếc \\x%lエアクラ;#00ffc040;Aircra%l;#; bay của ngài Soutetsu,\\ntôi đánh giá giá trị thế chấp là 200 triệu là hợp lý.」"
1983 = "「Bản thân anh hai làm tài sản thế chấp á!!?」"
1984 = "「Anh hai!?」\\n「Hả!?」"
1986 = "「Chị ơi! Anh hai, hình như,\\nanh hai bảo sẽ làm tài sản thế chấp để vay tiền hay sao ấy.」"
1990 = "「Cảm ơn anh. Do đó, tôi đến đây để bàn bạc\\nvề việc xin vay một phần chi phí \\x%l保線;#00ffc040;bảo trì đường ray%l;#;.」"
1997 = "「Thứ nhất là thời hạn. Trong vòng hai năm phải có kết quả.」"
1998 = "「!!!」"
1999 = "「!?」"
2003 = "「Nó sẽ phán đoán rằng,\\ntôi không còn là tôi mà nó công nhận nữa.」"
2004 = "「Navi thì, đã đồng ý rồi.\\nNó tin tưởng tôi. Nó bảo sẵn sàng làm tài sản thế chấp.」"
2007 = "「Navi hiểu rõ điều đó.\\nVì vậy, để bảo vệ tôi, nó đã đồng ý làm tài sản thế chấp.」"
2150 = "Một giọng nói điềm tĩnh cất lên hỏi tôi,\\nngười đang cứng đờ."
2152 = "“Em nhất định sẽ trả lại toàn bộ”\\nTôi định nói vậy, nhưng lại nuốt vào trong, không thốt ra thành lời."
2155 = "Khi đã nhận ra,\\nmọi thứ thừa thãi đều rơi rụng, chỉ còn lại một cảm xúc duy nhất thật đẹp đẽ."
2160 = "Cứ chần chừ đợi thời cơ,\\nthế là để lỡ mất cơ hội nói ra lúc nào không hay."
2161 = "Một câu trả lời tươi sáng.\\nReina đã thay đổi tâm trạng, có vẻ như em ấy đã có thể hướng về phía trước."
2162 = "Ánh mắt không hề e sợ.\\nDù vẫn giữ khoảng cách, nhưng tôi lại có cảm giác như bị áp sát."
2166 = "Bàn trà hình tam giác. Hệ thống đèn chiếu sáng mang tính trang trí cao.\\nThế nhưng trên tủ búp phê, lại đặt một bức tượng thần Daikoku cũ kỹ."
2168 = "Không——không phải, có lẽ là,\\nsự quyết tâm đã khiến giọng nói cô ấy trở nên mạnh mẽ."
2170 = "Không nhớ.\\nNói đúng hơn là, có lẽ tôi không hề nhận thức được việc \"đã gặp\"."
2173 = "Không phải giọng của cô tiếp tân lúc nãy,\\ncũng không phải giọng của Houshou Kisaki."
2182 = "Lời ám chỉ đó——nhưng với giọng nói tươi sáng ấy,\\ntôi có cảm giác như sự việc đã được soi sáng đôi chút."
2184 = "Ông ấy cười lớn sảng khoái, rồi vỗ đét một cái lên trán."
2185 = "Những ngón tay thon gầy kéo chiếc cà vạt mảnh sang hai bên,\\nnới lỏng ra một chút."
2188 = "Cập nhật thông tin nhanh thật.\\nNếu vậy thì câu chuyện cũng sẽ được giải quyết nhanh chóng thôi."
2190 = "Một câu trả lời ngắn gọn như muốn nói: \"Nếu anh đã hiểu thì mọi chuyện sẽ nhanh thôi\"."
2192 = "Ông ấy biết chuyện, và đã gặp tôi."
2194 = "Mặc vest, thân hình cực kỳ gầy gò và đeo kính……\\nNói đúng hơn là, tôi đã gặp ở đâu đó——"
2196 = "Được ông ấy nói, tôi mới nhận ra.\\nSự cảnh giác khi bước vào phòng giám đốc chi nhánh, tôi đã hoàn toàn đánh mất."
2199 = "Nếu vậy thì Hibiki, đã luôn khen ngợi tôi sao."
2200 = "Chỉ thị \"cứ thẳng thắn đi\" của chủ tịch,\\nphải chăng Urakami cũng định tuân theo ở một mức độ nào đó."
2204 = "Nhưng mà…… Paulette thì——vẫn giữ vẻ mặt ủ rũ,\\nchậm chạp lấy tài liệu ra khỏi cặp."
2206 = "Thế nhưng, tôi không thể phủ nhận sự hoài nghi.\\nBởi vì——tôi——chỉ là một đứa em trai nuôi mà thôi."
2207 = "Nhưng mà, nếu phủ nhận lời tôi nói,\\nthì đồng nghĩa với việc truy cứu trách nhiệm của Nagi, có lẽ Reina cũng hiểu điều đó."
2221 = "Hachiroku cũng lên tiếng đồng tình với vẻ mặt nghiêm trang."
2223 = "Hachiroku và Paulette, cả hai gần như gật đầu cùng một lúc."
2237 = "Một câu hỏi bất ngờ từ Reina."
2242 = "Dù vậy, chi phí cho \\x%l保線;#00ffc040;bảo trì đường ray%l;#; vẫn còn thiếu một khoản rất lớn."
2245 = "Dù vậy, ngay khi tôi vừa nói \"Nhờ em nhé\",\\nHibiki lập tức lấy điện thoại ra gọi."
2248 = "Ra là vậy, nói tóm lại,\\nlà người phía công ty \\x%lエアクラ;#00ffc040;Aircra%l;#;, đến để thúc đẩy việc thu hút nhà máy."
2250 = "Là chị Mayami.\\nĐó là tiếng chị ấy vỗ vào đầu gối khi đang ngồi quỳ."
2255 = "Lại là tiếng quát tháo.\\nHibiki hôm nay đang thể hiện lại màn biểu cảm muôn màu muôn vẻ đã lâu không thấy."
2272 = "Chỉ cần đưa \\x%l8620;#00ffc040;8620%l;#; lên đó, rồi cứ thế xoay một vòng,\\nlà có thể đưa phần \"phía trước\" có \\x%l運転台;#00ffc040;buồng lái%l;#; hướng về phía mong muốn."
2276 = "Từ \\x%l運転台;#00ffc040;buồng lái%l;#; ở hướng đang đi, chuyển sang \\x%l運転台;#00ffc040;buồng lái%l;#; ở hướng ngược lại,\\nchỉ cần Paulette và mọi người di chuyển, thì hướng di chuyển đó sẽ trở thành \"phía trước\"."
2280 = "Migita Soutetsu——bốn chữ ấy,\\nMigita, Soutetsu——tôi dồn hết tâm tư vào từng chữ một."
2292 = "À, đúng rồi. Vào ngày diễn ra buổi tham quan,\\nngười đàn ông đi cùng Houshou Kisaki."
2297 = "Sau đó, cuộc kiểm tra \\x%l保線;#00ffc040;bảo trì đường ray%l;#; khẩn cấp đã được tiến hành——\\nVà những vấn đề được phát hiện qua đó, đã vượt qua con số hai nghìn."
2299 = "Có lẽ vì quá tức giận, Hibiki thậm chí còn đứng bật dậy để phản đối."
2301 = "Lúc tham quan, tôi cũng đã thấy nó hoạt động.\\nMột chiếc bàn quay tròn khổng lồ được lắp đặt trên đường ray."
2303 = "Đạt được khoản vay mà không để họ can thiệp vào hoạt động của chúng tôi."
2305 = "Vào lựa chọn mà chị Mayami đã tạo ra cho tôi.\\nTôi ký tên lên tờ giấy bán chỉ còn lưu lại nét mực tuyệt đẹp của chị Mayami."
2308 = "Em ấy nói một cách dứt khoát, với giọng điệu vẫn còn hờn dỗi.\\nHai má đỏ ửng phồng lên vì không vui."
2310 = "Qua những kinh nghiệm từ việc phụ giúp cửa hàng đường sắt, xưởng rượu, hay các buổi tham quan,\\ncó vẻ cô ấy đã phần nào hiểu được giá trị đồng tiền hiện tại."
2312 = "Lại là một âm thanh kỳ lạ. Một tiếng thở dài.\\nHòa cùng với đó là một tiếng bộp."
2314 = "Chị ấy vẫn giữ nụ cười trên môi và tiếp tục hỏi."
2317 = "Thấy em ấy lớn lên trở thành một người tốt bụng và công bằng,\\nvới tư cách là anh trai nuôi, tôi cảm thấy rất vui."
2319 = "Nét bất an trên khuôn mặt cô ấy ngày càng đậm hơn."
2321 = "Khuôn mặt không có vẻ gì là đồng tình."
2322 = "Một tiếng thở phào nhẹ nhõm."
2325 = "Nếu tôi mở lời thế này ngay từ đầu,\\nthì có lẽ đã không phải để họ nghe những chuyện thừa thãi rồi."
2328 = "\\x%lキハ07;#00ffc040;KiHa 07%l;#; nhìn từ bên hông thì đối xứng hai bên——\\nCả đầu bên trái và đầu bên phải, đều có \\x%l運転台;#00ffc040;buồng lái%l;#;."
2331 = "Nếu đây là cái gọi là nghệ thuật đàm phán,\\nthì tôi đã hoàn toàn rơi vào bẫy của nó rồi."
2332 = "Có lẽ nhờ giải thích như vậy mà đã bật được công tắc nào đó,\\ngiọng nói của Paulette đã có sức lực trở lại."
2335 = "Nếu ông Taito không nhận nuôi tôi,\\ntôi đã không thể lớn lên ở thị trấn này."
2336 = "Nếu không đến thị trấn này, không gặp được những con người tốt bụng,\\nthì sự thù hận không lối thoát chắc chắn đã ăn mòn và giết chết trái tim tôi."
2345 = "Những ngón tay của Houshou Mototada\\nlật lật xấp tài liệu tôi đã đưa trước đó."
2346 = "Houshou Kisaki, từ lúc đó——từ khi còn nhỏ hơn bây giờ rất nhiều,\\nđã có thể thấu hiểu con người đến mức đó sao."
2349 = "Ra là vậy. Navi vẫn luôn tự động bay liên tục không ngừng nghỉ.\\nNhưng mà——đó tất nhiên là cách vận hành vốn dĩ không thể xảy ra rồi."
2350 = "Việc nói chuyện với người bề trên, người lớn tuổi hơn mà không dùng kính ngữ,\\ntôi hầu như chưa từng trải qua——à, không, ra là vậy."
2352 = "Là giọng nam hay giọng nữ,\\nđến việc đó cũng khó mà phán đoán."
2356 = "Tuyến chính và tuyến nhánh, \\x%l枕木;#00ffc040;tà vẹt đường ray%l;#; và \\x%lバラスト;#00ffc040;đá ba-lát%l;#; thì khỏi phải nói,\\ndọn dẹp chướng ngại vật, bảo dưỡng \\x%lポイント;#00ffc040;công tắc%l;#; và tín hiệu, v.v., nhiều không đếm xuể."
2359 = "Như muốn nói \"Quá khen\", Urakami khẽ cúi đầu.\\nThái độ từ đầu đến cuối không hề thay đổi của anh ta, khiến tôi nảy sinh một thắc mắc nhỏ."
2360 = "Như thể cảm thấy an tâm vì bản thân phải gánh vác trách nhiệm, Paulette thở phào một hơi."
2362 = "Cảm giác giống như khi nói chuyện với bố ngày xưa."
2363 = "Ở một khía cạnh nào đó, cỗ máy có trí tuệ ấy,\\ncòn hiểu rõ tôi hơn cả chính bản thân tôi."
2366 = "Niềm vui âm ỉ dâng lên, khiến lời nói của tôi trở nên chân thành hơn."
2369 = "Ra là vậy, sức lực trên vai tôi chợt buông lỏng.\\nBây giờ tôi mới nhận ra, mình đúng là một kẻ ngốc."
2371 = "Phù,\\nKisaki nở một nụ cười nhẹ nhõm."
2376 = "Giọng điệu tức giận chợt thay đổi. Hibiki lại xị mặt im lặng một cách khó chịu.\\nCó lẽ em ấy cũng đã lờ mờ đoán được câu chuyện sẽ đi theo hướng này."
2387 = "Một câu hỏi bất ngờ."
2390 = "Tôi vốn dĩ đã gây ra quá nhiều rắc rối rồi——\\nHơn nữa, tôi cũng chẳng còn dư dả để mà cố chấp như vậy."
2393 = "Ngay khi vừa đến cửa hàng đường sắt,\\nReina đã cúi đầu xin lỗi."
2395 = "Trước sự tức giận tột độ của Hibiki,\\ntôi đành phải giải thích sơ lược lại câu chuyện."
2397 = "Cố gắng lôi cảm giác đó ra,\\ntôi thử \"thẳng thắn\" xem sao."
2400 = "Tôi uống ngụm cà phê mà cô tiếp tân vừa mang ra."
2402 = "Tôi không thể nào thốt nên lời.\\nNhững câu như 『Em không thể gây rắc rối như vậy được』."
2404 = "Tôi kể lại. Không tô vẽ, không e dè.\\nRằng những cuộc gặp gỡ ở Ohimitera đã giúp tôi trưởng thành."
2407 = "Tôi tin chắc.\\nTôi có thể khẳng định điều đó."
2409 = "Không, vì ký ức cay đắng về vụ lùm xùm khi thừa kế tài sản của ông Taito,\\ngiọng nói của tôi trở nên lắp bắp, nghẹn lại."
2411 = "Vừa cúp máy,\\nđã nghe thấy tiếng bước chân lạch bạch đang tiến lại gần."
2413 = "Tôi nhận lấy vài tờ dự toán khổ A4.\\nSố lượng các hạng mục cần bảo dưỡng, ngay lập tức khiến tôi choáng ngợp."
2414 = "Câu chuyện bị đảo lộn thứ tự mất rồi sao."
2416 = "Định bụng chọc cười nên tôi mới nói vậy,\\nnhưng Hibiki lại tỏ ra vô cùng nghiêm túc."
2418 = "Tôi không hề có tự giác rằng mình đang bị đối xử như vậy.\\nCũng chẳng cảm thấy tức giận gì đặc biệt."
2421 = "Quả thực, nghe nói hầu hết chi phí của \\x%lエアクラ;#00ffc040;Aircra%l;#; bay\\nđều nằm ở Navi của \\x%lエアクラ;#00ffc040;Aircra%l;#;. Nhưng mà——"
2424 = "Chỉ cần nhìn vào những con số,\\nlập tức có thể đồng cảm với lý do tại sao giọng Paulette lại chùng xuống."
2425 = "Tôi nhận lấy bằng hai tay và xem qua."
2426 = "Phạm vi gánh nặng và sức ép công việc đè lên vai Paulette,\\nkhắc nghiệt đến nhường nào, tôi đang dần cảm nhận được điều đó."
2428 = "Vì vậy, tôi do dự.\\nTôi hoàn toàn không thể nhúc nhích, cũng không thể đưa ra phán đoán."
2429 = "Vì thế, một cách tự nhiên.\\nTôi cầm lấy cây bút được đặt ở đó——dù không ai đưa cho tôi."
2431 = "Tất cả mọi người đều im lặng đồng tình.\\nNếu phủ nhận điều đó——thì không có tư cách làm việc liên quan đến đường sắt."
2433 = "Tài sản thế chấp suy cho cùng,\\ncũng chẳng khác gì bốn chữ \"giá trị thanh lý\"."
2443 = "Cố gắng hết sức——chỉ có từ đó mới hiện lên trong đầu,\\nmột cái cúi chào vụng về nhưng đầy chân thành."
2446 = "Việc nâng cấp công suất kéo theo sự suy giảm về độ ổn định.\\nDo đó mới dẫn đến việc ngủ gật."
2453 = "Giống như an tâm, giống như cạn lời, hoặc cũng giống như thất vọng."
2455 = "Nếu đã không thể đọc thấu ý đồ của đối phương,\\nthì có giở trò tiểu xảo cũng vô ích."
2456 = "Ngân hàng cũng thu được tiền lãi,\\nnên chỉ cần thỏa hiệp được phần đó, mọi chuyện sẽ ổn thỏa."
2469 = "Hibiki cứ thế im lặng.\\nVà rồi, giọng nói của Paulette nhẹ nhàng vang lên."
2471 = "Phù, Hibiki thở phào một hơi dài nhẹ nhõm.\\nChị Mayami thì vẫn không hề thay đổi nét mặt."
2472 = "Phát ra một âm thanh khó mà phán đoán được,\\nHibiki quay ngoắt lại, nhìn chị Mayami như thể muốn bám víu."
2474 = "Hibiki giật nảy mình, cơ thể cứng đờ lại."
2479 = "Mặc dù đó là một lời chỉ trích gay gắt, nhưng Paulette cũng\\ngật đầu như đồng tình với lời của Hibiki."
2482 = "Dù vậy, em ấy vẫn không rời khỏi ghế mà tiếp tục lắng nghe.\\nSự chân thành đó, tôi cũng không định bỏ qua."
2484 = "Là một ông chú.\\nĐột nhiên, một ông chú bước vào phòng giám đốc chi nhánh."
2486 = "Là Houshou Kisaki. Cuộc họp gì đó đã kết thúc rồi sao——\\nHay là, cô ta đang canh thời gian."
2488 = "Huống hồ, lại còn là người ngoài Ohimitera,\\ncó lẽ đây là một đối tác đàm phán khó nhằn hơn cả Kisaki."
2507 = "Paulette vẫn giữ vẻ mặt khó hiểu, nhưng cũng khẽ gật đầu,\\nHibiki thì không nhúc nhích…… tiếp tục giữ khuôn mặt đăm chiêu."
2508 = "Gật đầu đáp lại lời Hachiroku, ánh mắt Paulette hướng về phía tôi."
2509 = "Giọng nói của Paulette đã lấy lại được chút sức sống."
2510 = "Trước lời nói của tôi, Paulette không dễ dàng gật đầu."
2511 = "Dù có nghĩ đến, nhưng chắc mọi người không thể nói ra thành lời.\\nPaulette và Hibiki cũng khẽ gật đầu như bị kéo theo."
2512 = "Tuy nhiên, trong giọng nói đáp lại ngay lập tức của Paulette,\\nlại không còn sự rành mạch như lúc nãy nữa."
2524 = "Urakami tháo kính ra một lần,\\nlau chùi bằng khăn một cách đầy lo lắng, rồi đeo lại."
2525 = "Giọng nói điềm đạm của Urakami."
2528 = "Nhờ câu trả lời của Urakami,\\nthắc mắc đơn giản đó đã được giải đáp một cách trọn vẹn."
2530 = "Urakami nhìn tôi qua lăng kính."
2532 = "Urakami Kazuki——viết là \"Hương Nguyệt\" mà đọc là Kazuki sao.\\nHửm? ——Không, đợi đã."
2540 = "Cả bàn tay và giọng nói đều không có chút sức lực nào.\\nĐể không bị kéo theo tâm trạng đó, tôi đáp lại một cách dõng dạc."
2542 = "Và rồi, ông Mototada nở một nụ cười nhếch mép,\\nnhư một con sư tử há to miệng ngay trước mắt tôi."
2547 = "Reina lại gật đầu một cái,\\nlần này còn mạnh hơn lúc nãy."
2549 = "Gật, gật, gật.\\nReina gật đầu hết lần này đến lần khác."
2552 = "Tất nhiên, đó chỉ là sự lo lắng thái quá.\\nVì vậy tôi cố tình cười khổ, thậm chí còn nhún vai cho họ thấy."
2557 = "Thế này là…… họp gia đình luôn rồi.\\nKhông có chỗ nào để phản kháng nữa."
2559 = "Nhìn vào hình vẽ cuối cùng,\\ntôi có thể xác nhận rằng mình đã hiểu đúng."
2562 = "Nhìn Hibiki đang tức giận thay cho mình,\\ntôi hơi lo lắng không biết có phải cảm giác của bản thân có chỗ nào đó bị lệch lạc rồi không."
2563 = "Tôi cảm thấy đây là một mối duyên bất ngờ, ở một nơi không ngờ tới."
2576 = "Chị Mayami chuẩn bị mọi thứ một cách trôi chảy,\\nvà nhanh thoăn thoắt viết thứ gì đó."
2579 = "Chị Mayami đang tức giận.\\nChỉ riêng sự thật đó thôi cũng đủ làm sống lưng tôi lạnh toát."
2581 = "Nụ cười tươi tắn thường ngày biến mất,\\nchị Mayami mang một vẻ mặt vô cùng bình thản."
2582 = "Cả tay, cơ thể lẫn nét mặt,\\nchị Mayami không hề cử động dù chỉ một chút."
2591 = "Nói dứt lời,\\nKisaki khẽ nhíu mày và nheo mắt lại."
2595 = "Chi nhánh Viễn Đông Công ty Aero-Craftech\\nQuản lý cấp cao phụ trách mặt bằng"
2597 = "Một giọng nói mạnh mẽ thốt ra gần như phản xạ.\\nTôi có thể cảm nhận được suy nghĩ thuần túy của Hibiki."
2604 = "Chỉ cười mỉm——\\nGiữ nguyên một khuôn mặt cười không thể đoán được cảm xúc."
2607 = "Bút lông, mực, và giấy bán chỉ."
2611 = "Cứ mãi để tâm đến chuyện nghĩa lý này nọ,\\nngười ghét điều đó nhất——hóa ra lại là tôi sao."
2616 = "Và tôi cũng không thể hỏi. Rằng 『Tại sao』.\\nNếu hỏi, tôi sẽ vô cùng thất lễ với chị Mayami."
2628 = "Bị nghe thấy mất rồi.\\nBiết thế không nên keo kiệt, gọi điện từ phòng mình thì hơn."
2642 = "Chính vì vậy, tôi muốn bảo vệ Ohimitera——\\nBảo vệ nguồn nước và con người của thị trấn này, không muốn chúng bị tổn hại."
2646 = "Nói xong, Hachiroku bắt đầu vẽ một sơ đồ cực kỳ đơn giản."
2647 = "Nói rồi, người đàn ông lịch sự đưa danh thiếp ra với phong thái thành thạo."
2652 = "Những tiếng nói tán thành liên tiếp vang lên."
2666 = "Tất cả những điều đó, nói cách khác đối với Reina,\\nchắc chắn chỉ là \"gánh nặng bị ép buộc\" mà thôi."
2667 = "Thậm chí chẳng có chỗ cho sự do dự trong câu trả lời,\\nđơn giản đến mức không giống một câu hỏi của chị Mayami."
2668 = "Thật đáng ngạc nhiên.\\nNếu vậy thì ông chú này, chính là Houshou Mototada sao."
2669 = "Trông có vẻ vô cùng lạc quẻ,\\nnhưng nếu nói là \"đậm chất ngân hàng\", thì lại thấy cũng khá hợp lý."
2670 = "Khi đó, chị Mayami mỉm cười hỏi tôi."
2671 = "Dù bị nói vậy, tôi vẫn khá bối rối."
2672 = "Cảm xúc còn lại ấy, tự nhiên tuôn trào khỏi khóe môi."
2673 = "Số tiền này——\\nđã vượt xa, vượt một cách áp đảo so với dự tính."
2674 = "Phòng giám đốc chi nhánh Ohimitera của Ngân hàng Kumamoto——\\nPhòng làm việc của Houshou Kisaki, rất rộng rãi và nhiều ánh sáng."
2675 = "Đến cả khuôn mặt của Hachiroku cũng bắt đầu xầm xì."
2676 = "Đến cả chị Mayami cũng tới rồi.\\nHơn nữa còn ngồi xuống luôn."
2680 = "Không phải là giọng điệu vui mừng vì được gặp lại."
2683 = "Tôi của lúc đó căm ghét tất cả, đố kỵ với tất cả——\\nNhưng lại không thể phát tiết ra ngoài, chỉ biết thu mình lại."
2686 = "Chuyện đó là đương nhiên. \\x%l自弁;#00ffc040;Van hãm tự động%l;#;・\\x%l単弁;#00ffc040;van hãm đơn%l;#;——\\nChỉ cần tháo tay gạt \\x%lブレーキ;#00ffc040;phanh%l;#; ra rồi mang sang đầu kia là được."
2690 = "Ông chủ tiệm rượu.\\nKhông phải là bố, mà là ông chủ tiệm rượu."
2695 = "Danh thiếp thì tôi chỉ mang theo danh thiếp của xưởng rượu nhà cha nuôi.\\nTôi đưa ra, đợi anh ta nhận lấy rồi nói tiếp."
2706 = "Chậm hơn một nhịp——hai nhịp,\\nmột giọng nói có vẻ hờn dỗi vang lên."
2707 = "Dù không phải giọng điệu vui mừng khi gặp lại, nhưng lời nói của Kisaki rất sảng khoái.\\nHoàn toàn không có sự e dè kỳ quặc nào, nên tôi cũng có thể thoải mái nói chuyện."
2708 = "Dù không thể đánh giá con người qua địa vị——\\nNhưng mà, một chủ tịch như thế này thì lại thân thiện quá mức rồi."
2709 = "Tại sao lại nhắc đến chuyện của Kisaki ở đây? Dù nghĩ vậy,\\nnhưng ký ức và khuôn miệng tôi không dừng lại ở sự nghi ngờ, mà thẳng thắn đưa ra câu trả lời."
2710 = "Dù giọng điệu thẳng thắn,\\nnhưng lại vang lên một cách xa cách."
2715 = "Trước lời đề nghị quá đỗi hào phóng này——"
2721 = "Tôi vừa gật đầu, vừa cảm thấy ngạc nhiên."
2724 = "（Đừng tô vẽ kỳ cục nữa. Hãy thành thật đi.\\nĐiều lấp đầy tâm trí tôi lúc này, đâu phải là nỗi lo về tiền bạc cơ chứ?）"
2729 = "（Hai trăm triệu yên——ngay cả với chị Mayami,\\nđó cũng không phải là số tiền có thể dễ dàng lấy ra được.）"
2733 = "（Là có tính toán, hay là sở thích của cô ta nhỉ——）"
2734 = "（Coi như đồ vật…… Ra vậy, coi như đồ vật sao.）"

