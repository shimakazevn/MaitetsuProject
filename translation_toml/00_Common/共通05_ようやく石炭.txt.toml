2448 = "「Cứ nhắc đến đường sắt là tôi lại say sưa như vậy đấy.」"
2450 = "「Vì vậy, đó là một cuộc chiến với chi phí cố định.」"
2452 = "「Đầu máy xe lửa là toa xe không có ghế hành khách, chuyên dùng để kéo \\x%l客車;#00ffc040;toa hành khách%l;#; hay \\x%l貨車;#00ffc040;toa chở hàng%l;#;.\\nChiếc \\x%l8620;#00ffc040;8620%l;#; của chị Hachiroku là đầu máy xe lửa chạy bằng hơi nước nên gọi là SL nhỉ.」"
2454 = "「Thiết (Sắt) nghĩa là “mất” “tiền”.\\nRa là vậy, kinh doanh đường sắt lại không có lãi đến mức đó sao.」"
2460 = "「Chia ra sao? Hừm.\\nBên trái là bộ Kim (金 - tiền/vàng). Bên phải là chữ Thất (失 - mất)——Ồ!」"
2462 = "「Chấn hưng du lịch sao.」"
2464 = "「Kỹ thuật cơ bản nhưng cũng là tối thượng để điều khiển \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;,\\nchính là 『Ném than』.」"
2467 = "「Những người đang cố gắng chống đỡ nền văn hóa đường sắt sau đợt Đại bãi bỏ,\\nchính là các tuyến đường sắt tư nhân ở các địa phương và những \\x%lまいてつ;#00ffc040;người sành toa xe%l;#; đấy.」"
2471 = "「Nếu vậy thì.」"
2472 = "「Chắc là người của hội \\x%lまいてつ;#00ffc040;Maitetsu%l;#; nhỉ. Đi cùng với \\x%lレイルロオド;#00ffc040;Railord%l;#; mà.」"
2474 = "「Là một nhân vật vĩ đại đấy. Cô ấy là người nổi tiếng nhất trong giới \\x%lまいてつ;#00ffc040;người sành toa xe%l;#; mà.」"
2478 = "「Đúng vậy nhỉ.」"
2481 = "「Chà, là gì nhỉ?\\nTôi cũng không đoán ra được.」"
2482 = "「Đúng vậy, ngài Soutetsu.\\nQuả thực——rất đáng nể.」"
2484 = "「Là của cả tôi và Reina.\\nCửa hàng đường sắt Ohimitera là lâu đài của chúng tôi mà.」"
2488 = "「Vâng. Nhưng mà, không phải vì thế……」"
2489 = "「Vâng ạ.\\nReina đã bảo dưỡng, và tắm rửa thật sạch sẽ rồi nha.」"
2493 = "「Đúng vậy ạ. Vì Reina là \\x%lディーゼル気動車;#00ffc040;toa xe diesel tự hành%l;#; mà.」"
2495 = "「Vâng. Tôi là \\x%lまいてつ;#00ffc040;người sành toa xe%l;#; của Reina và \\x%lキハ07;#00ffc040;KiHa 07%l;#;S.\\nĐồng thời, cũng là giám đốc của Công ty Cổ phần Đường sắt Ohimitera.」"
2501 = "「Đúng vậy. 『Đường sắt điện Hiroshima Mouri』 của công chúa nhà Mouri,\\nchính là điểm xuất phát của hệ thống tương trợ mang tên \\x%lまいてつ;#00ffc040;Maitetsu%l;#;.」"
2505 = "「Vâng. Bởi vì tôi vẫn chưa có Master.\\nTôi vẫn chưa có \\x%l機関士;#00ffc040;người lái tàu%l;#;.」"
2509 = "「Đúng vậy ạ, \\x%l電車;#00ffc040;tàu điện%l;#; nói chính xác thì là \\x%l気動車;#00ffc040;động cơ%l;#; điện.\\nNhưng mà, cái tên nghe như viết tắt \\x%l電車;#00ffc040;tàu điện%l;#; đó thực ra lại là tên chính thức đấy ạ.」"
2513 = "「Vâng. Vì dòng 8620 là một chiếc \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; rất đẹp,\\nnên tôi tin chắc nó có thể trở thành tâm điểm để chấn hưng du lịch.」"
2516 = "「Đúng vậy đó? Reina khỏe lắm nha.\\nVì vậy khi làm việc, bụng Reina sẽ rất là đói luôn.」"
2518 = "「Vâng! Nhưng mà,\\nanh lại hiểu rõ đến vậy……」"
2519 = "「Vâng! \\x%l交番検査;#00ffc040;Kiểm tra luân chuyển%l;#;, nghĩa là——a.」"
2524 = "「Vâng, \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của chiếc đầu máy số một\\n\\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; dòng \\x%l8620;#00ffc040;8620%l;#; thuộc \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;——đó chính là xuất thân của tôi.」"
2536 = "「Đây là \\x%l架線;#00ffc040;đường dây tiếp điện trên cao%l;#; sao.\\nTôi cứ tưởng đọc là Kasen chứ.」"
2538 = "「Sự bất ổn ở bộ phận chạy đó,\\nđang tạo thêm gánh nặng thừa thãi cho Reina sao?」"
2539 = "「Vậy sao ạ.」"
2540 = "「Là vậy, sao?\\nNhưng mà, đó thực sự là chuyện bình thường——a.」"
2541 = "「Vậy sao? Vậy thì, tôi xin phép.」"
2542 = "「Vậy sao? Những người đam mê đúng là tuyệt thật.」"
2543 = "「Vậy sao. Tôi vẫn chưa hình dung được rõ lắm.」"
2544 = "「Đúng vậy đó, anh Soutetsu.\\nThứ Reina vừa uống, là cơm của Reina——」"
2548 = "「Ga bỏ hoang Kinoshita, đi qua tốt nha.」"
2551 = "「Quả nhiên! Anh Soutetsu……à không, anh Soutetsu cũng là\\n\\x%lまいてつ;#00ffc040;người sành toa xe%l;#; nhỉ! Đến mức đó mà anh cũng hiểu được.」"
2553 = "「Gasen?」"
2559 = "「Không sao,\\nviệc khôi phục lại sự chậm trễ của \\x%l列車;#00ffc040;đoàn tàu%l;#; đương nhiên là ưu tiên hàng đầu mà.」"
2561 = "「Không sao đâu, chị Paulette.\\nToa xe hoàn toàn bình thường đó nha.」"
2562 = "「Không ngờ lại có thể……được gặp gỡ \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của chiếc đầu máy số một đầy vinh quang đó……\\nThật là vui quá.」"
2572 = "「Thị trưởng Paulette.」"
2573 = "「Paulette, xin lỗi nhưng tôi muốn nhờ cô giúp một tay.」"
2574 = "「Chị Paulette, có tín hiệu kìa?」"
2576 = "「\\x%l現示;#00ffc040;Tín hiệu hiển thị%l;#; chú ý, tốt. \\x%l制限;#00ffc040;Giới hạn tốc độ%l;#; 40, tốt nha.」"
2580 = "「Số tiền chi phí cần thiết để thu về 100 yên doanh thu,\\nđược gọi là hệ số kinh doanh——」"
2582 = "「Than đá sao?\\nA! A——à vâng! Có ạ!」"
2587 = "「Chúng tôi gọi đó là——\\x%l就業後検査;#00ffc040;kiểm tra sau ca làm việc%l;#;.\\nVì không thể thực hiện \\x%l交番検査;#00ffc040;kiểm tra luân chuyển%l;#;, nên mỗi lần xong việc đều phải làm rất tỉ mỉ.」"
2589 = "「Reina không mệt đâu nha.」"
2591 = "「Bây giờ thì đúng là vậy. Nhưng mà, Reina nha.\\nVốn dĩ ban đầu là \\x%l気動車;#00ffc040;động cơ%l;#; xăng đó ạ.」"
2594 = "「Thậm chí còn có những nhân viên cười cợt rằng 『Một là tàu tốc hành, hai là tàu nhanh. Ba bốn không có, năm mới đến hành khách』——nên bị ruồng bỏ cũng chỉ trong chớp mắt thôi.」"
2597 = "「Hiện tại, chúng tôi đã xác nhận thiết bị cần cứu hộ đã phục hồi.\\nSau khi tiếp nhận người cần cứu hộ, \\x%l列車;#00ffc040;đoàn tàu%l;#; này sẽ khởi hành ngay.」"
2601 = "「Đáng nể thật.」"
2606 = "「Gánh nặng chi phí cố định nặng nề và khổ sở đến mức đó đấy.\\nKinh doanh đường sắt, luôn là một cuộc chiến với chi phí cố định.」"
2610 = "「Giám đốc sao.\\nHèn chi cô lại rành về chuyện kinh doanh đến vậy.」"
2614 = "「Bởi vì, để thành công với tư cách là một “doanh nghiệp” đường sắt,\\nthì quy mô lớn gần như là điều kiện bắt buộc.」"
2616 = "「Không thể nào——lại ngủ gật trong lúc đang lái tàu thế này.」"
2623 = "「Và những người yêu đường sắt, vì để \\x%l列車;#00ffc040;đoàn tàu%l;#; của mình được chạy,\\nhọ sẽ không tiếc tiền bạc đâu.」"
2626 = "「Có thể say mê đến mức đó, ngược lại còn là ưu điểm đấy chứ.\\nSay mê nhưng vẫn không quên để ý đến xung quanh, thế là tuyệt rồi.」"
2627 = "「Chúng ta có thể nói chuyện ở đây cũng là một cái duyên.\\nTôi đang nghĩ xem liệu những người thuộc phe phản đối có thể hợp tác với nhau ở điểm nào không.」"
2633 = "「Bất ổn ở bộ phận chạy.」"
2635 = "「Uống một lượng khá lớn sao?」"
2640 = "「Chi phí bảo trì thiết bị, phí sửa chữa, phí nhiên liệu, chi phí nhân công, thuế và nhiều thứ khác nữa.\\nĐường sắt tốn quá nhiều chi phí cố định.」"
2641 = "「Nhân tiện, anh Soutetsu,\\nanh trở về Ohimitera có việc gì vậy ạ?」"
2642 = "「Chuyện đó thì……tôi cũng nghĩ là vậy.」"
2643 = "「\\x%l電車;#00ffc040;Tàu điện%l;#; là thứ không có đường dây điện thì không chạy được đúng không?\\nKinh phí để lắp đặt đường dây điện trên toàn tuyến chẳng phải sẽ rất khủng khiếp sao?」"
2644 = "「Xin cứ tự nhiên, bao nhiêu tùy thích.\\nChỗ chúng tôi vẫn luôn để đó mà không dùng đến mà.」"
2645 = "「Cho \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; chạy ở Ohimitera sao?」"
2660 = "「Toa xe cũng là do họ tự phát triển và sở hữu.\\nSau đợt Đại bãi bỏ, công chúa nhà Mouri đã ban tặng chúng.」"
2661 = "「Toa xe cũng có nhiều loại nhỉ.\\nĐộng lực thì có hơi nước, diesel, điện, vậy là hết rồi sao?」"
2662 = "「\\x%l交番検査;#00ffc040;Kiểm tra luân chuyển%l;#;?」"
2666 = "「Vất vả cho em rồi, Reina.」"
2679 = "「Chuyện——này là sao.」"
2680 = "「Chuyện đó là sự thật. \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;, với tính chất là đường sắt quốc gia,\\nvốn dĩ đã có cơ cấu chấp nhận điều đó rồi.」"
2682 = "「Là máy tập ném than.\\nNgài hãy kéo xích để mở \\x%lカマ;#00ffc040;lò hơi%l;#; ra, rồi nhìn vào bên trong xem.」"
2684 = "「Đây là sở thích của Paulette sao?」"
2685 = "「Vậy là đủ rồi. Sự trỗi dậy của \\x%lエアクラ;#00ffc040;Aircra%l;#;. Đại bãi bỏ.\\nNgay cả \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; cũng bị giải thể, đường sắt đang trên đà suy thoái.」"
2687 = "「Họ nghĩ ra cách hay thật đấy. Không có đường ray thì \\x%l列車;#00ffc040;đoàn tàu%l;#; chỉ là vật trang trí.\\nHơn nữa, không bảo dưỡng thì cũng không chạy được.」"
2689 = "「Đây là, bãi tập ném than.」"
2690 = "「Xin thông báo đến quý hành khách. Cảm ơn quý vị đã hợp tác\\ntrong việc dừng khẩn cấp dù đang vội.」"
2697 = "「Đi qua \\x%l延;#00ffc040;trễ%l;#; 950 giây. Reina?」"
2699 = "「Trông em có vẻ đô con nhỉ.」"
2715 = "「Chuyện đó……thỉnh thoảng Reina cũng bị quá tải xử lý.\\nDo ảnh hưởng của việc cải tạo——làm tăng công suất của toa xe.」"
2716 = "「À……lối này ạ.\\nỪm, tôi cũng——muốn nói chuyện với anh.」"
2717 = "「À ừm……à ừm…………cảm ơn anh.」"
2718 = "「À ừm, chị Hachiroku……tôi——」"
2719 = "「À ừm, chúng ta đang nói về \\x%lまいてつ;#00ffc040;người sành toa xe%l;#; nhỉ.\\nVì những lý do đó, mạng lưới đường sắt đã trở nên tan nát.」"
2721 = "「À ừm, xin lỗi vì đã bỏ mặc cậu Soutetsu——\\nanh Soutetsu, chủ nhân của chị ấy.」"
2722 = "「Đó là, tiếng Pháp sao?」"
2725 = "「Nếu được vậy thì KiHa 07 cũng có thể luân chuyển được rồi.\\nVề phí sử dụng toa xe, khi nào có lãi tôi sẽ thanh toán đàng hoàng.」"
2726 = "「Vậy thì, bắt đầu với 100 xẻng để khởi động nhé.\\nChúng ta bắt đầu luyện tập ném than thôi!!」"
2727 = "「Nếu vậy, Hachiroku.\\nTôi sẽ trở thành \\x%l機関士;#00ffc040;người lái tàu%l;#; của cô.」"
2729 = "「Vậy thì, chắc là người quen của thị trưởng rồi.」"
2730 = "「Nếu vậy, Paulette cũng là \\x%lまいてつ;#00ffc040;người sành toa xe%l;#; nhỉ?」"
2732 = "「Vậy thì, cô Paulette.」"
2733 = "「Vậy thì, ngài Soutetsu.\\nVề yêu cầu của cô Paulette thì——」"
2739 = "「Về sự suy thoái của đường sắt sau đợt Đại bãi bỏ,\\nanh biết rồi chứ?」"
2740 = "「Hủy bỏ giới hạn, tốt nha.」"
2742 = "「Tuy đã trở nên vô ích do sự phổ biến của \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nnhưng \\x%l電車;#00ffc040;tàu điện%l;#; đáng lẽ đã trở thành con át chủ bài để cắt giảm chi phí cố định.」"
2744 = "「Ngài Soutetsu. Xin hãy thử chia chữ “Thiết” (鉄)\\nthành bộ thủ bên trái (偏) và phần bên phải (旁) xem sao.」"
2745 = "「Đường sắt điện, sao? Không chỉ là cái tên thôi chứ?」"
2752 = "「Ăn cơm ở một nơi sạch sẽ, với một cơ thể sạch sẽ,\\nthì sẽ thấy ngon hơn rất nhiều đó nha.」"
2758 = "「!」"
2760 = "「! \\x%l現示;#00ffc040;Tín hiệu hiển thị%l;#; chú ý, tốt! \\x%l制限;#00ffc040;Giới hạn tốc độ%l;#; 40, tốt!」"
2763 = "「!?」"
2764 = "「Xẻng \\x%l投炭;#00ffc040;ném than%l;#; loại 1kg.\\nỞ hiện trường thường được gọi là Wansuko (One-scoop).」"
2770 = "「8620. \\x%l蒸気機関車;#00ffc040;Đầu máy hơi nước%l;#; sản xuất hàng loạt trong nước đầu tiên.」"
2773 = "「~~~////」"
2950 = "Một \\x%l編成;#00ffc040;đoàn tàu%l;#;——hay nói đúng hơn, chiếc xe tôi vừa thấy và ngồi lên chỉ có một toa duy nhất."
2956 = "Một sự nhẹ nhõm kỳ lạ, khiến lời nói của tôi trở nên trôi chảy hơn."
2958 = "Không.\\nCả Reina nhỏ con hơn Hachiroku, lúc nãy cũng——"
2960 = "Không cần cô ấy cất công giải thích,\\nchỉ cần nói chuyện năm phút là tôi hiểu ngay. Nhưng——"
2961 = "Gọi là đi chệch hướng chứ không phải trật bánh,\\nPaulette ngồi lại đàng hoàng sau khi vừa nhổm người lên."
2964 = "Không hiểu sao Paulette lại tỏ vẻ tự hào."
2968 = "Nhưng Hachiroku không hề ngạc nhiên,\\ncô ấy lắng nghe giọng của Paulette với dáng vẻ như đã quen với điều đó."
2969 = "A, nhưng mà, có từ gọi là \\x%l編成;#00ffc040;đoàn tàu%l;#; một toa không nhỉ?\\nNếu vậy thì dù chỉ có một toa, nó vẫn là một \\x%l編成;#00ffc040;đoàn tàu%l;#;, một \\x%l列車;#00ffc040;chuyến tàu%l;#;——có lẽ là có."
2971 = "Không phải là lời khen ngợi, mà là giọng điệu mỉa mai.\\nHachiroku đang tức giận một cách rất tĩnh lặng."
2977 = "Lý do khiến tôi có những liên tưởng không phù hợp đến mức tự mình cũng phải giật mình,\\ncó lẽ là vì vẻ đẹp tựa như nàng công chúa ngoại quốc của Paulette."
2979 = "Nghĩa là, hiện tại đang kinh doanh thua lỗ sao."
2991 = "Tận dụng diện tích đất đường sắt rộng lớn để phát triển khu vực xung quanh.\\nKinh doanh khách sạn, du lịch, và bách hóa tại các \\x%lターミナル駅;#00ffc040;ga đầu mối%l;#;."
2993 = "Kết thúc thông báo, cô ấy khẽ cúi chào.\\nPaulette lập tức tiến về ghế lái ở phía đầu toa xe."
2994 = "Bằng một động tác thành thạo, em ấy mở nắp bình,\\nvà một cách đầy sảng khoái——Reina uống cạn thứ bên trong."
2996 = "Nhưng mà——."
2998 = "Nhưng, có chút đáng tiếc."
3002 = "Kính ngữ “gặp gỡ”——Paulette, một con người,\\nlại đang dùng nó với Hachiroku, một đồ vật."
3007 = "Như muốn nói rằng không cần phải lo lắng,\\ntay Paulette vuốt ve Reina thật dịu dàng."
3017 = "Hachiroku vẫn luôn im lặng."
3019 = "Từ Hachiroku cho đến Paulette,\\nphải chăng những người liên quan đến đường sắt đều thích giải thích?"
3021 = "Hachiroku không nói gì.\\nNếu vậy thì hiện tại, tôi cũng không nghĩ mình nên nói gì thêm."
3022 = "Đang định nói là cuồng, thì cô ấy sửa lại thành fan.\\nTôi cũng hiểu được sự tinh tế đó của Hachiroku."
3026 = "Hachiroku và Paulette.\\nHai người nhìn nhau, và trong chốc lát, họ gật đầu đồng tình."
3027 = "Hachiroku nâng chiếc xẻng Wansuko lên."
3030 = "Hachiroku đã hiểu và giao phó cho tôi.\\nVậy thì tôi sẽ khéo léo lèo lái luôn cả cơn giận của Hachiroku."
3033 = "Giọng nói điềm tĩnh.\\nNhưng chỉ bấy nhiêu thôi cũng đủ khiến má Paulette ửng đỏ."
3034 = "Hachiroku đón nhận ánh nhìn đó với khuôn mặt điềm tĩnh,\\nvà khẽ gật đầu một cái."
3035 = "Thể chế mà Hachiroku kể, dường như đã sụp đổ trong chớp mắt\\ndo sự sụt giảm nghiêm trọng nhu cầu ở khu vực thành thị đi kèm với sự xuất hiện của \\x%lエアクラ;#00ffc040;Aircra%l;#;."
3040 = "Là ông Taito cất công mang đến mà."
3042 = "Dấu chấm than.\\nHachiroku đã biến nó thành âm thanh."
3044 = "Tay Hachiroku bốc một viên than lên và vuốt ve.\\nKhóe miệng, với ánh mắt như sắp rớt dãi đến nơi."
3045 = "Ánh mắt Hachiroku hướng về phía sau."
3047 = "Sự gay gắt đã biến mất khỏi giọng nói của Hachiroku.\\nHoặc là đã được kìm nén, che giấu một cách hoàn hảo."
3049 = "Hachiroku mỉm cười.\\nMột nụ cười rạng rỡ và lộng lẫy."
3051 = "Hachiroku lại tiếp tục nhai nhóp nhép.\\nNhư thể muốn nói rằng, những gì cần nghe thì đã nghe xong rồi."
3054 = "Tiếng thì thầm nhỏ nhẹ của Hachiroku,\\nnhưng lại chứa đựng một sức nặng đáng kể."
3056 = "Hachiroku chỉ tiếp tục giữ khuôn mặt điềm tĩnh\\nvà giao phó mọi thứ cho tôi."
3057 = "Hachiroku đang làm ra vẻ mặt điềm tĩnh,\\nnhưng chính vì vậy mà tôi càng thấy có lỗi."
3068 = "Lại là giọng điệu của giáo viên."
3069 = "Khi quay lại, trên tay cô ấy\\nđang cầm một chiếc xẻng vuông hơi quá khổ so với thân hình."
3072 = "Giọng điệu lạnh lùng.\\nSự im lặng nặng nề."
3082 = "Chúng tôi đến ga suối nước nóng Ohimitera."
3089 = "Mặc dù \\x%lレイルロオド;#00ffc040;Railord%l;#;, Reina đang ngủ,\\nnhưng sự mượt mà trong thao tác lái của Paulette vẫn không hề thay đổi."
3093 = "Ra là vậy, nghe cũng không tồi."
3095 = "Trên đùi Paulette đang ngồi,\\ncơ thể Reina ngả ra trông rất thoải mái."
3104 = "Nếu có thể quảng bá mạnh mẽ hình ảnh “Ohimitera - Thành phố của nước, thành phố của suối nước nóng”,\\nthì đương nhiên điều đó sẽ dẫn đến sự phản đối mạnh mẽ đối với việc thu hút nhà máy."
3105 = "Nhặt chiếc xẻng nhỏ dùng làm vườn lên,\\nHachiroku xúc một đống than với tư thế tuyệt đẹp."
3106 = "Cô ấy nhét cả viên than vào cái miệng nhỏ xíu.\\nHơn nữa còn liên tục nhét những viên lớn."
3110 = "Chắc không phải do đã ăn no nên bình tĩnh lại đâu,\\nnhưng phong thái của Hachiroku rất chững chạc, thậm chí còn toát lên vẻ thanh lịch."
3113 = "Động tác của chiếc xẻng bên tay phải không hề dừng lại,\\ntay còn lại uyển chuyển nắm lấy sợi dây xích mảnh và kéo xuống."
3116 = "Giống hệt như lúc mới gặp,\\nPaulette bắt đầu tỏ ra vô cùng ngượng ngùng."
3118 = "（Xình xịch————）"
3119 = "Gu thẩm mỹ tốt thật.\\nKhoảnh khắc bước chân vào, tôi đã nghĩ như vậy."
3123 = "À, ra là vậy. Hachiroku từng tự nhận mình là thiếu nữ.\\nNếu vậy thì chắc chắn cô ấy không muốn vòi vĩnh đồ ăn rồi."
3129 = "Cánh cửa hình tròn bật mở,\\nHachiroku hất than bay thẳng vào bên trong."
3130 = "Đối với những kiểm tra được thực hiện mà không cần gửi đến \\x%l車輌工場;#00ffc040;nhà máy chế tạo toa xe%l;#;,\\nthông thường, chỉ cần hai loại đó là đủ và cần thiết."
3134 = "Từng động tác không hề có chút ngập ngừng.\\nPaulette trông còn giống một cỗ máy chính xác hơn cả Reina."
3136 = "Trước khi tôi kịp nhận ra mình nói thiếu ý,\\nPaulette đã trả lời với vẻ mặt có phần vui vẻ."
3139 = "Trước một thiết bị có cửa mở hình tròn,\\nnhững viên than đen nhánh đã được xếp lại thành một đống gọn gàng."
3140 = "Vào thời kỳ hoàng kim của đường sắt,\\ncác \\x%lレイルロオド;#00ffc040;Railord%l;#; cũng từng hướng dẫn cho các ứng viên \\x%l機関士;#00ffc040;người lái tàu%l;#; sao?"
3144 = "Cho đến khi ra khỏi khu vực không thể bay, \\x%l列車;#00ffc040;đoàn tàu%l;#; vẫn đang phải kéo theo chiếc \\x%lエアクラ;#00ffc040;Aircra%l;#; của tôi ở phía sau\\n——Một vật thể lạ."
3149 = "Một giọng nói mạnh mẽ.\\nSự dao động cảm xúc đã hoàn toàn lắng xuống."
3163 = "Chắc họ tưởng mình đang nói thì thầm,\\nnhưng tôi nghe thấy hết không sót chữ nào."
3166 = "Ngập ngừng.\\nMột sự im lặng như cố tình tạo sự tò mò."
3169 = "Cô ấy lẩm bẩm như đang nói một mình."
3171 = "Một chiếc bình tông cũ kỹ."
3173 = "Động tác lấy tay trái che miệng,\\nlại càng làm cho âm thanh nhai vỡ trở nên ấn tượng mạnh mẽ hơn."
3174 = "Một âm thanh như thể con cóc bị con ếch bóp cổ đến chết."
3175 = "Một khuôn mặt ngạc nhiên từ tận đáy lòng."
3176 = "Một tiếng nhỏ.\\nNhư thể vừa nhận ra điều gì đó. Hay như thể vừa bừng tỉnh."
3179 = "Cô ấy cũng cho tôi biết thêm \\x%lDL;#00ffc040;DL%l;#; là \\x%lディーゼル機関車;#00ffc040;đầu máy diesel%l;#;,\\nvà \\x%lEL;#00ffc040;EL%l;#; là \\x%l電気機関車;#00ffc040;đầu máy điện%l;#;."
3180 = "Phần gáy đỏ bừng kia,\\nchỉ trong chốc lát đã trở lại trắng trẻo như cũ."
3182 = "Phù——một tiếng thở dài thật thườn thượt.\\nChờ cô ấy thở hắt ra xong, tôi mới trả lời câu hỏi."
3184 = "Reina nhìn trang phục của mình,\\nvà Paulette đang làm ghế ngồi cho em ấy với vẻ mặt vui sướng."
3185 = "Khuôn mặt đầy vẻ nghi hoặc.\\nCó lẽ tôi nên giải quyết hiểu lầm này một cách đàng hoàng."
3187 = "Nếu không có những lợi ích phụ trợ đó,\\nđường sắt sẽ không thể tồn tại được, Paulette than thở."
3190 = "Nếu đó là một trong những gánh nặng của Paulette,\\nthì việc giúp một tay, theo nghĩa đó, cũng có thể coi là hỗ trợ cho phong trào phản đối."
3195 = "Chuyển nhượng toa xe và \\x%lレイルロオド;#00ffc040;Railord%l;#; nguyên trạng cho các cá nhân."
3197 = "Câu đố kèm theo nụ cười gượng của Paulette,\\ntôi hoàn toàn không hiểu được."
3206 = "Với kích thước của Hachiroku mà đã thế này.\\nBản thân \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; sẽ còn ngốn bao nhiêu than đá nữa đây."
3209 = "Ngay khoảnh khắc đó, như chợt nhận ra điều gì,\\nPaulette đang rướn người về phía trước vội vàng ngồi thẳng lưng lại."
3221 = "Kiếm được khoản lợi nhuận lớn từ các tuyến đường có lãi quanh Đế đô và các thành phố lớn, cùng với các hoạt động kinh doanh phụ trợ,\\ntừ đó hỗ trợ cho các tuyến đường thua lỗ ở địa phương, và duy trì mạng lưới đường sắt."
3227 = "Là sở thích về đường sắt. Không cần phải nói.\\nNhưng——cách bài trí lại rất sành điệu."
3237 = "Rất dễ để tưởng tượng ra có lý do nào đó đằng sau,\\nnên theo như ý muốn ngoài lời nói của Hachiroku, hiện tại tôi sẽ chuyển chủ đề."
3239 = "Đơn giản phải không? Ánh mắt của Hachiroku như muốn nói vậy."
3240 = "Kể từ khoảnh khắc lên \\x%l列車;#00ffc040;đoàn tàu%l;#; và bắt đầu di chuyển,\\ncô ấy đã ngậm miệng lại, thay vào đó là mở to đôi mắt."
3267 = "Có rất nhiều điều tôi muốn hỏi Paulette,\\nnhưng vậy thì, hãy bắt đầu từ chuyện đó trước."
3268 = "Tôi sực nhớ ra.\\nHay đúng hơn là tôi nên hỏi sớm hơn mới phải."
3275 = "Sự kinh ngạc vô tình thốt ra của tôi,\\nđược Hachiroku khiêm tốn tiếp nhận."
3277 = "Ngay từ đầu tôi đã biết Hachiroku không phải là đồ vô giá trị——\\nNhưng không ngờ lại được đánh giá là “một cỗ máy tầm cỡ như vậy”."
3279 = "Nơi Paulette vừa đảo mắt nhìn sang,\\ncánh cửa sau của cửa hàng đường sắt hé mở."
3281 = "Vừa nghĩ vậy, Reina đã vươn vai một cái thật lớn."
3283 = "Tôi nắm lấy chiếc xẻng một cách dứt khoát.\\nBởi vì đó là nghĩa vụ đương nhiên của tôi."
3286 = "Qua lời của Paulette, tôi đã hiểu.\\nĐiện khí hóa, tức là thay thế \\x%l列車;#00ffc040;đoàn tàu%l;#; bằng \\x%l電車;#00ffc040;tàu điện%l;#; sao."
3288 = "Mùi dầu không quá gắt.\\nDầu diesel, có lẽ là nhiên liệu của Reina."
3290 = "Hoặc có lẽ con người Paulette là vậy,\\ncăng thẳng trong việc công, và thư giãn trong việc tư. Chắc là tính cách như thế."
3292 = "Chắc hẳn cô ấy đã dự đoán trước câu hỏi của tôi.\\nMột câu trả lời trôi chảy được đưa ra trước cả khi tôi kịp hỏi."
3293 = "Có lẽ vì sự thoải mái trên đường về nhà,\\ncác học sinh đang trò chuyện với nhau rất vô tư."
3296 = "Tetsu nghĩa là người cuồng đường sắt. Và,\\nnhững Tetsu sở hữu “My đường sắt” chính là——“\\x%lまいてつ;#00ffc040;Maitetsu%l;#;” sao."
3302 = "Khuôn mặt vừa ngẩng lên lại cúi xuống.\\nThị trưởng tiền nhiệm——nhắc mới nhớ, cha của Paulette đã qua đời vì bệnh tật."
3306 = "Rồi cô ấy lại cúi gập cái lưng vừa nắn thẳng, cúi đầu thật sâu về phía tôi."
3308 = "Giảm tốc khi đến gần ga bỏ hoang, đi qua đó, rồi lại tăng tốc."
3316 = "Vừa là thị trưởng vừa là giám đốc sao. Thật đáng nể.\\nChắc hẳn gánh nặng cũng rất lớn."
3319 = "Trong tình hình có thể xảy ra ảnh hưởng bất cứ lúc nào,\\nchắc chắn họ cần phải tập trung cao độ hơn nữa."
3321 = "Có lẽ vì quá thán phục,\\nmà đôi má của Hachiroku cũng ửng đỏ."
3323 = "Chắc hẳn cô ấy muốn nhanh chóng đổi chủ đề.\\nMột câu nói có vẻ luống cuống, khiến tim tôi đập thình thịch."
3326 = "Theo lời Hachiroku, đường ray đang ở trong tình trạng tồi tệ,\\nvà hành khách sẽ phải chịu chấn động lớn——"
3329 = "Đang lúc bối rối, tôi nhìn sang Hachiroku,\\nmột giọng nói kìm nén nhẹ nhàng đưa ra lời giải vây."
3330 = "Như thể hoàn toàn biến thành một người khác so với lúc nói chuyện với tôi,\\ncách nói chuyện của cô ấy rõ ràng và đầy uy nghiêm."
3334 = "Không hề ngập ngừng, không hề do dự.\\nVì thế không có động tác thừa, rất đẹp mắt."
3358 = "Hachiroku liên tục đưa ra những bình luận cực kỳ điềm tĩnh,\\nnhưng không hiểu sao Paulette lại nhìn cô ấy bằng ánh mắt bối rối."
3359 = "Là với tư cách thị trưởng, hay giám đốc——\\nPaulette có vẻ đã bước vào chế độ chuyên nghiệp."
3360 = "Paulette lại nhìn Hachiroku."
3361 = "Paulette viết chữ lên giấy.\\nMột nét chữ đẹp đến mức không thể tưởng tượng được từ vẻ ngoài mang phong cách phương Tây của cô ấy."
3362 = "Tôi gọi Paulette sau khi cô ấy hoàn thành công việc soát vé và nói rằng có chuyện muốn nói,\\nPaulette dặn dò Reina điều gì đó rồi lập tức bước đi."
3363 = "Hướng về phía hành khách, giọng của Paulette vang lên."
3364 = "Một cái gật đầu nhẹ nhàng.\\nPaulette khẽ mỉm cười."
3365 = "Lời phụ họa như thể đọc được suy nghĩ của tôi, khiến tôi trong chốc lát,\\nphải giật mình."
3366 = "Paulette vỗ vỗ lên đầu gối mình một cách rất tự nhiên."
3367 = "Paulette lập tức khựng lại, miệng vẫn giữ nguyên hình chữ \"a\".\\nRồi, cô ấy chuyển ánh nhìn sang Hachiroku."
3368 = "Một giọng nói nhẹ nhàng."
3369 = "Gật đầu.\\nMột cái gật đầu đầy vẻ hài lòng."
3370 = "Khuôn mặt Paulette nhanh chóng cúi gằm xuống,\\nvà cô ấy bắt đầu lẩm bẩm điều gì đó."
3371 = "Paulette đang chăm chú ghi chép,\\ncòn Reina không hiểu sao lại nhìn tôi bằng ánh mắt thương hại."
3372 = "Giọng điệu của Paulette như một giáo viên.\\nRất rõ ràng và dễ hiểu."
3373 = "Giọng nói điềm tĩnh như đang đọc từ điển.\\nNhưng đôi má của Paulette lại đỏ bừng lên trông thấy."
3374 = "Mỉm cười nhìn Hachiroku,\\nPaulette thả Reina xuống khỏi đùi và đứng dậy."
3375 = "Paulette khẽ liếc nhìn Hachiroku."
3376 = "Phù……một hơi thở dài và nóng hổi."
3377 = "Vâng, Paulette gật đầu."
3383 = "Một tiếng thở dài nóng hổi.\\nRồi, cô ấy cứ ngập ngừng."
3386 = "Vô số các món đồ liên quan đến đường sắt, không quá ngăn nắp cũng không quá lộn xộn,\\nthu hút cả ánh nhìn của một kẻ chẳng quan tâm gì đến đường sắt như tôi."
3391 = "Và Hachiroku dừng việc ăn uống lại,\\nbắt đầu dỏng tai lên nghe ngóng."
3392 = "Rồi trông có vẻ rất ngon miệng,\\nem ấy dùng ngón tay lau khóe môi, và cả miệng bình."
3393 = "“Nếu vậy thì, bắt đầu theo thứ tự nhé”,\\nPaulette bắt đầu giải thích cho tôi."
3394 = "Trong chớp mắt, biểu cảm đó\\nđã được thay thế bằng một niềm vui mãnh liệt."
3399 = "Rồi em ấy cẩn thận cất chiếc bình tông đi."
3403 = "Reina và Paulette, hai người cùng chỉ tay, \\x%l喚呼;#00ffc040;hô xác nhận%l;#;\\nđể kiểm tra chéo các biển báo, tín hiệu mà tôi không thể đọc được."
3405 = "Ánh mắt của Reina hướng về phía Paulette."
3408 = "Đột nhiên Reina,\\nvừa chỉ vào khuôn mặt non nớt của mình vừa lên tiếng."
3410 = "Reina lạch bạch chạy tới——Ồ!"
3411 = "Lúc này, để không làm phiền việc lái tàu,\\ncô ấy đang cố gắng, cố gắng chịu đựng."
3416 = "——Đâu chỉ mình tôi, có lẽ Paulette ở \\x%l運転台;#00ffc040;buồng lái%l;#; cũng nghe thấy rồi.\\nPhần gáy lộ ra từ bộ đồng phục của cô ấy đã đỏ bừng lên."
3419 = "Cá nhân sẽ tự chịu trách nhiệm duy trì và bảo dưỡng chúng,\\nđổi lại, họ sẽ có được quyền sử dụng đường ray."
3420 = "Những chuyện như tai nạn va chạm——\\nTất nhiên là tôi tuyệt đối không muốn chứng kiến rồi."
3421 = "Nhưng, Paulette đương nhiên,\\nchỉ đang trả lời câu hỏi của Hachiroku thôi."
3423 = "Quả thật, trông em ấy không khác gì đang ngủ.\\nVà Paulette cũng có vẻ coi đó là chuyện đương nhiên."
3424 = "So với Hachiroku đang dùng bữa sau một thời gian dài,\\nthì Paulette đang đứng nhìn có vẻ còn vui sướng hơn."
3427 = "Nói rất đúng.\\nSự đồng nhất và lộn xộn hệt như một hộp đồ chơi."
3429 = "Quả thực, điều này rất thú vị."
3431 = "Một lâu đài đồ chơi tưởng chừng như sắp bị hiện thực phá vỡ.\\nNàng công chúa và em gái đang tuyệt vọng bảo vệ nơi đó."
3433 = "Nhìn đống than đá cứ thế biến mất trong chớp mắt,\\nthì dù muốn hay không tôi cũng phải thừa nhận."
3446 = "Tốc độ cảnh vật lướt qua cửa sổ nhanh hơn.\\nNhưng, hầu như không cảm nhận được chấn động nào."
3452 = "Chờ cô ấy ngồi xuống, Reina chỉ tay xác nhận, rồi \\x%l喚呼;#00ffc040;hô xác nhận%l;#;."
3455 = "Một lúc sau, giọng nói rụt rè của Paulette\\nlàm rung động bầu không khí."
3460 = "Nhưng đó là một tình huống vốn dĩ không thể xảy ra,\\ngiọng nói đầy gay gắt của Hachiroku đã nói lên điều đó."
3462 = "Câu hỏi có lẽ cũng giống với Hachiroku,\\ntất nhiên, cũng là câu hỏi của chính tôi."
3480 = "Thấy tôi đã hiểu, Paulette và Hachiroku\\nđồng loạt nở nụ cười vui vẻ."
3487 = "Nói rồi, Hachiroku nhẹ nhàng xoay người."
3488 = "Việc ngủ gật khiến Hachiroku kinh ngạc, tóm lại chính là do quá tải xử lý sao."
3500 = "Mềm nhũn ra."
3503 = "Một tiếng nhỏ.\\nĐôi má của Paulette càng lúc càng đỏ hơn."
3509 = "Thiết bị này đang mô phỏng lại\\ncái lò dùng để ném than vào đốt lửa sao."
3511 = "Kiểu uống không hề phù hợp với vẻ bề ngoài chút nào.\\nQuả thực làm tôi hơi bất ngờ."
3512 = "Hachiroku vẫn chưa cho tôi xem chiếc \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; \\x%l8620;#00ffc040;8620%l;#; đó.\\nThậm chí, cô ấy còn chẳng tự mình đi xem nó."
3520 = "Sự dịu dàng tươi cười biến mất,\\nbiểu cảm của cô ấy trở nên nghiêm nghị."
3523 = "Khi \\x%l列車;#00ffc040;đoàn tàu%l;#; bắt đầu chuyển động với một rung động nhẹ, bên trong toa xe ngay lập tức\\nngập tràn tiếng xì xào của hành khách."
3525 = "Tôi hoàn toàn không có ý thức về điều đó——\\nNhưng mà, có lẽ mọi chuyện là như vậy."
3526 = "Nếu tôi lỡ làm cô ấy nhớ lại chuyện buồn thì tôi thấy rất có lỗi,\\nnhưng chính vì vậy, tôi càng phải truyền đạt rõ ràng những điều cần nói."
3530 = "Tiếng nhai vỡ vang lên thật lớn."
3536 = "（\\x%lレイルロオド;#00ffc040;Railord%l;#; có vẻ có chức năng tương tự như Navi……\\nHay là việc lái \\x%l列車;#00ffc040;đoàn tàu%l;#; cũng gần như tự động?）"
3546 = "（Hầu hết đều là học sinh nhỉ——\\nNghĩa là có nhu cầu sử dụng làm phương tiện đi học sao.）"
3551 = "（Kịch）"
3552 = "（A——ra là vậy.\\nĐây là thao tác của một người thành thạo sao.）"
3554 = "（Rắc! Rắc! Rộp rộp!）"
3555 = "（Rộp!）"
3557 = "（Hừm, trông thế thôi chứ họ là chuyên gia đấy.）"
3560 = "（Mình cũng nên học tập Hachiroku thôi.\\nĐể dành câu hỏi lại sau——dù sao thì bây giờ cứ quan sát đã.）"
3563 = "（Là để không cản trở việc lái tàu——sao.）"
3567 = "Một phần lý do cho “sự đánh giá thấp từ dư luận” mà Navi đã nói,\\ncó lẽ cũng nằm ở sự bận rộn đó."
3570 = "SL.\\nSteam Locomotive——nghĩa là, \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;."

[selections]
