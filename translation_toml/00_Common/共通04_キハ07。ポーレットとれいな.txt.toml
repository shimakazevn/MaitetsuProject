[script]
72 = "\\x%lまいてつ;#00ffc040;Chủ tàu%l;#;? \\x%lまいてつ;#00ffc040;Chủ tàu%l;#; là gì vậy?"
76 = "Ở những khu vực từ trường không ổn định, động cơ \\x%lエアクラ;#00ffc040;Aircra%l;#; không thể hoạt động."
1781 = "Dư dả—— là một từ nghe có vẻ chẳng liên quan gì đến động cơ \\x%lエアクラ;#00ffc040;Aircra%l;#; cả."
1791 = "……Hachiroku giải thích ngắn gọn cho tôi. \\x%lバラスト;#00ffc040;Đá ba-lát%l;#; chính là lớp đá dăm lót dưới để nâng đỡ đường ray và \\x%l枕木;#00ffc040;tàu vẹt%l;#;."
1795 = "……Tôi đã trở thành chủ sở hữu của một \\x%lレイルロオド;#00ffc040;Railord%l;#;, và phải gánh vác trách nhiệm. Nếu cứ sợ hãi đường sắt thì tôi sẽ chẳng thể hoàn thành được bất cứ việc gì cần làm."
1799 = "……Hiệu suất nhiên liệu của Hachiroku, có vẻ khá tệ. Cứ lặp đi lặp lại liệu pháp điều trị triệu chứng bằng dây cót thì chẳng giải quyết được gì."
1802 = "……Thật không hợp với tính cách của mình. ……Mười giây nữa."
1807 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#;——\\x%l共感;#00ffc040;cộng cảm%l;#; sao.」"
1811 = "「Vậy thì, lý do \\x%l待避線;#00ffc040;đường tránh tàu%l;#; không được sử dụng đến mức bị bỏ hoang, là do \"hoàn toàn không có chuyện các \\x%l列車;#00ffc040;chuyến tàu%l;#; cần tránh nhau\", phải không?」"
1814 = "「Là mặt bị \\x%l列車;#00ffc040;tàu%l;#; giẫm lên——bị bánh xe bào mòn, nên gọi là \\x%l踏面;#00ffc040;mặt lăn bánh xe%l;#; sao. Vì vậy, chỉ có chỗ đó là không bị gỉ sét.」"
1820 = "「Thoi thóp—— Thực tế thì, lớp \\x%lバラスト;#00ffc040;đá ba-lát%l;#; này đã vượt quá giới hạn rồi.」"
1824 = "「\"Phúc\" sao—— Cái tên chẳng thể hiện được bản chất nhỉ.」"
1825 = "「…………」"
1830 = "「……Thế giới này rộng lớn thật đấy.」"
1831 = "「……Đúng là nó vẫn còn sống, nhưng thật đáng tiếc, tình hình có vẻ đúng như những gì Ngài Soutetsu đã nói khi ở trên không trung.」"
1839 = "「……Động cơ, sẽ dừng lại sau 15 giây. Chuyển sang chế độ an toàn.」"
1845 = "「……Cái này là sao. Biển báo đứng ghi \"Nhà ga gì đó\" à.」"
1846 = "「……Cô ấy hơi bao đồng một chút. Có vẻ sở thích của cô ấy là giám sát để tôi không gặp nguy hiểm.」"
1848 = "「……Ngài Soutetsu. Em có thể hỏi một chuyện được không ạ?」"
1849 = "「……Ngài Soutetsu. Đây là……nhà ga bỏ hoang ạ.」"
2086 = "「Giống như \\x%l列車;#00ffc040;tàu%l;#; hay \\x%lレイルロオド;#00ffc040;Railord%l;#;—— Ngay cả nhà ga……cũng sẽ chết đi nhỉ.」"
2091 = "「Đó là chuyện không được phép đào sâu hỏi han đâu. Dù có muốn biết thì cũng phải ráng nhịn cho đến khi người ta tự nói ra, hiểu chưa?」"
2093 = "「À, không. Không lạnh đâu. Chắc tôi hơi phấn khích chút thôi.」"
2097 = "「Làm gì có chuyện đó.」"
2098 = "「Không được không được không được không được, dừng lại dừng lại dừng lại đi! Sẽ làm mòn \\x%l踏面;#00ffc040;mặt lăn bánh xe%l;#;, hỏng \\x%l枕木;#00ffc040;tà vẹt đường ray%l;#; và nghiền nát \\x%lバラスト;#00ffc040;đá ba-lát%l;#; mất!」"
2104 = "「Thế nhưng, đường sắt dù thoi thóp vẫn đang tiếp tục sinh tồn. Nếu vậy, em nghĩ trong đó cũng có sự tất yếu ạ.」"
2105 = "「Tuy nhiên, Quirquitium có một điểm yếu. Đó là hiện tượng mang tên \"Cộng hưởng sụp đổ\".」"
2108 = "「Không, ngài Soutetsu. Không cần thiết phải làm vậy đâu ạ.」"
2109 = "「Không đâu, Ngài Soutetsu. Quả thực là nó có bị hỏng hóc, xập xệ ——Nhưng đường ray này, vẫn còn sống.」"
2114 = "「Hành khách sao.」"
2115 = "「Vậy, có nghĩa là——」"
2117 = "「Hẳn là vậy rồi.」"
2121 = "「Vật rồi sẽ hỏng, người rồi sẽ chết. Đó là quy luật. Dù thế nào cũng là điều không thể tránh khỏi.」"
2123 = "「Tuy hơi muộn, nhưng rất vui được gặp hai người. Tôi là Migita Soutetsu, chủ sở hữu của Hachiroku.」"
2126 = "「Cứ để tôi. ——Navi.」"
2129 = "「Hả? Hạ cánh khẩn cấp?」"
2138 = "「Cô cũng rất rạng rỡ đấy, Hachiroku. Theo này thì chắc chắn không thất lễ đâu——hửm.」"
2140 = "「Tới rồi ạ. A——đây là——\\x%l気動車;#00ffc040;toa xe tự hành%l;#;—— một \\x%lディーゼル気動車;#00ffc040;toa xe diesel tự hành%l;#; rất đáng yêu nhỉ.」"
2142 = "「Không chỉ có \\x%l待避線;#00ffc040;đường tránh tàu%l;#; là không còn sống đâu ạ.」"
2151 = "「Được chứ.」"
2153 = "「Không hề ạ. Ngài Soutetsu. Trông ngài vô cùng lịch lãm.」"
2154 = "「Hachiroku. Đồng hồ và chìa khóa lên dây cót đâu.」"
2157 = "「Hachiroku, lại đây.」"
2159 = "「Cộng hưởng sụp đổ…… Cộng hưởng——rồi sụp đổ sao? Là sự cộng hưởng và sụp đổ đó ạ?」"
2167 = "「Rất vui được gặp em, Reina? Chị là \\x%lレイルロオド;#00ffc040;Railord%l;#; Hachiroku.」"
2174 = "「Phía trước an toàn. Phía sau an toàn. Dưới chân an toàn. Chị Paulette, xuống được rồi đó ạ~」"
2176 = "「Sẽ tiến hành hạ cánh khẩn cấp. Để phòng hờ, xin hãy giữ tư thế chống va đập.」"
2177 = "「Ra là vậy. Nhờ cô giải thích mà tôi hiểu rồi. Thật muốn gặp mặt quá. Cả \\x%lレイルロオド;#00ffc040;Railord%l;#; và \\x%l運転士;#00ffc040;người lái tàu%l;#; đó.」"
2179 = "「Ra là vậy. Đây là lỗi của tôi.」"
2180 = "「Ra là vậy.」"
2181 = "「Ra là vậy——tuyến đường sắt bên này không còn sống nữa.」"
2182 = "「Ra là vậy.」"
2205 = "「Nếu chúng ta có thể khiến xã hội công nhận rằng đường sắt có thể hoàn thành xuất sắc những \"việc mà \\x%lエアクラ;#00ffc040;Aircra%l;#; không thể làm được\" đó thì」"
2211 = "「Nhưng mà, tại sao lại xuất sắc? Việc thực hiện \\x%l喚呼;#00ffc040;chỉ tay hô xác nhận%l;#; đó là luật lệ quy định mà phải không?」"
2214 = "「Migita…… Soutetsu…… Anh Soutetsu——」"
2216 = "「Á」"
2217 = "「Hừm.」"
2218 = "「E hèm.」"
2219 = "「Oa! Tuyệt quá ạ!」"
2221 = "「Hả!? A, Ngài Soutetsu.」"
2223 = "「Hả? A, vâng! Dạ——xin thất lễ, ngài Soutetsu.」"
2224 = "「Hô?」"
2225 = "「Không đâu, chuyện cũng chẳng có gì đáng ngạc nhiên, chỉ là tôi hơi…… ừm, phản ứng thái quá một chút thôi.」"
2227 = "「Hừm.」"
2228 = "「A——」"
2229 = "「A——!」"
2230 = "「A.」"
2232 = "「Ơ kìa, ngài Soutetsu. Hóa ra ngài không hiểu sao ạ?」"
2233 = "「A, dạ không——」"
2235 = "「A, xin lỗi anh. Tôi hơi bất ngờ. Tại vì, tôi không nghĩ là anh lại biết đến tôi.」"
2237 = "「Sở thích là giám sát, sao ạ?」"
2239 = "「Ừm. Reina ngoan lắm.」"
2240 = "「Đúng vậy. Hơn nữa, chi phí sản xuất Quirquitium được cho là thể tích tăng gấp đôi thì chi phí bình phương, gấp ba thì lập phương.」"
2242 = "「Hừm.」"
2243 = "「Hừm?」"
2245 = "「Hì hì, Reina được khen rồi nha~」"
2249 = "「Hô, tiện lợi thật đấy.」"
2254 = "「Vì vậy, \\x%lレイルロオド;#00ffc040;Railord%l;#; chúng tôi, sử dụng hai loại cơ thể là \\x%l運転体;#00ffc040;kíp lái%l;#; và \\x%l整備体;#00ffc040;thân chính%l;#; tùy theo mục đích ạ.」"
2257 = "「Do đó, hệ thống dẫn đường của \\x%lエアクラ;#00ffc040;Aircra%l;#; loại bay được có vẻ rất khó điều chỉnh. Đến mức nếu cố can thiệp vào những phần đã được thiết lập cố định thì nó sẽ hỏng mất.」"
2260 = "「Bởi vì \\x%lレイルロオド;#00ffc040;Railord%l;#; của \\x%l列車;#00ffc040;chuyến tàu%l;#; trên tuyến đường này là một đứa trẻ rất trung thành với luật lệ, ngài Soutetsu.」"
2262 = "「Trong thời kỳ cuối cùng em còn hoạt động ở tiền tuyến…… Tại \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; cũ, điều đó đã không còn được tuân thủ nữa ạ.」"
2267 = "「Thị trưởng thì…… hơi ngại khi ở ngoài tòa thị chính. Nếu được, anh cứ gọi là, ừm, Paulette. Vậy là được rồi.」"
2273 = "「Em ấy thực hiện tất cả những điều đó từng li từng tí không hề chểnh mảng. Mặc dù \\x%l喚呼;#00ffc040;chỉ tay hô xác nhận%l;#; có vẻ hơi thong thả quá mức——nhưng rất xuất sắc ạ.」"
2275 = "「Em ấy rất xuất sắc ạ. Đang thực hiện \\x%l喚呼;#00ffc040;chỉ tay hô xác nhận%l;#; rất đàng hoàng.」"
2279 = "「Được thôi.」"
2281 = "「Đẹp quá——là người nước ngoài sao ạ?」"
2284 = "「Vâng ạ, chị Paulette. Reina đi cùng chị nha~」"
2285 = "「Vâng, anh Soutetsu. Nếu là chuyện tôi có thể trả lời thì anh cứ hỏi đi ạ.」"
2287 = "「Vâng, Ngài Soutetsu. Xin nhờ ngài ạ.」"
2290 = "「Thời buổi bây giờ là thế này mà? Cho nên, chắc chắn các \\x%lまいてつ;#00ffc040;chủ tàu%l;#; cũng có những ẩn tình riêng của họ.」"
2292 = "「Nếu đã bị bỏ hoang, thì đương nhiên, \\x%l列車;#00ffc040;tàu%l;#; sẽ không chạy, và đường ray cũng sẽ không bị bào mòn.」"
2297 = "「Khi chịu thêm tác động của từ trường Trái Đất được kiểm soát và ánh sáng mặt trời, nó sẽ bắt đầu chuyển động quay.」"
2299 = "「N-Nó bảo thế đấy. Sao rồi? Hachiroku.」"
2304 = "「Ừ. Nếu để các Quirquitium lại quá gần nhau, chuyển động quay của cả hai sẽ mất kiểm soát, dẫn đến sụp đổ.」"
2305 = "「Xin lỗi. Thị trưởng Paulette.」"
2307 = "「Với trọng lượng của cỗ máy này, mệnh lệnh \"hãy làm hỏng đường ray\" còn khó thực hiện hơn nhiều ạ.」"
2321 = "「À, nãy giờ em nhắc đến mấy lần rồi nhỉ. Cái từ taihisen (đường tránh tàu) gì đó.」"
2326 = "「Sắp được gặp rồi đó, ngài Soutetsu. Phía bên kia cũng đã nhận được \\x%l共感;#00ffc040;cộng cảm%l;#; rồi ạ.」"
2329 = "「Được gặp chị Reina vui lắm nha, chị Hachiroku~」"
2331 = "「Tạm thời nên quay lại chăng. Ra khỏi khu vực có thể bay, khởi động lại Navi. Từ đó đi đường vòng.」"
2332 = "「Chỉ tay hô xác nhận?」"
2334 = "「Có chuyện gì vậy Ngài Soutetsu——kya!?」"
2335 = "「Cảm ơn hai người đã dừng tàu. Đồng thời, tôi xin chân thành xin lỗi vì đã buộc hai người phải làm vậy.」"
2338 = "「Tôi đã nói rồi mà. \\x%lエアクラ;#00ffc040;Aircra%l;#; rất yếu về khoản chịu tải. Do đó, thân máy cũng được chế tạo nhẹ đến mức tối đa.」"
2344 = "「Chúng tôi đã cố gắng hết sức để giúp thế giới rộng lớn này, trở nên nhỏ bé hơn dù chỉ một chút——」"
2345 = "「Ưu tiên hàng đầu là di chuyển khỏi đây. Cứ thế này thì chính chúng ta mới là chướng ngại vật trên đường ray mất——dô.」"
2346 = "「Chỉ là em thấy quanh đây công tác \\x%l保線;#00ffc040;bảo trì đường ray%l;#; càng tệ hơn thôi. Cái cây kia chẳng hạn, sắp đè cả lên đường ray rồi.」"
2351 = "「Nhưng bây giờ, tôi và Hachiroku vẫn đang sống sót. Ngay cả tuyến đường sắt này, cũng có phần còn sống sót.」"
2353 = "「Tôi thì không rành lắm. Nhưng tuyến đường sắt là như thế này sao?」"
2354 = "「Tôi muốn được gặp những người đó. Và rồi, dù chỉ là một việc nhỏ nhoi, tôi cũng muốn giúp đỡ——」"
2356 = "「Không, tôi mới là người phải xin lỗi. Đột nhiên lại hành xử như đang tra hỏi vậy, thật thất lễ quá.」"
2359 = "「Thì hẳn là vậy rồi—— Nhưng lý do cần phải tránh là gì?」"
2360 = "「Không đúng sao?」"
2361 = "「Tôi á?」"
2364 = "「Vậy thì thông tin khu vực xung quanh của Navi có lẽ đã cũ rồi. Tuyến đường này, chẳng phải đã bị bỏ hoang rồi sao?」"
2366 = "「Nếu vậy thì ở đâu đó, hẳn vẫn còn nhà ga đang sống. Ở đó chắc chắn cũng có \\x%l列車;#00ffc040;tàu%l;#; và nhân viên đường sắt đang sống.」"
2370 = "「Vì vậy, em rất muốn được ngài Soutetsu, người cũng là chủ sở hữu của \\x%lエアクラ;#00ffc040;Aircra%l;#;, chỉ giáo ạ.」"
2376 = "「Nâng lên á!? Một mình ngài Soutetsu sao!?」"
2382 = "「Độ rung lắc sẽ gây ảnh hưởng xấu đến thân xe và hàng hóa. Nếu có hành khách, chắc chắn sẽ có những lời phàn nàn.」"
2388 = "「Thân chính?」"
2391 = "「Nếu làm gì cũng không sửa được thì chỉ còn cách làm quen với nó thôi. Việc bị giám sát, nếu quen rồi thì cũng khá tiện lợi đấy.」"
2393 = "「Vâng ạ~. Reina, Reina nhớ là không được hỏi về ẩn tình của người khác rồi nha~」"
2399 = "「Đúng vậy ạ. Em——」"
2400 = "「Đúng, vậy ạ.」"
2401 = "「Là vậy sao——hừm?」"
2402 = "「Vậy sao.」"
2403 = "「Vậy sao. Họ nói gì?」"
2404 = "「Hô? Sao cô biết?」"
2406 = "「Thiếu ngân sách, thiếu nhân lực, hay cả hai. Dù sao đi nữa, tình trạng không được hoàn hảo là điều không thể thay đổi.」"
2408 = "「Vâng…… Ánh sáng mặt trời và từ trường Trái Đất…… Quả là một nguồn động lực gần như vô tận nhỉ.」"
2409 = "「Vâng ạ~ Nhìn Reina thế này thôi chứ khỏe lắm đó nha~」"
2413 = "「Vâng. Vì vậy thông thường người ta sẽ rải lại \\x%lバラスト;#00ffc040;đá ba-lát%l;#; từ giai đoạn sớm hơn cơ ạ.」"
2417 = "「Vâng ạ. Và trong hoàn cảnh đó—— Có những người cảm thấy tầm quan trọng của \\x%l喚呼;#00ffc040;chỉ tay hô xác nhận%l;#; đã bị phai nhạt đi.」"
2419 = "「Vâng. Là tàn tích của \\x%l駅名標;#00ffc040;biển hiệu nhà ga%l;#;——đấy ạ. Hư hỏng đến mức này thì không còn hoàn thành được vai trò của nó nữa.」"
2425 = "「Đúng vậy ạ. Ngay cả \\x%l踏面;#00ffc040;mặt lăn bánh xe%l;#; cũng sẽ bị gỉ sét và bụi bẩn bao phủ. Và rồi, tất cả sẽ mục nát.」"
2428 = "「Vâng. Ngài Soutetsu cũng nhận ra rồi sao ạ?」"
2429 = "「Là nhà ga ạ!」"
2432 = "「Là vậy sao ạ?」"
2433 = "「Là 『thứ từng là \\x%lバラスト;#00ffc040;đá ba-lát%l;#;』 ạ. Ngài Soutetsu. Thế này rồi thì, nó không còn tác dụng của \\x%lバラスト;#00ffc040;đá ba-lát%l;#; nữa.」"
2437 = "「Biết đâu được ạ. Có thể tên ga là Họa Phúc hay Minh Phúc cũng nên.」"
2442 = "「Cỗ máy này đang bị cuốn vào vùng từ trường bất thường. Dự kiến động cơ sẽ ngừng hoạt động nếu tiếp tục tiến tới.」"
2449 = "「Trong trường hợp của cô, so với thiết lập của công ty \\x%lエアクラ;#00ffc040;Aircra%l;#;, thì mệnh lệnh của tôi có thứ tự ưu tiên cao hơn nhỉ.」"
2455 = "「Tôi cũng nghĩ vậy ạ. Đường ray cũng là loại 30kg…… Trong tình trạng này, độ rung lắc sẽ khá tệ đấy ạ.」"
2457 = "「Không sao đâu, Hachiroku. Vì đây là cuộc hạ cánh khẩn cấp để giữ an toàn cho mạng sống của tôi mà.」"
2458 = "「Không được nêu rõ ạ.」"
2459 = "「Chính xác. Không thể trang bị động cơ Aero-Craftech cho chúng được. Hơn nữa, nó cũng không giỏi trong việc vận chuyển những vật khổng lồ không thể chia nhỏ.」"
2460 = "「Đúng vậy ạ. Như lời Ngài Soutetsu nói—— Dù \\x%l待避線;#00ffc040;đường tránh tàu%l;#; đã chết, nhưng đường chính vẫn còn sống.」"
2462 = "「Đúng vậy. Cùng tồn tại và cùng phát triển là hoàn toàn có thể. Thực tế, ở những khu vực mà các phương tiện giao thông trước thời \\x%lエアクラ;#00ffc040;Aircra%l;#; vẫn đang hoạt động——」"
2471 = "「Họ nói sẽ dừng khẩn cấp và đón chúng ta ạ. Họ có vẻ rất ngạc nhiên khi biết có \\x%lレイルロオド;#00ffc040;Railord%l;#; ở đây.」"
2473 = "「Tại sao? À, không——」"
2474 = "「Tại sao? Tại sao lại không cần quay lại?」"
2477 = "「Reina là \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của KiHa 07S đó ạ. Quê hương của Reina là Đường sắt mỏ Katakami đó nha~」"
2480 = "「Có chuyện gì sao, Reina?」"
2483 = "「Reina, đây là lần đầu tiên Reina thấy một \\x%lレイルロオド;#00ffc040;Railord%l;#; lớn hơn Reina đó nha~」"
2487 = "「Reina?」"
2492 = "「Còn dư dả?」"
2493 = "「Đó là điều hiển nhiên ạ. Hơn nữa, để thực hiện mệnh lệnh cần ưu tiên hơn cả là \"bảo vệ mạng sống của ngài Soutetsu\", chúng ta sẽ hạ cánh khẩn cấp.」"
2494 = "「Là \\x%l踏面;#00ffc040;mặt lăn bánh xe%l;#; ạ.」"
2495 = "「Có vẻ như em…… đã hơi coi thường sự tiện lợi của \\x%lエアクラ;#00ffc040;Aircra%l;#; thời nay mất rồi ạ.」"
2500 = "「Mọi chuyện trên đời đều có lý do của nó nhỉ.」"
2502 = "「Thật sự…… tuyệt vời quá. Từ đây trở về trước, và từ đây trở về sau. Tình trạng của đường ray hầu như không có sự khác biệt nào có thể quan sát được.」"
2504 = "「Bẩn thỉu quá nhỉ.」"
2510 = "「Vỡ vụn thành cát thế này, thì không còn hoàn thành được vai trò của \\x%lバラスト;#00ffc040;đá ba-lát%l;#; nữa sao.」"
2514 = "「Xác nhận đèn tín hiệu xuất phát rồi hô 『Xuất phát, tiến lên!』, xác nhận giới hạn tốc độ rồi hô 『\\x%l制限;#00ffc040;Giới hạn tốc độ%l;#; 50!』」"
2517 = "「Từ trường bất thường.」"
2518 = "「Đường sắt mỏ sao? Vậy là, vận chuyển hàng hóa ư?」"
2520 = "「Trái tim của động cơ Aero-Craftech là một hợp chất dạng đá quý có tên là Quirquitium.」"
2521 = "「Là không phận nên tránh bay do công ty Aero-Craftech thiết lập ạ.」"
2523 = "「Vì tên ga thường bắt nguồn từ địa danh mà. Cũng có những nhà ga tên là \"Kega (Thương tích)\" hay \"Fukouda (Bất hạnh)\".」"
2527 = "「Nghĩ một cách cực kỳ tóm lược thì đúng là vậy. Do đó, \\x%lエアクラ;#00ffc040;Aircra%l;#; có thể vận hành với chi phí cực kỳ thấp.」"
2531 = "「Bảo dưỡng phương tiện của mình cũng là công việc của \\x%lレイルロオド;#00ffc040;Railord%l;#;. Tuy nhiên, với cơ thể này thì không thể làm việc nặng nhọc được.」"
2534 = "「Dừng khẩn cấp thành công. Đã xác nhận người cần cứu hộ.」"
2535 = "「Hạ cánh khẩn cấp——không lẽ nào!!?」"
2540 = "「Tiện lợi……không đâu, nếu so với con người thì giống như sử dụng công cụ phù hợp, hay thay quần áo cho hợp hoàn cảnh thôi ạ.」"
2541 = "「Nó nói vậy đấy. Hachiroku.」"
2542 = "「Những việc mà \\x%lエアクラ;#00ffc040;Aircra%l;#; không thể làm được—— Những việc mà chúng không giỏi xử lý là gì ạ.」"
2546 = "「Thấy không? Cái đó đấy.」"
2549 = "「Kể cả không có lệnh của ngài. Ngài Soutetsu.」"
2552 = "「Run rẩy vì phấn khích sao ạ? Thật vinh hạnh quá.」"
2554 = "「Lượng thông tin mà \\x%lエアクラ;#00ffc040;Aircra%l;#; loại bay được cần xử lý, có vẻ khác biệt một trời một vực so với loại chạy trên mặt đất.」"
2558 = "「Nếu tôi là \\x%l整備体;#00ffc040;thân chính%l;#;, thì ít nhất cũng có thể giúp rải \\x%lバラスト;#00ffc040;đá ba-lát%l;#;——」"
2566 = "「Không, ơ kìa, có sao không vậy ạ? Có vẻ như độ cao đang giảm dần.」"
2567 = "「Cái từ '\\x%lまいてつ;#00ffc040;chủ tàu%l;#;' đó rốt cuộc là gì vậy?」"
2569 = "「Chỉ giáo chuyện gì?」"
2570 = "「Cảm ơn em, Reina. Cùng đi với chị nhé?」"
2577 = "「Quay lại trình tự ban đầu thôi. Chúng ta đã đi đường vòng rồi, nhưng trước hết phải lấp đầy cái bụng đã.」"
2579 = "「Đi thôi. Navi đang hạ cánh chờ ở phía trước kìa.」"
2582 = "「Quy tắc là thứ cần phải tuân thủ nghiêm ngặt, nhất là trong những hoàn cảnh như vậy. \\x%lレイルロオド;#00ffc040;Railord%l;#; của tuyến đường này hiểu rõ điều đó, em ấy thật xuất sắc.」"
2586 = "「Viết là mặt giẫm lên, đọc là toumen. Với Ngài Soutetsu thì, chỉ cần thế này là đủ hiểu rồi chứ ạ?」"
2591 = "「Mặt lăn bánh xe?」"
2603 = "「C-Chuyện đó là——」"
2604 = "「Đây là chị Paulette, Master của Reina đó nha~. Chị Paulette tên đầy đủ là Hinai Paulette đó ạ~」"
2605 = "「Đó là \\x%lバラスト;#00ffc040;đá ba-lát%l;#; sao?」"
2607 = "「Không đâu, hoàn toàn có khả năng đấy ạ.」"
2608 = "「Đó là điều hiển nhiên rồi ạ. Lượng thông tin đó nhiều đến mức nào…… em cũng không thể tưởng tượng nổi.」"
2609 = "「Tuyến đường này là \\x%l単線;#00ffc040;đường đơn%l;#;, ấy vậy mà, \\x%l待避線;#00ffc040;đường tránh tàu%l;#; lại bị bỏ hoang.」"
2611 = "「Ra là vậy.」"
2612 = "「Chuyển động quay đó——ví dụ như, nó trở thành động lực để làm chuyển động piston các loại sao ạ?」"
2618 = "「Xin lỗi vì đã giới thiệu chậm trễ. Đây là chủ nhân của em, ngài Migita Soutetsu ạ.」"
2624 = "「Vậy thì, tại sao trông sắc mặt cô lại ủ rũ thế kia?」"
2625 = "「Dạ~, Reina cảm thấy hơi kỳ lạ một chút xíu ạ~」"
2627 = "「Vậy thì đi thôi. Đừng để ngã nhé?」"
2628 = "「Vậy thì Paulette. Xin lỗi, tôi có một chuyện muốn hỏi.」"
2629 = "「Nếu vậy thì…… \"việc tập trung Quirquitium lại để sử dụng\", là điều không thể đúng không ạ?」"
2630 = "「Vậy thì…… với những thứ như phương tiện đường sắt, bản thân thân xe đã nặng hàng chục tấn thì——」"
2635 = "「Nó là thứ đồ thực dụng nhất mà. Bị bẩn, bị hỏng là điều đương nhiên ……Nhưng cái này, đúng vậy. Hơi thiếu bảo dưỡng quá rồi.」"
2636 = "「Ngành đường sắt bị dồn đến bước đường cùng thoi thóp này, em thậm chí còn cảm thấy đó là một loại tất yếu vượt ngoài sự lựa chọn của con người.」"
2640 = "「Trên đường ray sao.」"
2644 = "「Ẩn tình ạ~? Ẩn tình là gì thế ạ~?」"
2647 = "「Ng-Ngài Soutetsu!? ——Ưm」"
2648 = "「Anh Soutetsu là chủ sở hữu của chị Hachiroku sao? Tại sao không phải là Master vậy ạ?」"
2649 = "「Chào anh Soutetsu nha~. Reina cũng xin giới thiệu ạ~」"
2650 = "「Ngài Soutetsu. Cảnh báo. Cỗ máy này đang tiếp cận không phận tránh bay.」"
2651 = "「Sớm muộn gì cũng vậy. Ngài Soutetsu chắc chắn sẽ trở thành \\x%l機関士;#00ffc040;Master%l;#; của em…… Nhưng mà, hiện tại thì có chút ẩn tình ạ.」"
2653 = "「Đúng như lời ngài Soutetsu nói ạ. \\x%l機関推力;#00ffc040;Lực đẩy động cơ%l;#; của cỗ máy này vẫn còn dư dả rất nhiều để thực hiện hạ cánh khẩn cấp an toàn.」"
2655 = "「Ngài Soutetsu!? Sao ngài lại thong thả thế——ơ?」"
2656 = "「Ngài Soutetsu? Ngài thấy lạnh sao ạ?」"
2658 = "「Hinai Paulette…… là Thị trưởng thành phố Ohimitera sao?」"
2659 = "「Không, lẽ nào……」"
2665 = "「Cảm ơn Ngài Soutetsu.」"
2667 = "「Được cứu giúp thì thật đáng quý. À này, Hachiroku. Quần áo của tôi có bị xộc xệch không?」"
2670 = "「Gì cơ? Không phận tránh bay đó là sao?」"
2675 = "「Gấp đôi thì bình phương…… Giả sử, chi phí sản xuất 100 centimet khối hợp chất là 100 yên thì」"
2676 = "「!」"
2677 = "「!」\\n「A」"
2680 = "「Chi phí cho 200 sẽ là mười ngàn yên. Cho 300 sẽ là một triệu yên. Và việc sản xuất những khối có kích thước vượt quá một mức độ nhất định là bất khả thi.」"
2681 = "「???」"
2683 = "「Navi—— đã luôn theo dõi Ngài Soutetsu từ trên không trung sao ạ?」"
2685 = "「Navi, có thể không? Bảo vệ cả sự an toàn của chúng ta lẫn tình trạng của đường ray.」"
2838 = "Vừa an tâm được một chút, một nghi vấn lại lập tức nảy sinh."
2843 = "Bước vào trong, tôi mới thấy lời Hachiroku nói là đúng."
2844 = "Lớp sơn trắng bong tróc tơi tả, lớp lót màu đỏ và cả thớ gỗ cũng lộ ra một cách thảm hại."
2847 = "Không ổn rồi. Giờ không phải lúc để ngẩn ngơ."
2849 = "Nếu không làm vậy, Navi sẽ tiếp tục tuân thủ mệnh lệnh ban đầu của tôi, \"miễn là không phát sinh nguy hiểm đến tính mạng của tôi\"."
2851 = "Chẳng mấy chốc, dường như đã chán sự im lặng, Hachiroku mở lời. Giọng nói của cô ấy vang lên đầy mạnh mẽ."
2853 = "Dù là gì đi nữa, điều tôi nên nói cũng không thay đổi."
2856 = "Nhưng trước mắt, tôi sẽ chỉ hỏi điều mà tôi chắc chắn rằng \"cần được giải đáp ngay\"."
2857 = "Nhưng hiện tại lo cho bản thân chúng tôi trước đã. Thân mình còn lo chưa xong, lấy đâu ra tâm trí mà lo cho đường ray chứ."
2871 = "Tự trói buộc mình bằng lời nói của chính mình."
2879 = "Có lẽ chỉ là một sự trùng hợp ngẫu nhiên. Nhưng tôi không khỏi liên tưởng đến người con gái được gọi là Paulette đó."
2882 = "Vừa tới nơi, tôi liền túm lấy nách và nhấc bổng cô ấy lên. Cao hơn cả khuôn mặt tôi."
2885 = "Như thể vừa bừng tỉnh, Hachiroku ngậm chặt miệng lại và chạy về đứng cạnh tôi."
2887 = "Đáp lại điều đó, Hachiroku duyên dáng cúi gập người xuống."
2890 = "Hachiroku lại giải thích một cách dễ hiểu. \\x%l単線;#00ffc040;Đường đơn%l;#; là tuyến đường chỉ có duy nhất một đường ray, dùng chung cho cả tàu chạy xuôi lẫn chạy ngược."
2892 = "Hachiroku và \\x%lレイルロオド;#00ffc040;Railord%l;#; tên là Reina. Mỗi lần trao đổi một câu, khoảng cách giữa hai người lại xích lại gần nhau hơn."
2897 = "Hachiroku dáo dác nhìn quanh."
2899 = "Cứ như vậy trong vòng tay tôi. Hachiroku mím chặt môi, chìm vào sự im lặng."
2901 = "Nở một nụ cười nhàn nhạt, Hachiroku yếu ớt ngẩng mặt lên."
2904 = "Hachiroku điềm tĩnh giải thích cho tôi. \\x%l喚呼;#00ffc040;Chỉ tay hô xác nhận%l;#; là nhằm mục đích dự báo nguy hiểm và ngăn ngừa tai nạn."
2906 = "Vùng vẫy thoát khỏi vòng tay đang ôm chặt của tôi, Hachiroku cứ thế men theo thân máy, leo xuống đường ray."
2907 = "Hachiroku bất chợt ngồi xổm xuống, vớt lên những viên sỏi——không, là cát từ dưới đường ray."
2910 = "Hachiroku kéo áo trước ngực tôi, đòi hỏi."
2912 = "Hachiroku chỉ vào một bụi cây rậm rạp."
2915 = "Bàn tay Hachiroku vươn về phía tấm \\x%l駅名標;#00ffc040;biển hiệu nhà ga%l;#; mục nát."
2917 = "Giọng nói vui vẻ và vô cùng tự hào của Hachiroku. Cùng lúc đó, một âm thanh đang tiến lại gần."
2920 = "Thẳng thắn, mạnh mẽ. Ánh mắt Hachiroku hướng về phía tôi."
2922 = "Cô ấy gật đầu cái rụp, vẻ đầy tự hào."
2923 = "Lạo xạo, lạo xạo. Hachiroku giẫm lên những viên sỏi rải trên đường ray và bước đi."
2926 = "Nói rồi, Hachiroku gập cánh tay mỏng manh lại, cố gắng gồng lên cho tôi xem. Chẳng thấy nổi lên chút cơ bắp nào cả."
2928 = "Ra là vậy, Hachiroku gật đầu thật sâu."
2938 = "Thực ra tôi còn một chuyện nữa muốn hỏi."
2941 = "Khi bắt đầu nhìn rõ chi tiết của nhà ga, bàn tay đang bám chặt trước ngực tôi của Hachiroku buông thõng."
2951 = "Lời gợi ý của Hachiroku đã mang lại \"ý nghĩa\" cho tuyến đường sắt mà tôi chỉ nhìn một cách lơ đãng."
2958 = "Cứ thế bước theo sự thúc giục của cô ấy, trên sân ga, một tấm ván gỗ hình vuông mục nát đang đứng sừng sững."
2961 = "Có tiếng gió thổi. Chỉ có tiếng gió thổi mà thôi."
2964 = "Nếu tiếng bước chân của Hachiroku là lộc cộc nhanh nhẹn, thì tiếng bước chân của Reina lại lạch bạch chậm chạp."
2966 = "（Cọc cạch, cọc cạch, cọc cạch, cọc cạch——）"
2967 = "A, đây là—— Đúng rồi. Đây là âm thanh của \\x%l列車;#00ffc040;chuyến tàu%l;#;."
2972 = "Ánh mắt chạm nhau."
2974 = "Vì vậy, nghe nói khi di chuyển những động vật khổng lồ như cá voi sát thủ, người ta vẫn còn sử dụng xe động cơ xăng."
2976 = "Tròn trịa. Đó là ấn tượng đầu tiên. Tròn trịa, quả thực rất đáng yêu."
2977 = "Nếu cứ can thiệp vào lúc người ta không muốn bị làm phiền, thì chỉ dễ khiến cả hai cảm thấy phiền phức mà thôi."
2980 = "Nghe câu trả lời của Paulette, Hachiroku hướng ánh mắt đầy kỳ vọng về phía tôi."
2981 = "Nó chầm chậm bay lượn quanh đó, lắc đuôi hai ba cái rồi bay vụt đi về một hướng."
2984 = "Giữa khu rừng rậm rạp xào xạc, chỉ có chỗ đó là mở toang ra như một đường băng."
2987 = "Thời kỳ hoàng kim của \\x%lエアクラ;#00ffc040;Aircra%l;#;. Thời đại mà người ta còn nói mỗi người một chiếc."
2990 = "Hachiroku từ lúc đó cứ im lặng mãi, không thốt lên một lời nào."
2991 = "Gỉ sét và bụi bẩn của tuyến đường sắt——đường ray, không hề chạm đến \\x%l踏面;#00ffc040;mặt lăn bánh xe%l;#;. Nó tỏa ra ánh bạc xỉn màu, cứ như thể vừa được chà nhám vậy."
2996 = "Miễn là không thấy nước ở gần đây, thì đó chắc chắn là lựa chọn an toàn nhất rồi."
2999 = "Tuyến đường sắt mùa hè. Chỉ nghe từ ngữ thôi thì quả thực mang lại ấn tượng rất sảng khoái. Nhưng——"
3001 = "Còn lại, có lẽ là vài chục mét."
3006 = "Sự thất vọng kéo theo sự lười biếng, lười biếng dẫn đến thiếu chuẩn bị——rồi gây ra tai nạn. Đó là chuỗi phản ứng điển hình của \"sự suy tàn như lăn xuống dốc\"."
3009 = "Ôm vào lòng, nhắc nhở, rồi xoa đầu. Một cách giáo dục thật tốt."
3010 = "Có vẻ cũng không hẳn là một lời giải vây."
3011 = "Không chỉ lời nói, mà từng động tác của cô bé cũng rất thong thả."
3014 = "Không thích sự trang trọng sao? Vậy thì cứ gọi một cách thân mật đi."
3016 = "Bước chân nhẹ nhàng, sải bước nhỏ xíu, đến mức chẳng phát ra tiếng lạo xạo nào. Quá nhỏ bé, khiến tôi hơi vất vả để bắt kịp nhịp bước."
3017 = "Những lời tiếp theo——Hachiroku không thể thốt nên lời, hay không muốn thốt ra."
3020 = "Một giọng nói phá vỡ sự cứng đờ trong chốc lát. Thế nhưng, ý thức của tôi vẫn tiếp tục bị thu hút."
3021 = "Đôi mắt cô ấy nhìn thẳng, vượt qua điểm tôi đang chỉ, hướng xa hơn nữa."
3024 = "Trả lời ngay tắp lự. Và đôi chân lơ lửng giữa không trung vung vẩy."
3025 = "Lời khẳng định ngay lập tức. Sức mạnh của ngôn từ chỉ đơn thuần là thông báo một sự thật."
3028 = "Mái tóc vàng kim như những hạt mưa phùn. Làn da trắng ngần. Đôi mắt xanh sâu thẳm, sâu đến mức trông như màu đen."
3029 = "Tạm thời thế này là rời khỏi đường ray rồi. Vậy tiếp theo, chúng ta nên đi về hướng nào đây——"
3034 = "Dưới hình thức cấn trừ tiền bồi thường, nó đã trở thành tài sản cá nhân của tôi…… hay nói đúng hơn là bắt buộc phải thế."
3037 = "Vai trò của nó là tự vỡ vụn ra, để chịu thay đường ray những lực tác động từ \\x%l列車;#00ffc040;tàu%l;#;."
3039 = "Phần đầu của thân xe được sơn màu be và đỏ sẫm, mang một đường nét tròn trịa mềm mại, trông hệt như một món đồ chơi."
3044 = "Và bên kia cũng đỏ mặt im lặng."
3053 = "Tôi đồng thời cảm nhận được nỗi nhớ quê hương đến chóng mặt, và cả nỗi sợ hãi đang sục sôi."
3060 = "Cứ như thể đang thăm dò điều gì đó, cô ấy cứ liếc nhìn tôi rồi lại ngoảnh đi liên tục."
3061 = "Đường tránh tàu là đường ray được thiết lập tại các nhà ga với mục đích cho tàu đi vòng, để các \\x%l列車;#00ffc040;chuyến tàu%l;#; có thể tránh nhau trên \\x%l単線;#00ffc040;đường đơn%l;#;."
3065 = "Trước tiên phải lấp đầy cái bụng của Hachiroku đã. Để làm được điều đó, tôi phải cố gắng hết sức mới được."
3067 = "Ra là vậy, đây chính là \"\\x%l喚呼;#00ffc040;chỉ tay hô xác nhận%l;#;\" sao. Không cần hỏi cũng có thể cảm nhận được qua giọng điệu và cái chỉ tay của Hachiroku."
3069 = "Chỉ qua ánh mắt, tôi đã hiểu rằng Hachiroku cũng không biết từ này, và cô ấy đang định hỏi tôi."
3078 = "Tôi không thích những kỳ vọng sáo rỗng. Dù là của bản thân, hay của người khác."
3079 = "Tôi hoàn toàn không biết quy củ của việc này. Nhưng đã được giới thiệu rồi thì đành nương theo chiều gió vậy."
3083 = "Lo lắng quan sát cô ấy, tôi mới nhận ra mình đã khinh suất thế nào khi gọi cô ấy là \"búp bê\"."
3085 = "Cứ thế ôm Hachiroku trước ngực, tôi rảo bước thật nhanh, tiến thẳng về phía nhà ga."
3087 = "Tôi nhớ lại."
3091 = "Tôi chỉ thẳng vào tuyến đường chạy thẳng trước sân ga. \\x%l踏面;#00ffc040;Mặt lăn bánh xe%l;#; của nó có màu bạc."
3094 = "Ngay khi tiếp xúc với thông tin thu hút nhà máy, điều đầu tiên tôi làm là không ngừng học hỏi. Tôi truyền đạt lại nguyên vẹn thành quả đó cho Hachiroku."
3095 = "Nơi Hachiroku chỉ tay, quả thực có một cái cây lớn đang vươn ra khá xa."
3097 = "Khi tôi định đến khu tàn tích mỏ than Jussen bằng \\x%lエアクラ;#00ffc040;Aircra%l;#;, tiếng của Hibiki dường như đã đuổi theo tôi để nói gì đó."
3101 = "Navi của tôi là trường hợp đặc biệt trong số các trường hợp đặc biệt. Nhưng mà——"
3103 = "Tôi ôm chặt Hachiroku, dùng cơ thể mình che chắn cho cô ấy."
3104 = "Tôi gật đầu. Không chỉ với lời nói của Hachiroku, mà còn với thái độ của cô ấy."
3106 = "Điều tôi nên làm không phải là hỏi lý do, mà là ra lệnh \"hãy tuân theo chỉ thị tránh né\"."
3108 = "Tôi gật đầu. Đúng như lời Hachiroku nói."
3110 = "Vì vậy, Hibiki mới cố ngăn tôi đi bằng \\x%lエアクラ;#00ffc040;Aircra%l;#;, và tuyến đường sắt này hẳn vẫn đang tiếp tục tồn tại."
3111 = "Thừa nhận sự yếu thế của đường sắt, cũng đồng nghĩa với việc miệt thị các chị em của cô ấy——"
3122 = "Rồi cô ấy cúi đầu thật sâu, chào \\x%lレイルロオド;#00ffc040;Railord%l;#; tên Reina và \\x%l運転士;#00ffc040;người lái tàu%l;#; của cô bé."
3124 = "Và rồi từ chiếc miệng nhỏ nhắn của cô ấy, một tiếng thở hắt ra, có lẽ là sự đan xen giữa cảm giác an tâm và thán phục."
3126 = "Nếu vậy, cho đến khi cơ thể yếu đuối đang run rẩy nổi da gà này quen dần—— tôi chỉ còn cách tiếp tục lên tàu, và làm quen với đường sắt."
3128 = "Đã lỡ xin lỗi vì \"thất lễ như đang tra hỏi\" rồi, thì tôi không thể tự mình gặng hỏi hoàn cảnh của đối phương được nữa."
3130 = "Một Hachiroku từng nói như vậy, thế nhưng giờ đây lại ngoan ngoãn, và không hề có vẻ tự trào, chỉ đơn thuần là đang thừa nhận \"hiện thực\"."
3133 = "Ban đầu là tôn trọng sự im lặng của Hachiroku. Và bây giờ, tôi cảm thấy đó là sự tôn trọng ý chí của cô ấy."
3134 = "Cô ấy chớp mắt, đổ mồ hôi, và có vẻ như cũng đang thở. Vô số cử chỉ giống hệt con người đang bao trùm lấy toàn bộ Hachiroku."
3135 = "Người ta nói rằng nếu giả sử không có các linh kiện hao mòn, động cơ Aero-Craftech thậm chí có thể trở thành động cơ vĩnh cửu."
3146 = "Thân máy vẽ một đường cong thoai thoải và hạ thấp xuống. Chẳng mấy chốc, một ánh sáng bàng bạc hiện ra trên mặt đất."
3148 = "Tuyến đường rẽ nhánh, vòng ra phía sau sân ga, mà lúc nãy Hachiroku gọi là đường tránh tàu."
3149 = "Ở đó không cần giải thích lý do. Vốn dĩ ngay từ đầu đã không cần phải hỏi. Nhưng mà——"
3154 = "Như một chú cún con ngây thơ và người chủ dịu dàng. Trong bầu không khí đó, Paulette nhắc nhở Reina."
3158 = "Toàn gỉ đỏ và bùn lầy. Chẳng có chút gì gọi là sảng khoái cả. Thậm chí, nói thẳng ra là rất khó coi."
3166 = "Dù đối phương là người hay là vật, việc giữ khoảng cách cũng quan trọng không kém việc can thiệp vào."
3171 = "Tuy nhiên, cùng với sự sụt giảm nghiêm trọng của số lượng \\x%l列車;#00ffc040;chuyến tàu%l;#;, các quy tắc cũng dần dần không còn được tuân thủ nữa."
3174 = "Những dòng chữ được ghi trên đó cũng gần như mờ hết, chỉ miễn cưỡng đọc được đúng một chữ."
3177 = "Gật——đầu. Reina từ từ gật đầu."
3179 = "Bị Paulette ôm lấy, Reina cất tiếng hét vui sướng."
3181 = "Dùng nhiều \\x%lエアクラ;#00ffc040;Aircra%l;#; treo lên để vận chuyển các kiểu, có vẻ không phải là không thể, nhưng làm vậy thì không thể đạt tốc độ cao được."
3184 = "Ngón tay Hachiroku nhẹ nhàng vuốt ve \\x%l駅名標;#00ffc040;biển hiệu nhà ga%l;#; rồi buông ra."
3188 = "Khoảnh khắc tôi cảm nhận được \"âm thanh của \\x%l列車;#00ffc040;chuyến tàu%l;#;\", khoảnh khắc tôi nhớ lại điều đó——"
3190 = "Vì vậy, vào thời điểm đó ở Hinomoto chỉ có vài cỗ máy thử nghiệm, và cho đến nay độ hiếm của loại bay được hầu như không thay đổi——"
3192 = "——Những thắc mắc, có cái cần được giải đáp ngay, có cái thì không nên."
3196 = "Quả thực là vậy. Nhưng tôi không thể nói ra, cũng không thể thể hiện qua thái độ được."
3204 = "Ánh mắt của Hachiroku không hướng về quá khứ mà là hướng tới tương lai—— Nơi cô ấy hướng ánh nhìn, trong một khoảng thời gian ngắn đã thay đổi đáng kể."
3210 = "Những hành khách vẫn cố tình sử dụng đường sắt, rốt cuộc là vì lý do gì cơ chứ."
3216 = "Bồng bềnh, trong chốc lát. Thân máy nổi lên, tôi có cảm giác như trọng lực đã biến mất."
3228 = "Trái lại, phía con người thì——"
3231 = "Cái tên nghe quen quen lập tức kết nối với ký ức của tôi. Hình như——đúng rồi, Navi đã nhắc đến lúc ở trên trời."
3234 = "Nghe tôi nói vậy, Hachiroku khẽ mỉm cười."
3236 = "Một cái cúi chào chậm rãi. Từ cái cúi chào đó của Reina, có thể cảm nhận được sự nỗ lực hết mình dù có chút vụng về."
3240 = "Một tiếng reo hò vô cùng thong thả, của \\x%lレイルロオド;#00ffc040;Railord%l;#; tự xưng là Reina."
3246 = "Đợi chừng đó mà vẫn không có động tĩnh gì, thì dù biết là thất lễ, tôi cũng sẽ chủ động mở lời."
3253 = "Đến đó thì cô ấy nuốt lời vào trong. Một sự im lặng kéo dài."
3254 = "Bị cắt ngang giữa chừng câu chuyện, trong chốc lát, tôi không hiểu ý cô ấy là gì."
3255 = "Vừa gọi xong, bóng dáng chiếc máy bay đã xẹt qua đỉnh đầu chúng tôi."
3256 = "Nói rồi, Hachiroku dùng ngón tay nghịch phần tóc mái của mình, liếc nhìn tôi với vẻ nũng nịu."
3261 = "Một nhân vật công chúng như thị trưởng mà lại nói \"không nghĩ là anh biết tôi\", theo tiêu chuẩn \"bình thường\" của tôi thì đó là một phát ngôn không thể tin được."
3271 = "\"Ưu tiên hàng đầu là cứu mạng tôi——\" Có vẻ như Navi, khi còn là máy thử nghiệm, đã được ban cho mệnh lệnh đó."
3274 = "Cánh cửa bên hông xe mở ra. Một tia sáng vàng kim tràn ra từ đó."
3290 = "Tầm mắt hướng ra xa. Một thứ gì đó mờ ảo trong hơi nóng bốc lên từ mặt đất, lờ mờ hiện ra."
3293 = "Vậy thì tấm \\x%l駅名標;#00ffc040;biển hiệu nhà ga%l;#; này, đã trở thành bia mộ luôn rồi sao."
3295 = "Lần này đến lượt Hachiroku. Cô ấy cứ liếc nhìn tôi rồi lại lảng đi liên tục."
3296 = "Nó quả thực đã gỉ đỏ đến tận \\x%l踏面;#00ffc040;mặt lăn bánh xe%l;#;, trông hệt như một kẻ đã chết, nhưng——"
3297 = "Ngay cả loại chạy trên mặt đất phổ thông bán trên thị trường cũng có tính năng tự động lái chọn tuyến đường tối ưu. Tuyệt đối không nên đánh giá thấp \"sự tiện lợi của \\x%lエアクラ;#00ffc040;Aircra%l;#;\"."
3299 = "Cỏ xanh mọc um tùm trên cả sân ga. Gỉ đỏ bao phủ toàn bộ bề mặt tuyến đường rẽ nhánh sang bên cạnh——kể cả \\x%l踏面;#00ffc040;mặt lăn bánh xe%l;#;."
3302 = "Bóng dáng của cô thiếu nữ dịu dàng—— người đã cứu tôi và dạy tôi một điều quan trọng vào một ngày hè xa xôi."
3306 = "Nếu vậy. Thì hỏi thôi——"
3307 = "Nếu vậy, chỉ cần đợi ở đây, kiểu gì cũng sẽ có \\x%l列車;#00ffc040;chuyến tàu%l;#; đến đón chúng tôi."
3312 = "Nơi đó nằm khá xa đường ray, nếu đặt lên trên đó thì chắc chắn có thể để được thân máy——tốt."
3316 = "Và rồi, hạ cánh. Phao nổi trượt điệu nghệ trên đường ray——rồi dừng lại."
3319 = "Mặc dù nói với giọng điệu đùa cợt, nhưng đó không phải là nói dối."
3322 = "Hinai."
3323 = "Ngay lập tức, Hinai Paulette giật bắn mình, co rúm toàn thân lại."
3325 = "Nhìn Reina nghiêng đầu vẻ thực sự khó hiểu, Hachiroku dường như thở phào nhẹ nhõm, rồi đáp lại bằng một ánh nhìn ấm áp."
3326 = "Đây là lần đầu tiên tôi nghe Navi nói từ này."
3340 = "（Cũng không giống như là không thể cử động. Vậy thì, cứ để mặc cô ấy sao?）"
3343 = "（Rột~~）"
3347 = "（Chắc không phải vì quá đói đâu nhỉ……）"
3348 = "（Mình đúng là một gã thảm hại. Dù trong đầu đã định buông bỏ…… nhưng có vẻ cơ thể vẫn không thể coi tai nạn đó là quá khứ.）"
3352 = "（Cái này, giống hệt như đang xem mắt vậy.）"
3354 = "（Mái tóc vàng kim này——và đôi mắt xanh này——）"
3360 = "Navi cũng tiếp tục giữ im lặng."
3361 = "Navi chìm vào im lặng. Nhưng dù vậy, trọng lượng cũng không có chút thay đổi nào."
3364 = "Nếu là \"thiết lập\" của công ty Aero-Craftech, thông thường Navi sẽ ưu tiên xử lý tự động hàng đầu."

[selections]
