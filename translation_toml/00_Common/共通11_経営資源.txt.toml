[script]
1777 = "……Vụ tai nạn mà Hachiroku trải qua,\\ncó lẽ thảm khốc đến mức lưu danh trong lịch sử Đường sắt Hoàng gia."
1780 = "……Như vậy có ổn không.\\nBản thân tôi cũng không thể phán đoán được, nên tôi lặng lẽ hướng đến nhà xưởng ủ rượu."
1782 = "……Sự đau buồn của Paulette lúc bấy giờ,\\nlớn lao đến nhường nào cơ chứ."
1783 = "……Sải bước của Paulette lớn hơn tôi nghĩ.\\nVì cô ấy đi với tư thế thẳng tắp, sải bước dài thoăn thoắt."
1797 = "「\\x%l本屋;#00ffc040;Tòa nhà chính%l;#; và khu toa khách toa hàng. Tôi đã học được hai thuật ngữ chuyên ngành.\\nChắc cũng đủ để làm Hachiroku ngạc nhiên đấy.」"
1798 = "「――Ra là vậy sao.」"
1801 = "「――Ra vậy, cũng có thể nhìn nhận theo cách đó nhỉ.」"
1804 = "「Nếu muốn kiếm tiền, thì phải cho người khác kiếm tiền.\\nĐó là nguyên tắc cơ bản của kinh doanh nha.」"
1810 = "「『Đứa bé này đã gánh chịu bất hạnh của cả một đời người rồi.\\nTừ nay về sau, xin hãy dõi theo để nó chỉ nhận được hạnh phúc thôi』, ông ấy đã nói vậy.」"
1811 = "「…………っ」"
1813 = "「…………Trưởng ga……Cái đó rốt cuộc là con gì nhỉ.」"
1816 = "「……」"
1826 = "「……Paulette, thật sự rất thích đường sắt nhỉ.」"
1828 = "「……Ra là vậy.\\nVậy, nơi làm việc cũng không phải ở Ohimitera?」"
1829 = "「……Ra là vậy, thú vị thật đấy.」"
1832 = "「……Ra ngoài đi dạo một chút vậy.」"
1833 = "「……Bằng cách kết hợp khéo léo các tài nguyên kinh doanh,\\nlợi nhuận tạo ra sẽ phình to lên rất nhiều.」"
1836 = "「……Ngọt quá.」"
1839 = "「……Uy nghiêm.」"
1840 = "「……Tôi, là chủ sở hữu của Hachiroku.」"
1842 = "「……Có vẻ như thiếu một vài dữ liệu cơ bản,\\ncái đó là――」"
1845 = "「……Paulette này,\\ncô bắt đầu thích đường sắt từ khi nào vậy?」"
1849 = "「……Cứ bắt tay vào làm mới thấy dễ hơn là ngồi lo lắng, sao.」"
2234 = "「Không. Ở đây――ở đây tốt hơn.」"
2236 = "「Không. Phải gọi là……uy dung mới đúng, với những thứ như thế này.\\nDù bây giờ không thể chuyển động, nhưng nó vẫn đẹp đẽ, và thậm chí còn đáng tin cậy.」"
2238 = "「Có vẻ thú vị đấy. Nếu có gì cần giúp thì cứ nói với tôi.\\nCó thể nó cũng sẽ góp phần vào việc chấn hưng du lịch đấy.」"
2239 = "「Không sao. Nếu cô đang vội thì――」"
2245 = "「Mặc dù vậy, cũng đừng vội vàng chạy về đấy.\\nNhỡ đau lưng thì khổ.」"
2246 = "「Chỉ là, tôi nhát gan thôi. Liệu có nguy hiểm không nhỉ? Nghĩ vậy,\\nnhững lúc đó, tôi chỉ cẩn thận một chút thôi.」"
2247 = "「Nếu việc cho ăn suôn sẻ――nhỉ.」"
2248 = "「Nhưng, khoản đầu tư đó không hoàn toàn là hoa nở không kết trái,\\nmà đã thay đổi hình thức, và nở rộ ở Hiroshima sau này đúng không ạ?」"
2249 = "「Nhưng, theo như những gì tôi nghe được, ví dụ như các em gái của Hachiroku,\\ntôi nghĩ số lượng có vẻ khá lớn……」"
2250 = "「Không, nếu cô cử động được thì bây giờ không còn chuyện gì để nói nữa.\\nTôi đã lo lắng không biết có phải cô bị đau lưng không.」"
2253 = "「Không, chỉ những chuyện vừa rồi cũng đủ để tham khảo rồi.\\nCảm ơn cô.」"
2255 = "「Vâng, tôi biết anh bị Navi cấm mang theo mà.」"
2257 = "「Không phải là không thể, cậu định chứng minh điều đó như thế nào?」"
2260 = "「Tòa nhà chính?」"
2264 = "「Bà ấy cũng là người đã chế tác……Railord cỗ máy chuyên dụng số hiệu đầu tiên mới nhất,\\ncuối cùng của Kyushu. Tay nghề của bà ấy thì không phải bàn cãi.」"
2267 = "「Vậy ra, bé Sou muốn có tài nguyên kinh doanh nhỉ?\\nTài nguyên mà bé Sou có thể tự mình trang trải, không cần dựa dẫm vào nhà Migita.」"
2268 = "「Nghĩa là rượu shochu được tạo ra từ cùng một loại vật liệu,\\nvới nguồn động lực của đầu máy hơi nước nhỉ.」"
2273 = "「Tôi đưa ra lời khuyên, là được chứ gì?」"
2277 = "「Reina hôm nay,\\ndành khá nhiều thời gian cho việc bảo dưỡng nhỉ.」"
2283 = "「Sử dụng nó một cách bình thường,\\nthì sẽ kiếm được mức lương theo giờ của người dọn dẹp là 750 yên nha.」"
2286 = "「Ngài ấy rất thận trọng trong việc bản thân gây ảnh hưởng đến sự việc――,\\nlà người như vậy, nên tôi nghĩ trong giai đoạn củng cố nền tảng thì hơi sớm.」"
2287 = "「Vì ngài ấy có vẻ rất mệt mỏi.\\nNên lúc đó chúng tôi đã xin phép cáo lui, và hẹn lại vào hôm nay.」"
2288 = "「Tài nguyên kinh doanh của đứa trẻ đó là, sự cẩn thận và kiên nhẫn,\\ntay chân lanh lẹ, và đôi mắt cẩn trọng, là những thứ đó đấy.」"
2293 = "「Có vẻ là định như vậy.\\nNhưng cung tư tế Akai không bị lung lạc mà đã tìm cách đuổi về được.」"
2294 = "「Cũng không dễ dàng như vậy đâu nhỉ.」"
2298 = "「Khoảng bảy giờ tôi không nghe máy được,\\nrồi cứ thế trễ mất, gọi lại thì cũng...」"
2299 = "「Vụ chó trưởng ga mà cô nói hôm trước à?」"
2302 = "「Anh Soutetsu cũng biết nhỉ.\\nNhưng nghe nói cung tư tế Akai không làm việc ở nhà máy đâu.」"
2304 = "「Cậu đã từng đến đây mà.\\nCùng gia đình đến lễ bái.」"
2306 = "「Bà ấy là kiểu người không hay nói về bản thân sao?」"
2307 = "「Thấy chưa? Gần hơn đúng không?」"
2308 = "「Cô có biết cô gái tên Houshou Kisaki không?」"
2312 = "「Tiêu biểu là việc tận dụng diện tích mặt bằng rộng lớn và sức thu hút khách hàng của công ty đường sắt,\\nđể vận hành khách sạn, du lịch, cơ sở thương mại và những thứ tương tự ạ.」"
2315 = "「Bây giờ không phải là bảo dưỡng đâu. Em ấy đang cùng với Hibiki\\n……Anh nhớ không? Chú mèo con hôm trước ấy.」"
2317 = "「Cũng không hẳn là đã gặp.\\nChỉ là hẹn lại một cuộc gặp khác thôi.」"
2326 = "「Thận trọng trong việc gây ảnh hưởng, nghĩa là sao?」"
2331 = "「Cùng một loại mà? Chẳng phải vị giống nhau sao?」"
2333 = "「Hachiroku. Chúng ta đến nhà xưởng ủ rượu thôi.\\nTrước tiên, hãy thử thảo luận với chị Mayami xem sao.」"
2335 = "「Cô Hachiroku là Railord của đầu máy hơi nước dòng 8620.\\nVà, dòng 8620 được chế tạo với số lượng rất lớn đấy.」"
2337 = "「Hachiroku, em ra ngoài trước đi.\\nTôi có chuyện muốn nói với Paulette một chút.」"
2339 = "「Hachiroku? Tổng danh xưng của dòng 8620, à không, phải gọi là tên thân mật sao?\\nCái đó, cũng là Hachiroku giống em sao?」"
2340 = "「Sáu trăm bảy mươi mốt.」"
2345 = "「Cái mũi thính và kinh nghiệm,\\nđã làm cho tiền lương tăng vọt lên gấp đôi sao ạ.」"
2347 = "「Tôi nghĩ đó là những đức tính tuyệt vời.」"
2351 = "「Ra là vậy. Quả nhiên là người có năng lực sao.」"
2352 = "「Ra là vậy.」"
2353 = "「Ra là vậy, kiểu gọi là con lai sao?\\nÀ, thời buổi này gọi là mang hai dòng máu thì tốt hơn nhỉ?」"
2354 = "「Vậy sao. Các Railord không phải cỗ máy số hiệu đầu tiên,\\nsẽ tự gọi mình bằng tên thân mật của cỗ máy đó đúng không?」"
2355 = "「Hà~, ra là vậy.\\nQuả không hổ danh là anh Soutetsu.」"
2356 = "「Ra là vậy, đúng là khiến người ta cuống quýt thật.\\nCái thứ gọi là hôn gián tiếp ấy.」"
2364 = "「Nếu vào xưởng đầu máy bằng đá,\\nthì đi đường này sẽ gần hơn đấy.」"
2377 = "「Nếu sửa chữa lại――\\nNghĩa là nếu bảo dưỡng phục hồi thì có thể dùng được sao.」"
2378 = "「Vì là khu vực dành cho toa hành khách và toa chở hàng, nên gọi là khu toa khách toa hàng.」"
2380 = "「Cô có phiền cùng tôi đi xác nhận tài nguyên kinh doanh của tôi không?」"
2391 = "「Kinh doanh phụ trợ.」"
2393 = "「Ufufu. Bé Sou, em nhận ra tốt lắm nha.」"
2395 = "「Ufufu, góc độ này, tôi khá là thích đấy.」"
2396 = "「Phù」"
2398 = "「Oa, đúng là vừa nãy thật.\\nXin lỗi anh, tôi đi vội quá nên không để ý.」"
2399 = "「Chà……hôm nọ thật thất lễ quá.」"
2401 = "「Ái chà. Thật thất lễ khi chưa tự giới thiệu mà đã kể chuyện xưa.\\nTôi là cung tư tế của đền này, Akai Kiyoharu.」"
2402 = "「Ô kìa.」"
2404 = "「Ây da, bé Sou và bé Hachiroku.\\nĐến \\x%l醸造蔵;#00ffc040;nhà xưởng ủ rượu%l;#; thế này, hiếm thấy ghê nha.」"
2406 = "「Hả!? Anh Akai――\\nCô ta định lung lạc cả đền thờ sao?」"
2407 = "「Hả? A! A!!」"
2408 = "「Ồ……」"
2409 = "「A.」"
2410 = "「Ồ, đã đến giờ rồi sao.\\nNói chuyện thì thời gian trôi qua nhanh thật.」"
2413 = "「À. Ra là vậy. Lấy một ví dụ cực đoan,\\ngiống như việc Thiên hoàng Hinomoto không phát ngôn về chính trị sao.」"
2415 = "「À, chú chó con đó à.」"
2416 = "「Ồ.」"
2418 = "「Ồ? Một món đồ từ thời đại cũ thế này,\\nchẳng phải là cực kỳ hiếm sao?」"
2419 = "「Hừm.」"
2420 = "「Ư, ừm.」"
2421 = "「A…………ư――ừm.\\nTôi xin nhận, nhé.」"
2423 = "「A, à. Đúng vậy nhỉ. Cô nên nghỉ ngơi sớm đi.」"
2425 = "「A, xin l――khụ――ưm.\\nHôm nay, ở hội đồng thành phố, lúc trả lời chất vấn――ưm――hơi dài.」"
2426 = "「A.」"
2427 = "「A!」"
2429 = "「A! Đú, đúng, đúng vậy――\\nĐúng là thế, nhưng mà!」"
2431 = "「A! Lò hơi than có nghĩa là.」"
2433 = "「A, xin lỗi anh Soutetsu.\\nNói chuyện, trong lúc tôi thay đồ được không?」"
2435 = "「A, không phải!\\nTôi đang vội đến đây xem có gặp được anh Soutetsu không ấy mà.」"
2436 = "「Chà, lại gấp đôi nữa nhỉ.」"
2437 = "「A, vâng. Đi đường cẩn thận.\\nTôi cũng sắp phải đi họp hội đồng thành phố rồi.」"
2439 = "「A, là tòa nhà chính của nhà ga ấy.\\nNơi có phòng trưởng ga các thứ.」"
2442 = "「A, tiếc quá. Hết mất rồi.」"
2444 = "「À, đúng là có phần màu mái bị thay đổi từ giữa chừng nhỉ.\\nPhía sau đó nữa là――phần cơi nới lộ liễu sao.」"
2445 = "「Cô uống cái này đi.」"
2446 = "「Bình thường và……kết hợp khéo léo sao ạ?」"
2448 = "「Ừ. Chính ngài ấy nói vậy.\\nKisaki――có vẻ khá là dai dẳng đấy.」"
2450 = "「Ừm. Đúng là vậy. Em muốn nhờ chị.」"
2452 = "「Ừm. Tất nhiên là sẽ nhờ em giúp rồi.」"
2453 = "「Hừm.」"
2454 = "「Ừm ừm.」"
2455 = "「Ừm ừm, có vẻ em đã hiểu rõ chỗ đó rồi nhỉ.」"
2457 = "「Hửm?」"
2459 = "「Ufufu, lúc đó sẽ nhờ anh nhé, anh Soutetsu.」"
2461 = "「Ufufu. Vậy sao.\\nThế thì, tôi xin nhận học phí nhé~.」"
2462 = "「Ồ. Đích thân Thiên hoàng chiêu đãi sao.」"
2464 = "「Hừm.」"
2466 = "「Tôi không mang điện thoại mà.」"
2475 = "「Tuyệt quá! Nếu là loại rượu đó\\nthì dù có gây ra hiện tượng cháy bất thường tôi cũng nhất định muốn uống thử.」"
2477 = "「Cơ duyên thì, có vài cái cơ.」"
2479 = "「Nữ lái tàu sao? Tôi nghe Hachiroku nói là hiếm lắm mà.」"
2482 = "「Bà nội, thấy thương cho tôi.\\nNên đã tặng tôi cái này làm kỷ vật.」"
2483 = "「Bà nội?」"
2485 = "「Hình dáng, hay nói đúng hơn là đặc điểm chung.\\nVì ngoài những cái đó ra thì sự khác biệt giữa các cá thể là khá lớn.」"
2487 = "「Là mẹ đẻ của sản phẩm cực kỳ ăn khách tên là 『Shochu Sữa Đậu Nành』,\\nsử dụng sữa đậu nành để nấu rượu shochu nha.」"
2489 = "「Bà ấy là một nghệ nhân chế tác Railord bậc thầy. Vẫn đang tại vị.\\nBây giờ, bà ấy vẫn đang khám định kỳ cho cô Reina――」"
2490 = "「Về phần lương cố định, làm việc tám tiếng một ngày, sáu ngày một tuần――\\nQuy ra lương theo giờ thì khoảng 3000 yên nha.」"
2492 = "「Bà ấy từng làm ở khu đầu máy nào vậy?」"
2495 = "「Nào, là chuyện về đường sắt nhỉ.\\nCậu nói là muốn xin lời khuyên, cụ thể là về việc gì.」"
2497 = "「Nghe nói là vậy đó?」"
2499 = "「Vâng. Nếu ngài Soutetsu thấy vậy là ổn,\\nthì Hachiroku sẽ đi cùng ngài.」"
2500 = "「Vâng.」"
2501 = "「Vâng!」"
2503 = "「Tôi đã hiểu, cung tư tế Akai.」"
2505 = "「Vậy sao, ngài Soutetsu.\\nThế thì, tôi sẽ đi loanh quanh khu vực này.」"
2507 = "「Vâng, tôi rất sẵn lòng đi cùng.」"
2512 = "「Học phí?」"
2514 = "「Chắc chắn niềm tự hào vẫn còn đó.\\nNiềm tự hào vì đã chuyên chở biết bao nhiêu người――vẫn chưa hề hoen gỉ.」"
2516 = "「Có vẻ em ấy lo lắng sóng điện thoại\\nsẽ gây ảnh hưởng xấu đến các thiết bị liên quan đến bay.」"
2518 = "「Khu toa khách toa hàng?」"
2522 = "「Trong số các nhân viên tòa thị chính, có dì của cung tư tế.\\nNghe nói việc ngài ấy cất công đi làm ở Đường sắt Hoàng gia cũng vì lý do tương tự.」"
2525 = "「Chia sẻ bản thân việc phục hồi 8620 như một tài nguyên kinh doanh của toàn bộ Ohimitera.\\nĐể mọi người nghĩ rằng, có thể sinh ra lợi nhuận từ việc tận dụng nó.」"
2526 = "「Đối với bé Hachiroku,\\ntiền bạc, là thứ như thế nào nhỉ?」"
2529 = "「Kokura……Cũng từng được nhắc đến trong câu chuyện của ông lão Minokasa.\\nChắc chắn là nơi từng có nhà máy của Đường sắt Hoàng gia đúng không?」"
2530 = "「Khu đầu máy Kokura cũng được trang bị dòng 8620. Do đó,\\ncung tư tế Akai đã biết đến hình dáng của Railord dòng 8620.」"
2532 = "「Bé Sou? Trưởng hầm rượu ở đây là chị nha.\\nNếu là quyết định của trưởng hầm rượu thì đương nhiên là tuyệt đối rồi.」"
2535 = "「Nếu đặt tên, thì sao nhỉ――\\n『Shochu Hơi Nước・Hachiroku Ohimitera』 thì thế nào.」"
2537 = "「Bằng một vạn hai ngàn năm trăm ba mươi tư giờ của người dọn dẹp――\\nTính là lao động tám tiếng một ngày, thì là số tiền của khoảng bốn năm!」"
2546 = "「Đường sắt Hoàng gia những năm cuối đời đã đầu tư toàn bộ nguồn lực kinh doanh vào việc điện khí hóa,\\nnhưng không thu được lợi nhuận, và đã sụp đổ.」"
2555 = "「Từ đây nhìn cảnh sắc còn đẹp hơn nữa.\\nCũng có thể nhìn rõ 8620 lắm đó~.」"
2560 = "「Sao thế, mặt mũi đáng sợ quá vậy.」"
2561 = "「Sao thế?」"
2563 = "「Hèn chi, đúng là một món đồ tuyệt mỹ.」"
2569 = "「Có lẽ, là do ảnh hưởng của vụ tai nạn.」"
2571 = "「Rốt cuộc tại sao ngài lại biết\\ncả về tôi và Hachiroku vậy?」"
2572 = "「Chắc sẽ suôn sẻ thôi.\\nTheo như tôi biết, Hibiki rất được động vật yêu quý.」"
2574 = "「Tôi――đang nghĩ như vậy.」"
2576 = "「Lúc đầu, tôi cứ mơ hồ nghĩ là có thể làm được. Nhưng,\\nsau khi trải nghiệm đi thuyền xuôi dòng Kuma, tôi cũng hiểu ra là không hề dễ dàng.」"
2578 = "「Đến mức đó thì……tôi cũng,\\nchưa nói chuyện sâu với bản thân cung tư tế.」"
2580 = "「Tôi cũng từng trải qua vị trí lái tàu (kikanshi), nhưng cuối cùng thì tôi là người điều khiển tàu (untenshi).\\nỞ đoạn đường thử nghiệm Kokura, tôi đã điều khiển \\x%l電車;#00ffc040;tàu điện%l;#;.」"
2582 = "「Tôi cũng là người Hinomoto mà?\\nDù thời gian lớn lên ở Frank (Pháp) khá dài.」"
2583 = "「Trước đây tôi cũng từng nhìn thấy một chút rồi, thật là một món đồ tuyệt đẹp.」"
2590 = "「Tôi muốn hỏi về việc phục hồi đầu máy hơi nước.\\nChúng tôi đang suy nghĩ muốn lấy đó làm cơ hội để chấn hưng du lịch.」"
2591 = "「A, chúng tôi mới là người thất lễ vì đột ngột đến.\\nTôi là――」"
2592 = "「Bọn em có chuyện muốn thảo luận với chị Mayami.」"
2594 = "「Chuyện đó, tôi không bận tâm gọi thế nào đâu?」"
2596 = "「Tôi thì có gì mà không hổ danh?」"
2597 = "「Tôi ra ngoài một chút.」"
2599 = "「Vừa nãy, tôi có gọi điện thoại.」"
2601 = "「Lưng tôi, chỉ là hơi dễ bị mỏi thôi.\\nTôi cũng đi khám bác sĩ rồi, nhưng họ bảo không có vấn đề gì.」"
2604 = "「Tôi không rành về nhà ga lắm đâu,\\nchỉ tìm hiểu một chút về nơi này thôi.」"
2606 = "「Vâng.」"
2608 = "「Tôi mang một phần tư dòng máu. Là quarter.\\nÔng ngoại tôi là người Frank.」"
2609 = "「Tôi muốn dùng lời khuyên ngài ban cho làm tư liệu phán đoán,\\nvà tự mình đưa ra quyết định.」"
2610 = "「Điện thoại, tôi sẽ mong đợi nhé.」"
2612 = "「Hiện tại, em đang lên kế hoạch cho một việc cùng với nhóm Paulette.」"
2613 = "「Tôi không biết những chuyện của tương lai,\\ncũng không biết câu trả lời đúng đắn, hay hạnh phúc đối với cậu là gì.」"
2615 = "「Hơi nước đang bao trùm khắp xưởng ủ rượu này.\\nHơn nữa, có rất nhiều, rất nhiều đường ống chạy quanh nhưng mà.」"
2616 = "「Để tôi xem.」"
2617 = "「Tôi hiểu rồi.」"
2619 = "「Tôi biết cậu. Cậu Migita Soutetsu.」"
2620 = "「Tôi nghe người ta nói ngài từng làm việc ở Đường sắt Hoàng gia cũ――\\nCung tư tế, ngài từng là lái tàu sao?」"
2621 = "「Tôi có cảm giác nó không phải chó cũng chẳng phải mèo đâu.」"
2623 = "「Tôi nghĩ, thứ tự của các cậu đang sai lầm nghiêm trọng.」"
2624 = "「Tôi có cảm giác,\\nmình chưa kể được chuyện gì có ích cho lắm.」"
2628 = "「Không phải hàng nội địa đâu.\\nLà hàng sản xuất tại Meikoku (Mỹ) đấy. WALLTHAM.」"
2629 = "「Đã bảo là, đừng có vội vàng mà.」"
2631 = "「Tôi á!? Tôi á, kiến thức còn nông cạn lắm, mấy thứ đó,\\nhoàn toàn không――khụ, khụ!」"
2633 = "「Hoặc có thể gọi là trường hợp kiểu mẫu cũng được.\\nTôi muốn cho thấy sự phục sinh không phải là không thể, và biến nó thành một ngọn cờ đầu.」"
2636 = "「Chính vì vậy, bây giờ tôi đã tiến thêm một bước trong suy nghĩ.\\nMuốn biến bản thân việc phục hồi 8620 thành một loại hình mẫu.」"
2637 = "「Và, chuẩn bị ở đây đại khái là, xoay sở tiền bạc.\\nNhững gì ngài ấy nói, tuy là rất có lý nhưng mà.」"
2638 = "「Nếu vậy, tài nguyên kinh doanh là――\\nLà những chất liệu có thể dùng để kiếm tiền, phải không ạ.」"
2644 = "「Không gọi được, sao――」"
2645 = "「Gặp tôi?」"
2647 = "「Kết hợp các tài nguyên kinh doanh.\\nNhờ đó, lợi nhuận sẽ tăng lên gấp nhiều lần.」"
2652 = "「Tiếp theo, về việc phục hồi 8620.」"
2656 = "「Nghe nói là ở Kokura.」"
2657 = "「Nới lỏng van thì nước sẽ tuôn ra mạnh, đóng lại thì nước sẽ ngừng.\\nChỉ đơn giản làm như vậy, để kiểm soát nhiệt độ nha.」"
2661 = "「Nếu vậy thì, nhất định!\\nNhất định tôi phải nhờ bà ấy xem giúp.」"
2663 = "「Vì là lời khuyên được đưa ra dựa trên điều đó, nên có lẽ sẽ không chỉ ra được điều gì cả.\\nNhư vậy cũng được chứ?」"
2667 = "「Nếu vậy thì.」"
2668 = "「Vậy thì, lúc đó thử bán sản phẩm dùng thử xem sao nha.\\nNếu thấy ổn, thì sẽ triển khai chính thức cùng với sự phục sinh của 8620.」"
2672 = "「Là cựu lái tàu thôi. Bây giờ, tôi chỉ là một cung tư tế.」"
2678 = "「Đúng vậy nha. Nếu sử dụng bình thường thì kiếm được bình thường,\\nnếu kết hợp khéo léo thì sẽ kiếm được bộn tiền, là loại chất liệu như vậy đó.」"
2679 = "「Đúng vậy đó? Mèo trưởng ga.」"
2681 = "「Đúng vậy nhỉ.」"
2682 = "「Vâng, chị Mayami.」"
2683 = "「Vậy sao. Vậy thì, trước tiên là về cô Hachiroku.」"
2684 = "「Vậy sao? Nếu thế thì tôi vui lắm.」"
2685 = "「Vậy sao? Thế, cái này thì sao?」"
2687 = "「Là do sự suy giảm chức năng của tôi.\\nCó vẻ như tôi không thể trích xuất dữ liệu một cách trơn tru.」"
2689 = "「Ý cô là Đường sắt Điện lực Hiroshima sao.\\nRa là vậy――nếu nghĩ như thế, thì chúng tôi cũng được đền đáp phần nào nhỉ.」"
2691 = "「Đúng vậy. Nhưng――cái này.\\nChỉ riêng chuyện về cái này, thì bà đã kể cho tôi nghe.」"
2693 = "「Vâng. Hokkaido, Shikoku, Kyushu――Trên toàn cõi Hinomoto.\\nĐường sắt Hoàng gia đã tuyệt vọng coi \\x%l電車;#00ffc040;tàu điện%l;#; chính là con bài tẩy để phục sinh.」"
2695 = "「Vâng. Tôi và 8620,\\nchắc chắn là tài nguyên kinh doanh của ngài Soutetsu.」"
2696 = "「Vâng. Người chủ đạo kế hoạch có lẽ là tổng giám đốc Ngân hàng Kumamoto,\\ncha của cô Kisaki, ông Houshou Mototada.」"
2698 = "「Đúng là như vậy.」"
2699 = "「Vâng, bà nội Katsuko.\\nNghe chuyện ngày xưa bà từng làm lái tàu.」"
2701 = "「Vâng, tôi mong ngài sẽ làm vậy.」"
2703 = "「Hãng sản xuất khác nhau nhỉ.\\nCủa Hachiroku là của hãng TEIKO cơ.」"
2704 = "「Số điện thoại của thợ sửa lò hơi phải không?」"
2711 = "「Là chữ đó sao. Ra là vậy, tôi hiểu rồi.」"
2712 = "「Ra là vậy sao……」"
2713 = "「Ồ.」"
2714 = "「Chà!」"
2715 = "「Vâng. Hôm nay, chúng tôi đến thăm\\nđể xin ngài lời khuyên về đường sắt.」"
2717 = "「Vâng! À, anh Soutetsu, cảm ơn anh!」"
2718 = "「Cỗ máy chuyên dụng số hiệu đầu tiên của dòng 8620……\\nLà của vụ tai nạn đó, sao.」"
2720 = "「Chúc ngủ ngooooooooon.」"
2723 = "「Đại từ nhân xưng ngôi thứ nhất thông thường?」"
2724 = "「Thấy viết như vậy đấy.\\nNghe nói bản thân xưởng đầu máy bằng đá, ban đầu cũng chỉ có phần mái xanh kia thôi.」"
2725 = "「Đã từng được cơi nới vài lần sao?」"
2728 = "「Phần gần nhất, gần chỗ đổ tro,\\nphần lợp tôn lộ ra ngoài ấy, là phần được cơi nới cuối cùng.」"
2730 = "「Phần cuối cùng……\\nVậy, là cơi nới cho \\x%lディーゼル機関車;#00ffc040;đầu máy diesel%l;#; hay sao?」"
2734 = "「Chuyện cần thảo luận? Vậy thì, lên phòng khách nhé?」"
2736 = "「Cơ duyên quan trọng thì có rất nhiều.\\nNhưng, nếu nói về cái đầu tiên nhất thì là bà nội tôi.」"
2738 = "「Có nha. Tuy nhiên,\\nnếu muốn dùng thì phải sửa chữa lại khá nhiều đấy.」"
2749 = "「Quả nhiên là anh nhận ra sao.\\nKhông hổ danh là anh Soutetsu nhỉ.」"
2753 = "「Theo “Lịch sử ga suối nước nóng Ohimitera”, xưởng đầu máy này,\\nđược xây dựng cùng với \\x%l本屋;#00ffc040;tòa nhà chính%l;#; vào năm Minh Trí thứ 41 đấy.」"
2755 = "「Chữ Hán giống với chữ “nhà sách” bán sách, đọc là “hon-oku”.\\nHơi rắc rối một chút nhỉ, chữ Hán ấy.」"
2756 = "「Niềm tự hào, sao.」"
2758 = "「Về việc cô không khỏe.\\nTôi nghĩ cô nên đến thảo luận với chủ nhà tắm Tororyu-yu.」"
2766 = "「Vừa vặn, giống với xưởng đầu máy này.\\nNghe nói ban đầu nó cũng chỉ bằng khoảng một phần tư thế này thôi.」"
2768 = "「Ở Kokura thì lái tàu cộng sự sẽ đặt tên và đăng ký.\\nNhư Yae, Rikka, Futaba, chọn bất kỳ số nào liên quan đến 862 cho dòng 8620.」"
2769 = "「Ví dụ nha, bé Hachiroku.\\nNhìn xem? Đứa trẻ đó.」"
2773 = "「Trước khi tập hợp người hợp tác,\\nphải chuẩn bị đủ để duy trì công việc khi nó bắt đầu.」"
2774 = "「Biểu cảm lại thay đổi nữa nhỉ.\\nSo với lúc nhìn từ hướng sân ga.」"
2781 = "「Ông Taito……nhờ cậy về tôi sao?」"
2782 = "「Là việc anh tự mình tìm đến được chỗ cung tư tế Akai đấy.\\nTôi vốn định để một thời gian nữa mới giới thiệu cơ.」"
2783 = "「Ngài ấy là một người khá thực tế nhỉ, cung tư tế Akai ấy.」"
2784 = "「Đúng vậy. Railord Hachiroku,\\nlà danh xưng chỉ dành riêng cho tôi, cỗ máy số hiệu đầu tiên.」"
2785 = "「Đúng vậy.\\nTôi nghĩ chính xác là cảm giác đó.」"
2786 = "「Đúng vậy. Dùng chính xác cùng loại than mà 8620 sử dụng,\\nvà dùng nước đó để nấu rượu shochu.」"
2794 = "「Đẹp――――ừm.」"
2795 = "「Tại sao lại để một thời gian nữa?」"
2799 = "「Và, khi việc phục hồi lò hơi than thành công,\\nchúng ta sẽ dùng nó để nấu rượu shochu.」"
2800 = "「Và, cô bác ở đằng kia, ngoài những thứ từ trước đến nay, còn sở hữu\\ntài nguyên kinh doanh gọi là ý tưởng nha.」"
2802 = "「Nhưng, nếu vẫn bị lỗ, thì phải kiếm tiền\\ntừ các hoạt động kinh doanh phụ trợ ạ.」"
2805 = "「Reina cũng vậy mà? Thế nên tôi,\\ndù hơi sớm nhưng đang định bắt đầu chuẩn bị đây.」"
2811 = "「Đã từng được ca ngợi đến mức,\\n『Nơi nào có đường sắt, nơi đó không thể không thấy bóng dáng Hachiroku』.」"
2812 = "「Mạng sống của anh Soutetsu là ưu tiên hàng đầu mà.\\nĐương nhiên là em ấy sẽ quyết định như vậy rồi.」"
2813 = "「Cũng không phải tập trung ở một chỗ,\\nhay tất cả mọi người đều hoạt động cùng một lúc――」"
2814 = "「Cung tư tế cũng bận rộn nhỉ.」"
2815 = "「Nghe nói bà nội tôi đã đảm nhận vị trí lái tàu của chuyến tàu ngự dụng đó.\\nĐây là món quà mà bà nhận được từ tổng thống lúc bấy giờ đấy.」"
2816 = "「Nghe câu chuyện đó, tôi cũng muốn trở thành lái tàu.\\nThế là, tôi đã cố gắng học hỏi về đường sắt――nhưng mà.」"
2817 = "「Tất nhiên rồi. Ngân hàng――\\nLà giám đốc chi nhánh Ohimitera của Ngân hàng Kumamoto, nghĩa là...」"
2818 = "「Tất nhiên là bằng sự phục sinh và lăn bánh của 8620.\\nĐể làm được điều đó, tôi muốn thực hiện các công việc cần thiết ở Ohimitera càng nhiều càng tốt.」"
2821 = "「Nhà tắm Tororyu-yu, sao ạ?」"
2822 = "「Chủ nhà tắm Tororyu-yu mà ngài nói,\\nlà……bà cụ lớn tuổi đó sao ạ?」"
2826 = "「Người hoạt động tích cực nhất trong thành phố chắc chắn là cô Kisaki.\\nNói chính xác hơn là, cô ấy hành động, và mang lại kết quả――đấy ạ.」"
2829 = "「Nếu là em gái trực hệ thì có 671 người.」"
2831 = "「Có vẻ là vậy.」"
2833 = "「Thật muốn cứu lấy nó nhỉ.」"
2835 = "「Trời ạ.」"
2839 = "「Chị Mayami, em nhớ chị từng nói là trong nhà này\\nvẫn còn một cái lò hơi than không dùng đến.」"
2842 = "「Dựa trên điều đó, chị Mayami, có một chuyện em muốn chị chỉ cho em.」"
2848 = "「Thực tế……nhỉ.\\nVì thế, tôi mới nhận ra sự suy tính non nớt của bản thân.」"
2853 = "「Có chắc cô ta là nhân vật trung tâm của phe ủng hộ thu hút nhà máy Aircra không?」"
2855 = "「Lời mời với điều kiện hấp dẫn từ công ty Aero-Craftech,\\nbà ấy cũng liên tục từ chối vì tình yêu dành cho đường sắt.」"
2857 = "「Đến mức chế tác cả cỗ máy chuyên dụng số hiệu đầu tiên cơ ạ!\\nÔi, không ngờ một người tuyệt vời như vậy lại ở ngay gần đây.」"
2858 = "「Hình mẫu.」"
2868 = "「Đường ống van màu đỏ là nước nóng.\\nĐường ống van màu xanh là nước lạnh chạy qua nha.」"
2880 = "「Tài nguyên kinh doanh……Việc tận dụng sự kết hợp của chúng.\\nNếu làm tốt được thì thật là lý tưởng.」"
2881 = "「Tài nguyên kinh doanh là gì vậy ạ?」"
2885 = "「Dù sao thì cũng là lò hơi than.\\nNếu không thể phục hồi, thì mọi thứ sẽ chỉ là chiếc bánh vẽ mà thôi.」"
2886 = "「Dù sao thì, nghe nói Kisaki đó đã đến thăm.\\nTrước khi chúng tôi đến thăm chỗ cung tư tế Akai.」"
2887 = "「Nói chung là đứa bé đó.\\nCó vẻ hai đứa đang định cho ăn để làm quen.」"
2888 = "「Tìm cách?」"
2894 = "「Hơn nữa, chỗ chúng ta sẽ trả cho người phát triển sản phẩm mới,\\nmột khoản tiền thưởng khích lệ――thù lao lợi nhuận bằng 10% lợi nhuận nha.」"
2896 = "「Và, cả Paulette, Hibiki, ông lão Minokasa,\\nNagi, Fukami, mỗi người đều có tài nguyên kinh doanh riêng.」"
2898 = "「Và người đi cùng là Railord cỗ máy chuyên dụng số hiệu đầu tiên của dòng 8620.\\nNói cách khác, cô chắc chắn là cô “Hachiroku” đúng không?」"
2900 = "「Dựa vào đó, Hachiroku có dấu hiệu\\nhay gì đó để nhận biết là cỗ máy số hiệu đầu tiên đúng không?」"
2901 = "「Khi tổng thống Meikoku đến thăm,\\nnghe nói họ đã dùng tàu ngự dụng để ông ấy di chuyển.」"
2902 = "「Nghe nói vào thời hoàng kim, đầu máy không chứa hết nên phải cơi nới thêm.\\nCùng với đó, họ cũng cơi nới thêm phần khu toa khách toa hàng nữa.」"
2904 = "「Khi có thể làm được việc đó,\\nlương theo giờ sẽ tăng vọt lên 1500 yên nha.」"
2906 = "「Tôi đang mong muốn có thể làm như vậy.\\nVì thế, hiện tại chúng tôi đang trong giai đoạn tìm kiếm người hợp tác.」"
2909 = "「Nếu lý tưởng có thể mài ra ăn được, thì đường sắt hay chèo thuyền xuôi dòng đã chẳng suy thoái.\\nĐiều cần thể hiện trước tiên, là 『sự thật có thể mài ra ăn được』 sao.」"
2921 = "「Nếu được chị làm vậy, thì tốt quá.」"
2922 = "「Từng đó Railord với những tên thân mật khác nhau……\\nNgười đặt tên không thấy khó khăn sao?」"
2930 = "「Có thể……làm được đấy nha.\\nViệc phục hồi chiếc 8620 đó, đương nhiên là sẽ làm công khai chứ?」"
2931 = "「Không có gì đâu ạ.\\nChúng tôi mới là người đột nhiên đến thăm.」"
2932 = "「Nước nóng, nước nóng được đun sôi bằng cách nào vậy ạ?」"
2933 = "「Vâng.」"
2934 = "「Nhất định hãy để tôi giúp một tay.\\nVề cấu tạo của lò hơi, tôi cảm thấy ký nhớ của mình rất rõ ràng.」"
2935 = "「Cảm ơn chị――chị Mayami.」"
2936 = "「Cảm ơn anh, anh Soutetsu!\\nỪm, tiền thì...」"
2937 = "「Ý cậu là,\\ntập trung con người và công nghệ ở Ohimitera sao.」"
2951 = "「Lợi nhuận mà Shochu Sữa Đậu Nành kiếm được trong vòng một năm ngoái,\\nthực sự là chín mươi tư triệu yên nha.」"
2960 = "「Đền Akai Aso là ngôi đền lớn nhất và lâu đời nhất ở Ohimitera,\\ntất nhiên, số lượng giáo dân cũng rất đông, nên có sức ảnh hưởng lớn.」"
2961 = "「Ngài thật tinh tường, lái tàu Akai.」"
2963 = "「Nhà ga quả nhiên cũng thú vị nhỉ.\\nCùng với lịch sử của đường sắt, nó đã khắc ghi lịch sử suốt một thời gian dài.」"
2986 = "「Chuyện đó――tôi có nhớ.」"
2987 = "「Đúng vậy, đối với một người Hinomoto như tôi cũng hơi khó.」"
2988 = "「Không thể đảm bảo được, nhưng có khả năng nha.」"
2989 = "「Chà, thật thanh tao. Ở Teio,\\nlại là tên gọi theo số thứ tự Haro 1, Haro 2 cơ đấy.」"
2990 = "「Tôi không biết. Bà đã làm việc ở đâu, đến khi nào,\\nvà đã lái loại đầu máy nào, mấy chuyện đó.」"
2991 = "「Chỉ cần kết hợp kinh nghiệm với ý tưởng,\\nlà có thể kiếm được chừng đó thu nhập thụ động, là một ví dụ thực tế nha.」"
2992 = "「Đó là」"
2993 = "「Đây là danh sách các hạng mục cần phục hồi phiên bản hiện tại.」"
2994 = "「Ồ.」"
2995 = "「Vậy sao. Nếu thế thì tôi yên tâm rồi.」"
2996 = "「Ồ.」"
2997 = "「À, cổ họng cô bị mệt sao.\\nĐợi một chút.」"
2998 = "「Vậy sao, nếu thế, tối nay tôi sẽ gọi điện thoại báo cáo.」"
2999 = "「Thậm chí, đó chính là điều tôi mong muốn.」"
3000 = "「Như thế thì quá nhạt nhẽo rồi――\\nÀ không.」"
3001 = "「Đứa trẻ bên này, ngoài những tài nguyên giống vậy, còn mang theo\\ncái mũi thính và kinh nghiệm, nên được giao làm công việc trông coi men kōji nha.」"
3002 = "「Vậy ra,\\nhai người cũng đã đi gặp cung tư tế Akai rồi sao.」"
3003 = "「Chút đó cứ để tôi mời đi.\\nNếu cô ngại, thì cứ coi như là học phí đi.」"
3004 = "「Tôi không hề biết đấy.\\nNgay cả ở khu đầu máy Kokura, cũng đã thử nghiệm vận hành \\x%l電車;#00ffc040;tàu điện%l;#; sao.」"
3006 = "「Còn nữa, yuzu mật ong!\\nCảm ơn anh đã đãi――à này――ngọt lắm ạ!」"
3007 = "「Còn những chỗ khác thì sao?\\nCó điều gì không hiểu, hay có điều gì bận tâm không?」"
3009 = "「Chuyện đó――ừm」"
3016 = "「Chỗ này ạ!」"
3017 = "「À này! Tôi! À này!\\nNgày mai, từ sáng sớm, tôi cũng có ca trực! Nên là.」"
3019 = "「Nếu vậy, lương theo giờ sẽ là bao nhiêu ạ?」"
3021 = "「Vậy việc ngài biết về tôi, là vì sao?」"
3023 = "「Vậy, tôi xin phép đi trước.」"
3025 = "「Nếu vậy thì làm gì?」"
3026 = "「Lúc đó, tôi đã được nhờ cậy. Từ ông Migita――\\nÔng nội của cậu, ông Taito.」"
3027 = "「Chuyện đó, đương nhiên là bằng lò hơi rồi.」"
3028 = "「Nếu vậy thì, tài nguyên kinh doanh của công ty đường sắt sẽ là, diện tích mặt bằng, sức thu hút khách hàng,\\nđoàn tàu và nhân sự có thể kiếm được thu nhập từ giá vé, nhỉ.」"
3030 = "「Nào.」"
3031 = "「Nếu muốn nói chuyện, hay là chúng ta cứ vừa đi vừa nói nhé?\\nĐúng lúc tôi cũng đang định đi về phía nhà ga.」"
3032 = "「Hai người nói là muốn nói chuyện, vậy...」"
3033 = "「Kế hoạch phục hồi 8620 thì sao?\\nĐã tiến triển đến mức độ nào rồi?」"
3034 = "「Công việc ở xưởng ủ rượu, hay công việc ở công ty đường sắt,\\nvề điểm đó, hoàn toàn không có gì khác biệt nhỉ.」"
3039 = "「Kiểm soát nhiệt độ,\\nlà phần quan trọng nhất trong việc nấu rượu shochu nha.」"
3043 = "「Tiền bạc……Tiền bạc là thứ sẽ chuyển sang có lãi,\\nnếu cắt giảm chi phí cố định và tăng thu nhập từ giá vé ạ.」"
3044 = "「Đường sắt, sao.」"
3047 = "「Tên thân mật của các Railord từ sau cỗ máy số hiệu đầu tiên,\\ncách đặt tên khác nhau rất nhiều tùy thuộc vào khu đầu máy đó.」"
3050 = "「Điểm đó có hơi đáng tiếc một chút, nhưng tôi vẫn rất vui.\\nKhi biết được việc nấu rượu shochu và đầu máy hơi nước cũng có điểm tương đồng.」"
3051 = "「Cứu được mà. Nếu là anh Soutetsu.\\nKhông――nếu là tất cả chúng ta.」"
3052 = "「Ngài Soutetsu. Đã đến lúc ngài nên để ý thời gian rồi ạ.」"
3053 = "「Ngài Soutetsu?」"
3056 = "「Chấn hưng du lịch bằng SL sao.」"
3062 = "「Thứ cần thu thập đầu tiên, không phải là người hợp tác――\\nMà là tiền.」"
3063 = "「Cô ấy sử dụng đại từ nhân xưng ngôi thứ nhất thông thường.\\nĐối với Railord cỗ máy số hiệu đầu tiên.」"
3067 = "「!!!!」"
3068 = "「!?」"
3071 = "「Mười phần trăm của số đó, tức là chín triệu bốn trăm nghìn yên.」"
3072 = "「Thù lao lợi nhuận 10%.」"
3074 = "「Đẹp thật nhỉ, 8620.\\nTrông còn đen hơn cả màn đêm nữa.」"
3076 = "「Là \\x%l8620;#00ffc040;8620%l;#; nhỉ, tất nhiên rồi!」"
3231 = "Nguy hiểm thật.\\nCâu chuyện đang trật bánh nghiêm trọng――à không, đang đi chệch hướng."
3234 = "Không cần cố tình bắt nhịp mà vẫn có thể đi cùng một nhịp độ,\\nthật sự mang lại một cảm giác thoải mái khó tả."
3236 = "Sự im lặng ngắn ngủi chưa đầy một giây."
3242 = "Nhưng――bây giờ tôi hiểu rõ ràng rằng đó chỉ là sự bướng bỉnh vô vị.\\nChị Mayami mới là người cần được lôi kéo và tận dụng hơn bất kỳ ai khác."
3243 = "Nhưng có vẻ không phải lò hơi than, mà nhiên liệu là dầu diesel.\\nNghe vậy, Hachiroku khẽ mỉm cười đáp lại."
3244 = "Nhưng, chỉ thế thôi thì vẫn chưa đủ.\\nDù có đủ, thì như thế cũng không được."
3245 = "Nhưng, tôi cũng vậy,\\ntôi không muốn giao phó quyết định mình phải làm cho bất kỳ ai."
3246 = "Nhưng, hơn cả điều đó, chính cảnh sắc nơi đây\\nđã khiến tôi cảm thấy 『thật tốt vì đã đi đường này』."
3248 = "Không, để Hachiroku có thể hiểu chính xác với số bước ít nhất,\\nchị Mayami đã dẫn dắt Hachiroku."
3253 = "Rồi cung tư tế Akai chăm chú,\\nnhìn thẳng vào tôi, rồi lần lượt nhìn sang Hachiroku."
3257 = "Công việc liên tục điều chỉnh tinh tế và vi tế,\\nđể giữ nhiệt độ của men kōji và cơm rượu luôn ổn định――"
3258 = "Có lẽ là nhớ đến các em gái,\\nánh mắt Hachiroku trở nên dịu dàng."
3265 = "『Cuộc tranh luận vô bổ』 mà Kisaki đã tốn thời gian."
3268 = "Có lẽ nhận ra sự do dự của tôi,\\nHachiroku cất giọng như muốn an ủi."
3271 = "Nhưng được truyền đạt lại những lời nhắn gửi cuối cùng đó,\\nchỉ vậy thôi tôi cũng đã thành thực cảm thấy hạnh phúc rồi."
3273 = "Nhưng――có chút gì đó cô cô đơn."
3280 = "Việc phục hồi 8620, tất nhiên, sẽ tốn khá nhiều thời gian."
3283 = "Ở cấp độ cá nhân, đã có hiệu quả lớn đến thế.\\nNếu vậy thì――không có lý do gì lại không mở rộng nó ra thêm."
3284 = "Luôn phòng bị để tuyệt đối không đánh rơi hay làm mất――\\nPaulette hiện tại vẫn đang sử dụng và giữ gìn nó."
3286 = "Chú ý lắng nghe, trên không trung quả nhiên có tiếng bay của Aircra."
3302 = "Cứ nhìn chằm chằm vào nó, dường như mọi thứ――\\nNgay cả toàn bộ sự bất an của tôi cũng sẽ bị nó hút sạch đi."
3305 = "Tiếng cảm thán chân thành của Hachiroku."
3307 = "Hachiroku đón nhận lời của cung tư tế như một lẽ đương nhiên.\\nNhưng tôi thì――câu hỏi lại xuất hiện trước."
3309 = "Tiếng thở dài đầy cảm xúc.\\nNhờ đó, tôi cũng chợt nhận ra."
3311 = "Giơ tay cái vút.\\nĐợi chị Mayami gật đầu, Hachiroku tuôn ra một tràng nói nhanh."
3313 = "Giọng của Hachiroku như muốn ngắt lời cung tư tế Akai.\\nNhưng cung tư tế, thậm chí còn điềm tĩnh đón nhận điều đó."
3314 = "Hachiroku tự xưng mình là “Watashi”."
3317 = "Hachiroku gật đầu mạnh mẽ, quả quyết."
3318 = "Khi tôi đang tìm kiếm than cho Hachiroku đang đói bụng――\\nChắc chắn chị Mayami đã từng nói chuyện này."
3321 = "Dù biết về sự kết thúc của Đường sắt Hoàng gia, nhưng Hachiroku, vì đã ngủ say sau vụ tai nạn,\\ncó lẽ không biết về bộ dạng của nó trong những năm tháng cuối cùng."
3322 = "Chắc là đang tò mò.\\nÁnh mắt Hachiroku liên tục hướng về phía cửa."
3332 = "Trong số những lời khuyên mà cung tư tế Akai đưa ra,\\n『Thảo luận với ngân hàng』, chắc chắn là điều đó."
3336 = "Nếu tính cả Hachiroku thì tổng cộng là 672 người sao.\\nNhư thế thì, hẳn là lộng lẫy lắm nhưng――"
3344 = "Chỉ cần tôi tóm tắt và truyền đạt ngắn gọn nhất có thể,\\nchỉ vậy thôi chị Mayami đã đón trước lời của tôi."
3346 = "Cũng chẳng phải là học sinh tiểu học,\\nchuyện xấu hổ vì ba cái chuyện này, thật không thể tin nổi."
3347 = "Đón đầu.\\nNếu là trước đây, chắc chắn trong lòng tôi sẽ cảm thấy phản kháng."
3364 = "Giả sử có người tập hợp lại làm tình nguyện viên,\\nthì chỉ với lòng nhiệt huyết……có lẽ sẽ không trụ nổi nửa tháng."
3388 = "So với con mắt vô tư của một kẻ từ Đế đô trở về như tôi,\\nnhững gì họ đang thấy, những gì họ phải thấy, hoàn toàn khác biệt."
3390 = "Giống như những gì Paulette đã nói cho tôi biết,\\ncung tư tế Akai có vẻ là người không thích gây ảnh hưởng."
3392 = "Trong lúc bàn bạc đủ thứ chuyện với chị Mayami,\\nđồng hồ đã điểm qua chín giờ."
3396 = "Bởi vì chỉ với một chút thời gian và lời nói ngắn ngủi như vậy,\\nchị Mayami đã chỉ ra câu trả lời và giúp tôi nhận ra."
3398 = "Trong màn đêm,\\nnhững thứ đó dường như lại càng nổi lên rõ nét hơn, khiến tôi run rẩy."
3408 = "Thời đại Đại bãi bỏ tuyến đã hủy diệt chính bản thân ngành đường sắt."
3410 = "Nói rồi cuống cuồng,\\nPaulette bước vội về phía cửa hàng đường sắt."
3412 = "Cô ấy lên tiếng trong tư thế đó.\\nTôi cảm thấy cuối cùng mình đã hiểu lý do tại sao sắc mặt cô ấy không tốt."
3414 = "Có lẽ để trấn tĩnh lại,\\ncô ấy nghiêng lon nước ép, ừng ực uống."
3416 = "Paulette cũng nhấc hông lên khỏi ghế――\\nRồi dừng lại ở một tư thế thật sự lấp lửng."
3418 = "Hầu như không nghiêng lon,\\ncô ấy uống từng ngụm nhỏ, thật im lặng, thật tĩnh lặng."
3421 = "Sắc mặt có vẻ đã khá hơn một chút."
3422 = "Nói rồi, đầu ngón tay cô ấy lại hướng về phía xưởng đầu máy."
3424 = "Tiếng thở phào nhẹ nhõm.\\nGiọng nói nhẹ nhõm."
3426 = "Tôi lập tức đáp lại lời đồng tình,\\nnhưng sắc mặt Paulette không được tốt."
3428 = "Nếu đêm nay Paulette không dẫn dắt tôi,\\nthì có lẽ tôi đã mãi mãi không nhận ra một điều giản đơn đến thế này."
3430 = "Nếu vạn vật cũng có niềm tự hào,\\nthì tai nạn chính là một sự kiện tàn khốc tột cùng, đập nát cả điều đó."
3432 = "Bởi vì nếu quen với sự thoải mái khi dựa dẫm vào người này,\\nnăng lực nỗ lực của tôi, chắc chắn sẽ bị thui chột."
3434 = "Để lôi kéo toàn bộ Ohimitera, để chia sẻ lợi nhuận,\\nđúng như lời khuyên của chị Mayami, cần phải 『cho người khác kiếm tiền』."
3438 = "Lúc cất cánh khỏi mặt nước,\\nchắc hẳn nó đã đánh thức rất nhiều loài chim nước đang ngủ."
3444 = "Một lúc sau, cung tư tế thở dài thườn thượt,\\nnhư thể nói hết cách rồi, ngài ấy nặng nề mở lời."
3445 = "Cung tư tế Akai mỉm cười thật hiền từ,\\nnhìn Hachiroku, rồi lại nhìn tôi."
3448 = "Houshou Mototada. Cha của cô gái đó, và là tổng giám đốc của một ngân hàng lớn sao.\\nTự nhiên tôi cũng muốn gặp một lần xem ông ta là người thế nào."
3451 = "Đúng rồi. Đúng rồi. Đúng là vậy."
3452 = "Hachiroku có vẻ như,\\nđang vướng mắc ở một điểm khác với tôi."
3459 = "Trước tiên hãy tiến hành bảo dưỡng, phục hồi lò hơi than."
3462 = "Chỉ vận động cơ thể nhẹ nhàng một chút――\\nÀ, đúng rồi. Tập xúc 400 xẻng than cũng tốt."
3464 = "Đỏ bừng đến mức trong bóng tối cũng có thể nhận ra,\\nhai má Paulette đỏ lựng lên."
3465 = "Đến mức này, thì ngay cả tôi cũng có thể ghép tên với khuôn mặt.\\nCô Momoi――một người thợ nấu rượu kỳ cựu chống đỡ cho nhà sản xuất rượu Migita Ichi."
3467 = "Cái tên tàu ngự dụng thì đến cả tôi cũng biết.\\nLà chuyến tàu được chuẩn bị đặc biệt để chở Thiên hoàng."
3470 = "Và một điều nữa, tôi đã có được một tài nguyên kinh doanh.\\nLời khuyên của cung tư tế Akai, xác đáng đến nhường nào――"
3471 = "Sự thật đến đó đã được xác định.\\nVậy thì, phần tiếp theo sẽ đi thẳng vào vấn đề."
3487 = "Như thể đang vẽ lại tàn ảnh của Đường sắt Hoàng gia cũ\\nbên trong mí mắt."
3508 = "Đáng sợ. Khắc nghiệt.\\nNhưng, không chỉ có vậy."
3520 = "Đương nhiên, điều đó\\ncũng sẽ trở thành kinh nghiệm dẫn đến việc bảo dưỡng phục hồi lò hơi của 8620."
3521 = "Sự im lặng kéo dài.\\nTôi không thốt nên lời."
3523 = "Vừa nói, tôi vừa bất giác cười khổ."
3528 = "Tôi có vẻ làm cô ấy hơi giật mình."
3529 = "Cung tư tế Akai mà chúng tôi đến thăm có vẻ rất mệt mỏi vì cuộc tranh luận,\\n……nói thẳng ra là bơ phờ."
3530 = "Phương pháp tôi đã làm từ trước đến nay, lần này tôi cũng sẽ chọn nó."
3531 = "Rời khỏi con đường ngắn nhất dẫn đến cửa hàng đường sắt,\\nchúng tôi nhanh chóng băng qua đường ngang."
3532 = "Và thỉnh thoảng khi tôi gợi chuyện,\\ncô ấy cũng cho tôi nghe những ý kiến rất thẳng thắn."
3536 = "Tiếng 「A」 buột miệng thốt ra vì quá khâm phục của tôi,\\nđã bị chị Mayami hiểu nhầm thành sự đồng tình."
3538 = "Tôi đã hiểu ra được phần lớn câu chuyện."
3541 = "Những gì nhìn thấy, cảm nhận được, tôi thành thật\\nchuyển thành lời nói của mình và truyền đạt lại."
3542 = "Tôi đã kể lại chuyện phát hiện ra 8620, chuyện kế hoạch phục hồi.\\nNhững gì được ông lão Minokasa, Nagi và Fukami, cung tư tế Akai chỉ dạy."
3543 = "Tôi muốn bày tỏ lòng biết ơn.\\nNhưng lại không tìm được từ ngữ thích hợp."
3546 = "Nơi ánh mắt ngài ấy hướng đến, ở góc phòng,\\ncó đặt một chiếc cặp da rất giống của tôi."
3547 = "Thịch một cái, tôi tự nhiên nghĩ như vậy."
3550 = "Tôi đã nhờ Hachiroku chuẩn bị tài liệu,\\ngiờ này, có lẽ Hibiki cũng đang học bài."
3551 = "Tôi thẳng lưng lên."
3553 = "Tại sao lại thế?\\nKhoảnh khắc vừa nghĩ vậy, tôi cũng có chút――xấu hổ."
3555 = "Sâu sắc――tự nhiên cúi đầu."
3558 = "Cổ họng tôi không bị đau.\\nTôi chỉ uống một hai ngụm cho có lệ thôi."
3559 = "Mở lời trực tiếp,\\ncung tư tế Akai từ từ quay lại."
3561 = "Hình như tôi từng nghe nói mật ong rất tốt cho cổ họng.\\nHồng trà thì, có vẻ Paulette khá kén chọn――hừm."
3562 = "Tôi có biết người phụ nữ đang làm công việc trông coi men kōji.\\nKhi tôi rời Ohimitera, cô ấy vẫn còn là người dọn dẹp."
3563 = "Chắc chắn, người lái tàu của Hachiroku,\\ncũng là nữ lái tàu duy nhất ở khu đầu máy Teio trong một thời gian dài."
3567 = "Vừa đi, tôi vừa báo cáo về cuộc nói chuyện với cung tư tế Akai.\\nTất nhiên là cả nội dung cuộc nói chuyện với chị Mayami nữa."
3568 = "Cùng lúc gật đầu, bên cạnh tôi, Hachiroku khẽ rung vai.\\nTôi nhận ra nhưng không bận tâm, cứ thế tiếp tục câu chuyện."
3570 = "Vì thế……nếu vậy……\\nÀ, giả sử Hachiroku không mong muốn điều đó đi chăng nữa――"
3572 = "Chính vì thế, tôi chỉ đơn thuần muốn biết.\\nVề Paulette, về đường sắt, dù chỉ một chút thôi."
3574 = "Cứ để lâu, sẽ càng khó nói hơn.\\nHơn nữa, đúng lúc cũng không thấy bóng dáng Hibiki đâu."
3580 = "Trên hai đường ống chạy dọc bên cạnh đó,\\ncó gắn van màu đỏ và màu xanh tương ứng."
3583 = "Nếu đã được trao cơ hội,\\nmà không tận dụng nó thì thật là vô ơn."
3584 = "Chính vì bây giờ đã hiểu, nên để không thất bại trong việc tận dụng nó,\\ntrước tiên hãy củng cố vững chắc bước đi đầu tiên, nơi chúng ta đang đứng ngay lúc này."
3587 = "Nếu Kisaki của phe ủng hộ thu hút đang mang lại kết quả,\\nthì Paulette có lẽ cũng đang phải chịu tổn thất tương ứng."
3589 = "Cung tư tế Akai, người từng làm việc ở khu đầu máy Kokura xa xôi.\\nNgười đó, biết về nó như là “vụ tai nạn đó”."
3593 = "Con bé Hibiki đó, sáng sớm đã tất tả chạy đi,\\nra là đích đến cũng giống nhau à."
3599 = "Dù là một cử chỉ khác xa với sự nữ tính,\\nnhưng trông lại có vẻ gì đó thật duyên dáng."
3602 = "Trước bữa tối tôi cũng đã gọi điện thoại một lần nhưng――\\nCó vẻ hôm nay nên bỏ cuộc thì hơn."
3605 = "Bên trong xưởng đầu máy.\\n8620 đang ngủ thật yên bình, thật tĩnh lặng."
3608 = "Chính là vì thế.\\nNên nếu có thể, tôi đã không muốn thảo luận với chị Mayami."
3611 = "Vừa hay. Trước khi có cuộc gặp,\\nnếu được nghe kể về tính cách của cung tư tế Akai thì thật tốt."
3618 = "Cứ thế dọc theo đường ray hướng về phía nhà ga――"
3641 = "Khuôn mặt khâm phục của Paulette.\\nTôi không hiểu ý cô ấy."
3642 = "Paulette vẫn không nhúc nhích.\\nCũng không thể cứ để mặc cô ấy thế này, nhưng mà――"
3643 = "Paulette chỉ gật gù đồng tình.\\nCô ấy chăm chú lắng nghe, có vẻ thực sự rất hứng thú."
3644 = "Paulette lấy ra từ trong túi áo một chiếc đồng hồ bỏ túi đường sắt,\\nvới vẻ mặt vô cùng trân trọng."
3645 = "Paulette hiếm khi lộ vẻ mặt cam chịu và gật đầu trong im lặng."
3646 = "Paulette cúi gập người chào."
3647 = "Mỉm cười với đôi má hơi ửng hồng."
3648 = "Paulette có vẻ hoảng hốt,\\nkiểm tra điện thoại của mình trong túi nhỏ."
3649 = "“Đồ uống yuzu mật ong”\\nKhi nhận lấy, Paulette nở nụ cười như trút được gánh nặng."
3650 = "Giọng nói ấm áp.\\nTừ từ thấm vào cơ thể, vào trái tim."
3651 = "Paulette vừa nhìn bao quát một vòng từ xưởng đầu máy đến sân ga,\\nđến \\x%l本屋;#00ffc040;tòa nhà chính%l;#; của nhà ga với ánh mắt đầy yêu thương."
3653 = "Giọng Paulette hơi nghèn nghẹn."
3654 = "Đôi mắt xanh biếc nheo lại như đang hoài niệm――\\nRồi, hướng về phía tôi."
3655 = "Cười tủm tỉm.\\nPaulette khẽ chạm vào mũi mình."
3656 = "Paulette đứng dậy, nhìn về phía này.\\nKhông còn dừng lại ở tư thế thiếu tự nhiên nữa."
3657 = "Cất giọng phấn khích đến lạ, Paulette vòng lên đi trước tôi."
3658 = "Cái gật đầu nhẹ.\\nSắc mặt Paulette hơi chùng xuống."
3659 = "Nói đến đó, Paulette\\ntỏ vẻ tự nhiên đưa tay đấm đấm vào eo."
3660 = "Cái gật đầu sâu, đầy tự hào."
3666 = "Để không làm phiền, tôi nhẹ nhàng đi ra ngoài từ cửa chính."
3667 = "Tại sao? Nhanh hơn cả lúc tôi định hỏi,\\nPaulette đã nói tiếp."
3668 = "Lựa chọn nào cũng không muốn làm.\\nNhững lúc như thế, hãy chọn việc có thể bắt tay vào làm nhanh nhất."
3670 = "Và rồi quay ngoắt lại――\\nÁnh mắt hướng về phía tôi, mang theo tia sáng nghiêm khắc."
3672 = "Đến đó thì khựng lại,\\ndừng lại một khoảnh khắc, rồi ngoái nhìn tôi."
3679 = "Đến mức Hachiroku phải tuyệt vọng nhịn cười khi nhớ lại――"
3680 = "Đến mức ngài ấy quên mất miếng dán hạ sốt dán trên trán\\nkhi ra tiếp đón chúng tôi với khuôn mặt hiền hậu."
3681 = "Tất nhiên trên trán không còn miếng dán hạ sốt,\\nHachiroku, khẽ thở phào nhẹ nhõm."
3687 = "Đúng là như vậy.\\nNếu là mọi người."
3688 = "Đúng là có gần hơn đôi chút."
3690 = "Nhìn thấy vậy, chuyện sáng nay bất chợt xẹt qua đầu tôi."
3702 = "Đáng khâm phục, đáng khâm phục,\\nVới dáng vẻ đó, chị Mayami điềm đạm gật đầu."
3704 = "Chóp mũi chị Mayami khẽ động đậy.\\nNgón tay dài vươn ra, hơi nới lỏng van màu xanh."
3706 = "Nơi chị Mayami chỉ tay đến,\\ncó một nhân viên tôi không quen mặt, đang dọn dẹp rất chăm chỉ."
3708 = "Xoa xoa xoa xoa, vuốt ve đầu Hachiroku một cách cường điệu,\\nchị Mayami trao cho em ấy một ánh nhìn dịu dàng và một câu hỏi êm ái."
3710 = "Chị Mayami cười.\\nTrông thật mãn nguyện, thật vui vẻ."
3712 = "Vừa nói, chị ấy vừa di chuyển đến bên cạnh bồn chứa ủ cơm rượu."
3716 = "Ngắn thì một năm, dài thì――mãi mãi.\\nNếu không vượt qua được bước đó, sẽ không thể tham gia vào việc nấu rượu shochu."
3733 = "Tót một cái, Paulette chạy đi,\\nngồi xuống sân ga bên hông xưởng đầu máy, rồi vẫy vẫy tay gọi tôi."
3736 = "Sáng hôm sau. Tại cửa hàng đường sắt.\\nTôi báo cáo lại chuyện hôm qua cho Paulette, người vừa kết thúc ca trực."
3737 = "Sợi dây xích có lẽ là vàng nguyên chất,\\nđược luồn chắc chắn qua khuy áo của Paulette."
3746 = "Được nghe một cái tên không ngờ tới, tôi và Hachiroku nhìn nhau.\\nMiệng Hachiroku há hốc ra."
3747 = "Khoảnh khắc tôi vừa nói ra,\\nPyon! Hachiroku nhảy cẫng lên."
3748 = "Khi tôi nói vậy, Paulette mỉm cười rạng rỡ.\\nCứ như thể chính bản thân cô ấy vừa được khen ngợi vậy."
3749 = "Khoảnh khắc tôi vừa nói ra,\\nPaulette cuống cuồng xua cả hai tay."
3750 = "Nghe cô ấy nói vậy, tôi cũng thành thật nghĩ đúng là như thế.\\nĐen hơn cả màn đêm, hơn cả bóng tối, một màu đen thăm thẳm."
3751 = "Nghe cô ấy nói, tôi lại đưa mắt nhìn bao quát một lần nữa."
3752 = "Nghe tôi nói vậy, Paulette bật cười khúc khích."
3758 = "“Thực trạng du lịch Ohimitera hiện nay” mà ông lão Minokasa muốn cho tôi thấy.\\n――Chảy máu chất xám do thiếu hụt lợi nhuận, và vòng luẩn quẩn do sự trống rỗng tạo ra."
3768 = "Mùi máu tanh.\\nTiếng kim loại nghiến vào nhau và tiếng ốc vít đứt gãy."
3792 = "Ngay khi tôi vừa hỏi, nét mặt cung tư tế trở nên hiền hòa hơn.\\n『Cậu hiểu rõ đấy』――Khuôn mặt ngài ấy đang nói như vậy."
3794 = "Chú ý nhìn kỹ lại,\\nquả nhiên, xưởng đầu máy này có thể thấy được rất nhiều dấu vết chắp vá."
3797 = "Vừa nhắc Tào Tháo thì Tào Tháo đến, cũng không hẳn là vậy,\\nnhưng là người tôi vừa mới gọi điện thoại."
3798 = "Trong lúc mải nói chuyện, tách trà đã cạn.\\nĐúng lúc đó, Hachiroku cất giọng e dè."
3799 = "Vừa nói, Paulette vừa đưa tay chỉ cho tôi xem."
3829 = "Nhìn thấy sự ngạc nhiên của Hachiroku,\\nnhư thể đang làm ra vẻ quan trọng, cung tư tế Akai dừng lại một nhịp."
3830 = "Cung tư tế Akai nhắm mắt lại đầy thấm thía."
3831 = "Gõ gõ, sắp xếp lại tập tài liệu danh sách một cách ngăn nắp,\\nvà trao lại cho tôi."
3832 = "Như muốn nói vậy thì yên tâm rồi,\\ncung tư tế Akai nhìn Hachiroku bằng ánh mắt hiền từ."
3833 = "Ánh mắt của cung tư tế Akai lướt trên danh sách.\\nHachiroku có lẽ cũng căng thẳng, mím chặt môi."
3834 = "Đối với Hachiroku, một Railord của Đường sắt Hoàng gia cũ,\\ncung tư tế Akai nói chuyện như thể đang dạy lại từ đầu."
3835 = "Cung tư tế Akai có vẻ đã hết mệt mỏi."
3836 = "Cung tư tế Akai biết về kết cục của Đường sắt Hoàng gia.\\nNhững người dân Ohimitera đang thực sự phơi mình trước sự suy thoái."
3837 = "Khẽ gật đầu,\\ncung tư tế Akai lần này quay sang Hachiroku."
3838 = "Cung tư tế Akai lặng lẽ gật đầu, nhìn vào mắt tôi."
3853 = "Càng nghĩ như vậy,\\nsự bồn chồn như ngứa ngáy lại càng tăng lên."
3862 = "Có lẽ đó là một từ quá đỗi bất ngờ."
3863 = "Cách nói đó khá hay.\\nMang lại ấn tượng là chỉ cần uống vào, sức mạnh sẽ tuôn trào."
3864 = "Bằng vàng, tinh xảo, rất dễ nhìn, và tuyệt đẹp."
3865 = "Nghe vậy, Hachiroku cũng đã hiểu."
3866 = "Lần này là, ực."
3867 = "Gần nhà ga. Không thiếu máy bán hàng tự động."
3871 = "Nếu vậy, hãy thay đổi phương châm.\\nThay vì đợi Reina quay lại, bây giờ dù sao thì――"
3874 = "Thiết kế nhãn hiệu sẽ nhờ Hibiki. Nếu muốn thay đổi hình dáng chai,\\nthì nhờ ông lão Minokasa giới thiệu cho thợ làm thủy tinh hoặc gốm sứ là được."
3876 = "Dọn dẹp là công việc\\nmà người mới vào xưởng ủ rượu sẽ được giao phó đầu tiên."
3878 = "Cửa hàng đường sắt, nhà ga, bến xuất phát của thuyền xuôi dòng Kuma――\\nChắc chắn cũng có thể đảm bảo được các kênh bán hàng mới nhắm đến khách du lịch."
3884 = "Railord duy nhất khác mà tôi biết là Reina,\\nchắc chắn em ấy tự xưng là, “Reina”――À!"
3887 = "Đi loanh quanh――nói một câu hoàn toàn không giống em ấy chút nào,\\nHachiroku vội vã đi ra ngoài."
3889 = "Dù không phải là thay thế cho tôi, người vẫn chưa thể gượng dậy sau tai nạn.\\nNhưng ít nhất, tôi cũng muốn 8620 có thể đứng lên một lần nữa."
3890 = "Cuốn truyện tranh thiếu nữ mà Michiko từng đọc,\\ntôi ngày xưa từng cười khẩy chế nhạo nó, nhưng mà――"
3891 = "Miệng thì nói vậy, nhưng tôi đang thấy hứng thú."
3892 = "Vừa nói bằng giọng điệu không có vẻ gì là khiêm tốn."
3893 = "Hạnh phúc là gì, và làm thế nào để có được nó,\\ntôi hoàn toàn không biết."
3897 = "Còn quá sớm để ngủ,\\nvà đầu óc đã quá mệt mỏi để làm bất cứ việc gì."
3898 = "Hiếm khi được đi cùng Paulette,\\nthay vì tập xúc than――"
3902 = "Đối với Hachiroku vừa buột miệng thắc mắc như thể vô thức,\\nchị Mayami hỏi ngược lại một cách rất nhẹ nhàng."
3912 = "To lớn, đen tuyền, uy nghi――\\nDù đang dừng lại, cũng có cảm giác như nó sắp nghiền nát tất cả."
3917 = "（Cái này――chẳng lẽ là――thứ gọi là hôn gián tiếp sao.）"
3918 = "（Đáng sợ, thật……quả nhiên là vậy.）"
3920 = "Cơ thể đen tuyền của 8620, còn bao bọc nhiều thứ hơn thế."

[selections]
