2328 = "「Chà, xe động cơ xăng!」"
2331 = "「Chà, cái gì thế này ạ――\\nA! Là khuôn mặt của, thần linh sao?」"
2333 = "「A ha ha, ngài Soutetsu,\\nmát lạnh dễ chịu quá nhỉ!」"
2334 = "「Chà.」"
2336 = "「Ối chà.」"
2337 = "「Hô.」"
2338 = "「Ồ?」"
2339 = "「À, ra là vậy.」"
2342 = "「À, đúng rồi.」"
2343 = "「Đến lúc đổi chỗ cho người cầm lái rồi nha.\\nTừ đây trở đi không còn đoạn nước cạn nào nữa nha.」"
2348 = "「A――ư.」"
2349 = "「À――đúng vậy. Đúng là thế.」"
2352 = "「À――chuyện đó thì tất nhiên. Không, không phải tôi ngạc nhiên vì coi Ohimitera là vùng quê ở điểm đó.」"
2353 = "「A…… Không đâu. Không có phiền gì đâu ạ……」"
2357 = "「Á ư.」"
2358 = "「Á ư.」"
2359 = "「A, xin lỗi.」"
2360 = "「A. Không sao đâu ạ.\\nChỉ là bé Nagi hơi vụng về một chút thôi. Ạ.」"
2363 = "「A, tiền bối Kisaki!?」"
2365 = "「A. Là ngày nghỉ định kỳ hay gì đó sao?」"
2366 = "「Này này.」"
2367 = "「Đơn giản là do vấn đề chiều cao thôi mà.」"
2369 = "「Ư…… Vâng……」"
2370 = "「Ư.」"
2371 = "「Uầy!?」"
2372 = "「Ư ư……」"
2373 = "「Ư……m.」"
2375 = "「Ừm. Nếu em làm được vậy thì anh cũng rất vui.」"
2377 = "「Ừm. Vậy thì, hôm khác xin được nhờ cô.」"
2378 = "「Hừm.」"
2379 = "「Hửm!? Ô ô!」"
2381 = "「Vâng. Em sẽ cố gắng. Ạ.」"
2382 = "「Ừm, hẹn gặp lại khi đó.」"
2385 = "「À, nói đơn giản thì là vậy nha.\\nĐây cũng là tu hành kiếm thuật nha!」"
2386 = "「Dô――――ta.」"
2388 = "「Dô ta nào! Dô ta nào!!」"
2391 = "「Nhưng mà――nhưng mà――nhưng mà, ở trường……」"
2392 = "「Bởi vì em, thích dòng sông Kuma.」"
2394 = "「Thời buổi này, hiếm thấy thật đấy.\\nCó lý do gì sao?」"
2396 = "「Bến thuyền――ở Yui cũng có ạ.\\nỞ đoạn thượng nguồn xa hơn, nước chảy xiết hơn.」"
2397 = "「Đang trong giờ làm việc mà đọc sách lén lút mới là bất lịch sự nha!」"
2399 = "「Mặt quỷ ở đền thờ sao ạ?\\nTại sao lại, như vậy.」"
2412 = "「Mấy bạn nữ nói vậy chắc là do ghen tị thôi.\\nCòn mấy bạn nam thì là đang che giấu sự xấu hổ đấy.」"
2413 = "「Được thôi nha.」"
2415 = "「Nguy hiểm quá.\\nBé Nagi, cảm ơn em đã cứu chị.」"
2416 = "「Được rồi, đi thôi Hachiroku. Làm lại từ đầu nào.」"
2424 = "「Xin lỗi anh.\\nTôi cũng rất muốn nói chuyện cặn kẽ với anh.」"
2425 = "「Bé Nagi.」"
2427 = "「Bé Nagi, vội vàng quá rồi. Ạ.\\nRõ ràng vẫn còn tận bốn mươi giây cơ mà.」"
2429 = "「Bé Nagi, nhờ em nhé.」"
2430 = "「Bé Fukami ơiii!」"
2432 = "「Bé Fukami hơi nhút nhát một chút nha.\\nQuen rồi thì sẽ thân thiết thôi nha.」"
2434 = "「Bé Fukami thì làm từ hồi nhỏ luôn nha.\\nCòn em thì mới bắt đầu năm thứ hai thôi nha.」"
2436 = "「Bé Fukami,\\nnhư vậy thì khách có đến cũng bỏ về mất thôi nha.」"
2437 = "「Đúng vậy. Không ngờ lại gặp em ở đây.」"
2449 = "「Anh đang nói chuyện thu hút nhà máy sao?\\nÀ ừm……anh trai của Hibiki là――」"
2450 = "「Mau ra đổi chỗ cho em đi~!\\nEm không biết cập bến đâu nha!」"
2457 = "「Làm gì có chuyện dạy mấy cái đó nha!\\n『Sức mạnh, là để bảo vệ kẻ yếu』――Á.」"
2467 = "「Một người cầm lái chỉ có vẻ ngoài dễ thương, và một người cầm lái xinh đẹp, oai phong, đáng tin cậy.\\nNếu em là khách, em muốn đi thuyền của ai hơn?」"
2472 = "「Anh là anh trai của Hibiki sao?\\nVậy thì, xin cho phép tôi tự giới thiệu.」"
2473 = "「Cảm giác thế nào ạ?」"
2475 = "「Anh――」"
2477 = "「Chắc……là vậy rồi.」"
2479 = "「Anh không sợ ma hay quỷ.\\nVì thực tế luôn xua đuổi những thứ đó.」"
2483 = "「Em cũng vậy. Vì em không muốn thấy những thứ xinh đẹp bị bóp méo\\nthêm nữa đâu.」"
2486 = "「Trước mắt, bọn anh định quay lại ga Ohimitera.」"
2488 = "「Vừa nãy tôi lỡ dành thời gian cho một cuộc tranh luận vô bổ mất rồi.\\nSau đây tôi còn có rất nhiều lịch trình phải làm.」"
2490 = "「Gọi là bé Fukami――được không nhỉ?」"
2493 = "「Tôi tên là Migita Soutetsu. Trở về quê hương để phản đối việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nvà có duyên trở thành chủ nhân của Hachiroku đây.」"
2497 = "「Vì cơ duyên, tôi đang được ngài Soutetsu chiếu cố,\\nlà \\x%lレイルロオド;#00ffc040;Railord%l;#; tên Hachiroku.」"
2500 = "「Em sẽ dẫn mọi người, ra thuyền. Ưm, nước bắn――\\nxin hãy cẩn thận, đừng để bị ướt ạ.」"
2502 = "「Chắc là vậy rồi――\\nKhông.」"
2504 = "「Của em là…… size trẻ em sao ạ.」"
2508 = "「Em là Hachiroku, \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; \\x%l8620;#00ffc040;8620%l;#;,\\nthuộc dòng \\x%l8620;#00ffc040;8620%l;#; của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; cũ, như ngài Soutetsu vừa giới thiệu ạ.」"
2510 = "「Tôi là người trở về Ohimitera để yêu cầu hủy bỏ việc thu hút nhà máy.\\nNhân cơ hội này, chúng ta có thể nói chuyện một chút được không?」"
2511 = "「Người sau. Ạ.\\nBởi vì, sông nước…… là nơi rất nguy hiểm.」"
2513 = "「Thấy em ngồi ở quầy lễ tân, em là người ở đây à?」"
2516 = "「Quả thực là tôi được chế tác như vậy.\\nBởi vì tôi là cỗ máy chuyên dụng số hiệu đầu tiên của dòng \\x%l8620;#00ffc040;8620%l;#;.」"
2518 = "「Tôi và Reina có thể nói là giống như chị em vậy.\\nVì chúng tôi đều là \\x%lレイルロオド;#00ffc040;Railord%l;#;.」"
2520 = "「Anh có cảm giác cảnh sắc chẳng hề thay đổi.\\nCả những đoạn êm đềm, lẫn những đoạn chảy xiết của dòng sông Kuma mùa hè.」"
2523 = "「Em, với tư cách là đại diện chủ bến thuyền, cũng đang cố gắng lắm.\\nNhưng mà, ngày nào cũng vậy, chẳng có khách nào tới cả.」"
2524 = "「Chính vì cố gắng một cách đặc biệt nên mới bị \\x%l空転;#00ffc040;quay trơn%l;#; đấy.\\nCó lẽ là vậy.」"
2529 = "「Thế nên Nagi mới làm công việc chèo lái sao?」"
2531 = "「Thế nên, nếu mọi người làm chấn hưng du lịch thì tốt quá.\\nNếu có gì em giúp được, có gì em làm được thì em muốn làm――ạ.」"
2532 = "「Nên là, nếu là công việc trên thuyền thì em không sao cả.\\nNhưng mà, kinh doanh hay quảng cáo các thứ, em chẳng hiểu gì sất.」"
2535 = "「Mới năm thứ hai mà đã bình tĩnh được như vậy sao!?」"
2537 = "「Người ạ? Anh cần người như thế nào?」"
2539 = "「Được ngài khen ngợi là vinh hạnh của tôi, cô Kisaki.」"
2542 = "「Chèo lái thì ít thứ phải nhớ hơn là cầm lái nha.\\nBảo em lên cầm lái thì em vẫn còn kém lắm nha.」"
2543 = "「Tôi nghe nói ở khu vực Đế đô, việc tận dụng chế độ vừa học vừa làm\\nđang rất sôi nổi mà?」"
2546 = "「Giám đốc chi nhánh.\\nCòn trẻ thế này――vừa là học sinh vừa là giám đốc chi nhánh sao.」"
2548 = "「Hẹn gặp lại anh khi đó.」"
2551 = "「Nếu còn non nớt, thì chỉ cần để cho nó chín mùi là được thôi.」"
2554 = "「Đúng, vậy thật.」"
2556 = "「Vâng. Tôi sẽ đi cùng ngài, ngài Soutetsu.」"
2557 = "「Vâng. Dù thuyền lắc lư dữ dội thế này,\\nnhưng em chẳng thấy sợ chút nào cả.」"
2560 = "「Lưng của em đấy. Cứ còng xuống như thể đang cố tự bảo vệ mình\\n――Chẳng phải là uổng phí tư thế đứng xinh đẹp đó sao.」"
2563 = "「Đúng nha. Bé Fukami là con gái một\\ncủa dì Midori, chủ bến thuyền này nha.」"
2565 = "「Đúng vậy――vừa được bao bọc,\\nđồng thời, tôi cũng có cảm giác như được giải phóng.」"
2567 = "「Đúng, vậy ạ. Từ hồi còn đỏ hỏn, thay vì nằm nôi\\nthì em đã được đung đưa trên thuyền rồi.」"
2569 = "「Đúng vậy nhỉ. Dù lập trường của chúng ta có vẻ hoàn toàn trái ngược.」"
2570 = "「Ừ.」"
2571 = "「Vậy sao.」"
2573 = "「Đó là lúc anh vừa mới trở thành con nuôi của nhà Migita.\\nĐi cùng với ông Taito, bố nuôi, mẹ nuôi, chị Mayami và Hibiki.」"
2575 = "「Nữ giới…… là một cô gái, ạ. Đang tuổi dậy thì.」"
2577 = "「Đúng, vậy ạ. Kiểu như vậy.」"
2578 = "「Đúng. Vậy ạ.」"
2580 = "「Vâng. Cả mẹ và bố em nữa. Hồi đó, làm ăn phát đạt lắm ạ.\\nĐến mức bố em, đổ bệnh vì làm việc quá sức luôn.」"
2583 = "「Vậy sao, ra là thế.」"
2584 = "「Vậy sao. Đột ngột đưa ra yêu cầu mà không suy xét đến lịch trình của cô.\\nThật xin lỗi.」"
2588 = "「Cũng có thể.\\nGần đây còn có một ngôi chùa tên là chùa Ma nữa.」"
2595 = "「Vì cơ duyên sao?\\nFufu, cách nói chuyện của anh lạ thật đấy.」"
2597 = "「Nhờ có dáng vẻ oai phong của cô Fukami,\\nmà dù ở trên con thuyền không quen thuộc này, em cũng cảm thấy rất an tâm.」"
2602 = "「Không ngờ,\\nlại bị nhắc nhở về sự non nớt của bản thân một cách ngoạn mục đến thế.」"
2603 = "「Đúng vậy. Nơi làm việc không phải là trường học.\\nChẳng có ý nghĩa hay lý do gì để kéo theo những đánh giá ở trường học vào cả.」"
2604 = "「Đúng nha! Mấy anh chị này là đồng minh của chúng ta nha!\\nThế nên, em mới dẫn đến chỗ bé Fukami nha!」"
2605 = "「Đúng vậy. Thế nên mới cần xe tải. Ạ.\\nBây giờ bến thuyền ở Yui thiếu người nên không dùng nữa.」"
2610 = "「Dòng sông này――\\nchính là tuyến đường sắt đối với cô Fukami nhỉ.」"
2613 = "「Dòng sông, mỗi ngày mang một biểu cảm khác nhau.\\nNhưng vẫn luôn giữ mãi một khuôn mặt.」"
2615 = "「Sâu thẳm khôn lường, mãnh liệt, dù có cố tìm hiểu cũng chẳng thể hiểu nổi.\\nVì là một cô gái rất phiền phức, nên bù lại, cũng rất đỗi quyến rũ.」"
2616 = "「Tại sao lại không có ạ? Chị nghĩ đó chỉ là sự thật thôi mà.」"
2618 = "「Xe tải của ông em?」"
2622 = "「Mấy bạn trong lớp bảo…… em to xác nên chẳng dễ thương chút nào.\\nMấy bạn nam thì gọi em là, 『con nhỏ khổng lồ』.」"
2626 = "「Thực tế, mới là điều ngài e sợ nhất sao?」"
2629 = "「Hồi đó anh vẫn chưa quen. Căng thẳng quá nên chỉ toàn nhìn ra ngoài thuyền.\\nMùa đó, cũng trạc thời điểm này bây giờ――」"
2633 = "「Chúng tôi đến đường đột quá, có vẻ như đã làm phiền việc đọc sách của em rồi.」"
2636 = "「Lớn quá ạ, vừa lớn vừa rộng――\\nCảm giác như đang được bao bọc vậy.」"
2638 = "「Một cô bé xinh đẹp nhỉ.\\nMái tóc đen tuyệt đẹp thế này, có lẽ là lần đầu tiên tôi thấy.」"
2640 = "「Một ngôi đền rất đẹp ạ.」"
2641 = "「Giỏi thật đấy.」"
2642 = "「Tay nghề điêu luyện thật đấy.\\nNagi có nói là 『bé Fukami làm từ hồi nhỏ』 nhỉ.」"
2645 = "「Đúng thật vậy, ngài Soutetsu.\\nCảm giác như hai thứ trái ngược nhau, nhưng lại cảm nhận được cả hai cùng một lúc.」"
2647 = "「Thật tình! Thật không nói lý lẽ được mà. Lẩm cẩm quá rồi. Rõ ràng là chuyện đơn giản dễ hiểu thế kia——」"
2648 = "「Thật tình, em đã bảo chị đợi đã mà――\\nƠ, anh hai!!?」"
2655 = "「Đúng vậy.」"
2656 = "「Đúng vậy. Anh cũng cảm thấy rất trong lành.\\nNơi này, xưa nay vẫn không hề thay đổi.」"
2657 = "「Đúng vậy. Ngay cả trên toàn bộ các chi nhánh của Ngân hàng Kumamoto,\\nhọc sinh làm giám đốc chi nhánh cũng chỉ có mình tôi thôi.」"
2661 = "「Tiền, tiền, tiền bối Kisa――」"
2663 = "「Mang cảm giác của một người chị, biểu cảm phong phú, đáng yêu.\\nNhưng thỉnh thoảng nổi giận thì…… rất, rất là dữ dội.」"
2672 = "「Tư thế đứng…… xinh đẹp…… ạ?」"
2673 = "「Dì Midori sức khỏe yếu lắm,\\ncứ nhập viện rồi lại xuất viện suốt nha.」"
2682 = "「Nếu không phải tổng tư lệnh thì đáng sợ thật đấy.\\nĐiều đó có nghĩa là trên cô ta vẫn còn nhân vật tầm cỡ hơn.」"
2683 = "「Vì đang trong kỳ nghỉ hè nên thời gian buổi sáng của tôi tương đối tự do.\\nNếu anh có thể sắp xếp một ngày khác và đặt lịch hẹn.」"
2686 = "「Nếu là học sinh kiêm nhân viên ngân hàng thì tôi đã chẳng ngạc nhiên――\\nNhưng nếu là giám đốc chi nhánh thì quả thực không phải chuyện thường thấy.」"
2688 = "「Và nếu như bàn tay con người không còn nữa……\\nNói là trở về với tự nhiên thì nghe hay đấy nhưng mà.」"
2690 = "「Bên trong cổng,\\ncó quỷ bị phong ấn sao ạ?」"
2696 = "「Biểu cảm và khuôn mặt sao.」"
2698 = "「Người cần cẩn thận là mấy anh chị mới đúng nha.\\nÁo phao ấy, nên thắt chặt lại dây đi nha?」"
2703 = "「Giải phóng――」"
2704 = "「Xin đợi đã, tiền bối Kisaki!」"
2705 = "「Cảm ơn em.」"
2706 = "「Cảm ơn hai người. Anh Soutetsu. Chị Hachiroku.」"
2707 = "「Cảm ơn vì lời giới thiệu chu đáo. Tôi là Migita Soutetsu.\\nVì cơ duyên mà trở thành anh trai của Hibiki.」"
2708 = "「Xin lỗi vì đã để quý khách phải đợi. Đây là bến thuyền xuôi dòng Kuma Ohimitera,\\nnhân viên tiếp tân Hayase xin nghe.」"
2715 = "「Nói chuyện với khách như vậy là bất lịch sự đó.」"
2728 = "「Chuyện đó thì đúng là vậy nhưng mà……」"
2729 = "「Chuyện đó, ừm――là có lý do ạ.」"
2730 = "「Cũng đúng nhỉ.\\nXin lỗi, em có thể giải thích lại một lần nữa được không?」"
2731 = "「Đó là điều ngài Soutetsu đã dạy tôi mà?」"
2732 = "「Đó là lý do em phản đối thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; sao.」"
2734 = "「Vậy sao. Cẩn thận nhé.」"
2735 = "「Vậy sao. Nếu vậy thì cứ từ từ làm quen nhé, không cần gượng ép đâu.」"
2736 = "「Chỗ này cũng chẳng khác gì ngày xưa nhỉ.」"
2737 = "「Ngày nghỉ định kỳ thì đóng cửa rồi nha. Hôm nay là ngày làm việc nha.」"
2738 = "「Đây là――」"
2739 = "「Vậy còn cô bé đó?\\nCũng là người đồng hành vì cơ duyên sao?」"
2741 = "「Dạ…… cái đó…… nên là…… em sẽ cố gắng.」"
2758 = "「Những thứ dễ hiểu và đơn giản, thường nông cạn và hời hợt, ạ.\\nChắc chắn chúng sẽ chẳng tồn tại được lâu, rồi sẽ trở thành một đống rác khổng lồ.」"
2759 = "「Dạ――đã để mọi người, phải đợi rồi.」"
2760 = "「Dạ…… Hôm nay dì ấy cũng…… ở bệnh viện――ạ. Nên là,\\nnếu có chuyện gì――thì em――sẽ nghe ạ.」"
2761 = "「Ưm…… Em là Hayase Fukami――ạ.\\nLà người đại diện chủ bến thuyền này――tạm thời là vậy ạ.」"
2762 = "「Xin chờ một chút…… ưm, xin lỗi ạ.」"
2763 = "「Dạ. Có chuyện gì anh cứ nói nhé. Ạ.\\nNếu có gì giúp được, em sẽ cố gắng hết sức.」"
2764 = "「Cũng đúng.」"
2766 = "「Đương nhiên rồi.\\nNhững ngày có câu lạc bộ, em ấy luôn nhắc đến anh dưới một hình thức nào đó.」"
2767 = "「Vậy thì, vừa hay――\\nƯm, có một người từng làm việc ở \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;? hay gì đó ạ.」"
2771 = "「Mỏ than bỏ hoang Jussen phải không ạ. Gần đó――\\nlà đi qua khu vực không thể sử dụng \\x%lエアクラ;#00ffc040;Aircra%l;#; đúng không ạ?」"
2775 = "「Vậy ra――cô chính là\\nnhân vật cốt cán của phe ủng hộ thu hút nhà máy sao?」"
2777 = "「Nếu vậy, hãy dần làm quen đi. Việc đối xử với bản thân một cách thoải mái.\\nNhư thế thì lưng em sẽ tự nhiên thẳng lên, và vấn đề cũng sẽ được giải quyết thôi.」"
2778 = "「Nếu vậy, chúng ta cùng cố gắng nhé.\\nPhục hưng du lịch Ohimitera, cũng là hồi sinh bến thuyền Yui.」"
2779 = "「Nếu vậy, hãy cho tôi và Hachiroku trải nghiệm đi thuyền xuôi dòng Kuma đi.\\nĐương nhiên là tôi sẽ trả tiền vé cho hai người lớn.」"
2780 = "「Vậy thì, em xin phép hướng dẫn\\ncách mặc áo phao――a.」"
2781 = "「Nếu vậy, anh sẽ công nhận điều đó.\\nFukami, em không dễ thương. Lý do là vì em to xác.」"
2782 = "「Nếu vậy, anh cần tìm người.\\nEm có thể giới thiệu ai đó cho anh được không?」"
2783 = "「Vậy thì,\\nhãy cùng đi xe tải của ông em nhé.」"
2784 = "「Nếu vậy, ngài Soutetsu――」"
2786 = "「Làm việc tại ngân hàng.」"
2795 = "「Anh hai?」"
2797 = "「Sông Kuma thì sao? Nam hay nữ?\\nKhuôn mặt trông như thế nào?」"
2799 = "「Là bến thuyền đi dọc sông Kuma nha. Nhìn là biết liền nha.」"
2801 = "「Ohimitera là một thị trấn thoang thoảng mùi nước……\\nNhưng không khí ở đây dường như lại trong lành hơn hẳn.」"
2802 = "「Ngài Soutetsu.」"
2803 = "「Ngài Soutetsu!?」"
2804 = "「Ngài Soutetsu?」"
2805 = "「Không lẽ, cô đã nghe Hibiki kể sao?\\nChuyện của tôi ấy.」"
2806 = "「Sắp, cập bến rồi. Ạ.\\nThuyền cập bến rồi, hai người, định làm gì tiếp theo?」"
2809 = "「Sự to lớn đó mới là con người tự nhiên của em. Nếu cố tình bóp méo, em sẽ trở nên khiên cưỡng và sụp đổ.\\nCó lẽ điều đó, với dòng sông cũng giống nhau phải không?」"
2813 = "「Quỷ, rồi lại ma.\\nOhimitera là một vùng đất đáng sợ ngoài sức tưởng tượng nhỉ.」"
2814 = "「!」"
2815 = "「!?」"
2978 = "Một cú va chạm nhẹ."
2980 = "Đương nhiên Fukami loạng choạng suýt ngã,\\nvà bàn tay của Nagi lại đưa ra đỡ lấy."
2987 = "Cũng phải thôi.\\nChẳng ai nghĩ trên cổng đền lại có thứ như vậy."
2993 = "Tôi đưa một vạn yên và nhận lại hai ngàn lẻ mấy yên tiền thừa.\\nKhá là đắt đỏ, đó là cảm nhận chân thực của tôi."
2995 = "Để chắc chắn, tôi nhận lấy tấm danh thiếp và nhìn kỹ, quả nhiên trên đó ghi,\\n『Giám đốc chi nhánh Ohimitera, Ngân hàng Kumamoto』――っ!?"
2998 = "Chắc là cô bé đã muốn làm như vậy.\\nSống lưng vươn thẳng lên, mang theo sức mạnh."
3000 = "Nhưng――nếu hôm nay không phải là tình cờ,\\nmà \"ngày nào cũng vậy\", thì có lẽ tình hình kinh doanh đang trong tình trạng khủng hoảng rồi."
3005 = "Theo lời nhờ vả của Hachiroku, tôi luôn giữ \\x%l乗務鞄;#00ffc040;túi phi hành đoàn%l;#; khư khư bên mình.\\nBên trong tất nhiên là \\x%l運転体;#00ffc040;kíp lái%l;#; rồi."
3007 = "Những động tác tràn đầy tự tin của Fukami và Nagi chỉ nhìn thôi\\ncũng đủ mang lại cảm giác an tâm."
3026 = "Cúi chào thanh lịch."
3029 = "Với vẻ mặt miễn cưỡng,\\nHachiroku mặc chiếc áo phao size trẻ em vào."
3032 = "Không biết có hiểu thấu tâm can tôi hay không, Hachiroku chỉ nhẹ nhàng nghiêng đầu.\\n――May mà tôi không phải là \\x%lレイルロオド;#00ffc040;Railord%l;#;."
3035 = "Hachiroku bất giác thốt lên một tiếng cảm thán rồi gật gù."
3037 = "Đáp lại cái cúi chào tao nhã của Hachiroku,\\nKisaki cũng khẽ cúi chào đáp lễ."
3039 = "Nở một nụ cười mơ hồ, Hachiroku không đáp lời.\\nNếu vậy, Hachiroku cũng đã hiểu."
3041 = "Dang rộng hai tay, vươn vai thật lớn――"
3042 = "Hachiroku dùng ánh mắt dò hỏi tôi.\\nVừa gật đầu, tôi vừa tiếp lời."
3045 = "Hachiroku nhìn tôi.\\nLà giọng của Hibiki."
3046 = "Vừa nhìn thấy, Hachiroku liền tròn xoe mắt."
3049 = "Từ tốn đợi bóng dáng Kisaki và Hibiki khuất hẳn,\\nHachiroku mới khẽ lên tiếng hỏi."
3052 = "Hachiroku nói.\\nTiếp nhận lời tôi, rồi hỏi lại."
3053 = "Khẽ lẩm bẩm, Hachiroku hít một hơi thật sâu."
3073 = "Vừa nói một câu đùa không thể nào cười nổi,\\nNagi vừa nhẹ nhàng bước về phía mũi thuyền."
3075 = "Nagi đáp lời dễ dàng, rồi nhanh nhẹn\\nmặc chiếc áo phao vào với những động tác rất dễ nhìn."
3076 = "Nagi nhảy vọt lên."
3080 = "Tới đoạn nước chảy xiết,\\nbiểu cảm của dòng sông bỗng chốc thay đổi hoàn toàn."
3082 = "Tâm trạng đi du lịch vừa mới nhen nhóm,\\ncũng bị kéo theo mà xẹp xuống."
3083 = "Sự gai góc khi nãy lao về phía này\\nđã hoàn toàn biến mất."
3088 = "Dù có chuyển ra đuôi thuyền cầm mái chèo, lưng Fukami cũng không hề gù xuống.\\nCô bé đứng thẳng tắp, chăm chú theo dõi tình hình của Nagi ở mũi thuyền."
3090 = "Ra là vậy, 『ra là vậy』,\\nHibiki đã không nói cho Kisaki biết việc tôi trở về."
3092 = "Để gặp cựu nhân viên của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; cũ mà Fukami đã cho tôi biết――\\nCung tư tế của đền Akai."
3101 = "Giờ không phải lúc đứng nhìn thẫn thờ."
3103 = "Cơ mà…… Với cách tiếp khách thế này,\\nthì dù lượng khách du lịch có tăng lên, tương lai vẫn mờ mịt lắm."
3105 = "Chắc không phải là thành quả của việc tu hành kiếm đạo đâu,\\nnhưng lời nói của Nagi sắc bén thật đấy."
3108 = "Nhìn Hachiroku bên cạnh tôi,\\nthiếu nữ tên Kisaki mỉm cười đầy hứng thú."
3111 = "À không, phán đoán như vậy có quá vội vàng không nhỉ.\\nDù sao thì, cứ để tôi xác nhận \"thực trạng du lịch\" xem sao đã."
3113 = "A, nhắc mới nhớ,\\nlúc đó, hình như ông Taito đã――"
3116 = "Sắc bén đến mức, tôi chẳng biết phải tiếp lời thế nào."
3117 = "Chính vì cô bé khá cao nên trông lại càng gò bó hơn."
3120 = "Đưa sào chống thuyền cho Nagi, dặn dò vài câu,\\nlần này đến lượt Fukami cẩn thận bước về phía đuôi thuyền."
3121 = "Sau khi giải thích như vậy, Nagi nhún vai một cái rõ mạnh."
3125 = "Trong nửa ngày qua, liên tục\\ntiếp xúc với nhiều người và lập trường khác nhau, có vẻ tôi đã hơi bối rối."
3126 = "Trên dòng sông chẳng có gì để che giấu.\\nFukami vươn thẳng lưng, nhìn thẳng vào tôi."
3129 = "Gật đầu――và ngay khoảnh khắc đó tôi chợt nhận ra.\\nGiám đốc chi nhánh của 『Ngân hàng Kumamoto chi nhánh Ohimitera』."
3139 = "Lỡ lời rồi.\\nĐáng lẽ tôi nên suy nghĩ kỹ trước khi nói."
3141 = "Chắc hẳn trước mặt nữ sinh này,\\nem ấy muốn thể hiện mặt tốt của mình."
3145 = "Chắc là đã bình tĩnh lại,\\ncuối cùng cô bé cũng cất giọng đủ lớn để tôi có thể nghe thấy."
3147 = "Có vẻ đã nhận ra, Nagi đột nhiên\\nrút bàn tay đang kéo cô bé Fukami gì đó lại."
3149 = "Lại dùng cuốn sách đã đóng làm khiên, cô bé gật đầu lia lịa."
3150 = "Đánh giá của tôi đã thay đổi.\\nCứ tưởng sao cũng được, nhưng đúng là cái tên nói lên tất cả."
3153 = "Từ hộp đựng danh thiếp lấy ra với động tác thuần thục,\\ncô ấy trơn tru đưa cho tôi một tấm danh thiếp."
3155 = "Bằng bàn tay vừa cất hộp danh thiếp, lần này cô ấy lấy ra một cuốn sổ tay."
3156 = "Một tiếng thở phào nhẹ nhõm cất lên."
3158 = "Tuy to con hơn Nagi rất nhiều, nhưng cô bé lại bị Nagi xoay như chong chóng.\\nBị Nagi kéo cả chiếc ghế đang ngồi đi, cô bé cố gắng chống cự――"
3160 = "Sự thông minh và ý chí kiên cường này.\\nKhông cần thiết phải coi cô bé là trẻ con nữa."
3162 = "Cô bé nhìn tôi và Hachiroku mỗi người vài giây,\\nrồi lại nhanh chóng cúi gằm mặt lảng đi."
3164 = "Cô ấy chú ý thấy chúng tôi, có vẻ hơi bối rối,\\nnên chúng tôi nhường đường và khẽ gật đầu chào."
3166 = "Cô ấy ngạc nhiên vì tôi ngạc nhiên――\\nMột nụ cười có phần tinh nghịch mang cảm giác như vậy."
3169 = "Từ sâu trong khuôn viên, hướng đền chính,\\nCó tiếng bước chân vội vã tiến lại gần."
3171 = "Cơ thể cô bé ngày càng co rúm lại.\\nKhuôn mặt cũng cúi gằm xuống, ánh mắt ngước lên nhìn một cách dè dặt."
3172 = "Cuốn sách trên tay vẫn đang mở,\\nđược cô bé nắm chặt và nâng lên như để che chắn giữa tôi và cô bé."
3174 = "Cô bé chui tọt vào trong quầy lễ tân,\\nvà lôi xềnh xệch một thứ gì đó từ sau bóng cột ra."
3175 = "Cô bé khẽ gật đầu.\\nCuốn sách làm khiên bắt đầu từ từ hạ xuống."
3176 = "Nếu vậy.\\nThiếu nữ tóc bạc này chính là――"
3180 = "Nếu có \"\\x%l共感;#00ffc040;cộng cảm%l;#;\" gì đó,\\nthì cả hai đã làm tổn thương nhau một cách vô phương cứu chữa rồi."
3183 = "Vừa học vừa làm. Chế độ giáo dục mới của Hinomoto,\\nđang lan rộng nhanh chóng trong những năm gần đây, chủ yếu ở các khu vực đô thị."
3185 = "Một tiếng động cứng ngắc vang lên, con thuyền chao đảo――"
3191 = "Người đang hầm hầm bước tới là một nữ sinh mặc đồng phục."
3195 = "Nhìn hành động đó, tôi tự nhiên cảm thấy \"đó là một tấm khiên\"."
3200 = "Một giọng nói u ám vang lên đầy bất ngờ.\\nHachiroku giật bắn mình, co rúm người lại."
3208 = "Lời của Hachiroku khiến tôi gật gù đồng tình.\\nĐây đích thị là cá gặp nước rồi."
3211 = "Đi theo con đường trong ký ức,\\nchẳng mấy chốc tôi đã đến một khung cảnh khác xa với những gì mình nhớ."
3213 = "Tôi cảm thấy hơi bất ngờ trước giọng điệu và biểu cảm của Hachiroku."
3214 = "Chợt nhận ra chữ \"mặt nước\", cũng được viết là \"khuôn mặt\" của nước."
3217 = "Anh từng đến đây viếng đền rồi.\\nĐược ông Taito, Hibiki và chị Mayami dẫn đi."
3221 = "Đưa mắt nhìn theo hướng đó――\\nnhưng lại chẳng thấy bóng dáng ai."
3222 = "Đang tự hỏi là gì thì tôi nhìn về hướng đó,\\ncó vẻ như Fukami đang đứng ở mũi thuyền vừa dùng sào gõ vào tảng đá."
3224 = "Càng e sợ, thì đối với thực tế――\\nQuả nhiên tôi vẫn..."
3225 = "Tôi luồn tay vào nách Hachiroku,\\nnâng cô bé lên cao để dễ nhìn hơn."
3226 = "Không thể trả lời. Ngay cả bản thân tôi cũng không hiểu."
3227 = "Vừa nói tôi vừa vặn mình xoay một vòng lớn."
3230 = "Đạp lên sỏi đá, bước thẳng về phía trước."
3231 = "Không biết có phải vì quá xấu hổ hay không,\\nmà cô bé vung vẩy hai tay, dùng mái chèo khua nước rào rào."
3234 = "Thế nên, tôi phải nói.\\nKhông phải là lấp liếm, mà là sự thật của chính mình."
3236 = "Thế nên trước hết, tôi kể lại chuyện gặp Nagi,\\nvà việc bị dẫn đến đây như thế nào."
3238 = "Lúc nói chuyện với chúng tôi và lúc nghe điện thoại,\\ncô bé như biến thành một người hoàn toàn khác."
3245 = "Giọng điệu của Hibiki đã hoàn toàn chuyển sang kiểu cách khách sáo."
3247 = "Vậy mà, tôi chẳng hề cảm thấy sợ hãi chút nào,\\nđó là bởi ánh mắt của Fukami vẫn luôn dõi theo Nagi."
3249 = "Một cô bé trông có vẻ hiền lành.\\nDù đang ngồi trên ghế, tôi vẫn cảm nhận rõ cô bé khá cao."
3251 = "Giọng của Hachiroku.\\nĐã diễn đạt lại những gì tôi cũng đang cảm nhận bằng những lời lẽ thẳng thắn."
3252 = "Chẳng mấy chốc, nước không còn bắn nữa và thuyền cũng ngừng lắc lư,\\ncon thuyền lại được bao bọc trong dòng chảy êm đềm."
3254 = "Như lời ông lão Minokasa đã nói,\\nviệc tìm hiểu thực trạng du lịch ở Ohimitera mới là ưu tiên hàng đầu."
3264 = "Màu xanh của khu rừng ôm lấy dòng sông, và màu xanh biếc của chính dòng sông.\\nTiếng kêu và tiếng vỗ cánh của lũ chim nước, cùng với làn gió mang theo mùi hương của nước."
3266 = "Nó đùa giỡn với con thuyền thỏa thích,\\nlàm những giọt nước bắn lên tung tóe rơi xuống đầu chúng tôi như một trận mưa rào."
3268 = "Chưa bao giờ tôi nghĩ về khuôn mặt hay biểu cảm của dòng sông,\\nnhưng nghe những điều người ta thấy hàng ngày, tôi bỗng thấy hơi tò mò."
3275 = "Dù có chút luống cuống trong chốc lát,\\nnhưng Fukami nhanh chóng đưa chiếc áo phao trên tay cho Nagi."
3277 = "Fukami đi thẳng tới chỗ chiếc điện thoại."
3278 = "Fukami đã tự cho là như vậy rồi.\\nQuan điểm chủ quan về việc dễ thương hay không dễ thương, không thể nào lật ngược được."
3281 = "Fukami kinh ngạc――à không, đúng hơn là khuôn mặt như đang sợ hãi,\\nlại bắt đầu thu mình lại."
3283 = "Gọi điện thoại xong, Fukami tiến về phía này.\\nKhông biết có phải đang thu mình lại vì áy náy hay không mà cô bé cứ khom lưng co rúm người lại."
3285 = "Ánh mắt Fukami hướng về phía mũi thuyền."
3288 = "Khóe miệng Fukami khẽ nở nụ cười.\\nVà ánh mắt cô bé cứ hướng về phía xa, thật xa――nơi cuối dòng sông."
3290 = "Ánh mắt Fukami lảng tránh tôi và bắt đầu đảo quanh.\\nLưng cô bé cứ gù dần, gù dần rồi co rúm lại."
3291 = "Ánh mắt Fukami bắt lấy tôi."
3293 = "Fukami hơi rướn người lên, dùng ánh mắt ra hiệu cho Nagi.\\nNagi gật đầu, khuôn mặt lộ vẻ nhẹ nhõm."
3294 = "Fukami gật đầu."
3296 = "Fukami có chiều sâu.\\nNếu có thể khơi gợi nó ra, có lẽ cô bé sẽ trở thành sức mạnh chống đỡ cho Ohimitera."
3299 = "Dù đối phương là ai thì những việc cần làm vẫn không thay đổi.\\nVà tôi luôn dốc hết sức mình cho những việc cần làm."
3300 = "Dù có đi đến đâu, tôi cũng chỉ là tôi.\\nCứ làm theo cách mình tin tưởng, nếu không được thì sửa đổi là xong."
3302 = "Nhưng tôi là con người. Chỉ có thể truyền đạt những gì mình nói ra.\\nThậm chí có những điều không thể truyền đạt hết được."
3307 = "Bây giờ là tháng Tám.\\nĐang giữa kỳ nghỉ hè."
3308 = "Nhộn nhịp lắm. Mấy chiếc thuyền nối đuôi nhau, chiếc nào chiếc nấy\\nkhách khứa chen chúc chật ních."
3320 = "Gật đầu như đã hiểu,\\nKisaki quay ngoắt lại, chuyển ánh nhìn sang Hibiki ở phía sau."
3322 = "Nhanh chóng giấu đi vẻ ngạc nhiên vừa thoáng hiện,\\nKisaki lại chăm chú nhìn Hachiroku một lần nữa."
3325 = "Bất chợt, Kisaki thò tay vào trong cặp."
3326 = "Bất chợt, Kisaki thò tay vào túi trong trước ngực."
3328 = "Hiểu được điều đó, và khéo léo đề xuất lùi lại ngày khác,\\nKisaki đã tôn trọng lập trường của Hibiki và của tôi."
3329 = "Ánh mắt Kisaki lướt nhẹ qua\\nchiếc đồng hồ đeo trên cổ tay trần trong bộ đồng phục mùa hè."
3331 = "Kisaki liếc nhìn Hibiki."
3333 = "Cô ấy nhẹ nhàng đưa tay phải ra.\\nTôi và Kisaki có một cái bắt tay ngắn."
3334 = "Hibiki với vẻ mặt hốt hoảng vội vã đuổi theo Kisaki đang nhanh chóng rời đi.\\nĐang đuổi theo, em ấy quay lại một lần, thè lưỡi lêu lêu."
3338 = "Đứng ở mũi thuyền dẫn đường là người cầm lái.\\nĐứng ở đuôi thuyền, điều khiển mái chèo hỗ trợ người cầm lái là người chèo lái."
3343 = "Nói ngắn gọn, đây là chế độ cho phép thời gian lao động\\ntrong các công việc được công nhận là thiên hướng, phù hợp với năng lực, được tính trực tiếp thành tín chỉ."
3345 = "Không được. Tôi hơi vội vàng quá rồi.\\nChưa kịp tự giới thiệu mà đã nhờ người ta giới thiệu thì thật là vô lý."
3348 = "Fukami rốt cuộc cũng hơi ngẩng mặt lên.\\nÁnh mắt thận trọng――có chút gì đó sợ sệt."
3352 = "Ngay phía sau chúng tôi, Nagi đứng ở đuôi thuyền cầm mái chèo,\\nđung đưa mạnh sang trái sang phải, tiếp thêm sức mạnh cho quyết định của Fukami."
3353 = "Chắc vì đã thở phào nhẹ nhõm,\\nFukami cũng mỉm cười, tay vẫn cầm cuốn sách đang mở."
3356 = "Vậy mà nơi đây, một trong những địa điểm du lịch nổi tiếng của Ohimitera.\\nLại vắng tanh vắng ngắt... chẳng có lấy một bóng người."
3358 = "Vừa ăn cướp vừa la làng. Nụ cười vô tư của Nagi,\\nnhư thể đã quên béng mất chính mình là nguyên nhân khiến Fukami gặp rắc rối vậy."
3359 = "Hachiroku vẫn ngồi trên đùi tôi y như lúc dùng \\x%l運転体;#00ffc040;kíp lái%l;#;,\\ncũng bị chuyển động đó làm cho đung đưa theo."
3367 = "Trên thuyền. Rõ ràng là nơi kém ổn định hơn trên bờ rất nhiều,\\nthế nhưng Fukami lại đang ung dung tận dụng lợi thế chiều cao của mình để điều khiển sào chống thuyền."
3370 = "Tiếng của Nagi.\\nFukami rời mắt khỏi tôi, nói ngắn gọn rằng sẽ nói tiếp sau."
3371 = "Dùng sào chống thuyền đẩy nhẹ vào đá, hay cắm xuống sông,\\nFukami đứng ở mũi thuyền quyết định hướng đi của con thuyền."
3376 = "Nếu đổi \\x%lタブレット;#00ffc040;thẻ bảng%l;#; thì size trẻ em cũng sẽ thành to thôi,\\nnhưng trong trường hợp đó thì xử lý áo phao thế nào đây――ủa."
3379 = "Nếu lúc đó, chúng tôi tranh luận với nhau,\\nthì Hibiki đã chẳng còn mặt mũi nào đứng đó nữa."
3387 = "Nhờ được sưởi ấm bởi sự nhộn nhịp ấy, mà đến lúc xuống thuyền, chúng tôi\\ncũng đã có thể nói chuyện với nhau tự nhiên hơn một chút."
3397 = "Lời nói không đi đôi với việc làm."
3403 = "Vừa dứt lời, giọng nói và ánh mắt của Hachiroku chùng xuống."
3404 = "Nói đến ngân hàng ở Ohimitera, thì chỉ có một."
3405 = "Nói rồi,\\nFukami đưa mắt nhìn quanh dòng sông một vòng lớn với vẻ trìu mến."
3406 = "Nói rồi, Fukami nhìn chằm chằm vào mặt tôi."
3420 = "Rồi giữa chừng cô bé quay lại――\\nnở một nụ cười rụt rè nhưng chân thật."
3421 = "Vừa bước chân vào khuôn viên, đám ngỗng và gà\\nkêu quang quác, cục tác ầm ĩ rồi nhường đường."
3430 = "Đó mới đúng là cách nói chuyện kỳ lạ.\\nDùng từ 『đó』, cứ như thể đã biết từ trước――"
3432 = "Chưa kịp gật đầu, Fukami đã thoăn thoắt\\nbước về phía mũi thuyền."
3434 = "Nhẹ nhàng mà tinh tế――\\nMột cái cúi chào đẹp đẽ khiến những từ đó hiện lên trong tâm trí."
3435 = "Chà, về cô bé tên Fukami này thì――\\nNói thế này thì hơi kỳ, nhưng sao cũng được."
3440 = "Tiếng chuông điện thoại reo lên, mô phỏng theo tiếng chuông cổ điển."
3449 = "（Gì chứ, lưng cô bé đang thẳng tắp kia kìa）"
3450 = "（Rầm）"
3451 = "（Cộc）"
3452 = "（Lắc lư）"

[selections]
