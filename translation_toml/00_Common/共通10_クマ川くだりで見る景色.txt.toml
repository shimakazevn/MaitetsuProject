2310 = "「Ư…… Vâng……」"
2312 = "「Không. Chuyện đó thì đúng là vậy nhưng――」"
2317 = "「Hảả?」"
2318 = "「Hả.」"
2319 = "「Dạ, a――vâng, cảm ơn, quý khách.\\nHai người lớn, đã bao gồm thuế, tổng cộng là 7560 yên ạ.」"
