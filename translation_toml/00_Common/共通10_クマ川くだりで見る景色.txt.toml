1832 = "――Trước khi tôi kịp hoảng hốt,\\nFukami đã giải thích như vậy."
1834 = "――Rồi sau đó, Hachiroku lại ngoan ngoãn\\nthu mình ngồi lại trên đùi tôi với vẻ đầy thoải mái."
1840 = "『Hachiroku đã từng gây ra tai nạn』\\n……Rõ ràng tôi phải biết ý nghĩa của điều đó chứ."
1843 = "Phập một tiếng, cuốn sách bị đóng lại.\\nÁnh mắt chạm nhau trong tích tắc, nhưng rồi cô bé lại lảng đi ngay."
1845 = "\"Chắc là vậy rồi\" câu này tôi không thể nào nói ra được."
1853 = "……Ngay cả khi đang nói chuyện, cô bé vẫn để mắt đến tình hình của Nagi sao.\\nHơn cả mong đợi. Đúng là ngọc càng mài càng sáng."
1854 = "……Đúng như cô bé tự nhận, Nagi khi chuyển sang làm người cầm lái,\\nquả thực là dở tệ của dở tệ."
1856 = "……Tại sao chứ?\\nTôi đâu có định chọc giận Hibiki."
1862 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#;――À, giống như Reina của tuyến Yunoi.」"
1863 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#; mà cũng sợ ma với quỷ sao――」"
1868 = "「『Anh trai đó』?」"
1870 = "「……Cảm giác như, rất sâu đậm sao?」"
1872 = "「………………Vâng.」"
1873 = "「…………」"
1880 = "「……Em hiểu rồi. Chắc vậy. Ở trong đầu. Thế nên, một chút thôi――việc làm như thế. Em sẽ cố gắng thử xem. Ạ.」"
1881 = "「……Anh từng đi rồi. Đi thuyền xuôi dòng hồi đó ấy.」"
1884 = "「……Vị đó,\\nlà tổng tư lệnh của phe ủng hộ thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; sao?」"
1888 = "「『Quy hoạch đô thị ở địa phương ~Phục hồi bằng du lịch~』 à,\\nem chăm học thật đấy.」"
2181 = "「Không không, chính tôi mới phải xin lỗi vì đã từ chối.\\nNhưng, tôi cũng có chung suy nghĩ 'nhân cơ hội này'.」"
2183 = "「Cách mặc áo phao ấy nha,\\nkhông nghe cho kỹ là chết đó nha.」"
2185 = "「Hơn nữa, lại còn rất hiểu lễ nghĩa.\\nRất vui được gặp em, cô bé. Em tên là gì?」"
2187 = "「Không phải! Ưm――\\n『Thật tình cờ quá anh trai. Không ngờ lại gặp anh ở đây』」"
2189 = "「Không được nhìn ngang ngó dọc nha!」"
2191 = "「Nói mới nhớ, Hibiki này. Em lạnh nhạt quá đấy.\\nAnh trai em về rồi mà cũng chẳng thèm nói cho tôi biết.」"
2193 = "「Không, hình như là mặt quỷ đấy.\\nNghe nói người ta gọi nó là \"Kiến trúc mặt quỷ\".」"
2195 = "「Dạ không, xe chạy xăng cơ.\\nCái loại xả ra khí thải ấy. Ạ.」"
2197 = "「Hơn nữa, còn rất oai phong và đáng tin cậy nữa.」"
2200 = "「Cô Midori nhỉ?\\nTrước khi bị bệnh thì cô ấy là người lo việc đó à?」"
2203 = "「Người am hiểu về du lịch hoặc đường sắt, nếu được thì cả hai càng tốt.\\nVà là người phản đối rõ ràng việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;.」"
2209 = "「Cái gì mà 『Không phải chuyện lợi ích』 chứ, toàn là nói xằng nói bậy. Nếu không có lợi ích, thì ngay cả ngôi đền này cũng chẳng duy trì nổi đâu――っ!」"
2211 = "「Người đại diện chủ bến thuyền?」"
2212 = "「Nhưng mà, 『dễ thương』 và 『xinh đẹp』 là hai chuyện khác nhau.」"
2215 = "「Hai em làm công việc này lâu chưa?」"
2217 = "「Chỉ cần làm trên bờ giống y như lúc trên thuyền là được.\\nChỉ vậy thôi là mấy vấn đề như tiếp khách hay quảng cáo sẽ biến mất phần lớn đấy.」"
2218 = "「Khách sáo quá nha, bé Fukami.\\nLúc khó khăn thì phải giúp đỡ lẫn nhau chứ nha!」"
2221 = "「Chị nói bé Nagi sao?」"
2223 = "「Em mang nét cổ điển hơn Reina nhỉ.\\nHơn nữa, tổng thể có vẻ được chế tác rất cao cấp.」"
2224 = "「Chính vì sự to lớn khiến em không còn dễ thương,\\nmà một khi em vươn thẳng lưng và tràn đầy tự tin, em sẽ trở nên xinh đẹp hơn bao giờ hết.」"
2226 = "「Bản thân em không nhận ra sao?\\nĐó. Đó chính là bộ dạng của em khi ở trên bờ đấy.」"
2228 = "「Khách đi thuyền trên sông Kuma giảm đi nhiều quá, các bác cầm lái\\nnghỉ việc hết trơn, bé Fukami đang gặp khó khăn lắm nha.」"
2229 = "「Kìa, nhìn thử xem Hachiroku.」"
2235 = "「Phần gốc mái của cổng vào――\\nNgay đoạn góc vuông ấy.」"
2238 = "「Năm thứ hai.」"
2240 = "「Hachiroku――đây là, sông Kuma đấy.」"
2241 = "「Xin giới thiệu lại. Mong được kết giao qua cơ hội này.\\nTôi, Houshou Kisaki, đang làm việc tại ngân hàng.」"
2251 = "「Nagi. Sư phụ của em,\\ndạy em dùng vũ lực để ép buộc người khác sao.」"
2252 = "「Rất vui được gặp anh. Tôi là Houshou Kisaki.\\nỞ trường, tôi và Hibiki cùng tham gia một câu lạc bộ.」"
2254 = "「Thôi đi bé Nagi. Ít nhất cũng để chị kẹp thẻ đánh dấu sách vào đã chứ.」"
2256 = "「Chấn hưng du lịch, bằng \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;――」"
2261 = "「Sao em lại hiểu ra thế được vậy. Là em đấy, Fukami.\\nBộ dạng của em khi ở trên thuyền, trông rất đường hoàng và xinh đẹp.」"
2262 = "「Cứ giao cho em nha!」"
2263 = "「Cứ giao cho em nha!\\nKhách ơi, cẩn thận nước bắn đó nha.」"
2264 = "「Chuyện anh là sinh viên Đại học Hoàng gia, chuyện anh đang giúp đỡ công việc gia đình\\n――À, phải rồi.」"
2268 = "「Xe tải――xe tải chạy bằng \\x%lエアクラ;#00ffc040;Aircra%l;#; sao ạ?」"
2273 = "「Dù có bảo vệ được môi trường,\\nmà không bảo vệ được cuộc sống, thì con người và nơi ở cũng sẽ diệt vong thôi.」"
2275 = "「Dù chấn hưng du lịch bằng đầu máy hơi nước có thành công,\\nthì với tình trạng này, du lịch xuôi dòng sông cũng chẳng thể nào vực dậy được.」"
2276 = "「Ra là vậy. Nếu là đoạn giữa Yui và Ohimitera thì.」"
2277 = "「Ra là vậy. Nếu thế thì xin lỗi, em có thể gọi cô Midori,\\nchủ bến thuyền ra đây được không――à.」"
2278 = "「Ra là vậy.」"
2280 = "「Chuyện đó hình như không ai biết cả.\\nNghe nói trên khắp Hinomoto cũng hiếm khi thấy thứ này.」"
2294 = "「Phản, đối…… thu hút nhà máy.」"
2296 = "「Chỉ cần nghĩ đến chuyện buôn bán thôi.\\nChỉ cần tiếp khách và quảng cáo là đủ rồi.」"
2299 = "「Size vừa là được nha.\\nMặc cái không vừa, lúc rơi xuống nước chỉ có nước chết thôi nha.」"
2301 = "「Chỉ cần chú ý mặt trước mặt sau rồi mặc vào là được nha.\\nRơi xuống nước thì nó sẽ tự phồng lên nha.」"
2303 = "「Nhưng mà…… nhưng mà…… em, thật sự――\\nto xác thế này, mà…… sao có thể, dễ thương, được chứ.」"
2304 = "「Nhưng mà.」"
2307 = "「Pyawa!? Khoan! Anh hai!」"
