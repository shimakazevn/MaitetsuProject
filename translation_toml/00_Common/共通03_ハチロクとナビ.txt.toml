[script]
56 = "\\x%lレイルロオド;#00ffc040;Railord%l;#; cũng không phải là vạn năng.\\nTất nhiên, giao tiếp \\x%l共感;#00ffc040;cộng cảm%l;#; hay hệ thống định vị \\x%lエアクラ;#00ffc040;Aircra%l;#; cũng vậy."
60 = "Giao tiếp \\x%l共感;#00ffc040;cộng cảm%l;#;——hệ thống định vị \\x%lエアクラ;#00ffc040;Aircra%l;#; như Navi cũng có chức năng này,\\nkhông, phải nói đó là chức năng quan trọng nhất của chúng mới đúng."
872 = "\"Một nụ cười gượng gạo\". Chính nụ cười ấy lại cho tôi thấy,\\nbình thường Hachiroku cười tự nhiên đến nhường nào."
877 = "\"Vậy thì tại sao chứ\", quá khứ trong tôi đang gào thét……\\nDù biết là vô ích, nhưng tôi vẫn không kìm được mà buông lời hỏi."
883 = "……Đúng vậy. Tôi đã cảm thấy nhẹ nhõm.\\nBởi vì họ không đối xử với tôi như một nạn nhân tai nạn cần được nâng như nâng trứng."
887 = "「Bản thân \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nngay từ cái tên đã bao hàm ý nghĩa của cái ác rồi.」"
896 = "「Hệ thống định vị \\x%lエアクラ;#00ffc040;Aircra%l;#; là sản phẩm của công ty Aero-Craftech.\\nKhông phải là em gái của ai cả.」"
897 = "「Nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;, là kẻ ác sao?」"
898 = "「\\x%lエアクラ;#00ffc040;Aircra%l;#;!?\\nKhông thể nào, \\x%lエアクラ;#00ffc040;Aircra%l;#; mà lại biết bay trên trời sao!!?」"
901 = "「Có thể nói tất cả \\x%lレイルロオド;#00ffc040;Railord%l;#; đều là chị em. Và tất cả chúng em\\nđều có thể liên lạc với nhau thông qua \\x%l共感;#00ffc040;cộng cảm%l;#;.」"
902 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#; à……Hình như là, mỗi phương tiện đường sắt\\nđều có một thực thể đi kèm……đúng không nhỉ?」"
908 = "「\\x%l客車;#00ffc040;Toa hành khách%l;#; thì không có đâu ạ. Đầu tiên, chúng em sẽ điều khiển các phương tiện\\ncó thể tự di chuyển, như đầu máy, \\x%l気動車;#00ffc040;toa xe tự hành%l;#;, hay toa xe động lực.」"
911 = "「Cuối thời kỳ \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;……」"
912 = "「Vào cuối thời kỳ \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;, tình trạng thiếu hụt nhân viên \\x%l保線;#00ffc040;bảo trì đường ray%l;#; đã trở nên vô cùng nghiêm trọng.\\nĐó chính là một trong những nguyên nhân khiến tai nạn đường sắt xảy ra liên tục vào thời điểm đó.」"
917 = "「'Muốn đi đâu thì tùy, nhưng ít ra cũng phải nói trước một tiếng chứ.\\nNgười đi tìm cực khổ lắm đấy', đại loại là vậy.」"
920 = "「Việc \"mong muốn\" điều gì đó, đối với em hiện tại là quá khó khăn.\\nNhưng mà——dù vậy……」"
924 = "「Chữ 'Lưu lang' (lang thang), đã được bao hàm trong cái tên của các em rồi.」"
927 = "「……Giao tiếp \\x%l共感;#00ffc040;cộng cảm%l;#; quả là một thứ tiện lợi nhỉ.」"
937 = "「……Là do tai nạn xảy ra thường xuyên sao?\\nVì cần đến những biểu đồ chạy tàu tạm thời đó à?」"
938 = "「……Ví dụ như, với những hòn đá đặt trên đường ray, chúng em\\nchỉ có thể phát hiện bằng cảm biến hình ảnh——nói cách khác là bằng mắt thường.」"
1133 = "「Nó sẽ đến. Chắc chắn.\\nChỉ cần còn sống, thì dù muốn hay không nó cũng sẽ đến.」"
1135 = "「Lần sau……sao ạ.」"
1136 = "「Không phải ạ——」"
1138 = "「Tôi đã có hứng thú, và thực sự đã đi bộ đến đó.\\nTất nhiên, với đôi chân của một đứa trẻ thì không thể nào đi ngược dòng đến tận cùng được.」"
1139 = "「Không?」"
1141 = "「Không phải vậy đâu Hachiroku.」"
1144 = "「Nhưng, tôi đã có duyên trở thành chủ nhân của em.\\nVậy thì, tôi sẽ cố gắng hết sức mình.」"
1145 = "「Nhưng mà, vẫn chưa thể hòa được đâu ạ.」"
1146 = "「Không phải là máy bay.」"
1147 = "「Tôi không hề lẩn trốn.\\nHình dáng của hệ thống này vẫn luôn nằm trong tầm nhìn của cô đấy.」"
1148 = "「Đúng là không khác biệt nhiều ạ. Vì thế, khi phát hiện ra hòn đá,\\nthì hầu hết các trường hợp đều không kịp \\x%lブレーキ;#00ffc040;hãm phanh%l;#; nữa.」"
1150 = "「Em không cần phải miễn cưỡng chấp nhận.\\nCũng không cần phải tin rằng điều đó là đúng.」"
1152 = "「Nghĩa là có thể đưa ra giải pháp tốt nhất để khắc phục sự cố\\ntrong thời gian ngắn sao?」"
1155 = "「Đã rõ.\\nBắt đầu dò tìm địa điểm hạ cánh trên mặt nước tối ưu nhất.」"
1169 = "「Chỉ là vì tiện lợi hơn nên mới được con người lựa chọn thôi.\\nNếu gọi đó là tội lỗi của \\x%lエアクラ;#00ffc040;Aircra%l;#;, thì chẳng phải là oán hận vô lý sao?」"
1174 = "「Con người sẽ có lúc đưa ra những lựa chọn và hành động sai lầm.\\nĐó là sự thật, và đó cũng là lý do xảy ra tai nạn.」"
1186 = "「Ngươi——chính là chiếc máy bay này sao?」"
1187 = "「Em cứ lặp đi lặp lại từ 'chúng em' nhỉ.」"
1190 = "「Em ngốc à!\\nBây giờ mà ra khỏi đây là sẽ rơi xuống đất tan tành đấy!」"
1192 = "「Em là một tồn tại như thế nào,\\ntôi vẫn chưa biết rõ lắm.」"
1194 = "「Ngươi——ờm, hệ thống định vị \\x%lエアクラ;#00ffc040;Aircra%l;#;?」"
1197 = "「Xin hãy đính chính lại sự nhận thức sai lệch đó——」"
1200 = "「Xấu tính thì cũng đành chịu thôi.\\nDù sao thì tôi cũng không sinh ra ở thành phố Ohimitera mà.」"
1201 = "「Cũng đúng nhỉ.」"
1209 = "「Hachiroku cũng từng nói là được ông Taito mua lại nhỉ.\\nVậy thì chúng ta, có lẽ là những kẻ giống nhau đấy.」"
1216 = "「Chẳng phải chính em đã nói sao.\\nKẻ chi phối tất cả là con người——tất cả đều là lựa chọn của con người.」"
1217 = "「Chắc đó là thuật ngữ đường sắt,\\nnhưng \\x%lダイアグラム;#00ffc040;biểu đồ chạy tàu%l;#; với biểu đồ tạm thời là gì vậy?」"
1224 = "「Dù có sở hữu trí tuệ đi chăng nữa, thì đồ vật cũng không thể đưa ra quyết định.\\nNgười đưa ra quyết định luôn là con người, và người phải chịu trách nhiệm, cũng là con người.」"
1225 = "「Ra vậy. Được thôi.」"
1226 = "「Ra vậy. Đối với những chướng ngại vật trên đường ray,\\nthì chỉ có thể tùy cơ ứng biến thôi sao.」"
1227 = "「Ra là vậy.」"
1228 = "「Ra là vậy.\\nNavi đã gửi cộng cảm cho Hachiroku sao.」"
1247 = "「Chỉ bằng mắt thường sao? Vậy thì có khác gì con người.」"
1250 = "「Chỉ cần còn sống sót, thì sẽ có lần sau.\\n——Đó là lời ngài Soutetsu nói mà đúng không?」"
1252 = "「Cứ gọi là Navi. Không cần thêm danh xưng nào khác.」"
1253 = "「Được chứ. Navi.」"
1255 = "「Có thể sao ạ!?」"
1256 = "「Đó là cơ chế chia sẻ theo thời gian thực những thông tin đa dạng mà mỗi cá thể thu thập được,\\nrồi xử lý tối ưu hóa theo tập hợp——đúng không?」"
1258 = "「Nhưng mà, nếu em thừa nhận sự thật đó……\\nThì em sẽ làm nhục tất cả các chị em của mình mất.」"
1262 = "「Em cũng nghĩ giống tôi nhỉ.」"
1264 = "「Dạ? Chuyện đó……\\ncó ý nghĩa gì vậy ạ?」"
1265 = "「Không sao, thất lễ vì không biết thì tôi cũng từng làm rồi.\\nĐúng rồi. Vậy là chúng ta hòa nhé?」"
1267 = "「Ưm——」"
1268 = "「Hừm.」"
1269 = "「Hửm?」"
1270 = "「Ư……m.」"
1271 = "「A.」"
1272 = "「À.」"
1273 = "「!!!」"
1274 = "「!?」"
1276 = "「Ừ……có vẻ là vậy.\\nLúc tôi rời khỏi thành phố này, nó dường như đã thoi thóp lắm rồi.」"
1278 = "「Này này, em nói thế dễ gây hiểu lầm lắm đấy.」"
1280 = "「Ừm. Nước sông Kuma đấy. Dù nghe nói nước dùng để nấu rượu\\nlà ở thượng nguồn——gần nguồn hơn cơ.」"
1282 = "「Ừ. Tôi là con nuôi của nhà Migita.」"
1284 = "「Ừm. Dù đó là chuyện ngay sau khi tôi được nhận nuôi ở đây thôi.」"
1285 = "「Ừm.」"
1287 = "「Vậy sao. Ra là vậy——\\nNavi, ngươi cũng là……của chúng ta.」"
1289 = "「Vậy là tốt rồi.\\nCơ thể em cũng đang lên tiếng 'Có thực mới vực được đạo' kìa.」"
1291 = "「Ufufu. Đúng vậy nhỉ. Bởi ngài Soutetsu xấu tính——\\nmà em đã bị tấn công lúc đang ngủ và bị lột sạch đồ.」"
1294 = "「Chỉ vì lòng tự ái ngu ngốc mà cô định vĩnh viễn từ bỏ nhiệm vụ của mình sao.\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; hóa ra cũng chẳng phải là một tồn tại đáng nể như lời đồn nhỉ.」"
1296 = "「Những lựa chọn sai lầm——\\nvà cả nỗi đau của những người bị cuốn vào đó——」"
1299 = "「Ở thành phố này sao?\\nHọ định dùng nhà máy để làm ô nhiễm nguồn nước của dòng sông này ư?」"
1304 = "「Thời kỳ Đại bãi bỏ tuyến đường sắt.」"
1306 = "「Vâng. Từ nay em sẽ không phạm sai lầm nữa.\\nDù là không biết, nhưng em đã thất lễ rồi.」"
1309 = "「Vâng. Em hiểu rồi thưa ngài Soutetsu——\\n!? Cái gì? \\x%l共感;#00ffc040;Cộng cảm%l;#;!?」"
1311 = "「Nhờ sự nhẹ nhõm đó. Mà chúng tôi mới có thể trở thành một gia đình.\\nBây giờ nghĩ lại, tôi cảm thấy như vậy.」"
1318 = "「Chính vì không giận nên mới thế ạ.\\nMột cái tát tay thừa thãi. Em đã dành cho ngài Soutetsu.」"
1320 = "「Là chuyện đó đấy.\\nTôi từ Đế Đô trở về là để ngăn chặn điều đó.」"
1323 = "「Dù có vậy đi chăng nữa! Em cũng không thèm đi \\x%lエアクラ;#00ffc040;Aircra%l;#;っ」"
1344 = "「Chiến dịch thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;!?」"
1346 = "「Đi bộ á!? Ngài đã đi ngược dòng, con sông này sao?」"
1348 = "「Cướp đi đường sắt khỏi cuộc sống của người dân, gây ra thời kỳ Đại bãi bỏ tuyến đường sắt.\\nNhững tội lỗi mà \\x%lエアクラ;#00ffc040;Aircra%l;#; đã gây ra, em tuyệt đối sẽ không tha thứ.」"
1350 = "「Kẻ đã cướp đi nhiệm vụ của chúng tôi——việc vận chuyển con người và hàng hóa.\\nThậm chí cướp đi cả đường ray, chẳng phải chính là các người sao.」"
1351 = "「Từ những sự thật hiện tại, có thể suy đoán là như vậy.」"
1358 = "「Chắc chắn là đau gấp mấy lần những gì Hachiroku tưởng tượng đấy.\\nKhông phải là cái gõ nhẹ hay cái cốc đầu đâu, mà là một cú giáng trời giáng! luôn.」"
1362 = "「Xin ngài cứ yên tâm? Ngài Soutetsu. Em không hề,\\ngiận dữ hay cảm thấy khó chịu một chút nào đâu ạ.」"
1365 = "「Cảm ơn? Tại sao chứ.」"
1370 = "「Điều đáng hận nhất chính là sự bất lực của bản thân khi bị cuốn vào những quyết định đó.\\nVì vậy, phải dùng sức mạnh của mình để rửa sạch nỗi hận này.」"
1373 = "「Chúng ta đang ở trên trời mà? Ngài Soutetsu.\\nChim chóc bay ngang qua chắc chắn sẽ không nghe thấy giọng chúng ta đâu.」"
1374 = "「Việc nắm bắt và kiểm soát của chúng em, chỉ là để vạch ra con đường đó.\\nChúng em cũng giống như đường ray, chỉ là RailRoad mà thôi.」"
1376 = "「Tôi á?」"
1378 = "「Tôi đã mất tất cả người thân trong một vụ tai nạn, và được nhà Migita——\\nđược ông Taito nhận nuôi, trở thành cháu nuôi của ông ấy.」"
1380 = "「Em hiểu rồi, thưa ngài Soutetsu.\\nHòa nhau, không ai nợ ai, sòng phẳng rồi ạ.」"
1381 = "「Em đã gặp được một người chủ tuyệt vời rồi!」"
1383 = "「Đó cũng là lúc em được ngài Taito mua lại.」"
1385 = "「Đây là lần đầu tiên em được thấy cảnh tượng thế này.\\nCả thành phố trông cứ như được xếp bằng những khối gỗ đồ chơi vậy.」"
1386 = "「Vì vậy mới gọi là Lord sao. Kẻ chi phối.」"
1393 = "「Vì vậy, ngay cả khi xảy ra sự cố vận hành,\\nchúng em vẫn có thể lập và đề xuất biểu đồ chạy tàu tạm thời trong thời gian cực ngắn.」"
1395 = "「Chính vì vậy, dù đó có là lựa chọn của con người đi chăng nữa——」"
1397 = "「Mạnh đến thế cơ ạ?」"
1399 = "「Điều khiển. Ý em là điều khiển lái sao?」"
1401 = "「Dùng sức mạnh……\\nNhưng mà, đến nước này rồi thì làm vậy để làm gì chứ.」"
1402 = "「Dò tìm hoàn tất. Bắt đầu hạ cánh ngay lập tức chứ?」"
1407 = "「Được nhận nuôi……sao ạ?」"
1408 = "「Rồi ngài đi bộ, kết quả ra sao ạ?」"
1410 = "「Vậy thì hãy tận dụng nó đi. Dù là \\x%lエアクラ;#00ffc040;Aircra%l;#; hay bất cứ thứ gì.\\nHãy chọn con đường nhanh nhất, và học cách đưa ra lựa chọn.」"
1413 = "「Nếu vậy, em nên dừng việc trút giận lên Navi——một \"đồ vật\" đi.\\nEm đang tự hạ thấp lòng kiêu hãnh của chính mình đấy.」"
1416 = "「Nếu Hachiroku đã tự hào đến vậy. Thì phương tiện động lực……\\nmà em điều khiển sao? Tôi cũng muốn được đi thử một lần.」"
1418 = "「Nếu vậy, xin ngài hãy nói cho em biết.\\nEm——phải làm gì với sự oán hận này đây.」"
1421 = "「Vì ngài……\\nLại bảo là sẽ cho em đi \\x%lエアクラ;#00ffc040;Aircra%l;#; cơ chứ.」"
1426 = "「Ừ. Tôi có hứng thú, lại nghĩ mình có thời gian và thể lực,\\ntrong khi tiền bạc thì chẳng có một đồng nào.」"
1427 = "「Đúng vậy. Một người đáng tin cậy hơn bất kỳ ai.\\nMột khi chị ấy đã nghiêm túc thì——…………」"
1430 = "「Đúng vậy. Tôi cũng nghĩ thế. Và đồng thời——\\nTôi cảm thấy nhẹ nhõm vì người này đã chịu mắng mình.」"
1432 = "「Ừm. Mắt tôi nổ đom đóm luôn.\\nSau đó là một trận mắng xối xả bằng tiếng Kumamoto nữa chứ.」"
1433 = "「Vậy sao.」"
1435 = "「Đó là tàn tích thành Ohimitera. Từ đó cũng có thể nhìn xuống toàn cảnh thành phố.\\nTất nhiên là không thể rộng bằng góc nhìn từ trên này được.」"
1436 = "「Đó là kế hoạch vận hành của \\x%l列車;#00ffc040;đoàn tàu%l;#;. Một \\x%lダイアグラム;#00ffc040;biểu đồ chạy tàu%l;#; hợp lý,\\nsẽ giúp ngăn ngừa tai nạn và nâng cao hiệu quả vận hành.」"
1440 = "「Vâng. Vì thế, những \\x%lレイルロオド;#00ffc040;Railord%l;#; như chúng em,\\nmới có thể nắm bắt và kiểm soát toàn bộ quá trình vận hành cũng như biểu đồ chạy tàu.」"
1445 = "「Đúng vậy. Nỗi đau đó——\\nvà cả sự oán hận không có nơi trút bỏ vì nó.」"
1447 = "「Vâng. Chắc chắn là em đã nhận được.」"
1450 = "「Vâng, đúng vậy thưa ngài Soutetsu. Chúng em\\nđề xuất \\x%lダイアグラム;#00ffc040;biểu đồ chạy tàu%l;#; và kiểm soát cả \\x%l運転計画;#00ffc040;kế hoạch hoạt động%l;#; nữa.」"
1452 = "「Vâng, chính xác là vậy.」"
1455 = "「Vâng, tất nhiên rồi ạ.\\nVì em là một \\x%lレイルロオド;#00ffc040;Railord%l;#; mà.」"
1457 = "「Kẻ nào đó!?」"
1460 = "「Là đền Akai Aso đấy.\\nKhông chỉ mái nhà, mà toàn bộ kiến trúc ở đó đều rất đẹp.」"
1463 = "「Thời gian không thể quay lại.\\nNhưng, có lẽ lần sau em sẽ không bị cuốn vào nữa.」"
1468 = "「Nếu đã nói là 'đầu tiên', và 'cả cái đó nữa' thì.\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; còn điều khiển đường sắt ở phạm vi rộng hơn nữa sao?」"
1477 = "「Hệ thống này, chính là hệ thống định vị \\x%lエアクラ;#00ffc040;Aircra%l;#; chuyên dụng\\ncủa cỗ máy này——\\x%lエアクラ;#00ffc040;Aircra%l;#; bay thử nghiệm EFL-T007.」"
1480 = "「Hệ thống này? Lẽ nào.」"
1485 = "「Quả nhiên là cái ác.\\nCả \\x%lエアクラ;#00ffc040;Aircra%l;#;, và cả nhà máy sản xuất \\x%lエアクラ;#00ffc040;Aircra%l;#; nữa.」"
1492 = "「Đúng vậy ạ. Thưa ngài Soutetsu.」"
1493 = "「Để ngăn chặn những tình huống như vậy,\\nđã từng có những nhân viên \\x%l保線;#00ffc040;bảo trì đường ray%l;#; phụ trách quản lý tuyến đường, nhưng……」"
1501 = "「Không có gì đặc biệt.\\nTôi chỉ đơn thuần phát đi thông tin xung quanh tạm thời thôi.」"
1502 = "「Ừm. Là vậy đấy.」"
1506 = "「Thành phố Ohimitera khi dạo bước ngắm nhìn sẽ mang một vẻ đẹp khác.\\nTrong lúc đi dạo, biết đâu em lại bắt gặp một khung cảnh quen thuộc nào đó.」"
1507 = "「Tại sao? Nếu em không giận thì——」"
1513 = "「Vậy là tình cờ,\\nHachiroku đã bắt được sóng sao.」"
1516 = "「Nhưng tại sao, nó lại lan đến tận chỗ tôi ở Đế Đô——\\nChiến dịch thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; lại trở nên rầm rộ đến vậy?」"
1518 = "「Trớ trêu thay. Đó cũng chính là thời đại mà những \\x%lレイルロオド;#00ffc040;Railord%l;#; như chúng em\\nđã phát huy trọn vẹn giá trị đích thực của mình.」"
1523 = "「Nhưng mà, em lại không có ký ức về khoảng thời gian đó.\\nThậm chí em còn không nhớ mình đã từng nhìn thấy thành phố xinh đẹp này hay chưa nữa.」"
1532 = "「Lần sau……liệu có đến không ạ? Với một kẻ như em.」"
1534 = "「Tuyệt vời quá. Một ngày nào đó, nếu có cơ hội,\\nem cũng muốn được ngắm nhìn thượng nguồn của dòng sông tuyệt vời này.」"
1536 = "「Vậy sao ạ?」"
1538 = "「Chị Mayami quả là một người tuyệt vời nhỉ.」"
1546 = "「Quả thực……fufu, em đã tình cờ,\\nnhận được một thông tin xung quanh rất có ý nghĩa.」"
1547 = "「Đúng vậy nhỉ.」"
1548 = "「Đúng vậy nhỉ. Vì chúng ta đang ở trên trời mà.」"
1549 = "「Có đấy. Bây giờ thì có rồi.\\nBàn tay của động cơ Aero-Craftech đã vươn tới cả bầu trời rồi.」"
1562 = "「Không thể nhúc nhích được nữa, đến sáng hôm sau thì được phát hiện, bảo vệ——\\nRồi bị chị Mayami mắng cho một trận tơi bời và ăn một cú đấm.」"
1564 = "「Tội lỗi.」"
1565 = "「Chắc là chưa nhìn thấy đâu. Từ trên này.」"
1571 = "「Nếu em mong muốn điều đó.\\nTôi chắc chắn sẽ giúp em đón nhận \"lần sau\".」"
1572 = "「Nếu có thời gian để than thở về sự bất lực, thì hãy hành động để trở nên mạnh mẽ hơn.\\nHãy hận sự bất lực của bản thân, và vì thế hãy không ngừng rèn luyện.」"
1575 = "「Lén lút trốn chui trốn nhủi để lên tiếng thật là hèn hạ.\\nHãy biết xấu hổ đi. Và mau hiện nguyên hình ra đây.」"
1577 = "「Cú đấm, sao ạ? Chị ấy á?」"
1580 = "「Nếu biết là máy bay ngay từ đầu, chắc chắn em sẽ\\ncố tỏ ra quen thuộc, chứ không dám ngó nghiêng xung quanh thế này đâu.」"
1581 = "「Nếu là máy bay thì giá như ngài nói ngay từ đầu.\\nEm đã không để ngài phải thấy bộ dạng khó coi của mình rồi.」"
1584 = "「Có muốn xuống gần xem thử không?」"
1586 = "「Mà này,\\nNgài Soutetsu cũng xấu tính thật đấy.」"
1589 = "「Có lẽ là vậy thật.\\nCả ngài Soutetsu cũng có hứng thú với cội nguồn của dòng sông này mà.」"
1590 = "「Nếu vậy, việc em đang ở đây\\nvà không biết phải cư xử ra sao, cũng là do cái tên đó sao?」"
1591 = "「Cũng……đúng nhỉ.\\nVâng. Em nghĩ ngài Soutetsu nói đúng.」"
1592 = "「Xin hãy để em giúp một tay, thưa ngài Soutetsu.\\nKhông thể để thành phố bên sông xinh đẹp này rơi vào tay kẻ ác được.」"
1593 = "「Đúng như những gì ngài Soutetsu đã dạy, dù chỉ một chút……\\nĐể hồi phục, em sẽ nỗ lực trở nên mạnh mẽ hơn——」"
1604 = "「Cơ thể em có vẻ cũng không bình thường nữa rồi.\\nĐến cả bản thân mình, hiện tại em cũng không thể kiểm soát nổi.」"
1616 = "「Một lời trách mắng rất chính đáng nhỉ.」"
1617 = "「Tôi hiểu rõ điều đó bằng chính bản thân mình.\\nNên tôi nghĩ mình có thể đồng cảm phần nào với sự oán hận của em.」"
1618 = "「Chuyện đó……một ngày nào đó.\\nMột ngày nào đó, chắc chắn——nếu có thể trở thành hiện thực.」"
1619 = "「Dòng sông dồi dào và tráng lệ quá.\\nĐó có phải là dòng nước mà lúc nãy em đã được uống không ạ?」"
1620 = "「Đường sắt——ở thành phố này vẫn còn——\\nsống sót nhỉ.」"
1621 = "「Mưa……sao?」"
1622 = "「Chà.」"
1623 = "「Nếu là chuyện đó——thì đương nhiên, em đã hiểu rõ rồi.」"
1624 = "「Vậy, những \\x%l列車;#00ffc040;đoàn tàu%l;#; gây ra tai nạn,\\nlà những chuyến tàu không được \\x%lレイルロオド;#00ffc040;Railord%l;#; điều khiển sao?」"
1628 = "「Mái nhà tuyệt đẹp kia là ở đâu vậy ạ?」"
1631 = "「Vậy thì em sẽ xuống!」"
1633 = "「Em ấy ghét chuyện tôi là con nuôi.\\nTôi thì chẳng bận tâm đâu……nhưng nếu em nhớ điều đó thì tốt quá.」"
1635 = "「Vậy thì em,\\nphải cảm ơn sự xấu tính của ngài Soutetsu rồi nhỉ?」"
1637 = "「Còn khu rừng kia thì sao ạ?\\nChỉ có chỗ đó là nhô lên khá cao so với xung quanh.」"
1638 = "「Đó là điều hiển nhiên ạ. Việc điều khiển phương tiện động lực và \\x%l列車;#00ffc040;đoàn tàu%l;#;,\\nsẽ do \\x%lレイルロオド;#00ffc040;Railord%l;#; cùng với \\x%l機関士;#00ffc040;người lái tàu%l;#; hoặc \\x%l運転士;#00ffc040;nhân viên cơ vụ%l;#; phối hợp thực hiện.」"
1645 = "「Rei-\"ruroo\"-do——Ra vậy, quả là một sự ám chỉ.\\nBị cái ác xua đuổi, chúng em đành phải chịu cảnh lưu lang.」"
1648 = "「Đường sắt vẫn là vị trí số một sao?」"
1654 = "「Ngăn ngừa tai nạn, sao——」"
1659 = "「Dù đây là lần đầu tiên đi máy bay, nhưng em thấy nó cũng tuyệt lắm.\\nChắc chắn đây là phương tiện tuyệt vời thứ hai, chỉ sau đường sắt thôi.」"
1660 = "「Ngài……Soutetsu.」"
1661 = "「Ngài Taito……Cả ngài Soutetsu nữa.\\nA! Thảo nào lúc nói về cái tên, cô Hibiki lại」"
1662 = "「Cả ngài Soutetsu cũng vậy sao?」"
1663 = "「Ngài thật tinh ý, thưa ngài Soutetsu.\\nNhưng——rồi cuối cùng…………」"
1664 = "「Em nghĩ ngài Soutetsu nói đúng ạ.\\nEm vô cùng xấu hổ vì đã mất bình tĩnh và trút giận vô cớ.」"
1665 = "「Ngài am hiểu thật đấy, ngài Soutetsu.\\nCách giải thích đó gần như khớp hoàn toàn với thực tế ạ.」"
1666 = "「Ngài Soutetsu?」"
1670 = "「Không phải đâu thưa ngài Soutetsu. Dù là đường ray, phương tiện hay \\x%lレイルロオド;#00ffc040;Railord%l;#;.\\nKẻ chi phối tất cả những thứ đó, chính là con người các ngài.」"
1672 = "「Kẻ ác.」"
1678 = "「Nếu tính đến sự chênh lệch thể hình thì thế này là vừa rồi.\\nĐược chứ? Hachiroku, vậy là hòa nhé.」"
1680 = "「Navi, rốt cuộc cô đã gửi gì vậy?」"
1795 = "Không biết có gì thú vị,\\nmà Hachiroku lại cười khúc khích."
1798 = "Không hề ngượng ngùng, em ấy trả lời một cách thẳng thắn.\\nKhông tệ chút nào."
1803 = "——Sự thật đang đắp nặn thêm cho những suy đoán."
1807 = "Tai nạn sẽ xảy ra.\\nKhông phải do đồ vật, không phải do công nghệ, mà là do trách nhiệm của con người vận hành chúng."
1811 = "Một tiếng thở phào nhẹ nhõm."
1814 = "Hai đường thẳng màu bạc hiện ra rõ rệt. Trải dài tít tắp.\\nTrong ánh mắt Hachiroku, ánh lên một niềm vui sướng mãnh liệt."
1817 = "Hachiroku giật mình thẳng lưng lên."
1818 = "A, Hachiroku khẽ thốt lên.\\nRồi em ấy lại dùng ngón tay viết chữ vào không trung."
1822 = "Liệu Hachiroku có tiết ra nước bọt không nhỉ?\\nTôi chợt nghĩ đến điều đó."
1824 = "Những ngón tay dài đến mức không hề ăn nhập với đôi bàn tay nhỏ bé của Hachiroku,\\nviết những nét chữ Road một cách trôi chảy——trong không trung."
1826 = "Hachiroku dang rộng hai cánh tay ngắn ngủn của mình.\\nNhư muốn biến chúng thành đôi cánh để vươn lên cao hơn nữa."
1828 = "Giọng của tôi và Hachiroku vang lên cùng lúc."
1830 = "Nói rồi, Hachiroku ngây thơ\\nrướn người về phía trước, tiếp tục ngắm nhìn khung cảnh bên dưới."
1832 = "Dù bị hỏng hóc, nhưng có vẻ Hachiroku\\nvẫn mạnh mẽ hơn tôi của ngày xưa rất nhiều."
1833 = "Hachiroku nói đúng.\\nLúc này tôi quả thực rất xấu tính."
1836 = "Hachiroku ngẩng mặt lên nhìn tôi.\\nVới khuôn mặt đẫm nước mắt chưa hề lau khô."
1839 = "Một giọng nói như cố sức nặn ra."
1841 = "Đôi môi em ấy mím chặt thành một đường thẳng, rồi khẽ méo xệch đi."
1842 = "Từ sự phản kháng gần như thù địch, bỗng chốc chuyển sang cảm động và vui sướng.\\nNếu Hibiki là người có trăm khuôn mặt, thì Hachiroku này có trăm cảm xúc."
1844 = "Ánh mắt Hachiroku, một lần nữa, lại hướng ra ngoài cửa kính buồng lái."
1847 = "Đôi vai Hachiroku khẽ run lên.\\nCổ họng em ấy nuốt ực một thứ gì đó."
1849 = "Khuôn mặt Hachiroku méo mó đầy đau khổ.\\nGiọng nói cũng trở nên lạnh lẽo."
1850 = "Ánh mắt cụp xuống nay đã ngước lên.\\nÁnh lên một tia sáng tinh nghịch."
1851 = "Nói rồi, ánh mắt Hachiroku hướng xuống dưới.\\nKhông biết từ lúc nào, độ cao đã giảm đi đáng kể."
1852 = "Nhẹ nhàng. Hachiroku cụp mắt xuống."
1856 = "Giọng Hachiroku nghẹn lại.\\nTai nạn xảy ra liên miên, bãi bỏ tuyến đường, loại bỏ \\x%l列車;#00ffc040;đoàn tàu%l;#;——"
1860 = "Giọng Hachiroku vút cao lên."
1863 = "Ánh mắt Hachiroku hướng thẳng vào tôi.\\nNhư muốn cầu cứu."
1865 = "Hachiroku khẽ gật đầu. Rồi im lặng."
1867 = "Biểu cảm của Hachiroku hạnh phúc đến mức,\\nkhiến tôi tin chắc rằng điều em ấy nói là sự thật."
1869 = "Em ấy gật đầu cái rụp.\\nKhuôn mặt ngước lên đã khôi phục lại biểu cảm."
1885 = "Ra là vậy."
1886 = "E\"aku\"ra, là trò chơi chữ sao."
1888 = "Những lời tôi chỉ định nói đùa,\\nlại được Hachiroku đón nhận với vẻ mặt vô cùng nghiêm túc."
1901 = "Bằng sự im lặng đồng lõa với Navi,\\ntôi đang lừa dối Hachiroku."
1903 = "Những điều đó gần như đã triệt tiêu hoàn toàn hiện tượng tắc đường,\\nbiến thời gian di chuyển bằng xe cộ thành một con số có thể xác định chính xác."
1907 = "Sự kết thúc của thời kỳ Đại bãi bỏ tuyến đường sắt,\\ncũng đồng nghĩa với sự kết thúc của thời đại đường sắt."
1909 = "Kỳ lạ thật. Tại sao chứ. Suy nghĩ đi.\\nRõ ràng là chị Mayami phản đối chuyện này."
1911 = "Vẫn chống tay xuống sàn, đôi vai em ấy run rẩy,\\nkhông hề lau đi, chỉ biết khóc nức nở."
1913 = "Em ấy lại khóc.\\nLần này xen lẫn cả nụ cười, khiến khuôn mặt xinh đẹp trở nên nhăn nhúm."
1914 = "Đột nhiên em ấy lại ấp úng.\\nTôi chờ đợi một lúc. Nhưng sự im lặng vẫn tiếp diễn."
1917 = "Nếu đúng là vậy, tôi sẽ sửa chữa cho em ấy——\\nNhưng có lẽ Hachiroku là một món đồ hỏng hóc nghiêm trọng."
1919 = "Em gái——"
1924 = "Nói chuyện thật dễ dàng.\\nQuả nhiên, có lẽ tính cách của chúng tôi khá giống nhau——À, không."
1930 = "Em ấy nhìn sang trái phải.\\nSự gay gắt trong ánh mắt đã dịu đi phần nào."
1932 = "Niềm tự hào mãnh liệt, sự kiên định không lay chuyển, tràn ngập trong từng lời nói."
1937 = "Nhưng, chính điều đó lại khiến tôi vướng bận."
1941 = "Chính vì yêu và tự hào về đường sắt hơn bất cứ thứ gì——\\nNên Hachiroku mới ghét \\x%lエアクラ;#00ffc040;Aircra%l;#; đến thế sao."
1943 = "Sự chuyển đổi cảm xúc nhanh chóng đó có lẽ là vì em ấy là một đồ vật chăng——\\nHoặc cũng có thể về mặt tính cách, em ấy giống tôi."
1948 = "Vì không muốn em ấy phải bận tâm,\\nnên tôi quyết định giấu đi chi tiết về vụ tai nạn đường sắt."
1950 = "Tôi cứ nghĩ đơn giản tất cả đều là \"đường sắt\",\\nnhưng không ngờ bên trong lại phức tạp đến thế."
1951 = "Tôi ngạc nhiên.\\nCảm xúc cứ thế bật thốt ra thành lời."
1953 = "Là lúc tôi còn là một cậu bé.\\nVào thời điểm xảy ra vụ tai nạn đó."
1955 = "Tôi dùng đầu ngón tay khẽ búng vào trán em ấy.\\nNhẹ đến mức chẳng gây ra chút đau đớn nào."
1957 = "Chỉ ra sự thật. Bằng một giọng điệu nhẹ nhàng và tươi sáng."
1960 = "Vì thế, dù công nghệ có phát triển đến đâu thì tai nạn vẫn không bao giờ chấm dứt.\\nTất nhiên, nguyên nhân thực sự của tai nạn không nằm ở công nghệ."
1971 = "Nếu vậy——tôi quyết định,\\nquay lại với những thắc mắc đã gác lại lúc trước."
1975 = "Một đôi mắt tăm tối.\\nNhìn vào đó, tôi có cảm giác như mình cũng sắp bị cuốn theo."
1977 = "Em ấy đang khóc.\\nNhững giọt nước mắt to tròn lại lã chã tuôn rơi."
1982 = "Dù có can ngăn thì cũng chỉ khiến khúc mắc thêm sâu sắc mà thôi."
1985 = "Giấu giếm cũng chẳng để làm gì.\\nNhưng Hachiroku là một \\x%lレイルロオド;#00ffc040;Railord%l;#;."
1995 = "Đôi mắt đẫm lệ ngước lên.\\nÁnh nhìn hướng thẳng về phía tôi."
1996 = "Hoàn thành sự chuộc tội đó, và sống sót để làm điều đó.\\nĐó chính là nghĩa vụ lớn nhất mà tôi phải hoàn thành, tôi đã được dạy như vậy."
2000 = "Dù tình hình giao thông thực tế có ra sao, có thay đổi thế nào đi chăng nữa,\\nđối với Hachiroku, đường sắt vẫn luôn là điều \"tuyệt vời nhất\" không bao giờ thay đổi."
2001 = "Nhưng——\\nDùng lời nói dối để lấp liếm tạm thời, đó mới chính là cái ác."
2004 = "Nhưng ánh mắt, đồng tử của em ấy——\\nlại bùng cháy dữ dội như ngọn lửa rực sáng, vượt qua cả sự mãnh liệt trong từng chuyển động."
2005 = "Tuy nhiên, dù pháp luật có buộc họ phải chịu \"trách nhiệm\" đi chăng nữa——\\nthì sự oán hận cũng không biến mất, và vết thương cũng chẳng thể lành lại."
2013 = "Đó là điều đương nhiên.\\nBởi vì đó chính là nghĩa vụ của tôi."
2014 = "Như một lẽ đương nhiên.\\nNhững lời nói không chút ngập ngừng hay gượng ép."
2018 = "Đôi mắt em ấy đảo quanh một cách bối rối,\\nrồi cuối cùng dừng lại ở bảng điều khiển trung tâm của buồng lái."
2021 = "Một từ ngữ khá nặng nề."
2025 = "Một cách rất chính đáng, rất đỗi bình thường——\\nCuối cùng tôi cũng gặp được những người đối xử với mình như bao người khác."
2028 = "Được bao bọc trong sự im lặng đó,\\nHachiroku vẫn vui vẻ tiếp tục ngắm nhìn khung cảnh bên dưới."
2030 = "Navi rất thông minh. Và biết cách đọc bầu không khí.\\nNên cô ấy vẫn luôn giữ im lặng."
2031 = "Tạm thời gác lại những từ ngữ không hiểu,\\ntôi bắt đầu xác nhận lại những phần mình đã nắm được."
2032 = "Nghe tôi trả lời, Hachiroku khẽ cười khúc khích."
2033 = "Dừng bặt.\\nHachiroku hoàn toàn bất động."
2035 = "Lúc đó. Nếu có thể cứu được ai đó.\\nThay cho Michiko mà tôi đã không thể cứu, dù chỉ cứu được một người thôi."
2036 = "Trời không một gợn mây.\\nVậy mà, tại sao một hệ thống như Navi lại nói thế——A!"
2040 = "Ông Taito đó, đã \"bỏ mặc\" em ấy trong tủ kính.\\nKý ức bị khuyết thiếu. Cảm xúc dao động đến mức cực đoan."
2042 = "Khi tôi xen vào, Navi lập tức dừng lời.\\nBởi vì đây là những lời mà tôi, một con người, cần phải nói."
2050 = "Nói thì đúng là vậy, nhưng Navi đang nghe đấy.\\nHy vọng cô ấy không hiểu lầm chuyện gì kỳ quặc."
2051 = "Giọng điệu vẫn như thường lệ, nhưng rõ ràng là đang rất hào hứng.\\nNếu có đuôi chắc em ấy đang vẫy tít thò lò rồi."
2052 = "Tôi vừa dứt lời.\\nHachiroku đã gật đầu đầy tự hào."
2057 = "Thản nhiên. Em ấy buông những lời vô cùng lạnh lẽo."
2066 = "Tôi đã được dạy điều đó.\\nTừ một cô gái tóc vàng xa lạ. Vào lúc vết thương từ vụ tai nạn vẫn chưa nguôi ngoai."
2067 = "Trong trường hợp này……có nghĩa là dòng máy kế nhiệm,\\nà không, có lẽ là nơi kế thừa công nghệ thì đúng hơn."
2068 = "Từ ông Taito, người đã gieo mầm sống mới cho tôi,\\nkhi tôi đang dần mục nát dù vẫn còn sống."
2069 = "Một thành phố bên sông. Hơn nữa đường ray cũng chạy dọc theo sông.\\nNên không lo thiếu chỗ hạ cánh."
2070 = "Đây cũng là điều mà tôi đã được dạy."
2071 = "Nếu vậy thì cách thức vận hành giao tiếp \\x%l共感;#00ffc040;cộng cảm%l;#; của Hachiroku,\\nvà chức năng của hệ thống định vị \\x%lエアクラ;#00ffc040;Aircra%l;#; như Navi về cơ bản là giống nhau."
2075 = "Chia sẻ thông tin tai nạn và tuyến đường vòng thông qua giao tiếp \\x%l共感;#00ffc040;cộng cảm%l;#;.\\nVà chế độ lái tự động nhờ hệ thống định vị."
2080 = "Thời đại đó, sau này,\\nđã được gọi bằng một cái tên vô cùng ngắn gọn."
2082 = "Vào lúc tôi không thể tìm thấy nơi để trút bỏ sự oán hận,\\nvà chỉ biết để trái tim mình dần mục nát."
2086 = "Tiếng thét chói tai vang lên, buồng lái chật hẹp rung lắc dữ dội.\\nHachiroku bắt đầu vùng vẫy để thoát ra khỏi đây."
2095 = "Và rồi những lời của Hachiroku,\\nlại tuôn trào trôi chảy như nước chảy mây trôi."
2096 = "Và rồi, em ấy cúi gập người.\\nChống hai tay xuống sàn buồng lái, Hachiroku cúi gầm mặt xuống."
2097 = "Sau đó tôi chỉ tay, hướng ánh nhìn của Hachiroku về phía trước.\\nNhư muốn thổi bay mọi muộn phiền vào không trung."
2098 = "Dù điều đó có lẽ chẳng phải là chỗ dựa gì,\\nnhưng Hachiroku đã ngước ánh nhìn đang cụp xuống lên."
2099 = "Dù không phải là lĩnh vực tôi giỏi,\\nnhưng nếu là đùa vui thì cứ thử hùa theo xem sao."
2106 = "Khi tôi nói ra thắc mắc giản đơn đó,\\nHachiroku mỉm cười đầy mãn nguyện."
2107 = "Hachiroku trông rất vui vẻ.\\nKhiến tôi khó lòng thú nhận rằng mình đã học được điều đó từ Navi."
2108 = "Người lái đầu máy xe lửa thì gọi là \\x%l機関士;#00ffc040;người lái tàu%l;#;.\\nCòn người điều khiển các phương tiện động lực khác thì gọi là \\x%l運転士;#00ffc040;nhân viên cơ vụ%l;#;, tôi được dạy như vậy."
2117 = "（Ọt~~）"
2118 = "（Búng!）"
2121 = "（Đó chính là lý do lớn nhất khiến xe ô tô động cơ đốt trong bị loại bỏ khỏi mặt đất,\\nvà được thay thế bằng xe \\x%lエアクラ;#00ffc040;Aircra%l;#; sao——）"
2125 = "（Hoặc có lẽ, nếu vậy thì……）"
2129 = "Giọng nói của Navi vang lên hoàn toàn bất ngờ.\\nNhưng Hachiroku không hề hét lên, mà chỉ dùng ánh mắt sắc lẹm để chất vấn."
2131 = "Navi đang tức giận trong im lặng.\\nTôi không can ngăn."
2133 = "Trước những lời lẽ lạnh lùng của Navi,\\nHachiroku chợt nở nụ cười mỉm."

[selections]
