2236 = "「Cửa xả bị tắc thì lửa sẽ tắt. Dù không đến mức tồi tệ như vậy, nhưng nếu rải than không đều, hiệu suất đốt cháy sẽ giảm đi đáng kể.」"
2237 = "「Yên tâm?」"
2245 = "「Nếu đã như vậy thì, Hachiroku」\\n「Vì thế nên, ngài Soutetsu」"
2248 = "「Ngày mai em bận mất rồi.」"
2249 = "「Ngày mai, anh sẽ đi bộ dọc theo đường ray cùng Hachiroku, sao nào, nếu hai đứa có thời gian thì đi cùng không?」"
2255 = "「Đ, đúng vậy, nhỉ——bé Nagi. B, bao trọn phòng hay gì đó…… ừm, có vẻ thú vị, mà.」"
2258 = "「Đúng vậy! Nhưng mà, em cũng sắp xử lý xong nó rồi!」"
2260 = "「Vâng ạ. Lúc đó, em nghĩ mình sẽ phải nghiêm khắc la mắng ngài Soutetsu đấy.」"
2261 = "「Đúng vậy nhỉ. Nếu ở đó có đường sắt chạy qua.」"
2263 = "「Vâng. Lúc đó chúng ta nhất định phải mời gọi cô ấy.」"
2267 = "「Vâng ạ, tuyến đường từ đây trở về Ohimitera em cũng đã xác nhận lúc ở trong \\x%lキハ07;#00ffc040;KiHa 07%l;#; rồi, nhưng mà——」"
2269 = "「Vậy sao…… nói sao nhỉ, ừm…… Đây quả là một cái cây rất bề thế đấy.」"
2271 = "「Ý cô là sức mạnh sao? Đủ sức vượt qua mà không cần bận tâm đến những chi tiết nhỏ nhặt ấy.」"
2273 = "「Vâng——a, ngài Soutetsu, xin hãy đặt em xuống đi ạ. Độ dốc đang thay đổi rồi.」"
2276 = "「Vâng——đang ở gần đây——sao lại, không kết nối được \\x%l共感;#00ffc040;cộng cảm%l;#;—— Tại sao! Tại sao chứ!!!」"
2278 = "「Vâng——là cần thiết ạ. \\x%l保線;#00ffc040;Bảo trì đường ray%l;#; là công việc, phải làm thường xuyên.」"
2282 = "「Là \\x%l縦断面図;#00ffc040;bản đồ mặt cắt dọc%l;#; thể hiện độ dốc của đường ray ạ. Vì vậy, em muốn nhờ ngài Soutetsu đi cùng em.」"
2284 = "「À, chuyện \\x%l投炭;#00ffc040;xúc than%l;#; sao.」"
2295 = "「Ra là vậy. Trong buồng lái thì vóc dáng nhỏ bé lại là một lợi thế nhỉ. Hừm——nếu như Nagi tỏ ra hứng thú.」"
2296 = "「Vậy…… sao ạ. Nhưng mà, nếu là vậy thì em yên tâm rồi.」"
2297 = "「Vậy sao ạ? Nhưng ngài Soutetsu đã làm được đấy ạ.」"
2298 = "「Vâng, đúng vậy ạ. \\x%l勾配図;#00ffc040;Bản đồ độ dốc%l;#; của bé Reina và mọi người, đối với chúng ta thì có hơi quá sơ sài.」"
2301 = "「Vâng, ngài Soutetsu!」"
2302 = "「Kết thúc rồi ạ. Ngài đã vất vả rồi, ngài Soutetsu.」"
2304 = "「Có ai bị thương, có ai bị thương không!? Có hành khách nào bị thương không ạ.」"
2312 = "「Quả nhiên…… hai người…… là mối quan hệ như thế——」"
2318 = "「Cây đổ đấy! Lại đây!!!!」"
2327 = "「Mặt trong cùng mỏng nhất, phía trước thì dày—— Cách rải than rất tốt, đúng theo cơ bản đấy ạ.」"
2329 = "「Đã tốt hơn lúc nãy rất nhiều rồi ạ. Trên thang điểm 100, em có thể cho cô 22 điểm.」"
2330 = "「Kiểu như 『Ký ức này có liên quan quá sâu sắc đến vụ tai nạn. Để nhớ lại thì nguy hiểm lắm』――chẳng hạn.」"
2333 = "「Anh đang mong thế đây. Sự chỉ bảo nghiêm khắc sẽ dẫn đến sự trưởng thành tốt hơn mà.」"
2334 = "「Không có gì phải phiền não cả. Chỉ là đúng như nghĩa đen thôi.」"
2335 = "「Đúng vậy. Trí tuệ hay…… ngay cả lý trí thực chất cũng rất khó kiểm soát. Đối với tôi——và có lẽ, đối với cả cô nữa, Hachiroku.」"
2336 = "「Vâng. Cơ thể cô ấy lại nhỏ nhắn và mỏng manh nữa.」"
2337 = "「Vâng. Mới lần đầu, lại với vóc dáng nhỏ bé như vậy mà làm được đến thế.」"
2338 = "「Không sao. Dù gì thì bản đồ này cũng chỉ dành riêng cho chúng ta thôi mà?」"
2339 = "「Không sao đâu. Hachiroku. Cứ giao cho tôi.」"
2347 = "「Say nước nóng à? Thế thì không ổn rồi.」"
2349 = "「Ngâm nóng quá…… ư~~, chắc là, bị ngâm nóng quá nên say sóng luôn rồi~」"
2354 = "「Tắm rửa xong hết rồi à?」"
2356 = "「Fukami tính sao? Cũng sẽ mất kha khá thời gian đấy.」"
2357 = "「Fukami?」"
2359 = "「Cũng là để kiểm chứng điều đó. Giá mà chúng ta có thể nhanh chóng chạy thử thì tốt biết mấy.」"
2360 = "「Tại sao chứ! Mặc thế này em vẫn cử động được mà.」"
2361 = "「Chuyện đó thì nhằm nhò gì—— Trời ơi, thật tình, sao lại đến nông nỗi này.」"
2362 = "「Không sao. Vốn dĩ anh đã bẩn sẵn rồi, sau khi đưa em về, anh sẽ đi thẳng đến nhà tắm Tororyu-yu mà.」"
2366 = "「Chuyện đó đi bộ cũng được, hay đi nhờ \\x%lキハ07;#00ffc040;KiHa 07%l;#; cũng chẳng sao.」"
2370 = "「Còn đây là máy tập \\x%l投炭;#00ffc040;xúc than%l;#;.」"
2372 = "「Đặc huấn?」"
2374 = "「Dùng xẻng xúc than, tay kia kéo xích mở cửa, vừa đưa vào thì đồng thời úp xẻng xuống, đập than xuống sàn.」"
2376 = "「Tất nhiên rồi! Anh muốn xem bao nhiêu cũng được!」"
2377 = "「Đương nhiên là cái cây này rồi!」"
2378 = "「Được thôi ạ. Vậy thì cô Nagi, em xin phép giải thích ngắn gọn về việc \\x%l投炭;#00ffc040;xúc than%l;#; nhé.」"
2380 = "「Tất nhiên rồi, tôi sẽ đi cùng cô.」"
2383 = "「Nhà tắm Tororyu-yu là ngoại lệ. Ở đó, họ cho phép anh bao trọn phòng tắm nữ để tắm.」"
2384 = "「Nhà tắm Tororyu-yu? Lúc nãy anh hai bảo, nhà tắm công cộng cũng ghét vết bẩn than đá mà?」"
2390 = "「92 trên thang điểm 100. Đạt yêu cầu rồi ạ, ngài Soutetsu.」"
2392 = "「Quả thực, nếu là con người thì có thể sẽ có chuyện đó—— Nhưng điều đó, lại xảy ra với một đồ vật như em sao.」"
2395 = "「Trông thú vị quá! Cho em làm thử với!!」"
2396 = "「Cái này trông thú vị cực kỳ! Có vẻ như sẽ giúp ích cho việc tu hành đấy!」"
2398 = "「Rõ rồi!」"
2399 = "「Hiểu rồi! Nếu xúc 100 xẻng bằng cái xẻng 1 ký, thì tức là ném vào 100 ký than đúng không!」"
2407 = "「Sau khi xử lý xong những việc cần xử lý, lúc về, chúng ta hãy đi bằng \\x%lエアクラ;#00ffc040;Aircra%l;#; nhé.」"
2412 = "「Cuối cùng…… cũng qua được, một nửa——rồi.」"
2418 = "「Giỏi lắm. Đến mức này thì, em thực sự đã rất cố gắng rồi.」"
2419 = "「Hãy cởi áo sơ mi ra, vẫy thật mạnh để ra hiệu cho \\x%l列車;#00ffc040;tàu%l;#;!」"
2431 = "「Hà——hà——hà——hà—— Thế này, thì——sao——hả!」"
2432 = "「Hả…… hả?」"
2433 = "「Chúng ta lại phải đi bộ, ra ngoài khu vực cấm bay sao ạ?」"
2436 = "「Đến Yui mà không có thì tốt nhỉ.」"
2437 = "「Nghĩa là em sẽ ở lại xem tập \\x%l投炭;#00ffc040;xúc than%l;#; sao? Hay là, Fukami cũng muốn thử thách.」"
2442 = "「Nếu là chặt cây thì thời đại này làm gì còn dùng rìu nữa——hả!?」"
2443 = "「Nhớ nói rõ là quần áo và da dẻ sẽ bị bẩn lem luốc vì than đá. Và cũng mất khoảng một tiếng đồng hồ đấy nhé.」"
2444 = "「Như đã hứa, anh sẽ đưa em về.」"
2445 = "「B, bị anh, nhìn chằm chằm, như thế—— em, em——tiêu mất, ạ. Hau.」"
2446 = "「Xin ngài đừng khóc, ngài Soutetsu. Chúng ta đã làm được rồi mà! Chúng ta đã ngăn chặn được tai nạn trước khi nó xảy ra rồi mà.」"
2447 = "「Xin hãy qua bên này, và tự mình kiểm tra thành quả đi ạ.」"
2448 = "「Xin cứ giao cho em. Ngài Soutetsu.」"
2449 = "「Xin hãy bắt đầu đi ạ.」"
2473 = "「Cũng có lý do đó nữa——và hiệu suất \\x%lブレーキ;#00ffc040;phanh%l;#; chắc chắn cũng đã được cải thiện đáng kể so với \\x%l8620;#00ffc040;8620%l;#; rồi ạ.」"
2475 = "「Cái đó là gì vậy?」"
2476 = "「Không phải trò đùa đâu!」"
2477 = "「Cái tên nghe kỳ cục quá.」"
2478 = "「Đây là wansuko. Là cái xẻng dùng để xúc than vào lò.」"
2479 = "「Để than cháy được thì cần có khí nạp và khí thải. Do đó, bên trong lò khi đang cháy sẽ trở thành một loại thông gió.」"
2480 = "「Tất nhiên rồi ạ, ngài Soutetsu.」"
2481 = "「Ra là vậy, từ đây đến Yui. Tính ra thì, chúng ta vẫn chưa đi chuyến nào nhỉ.」"
2482 = "「Ra vậy.」"
2483 = "「Khu vực này là…… nơi chúng ta đã đến lúc hạ cánh khẩn cấp nhỉ.」"
2484 = "「Còn một phút nữa.」"
2486 = "「Thế thì lại càng hợp để tu hành! Em sẽ né tránh một cách nhẹ nhàng cho xem!!」"
2493 = "「Vậy để lần sau, khi nào em mặc đồ thể dục đến thì hẵng làm.」"
2494 = "「À thì, ông của bé Nagi—— rất là, chiều chuộng bé Nagi, ạ. Nên là.」"
2495 = "「Dạ…… anh Soutetsu.」"
2496 = "「Dạ, chào buổi tối. Ạ. Em——ừm, có chuyện, muốn bàn bạc với chị Paulette.」"
2498 = "「Nếu vậy thì, Hachiroku. Nhờ cô được không.」"
2499 = "「Vậy là ok rồi! Quần áo bẩn cũng ok! Lúc về, có là nửa đêm cũng ok luôn!!」"
2501 = "「Nếu vậy thì anh không ép đâu. Nói chung là, nhớ cẩn thận đừng để bị thương nhé.」"
2503 = "「Bà chủ ở đó rất thấu hiểu cho ngành đường sắt. Nhưng mà, bà ấy bảo nếu làm bẩn phòng tắm nam rộng lớn thì phiền lắm.」"
2505 = "「Nếu vậy, như một trong số những việc đó. Em muốn tiến hành lập \\x%l勾配図;#00ffc040;bản đồ độ dốc%l;#; ạ.」"
2507 = "「Còn Fukami thì——」"
2508 = "「Người có lỗi là em! Là do em, đã không suy nghĩ thấu đáo.」"
2510 = "「Nếu là em thì mặc kiểu gì chẳng cử động được—— Đây này.」"
2511 = "「Để đón chờ \"lúc đó\", chúng ta vẫn còn vô số việc phải hoàn thành.」"
2512 = "「Tuy chỉ là \\x%l投炭;#00ffc040;xúc than%l;#; 100 ký, nhưng lại làm liên tục 3 set cơ mà. ……Đến cuối cùng, em đã xem cô ấy như một ứng cử viên cho vị trí \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; rồi đấy ạ.」"
2514 = "「À, nhờ cô——tôi rất muốn nói vậy, nhưng hôm nay cô hãy làm cho Nagi thay vì tôi đi.」"
2515 = "「Đó là điều đương nhiên ạ. Nói sao nhỉ——」"
2516 = "「Chẳng có \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; nào lại giỏi leo dốc cao cả đâu ạ. Nhưng mà——trong số đó, thì chắc cũng thuộc nhóm không giỏi lắm thật.」"
2518 = "「Ngài Soutetsu——nếu ngài nói vậy thì, em cũng không là gì khác ngoài một đồ vật cả.」"
2519 = "「Ngài Soutetsu. Em sẽ xoa bóp cơ thể cho ngài.」"
2520 = "「Chính những chỉ thị mà ngài Soutetsu đã suy nghĩ và đưa ra, đó mới là câu trả lời mà em đang tìm kiếm.」"
2521 = "「Ngài Soutetsu!」"
2522 = "「Ngài Soutetsu!!!」"
2523 = "「Ngài Soutetsu. Em vô tình quên mất rồi—— Tại sao lại phải rải than ở \\x%l火床;#00ffc040;buồng lửa%l;#; phía trước dày, phía trong mỏng vậy ạ?」"
2525 = "「Nếu là như vậy, ngài Soutetsu. Chẳng phải trạng thái này sẽ tốt hơn sao?」"
2526 = "「Ngài Soutetsu, xin hãy đặt em xuống đường ray.」"
2528 = "「Mới lần đầu sao mà làm được như thế chứ!」"
2532 = "「Đen thui luôn kìa! Anh làm gì mà bẩn dữ vậy!」"
2533 = "「!」"
2534 = "「!!」"
2535 = "「!!!!!」"
2538 = "「1.6 và 123.09. \\x%l勾配距離;#00ffc040;Chiều dài đoạn dốc%l;#; đến đây là 149.23, \\x%lレール種別;#00ffc040;loại đường sắt%l;#; không đổi——xong.」"
2545 = "「22 á!? Chỉ được chừng đó thôi sao!?」"
2686 = "Lúc đầu chỉ nghiêng sang hai bên một chút. Nhưng rồi ngay lập tức, nó phát ra tiếng răng rắc và ngày càng nghiêng hẳn về phía đường ray!"
2690 = "Không ổn rồi. Tôi vội đỡ lấy cơ thể em ấy, trước mắt cứ phải cho em ấy ngẩng mặt lên đã."
2692 = "Là sợ hãi, là an tâm, hay là đang vui sướng…… Có lẽ tất cả cùng lúc đan xen, khiến tôi có chút hỗn loạn."
2696 = "Nhưng——Nagi hoàn toàn không có vẻ gì là chùn bước."
2697 = "Nhưng mà, trước khi dạy dỗ Nagi, bây giờ có việc phải làm ngay lập tức!!"
2698 = "Nói là vậy, nhưng tôi cũng chẳng thể làm gì thêm. Tôi chẳng thể can thiệp gì vào quá khứ cả——"
2707 = "Theo lời khuyên của thầy Akai, có lẽ ngay trong hôm nay, tôi nên đến nhà tắm Tororyu-yu."
2712 = "Cùng lúc với tiếng hét lớn của Nagi, Fukami vừa khuyên can vừa bước vào bãi tập \\x%l投炭;#00ffc040;xúc than%l;#;."
2715 = "Thế nhưng, Nagi được lau mặt lại nheo mắt lại với vẻ vô cùng dễ chịu."
2721 = "Nhân tiện lúc làm \\x%l勾配図;#00ffc040;bản đồ độ dốc%l;#; đó, thử nói chuyện về vị trí \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; xem sao cũng không tệ."
2734 = "Tiếng \"À\" nghe như một tiếng thở dài đó, vừa giống như đang thán phục, lại vừa giống như đang cạn lời."
2736 = "Vừa nói, Hachiroku vừa điêu luyện thao tác chiếc xẻng nhỏ trên tay."
2737 = "Hachiroku không hề tỏ ra khó chịu, mà còn tựa đầu vào tay tôi."
2740 = "Hachiroku lại áp mặt xuống đường ray, và bắt đầu chuyển đổi độ dốc thành những con số."
2742 = "Phía bên kia cánh cửa lật, Hachiroku đang kiểm tra mặt sàn. Trên sàn, than đen phủ kín không một khe hở, lấp đầy toàn bộ các ô."
2744 = "Hachiroku nhỏ xíu, bé tẹo chạy thẳng về phía tôi như thể lăn lông lốc."
2746 = "Hachiroku, vươn tay thẳng về phía tôi."
2749 = "Cô ấy gật đầu thật mạnh, theo đà đó, khuôn mặt của Hachiroku tạo ra vài gợn sóng trong bồn tắm."
2752 = "Đôi tay của Hachiroku vẫn mang sức mạnh và độ ấm như mọi khi, tôi không hề cảm thấy cô ấy đang có chút dao động nào."
2753 = "Giọng nói lẫn lộn giữa niềm tự hào và sự bất an. Vì vậy, tôi xoa đầu Hachiroku."
2755 = "Ánh mắt Hachiroku dõi theo Nagi và Fukami, rồi lại hướng thẳng về phía tôi."
2757 = "Bước chân của Hachiroku đột ngột dừng lại. Ánh mắt mang vẻ dò xét nhìn tôi."
2758 = "Hachiroku vươn tay về phía tôi một cách vô cùng tự nhiên. Tôi cứ thế bế cô ấy lên, lấy tay trái làm ghế ngồi cho Hachiroku."
2760 = "Giọng nói đầy kinh ngạc của Hachiroku. Chắc hẳn đã lọt vào tai, Nagi từ từ quay về phía chúng tôi."
2761 = "Hachiroku tuột khỏi tay tôi và đáp xuống đất một cách mượt mà. Cô ấy đã nhận ra ý định của tôi."
2762 = "Cùng lúc với giọng nói đó, chiếc xẻng wansuko tự động tuột khỏi những ngón tay đã mất hết lực nắm."
2770 = "Nhanh hơn, xa hơn, hết mức có thể—— Để cách xa cái cây đổ ra thêm một chút nữa——"
2792 = "Vừa nói những lời vô lý, em ấy vừa bám lấy tôi đòi lấy chiếc xẻng wansuko."
2795 = "Nagi thực sự đang vô cùng kinh ngạc. Em ấy sững sờ, hồn bay phách lạc."
2796 = "Nagi liều mạng bám lấy cái cây, nhưng chiều dài của nó quá lớn. Dù có xê dịch được đôi chút, thì cũng không thể nào dọn sạch hoàn toàn được."
2799 = "Nagi vươn tay về phía Fukami. Như muốn đo thân nhiệt, em ấy áp sát tay vào cổ Fukami."
2800 = "Nagi đang ở rất gần. Đến mức hơi thở phả vào tay tôi, em ấy đang say sưa nhìn chằm chằm."
2804 = "Nagi cũng lập tức đuổi theo sau. Bồn tắm đang nổi sóng cuồn cuộn chẳng mấy chốc đã trở lại tĩnh lặng."
2810 = "Nếu để nhịp tim và nhịp thở rối loạn, tốc độ sẽ giảm đi tương ứng. Sẽ làm tăng nguy cơ xảy ra tai nạn mất——!!?"
2811 = "Việc phải dùng lực quá độ ở chân, eo, tay và cả lưng là điều chắc chắn. Nghe em ấy nói vậy, tôi cũng thấy có vẻ sẽ giúp ích cho việc tu hành kiếm thuật."
2821 = "Khuôn mặt đang giãn ra vì cười khổ bỗng trở nên căng thẳng."
2823 = "Lại trùng nữa rồi. Không ổn. Cứ thế này thì sẽ luẩn quẩn mất."
2829 = "Khi mở cánh cửa lật ra, từ đó, không khí trong lành sẽ tràn vào trong lò với thế mãnh liệt."
2830 = "Thở hồng hộc. Chắc hẳn đó là một đối thủ rất đáng gờm."
2835 = "Ây da, lại trùng thời điểm mất rồi. Chuyện của tôi thì để đến tối nói cũng chẳng sao——"
2838 = "Trong trạng thái bất ổn đó, cô ấy bị quá khứ trói buộc và hành hạ…… Nếu chỉ dùng một câu \"suy nghĩ quá nhiều\" để gạt bỏ điều đó, thì thật là thiếu sót."
2839 = "Một niềm vui hết sức giản đơn, cùng cảm giác thành tựu như lấp đầy cơ thể trống rỗng, trào dâng từ tận đáy lòng."
2843 = "Nếu xúc vào giống hệt như lúc tập luyện, thì ở \\x%l火床;#00ffc040;buồng lửa%l;#; của lò thực tế, luồng không khí sẽ giúp phân tán than ra đều khắp nơi."
2845 = "Ở phía đầu bên kia của bồn tắm rộng lớn, Fukami đang nhiệt tình xoa bóp cho Nagi."
2857 = "Những giọt mưa, lộp bộp, trút xuống khuôn mặt của tôi khi tôi đang ngã lăn ra."
2858 = "Toàn thân em ấy đỏ rực như con bạch tuộc luộc. Tốt nhất là nên đưa em ấy ra khỏi bồn tắm càng sớm càng tốt."
2861 = "Từ \"lúc bình thường\" cứ vướng bận trong tai, trong tâm trí tôi."
2862 = "Nói đến đó với vẻ mặt nghiêm túc, Hachiroku bỗng giật mình như nhận ra điều gì đó rồi cười khổ."
2865 = "Trước mặt Nagi là một cây cổ thụ khổng lồ. Và trên tay phải, là một thanh mộc kiếm bằng gỗ sồi."
2867 = "Giọng nói đầy tự hào. Hachiroku ưỡn ngực kiêu hãnh."
2869 = "Dáng vẻ em ấy lạ lắm. Lời nói nghe cứ như đang mê sảng vậy."
2871 = "Giọng nói đẫm nước mắt ngập tràn niềm vui sướng."
2873 = "Giọng nói mang đậm vẻ an tâm. Nếu vậy, lý do chắc chỉ có một."
2875 = "Mặt em ấy đỏ bừng, ánh mắt đảo liên tục. Hơi thở gấp gáp, dồn dập."
2876 = "Hachiroku khẽ gật đầu, rồi ngước nhìn thẳng vào tôi."
2878 = "Cô ấy giải thích cho Nagi một cách cực kỳ nghiêm túc, giống hệt như đã giải thích với tôi nhưng bằng những từ ngữ dễ hiểu hơn."
2880 = "Đáng sợ. Sợ quá sợ quá sợ quá sợ quá sợ quá sợ quá. \\x%l脱線転覆;#00ffc040;Trật bánh lật tàu%l;#;. Bốn chữ đó lấp đầy tâm trí và cơ thể tôi."
2885 = "Nhanh quá! Quả thực là một đòn đánh như xẹt lửa. Nếu không phải trong hoàn cảnh này, tôi đã không tiếc lời khen ngợi rồi!"
2888 = "Một cơn mưa nóng hổi. \\x%l蒸気排水;#00ffc040;Xả nước ngưng hơi nước%l;#;—— À, Hachiroku lại khóc rồi."
2890 = "Gần quá. Fukami từ lúc nào đã cùng Nagi xích lại gần phía chúng tôi."
2892 = "Hachiroku mà xen vào chỗ đó, thì khéo lại thành kỳ đà cản mũi mất."
2896 = "Nếu cứ vô tư ném than trong xẻng vào, chúng sẽ bị hút tụ lại phía trong \\x%l火床;#00ffc040;buồng lửa%l;#; nối với cửa xả——tức là ống khói."
2899 = "Tranh bình phong sao? Thật là tao nhã——ở một khía cạnh nào đó thì đúng là phong cách của Hachiroku thật, nhưng……"
2902 = "Giống như máy hút bụi, chỉ cần bật công tắc, là nó sẽ ngoan ngoãn bắt đầu hút."
2905 = "Da thịt như trống rỗng, và nước nóng đang thấm dần vào những khoảng không ấy."
2906 = "Cho dù thứ chờ đợi trước vòi hút, có là axit sunfuric đặc sẽ làm tan chảy cả cơ thể nó đi chăng nữa."
2914 = "Điều may mắn là, không có tiếng la mắng, cũng chẳng có tiếng la hét thảm thiết. Và mùi máu tươi đó, không hề thoảng qua dù chỉ một chút."
2920 = "Nhân sự, ngân sách. Không thể đòi hỏi thêm gánh nặng nào từ tình nguyện viên hay quyên góp nữa."
2921 = "Từ set 1 đến set 3, đây là lần đầu tiên tôi đạt điểm đỗ cho tất cả các set."
2922 = "Từ ô số hai sang ô số một, từ ô số bốn sang ô số năm, cô ấy xúc và chuyển khoảng nửa xẻng than, rồi đứng nhìn chằm chằm."
2932 = "Rõ ràng là đã nhìn thấy, đã cảm nhận được vấn đề, nhưng tất cả những người liên quan chúng tôi, lại nhắm mắt làm ngơ và trì hoãn nó."
2933 = "Bước đi. Cho đến điểm tiếp theo nơi độ dốc của đường ray thay đổi."
2935 = "Tôi ghi lại những con số cô ấy đọc vào sổ tay, rồi lại bế Hachiroku lên và tiếp tục bước đi."
2937 = "Tôi vội vàng cởi phăng chiếc áo sơ mi, cầm trên tay và bắt đầu chạy."
2939 = "Khi tôi giải thích về nhà tắm Tororyu-yu sau 23:00, hơi thở của Nagi dần trở nên gấp gáp, còn mặt Fukami thì ngày càng đỏ lựng."
2941 = "Tôi nhớ lại những lời thầy Akai đã nói. Tương lai, dù là con người hay đồ vật, dù là ai đi nữa cũng đều phải tự mình mò mẫm."
2943 = "Tôi hiểu rồi. Cái này thì đúng là phong cách của Hachiroku hơn nhiều."
2945 = "Một tiếng thở dài não nề buột ra khỏi miệng. Cơ thể tôi đã mệt mỏi đến nhường ấy."
2947 = "Điều mà tôi đã được dạy là tuyệt đối không bao giờ được làm. Một điều cấm kỵ mà từ khi sinh ra tôi chưa từng phá vỡ."
2948 = "Tôi nhẹ nhàng đặt cơ thể lái của Hachiroku xuống đường ray, má phải trên khuôn mặt nhỏ nhắn của cô ấy áp sát vào thanh ray."
2952 = "Tôi ghi lại những con số đúng như cô ấy nói vào sổ tay. Dựa trên những con số này, lát nữa Hachiroku sẽ vẽ bản đồ."
2956 = "Tôi nhấc cánh tay đang được xoa bóp lên, dùng tay luồn qua mái tóc ướt của Hachiroku như một chiếc lược."
2957 = "Bằng chính đôi tay này, tôi đã gạt phăng nó đi. Tát một bạt tai vào má Hachiroku, gọi cô ấy tỉnh lại."
2959 = "Tôi hiểu. Bởi vì tôi cũng giống như vậy."
2961 = "Vết thương của Hachiroku. Vết thương của chính tôi. Tôi thận trọng tìm kiếm từ ngữ, để không bóc lớp vảy của chúng ra."
2963 = "Tôi nắm lấy tay cô ấy đứng dậy, và tiến về phía Paulette."
2965 = "Đồ ngốc! Giờ thì tôi đã rất hiểu cảm giác của ông lão Minokasa mỗi khi gõ đầu Nagi rồi."
2967 = "Tôi dùng đầu ngón tay quệt mạnh một cái lên má mình. Khi đưa ngón tay đó ra cho hai người xem, họ liền buột miệng thốt lên \"Oa\" một cách tự nhiên."
2968 = "Tôi dang tay đón lấy cơ thể đang bay về phía mình, rồi cứ thế ngã lăn ra sang một bên!!!"
2970 = "Nhìn sang Hachiroku, cô ấy khẽ gật đầu. Nhưng mà, nhìn kiểu gì thì Nagi cũng đang mặc đồ thường ngày."
2973 = "Tôi nhìn Nagi đang ở khu vực tắm tráng. Trông em ấy còn nhỏ bé hơn cả lúc mặc quần áo, nhưng——"
2974 = "Giọng nói của Fukami vang lên ngay khi tôi vừa làm mẫu xong, khiến tâm trạng tôi trở nên vui vẻ."
2975 = "Tôi đứng dậy. Trước mắt đã không còn gì nữa."
2977 = "Cuối cùng——thân xe cũng hiện ra. Khuôn mặt tròn trịa không phân biệt trước sau của \\x%lキハ07;#00ffc040;KiHa 07%l;#; đang đỗ lại như thể bị kinh ngạc."
2981 = "Khi cõng lên lưng, Nagi nhẹ và nhỏ bé đến mức khiến tôi hụt hẫng."
2983 = "Do đó, dù chỉ bằng thanh mộc kiếm của Nagi, em ấy vẫn có thể liên tiếp tung ra những đòn đánh hiệu quả đủ để làm nghiêng cả thân cây khổng lồ."
2985 = "Vì vậy, những lời buột ra khỏi miệng tôi, chỉ là những gì tôi cảm nhận được ngay lúc này."
2988 = "Do đó, ở bãi tập không có hiện tượng nạp xả khí, mặt sàn được rải phía trước dày, phía trong mỏng sẽ là đạt chuẩn cao nhất."
2996 = "Những chấn động truyền từ chân, lên hông, rồi đến tận đầu khi tôi đang liều mạng chạy!"
3002 = "Nếu vậy thì cứ nghe theo lời Hachiroku,"
3004 = "Nếu ở một nơi không có mùi máu, thì nghỉ ngơi một chút cũng được nhỉ."
3005 = "Nếu những động tác ấy trông đẹp mắt ngay cả với người ngoài ngành, thì chắc hẳn kỹ năng xúc than của tôi cũng đã thành hình ở một mức độ nào đó rồi."
3007 = "Âm thanh của \\x%lタイフォン;#00ffc040;còi hơi%l;#;. Màng nhĩ, não bộ, ký ức bị rung lắc dữ dội. Một cơn buồn nôn mãnh liệt trào lên, trước mắt tôi tối sầm và nặng trĩu."
3010 = "Chẳng cần phải hỏi là chuyện gì. Hachiroku cũng đáp lại như một lẽ đương nhiên."
3013 = "Vị của sỏi đá. Trong khoảnh khắc, tôi tự hỏi liệu có phải là vị của \\x%lバラスト;#00ffc040;đá ba-lát%l;#;. Nhưng rồi tôi lập tức nhớ ra đây không phải lúc để nghĩ về điều đó."
3016 = "Là Fukami. Em ấy đang nở một nụ cười gượng gạo y như trong tranh vẽ."
3020 = "Huống hồ, một học sinh như Nagi, lại còn là con gái mà làm được như vậy, thì rốt cuộc có được bao nhiêu người cơ chứ."
3029 = "Thân cây cổ thụ khổng lồ ngày càng tiến gần mặt đất. Nagi, bay người tới."
3030 = "Kết quả là, chẩn đoán được đưa ra cho Hachiroku là, 『Tất cả các chức năng đều không có gì bất thường』."
3033 = "Vì thế, tôi gào lên! Chính vì thế, tôi vẫy chiếc áo sơ mi bằng tất cả sức lực!"
3034 = "Vừa đúng lúc."
3039 = "Còn nhanh hơn cả việc tôi định cho mượn điện thoại, Nagi đã rút ra một chiếc điện thoại di động kiểu dáng đơn giản."
3047 = "Fukami xua tay nguầy nguậy, còn Nagi thì vung tay chém dọc xuống như đang đánh vào mặt đối thủ."
3049 = "Em ấy giật nảy mình né tránh bàn tay tôi đưa ra, rồi tự mình trèo lên khu vực tắm tráng."
3051 = "Fukami dùng khăn tay lau cho Nagi, nhưng vết bẩn do bụi than chẳng sạch đi chút nào."
3052 = "Nagi gục xuống sàn, Fukami vội chạy đến đỡ lấy."
3055 = "Giọng nói dịu dàng, điệu bộ ôn hòa. Nhưng lại vang lên một cách kiên quyết."
3056 = "Muốn bằng cách nào đó rũ bỏ nó đi, tôi điên cuồng vẫy chiếc áo sơ mi!!"
3064 = "Và bây giờ, sự ồn ào đó đang dần đạt đến mức có thể gây cản trở cho cuộc trò chuyện."
3065 = "Thật ồn ào. Không gì có thể ầm ĩ hơn thế này nữa."
3069 = "Trong lúc đỡ Nagi và lau mặt cho em ấy, Fukami cũng bị dính khá nhiều vết bẩn."
3094 = "Sau khi xác nhận lại những gì tôi vừa đọc lại, Hachiroku đưa ánh mắt dịu dàng nhìn xuống đường ray."
3096 = "Lộ trình di chuyển không phải là vấn đề. Chỉ là, tôi——"
3099 = "Cơ thể Hachiroku giật thót rồi cứng đờ. Ánh mắt cô ấy dừng lại, nhìn chằm chằm vào khoảng không xa xăm trên đường ray."
3106 = "Bài tập đầu tiên cũng giống hệt tôi. Nghe thấy 100 ký, Fukami buột miệng kêu lên một tiếng \"Oái\"."
3114 = "Dốc hết sức lực cho đến khi gục ngã——nói bằng miệng thì dễ, nhưng những người thực sự làm được điều đó, hầu như không có mấy ai."
3117 = "Rốt cuộc thì, mọi thông tin bao gồm cả bản vẽ, suy cho cùng cũng chỉ là tài liệu hỗ trợ cho việc lái tàu mà thôi."
3124 = "Về cái cây lớn nằm gần đường ray. Về sự hao mòn đến mức \\x%lバラスト;#00ffc040;đá ba-lát%l;#; vỡ vụn."
3134 = "Tôi khá là, mệt rồi. Nhưng mà, chỉ điều này là tôi phải xác nhận."
3135 = "Nói tóm lại, thể chất của Nagi là một thứ gì đó vượt xa mức bình thường. Để khống chế được em ấy, tôi cần phải tiến lại gần thêm một chút nữa."
3139 = "Cái cây rung chuyển."
3140 = "Tay với chân, em không muốn làm cho to thêm nữa đâu—— Fukami lầm bầm nói nhỏ, rồi nhìn tôi bằng ánh mắt như van nài."
3145 = "Điểm mấu chốt là động tác lật cổ tay. Ngay khoảnh khắc thọc xẻng vào lò, phải lật cổ tay úp mạnh xuống, đập than vào đó."
3146 = "Để giảm bớt sự chật hẹp đó dù chỉ một chút, \\x%lレイルロオド;#00ffc040;Railord%l;#; ở chế độ lái mới có kích thước như búp bê."
3150 = "Ngay khoảnh khắc nghe thấy điều đó, toàn thân tôi rã rời như muốn đổ gục, nhưng tôi vẫn cố chạy thêm vài chục bước nữa để đến bên Hachiroku."
3151 = "Được cô ấy nói, tôi mới cảm nhận được nước mắt của chính mình. Đã mấy năm rồi——mấy chục năm rồi nhỉ."
3179 = "Nếu không chạm vào ký ức về vụ tai nạn, dường như tôi sẽ đánh mất cả những ký ức quan trọng. Bởi vì nếu đánh mất nó, tôi sẽ không còn lý do để sống nữa."
3190 = "Xin đính chính lại, không phải bạch tuộc luộc, mà là tôm luộc."
3195 = "Ngay khoảnh khắc tôi trả lời, Nagi giơ tay hình chữ V thật lớn."
3196 = "Dù tự mình nói ra điều đó, nhưng Hachiroku lập tức mím chặt môi lại."
3197 = "Nói dứt lời, Hachiroku rũ bỏ vẻ mặt của người chấm điểm, nở một nụ cười ấm áp như tia nắng."
3198 = "Vừa dứt lời, Nagi đã vung mộc kiếm lên cao!"
3226 = "Vượt qua cả mức độ \"ngâm nóng quá\", thế này phải gọi là…… \"bị luộc chín\" mất rồi."
3227 = "Tôi đã để ý từ nãy đến giờ rồi."
3230 = "Ba xẻng, hai xẻng—— Thay vì xúc than vào, tôi dồn toàn bộ sức lực để rút xẻng ra."
3233 = "Nếu vậy thì phải làm sao? Đơn giản thôi. Thiếu tiền thì đi vay. Và nhân lực thì có thể dùng tiền để đổi lấy."
3234 = "Vậy thì——dù mang thân phận đồ vật, nhưng lại bị chủ nhân vứt bỏ, Hachiroku chắc hẳn đã chìm trong giấc ngủ dài khi đánh mất đi tiêu chuẩn phán đoán."
3235 = "Bên trong nồi hơi, đáy lò——được mô phỏng thành \\x%l火床;#00ffc040;buồng lửa%l;#;, chia thành 5 hàng 5 cột, toàn bộ từ ô số 1 đến ô số 25."
3237 = "Ở cửa hàng đường sắt thì phát vé giảm giá xuôi dòng sông Kuma, còn ở bến thuyền thì phát vé giảm giá đi tàu đường sắt Ohimitera một ngày."
3243 = "Dù chỉ là bài tập \\x%l投炭;#00ffc040;xúc than%l;#; 400 xẻng đơn giản, nhưng khi kết thúc set thứ 3—— khối lượng lên tới 1.2 tấn, cả thể xác lẫn tinh thần đều bị bào mòn đến kiệt quệ."
3244 = "Một người nghiệp dư tình nguyện xin huấn luyện với nửa phần đùa giỡn, nhưng Hachiroku lại không hề tỏ ra khó chịu."
3246 = "Nếu em ấy đã muốn làm đến thế thì cho làm cũng chẳng sao, nhưng tôi không muốn em ấy làm bẩn quần áo rồi chuốc lấy sự phật ý của ông lão Minokasa."
3247 = "Sự cho phép của ông lão Minokasa và Fukami, chẳng liên quan gì đến nhau."
3248 = "Dù là một cái cây bề thế nhưng nó đã mục nát. Bên trong khô khốc và trống rỗng."
3249 = "Dù đơn giản, nhưng lại là một thử nghiệm có vẻ sẽ mang lại hiệu quả."
3250 = "Trong đầu thì hiểu rõ, nhưng khi sự mệt mỏi tích tụ, động tác kiểu gì cũng trở nên thiếu dứt khoát."
3251 = "Tôi chỉ tập trung ý thức vào một việc duy nhất, là phải điều khiển cái lưng và đôi tay đã mất cảm giác di chuyển thật chính xác trong khoảng thời gian đó."
3252 = "Để các em ấy đen nhẻm như vậy đi về thì chắc sẽ gây phiền phức lắm, nhưng tự ý đưa đi tắm thì có khi lại càng phiền phức hơn."
3258 = "Phải đạp \\x%lブレーキ;#00ffc040;phanh%l;#; ở đâu và với lực bao nhiêu. Chỉ cần độ chính xác đủ để xây dựng các thao tác cơ bản đó là không có vấn đề gì."
3264 = "Mọi thứ vẫn diễn ra theo đúng nhịp độ đã tính toán. Còn một phút nữa là đủ 27 xẻng——"
3269 = "Áp lực gió. Một thoáng, tiếng của ai đó. Âm thanh kim loại, tiếng \\x%lブレーキ;#00ffc040;phanh%l;#;. Dưới chân chao đảo, tôi ngã gục xuống đất."
