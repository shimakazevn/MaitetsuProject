2231 = "「Cháu là \\x%lレイルロオド;#00ffc040;Railord%l;#; của ngài Soutetsu. Xin hãy gọi cháu là Hachiroku.」"
2235 = "「Với cơ thể này thì—— việc leo từ \\x%l翼端;#00ffc040;đầu cánh%l;#; xuống mặt đất hơi khó khăn ạ.」"
2238 = "「Tình hình ở hội đồng thành phố, tiền bối của em thường hay kể cho em nghe.」"
2240 = "「Quả thực tôi cũng, không muốn bị lãng phí thời gian vào những việc không liên quan.」"
2241 = "「Ơ kìa, anh hai! Hachiroku phải sang bên này chứ.」"
2244 = "「Bây giờ tôi sẽ đi tắm. Bẩn thế này thì không vào nhà được.」"
2246 = "「Anh bị dính quá nhiều bụi than, có thể sẽ gây ảnh hưởng xấu đến một thiết bị tinh vi như Navi.」"
2248 = "「Che phía trước rồi đấy. Hibiki, yên tâm chà lưng cho tôi đi.」"
2251 = "「Vì vậy, ngay khi tỉnh dậy em đã tìm kiếm \\x%l8620;#00ffc040;8620%l;#;. Nhưng…… em lại——không thể cảm nhận được nó một chút nào.」"
2257 = "「Các \\x%l機関士;#00ffc040;người lái tàu%l;#; bị trưng dụng thời chiến rất sợ cô Kiyomi. Thế nên bồn tắm lúc nào cũng chỉ có hai chúng em độc chiếm thôi ạ.」"
2260 = "「Cứu giúp ai đó.」"
2262 = "「Vì vậy anh hai à. Lần này để em chà lưng cho anh nhé.」"
2265 = "「Kỹ thuật? Kỹ thuật gì vậy ạ?」"
2269 = "「À, xin lỗi. Tôi không có ý đó đâu.」"
2270 = "「Xin lỗi nhé. Tôi quên khuấy mất.」"
2273 = "「C-Cơ thể á!? C-Cách——xoa bóp——cơ thể á!?」"
2274 = "「Sao thế. Cứ vào nhanh đi là được mà. Rốt cuộc là có chuyện gì vậy?」"
2276 = "「Thế là vòng luẩn quẩn cứ thế tiếp diễn và ngày càng lớn hơn sao.」"
2278 = "「Quyết định vậy đi, giờ đi tắm thôi. Hibiki, nhờ em dẫn đường nhé.」"
2284 = "「Hibiki.」"
2286 = "「Có vẻ Hibiki biết chỗ nào đó. Cô thì sao? Có đi cùng không?」"
2287 = "「Hibiki có cảm thấy cần phải giải thích rằng \"màu đỏ là màu đỏ\" không?」"
2290 = "「Nếu Hibiki thấy vậy thì có lẽ là thế thật. Nhưng chuyện không bị quấy rầy là không thể nào.」"
2293 = "「Thật…… vậy sao ạ. Nếu được như thế thì em thực sự rất vui.」"
2295 = "「Ừ.」"
2296 = "「Hả.」"
2297 = "「Vậy ra, ngài thị trưởng đã khẳng định sao? Rằng cái…… loại 8620 đó? Là một thứ vô cùng tuyệt vời.」"
2300 = "「Vâng. Trước khi gặp ngài Soutetsu, em đã từng đồng hành rất lâu với một vị Master, và với người đó thì lúc nào cũng vậy ạ.」"
2301 = "「Vâng. Là phụ nữ ạ.」"
2303 = "「Vâng, chúc ngài ngủ ngon, ngài Soutetsu.」"
2304 = "「Vâng」"
2306 = "「Vâng, chuyện đó thì em biết. Em cũng đang theo học ở học viện Yunoi mà.」"
2308 = "「Vâng, dạo này cháu hơi bận rộn một chút, nên lâu rồi không đến thăm bà được.」"
2311 = "「Ừ.」"
2312 = "「Vậy sao?」"
2313 = "「Lẽ ra, em phải nắm được vị trí của \\x%l8620;#00ffc040;8620%l;#;. Dù có cách xa đến đâu, hay ở trong bất kỳ trạng thái nào đi chăng nữa.」"
2319 = "「Cái gì thế này, đứng lù lù trước cửa quán người ta mãi thế.」"
2322 = "「Quả nhiên là vậy. Tệ đến mức đó sao?」"
2328 = "「Ví dụ như, chỗ này——nhỉ? Ngài thấy sao ạ?」"
2334 = "「Nhưng, anh đã được ông Taito dạy bảo. Hãy cứu giúp người khác để bù đắp cho những người mình không thể cứu.」"
2335 = "「Không có gì to tát đâu. Tôi chỉ đang học cách xoa bóp cơ thể thôi.」"
2336 = "「Không có chuyện em không thích đâu ạ. Ở gần ngài Soutetsu—— Khoảng cách này là tốt nhất với em rồi ạ.」"
2337 = "「Đúng vậy.」"
2338 = "「Không sao. Cô ấy bảo sẽ chà lưng cho tôi mà.」"
2339 = "「Không sao, nhưng có chuyện gì à?」"
2347 = "「Paulette không chỉ là thị trưởng, mà còn là giám đốc của Đường sắt Ohimitera, kiêm luôn cả chức \\x%l運転士;#00ffc040;nhân viên cơ vụ%l;#;.」"
2349 = "「Ghế ngồi tắm?」"
2351 = "「Là phụ nữ sao. Người lái tàu tên Kiyomi ấy.」"
2353 = "「Nhà tắm công cộng cũng ghét vết bẩn than đá lắm đấy ạ?」"
2358 = "「Cô ấy bối rối sao.」"
2360 = "「Shochu à? Uống sau khi tắm xong thì nguy hiểm lắm đấy.」"
2364 = "「Dù vẫn chỉ là một kế hoạch mơ hồ thôi. Nhưng việc thúc đẩy du lịch cũng sẽ góp phần nâng cao ý thức bảo vệ môi trường.」"
2366 = "「Có thể——mạnh hơn chút nữa, được không?」"
2368 = "「Tất nhiên rồi ạ.」"
2371 = "「Bà chủ Tororyu-yu ơi, lâu rồi không gặp bà ạ.」"
2380 = "「Quả thực là vậy.」"
2384 = "「Đợi em chút! Em lau cho anh ngay đây.」"
2385 = "「À, ừ. Cũng hơi mệt một chút.」"
2386 = "「Màu đỏ là màu đỏ. Điều đó quá đỗi chân thực, đến mức không thể giải thích rõ ràng bằng lời. Và cũng không cảm thấy cần thiết phải làm thế.」"
2387 = "「Mệt rồi. Đi ngủ thôi.」"
2390 = "「Chắc là do…… chưa quen chăng? Bản thân em thì hoàn toàn không thấy xấu hổ chút nào.」"
2393 = "「Hơn nữa, cô biết không? Hibiki.」"
2395 = "「Hơn nữa còn là suối nước nóng tự nhiên đó nha! Là nhà tắm của Ohimitera, khu suối nước nóng nổi tiếng ở Kyushu mà lị.」"
2396 = "「Nghe nói đầu máy loại 8620 của Hachiroku, sẽ là điểm nhấn lớn để thu hút khách du lịch.」"
2397 = "「Nghe nói những tiếng la ó phản đối dữ dội lắm. Mỗi khi Thị trưởng Paulette bước lên bục phát biểu ở hội đồng thành phố.」"
2398 = "「V-Vâng, nghe nói vậy. Cô ấy trở nên ấp úng…… Thế là ý kiến của Thị trưởng Paulette chưa bao giờ được thông qua.」"
2402 = "「Anh cũng cảm thấy mặt mình dính khá nhiều bụi, nhưng không ngờ lại đen thui thế này. Thảo nào Navi không cho anh lên xe.」"
2403 = "「Chà, nói ở đây thì thà đi xem tận mắt còn nhanh hơn nhỉ. Nó ở đâu vậy anh?」"
2407 = "「Ngộ nhỡ bụi than lọt vào rượu shochu, thì hậu quả sẽ không thể cứu vãn được.」"
2410 = "「Nếu cô không thích ngủ ở đây thì」"
2412 = "「Nếu Paulette cũng có tâm hồn hội họa như Hibiki, thì có lẽ điều đó sẽ lập tức truyền đạt được đến mọi người.」"
2414 = "「Nếu vậy thì—— Thị trưởng Paulette có chút đáng thương nhỉ.」"
2415 = "「Nếu tận mắt chứng kiến sức hấp dẫn, người ta sẽ muốn tìm hiểu về nó. Sự chuyển biến tâm lý đó có lẽ là một trong những nhu cầu căn bản của con người.」"
2416 = "「Nếu cứ mãi xấu hổ. ——Em sẽ thua mất.」"
2419 = "「Vâng ạ. Cảm ơn ngài rất nhiều, ngài Soutetsu.」"
2422 = "「Bắt anh hai làm \\x%l機関士;#00ffc040;người lái tàu%l;#; á!? Sao có thể! Thời gian anh ở nhà sẽ ít đi mất——à không phải!」"
2432 = "「Bẩn thì bẩn thật, nhưng nếu là dính đầy bụi phấn thế này thì…… Đúng là anh khó mà vào nhà với bộ dạng này được.」"
2445 = "「Ồ, bé Hibiki đấy à. Lâu lắm rồi mới thấy cháu nhỉ.」"
2446 = "「Đó là do căn phòng này đã được dọn dẹp, còn phòng bên cạnh thì chưa thôi ạ.」"
2447 = "「Đây là giới hạn rồi! Lại gần nữa em sẽ xấu hổ chết mất, em không dám nhìn anh hai nữa đâu.」"
2448 = "「Ra vậy.」"
2449 = "「Vậy ạ? Thế thì——」"
2450 = "「Chuyện nào ra chuyện đó chứ.」"
2451 = "「Chuyến \\x%l列車;#00ffc040;tàu%l;#; này…… đang đi về đâu vậy nhỉ.」"
2453 = "「Căn phòng này được dọn dẹp gọn gàng quá nhỉ.」"
2454 = "「Thật may vì người đó là ngài Soutetsu.」"
2458 = "「Vậy thì, hôm nay chúng cháu cũng sẽ đến sau 23 giờ.」"
2460 = "「Nếu vậy thì cô cứ gọi tôi là Hibiki đi. Tôi là em gái, cũng giống như vật sở hữu của anh hai thôi.」"
2461 = "「Dạ…… còn cháu thì sao ạ?」"
2462 = "「Dạ…… ngài Soutetsu?」"
2463 = "「Cái con——ưm, chiếc \\x%lエアクラ;#00ffc040;Aircra%l;#; đó cũng ích kỷ phết nhỉ. Rõ ràng mạnh miệng bảo vệ mạng sống của anh cơ mà.」"
2468 = "「Vậy thì, chà mạnh tay chút nhé.」"
2470 = "「Vậy thì đi tìm thôi.」"
2472 = "「Nếu vậy thì sau khi tắm xong ngài nên xoa bóp cơ thể ạ. Sáng hôm sau cảm giác mệt mỏi sẽ tan biến hoàn toàn khác biệt đấy ạ.」"
2474 = "「Vì em mà ngài Soutetsu đã phải lấm lem than đá. Việc tẩy sạch những vết bẩn đó là nghĩa vụ hiển nhiên của em ạ.」"
2475 = "「Hai người cứ gọi trống không với nhau đi. Có vẻ như hai người cũng có điểm giống nhau đấy.」"
2477 = "「Bao trọn gói rồi mà. Bé Hibiki muốn vào bên nào cũng được hết.」"
2482 = "「Thợ đốt lò và \\x%lレイルロオド;#00ffc040;Railord%l;#; thì vào phòng tắm nữ. Chứ để làm bẩn cái phòng tắm nam rộng thênh thang thì ta chịu không thấu đâu.」"
2494 = "「Anh hai——Anh trai, anh quen biết thị trưởng từ lúc nào vậy?」"
2495 = "「Anh hai, anh hai!」"
2496 = "「Anh hai! Màu đỏ là màu đỏ đó nha!」"
2498 = "「Anh cũng có cảm giác như đã quen biết từ trước—— Nhưng thực tế thì, có vẻ như vừa nãy mới là lần đầu gặp mặt.」"
2499 = "「Ngài Soutetsu. Ngài mệt lắm ạ?」"
2500 = "「Quả không hổ danh. Ngài thật tinh ý, ngài Soutetsu.」"
2501 = "「Ngài Soutetsu. Em đã quay lại. Xin lỗi vì hơi chậm trễ.」"
2502 = "「Ngài Soutetsu? Cho em mượn tấm lưng ạ.」"
2510 = "「!」"
2511 = "「!!?」"
2513 = "「Loại 8620……sao ạ? Đó là một đầu máy xe lửa hấp dẫn đến thế cơ ạ?」"
2668 = "Nếu bỏ cuộc, tôi sẽ giết chết Michiko. Không phải do tai nạn, mà là do chính ý chí của tôi."
2669 = "Sau 100 xẻng, là 400 xẻng nữa. Tức là tổng cộng 500kg. Nếu đong bằng chai một thăng (1.8 lít), thì khoảng hơn 277 chai."
2672 = "Rất bất mãn. Cực kỳ bất mãn. Cái tính không giỏi bộc lộ sự bất mãn ra ngoài, có vẻ cũng không hề thay đổi."
2674 = "Một giọng nói điệu đà. Cùng với tiếng bước chân lạch cạch chạy xuống cầu thang nhẹ nhàng."
2676 = "Thật tuyệt vời. Chắc chắn là trước chiến tranh——thậm chí không phải thời \\x%l大詔;#00ffc040;Taisho%l;#; mà có khi là kiến trúc thời \\x%l明智;#00ffc040;Meiji%l;#; cũng nên."
2679 = "Không biết Hachiroku đã nói gì. Nhưng Hibiki gật đầu thật mạnh."
2682 = "Ngoảnh lại nhìn, không biết có phải vừa chạy không, nhưng hai má Hachiroku ửng đỏ, trên da còn lấm tấm mồ hôi."
2683 = "Có truyền đạt được hay không. Michiko không nói cho tôi biết điều đó."
2687 = "Nhưng, đúng là trong cái rủi có cái may. Hibiki đã nói ra những lời thật lòng."
2688 = "Nhưng vẫn còn việc phải làm. Trước tiên là phải trải nệm ra đã."
2694 = "Bởi vì chuyến hành trình cuối cùng trên chuyến \\x%l列車;#00ffc040;tàu%l;#; này—— tôi đã đi cùng Michiko, bố và mẹ mà."
2696 = "Nói cách khác, đó chính là một nguyên nhân khiến đánh giá của công chúng về Thị trưởng Paulette lại thấp như vậy."
2702 = "Khó ai có thể muốn giao phó tương lai của thành phố cho một người lãnh đạo dễ dàng dao động chỉ vì vài tiếng la ó."
2704 = "Việc không biết gì cả khiến tôi rất bất an."
2705 = "Cách em ấy giới thiệu tôi là anh trai một cách trôi chảy, khác hẳn với một Hibiki nhút nhát chỉ biết cắm cúi vẽ tranh ngày xưa."
2709 = "Thay vì cứ đóng băng và mục nát trong sự hối hận, thì làm như vậy sẽ tốt hơn nhiều."
2714 = "Thành thật mà nói, tôi nghi ngờ liệu cô ấy có thể giữ được sự mạnh mẽ đó với tư cách là Thị trưởng, giống như khi làm Giám đốc công ty đường sắt hay \\x%l運転士;#00ffc040;người lái tàu%l;#; hay không."
2716 = "Nhưng không còn nhìn thấy gì nữa. Rồi sau đó——tiếng nói cũng biến mất."
2719 = "Nhưng tôi có thể cảm nhận được quyết tâm mạnh mẽ tràn ngập, qua từng lời nói và thái độ của em ấy."
2721 = "Nhưng——nếu dù vậy mà vẫn không khôi phục lại được, thì có lẽ Hachiroku thực sự là một sản phẩm lỗi rồi."
2722 = "Nhưng bàn tay ấy không thể chạm tới. Bởi vì tôi——sẽ tỉnh giấc."
2725 = "Giả sử tìm thấy \\x%l8620;#00ffc040;8620%l;#; an toàn, thì Hachiroku sẽ mong muốn điều gì tiếp theo?"
2740 = "Cho dù chúng tôi có thuộc hai phe tán thành và phản đối đi chăng nữa, nhưng Hibiki vẫn là em gái nuôi của tôi."
2745 = "Trên bảng hiệu trước cửa có ghi. Giờ đóng cửa là…… ra vậy, 23 giờ sao."
2746 = "Hai giọng nói vang lên cùng lúc."
2748 = "Hachiroku ngước nhìn tôi với vẻ bối rối."
2752 = "Chắc là cô ấy vừa ấn vào cái gọi là huyệt đạo trên lưng tôi. Ngay khi vừa bị ấn, cơ thể tôi đã tự động giật nảy lên."
2753 = "Hachiroku mỉm cười tao nhã, cố gắng xoa dịu sự căng thẳng của Hibiki."
2754 = "Hồi Hachiroku còn hoạt động, chẳng phải là thời kỳ mà \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; chạy nhan nhản khắp nơi sao."
2760 = "Cô ấy nheo mắt lại đầy hoài niệm, rồi ufufu mỉm cười hạnh phúc."
2762 = "Ngước lên. Hachiroku đang nhìn tôi."
2763 = "Cô ấy gọi trống không rồi. Đúng như những gì Hibiki vừa yêu cầu ban nãy, Hachiroku đã làm vậy."
2765 = "Giọng nói của Hachiroku vang lên như cố tình để cho tôi nghe thấy."
2767 = "Hachiroku men theo thành bồn tắm, chậm rãi tiến về phía này."
2769 = "Cái cúi đầu thật sâu của Hachiroku, đã đủ để khẳng định cho câu hỏi của tôi."
2771 = "Đôi bàn tay nhỏ bé của Hachiroku tỉ mẩn vuốt lại ga trải giường."
2772 = "Đương nhiên, Hachiroku cũng ở khoảng cách đó. Tôi hơi cao giọng lên một chút."
2780 = "Đáng lẽ ra tôi phải biết."
2786 = "Ra là vậy——Tôi đã bỏ lỡ mất. Màu đỏ…… lại đỏ đến mức này sao――――"
2787 = "Ra vậy, là như thế sao."
2806 = "Nếu có duyên và nằm trong khả năng của mình, tôi sẽ không tiếc sức lực."
2809 = "Có lẽ do vẽ tranh quá nhiều nên em ấy hơi bị cận thị, hơn nữa lại còn bị hơi nước che khuất——chắc hẳn em ấy không nhìn rõ tình hình bên này."
2828 = "À, không, ra là vậy. Nhắc mới nhớ—— Hachiroku từng nói bản thân mình là một thiếu nữ nhỉ."
2829 = "Sắc hoàng hôn, đơn điệu—— Một khung cảnh vô cùng cô đơn."
2830 = "Thở dài, cười khổ."
2832 = "Bởi vì em gái tôi, Michiko đang ở đó."
2835 = "Khoảng cách gần đến mức mũi chạm mũi—— Rồi Hibiki giật mình lùi lại thật xa."
2837 = "Để không kéo tôi theo vào khoảnh khắc cái chết ập đến—— Michiko đã cắt đứt mối liên kết với tôi."
2839 = "Ngay cả trong khoảng thời gian sống không bằng chết đó, tôi vẫn trải qua mỗi ngày."
2845 = "Có vẻ Hibiki cũng nhớ ra. Cái ngày em ấy đã dạy cho tôi biết rằng màu đỏ là màu đỏ——"
2847 = "Trái lại, em ấy còn nở một nụ cười rạng rỡ, như thể vừa thở phào nhẹ nhõm."
2849 = "Michiko gọi tên tôi. Michiko vươn tay về phía tôi."
2851 = "Vẫn là dáng vẻ nhỏ bé không hề thay đổi so với lúc xảy ra tai nạn. Nhưng lại không hề nở một nụ cười nào."
2853 = "Cũng giống như tòa nhà này, bà ấy toát lên một vẻ già nua và từng trải đáng kinh ngạc. Hibiki gọi là \"bác\", nhưng nhìn thế nào cũng thấy là một \"bà lão\"."
2855 = "Cô ấy đang ngồi trên hai đùi duỗi thẳng của Hibiki như một chiếc ghế, và ngâm mình hoàn toàn trong bồn tắm."
2857 = "Nói 'Chuyện nào', em ấy chắp hai tay đưa sang phải. Nói 'ra chuyện đó', em ấy chắp hai tay đưa sang trái."
2859 = "Cô ấy đã nhanh chóng xua tan bầu không khí sắp trở nên gượng gạo. Chỗ này cứ ngoan ngoãn nương theo cô ấy vậy."
2860 = "Là bởi vì thế đó, em ấy nói."
2863 = "Hibiki vẫn không thay đổi, việc được khen ngợi——không, ngay cả việc bản thân nhận được đánh giá xứng đáng, em ấy cũng có vẻ không quen."
2865 = "Nếu sự căng thẳng là do thể chất, và dù có gồng mình cũng không thể bù đắp được, thì một sự cản trở cực kỳ đơn giản như tiếng la ó cũng sẽ mang lại hiệu quả lớn."
2871 = "Đúng rồi nhỉ. Tôi đã nghe em ấy nói là vì anh em đang tuổi mới lớn nên mới thấy xấu hổ."
2872 = "Nếu rơi vào tay những nghị viên lão làng xảo quyệt, thì sự nhiệt huyết một lòng một dạ của Paulette lại càng dễ bị lợi dụng."
2874 = "Giọng của Hachiroku vang lên như thể vừa thay chỗ cho Hibiki."
2876 = "Dù có tiếc thì, tôi cũng chẳng có việc gì khác muốn làm."
2878 = "Ngay cả trong những cử chỉ nhỏ nhặt như vậy, Hibiki vẫn luôn nghiêm túc và hết mình."
2888 = "Mở mắt ra, tôi nhận ra mình đang ở trong một giấc mơ."
2893 = "Là anh em sinh đôi, nhưng giờ đây tôi không còn cảm nhận được gì từ Michiko nữa."
2901 = "Chẳng còn gì để nói thêm nữa."
2908 = "Không có gì phải giấu giếm, tôi đem toàn bộ kế hoạch thúc đẩy du lịch bằng \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; kể lại cho em ấy."
2913 = "Sao lại—— Ngay khi vừa thắc mắc, tôi đã tìm ra câu trả lời."
2914 = "Tôi hoàn toàn không có ký ức gì về việc sở hữu Hibiki cả…… Nhưng nếu đó là mong muốn của Hibiki, thì đương nhiên tôi sẽ chiều theo."
2917 = "Bởi vì tôi đã trực tiếp cảm nhận được tình yêu đường sắt đó của Paulette."
2922 = "Tôi vào phòng tắm nam. Chia hai ngả."
2923 = "Vừa dứt lời, Hachiroku liền ngồi dậy và khẽ lắc đầu."
2924 = "Ngay khi tôi vừa dứt lời, Hibiki khẽ nuốt nước bọt."
2925 = "Ngay khoảnh khắc tôi đứng dậy, Hibiki lấy hai tay ôm mặt rồi lặn ngụp xuống bồn tắm."
2927 = "Hồi trước với Michiko, dù là đi tắm hay làm gì, chúng tôi cũng luôn ở cạnh nhau đúng chuẩn sinh đôi, nhưng……"
2929 = "Tôi và Michiko cũng vậy. Chúng tôi đã chia sẻ mọi thứ——thực sự là mọi thứ với nhau."
2930 = "Tôi cảm thấy mình có thể hiểu được."
2932 = "Để tránh nhắc đến chuyện là anh em nuôi, tôi chọn lọc từ ngữ và chậm rãi nói."
2934 = "Sau khi dội nước, được Hachiroku chà rửa cẩn thận, và tự mình kỳ cọ kỹ lưỡng."
2936 = "Tôi chỉ tay lên trên đầu. Nếp nhăn trên trán Hibiki càng hằn sâu hơn."
2938 = "Tôi hơi ngạc nhiên. Em ấy trông trưởng thành hơn hẳn lúc nói chuyện với tôi."
2940 = "Bắp tay tôi được kéo giãn ra và xoa bóp."
2942 = "Tôi có thể đáp ứng mong muốn của Hachiroku đến mức nào. Tôi cố gắng suy nghĩ——nhưng cả đầu óc lẫn cơ thể đều nặng trĩu."
2943 = "Nghe tôi nói vậy, vẻ mặt của Hibiki trở nên rất kỳ lạ. Có vẻ đánh giá của em ấy về ông Taito khác với tôi."
2946 = "Tôi che phía trước lại rồi đứng lên. Khi bước ra khỏi bồn tắm, phía sau vang lên tiếng nước đổ ào ào."
2948 = "Cơ hội mãi mới đến này, tôi không ngốc đến mức để vuột mất."
2951 = "Tôi vừa dùng cử chỉ tay, vừa giải thích về việc \\x%l投炭;#00ffc040;xúc than%l;#;."
2953 = "Tôi ngồi xổm xuống, để tầm mắt ngang với Hibiki."
2955 = "Khi tôi chui vào trong chăn, ở một góc xa, Hachiroku cũng thu mình chui vào với vẻ vô cùng e dè."
2957 = "Không biết cô ấy dự đoán được việc tôi sẽ đi đến nhà tắm công cộng, hay là đã nghe thấy——à, đúng rồi."
2958 = "Hoặc có lẽ đây là nơi mà em ấy cực kỳ yêu thích."
2964 = "Thời chiến——tức là trong cuộc \\x%l大戦;#00ffc040;Đại chiến%l;#; sao. Hachiroku thực sự biết về cuộc chiến tranh đó ư."
2968 = "Nên tôi biết. Chỉ cần còn sống, bình minh sẽ đến."
2970 = "Vì vậy tôi không vội vàng, mà lẳng lặng chờ đợi và lắng nghe những lời Hachiroku sắp nói."
2972 = "Nếu vậy thì tôi nhất định phải đưa Michiko, đến nơi bình yên có bố và mẹ."
2979 = "Rồi cô ấy ghé chiếc miệng nhỏ nhắn của mình, lại gần tai Hibiki."
2980 = "Rồi cả hai cùng lảng mắt đi với vẻ hơi ngượng ngùng, sau đó phì cười."
2981 = "Sau đó Hibiki chậm rãi, cất lời với giọng điệu như đang giảng giải."
2982 = "Sau đó, em ấy lặng lẽ, chậm rãi, từng lời từng lời cất lên."
2984 = "Nếu điểm đó đã rõ ràng, thì tiếp theo sẽ sửa chữa Hachiroku. Chỉ cần thực hiện đúng các bước, mọi chuyện chắc chắn sẽ được giải quyết."
2985 = "Bình thường thì chỉ cần nói một câu 'Con về rồi', là có thể cứ thế đi thẳng vào nhà, nhưng——"
2990 = "Nếu đã được nhận diện như vậy, thì tôi càng phải cẩn trọng trong từng hành động và cử chỉ hơn bình thường."
3019 = "Vừa nói lớn, Hibiki vừa rẽ nước đi về phía chúng tôi."
3021 = "Khuôn mặt Hibiki liên tục gật gù, dần dần ửng đỏ lên như một hòn than đang được nung nóng."
3022 = "Thua ai. Thua vì cái gì. Hibiki không nói rõ. Nên tôi cũng không hiểu được."
3023 = "Em ấy lại đỏ mặt và cúi gầm xuống. Dù Hibiki không trực tiếp được khen ngợi——"
3025 = "Không biết có nghe thấy lời Hachiroku không, nhưng Hibiki gật đầu trong khi vẫn nhắm chặt mắt dưới nước."
3026 = "Hibiki và chị Mayami đều ở phòng riêng. Ở đây chỉ có tôi và Hachiroku."
3028 = "Lạch cạch, Hibiki chạy ùa vào nhà và phóng lên lầu."
3031 = "Có vẻ Hibiki đang ở trên tầng hai."
3032 = "Hibiki khẽ nuốt nước bọt."
3034 = "Hibiki cắt ngang câu chuyện như muốn lấp liếm, rồi chui qua tấm rèm cửa phòng tắm nữ."
3038 = "Hibiki đang ngâm mình ở một góc xa tôi."
3040 = "Hibiki rất nhạy bén. Em ấy khẽ nín thở, chắc hẳn là đã nhận ra rồi."
3042 = "Hai má Hibiki phồng lên. Nước mắt cũng bắt đầu ứa ra."
3044 = "Hibiki ngơ ngác nghiêng đầu."
3046 = "Ra là vậy. Với vẻ mặt đã hiểu, Hibiki gật đầu thật sâu."
3051 = "Từ đầu bên kia của bồn tắm rộng lớn, Hibiki hét toáng lên."
3052 = "Trong giọng điệu như thể cạn lời của Hibiki, nhưng lại pha lẫn chút gì đó dịu dàng."
3053 = "Giọng Hibiki có chút bối rối."
3055 = "Đôi má Hibiki ửng đỏ."
3057 = "Hibiki nhíu mày khó chịu. Hai má em ấy phồng lên."
3059 = "Hibiki lập tức gật đầu."
3060 = "Em ấy im lặng với đôi má ửng đỏ."
3062 = "Em ấy vội vã ngậm miệng lại và ngó nghiêng xung quanh. Sau đó vỗ tay bộp một cái, Hibiki làm ra vẻ mặt tự mãn."
3065 = "Hibiki dang rộng hai tay. Kéo theo một tờ giấy vẽ mở ra."
3066 = "Nhìn theo hướng mắt của tôi, Hibiki cũng phát hiện ra Navi. Navi lượn một vòng nhỏ, rồi bay vút đi khỏi bầu trời xưởng rượu."
3067 = "Hibiki gật đầu cái rụp. Theo cái gật đầu đó, Hachiroku nhẹ nhàng tiếp lời."
3070 = "Gật đầu. Sau đó Hibiki lại nghiêng đầu."
3072 = "Là Hachiroku."
3078 = "Đang phân vân không biết phải làm sao, thì bà chủ Tororyu-yu đưa tay chỉ về phía phòng tắm nữ."
3084 = "Tùm một tiếng nước vang lên. Hibiki có vẻ vừa rướn người tới."
3085 = "Nước gợn sóng lép bép."
3092 = "Ngay cả với một người mới gặp chưa lâu như tôi, Paulette cũng thường xuyên có những hành động và lời nói khiến tôi nghĩ cô ấy \"mắc chứng sợ đám đông\"."
3093 = "Một hình ảnh tràn đầy ý thức nghề nghiệp—— nhưng ở một góc độ nào đó, lại là một Paulette đang căng như dây đàn."
3094 = "Sau khi tắm rửa sạch sẽ, trở về nhà và ăn xong bữa tối, cơn buồn ngủ ập đến dữ dội."
3102 = "Yunoi là ga cuối của tuyến Yunoi thuộc Đường sắt Ohimitera. Ngoài học viện ra, ở đó còn có cơ sở y tế suối nước nóng."
3103 = "Tuyến Yunoi đi qua khu vực mỏ than cũ Jutsusen, nơi \\x%lエアクラ;#00ffc040;Aircra%l;#; không thể hoạt động, và chủ yếu vận chuyển hành khách qua lại giữa Ohimitera và Yunoi."
3105 = "Để không làm điều đó, tôi sẽ sống. Sống để nhất định đưa Michiko đến một nơi bình yên."
3107 = "Thế nhưng Hachiroku lại mở to hai mắt, khuôn mặt sững sờ như thể vừa bị sét đánh trúng."
3112 = "Bố và mẹ không có trên tàu. Michiko vẫn luôn đi trên chuyến \\x%l列車;#00ffc040;tàu%l;#; này một mình."
3115 = "Chuyện này lan truyền đến tận tai tôi ở Đế đô. Phe ủng hộ thu hút đầu tư chắc hẳn đã chiếm đa số trong hội đồng."
3118 = "Phòng tắm nam, và phòng tắm nữ. Tôi, Hibiki và Hachiroku."
3122 = "Đỏ. Là màu đỏ."
3126 = "Tororyu-yu——vậy có nghĩa là, bà lão này là chủ nhân của nhà tắm Tororyu-yu sao."
3128 = "Không thèm xưng tên lại. Bà chủ Tororyu-yu chỉ phẩy tay nhẹ như thể đã hiểu."
3146 = "Giống như đã quay lại, nhưng lại tiến thêm một bậc cầu thang xoắn ốc—— Chắc chắn phải có điều gì đó đã được tích lũy thêm."
3151 = "Một học sinh thích đến dự thính ở hội đồng thành phố sao—— Tiền bối của Hibiki có vẻ là một người khá hiếm thấy."
3153 = "Chết thật. Tôi lỡ buột miệng nói ra suy nghĩ của mình mất rồi."
3154 = "Màu đỏ là màu đỏ."
3167 = "Nhưng Hachiroku lại cười khúc khích: \"À, ra là vậy.\""
3169 = "Chỉ nghe thấy tiếng nói."
3173 = "Chẳng hiểu gì cả."
3174 = "Nghe tôi nói vậy, Hibiki nhíu mày vẻ bất mãn."
3178 = "Bất chợt có giọng nói vang lên từ phía sau, nhưng Hibiki không hề nao núng."
3179 = "Dù vẫn còn vài hạt bụi đen lấm tấm nổi lên, nhưng khi ngâm mình trong bồn tắm, mọi mệt mỏi dường như đều tan biến và trôi đi mất."
3182 = "Tấm lưng——lưng sao. Tôi chìa lưng về phía Hachiroku theo yêu cầu."
3184 = "Bởi vì, chính ông Taito, đã mang Hachiroku đến đây."
3196 = "Cuối cùng cũng đưa câu chuyện quay về điểm xuất phát. Không, có lẽ không phải là quay về điểm xuất phát."
3197 = "Vậy phải làm sao. Làm thế nào để Paulette có thể đưa ra chủ trương của mình mà không bị quấy rầy."
3198 = "Thành thật mà nói, Hachiroku quá nhỏ bé, làm tốn quá nhiều thời gian, dù có dùng khăn chà xát lên lưng cũng không mang lại cảm giác sảng khoái cho lắm."
3207 = "Dù rằng người đã khiến tôi nhận ra \"điều đó\", lại chính là Hibiki."
3225 = "Cảnh vật ngoài cửa sổ không hề thay đổi. Dù có trôi qua thì ngay lập tức, cảnh vật tương tự lại hiện ra."
3233 = "Kế hoạch này có một yếu tố bất ổn lớn. Không biết là do suy nghĩ hay trực giác, nhưng có vẻ Hibiki đã nhận ra điều đó."
3234 = "Chuyện đó là quá đỗi hiển nhiên. Nên tôi có hơi bối rối không biết phải trả lời thế nào."
3235 = "Nghĩ vậy thì con số đó cũng không lớn lắm, nhưng có vẻ do tư thế của tôi không đúng, nên lưng hơi bị quá sức."
3236 = "Dù là nơi tràn ngập nước nóng, nhưng mọi thứ lại mang một vẻ hoài cổ mộc mạc."
3237 = "Một bí ẩn rõ ràng đến mức này thì tôi cũng có thể giải được."
3238 = "Chắc chắn khi cứu giúp ai đó, bản thân mình cũng sẽ được cứu rỗi."
3240 = "\"Không phải vì tôi sợ làm bẩn ghế đâu. Tuyệt đối không phải.\""
3243 = "Chỉ cần nhắm mắt lại và chìm vào giấc ngủ—— thế là đủ rồi."
3247 = "Navi đã nói vậy, và thay vì chở tôi, cô ấy đã luôn theo sát tôi từ trên cao."
3254 = "Chỉ còn cách đó thôi. Chuyện đã quá rõ ràng rồi."
3265 = "（Cọc cạch, cọc cạch, xình xịch, xình xịch——）"
3267 = "（Xoè!）"
3268 = "（Ào!）"
3269 = "（Ùm!）"
3271 = "（Ở hội trường thì Reina cũng chẳng thể giúp gì được.）"
3275 = "Navi xoay hai vòng trên không rồi vụt một cái tăng độ cao và biến mất khỏi tầm nhìn."

[selections]
