1680 = "「……Từ trước đến nay, hoàn toàn không có mà nhỉ. Cơ hội được đứng cùng anh trai trên sân khấu rực rỡ.」"
1683 = "「……Là phương tiện đi lại thường ngày thì không thể thắng nổi Aircra đâu. Trừ phi có hoàn cảnh đặc biệt như tuyến Yui.」"
1685 = "「……Anh Soutetsu.」"
2092 = "「Mọi thứ đều suôn sẻ, đang tiến hành theo đúng kế hoạch. Anh Soutetsu cũng hãy chuẩn bị với tinh thần là sẽ xuất phát đúng giờ nhé.」"
2095 = "「Hiếm khi có dịp kỷ niệm chuyến tàu số 1 chạy! Anh muốn hai người vào chụp chung.」"
2096 = "「Đi cẩn thận nhé. Chúc em có một chuyến đi vui vẻ.」"
2098 = "「Cậu vất vả rồi. \\x%l機関士;#00ffc040;Lái tàu%l;#; Migita. Cậu lái tuyệt vời lắm.」"
2102 = "「Không chỉ vậy, nhờ có Remu mà hệ thống sưởi và làm mát cũng hoạt động được. Ba toa hành khách, chín phòng khách, mỗi phòng đều có thể điều hòa không khí riêng biệt.」"
2104 = "「Xin lỗi nhưng chuyện của Kisaki để sau đi. Chuyện của anh là chuyện muốn hỏi ý kiến của tất cả mọi người.」"
2106 = "「Không phải thế đâu Sou-chan! Không phải kiểu thích như vậy.」"
2108 = "「Không phải đâu! Không phải ý đó mà!」"
2110 = "「Có rất nhiều người nước ngoài đến tham quan và đi tàu. Đúng là nhờ hiệu ứng từ giải Grand Prix của 『Ngôi sao thứ chín』 nhỉ.」"
2113 = "「Chính xác, đây mới là—— đội hình kỷ niệm xứng đáng nhất với chuyến tàu Nine Stars số 1.」"
2114 = "「Nhưng mà, cũng hết cách thôi nhỉ. Michi, đã chết mất rồi mà.」"
2115 = "「Không, cũng không đến mức đó đâu ạ?」"
2118 = "「Không đâu ạ? Vẫn chưa đâu ngài Soutetsu.」"
2123 = "「Đoạn đường phía trước, nhờ cả vào anh.」"
2127 = "「Nine Stars là niềm ao ước, là sự phi thường. Nhưng, để đường sắt thực sự phục hưng, nó cần phải trở thành phương tiện đi lại thường ngày.」"
2129 = "「Nine Stars vừa là hội chợ vật sản di động, vừa là nhà hàng di động mà nhỉ. Tủ lạnh, tủ đông quan trọng lắm đó.」"
2132 = "「Nói xấu tính là nói dối thôi nha? Michi biết rõ lắm đó.」"
2134 = "「Không chỉ vậy, chắc cũng có nhiều người biết đến Nine Stars qua trái phiếu Hinomoto hay trái phiếu \\x%lレイルロオド;#00ffc040;Railord%l;#; nữa——」"
2138 = "「Anh cũng nói cảm ơn với mọi người giúp em nha? Cảm ơn vì đã giúp đỡ Sou-chan.」"
2140 = "「Đúng vậy nhỉ. Nếu anh ngốc, thì Michiko cũng sẽ ngốc theo mất.」"
2141 = "「Để tạo ra sự thong dong tận hưởng chuyến đi, Hayase Fukami sẽ cố gắng làm nhiệm vụ với nụ cười trên môi!」"
2142 = "「Không phải bạn em. Là con gái của bạn cũ bố em.」"
2144 = "「Đừng làm gì hết nha. Cứ thế~, cứ thế~ chầm chậm thôi~, chầm chậm thôi~」"
2147 = "「Ngài sẽ đổ mồ hôi đấy, mặc dù hiếm khi có một ngày nắng đẹp thế này.」"
2149 = "「Bức ảnh lưu niệm của khoảnh khắc ngày hôm nay, chỉ có thể chụp được vào khoảnh khắc ngày hôm nay mà thôi!」"
2155 = "「Họ đã gửi lời cảm ơn đến một \\x%lレイルロオド;#00ffc040;Railord%l;#; như em. 『Vui lắm. Cảm ơn nhé』, với một nụ cười thật tuyệt vời.」"
2157 = "「『Chúc mừng chuyến tàu Nine Stars số 1 bắt đầu vận hành. Khi nào về Ohimitera, hai bố con mình cùng cạn ly Ngôi sao thứ chín nhé』.」"
2162 = "「Nhưng…… Đó chỉ là sự ích kỷ, cá nhân và ủy mị của anh thôi.」"
2163 = "「——Nhưng, nếu là anh Soutetsu.」"
2164 = "「Nhưng mà, công sức bỏ ra cũng đáng. Với đài quan sát này, mọi người sẽ có thể thoải mái tận hưởng ngọn gió của Kyushu!」"
2167 = "「Nhưng mà, đông đúc và được yêu thích thế này. Anh thì lại không thể đi thực tế được, dù chỉ là một chặng đi chăng nữa.」"
2169 = "「Sự ích kỷ cá nhân và ủy mị của anh Soutetsu, đã mang đến cho mọi người ngày hôm nay, mang đến chuyến tàu này mà?」"
