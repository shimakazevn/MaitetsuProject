2377 = "「Ê hê hê, vì em đã cố gắng mà! Anh khen Reina nhiều hơn nữa cũng được đó nha?」"
2379 = "「Ê hê hê~! Reina đã cố gắng lắm đó nha! Anh Soutetsu, hãy khen Reina thật nhiều thật nhiều đi ạ~」"
2381 = "「Paulette. Nhộn nhịp thật đấy.」"
2383 = "「Chà. Chuẩn bị chu đáo quá nhỉ. Anh thì không biết đã mấy tháng rồi mới mặc lại bộ đó đấy.」"
2385 = "「Đồng phục của Đường sắt Ohito, em mặc chưa quen lắm. Nên từ trước em đã phải nghĩ xem mặc thế nào cho đẹp rồi.」"
2387 = "「Ở nước ngoài nữa! Toa xe hay tài liệu về tàu siêu tốc, chắc chắn vẫn còn lưu lại rất nhiều!」"
2388 = "「Nine Stars đã lăn bánh nhờ công của tất cả mọi người. Nhưng đây mới chỉ là bước khởi đầu cho sự phục hưng của đường sắt thôi.」"
2390 = "「Khi được anh nhờ, lần đầu tiên em cảm thấy. Anh Soutetsu khi trưởng thành, đã cho em thấy sự yếu đuối của mình.」"
2393 = "「Trước lúc đó! Chúng ta vẫn còn một cuộc hẹn quan trọng mà!」"
2395 = "「Chạy trên cao, trên tuyến đường chuyên dụng, với đường ray khổ tiêu chuẩn.」"
2397 = "「Trong ga, cảnh giác!」"
2402 = "「Điều khiển phối hợp, chuẩn bị tốt ạ. Tùy thuộc vào tín hiệu, chúng ta có thể xuất phát bất cứ lúc nào.」"
2403 = "「Điều khiển phối hợp?」"
2404 = "「Nhờ có Reina mà mọi thứ chẳng khác gì thường ngày cả. Anh hoàn toàn không phải bận tâm đến việc điều khiển phối hợp luôn.」"
2407 = "「Để mọi người phải đợi rồi!」"
2409 = "「Mọi người nhích lại gần anh Soutetsu thêm một chút nữa đi ạ! À, thêm chút nữa. Vâng! Thế đó! Ok rồi ạ!」"
2414 = "「Hai vợ chồng đã qua cổng soát vé trước. Trong lúc đợi con gái, em có trò chuyện với họ một chút ạ.」"
2416 = "「Chắc là em ấy thấy vui khi bấm vé. Mỗi lần cầm \\x%l改札鋏;#00ffc040;kìm soát vé%l;#; bấm lách cách, trông em ấy cứ như——」"
2418 = "「Vâng. Đã rõ ạ.」"
2419 = "「Vâng ạ.」"
2421 = "「Vâng ạ! \\x%l機関士;#00ffc040;Lái tàu%l;#; Migita cũng giữ an toàn nhé. Chúc anh làm nhiệm vụ suôn sẻ!」"
2425 = "「Vâng! Đã rõ thưa anh Soutetsu!」"
2427 = "「Nếu không khớp công suất chuẩn xác, sẽ xảy ra tổn hao và quá tải. Để ngăn chặn điều đó, chúng tôi đã phải điều chỉnh sát sao đến phút cuối cùng.」"
2428 = "「Nếu được, anh có chuyện muốn bàn với mọi người.」"
2431 = "「Nếu là khổ tiêu chuẩn và tuyến chuyên dụng thì còn nhanh hơn nữa. 200 km/h——thậm chí là tốc độ cao hơn thế.」"
2432 = "「……Một chuyến tàu du lịch chuyển tiếp sang trọng như Nine Stars, nếu có thể cho chạy ở Trung Quốc thì——」"
2434 = "「Giao cho em!」"
2439 = "「Không có gì đâu. Chúc mọi người có một chuyến đi vui vẻ nhé? Cả hành khách và nhóm Sou-chan nữa.」"
2443 = "「Đúng đúng.」"
2448 = "「Hi-chan, em quên giày cao gót phải không~」"
2449 = "「Hoạt động lái 8620 của Sou-chan. Giống như dùng điều khiển từ xa để điều khiển luôn cả KiHa 07——kiểu vậy hả?」"
2450 = "「Ra là Sou-chan muốn cho Michi xem cái này. Nên Michi nha, thấy vui lắm luôn!」"
2451 = "「Sou-chan, mọi người, mừng mọi người đã về.」"
2453 = "「Không có ạ. Thế nên, khi nghe anh nói là mong đợi, em vui lắm.」"
2455 = "「Đang khen đấy chứ. Khen rất nhiều là đằng khác.」"
2456 = "「Dù đã bàn giao chuyến tàu chuyển tiếp, nhưng không phải đến đó là kết thúc đâu ạ.」"
2459 = "「Với ý nghĩa đó, hôm nay anh phải lái cho thật tốt đấy nhé? Anh Soutetsu.」"
2460 = "「Nếu không có gì thì để chắc chắn, tôi muốn nhờ kỹ sư kiểm tra lại một lần nữa ở xưởng đầu máy.」"
2462 = "「Ngài Soutetsu. Dù không nhìn thấy, nhưng mồ hôi đổ ra sẽ khô lại trên bề mặt cơ thể. Nó sẽ tạo ra mùi cơ thể thoang thoảng, gây khó chịu cho những người xung quanh.」"
2465 = "「Cứ quyết định vậy đi. Anh cũng muốn thế.」"
2467 = "「Hãy giữ cho mình sự thong dong đủ để tận hưởng. Làm như vậy, cũng sẽ dẫn đến sự an toàn cao hơn và mang lại niềm vui cho hành khách.」"
2469 = "「Vì công việc, nên dốc toàn lực, tận hưởng, chuyến đi.」"
2477 = "「Anh có một ý tưởng. Nếu thực hiện được, nó sẽ mang lại thế mạnh khác biệt so với cả Aircra, máy bay hay tàu thủy.」"
2485 = "「Mọi người... những người đã ủng hộ Đường sắt Ohimitera. Chắc hẳn sẽ rất vui nhỉ. Khi thấy đội hình đó trên sân khấu rực rỡ này.」"
2492 = "「Sao thế——Hibiki.」"
2493 = "「Làm thế nào để đồng bộ được vậy?」"
2494 = "「Sao vậy anh? Lò hơi thì em chuẩn bị xong rồi đó? Lúc nào cũng có thể tiến vào đường ray được.」"
2495 = "「Không thể tin được. Em quên mang giày rồi.」"
2497 = "「Sao ngài lại đứng thẫn thờ ở chỗ này—— Hả!?」"
2499 = "「Để điều khiển phối hợp hoạt động hiệu quả, công suất của cả hai toa xe động lực phải được giữ ổn định ạ.」"
2502 = "「Chắc là được. ……Có lẽ vậy.」"
2504 = "「Anh, đã luôn rất thích Michiko.」"
2506 = "「Tôi không giỏi chụp ảnh lắm——nhưng nếu là để kỷ niệm.」"
2508 = "「Em cũng chỉ đi cùng đến Yatsushiro thôi. Dù sao thì, mọi người cũng có một chuyến đi vui vẻ nhé!」"
2511 = "「Bản thân chúng ta hãy tận hưởng chuyến đi này hơn bất kỳ ai. Hãy cùng trải qua khoảng thời gian du lịch bằng đường sắt——thật an toàn và thoải mái nào.」"
2513 = "「——Anh chỉ nghĩ là, thật đáng mong đợi thôi. Khoảnh khắc anh và Hibiki cùng mặc lễ phục sát cánh bên nhau trên sân khấu rực rỡ.」"
2514 = "「Em chỉ là người đi cùng thôi mà. Hay nói đúng hơn……nói thẳng ra là đối tác làm ăn?」"
2517 = "「Anh biết, nên anh mới không biết đấy. Dù sao thì, anh vẫn luôn ôm ấp một mối tình trẻ con với Michiko mà.」"
2518 = "「Anh biết rồi.」"
2519 = "「Em hiểu rồi. Chị nhắn lại là 『Con rất sẵn lòng』 giúp em nhé—— À, không. Khi nào về, em sẽ trực tiếp gọi điện cho bố.」"
2521 = "「Anh biết rồi. Anh chỉ trêu em chút thôi.」"
2522 = "「Anh mua lại có ổn không?」"
2524 = "「Máy ảnh và chân máy! Em đi lấy ngay đây!!」"
2527 = "「Thế nên Sou-chan. Michi đi đây!」"
2529 = "「Thế nên, việc có người hủy phòng này. Em sẽ rất vui nếu anh xem nó như một món quà mà mọi người dành tặng anh Soutetsu.」"
2531 = "「Tiếc là lần này em không có thời gian để tận hưởng chuyến đi. Nhưng cô ấy đi vì công việc. Chắc chắn cô ấy sẽ dốc toàn lực để tận hưởng chuyến đi này.」"
2534 = "「Thế nên, ngoài việc hoàn thành tốt nhiệm vụ—— Cả việc đi tàu, cả chuyến đi này. Anh cũng muốn Fukami tận hưởng nó.」"
2535 = "「Thế nên em sẽ không thay đổi, nhất định sẽ hoàn thành tốt trách nhiệm của mình. Em cũng đâu có lái tàu một mình, nên không sao đâu.」"
2537 = "「Thế nên, xin anh hãy đi chuyến đi này. Chuyến đi của gia đình. Vào ngày mà mạng lưới đường sắt——thực sự bắt đầu kết nối lại.」"
2538 = "「Nhưng nếu du lịch là việc thoát khỏi sự bình thường để đến với những điều khác thường. Thì chỉ riêng ngày hôm nay, nhiệm vụ của chúng ta cũng là một chuyến du lịch.」"
2541 = "「Không có cô đơn đâu nha! Còn có Nagi-sama và mọi người nữa mà.」"
2542 = "「Đâu có! Em còn chẳng mạnh mẽ bằng một phần trăm của anh Soutetsu nữa! Nhưng, chính vì thế, em mới thấy vui mà?」"
2545 = "「Xin lỗi. Anh quên mang cà vạt.」"
2547 = "「Nối toa thành công! Giỏi lắm.」"
2548 = "「Chuyến tàu du lịch chuyển tiếp Nine Stars. Đoạn từ Yatsushiro đến Kumamoto, tôi xin nhận bàn giao.」"
2551 = "「Đường sắt Tân Cán Tuyến.」"
2554 = "「Tân Cán Tuyến——Shinkansen! Tuyệt quá, tuyệt vời quá đi nha!!」"
2556 = "「Hibiki.」"
2557 = "「Biết thế chị cũng ăn diện một chút.」"
2560 = "「Chẳng phải anh sẽ đi sao. Cùng với gia đình. Anh Soutetsu của ngày bé.」"
2561 = "「Là một chuyến tàu có khuôn mặt tròn xoe dễ thương lắm! Nhìn Michi mà cứ cười tủm tỉm suốt thôi.」"
2564 = "「Vậy sao! Hi-chan, em đã cố gắng lắm rồi nhỉ.」"
2566 = "「Đúng vậy ạ, trước tiên là từ việc đó.」"
2569 = "「Ừ—— Nghe em nói mới nhớ, từ trước đến nay hoàn toàn không có nhỉ.」"
2570 = "「Ừ. Giữa Ohimitera và Yatsushiro, chỉ riêng chuyến tàu số 1 hôm nay, sẽ chạy bằng đội hình kỷ niệm mà.」"
2571 = "「Đúng vậy nhỉ~」"
2573 = "「Đúng vậy. Hơi hiếm thấy thật.」"
2574 = "「Vậy sao——tốt quá. Vui lắm, sao. Anh, nếu vậy thì……anh, cuối cùng cũng——」"
2576 = "「Tạo ra một tuyến đường sắt hoàn toàn mới…… trở thành huyết mạch của Hinomoto sao?」"
2578 = "「Vâng. Một chặng từ Ohimitera đến Yatsushiro. Người đăng ký chờ hủy cho riêng chặng đó, chỉ có mỗi anh Soutetsu thôi ạ.」"
2580 = "「Đúng vậy. Nhờ có mọi người. Tất nhiên là bao gồm cả chị Mayami nữa, cuối cùng chúng ta cũng đón được ngày hôm nay.」"
2582 = "「Đúng vậy. Nói cách khác, đó là đường sắt Tân Cán Tuyến (Shinkansen).」"
2583 = "「Vâng. Nói vậy chứ, em cũng chỉ soát vé cho đúng một gia đình thôi ạ.」"
2586 = "「Vâng! Ngài Soutetsu!」"
2588 = "「Vâng, vì chỉ là tinh chỉnh cuối cùng thôi ạ. Bây giờ chúng ta đã có thể thực hiện điều khiển phối hợp hoàn hảo bất cứ lúc nào.」"
2590 = "「Là toa Remu 9100 nhỉ. Không chỉ đơn thuần là \\x%l貨車;#00ffc040;toa chở hàng%l;#; đông lạnh, mà là toa đông lạnh kiêm toa phát điện.」"
2591 = "「Với vận tốc——200 km/h.」"
2594 = "「Đài quan sát ở tận cùng phía sau cũng đẹp lắm nhỉ. Hi-chan đã rất cố gắng thiết kế đó.」"
2595 = "「Hành khách, mọi người sẽ đi tàu hết đó nha! Vì nó nhanh hơn Aircra rất rất nhiều luôn mà!」"
2597 = "「Bàn bạc ạ? Tất nhiên là em rất hoan nghênh rồi.」"
2598 = "「Có người hủy rồi sao!」"
2599 = "「Em nghĩ là có khả năng đó. Mà với tính cách của cô ấy, ít nhất thì em——『Chỉ cảm thấy có khả năng đó thôi』.」"
2602 = "「Cũng có thể lắm nha, chị Hachiroku, nhìn vậy chứ chị ấy thích soát vé lắm đó ạ~」"
2604 = "「Đúng vậy nhỉ! Em hiểu rồi, anh Soutetsu.」"
2617 = "「Vừa hay. Em cũng có chuyện muốn bàn bạc. Nói vậy chứ, trước tiên em muốn nói chuyện với anh Soutetsu và Paulette.」"
2619 = "「Đúng vậy ạ. Do đó, hoạt động của xe đi trước——lần này là 8620 phải đồng bộ với hoạt động điều khiển của KiHa 07 ạ.」"
2621 = "「Vâng, đúng vậy ạ. Bằng cách thực hiện phối hợp như thế, chúng ta có thể giảm thiểu tối đa tổn hao công suất và giúp hệ thống chạy ghép đôi hoạt động hiệu quả ạ.」"
2627 = "「Đúng ý tớ luôn!!」"
2631 = "「Không sao đâu, Reina.」"
2632 = "「Không đâu. Hoàn toàn không có chuyện đó. Nhờ mọi người phát hiện sớm và xử lý nhanh chóng đấy, cảm ơn mọi người.」"
2633 = "「Đúng vậy. Đó là chuyến tàu kết nối các thành phố lớn với vận tốc 200 km/h.」"
2634 = "「Đúng vậy ạ. Sau khi nối xong, chúng ta sẽ lập tức thiết lập điều khiển phối hợp, nên có thể tiến lên bất cứ lúc nào ạ.」"
2635 = "「Đúng vậy ạ. Chúng em sẽ luôn hỗ trợ ngài Soutetsu bất cứ lúc nào.」"
2636 = "「Vâng. Trách nhiệm rất nặng nề. Bởi vì lúc nào em cũng đang nắm giữ sinh mạng của hành khách mà.」"
2637 = "「Đúng vậy, là làm nhiệm vụ.」"
2646 = "「Đổ mồ hôi, tôi á? \\x%l機関士;#00ffc040;Người lái tàu%l;#; của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; cơ mà? Chỉ chạy đến ga thôi mà đổ mồ hôi sao?」"
2651 = "「Đừng quá áp lực, Fukami. Giờ em cũng đã là nhân viên đường sắt rồi. Không sao đâu. Mọi thứ cần thiết đều đã thấm nhuần vào cơ thể em rồi.」"
2653 = "「Tuyệt vời lắm ạ.」"
2654 = "「Tại sao lại không được mua chứ ạ? Em cũng đã nhận tiền ứng trước rồi mà.」"
2658 = "「Thấy vui?」"
2662 = "「Kỷ lục của em gái Reina, tuabin khí ấy, liệu có còn được lưu giữ ở đâu không?」"
2665 = "「Reina tuyệt lắm! Quả đúng là tấm gương sáng của \\x%lレイルロオド;#00ffc040;Railord%l;#;. Khi cần là làm được ngay. Trông thế này thôi chứ thực lực đáng gờm lắm đấy.」"
2668 = "「Reina sẽ đứng cạnh Paulette nha~」"
2670 = "「Reina, cũng sẽ cố gắng bàn bạc nha~」"
2673 = "「Bây giờ, cả hai chúng ta hãy tập trung vào công việc của mình đã.」"
2674 = "「Chúng ta là một đội mà. Đâu có gì đặc biệt đâu.」"
2675 = "「Tất nhiên rồi. Cả chị Mayami, cả Reina nữa.」"
2677 = "「Đúng vậy.」"
2681 = "「Cái này thì——em đã quá nóng vội rồi.」"
2684 = "「Tuyệt quá! Tuyệt quá! Nếu điều đó trở thành hiện thực.」"
2686 = "「Cô đơn thật đấy. Sau lễ hội là thế này sao.」"
2688 = "「Gì chứ, Hibiki cũng để quên đồ à. Ăn ý thật đấy.」"
2690 = "「Vậy sao.」"
2691 = "「Sou-chan, thật sự cảm ơn anh nha? Chuyến đi bằng tàu. Du lịch bằng đường sắt. Đã cho Michi biết nó vui thế nào.」"
2693 = "「Ừ.」"
2695 = "「Đúng vậy ạ. Anh Soutetsu 'hôm nay cũng vậy', dù là lúc nào, cũng luôn cố gắng mang đến những chuyến đi tuyệt vời nhất mà.」"
2696 = "「Chuyến đi vui vẻ nhé.」"
2698 = "「Đợi đã! Bố, mẹ, Michiko!!」"
2700 = "「Còn lễ kỷ niệm thì sao? Ở ga Ohimitera cũng có đúng không?」"
2701 = "「Chụp ảnh lưu niệm! Kỷ niệm chuyến tàu Nine Stars số 1 đã chạy thành công tốt đẹp!」"
2702 = "「Là cái này ạ.」"
2708 = "「Đường ray, nhà ga, mọi thứ. Em đã luôn bảo vệ chúng. Nếu không có điều đó, thì đã chẳng có chuyện gì bắt đầu cả.」"
2709 = "「Thắt cà vạt làm gì chứ—— A! Ra vậy, là cho lúc chuyển tiếp ở ga Yatsushiro.」"
2715 = "「Mikuro cũng sẽ hỏi bạn bè—— rồi nói lại tất cả những gì mình biết cho mọi người nhé.」"
2717 = "「Bọn em có cản trở gì không ạ?」"
2718 = "「Mikuro. Hãy đứng cạnh chị nào.」"
2722 = "「Lúc nào cũng làm phiền em thật ngại quá——nhờ em nhé.」"
2725 = "「Yeah!」"
2727 = "「Chắc chắn là được đó nha! Vì em gái của Reina, sau khi được cải tạo thành tuabin khí đã đạt vận tốc 150 km/h rồi mà.」"
2729 = "「Chắc chắn là sẽ tốn. Nhưng——dù có tốn bao nhiêu đi chăng nữa, chúng ta hẳn đã xây dựng được những mối quan hệ và vị thế đủ để bù đắp lại.」"
2730 = "「Thật là một điều vui vẻ và hạnh phúc nhỉ. Khi được chạy trên một đoạn đường ray mới.」"
2733 = "「Vâng! Nếu tìm thì sẽ ra ngay đó nha~」"
2734 = "「Không có gì thay đổi so với lúc thử nghiệm ạ. Rời khỏi xưởng đầu máy, tiến vào đường dồn toa, lùi vào đường chính và nối với nhóm toa xe đang chờ sẵn.」"
2735 = "「Có ạ, nhưng vì chúng ta phải lái tàu ngay sau đó, nên đã được quyết định là sẽ không tham gia ạ.」"
2738 = "「\\x%lブレーキ;#00ffc040;Phanh%l;#;, vị trí lái~~~——Ngay bây giờ!」"
2739 = "「Tàu điện siêu tốc chở khách chạy trên tuyến đường ray khổ tiêu chuẩn trên cao.」"
2740 = "「Quá trình chạy thử nghiệm đúng là một chuỗi ngày vất vả mà.」"
2745 = "「Này nha! Lúc về Reina cũng muốn điều khiển phối hợp nữa cơ~」"
2748 = "「Nói vậy thì phải là Hibiki mới đúng chứ. Bộ đồ bảo hộ đó, em mặc cũng cực kỳ đẹp đấy.」"
2752 = "「Đối tác làm ăn.」"
2762 = "「Nhưng mà, tàu hỏa có thể đạt được vận tốc 200 km/h sao?」"
2763 = "「Có dặn mà?」"
2764 = "「Ăn ý ở mấy chuyện thế này thì em cũng chẳng vui đâu. Mà, làm sao bây giờ. Hay là giờ chạy về lấy.」"
2765 = "「Mời ngài lên, ngài Soutetsu.」"
2766 = "「Cứ giao cho tôi. Tôi nhất định sẽ đưa những nụ cười được gửi gắm này đến ga Kumamoto an toàn.」"
2767 = "「Với bọn anh——thậm chí với cả Hachiroku. Người đã nhắc nhở bọn anh về sự tuyệt vời của đường sắt, không ai khác chính là em, Paulette.」"
2777 = "「Toa đó có sẵn máy phát điện diesel mà. Dù không chạy, nó vẫn có thể liên tục phát điện và làm lạnh.」"
2780 = "「Anh vất vả rồi, anh Soutetsu. Phần còn lại cứ để em lo.」"
2798 = "「Chà, có vẻ sẽ bận rộn đây. Phải đặt lịch hẹn với ông Goto—— À không, trước đó phải giải quyết vụ Trung Quốc đã.」"
2799 = "「Anh đã nghĩ đến rồi đúng không? Chắc chắn là anh đã nghĩ đến chuyện đó rồi.」"
2800 = "「Chà——ai biết được nhỉ.」"
2801 = "「Dạ, không có ý nghĩa sâu xa gì đâu ạ! Cái đó」"
2802 = "「Không được đâu. Anh nói vậy, em sẽ sung sướng đến phát khóc mất——」"
2803 = "「Không được đâu Sou-chan. Michi cũng rất thích Sou-chan, nhưng mà.」"
2804 = "「Vì chưa quen nên anh thấy căng thẳng lạ thường. Xin lỗi, cho anh xin ngụm nước được không——ủa?」"
2805 = "「Cảnh tượng này mới hoành tráng hơn, hoành tráng hơn rất nhiều.」"
2806 = "「Ra là vậy nha~」"
2807 = "「Đúng vậy. Cái sự rất thích giống hệt như Michiko, anh cũng đã luôn, luôn ôm ấp dành cho em.」"
2808 = "「Vậy sao. Mọi người đều đang cố gắng nhỉ.」"
2809 = "「Vậy sao, tiếc quá! Michi cứ tưởng lần đầu tiên trong đời được tỏ tình, ai ngờ lại bị đá ngay lập tức!」"
2810 = "「Thật sự là nhờ sức mạnh của tất cả mọi người. Nhưng trong số đó, Paulette. Sức mạnh của em là lớn nhất.」"
2811 = "「Nói vậy, nhưng em chẳng thấy giống như đang được khen chút nào đâu~」"
2815 = "「Bằng \\x%l共感;#00ffc040;cộng cảm%l;#; ạ. Em sẽ truyền thao tác điều khiển của ngài Soutetsu cho Reina thông qua \\x%l共感;#00ffc040;cộng cảm%l;#;, rồi Reina sẽ áp dụng nó lên KiHa 07 ạ.」"
2816 = "「Tờ rơi, báo chí, áp phích, và các thông báo quảng cáo trên mạng. Sự truyền miệng của học sinh và những người liên quan, cũng như sức mạnh của ga trưởng cũng đóng vai trò lớn nhỉ.」"
2818 = "「Giữa các thành phố lớn.」"
2820 = "「Với lại nha, ở tuốt phía trước! Michi nha, cuối cùng cũng được xem rồi đó!」"
2821 = "「Với lại, hơi sát giờ một chút nhưng—— Đây, có người hủy rồi ạ. Một phòng.」"
2822 = "「Để ở \\x%l貨車;#00ffc040;toa chở hàng%l;#;……toa đông lạnh là được đúng không? Cái toa đó lạnh buốt luôn rồi nhỉ. Chị bất ngờ lắm đấy.」"
2826 = "「Vậy thì, cùng lắm chỉ chụp ảnh lưu niệm thôi à.」"
2827 = "「Này, Sou-chan. Bố có gửi lời nhắn cho em đấy.」"
2830 = "「Vậy thì, cố lên nhé!」"
2833 = "「Vậy thì, đi thôi!」"
2835 = "「Vậy thì, chị có thể yên tâm tiễn Sou-chan và mọi người rồi nhỉ.」"
2837 = "「Vậy thì, Sou-chan gánh trách nhiệm nặng nề lắm đấy nhỉ.」"
2839 = "「Đó là Hikari (Ánh sáng). Chuyến tàu mang theo vô vàn hy vọng. Một chuyến tàu cao tốc trắng muốt, chói lóa.」"
2841 = "「Vậy từ giờ trở đi, sau này, anh có thể thích người khác được không?」"
2843 = "「Chắc là hoành tráng lắm nhỉ.」"
2845 = "「Trước tiên, chúng ta phải quay về Ohimitera đã.」"
2846 = "「Vậy thì, trong khi đặt niềm tin tối đa vào mọi người, em sẽ đi cố gắng hoàn thành công việc của mình đây.」"
2849 = "「Vậy thì em sẽ là trưởng tàu số 1! Nagi, chúng ta cùng nhau làm nhiệm vụ nhé!」"
2850 = "「Em đi đây!」"
2851 = "「Không sao đâu. Anh hai mặc gì cũng hợp mà.」"
2853 = "「Tất nhiên rồi. Cứ yên tâm.」"
2855 = "「Quay lại cầu Oshiro sao? Ngốc thật, chạy bộ còn nhanh hơn.」"
2860 = "「Vậy thì, tàu tốc hành của đường sắt Tân Cán Tuyến sẽ là tàu Hikari?」"
2861 = "「Tất nhiên rồi! Đó cũng là công việc của Nagi-sama mà!」"
2862 = "「Vậy thì. Trăm sự nhờ anh.」"
2864 = "「Chỉ vì sự ích kỷ……cá nhân và ủy mị——」"
2865 = "「Anh khi trưởng thành, sao.」"
2868 = "「Anh hai! Tín hiệu.」"
2869 = "「Anh hai, trễ quá đi mấtttt!」"
2871 = "「Anh hai, mừng anh trở lại. Lò hơi đang ồn ào vì không thể chờ thêm được nữa rồi kìa.」"
2873 = "「Anh hai. Vẫn chưa đâu. Vẫn chưa, vẫn chưa, cứ tiếp tục——」"
2875 = "「Quả nhiên chị đã mang đến cho em! Cảm ơn chị nha~」"
2877 = "「Ngoài ra, chắc chắn vẫn còn vô số những kiến thức của người đi trước mà chúng ta có thể tận dụng được.」"
2879 = "「Tuy là hiếm thấy—— nhưng thỉnh thoảng cũng có chuyện như vậy mà.」"
2880 = "「Dù chỉ là dấu hiệu tắc nghẽn đơn giản, nhưng nếu xử lý chậm trễ, nó có thể trở thành một sự cố chí mạng khi vượt đèo lúc về đấy ạ.」"
2881 = "「Anh Soutetsu!?」"
2882 = "「Oa!? Anh Soutetsu, đang cười mà sao lại khóc vậy ạ?」"
2883 = "「Anh Soutetsu~?」"
2884 = "「Anh Soutetsu.」"
2885 = "「Anh Soutetsu đứng ở giữa! Hãy đứng ở giữa đi ạ.」"
2886 = "「Ngài Soutetsu.」"
2887 = "「Ngài Soutetsu, để ngài phải đợi rồi.」"
2888 = "「Ngài Soutetsu, ngài Soutetsu?」"
2889 = "「Ngài Soutetsu? Ngài sao vậy ạ?」"
2890 = "「Tiện đường thôi, tiện đường thôi. Chị đến giao 『Ngôi sao thứ chín』 tiện thể mang qua luôn.」"
2891 = "「Cà vạt á?」"
2899 = "「!」"
2901 = "「4, 3, Cheese!」"
3203 = "Một gia đình. Là người giống người——sao."
3207 = "Không có ai cả. Cả Hachiroku và Hibiki. Có vẻ hai người họ đã xuống tàu, trên buồng lái chỉ còn mỗi mình tôi."
3209 = "Không hiểu sao, mặt Hibiki lại đỏ bừng lên."
3211 = "Dù có cố gắng thế nào đi chăng nữa, cuối cùng nó cũng chỉ đọng lại bằng một câu nói rất đỗi bình thường."
3212 = "Kể cả khi tôi thay mặt anh Munakata, chở các học sinh trên toa hành khách hộp diêm, và kéo chuyến tàu hướng đến Yui bằng đầu máy số 9."
3215 = "Không, nhưng mà…… Nhưng mà, nếu vậy thì lại quá đỗi——"
3226 = "——Bộ đồng phục trưởng tàu rất hợp với con bé. Trưởng tàu chuyên trách Nine Stars. Người đầu tiên đảm nhận vị trí này. Hayase Fukami."
3231 = "Nhóm toa hành khách dòng 90 mang đậm chất Kyushu, với mỗi phòng khách tượng trưng cho chín tỉnh của Kyushu."
3237 = "Niiroku cười, một nụ cười rất tự nhiên. Như một tín hiệu, những bông hoa flash chói lóa đồng loạt nở rộ."
3240 = "Từ giờ trở đi, có lẽ chúng tôi sẽ còn chụp rất nhiều, rất nhiều bức ảnh lưu niệm nữa."
3242 = "Việc nếm thử và bán loại rượu đoạt giải cao nhất tại ISC (International Spirits Challenge) ngay trên tàu là một trong những điểm nhấn lớn của chuyến tàu Nine Stars số 1 khởi hành hôm nay."
3245 = "Một cái chào cờ ngắn gọn. Chúng tôi cũng đáp lại bằng một cái chào cờ ngắn gọn."
3246 = "Chúc chuyến đi tốt lành—— Tiếng còi mang theo lời chúc ấy vang lên."
3249 = "Nhưng vẫn có chút bất an. Chính vì có chút bất an, nên tôi mới có thể háo hức tiến về phía trước."
3251 = "Nhưng, hôm nay là đội hình kỷ niệm. Cảnh sắc nhìn từ ô cửa sổ đó——"
3257 = "Biển báo đã thay đổi. Với tốc độ cảnh giác, trước tiên cứ từ từ di chuyển từ đường dồn toa sang đường số 2——"
3289 = "Chuyến tàu du lịch chuyển tiếp sang trọng với giá 999.000 yên cho toàn bộ hành trình. Số lượng hành khách tối đa cũng chỉ là 54 người/9 gia đình."
3298 = "Hachiroku không nói gì cả. Với vẻ mặt vô cùng thư giãn, em ấy giao phó mọi thứ cho Hibiki."
3300 = "Tôi bế Hachiroku, người đã nhanh chóng thay sang \\x%l運転体;#00ffc040;thân chính%l;#; trong lúc tôi giải thích, lên đùi như mọi khi."
3305 = "Khi tôi ôm lấy Hachiroku cùng với chiếc chuông xuất phát, âm thanh trong trẻo của tiếng chuông vang lên thật to và vang xa."
3306 = "Hachiroku chống nạnh, nhìn chằm chằm vào tôi."
3312 = "Thực ra tôi cũng muốn đầu máy số 9 tham gia vào đội hình kỷ niệm này."
3313 = "Đến mức khiến tôi hơi lo lắng, không biết Nhà máy chế tạo toa xe Jussen - Đường sắt Hinomoto có thể kham nổi không——"
3320 = "Đã \\x%l絶気;#00ffc040;cắt hơi%l;#; từ lâu, giờ chỉ đang chậm rãi \\x%l惰行;#00ffc040;chạy quán tính%l;#;. Chỉ chờ đợi thời điểm——cho công đoạn cuối cùng."
3326 = "Có một điểm giao cắt đường sắt. Rất đông người đang dõi theo 8620."
3327 = "Đang bước xuống từ buồng lái, chị Mayami chợt dừng bước, quay lại."
3331 = "Không chỉ riêng Fukami. Cả Hachiroku và Hibiki nữa. Cả Paulette và Reina. Cả Nagi, anh Nakamura và Mikuro."
3333 = "Chỉ cần như vậy là đủ rồi."
3338 = "Ra là vậy, đúng là chúng tôi đã hứa."
3345 = "Một ngày nào đó, tôi sẽ hoài niệm nhìn lại."
3348 = "Chỉ có duy nhất Kisaki là không gật đầu, cô ấy lặng lẽ, nhìn chằm chằm——vào tôi."
3349 = "Xếp thành hàng ngay ngắn trên sân ga là những gia đình trông thật hạnh phúc đang chờ lên tàu."
3352 = "Nhưng, \\x%l機関士;#00ffc040;lái tàu%l;#; Munakata và Olivy đã hiên ngang, dõng dạc từ chối lời đề nghị đó của chúng tôi."
3356 = "Nhưng, khi Paulette ngẩng mặt lên, đó là một nụ cười rạng rỡ tuyệt đẹp."
3362 = "Trái ngược hoàn toàn với sự náo nhiệt lúc xuất phát, người ra đón chỉ có vỏn vẹn chừng đó."
3364 = "Trong lúc cãi nhau thì đã đến nơi."
3368 = "Tôi không muốn Mikuro và anh Nakamura phải cảm nhận sự hối hận mà tôi đang trải qua."
3369 = "Vì con bé đã cứu tôi, nên chừng nào chưa cứu được con bé, tôi sẽ mãi mãi chỉ nhìn thấy bản thân mình, chỉ nhìn thấy Michiko."
3370 = "Vì vậy, Hibiki đã thiết kế đài quan sát ở đuôi tàu, để hành khách có thể ra ngoài ngay cả khi tàu đang chạy."
3374 = "Đường số 1. Đầu máy số 9 đang đỗ ở sân ga phía tuyến Yui. Bên cạnh là \\x%l機関士;#00ffc040;lái tàu%l;#; Munakata và Olivy."
3378 = "Với tư cách là một nhà thiết kế và một \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;, dù đã có đủ kỹ năng nhưng mới cách đây không lâu, con bé vẫn còn vẻ gì đó ngơ ngác."
3382 = "Ngay trước khi đường ray của chúng tôi bẻ một khúc cua lớn, đầu máy số 9 đã kéo \\x%l汽笛;#00ffc040;còi hơi nước%l;#; chào chúng tôi."
3384 = "Sau khi qua Hayato vài phút, Nagi và anh Nakamura đã nhận thấy sự bất thường trong hoạt động của máy bơm nước trên đầu máy phụ D51 1031."
3387 = "Vừa yên vị vào chỗ, Hachiroku liền ưỡn ngực tự hào, và bắt đầu bổ sung những chỗ tôi nói thiếu bằng giọng điệu của một giáo viên."
3391 = "Ngôi sao thứ chín——Loại rượu mới, một cột mốc huy hoàng của dòng rượu được quản lý dữ liệu hoàn toàn bởi \\x%lレイルロオド;#00ffc040;Railord%l;#;."
3393 = "Ý tưởng gộp chung toa phát điện và toa đông lạnh làm một của Hibiki, đã được các kỹ sư kế thừa kỹ thuật của Đường sắt Hoàng gia cũ hiện thực hóa."
3394 = "Mọi người đồng loạt gật đầu."
3400 = "Đã lâu lắm rồi, con bé mới gọi tôi là \"anh\" Soutetsu giống như hồi mới quen."
3402 = "Một câu hỏi rất ngây thơ, nhưng cũng rất lanh lợi, làm rung động cả màng nhĩ và trái tim tôi."
3403 = "Con bé đã đi tu nghiệp và mang về rất nhiều điều quý giá—— Nếu không có Fukami, có lẽ đã không có Nine Stars của ngày hôm nay."
3407 = "Giữ nguyên nụ cười đó, cô ấy gật đầu mạnh mẽ \"Vâng\", và chấn chỉnh lại tư thế."
3409 = "Con bé cười tươi vẫy tay,"
3411 = "Một nụ cười thật dịu dàng. Nhìn lại mới thấy, cô ấy thật mỏng manh và nhỏ bé biết bao."
3414 = "Cô ấy âu yếm, lặng lẽ ngắm nhìn sân ga Ohimitera—— sân ga của cô ấy."
3415 = "Con bé đưa hai tay ôm lấy má, vặn vẹo người như thể xấu hổ—— Rồi lại ngây thơ nghiêng đầu \"Ủa?\"."
3416 = "Con bé tinh nghịch nói rồi bật cười."
3419 = "Dưới chân con bé là đôi giày bảo hộ kiểu dáng như giày thể thao mà con bé vẫn thường đi khi làm nhiệm vụ."
3420 = "Tiến vào trong ánh sáng phía sau cổng soát vé, mà không một lần ngoảnh lại——"
3422 = "Nếu đưa chuyến tàu số 1 đến đích an toàn, thì từ nhiệm vụ tiếp theo trở đi, nó sẽ sớm trở thành một công việc thường ngày thôi."
3426 = "\\x%l機関士;#00ffc040;Lái tàu%l;#; Munakata và Olivy cũng nói y hệt như chị Mayami vậy."
3440 = "Muốn nối lại những đoạn đường ray đứt đoạn, và đưa nó đến những vùng đất xa lạ, những nhà ga mới."
3441 = "Từng vấn đề một, chúng tôi đã kết tinh công sức và trí tuệ để giải quyết triệt để——và cuối cùng cũng hoàn thiện được hình hài này."
3446 = "Mỗi khi ga trưởng Kon kêu lên lanh lảnh như để đáp lại ánh nhìn của tôi và di chuyển, một phần khách tham quan cũng đồng loạt lũ lượt đi theo sau."
3449 = "Để mong ước của tôi cũng gắn liền với lợi ích chung, cô ấy chỉ âm thầm, liên tục chuyển \\x%lポイント;#00ffc040;ghi đường sắt%l;#;."
3452 = "Dù không nhìn, hơi nóng vẫn truyền đến cho tôi biết ngọn lửa đang bùng lên. Ngay sau đó là tiếng rào rào vui tai của than được ném vào."
3455 = "Nếu là những kỷ niệm thời thơ ấu giữa tôi và Paulette—— Vì nó rất quan trọng, nên tôi muốn sau này sẽ cùng nhau tâm sự chậm rãi hơn."
3493 = "Tính cách thế nào thì tôi không rõ, nhưng vị thế của cô ấy thì tôi biết."
3496 = "Cảm giác lâu lắm rồi mới lại ở một mình, tôi vừa thấy nhẹ nhõm, lại vừa thấy có chút cô đơn."
3497 = "Tôi cảm thấy mình chẳng nói hay hỏi điều gì khiến con bé phải xấu hổ cả."
3502 = "Tôi không thể lập tức xâu chuỗi ý nghĩa của câu nói đó. Đi tàu vì công việc……không phải làm nhiệm vụ, mà là——"
3505 = "Tôi sẽ không níu kéo. Tôi sẽ không khóc. Vì tôi là một \\x%l機関士;#00ffc040;lái tàu%l;#; cơ mà."
3507 = "Một tiếng thở hắt dài tự nhiên bật ra khỏi cổ họng."
3509 = "Tôi chưa hề nói gì với Paulette cả."
3511 = "Tôi cũng vậy. Dù vẫn tự mình xác nhận bằng mắt, nhưng tôi ưu tiên nghe theo giọng nói của Hibiki để canh thời gian chuẩn xác."
3513 = "Tôi cũng vậy——cơ thể đang run lên."
3521 = "Tôi đáp lại bằng \\x%l汽笛;#00ffc040;còi hơi nước%l;#;, gửi lời chào tạm biệt đến chuyến tàu số 9 đang đi thẳng."
3523 = "Theo biểu đồ chạy tàu tạm thời, giờ xuất phát đã được sắp xếp trùng nhau."
3524 = "Khi trở lại sân ga Ohimitera, chị Mayami và Kon ra đón chúng tôi."
3525 = "Chúng tôi bắt tay. Một cái bắt tay với người cựu binh được mệnh danh là thiên tài, bàn tay tuy mảnh khảnh nhưng lại vô cùng mạnh mẽ."
3526 = "Bởi vì tuyến Hisatsu mà chúng tôi đang chạy, sẽ hướng đến Kobata, vượt qua núi Yadake."
3527 = "Hướng tới một tương lai chưa từng thấy, chúng tôi liên tục ném than vào lò, tăng tốc chạy thẳng một mạch——"
3529 = "Cô ấy thực sự, thực sự thấu hiểu tôi. ……Vì thế, cuối cùng tôi cũng có thể chắc chắn."
3532 = "Tôi kiểm tra lại tín hiệu và \\x%l喚呼;#00ffc040;hô xác nhận%l;#;."
3535 = "Đã trưởng thành rồi, tôi thấm thía nghĩ. Cả ngoại hình lẫn thái độ, đều toát lên vẻ điềm tĩnh và thong dong."
3538 = "Vừa ngồi xổm xuống, Michiko liền thì thầm vào tai tôi."
3539 = "Vừa bước ra khỏi buồng lái, Paulette đã vẫy cờ chạy đến chỗ chúng tôi."
3540 = "Chỉ là, ngộ nhỡ có người hủy mà phòng trống, thì hãy cho anh lấy phòng đó……tôi chỉ nhờ cô ấy như vậy thôi."
3543 = "Tôi, chỉ muốn làm cho Michiko cười. Chỉ đơn giản là như vậy thôi."
3545 = "Giấc mơ thuở ấu thơ của tôi và Michiko đang lan truyền nhanh chóng. Tôi tin chắc rằng nó sẽ thành hiện thực."
3546 = "Trở lại buồng lái quen thuộc, tôi nới lỏng cà vạt."
3552 = "Tôi gạt \\x%lブレーキ;#00ffc040;phanh%l;#; sang vị trí lái, \\x%l前進フルギア;#00ffc040;cài hết số tiến%l;#;. Đặt tay lên cần \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;#;."
3554 = "Và \\x%lタブレット;#00ffc040;thẻ bảng%l;#; mô phỏng đồ của \\x%lレイルロオド;#00ffc040;Railord%l;#;—— biểu tượng của chuyến tàu chuyển tiếp, được tôi trao lại cho \\x%l運転士;#00ffc040;lái tàu%l;#; Akai."
3560 = "Ngay sau khi cảm nhận được một cú xóc cực kỳ nhẹ khi nối toa, con tàu dừng lại ngay lập tức."
3562 = "Nghẹn ngào trong lồng ngực, tôi cố gắng nặn ra được chừng đó chữ."
3565 = "Tôi đáp lại bằng tiếng \\x%l汽笛;#00ffc040;còi hơi nước%l;#;."
3568 = "Nhẹ nhàng miết dọc theo tấm vé mà tôi vừa nhận, vẫn chưa kịp cất vào túi."
3569 = "Với chị Mayami, với Hibiki, với Hachiroku, với Navi. Tôi có nhiều điều muốn nói, nhưng lại không thể sắp xếp thành lời."
3572 = "Tôi hít vào, thở ra. Không hề căng thẳng. Cũng không hề sợ hãi."
3573 = "Ánh mắt tôi đang hướng ra sân ga qua cửa sổ, trong khoảnh khắc ấy, chợt đông cứng lại."
3577 = "Tôi gật đầu. Bằng tất cả sức lực."
3579 = "Thực hiện những động tác quen thuộc như thường lệ, 8620 cũng đáp lại tôi như thường lệ."
3581 = "Tôi lùi lại một chút, nhìn Hibiki. Bị nhìn chằm chằm, Hibiki nghiêng đầu \"Hửm?\"."
3582 = "Cuối cùng tôi cũng hiểu lý do vì sao ngày hôm đó mình lại được rủ."
3583 = "Tôi cuối cùng cũng cảm nhận được từ tận đáy lòng, rằng đó thực sự chỉ là một tai nạn."
3586 = "Tôi nhớ mình từng nghe lý do Kisaki được rủ đi cùng là 『Đi du lịch một mình cũng tẻ nhạt』——"
3587 = "Đó mới chính là một cột mốc quan trọng mà chúng tôi cần có, tôi nghĩ vậy."
3591 = "Tôi giao lại việc đối phó với giới truyền thông cho Paulette, người vừa bước xuống từ KiHa 07S."
3593 = "Tôi ôm lấy con bé theo lời vòi vĩnh."
3594 = "Tôi lao hết tốc lực vào trong nhà ga, xác nhận an toàn. Chạy vội qua sân ga, rồi phóng thẳng vào bên trong \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#;."
3596 = "Thế nhưng, những lời nói đầy khí thế ấy lại không nhận được nhiều cái gật đầu mạnh mẽ."
3598 = "Tôi gật đầu trước lời nói của hai người, chị Mayami cũng nở nụ cười rạng rỡ gật đầu theo."
3600 = "Thế nên, chúng tôi tăng tốc. Đến nơi có những nụ cười mới đang chờ đợi."
3602 = "Thế nên, tôi mới nhờ cô ấy cho vào danh sách chờ hủy với tâm thế không còn gì để mất——như một lời bao biện, nhưng mà……"
3605 = "Thế nên, tôi mới định cho Michiko xem. Dù thứ nhìn thấy chỉ là \\x%l炭水車;#00ffc040;toa tiếp than nước%l;#;, hay thậm chí là chẳng thấy gì cả."
3608 = "Cùng với các tình nguyện viên gác chắn, mọi người đang vẫy tay thật mạnh, thật mạnh."
3610 = "Nhìn lên đỉnh đầu, tất nhiên là có Navi. Bên cạnh tôi, tất nhiên là có Hachiroku."
3613 = "Cho \\x%l電車;#00ffc040;tàu điện%l;#; tốc hành đã được phục chế, \\x%lクハ26;#00ffc040;Kuha 26%l;#;-000 và \\x%l編成;#00ffc040;đội hình%l;#; của nó."
3616 = "Và rồi, tín hiệu chuyển sang màu xanh."
3622 = "Do đó, nhóm Nagi - Nakamura - Mikuro đã không tham gia lễ bàn giao tại ga Yatsushiro, mà ngay lập tức bắt tay vào xử lý sự cố ngay khi vừa đến nơi."
3624 = "Vì vậy, nó có thể vừa kiêm nhiệm vai trò toa phát điện, vừa đảm bảo không gian chở hàng và làm lạnh ở một mức độ nhất định."
3627 = "Rồi chúng tôi chậm rãi bò ra sân khấu rực rỡ, với tốc độ không có gì khác biệt so với thường ngày."
3629 = "Du lịch, suy cho cùng cũng chỉ là thứ không bền vững——Là những con người của một thành phố du lịch từng rơi vào cảnh khốn cùng, ai nấy đều hiểu rõ điều đó."
3649 = "Hibiki hừ mũi \"hừm\" một tiếng kiêu hãnh, rồi dùng mũi chân huých nhẹ vào chiếc túi đặt dưới ghế phụ lái cho tôi xem."
3650 = "Hibiki rướn hẳn người ra khỏi cửa sổ ghế phụ lái, hướng dẫn tôi thực hiện việc nối toa."
3652 = "Hibiki đang bộc bạch những nỗ lực của mình với chị Mayami. Chị Mayami thì nở nụ cười rạng rỡ khen ngợi con bé."
3654 = "Hibiki cầm \\x%lポーカー;#00ffc040;cây cời than%l;#; mở cửa buồng đốt, mạnh mẽ đâm nát đống than đang ở trạng thái \\x%l保火;#00ffc040;giữ lửa%l;#;."
3658 = "Hibiki thẹn thùng, cụp mắt nhìn xuống sàn. Cử chỉ trẻ con ấy ngược lại càng làm tôn lên vẻ nữ tính của con bé."
3659 = "Giọng của Hibiki. Giọng nói đầy xúc động."
3661 = "Hibiki tròn mắt nhìn trang phục của tôi. Trước khi làm nhiệm vụ——tất nhiên là tôi đang mặc đồ bảo hộ rồi."
3666 = "——Đúng rồi. Michiko, là một đứa trẻ như vậy."
3668 = "Đơn giản nhất, hiển nhiên nhất, quá đỗi bình thường. Thế nên đến tận cùng, tôi vẫn không thể nhớ ra điều quan trọng nhất."
3673 = "Đầu máy chính 8620. Đầu máy phụ phía sau D51 1031——đây là \\x%l編成;#00ffc040;đội hình%l;#; cơ bản."
3705 = "Khuôn mặt Paulette giãn ra vì nhẹ nhõm. Vậy thì, quả nhiên là như thế rồi."
3706 = "Paulette cúi gầm mặt xuống. Bờ vai cô ấy run lên bần bật."
3707 = "Paulette nhanh nhẹn dựng chân máy và chỉnh máy ảnh."
3708 = "Paulette bế Reina lên, và cứ thế đứng vào khung hình. Mọi người đều mỉm cười thật tự nhiên."
3709 = "Paulette chạy về phía cửa hàng đường sắt."
3710 = "Paulette nhìn tôi. Đôi mắt xanh ấy tràn ngập sự tin tưởng."
3711 = "Nói với nụ cười rạng rỡ, Paulette quay lưng lại với tôi, rồi rảo bước hòa vào dòng người trên sân ga."
3712 = "Paulette vươn ngón tay ra."
3720 = "Để làm vậy, tôi gạt \\x%lブレーキ;#00ffc040;phanh%l;#; sang \"vị trí lái\". Đưa \\x%l逆転機;#00ffc040;cần đảo chiều%l;#; vào \\x%l前進フルギア;#00ffc040;cài hết số tiến%l;#;, và đặt tay lên cần \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;#;."
3722 = "Dù ở đâu, dù lúc nào, con bé cũng luôn tìm thấy niềm vui và mỉm cười."
3723 = "Dù thế nào đi nữa, tôi cũng muốn cho tàu chạy."
3727 = "Với lòng biết ơn từ tận đáy lòng, tôi vuốt ve mái tóc mềm mại của con bé thỏa thích."
3728 = "Và rồi, \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; của 8620 chậm rãi bắt đầu quay. Bám chặt lấy đường ray, mạnh mẽ đưa chúng tôi về phía chân trời."
3731 = "Thế nhưng Fukami lại nở một nụ cười rạng rỡ, mạnh mẽ và nhẹ nhõm mà hồi mới quen tôi chưa từng thấy."
3737 = "Reina……hoàn toàn bình thường như mọi khi."
3739 = "Reina và Mikuro lẩm bẩm như thể bối rối, nhưng ngay khoảnh khắc tiếp theo, cả hai liền quay sang nhìn nhau với vẻ kinh ngạc."
3741 = "Chắc hẳn hai người họ đã từ buồng lái đuổi theo tôi."
3743 = "Đôi má của Reina ửng hồng phúng phính."
3744 = "Chỉ có chúng tôi, mới được phép bước vào đoạn đường ray phía trước."
3748 = "Tiễn đưa những người chuẩn bị khởi hành, chính là niềm tự hào, là công việc của tôi."
3750 = "Cho đến khi chuyến tàu Tân Cán Tuyến số 1 khởi hành. Nếu có thể, thì còn xa hơn thế nữa. Nhưng——"
3752 = "Trông cứ như đang làm hướng dẫn viên vậy—— hay nói đúng hơn, có lẽ nhóc ấy đang làm hướng dẫn viên thật."
3760 = "Để lại một nụ cười, chị Mayami rời khỏi buồng lái, bầu không khí lập tức trở nên căng thẳng."
3761 = "Chị Mayami đưa ngón tay lên xoa cằm."
3763 = "Một lúc im lặng. Rồi dần dần, từng người, từng người một bắt đầu gật đầu."
3773 = "Lời nói của Kisaki quá đỗi bất ngờ, khiến tôi vô thức lặp lại như một con vẹt."
3775 = "Kisaki vẫy tay nhẹ nhàng. Rồi cứ thế dứt khoát khuất bóng về phía \\x%l客車;#00ffc040;toa hành khách%l;#;."
3789 = "Ga cuối không phải là đích đến. Từ đó, một hành trình mới chắc chắn sẽ lại bắt đầu."
3796 = "Khi Mikuro bước vào với nụ cười trên môi, anh Nakamura dù còn bối rối cũng đã đứng cạnh Fukami và Nagi."
3797 = "\"Bạn cũ của ngài Mototada\" là một nhân vật giữ chức vụ khá quan trọng trong hệ thống giao thông của chính phủ Trung Quốc."
3800 = "Và trong ngày hôm nay, chỉ duy nhất một ngày hôm nay—— KiHa 07S sẽ được gắn ngay sau 8620 với vai trò đầu máy phụ phía trước."
3802 = "Và lấp đầy những khoảng trống với mật độ gấp hàng chục lần là những người già trẻ lớn bé đang cầm máy ảnh trên tay."
3803 = "Nơi mà Hibiki đã kết tinh xuất sắc những hy vọng của mọi người, đối với tôi, tôi cũng coi đó như là phòng khách của chính mình."
3806 = "Với cánh tay nhỏ bé này, cô ấy đã luôn bảo vệ Đường sắt Ohimitera—— Suy nghĩ ấy cứ thế biến thành lời nói."
3808 = "Và người tiến về phía này thay thế cô ấy là——"
3810 = "Người đó đã hoàn toàn chiến thắng trong cuộc bốc thăm, và trở thành hành khách trên chuyến tàu Nine Stars."
3812 = "Nghe giọng nói kinh ngạc của Reina, tôi mới nhận ra mình đang khóc."
3814 = "Fukami, đã nói trúng tim đen của Kisaki—— Chà, tôi thấm thía cảm nhận được con bé thực sự đã trưởng thành rồi."
3815 = "Trước câu nói của Reina, mọi người đều nở nụ cười rạng rỡ. Thế nên tôi có thể cảm nhận được. Có thể phác họa ra được."
3816 = "Vừa nhắc đến, Hibiki liền nở nụ cười gượng gạo."
3817 = "Vừa nói xong, giọng Paulette liền trở nên cuống quýt."
3820 = "So với nó, toa Remu 9100 hoàn toàn mờ nhạt, nhưng cũng giống như vậy, nó là trụ cột của Nine Stars và là biểu tượng của toàn Kyushu."
3830 = "Bị Fukami nãy giờ vẫn im lặng lắng nghe nói trúng tim đen, Kisaki bật cười."
3832 = "Một đôi giày rất thiết thực, dù có bị tia lửa bắn vào cũng không cháy, dẫm lên than đá sắc nhọn cũng không bị xuyên thủng."
3841 = "Tôi lớn tiếng giải thích cho Mikuro và anh Nakamura đang ngơ ngác không hiểu chuyện gì."
3844 = "Những nụ cười rạng rỡ, trong chớp mắt đã trôi về phía sau và hòa vào làn khói."
3854 = "Nào là váy của Fukami bị tốc lên khi đi thử, nào là Nagi suýt nữa thì ngã nhào."
3855 = "Khi nặn ra được rồi, những lời nói cứ thế tuôn rơi, tự nhiên trào ra như những giọt nước mắt."
3856 = "Nói rồi, đôi mắt xanh ấy dời khỏi tôi."
3859 = "Sau khi cài đặt hẹn giờ, Paulette chạy về phía chúng tôi."
3872 = "——Tiến vào trong ánh sáng, trong thứ ánh sáng trắng xóa chói lóa ấy."
3884 = "Vì tôi biết, Michiko nhất định sẽ tìm thấy những niềm vui mà tôi không thấy được, và chắc chắn, con bé sẽ cười——sẽ cười với tôi."
3886 = "Michiko dừng bước. Nhưng bố và mẹ thì cứ thế đi qua cổng soát vé."
3888 = "Michiko gật đầu với vẻ mặt như một người lớn. Và rồi tôi đã hiểu ra."
3889 = "Michiko là một nửa không thể thay thế của tôi——"
3890 = "Michiko nhẹ nhàng bước đi, chỉ một bước. Nhưng là một bước mà tôi không thể đuổi theo——tiến về phía cổng soát vé."
3893 = "Và rồi Michiko chạy về phía cổng soát vé."
3894 = "Michiko kinh ngạc, thốt lên một giọng điệu vô cùng bối rối."
3897 = "Michiko phồng má lên rồi lại cười khúc khích. Sau đó, con bé nhìn tôi bằng đôi mắt dịu dàng."
3903 = "Với sự nổi tiếng và nhộn nhịp thế này. Tôi đã nghĩ chuyện đó là không thể nào."
3914 = "Tất cả quá đỗi, quá đỗi giống như một giấc mơ——"
3915 = "Trong khoảnh khắc, tôi chợt nhớ lại. Ngày tôi trở về Ohimitera, và đánh thức Hachiroku——ngày hôm đó cũng giống hệt thế này."
3916 = "Sau khi rời Ohimitera một đoạn, chúng tôi sẽ chạy song song với đầu máy số 9 hướng về Yui trên tuyến Yui."
3917 = "Nhìn cảnh tượng đó, không hiểu sao tôi lại thấy ấm lòng. Một cảnh tượng rất đỗi bình thường, thường ngày của hai chị em."
3918 = "Thắt cà vạt bên ngoài đồ bảo hộ, sau khi làm nhiệm vụ xong, chắc chắn nó sẽ đen thui như cái giẻ lau tay cho xem."
3922 = "Và cả hôm nay, khi kéo chuyến tàu Nine Stars số 1 bằng đội hình kỷ niệm. Trách nhiệm vẫn luôn như vậy——cực kỳ to lớn."
3923 = "Chưa kịp suy nghĩ gì thì đã có khách đến. Vừa mở cánh cửa sắt của buồng lái ra, một nụ cười đã lao thẳng vào tôi!"
3924 = "Vậy thì như Hachiroku nói, việc tôi đứng thẫn thờ chắc cũng chỉ diễn ra trong chốc lát thôi."
3927 = "Đó sẽ là một phi vụ kinh doanh với quy mô lớn không thể đong đếm được."
3928 = "Hình ảnh chuyến tàu chạy tới tương lai, trên tuyến đường ray mà tôi sẽ trải dài."
3931 = "Đôi mắt xanh trong veo đã cứu tôi ngày hôm đó. Một lần nữa lại nhìn thẳng vào tôi——và nhìn thấu tâm can tôi."
3933 = "Đó có lẽ chỉ là sự ái kỷ trẻ con mà thôi. Nhưng cũng chính vì thế, tình cảm ấy lại rất thuần khiết và mãnh liệt."
3935 = "Toa xe mới được thiết kế hoàn toàn mới, đầu tiên ở Kyushu sau đợt Đại bãi bỏ các tuyến đường sắt."
3938 = "Khi kim đồng hồ đo áp suất hơi nước nhích dần lên, nhiệt độ phòng và nhiệt độ cơ thể tôi cũng tăng theo."
3941 = "Vẻ mặt trông có vẻ giận dữ, nhưng chắc không phải thật đâu, đôi má em ấy ửng hồng hạnh phúc kìa."
3942 = "Xét về mặt vận hành toa xe, thì không biết sẽ bị đánh giá thế nào đây——"
3943 = "Tôi cũng muốn hỏi ý kiến của nhóm Akai - Niiroku và nhóm Munakata - Olivy, nhưng trước tiên, cứ hỏi những người ở đây đã."
3944 = "Bức ảnh lưu niệm chính thức có lẽ sẽ được chụp cùng nhóm Akai - Niiroku và nhóm Munakata - Olivy——"
3946 = "Hiếm khi mọi người tụ tập đông đủ, và khí thế lại đang lên cao thế này."
3950 = "Bởi vì phòng bị hủy tình cờ lại là phòng \"Higo\". Vì trong những ý kiến được thu thập, có cả ý kiến của người dân địa phương——ý kiến của chúng tôi."
