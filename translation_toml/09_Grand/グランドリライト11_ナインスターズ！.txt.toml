3990 = "Nhóm toa hành khách dòng 90 sử dụng cửa sổ lớn cố định. Khi tàu đang chạy, hành khách không thể cảm nhận được gió nếu cứ ở trong phòng."
3991 = "Tôi bàn giao nhóm toa hành khách dòng 90, ba toa hành khách và một toa ăn, cùng với toa Remu 9100."
