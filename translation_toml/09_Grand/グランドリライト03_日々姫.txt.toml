1431 = "――Những suy nghĩ cứ thế đọng lại thành một câu nói."
1433 = "――Michiko và tôi, vẫn luôn kết nối với nhau. Dù đã xa cách đến nhường này, nhưng chắc chắn là vậy."
1441 = "『Chuyến tàu do chính tay chúng ta tạo ra』"
1450 = "……Trong lúc tôi đang suy nghĩ xem nên làm thế nào, Hibiki lấy máy tính bảng ra."
1452 = "……Có lo lắng về những chuyện không có câu trả lời thì cũng chẳng ích gì. Vừa hay, tôi cũng có mang theo tài liệu về nhà."
1453 = "……Một niềm vui âm ỉ dâng lên trong lòng."
1456 = "……Có vẻ tôi đã ngủ gật mất rồi. Michiko đang nhìn tôi với vẻ hơi buồn cười, như thể cạn lời."
1457 = "……Để lại cho tôi một bài toán khó, Hibiki liền đi tắm."
1468 = "「\\x%l機関助士;#00ffc040;Phụ lái tàu%l;#;―― Liệu em có thực sự làm được không.」"
1470 = "「――『Bản tin Buồng lái [ハチロクニイマル,3]8620』」"
1473 = "「――Có lẽ nào, họ không tìm thấy Michi không nhỉ.」"
1474 = "「――Vâng.」"
1475 = "「――Ví dụ thực tế về giải tỏa đất ở, cẩm nang bí quyết sao.」"
1477 = "「――Anh cũng phải giúp đỡ Hibiki một chút mới được. Làm như vậy cũng sẽ giúp chúng ta \"đối diện\" với nhau sâu sắc hơn.」"
1488 = "「『Cùng nhau hoàn thành một việc』 sẽ tạo ra một tinh thần đoàn kết mạnh mẽ. Điều đó có thể trở thành một trong những bước đệm cho việc khôi phục tuyến đường.」"
1491 = "「『Bản tin Buồng lái [ハチロク,3]8620!』 Tuyệt quá! Tuyệt lắm! Thật sự rất tuyệt luôn đó!」"
1493 = "「……」"
1504 = "「……Nhưng mà, Hibiki cũng bận rộn thật.」"
1506 = "「……Nhưng mà, trễ quá rồi. Hibiki còn có hẹn với đối tác nữa. Không lẽ em ấy định đi trễ sao.」"
1507 = "「……Ưm…… ưm.」"
1509 = "「……Hừm. Trong số này, điều mà chúng ta có thể tiếp cận dễ dàng nhất lúc này, là về mặt tâm lý nhỉ.」"
1512 = "「……Anh không biết diễn đạt sao cho hay, nhưng nó là việc tổng hợp hình ảnh muốn truyền tải thành một hình thức dễ hiểu―― một công việc như vậy chăng.」"
1515 = "「……Thế nên, trong lúc em đi học, anh vẫn tham gia huấn luyện nghiệp vụ sao?」"
1519 = "「……Không sao đâu. Bố mẹ vẫn đang tiếp tục tìm kiếm mà. Chỉ là, anh―― chưa truyền đạt được rõ ràng thôi.」"
1523 = "「……Lược bỏ, hay nhấn mạnh. Không phải là 『chính xác』, mà là 『dễ nhìn, dễ hiểu』 mới là điều quan trọng, anh nghĩ vậy.」"
1525 = "「……Bản đồ minh họa tham quan tuyến đường sắt phế tích cũ Ohitera - Yatsushiro ――Nghe thế này thì có vẻ hơi quá lộ liễu nhỉ.」"
1879 = "「Được chứ. Không hề đơn giản, nhưng nếu là Hibiki thì chắc chắn làm được. Nếu thấy bất an, em có muốn thử lên \\x%lキャブ;#00ffc040;buồng lái%l;#; một chút không?」"
1882 = "「Không――」"
1884 = "「Không phải! Không được đâu! Sẽ bị kéo đi mất đấy.」"
1886 = "「Không phải là định―― mà là muốn. Lúc đó, em đã nghĩ rằng mình tự mình muốn lên tàu.」"
1888 = "「Không cần vội đâu. Anh cũng sẽ thay đồ. Anh sẽ chải chuốt gọn gàng để không làm vướng chân Hibiki.」"
1890 = "「Không được đâu! Anh Soutetsu! Sẽ bị rơi xuống đấy!!」"
1897 = "「Nhưng mà, em sẽ thay đồ đúng không? Tuy anh nghĩ đồng phục cũng được coi là lễ phục của học sinh, nhưng――」"
1898 = "「Nhưng mà, chỉ cần thay đổi phông chữ, kích thước, độ đậm nhạt của chữ, cân bằng lại và điều chỉnh khoảng cách giữa các chữ thôi thì――」"
1899 = "「Nhưng mà nhé? Anh Soutetsu. Cả mẹ và bố, đều không đến đón Michi đâu?」"
1900 = "「Chính vì chỉ là pha trà nên anh mới muốn pha cho em. Cũng là để tán thưởng Hibiki của ngày hôm nay nữa.」"
1901 = "「Nhưng mà, chuyên gia đó đã thông báo rằng \"Quá khó khăn nên sẽ không nhúng tay vào\". Nếu vậy thì phải làm sao?」"
1902 = "「Nhưng mà? Sao thế?」"
1904 = "「Không, với tính cách của Hibiki thì. Chắc lại được nhờ vả gì đó ở học viện―― Hoặc đơn giản là đang nói chuyện với Kisaki thôi.」"
1906 = "「Không, anh chỉ hơi sặc thôi. Nhưng mà, pha trà đi.」"
1907 = "「Ư, ưm!? Không có, không có gì đâu!?」"
1912 = "「Để anh đợi lâu rồi! Cái này, em định tặng cho anh hai.」"
1914 = "「Để anh đợi lâu rồi, ủa? Anh hai, anh không định thay đồ sao?」"
1917 = "「Không cảm thấy gì, là sao?」"
1920 = "「Khi để ý kỹ, anh thấy em mặc đồng phục đẹp lắm. Nói sao nhỉ, nó làm nổi bật vẻ nữ sinh của em.」"
1930 = "「Nhưng mà―― nếu ý tưởng này, ví dụ như…… dành cho tiệm bán chăn nệm thì em sẽ phản đối.」"
1935 = "「Hibiki đã học được từ anh mà đúng không? Khi điều muốn truyền tải trong thiết kế quá phức tạp, em sẽ làm gì?」"
1936 = "「Anh hỏi phải làm sao thì…… dù có hỏi em…… Vấn đề này hơi quá lớn nên――」"
1937 = "「Giỏi thật đấy, Hibiki. Anh cứ nghĩ nếu có chuyện gì, thì anh sẽ giúp đỡ em một chút cơ.」"
1940 = "「Sao thế Hibiki?」"
1941 = "「Trông sống động và đáng yêu lắm mà. Xóa đi thì hơi uổng đấy.」"
1944 = "「Anh đã phải chờ em lâu lắm sao? Em đã vội vàng chạy về ngay rồi mà――」"
1946 = "「Hibiki muốn tổng hợp lại phương án lúc nãy đúng không? Để em tập trung, anh sẽ đi pha trà.」"
1950 = "「Chúng ta hãy quyết định làm 『Bản đồ minh họa lưu vực sông Kuma』 nhé. Anh sẽ bàn bạc với Fukami, và nhờ đặt nó ở bến thuyền luôn.」"
1965 = "「Hachiroku đã……」"
1967 = "「Có chuyện gì sao ạ?」"
1968 = "「Đến nơi rồi! A, không có ai ở đây cả? Ưm…… không có ai nhỉ.」"
1971 = "「Nếu anh hiểu đúng lời giải thích của Hibiki thì là vậy. Làm sao để xem lại ảnh?」"
1972 = "「Cứ giao cho em!」"
1973 = "「Nhưng mà―― nếu là ngành thiết kế, thì sẽ không chỉ cạnh tranh bằng tài năng vẽ vời nữa.」"
1975 = "「Ra là vậy―― Nghe cô nói mới thấy đúng thật.」"
1976 = "「Ra là vậy.」"
1984 = "「Chỉ là do ngài Soutetsu quá mù mờ thôi ạ.」"
1986 = "「Được sao ạ!? A―― nhưng mà.」"
1988 = "「Nhưng mà, mặc thế thì không làm việc được đâu. Nó cứ tạo ra cái không khí kiểu như được nuông chiều ấy.」"
1995 = "「Kyaaa! Xóa đi xóa đi xóa đi xóa đi! Em đang há hốc mồm vì ngạc nhiên kìa!」"
1996 = "「Hya!?」"
1998 = "「A!? Anh vừa chụp em đấy à!!?」"
2000 = "「Ủa? Anh hai, chỉ có chừng này vest thôi sao?」"
2001 = "「Oa!」"
2003 = "「Oa, áo sơ mi nhiều thật đấy. Cà vạt cũng vậy―― tuy hiếm khi thấy anh thắt nhưng cũng có khá nhiều nhỉ.」"
2004 = "「Hau!」"
2005 = "「Hau!?」"
2006 = "「E…… he.」"
2008 = "「Ể, chuyện đó, em hoàn toàààn không biết luôn đấy.」"
2010 = "「Ehehe! Vui quá! Bức ảnh đầu tiên anh hai chụp bằng chiếc máy ảnh đó, lại là em!」"
2011 = "「Hả!?」"
2013 = "「Hả!? Chuyện đó―― ưm―― chuyện đó là―― Tất nhiên là vì em thấy anh trai đang rất khó khăn rồi ạ.」"
2015 = "「Hả? Làm như vậy là―― làm gì cơ? Làm cái gì?」"
2017 = "「Đến tận ga cuối cùng―― chuyến hành trình của, anh trai.」"
2019 = "「À―― phải rồi. Nếu cả anh và bố nuôi đều đi vắng, thì trong nhà Migita làm gì có ai bàn về chủ đề trang phục nam giới cơ chứ.」"
2021 = "「Ồ, nhanh thật đấy. Đúng hơn là, ừm. Thực sự rất hợp với em.」"
2022 = "「Uo!?」"
2023 = "「A.」"
2025 = "「A――…… vâng. Anh nói mới nhớ.」"
2026 = "「A―― vâng. Nhắc mới nhớ……」"
2028 = "「A, vâng.」"
2029 = "「A, có vẻ hơi nhám nhám nhỉ. Cao cấp hơn cả áo blouse của em sao?」"
2031 = "「Oa―― cảm ơn anh. Nhưng mà, chỉ pha trà thôi thì để em」"
2033 = "「A.」"
2034 = "「À――」"
2035 = "「A!」"
2037 = "「A! Anh nói mới nhớ―― Về chuyện đường sắt, cả anh hai và em.」"
2039 = "「A! Đúng rồi! Ừ! Thời gian!!」"
2041 = "「!? Một món đồ quan trọng như vậy―― có được không?」"
2043 = "「A, đợi em một chút nhé?」"
2045 = "「A, anh nhấn vào cái nút hình tam giác màu xanh lá cây này.」"
2047 = "「À, đúng rồi! Những người ở Đường sắt Mikan―― không chỉ vậy, nếu chúng ta có thể thu thập được cả tiếng nói của những người dân sống dọc tuyến đường từ Yatsushiro đến Ohitera nữa thì.」"
2050 = "「Anh bị đau họng sao!? Em đi pha trà đây!」"
2051 = "「À――」"
2052 = "「À―― ra là vậy. Là việc suy nghĩ xem nên làm thế nào để hoàn thành những việc cần làm sao.」"
2054 = "「Ưm―― a――」"
2055 = "「Ưm…… bánh gạo…… trong hộp thiếc……」"
2057 = "「Dạ…… để giải tỏa những khu đất đã được phân lô bán nền, thì vấn đề lớn nhất là gì――」"
2060 = "「Ừm. Ngày xưa anh cũng mua áo sơ mi của các hãng khác, nhưng chúng rất mau hỏng, nên bây giờ tất cả đều là của OHITOYO.」"
2061 = "「Ừ. Trông anh thế này thôi chứ anh đang là thực tập sinh của một đại lý phân phối rượu đấy.」"
2064 = "「Vâng. Cả em, chị hai và Hachiroku đều nghĩ rằng chỉ còn cách đó thôi.」"
2066 = "「Vâng. Vì thế, trong thiết kế, nếu không suy nghĩ kỹ xem 『muốn truyền tải điều gì』, thì dù vẽ đẹp đến đâu cũng vô dụng.」"
2067 = "「Ừm. Thì cũng.」"
2069 = "「Vâng. Rất phù hợp với ấn tượng về một tiệm giặt ủi. Thế nên em mới tán thành ý tưởng này.」"
2071 = "「Vâng. Dù chỉ là đồ rẻ tiền thôi, nhưng là món đồ em mua bằng số tiền đầu tiên kiếm được từ công việc thiết kế đấy.」"
2072 = "「Ừm.」"
2073 = "「Vâng!」"
2075 = "「Vâng! Ngày nay, những nhà thiết kế hầu như không biết vẽ cũng không hề hiếm đâu.」"
2077 = "「Vâng! Nếu là chị Paulette thì có vẻ sẽ mang hơi hướm của người đam mê đường sắt, nhưng góc nhìn của anh hai thì―― đúng như anh hai vừa nói lúc nãy.」"
2079 = "「A! Đúng rồi! Sông Kuma!!!」"
2081 = "「Vâng! Em nghĩ ý tưởng đó rất tuyệt vời.」"
2082 = "「Vâng!!」"
2083 = "「À thì, kết quả là thành ra như vậy thôi.」"
2086 = "「À, có lý thật. Chủ đề này hướng đến những người đam mê đường sắt quá, sẽ trở thành một thứ mà người dân bình thường chẳng buồn cầm lên xem sao.」"
2089 = "「Vâng. Anh hai lúc nào cũng làm như vậy. Mỗi khi được bố hay ai đó giao cho việc gì.」"
2090 = "「Vâng. Em sẽ cố gắng. Vì em vẫn muốn kiếm sống bằng nghề vẽ mà.」"
2092 = "「Vâng, vẫn chưa. Người đến thăm em, chỉ có mỗi anh Soutetsu thôi. Mà hôm nay, anh Soutetsu cũng sẽ về ngay nữa chứ.」"
2093 = "「Hừm?」"
2094 = "「Hừm? Chất lượng khác biệt đến thế sao?」"
2096 = "「Ufufu.」"
2097 = "「À――」"
2098 = "「Ồ―― ấn tượng thay đổi khá nhiều đấy.」"
2100 = "「Ồ!」"
2103 = "「Nếu muốn nhấn mạnh tiệm bán chăn nệm, thì phải tạo ấn tượng về sự ấm áp, hay sự bao bọc. Điều đó hoàn toàn trái ngược với gương.」"
2104 = "「Vì em muốn ở bên cạnh anh hai. Cùng với anh hai―― chắc chắn, em đã muốn thử cùng anh lăn bánh.」"
2105 = "「Việc lắp ráp và tinh chỉnh độ chính xác đó còn quan trọng hơn cả kỹ thuật vẽ tranh trong thiết kế――」"
2108 = "「Tương tự như vậy, các doanh nghiệp kinh doanh thuyền xuôi dòng hay chèo thuyền vượt thác―― Không chỉ vậy, còn có rất nhiều doanh nghiệp khác gắn liền với sông Kuma.」"
2116 = "「Chà! Đây là logo rồi còn gì. Chỉ trong chớp mắt đã tạo ra một thiết kế rồi.」"
2118 = "「Bình thường của mình…… nói thế thì―― Đến nơi làm việc mà không thắt cà vạt thì có ổn không nhỉ.」"
2119 = "「Có vẻ thú vị đấy! Em muốn thử làm!! ――Nhưng mà」"
2121 = "「Thôi, phần thời gian đó để bù vào lúc sau cũng được. Hôm nay anh sẽ dành trọn vẹn cả ngày để đối diện với Hibiki mà.」"
2124 = "「Nếu tất cả những nơi đó đều đồng ý hợp tác―― Nếu họ đồng ý đặt bản đồ minh họa của chúng ta!」"
2126 = "「Ra vậy, nếu anh cứ đợi em ở nhà ga, thì chúng ta đã có nhiều thời gian hơn để đối diện với nhau rồi.」"
2129 = "「Nếu là chuyện đó thì, ngài Soutetsu.」"
2130 = "「Nếu được vậy thì, còn gì bằng―― (Khụ)」"
2132 = "「Những bức ảnh của anh hai nữa―― nếu có thêm chuyên mục của Hachiroku hay bé Reina, em cá là chắc chắn sẽ được đón nhận nồng nhiệt luôn.」"
2138 = "「Houshou Mototada đã nói. Điều khiến việc đền bù giải tỏa đất trên tuyến Ohitera - Yatsushiro trở nên khó khăn là do đất ở đã được phân lô bán nền.」"
2142 = "「Thấy chưa? Thực tế thì, dù hoàààn toàn không biết vẽ, nhưng ở mức độ này thì ai cũng có thể thiết kế được.」"
2143 = "「Đúng rồi. Lần này cũng cứ làm như vậy là được.」"
2144 = "「Đúng! Chỗ đó!! Hoàn toàn chính xác! Dù không bắt buộc, nhưng nếu biết vẽ thì đó là một lợi thế áp đảo――」"
2147 = "「Anh Soutetsu, có chuyện gì vui à? Trông mặt anh nhẹ nhõm lắm.」"
2148 = "「Anh Soutetsu?」"
2150 = "「Lúc đó, em sẽ phân tách thành từng yếu tố một―― a.」"
2151 = "「Đúng rồi nhỉ! Trong lúc từ ga về nhà, hai đứa mình cũng có thể nói chuyện với nhau mà~」"
2154 = "「Vẽ đẹp như Hibiki mà kiếm sống bằng nghề vẽ vẫn khó khăn vậy sao?」"
2156 = "「Hãy làm như vậy đi. Chúng ta hãy chia nhỏ vấn đề ra cho đến mức độ mà chúng ta có thể giải quyết được.」"
2168 = "「Phạm vi rộng hơn là…… từ thành phố Ohitera đến tận thành phố Yatsushiro á, dù nói thế nào thì cũng rộng quá mức rồi.」"
2170 = "「Đơn giản lắm! Đây là nút chụp, anh nhấn nhẹ một nửa. Máy sẽ kêu tít tít tít, lúc đó anh nhấn hết cỡ luôn.」"
2175 = "「Có chuyện gì vậy? Navi.」"
2176 = "「Làm gì có chuyện đó. Anh đâu có ngốc đến mức ấy.」"
2178 = "「Ngài đang phân vân về điều gì của trang phục ạ?」"
2179 = "「Làm sao để lưu lại?」"
2182 = "「Chắc là, nếu muốn làm họa sĩ minh họa thì trong số những người muốn làm... Chắc chỉ có một trong một vạn người mới có thể làm nghề này chuyên nghiệp thôi.」"
2187 = "「Em có cảm giác nó khá giống nhau. ――Có lẽ là rất gần với cảm giác đó đấy.」"
2189 = "「Em…… vẫn chưa, nhận được công việc nào từ bên ngoài thành phố Ohitera cả.」"
2191 = "「Một mình em thì không làm được đâu. Em vẫn chưa biết gì về tàu hỏa cả. Nhưng―― em muốn làm. Vừa làm vừa học hỏi từ mọi người.」"
2193 = "「Anh không biết mình có nói chuyện được với bố mẹ hay không. Nhưng―― anh nghĩ dù chỉ là từ một phía, anh cũng đã truyền đạt được nhiều điều.」"
2195 = "「Được em nói vậy, anh cũng rất vui. Anh rất sẵn lòng nhận công việc chào hàng này.」"
2197 = "「Em cũng muốn được nhìn thấy mà. Xem đôi mắt của anh hai đang nhìn thấy những cảnh sắc như thế nào.」"
2200 = "「Hãy cùng đi gặp người đã dạy cho chúng ta biết sức hấp dẫn và niềm vui của đường sắt―― 8620, chỉ có hai chúng ta thôi.」"
2201 = "「Của bọn anh sao?」"
2202 = "「Đúng hơn là, anh nghĩ đây chính là việc mà chúng ta phù hợp nhất để làm. Hãy thử nhớ lại chúng ta của một thời gian trước xem.」"
2205 = "「Anh vừa đi viếng mộ về. Mộ của bố, và mẹ.」"
2207 = "「Anh, sao?」"
2208 = "「Em về rồi đây!」"
2209 = "「Anh về rồi đây. ――Hửm? Hibiki vẫn còn ở học viện sao.」"
2213 = "「Anh thì, hầu như chẳng làm được gì cả.」"
2215 = "「Vui quá! Em đã luôôôn muốn thử phối đồ cho anh hai từ lâu rồi!」"
2218 = "「Em cứ có cảm giác anh mặc nhiều loại đa dạng hơn cơ.」"
2219 = "「Anh muốn đi đến tận ga cuối cùng. Đó là―― mong muốn mãnh liệt nhất của anh về đường sắt.」"
2221 = "「Chắc là vậy rồi.」"
2223 = "「Anh đã nghĩ ra một cái tên.」"
2224 = "「Chuyện đó, em sẽ để dành làm niềm vui khi được dạy bảo đàng hoàng. Bây giờ―― em muốn tìm ra những thứ cần phải nhìn thấy ngay lúc này.」"
2226 = "「Anh muốn nhờ Hibiki thiết kế chuyến tàu đó.」"
2229 = "「Là chúng ta, đối với vấn đề của chúng ta. Tức là về sự khó khăn trong việc đền bù giải tỏa đất để khôi phục tuyến đường ấy.」"
2230 = "「Thì là―― thì là nhé?」"
2233 = "「Em muốn biến nó thành như vậy nên mới cố gắng! Người như em thì vẫn còn kém cỏi lắm.」"
2235 = "「Anh đã giúp được gì cơ?」"
2236 = "「Nếu làm được như vậy thì đúng là lý tưởng thật. Nhưng quả thực, chuyện đó thì hơi khó.」"
2238 = "「Điều anh mơ ước và khao khát, chỉ là một chuyến du lịch hạnh phúc của gia đình. Một chuyến tàu du lịch an toàn, ấm áp, ôm trọn lấy cả gia đình.」"
2240 = "「Em biết chứ! Rằng anh được đánh giá cao đến mức bố dù có làm cách nào cũng không muốn buông tay!」"
2241 = "「Một ý kiến tuyệt vời. Cô có vẻ còn sành sỏi sự đời hơn cả tôi đấy.」"
2243 = "「Này Michiko, cửa sổ của chuyến tàu này, có thể mở ra không.」"
2246 = "「Cũng không hẳn là tủ quần áo đâu.」"
2248 = "「Vì vậy, trước tiên hãy xác nhận trang phục của Hibiki. Sau đó, ngài và Hibiki cùng nhau chọn trang phục cho ngài thì sao ạ?」"
2249 = "「Vì thế. Em sẽ thay đồ! Em đi tắm nhanh rồi ra ngay.」"
2252 = "「Vì vậy, anh muốn thể hiện thực lực của Hibiki bằng một thứ gì đó miễn phí. Một thứ gì đó có sức hút với lĩnh vực đường sắt, công cộng và lưu vực sông Kuma.」"
2254 = "「Vì thế. Ngay từ đầu em đã không hướng đến con đường đó rồi. Em chỉ cần cả đời được vẽ là đủ rồi.」"
2256 = "「Thế nên, cứ bình thườờờng thôi! Chính xác là một anh hai như thường ngày, xin anh đấy!」"
2258 = "「Vì thế nên anh hai mới về sớm hơn nhỉ. Em cứ nghĩ ít nhất cũng có thời gian đi tắm cơ đấy.」"
2260 = "「Vì thế! Tất nhiên là em cực kỳ hoan nghênh!! Nếu được anh hai đi chào hàng giúp, em sẽ càng, càààng cố gắng hơn nữa!」"
2263 = "「Thời gian cuộc hẹn, liệu có ổn không ạ?」"
2264 = "「Định lên tàu làm việc――」"
2266 = "「Sắp xếp lại những điều muốn truyền tải. Hình ảnh hóa chúng. Suy nghĩ xem chất liệu nào là tốt nhất để truyền tải những điều đó.」"
2268 = "「Nếu vậy, trước hết chúng ta hãy giới thiệu về 8620. Truyền tải nguyên vẹn sức hấp dẫn đã thu hút chúng ta.」"
2270 = "「Nếu nói là \"đối diện\" thì, ngay cả những chuyện của em ở học viện, em cũng muốn được anh hai nhìn thấy nữa cơ.」"
2282 = "「Hibiki bảo tôi cứ mặc như bình thường là được…… Nhưng tôi e là đến nơi làm việc của Hibiki mà không thắt cà vạt thì hơi thất lễ.」"
2285 = "「Tại sao Hibiki lại ứng cử làm \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; vậy?」"
2287 = "「Hibiki thực sự rất cố gắng nhỉ.」"
2289 = "「Chào mừng em về nhà, Hibiki. Và, anh về rồi đây.」"
2290 = "「Hibiki. Cho anh mượn bút và giấy được không?」"
2293 = "「Rõ ràng là còn rất nhiều cách khác, tại sao em lại nghĩ đến việc tự mình lên tàu làm việc?」"
2300 = "「À――」"
2301 = "「À―― ừm.」"
2303 = "「Vậy sao―― anh cũng, đang mong chờ điều đó.」"
2304 = "「Đúng vậy. Đúng hơn là――」"
2306 = "「Đúng vậy. Màu xám, màu xanh dương, màu xanh đen kẻ sọc mờ―― Mỗi màu một bộ một hàng khuy, và một bộ màu đen hai hàng khuy dùng làm lễ phục.」"
2307 = "「Đúng vậy nhỉ. Một chuyến tàu như thế nào thì mới tốt đây. Từ giờ chúng ta hãy cùng nhau tìm kiếm điều đó nhé.」"
2310 = "「Đúng vậy. Cũng cùng một ý nghĩa cả thôi. Với con người thường ngày của anh, anh phải đối diện với một Hibiki thường ngày―― à, không.」"
2311 = "「Đúng vậy.」"
2312 = "「A!」"
2313 = "「Vậy sao. ――Vẫn chưa à.」"
2314 = "「Vậy sao. Được em nghĩ như vậy, anh rất vinh hạnh.」"
2315 = "「Vậy sao. Nếu vậy, anh nhờ em được không?」"
2316 = "「Vậy sao. Nếu được vậy thì tốt quá. Nhưng―― Nếu vậy thì khả năng vẽ vời là cần thiết chứ nhỉ?」"
2317 = "「Vậy sao?」"
2318 = "「Vậy sao? Điều đó―― thành thật mà nói, khá bất ngờ đấy.」"
2320 = "「Áo sơ mi của Ohitera sao?」"
2321 = "「Ừ.」"
2327 = "「Đúng hơn là, những người muốn cầm tấm bản đồ đó đi tham quan, thì ngay từ đầu họ đã ủng hộ việc khôi phục tuyến đường rồi mà.」"
2328 = "「Khả năng vẽ vời sẽ trở thành một lợi thế đúng không? Bởi vì em có thể tự tạo ra tài nguyên cho mình.」"
2330 = "「Chỉ có một điểm khác với thường ngày. Hachiroku đã bảo, 『Không được trễ hẹn đâu ạ』, và cho anh về sớm đấy.」"
2331 = "「Tôi muốn hỏi ý kiến Navi một chút. Về trang phục khi đi cùng Hibiki đến nơi làm việc.」"
2334 = "「Có bánh kẹo ăn kèm không?」"
2337 = "「Báo của học viện, em cũng từng tham gia giúp đỡ rồi―― Nếu là làm báo, em có tự tin, em nghĩ mình làm được.」"
2342 = "「Chào mừng em về nhà, Hibiki, và, anh về rồi đây.」"
2343 = "「Chào mừng anh về nhà, anh hai!」"
2345 = "「Tất cả mọi người, cùng nhau, và mỗi người, đều có thể tận hưởng niềm vui của chuyến du lịch bằng đường sắt.」"
2347 = "「Cảm thấy căng thẳng hẳn lên nhỉ.」"
2348 = "「Chỗ ở của Michi á?」"
2349 = "「Làm gì có chuyện đó! Anh đã giúp đỡ em rấttt nhiều mà!」"
2350 = "「Đúng vậy. Chúng ta từng căm ghét nó, và cũng từng chẳng quan tâm đến nó. Cảm giác đó, với những người bị yêu cầu chuyển nhà vì việc khôi phục tuyến đường」"
2351 = "「Đúng rồi! Hoàn toàn chính xác!! Anh hai quả nhiên có năng khiếu về mảng này đấy!」"
2352 = "「Đúng vậy, biển hiệu bằng gương.」"
2358 = "「Sự giới thiệu của Fukami sẽ là sức mạnh để mở rộng mạng lưới quan hệ đấy. Nếu thế vẫn chưa đủ―― thì, để anh đi chào hàng cho, nếu em thấy ổn.」"
2360 = "「Bất ngờ chỗ nào ạ?」"
2361 = "「Tại sao?」"
2366 = "「Rồi…… nếu thêm hình minh họa tàu hỏa tìm được trên mạng với từ khóa 『Tài nguyên miễn phí Đường sắt』 vào nữa thì!」"
2367 = "「Rồi, nhấn hết cỡ.」"
2372 = "「Mẹ và bố. Về chuyện của Michi――」"
2373 = "「Có bố, có mẹ, và những đứa trẻ. Chắc chắn là có cả ông, cả bà đi cùng nữa.」"
2377 = "「Bây giờ có rất nhiều phần mềm và tài nguyên tiện lợi mà. Ví dụ nhé―― Dòng chữ 『Đường sắt Ohitera』.」"
2380 = "「Bình thường thôi là được rồi ạ!?」"
2381 = "「Được chứ ạ? Bây giờ em toàn chụp ảnh bằng máy tính bảng thôi. Hơn nữa」"
2382 = "「Tất nhiên rồi ạ!」"
2383 = "「Tất nhiên rồi!! Nói một cách đơn giản nhất thì, chỉ cần anh hai ở bên cạnh là em đã thấy yên tâm rồi.」"
2385 = "「Khắt khe thật. Điểm đó cũng rất giống con người đấy.」"
2386 = "「Hiếm thấy thật đấy! Anh hai mà lại ngủ gật cơ.」"
2392 = "「Anh biết rồi.」"
2396 = "「Đúng thật…… Có vẻ dễ tiếp cận hơn những vấn đề khác.」"
2400 = "「Trước tiên là chuyện của Michiko. Rằng Michiko đang đợi bố mẹ trên chuyến tàu này.」"
2402 = "「Trước tiên, chúng ta nên thực hiện một bước đệm trước bản đồ minh họa nhỉ. Đột nhiên nhảy vào nói chuyện công việc có thù lao thì chỉ tổ bị đuổi khéo thôi.」"
2404 = "「Chuyện vui…… thì anh cũng không chắc nữa, nhưng mà.」"
2415 = "「Hơn nữa, khả năng vẽ vời cần thiết cũng không chỉ giới hạn ở 『Kỹ thuật hội họa cao siêu』 nữa.」"
2416 = "「Hơn nữa?」"
2418 = "「Đó là những việc mà anh hai vẫn luôn làm. Em đã bắt chước theo―― và học được từ đó.」"
2419 = "「Em nghĩ càng có nhiều ý kiến càng tốt. Đường sắt Ohitera―― À không, không chỉ những người ở Ohitera đâu.」"
2421 = "「Công việc của em, lại được anh hai nhìn thấy―― Tuy có hơi xấu hổ một chút, nhưng em vui gấp mấy lần luôn đó!」"
2428 = "「Bị kéo đi? ――っ!?」"
2431 = "「Đương nhiên, việc bồi thường thỏa đáng là điều kiện tối thiểu, nhưng dù có như vậy đi chăng nữa……」"
2432 = "「Áo sơ mi thì ở bên này.」"
2434 = "「Nếu anh hai ăn mặc quá chải chuốt, thì ngược lại, em sẽ bị nhìn nhận như một đứa trẻ con mất.」"
2437 = "「Thiết kế là phương tiện để đạt được điều đó sao?」"
2438 = "「Mà này, anh hai―― Hoàn toàn, không cảm thấy gì sao?」"
2439 = "「Cảm ơn anh…… anh hai. Vậy thì, em xin nhận lòng tốt của anh ạ.」"
2440 = "「Nếu là vì anh thì anh rất biết ơn. Nhưng―― nếu chỉ để giúp đỡ, thì chắc chắn còn rất nhiều cách khác mà đúng không?」"
2441 = "「Trên chuyến tàu do đứa trẻ này―― 8620 kéo. Chuyến tàu do anh trai, em và Hachiroku cùng nhau vận hành.」"
2447 = "「Đi thôi? Anh hai! Hãy chỉ cho em biết thêm thật nhiều những điều tốt đẹp phản chiếu trong đôi mắt của anh hai nhé!」"
2450 = "「Đi thôi? Đến phòng anh hai. Phải xem trong tủ quần áo có gì thì mới phối đồ được chứ!」"
2469 = "「Vì sao à…… Công việc thiết kế là……」"
2470 = "「Cái này―― trông rất được đấy chứ? Gương tạo cảm giác rộng rãi, và anh nghĩ nó làm tăng thêm cảm giác sạch sẽ.」"
2471 = "「Đó cũng là sự thật mà chúng ta đã nắm được. Vì vậy, chúng ta đã quyết định không còn cách nào khác ngoài việc giao phó cho các chuyên gia.」"
2472 = "「Cứ nhận đi. Bao nhiêu cũng được.」"
2473 = "「Đây là―― máy ảnh sao.」"
2474 = "「Bản phác thảo ý tưởng sao. Của tiệm giặt ủi lúc nãy nhỉ.」"
2475 = "「Về [ハチロクニイマル,3]8620. Anh―― Đây là lần đầu tiên hai anh em mình cùng nhau ngắm nó nhỉ.」"
2476 = "「Nếu làm thế, anh sẽ tự lừa dối chính mình. Với một thân phận giả mạo, anh sẽ không thể thẳng thắn đối diện với Hibiki được.」"
2477 = "「Vậy sao…… Nếu ông ấy đánh giá anh là kẻ vô dụng, thì đã chẳng có cái giao kèo bắt anh về làm ở tiệm rượu khi không ngăn chặn được việc mời gọi nhà máy rồi.」"
2478 = "「Ra vậy. Còn kết hợp với áo sơ mi các kiểu nữa chứ.」"
2479 = "「Vậy ạ.」"
2480 = "「Vậy sao, thế thì nhờ em nhé.」"
2481 = "「Vậy sao, trùng hợp thật. Anh cũng định mặc sao cho hợp với Hibiki đấy.」"
2482 = "「Thế lại càng tiện. Chúng ta có thể thong thả ngắm nhìn.」"
2483 = "「Nếu cứ để thế này thì nó chỉ là thông tin văn bản thôi đúng không.」"
2484 = "「Nghe em nói vậy, anh cũng mới nhận ra điều đó sau khi lên Đế đô. Không chừng, những chuyện như vậy lại thường xuyên xảy ra cũng nên.」"
2485 = "「Thật sao ạ? Ufufu, Được anh khen, em vui lắm!」"
2486 = "「Khắc nghiệt đến thế sao.」"
2491 = "「Mà này, chiếc áo sơ mi này cũng là của OHITOYO sao?」"
2492 = "「Dạ…… dạ, để sau đi. Sau này khi nào đầy thẻ nhớ, em sẽ làm cho.」"
2493 = "「Vậy thì, hãy củng cố hình ảnh đó nào. Chúng ta hãy tự mình tìm ra những điểm cần truyền tải.」"
2494 = "「Nếu vậy thì là báo! Em nghĩ làm báo là hợp lý nhất. Một tờ báo miễn phí. Dù là báo giấy hay báo mạng, chúng ta sẽ phát miễn phí.」"
2496 = "「Ý kiến hay đấy. Sử dụng thật nhiều tranh vẽ của Hibiki. Một trang báo thể hiện gu thẩm mỹ của Hibiki qua cả bố cục và logo.」"
2498 = "「Vậy thì, cùng làm thôi.」"
2501 = "「Nếu vậy thì, anh xin nhận mà không khách sáo nhé. Xin lỗi, em có thể dạy anh cách sử dụng được không?」"
2503 = "「Vì tất cả đều là vest ba mảnh mà. Chỉ cần thay đổi cách phối hợp, ấn tượng cũng sẽ khác đi khá nhiều.」"
2504 = "「Nếu vậy thì―― tấm bản đồ đó thì sao. Bản đồ minh họa thành phố Ohitera ấy. Chúng ta làm nó ở một phạm vi rộng hơn.」"
2505 = "「Vậy thì anh hai, đang đợi em thay đồ―― ưm, Anh đã đợi em thay đồ xong sao?」"
2506 = "「Anh Soutetsu đã truyền đạt điều gì vậy?」"
2510 = "「Điều quan trọng không phải là trang phục của bản thân ngài Soutetsu, mà là sự hài hòa với trang phục của Hibiki, chẳng phải vậy sao ạ.」"
2513 = "「Anh hai―― ưm―― Em nghĩ chắc chắn anh trai sẽ mặc vest, nên em đã thử phối đồ cho hợp với anh.」"
2515 = "「Anh hai, đi chào hàng cho em á!?」"
2516 = "「Quả nhiên anh hai hiểu được bản chất của thiết kế!!」"
2519 = "「Anh hai! Nhanh lên!!」"
2520 = "「Anh hai! Anh hai!」"
2521 = "「Anh hai, em về rồi đây! Chào mừng anh về nhà.」"
2523 = "「Anh hai?」"
2524 = "「Sông Kuma!」"
2526 = "「Ngài Soutetsu.」"
2527 = "「Ngài đang gặp khó khăn sao. Ngài Soutetsu.」"
2530 = "「Khó sao ạ? Anh hai mà mặc đồng phục học viện trà trộn vào, thì hoàn toàn có thể qua mặt được mọi người với tư cách học sinh đấy?」"
2535 = "「8620 đã cho anh thấy một thế giới mới. Anh muốn Hibiki hiểu được điều đó, và chắc chắn sẽ nhờ em vẽ lại nó.」"
2537 = "「Navi? Navi! A―― a―― aa! Lúc nãy, cô ấy nghe thấy―― đã nghe thấy sao!?」"
2539 = "「Áo sơ mi của OHITOYO cũng được bán ở các trung tâm thương mại trên Đế đô. Vì cũng muốn ủng hộ quê nhà nên anh cứ vô tình mua mãi thôi.」"
2644 = "Nếu Hachiroku không gánh vác tất cả những việc đó, thì tôi chẳng thể nào về nhà vào giờ này được."
2646 = "Nhưng tôi có thể cảm nhận được điều đó một cách chân thực. Rằng Hibiki và tôi, đang cùng ôm ấp một hình ảnh giống nhau."
2652 = "Chưa đầy năm phút sau, Hibiki đã lạch cạch chạy quay lại."
2683 = "Giọng nói điềm tĩnh. Chỉ nghe thôi cũng khiến tôi cảm thấy được cứu rỗi phần nào."
2687 = "Khi lợi ích công cộng và cá nhân không thể song hành, rốt cuộc chúng ta nên hành xử như thế nào…… Có lẽ đó là một câu hỏi không có đáp án chính xác."
2698 = "Rốt cuộc điều gì đã khiến tôi thay đổi đến nhường này. Rốt cuộc điều gì đã khiến Hibiki tình nguyện trở thành \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;."
2700 = "Vừa lật trang đầu tiên, tôi đã cảm thấy vô cùng hứng thú. ――Tôi nhận ra sức nặng của hai chữ \"thực tế\"."
2704 = "Giả sử Michiko chỉ là biểu hiện từ sâu thẳm tâm lý của tôi, hay thậm chí em ấy thực sự là một linh hồn, một bóng ma đi chăng nữa――"
2714 = "Tôi hoàn toàn không biết mình phải làm gì và làm như thế nào. Nhưng nếu là với Hibiki, dù có phải dò dẫm, tôi nghĩ mình vẫn có thể học được nhiều điều."
2716 = "Có lẽ là do đang cầm máy ảnh trên tay chăng? Ngay cả khu phố quen thuộc này, tôi cũng cảm thấy có chút gì đó mới mẻ."
2718 = "Chắc là trong giọng nói của tôi có chút gì đó quá gắng sức chăng, Hibiki cất giọng có vẻ hơi hốt hoảng."
2741 = "Có thể hiểu và đồng cảm được với những điều quan trọng đối với Hibiki, dù chỉ một chút, cũng khiến trái tim tôi trở nên ấm áp, nhẹ nhàng."
2743 = "A, \"đối diện\" chính là như thế này sao. Là suy nghĩ xem đôi mắt của Hibiki đang nhìn thấy điều gì."
2747 = "Ánh mắt Hibiki nhìn tôi khiến lòng tôi dấy lên một sự xáo động khó tả―― Nhưng trái tim xáo động ấy, cũng lại khiến vết thương lòng hé miệng."
2748 = "Khi có ý định đi du lịch, chẳng ai lại mang theo bản đồ của toàn bộ khu vực Hinomoto cả."
2750 = "OHITOYO là loại áo sơ mi chất lượng cao được bán cả ở Đế đô ――Nghe tôi giải thích vậy, Hibiki tròn xoe mắt ngạc nhiên."
2752 = "Khi tìm hiểu về việc khôi phục tuyến đường, tôi cũng đã học được điều này."
2755 = "Tuyến Hisatsu ngày xưa, đoạn giữa Yatsushiro và Ohitera, chạy dọc theo dòng sông Kuma."
2757 = "Vừa nói, em ấy vừa mở cuốn phác thảo vừa gập lại ra."
2759 = "Gót chân vừa định nhón lên lại đặt xuống sàn."
2761 = "Em ấy mở bản đồ trên màn hình, khoanh vùng khu vực giữa Ohitera và Yatsushiro――"
2762 = "Em ấy trả lời một cách lơ đãng. Biết vậy nên tôi đợi tiếng bút chì dừng lại rồi mới quay lại phòng khách."
2767 = "Vừa là học sinh, vừa là nhà thiết kế. Hơn thế nữa, em ấy còn tình nguyện trở thành \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;."
2770 = "Em ấy ngọ nguậy các ngón tay phải, rồi nắm chặt, siết thật chặt lại."
2773 = "Giọng điệu không hẳn là nói đùa. Vậy thì tôi cũng phải trả lời một cách nghiêm túc thôi."
2775 = "Nghe như một âm thanh thật phức tạp."
2776 = "Sự phấn khích đến kinh ngạc. Bàn tay đang nắm lấy tay tôi cũng ấm áp lạ thường."
2778 = "Nếu biết em ấy vui đến vậy, thì tôi đã nhờ em ấy sớm hơn rồi."
2780 = "Em ấy mỉm cười rạng rỡ. Vẫn giữ nguyên nụ cười đó, em ấy đưa chiếc máy ảnh cho tôi và nói \"Đây ạ\"."
2781 = "Em ấy thốt lên một tiếng ngạc nhiên, và dần dần, dần dần đỏ bừng mặt."
2783 = "Cũng giống như những bức tranh Hibiki vẽ, là thế giới mà Hibiki đang nhìn thấy――"
2785 = "Nếu có thể thấu hiểu và truyền đạt được điều đó, thì có lẽ nó sẽ trở thành một trong những chất xúc tác tạo nên một làn sóng mới."
2786 = "Nếu có thể khiến họ mang trong mình suy nghĩ đó, thì chắc chắn sự phản đối việc giải tỏa đất sẽ giảm đi đáng kể."
2795 = "Thực tế thì, chỉ với chừng đó cũng đủ dùng rồi, nên tôi hoàn toàn không có ý định mua thêm."
2798 = "Một yêu cầu kỳ quặc là 『Biển hiệu bằng gương』, nhưng Hibiki đã khéo léo biến nó thành một phương án cực kỳ thực tế."
2799 = "Một tấm bản đồ không khoanh vùng đối tượng rõ ràng, thì chẳng giúp ích được cho ai, và cũng chẳng ai thèm xem."
2810 = "Cứ suy nghĩ theo hướng đó, tôi nhận ra thế giới này tràn ngập những sản phẩm thiết kế."
2817 = "Thình thịch, một nhịp đập mạnh mẽ. Trái tim tôi đập mạnh đến nhức nhối."
2820 = "Tôi cảm thấy hơi xấu hổ vì có lẽ mình đã vội vàng về nhà quá, nhưng đồng thời cũng cảm thấy nhẹ nhõm vì không có Hibiki ở nhà."
2822 = "Tôi do dự một thoáng xem có nên kể cho em ấy nghe không, nhưng ngay lập tức nhận ra có do dự cũng chẳng ích gì."
2823 = "Vừa dứt lời, Hibiki liền ôm đầu."
2828 = "Tôi cùng Hibiki đi đến ga Suối nước nóng Ohitera. Trời đã tối mịt."
2829 = "Hai chúng tôi cứ thế nói ra những gì mình nghĩ đến, và Hibiki lần lượt ghi chú lại rồi phân loại chúng."
2831 = "\"Anh cũng không phải đợi lâu lắm đâu.\" Tôi định nói vậy thì chợt nhận ra."
2833 = "Hết cách, tôi đành nhắm mắt lại. Chỉ vậy thôi cũng đủ thấy dễ chịu. A, vậy ra tôi…… mệt mỏi hơn mình tưởng sao………"
2836 = "Từ câu nói đó, tôi có thể cảm nhận được."
2838 = "Nói là ai cũng làm được, nhưng chắc chắn không hề đơn giản như vậy."
2839 = "Tôi nhớ lại \\x%lヘッドマーク;#00ffc040;biểu trưng đầu tàu%l;#; 『Thử nghiệm lái tàu Hachiroku』 mà Hibiki đã thiết kế."
2844 = "Biến những cảm xúc hỗn loạn ấy thành lời nói một cách trực tiếp, để giảm bớt gánh nặng trong lòng."
2847 = "Tôi nắm lấy tay Hibiki và đứng dậy."
2848 = "Mở cửa lùa tủ âm tường ra, bên trong là một chiếc tủ ngăn kéo thấp. Áo sơ mi được cất riêng biệt trong hai ngăn, một cho đầu hè và một cho thu đông."
2850 = "Những bức ảnh tôi chụp, rốt cuộc cũng sẽ thể hiện thế giới mà tôi đang nhìn thấy sao."
2853 = "Tôi không phải bị trói buộc―― Mà là đang được mong muốn, được cần đến sao."
2854 = "Tôi không thể phủ nhận. Bởi vì tôi cũng hiểu rõ đây chỉ là một giấc ngủ gật chốc lát."
2855 = "Những lời nói thốt ra từ tận đáy lòng, đã khiến vô vàn biểu cảm của Hibiki đọng lại thành một nụ cười vô cùng dịu dàng."
2856 = "Những lời nói của tôi đã khơi gợi hình ảnh trong tâm trí Hibiki, hay ngược lại, tôi cũng không rõ nữa."
2859 = "Tôi mở mắt, và nhận ra mình vừa nằm mơ."
2861 = "Cuốn phác thảo đã trở thành khởi nguồn cho mọi chuyện của chúng tôi, trang giấy trắng tinh―― vẫn chưa được vẽ lên bất cứ thứ gì."
2862 = "Để lại phía sau giọng nói đầy hạnh phúc, tôi đun nước. Tiếng bút chì sột soạt hòa quyện cùng tiếng bếp lò."
2864 = "Sống lưng tôi lạnh toát. Đột nhiên cơ thể bị lay mạnh."
2865 = "Tôi hướng ống kính về phía khuôn mặt Hibiki và thử nhấn nhẹ một nửa."
2866 = "Vừa dứt lời, vẻ mặt kiên quyết của Hibiki liền sụp đổ."
2867 = "Tôi ấn Hibiki đang định đứng dậy ngồi xuống, rồi tự mình đứng lên."
2871 = "Vì thế, tôi chụp. Tôi muốn lưu giữ lại những nét đặc trưng của Hibiki vào trong chiếc máy ảnh này."
2874 = "Vì thế, tôi viết. Để tiếp tục dệt nên lịch sử của chúng tôi từ nơi đây."
2876 = "Vì thế, tôi không thể giấu giếm điều gì. Nghĩ vậy, những lời nói chân thật cứ thế tuôn trào."
2878 = "Vì thế, tôi chọn những từ ngữ đơn giản."
2882 = "Quảng bá Hibiki. Gu thẩm mỹ của Hibiki, những thiết kế của Hibiki. ――Một khi đã bắt tay vào làm, nếu không liên kết với những thứ khác thì thật lãng phí."
2883 = "Bản tin Buồng lái 8620. Một chuyến tàu du lịch hoàn toàn mới."
2889 = "Gánh nặng về tiền bạc, thời gian và công sức đi kèm với việc chuyển nhà, gánh nặng về mặt tâm lý, gánh nặng do sự thay đổi môi trường sống――"
2890 = "Có vẻ như em ấy đã tổng hợp xong rồi."
2892 = "Và rồi, với cùng một đầu ngón tay đó, em ấy khẽ chạm―― vào ngực mình."
2940 = "Lần này em ấy lấy máy tính bảng ra, và gõ dòng chữ đó lên màn hình."
2942 = "Hibiki gập cuốn phác thảo lại, cầm tách trà lên và thở phào nhẹ nhõm."
2944 = "Như đang dò dẫm tìm từ ngữ, hoặc tìm kiếm cảm xúc của chính mình. Đôi môi Hibiki mấp máy."
2946 = "Nếu là Hibiki thì em ấy cũng có rất nhiều người quen biết thông qua công việc."
2948 = "Em ấy hơi cúi đầu, gật nhẹ."
2950 = "Hibiki đã chuyển sang nói giọng phổ thông một cách vô cùng tự nhiên―― Tôi cũng cảm nhận được lý do từ tận sâu trong cơ thể mình."
2953 = "Hibiki đặt máy tính bảng xuống bàn, rồi lại cầm cuốn phác thảo lên―― À――"
2954 = "Hibiki vươn tay ra. Tôi nắm lấy, em ấy nở nụ cười rạng rỡ kéo tôi đi."
2957 = "Hibiki bé nhỏ núp sau cuốn phác thảo đang lén lút nhìn tôi."
2959 = "\\x%lサイン・デザイン;#00ffc040;Vẽ biển hiệu%l;#;―― Hibiki đang đối diện với công việc đó bằng thái độ của một chuyên gia."
2960 = "Chính nhờ gu thẩm mỹ của Hibiki, mới có thể kết hợp các tài nguyên một cách hợp lý―― À, ra vậy."
2963 = "Bước chân nhẹ bẫng. Như để biến những lời nói đó thành hình dáng, Hibiki nhảy cẫng lên."
2965 = "Hibiki cười rạng rỡ. Niềm vui của em ấy truyền đến tôi một cách vô cùng chân thật."
2967 = "Đôi mắt Hibiki mở to tròn xoe. Vì em ấy đang nhìn thẳng vào tôi nên tôi cũng gật đầu đáp lại."
2969 = "Hibiki tung bay vạt váy. Tôi có cảm giác hương vị thanh xuân đang nhẹ nhàng lan tỏa khắp phòng khách."
2971 = "Ngón tay của Hibiki vuốt ve chiếc áo sơ mi. Cảm giác đó, xuyên qua lớp áo, nhột nhạt trên làn da tôi."
2975 = "Một nụ cười đầy tự tin hiện lên trên khuôn mặt Hibiki. Tôi thực sự cảm thấy em ấy rất đẹp, rất tuyệt vời."
2976 = "Khuôn mặt Hibiki nhanh chóng đỏ bừng như con bạch tuộc luộc. Nhưng Navi không trả lời câu hỏi của Hibiki."
2977 = "Ngay trước mắt tôi là khuôn mặt của Hibiki―― Sự rạng rỡ ấy khiến những tàn dư của giấc mơ nhanh chóng tan biến."
2979 = "Nụ cười rạng rỡ. Hibiki gật đầu vẻ mãn nguyện."
2981 = "Đột nhiên, Hibiki ỉu xìu hẳn đi."
2983 = "Hibiki nhìn thẳng vào tôi."
2984 = "Hibiki lúc nào cũng phô bày vô vàn biểu cảm khác nhau trước mặt tôi mà không hề che giấu."
2986 = "Hibiki mở ra."
2987 = "Ý nghĩa của câu 『muốn truyền tải điều gì』 mà Hibiki nói, hình như tôi cũng đã hiểu ra đôi chút."
2989 = "Tôi lẩm bẩm. Và Hibiki gật đầu thật mạnh."
2992 = "Một cách ngượng ngùng, chầm chậm. Hibiki ửng hồng đôi má, khẽ gật đầu."
2993 = "Ngay lập tức, Hibiki bắt đầu hành động. Em ấy hốt hoảng nắm lấy tay tôi bằng bàn tay ấm áp của mình."
2996 = "Ngón tay của Hibiki lặng lẽ vươn ra. Lướt qua má tôi, chạm vào thân tàu 8620."
3005 = "Giống như niềm vui và nỗi buồn, đang hòa quyện vào nhau một cách hỗn độn."
3012 = "Sau khi rửa tay súc miệng cẩn thận, chúng tôi ngồi nghỉ trong phòng khách. Ngay lập tức, một cảm giác thành tựu và khâm phục dâng trào trong tôi."
3016 = "Ngọn lửa để ngày mai tiếp tục lăn bánh, đang lặng lẽ, âm ỉ cháy bên dưới lớp tro tàn."
3017 = "Để diễn đạt chính xác những gì muốn nói, tôi nghĩ đến công việc của Hibiki. Tiếp đó, tôi liên tưởng đến nhãn chai shochu của xưởng rượu Migita."
3018 = "Nếu là vì theo đuổi hạnh phúc lớn lao hơn, cho nhiều người hơn, thì liệu chúng ta có được phép chà đạp lên hạnh phúc đang hiện hữu ở đó không――"
3019 = "Để tuyệt đối không thất bại, tôi chia nhỏ các chỉ thị đến mức bản thân có thể hiểu được, suy nghĩ và lên kế hoạch cho quy trình tốt nhất――!"
3021 = "Sau đó, với vẻ hơi, chỉ một chút xíu thôi, bất mãn. Em ấy ngước mắt lên nhìn tôi."
3025 = "Anh, Hibiki, và tất cả chúng ta. Cùng với những người mà chúng ta chưa từng gặp gỡ―― những người sẽ kết nối với chúng ta trong tương lai."
3028 = "Bởi vì, giấy dán cửa lùa mang đậm phong cách Nhật Bản truyền thống. Tôi mở ra, lấy những bộ vest đang treo bên trong cho em ấy xem."
3035 = "Hoặc không chỉ giới thiệu trực tiếp, em ấy cũng có thể thiết kế poster để tuyển dụng ứng viên cho vị trí \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;."
3040 = "Phản ứng của Hibiki cứ như thể bây giờ mới sực nhớ ra. Vậy là trong đầu Hibiki vẫn chưa kết nối được hai việc đó với nhau."
3043 = "Thực sự chỉ là một chút thôi."
3045 = "Mắt tôi trĩu nặng. Dù chớp mắt mấy lần cũng chẳng khá hơn là bao."
3046 = "Đôi mắt sáng rực lên, Hibiki thoăn thoắt! vẽ những đường nét lên cuốn phác thảo."
3049 = "Trao đổi vài câu, tôi cảm thấy nhẹ nhõm hẳn. Hibiki quả thực vẫn luôn như mọi khi."
3055 = "Và rồi ngay khoảnh khắc tiếp theo, bừng sáng! Hibiki nở một nụ cười rạng rỡ như hoa."
3059 = "Tiếng bước chân nhẹ nhàng. Vừa nghĩ vậy, Hibiki đã quay trở lại phòng khách."
3060 = "Giọng nói cực kỳ điềm tĩnh của Navi. Tiếng hét giật mình của tôi khiến cả Hibiki cũng giật mình theo."
3061 = "Nghe em ấy nói vậy, tôi mới nhìn kỹ lại, và cảm thấy chói lóa đến mức lóa cả mắt."
3062 = "Tôi nghe nói hôm nay chỉ là một ngày đến trường bình thường không có lịch trình gì đặc biệt. Vì vậy, tôi bắt đầu lo lắng không biết có chuyện gì xảy ra không."
3063 = "Giọng nói đầy vẻ thuyết phục."
3068 = "Đối diện với ai đó. Để thấu hiểu đối phương, hoặc hiểu rõ chính mình. Đó là lời khuyên của Navi. Đương nhiên, tôi sẽ cố gắng hết sức, nhưng――"
3073 = "Bị hỏi tôi mới chợt nhận ra. Chính tôi cũng đâu có nắm rõ cơ chứ."
3076 = "Kinh nghiệm đã dạy tôi rằng bồi thường chỉ là biện pháp cầm máu tạm thời."
3097 = "Sau khi huấn luyện, chuyển sang trạng thái \\x%l保火;#00ffc040;giữ lửa%l;#;, rồi bảo dưỡng dọn dẹp."
3099 = "Vừa dứt lời, Michiko nhỏ bé liền nuốt ngược những lời định nói vào trong, y như cách một người lớn thường làm."
3100 = "Chính vì là một kẻ không có hứng thú với đường sắt―― thậm chí từng căm ghét nó, nên biết đâu anh lại có thể truyền tải được sức hấp dẫn của nó đến những người giống mình chăng."
3114 = "Chuyến tàu đang chở―― đang giam giữ Michiko này, rốt cuộc đang chạy ở \"đâu\"."
3122 = "Nếu vậy thì đúng như Hibiki nói. Vì tôi luôn cho rằng thất bại là tự chuốc thêm tội lỗi."
3123 = "Lần này đổi thái độ, mặt em ấy đỏ bừng lên. A, đúng là vẫn như mọi khi."
3124 = "Cuộc họp bàn về việc làm biển hiệu mới cho tiệm giặt ủi."
3127 = "Đó là…… quả thực là một điểm mù. Tôi chưa bao giờ suy nghĩ sâu xa về lý do của bản hợp đồng ràng buộc hai năm đó, nhưng――"
3128 = "Bàn tay này, không phải bàn tay nhỏ bé của Michiko. Nó lớn hơn, ấm áp hơn――"
3133 = "Lĩnh vực đường sắt, lĩnh vực công cộng. Những nơi mà sau này chúng ta sẽ mở rộng tuyến đường, anh muốn kết nối với họ thông qua công việc."
3135 = "Sau khi cầm máu, liệu có thể hồi phục và tìm lại được hạnh phúc hay không―― Bồi thường tuyệt đối không đảm bảo cho tương lai."
3136 = "Lỗ hổng khuyết thiếu vẫn còn rất lớn. Nhưng tôi có cảm giác mình đã tìm thấy một mảnh ghép để lấp đầy nó."
3137 = "Về việc đền bù giải tỏa đất để khôi phục tuyến đường, có lẽ tôi sẽ không tham gia vào công việc thực tế, nhưng để đưa ra ý kiến, đương nhiên tôi cũng cần có những kiến thức cơ bản."
3138 = "Tuy gọi là đầu máy cỡ nhỏ và Hachiroku, nhưng quả thực, nó rất lớn."
3141 = "Chỉ cần có chừng đó là sẽ không bao giờ gặp khó khăn gì, đó là điều bố nuôi đã dạy tôi."
3149 = "（……Nhưng mà―― ừm. Là do nội dung, hay do mình tập trung quá mức――）"
3158 = "（Lạch cạch lạch cạch）"
3160 = "（Cọc cạch, cọc cạch, xình xịch, xình xịch――）"
3162 = "（Tách!）"
3163 = "（Hừm…… Quả nhiên việc đền bù giải tỏa đất ở có rất nhiều khó khăn. Đúng hơn là…… nặng nề thật. Thậm chí có thể khiến người ta cảm thấy tội lỗi.）"
3165 = "（Tít tít tít）"
3167 = "（Lay mạnh!）"
3170 = "8620 đang được \\x%l保火;#00ffc040;giữ lửa%l;#;."
3175 = "Quả thực là đáp ngay tắp lự. Trong lời nói của Navi không hề có lấy một chút do dự nào."
3177 = "OHITOYO là thương hiệu áo sơ mi của một nhà sản xuất áo sơ mi tại thành phố Ohitera."

[selections]
