[script]
1013 = "――Cỏ dại.\\nTrước tiên phải dọn dẹp... làm sạch mộ đã."
1015 = "――Sau tai nạn đó, phải mất hai năm.\\nTôi mới có thể nhìn thấy Michiko trong giấc mơ."
1017 = "――Navi lại tiếp tục bay thẳng.\\nHướng thẳng về phía Ohito."
1033 = "\"Là gia đình, là đối tác\".\\nTôi nhớ lại lời mình đã nói với Hachiroku khi cô ấy còn e dè."
1053 = "……Mệt mỏi vô cùng.\\nĐến mức lười cả mở miệng."
1060 = "……Dù tôi bây giờ có suy nghĩ thì cũng chỉ là luẩn quẩn.\\nBởi vì tôi đang mong muốn một câu trả lời rõ ràng."
1061 = "……Tôi thầm nghĩ, nơi này quả thực rất hẻo lánh.\\nMặc dù chỉ cách Đế đô khoảng một giờ đồng hồ."
1064 = "……Nghĩ là làm ngay,\\nNgười xưa quả thật đã để lại một câu nói rất hay."
1066 = "……Kể từ đó, Navi im lặng.\\nSự im lặng kéo dài quả nhiên khiến tôi phải suy nghĩ."
1069 = "……Tất nhiên, không có tiếng trả lời.\\nĐó là lẽ đương nhiên."
1073 = "……Rất khó để báo cáo với bố mẹ,\\nvề bố nuôi và mẹ nuôi."
1075 = "……Đó cũng là một sự thật chắc chắn.\\nChẳng hạn như việc đi viếng mộ hôm nay."
1078 = "……Dù nghĩ rằng có thể chưa truyền đến được,\\nnhưng tôi cũng không thể bỏ mặc mà về."
1079 = "……Nhưng đồng thời, tôi cũng nghĩ đó là chuyện bất khả kháng.\\nBởi vì tôi đã phải dốc toàn lực chỉ để sống――để không phải chết."
1081 = "……Navi vẫn luôn quan sát từ trên đỉnh đầu.\\nNó vẫn luôn theo dõi tôi."
1082 = "……Ngay cả khi Navi đã đáp xuống nước,\\nsuy nghĩ của tôi vẫn không thể tĩnh lại được."
1086 = "「――Không ích kỷ. Không làm nũng. Không được bảo vệ.\\nNgài Soutetsu đã thay đổi theo hướng như vậy sao?」"
1088 = "「――Nhưng mà này, bố, mẹ.\\nCó vẻ như, đó chỉ là nỗi lo hão huyền thôi.」"
1090 = "「――A.」"
1091 = "「――Ừ.」"
1092 = "「――Đã lâu không gặp. Bố, mẹ.」"
1095 = "「――Anh sẽ không bao giờ để em phải trải qua cảm giác đó nữa.」"
1097 = "「――Chắc hẳn con bé đang rất lạc lõng.\\nKhi con gặp lại con bé, Michiko……đã khóc nức nở vì vui mừng.」"
1098 = "「――Ừ.」"
1100 = "「――Tôi bây giờ, trông có yếu đuối không?」"
1102 = "「――Thì ra là vậy.」"
1104 = "「――Vậy thì, hẹn gặp lại.\\nLần tới chúng ta hãy nói chuyện nhiều hơn nhé.」"
1105 = "「――Navi có thể hỏi ngài Soutetsu\\nmột câu được không ạ?」"
1145 = "「……Nghĩ lại thì, lúc nào cũng vậy nhỉ.\\nLúc nào, tôi cũng được Navi bảo vệ.」"
1158 = "「……Có lẽ vậy. Mặc dù chính bản thân tôi cũng không thể đo lường được\\nmình đã làm được đến mức nào.」"
1159 = "「……Là Hachiroku. Không phải búp bê.\\nCô ấy có tên, là một cá thể――có ý chí riêng.」"
1161 = "「…………Chắc thế này là được rồi nhỉ.」"
1163 = "「……Phiền gì chứ.」"
1165 = "「……Bây giờ, con.\\nĐang làm công việc liên quan đến đường sắt.」"
1166 = "「……Này, Navi.」"
1168 = "「……Có lẽ là vì,\\ncon sợ phải đối mặt với bản thân mình trong quá khứ.」"
1171 = "「……Sau khi viếng mộ, tôi đã vô cùng bối rối.\\nDù chỉ một khoảnh khắc, tôi đã trở lại là bản thân trong quá khứ.」"
1175 = "「……Đúng vậy. Bản thân tôi――có lẽ cảm thấy rằng\\nmình đã thay đổi rất nhiều.」"
1177 = "「……Theo nhiều nghĩa, chắc tôi sẽ phải lo liệu rất nhiều thứ.\\nVì vậy――」"
1182 = "「……Nhưng, trong mắt Navi lại thấy vậy sao.\\nTôi ngay sau vụ tai nạn, và tôi của bây giờ――――A, không.」"
1185 = "「……Đối với cô ấy, cũng giống như với Navi,\\ntôi không cần phải đề phòng gì cả. Theo nghĩa đó, cô ấy là một người khiến tôi thoải mái.」"
1189 = "「……Michiko vẫn đang ở trên tàu.\\nTrên chuyến tàu trước khi xảy ra tai nạn――Cứ như vậy, mãi mãi.」"
1191 = "「……Đó là một mục tiêu quá lớn đối với con.\\nMột mục tiêu mà sức con không thể nào với tới được.」"
1193 = "「……Nếu vậy thì Michiko cũng thế.\\nEm không thể cứ đi mãi trên chuyến tàu này được.」"
1194 = "「……Cũng không hẳn là dính lấy nhau như kiểu thân thiết lắm, nhưng――\\nĐúng là――ừm. Nói mới để ý, cũng coi là thân thiết.」"
1195 = "「……Mặc dù không thể bỏ mặc 8620 cũng là sự thật, nhưng――\\nThực sự không cần em đi cùng ngài sao ạ?」"
1405 = "「Chắc chắn là vậy rồi!\\nBởi vì ngay cả bây giờ! Trông Sou-chan cũng rất vui vẻ!」"
1406 = "「Đi đường cẩn thận nha, anh hai! Nhớ chú ý an toàn!」"
1408 = "「Không――Dù vậy, con đáng lẽ phải đến sớm hơn.\\nĐáng lẽ con phải đến báo cáo, đến thỉnh cầu sớm hơn.」"
1410 = "「Không――ừm.」"
1414 = "「Nếu ngài đã thay đổi từ trạng thái ích kỷ, hay làm nũng và coi việc được bảo vệ là điều hiển nhiên――」"
1416 = "「Không ngừng chứng minh, không ngừng chứng minh, không ngừng chứng minh――\\nTôi mới có thể trở thành tôi của hiện tại. Vì vậy, tôi không hổ thẹn với chính mình.」"
1418 = "「Không phải vậy――\\nA, ý tôi là. Sự sống mang tính xã hội, với tư cách là một con người.」"
1419 = "「Không có chuyện đó đâu!」"
1421 = "「Không ạ, thưa ngài Soutetsu. Tất nhiên là bao gồm cả những người đó,\\nnhưng không chỉ dừng lại ở đó đâu ạ.」"
1422 = "「Không, không phải vậy đâu ạ, ngài Soutetsu.」"
1427 = "「Đối diện... Chị Mayami hay Hibiki――\\nNhững người biết tôi vào khoảng thời gian đó sao?」"
1432 = "「Gì vậy? Navi.」"
1433 = "「Khuyến nghị, rốt cuộc là chuyện gì?」"
1440 = "「Ngành đường sắt mà con từng vô cùng căm ghét, hận thù――\\nThật kỳ lạ, bây giờ con lại đang làm việc cho nó.」"
1443 = "「Nhưng mà――Bố, mẹ.\\nBố mẹ của con, vẫn luôn là hai người.」"
1445 = "「Nhưng, được ngài Taito chỉ bảo. Được chị Mayami bảo vệ,\\nĐược đôi mắt của Hibiki làm cho thức tỉnh――Tôi đã thay đổi.」"
1447 = "「Nhưng sau khi gặp phải tai nạn đó, tôi đã thay đổi.\\nVì để sống sót, tôi buộc phải thay đổi.」"
1451 = "「Không cần quà cáp gì đâu,\\nanh mau chóng khỏe mạnh trở về nhé!!」"
1454 = "「Cô cũng thấy rồi mà. Tôi đã vô cùng bối rối.\\nThậm chí còn thảm hại buông những lời yếu đuối mà bình thường tôi chẳng bao giờ nói ra.」"
1456 = "「Bằng cách nào? Sou-chan, vì――trên chuyến tàu này,\\nSou-chan không thể đi mãi được đâu?」"
1457 = "「Cô nói là giống nhau sao? Tôi của hiện tại và――\\nTôi của ngày đó, khi chỉ là một đứa trẻ.」"
1460 = "「Cái gọi là điều chỉnh tư thế này, cũng khá là sảng khoái đấy.\\nThỉnh thoảng lượn lờ thế này cũng không tệ.」"
1462 = "「Navi suy đoán rằng hành động đó sẽ hữu ích trong việc giải quyết\\nmâu thuẫn nghiêm trọng mà ngài Soutetsu đang mang trong mình ạ.」"
1480 = "「Chị Hachiroku.\\nSou-chan, anh và chị ấy, thân thiết lắm đúng không?」"
1481 = "「Hachiroku? Hachiroku.」"
1485 = "「Phương pháp cụ thể, Navi xin nhường lại cho ngài Soutetsu quyết định.\\nNói chung, xin hãy đối diện sâu sắc với những yếu tố đã thúc đẩy sự trưởng thành của ngài.」"
1492 = "「Khi đó, Michi……sẽ bị Sou-chan bỏ lại mất.\\nLại trở nên cô đơn một mình rồi.」"
1493 = "「Khi đó anh muốn hai người đến gặp họ. Hãy để anh giới thiệu.\\nVới gia đình anh――gia đình của anh.」"
1494 = "「Như tôi đã nói lúc nãy――Tôi khi còn nhỏ,\\ních kỷ, hay làm nũng, và yếu đuối.」"
1495 = "「Suýt chút nữa tôi đã đi sai đường bay.\\nĐể duy trì tính mạng và sự an toàn cho ngài Soutetsu, tôi xin phép điều chỉnh lại ạ.」"
1497 = "「Ngài đã không thể bình tĩnh được sao ạ?」"
1514 = "「Được thôi. Chuyện gì?」"
1516 = "「Tuy nhiên, Navi quan trắc thấy――phần mang tính Hệ điều hành (OS)\\ncủa ngài Soutetsu không hề phát sinh thay đổi lớn nào.」"
1518 = "「Nếu nhớ lại bản thân trong quá khứ, con sẽ không thể cố gắng được nữa――\\nCó lẽ tận đáy lòng con đã sợ hãi điều đó.」"
1527 = "「Hya!?」"
1529 = "「Phù.」"
1531 = "「Hả!? Vâng!\\nChuyện đó, tuyệt lắm! Em nghĩ đó là một điều rất tuyệt vời!!」"
1533 = "「Hừm.」"
1534 = "「!」"
1535 = "「Hả!?」"
1537 = "「Ừm, vậy sao? Hiếm thấy thật đấy.」"
1538 = "「Hả!?」"
1539 = "「A——」"
1541 = "「A……Đúng là vậy. Phải rồi nhỉ.」"
1542 = "「A.」"
1544 = "「A! Mừng anh hai về nhà!」"
1546 = "「A, không……Michiko không có ở đây nhỉ.」"
1548 = "「A, không phải vậy. Không phải chỉ số sinh tồn――」"
1549 = "「À……」"
1550 = "「Ồ――」"
1551 = "「Ồ. Anh về rồi đây, Hibiki.\\nEm cũng vừa mới về à?」"
1553 = "「Uo!?」"
1554 = "「Vâng――」"
1556 = "「Ừ――Chắc chắn, họ đang đợi em.」"
1558 = "「A――Đúng vậy. Để không bị khuất phục, ngay cả suy nghĩ,\\ncon cũng đang trói buộc nó thật chặt.」"
1560 = "「À, ừm――Chắc là vậy rồi.」"
1561 = "「Ừm. Cảm ơn cô.」"
1563 = "「Ừ.」"
1564 = "「Vâng!」"
1566 = "「Vâng! Vì buổi họp sôi nổi quá nên mới kéo dài mà!\\nHơn nữa, nhờ vậy em mới tình cờ gặp được anh hai nữa.」"
1567 = "「Vâng! Buổi họp kéo dài khá lâu,\\nnhờ vậy mà em mới tình cờ gặp được anh hai ở đây nè!」"
1570 = "「Ừ, nhờ cô nhé.」"
1571 = "「Ừ?」"
1574 = "「Bởi vì bây giờ, con đã có nơi để trở về.\\nNgôi nhà mới của con, quả nhiên vẫn là nhà của con.」"
1575 = "「Dù sao thì, cũng đã lâu lắm rồi tôi mới gặp lại bố mẹ.」"
1577 = "「Phục sinh đường sắt. Mọi người đều mong muốn điều đó.\\nVì vậy, con đang cố gắng đáp lại kỳ vọng ấy.」"
1580 = "「Thất lễ rồi ạ. Có sự cố cần phải điều chỉnh lại tư thế.」"
1581 = "「Đã lâu không gặp――Được trò chuyện với hai người, con rất vui.\\nChuyện muốn nói. Vẫn còn rất nhiều nhưng mà.」"
1584 = "「Dành thời gian, đối diện sâu sắc――\\nSao Navi lại nói vậy chứ?」"
1585 = "「Vâng. Navi cũng quan trắc được rằng,\\nngài Soutetsu đã trưởng thành và trở nên vô cùng mạnh mẽ.」"
1587 = "「Vậy sao.」"
1588 = "「Ừm, đi đường cẩn thận nha.」"
1589 = "「Vâng. Nhất định ạ.\\nKhi đó, xin hãy cho phép tôi được gửi lời chào.」"
1591 = "「Được! Được chứ! Tất nhiên là vô cùng hoan nghênh rồi!!」"
1594 = "「Nếu không làm vậy, tôi đã không thể hoàn thành những gì được kỳ vọng.\\nNếu không hoàn thành những gì được kỳ vọng, tôi đã không thể sống sót.」"
1596 = "「Nếu ngài làm như vậy, Navi cũng có thể\\nnâng cao khả năng hoàn thành trọn vẹn chức vụ của mình ạ.」"
1598 = "「Giọng nói của con――Nếu có thể truyền đến hai người thì tốt biết mấy.\\nBởi vì Michiko vẫn luôn lang thang một mình.」"
1600 = "「Nếu nói tôi đã trưởng thành,\\nthì chính Navi là người đã nâng đỡ cội nguồn đó.」"
1604 = "「Con xin lỗi.\\nĐã đến thăm hai người muộn thế này.」"
1608 = "「Tôi khi còn nhỏ――đương nhiên, chỉ là một đứa trẻ đơn thuần.\\nÍch kỷ, hay làm nũng, và việc được bảo vệ là điều hiển nhiên.」"
1610 = "「Michi, anh biết không? Đã thấy đó.\\nTừ trong tàu, Michi cũng nhìn thấy.」"
1611 = "「Sou-chan, này.\\nChuyến tàu đó ấy.」"
1612 = "「Sou-chan?」"
1615 = "「Là trở nên có ích cho nhà Migita. Là trở nên có ích cho một ai đó.\\nLà nhất định phải hoàn thành những gì được kỳ vọng và chứng minh điều đó.」"
1616 = "「Có nghĩa là kết nối với mọi người, sống và được mọi người cần đến.\\nBởi vì tôi không thể chịu đựng được việc chỉ biết nhận sự che chở.」"
1617 = "「Nói vậy là……cả Hachiroku nữa sao.」"
1620 = "「Mâu thuẫn nghiêm trọng……」"
1622 = "「Con muốn Michiko――Không chỉ Michiko, mà cả bố và mẹ nữa,\\nchuyến đi ngày hôm đó... lần này, mong mọi người hãy tận hưởng nó.」"
1631 = "「Kể từ đó, thỉnh thoảng con lại gặp con bé trong mơ. Vẫn là Michiko của ngày xưa.\\nMichiko――đã dõi theo con từng chút một.」"
1638 = "「Sao vậy, Michiko. Có chuyện gì à?」"
1639 = "「Sao thế, trông em có vẻ vui quá nhỉ.」"
1640 = "「Nhưng mà, sao tự dưng anh lại nói vậy?」"
1641 = "「Một phía gì chứ. Rõ ràng là cái nhìn lập thể đúng nghĩa đen mà.」"
1642 = "「Ngài Soutetsu mong muốn được đánh giá rằng,\\nngài Soutetsu của quá khứ và ngài Soutetsu của hiện tại là 'hai người khác nhau'.」"
1644 = "「Tôi có cảm giác như mình đã quay lại làm bản thân trong quá khứ một chốc――\\nThế nên, ừm……bây giờ tôi cũng hơi bất an một chút.」"
1647 = "「Con――Con――đang rất cố gắng.\\nCon đang cố gắng, nhưng vẫn hoàn toàn chưa đủ.」"
1649 = "「Con――Bây giờ――」"
1651 = "「Anh nhất định sẽ đưa em đến.\\nĐến nơi mà bố và mẹ đang đợi Michiko.」"
1652 = "「Ngôi mộ ở quê nội――ở Shikoku, con cũng chưa từng đến viếng.\\nThật sự xin lỗi. Mọi thứ, con đều đã bỏ bê.」"
1654 = "「Không phải sự sống dưới góc độ phản ứng sinh tồn――」"
1656 = "「Anh không biết.」"
1657 = "「Con không thể nói là vô lý. Không thể nói là không làm được.\\n――Không. Ngay cả việc nghĩ như vậy, đối với con thường ngày, cũng là điều bất khả thi.」"
1661 = "「Anh hứa.\\nSẽ tuyệt đối không bao giờ bỏ rơi Michiko.」"
1663 = "「Vâng. Có chuyện gì vậy ạ, ngài Soutetsu.」"
1664 = "「Lý do con sợ phải đến đây là――」"
1667 = "「Con rất thích ngôi nhà hiện tại.\\nCon vô cùng trân trọng gia đình hiện tại, những người đồng đội hiện tại.」"
1669 = "「Anh muốn đối diện. Trước tiên là với Hibiki.\\nSau đó là với những người khác nữa――để học hỏi một điều gì đó quan trọng.」"
1670 = "「Tôi cứ tưởng mình đã trưởng thành như vậy. Thế nên tôi nghĩ đi viếng mộ cũng chẳng sao\\n――nghĩ rằng mình có thể đến chào hỏi với tư cách là tôi thường ngày.」"
1673 = "「Michi hiểu mà. Vì Sou-chan, nói chuyện với con búp bê đó――\\nchị Hachiroku, trông rất vui vẻ.」"
1674 = "「Tôi hiểu rồi.」"
1675 = "「Con sẽ lại đến, nhất định――\\nA.」"
1676 = "「Xin lỗi vì con đã không chu đáo.」"
1678 = "「Tôi biết.」"
1679 = "「Biết vậy, nhưng tôi vẫn rất biết ơn.\\nNavi――Cảm ơn cô vì đã luôn bảo vệ tôi.」"
1681 = "「Đính chính lại. Không phải đi một mình.\\nMà là chuyến đi của hai người, Navi và tôi.」"
1684 = "「Ở Ohito, ở nhà còn chất đống chuyện anh muốn làm.\\nAnh sẽ cố gắng về sớm nhất có thể, tất nhiên là sẽ khỏe mạnh trở về rồi.」"
1686 = "「Cứ từ từ, thong thả.\\nKể cho hai bác nghe thật nhiều chuyện, được chứ?」"
1687 = "「Anh――\\nVì vậy, anh muốn chuyến tàu lăn bánh.」"
1689 = "「Thế nên, chắc chắn Sou-chan sẽ」"
1691 = "「Thế nên, con mong hai người hãy đến đón con bé.\\nNếu có thể, bố và mẹ, hãy đến đón Michiko.」"
1694 = "「Vì thế, con――rất thích 'bản thân hiện tại'.」"
1695 = "「Vậy, tôi hỏi lại Navi nhé.\\nTôi của hiện tại, có gì khác so với tôi thường ngày không?」"
1698 = "「Vì vậy, tôi đã thỉnh cầu ngài Taito. Tôi đã xin――\\nvà được ngài dạy cho 'cách để sống như một con người'.」"
1699 = "「Thế nên, anh muốn đối diện với em.」"
1700 = "「Vì vậy, ngài Soutetsu. Xin ngài hãy\\nđối diện và thấu hiểu những người đó sâu sắc hơn.」"
1703 = "「Vì vậy, Navi đặc biệt khuyến nghị\\nngài Soutetsu.」"
1704 = "「Vì vậy, Navi sẽ trả lời câu hỏi của ngài Soutetsu\\ntrong phạm vi mà Navi đã quan trắc và ghi nhận được ạ.」"
1709 = "「Phần mang tính OS.」"
1713 = "「Hibiki này, anh――\\nmuốn hiểu thêm về Ohito.」"
1720 = "「Em đi làm về à?」"
1722 = "「Như thế nào ạ?」"
1726 = "「A……Ừ.\\nNói mới thấy, đúng là vậy.」"
1729 = "「Ừ. Có lẽ anh sẽ đảm nhận công việc trên tàu,\\nvà mọi người cũng sẽ lên tàu đi cùng.」"
1730 = "「Vâng. Đúng vậy ạ, ngài Soutetsu.」"
1731 = "「Đúng vậy.」"
1732 = "「Thật sự là vừa khít luôn!\\nEhehe, đúng lúc ghê.」"
1733 = "「Ra vậy. Thì ra là thế.\\nChuyến tàu hướng tới tương lai không phải là chuyến tàu bỏ lại Michi, mà là...」"
1734 = "「Vậy sao.」"
1735 = "「Đó, tức là bản chất sao. Cả lúc mới gặp nhau, và bây giờ.\\nNavi thấy bản chất của tôi không hề thay đổi ư.」"
1738 = "「Là Paulette và Reina nhỉ.」"
1739 = "「Vâng.」"
1742 = "「Ra là vậy.」"
1743 = "「Vậy sao ạ.」"
1745 = "「Là Navi khuyên anh đấy. Khuyên anh nên dành thời gian\\nđể đối diện sâu sắc với từng người xung quanh mình.」"
1747 = "「Vậy sao?」"
1749 = "「Vâng! Hơn nữa nhé, với chị Hibiki,\\nvới chị tóc vàng và cả cô bé nhỏ nhắn nữa.」"
1751 = "「Sinh mạng của ngài Soutetsu, lúc nào cũng có Navi bảo vệ mà ạ.」"
1752 = "「Thật là một niềm vinh hạnh không gì sánh bằng ạ.」"
1755 = "「Vâng. Hachiroku và ngài Paulette. Reina, ngài Kisaki.\\nNgài Nagi, ngài Fukami. Với cả những người đó nữa, nhất định ạ.」"
1757 = "「Ngài Soutetsu chắc chắn đã trưởng thành và trở nên mạnh mẽ hơn.\\nNgài đã có thể làm được rất nhiều điều mà trước đây ngài không thể.」"
1759 = "「Không ạ, ngài Soutetsu.\\nThân nhiệt, nhịp đập, nhịp thở, tất cả đều nằm trong phạm vi bình thường.」"
1761 = "「Tấm áp phích đẹp lắm. 'Chuyến tàu hướng tới tương lai'.」"
1763 = "「Để làm được điều đó, trước tiên anh muốn hiểu thêm về Hibiki.\\nAnh có thể――đến xem em làm việc được không?」"
1767 = "「Và con đã được đón nhận như một thành viên trong gia đình.\\nTại nhà Migita――Cùng với chị Mayami và Hibiki.」"
1773 = "「Bố――Mẹ――」"
1775 = "「Bố và mẹ! Đang đợi Michi sao?」"
1777 = "「Michiko rất muốn gặp hai người. Bố và mẹ.\\nVì vậy có lẽ con bé――vẫn luôn đợi trên chuyến tàu đó.」"
1779 = "「Ngài Soutetsu đang ở đây lúc này,\\nvà ngài Soutetsu buông lời yếu đuối trước bia mộ kia, đều không có gì khác biệt.」"
1781 = "「Căm hận đường sắt, oán ghét con người. Một trạng thái vô phương cứu chữa.\\n――Bây giờ nghĩ lại, lúc đó tôi chẳng khác nào một kẻ sống dở chết dở.」"
1782 = "「Tất nhiên là anh hai cứ thong thả bao lâu tùy thích.\\nÀ thì... chắc cũng có nhiều chuyện muốn nói mà――Auu!?」"
1783 = "「Vì vậy có lẽ, việc suy nghĩ về lý do đó\\ncũng là một bài toán quan trọng đối với anh.」"
1784 = "「Tôi, vẫn luôn làm nũng với Navi mà.\\nTrước mặt Navi, tôi nói những lời ích kỷ, và cả những lời yếu đuối nữa.」"
1785 = "「Tôi,\\nđã nói ra một điều thật vô ý.」"
1787 = "「Nhìn thấy……Cái gì cơ?」"
1796 = "「Quả thật có rất nhiều chuyện muốn nói.\\nTuy nhiên, anh cũng không định nán lại lâu.」"
1797 = "「Quả thực ngài đã nói những lời yếu đuối.」"
1802 = "「Sự sống mang tính xã hội, là có ý nghĩa như thế nào ạ?」"
1804 = "「……Sou-chan, khi chuyến tàu hướng tới tương lai khởi hành,\\nchắc chắn anh sẽ đi cùng mọi người đúng không?」"
1808 = "「Hơn nữa nhé. Gần đây――'bản thân hiện tại' cũng đã thay đổi.\\nKhông chỉ vì 'mọi người mong muốn điều đó' nữa.」"
1810 = "「Bằng cách trở nên có ích cho ai đó, tôi đã bắt đầu một cuộc sống mới.\\nThế nên……quả thực tôi đã trải qua một sự thay đổi lớn.」"
1826 = "「Xin ngài cứ thong thả nghỉ ngơi.\\nCùng tận hưởng khoảng thời gian hạnh phúc――riêng tư của gia đình ạ.」"
1827 = "「Xin ngài hãy yên tâm, ngài Soutetsu.\\nNavi nhất định sẽ đưa ngài Soutetsu đến đích an toàn ạ.」"
1828 = "「Cảm ơn mọi người――Tôi đi đây.」"
1833 = "「Cả Nagi và Fukami nữa sao. Đối diện sâu sắc hơn――có nghĩa là,\\nví dụ như, dành thời gian ở riêng với nhau chăng?」"
1835 = "「Với chị Paulette và Reina cũng vậy――Sou-chan,\\nanh đang dần nói chuyện vui vẻ hơn rồi đấy!」"
1849 = "「Đó không phải mong muốn của ai khác, mà là của chính 'bản thân hiện tại'.\\nVì thế con nhất định sẽ biến nó thành hiện thực. Dù con đường đó có dài đằng đẵng đến đâu.」"
1850 = "「Đây chỉ là quan trắc từ một phía, của một vật phẩm đơn thuần thôi ạ.」"
1851 = "「Điều đó có lẽ sẽ dẫn đến một cuộc khủng hoảng nghiêm trọng đối với ngài Soutetsu.\\nMột khao khát có thể liên quan đến cả tính mạng.」"
1852 = "「À thì lần này là vậy,\\nnhưng nếu sau này có cơ hội――」"
1853 = "「Nếu vậy, đánh giá đó cũng là điều hiển nhiên thôi.」"
1855 = "「Gặp tai nạn trong trạng thái đó, tôi đã thay đổi.\\nTôi lúc mới gặp Navi――」"
1858 = "「Ngài Soutetsu của quá khứ, sao ạ?」"
1859 = "「Em! Cả em nữa!!\\nNếu anh hai không phiền.」"
1862 = "「Nếu vậy, Michi」"
1863 = "「Vậy thì, để lúc đó không làm bố mẹ Sou-chan bất ngờ nha.」"
1865 = "「Vì đó là chức vụ của Navi mà ạ.」"
1866 = "「Vậy thì tốt quá rồi ạ.」"
1867 = "「……Nếu vậy, tôi. Chắc hẳn đang rất tận hưởng công việc.」"
1869 = "「Đó là phương pháp như thế nào ạ?」"
1871 = "「Là chuyến tàu kết nối――\\nTương lai của Michiko và tương lai của chúng ta.」"
1872 = "「Chuyến tàu vẫn chưa xuất hiện. Chuyến tàu hướng tới tương lai.\\nAnh muốn chạy nó cùng với con búp bê đó đúng không?」"
1880 = "「Anh hai? Có chuyện gì sao?」"
1881 = "「Tôi rất vui vì tấm lòng của cô, nhưng dù không có chuyện của 8620――\\nChỉ lần này thôi, tôi muốn đi một mình.」"
1884 = "「Con đến nhờ vả chuyện này,\\nmuộn màng như thế là vì――」"
1885 = "「Ngài Soutetsu. Chúc ngài――\\nThượng lộ bình an, có một chuyến đi tuyệt vời.」"
1886 = "「Ngài Soutetsu.」"
1887 = "「Ngài Soutetsu vẫn là ngài Soutetsu ạ.」"
1888 = "「Tại sao ngài Soutetsu lại mong muốn được đánh giá rằng,\\ngiữa ngài Soutetsu của hiện tại và quá khứ có sự thay đổi rõ rệt ạ?」"
1889 = "「――Ngài Soutetsu, ngài vất vả rồi.\\nChúng ta đã đến đích ạ.」"
1893 = "「Navi không biết về ngài Soutetsu\\ntrước thời điểm lần đầu tiên chúng ta gặp nhau ạ.」"
1894 = "「Navi cũng quan trắc được sự trưởng thành của ngài Soutetsu.\\nVà cũng nhận thức được rằng sự trưởng thành đó có ý nghĩa quan trọng trong việc duy trì sự sống của ngài.」"
1898 = "「Chức vụ của Navi sao.」"
1900 = "「Đây là nhận định của không ai khác ngoài thầy Navi.\\nTôi sẽ làm theo những gì cô nói.」"
1901 = "「Navi quan trắc thấy rằng, những người xung quanh ngài Soutetsu,\\nnhững người liên quan đến nhà Migita và Đường sắt Ohito, đã thúc đẩy sự trưởng thành đó một cách đáng kể.」"
1903 = "「Việc Navi đánh giá ngài không có nhiều thay đổi,\\nkhông phải dựa trên khía cạnh có hay không có những hành động mang tính cảm xúc――」"
2066 = "Không có gì thay đổi, mãi mãi không thay đổi,\\nnó chỉ đơn giản――chân thành, tiếp tục dõi theo tôi."
2067 = "Một khi đã nói ra, sẽ không thể dừng lại được."
2068 = "Nếu nói ra, có lẽ bản thân tôi sẽ sụp đổ――\\nDù lý trí có cảnh báo như vậy."
2072 = "Trong thoáng chốc, thân máy bay rung lắc mạnh."
2076 = "Bóng râm phủ xuống.\\nRồi lại ngập tràn ánh nắng."
2078 = "Khoảnh khắc tiếp theo, em ấy bất chợt ngẩng lên\\nvới vẻ mặt đầy thắc mắc."
2080 = "Làm sao có thể nghe thấy giọng nói cơ chứ――\\nTình huống hiển nhiên đó, bỗng dưng khiến tôi cảm thấy bất an."
2083 = "Không phải. Chỉ bấy nhiêu lời là chưa đủ.\\nTôi vẫn chưa truyền đạt trọn vẹn cảm xúc của mình."
2084 = "Không, nghe kỳ cục nhỉ.\\nĐi viếng mộ gia đình ruột thịt mà lại giới thiệu gia đình hiện tại."
2089 = "Bất chợt cảm thấy đau nhói ở đầu ngón tay, tôi buông tay ra.\\nBàn tay đã lạnh buốt và nắm chặt tự lúc nào."
2092 = "Từ lúc nào, bia mộ đã khô khốc.\\nThế nên, tôi lại tưới thật nhiều nước lên."
2093 = "Dù cho khởi đầu có méo mó đến đâu,\\ndù là bị ép buộc, tôi cũng sẽ không đánh mất nơi đó."
2101 = "Nhưng giả sử, nếu nó bám vào tôi.\\nNếu linh hồn của Michiko hiện tại vẫn đang ở cùng tôi――"
2104 = "Rằng Navi có một hơi ấm thực sự――\\nVà tôi luôn được chở che bởi hơi ấm đó."
2106 = "Nhưng tôi đã thực sự hiểu ra.\\nKhi gặp Hachiroku và Reina, tôi đã được chỉ bảo."
2107 = "Nhưng vụ tai nạn đó, và sự ra đi của Michiko,\\nlà một sự đứt gãy vô cùng lớn――Không――"
2110 = "Thế nhưng, lại thấy cô đơn.\\nCảm giác ở một mình thật khó chịu không sao tả xiết."
2112 = "Nhưng tôi vẫn cố gắng cất tiếng.\\nSự im lặng hay bối rối của tôi, chắc chắn sẽ khiến Michiko sợ hãi."
2114 = "Thế nhưng, tôi đã dốc hết sức.\\nSử dụng toàn bộ những gì tôi có ở từng thời điểm."
2116 = "Thế nhưng đột nhiên, Michiko cúi gằm mặt xuống."
2118 = "Nhưng bây giờ chưa phải lúc.\\nVừa nghi ngờ không biết có truyền đến được không――Thì những lời đó thật trống rỗng."
2141 = "Chỉ cần nhớ lại thôi cũng thấy đau lòng.\\nMáu mới rịn ra từ lớp vảy vết thương."
2146 = "Tiếng tàu hỏa chạy trên đường ray khiến tôi cảm thấy nhẹ nhõm.\\nCảm giác như đã trở về."
2151 = "Hachiroku, người mới nãy còn vẻ bất mãn, bỗng nhẹ nhàng――cúi chào tĩnh lặng.\\nVới khuôn mặt vô cùng điềm đạm, cô ấy cất giọng đầy quan tâm."
2152 = "Vừa nghĩ Hibiki đã an tâm rồi, thì đến lượt Hachiroku.\\nQuả nhiên, khuôn mặt cô ấy trông không được vui vẻ cho lắm."
2153 = "Cảm giác an tâm vừa nhen nhóm lập tức bị đảo lộn hoàn toàn."
2159 = "Dù vậy, tôi vẫn phải làm cho đến khi hoàn thành.\\nKhông được phép nản lòng, không được phép quỳ gối."
2161 = "Ra là vậy, do cách hỏi của tôi không tốt."
2162 = "Ra là vậy, đó có lẽ là đánh giá\\n\"chỉ có Navi mới có thể đưa ra\"."
2169 = "Có lẽ vì đã an tâm nên thế giới bắt đầu rung rinh.\\n――A, sắp tỉnh dậy rồi――"
2193 = "A, Michiko thực sự vẫn vậy."
2205 = "Nhờ vậy, tôi bình tĩnh lại――có thể bình tĩnh lại.\\nCố gắng ép mình hít một hơi thật sâu, cơ thể cũng bớt run đi phần nào."
2206 = "Bởi vì tôi có thể tin chắc như vậy, bởi vì tôi đã trở nên tin chắc như vậy.\\nHoặc có lẽ, cuối cùng tôi cũng có thể đến đây vào ngày hôm nay."
2207 = "Vì nhận thức được điều đó,\\ntôi nói nhanh hơn một chút."
2208 = "Vì đã cố gắng, nên tôi đã tạo ra được nơi chốn cho riêng mình.\\nVì đã cố gắng, nên tôi có thể đối diện với rất nhiều nụ cười."
2209 = "Bởi vì, tôi đang làm nũng thế này cơ mà.\\nCó thể ngoan ngoãn tha thứ cho \"bản thân vô dụng\" đến nhường này."
2210 = "Bởi vì, có một điều duy nhất không bao giờ thay đổi.\\nTừ khi sinh ra, cho đến tận bây giờ, và cho đến lúc chết đi."
2211 = "Bởi vì, nó đã dừng lại.\\nSự run rẩy đã ngừng lại."
2213 = "Sáu năm rưỡi kể từ khi rời khỏi Ohito.\\nTôi đã không thể nào dành ra được một giờ đồng hồ đó."
2217 = "Đối diện. Nhìn nhận công việc. Nhìn nhận cuộc sống.\\nNếu cứ tiếp tục gắn kết với từng người một, thì cuối cùng――"
2219 = "Nhờ vậy, tôi có thể cất bước mà không chút do dự."
2223 = "Trong vòng tròn mà mọi người cùng nhau tạo nên,\\ntôi đã không thể――đưa hình bóng của Michiko vào."
2224 = "Đôi đầu gối muốn gục ngã――\\nĐã được một bàn tay vô hình nhưng ấm áp nâng đỡ."
2228 = "Tôi đã được bảo rằng mình là tuyến đường sắt, là đường ray.\\nTôi đã chấp nhận đó là cách tồn tại của bản thân."
2230 = "Khá là mạnh.\\nNhư thể muốn văng cả giày ra ngoài vậy."
2233 = "Muốn đi cùng――Liệu có phải vì tinh thần trách nhiệm của một \\x%lレイルロオド;#00ffc040;Railord%l;#; không?\\nTrong khi đây đúng nghĩa đen là một chuyến đi \"cá nhân\"."
2235 = "Không hề thay đổi so với ngày đó, khoảnh khắc đó,\\nNgay cả bây giờ con bé vẫn cố gắng đẩy tôi ra xa cái chết dù chỉ một chút."
2237 = "Nghe vậy, tôi thấy hơi ngại.\\nĐồng thời cũng cảm thấy có chút áy náy."
2239 = "Buồn nôn. Cơ thể run rẩy. Cổ họng khô khốc.\\nCó lẽ vì vậy――mà nước mắt không tuôn rơi."
2241 = "Nếu hỏi như thế này ngay từ đầu,\\nNavi hẳn đã đưa ra đánh giá chính xác ngay lập tức rồi."
2243 = "Nhỡ đâu không truyền đến được thì sao――\\nKhoảnh khắc nghĩ vậy, tôi liền đứng bật dậy."
2244 = "Nếu điều đó có thể trở thành niềm an ủi,\\ncho chuyến đi lặp đi lặp lại mãi chưa kết thúc của Michiko."
2247 = "Nếu hỏi như vậy,\\nHachiroku chắc chắn sẽ trả lời cho tôi――"
2249 = "Nếu được vậy thì tốt quá.\\nNếu hình ảnh phản chiếu trong đôi mắt Michiko có thể khiến con bé vui vẻ dù chỉ một chút."
2257 = "Chuyến du lịch gia đình dang dở.\\nVượt qua cây cầu chưa thể vượt qua――Tôi muốn họ du hành đến ga cuối cùng."
2259 = "Khoảnh khắc nhận thức được điều đó,\\ntôi có cảm giác mọi thứ dưới chân đang rung chuyển, sụp đổ."
2266 = "Dù chỉ là một cậu thiếu niên, tôi đã nghĩ rằng nếu không chứng minh được \"giá trị khi ở nhà Migita\",\\nthì những bữa ăn hằng ngày cũng chỉ là sự bố thí."
2268 = "Từ đêm đông lạnh giá, cuối cùng cũng trở về ngôi nhà ấm áp――\\nNhư thể chợt nhớ lại cái lạnh buốt ngay khoảnh khắc cảm thấy an tâm."
2278 = "Bóng râm buông xuống. Tôi ngước nhìn bầu trời.\\nNavi vẫn không đổi, đang bay lượn vòng quanh."
2280 = "Từ lúc ở tận cùng của sự tồi tệ,\\nđến bây giờ vẫn vậy――và có lẽ, cả trong tương lai nữa."
2288 = "Bất chợt, im lặng.\\nRốt cuộc Navi đang tính toán điều gì vậy."
2289 = "Nỗi sợ hãi bất chợt bò lên.\\nSợ, sợ, sợ, sợ quá."
2291 = "Tôi chợt nhớ lại hồi nhỏ, tôi và Michiko hay tranh nhau cái gáo\\nvì thấy nó rất thú vị."
2295 = "Navi có lẽ đang định nói với tôi――\\nmột điều gì đó cực kỳ quan trọng."
2304 = "Không thể để mạng sống mà Michiko đã cứu lấy trở nên vô ích.\\nNhững ngày tháng chỉ sống bằng niềm tin đó đã quá dài."
2306 = "Tôi nhất định phải cứu Michiko ra.\\nKhông, đáng lẽ ra――tôi phải hành động sớm hơn."
2308 = "Đánh trống lảng. Dòng suy nghĩ.\\nCố gắng đánh trống lảng, tìm kiếm một nơi không bị ngột ngạt."
2311 = "Tôi và Michiko, mãi mãi là anh em sinh đôi.\\nVì tôi là――anh trai của Michiko."
2313 = "Tôi rất vui và biết ơn."
2314 = "Phải đứng lên. Nếu đã như vậy thì càng phải thế.\\nTôi phải tìm ra bố và mẹ."
2317 = "Một luồng khí lạnh chạy dọc sống lưng."
2319 = "Về Ohito.\\nVề Đường sắt Ohito."
2320 = "Ở cửa hàng tiện lợi gần nghĩa trang,\\ncó bán cả nhang, bật lửa, bánh kẹo và hoa tươi."
2323 = "Tôi cảm thấy linh hồn giống như một dạng nhiệt lượng.\\nNếu nó rời khỏi cơ thể, có lẽ nó sẽ mong manh bốc hơi mất."
2325 = "Ngẩng mặt lên,\\ntôi thấy Navi đang chầm chậm lượn vòng trên đỉnh đầu."
2326 = "Nếu cảm thấy an tâm, nỗi sợ hãi cũng phai nhạt dần,\\nnhững lời nói liên tiếp tuôn ra từ cổ họng."
2328 = "Tôi từng nghĩ đó chỉ là một giấc mơ.\\nKhông, ngay cả bây giờ――tôi vẫn cho rằng đó là giấc mơ, là sự hoạt động của vô thức."
2329 = "Đã cố gắng đi, nhưng không thể và đành bỏ cuộc.\\nChỉ có Navi mới biết đã có bao nhiêu ngày như thế."
2332 = "Tôi chưa từng cảm nhận được linh hồn ở Navi.\\nThế nhưng, tôi luôn cảm nhận được."
2334 = "Tôi múc nước bằng gáo,\\ntưới nhiều lần lên ngôi mộ đã được dọn sạch."
2336 = "Michiko mà tôi nhìn thấy chắc chắn là hình bóng của chính tôi――\\nCó lẽ không phải là hồn ma hay vong linh gì cả."
2338 = "Tôi đã nhìn thấy câu trả lời."
2339 = "Tôi tự đánh giá bản thân――rằng mình đã có thể đi đến bước này.\\nHiện tại, chỉ cần thế là đủ."
2342 = "Những lời định giấu nhẹm đi,\\nlại được Hachiroku và Hibiki khơi gợi ra."
2344 = "Được nhà Migita nhận nuôi――\\nMang trong mình cảm giác tội lỗi, nhưng dẫu vậy, tôi đã tìm được sự bình yên thực sự."
2345 = "Dù công nhận đánh giá của Navi, nhưng vẫn không thể chấp nhận được,\\nra là vậy――Có lẽ là vì tôi \"muốn được đánh giá là đã thay đổi\"."
2347 = "Tôi thực sự cảm thấy mình quá thảm hại.\\nNhưng chính vì vậy, tôi phải báo cáo một cách đàng hoàng."
2352 = "Nhớ ra điều đó, tôi nở nụ cười khổ."
2353 = "Sinh mạng của tôi được bảo vệ bằng cách đánh đổi lấy sinh mạng của Michiko.\\nBằng cách đó――tôi muốn nâng cao giá trị của nó dù chỉ một chút."
2354 = "Điều đó có lẽ chỉ dẫn đến kết quả\\nlà làm tăng thêm \"mâu thuẫn nghiêm trọng\" mà Navi nói đến."
2355 = "Tôi có cảm giác rằng mình sẽ giải quyết được bài toán mà ông Mototada đặt ra,\\nvà có thể xây dựng nên một thể chế toàn Ohito."
2358 = "Thế nên, tôi đã làm vậy.\\nVì tiếp tục làm vậy, tôi mới có thể sống sót."
2360 = "Vì thế, tôi không thể sai lệch. Vì thế, tôi không thể lỏng lẻo.\\nTrước mặt mọi người, tuyệt đối, tuyệt đối――dù có chuyện gì xảy ra."
2363 = "Thế nên, tôi thấy vui.\\nKhi những gì tôi đã tích lũy từ trước đến nay được đánh giá là đúng đắn."
2364 = "Thế nên tôi nghĩ để lần sau kể cũng được.\\nKhoảnh khắc nghĩ vậy, tôi thấy thật buồn cười. Một niềm hạnh phúc nhẹ nhàng lan tỏa."
2366 = "Thế nên, những lời nói không ngừng tuôn ra.\\nThế nên, những suy nghĩ không ngừng cuộn trào."
2369 = "Vì vậy, tôi nhìn thẳng vào Hibiki.\\nHibiki có vẻ hơi bối rối, vội vàng ngồi thẳng lưng lên."
2370 = "Vì vậy, cũng có những điều nó không hiểu được.\\nTôi biết điều đó, nên mới từ từ giải thích cho nó hiểu."
2373 = "Vì vậy, tôi có thể quay lại.\\nDù có nhớ lại \"bản thân trong quá khứ\"――tôi vẫn có thể trở về với \"bản thân hiện tại\"."
2374 = "Vì vậy, tôi mở miệng.\\nDù cảm thấy nặng nề đến nhường này, cả đôi mắt và đôi môi."
2376 = "Nếu vậy, nhận thức đó, ít nhất đối với Navi, là sự thật.\\nVà tôi――tin tưởng Navi."
2382 = "Cứu mạng tôi.\\nĐó là mệnh lệnh tối thượng và duy nhất được khắc sâu vào Navi."
2383 = "Làm vậy Navi sẽ trả lời tôi.\\nGiống hệt như từ trước đến nay."
2393 = "Vừa nói xong, khuôn mặt Hibiki lộ vẻ \"Tiêu rồi!\",\\nvà vội lấy tay che miệng lại."
2394 = "Thấy em ấy lại lộ vẻ \"Tiêu rồi\",\\ntôi hơi bối rối, bèn dùng lời nói cắt ngang lời Hibiki."
2397 = "Khoảng thời gian Hibiki được là chính mình nhất――\\nCó lẽ là khi em ấy đang nghiêm túc đối diện với công việc."
2399 = "Nụ cười bẽn lẽn chợt lóe lên nhắc tôi nhớ lại.\\nRằng đó chính là điều mà Hibiki đã từng khuyên tôi."
2400 = "Nụ cười rạng rỡ của Hibiki đã cho tôi câu trả lời.\\n\"Đối diện\", tóm lại chính là thế này đây."
2403 = "Như hiểu, lại như không hiểu.\\nGiọng nói nghe có vẻ như đã chấp nhận, nhưng lại phảng phất chút tiếc nuối."
2404 = "Hibiki khẽ nhảy cẫng lên,\\nthu người lại và làm động tác ăn mừng."
2407 = "Hibiki vui vẻ nhảy cẫng lên,\\nchiếc ống dài đeo trên vai――ống đựng bản vẽ cũng nhảy múa theo."
2411 = "Rõ ràng là đương nhiên, nhưng lại thấy cô đơn.\\nRõ ràng là đương nhiên, nhưng lại thấy bất an."
2413 = "Mộ của gia đình Sogou, gia đình ruột thịt của tôi.\\nMộ của bố, mẹ, và Michiko――Nơi an nghỉ của chỉ ba người."
2415 = "Đúng vậy. Quả thực tôi đã nghĩ như thế.\\nTừ hồi đó, tôi đã ghét việc bị đối xử như một nạn nhân của vụ tai nạn."
2421 = "Về Paulette, về Reina, về Hachiroku.\\nCứ kể ra, rồi mọi chuyện sẽ kết nối với nhau."
2423 = "Một thứ gì đó chỉ có thể gọi là \"linh hồn\",\\nthực sự tồn tại trên cõi đời này."
2433 = "Ngài Taito đã dạy tôi rằng làm như vậy mới có thể sống sót.\\nRằng làm như vậy chính là sự chuộc tội, là sự đền đáp của tôi."
2435 = "Mặc dù vậy mà nó vẫn hỏi câu đó,\\nkhiến chính tôi cũng cảm thấy thật kỳ lạ."
2437 = "Khi nhận ra, tôi đã ngồi đối diện con bé.\\nMà chẳng hề có cảm giác mình đã làm vậy."
2438 = "Vừa nghĩ vậy, tôi liền nở nụ cười khổ."
2441 = "Ra là vậy, quả thực có thể là một mâu thuẫn.\\nViệc phân biệt \"bản thân trong quá khứ\" và \"bản thân hiện tại\"."
2442 = "Tôi đã khiến Hibiki vô cùng lo lắng bồn chồn."
2448 = "Lưng tôi được vỗ nhẹ một cái.\\nBởi cánh tay dịu dàng và những lời nói của chị Mayami."
2454 = "Thực tế, cơ thể và trái tim tôi đã run rẩy đến thế."
2456 = "Trong khoảnh khắc, một bóng đen vụt đổ xuống.\\nKhông phải trên khuôn mặt Hachiroku, mà là trên mặt đất."
2472 = "Về mặt tinh thần cơ, định nói vậy nhưng tôi lại nuốt ngược vào trong."
2473 = "Và rồi khi cuối cùng cũng gặp lại nhau trong mơ,\\nMichiko đang khóc một mình."
2475 = "Được hỏi, tôi mới nhận ra."
2482 = "Thay vì nói là giỏi kinh doanh,\\ncó lẽ họ mở cửa hàng ở đây cũng là để nhắm tới lượng khách này."
2483 = "Và đồng thời, là cảm giác tội lỗi.\\nBóng lưng của Michiko trông quá đỗi nhỏ bé và yếu ớt."
2484 = "Dù chỉ là 0.1%, nếu linh hồn của Michiko vẫn còn tồn tại trên cõi đời này,\\nvà có nguy cơ đang lạc lối――"
2509 = "Lời nói nghẹn lại nơi cổ họng.\\nBởi vì tấm áp phích đó, là tấm áp phích có hình ảnh của 'mọi người'."
2510 = "Vừa nói xong, tôi bất giác cúi đầu. Nhờ đó, tôi nhận ra.\\nTôi cảm thấy vô cùng xấu hổ vì sự vô tâm của chính mình."
2511 = "Vừa dứt lời, tôi chợt nhận ra.\\nChắc chắn bố và mẹ cũng đang lo lắng."
2512 = "Nói ra rồi, tôi như kiệt sức.\\nMột cảm giác bất an tột độ ập đến."
2513 = "Nói xong, tôi chờ vài giây.\\n……Navi không gửi thêm bất kỳ lời giải thích nào."
2519 = "Ngay sau khi gặp Michiko trên chuyến tàu,\\nlẽ ra tôi nên đến báo tin này đầu tiên mới phải――"
2543 = "Michiko đang mỉm cười với tôi.\\nCon bé hồn nhiên vui mừng khi thấy tôi \"trông có vẻ vui vẻ\"."
2545 = "Như đang nghiền ngẫm. Như đang cố thuyết phục bản thân.\\nMichiko chậm rãi lặp lại cái tên Hachiroku."
2547 = "Michiko đung đưa chân.\\nĐung đưa, đung đưa."
2549 = "Michiko đang nhìn chằm chằm vào tôi.\\nBằng đôi mắt ngây thơ, con bé cứ nhìn chằm chằm."
2550 = "Nụ cười của Michiko đã quyết định giúp tôi.\\nGa cuối――Nơi mà tôi vẫn luôn tìm kiếm."
2553 = "Hình ảnh tôi mà Michiko nhìn thấy có lẽ là tôi ở nhà ga.\\nNhững cảnh vật nhìn từ cửa sổ tàu là tất cả những gì con bé có thể thấy."
2554 = "Michiko mỉm cười.\\nVô cùng an tâm――Với khuôn mặt hay làm nũng đầy hoài niệm của Michiko."
2556 = "Một cái gật đầu nhẹ.\\nRồi Michiko nhìn thẳng vào tôi."
2559 = "Vẫn giữ nguyên dáng vẻ khỏe mạnh, vẫn là Michiko trước khi gặp tai nạn.\\nThế nhưng con bé lại khóc một mình."
2569 = "Không có chỗ nào để nghi ngờ điều đó.\\nChính vì thế……Sự bối rối mới ập đến sau khi tôi đã hiểu ra."
2570 = "Khoảnh khắc cảm nhận được điều đó, một cảm xúc trào dâng.\\nMột khối lớn vô cùng trào lên từ tận đáy lòng."
2571 = "Tôi có thể nói điều đó.\\nKhông hề khiên cưỡng, không hề đau khổ."
2572 = "Tấm bia mộ bình dị, nhưng đây là lần đầu tiên tôi nhìn thấy.\\nMộ của bố, mẹ và――Michiko."
2573 = "Từ ngữ bất ngờ đó ngược lại lại giúp tôi dễ hiểu hơn."
2574 = "Điều đó khiến tôi thấy vui.\\n――Vì Michiko bây giờ, vẫn luôn là Michiko không hề thay đổi."
2575 = "Lời đề nghị xin nghỉ phép đầu tiên kể từ khi trở về Ohito\\nđã được nhà Migita và Đường sắt Ohito nhanh chóng chấp thuận."
2576 = "\"Tại sao lại sợ\", ngay cả việc nghĩ về điều đó cũng thấy sợ.\\nPhù, phù. Tôi nghe thấy tiếng thở nông và nhanh của mình, cảm thấy khó thở."
2577 = "Bây giờ, \"bản thân trong quá khứ\" đã quay trở lại.\\nMột đứa trẻ ngây thơ, không biết gì――chỉ là một đứa trẻ đơn thuần."
2581 = "Không bị trói buộc bởi cảm giác nghĩa vụ――chỉ cần tình yêu thương của bố, mẹ và Michiko,\\nlà tôi đã có thể đứng vững."
2582 = "\"Tới ga cuối\"――Tâm tư tôi luôn mang theo và hiện tại,\\nKeng một tiếng, đã kết nối lại với nhau."
2584 = "Tên của Reina được nhắc đến, nhưng tên chị Mayami thì không.\\nVì thế, tôi có thể dễ dàng suy đoán."
2585 = "Đối với một kẻ nghiệp dư như tôi thì hành động này có vẻ vô nghĩa,\\nnhưng Navi không thể nào làm những việc vô nghĩa được――"
2586 = "Vừa thấy tội nghiệp, lại vừa thấy vui.\\nThế nên, tôi muốn làm em ấy an tâm dù chỉ một chút."
2587 = "Dù lúc đó nói ra mà không suy nghĩ――\\nKhông, nếu không suy nghĩ, thì đó hẳn là những lời gần với tiếng lòng của tôi nhất."
2588 = "Dù không bao giờ có thể cùng Michiko trưởng thành được nữa――\\nNhưng dẫu vậy, tôi cũng sẽ không để Michiko phải cô đơn."
2589 = "Dù lúc đó đã phải chia lìa――\\nNhưng chúng tôi, ngay cả bây giờ, vẫn là anh em sinh đôi mà."
2599 = "Gió thổi.\\nLàm rung rinh những tán cây bao quanh nghĩa trang, tạo nên những tiếng xào xạc."
2602 = "（……Biết đâu, có khi nào）"
2614 = "（Phù――）"
2616 = "（Cọc cạch, cọc cạch,\\nxình xịch, xình xịch——）"
2617 = "（Thịch）"
2618 = "（Đối diện sao――\\nRốt cuộc, mình nên làm thế nào đây）"
2621 = "（Đúng vậy. Hơn nữa――công việc, chính là cuộc sống.\\nNếu có thể nghiêm túc đối diện với công việc của mỗi người）"
2622 = "（Lạo xạo）"
2625 = "（Bố và mẹ――\\nCó lẽ cũng đang ở trên chuyến tàu đó, tiếp tục lang thang vô định.）"
2628 = "Navi không thể bận tâm đến cả khía cạnh tinh thần của tôi.\\nDo đó, nó tuyệt đối không biết nịnh nọt."
2630 = "Navi vẫn không đổi, lượn vòng trên đỉnh đầu tôi.\\n……Ngoài ra không nghe thấy gì khác. Ngay cả giọng nói của ai đó cũng không vang lên."
2631 = "Navi và Hibiki.\\nLý do họ khuyên tôi có lẽ khác nhau, nhưng――"
2633 = "Navi vẫn đang lượn vòng trên không trung hết lần này đến lần khác,\\nkiên nhẫn chờ đợi tôi."
2636 = "Navi hỏi một điều mà đáng lẽ nó phải biết.\\nThế nên tôi trả lời. Chỉ đơn thuần thuật lại sự thật trong quá khứ theo đúng như những gì được hỏi."
2639 = "Cách đối đáp của Navi thẳng thắn đến mức con người không thể có được.\\nVì vậy, đôi khi nó khiến tôi phải suy nghĩ về những điều mà bình thường tôi chẳng màng tới."
2641 = "Giọng nói của Navi không hề có chút thay đổi nào.\\nThế nhưng, tôi cảm nhận được. Một sự vội vã, hay thứ gì đó gần giống như sự sợ hãi."
2642 = "Nếu là đánh giá do Navi đưa ra thì chắc chắn là thỏa đáng――\\nBiết vậy, nhưng tôi vẫn không thể chấp nhận được."
2644 = "Navi tuyệt đối không bao giờ nói dối.\\nNgay cả khi muốn nói đùa, nó cũng không thể nói được."
2646 = "Navi lượn một vòng lớn.\\nXoay tròn, gần như 360 độ."
2649 = "Navi vẫn là Navi.\\nLúc nào cũng vậy, không hề thay đổi chút nào."
2650 = "Hiếm khi thấy Navi im lặng."

[selections]
