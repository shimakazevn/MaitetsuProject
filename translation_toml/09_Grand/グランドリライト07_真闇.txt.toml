[script]
1460 = "——Hachiroku, Hibiki. Paulette, Reina. Nagi. Fukami. Chị Mayami, Kisaki, và tất nhiên là cả Navi trên bầu trời nữa."
1463 = "——Hơn nữa, vì vị ngon hòa quyện ấy, em đã uống cạn cả ly. Dù tự biết tửu lượng của mình chẳng khá khẩm gì cho cam."
1464 = "——Trong vắt, nhưng dĩ nhiên không hề vô vị. Vị ngọt của nước sông Kuma, của gạo Kuma, lặng lẽ đọng lại trên đầu lưỡi."
1491 = "……À không, nhắc mới nhớ, từ nãy đến giờ…… Có vẻ như chúng em đã không thực sự hiểu ý nhau ở điểm đó——"
1496 = "……Hachiroku có vẻ đã đi làm nhiệm vụ rồi. Không khí trong phòng có chút gì đó trống trải."
1499 = "……Cứ ở cạnh nhau là Nagi và Fukami lại thế."
1502 = "……Lâu lắm rồi mới thấy. Chế độ hoang tưởng, mất kiểm soát của Fukami."
1505 = "……Ngay cả thời gian, dường như cũng trôi chậm lại theo nhịp tay của chị Mayami."
1506 = "……Hoàn toàn không phải là nói dối. Vì một phần thân phận của em hiện tại vẫn là nhân viên kinh doanh quèn của tiệm rượu Migitakazu."
1508 = "……Chỉ cần đưa ra một cái tên thôi. Những chi tiết cứ thế dần dần được bồi đắp."
1513 = "……Hibiki không nói một lời, em ấy đã bắt đầu vẽ logo lên trang tiếp theo của cuốn sổ phác thảo."
1517 = "……Quả nhiên, rất ngon. Sự trong trẻo ấy, không hề vẩn đục dù chỉ một chút."
1518 = "……Một điều gì đó, rất quan trọng, đang dần tan biến vào ánh sáng ban mai. Chắc chắn, em sẽ quên mất giấc mơ này."
1520 = "……Lách tách, lách tách. Chỉ nghe thấy âm thanh ca hát khe khẽ của \\x%l麹;#00ffc040;men kōji%l;#;."
1525 = "……Nếu kế hoạch này tiến triển tốt, các công ty ở Kyushu chắc chắn sẽ đồng loạt chào đón Maitetsu và đổ xô đi tìm kiếm đầu máy."
1528 = "……Dù biết chị đang nói về Miyako, nhưng em vẫn cảm thấy chút bối rối như thể chị đang nói về chính bản thân em ngày xưa vậy."
1529 = "……Chậm rãi, thức giấc. Trong khi vẫn biết rõ nơi mình vừa thức giấc, là ở trong một giấc mơ."
1537 = "\"「——À.」\""
1538 = "\"「——Muốn báo đáp công ơn của chị Mayami.」\""
1541 = "\"「——Dù được ủ theo chủ nghĩa quản lý hoàn toàn bằng dữ liệu. Nhưng quả nhiên, trái tim vẫn luôn hiện hữu trong đó nhỉ.」\""
1546 = "\"「『\\x%lレイルロオド;#00ffc040;Railord%l;#; cũng có trái tim』—— Người đã dạy chị điều đó, chẳng phải là Sou-chan sao.」\""
1548 = "\"「『Đường sắt lãng mạn tuyến Yui』—— Ý tôi là, chỉ cần áp dụng mô hình đó cho tất cả các tuyến đường là được.」\""
1549 = "\"「『Đường sắt lãng mạn tuyến Yui』. Tái hiện lại phong cảnh đường sắt hoài niệm thuở xưa—— của thời kỳ đầu Showa trên toàn tuyến Yui.」\""
1552 = "\"「\"Biến các tuyến đường sắt thành danh mục giới thiệu của từng thành phố, từng nhà ga\". Đó chẳng phải là ý tưởng cơ bản của Soutetsu sao.」\""
1557 = "\"「……Thể chế toàn Kyushu, là thứ như thế nào vậy ạ?」\""
1559 = "\"「…………Ưm.」\""
1574 = "\"「……Không phải \\x%l待避線;#00ffc040;đường tránh tàu%l;#; chỉ dùng để tránh tàu—— Vậy thì?」\""
1585 = "\"「……Thực sự, đã lớn rồi nhỉ.」\""
1587 = "\"「……Nếu là công ty công tư hợp doanh thì chỉ cần thuyết phục chính quyền địa phương là được. Còn nếu là công ty tư nhân độc lập hoàn toàn, thì ngược lại, nhờ chính quyền địa phương hợp tác——」\""
1589 = "\"「……Những tổ chức hay gây áp lực ấy, kiểu gì họ cũng sẽ huy động phiếu bầu theo tổ chức cho mà xem.」\""
1592 = "\"「……Nếu biết đây là cảm nhận của em, có khi chỉ vì thế mà Miyako sẽ trở nên cố chấp cũng nên.」\""
1594 = "\"「……Em thì, về các tuyến đường sắt ở Kyushu, hầu như chỉ biết mỗi tuyến Yui thôi.」\""
1596 = "\"「……Sou-chan?」\""
1597 = "\"「……Khung cảnh nhìn từ cửa sổ tàu này, có gì thay đổi sao?」\""
1598 = "\"「……Từ quá khứ, đến tương lai. Trong dòng chảy đó, chuyến tàu kết nối toàn bộ Kyushu.」\""
1601 = "\"「……Chắc là vậy rồi. Dù sao thì, em ấy cũng là \\x%lレイルロオド;#00ffc040;Railord%l;#; mà.」\""
1603 = "\"「……Đúng vậy.」\""
1605 = "\"「……Hương vị thật trong trẻo làm sao. Không thể tin được đây lại là loại rượu shochu được sinh ra từ cùng một xưởng với \"Migitakazu\".」\""
1610 = "\"「……Để xem nào.」\""
2022 = "\"「Một tháng——thì hơi khó, nhưng có lẽ khoảng hai tháng một lần, mình nên chủ động xin nghỉ phép trọn vẹn một ngày.」\""
2024 = "\"「Tiền ăn tính riêng, mỗi ngày sẽ là chín vạn chín ngàn chín trăm chín mươi chín yên.」\""
2026 = "\"「Cậu định giá bao nhiêu một khoang?」\""
2028 = "\"「Không——」\""
2029 = "\"「Không đâu. Nếu vận chuyển khắp Hinomoto, thì dùng xe đông lạnh chắc chắn sẽ tốt hơn.」\""
2032 = "\"「Không chỉ thế đâu, cả nước ép trái cây nữa! A!! Đúng rồi, cả rượu, rượu shochu nữa.」\""
2033 = "\"「Không đâu? Chị nhận được rồi mà. Một sự báo đáp tuyệt vời nhất, xịn xò nhất luôn.」\""
2036 = "\"「Xin lỗi chị. Tự nhiên lại thành ra một ngày thế này. Em vốn muốn dành trọn ngày hôm nay chỉ để báo đáp công ơn của chị Mayami thôi.」\""
2040 = "\"「Không phải đâu Nagi. Kyushu có chín phần là tính theo tên các vùng quốc gia cũ cơ. Cậu từng nghe rồi đúng không? Higo hay Satsuma ấy.」\""
2042 = "\"「Không phải cô bé rụt rè. Là Fukami.」\""
2044 = "\"「Nhưng chắc không đến mức, ngay cả 4 toa cũng không thể tránh tàu—— Làm gì có tuyến đường nào như vậy đúng không ạ?」\""
2045 = "\"「Được đấy. Rất được. Một cái tên tuyệt vời. Ngay cả chị nghe xong cũng muốn thử lên ngồi một chuyến rồi.」\""
2047 = "\"「Không, loại ra thì không ổn đâu.」\""
2048 = "\"「Không, hoàn toàn khác. Là một người ở Omuta——cô ấy đã quyết định không cho đầu máy của mình chạy nữa, để dành làm phụ tùng thay thế.」\""
2051 = "\"「Không. Điều tôi mong muốn ngay từ đầu là biến chuyến tàu này thành một chuyến tàu dành cho những chuyến du lịch gia đình.」\""
2052 = "\"「Không, anh chợt nghĩ ra thôi. Lại đi viếng mộ bố mẹ một chuyến cũng không tồi.」\""
2057 = "\"「Sự kết nối. Phương tiện để kết nối Kyushu. Một thứ gì đó còn thiếu——em đã luôn trăn trở về điều đó.」\""
2059 = "\"「Ý tưởng~, ý tưởng~, ý tưởng~」\""
2060 = "\"「Kyushu rộng lắm đó nha~! Reina nghĩ chuyện đó khó lắm luôn ấy ạ~」\""
2062 = "\"「Stars là những vì sao đúng không ạ~. Ufufu~, chín vì sao.」\""
2065 = "\"「Nine Stars! Ngầu quá đi!!」\""
2072 = "\"「Có nghĩa là, chúng ta sẽ bán vé theo đơn vị từng ngày, từng chặng đúng không?」\""
2073 = "\"「Tóm lại là, em chỉ đơn giản là」\""
2076 = "\"「Vậy là, một khoang có thể ngủ được sáu người sao.」\""
2078 = "\"「Đúng vậy nhỉ.」\""
2084 = "\"「Nhân sự cũng tăng lên, Fukami đã có thời gian cho riêng mình. Hiện tại, em ấy đang học việc từ vị trí nhân viên nhà ga để lấy chứng chỉ \\x%l車掌;#00ffc040;trưởng tàu%l;#;.」\""
2087 = "\"「Tự nhiên á——A! Đây là bánh nướng dài của tiệm Niwami mà. Anh hai pha trà cho em à.」\""
2094 = "\"「Dù là đầu máy hơi nước hay \\x%l気動車;#00ffc040;toa xe tự hành%l;#;, kỹ thuật lái của họ đều ở mức thượng thừa. Hơn nữa, báo cáo sau chuyến đi——chất lượng nội dung thật sự áp đảo.」\""
2100 = "\"「Nhưng dù vậy, vẫn là rất thích nhỉ. Tin tức về 『Đường sắt Hinomoto』. Mi-chan vui lắm luôn đấy.」\""
2102 = "\"「Nhưng giờ thì tôi hiểu. Để biến câu chuyện viển vông đó thành hiện thực—— Soutetsu, cậu đã nghĩ ra phương pháp cụ thể rồi đúng không?」\""
2105 = "\"「Vì thấy em có vẻ đang thèm nhân đậu đỏ (An) mà.」\""
2106 = "\"「Chẳng phải chị đã kể cho em nghe sao. Lúc phỏng vấn, Miyako đã nói, 『Không bao giờ muốn dính dáng đến đường sắt nữa』.」\""
2109 = "\"「Anh không cần phải làm vẻ mặt lo lắng thế đâu. Dù bên trong tàu lúc nào cũng giống nhau, nhưng nếu nhìn ra ngoài cửa sổ——」\""
2112 = "\"「Sao thế Hibiki? Nếu em có chuyện gì muốn nói thì cứ nói đi.」\""
2113 = "\"「Sao anh lại thấy bất ngờ?」\""
2115 = "\"「Việc đó, lúc nào anh chẳng làm. Những lúc được nghỉ ngơi thì cứ nghỉ ngơi đi, chắc chắn sẽ nảy ra ý tưởng hay hơn đấy?」\""
2117 = "\"「Làm gì có chuyện đó! Việc em khiến họ rút lại dự án xây nhà máy Aircra, đó mới là sự giúp đỡ lớn lao nhất đấy.」\""
2118 = "\"「Em định đi đâu à?」\""
2120 = "\"「Người mà em quen biết đó, có muốn đến Đường sắt Ohito không?」\""
2122 = "\"「Chị nghe đây, Reina. Ai gọi thế?」\""
2123 = "\"「Đây, Hibiki. Thứ em đang tìm đây.」\""
2128 = "\"「Xe đông lạnh——trước thời kỳ Đại bãi bỏ, đã có loại toa xe như vậy rồi sao.」\""
2136 = "\"「Việc dùng một mình 8620 để kéo tàu đi khắp toàn tuyến Kyushu, ngay từ đầu đã là chuyện không tưởng rồi.」\""
2143 = "\"「Thực ra, bên Đường sắt Mikan có nói là đầu máy và \\x%lレイルロオド;#00ffc040;Railord%l;#; từng dùng làm \\x%l入換機;#00ffc040;đầu máy dồn toa%l;#; có vẻ đang bị dư thừa.」\""
2146 = "\"「Thêm vào đó những món quà lưu niệm, đồ kỷ niệm sang trọng, rồi bán vé trọn gói với giá chín mươi chín vạn chín ngàn chín trăm chín mươi chín yên.」\""
2159 = "\"「Dừng lại đi~ Thôi đi mà~ Anh hai mà cũng chơi trò chơi chữ nhạt nhẽo của mấy ông chú á!」\""
2161 = "\"「Vừa nãy là vi phạm luật rồi! 100% là trò đùa của mấy ông chú! Giống hệt mấy lời mấy ông chú hay nói——Amu!?」\""
2164 = "\"「Dù đầu máy của mình đã bị tháo dỡ…… Em ấy vẫn luôn là một cô bé dịu dàng sao.」\""
2165 = "\"「Ra là vậy. Tóm lại là, cậu định biến nó thành một chuyến tàu du lịch hạng cao cấp đúng không?」\""
2166 = "\"「Ra là vậy, sẽ cực kỳ khó khăn nhỉ. Nói vậy thì, cần phải có \\x%l補機;#00ffc040;đầu máy phụ%l;#; sao.」\""
2180 = "\"「Đơn giản là?」\""
2182 = "\"「Nếu chỉ đơn thuần là kết nối các tuyến đường sắt thì không thể gọi là kết nối được. Trên đó, cần phải có một thứ gì đó——một thứ gì đó.」\""
2184 = "\"「Quầy buffet thì không được. Phải là toa ăn mới được. Vì chuyến tàu này bán niềm vui của thời gian mà, đúng không?」\""
2187 = "\"「Hửm? Mới có bảy thôi mà? Tính cả Okinawa thì mới là tám! Còn một cái để quên ở đâu rồi?」\""
2190 = "\"「Chỉ cần mời là chắc chắn sẽ đến thôi! Người đó đang rất muốn có đầu máy và \\x%lレイルロオド;#00ffc040;Railord%l;#; của riêng mình mà.」\""
2192 = "\"「Nếu vậy thì \\x%l編成;#00ffc040;đoàn tàu%l;#;. Nếu quá dài và quá lớn, có thể sẽ có những tuyến đường không thể thực hiện tránh tàu được.」\""
2194 = "\"「Nhưng mà cái này——sẽ đi vòng quanh toàn bộ Kyushu đúng không? Trong tương lai ấy. Nếu không làm được vậy thì chẳng có ý nghĩa gì cả.」\""
2199 = "\"「Nhưng mà, chỗ đó……việc phân phòng, chắc sẽ phải theo thứ tự ưu tiên đăng ký trước, hoặc là bốc thăm hoàn toàn thôi.」\""
2202 = "\"「Nhưng nếu làm vậy. Vấn đề vẫn sẽ tiếp tục tồn tại.」\""
2203 = "\"「Nhưng mà nhưng mà, như thế thì số lượng sẽ khổng lồ lắm đó nha~?」\""
2204 = "\"「Nhưng mà, cô bé đó thực sự rất nhỏ bé và yếu ớt. Làm \\x%l補機;#00ffc040;đầu máy phụ%l;#; cho tàu giường nằm thì chắc chắn là không nổi đâu.」\""
2208 = "\"「Nhưng mà! Mỗi công ty đường sắt đều hoạt động độc lập. Tôi không nghĩ tất cả bọn họ đều sẽ đồng ý với ý tưởng đó đâu.」\""
2218 = "\"「Pyau!? Anh hai!? Hả? Gì cơ!? Anh ở đây từ bao giờ thế!!?」\""
2220 = "\"「Đi cùng chị Mayami và mọi người sao——」\""
2221 = "\"「Oa oa oa! Sẽ bị dư ra ngoài đó nha~! Nếu vậy thì các đoàn tàu không thể tránh nhau được đâu ạ~」\""
2224 = "\"「Oa oa oa! Khẩn cấp ạ~! Reina gọi Paulette ngay đây nha~! Paulette ơi~」\""
2225 = "\"「Oa oa oa! Đủ cả Kyushu rồi!」\""
2228 = "\"「Oa oa oa! Tuyệt quá!! Nếu vậy, nếu vậy thì, chúng ta còn có thể ăn cả kem của khắp các vùng Kyushu nữa!!」\""
2230 = "\"「Oa oa oa! Thế thì tuyệt quá!!」\""
2231 = "\"「Oa!」\""
2233 = "\"「Oa, tuyệt thật đấy!! Nếu đi du lịch Satsuma mà được ở khoang Satsuma, thì niềm vui của chuyến đi chắc chắn sẽ tăng lên gấp bội!」\""
2234 = "\"「Ôi chà. Phòng tắm hơi cơ á. Nóng cỡ đó thì sợ rượu bị biến chất mất thôi——A!」\""
2236 = "\"「Ôi chà. Em cãi nhau với Mi-chan à?」\""
2239 = "\"「Ôi chà.」\""
2241 = "\"「Hả? Anh Soutetsu!? ——Khoan, ể! Khẩn cấp á!?」\""
2243 = "\"「À——ra là vậy, cũng có thể phát sinh những lo ngại đó nhỉ.」\""
2244 = "\"「Ồ!」\""
2245 = "\"「Ồ!」\""
2247 = "\"「Dù chị nói vậy nhưng em vẫn khó lòng tin được. Một hương vị mang đến cảm giác dịu dàng……thậm chí là ấm áp.」\""
2248 = "\"「Hừm.」\""
2249 = "\"「!」\""
2250 = "\"「À——」\""
2251 = "\"「À——ừm.」\""
2253 = "\"「À——ra vậy, 『Chuyến tàu đi tới tương lai』.」\""
2255 = "\"「À——ra là vậy. Ừm. Nghe em nói mới thấy, đó là chuyện hiển nhiên nhỉ.」\""
2257 = "\"「À……ừm. Đúng là vậy nhỉ. Hiểu rồi, tôi sẽ rút lại phương án của mình.」\""
2258 = "\"「À.」\""
2259 = "\"「Awa wa wa wa, nếu bé Chikage mà đến Ohimitera, mà đến đây thì.」\""
2261 = "\"「A!!」\""
2262 = "\"「A!」\""
2263 = "\"「À! Chuyện đó á.」\""
2266 = "\"「A! Đúng rồi. Bé Fukami. Là bé Fukami nhỉ. Dạo này, em ấy cũng không còn rụt rè như trước nữa rồi.」\""
2268 = "\"「A! Nếu là cái đó thì đủ chín hả?」\""
2269 = "\"「A!!」\""
2271 = "\"「Hả!? Đừng nói là bé Chikage nha!!?」\""
2273 = "\"「A, không!? Chuyện xe đông lạnh hay toa phát điện, chị cũng nghĩ đó là ý tưởng hay.」\""
2276 = "\"「À, thầy cúng Akai——\\x%l運転士;#00ffc040;nhân viên cơ vụ%l;#; Akai và Niiroku sao. Quả thực, có rất nhiều điều để học hỏi từ bộ đôi đó.」\""
2279 = "\"「A, cậu nói mới để ý.」\""
2281 = "\"「A? Chia nhỏ ra? Chia thành từng phần nhỏ á?」\""
2285 = "\"「Alo, anh Soutetsu? Em Paulette đây.」\""
2287 = "\"「Vâng ạ~. Đây là cửa hàng đường sắt của Đường sắt Ohito nha~」\""
2288 = "\"「À——」\""
2290 = "\"「Ừm——Chẳng phải khách hàng lên tàu là vì muốn được 8620 của Ha-chan, được \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; kéo đi sao?」\""
2293 = "\"「Ưm……hự——」\""
2294 = "\"「Đúng vậy. Kỳ nghỉ dài chín ngày, không phải ai cũng dễ dàng xin nghỉ được.」\""
2296 = "\"「Ừm. Tóm lại là, em chỉ đơn giản là——」\""
2298 = "\"「Ừm. Nếu có thể, ở những đoạn đường đã được điện khí hóa trở lại, anh muốn cho \\x%l電車;#00ffc040;tàu điện%l;#; kẹp lấy nhóm toa hành khách——anh muốn cho chạy một \\x%l編成;#00ffc040;đoàn tàu%l;#; như vậy đấy.」\""
2303 = "\"「Ừm. Một cô bé dịu dàng đến mức quá đáng.」\""
2305 = "\"「Vâng. Em thấy một chú và một cô búp bê mới. Tuyệt lắm nhé! Lái cả 8620, cả KiHa 07? nữa.」\""
2307 = "\"「Ừm. Chào buổi sáng, Michiko. Cảm giác như đã lâu lắm rồi ấy nhỉ.」\""
2309 = "\"「Ừm. Tất nhiên, khách hàng muốn xa xỉ thuê nguyên khoang cho một người, hay cho một cặp đôi thì cũng chẳng sao cả.」\""
2310 = "\"「Vâng.」\""
2311 = "\"「Vâng! Michi nghĩ nhé? Anh Sou-chan nên đi cùng chị Hibiki, chị Hachiroku và chị Makura nữa.」\""
2314 = "\"「Đúng vậy, nếu là Higo thì sẽ dùng đồ gỗ nội thất của Ohimitera. Chiếu cói của Yatsushiro. Gốm sứ của Amakusa. Đèn lồng của Yamaga——chúng ta sẽ trang bị nội thất bằng những thứ đó.」\""
2316 = "\"「Ừm. Tớ nghĩ là được. À không, ừm! Tớ sẽ đi hỏi họ!」\""
2319 = "\"「À. Em từng nghe Reina kể rồi. Vào mùa hè, bên trong \\x%l貨車;#00ffc040;toa chở hàng%l;#; có thể lên tới hơn 50 độ, hầm hập như phòng tắm hơi vậy.」\""
2322 = "\"「Vâng. Em định đến Jussen, vẽ lại chiếc xe đang được đưa vào sửa chữa. Biết đâu lúc đó sẽ nảy ra ý tưởng gì đó.」\""
2324 = "\"「Ừm. Em được nghỉ. Nếu chị cần gì, em có thể giúp cả ngày luôn cũng được.」\""
2325 = "\"「À, đúng rồi. Chính xác là vậy.」\""
2327 = "\"「Vâng. Chuyện là vầy nhé? Bọn em chỉ mới quen nhau qua công việc thiết kế thôi—— nên em cũng chưa biết chắc chắn thế nào đâu.」\""
2329 = "\"「Vâng. Tất nhiên là được rồi—— Nhưng có chuyện gì vậy anh? Rốt cuộc là chuyện gì?」\""
2330 = "\"「Hửm?」\""
2332 = "\"「Hửm? Không, em đâu có cãi nhau——」\""
2334 = "\"「Hửm? Gì cơ?」\""
2336 = "\"「Ừm. Sao thế em?」\""
2337 = "\"「Cậu nói nghe dễ thế, Kisaki. Những trang thiết bị vượt quá khả năng chỉ làm tăng thêm gánh nặng chi phí cố định một cách vô ích thôi.」\""
2340 = "\"「Ufufu. Em nói thế là chị sẽ bắt Sou-chan làm việc quần quật cả ngày thật đấy nhé?」\""
2342 = "\"「À——ra là vậy sao.」\""
2343 = "\"「Hô. Chuyện gì vậy?」\""
2345 = "\"「Gia đình bốn người, và cả ông bà nữa cũng lên được luôn đó nha~」\""
2351 = "\"「Thế nên, tôi muốn chia thành chín chặng, mỗi chặng một ngày. Hoặc là chia thành ba lần, mỗi lần ba chặng, để hành khách có thể tận hưởng chuyến đi.」\""
2354 = "\"「Thế nên, chúng ta sẽ thay đổi đầu máy. Nếu có thể, từ đầu máy hơi nước sang diesel, từ diesel sang đầu máy điện chẳng hạn.」\""
2357 = "\"「Thế nên, tôi muốn bán vé theo đơn vị khoang hành khách. Không phải là bao nhiêu tiền một người, mà là bao nhiêu tiền một khoang.」\""
2358 = "\"「Thế nên, để nhấn mạnh điều đó ở mức tối đa…… Ví dụ như. Trước tiên là bán trên xe đẩy của các chuyến tàu du lịch——à không.」\""
2359 = "\"「Bởi vì, chỉ tính những thứ vừa kể thôi đã có đầu máy, ba \\x%l客車;#00ffc040;toa hành khách%l;#;, xe đông lạnh, toa ăn. Rồi còn cần cả toa phát điện nữa đúng không?」\""
2362 = "\"「Trong trường hợp đó, việc phải kéo sáu toa xe nặng nề, bao gồm cả xe đông lạnh và toa phát điện, mà chỉ dùng một đầu máy 8620 để chạy thì——」\""
2363 = "\"「Báo đáp công ơn.」\""
2364 = "\"「Việc báo đáp, để lần sau nhé. Chuyến tàu này—— Đợi đến khi Nine Stars bắt đầu lăn bánh, lúc đó hẵng hay.」\""
2368 = "\"「Tiếc thật đấy! Nếu có thứ đó để chạy điều hòa hay gì đó, thì những chuyến du lịch bằng tàu hỏa đã khác hoàn toàn rồi nhỉ.」\""
2370 = "\"「Mấy ông chú—— Không, anh định chơi chữ cho nó duyên dáng tí thôi mà.」\""
2373 = "\"「Vừa mang vẻ sang trọng, nhưng lại không hề phô trương. Quả thực, em cũng cảm thấy đây là một cái tên rất tuyệt vời.」\""
2374 = "\"「Kỳ lạ……à, ừm. Anh cảm thấy hơi bất ngờ một chút. Việc Michiko lại khuyên anh như vậy.」\""
2377 = "\"「Mấy đứa nhỏ đó——」\""
2379 = "\"「Cô bé đó, có thể làm nhiệm vụ trên D51 không?」\""
2380 = "\"「Xe đông lạnh? Loại \\x%l貨車;#00ffc040;toa chở hàng%l;#; tối tân nhất có gắn tủ lạnh điện ấy, em ấy kể là từng kéo loại đó rồi, đại loại thế.」\""
2385 = "\"「Hay quá! Ý kiến đó hay lắm! Michi, hoàn toàn tán thành!!」\""
2387 = "\"「Khi Nine Stars bắt đầu lăn bánh, 8620 sẽ chạy trên tuyến Hisatsu—— vượt qua Yatake để hướng tới Hayato đúng không ạ.」\""
2391 = "\"「Nếu đi đủ sáu người, thì chi phí đi lại và ăn ở mỗi người chỉ hơn một vạn sáu ngàn yên một chút——ừm. Cũng có thể coi là mức giá phù hợp cho gia đình.」\""
2392 = "\"「Nếu chỉ nghĩ nó là 『\\x%l待避線;#00ffc040;đường tránh tàu%l;#; chỉ dùng để tránh tàu』, thì đúng như lời Paulette nói.」\""
2395 = "\"「Nếu tạo ra kẻ bị bỏ rơi, thì mọi người sẽ không thể thân thiết với nhau được đâu ạ~」\""
2396 = "\"「Nếu không có, thì tạo ra là được chứ gì.」\""
2398 = "\"「Những \\x%l待避線;#00ffc040;đường tránh tàu%l;#; được thiết kế để chứa tối đa 4 toa, mà cố nhét một đoàn tàu 8 toa vào thì...」\""
2400 = "\"「Nếu biết đây là cảm nhận của em mà cách đón nhận của em ấy thay đổi. Thì mong chị hãy truyền đạt lại đây là cảm nhận của một 『Nhân viên kinh doanh của đại lý rượu』.」\""
2404 = "\"「Đối với chị mà nói, chị mới là người phải báo đáp công ơn của Sou-chan mới đúng.」\""
2407 = "\"「Nghe nói nó xuất hiện vào thời kỳ cuối cùng của Đường sắt Hoàng gia. Đáng tiếc là Đường sắt Hoàng gia đã sụp đổ trước khi nó kịp phát huy tác dụng.」\""
2418 = "\"「Thế rồi nhé? Chuyện về tàu chở hàng này nọ, Mi-chan đã kể cho chị nghe rất nhiều, rất nhiều luôn.」\""
2429 = "\"「Chúng ta sẽ biến chín vùng Kyushu đó thành chín khoang hành khách. Trên ba \\x%l客車;#00ffc040;toa hành khách%l;#; giường nằm, mỗi toa ba khoang.」\""
2431 = "\"「Phải biến bản thân chuyến tàu thành biểu tượng của sự kết nối. Kết nối con người với con người. Đó mới là điều quan trọng hơn cả.」\""
2432 = "\"「Lần này, chúng ta sẽ biến các nhà ga đường sắt thành trung tâm du lịch, đưa chúng trở lại vị trí trung tâm của quy hoạch đô thị. Việc làm lại đường ray đôi hay cải tạo thiết bị hiện có sẽ được tiến hành theo hướng đó.」\""
2433 = "\"「Ở mức độ đó thì em không đủ khả năng hướng dẫn đâu ạ…… Đào tạo bên ngoài——ừm. Không sao. Em có biết một nơi.」\""
2434 = "\"「Đúng vậy. Hoàn toàn loại bỏ những linh cảm hay kinh nghiệm của \\x%l杜氏;#00ffc040;trưởng hầm rượu%l;#;, đây là kết tinh của chủ nghĩa quản lý hoàn toàn bằng dữ liệu.」\""
2436 = "\"「Đúng vậy. Điều đó, đã luôn được giữ vững ngay từ đầu.」\""
2437 = "\"「Đúng vậy. Nếu là loại toa xe đó, thì dù có đi xa đến đâu cũng có thể vận chuyển hàng hóa mà vẫn giữ được độ tươi ngon. Ufufu.」\""
2438 = "\"「Ra là vậy……Rượu. Rượu shochu—— Không, không cần phải dừng lại ở đó.」\""
2439 = "\"「Đúng vậy. Reina nói đúng. Kyushu rất rộng lớn và đa dạng. Sự cạnh tranh giữa các khu vực cũng không hề nhỏ chút nào.」\""
2441 = "\"「Bé Nagi, và cô bé rụt rè bạn của Nagi.」\""
2453 = "\"「Mi-chan, sao.」\""
2454 = "\"「Cảm nhận của Mi-chan?」\""
2455 = "\"「Fukami, cậu có thể nhờ họ tư vấn được không?」\""
2458 = "\"「Ehehe, Michi vô ý quá! Đúng rồi nhỉ, thời gian đã trôi qua mà. Mấy đứa nhỏ đó, giờ cũng đã thành các chị lớn rồi.」\""
2459 = "\"「Sou-chan, không dừng lại ở đó là sao?」\""
2460 = "\"「Sou-chan, em bảo hôm nay em được nghỉ đúng không?」\""
2461 = "\"「Sao vậy? Sou-chan, mặt anh trông kỳ lạ thế~」\""
2462 = "\"「Sou-chan, anh dậy rồi à?」\""
2463 = "\"「Sou-chan, Hi-chan đang ở đâu vậy?」\""
2464 = "\"「Sao vậy? Sou-chan.」\""
2465 = "\"「Không sao đâu? Sou-chan.」\""
2466 = "\"「Sou-chan. Bây giờ, em rảnh một chút không?」\""
2467 = "\"「Sou-chan?」\""
2469 = "\"「『Thể chế toàn Ohimitera』 vẫn là chưa đủ—— Hoàn toàn, chưa đủ.」\""
2478 = "\"「Hay đấy. Dễ hiểu là một yếu tố rất quan trọng. Một cái tên dễ hình dung với bất kỳ ai sẽ là một điểm mạnh khi thuyết trình.」\""
2482 = "\"「Cuối cùng thì hiệu quả từ việc Ohimitera đoàn kết thành một khối cũng đã xuất hiện. Đặc biệt đối với thế hệ trẻ, có lẽ đây là một sự khích lệ rất lớn.」\""
2486 = "\"「Ga suối nước nóng Ohimitera cũng cần có một công trình gì đó nhỉ. Một cơ sở vật chất cho thấy đây là ga xuất phát của Nine Stars.」\""
2491 = "\"「Sao vậy, Nagi.」\""
2492 = "\"「Làm thế nào để tất cả người dân Kyushu coi đó là 『Chuyến tàu của chính mình』 được?」\""
2493 = "\"「Làm gì có chuyện đó.」\""
2494 = "\"「Nếu không được thì sao?」\""
2497 = "\"「Tự dưng thấy nhẹ cả người. Mà này, nãy giờ em cứ gồng mình lên ấy. Cứ suy nghĩ mãi, ru rú mãi trong nhà thì không ổn đâu nhỉ! Quả nhiên là vậy.」\""
2500 = "\"「Trưởng thành, sao.」\""
2503 = "\"「Em……từ lúc trở về Ohimitera đến giờ, chưa một lần nào, thực sự giúp đỡ chị được một việc cho ra hồn cả.」\""
2504 = "\"「Em muốn giúp đỡ trong quá trình, chứ không phải ở kết quả. Một cách trực tiếp hơn, cụ thể hơn. Bằng chính đôi tay này, em muốn giúp chị Mayami.」\""
2507 = "\"「Em nghĩ là vậy.」\""
2510 = "\"「Chuyện đó, chúng ta sẽ giải quyết bằng cách phục dựng và đóng mới xe đông lạnh. Xe đông lạnh giống như một chiếc tủ lạnh, tủ đông di động vậy.」\""
2511 = "\"「Chúng ta sẽ tạo ra một Thể chế toàn Kyushu.」\""
2514 = "\"「Như em đã nói lúc nãy—— Đó chính là điều em hằng mong muốn.」\""
2515 = "\"「Mới lúc nãy thôi. Đây, cứ tự nhiên ăn đi.」\""
2516 = "\"「Quả không hổ danh——chỉ có thể nói như vậy thôi.」\""
2519 = "\"「Anh nghĩ là anh đã tìm ra rồi. Phương pháp để kết nối đường ray dẫn tới tương lai.」\""
2521 = "\"「Nếu được vậy thì em rất vui, nhưng—— Dù sự thật là thế, thì vẫn không phải vậy.」\""
2522 = "\"「Mấy giờ cũng được. Cho anh mượn cửa hàng đường sắt nhé.」\""
2524 = "\"「Ý tưởng đó! Em thấy tuyệt lắm luôn!! Vừa mang tính quảng bá, lại vừa khiến người tham gia cảm thấy đây là 『Chuyến tàu của chính mình』.」\""
2526 = "\"「Vậy, chị nên truyền đạt lại thế nào đây?」\""
2527 = "\"「Em nghĩ nó quá hoàn hảo. Khiến người ta liên tưởng đến những chuyến tàu Blue Train thời xa xưa. Một cái tên có thể gây được tiếng vang với cả những người hâm mộ đường sắt.」\""
2530 = "\"「Cũng có thể làm được đấy ạ. Ngày nay, hiệu suất của máy phát điện và các thiết bị khác, chắc chắn đã có những bước tiến vượt bậc so với thời kỳ cuối của Đại bãi bỏ.」\""
2531 = "\"「Có lẽ vậy. Vì Mi-chan là một cô bé rất dịu dàng mà.」\""
2532 = "\"「Có lẽ vậy.」\""
2536 = "\"「Thì em đã bảo là vẫn chưa biết chắc chắn mà! Nhưng mà——」\""
2539 = "\"「Thì loại họ ra là xong. Rồi sau đó, chúng ta sẽ xây dựng tuyến đường mới riêng. Dù sao thì đây cũng là câu chuyện tạo ra cơ sở hạ tầng du lịch mà.」\""
2545 = "\"「Nine Stars sẽ dành chín ngày để dạo quanh chín vùng Kyushu, một chuyến du ngoạn thong thả và xa hoa.」\""
2546 = "\"「Relay Train Nine Stars (Chuyến tàu tiếp sức Chín Ngôi Sao). Chuyến tàu du lịch dạo quanh chín vùng Kyushu với chín khoang hành khách.」\""
2548 = "\"「Hiệu quả á?」\""
2550 = "\"「Vậy thì, Soutetsu. Chúng ta hãy thêm ưu đãi cao cấp vào đó đi. Trường hợp khách hàng mua vé trọn gói cho toàn bộ hành trình chín ngày thì——」\""
2552 = "\"「Nếu là tàu giường nằm thì chuyến đi sẽ dài lắm. Mấy thứ như Basashi không sợ bị hỏng sao?」\""
2555 = "\"「Nếu là một chuyến tàu dài như vậy, thì \\x%l車掌;#00ffc040;trưởng tàu%l;#;. Sẽ trở nên vô cùng quan trọng đúng không ạ?」\""
2559 = "\"「Hình như Hibiki——à đúng rồi, em ấy bảo sẽ đến Jussen.」\""
2561 = "\"「Rượu shochu thì bảo quản ở nhiệt độ thường là đủ rồi, thế mà Mi-chan nhé? Em ấy bảo một ngày nào đó muốn làm ra loại rượu shochu được vận chuyển khắp Hinomoto bằng xe đông lạnh cơ.」\""
2568 = "\"「Đúng vậy. Vì thế, chúng ta sẽ chỉ chọn những đặc sản trứ danh của các vùng làm mặt hàng cố định, ví dụ như Mentaiko của Fukuoka, hay Basashi của Kumamoto.」\""
2570 = "\"「Đúng thế. Ngân hàng Kumagin cũng đang phải điêu đứng vì chuyện đó đây.」\""
2572 = "\"「Đúng vậy.」\""
2574 = "\"「Đúng vậy đúng vậy. Nếu tạo ra kẻ bị bỏ rơi, những nơi bị loại ra sẽ kết bè kết phái. Em nghĩ mọi chuyện sẽ trở thành một mớ bòng bong mất.」\""
2575 = "\"「Đúng không! Nagi! Rất, rất là hợp luôn!」\""
2578 = "\"「Đúng thế! Ngay từ đầu anh hai đã nói là Thể chế toàn Kyushu rồi mà!!」\""
2579 = "\"「Đúng vậy. Hay là làm cho hoành tráng luôn, \\x%l編成;#00ffc040;ghép%l;#; cả toa phát điện và xe đông lạnh vào——!!」\""
2584 = "\"「Đúng vậy. Tính ra thì hiện tại đã là bảy toa rồi.」\""
2585 = "\"「Vậy sao.」\""
2586 = "\"「Vậy sao?」\""
2587 = "\"「Vậy sao? Chắc là vậy. Michi, không biết nữa. Vì chuyến tàu này, lúc nào cũng giống nhau mà.」\""
2588 = "\"「Thế à? Vậy thì, chuyện chị báo đáp công ơn, để lần sau nhé.」\""
2589 = "\"「Vậy sao. Nếu thế, ngay khi mấy việc bận rộn gần đây ổn thỏa, anh sẽ đi viếng mộ.」\""
2591 = "\"「Vậy sao……vậy sao.」\""
2592 = "\"「Vâng. Các tuyến đường sắt ở Kyushu thường là \\x%l単線;#00ffc040;đường đơn%l;#;, bình thường chỉ chạy 1, 2 toa. Những nơi dài nhất cũng chỉ chạy khoảng 4 toa là không hiếm đâu.」\""
2596 = "\"「Đúng vậy ạ. Nếu được thì nên dùng đầu máy chở hàng. Một chiếc đầu máy có 4 trục \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; sẽ là lựa chọn tối ưu nhất.」\""
2600 = "\"「Vâng. Tàu chở khách sẽ xuất phát trước, để hành khách xuống tham quan tại ga trung tâm. Trong thời gian đó, tàu chở hàng sẽ đuổi theo sau.」\""
2604 = "\"「Vậy……sao.」\""
2605 = "\"「Ra là vậy. Trưởng thành, tuyệt thật đấy nhỉ.」\""
2606 = "\"「Anh Soutetsu gọi đó nha~? Bảo là có chuyện khẩn cấp ạ~」\""
2610 = "\"「Tốt nhất? ——Tốt, sao. Ra là vậy, ý cậu là, Soutetsu.」\""
2611 = "\"「Có một chiếc D51 tơi tả, nhưng nếu là Jussen hiện tại thì có thể sửa được. Và……về \\x%lレイルロオド;#00ffc040;Railord%l;#;, em cũng có quen biết một người.」\""
2617 = "\"「Cứ nghĩ là ngày nghỉ thì lại ngủ say như chết ấy nhỉ.」\""
2622 = "\"「Nếu đầu máy chính là 8620, tính thêm cả phần \\x%l炭水車;#00ffc040;toa tiếp than nước%l;#;, thì thực chất chiều dài sẽ tương đương tám toa.」\""
2624 = "\"「Nagi-sama có quen biết một \\x%l機関士;#00ffc040;lái tàu%l;#; cực kỳ giỏi đấy.」\""
2635 = "\"「Vì có trái tim, nên mới có thể thay đổi. A. Trong trường hợp của Mi-chan thì——“có thể quay lại” chăng?」\""
2636 = "\"「Ví dụ như Kumamoto——Higo thì sẽ trang trí toàn bộ bằng những thứ của Higo. Ý cậu là tạo ra từng khoang hành khách mang đặc trưng riêng như vậy sao?」\""
2641 = "\"「Đó chính là điều em mong muốn. ——A.」\""
2642 = "\"「Không ngờ, Nagi lại——à, không.」\""
2644 = "\"「Tại sao chứ? Tôi thì lại nghĩ đây chính là giải pháp tối ưu đấy?」\""
2657 = "\"「Ngủ say một giấc mà khác biệt đến thế này sao.」\""
2658 = "\"「Nếu là rượu shochu hay rượu các loại, chị cũng có thể giúp được đấy. Chị có thể nói chuyện với các xưởng rượu ở khắp Kyushu mà.」\""
2660 = "\"「Cả bố và mẹ. Chắc chắn đều muốn nói lời cảm ơn đấy. Vì đó là những người đã giúp đỡ Sou-chan mà.」\""
2663 = "\"「Reina, xin lỗi em. Paulette có đó không. Anh muốn nhờ tổ chức một cuộc họp khẩn cấp.」\""
2664 = "\"「Chính là sự đoàn kết của Thể chế toàn Ohimitera, Thể chế toàn tuyến Yui mà hiện tại chúng ta đang cảm nhận rõ sức mạnh của nó. Chúng ta sẽ mở rộng điều đó ra toàn bộ Kyushu.」\""
2668 = "\"「Bằng đôi tay của Sou-chan á?」\""
2669 = "\"「Thế thì thật sự rất đáng tin cậy. Sao hả Paulette. Em có thể hướng dẫn cho Fukami được không?」\""
2671 = "\"「Là 『Vì mục đích đó』 mà. Ừm. Em nghĩ là có khả năng đấy. Chắc chắn cô ấy sẽ muốn làm việc ở Đường sắt Ohito.」\""
2672 = "\"「Khi vấn đề quá lớn và phức tạp, điều đầu tiên chúng ta nên thử là——」\""
2673 = "\"「Đương nhiên rồi.」\""
2674 = "\"「Đương nhiên đây là ngày nghỉ của anh hai mà! Anh hai cứ làm theo ý mình là được rồi!」\""
2675 = "\"「Tất nhiên, chỉ mỗi khoang hành khách thôi thì chưa đủ. Thế nên, đồ lưu niệm hay các sản phẩm phục vụ trên tàu cũng sẽ được trang bị đặc sản của các vùng tương tự như vậy.」\""
2676 = "\"「Đương nhiên là bằng tàu hỏa rồi. Tàu du lịch. Chúng ta sẽ khiến cho tất cả người dân Kyushu coi chuyến tàu đi tới tương lai của chúng ta là 『Chuyến tàu của chính mình』.」\""
2677 = "\"「Toa phát điện. Có cả loại đó nữa à?」\""
2678 = "\"「Dễ nhớ quá! Giá cả cũng mang đậm chất Nine Stars luôn!!」\""
2684 = "\"「Chị Mayami——tất nhiên là, \"rảnh\" rồi.」\""
2686 = "\"「Chị Mayami phản đối sao?」\""
2696 = "\"「Đúng là vậy. Thế thì, có nên thêm toa ăn vào \\x%l編成;#00ffc040;đoàn tàu%l;#; không nhỉ.」\""
2698 = "\"「Đúng vậy, khuôn mặt của \\x%l車掌;#00ffc040;trưởng tàu%l;#; sẽ mang lại cảm giác an tâm cho hành khách. Nếu có thể, em muốn có một trưởng tàu chuyên trách đi theo suốt hành trình.」\""
2700 = "\"「Nếu làm thế này! Đúng thật! Chỉ cần tránh tàu ở hai ga A và B là giải quyết được vấn đề rồi!」\""
2701 = "\"「Kisaki.」\""
2705 = "\"「Tôi không phản đối tính toán của Kisaki. Nhưng mà—— Giải pháp này, dù là tối ưu, nhưng không phải là tốt nhất.」\""
2706 = "\"「Chỉ là lý thuyết suông. Thật nực cười. Nếu làm được thế thì đã chẳng phải khổ. ——Nếu là trước khi quen biết Soutetsu, tôi đã cười nhạo như vậy rồi.」\""
2709 = "\"「Họ sẽ trả. Chắc chắn luôn. Với những \\x%l乗り鉄;#00ffc040;người thích đi tàu%l;#;, việc đi một lèo hết toàn tuyến mới là điều quan trọng. Ngoài ra thì chẳng còn ý nghĩa gì nữa.」\""
2717 = "\"「Hơn nữa, còn có thể tránh được áp lực chính trị. Nếu việc tuyển chọn cũng được quyết định bằng cách bỏ phiếu và công khai toàn bộ quá trình.」\""
2720 = "\"「Nghe chị nói vậy em vui lắm. Nhưng mà, như thế thì lòng em vẫn chưa...」\""
2721 = "\"「Thú vị thật đấy. Dùng cả đầu máy lẫn \\x%l電車;#00ffc040;tàu điện%l;#;. Tiếp sức đưa hành khách đi từ quá khứ đến tương lai nhỉ.」\""
2724 = "\"「Hizen, Higo. Buzen, Bungo. Chikuzen, Chikugo. Hyuga, Osumi——và cuối cùng là Satsuma, đấy, đủ chín vùng rồi nhé.」\""
2728 = "\"「Một hương vị hoàn toàn khác biệt so với sự sâu sắc phức tạp của Migitakazu, mang hơi hướng hiện đại——nhưng lại là một loại rượu thực sự rất ngon.」\""
2732 = "\"「Bị chính thứ mình từng rất yêu quý phản bội, làm tổn thương, nên mới sinh ra cảm giác như là căm ghét.」\""
2733 = "\"「Chia nhỏ Kyushu ra——trước tiên là các tỉnh nhỉ. Kumamoto, Fukuoka, Saga, Nagasaki, Oita, Miyazaki, Kagoshima.」\""
2735 = "\"「Nếu nói về nhân lực thì, mấy đứa nhỏ đó——」\""
2738 = "\"「Chuyện đó ấy à. Nói ra thì. Sou-chan cũng đã từng nghĩ như vậy trong một thời gian dài mà.」\""
2745 = "\"「Dạ……\\x%l車掌;#00ffc040;trưởng tàu%l;#; ạ.」\""
2751 = "\"「Phí ưu đãi cao cấp là khoảng mười vạn. Đắt thật đấy. Nhưng mà——những người đi du lịch hạng đó thì họ sẽ sẵn sàng chi trả sao?」\""
2756 = "\"「Sự tham gia của chú Akai đã tạo ra một khoảng trống lớn về mọi mặt. Tuy nhiên——vẫn còn thiếu nhân lực, tiền bạc, thiếu đủ thứ.」\""
2757 = "\"「Chị gọi bảo em ấy đến cửa hàng đường sắt hội quân nhé. Em cũng sẽ liên lạc với mọi người.」\""
2785 = "\"「Chuyện đó……chắc chắn mọi người sẽ rất vui. Những món đồ được làm ra trên chính mảnh đất quê hương mình, dù chỉ là một món nhỏ xíu, lại xuất hiện trên chuyến tàu du lịch.」\""
2786 = "\"「Chuyện đó, cứ để tôi. Hay nói đúng hơn là, hãy giao cho Đường sắt Hinomoto.」\""
2787 = "\"「Cái đó……chắc là không có đâu. Mà dù có đi nữa, thì việc cải tạo ở mức độ đó cũng đơn giản thôi.」\""
2788 = "\"「Tuyệt quá đi!! Nagi-sama muốn thử đi mỗi ngày một khoang, để trải nghiệm hết tất cả các khoang của Kyushu luôn!!」\""
2789 = "\"「Cái đó thì chỉ còn cách kiên trì thuyết phục thôi. Nhưng nếu, dù có làm cách nào cũng không nhận được sự đồng ý thì.」\""
2790 = "\"「Loại này ấy à? Thực ra, chính là loại rượu shochu đó đấy.」\""
2791 = "\"「Cũng có thể lắm. Nguồn điện thì sẽ nối thêm toa phát điện để cung cấp.」\""
2792 = "\"「Việc đó e là hơi khó. Hoặc có lẽ là vô tâm. Nếu nghĩ đến cảm nhận của Miyako.」\""
2793 = "\"「Độ dài đó có vấn đề gì sao?」\""
2794 = "\"「Vậy sao?」\""
2795 = "\"「Tuyệt thì tuyệt thật, nhưng mà Nagi à. Thế này vẫn chưa phải là phương pháp cụ thể đâu?」\""
2796 = "\"「Vậy sao.」\""
2797 = "\"「Thế thì ngược lại, gắn tủ lạnh lên \\x%l客車;#00ffc040;toa hành khách%l;#; thì sao? Như thế sẽ giống tàu du lịch hơn đúng không.」\""
2799 = "\"「Đây thực sự là thứ mà chị Mayami đã nhắc đến—— 『Loại rượu được quản lý ủ men hoàn toàn bởi \\x%lレイルロオド;#00ffc040;Railord%l;#;』 sao?」\""
2801 = "\"「Điểm bán hàng lớn nhất của loại rượu shochu mới này dĩ nhiên là, việc được quản lý ủ men hoàn toàn bằng dữ liệu bởi \\x%lレイルロオド;#00ffc040;Railord%l;#;.」\""
2803 = "\"「Rằng đây chắc chắn là một loại rượu ngon. Rằng loại rượu này chắc chắn sẽ được nhiều người thưởng thức.」\""
2804 = "\"「Một loại rượu tuyệt vời như thế này, lại được sinh ra một cách dễ dàng như vậy sao.」\""
2805 = "\"「Lòng em chưa sao? Ufufu. Vậy thì, nhé? Sou-chan.」\""
2811 = "\"「Nếu là một chuyến đi dài như vậy, thì việc tính riêng tiền ăn cũng hợp lý ạ. Ăn mãi ở toa ăn cũng chán.」\""
2812 = "\"「Với lại——xe đông lạnh thì giống tủ lạnh nên phải dùng điện đúng không? Vậy sao không biến nó thành xe đông lạnh kiêm luôn toa phát điện?」\""
2813 = "\"「Thật sao. Chuyện tuyệt vời thế còn gì. \\x%lレイルロオド;#00ffc040;Railord%l;#; đó, có phải là \\x%lレイルロオド;#00ffc040;Railord%l;#; của chiếc D51 kia không?」\""
2815 = "\"「Đúng vậy thật. Nghe em nói mới thấy, loại rượu không kén người uống và vị sắc sảo này. Có khi lại được ưa chuộng ở những nơi khác hơn là Ohimitera cũng nên.」\""
2816 = "\"「Nếu vậy thì.」\""
2821 = "\"「Không phải á. Là sao?」\""
2823 = "\"「Hôm nay, chị sẽ để Sou-chan báo đáp công ơn thật nhiều, thật nhiều luôn, được chứ?」\""
2825 = "\"「Họ sẽ được tự do chọn khoang hành khách cho tất cả các ngày. Có thể chọn khoang theo vùng đang đi, hoặc nếu ngại di chuyển thì cố định một khoang cũng được.」\""
2828 = "\"「Chúng ta sẽ dừng lại tham quan ở các ga trung tâm thật là lâu đúng không ạ~. Để hành khách có thể ăn uống và đi dạo quanh đó.」\""
2830 = "\"「Hoan nghênh quá đi chứ. Khách hàng có thể thưởng thức những loại rượu shochu, rượu vang hảo hạng của khắp các vùng Kyushu ngay trong khoang hành khách.——Hoặc, nếu có thể thì phục vụ ở quầy buffet.」\""
2832 = "\"「Vậy thì Sou-chan. Làm thế nào để loại rượu shochu này, được nhiều người biết đến và thưởng thức hơn đây nhỉ?」\""
2833 = "\"「Nếu vậy thì, cứ thế mà làm——」\""
2836 = "\"「Vậy thì, chúng ta sẽ tiếp tục bàn bạc theo hướng này. Ở giai đoạn hiện tại, nếu có vấn đề gì dễ nhận thấy thì mọi người cứ nói nhé.」\""
2837 = "\"「Vậy thì tốt quá.」\""
2839 = "\"「Nếu vậy thì, chúng ta bắt đầu hành động thôi!!」\""
2841 = "\"「Vậy thì, em thử dò hỏi xem sao nhé——」\""
2842 = "\"「Nếu vậy, anh cũng sẽ cố gắng nghĩ ra ý tưởng. Để có thể tóm gọn được ý tưởng cốt lõi từ quá khứ đến tương lai—và cả sau này nữa.」\""
2844 = "\"「Nếu vậy thì, em! Em sẽ nhắm tới vị trí đó!!! Xin hãy chỉ cho em biết cụ thể cần phải chuẩn bị những gì.」\""
2847 = "\"「Nếu là cái đó! Ý tưởng! Em có rất nhiều ý tưởng luôn!!」\""
2848 = "\"「Vậy thì, chúng ta sẽ bàn bạc với phía Jussen theo hướng đó. Nếu có thể, chúng ta sẽ càng có thêm nhiều không gian hơn.」\""
2849 = "\"「Vậy, chị còn điều gì bận tâm sao?」\""
2850 = "\"「Nếu vậy, ở những đoạn đường đó, chúng ta hãy chia đôi \\x%l編成;#00ffc040;đoàn tàu%l;#; ra. Đầu máy thì dùng loại thùng chứa nước, hoặc \\x%lDL;#00ffc040;đầu máy diesel%l;#; cũng được.」\""
2852 = "\"「Quy hoạch đô thị……」\""
2859 = "\"「Những món đồ muốn đặt trong khoang hành khách, hay ý tưởng thống nhất cho từng khoang, anh dự định sẽ tổ chức kêu gọi ý kiến từ chính người dân ở các khu vực đó.」\""
2860 = "\"「Chuyện đó em nghĩ có thể giải quyết bằng cách thiết lập cơ chế bỏ phiếu. Hiệp hội Du lịch Hinomoto rất rành về mấy khoản này ạ.」\""
2861 = "\"「Ngài Soutetsu. Em có một ý kiến được không ạ?」\""
2867 = "\"「Nếu là toa hành khách bằng thép dài 20 mét, một toa ba khoang, mỗi khoang sẽ có hai giường đôi. Có thể thêm hai giường phụ nữa.」\""
2869 = "\"「Cả 8620 và KiHa 07S đều là những toa xe cực kỳ phù hợp mà. Lượng khách du lịch đang tăng lên đều đặn, dịch vụ thuyền xuôi dòng Kuma cũng đã phục hồi.」\""
3019 = "Chỉ trong một khoảnh khắc, còn nhẹ hơn cả cánh bướm, đầu ngón tay của chị Mayami chạm vào môi em, rồi rời ra."
3021 = "Quả nhiên Hibiki rất hiểu cách làm việc của em. Chẳng cần em phải gật đầu, em ấy đã tự mình suy nghĩ."
3024 = "Chẳng hiểu sao, Hibiki cứ chằm chằm nhìn Hachiroku."
3026 = "Dù là dùng từ giúp đỡ, hay là dùng từ báo đáp, thì câu trả lời của em vẫn không hề thay đổi."
3028 = "Nhưng giả sử chỉ cần chạy liên tục hai ngày hai đêm thôi, thì 8620 cũng sẽ rã rời và kiệt sức mất."
3031 = "Và đồng thời, em cũng tự kiểm điểm lại bản thân mình thường ngày."
3032 = "Hoặc nếu tất cả những điều này chỉ đơn thuần là hoạt động trong tiềm thức của anh. Thì có lẽ ở đâu đó, anh vẫn nghĩ rằng 『Như vậy vẫn chưa đủ』 chăng——"
3037 = "Họ chỉ ra những vấn đề mà chúng ta hoàn toàn không nhận ra, đồng thời đưa ra những phương án cải thiện vô cùng thích hợp."
3041 = "Nhưng dù vậy em vẫn không thể gật đầu đồng ý—— Giờ thì em đã hiểu lý do tại sao mình lại cố chấp xin mọi người chờ thêm một chút nữa."
3044 = "Thế nhưng hình dáng, cái hình dáng lý tưởng ấy, bọn em vẫn chưa thể nào phác họa ra được."
3069 = "Bằng sự kết hợp ăn ý như mọi khi, hai đứa đã khuấy động cuộc họp một cách thật dễ chịu."
3070 = "Cả hai lập tức ngồi xuống lại—— Hibiki hăm hở lia bút chì trên cuốn sổ phác thảo."
3073 = "Hachiroku cất giọng trầm buồn. Nói cách khác là em……đã bỏ sót điều gì đó sao."
3082 = "\\x%lレイルロオド;#00ffc040;Railord%l;#; của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; dòng \\x%l9600;#00ffc040;9600%l;#; Đường sắt Hoàng gia cũ, số hiệu 39685, \"Miyako\"."
3096 = "Chỉ có âm thanh này là luôn chân thực. Nó báo cho anh biết rằng, anh lại một lần nữa, trở về trong giấc mơ của Michiko."
3098 = "Michiko, sẽ không bao giờ có thể trưởng thành được. Cứ mãi bị nhốt trong chuyến tàu này, nếu cứ giữ nguyên như hiện tại."
3100 = "Chắc hẳn đã có chuyện gì đó vui vẻ xảy ra. Phần gò má cao nhất và chóp mũi của chị Mayami ửng hồng."
3115 = "Nếu không làm được điều đó, đường sắt sẽ không bao giờ thực sự hồi sinh."
3122 = "Trong một khoảnh khắc. Một sự im lặng bao trùm như thể có ai hắt nước vào."
3124 = "Mặc dù tiếng kêu gào phản đối tháo dỡ tuyệt vọng của Miyako đã vọng đến tận Kyushu xa xôi, đến tận tai bọn em."
3125 = "Một \\x%lレイルロオド;#00ffc040;Railord%l;#; ghét đường sắt ngay từ đầu, chắc chắn không hề tồn tại ở bất cứ đâu trên thế giới này."
3129 = "À——ra là vậy. Nói tóm lại là……em đang cảm thấy xấu hổ sao."
3134 = "Vừa trả lời xong, em liền nhận ra điều đó. Chị Mayami lúc nào cũng bảo vệ em, vậy mà——"
3136 = "Nên em cần phải giải thích cho chị Mayami hiểu từ điểm đó."
3138 = "Thế nên cả em, Hachiroku và Hibiki, hầu như chưa bao giờ tiếp xúc với Miyako."
3140 = "Thế nên, em vào thẳng kết luận mà không cần rào trước đón sau. Nhưng phản ứng của mọi người lại không được như mong đợi."
3142 = "Vì vậy, khi có thông tin về việc tháo dỡ, nghe nói ở địa phương có rất ít người đồng tình với phong trào phản đối."
3144 = "Từ động vật, trẻ em, người già cho đến người cùng giới, Nagi đều được yêu mến một cách kỳ lạ."
3146 = "Giới thiệu gia đình mới trước mộ phần của gia đình đã khuất."
3149 = "Theo nguyên tắc cơ bản, cần nhấn mạnh sự khác biệt so với những sản phẩm khác. Chỉ cần tung ra thị trường bằng cách tận dụng tối đa sự khác biệt đó là được."
3153 = "Em cảm thấy đầu mình đang nóng lên. Không phải vì hưng phấn——mà là não bộ đang hoạt động hết công suất."
3154 = "Em đã nhận được điểm đỗ. Nếu vậy thì chẳng có lý do gì phải do dự nữa."
3157 = "Chỉ vậy thôi cũng đủ chặn đứng những lời em định nói."
3158 = "Thêm tình địch. Diều hâu cắp miếng đậu rán. Phải thể hiện sự tồn tại của mình mới được. ——Em ấy cứ lầm bầm lặp đi lặp lại mấy câu gì đó."
3160 = "Không hề yêu cầu em đi cùng, em ấy khẳng định chắc nịch rằng \"sẽ đi vẽ\"."
3164 = "Em gật đầu mạnh mẽ. ——Không một ai có ý kiến phản đối."
3165 = "Gật đầu một cách mạnh mẽ, rồi chị hơi luống cuống lấy điện thoại ra."
3167 = "Thật đáng mừng biết bao. Thật vững tâm biết bao. Nếu được thế này, à——em chỉ cần làm đường ray là đủ rồi."
3172 = "Chỉ bị hỏi lại thôi mà tim em đã đập thình thịch. Hai má——rồi cả khuôn mặt nóng bừng lên."
3173 = "Nghe em ấy nói vậy, quả đúng là thế. Fukami——và tất nhiên cả Nagi nữa, đều đang cho thấy sự trưởng thành rõ rệt."
3174 = "Nghe vậy, em vội vàng uống thêm một ngụm nữa. ……Nếu đúng là vậy, thì hương vị này cũng dễ hiểu thôi, nhưng——."
3175 = "Vừa dứt lời, em ấy liền đứng bật dậy. Đứng thẳng tắp, uy nghi và xinh đẹp."
3176 = "Nếu vậy thì, em rất vui."
3181 = "Cảm thấy như đã làm chị Mayami lo lắng, em vội vàng giải thích lý do."
3185 = "Ra là vậy, vì chị ấy ít liên quan đến Đường sắt Ohito—— hay nói đúng hơn là ít liên quan đến đường sắt nói chung."
3186 = "Đối với anh, việc đó có chút gì đó như là sự áy náy…… Anh cảm thấy một sự phản kháng vô hình trong tâm lý——"
3199 = "Như vậy, hiệu quả công việc về lâu dài có lẽ cũng sẽ được cải thiện."
3227 = "Độ bền của đường ray——về tải trọng chịu đựng, em đã nghĩ là cần phải xem xét, nhưng——"
3229 = "Trong mắt anh chẳng phản chiếu thứ gì cả—— Ngoài khung cửa sổ kia, dường như chỉ có một màu xám xịt đang chồng chất lên nhau."
3230 = "Nhẩm lại điều đó một lần nữa, em uống thêm một ngụm."
3233 = "Và rồi, em nghĩ về Hibiki thuở nhỏ. Ra là vậy, có lẽ chúng em đã thấu hiểu nhau ở điểm đó."
3235 = "Em chỉ còn biết gật đầu."
3236 = "Chỉ cần em vạch ra đường ray, thì \\x%l保線;#00ffc040;bảo trì đường ray%l;#;, tín hiệu, vận hành, chỉ huy. Mỗi người đều sẽ hoàn thành xuất sắc nhiệm vụ của mình."
3241 = "Khi cảm nhận được sự tuyệt vời đó, lòng em lại càng thêm kiên định và mạnh mẽ."
3243 = "Được chị Mayami ra hiệu bằng mắt, em đưa ly cho chị. Chị Mayami cũng một hơi cạn sạch ly shochu đó."
3246 = "Em đưa ly cho chị, nhờ chị rót thêm một ly nữa."
3248 = "Thật đáng mừng. Dù đây là một cuộc họp khẩn cấp, nhưng tất cả các thành viên từ những ngày đầu tiên đều đã có mặt đông đủ."
3250 = "Em không ngờ việc báo đáp chị Mayami lại là uống rượu vào buổi sáng. Nhưng hôm nay là ngày nghỉ. Có say xỉn đến đâu cũng chẳng sao."
3252 = "Lời lỡ buột miệng của em lại khiến chị Mayami lộ vẻ ngạc nhiên pha chút ngán ngẩm."
3253 = "Gấp chăn đệm, thay quần áo xong xuôi, em hướng ra phòng khách——thì."
3256 = "Em nhìn Hachiroku. Em ấy lộ vẻ ngạc nhiên——rồi từ từ, thận trọng gật đầu đáp lại."
3258 = "Em nhìn Paulette. Cô ấy đang làm vẻ mặt có vẻ bối rối."
3260 = "Em nhìn chị Mayami. Chị Mayami gật đầu thật mạnh, thật mạnh."
3262 = "Đúng là em đã từng căm ghét đường sắt, và khao khát được tránh xa nó——từ tận đáy lòng."
3263 = "Tiếng bước chân vội vã."
3265 = "Đáng yêu quá——em gần như nghĩ vậy theo phản xạ, rồi chẳng hiểu sao lại cuống cuồng cả lên."
3266 = "Càng nghe em ấy nói, em càng thấy đúng là vậy, nên trước mắt cứ dùng bánh nướng dài để khóa miệng Hibiki lại đã."
3268 = "Nghe em nói vậy, chị Mayami bật cười \"Aha\". Một nụ cười nhẹ nhàng, như thể chuyện đó buồn cười lắm vậy."
3271 = "Trong một góc phòng, em tiến lại gần chị Mayami đang đứng lặng lẽ một mình."
3272 = "Chắc hẳn biểu cảm của em đã lộ rõ trên khuôn mặt."
3273 = "Có lẽ là để cho em được nghỉ ngơi—— Hibiki một mình nhanh chóng chuẩn bị đồ đạc."
3274 = "Có lẽ chị ấy đã cảm nhận được điều gì đó từ âm thanh kia. Chầm chậm, chầm chậm, chị Mayami dịu dàng, dịu dàng khuấy đều hỗn hợp."
3278 = "Vì thế. Phải làm cách nào đó. Anh đã luôn khao khát và không ngừng hành động vì điều đó——"
3281 = "Thế nên có lẽ…… chỉ là em đang lo lắng thái quá thôi."
3282 = "Đồng loạt. Một cách đồng loạt đến buồn cười, tất cả mọi người đều gật đầu."
3285 = "Ai nấy đều ngẩn tò te, đưa mắt nhìn nhau. ——Sự im lặng đó bị phá vỡ bởi giọng nói nhẹ nhàng của Hachiroku."
3289 = "Tiếp sức. Chỉ một từ đó thôi đã tiếp sức cho dòng suy nghĩ của em."
3291 = "Thấy bỏ mặc em ấy thì cũng tội nghiệp, nên em đi ngang qua Hibiki đang rên rỉ, tiến vào bếp——"
3293 = "Cả một khu vực giàu truyền thống lịch sử cùng tận dụng tối đa di sản văn hóa của mình, 『Trò chơi đóng vai hoành tráng』 này quả thực có sức hấp dẫn và niềm vui rất riêng."
3296 = "Đã có hàng trăm ý tưởng được đưa ra——không, có khi phải hơn cả ngàn. Trong số đó, không ít ý tưởng tỏa sáng rực rỡ."
3297 = "Và thế là, tất cả mọi người đều bắt đầu hành động."
3300 = "Một khi đã nhận thức được cảm xúc, thì có thể kiểm soát được nó. Từ trước đến nay em vẫn luôn làm như vậy mà."
3311 = "Từ bao giờ, Hibiki cũng đã trưởng thành như vậy rồi, em bỗng cảm thấy có chút chói lọi."
3314 = "Hibiki nhanh chóng ghi chú lại lên mép cuốn sổ phác thảo."
3317 = "Đôi má Hibiki bỗng ửng hồng. Việc ý tưởng của Hibiki được khen ngợi, dĩ nhiên là một điều vô cùng đáng mừng. Nhưng."
3319 = "Hibiki đang gục mặt xuống bàn phòng khách, miệng cứ rên rỉ đòi ý tưởng."
3320 = "Hibiki cũng ngoan ngoãn nhai nhóp nhép. Rồi nuốt cái ực, thở ra một hơi như thể đã an tâm."
3322 = "Hibiki, và cả Paulette, bất giác đứng bật dậy."
3326 = "——Sự tham gia quản lý của ông Gotou đã giúp cho 『Đường sắt Hinomoto』 có một khởi đầu không thể tuyệt vời hơn, và được báo chí đưa tin rầm rộ cơ mà."
3328 = "Dù biết rõ điều đó, nhưng lại không thể tìm ra. Chính vì cảm nhận được rằng chắc chắn có một câu trả lời lý tưởng, nên mới càng thêm bứt rứt."
3330 = "Là Nagi. Em ấy đang giơ tay với một khuôn mặt tự tin như thể được vẽ ra vậy."
3331 = "Huống hồ gì với tư cách là một \\x%l機関士;#00ffc040;lái tàu%l;#; hay \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;, em ấy cũng đã tích lũy được một lượng kinh nghiệm không thể xem thường."
3337 = "Những người xuất hiện trong quang cảnh đó đủ nhiều để Michiko nhận ra, và đã có sự trưởng thành về ngoại hình thì——"
3348 = "Paulette gật gù, với một điệu bộ có chút gì đó ngây thơ."
3349 = "Lòng biết ơn trào dâng trước việc Paulette đã nhiều lần khuyên em nên nghỉ ngơi."
3350 = "Tại sao nhỉ? Paulette gật đầu một cách vô cùng mạnh mẽ và sâu sắc."
3352 = "Vì biết như vậy, nên em tha thiết cầu nguyện. Mong sao những gì đã tan biến, dù chỉ là một mảnh vỡ nhỏ nhoi——"
3354 = "Rằng bằng mọi giá—— phải giải thoát Michiko khỏi khoảng thời gian bị khép kín ấy."
3357 = "Nếu đó là lý tưởng, thì nó vẫn luôn nhất quán không hề lay chuyển."
3359 = "Dù sao thì cũng là chị Mayami đang nhờ vả em mà."
3388 = "Chị Mayami bắt đầu gọi điện thoại. Em cũng lập tức dùng điện thoại bàn."
3389 = "Nếu là chị Mayami thì chắc chắn sẽ làm thế. Vết thương lòng của Miyako, nếu đúng là vậy, thì vẫn còn rất sâu."
3391 = "Chị Mayami mỉm cười bằng ánh mắt."
3393 = "Khi biết điều đó, chị Mayami đã nói 『Nếu vậy thì hãy để xưởng nhà mình tiếp nhận』, và đó là điều đầu tiên em đã nói với chị ấy."
3394 = "Chị Mayami bật cười, như muốn nói \"Giờ này mà còn nhắc lại chuyện đó làm gì\". Ánh mắt đang cười ấy ngay giây tiếp theo bỗng vẽ nên một đường cong đầy tinh nghịch."
3397 = "Sắc hồng trên khuôn mặt chị Mayami đậm thêm một chút."
3399 = "Biểu cảm của chị Mayami thay đổi. Một nụ cười có vẻ vui sướng, nhưng lại xen lẫn chút bối rối."
3400 = "Mỉm cười rạng rỡ, chị Mayami khép đôi mi lại. Một sự im lặng vô cùng dịu dàng lan tỏa khắp xưởng rượu."
3401 = "Chị Mayami cười vui vẻ. Ánh mắt chạm nhau——bỗng dưng em chẳng thốt nên lời nào nữa."
3402 = "Chị Mayami tròn xoe mắt ngơ ngác. Việc làm chị ấy ngạc nhiên lại khiến chính em ngạc nhiên."
3407 = "Đúng là anh đã hứa với Hibiki rằng, lần tới nhất định sẽ đi cùng nhau. Nhưng……"
3418 = "Kisaki lập tức đồng tình. Sau khi đồng tình, cô ấy lại một lần nữa sắp xếp lại vấn đề."
3419 = "Kisaki nói là có thể làm được. Paulette, người vừa tỏ vẻ e ngại, cũng đã bắt đầu xem xét tính khả thi của nó."
3421 = "Khẳng định một cách hết sức nhẹ nhàng, Kisaki nở một nụ cười nhếch mép."
3422 = "Câu nói nhẹ bẫng của Kisaki khiến Paulette phải nhíu mày."
3426 = "Việc rút lại quyết định mời gọi nhà máy Aircra đã được xác định, người dân Ohimitera và các chính quyền địa phương dọc tuyến đường cũng đang dần đoàn kết lại dưới ý tưởng đó."
3433 = "Bốp một cái, mọi thứ khớp vào nhau. Bắt đầu kết nối lại. Tất cả mọi thứ, với một tốc độ chóng mặt."
3438 = "Mọi người đều gật đầu đồng tình với lời em nói. Chỉ có một người duy nhất——ngoại trừ chị Mayami."
3439 = "Nghe anh nói vậy, lần này đến lượt Michiko ngẩn tò te, lộ vẻ khó hiểu."
3440 = "Nghe tiếng gọi, em thở phào nhẹ nhõm."
3441 = "Nghe em nói vậy, Hibiki lại bẹp một cái, gục mặt xuống bàn."
3442 = "『Em không muốn dính dáng gì đến đường sắt nữa』—— Nghe nói đó là câu nói đầu tiên của em ấy khi đến phỏng vấn."
3443 = "Được gửi gắm toàn bộ hy vọng phục hưng Đường sắt Hoàng gia, \\x%l電車;#00ffc040;tàu điện%l;#; tốc hành tối tân nhất——nguyên mẫu \\x%lクハ26;#00ffc040;Kuha 26%l;#;, \\x%l編成;#00ffc040;đoàn tàu%l;#; \\x%lクハ26;#00ffc040;Kuha 26%l;#;-000."
3448 = "Nếu không thể kết nối những trái tim, nếu chỉ dừng lại ở mức là một phương tiện giao thông, thì sớm muộn gì cũng sẽ lại bị những chiếc Aircra tiên tiến hơn đánh bại."
3450 = "Vì nếu cứ để mặc như vậy, chắc chắn em sẽ lại rơi vào cái vòng luẩn quẩn không lối thoát như mọi khi."
3454 = "Ý nghĩa của việc được giao phó chạy thử nghiệm con tàu đó, anh hoàn toàn——hoàn toàn không hiểu được."
3458 = "Được bảo tồn trong khuôn viên tòa thị chính của thị trấn đường sắt Omiya—— nhưng điều đó lại trở thành tai họa, một \\x%lレイルロオド;#00ffc040;Railord%l;#; bất hạnh."
3464 = "Sẽ mất bao nhiêu thời gian để chạy hết chặng đường, đó là chuyện cần phải bàn bạc kỹ lưỡng từ giờ trở đi——"
3485 = "Lời nói bỗng dưng nghẹn lại nơi cổ họng, trở nên nặng nề. Dù đó chắc chắn là cảm xúc thật lòng, không hề có chút giả dối nào."
3486 = "Vừa dứt lời, Michiko bỗng cười khúc khích."
3487 = "Ngay khi em vừa thốt lên, chị Mayami liền gật đầu."
3488 = "Nói rồi chị lại cười khúc khích."
3489 = "Nói rồi mỉm cười, Hibiki bước ra ngoài."
3490 = "Nói rồi Michiko hướng mắt nhìn ra ngoài cửa sổ."
3510 = "Nhanh hơn một chút so với lúc anh kịp đưa ra suy luận, Michiko đã nói ra câu trả lời."
3512 = "Khuôn mặt Michiko bừng sáng rạng rỡ."
3514 = "Nếu đó là những gì Michiko nhìn thấy từ cửa sổ tàu, thì đó hẳn là phong cảnh đường sắt."
3515 = "Cơ thể thật nhẹ nhõm. Cả tâm trí cũng vậy. Điểm khác biệt duy nhất so với giấc ngủ thường ngày chỉ là có đặt báo thức hay không thôi mà."
3521 = "Hầu hết các \\x%lレイルロオド;#00ffc040;Railord%l;#; sau khi nghỉ hưu, đều bị vứt bỏ mà không hề được xem xét tái sử dụng."
3525 = "Đó quả thực là một điểm mù."
3526 = "Đó có lẽ cũng là ấn tượng đầu tiên của mọi người. Lời nhận xét thẳng thắn của Kisaki đã tạo ra một bầu không khí nhẹ nhõm."
3527 = "Nói cách khác, đó là một sự tán thưởng không gì sánh bằng."
3528 = "Nếu những thành quả mà chúng em đã dày công vun đắp, có thể xoa dịu và mang lại niềm vui cho trái tim của Miyako."
3533 = "Nếu vậy thì thực tế chắc chắn sẽ làm được, và có lẽ tỷ lệ thành công cũng không hề thấp. Nhưng——"
3535 = "Nếu vậy, hãy lấy đây làm nhận thức chung và cùng đào sâu thêm."
3536 = "Nếu vậy thì, bố và mẹ vẫn đang tìm kiếm, vẫn chưa thể tìm thấy chuyến tàu này."
3537 = "Khi tỉnh giấc, chỉ có một mình. À——đúng rồi. Hôm nay là ngày nghỉ hiếm hoi sau một thời gian dài."
3541 = "Tất nhiên, việc kiểm tra kỹ lưỡng sẽ được tiến hành sau—— Nhưng em cảm nhận ngày càng rõ rệt rằng: Cách này chắc chắn thành công."
3542 = "Quảng cáo tuyên truyền không phải chuyên môn của em, nhưng trong quá trình kiêm nhiệm công việc kinh doanh cùng Hibiki, em đã học được rất nhiều điều."
3543 = "Em cảm thấy có chút cô đơn, nhưng niềm vui thì lại lớn hơn gấp bội."
3548 = "Liệu mối quan hệ của Denshahime-sama có giúp được gì không nhỉ—— Hửm?"
3555 = "Thứ nhất, bọn em cũng chẳng có mấy điểm chung."
3558 = "（\\x%lレイルロオド;#00ffc040;Railord%l;#; cũng có trái tim. Có lòng tự trọng, có sự kiên cường——và cả nỗi buồn.）"
3569 = "（Không……ma quỷ hay vong hồn thì—— làm sao có thể xem được tin tức báo chí chứ?）"
3571 = "（Thực tế là hôm nay em ấy cũng trốn biệt tăm—— À không, có lẽ chị Mayami đã để em ấy lánh đi đâu đó rồi cũng nên.）"
3573 = "（Ực）"
3574 = "（Cọc cạch, cọc cạch, xình xịch, xình xịch——）"
3575 = "（Hửm.）"
3576 = "（Cạch!）"
3577 = "（Reng rreng……Reng rreng——）"
3579 = "（Vì nằm gần Bảo tàng Lịch sử Đường sắt nên việc bảo tồn đầu máy không phải là hiếm. Thế nhưng 39685 lại không có điểm gì đặc sắc đến mức được đưa vào bộ sưu tập——）"
3589 = "＜Đầu máy - Khách - Khách - Khách＞ ＜\\x%l補機;#00ffc040;Đầu máy phụ%l;#; - Ăn - Lạnh - Điện＞"

