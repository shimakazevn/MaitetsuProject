1400 = "「……Để tỉnh lại,\\nrốt cuộc mình phải làm sao đây.」"
1401 = "「……Món vịt đó có vẻ là đặc sản của Thánh Đô.\\nTức là đồ ăn của tỉnh \\x%lしせん;#00ffc040;Tứ Xuyên%l;#;, nên khả năng cao là sẽ cay đấy ạ.」"
1404 = "「……Chỉ có chấn động lúc mới kéo đi thôi nhỉ.\\nDù đang chạy với tốc độ này, nhưng tàu lại không hề rung lắc một cách đáng ngạc nhiên.」"
1638 = "「Trông màu cánh gián có vẻ ngọt và cay——hay nói đúng hơn là có vẻ ngon.\\nChắc là không sao đâu, nhưng mà……」"
1641 = "「Chúng ta chia làm hai nhóm ba người nhé?」"
