2056 = "「Giường nằm cùng chiều hướng tàu chạy: tầng trên là Suika, tầng giữa là tôi, tầng dưới là cô Jiang.\\nGiường nằm ngược chiều: tầng trên là Hachiroku, tầng giữa là Hibiki và tầng dưới là Zhihuan.」"
