2107 = "「Tất nhiên rồi ạ! Em sẽ trân trọng nó suốt đời.\\nNó sẽ trở thành bảo vật của em.」"
2108 = "「Sau khi xong, xin mời những người ở tầng trên lên trước.」"
2111 = "「Từ chỗ anh hai có thể nhìn thấy Hachiroku, em và Zhihuan.\\nTừ chỗ Zhihuan có thể nhìn thấy Suika, anh hai và cô Jiang.」"
2112 = "「Quả thực kỹ năng ký họa nhanh của con bé, dù có nhìn quen rồi\\nvẫn khiến người ta phải kinh ngạc vì tốc độ――à.」"
2113 = "「Thư ký Jiang đang bảo mọi người đừng tụ tập lại.\\nNhưng có vẻ như điều đó lại gây ra tác dụng ngược.」"
2114 = "「Dù chỉ là ký họa nhanh, nhưng nếu cậu coi nó là một bức 『tranh』.\\nThì tất nhiên, giao cho người biết trân trọng nó chị sẽ vui hơn rồi.」"
2115 = "「Thầy Soutetsu. Để Suika xới cơm cho thầy nhé.」"
2116 = "「Thầy Soutetsu, đây là thực đơn ạ.」"
2117 = "「Anh Soutetsu?」"
2118 = "「Ngài Soutetsu…… ừm……\\nVì tôi đang mặc váy nên……」"
2119 = "「Ngài Soutetsu, ngài đã hiểu ra rồi sao?」"
2120 = "「Ngài Soutetsu. Tôi ngồi ở chỗ đằng kia có được không ạ?」"
2121 = "「Ngài Soutetsu?」"
2122 = "「A, em cảm ơn chị! Bức tranh đó, chắc chắn sẽ trở thành――\\nkỷ niệm quý giá của chuyến đi này đối với Zhihuan và em.」"
2125 = "「Không ạ. Kể từ khi làm nhiệm vụ trên tuyến chính, giường ngủ ở khu tập thể\\ncũng giống hệt như thế này ạ.」"
2126 = "「Em cảm ơn chị. Em thực sự rất vui.」"
2131 = "「Ở Zhongguo, toa ăn được gọi là \\x%lｃａｎｃｈｅ;#00ffc040;Can-che%l;#;. \\x%lさんしゃ;#00ffc040;Xan-chơ%l;#;.\\nĐược viết bằng chữ \"Xan\" trong bữa tối (Vãn xan) đấy ạ.」"
2135 = "「Xan-chơ! Hay nhỉ. Nghe rất sành điệu luôn~!!」"
2142 = "「!」"
2143 = "「!!!!」"
2265 = "Việc một nhóm người nước ngoài đi lang thang trên sân ga trong thời gian dài,\\ncó thể sẽ gây ra những nghi ngờ không đáng có."
2267 = "Hai chữ dầu diesel tự nhiên làm tôi nhớ đến nụ cười của Reina.\\nKhông hiểu sao, con bé lại mang vẻ mặt tự hào đầy đắc ý."
2269 = "Một tiếng \"Ưm……\" trầm ngâm nho nhỏ vang lên.\\nKhông biết từ lúc nào, Hibiki đã ngừng phác họa."
2278 = "Không biết từ lúc nào, chuyến tàu của chúng tôi cũng đã lăn bánh."
2280 = "Tuy nhiên, tôi có cộng cảm với Hachiroku.\\nChắc chắn Suika cũng có thể nghe thấy giọng nói của chúng tôi, nhưng——"
2290 = "Mọi người đang tụ tập lại và ngó vào, hoặc đang cố gắng ngó vào.\\nCuốn sổ phác thảo trên tay Hibiki."
2304 = "Bóng tối.\\nSự tĩnh mịch của màn đêm đích thực."
2306 = "Có một quá khứ. Giọng nói của Hachiroku đầy vẻ bí ẩn.\\nNhưng lúc này, tôi cũng đang khen ngợi cả Hachiroku nữa."
2309 = "Nhưng chỉ cần có thế,\\nbầu không khí trên bàn ăn bỗng bừng sáng."
2311 = "Dù vậy, tôi vẫn nhận ra đây là giấc mơ.\\nLà 『giấc mơ này』, đã bao năm rồi mới gặp lại."
2313 = "Cảm giác như được thấy một khía cạnh 『Rất con người』 của em ấy,\\nkhiến tôi cũng cảm thấy vui lên một chút."
2315 = "Bầu không khí tốt đẹp vừa chớm nở đã bị tiếng reo hò của Hibiki làm bay biến."
2330 = "Nhận lấy cuốn sổ phác thảo từ tay Hibiki,\\nchỉ vậy thôi cũng đủ khiến nụ cười rạng rỡ nở trên môi cậu bé."
2332 = "Chỉ vậy thôi cũng đủ khiến tôi cảm thấy thư giãn,\\nReina quả thực rất tuyệt vời."
2334 = "Là ánh sáng. Bất chợt hắt vào từ ngoài cửa sổ tàu."
2339 = "Không cảm nhận được hơi thở của con người.\\nTừ toa xe Ryokuhi trên sân ga đằng xa, cho đến giường nằm của chúng tôi."
2342 = "Hachiroku và Hibiki chắc cũng có chung cảm nhận.\\nHọ đã chuyển sang chế độ ăn uống một cách hoàn hảo."
2345 = "Không ngờ Hachiroku lại nháy mắt với tôi.\\nÁnh mắt ngạc nhiên của tôi bị ánh nhìn của Hachiroku dẫn dắt——"
2346 = "Có lẽ Hachiroku đang rất đau đầu suy nghĩ.\\nMột tiếng cười khúc khích nhỏ phát ra từ ngay phía trên tôi."
2348 = "Ánh mắt của Hachiroku hướng lên trên.\\nEm ấy đang ngước nhìn tầng trên cùng, như thể đang nhìn một thứ gì đó chói lóa."
2356 = "Quả nhiên là Suika cũng có hứng thú."
2357 = "Tôi lại hướng mắt ra ngoài cửa sổ. Cảm giác như đang trong một chuyến hành trình.\\nBất chợt, mãnh liệt. Mãnh liệt đến mức không thể cưỡng lại. Vô cùng mãnh liệt."
2360 = "Một ông lão tóc bạc, râu đẹp đang bắt chuyện với Hibiki.\\n——Có vẻ như ông ấy đã uống chút rượu."
2364 = "Tiếng tàu chạy, khác với mọi khi.\\nKhông có Michiko."
2365 = "Vé của tất cả mọi người đều bị thu lại và cất đi.\\nVào trong tập hồ sơ mà người trưởng tàu đang cầm."
2372 = "Cảm giác ấy, dễ chịu đến lạ thường."
2373 = "Ra là vậy. Soát vé sao."
2374 = "Ra là vậy, đó cũng lại là\\nmột trong những lý do chúng tôi được mời đến đây chăng."
2385 = "Quả nhiên là đang tủm tỉm cười――không, cười nham hiểm mới đúng?"
2389 = "Nhưng Suika lại không trả lời gì cả.\\nChỉ mỉm cười với một khuôn mặt bình yên."
2399 = "Hừm. Cũng không nên cắt ngang cuộc nói chuyện giữa cô Jiang và Hibiki.\\nNếu vậy, hai chỗ ngồi đằng kia đã được quyết định…… Giờ thì, làm sao đây."
2402 = "À……là ban đêm sao.\\nNghĩa là tôi, đã ngủ quên ư."
2404 = "À――Hibiki cũng nghĩ vậy sao.\\nDù đèn trong xe đang bật, nhưng vẫn thấy nó như đang say ngủ."
2408 = "Mặc dù miệng nói vậy, nhưng ánh mắt của Hachiroku cứ liên tục\\nliếc lên tầng trên cùng."
2411 = "Phát huy khả năng giao tiếp tuyệt vời ở một đất nước xa lạ,\\nvà được đánh giá là \"Quả không hổ danh\", như một điều hiển nhiên."
2413 = "Em ấy dẫn theo cô Jiang và Zhihuan,\\nhơn nữa còn hoàn thành việc phác họa trong thời gian cực ngắn rồi quay lại."
2414 = "Câu hỏi của Hibiki được dịch lại,\\nông lão cười tươi rạng rỡ và trả lời điều gì đó."
2416 = "Ngày xưa với Michiko――\\nRất lâu về trước, hình như tôi cũng từng trải qua một đêm như thế này."
2431 = "Với nụ cười trông có vẻ ngượng ngùng,\\ntrông họ như đang tuyệt vọng kìm nén tiếng cười."
2433 = "Chắc là đang vẽ lại quang cảnh lối đi.\\nTay của Hibiki di chuyển một cách sống động, không chút do dự."
2434 = "Khẩu hình miệng nói 『Tàu chạy mất rồi kìa』.\\nDù không biết thuật đọc khẩu hình, nhưng tôi vẫn hiểu rõ con bé đang nói gì."
2437 = "Nếu em ấy đã khao khát đến thế,\\nthì tôi cũng muốn cố gắng đáp ứng nếu có thể."
2439 = "Vừa xỏ giày xong, em ấy bước ra lối đi,\\nngồi xuống chiếc ghế phụ và lập tức mở sổ phác thảo ra."
2441 = "Nếu đúng là vậy, thì giấc mơ về toa hành khách trống không, không có Michiko――\\ngiấc mơ của ngày hôm đó, rốt cuộc là sự phản chiếu cho tâm lý nào của tôi đây."
2442 = "Nhắc mới nhớ, lúc nãy Hibiki vừa vẽ ký họa nhanh Suika nhỉ."
2452 = "Ngay cả cô Jiang đứng ngay bên cạnh cũng thường xuyên phải hỏi lại,\\nvậy mà Suika từ khoảng cách này lại nghe được không chút khó khăn."
2461 = "Thực tế là, đã bắt đầu có hiện tượng xô đẩy nhẹ."
2462 = "Thực tế là, nghe thấy tiếng của cô Jiang, những hành khách ở các giường phía trong\\ncũng thò đầu ra với vẻ mặt như muốn hỏi \"Có chuyện gì vậy\"."
2464 = "Giữa những câu chuyện phiếm của chúng tôi, tay của Hibiki vẫn thoăn thoắt di chuyển.\\nThêm Suika vào làm một trong những chủ đề chính——"
2466 = "Tựa như rèm cửa vừa được hé mở đôi chút,\\nmột luồng sáng tĩnh lặng――"
2467 = "Trên hộ khẩu, chúng tôi đã là anh em rồi.\\nVì Hachiroku quá e dè, nên đến giờ vẫn chưa thể gọi nhau như vậy thôi."
2471 = "Cả tôi và Hibiki đều hiểu điều đó.\\nNên chúng tôi hành xử sao cho không phá vỡ nó."
2472 = "Không cất tiếng, chúng tôi trao đổi ngôn từ, trao đổi tâm tư.\\nGiữa đêm khuya, trong chuyến du hành nơi đất khách, qua những dòng thư trao tay qua lại trên giường ngủ."
2474 = "Từ giường tầng trên cùng nhảy thẳng xuống sàn nhà,\\nmà không thèm kéo bậc bước chân ra."
2475 = "Nhìn cậu Zhihuan, nhìn xuống tay cậu ấy.\\nNhìn Hibiki, rồi lại nhìn cuốn sổ phác thảo."
2483 = "Ngay cả cậu Zhihuan cũng trở nên nghiêm túc.\\nNụ cười thường trực đã biến mất."
2496 = "Cậu Zhihuan và cô Jiang gọi nữ phục vụ lại,\\nhai người trao đổi nhanh điều gì đó."
2498 = "Ở phía đối diện tôi,\\ncậu Zhihuan và Suika rất tự nhiên ngồi cạnh nhau."
2501 = "Cậu Zhihuan nhìn Suika với vẻ bất an nhưng……\\nchắc chắn đây không phải là chủ đề mà chúng tôi nên khơi lại lúc này."
2503 = "Cậu Zhihuan nở nụ cười rạng rỡ, bím tóc của Suika cũng đang nhảy nhót.\\nĐến cả tôi cũng cảm thấy ấm áp lây."
2507 = "Không thể coi đây là một cú khởi hành mượt mà xuất sắc được…… Hay là khác với \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#;,\\nnó không thể kéo đi một cách trơn tru được nhỉ?"
2509 = "Nếu tôi ngồi trên chuyến tàu bên kia――\\nvà nhìn Hibiki đang nhìn tôi thì sao."
2511 = "Với 8620——\\nHay nói đúng hơn là, với động cơ hơi nước thì đây là một gia tốc không thể nào bắt chước được."
2513 = "Nếu mở miệng nói, sự tĩnh lặng này sẽ bị phá vỡ.\\nNếu có ai đó thức giấc, vẻ đẹp này sẽ bị tước đoạt mất."
2515 = "Đột nhiên khóe mắt tôi nóng lên, tôi đành hắng giọng để đánh trống lảng.\\nLà Hibiki đó. Một Hibiki từng là một khối nhút nhát đó."
2519 = "Tất nhiên nếu hỏi thì sẽ nhận được câu trả lời ngay thôi,\\nnhưng hiếm khi có dịp. Hãy tận hưởng \"Tuyến đường sắt xa lạ\" này một lúc đã."
2520 = "Chúng tôi hoàn toàn không nhận ra\\nsự xuất hiện của người trưởng tàu——khoan, hửm?"
2521 = "Đến đây tôi dừng bút, thử tưởng tượng xem sao."
2524 = "Cuốn sổ phác thảo chỉ viết vỏn vẹn nhiêu đó,\\nHibiki lập tức vẫy tay ra hiệu trả lại cho con bé."
2525 = "Tôi và Hibiki cũng lên tầng giữa.\\n……Đúng là trần nhà rất thấp và chật chội, nhưng cửa sổ lại rất lớn."
2528 = "Nếu tôi và Hibiki có thể hiểu mà Hachiroku lại không hiểu thì……\\nHừm. Có lẽ ấn tượng về \"Chuyến tàu nước ngoài\" đang cản trở suy nghĩ của em ấy."
2530 = "Nơi này, đáng lẽ tôi không còn chút vương vấn nào nữa.\\nNếu là lời từ biệt, thì tôi đã giải quyết ổn thỏa từ lâu rồi."
2532 = "Tôi chưa từng thấy bao giờ.\\nHoặc có lẽ là loại rau không có ở Hinomoto."
2533 = "Cảm nhận được ánh nhìn nhẹ nhàng của Hibiki, tôi quay sang.\\nHibiki đang nói chuyện với tôi, chỉ bằng khẩu hình miệng."
2535 = "Giấc mơ tôi nên thấy, không còn nằm ở quá khứ nữa.\\nMà chỉ hướng về tương lai thôi."
2536 = "Gấp cuốn sổ phác thảo lại, tôi đưa nó cho con bé.\\nHibiki nhận lấy, cũng không mở ra xem."
2539 = "Tôi ngồi thẳng lưng.\\nTừ phía sau, tôi cảm nhận được Hibiki và Hachiroku cũng làm như vậy."
2541 = "Không nghe thấy tiếng khởi hành."
2544 = "Khi tôi quay đi chỗ khác, Hachiroku dường như cũng đã nhanh chóng trèo lên tầng trên."
2545 = "Tôi lập tức nhảy xuống khỏi giường và đứng chắn để bảo vệ Hibiki."
2547 = "Tôi gật đầu.\\nDù biết rằng sẽ chẳng có ai nhìn thấy."
2548 = "Không biết có phải vì thích đồ ăn cay không, mà giọng của Zhihuan nghe rất vui vẻ."
2553 = "Theo quyết định đó của cô Jiang, chúng tôi giao việc khảo sát sân ga cho Hibiki, còn tôi và Hachiroku thì vào trong toa hành khách trước một bước."
2554 = "May mắn là vẫn còn sớm so với giờ ăn tối,\\nnên hầu hết các chỗ ngồi đều còn trống."
2557 = "Mọi thứ đều đang chìm trong giấc ngủ say.\\nNgoại trừ âm thanh ngòi chì lướt trên giấy của Hibiki."
2561 = "Nhận lấy và nhìn thử, dưới ánh sao nhân tạo,\\nnhững dòng chữ của Hibiki mờ mờ hiện lên."
2562 = "Nhìn ra ngoài cửa sổ, chỉ thấy một màu đen kịt.\\nCó vẻ như con tàu đang chạy xuyên qua màn đêm."
2565 = "Zhihuan ở tầng dưới phía đối diện, đang gật đầu với vẻ rất vui sướng.\\nDù khác quốc gia, nhưng tâm lý của một Master có vẻ vẫn không thay đổi."
2567 = "Cô ấy đã giải quyết sự hỗn loạn đó nhanh gọn đến vậy sao.\\nCùng với sự ngạc nhiên, lòng thán phục và biết ơn cũng trào dâng."
2571 = "Nếu vậy thì…… ừm.\\nCó thể sắp xếp vị trí giường nằm theo logic được không nhỉ."
2606 = "Với đôi tay đầy nâng niu, Hibiki\\ncẩn thận tháo một tờ ra khỏi cuốn sổ――"
2609 = "Hibiki dùng ánh mắt tươi cười cản tôi lại khi tôi định nhảy xuống,\\nvà nhờ cô Jiang phiên dịch giúp."
2611 = "Hibiki đưa tay ra.\\nNhận lấy cuốn sổ phác thảo từ tay cậu Zhihuan rồi chuyển lại."
2612 = "Không cần nhìn cũng biết――\\nĐó là một bức tranh đầy tâm đắc sao?"
2615 = "Vì Hibiki đưa mắt cầu cứu, tôi gật đầu ra hiệu cứ giao cho anh.\\nThịt vịt——『Thịt phần đầu vịt hun khói』."
2617 = "Từng nét chữ của Hibiki, khung cảnh chúng tôi cùng lén lút chiêm ngưỡng này,\\nđã lấp đầy cơ thể và tâm trí tôi bằng một niềm khao khát du hành thật dễ chịu."
2618 = "Đặt cây bút chì lên trang sổ phác thảo đang mở,\\nHibiki đưa nó cho tôi."
2620 = "Không thèm kiểm tra xem cậu Zhihuan đang chỉ bức nào,\\nHibiki cất giọng đầy mãn nguyện."
2623 = "Giọng nói của Hibiki kéo tôi về thực tại, tôi nhìn xuống——!!"
2625 = "Hibiki, em đắc ý quá rồi đấy.\\nRõ ràng đã dặn tôi không được nói điều thừa thãi mà――"
2626 = "Hibiki, Hachiroku và Suika trao đổi ánh mắt, rồi lập tức gật đầu sâu."
2628 = "Cây bút chì của Hibiki lướt đi thoăn thoắt.\\nChỉ dừng lại trong một khoảnh khắc ngắn ngủi."
2630 = "Hibiki vừa đứng lên,\\nvừa cẩn thận xé một tờ giấy từ cuốn sổ phác thảo ra."
2635 = "Là những vì sao.\\nNhững vì sao thật đẹp biết bao."
2637 = "Là Hibiki.\\nTrong bóng tối, mờ mờ ảo ảo――"
2641 = "Cậu Zhihuan và Suika vốn đang sát lại gần nhau, giờ đã trở về khoảng cách ban đầu――\\nhoặc có lẽ, xa hơn một chút so với lúc đầu."
2644 = "Đây là chuyến khảo sát, là công việc, đồng thời cũng là chuyến du lịch gia đình.\\nDù vậy, đây là chuyến hành trình của tôi, và cũng là chuyến hành trình của Hibiki."
2645 = "Mỗi chiếc bàn đều có ghế cố định,\\nnhìn thế nào cũng chỉ ngồi được tối đa bốn người, vậy thì——"
2647 = "Không sao. Giọng tôi chưa bị nghẹn ngào.\\nToa khách giường nằm dường như có khả năng khiến con người ta trở nên đa sầu đa cảm."
2651 = "So với hiện tại――so với quá khứ.\\nCó vẻ như tôi đang chạy trên một tuyến đường ray cao cấp hơn nhiều."
2652 = "Không cất tiếng, cũng chẳng cần viết chữ, chúng tôi truyền đạt cho nhau."
2654 = "Nhưng ngay sau đó, từ trong tập hồ sơ,\\nmột thứ gì đó khác đã được đưa ra để đổi lại——"
2661 = "Ngay khi tận mắt nhìn thấy giường ba tầng, em ấy đã thốt lên một giọng đầy xúc động."
2666 = "Một chấn động rõ rệt."
2667 = "Phốc một cái, chỉ trong chớp mắt,\\nSuika đã rơi xuống——không, là bay ngang qua trước mắt tôi."
2672 = "Phía bên kia lối đi hẹp cạnh nhà bếp,\\nlà một không gian rộng rãi, với những chiếc bàn sạch sẽ được xếp ngay ngắn."
2674 = "Đột nhiên im lặng, gây ra hiểu lầm là đang không vui,\\ncó lẽ cũng là điều cần phải tránh không kém gì việc \"lỡ lời\"."
2678 = "Những ngón tay của Hibiki chầm chậm――\\nkhép rèm lại, nhuộm đen màn đêm ma thuật."
2681 = "Cuối cùng, Hachiroku cũng đã lấy lại nụ cười."
2683 = "Trên sân ga, những vì sao chói lọi rải rác khắp nơi.\\nNhư ánh đèn chiếu sáng sân ga, như ánh đèn từ cửa sổ toa tàu đang say ngủ."
2685 = "Tiếng cười \"Fufu\" đáp lại,\\nthật mềm mại và ấm áp."
2688 = "Giữa đêm khuya. Từ khe rèm hé mở,\\nHibiki đang say sưa phác thảo thứ gì đó."
2689 = "Nếu có hành khách ở những giường nằm chưa được đổi thẻ,\\nthì bằng cách soát vé từng lần một, có thể ngăn chặn việc đi tàu trái phép."
2692 = "Chẳng mấy chốc, dừng hẳn. Tiếng bút chì của Hibiki im bặt.\\nMột thoáng sau, loại âm thanh hoàn toàn thay đổi――!"
2693 = "Sau đó con bé viết thêm gì đó,\\nrồi cuốn sổ phác thảo lại được đưa về phía tôi."
2694 = "Việc hành khách làm mất vé,\\ncũng có thể được ngăn chặn nhờ sự quản lý tập trung của người trưởng tàu——"
2696 = "Ông lão liền ngồi xuống chỗ trống đó,\\nvà đặt lên bàn một thứ gì đó——trông giống như thịt gà."
2698 = "Nhắc mới nhớ, cậu Zhihuan và Suika như trút được gánh nặng,\\nhai người đưa mắt nhìn nhau, khẽ mỉm cười."
2699 = "Là Hibiki.\\nCó vẻ như em ấy đã rút kinh nghiệm từ sự cố hôm trước."
2703 = "Giọng nói của Hibiki vang lên từ phía sau khiến tôi gật gù đồng tình.\\nRa là vậy. Đây cũng có thể coi là một phần khảo sát cực kỳ quan trọng."
2707 = "Bởi vì nếu Hachiroku thể hiện được sự nhanh trí và tinh tế,\\nthì tôi cũng sẽ cảm thấy vui sướng và tự hào."
2724 = "Suika lập tức dịch lại nội dung cuộc trò chuyện cho chúng tôi nghe.\\nTay của Hibiki cũng theo đó mà bắt đầu bận rộn cử động trở lại."
2725 = "Hiếm khi thấy Suika thể hiện sự bất mãn rõ ràng như vậy.\\n……Dùng những lời lẽ như vậy với một Railord thì không biết có ổn không, nhưng——"
2726 = "Fufu, Suika hiếm khi nở nụ cười trên môi.\\nMột nụ cười rất đỗi dịu dàng và ấm áp."
2729 = "Giọng nói đầy ngạc nhiên của Suika.\\nNếu vậy thì, có lẽ đó là một điều khá ngoại lệ."
2731 = "Ánh mắt của Suika liên tục đảo quanh."
2734 = "Ngay lập tức Suika rời khỏi chỗ ngồi,\\nvà quay trở lại giường tầng trên cùng trong nháy mắt với động tác nhẹ nhàng như làm xiếc."
2735 = "Suika cười. Một nụ cười rất khẽ."
2736 = "Suika khẽ nhích người lại gần,\\nnhìn chăm chú vào tay cậu Zhihuan từ ngay bên cạnh."
2755 = "Lời nói đầy sức nặng. Mong muốn mãnh liệt.\\nHibiki, tôi, và cả Hachiroku, đều không thể cười nổi nữa."
2756 = "Tuy nói vậy, nhưng Hachiroku cũng nhanh nhẹn hơn nhiều so với ấn tượng bề ngoài.\\nSự linh hoạt của em ấy khi đi trên bệ bước chân hành lang, còn hơn tôi rất nhiều——"
2757 = "Nói rồi, Hibiki bước xuống khỏi giường."
2758 = "Hibiki đã mở sổ phác thảo ra rồi.\\nÂm thanh ngòi bút lướt trên giấy cũng mạnh mẽ hơn thường ngày."
2759 = "Tiếng \"Ồ――\" chực thốt ra khỏi miệng vội vã bị tôi nuốt ngược vào trong.\\nQuay lại nhìn Hibiki và Hachiroku thì――"
2770 = "Tiếng bánh xe lướt qua các khớp nối đường ray, tĩnh lặng đến lạ thường."
2773 = "Chỉ trong chớp mắt, sân ga dài của ga Beiqin Tây đã lùi lại phía sau cửa sổ."
2786 = "Tiếng động cơ của đầu máy kéo không thể xác nhận từ cửa sổ này,\\nngay cả tiếng toa hành khách bị kéo đi, lăn bánh trên đường ray cũng không."
2790 = "Có lẽ là đang vẽ \\x%lクロッキー;#00ffc040;ký họa%l;#;, nhưng dù vậy thì cũng quá nhanh.\\nÁnh mắt và cơ thể của Hibiki liên tục xoay chuyển hướng."
2791 = "Bắt đầu bằng xô than đá,\\ncác món ăn lần lượt được dọn lên bàn."
2792 = "Cảm thấy thật vui. Sự đồng điệu nhỏ nhoi ấy.\\nHibiki là gia đình, là em gái tôi, giờ phút này tôi mới thấm thía điều đó."
2793 = "Đó là một vẻ mặt mà chúng tôi chưa từng thấy trước đây,\\ncó lẽ là vẻ mặt nghiêm túc tột độ."
2794 = "Đối với một người thích những thứ dễ thương như Hibiki cho đến tận bây giờ,\\nviệc 『Ăn đầu của bạn vịt』 có lẽ sẽ rất khó khăn."
2800 = "Viết xong đưa lại, những dòng chữ của Hibiki lập tức được gửi trả lại."
2801 = "Không đợi tôi nói hết câu,\\nHachiroku đã ngồi xuống bàn của Hibiki và cô Jiang."
2802 = "Dù tàu còn chưa chạy, nhưng sự chật hẹp của chiếc giường ba tầng này có vẻ như\\nđã thu hẹp khoảng cách giữa những trái tim——Ô!?"
2803 = "Vừa nói, Suika vừa thoăn thoắt\\ncởi giày bốt xếp ngay ngắn, rồi trèo lên tầng trên cùng."
2805 = "Nói cách khác, ở bàn của tôi còn lại——"
2806 = "Giọng của ông lão vừa lầm bầm lại vừa nhỏ.\\nTiếng loa phát thanh trên xe và tiếng ồn ào càng làm cho giọng nói đó khó nghe hơn."
2808 = "Một khoảng thời gian tĩnh lặng đến mức, chỉ một lời nói cũng trở thành tạp âm,\\nnhư thể thế giới và chúng tôi hòa làm một."
2809 = "Có lẽ các hành khách khác cũng đã sắp xếp xong chỗ ngủ của mình,\\nnhững tiếng ồn ào phía lối đi cũng đã trở nên náo nhiệt hơn hẳn."
2810 = "Dù cô Jiang, tôi, Zhihuan,\\nvà cả ông lão cũng đã đứng ra làm lá chắn nhưng——"
2811 = "Tay vẫn không ngừng đưa nét,\\nnhưng có vẻ Hibiki cũng đang âm thầm tham gia giải đố."
2812 = "Những đường nét thoạt nhìn có vẻ lộn xộn mà Hibiki đã vẽ, không chỉ dừng lại ở dáng vẻ oai phong của Dongfu 4D,\\nmà còn gói gọn cả bầu không khí trước giờ khởi hành của toàn bộ nhà ga."
2819 = "Là âm nhạc. Không phải tiếng chuông báo, mà là một bản nhạc——ca khúc, nhạc nhẹ.\\nCó lẽ là bài hát của một thần tượng nào đó chăng."
2825 = "Hướng về đêm khuya tĩnh mịch, hướng về bình minh rạng rỡ――\\nvà hướng về Thánh đô đang chờ đợi ở phía trước."
2831 = "Khoảng thời gian ma thuật chắc chắn sắp kết thúc rồi,\\nnhưng tôi tin chắc rằng, nếu là bây giờ thì nhất định sẽ truyền đạt được."
2844 = "(Mặc dù vậy, tối qua tôi vừa mới bị nhắc nhở nghiêm khắc xong.\\nPhải cẩn thận không được lỡ lời nói điều gì thừa thãi mới được.)"
2846 = "(Rốt cuộc là đang vẽ cái gì――――!)"
2848 = "(Cạch)"
2849 = "(Cạch) (Cạch) (Cạch)"
2850 = "(Sột soạt――xoẹt――xoẹtttt)"
2851 = "(A――)"
2852 = "(Cạch cạch xình xịch, cạch cạch xình xịch)"
2854 = "(Ngủ ngon nhé, Hibiki.)"
2855 = "(Xoẹttt, xoẹt, xoẹt――sột soạt, sột soạt)"
2856 = "(Trưởng thành rồi nhỉ——thật sự——)"
2858 = "(Toa xe Ryokuhi……kia là tàu hồi tống sao?\\nBật đèn trong xe, chắc là đang dọn dẹp vệ sinh nhỉ.)"
2862 = "(Ngủ ngon nha, anh hai.)"

[selections]
