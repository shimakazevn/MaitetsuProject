1916 = "「Anh thực sự nghĩ rằng, mình là một người đàn ông may mắn khi có được những người em gái tuyệt vời.」"
1917 = "「Mời mọi người dùng bữa.」"
1918 = "「Mời mọi người dùng bữa!」\\n「Mời mọi người dùng bữa.」"
1920 = "「Chắc đây là một nét văn hóa của họ……\\nỪm. Đặc biệt là không có dấu hiệu nào cho thấy có ai bận tâm cả.」"
1923 = "「Vì vậy, tôi hoàn toàn không biết gì cả.\\nCảm giác nằm trên giường, sự ấm áp, hay sự tĩnh lặng của màn đêm.」"
