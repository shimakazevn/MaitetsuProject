1706 = "「Họ vừa gọi thêm bắp cải xào và thịt bò luộc cay.\\nVốn định gọi cả lẩu thỏ nữa, nhưng nghe nói thịt thỏ đã hết rồi ạ.」"
1708 = "「Chỉ là……đây là lần đầu tiên tôi đến toa ăn, nên hơi bối rối.\\nKhông biết việc gọi món thì phải làm thế nào nhỉ.」"
