2081 = "「Đây là——」"
2082 = "「Vậy sao ạ.」"
2083 = "「Vậy sao.\\nThật bất ngờ khi em chưa từng có kinh nghiệm đó.」"
2084 = "「Đó là món Mai thái khâu nhục, anh Soutetsu.\\nLà món hấp kết hợp giữa thịt lợn và rau mai thái đó ạ.」"
2085 = "「Đúng là chỉ có thể gọi nó là rau mai thái thôi.\\nTôi rất mong chờ xem hương vị của nó ra sao đây.」"
2087 = "「Bài hát…… được phát qua loa phát thanh trên xe nhỉ.\\nNếu là ở Hinomoto, chắc sẽ có người cảm thấy bị làm phiền mất.」"
2090 = "「Đổi lại vé một lần nữa——sao ạ?\\nTại sao lại phải tốn công sức như vậy nhỉ?」"
2091 = "「Xin các vị cứ tự nhiên chọn những món mình thích trước đi ạ.\\nChúng tôi sẽ dựa vào đó để gọi thêm những món còn thiếu.」"
