1340 = "《Dạ không, tình cờ thôi. Em bị tỉnh giấc,\\nđịnh vén rèm xem có thấy gì không, ai dè lại thấy cảnh này.》"
1342 = "《Nãy giờ, Hibiki vẫn thức sao?》"
