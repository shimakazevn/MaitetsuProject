1652 = "「Nếu áp dụng cho Nine Stars thì có lẽ cũng tốt đấy. Và khi đổi lại thẻ và vé,\\nsẽ tặng kèm một tấm chứng nhận đi tàu có cùng hình vẽ.」"
1656 = "「Hai người họ nói vậy đấy, hai em thấy sao?」"
