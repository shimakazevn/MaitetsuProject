2096 = "「Là để quản lý chỗ ngồi đúng không ạ! Khi trả lại tấm thẻ này,\\nlà lúc hành khách sắp sửa xuống tàu.」"
2099 = "「Vậy thì, tôi sẽ đi trước dẫn đường. Thư ký Jiang sẽ hội quân sau,\\ncòn Suika và tôi sẽ đi trước và sau để kẹp mọi người ở giữa.」"
