2007 = "「Hơn nữa, toa khách giường nằm thì…… vào thời Đường sắt Hoàng gia,\\ntôi thậm chí còn chưa từng kéo chúng bao giờ.」"
2010 = "「Trên đó còn có cả ảnh của đoàn tàu nữa nhỉ.\\nCó phải là đồ lưu niệm đi tàu không ạ?」"
2012 = "「Thật là vinh hạnh quá.\\nKhông ngờ lại được dùng bữa đối diện với anh Soutetsu.」"
2014 = "「Thực sự rất vui ạ!\\nVừa nằm, ufufu, vừa tận hưởng chuyến du lịch bằng tàu hỏa thế này.」"
2015 = "「Ra là vậy, em thường xuyên sử dụng toa khách giường nằm sao?」"
2021 = "「Được á? Em cũng ghi chú xong rồi nè.」"
2030 = "「Trọng lượng cơ thể chỉnh bị của Suika không khác gì mức trung bình của cùng dòng máy.\\nCách nhảy xuống vừa rồi, chỉ đơn giản là do quen thuộc thôi ạ.」"
2033 = "「Sau khi các cỗ máy chị em được sản xuất hàng loạt và đưa vào vận hành,\\nchiếc 2000 của Suika cũng chỉ được đưa vào tuyến chính như một phương tiện thông thường thôi.」"
2035 = "「Suika. Nhìn này.\\nChị ấy vẽ cậu nè.」"
2036 = "「Nếu không hợp khẩu vị, tôi rất sẵn lòng ăn giúp mọi người đấy.」"
2039 = "「Nếu có gì bất tiện, xin hãy nói ngay nhé.」"
2041 = "「Thầy ăn một bát đầy vun luôn nhé?」"
2046 = "「Không không, không phải là con bé không biết viết chữ đâu.\\nChắc chỉ là đang dùng sổ phác thảo thay cho sổ tay thôi.」"
2047 = "「Cho tôi một phần cơm trắng luôn nhé.」"
