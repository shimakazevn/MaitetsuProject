2074 = "「Điều đó cũng thật tuyệt vời nhỉ.」"
2075 = "「Đó không phải là đồ lưu niệm đi tàu đâu ạ.\\nLát nữa mọi người sẽ phải đổi lại vé một lần nữa đấy?」"
2076 = "「Ông lão đó có vẻ là người vùng Thánh Đô.\\nNghe nói ông ấy đang trên đường về sau khi đến thăm con gái lấy chồng ở Beiqin.」"
2077 = "「Nguy to rồi. Chuyện này có thể dẫn đến ẩu đả mất.」"
2078 = "「Có vẻ như người lái tàu và Railord này kinh nghiệm còn non nớt nhỉ.」"
