1817 = "「Hửm? Ưm mư——A, đúng rồi. Ra là vậy!!!」"
1819 = "「Hửm? À――ừm. Nhờ em vậy.」"
1821 = "「Hả? À, vâng! Đúng vậy anh Soutetsu.\\nKhông sai đâu ạ, phần rau dưới lớp thịt lợn đó chính là rau mai thái.」"
1822 = "「Hửm? Vé sao? Tôi hiểu rồi.\\nHachiroku. Hibiki. Đưa vé đây.」"
1824 = "「Fufu.」"
1826 = "「Fufu, Suika cũng muốn\\nchị tặng một bức hả?」"
1829 = "「Ufufu, Hinomoto và Zhongguo.\\nĐây là sự kết hợp những điểm tốt nhất trong dịch vụ của cả hai bên nhỉ.」"
1830 = "「Ufufu, cao quá ạ.\\nGiường nằm…… A, cũng mềm mại lắm đúng không ạ.」"
1831 = "「Ufufu, háo hức chờ đến lúc nói 『Mời mọi người dùng bữa』 quá.\\nThật là một cảm giác tuyệt vời.」"
1834 = "「Vì cần phải đổi lại vé, nên chắc chắn sẽ phải gọi họ dậy sao.\\nHừm…… Không, điều này không chỉ thú vị, mà còn được tính toán rất kỹ lưỡng.」"
1836 = "「Ở Hinomoto, tôi nhớ việc quản lý chỗ ngồi được xác nhận bằng ghi chép tay\\n……Ra là vậy, đây là một cách làm rất tuyệt vời.」"
1837 = "「Chị chỉ kéo những chuyến tàu chạy ban ngày thôi sao?」"
1839 = "「Sẽ là như vậy ạ. Nhưng, những điểm khác chắc chắn sẽ hơi khác so với tưởng tượng.」"
1848 = "「Chắc là vậy. Gợi ý của Suika,\\nđã biến vấn đề này thành một câu đố thú vị.」"
1851 = "「Ông ơi. Cảm ơn ông vì đã kể cho cháu nghe rất nhiều chuyện.\\nVà cả món thịt vịt nữa. Cháu xin nhận nhé!」"
1853 = "「Xong~ rồi! Em vẽ xong rồi~——Á!?」"
1855 = "「Tuyệt thật. Chị ấy vẽ rất nhiều dáng vẻ của Suika này.\\nDù chỉ là phác thảo thô, nhưng sự dễ thương vẫn được thể hiện trọn vẹn.」"
1857 = "「Muốn ăn quá đi. À, cô Jiang này.\\nỞ Trung Quốc, khi bắt đầu bữa ăn mọi người thường làm thế nào vậy?」"
1858 = "「Anh biết rồi, anh sẽ giữ hộ.」"
1859 = "「Khu tập thể hiện tại thì khác rồi, nhưng chiếc giường ba tầng\\ntừng trải qua cùng vô số chị em gái, Suika vẫn luôn yêu thích nó.」"
1861 = "「Nếu được anh chỉ bảo thêm về tình hình đường sắt Hinomoto hiện tại,\\nSuika sẽ rất vui đó ạ.」"
1863 = "「Chị hiểu rồi. Chị sẽ vẽ. Đợi lúc cậu Zhihuan lơ là nhất,\\nlúc cậu ấy mang vẻ mặt thường ngày, chị sẽ vẽ roẹt một cái là xong.」"
1868 = "「Mọi người thấy sao, cô Jiang?」"
1870 = "「Cô Jiang, bác này nói gì vậy ạ?」"
1875 = "「Cô Jiang.」"
1878 = "「Phải rồi, nếu dùng động cơ diesel để làm quay mô-tơ,\\nthì Suika cũng nạp dầu diesel nhỉ.」"
1879 = "「Đối với chúng tôi, nó lại vô cùng mới mẻ và hấp dẫn.\\nNgược lại, việc đổi vé vốn là điều hiển nhiên với chúng tôi, lại là điều mới lạ với thầy Soutetsu và mọi người.」"
1881 = "「Chính xác. Những giường nằm đã được đổi thẻ và vé,\\nlà những giường nằm đã được mua vé hợp lệ.」"
1891 = "「Khi tiếp xúc với góc nhìn của nước ngoài, thì điều đó sẽ được làm mới lại nhỉ.\\nEm…… ừm. Thật tốt khi được mời đến đây!」"
1894 = "「Cậu Zhihuan. Đây là……rau mai thái phải không?」"
1896 = "「Nói vậy, nghe cứ điềm gở thế nào ấy.」"
1898 = "「Họ nói vậy đó.」"
1899 = "「Không, nếu phát như một món đồ lưu niệm\\nthì có vẻ sẽ tốn quá nhiều chi phí……」"
