1663 = "「Chị có bản sao để lưu trữ rồi. Dù có rút hai tờ trước sau đó ra,\\nthì chị cũng đã vẽ một bố cục y hệt với ông lão râu kẽm rồi.」"
1671 = "「Hachiroku. Công việc của người trưởng tàu,\\nanh nghĩ ở Zhongguo và Hinomoto cũng giống nhau thôi, đúng không?」"
1674 = "「Nếu cậu không phiền thì cứ lấy bức đó đi. Bức đó chính chị cũng\\ncảm thấy mình đã nắm bắt được trọn vẹn sức hút của Suika á.」"
1679 = "「Công việc của trưởng tàu…… của tàu khách giường nằm——\\nA! A! Aaaaa!!!」"
