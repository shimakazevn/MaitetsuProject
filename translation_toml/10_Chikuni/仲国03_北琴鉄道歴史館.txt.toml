2132 = "「Chuyến tàu đầu tiên ở Zhongguo. Tàu Z49.\\n\\x%lこうがしゃ;#00ffc040;Toa giường cứng%l;#;…… Mọi người đã sắp xếp cho chúng ta giường ba tầng nhỉ.」"
2133 = "「Lúc của bọn anh sao.」"
2134 = "「Anh cũng vậy thôi. Dù là đi khảo sát, nhưng đây là lần đầu tiên đến một đất nước xa lạ——\\nDù hơi tiếc vì chị Mayami không thể đi cùng, nhưng đây cũng là một chuyến du lịch gia đình mà.」"
2138 = "「À ừm…… dạ…… a, đúng là vậy ạ! Tương tự, 2-C-1.\\nHình thức bánh xe chủ động 4-6-2 được gọi là Pacific ạ.」"
2139 = "「Tôi nghe nói là vậy.\\nVề phần đó, chắc Suika nhớ chính xác hơn tôi.」"
2140 = "「Tôi nghĩ là như vậy ạ. Dù kiến thức của tôi,\\ncũng chỉ là học hỏi từ tiểu thuyết tình cảm hay manga thiếu nữ thôi.」"
2141 = "「Anh biết không? Anh hai.\\nMột cô gái đang yêu ấy, sẽ rất quan tâm đến cảm xúc của đối phương đấy.」"
2145 = "「Do đó, giải pháp tối ưu cho sự phát triển đường sắt ở Hinomoto, nơi không thể tránh khỏi việc sử dụng khổ hẹp là……\\nPhát triển theo phương thức phân tán động lực——phương thức \\x%l電車;#00ffc040;tàu điện%l;#.」"
2146 = "「Thế nên. Hibiki. Hachiroku vừa dạy cho chúng ta rằng Mikai\\ncó nghĩa là máy số 1 của dòng Mikado phải không?」"
2152 = "「Suika, không muốn chỉ là 『Chị gái』 của Zhihuan sao.」"
2154 = "「Anh đã khiến cậu ấy nói ra mất rồi còn gì!\\nLà 『Chị gái』 đấy! Một cách rõ ràng!!」"
2156 = "「Chiếc 8620 của tôi, cho đến ngày hôm nay\\ntuy chỉ là một \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; nhỏ bé, nhưng dù vậy thì」"
2162 = "「Nếu anh hiểu điều đó——thì…… a~.\\nDù có hiểu, ừm. Anh hai cũng chỉ nhìn theo đúng nghĩa đen thôi nhỉ.」"
2163 = "「Nếu vậy thì, chẳng có cách nào cả.\\nCứ như bình thường. Không cần phải làm gì đặc biệt cả là được.」"
2177 = "「Hibiki!!」"
2179 = "「Hibiki, chúng ta đang ở khách sạn đấy.」"
2183 = "「Chi tiết về chuyến tàu ngày mai tôi cũng đã truyền đạt lại rồi.\\nXin hãy hỏi họ khi có thời gian nhé. Vậy, tôi xin phép.」"
2188 = "「Đúng nhỉ. Khi tiếp xúc với Zhihuan, thay vì biểu cảm trên khuôn mặt\\nthì bím tóc của Suika lại đung đưa, nhảy múa nhiều hơn hẳn.」"
2190 = "「Đúng vậy nhỉ…… Có lẽ cũng có ảnh hưởng từ việc Đường sắt Hoàng gia\\nđã cho thấy khổ hẹp có giới hạn về cả tốc độ lẫn tải trọng.」"
2191 = "「Đúng vậy.」"
2193 = "「Đúng vậy, họ đã sắp xếp hoàn toàn theo đúng nguyện vọng của chúng ta.\\nThật đáng biết ơn.」"
2195 = "「A, đúng là có cảm giác như người lớn và trẻ con vậy.\\nChiều dài, chiều rộng, chiều cao——mọi kích thước, có lẽ đều gấp 1.5 lần chiếc 8620.」"
2196 = "「Là chuyện về kích thước của đứa bé này, chiếc 2101.\\nQuốc Hệ hiệu phải không ạ?」"
2200 = "「Vâng. Nếu hình thức \\x%l電車;#00ffc040;tàu điện%l;#; được chọn,\\nthì Suika đã không có mặt trên cõi đời này.」"
2203 = "「Vâng. Cha tôi và những người xung quanh ông đều đánh giá như vậy.\\nDo đó, họ đã học hỏi từ Hinomoto, cố gắng bắt kịp và vượt qua.」"
2204 = "「Vâng.」"
2205 = "「Vâng!」"
2207 = "「Vâng!\\nKhổ đường ray này chắc chắn là khổ tiêu chuẩn 1435mm.」"
2209 = "「Vâng. Bởi vì Quốc Hệ hiệu, nếu truy ngược về nguồn gốc thì nó được sản xuất tại Hinomoto\\n——chính là chiếc Mikai từng được sử dụng ở Đường sắt Nam Man cũ.」"
2211 = "「Ồ.」"
2212 = "「Bữa tối Vịt quay Beiqin làm bụng em no căng luôn rồi,\\nnên vừa chui vào chiếc giường mềm mại là em ngủ thiếp đi ngay!」"
2218 = "「Quả nhiên là vậy sao——」"
2220 = "「Giải Phóng loại 1, 2101.\\nChiều dài tổng thể của Quốc Hệ hiệu là 21.91m.」"
2222 = "「Vì ước nguyện của cha cậu Zhihuan không thành hiện thực——\\nNên Suika mới được sinh ra sao?」"
2224 = "「Đúng vậy ạ. Cũng không có thiệt hại thực tế nào xảy ra cả.」"
2225 = "「Đúng vậy. Dù từng bị hư hỏng đến mức suýt bị vứt bỏ,\\nnhưng nó đã được phục hồi để kỷ niệm một năm thành lập Zhongguo, và lại tiếp tục hoạt động.」"
2227 = "「Đúng vậy nhỉ. Những đường ray mà chúng ta đã kế thừa——\\nLà để truyền lại cho những thế hệ xa hơn nữa.」"
2229 = "「Thay vì nói là \"với tôi\", thì có lẽ cô bé sợ rằng nếu tôi biết,\\nđiều đó sẽ truyền đến tai \"ai đó\" chăng?」"
2231 = "「Đúng vậy. Và nghe nói hình thức 1-D-1,\\ncó một biệt danh là Mikado.」"
2232 = "「Đúng vậy. So với việc tập trung động lực và trọng lượng vào đầu máy,\\nthì \\x%l電車;#00ffc040;tàu điện%l;#; với việc phân tán chúng trong toàn bộ đoàn tàu sẽ giảm bớt gánh nặng cho đường ray hơn.」"
2234 = "「Không sao đâu ạ. Chúng ta là gia đình, là đồng đội.\\n——Phải không ạ?」"
2241 = "「Nhưng mà…… sau khi xem xét kỹ lưỡng, thứ được chọn lại là Dongfu 4 loại——\\nđầu máy của bọn Suika, được chế tạo dựa trên nền tảng kỹ thuật của Lỗ Quốc (Nga).」"
2248 = "「Nên lấy từ tên của chủ sở hữu Đường sắt Đế hữu Hinomoto, Hoàng đế Hinomoto (Mikado),\\nđể đặt biệt danh là Mikado sao!?」"
2251 = "「Đường sắt Hoàng gia ngày xưa——ít nhất là vào thời kỳ đầu thành lập của Đường sắt Quốc gia Zhongguo,\\nlà một sự tồn tại xứng đáng được xem như đối thủ sao.」"
2253 = "「Đúng là——khoảng cách với Zhihuan trở nên xa cách một cách kỳ lạ,\\nvà bím tóc cũng gần như không còn nhảy múa nữa, nhưng mà——」"
2254 = "「Thánh Đô……」"
2258 = "「Thật sự. Đây là một vấn đề khó khăn đấy ạ.」"
2260 = "「Thật sự, Ngài Soutetsu quá vô tâm đấy ạ.」"
2271 = "「Đúng vậy. Cho dù là Tuyến Tokyodo hay Tuyến Hisatsu,\\nđều là những tuyến đường chiến lược quốc gia được xây dựng bằng uy tín của đất nước……」"
2272 = "「Đúng là có sự khác biệt. Khi đối diện với Zhihuan,\\nSuika, ừm…… nói sao nhỉ, phản ứng có vẻ nhạy cảm hơn.」"
2273 = "「Quả đúng là vậy.\\nThật sự——đúng là như vậy ạ.」"
2274 = "「Đúng là vậy nhỉ. So với tôi, người có số hiệu đầu tiên là 8620,\\nthì cũng chẳng có gì khác biệt lớn lắm đâu ạ.」"
2275 = "「Quả đúng là vậy. So với cái tên \"Mikai\" mang tính máy móc,\\nthì \"Quốc Hệ hiệu\" đẹp đẽ hơn——và phong phú ý nghĩa hơn nhiều.」"
2278 = "「Vậy nên, tôi muốn nhờ mọi người một lần nữa. Xin hãy để chúng tôi\\nhọc hỏi được nhiều nhất có thể từ những gì bảo tàng lịch sử này mang lại.」"
2292 = "「Không chỉ ở Hinomoto, mà ở những quốc gia được kỳ vọng vào sự phát triển của \\x%l電車;#00ffc040;tàu điện%l;#;\\nkhông có ngoại lệ, Aircra đều phát triển rất mạnh mẽ.」"
2294 = "「Và ở đó,\\ncó những chiếc đầu máy hơi nước đang chờ đợi chúng ta phải không ạ!」"
2297 = "「Cỗ máy thử nghiệm được hoàn thành theo cách đó,\\nchính là Dongfu 4 2000 của Suika——cỗ máy thử nghiệm số 1 của Dongfu 4.」"
2299 = "「Và. Từ Nine Stars đó,\\nchúng tôi lại đang cố gắng học hỏi thêm một lần nữa.」"
2301 = "「Nói cách khác, ngay cả Nine Stars, cũng là thứ kết nối giữa Đường sắt Hoàng gia tốt đẹp xưa cũ,\\nvà tương lai mà Đường sắt Hoàng gia đã mơ ước vào những giây phút cuối cùng.」"
2304 = "「Và 9700 cũng là \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; 1D1 đầu tiên được sản xuất tại Meikoku——\\nVì vậy, để thể hiện sự tôn trọng đối với bên đặt hàng」"
2308 = "「Đây là một trong những điểm đến du lịch phổ biến,\\nmà người dân Beiqin rất thích ghé thăm——」"
2310 = "「Nhưng mà, anh hoàn toàn không biết mình đã làm hỏng chuyện gì, và vào lúc nào.\\nNếu được, xin hãy chỉ giáo từ đoạn đó.」"
2315 = "「Nếu không phiền, tôi muốn hỏi thêm một điều nữa.\\nTại sao cha của Zhihuan lại phân tích chi tiết về Đường sắt Hoàng gia đến vậy?」"
2316 = "「Nói là được sản xuất tại Hinomoto nhưng…… chiếc Mikai ban đầu,\\ncó phải mang ý nghĩa là \"chưa được khai phá\" không?」"
2325 = "「Suika là Railord của tôi. Là giáo viên tiếng Hinomoto của tôi.\\nVà từ rất lâu trước đó! Cô ấy đã là chị gái của tôi rồi!」"
2328 = "「Tội nghiệp Suika.\\nSự bối rối và suy sụp sau lúc đó của cô bé……」"
2329 = "「Anh cứ nhìn cách Suika đối xử với Zhihuan đi.\\nAnh hai, anh không cảm thấy gì sao?」"
2331 = "「Suika sẽ giải thích lý do tại sao. Hai quốc gia mà Quốc Hệ hiệu kết nối.\\nĐó chính là Zhongguo và Hinomoto.」"
2332 = "「Tôi…… tôi đã không hiểu được điều đó.\\nBởi vì, những tuyến đường mà tôi đã chạy——đang chạy, tất cả đều」"
2333 = "「Phòng khách sạn ấy ạ!\\nNó có tận hai tầng làm em bất ngờ lắm luôn.」"
2337 = "「Việc giải thích những chuyện thuộc loại này cho Ngài Soutetsu,\\ncó vẻ sẽ khá là tốn công sức đây ạ.」"
2339 = "「Xem như đối thủ! Chính là nó. Cảm ơn Hachiroku.」"
2345 = "「Gì cơ? Anh hai.\\nCái Pashina? Hay Mikai đó là gì vậy.」"
2346 = "「Ra là vậy, nếu thế thì, hai người đã gắn bó với nhau\\ntừ lúc Zhihuan mới sinh ra rồi nhỉ.」"
2347 = "「Xin cứ tự nhiên, chị muốn hỏi gì cũng được.\\nNếu là điều tôi có thể trả lời, tôi sẽ trả lời.」"
2348 = "「Xin cô cứ đi đi, không cần bận tâm đến chúng tôi đâu.\\nChúng tôi có thể đợi ở đây cho đến khi cô quay lại.」"
2349 = "「Mọi người đã có một giấc ngủ ngon, vậy là tốt nhất rồi.」"
2350 = "「Đường ray để đứa bé này có thể chạy hết tốc lực…… Đúng vậy nhỉ.\\nRất khó để có thể trải rộng đến mọi ngóc ngách của Hinomoto.」"
2376 = "「Anh không biết sao? Anh hai. Thử suy nghĩ kỹ xem nào?」"
2377 = "「\"Ai đó\" là ai?」"
2378 = "「Chà, tại sao nhỉ. Ví dụ như, đúng rồi……\\nGiữa cô Michiko và Ngài Soutetsu thì thế nào ạ?」"
2379 = "「Về chuyện đó, anh cảm thấy cô bé có vẻ rất vui. Qua cách nói chuyện,\\nhay cách thể hiện sự tin tưởng. Từng hành động một đều cho thấy điều đó.」"
2380 = "「Chỗ đó, quả thực là……\\nKhông nên dễ dàng nói ra miệng như vậy đâu ạ.」"
2381 = "「Điều đó thật sự rất đáng biết ơn đấy!\\nNếu là phòng riêng thì chẳng khảo sát được gì đâu.」"
2382 = "「Thành phố có cái tên thật đẹp,\\nnhưng không biết đó sẽ là một nơi như thế nào nhỉ?」"
2383 = "「Đứa bé này…… mang đậm cảm giác Đại lục. Đèn pha nhô hẳn ra ngoài,\\nmà bên trên lại còn có cái gì đó giống như vương miện nữa.」"
2384 = "「Trong bảo tàng lịch sử này, còn có những đầu máy hơi nước được chế tạo ở Osaka nữa.\\nĐường ray của Zhongguo và Hinomoto, trước đây từng được kết nối với nhau đấy.」"
2385 = "「Ra là vậy, toa hành khách hôm qua…… Lục Bỉ Xa! Cũng là\\nkhổ tiêu chuẩn nên mới rộng rãi như thế nhỉ~」"
2386 = "「Vì đây là bảo tàng nên tất nhiên là được rồi. Cả chụp ảnh cũng được.\\nĐối với những khu vực cấm, tôi nhất định sẽ nhắc nhở trước.」"
2387 = "「Nói là ẩn ý thì hơi quá nhưng…… ưm~」"
2388 = "「Nói mới nhớ đúng là vậy. Nhưng mà…… ra là vậy.\\nSuika là Railord của cỗ máy thử nghiệm sao.」"
2389 = "「Tuyến Yui cũng là tuyến đường bằng phẳng trên vùng đất bằng phẳng mà.\\nHachiroku không biết về những tuyến đường nền đất yếu cũng là điều dễ hiểu thôi.」"
2390 = "「Mọi quá khứ, nhất định đều có thể trở thành nền tảng cho tương lai.\\nNgay cả những điều không muốn nhớ lại, cũng có thể nghiền nát thành đá ba-lát, rồi đầm cho thật chặt.」"
2393 = "「Thì là! Chuyện về mối quan hệ giữa Suika và Zhihuan ấy!」"
2394 = "「Không ngờ, lại là như vậy sao.」"
2396 = "「Không sao, cứ giao lại cho Zhihuan và Suika. Xin mọi người cứ tự do hành động.\\nNếu có thể, tôi sẽ quay lại hội quân sau.」"
2400 = "「Cô bé đã phải chịu đựng——đến mức không thể che giấu được cộng cảm nữa.」"
2401 = "「Thậm chí còn có những kẻ huênh hoang như vậy đấy ạ.\\nHọ hiểu lầm rằng những đặc quyền sẵn có là điều hiển nhiên, và sẽ tồn tại mãi mãi.」"
2403 = "「Trông có vẻ là một chiếc Aircra cao cấp nhỉ.」"
2404 = "「Vậy thì, Ngài Soutetsu. Suika có hoàn toàn giống nhau không ạ?\\nKhi tiếp xúc với cô Jiang, và khi tiếp xúc với Zhihuan.」"
2406 = "「Nếu vậy thì, nhỉ? Phải học hỏi thật nhiề——\\nÀ không phải! Phải tất cứu thật nhiều mới được, nhỉ?」"
2407 = "「Nguyện vọng gì ạ?」"
2411 = "「Oa! Được anh nghĩ đó là một cái tên tuyệt vời,\\nSuika rất vui, và đồng thời cũng vô cùng đồng tình!」"
2412 = "「Anh Soutetsu, anh định nói chuyện gì với thư ký Jiang vậy?」"
2413 = "「Được thầy Soutetsu nghĩ đó là một cái tên đẹp đẽ và phong phú,\\nSuika thực sự rất vui!」"
2414 = "「Anh Soutetsu?」"
2415 = "「Mỗi lần như vậy đấy ạ. Ngài Soutetsu.\\nTrong khoảnh khắc, cộng cảm sẽ bị ngắt kết nối.」"
2419 = "「Gấp 1.5 lần, Suika đánh giá đó là một tính toán đúng ở một mức độ nào đó.」"
2421 = "「Gấp 1.5 lần thì hơi quá, nhưng chắc chắn là cũng gần bằng mức đó.\\nĐứa bé này, có lẽ chiều dài tổng thể vào khoảng 22m.」"
2422 = "「1-D-1 là Mikado. 2-C-1 là Pacific.」"
2423 = "「1-D-1. Tức là 2-8-2.」"
2425 = "「Trời đất! Số 2000 là số hiệu của cỗ máy thử nghiệm sao——\\nA, không.」"
2426 = "「Vì chiều dài tổng thể của 8620 là khoảng 16.745m——\\nNên tính ra là vừa đúng gấp khoảng 1.3 lần nhỉ.」"
2430 = "「9700, đầu máy hơi nước dòng 9700 có hình thức 1D1——\\nNhưng các cô ấy là những \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; nhập khẩu, được đặt hàng từ Meikoku (Mỹ).」"
2433 = "「Tàu Z49. Xuất phát từ ga Beiqin Tây lúc 11:28, đến ga Thánh Đô lúc 08:39 ngày hôm sau.\\nChúng ta sẽ trải qua gần trọn một ngày cùng với họ.」"
2547 = "Tôi thở phào nhẹ nhõm, vươn thẳng lưng lên."
2549 = "Không biết từ lúc nào, Hibiki đã vòng ra ngay bên cạnh chiếc đầu máy 2101."
2553 = "Không biết từ lúc nào, bên cạnh lối ra vào của bảo tàng lịch sử,\\nđã có một chiếc xe Aircra cao cấp đen bóng đỗ sát vào."
2554 = "Không biết từ lúc nào, em ấy đã rời khỏi chúng tôi và đang nhìn chằm chằm vào một chiếc đầu máy.\\nGương mặt em ấy gần như ngửa hẳn lên trên."
2556 = "Dù có phức tạp đến đâu, tôi đã nghĩ rằng rốt cuộc,\\nđó cũng chỉ là biểu hiện của sự ghen tị hay ngưỡng mộ, nhưng——"
2567 = "Đúng là người được cô Jiang dẫn theo,\\nSuika có trình độ khá cao…… hửm?"
2576 = "Hình thái cuối cùng của đường sắt cao tốc mà ông vẽ ra,\\nlà dựa trên tiền đề cải tạo thành khổ tiêu chuẩn và điện khí hóa."
2592 = "Tôi thậm chí còn cảm nhận được Suika\\ntrân trọng Zhongguo, trân trọng Hinomoto đến nhường nào."
2594 = "Như đang làm nũng, bàn tay nhỏ bé của Hachiroku tiến lại gần."
2596 = "Khi chúng tôi tiến lại gần,\\ncũng cảm nhận được một sức ép chưa từng trải qua."
2603 = "Dù vậy, từ hai phía, Hibiki và Hachiroku\\nđang liên tục dùng cả lời nói lẫn hành động vật lý để châm chọc tôi."
2604 = "Đồng điệu đến mức đáng kinh ngạc.\\nDù không cùng huyết thống nhưng gia đình vẫn là gia đình, điều đó khiến tôi cảm thấy vui vui."
2605 = "Hơi thở và lời nói của họ thật ăn ý."
2606 = "Giọng nói và ánh mắt của hai người họ lại một lần nữa lướt qua tôi và giao nhau."
2607 = "Nghe tôi nói vậy, hai người gật đầu lia lịa.\\nChỉ riêng chiếc giường mềm mại cũng đủ làm cơ thể tôi chìm xuống."
2608 = "Ánh mắt và lời nói như thể muốn bảo \"Cuối cùng cũng xong\",\\nđược trao đổi qua lại ngay trên đầu tôi."
2611 = "Hachiroku tròn xoe mắt.\\nĐôi mắt ấy ngay lập tức dịu lại, ánh lên vẻ xót thương."
2612 = "Ngón tay Hachiroku nhẹ nhàng vuốt ve bề mặt tấm vé."
2616 = "Thông qua cộng cảm, có lẽ em ấy đã nhìn thấy bối cảnh trước cả lời nói.\\nNếu vậy, tôi sẽ thử đối chiếu câu trả lời bằng lời nói xem sao."
2618 = "Phù, một tiếng thở dài."
2620 = "Giọng nói của Hachiroku cũng rất thẳng thắn.\\nNhưng không hiểu sao, ánh mắt em ấy lại cụp xuống sàn nhà một cách buồn bã."
2622 = "Hachiroku cựa quậy người một cái.\\nChiếc giường lại khẽ rung lên, cơ thể em ấy hơi nảy lên một chút."
2624 = "Loại trừ Hachiroku. Hibiki và tôi cũng mới gặp Suika\\nchưa được bao lâu. Loại khỏi danh sách ứng cử viên cũng không sao."
2626 = "Hachiroku đã giải vây một cách vô cùng tự nhiên.\\nĐúng rồi, chúng tôi đang nói dở chuyện đó mà."
2627 = "Hachiroku mỉm cười dịu dàng,\\nnhưng ngay sau đó lại mang vẻ mặt nghiêm túc, nhìn thẳng vào tôi."
2630 = "Thứ sinh ra sự tiếc nuối không thể kìm nén của Hachiroku.\\nRa là vậy…… là sự hối hận về điều đó sao."
2631 = "Hachiroku mỉm cười.\\nMột cách hạnh phúc, vui vẻ. Với một khuôn mặt rạng rỡ thực sự."
2638 = "Kết nối những điều đó lại với nhau, tôi cũng cảm nhận được điều gì đó\\ngần giống với sự tiếc nuối mà Hachiroku vừa thoáng bộc lộ lúc nãy."
2641 = "Kể từ khi đến Zhongguo, Hachiroku\\nthỉnh thoảng lại bộc lộ sự tiếc nuối."
2642 = "Đường sắt Nam Man cũ——hay đúng hơn là Manzhouguo cũ,\\nlà một trong những nguyên nhân dẫn đến \\x%l大戦;#00ffc040;Đại chiến%l;#; giữa Hinomoto và Zhongguo."
2646 = "Theo đà suy nghĩ, tôi suýt nữa đã trực tiếp hỏi về\\nmối quan hệ giữa Suika và cô Jiang, nhưng……"
2651 = "Bữa tối Vịt quay Beiqin cũng thật tuyệt vời.\\nĐó là một nhà hàng cao cấp nghe nói từng đón tiếp cả Thủ tướng Hinomoto."
2658 = "Rằng ngay cả trong số những tuyến đường còn sống sót sau Đại bãi bỏ,\\ncũng không ít nơi phải khổ sở vì nền đất yếu."
2659 = "Ước nguyện của bản thân không thành. Dù vậy, ông ấy vẫn chân thành đối mặt\\nvới cỗ máy Dongfu 4 2000 và Railord Suika——"
2661 = "Dù đường ray có bị đứt đoạn, hay cách xa nhau đi chăng nữa.\\nChỉ cần có ý chí, thì có thể kết nối lại bao nhiêu lần cũng được."
2663 = "Ra là vậy. 『Đúng ở một mức độ nào đó』,\\nvừa giữ thể diện cho khách, lại không làm sai lệch sự thật. Quả là một cách diễn đạt vô cùng khéo léo."
2664 = "Đúng rồi.\\nTôi đã được nghe nói Master tiền nhiệm của Suika là cha của Zhihuan."
2666 = "Đây là sự trừng phạt sau khi gọi tôi lên\\nvới lý do \"Có chuyện muốn nói\" đây mà."
2675 = "Một khi đã nắm bắt được sự thật, thì việc hiểu ra vấn đề quả nhiên rất nhanh chóng.\\nCó lẽ những lời giải thích vụng về của tôi không còn cần thiết nữa."
2676 = "Với nụ cười rạng rỡ trên môi, Hibiki đưa mắt nhìn quanh một vòng rộng lớn.\\nTôi cũng bị cuốn theo——hửm? Hachiroku đâu rồi?"
2679 = "Nhưng mà, nhưng mà."
2680 = "Trái ngược với tôi đã hiểu ra vấn đề,\\nSuika đột nhiên tỏ ra một vẻ mặt khá là khó tả."
2684 = "Việc ngừng phát triển do Đại bãi bỏ có lẽ cũng đã ảnh hưởng đến quá trình lựa chọn."
2690 = "Em ấy cầm cây bút chì trước mắt như một chiếc thước đo,\\nvới vẻ mặt nghiêm túc, không vẽ mà chỉ chăm chú quan sát."
2693 = "Việc sự 『Tất cứu』 của cha Zhihuan đã đơm hoa kết trái một cách đúng đắn,\\nchính bản thân Suika và Zhihuan đã chứng minh điều đó."
2703 = "Ngay khi cô Jiang vừa bước lên xe,\\nchiếc Aircra đã tăng tốc lao vút đi."
2707 = "Từ quá khứ đến tương lai——thứ thể hiện rõ nhất ý tưởng đó,\\nchính là đoàn tàu \\x%lクハ26;#00ffc040;Kuha 26%l;#; - 000 đã được phục chế——\\x%l電車;#00ffc040;tàu điện%l;#; tốc hành đặc biệt của Niiroku."
2709 = "A, nhìn kỹ thì trên chiếc vương miện đó,\\nchẳng phải có ba chữ 『Quốc Hệ Hiệu』 đang tỏa sáng rực rỡ sao."
2713 = "A——cả Hibiki cũng vậy.\\nSự hối hận mà Hachiroku đang ôm ấp, Hibiki cũng đã thấu hiểu được."
2714 = "Giọng nói hướng về phía tôi vẫn giữ được sự bình tĩnh như mọi khi,\\nnhưng ngay trước khi cúp máy, nó chứa đựng một sự căng thẳng rõ rệt."
2717 = "Hachiroku như vừa mới nhận ra,\\ntừ từ quay đầu lại phía chúng tôi."
2719 = "Và rồi, bằng ánh mắt,\\nem ấy truyền đạt sự biết ơn đến Hachiroku."
2721 = "Niềm đam mê cháy bỏng suốt cuộc đời của kỹ sư Shiba,\\ncó lẽ cho đến tận bây giờ vẫn còn đang âm ỉ trong lòng Hachiroku."
2722 = "Việc áp dụng khổ hẹp là một thất bại. Cần phải cải tạo toàn tuyến thành khổ tiêu chuẩn khi còn có thể."
2726 = "Hình ảnh đoàn tàu kiểu mũi nhô (bonnet) mạnh mẽ mà tuyệt đẹp đang chạy,\\nđã chỉ ra cho chúng tôi một cách sống động rằng bản đồ tương lai xa hơn nữa là điều hoàn toàn có thể thực hiện được."
2740 = "Ánh mắt tôi chạm với Zhihuan và Suika. Chúng tôi gật đầu với nhau.\\nA, đúng rồi."
2742 = "Đáng kinh ngạc là kiến thức sâu rộng của Zhihuan và Suika.\\nKhông ngờ họ lại am hiểu tình hình đường sắt của các nước khác đến mức này——không——"
2750 = "Có lẽ là một vấn đề mang tính khẩn cấp."
2756 = "Tôi ngả lưng xuống chiếc giường rộng lớn.\\nHachiroku và Hibiki. Bị kẹp giữa hai người, được bao bọc trong mùi hương của họ."
2758 = "Giả vờ như đang tóm tắt lại câu chuyện,\\ntôi tranh thủ hỗ trợ cách phát âm mà Hachiroku không giỏi để đề phòng."
2760 = "Chi tiết đến mức đó thì tôi cũng không biết.\\nKhông chỉ Hibiki, mà cả Suika và Zhihuan cũng đang chăm chú lắng nghe."
2761 = "Tôi lấy vé ra."
2763 = "Sự thấu hiểu ngay lập tức chuyển hóa thành lời nói, tuôn trào ra.\\nBởi vì tôi cũng luôn mang trong mình một sự hối hận vô cùng tương đồng."
2765 = "Tôi ở tầng một với giường đơn.\\nCòn tầng hai là giường đôi dành cho Hibiki và Hachiroku."
2766 = "Chính vì thế, lời nói của chúng tôi mới hòa quyện vào nhau.\\nBằng giọng nói của chính mình, chúng tôi muốn truyền đạt rằng sự hối hận đó có thể được thăng hoa."
2768 = "Những tiếng quát mắng sắc bén vang lên đồng thời từ cả hai phía.\\nNhưng mà…… tôi vẫn chưa nắm bắt được vấn đề."
2771 = "Nếu vậy thì tôi cũng không nên trả lời một cách qua loa.\\nTôi nhắm mắt lại, cẩn thận nhớ lại………… hừm."
2789 = "Không hiểu sao, Hibiki lại tỏ vẻ thán phục.\\nNhư thể muốn nói 『Ra là còn có cách đó』 vậy."
2791 = "Hibiki gật gù, ngước nhìn chiếc 2101——\\nQuốc Hệ hiệu một lần nữa, và lần này em ấy bắt đầu phác họa cẩn thận."
2794 = "Trước cái gật đầu mạnh mẽ của Hibiki, Hachiroku thở hắt ra như thể nhẹ nhõm.\\nVà rồi một lần nữa, Hachiroku lại nhẹ nhàng giải thích cho tôi hiểu."
2798 = "Cây bút của Hibiki đưa thoăn thoắt."
2799 = "Giọng của Hibiki rất nghiêm túc."
2800 = "Tầm nhìn của Hibiki dường như đã soi sáng điểm mù của Hachiroku.\\nĐôi má của Hachiroku nhanh chóng ửng hồng đầy vui sướng."
2801 = "Hibiki thoáng chốc giật mình cứng đờ người,\\nnhưng tôi…… ừm, hoàn toàn bình tĩnh."
2803 = "Hibiki làm vẻ mặt như thể nhận ra mình lỡ lời,\\nvội dùng hai tay che kín miệng——"
2811 = "Dù tôi đã bắt đầu cảm thấy mình đã trưởng thành,\\nvà cũng đã phần nào hiểu được tâm lý con người, nhưng——"
2813 = "Đúng là vì đang phác họa,\\nnên câu trả lời không chút do dự của Hibiki hoàn toàn chính xác."
2814 = "Quả không hổ danh Suika là giáo viên tiếng Hinomoto của Zhihuan——\\nA, không phải."
2817 = "Hibiki vui sướng chìa tay ra nói \"Yeah\",\\nHachiroku cũng nói \"Yeah\" rồi đưa tay ra, đập tay một cái chát!"
2824 = "Trong quá trình đi khảo sát khắp các nơi ở Kyushuu để chuẩn bị cho chuyến chạy của Nine Stars,\\nHibiki và tôi đã buộc phải hiểu ra điều đó."
2826 = "Và điều đó lại vô tình làm cho chuyển động đặc trưng của bím tóc kia\\ncàng trở nên nổi bật hơn…… Ra là vậy, cũng có lý."
2832 = "Nếu có thể hiểu được, thì có thể chấp nhận và tự kiểm điểm.\\nDù đối phương có là Railord và Master của cô ấy đi chăng nữa..."
2835 = "Kết quả sinh ra từ đó quả thực……\\ncó thể nói là một cơ duyên kỳ lạ mang chút mỉa mai."
2841 = "Tôi chợt nhận ra và ngậm miệng lại, Hachiroku cũng lập tức hiểu ra và mỉm cười."
2845 = "Ôi chà, có điện thoại.\\nCô Jiang đang nói gì đó bằng tiếng Zhongguo với tốc độ rất nhanh——!"
2849 = "Lời nói của Suika, và những chiếc \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; do Hinomoto sản xuất từ thời kỳ đầu\\ncủa Đường sắt Quốc gia Zhongguo đang được lưu giữ trong bảo tàng lịch sử này."
2855 = "Thứ cắt đứt sự kết nối đó, chính là \\x%l大戦;#00ffc040;Đại chiến%l;#; và Đại bãi bỏ các tuyến đường sắt.\\nThật là một điều đáng tiếc."
2858 = "Cô Jiang thì đã vắng mặt từ giữa chừng, vậy chỉ còn lại một mình Zhihuan……\\nHửm? A…… A, ra là vậy! Là vậy sao!!"
2860 = "Từ sự thành thạo tiếng Hinomoto của Suika và Zhihuan,\\ncộng thêm kiến thức sâu rộng bao quát cả lịch sử Đường sắt Hoàng gia, có thể suy ra——"
2866 = "Nếu em ấy đã vẽ lại được nụ cười hiện tại của Hachiroku,\\nthì lát nữa tôi cũng phải xin xem mới được."
2868 = "Nếu giả định rằng Suika đang mong muốn Zhihuan với tư cách là một người khác giới,\\nthì ra là vậy, mọi chuyện đã được kết nối với nhau một cách hợp lý."
2883 = "Cùng lúc với lời nói, mái tóc dài mượt mà của Suika khẽ nảy lên.\\nTôi cũng tự nhiên cảm thấy vui lây."
2886 = "Bím tóc của Suika khẽ nảy lên.\\nNhư thể đang nói rằng em ấy rất vui vì được giao phó nhiệm vụ này."
2887 = "Suika khẽ gật đầu một cái."
2889 = "Suika vui vẻ gật đầu, rồi hướng ánh mắt về phía Zhihuan.\\nĐược nhường lời, Zhihuan cũng vui vẻ gật đầu đáp lại."
2891 = "Dù sao thì, đây cũng là tấm vé mà cô Jiang, cùng với Suika và Zhihuan,\\nđã \"nắm bắt nguyện vọng của chúng ta\" để sắp xếp mà."
2896 = "Hành động để biết được cảm xúc của đối phương, nói tóm lại chính là tỏ tình.\\nVì muốn biết cảm xúc của đối phương, nên mới quyết tâm tỏ tình."
2904 = "Người lái tàu thử nghiệm——Ngay khoảnh khắc nghe thấy từ đó,\\nhình bóng của người lái tàu Akai hiện lên trong tâm trí tôi."
2909 = "Ngay khoảnh khắc tôi nói ra, ngón tay của Hibiki chợt khựng lại."
2910 = "Nói xong, cô Jiang rảo bước nhanh ra khỏi bảo tàng lịch sử——!"
2911 = "kỹ sư Shiba Kojiro."
2912 = "Đôi mắt đen láy của Suika khẽ liếc nhìn khuôn mặt Zhihuan.\\nNhưng Zhihuan dường như không nhận ra ánh mắt của Suika."
2913 = "Hai tầng……\\nQuả thực nếu chỉ gọi là gác lửng thì không gian đó quá đỗi xa hoa."
2925 = "Tôi muốn ngồi dậy, vươn thẳng lưng để lắng nghe,\\nnhưng không hiểu sao lúc này lại cảm thấy hơi e ngại."
2929 = "Hồi Michiko còn sống, và ở bên cạnh tôi——\\nTôi có thể nhớ lại những ngày tháng đó với một cảm giác thật hoài niệm."
2941 = "Chỉ riêng sự thật đó thôi, đã khiến cậu ấy vô cùng vui sướng và tự hào.\\nNụ cười chân thật của Zhihuan chói lọi đến mức chói mắt."
2942 = "Tại sao chứ.\\nNếu nói về những gì tôi đã làm……"
2943 = "Tấm vé cho ngày mai mà Zhihuan đã đưa cho tôi——\\nTấm vé mà cô Jiang đã nhờ cậu ấy giữ hộ."
2944 = "Thế này là được rồi. Hachiroku, người luôn có chút gượng gạo và bất ổn kể từ khi đến Zhongguo,\\ncuối cùng cũng đã tìm lại được trục cốt lõi của mình."
2945 = "Khao khát đó nghe có vẻ rất đương nhiên,\\nvà tôi cũng ngoan ngoãn gật đầu…… đồng ý…… hửm?"
2946 = "Tôi hiểu ngay em ấy muốn gì.\\nVì vậy, tôi nhẹ nhàng đặt tấm vé vào tay em ấy."
2947 = "Lần này, lời nói của Hibiki lại khiến Zhihuan ngạc nhiên."
2948 = "Tôi cảm nhận được một sự thuyết phục mạnh mẽ.\\nĐồng thời…… cũng có chút chán ghét bản thân."
2951 = "Đôi mắt đang mỉm cười của Suika bỗng nheo lại."
2952 = "Nói rồi, Hachiroku ngước mắt lên.\\nPhía trước ánh mắt đó là 2101——Quốc Hệ hiệu, tất nhiên, nó không đưa ra bất kỳ câu trả lời nào."
2954 = "Đó là một công việc đòi hỏi kiến thức uyên bác và sự cần mẫn đến nhường nào,\\nngười lái tàu Akai đã thể hiện điều đó một cách vô cùng rõ nét."
2955 = "Nếu vậy thì chắc chắn, tôi đã mắc phải một sai lầm nào đó,\\nhoặc là đã bỏ sót điều gì đó rồi."
2957 = "Màu sắc ánh lên trong đôi mắt ấy,\\nkhông khác gì ánh mắt của Hachiroku khi hoài niệm về quá khứ."
2961 = "Tôi muốn phản bác, nhưng Hachiroku và Hibiki.\\nĐúng là hai người nhà lại đang đồng lòng đến thế này."
2962 = "Mặc dù đang ở trên giường của một nhà trọ nơi đất khách quê người,\\nnhưng bốn chữ \"Gia đình đoàn tụ\"——lại tự nhiên hiện lên trong tâm trí tôi."
2964 = "Phía trước ánh mắt đó là tấm biển số 2101——\\nQuả thực là một chiếc đầu máy hơi nước rất lớn."
2967 = "Hương vị tất nhiên là vô cùng tuyệt hảo——hơn nữa cách trình bày món ăn,\\ncũng nghệ thuật đến mức khiến Hibiki không thể ngừng phác họa."
2976 = "(Giờ đây không thể cải tạo toàn bộ đường sắt khổ hẹp của Hinomoto thành khổ tiêu chuẩn được nữa.\\nVì vậy, ý tưởng Đường sắt Tân Tuyến của chúng tôi đã giả định sử dụng đường sắt trên cao chuyên dụng)"
2977 = "(Hoặc có thể là một mối quan hệ phức tạp nào đó.\\nÍt nhất thì cũng nên hỏi lúc không có mặt Zhihuan chăng.)"
2981 = "(Cô Jiang và Suika có mối quan hệ như thế nào nhỉ?\\nMaster của em ấy là Zhihuan mà……)"

[selections]
