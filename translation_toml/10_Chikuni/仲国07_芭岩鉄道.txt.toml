1379 = "「A! Đầu máy đang lùi lại kìa! Đây là dịch vụ cho phép chụp ảnh ở khúc cua này á.」"
1380 = "「A! Đúng á! Chính là nó! Ưm―― Cảnh sắc ở đây, mang lại cảm giác như \"quê hương của Trung Quốc\" á.」"
