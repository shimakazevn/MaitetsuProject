[script]
876 = "Thật vô tình. Thiếu liên lạc quá đấy. Nếu có thể nói chuyện qua mạng, thì đáng lẽ từ trước đến giờ anh cũng nên làm thế chứ không chỉ gửi mỗi email——"
879 = "……Sau khi xuống toa hành khách và được hướng dẫn, trước mắt chúng tôi là một nơi giống như đài quan sát."
885 = "……Cô Jiang đã bù đắp sự thiếu hiểu biết của tôi một cách rất tự nhiên."
889 = "……Tôi cảm thấy giờ mình đã hiểu phần nào ý nghĩa câu nói \"tôi cũng có tìm hiểu về Đường sắt Trung Quốc\" của Paulette."
891 = "……Lời đề nghị ăn xe đẩy bán dạo đột ngột khiến tôi hơi bất ngờ, nhưng nhắc mới nhớ, quả thực tôi cũng đang hơi đói."
910 = "「Khi \\x%l大戦;#00ffc040;Đại chiến%l;#; kết thúc, công cuộc tái thiết bắt đầu, đất nước trở nên giàu có. Và cuối cùng, máy giặt cũng được đưa vào khu đầu máy――」"
913 = "「――Nhìn chằm chằm luôn kìa. Không phải là đang dán mắt vào điện thoại sao.」"
914 = "「――Đúng là vậy thật!」"
924 = "「……」"
945 = "「……Không. Quả nhiên đúng như Hachiroku nói. Theo mọi nghĩa, sự xa xỉ đến mức này, chúng ta không thể làm được.」"
947 = "「……Thầy Soutetsu và mọi người, có ngại đồ ăn ở các xe đẩy bán dạo không ạ?」"
949 = "「……Thế hệ chúng tôi thì chắc là không biết đâu.」"
952 = "「……Đúng là Trung Quốc á.」"
955 = "「……Nếu mượn lời của Suika thì là âm thanh phong cảnh. Tôi nhớ có một sự xôn xao nào đó rất giống thế này.」"
958 = "「……Ra là vậy.」"
963 = "「……Ồ.」"
965 = "「……Chỉ có thể làm được vì dưới đáy thung lũng là khe suối không người thôi.」"
967 = "「……Thời kỳ mà Hinomoto và Teitetsu tràn đầy sức sống. Là sự xôn xao tràn ngập các nhà ga trong thời kỳ kinh tế phát triển cao độ.」"
969 = "「……Nghe nói ở ga này, những người đi toa hành khách du lịch như chúng ta sẽ xuống xe một lát.」"
970 = "「……Cô ấy bảo lên buồng lái được ạ. Nghe nói bọn vịt cứ tự tiện chui vào từ cửa sổ.」"
973 = "「……Có vẻ như họ đang chia sẻ thông tin qua nhóm chat của một ứng dụng tên là OurChat.」"
974 = "「……Nghe nói họ đã xả bỏ nước trong lò hơi.」"
977 = "「……Xả một lượng lớn nước cùng với rác trong lò hơi ra ngoài, vừa làm dịch vụ cho du khách xem vừa dọn dẹp lò hơi ở một mức độ nào đó.」"
979 = "「……Thật đáng tiếc, không có khung cảnh nào giống thế này trong bất kỳ ký ức nào của tôi cả. Nhưng mà――」"
981 = "「……Cho đầu máy chạy ngược hướng với cơ thể―― Nghĩa là phải vặn người để thao tác lái phải không ạ? Có vẻ khó nhỉ.」"
986 = "「……Nghe nói đầu máy sẽ tiến vào khúc cua này một lần nữa. Họ bảo 『chuẩn bị bắt đầu quay video đi là vừa』.」"
987 = "「……Họ đang tháo đầu máy chạy lùi ra và lắp lại kìa. Có phải là sẽ quay đầu ở đây không ạ.」"
991 = "「……Nghe nói đó là gia súc cần thiết để canh tác và duy trì ruộng lúa. Ở vùng núi này, có vẻ khó đưa máy cày v.v... vào sử dụng.」"
993 = "「……Nghe nói con trâu nước này là tội phạm quen mặt rồi. Nó thích liếm đường ray sau khi đầu máy hơi nước chạy qua.」"
997 = "「……Mỗi ngày có ba chuyến tàu chở hàng, và hai chuyến tàu thường. Tàu thường ghép cùng toa hành khách du lịch thì mỗi buổi sáng chiều có hai chuyến.」"
1002 = "「……Nhân tiện thì vừa rồi, họ đã trao đổi thông tin gì vậy?」"
1207 = "「Đạp cả phanh tay, nghĩa là đỗ tàu lâu sao?」"
1208 = "「À không, tôi nghĩ chỉ là do chúng tôi thiếu hiểu biết thôi. Nhưng mà, phải nói sao nhỉ, khung cảnh này……」"
1211 = "「Không chỉ những đô thị lớn như Bắc Cầm hay Thánh đô, mà những thành phố địa phương thế này, những năm gần đây cũng đạt được sự phát triển kinh tế đáng kinh ngạc.」"
1213 = "「Không vấn đề gì đâu. Đó là xe của bên liên quan với chúng tôi mà.」"
1215 = "「Phong cảnh đường sắt đã mất ở Hinomoto―― Toàn bộ thời kỳ của Teitetsu cũ. Hoặc thậm chí là viễn cảnh tương lai chưa từng được vẽ ra.」"
1217 = "「Không phải là thay thế, mà chỉ là đổi sang đèn LED sáng và tiện lợi hơn thôi. Cô ấy đang thắc mắc tại sao lại nghĩ đó là đồ thay thế.」"
1219 = "「Thanh toán bằng mã QR. Dùng ứng dụng chụp lại mã QR dán ở kia, nhập số tiền và mật khẩu là thanh toán xong.」"
1228 = "「%f思源宋体B;[Toa　hành　khách　kéo　hôm　nay,7]今天挂的这节车厢、[Cùng　với　hành　khách　con　người,6]不光能供人乘坐、 %f思源宋体B;[Cũng　là　toa　chở　cả　gia　súc　gia　cầm　như　chim,　lợn,　dê,15]同时还能搭运鸡鸭猪羊这些家禽家畜%f;」"
1229 = "「Nghe nói toa hành khách hôm nay là \\x%l合造車;#00ffc040;toa xe hỗn hợp%l;#; giữa toa chở gia súc và toa hành khách. Chắc là họ nhốt gia súc vào lồng để vận chuyển nhỉ.」"
1237 = "「Tối nay, hãy triệu tập một cuộc họp giúp tôi. Chỉ cần những thành viên có thể tập trung là được. Nhưng hãy cố gắng mời đền chủ Akai và Niiroku tham dự.」"
1239 = "「Thanh toán xong rồi? Nghĩa là――」"
1245 = "「%f思源宋体B;[Thay　thế　là　sao,7]代用是什么意思呢？　[Đèn　pha　thì　chỉ　là　thay　mới　thôi.　Bằng　loại　sáng　hơn　và　tiện　lợi　hơn,14]我们就是把头灯换成方便又明亮的 %f思源宋体B;[Là　LED　đó,4]ＬＥＤ灯啊。[Vì　như　vậy　tiện　lợi　hơn　mà,7]这样不是更方便嘛%f;」"
1247 = "「Có lẽ đây là cảnh tượng chỉ có ở đầu máy hơi nước thùng nước loại nhỏ thôi nhỉ! Chạy lùi lên dốc với tốc độ cỡ này cơ mà.」"
1253 = "「Có vẻ như có con trâu nước đã đến rất gần đường ray. Vì nguy hiểm nên họ muốn liên lạc với chủ để đuổi nó đi.」"
1255 = "「Nhưng ở Trọng Quốc, lịch sử và hiện tại là một chuỗi liên tục. Lịch sử không dùng sức nặng của nó để trói buộc hiện tại.」"
1257 = "「Nhưng……vận hành nhiều như vậy, thì việc bảo dưỡng, duy trì không gặp vấn đề gì sao?」"
1258 = "「Đúng vậy. Cuối cùng cũng đến đó. Những đầu máy hơi nước của thị trấn khai thác mỏ ――những đầu máy của Đường sắt Ba Nham, đang chờ đón chúng ta!」"
1262 = "「Bởi vì, đây là \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; vô cùng quý giá mà? Nếu không bảo tồn nguyên bản, thì giá trị văn hóa sẽ bị tổn hại mất.」"
1265 = "「Em không hiểu sao, Hibiki. Ở thị trấn này――không, trên toàn đất nước Trung Quốc, mọi việc thanh toán đều diễn ra trong chớp mắt.」"
1266 = "「Có lẽ, ở quốc gia này hiện tại và quá khứ có giá trị ngang nhau. Lịch sử sẽ không trói buộc việc xem xét cách tận dụng chúng.」"
1271 = "「Cảnh sắc ở Kiện Vi là một trong những khung cảnh địa phương điển hình của Trung Quốc. Ra là vậy. Hình ảnh Trung Quốc trong mắt người Hinomoto là như thế này sao.」"
1272 = "「Chính vì vậy, lái nó chắc sẽ rất thú vị đây.」"
1280 = "「Hachiroku thì sao? Đâu đó trong ký ức 100 năm của em, có phong cảnh nào giống thế này không?」"
1283 = "「Hơn nữa chắc chắn, những thứ vốn dĩ không có ở Hinomoto, cũng có rất nhiều phải không ạ.」"
1286 = "「Nói đúng hơn, Nine Stars không phải là đại diện cho điều đó sao.」"
1294 = "「Vừa rồi là――ồ―― Có lẽ là chuyện không xảy ra ở Hinomoto đâu ạ.」"
1295 = "「Hồi nãy em có nhìn lén một chút―― Toa hành khách thường á, sao ở góc lại có cái lồng vậy?」"
1296 = "「Con lúc nãy á!? Oa, còn nữa kìa! Gọi là tới luôn hả!? Quen hơi ghê ha.」"
1299 = "「Ra là vậy……đúng là tuyến đường sinh hoạt. Có khoảng bao nhiêu toa xe thuộc tuyến này vậy?」"
1302 = "「Nguyên sơ……Một từ tiếng Hinomoto hơi khó―― Hiểu theo nghĩa 『Cảnh sắc quê hương』 có đúng không ạ?」"
1305 = "「Tôi đã sắp xếp xe đến Tứ Tỉnh rồi. Mọi người vừa di chuyển vừa dùng bữa có được không ạ?」"
1308 = "「Lúc đi là chạy lùi phải không ạ! Thú vị thật! Khung cảnh tuyệt vời làm sao.」"
1324 = "「Ngược lại cũng vậy đấy, Hachiroku.」"
1325 = "「Chạy lùi, là từ tiếng Hinomoto lần đầu tiên tôi nghe thấy.」"
1329 = "「Nhưng mà, tại sao con trâu nước đó, lại đến gần đường ray có đoàn tàu đang chạy ầm ầm vậy?」"
1331 = "「Mọi người đã nhập cảnh vào Trung Quốc từ lúc ở sân bay Bắc Cầm rồi mà.」"
1332 = "「Á!? Ơ!?」"
