1390 = "「A, kiểu như phiên bản Trung Quốc của DINE á?\\nRa vậy ra vậy, nếu là cái này thì.」"
1392 = "「À. Tôi đã bỏ sót.\\nỞ chỗ như vậy, lại có lắp phanh tay nhỉ.」"
1395 = "「À, ở Hinomoto ngày xưa cũng dùng trâu ngựa thay cho nông cụ\\n……À không, ở vùng núi, có lẽ bây giờ vẫn làm vậy.」"
