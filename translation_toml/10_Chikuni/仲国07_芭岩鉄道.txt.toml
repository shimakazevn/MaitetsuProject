1356 = "「Hửm?」"
1357 = "「A――」"
1359 = "「A, nhắc mới nhớ, hình như lúc cô Jiang mua vé ở ga Bắc Cầm cũng thanh toán bằng điện thoại á.」"
1361 = "「A, có khi là vậy á! Nếu tìm kiếm khắp Trung Quốc, thì sẽ thấy phong cảnh đường sắt của Trung Quốc, mỗi nơi một chút!」"
1362 = "「A……」"
