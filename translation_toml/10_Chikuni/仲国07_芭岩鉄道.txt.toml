1387 = "「A, ừm. Đã thay bằng đèn LED á.」"
1389 = "「A, đúng là ở Ohimitera thì không thể á. Nước lò hơi xả thẳng xuống sông Kuma mà không qua xử lý gì cả, chưa kể là rất nguy hiểm nữa.」"
1390 = "「A, kiểu như phiên bản Trung Quốc của DINE á? Ra vậy ra vậy, nếu là cái này thì.」"
1392 = "「À. Tôi đã bỏ sót. Ở chỗ như vậy, lại có lắp phanh tay nhỉ.」"
1395 = "「À, ở Hinomoto ngày xưa cũng dùng trâu ngựa thay cho nông cụ ……À không, ở vùng núi, có lẽ bây giờ vẫn làm vậy.」"
1398 = "「À, máy giặt sao. Ừm. Giống nhau đấy. Đó cũng chắc chắn là một sự phát triển kinh tế mang tính bước ngoặt.」"
1399 = "「Đó, anh hai. Nhờ anh quay video nhé.」"
1401 = "「A, xin lỗi cô. Cảm ơn cô ạ.」"
1402 = "「%f思源宋体B;[Tất　nhiên　là　có　rồi,5]问题当然有啊、[Chính　vì　thế　nên　mới　có　nhiều　chị　em　chứ,14]我们那么多姐妹就是为此而存在的、 %f思源宋体B;[Nhưng　thực　sự　gặp　rắc　rối　thì　không　nhiều　đâu,14]至于真造成影响的情况那就很少了%f;」"
1404 = "「A, Paulette à. Xin lỗi, tôi đây. Ngại quá vì chuyện hơi đường đột, nhưng mà——」"
1407 = "「Ừm. Van tiết lưu hơi, van phanh, tay cầm cần đảo chiều v.v... tất nhiên, được bố trí giả định cho việc di chuyển về phía lò hơi nên――」"
1409 = "「Ừm.」"
1410 = "「Hửm? À――」"
1411 = "「???」"
1416 = "「Cần đảo chiều, van tiết lưu hơi, van hãm tự động và……cấp nước là cái van này sao? Ừm. Cái này……đúng là mang lại cảm giác nguyên bản của \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; nhỉ.」"
1421 = "「Khi đất nước và đường sắt thay đổi, thì sự cố và phương tiện liên lạc, cũng thay đổi theo nhiều cách khác nhau nhỉ.」"
1423 = "「Em nghĩ ở Đường sắt Quốc gia Trung Quốc cũng hiếm có trường hợp này. Suika cũng khá ngạc nhiên ạ.」"
1425 = "「Hành khách ở toa hành khách thường phía sau toa du lịch của chúng ta, cũng đã xuống hết ở đây rồi――chắc không sai đâu.」"
1429 = "「Cô ấy hỏi là, ở Hinomoto lịch sử và hiện tại không tiếp nối nhau sao? Phương tiện có giá trị lịch sử thì không thể tiếp tục hoạt động được nữa sao?」"
1430 = "「Cô ấy hỏi là, hành khách ở Hinomoto dù có từ chối việc đổi quạt điện sang máy lạnh thì vẫn tôn trọng giá trị văn hóa sao?」"
1431 = "「Cô ấy hỏi buồng lái này so với buồng lái của đầu máy hơi nước Hinomoto, thì có cũ hơn không.」"
1435 = "「Nghe nói chỉ mặc thêm áo và quần chống nước bên ngoài thôi. Vì vậy, vào những ngày mưa to thì sẽ ướt sũng.」"
1437 = "「Có vẻ vậy.」"
1439 = "「Tôi hiểu rồi. Vậy để tôi gọi đủ cho mọi người nhé. Tất nhiên là Hachiroku và Suika sẽ có phần riêng.」"
1440 = "「Đã rõ.」"
1441 = "「Tôi hiểu rồi. Cảm ơn cô.」"
1443 = "「%f思源宋体B;Nếu thay quạt điện vốn có trong toa hành khách bằng máy lạnh, %f思源宋体B;hành khách đi tàu ở Hinomoto chẳng lẽ lại không vui sao?%f;」"
1447 = "「%f思源宋体B;[Tạm　thời　thì　cũng　mặc　áo　mưa,6]雨衣还是会穿的、[Nhưng　chẳng　có　tác　dụng　mấy,6]不过也没什么用。 %f思源宋体B;[Vì　vậy,1]所以[Nếu　mưa　to,4]碰上下大雨、[Thì　chỉ　còn　cách　ướt　sũng　mà　lái　thôi,12]那就只能浑身湿漉漉地驾驶咯%f;」"
1449 = "「Cô Jiang vừa nhắc đến Tứ Tỉnh―― có liên quan gì đến tập đoàn tài phiệt Tứ Tỉnh cũ của Hinomoto không?」"
1456 = "「Cô Jiang đã thanh toán xong rồi. Bây giờ đậu phụ chiên sẽ được làm.」"
1457 = "「Cô Jiang đang gọi món. Món cô ấy gọi là đậu phụ chiên.」"
1458 = "「Nếu tội phạm quen mặt cứ lảng vảng ở đó, có thể dẫn đến tai nạn hoặc chậm trễ. Việc sắp xếp để đuổi nó đi, quả là một biện pháp đảm bảo an toàn rất thỏa đáng.」"
1462 = "「%f思源宋体B;[Rất　hiếm　khi　ngừng　chạy　hoàn　toàn,8]完全停运的情况很少。[Tuy　có　giảm　chuyến,7]缩减班次倒是会有。 %f思源宋体B;[Vì　người　dân　địa　phương　không　có　phương　tiện　giao　thông　nào　khác,14]毕竟当地人没什么别的出行途径了%f;」"
1463 = "「Hoàn toàn không liên quan đâu. Tứ Tỉnh đơn giản là bốn cái giếng thẳng đứng―― nghe nói tên gọi đó xuất phát từ việc có những đường hầm sâu như giếng.」"
1467 = "「Đúng là cái không lẽ nào đó đấy ạ. Ngài Soutetsu.」"
1475 = "「Cầu vồng!!!!」"
1476 = "「Zhihuan!」"
1478 = "「Có chuyện gì vậy ạ? Thầy Soutetsu.」"
1482 = "「Chà, số lượng chuyến cũng khá nhiều đấy. Đúng là tuyến đường sinh hoạt―― Đường sắt đang trở thành trụ cột của chính cuộc sống nơi đây nhỉ.」"
1484 = "「Chắc chắn, chính vì đó là điều chúng ta không thể làm được, nên nó mới trông hấp dẫn đến vậy nhỉ.」"
1485 = "「Tôi cũng không ngại đâu――À, cái món giống đậu phụ chiên ở đằng kia, trông ngon thật đấy.」"
1486 = "「Tôi cũng không để ý. Vì mải nhìn đầu máy quá――」"
1490 = "「Em! Em cũng muốn xem! Khoan, a――anh hai, chắc vẫn còn đủ chỗ cho một người nữa á.」"
1492 = "「Bọn em sẽ cẩn thận để không làm rơi……nhưng ngược lại, nếu lỡ làm rơi trong xe thì có sao không ạ.」"
1494 = "「Chính khung cảnh thế này――cho đến khi đáp xuống sân bay Bắc Cầm, tôi đã luôn mường tượng trong đầu.」"
1495 = "「Tôi! Nói chuyện! Với Railord của đầu máy hơi nước này, tôi nhất định muốn nói chuyện thử xem sao!!」"
1498 = "「Em hiểu rồi á! Tiết kiệm được công sức, cũng giống như có thêm thời gian rảnh rỗi――đó cũng là, phát triển kinh tế.」"
1499 = "「Em nghĩ là…… em hiểu rồi ạ.」"
1501 = "「Có lẽ vậy. Tất nhiên, phong cảnh nhìn từ cửa sổ tàu này, ở Hinomoto khó mà thấy được nhưng――」"
1502 = "「Có lẽ không khác biệt nhiều như ấn tượng ban đầu nhỉ. Đường sắt của hai nước, Hinomoto và Trung Quốc.」"
1508 = "「%f思源宋体B;[Xin　lỗi　xin　lỗi,3]抱歉抱歉。[Tụi　nó　cứ　tự　tiện　chui　vào　từ　cửa　sổ　đấy,14]它们从车窗跑进来也是常有的事了。 [Nào　nào,3]好啦好啦、[Ra　đi　ra　đi,3]快出去啦。[Ừm]嗯！　[Được　rồi,1]好了、[Mời　vào,1]您请%f;」"
1515 = "「Khi đó, hồ sơ thanh toán sẽ được gửi đến người nhận……trong trường hợp này là bà cô bán hàng, vậy là xong việc tính tiền.」"
1516 = "「Nghe nói họ sẽ cho xem cảnh đáng xem nhất của Đường sắt Ba Nham. Cô hướng dẫn viên khuyên nên quay video.」"
1520 = "「%f思源宋体B;Giá trị văn hóa? Cái đó…… %f思源宋体B;Để tôi nghĩ xem. Ví dụ nhé——%f;」"
1523 = "「Nếu vậy——nếu vậy thưa ngài Soutetsu. Nine Stars phiên bản Trọng Quốc sẽ là」"
1540 = "「Hibiki, cho anh mượn máy tính bảng nhé.」"
1542 = "「Ở khu đầu máy ngày xưa ấy, Hibiki. Toàn bộ Dịch vụ trang màu đều được giặt bằng tay, với bàn giặt và xà phòng cục đó.」"
1545 = "「Ở Hinomoto cũng có cảnh sắc gần giống thế này sao ạ? Hay là đã từng có?」"
1546 = "「Ở Hinomoto không có hả? Việc động vật liếm đường ray á.」"
1548 = "「Vâng――A! Không! Tôi từng nghe tin đồn. Rằng hươu đến liếm đường ray, và vì thế mà xảy ra tai nạn.」"
1550 = "「Đúng vậy. Việc phía sau là kiểu thùng nước ngắn, và lại nhỏ gọn, có thể nói là điều kiện thuận lợi cho việc chạy lùi.」"
1552 = "「Đúng vậy. Đây là――một chiếc đầu máy khiến người ta muốn lái thử.」"
1555 = "「Đúng là xa xỉ thật. Không ngờ cầu vồng―― lại do chính \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; mình vừa đi tạo ra.」"
1558 = "「Vâng. Lúc đó tôi cứ tưởng đó là chuyện đùa ……nên đến tận bây giờ, tôi đã hoàn toàn quên mất.」"
1559 = "「Đúng vậy. Mật ong vùng này là đặc sản, nghe nói đặc biệt phát triển ở gần ga 『Ga Đá Mật Ong』.」"
1562 = "「Đúng vậy. Sau đó rưới thêm giấm đen và đường đen lên trên. Ở Tứ Xuyên, đây là món ăn nhẹ khá được ưa chuộng.」"
1564 = "「Vâng. Thực tế là rất khó. Với những đầu máy có toa tiếp than nước như 8620, hầu như không thể thấy việc chạy lùi với tốc độ cỡ này.」"
1565 = "「Điện thoại sao!? Trong lúc làm nhiệm vụ thì không thể nào. Nếu là Đường sắt Quốc gia Trung Quốc thì đó là vi phạm nội quy. Sẽ bị đình chỉ công tác ngay lập tức.」"
1569 = "「%f思源宋体B;Phương tiện có giá trị lịch sử thì không thể tiếp tục phục vụ được nữa sao? %f思源宋体B;Quá khứ và hiện tại của Hinomoto chẳng lẽ không có sự gắn kết sao?%f;」"
1570 = "「Tương lai, có lẽ cũng sẽ được đối xử bình đẳng như vậy. Không hề có sự phân biệt nào với hiện tại và quá khứ.」"
1577 = "「Quả nhiên là nghe rất giống nhau. Giọng nói của con người……như thể đang tiến về phía trước vậy.」"
1580 = "「Tùy thuộc vào tình trạng bảo dưỡng, có khoảng 5~6 đầu máy đang hoạt động. Tất cả đều là đầu máy hơi nước, và là đầu máy chị em của Số 19.」"
1584 = "「Vì vậy, chắc chắn quốc gia này——」"
1590 = "「Trâu nước là tội phạm quen mặt!!」"
1592 = "「Trâu nước!!!? Em, bỏ lỡ mất rồi!!」"
1594 = "「Không thể……sao.」"
1595 = "「Đúng vậy.」"
1596 = "「Đúng á! Đúng y chang tưởng tượng luôn! Nào là taxi ba bánh! Nào là xe đẩy bán đồ ăn! Nào là xe máy chở đầy nhóc đồ!」"
1597 = "「Đúng vậy. Đúng vậy.」"
1598 = "「%f思源宋体B;[Không　sao　đâu,3]没关系啊。[Chỉ　là　buồng　lái　hơi　chật　chội　một　chút　thôi,13]这驾驶台上也没多少地方就是了——[A]啊%f;」"
1612 = "「Đậu phụ chiên. Hừm. Quả nhiên là họ hàng với đậu phụ chiên giòn――hửm?」"
1613 = "「Toa tiếp than nước…… A! Vì đơn giản là tầm nhìn sẽ bị cản trở bởi nó sao?」"
1616 = "「Tuyến đường sinh hoạt……Quả thực, hành khách ở toa hành khách thường đông hơn hẳn toa hành khách du lịch chỉ có chúng ta nhỉ.」"
1623 = "「Vì đây cũng là tuyến đường sinh hoạt, nên dù có giảm chuyến thì hầu như không bao giờ ngừng chạy hoàn toàn. Vì không có phương tiện giao thông thay thế.」"
1624 = "「Rắc rối thì tất nhiên là có, nhưng không đến mức thành vấn đề nghiêm trọng. Vì số lượng \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; đang vận hành cũng nhiều.」"
1629 = "「Đúng vậy nhỉ……Xa xỉ, và hùng vĩ.」"
1630 = "「Đúng vậy. Có thể sẽ dội nước sôi lên đầu những người đang thưởng thức chuyến đi thuyền trên sông Kuma mất.」"
1631 = "「Đúng vậy nhỉ. Dù là lần đầu tiên đến, lần đầu tiên nhìn thấy khung cảnh này――nhưng không hiểu sao lại cảm thấy hoài niệm.」"
1633 = "「Thật sự là một khung cảnh tuyệt vời. Đây quả là một sự xa xỉ lớn.」"
1635 = "「Thật á――khoan đã, chỗ ngồi nào cũng có ổ cắm điện luôn á? Khoan đã! Trên tường! Có ghi FREE wifi kìa!!」"
1642 = "「Đúng là chúng tôi…… văn hóa của chúng tôi có mặt như vậy. Cũng có phần trân trọng lịch sử bằng cách đặt nó vào tủ kính.」"
1643 = "「Chẳng lẽ, không lẽ nào.」"
1649 = "「Trời, vậy sao.」"
1651 = "「Phát triển kinh tế――」"
1653 = "「Nhóm chat?」"
1655 = "「Sau khi xác nhận số tiền thanh toán được hiển thị, tự mình chuyển tiền. Lại còn có mật khẩu nữa, nên an toàn hơn tiền mặt.」"
1656 = "「Nói là cũ thì……sự đơn giản mới là điểm nổi bật. Thật ngạc nhiên khi không có lấy một cái đồng hồ đo nào.」"
1662 = "「Nếu chia đầu máy hơi nước thành phía lò hơi và phía buồng lái, thì việc chạy với phía buồng lái hướng về phía trước, gọi là chạy lùi.」"
1668 = "「Muốn ăn thử á!!! Trông ngon quá chừng, mà em cũng chưa thấy bao giờ nữa!」"
1670 = "「Nếu ở Hinomoto, nó giống như dòng sông chảy và những ngọn núi xanh…… Tôi cảm nhận được điều gì đó mang tính nguyên sơ như vậy.」"
1673 = "「Cho chị hỏi……cậu Zhihuan? Ở đường sắt Trung Quốc, Railord bấm điện thoại――có thường thấy không á?」"
1674 = "「Đúng vậy nhỉ. Bình thường thì sẽ sợ hãi mà bỏ chạy mới phải……」"
1675 = "「Không phải ý đó đâu, Suika.」"
1676 = "「Dạ……」"
1681 = "「Không chỉ ở xe đẩy bán dạo, mà ở đâu cũng có thể làm được. Thời buổi này, Suika nghĩ số cửa hàng không làm được thế này mới là số ít.」"
1682 = "「Giếng thẳng đứng sao!? Nghĩa là―― Cuối cùng cũng đến đó!」"
1708 = "「Cái đó…… Nhìn chung thì máy lạnh vẫn được ưa chuộng hơn ạ. Nhưng mà, giữa một phương tiện có giá trị lịch sử và một toa hành khách bình thường thì……」"
1709 = "「Gì đây! Dễ thương quá! Thú vị ghê á!!」"
1710 = "「%f思源宋体B;[Cái　đó　hả,2]这个嘛――%f;」"
1711 = "「Không, ở các cửa hàng dạng chuỗi thì quả thực không hiếm―― Nhưng ở những nơi như quán ăn do cá nhân kinh doanh thế này thì――!!」"
1712 = "「Thật là……đẹp quá…… Thật rực rỡ, thật hào hùng làm sao.」"
1713 = "「Chuyện đó ở Hinomoto không phải là rất bình thường sao ạ?」"
1714 = "「Cái đầu máy này, cửa sổ hay chỗ nào cũng không có kính nhỉ…… Vậy mấy ngày mưa thì làm sao á?」"
1715 = "「Cả con người và Railord đều có thể chia sẻ thông tin theo thời gian thực nhỉ. Nói là hợp lý thì quả thực là hợp lý, nhưng……」"
1716 = "「Vậy sao. Đó là đèn LED à. Thảo nào tôi thấy kích thước khác hẳn với cái vỏ bọc.」"
1717 = "「Vậy sao. Thế thì tôi không khách sáo nhé――Ồ.」"
1718 = "「Như vậy thì với những người có sở thích đó có thể là tốt, nhưng…… với những người muốn sử dụng bình thường thì chỉ tổ phiền phức thôi nhỉ.」"
1719 = "「Đúng là có thể nói như vậy. Nhưng dù vậy đi nữa. Một pha lái tuyệt vời đến mức này, không chút do dự thì quả là hiếm thấy――!?」"
1720 = "「Chà, thật ngại quá ạ.」"
1721 = "「Điều ngược lại cũng là sự thật. Ở Hinomoto, có rất nhiều thứ mà đường sắt Trung Quốc không có.」"
1722 = "「Quả thật……quả thật là Trung Quốc nhỉ.」"
1723 = "「Quả thực……đây là một sự phát triển kinh tế tuyệt vời.」"
1724 = "「Khu vực này là vùng nông nghiệp sao?」"
1725 = "「Nhu cầu khá cao nhỉ. Dân số đông đến mức―― À không, phải rồi, nếu không có phương tiện giao thông nào khác, thì còn cả chở hàng nữa.」"
1726 = "「%f思源宋体B;[So　với　buồng　lái　của　đầu　máy　hơi　nước　Hinomoto　thì　sao,12]这驾驶台跟日本的蒸汽机车比？　[Quả　nhiên　là　khá　cũ　kỹ　nhỉ,7]是不是老掉牙了呀？%f;」"
1727 = "「Cái gì!? Ở xe đẩy bán dạo mà cũng làm được vậy sao?」"
1728 = "「Nói cách khác, giống như máy giặt phải không ạ?」"
1731 = "「Vậy thì, tôi xin phép nhé.」"
1732 = "「Vậy thì tốt quá rồi.」"
1734 = "「Nếu vậy, chúng tôi rất sẵn lòng.」"
1736 = "「Vậy, chúng ta di chuyển thôi.」"
1738 = "「Thời tiết xấu đến vậy mà cũng không ngừng chạy sao?」"
1740 = "「Nhưng mà trâu nước á! Trâu nước, được nuôi phổ biến lắm hả?」"
1743 = "「Về đề xuất liên quan đến Nine Stars phiên bản Trọng Quốc—— Tôi muốn thảo luận xem hướng đi mà chúng ta tìm ra có khả thi hay không.」"
1749 = "「Ngoài khai thác than đá, có rất nhiều cư dân dọc tuyến đường sống dựa vào chăn nuôi, lâm nghiệp, nông nghiệp và nuôi ong.」"
1751 = "「Dù mức độ ồn ào hoàn toàn khác nhau, nhưng mà――」"
1752 = "「Trung Quốc mà thầy Soutetsu đang nói đến―― chắc chắn là Trung Quốc \"trong trí tưởng tượng của người Hinomoto\".」"
1753 = "「Thầy Soutetsu cứ lên đi ạ. Từ dưới này em vẫn có thể thông dịch được.」"
1754 = "「Thầy Soutetsu, ở quán ăn đằng kia, thầy xem, trên bàn cũng có dán mã QR kìa.」"
1755 = "「Thầy Soutetsu, cô Hibiki. Cả cậu Zhihuan nữa.」"
1756 = "「Thầy Soutetsu, nhìn cái đó là thầy sẽ hiểu ngay thôi ạ.」"
1757 = "「Hả?」"
1759 = "「Việc mua sắm phụ tùng có ổn không? Đèn pha, có vẻ như đang dùng loại có thông số kỹ thuật khác để thay thế thì phải.」"
1763 = "「Nuôi ong, là nuôi ong mật phải không ạ?」"
1878 = "Nghe thấy vậy――hoặc có lẽ nhận được cộng cảm nào đó, Suika xen vào cuộc trò chuyện với giọng điệu hơi hoảng hốt."
1880 = "Vì nhân kẹp bên trong khá nhiều, nếu không ngồi ăn thì có vẻ dễ làm rơi vãi, nhưng trông ngon thật."
1884 = "Không biết cô Jiang có nhận ra Hachiroku và Hibiki đang nói đỡ cho tôi hay không, nhưng dù sao thì cô ấy cũng đã khéo léo phát triển câu chuyện."
1887 = "Nhận lấy lời cảm ơn của Hachiroku bằng một nụ cười, cô Jiang nói chuyện với bà cô bán hàng bằng tiếng Trung."
1900 = "Điểm mạnh chỉ có ở đường sắt Trung Quốc. Điểm mạnh chỉ có ở đường sắt Hinomoto."
1902 = "Khắp nơi ở Kiện Vi này, đều đang phát ra ánh sáng chói lọi, tôi cũng cảm nhận được điều đó, chính vì vậy."
1904 = "Dù tôi hơi bận tâm, nhưng Suika vẫn thông dịch mà không có vẻ gì là bối rối."
1914 = "Cố gắng không di chuyển máy ảnh, tôi chỉ――dồn toàn bộ tâm trí vào việc đó."
1917 = "Hachiroku gật đầu liên tục, nhưng lại tỏ ra yếu ớt."
1919 = "Hachiroku cũng nhìn thẳng vào tôi. Có chút gì đó ngượng ngùng. Nhưng phần nhiều là vẻ tự hào."
1920 = "Hachiroku khẽ gật đầu."
1922 = "Hachiroku xả hơi dài như một tiếng thở dài. Nhưng trong đó, sự ghen tị đã biến mất."
1925 = "Hachiroku mím môi, nhắm mắt lại. Tôi cũng làm theo."
1927 = "Hachiroku và Hibiki cũng nhìn tôi với vẻ mặt ngơ ngác―― Rồi tất cả, đồng loạt bật cười khúc khích."
1929 = "Hachiroku mỉm cười nhìn tôi, khép hờ đôi môi―― Ừm, nếu vậy. Chỗ này, kẻ bất tài là tôi đây sẽ đảm nhận vai trò giải thích."
1931 = "Hachiroku né người sang một bên, nhường tầm nhìn từ cửa sổ phía trước cho tôi."
1933 = "Hachiroku ngoảnh lại nhìn tôi. Vì vậy, tôi gật đầu. Thật mạnh. Thật sâu."
1934 = "Hachiroku lắc đầu, như thể không thốt nên lời nào nữa."
1936 = "Đầu ngón tay trắng ngần của Hachiroku khẽ vuốt ve đôi môi. Lời nói bị kìm nén trong khoảnh khắc, lại bắt đầu tuôn chảy từ từ."
1942 = "Bất chợt, giọng của Hachiroku im bặt. Đồng thời tay đang phác thảo của Hibiki cũng đột ngột dừng lại――"
1943 = "Giọng của Hachiroku sâu lắng và tĩnh lặng."
1944 = "Giọng của Hachiroku nhỏ dần."
1945 = "Trong giọng nói của Hachiroku, lại xen lẫn chút tự trào và ghen tị."
1946 = "Hachiroku khẽ gật đầu."
1950 = "Hachiroku với nụ cười rạng rỡ liên tục ngoảnh lại nhìn tôi. Hibiki thì hoàn toàn không ngoảnh lại, cũng không nói một lời."
1951 = "Vừa bước đi, Hachiroku vừa hỏi nhỏ Suika."
1953 = "Thậm chí, ngay cả đồng hồ đo mực nước cũng không có."
1957 = "Ngay khoảnh khắc bước xuống khỏi chiếc xe buýt cao tốc xuất phát từ Thánh đô, mắt Hibiki tròn xoe."
1971 = "Ra là vậy, Hachiroku đang băn khoăn về điều đó sao. Quả thực, nó khá là nổi bật nhưng――"
1980 = "Là tiếng huýt sáo. Có vẻ rất quen thuộc, một âm thanh khá lớn và hay――!!?"
1981 = "Cô Jiang lấy điện thoại thông minh ra, thao tác gì đó―― Bà cô bán hàng cũng lấy điện thoại thông minh ra để đáp lại nhưng……"
1985 = "Một lượng hơi nước khổng lồ chứa lượng nước có thể nhìn thấy bằng mắt thường, được xả ra với một thế lực mãnh liệt về phía thung lũng――!!!!"
1989 = "Nữ hướng dẫn viên trẻ tuổi đang ngồi cùng toa hành khách với chúng tôi――"
1990 = "À, ra vậy. Việc cô Jiang chọn đứng ăn――chọn ăn ở xe đẩy bán dạo là."
1995 = "Bốp, một âm thanh vỗ tay vang lên từ một nơi không ngờ tới."
1996 = "Cô hướng dẫn viên cũng xuống theo, và chỉ dẫn chi tiết cách cầm máy ảnh ở đây thế này thế kia."
1997 = "Tiếng Trung của cô hướng dẫn viên nghe cũng khá vui vẻ. Rốt cuộc họ đang nói chuyện gì――"
1999 = "Vì đang để chế độ quay video nên tôi đã lỡ mất khoảnh khắc chụp ảnh, nhưng hình ảnh đầu máy lùi lại quả thực cũng là một bức tranh đẹp."
2001 = "Việc nước trong toa tiếp than nước cạn kiệt cũng không phải là chuyện hiếm, ở nơi hiểm trở bậc nhất đó, mà lại xả bỏ một lượng nước lớn thế này thì――"
2002 = "Ánh mắt của mọi người, tự nhiên hướng ra ngoài từ cửa sổ bên hông. ……Chà, thật là một phong cảnh điền viên miền núi――thanh bình làm sao."
2005 = "Chỉ một lòng say sưa, khắc ghi mọi thứ nhìn thấy vào cuốn sổ phác thảo."
2006 = "Nhân viên của Đường sắt Ba Nham, vừa vẫy vẫy chiếc điện thoại, vừa nở nụ cười hiền lành, đưa màn hình cho chúng tôi xem."
2008 = "Nhớ không lầm thì, 『cố gắng đừng di chuyển máy ảnh nhé』. 『Vì đối tượng đang quay sẽ di chuyển mà』――là vậy phải không."
2011 = "Và những điểm mạnh mà đường sắt của cả hai nước cùng sở hữu. Nếu có thể kết hợp chúng lại với nhau một cách khéo léo thì――"
2024 = "Cô Jiang gật đầu với vẻ rất hài lòng. Hiếm khi thấy cô ấy dang rộng hai tay với cử chỉ lớn như vậy."
2026 = "Cô Jiang định truyền đạt thắc mắc của chúng tôi―― thì ngay lúc đó, cô hướng dẫn viên lại bấm điện thoại,"
2028 = "Cô Jiang với thái độ không hề khác ngày thường, đưa cho chúng tôi những miếng đậu phụ chiên nóng hổi vừa mới làm xong."
2033 = "Cánh tay vốn đã dừng hẳn lại của Hibiki, bắt đầu di chuyển nhanh thoăn thoắt như thể vừa đứt xích."
2035 = "Ứng dụng công nghệ của Aircra bay vào đường sắt bánh sắt. Quốc gia này…… đã tạo ra một phương tiện giao thông mới."
2042 = "Có lẽ là để củng cố thêm cho lời nói của Suika. Cậu Zhihuan chỉ tay về phía quán ăn ở ngay gần đó."
2046 = "Bất giác thốt lên. Cũng có phần thán phục trước suy luận của cậu Zhihuan. Nhưng――"
2048 = "Tôi thốt lên một giọng ngơ ngác."
2051 = "Tôi nhớ lại sân bay Bắc Cầm. Giờ nghĩ lại, khung cảnh đó cũng cực kỳ mang tính biểu tượng."
2053 = "Suika thông dịch lại cảm nhận của chúng tôi. Số 19 lập tức nở một nụ cười ngây thơ."
2055 = "Cách nói có vẻ ẩn ý gì đó."
2057 = "Vừa hỏi, Suika lập tức truyền đạt lại cho cô hướng dẫn viên, rồi cô Jiang dịch lại câu trả lời của cô hướng dẫn viên cho chúng tôi."
2058 = "Trái tim tôi cũng đang run rẩy. Đây chắc chắn là khung cảnh không bao giờ có thể thấy ở Hinomoto."
2061 = "Tôi cứ lơ mơ nghĩ là thanh toán bằng thẻ tín dụng hay gì đó, nên cũng không đặc biệt để tâm nhưng……"
2062 = "Có lẽ ký ức về việc bản thân bị cất vào tủ kính và bị đối xử như \"di vật của quá khứ\"——đang ùa về trong tâm trí em ấy."
2063 = "Có lẽ vì còn thời gian trước khi quay đầu, người lái tàu và Railord cũng――"
2068 = "Vì vậy, chúng tôi chọn bộ đàm làm phương tiện liên lạc an toàn…… Nếu vậy thì――việc cho phép liên lạc bằng điện thoại hay không cũng không dễ đánh giá."
2069 = "Vì vậy, để không bị phân tâm bởi \"những điều thừa thãi\", tôi cũng cẩn thận ngắm nhìn lại cảnh sắc xung quanh."
2070 = "Hành khách chỉ có chúng tôi, như bao trọn chuyến. Người khác trên tàu chỉ có hướng dẫn viên của Đường sắt Ba Nham――"
2073 = "Lúc khởi động điện thoại và lúc thanh toán. Nghĩa là yêu cầu xác nhận mật khẩu ít nhất hai lần."
2081 = "Quả thật miếng dán mã QR được dán ở nơi dễ thấy, nhưng tôi hoàn toàn không ngờ đó lại là phương thức thanh toán."
2083 = "Sự nhộn nhịp tràn trề quả thực đang hiện hữu nhưng…… Các tòa nhà, hay trang phục của người qua đường, nếu so với Bắc Cầm hay Thánh đô thì."
2099 = "Vẫn không dừng tay phác thảo, Hibiki cũng gật đầu đồng tình với lời tôi."
2101 = "Dừng tay phác thảo, Hibiki giơ tay lên."
2104 = "Hibiki chắc chắn đã giữ kết nối mạng. Nếu vậy, cứ theo cách mọi khi thôi——"
2106 = "Hibiki lập tức phác thảo lại."
2109 = "Ngón tay của Hibiki chợt dừng lại. Nhìn vào mắt em ấy, em ấy gật đầu ra hiệu không sao."
2110 = "Sự ngạc nhiên của Hibiki không hề phóng đại. Lái tàu thì còn đỡ, chứ nếu dọn dẹp buồng lửa thì Dịch vụ trang màu sẽ đen thui."
2111 = "Có vẻ như Hibiki cũng đã rũ bỏ được những điều thừa thãi. Đôi tay con bé không chút do dự, bắt đầu lướt trên cuốn sổ phác thảo."
2114 = "Những thiết bị tối thiểu cần thiết để vận hành đầu máy hơi nước. Khung cảnh giống như chỉ bố trí duy nhất những thứ đó."
2115 = "Tôi còn ngạc nhiên gấp bội phần, trước khoảng cách đã được thu hẹp giữa cậu Zhihuan và Suika."
2118 = "Đầu máy đã dừng ở ga."
2121 = "Hai cửa sổ lớn phía trước, Hachiroku và Hibiki mỗi người đang bám chặt lấy một bên."
2124 = "So với tiền mặt, rớt một cái là bị xài chùa không có gì đảm bảo, thì quả thật an toàn hơn nhiều, và cũng có vẻ thông minh hơn."
2126 = "Có ao chứa nước, những thửa ruộng bậc thang nhỏ xếp lớp lên nhau, đâu đó còn thấy bóng dáng của vịt hay con gì đó."
2128 = "Tiếng còi ngắn. Là còi báo hiệu. Ngay lập tức cô hướng dẫn viên ngồi xổm xuống ghế sau cùng――"
2131 = "Nhận ra giọng điệu hốt hoảng của Hibiki và Hachiroku, tôi tự kiểm điểm bản thân. Vì quá ngạc nhiên mà tôi lại suýt nói \"điều thừa thãi\" nữa rồi."
2134 = "Ở tuyến Yui thì chắc chắn là không thể, nhưng ví dụ như tuyến Hisatsu, hay tuyến núi ――À không, ở đó nước là một thứ vô cùng quý giá."
2143 = "Bộ đàm tất nhiên cũng làm giảm sự tập trung. Nhưng ảnh hưởng của nó là rất nhỏ, và mức độ quan trọng của thông tin lại cao."
2144 = "Bắc Cầm hay Kiện Vi, cũng như tuyến đường sắt Trọng Quốc mà bảo tàng lịch sử và đường ray kể lại, đều giống nhau. Không coi thời gian \"hiện tại\" là ngoại lệ của sự tích lũy từ quá khứ——"
2148 = "Sức sống. Hay sự tỏa sáng có lẽ đã trở nên mờ nhạt ở Hinomoto ngày nay――"
2150 = "Giặt thứ đó bằng bàn giặt…… Chỉ tưởng tượng thôi cũng thấy tốn công sức đến mức phát ngất."
2154 = "Phía bên kia màn hình, má Paulette phồng lên. Đúng là cô ấy nói có lý, nhưng chuyện đó để về nước rồi nghe tiếp vậy."
2155 = "Khách sạn ở Thánh Đô cũng vậy."
2168 = "Một câu nói đó, nghe có chút bất ngờ."
2172 = "Ngay chính diện. Ngay chính diện khung cảnh phía trước, có một cửa buồng khói của \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; nhỏ."
2175 = "Trong khoảnh khắc, tiếng bút dừng lại, rồi lại bắt đầu chạy mãnh liệt."
2176 = "Không chỉ những thứ nổi bật như tòa nhà chọc trời hay thương hiệu cao cấp, mới là hình thức của sự phát triển kinh tế."
2181 = "Cảnh tượng trong bức ảnh mà cô hướng dẫn viên đưa cho xem qua điện thoại―― Một con trâu nước đang liếm đường ray, một khung cảnh thật sự thanh bình."
2184 = "Bím tóc của Suika nhảy múa vùn vụt. Đáng ngạc nhiên là, cùng với một nụ cười rạng rỡ."
2185 = "Nghe em ấy nói mới nhớ, đúng là vậy. Chúng tôi vẫn chưa hề thấy cô Jiang dùng tiền mặt."
2188 = "Không hề lép vế trước đủ loại âm thanh của xe đạp, xe máy, ô tô. ――Giọng nói của người dân thị trấn này vang lên thật mạnh mẽ và tươi sáng làm sao."
2197 = "Railord của đầu máy số 19 Đường sắt Ba Nham―― Số 19 đuổi con vịt ra khỏi buồng lái với vẻ rất quen thuộc."
2228 = "Trước câu nói của cô Jiang, Suika và cậu Zhihuan cũng gật đầu."
2229 = "Suika thông dịch gần như cùng lúc. Số 19 vừa cười vừa trả lời."
2231 = "Suika mỉm cười, gật đầu."
2233 = "Suika thông dịch. Trên khuôn mặt tươi cười của Số 19, pha lẫn chút tinh nghịch."
2234 = "Suika không lập tức dịch lại lời lầm bầm của No.19 cho chúng tôi."
2237 = "Giọng của Suika cũng ngỡ ngàng. Có lẽ vì cảm động, giọng cô bé hơi run rẩy."
2239 = "Suika lập tức hỏi Số 19 và nhận được câu trả lời."
2241 = "Vừa nói, Suika vừa nép sát vào cậu Zhihuan. Với khí thế như sắp cọ má vào cánh tay cậu ấy."
2247 = "Nhưng, dù vậy tôi quả thực vẫn cảm nhận được một sự hoài niệm xa xăm."
2257 = "Vẻ mặt bối rối lan sang cả Suika. Với khuôn mặt đó, cô bé từ từ dịch lại lời của Hachiroku."
2258 = "Cũng phải thôi. Đối với những hành khách trên tuyến đường sinh hoạt này, đoàn tàu của nhóm No.19 hiển nhiên chỉ là một phương tiện bình thường."
2259 = "Thật là……mộc mạc làm sao."
2260 = "Lần này đến lượt Hachiroku nghiêng đầu."
2261 = "Đó tuyệt đối không phải là sự coi nhẹ lịch sử. Mà là coi lịch sử là một phần của hiện tại, và hiện tại là một phần của lịch sử. Đơn giản là đối xử bình đẳng với chúng."
2262 = "Một chiếc đầu máy nhỏ xíu thậm chí không có biển số, kéo theo làn khói trắng dài, chầm chậm tiến vào khúc cua."
2263 = "Không chỉ ở mức độ thiết bị thổi gió."
2264 = "Ngay cả cử chỉ đó, Suika cũng trung thực dịch lại."
2268 = "Pha xả nước hào hùng đó, có lẽ là sự chuẩn bị để luôn có thể cấp nước đầy bình."
2270 = "Dù rõ ràng là một công trình kiến trúc lịch sử, nhưng họ vẫn cho chúng tôi chỗ ngủ mà chẳng hề có một lời lưu ý nào."
2271 = "Có vẻ như Railord cũng giống như đầu máy, có tính cách rất đơn giản."
2272 = "Railord nhận thông tin qua cộng cảm, rồi truyền đạt lại bằng miệng thì…………À, khoan đã――"
2276 = "Tiếng còi dài, cùng tiếng khí thải xi lanh và hút gió lò hơi."
2279 = "Vế sau của chữ 『nhưng』 bị nuốt ngược vào trong một cách bất mãn, tôi cũng hiểu được. Thao tác điện thoại trong lúc làm nhiệm vụ, nghĩa là ai đó sẽ phải rời mắt khỏi phía trước."
2280 = "Tôi không quen quay video, nhưng đã được Paulette chỉ cho bí quyết."
2286 = "Trước sự cảm thán sâu sắc của chúng tôi, Suika lại cất giọng có vẻ hơi bối rối."
2287 = "Hướng về phía Hibiki đang nghiêng đầu thắc mắc, Hachiroku cất giọng như mang theo chút hoài niệm."
2293 = "Buồng lái và cửa sổ toa hành khách rất gần nhau. Ngay cả thao tác lái của người lái tàu, cũng có thể nhìn thấy rõ từ cửa sổ phía trước."
2303 = "(À――)"
2304 = "(Phụttttttttt!!!)"
2305 = "(Phạch phạch phạch phạch!!!)"
