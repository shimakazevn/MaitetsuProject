924 = "「……」"
945 = "「……Không. Quả nhiên đúng như Hachiroku nói.\\nTheo mọi nghĩa, sự xa xỉ đến mức này, chúng ta không thể làm được.」"
947 = "「……Thầy Soutetsu và mọi người,\\ncó ngại đồ ăn ở các xe đẩy bán dạo không ạ?」"
949 = "「……Thế hệ chúng tôi thì chắc là không biết đâu.」"
952 = "「……Đúng là Trung Quốc á.」"
955 = "「……Nếu mượn lời của Suika thì là âm thanh phong cảnh.\\nTôi nhớ có một sự xôn xao nào đó rất giống thế này.」"
958 = "「……Ra là vậy.」"
963 = "「……Ồ.」"
965 = "「……Chỉ có thể làm được vì dưới đáy thung lũng là khe suối không người thôi.」"
967 = "「……Thời kỳ mà Hinomoto và Teitetsu tràn đầy sức sống.\\nLà sự xôn xao tràn ngập các nhà ga trong thời kỳ kinh tế phát triển cao độ.」"
969 = "「……Nghe nói ở ga này,\\nnhững người đi toa hành khách du lịch như chúng ta sẽ xuống xe một lát.」"
970 = "「……Cô ấy bảo lên buồng lái được ạ.\\nNghe nói bọn vịt cứ tự tiện chui vào từ cửa sổ.」"
973 = "「……Có vẻ như họ đang chia sẻ thông tin\\nqua nhóm chat của một ứng dụng tên là OurChat.」"
974 = "「……Nghe nói họ đã xả bỏ nước trong lò hơi.」"
977 = "「……Xả một lượng lớn nước cùng với rác trong lò hơi ra ngoài,\\nvừa làm dịch vụ cho du khách xem vừa dọn dẹp lò hơi ở một mức độ nào đó.」"
979 = "「……Thật đáng tiếc, không có khung cảnh nào giống thế này\\ntrong bất kỳ ký ức nào của tôi cả. Nhưng mà――」"
981 = "「……Cho đầu máy chạy ngược hướng với cơ thể――\\nNghĩa là phải vặn người để thao tác lái phải không ạ? Có vẻ khó nhỉ.」"
986 = "「……Nghe nói đầu máy sẽ tiến vào khúc cua này một lần nữa.\\nHọ bảo 『chuẩn bị bắt đầu quay video đi là vừa』.」"
987 = "「……Họ đang tháo đầu máy chạy lùi ra và lắp lại kìa.\\nCó phải là sẽ quay đầu ở đây không ạ.」"
991 = "「……Nghe nói đó là gia súc cần thiết để canh tác và duy trì ruộng lúa.\\nỞ vùng núi này, có vẻ khó đưa máy cày v.v... vào sử dụng.」"
993 = "「……Nghe nói con trâu nước này là tội phạm quen mặt rồi.\\nNó thích liếm đường ray sau khi đầu máy hơi nước chạy qua.」"
997 = "「……Mỗi ngày có ba chuyến tàu chở hàng, và hai chuyến tàu thường.\\nTàu thường ghép cùng toa hành khách du lịch thì mỗi buổi sáng chiều có hai chuyến.」"
1002 = "「……Nhân tiện thì vừa rồi,\\nhọ đã trao đổi thông tin gì vậy?」"
1207 = "「Đạp cả phanh tay, nghĩa là đỗ tàu lâu sao?」"
1208 = "「À không, tôi nghĩ chỉ là do chúng tôi thiếu hiểu biết thôi.\\nNhưng mà, phải nói sao nhỉ, khung cảnh này……」"
1211 = "「Không chỉ những đô thị lớn như Bắc Cầm hay Thánh đô, mà những\\nthành phố địa phương thế này, những năm gần đây cũng đạt được sự phát triển kinh tế đáng kinh ngạc.」"
1213 = "「Không vấn đề gì đâu. Đó là xe của bên liên quan với chúng tôi mà.」"
1215 = "「Phong cảnh đường sắt đã mất ở Hinomoto――\\nToàn bộ thời kỳ của Teitetsu cũ. Hoặc thậm chí là viễn cảnh tương lai chưa từng được vẽ ra.」"
1217 = "「Không phải là thay thế, mà chỉ là đổi sang đèn LED sáng và tiện lợi hơn thôi.\\nCô ấy đang thắc mắc tại sao lại nghĩ đó là đồ thay thế.」"
1219 = "「Thanh toán bằng mã QR. Dùng ứng dụng chụp lại mã QR\\ndán ở kia, nhập số tiền và mật khẩu là thanh toán xong.」"
1228 = "「%f思源宋体B;[Toa　hành　khách　kéo　hôm　nay,7]今天挂的这节车厢、[Cùng　với　hành　khách　con　người,6]不光能供人乘坐、\\n%f思源宋体B;[Cũng　là　toa　chở　cả　gia　súc　gia　cầm　như　chim,　lợn,　dê,15]同时还能搭运鸡鸭猪羊这些家禽家畜%f;」"
1229 = "「Nghe nói toa hành khách hôm nay là \\x%l合造車;#00ffc040;toa xe hỗn hợp%l;#; giữa toa chở gia súc và toa hành khách.\\nChắc là họ nhốt gia súc vào lồng để vận chuyển nhỉ.」"
1237 = "「Tối nay, hãy triệu tập một cuộc họp giúp tôi. Chỉ cần những thành viên có thể tập trung là được.\\nNhưng hãy cố gắng mời đền chủ Akai và Niiroku tham dự.」"
1239 = "「Thanh toán xong rồi? Nghĩa là――」"
1245 = "「%f思源宋体B;[Thay　thế　là　sao,7]代用是什么意思呢？　[Đèn　pha　thì　chỉ　là　thay　mới　thôi.　Bằng　loại　sáng　hơn　và　tiện　lợi　hơn,14]我们就是把头灯换成方便又明亮的\\n%f思源宋体B;[Là　LED　đó,4]ＬＥＤ灯啊。[Vì　như　vậy　tiện　lợi　hơn　mà,7]这样不是更方便嘛%f;」"
1247 = "「Có lẽ đây là cảnh tượng chỉ có ở đầu máy hơi nước thùng nước loại nhỏ thôi nhỉ!\\nChạy lùi lên dốc với tốc độ cỡ này cơ mà.」"
1253 = "「Có vẻ như có con trâu nước đã đến rất gần đường ray.\\nVì nguy hiểm nên họ muốn liên lạc với chủ để đuổi nó đi.」"
1255 = "「Nhưng ở Trọng Quốc, lịch sử và hiện tại là một chuỗi liên tục.\\nLịch sử không dùng sức nặng của nó để trói buộc hiện tại.」"
1257 = "「Nhưng……vận hành nhiều như vậy,\\nthì việc bảo dưỡng, duy trì không gặp vấn đề gì sao?」"
1258 = "「Đúng vậy. Cuối cùng cũng đến đó. Những đầu máy hơi nước của thị trấn khai thác mỏ\\n――những đầu máy của Đường sắt Ba Nham, đang chờ đón chúng ta!」"
1262 = "「Bởi vì, đây là \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; vô cùng quý giá mà?\\nNếu không bảo tồn nguyên bản, thì giá trị văn hóa sẽ bị tổn hại mất.」"
1265 = "「Em không hiểu sao, Hibiki. Ở thị trấn này――không,\\ntrên toàn đất nước Trung Quốc, mọi việc thanh toán đều diễn ra trong chớp mắt.」"
1266 = "「Có lẽ, ở quốc gia này hiện tại và quá khứ có giá trị ngang nhau.\\nLịch sử sẽ không trói buộc việc xem xét cách tận dụng chúng.」"
1271 = "「Cảnh sắc ở Kiện Vi là một trong những khung cảnh địa phương điển hình của Trung Quốc.\\nRa là vậy. Hình ảnh Trung Quốc trong mắt người Hinomoto là như thế này sao.」"
1272 = "「Chính vì vậy, lái nó chắc sẽ rất thú vị đây.」"
1280 = "「Hachiroku thì sao?\\nĐâu đó trong ký ức 100 năm của em, có phong cảnh nào giống thế này không?」"
1283 = "「Hơn nữa chắc chắn, những thứ vốn dĩ không có ở Hinomoto,\\ncũng có rất nhiều phải không ạ.」"
1286 = "「Nói đúng hơn, Nine Stars không phải là đại diện cho điều đó sao.」"
1294 = "「Vừa rồi là――ồ――\\nCó lẽ là chuyện không xảy ra ở Hinomoto đâu ạ.」"
1295 = "「Hồi nãy em có nhìn lén một chút――\\nToa hành khách thường á, sao ở góc lại có cái lồng vậy?」"
1296 = "「Con lúc nãy á!? Oa, còn nữa kìa! Gọi là tới luôn hả!?\\nQuen hơi ghê ha.」"
1299 = "「Ra là vậy……đúng là tuyến đường sinh hoạt.\\nCó khoảng bao nhiêu toa xe thuộc tuyến này vậy?」"
1302 = "「Nguyên sơ……Một từ tiếng Hinomoto hơi khó――\\nHiểu theo nghĩa 『Cảnh sắc quê hương』 có đúng không ạ?」"
1305 = "「Tôi đã sắp xếp xe đến Tứ Tỉnh rồi.\\nMọi người vừa di chuyển vừa dùng bữa có được không ạ?」"
