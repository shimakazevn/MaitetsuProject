1340 = "「Chà! Tôi có thể lên đó được sao?」"
1343 = "「Oa! Trông ngon quá~! Cái này, là cà rốt và củ cải thái chỉ á? Kẹp vào giữa miếng đậu phụ chiên đã cắt ra á?」"
1345 = "「Hả? Xe đẩy bán dạo sao?」"
1346 = "「Hô.」"
