889 = "……Tôi cảm thấy giờ mình đã hiểu phần nào ý nghĩa câu nói\\n\"tôi cũng có tìm hiểu về Đường sắt Trung Quốc\" của Paulette."
891 = "……Lời đề nghị ăn xe đẩy bán dạo đột ngột khiến tôi hơi bất ngờ,\\nnhưng nhắc mới nhớ, quả thực tôi cũng đang hơi đói."
910 = "「Khi \\x%l大戦;#00ffc040;Đại chiến%l;#; kết thúc, công cuộc tái thiết bắt đầu, đất nước trở nên giàu có.\\nVà cuối cùng, máy giặt cũng được đưa vào khu đầu máy――」"
