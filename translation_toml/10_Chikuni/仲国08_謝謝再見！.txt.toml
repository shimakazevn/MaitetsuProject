1654 = "「!!?」"
1656 = "「Ừ. Đi thôi. Suika, chắc chắn hai chúng ta sẽ đi cùng nhau.\\nVì điều đó, tớ cũng sẽ làm tất cả những gì có thể.」"
1658 = "「Ừ. Sẽ là một kỷ niệm đẹp đây, tôi rất sẵn lòng.」"
1659 = "「Ừm. Nếu muốn đi vòng quanh tất cả 34 nhà ga cứ điểm chỉ trong 7 ngày,\\nthì chỉ có ngồi trên tàu thôi——hoàn toàn không còn thời gian rảnh rỗi để du lịch nữa.」"
1662 = "「Ừm, đó là tên gọi chung cho loại ảnh chụp lấy ngay của công ty Polaroid.\\nPhim sau khi chụp sẽ được in và nhả ra ngay lập tức——」"
1663 = "「Hửm? À!」"
1665 = "「Ufufufufu, lại thêm một kỷ niệm tuyệt vời nữa của chuyến đi.\\nChính chúng tôi mới phải cảm ơn hai người.」"
1667 = "「Ufufu! Được đó! Nè. Anh hai,\\nnếu chỉ tốn chừng đó thời gian thì không sao đúng không?」"
1669 = "「Fufufu, ý gì thì tôi hiểu rõ mà.\\nZhihuan. Suika. Chúc mừng hai em.」"
1671 = "「Ufufu, thật là một điều tuyệt vời nhỉ.」"
1673 = "「Nếu về Hinomoto rồi, thì việc trao đổi ý kiến trực tiếp\\nvới cô Jiang và những người khác sẽ trở nên khó khăn hơn nhỉ.」"
1674 = "「Vì vậy, dù có khoanh vùng một khu vực có quy mô bằng Kyushu để đi du lịch,\\nthì cũng chỉ là du lịch vòng quanh \"một phần rất nhỏ của Trọng Quốc\" mà thôi.」"
1677 = "「Đi vòng quanh trong 6 ngày!? Cái đó thì quá」"
1679 = "「Những món đồ lưu niệm được bán ở Bảo tàng Lịch sử Đường sắt Bắc Cầm,\\nvà Đường sắt Bayan. Có lẽ sẽ hữu ích để tham khảo đó.」"
1682 = "「Ngủ say trên chuyến bay về có lẽ sẽ nghỉ ngơi được tốt hơn.\\nBây giờ mà ngủ dở dang thì lên máy bay có khi lại không ngủ được đâu đấy.」"
1684 = "「Ở nơi mà sự gần gũi với đường sắt gần như không có, lại phô trương\\nnhững món đồ xa xỉ bậc nhất, thì điều đó có lẽ cũng là bất khả kháng nhỉ.」"
1686 = "「Ở Hinomoto, Tân Cán Tuyến——phải trải đường ray chuyên dụng khổ tiêu chuẩn,\\nnhưng Trọng Quốc thì ngay từ đầu đã là khổ tiêu chuẩn rồi.」"
1688 = "「Vốn đầu tư cho các thiết bị liên quan, so với Hinomoto thì chắc chắn——\\nsẽ ít hơn rất nhiều.」"
1689 = "「Khổ hẹp mà chạy 160km/h!? Vậy thì, Suika——\\ncâu \"trên tính toán thì là có thể\" lúc nãy cậu nói là……」"
1691 = "「Kết hợp với việc tổ chức chiến dịch, phát hành vé trọn gói,\\nđể thúc đẩy mạnh mẽ giới trẻ sử dụng đường sắt, em nghĩ sẽ rất hiệu quả.」"
1693 = "「Thông qua chuyến hành trình khẳng định lại sức hấp dẫn của Trọng Quốc, để cảm nhận sức hấp dẫn của đường sắt Trọng Quốc.\\nXa hơn nữa là——tái khám phá chính bản thân mình khi đi du lịch Trọng Quốc.」"
1694 = "「Cảm ơn. Zhihuan và Suika cũng vậy,\\nlúc nào cũng có thể đến Ohimitera chơi nhé. Chúng tôi sẽ chào đón hết mình.」"
1697 = "「Tuyệt vời quá! Cháu cảm thấy phương án của thầy Soutetsu\\nkhông chỉ có tính khả thi mà còn mang theo cả hy vọng và tính phát triển nữa.」"
1699 = "「Chắc chắn cô ấy sẽ rất vui đó ạ.」"
1700 = "「Tôi hiểu rồi. Vậy thì, tạm thời」"
1703 = "「Vâng, tất nhiên là thế rồi.」\\n「Hau.」"
1706 = "「Bây giờ chúng ta đã làm tất cả những gì có thể. Chỉ còn phần hoàn thiện cuối cùng,\\nnếu đã nhờ đến cô Jiang và những người khác, thì chúng ta không thể cố gắng hơn được nữa.」"
1708 = "「Nhất định, chúng ta sẽ kết nối. Tuyến đường ray mới! Hai quốc gia!\\n——Êi! Êi!」"
1721 = "「Ra vậy. Ừm——\\nĐúng là thế thật.」"
1722 = "「Ra vậy! Nếu làm thế——nếu có thể,\\nthiết kế chính tấm vé đó theo phong cách hoài cổ cũng hay đấy!」"
1723 = "「Ra là vậy! Nếu có những loại vé trọn gói giá rẻ như thế,\\nthì có vẻ sẽ dễ dàng giúp mọi người gần gũi với đường sắt hơn nhỉ.」"
1724 = "「Cho nên, em nghĩ nên bắt đầu trao phần thưởng rally thu thập con dấu\\ntừ việc hoàn thành 18 nhà ga trong một đại khu địa lý.」"
1725 = "「Đúng vậy nhỉ. Tớ cũng thế, Suika.」"
1731 = "「Được ban phước mà không sử dụng, để nó chết dần chết mòn,\\ncũng giống như việc không hoàn trả phước lành cho ai, mà giữ khư khư cho riêng mình vậy.」"
1734 = "「Nếu đã được ban phước, thì hãy tận dụng nó một cách tối đa.\\nNếu tận dụng được, phước lành đó sẽ lan tỏa ra toàn xã hội.」"
1735 = "「Chọn ra 7 nhà ga cứ điểm du lịch từ Tây Bắc, Hoa Bắc, Đông Bắc,\\nvà đi vòng quanh chúng trong 7 ngày, gọi là \"Bắc Đẩu Thất Tinh\".」"
1736 = "「Chọn ra 6 nhà ga cứ điểm du lịch từ Tây Nam, Trung Nam, Hoa Đông,\\nvà đi vòng quanh chúng trong 6 ngày, gọi là \"Nam Đẩu Lục Tinh\"!」"
1742 = "「Zhihuan——」"
1744 = "「Zhihuan……」"
1746 = "「Sao vậy? Hibiki.」"
1752 = "「Ngài quá khen rồi ạ. Em chỉ là——\\nÔi! Vừa nhắc tào tháo là tào tháo đến ngay kìa.」"
1753 = "「Điều này, là sao.」"
1755 = "「Từ cụm từ \"ở thời điểm hiện tại\"」"
1757 = "「Dù vẫn còn lưu luyến, nhưng Hibiki, Hachiroku.」"
1764 = "「Em cũng vậy thưa ngài Soutetsu.\\nTất cả của em, đều là để thực hiện mong muốn của ngài.」"
1768 = "「Em cũng vậy thưa ngài Soutetsu.\\nEm cảm thấy vô cùng vui vẻ và phấn khích.」"
1772 = "「Tôi cũng cảm thấy như vậy. Nhưng——trước tiên, là đề xuất cho tương lai.\\nHãy tập trung vào một điểm duy nhất, đó là hiện thực hóa \"câu chuyện trong mơ\" lúc nãy.」"
1779 = "「Chúng tôi đã định thiết lập các nhà ga cứ điểm du lịch ở từng khu vực trong số 34 khu vực.\\nVà lên ý tưởng về một chuyến tàu du lịch vòng quanh tất cả các cứ điểm đó, nhưng mà……」"
1780 = "「Chúng tôi sẽ rất mong chờ\\nsự trở lại sớm nhất có thể của các vị.」"
1781 = "「Nếu là chúng tôi thì trong tương lai. Có thể đề xuất một chuyến tàu đi vòng quanh nhà ga cứ điểm của cả 6 đại khu địa lý\\n——toàn bộ Trọng Quốc trong 6 ngày.」"
1782 = "「Chúng tôi có Kuha 26 tốc hành tàu điện. Còn đường sắt quốc gia Trọng Quốc có Dongfeng 4D\\nvà sự tích lũy phong phú trong việc vận hành tàu trên khổ tiêu chuẩn 1435mm.」"
1784 = "「Đầu tiên, chúng tôi tìm hiểu về sự rộng lớn của Trọng Quốc,\\nvà cố gắng sắp xếp lại.」"
1786 = "「Tôi rất vui. Cảm ơn hai người.」"
1788 = "「Tôi muốn thực hiện nó. Và đồng thời, tôi cũng mong rằng mong muốn của tôi——\\nsẽ là mong muốn của tất cả chúng ta.」"
1791 = "「Vì vậy, tôi nghĩ đó là lý do chúng tôi được gọi đến.\\nBởi vì Nine Stars là chuyến tàu kết nối Kyushu, kết nối các tuyến đường sắt lại với nhau.」"
1792 = "「Tôi đã suy nghĩ. Không, tôi đã suy xét cặn kẽ——\\nTại sao, chuyện này lại đến tay \"chúng tôi\".」"
1794 = "「Tôi cảm thấy đó là nguyên nhân lớn nhất dẫn đến việc xa lánh đường sắt.\\nNếu cứ để như vậy, qua mỗi năm, tình trạng này sẽ càng tăng tốc.」"
1795 = "「Tôi cũng mơ như vậy. Và giấc mơ đó,\\nnếu có sự hợp tác công nghệ của hai nước Nhật - Trọng, chắc chắn sẽ thành hiện thực.」"
1798 = "「Mong muốn của tôi——sao.」"
1800 = "「Biến bức tranh và câu chuyện thành hiện thực. Những gì Hinai, Kisaki\\nvà cô Mayami đã hoàn thành ở Hinomoto, tôi chắc chắn sẽ làm được ở Trọng Quốc.」"
1801 = "「Đó chính là——sức mạnh đã dẫn dắt Nine Stars đến thành công,\\ntôi đã nhận thức được như vậy.」"
1803 = "「Vì vậy, thầy Soutetsu cũng hãy thăng tiến đi.\\nHãy thống nhất giới đường sắt Hinomoto.」"
1806 = "「Cho nên, anh hai nè.\\nTrước khi gửi cho chị Jiang, anh kiểm tra lại lần cuối giúp em được không?」"
1808 = "「Vì vậy, dù có hơi quá sức——\\ndù chỉ là bản nháp, tôi cũng muốn cố gắng gửi đi trong buổi sáng.」"
1811 = "「Do đó, rào cản để hiện thực hóa là rất thấp. Và——\\nTân Cán Tuyến——đường sắt siêu tốc mới chính là sự phục hưng thực sự của đường sắt.」"
1812 = "「Vì vậy, để có thể hoàn trả phước lành rộng hơn, xa hơn.\\nThầy Soutetsu——xin hãy chuẩn bị sẵn sàng vị thế của mình.」"
1814 = "「Nếu việc có được vị thế sẽ giúp ích cho việc hoàn trả phước lành đó rộng rãi hơn.\\nTôi chắc chắn——sẽ đạt được vị thế đó.」"
1815 = "「Rally thu thập con dấu!」"
1816 = "「Được cô nói vậy tôi rất vinh dự.\\nNhưng, bây giờ trước mắt, chúng tôi sẽ về Hinomoto.」"
1819 = "「Được ban phước vô bờ bến, hạnh phúc đến mức——\\nem cảm thấy có chút sợ hãi.」"
1820 = "「Thật vinh dự. Nhưng——điều dẫn dắt Nine Stars đến thành công,\\ntuyệt đối không phải là sức mạnh của tôi——của tôi và Hibiki.」"
1823 = "「Nếu vậy, chúng ta sẽ chia làm hai như thế này!!」"
1824 = "「Xin lỗi nhé.」"
1832 = "「Đường sắt Tân Cán Tuyến. Ở Hinomoto, chuyến tàu tương tự\\nđã và đang được nghiên cứu, xem xét dưới cái tên đó.」"
1833 = "「Đường sắt Tân Cán Tuyến. Zhihuan.」"
1834 = "「Đường sắt Tân Cán Tuyến, hay đường sắt siêu tốc.\\nChắc chắn, sẽ bắt đầu từ hạt giống nhỏ bé ở đây, từ giọt nước khởi nguồn.」"
1841 = "「Vì thế chúng tôi đã nghĩ——\"Đường sắt tuy vẫn đang sống,\\nnhưng có lẽ tình trạng xa lánh đường sắt đang diễn ra nhanh chóng\".」"
1842 = "「Nếu có thể thực hiện được! Vậy thì chắc chắn!\\nThế hệ trẻ cũng sẽ nuôi dưỡng niềm khao khát với đường sắt nhỉ.」"
1845 = "「Nếu vậy thì tôi rất sẵn lòng.\\nTôi và lão sư xin phép được rút lui, không làm kỳ đà cản mũi nữa.」"
1853 = "「Đúng vậy nhỉ, Suika! Đến lúc đó」"
1855 = "「Đúng vậy á~, rõ ràng là vẫn làm những việc giống hệt mọi khi,\\nmà không ngờ lại mệt mỏi đến thế này cơ chứ~」"
1856 = "「Đúng vậy.」"
1858 = "「Ừ. Đúng vậy. Bằng cách sử dụng cộng cảm, Hachiroku đã giao lưu\\nvà thu thập thông tin rất tốt từ các Railord của Trọng Quốc.」"
1860 = "「Đúng vậy. Nếu làm được thế, tôi nghĩ sẽ phát huy\\nhiệu quả lớn hơn nữa trong việc thu hút mọi người tham gia rally thu thập con dấu.」"
1862 = "「Đúng vậy. Tôi thì không rành lắm, nhưng Paulette\\n——Hinai, Giám đốc Đường sắt Ohimitera, có kiến thức rất phong phú.」"
1864 = "「Đúng vậy. Do đó, chúng tôi đã từ bỏ phương án đó. Và tìm kiếm một cách phân chia hoàn toàn khác.\\nThế là chúng tôi được biết đến khái niệm \"Đại khu địa lý Trọng Quốc\".」"
1865 = "「Đúng vậy.」"
1867 = "「Tôi nghĩ là, có.」"
1869 = "「Đúng vậy, Suika. Dongfeng chắc chắn sẽ trở thành\\nmột trong những nền tảng to lớn để xây dựng tuyến đường sắt mới.」"
1871 = "「Cộng cảm từ Suika ạ.\\nCô ấy nói xe ra sân bay khoảng 30 phút nữa sẽ đến.」"
1879 = "「Dongfeng sẽ……」"
1881 = "「Anh quả là tinh ý. Nhận được báo cáo từ Suika,\\nchúng tôi đã đưa ra quyết định là nên giao phó việc này cho các vị.」"
1885 = "「Chính vì vậy. Đề xuất này chắc chắn sẽ được chấp nhận——\\nem tin là như thế.」"
1887 = "「Được đi thị sát cùng Hibiki và Hachiroku. Thật sự rất tuyệt.\\nHiện tại tôi nghĩ, có lẽ sẽ không thể đưa ra phương án nào tốt hơn thế này nữa.」"
1888 = "「Người quyết định sự tồn tại của tuyến đường sắt, lúc nào cũng vậy. Chỉ có những hành khách sử dụng, hoặc rời bỏ nó mà thôi.」"
1889 = "「Đúng vậy. Dữ liệu phục chế đã được sự đồng thuận của các bên liên quan\\nbằng cách công khai không ngoại lệ ở giai đoạn trước khi thực hiện phục chế.」"
1890 = "「Đúng vậy! Trong dịp Lễ hội mùa xuân và Quốc khánh, sẽ tổ chức rally thu thập con dấu\\nđi vòng quanh 108 nhà ga vì sao! Tên của nó là!」"
1891 = "「Ừ. Zhihuan. Vận hành thương mại với tốc độ trên 200km/h cũng là có thể.\\nNếu kết hợp công nghệ và bí quyết của Kuha 26 và Dongfeng 4D.」"
1898 = "「Hướng tới \"sự phục hưng của đường sắt quốc gia Trọng Quốc trong tương lai\"——tôi có chút trơ trẽn\\nkhi cảm thấy rằng, dường như các vị còn có đề xuất nào khác nữa.」"
1899 = "「Để lan tỏa tất cả những gì tôi đã được trao tặng cho đến nay……\\nrộng rãi hơn nữa——」"
1900 = "「Chỉ cần tích lũy từng ngày để điều đó thực sự xảy ra là được.\\nDù tài hèn sức mọn, nhưng lúc nào anh cũng sẽ giúp em hết sức mình.」"
1901 = "「Vậy thì tôi sẽ thăng tiến. Để giương cao tất cả các vì sao,\\nđể đưa ngọn gió đông đến Hinomoto, tôi sẽ nuôi dưỡng tiếng nói của mình.」"
1902 = "「Việc tạo ra thời gian tham quan…… trên tính toán thì——là có thể.\\nCó thể——bởi vì, Đường sắt Ohimitera có đoàn tàu Kuha 26-000.」"
1904 = "「Bức tranh để mọi người chú ý đến câu chuyện, và đọc nó.\\nVì vậy, tôi muốn cô Hibiki vẽ ở Trọng Quốc nữa.」"
1906 = "「Và khi hoàn thành toàn bộ 108 nhà ga, sẽ có một món quà\\nlưu giữ được lâu dài, xứng đáng để ca ngợi thành tựu vĩ đại đó——ừm?」"
1908 = "「Nhưng——khi thực sự đến đây và đi thử.\\nTôi mới hiểu ra rằng sự rộng lớn của Trọng Quốc sẽ gây khó khăn cho việc du lịch vòng quanh.」"
1916 = "「Ở giai đoạn này thì gọi tên là gì cũng được. Dù là Tân Cán Tuyến,\\nhay đường sắt siêu tốc. Quan trọng là, chúng ta có thể làm được gì với nó.」"
1919 = "「Là vô số những vì sao lấp lánh. 6 đại khu địa lý Trọng Quốc——\\nTôi muốn rải ít nhất mười vì sao trở lên vào mỗi khu vực.」"
1920 = "「Khám phá…… Trọng Quốc——\\nKhẳng định lại sức hấp dẫn của Trọng Quốc?」"
1924 = "「Đúng vậy. Nếu chỉ có phương án này,\\nthì rủi ro có lẽ sẽ lớn hơn lợi ích.」"
1925 = "「Đúng vậy ạ. Em cũng nghĩ rằng, với vai trò được giao phó,\\nem đã hoàn thành trọn vẹn theo cách của riêng mình.」"
1926 = "「Đúng là vậy.」"
1930 = "「Cũng không hẳn là một đề xuất hoàn chỉnh. Nhưng——\\nnếu là ý tưởng của cá nhân tôi…… gọi là mộng tưởng, hay mong muốn thì đúng hơn.」"
1931 = "「Đường sắt sang trọng dành cho giới thượng lưu, người lớn tuổi. Còn bản thân mình thì đi máy bay\\n——Ý thức phân chia giai cấp có khi lại càng tăng tốc hơn cũng nên.」"
1934 = "「Vậy sao. Ehehe.\\nNếu thực sự là vậy thì em vui lắm!」"
1938 = "「Hai người đã cất công mang đến tận đây sao.\\nỪ. Tôi rất sẵn lòng giương nó lên.」"
1940 = "「Ký tên là được đúng không?\\nEhehe, tự dưng thấy hơi ngại ghê á~」"
1943 = "「Cuối cùng cũng đến lúc rồi sao.\\nHachiroku, Hibiki. Nhớ kiểm tra lại đồ đạc kẻo quên nhé.」"
1953 = "「Nghĩ đến thời gian làm thủ tục xuất cảnh,\\nthì cũng sắp đến lúc rồi.」"
1956 = "「Rồi em bắt đầu vẽ được tàu hỏa. Vẽ được thị trấn.\\nLần này——có lẽ là cả tương lai của hai quốc gia nữa!」"
1959 = "「Những việc có thể làm…… cháu nghĩ là có rất nhiều.」"
1960 = "「Được trải nghiệm một chuyến du lịch gia đình tuyệt vời mà\\nmột Railord khó lòng có được, và điều đó lại còn kết nối với một tuyến đường ray mới.」"
1961 = "「Giường nằm. Chạy đêm. ——Tân Cán Tuyến.」"
1963 = "「Một câu chuyện hay, rất dễ hiểu. Dưới tán cây đại thụ đang vươn cao\\nsẽ tập hợp vô số trí tuệ. ——Vì vậy, tôi đã tìm kiếm điều đó.」"
1965 = "「Nhất định sẽ đơm hoa kết trái, xum xuê cành lá. Bằng bộ rễ đó, bằng cành lá đó,\\nhãy để chúng lan tỏa khắp toàn bộ lãnh thổ của Trọng Quốc và Hinomoto.」"
1966 = "「Ch-Cheese.」"
1971 = "「Suika——」"
1973 = "「Suika……」"
1985 = "「Suika cũng có chung suy nghĩ với Zhihuan. Hơn nữa, đơn giản là\\nSuika cũng muốn đi tàu Bắc Đẩu Nam Đẩu, và đi vòng quanh 108 vì sao.」"
1987 = "「Suika cũng sẽ trở thành sức mạnh cho điều đó. Lên Bắc Đẩu và Nam Đẩu.\\nVà cả đường sắt siêu tốc nữa. Suika muốn đi cùng Zhihuan.」"
1989 = "「Suika cũng nghĩ như vậy. Hơn nữa, việc ngồi tàu trong thời gian dài như thế,\\ndù có chuẩn bị toa hành khách kiểu gì đi nữa, thì gánh nặng lên hành khách cũng rất khắc nghiệt.」"
1991 = "「Suika và Zhihuan cũng đứng cạnh nhau đi.」"
1992 = "「Nếu thiết lập những phần thưởng hấp dẫn, thì chắc chắn sẽ\\ntạo thêm động lực tham gia, Suika cũng nghĩ vậy.」"
1994 = "「Suika!? ——A」"
1996 = "「Cứ thế này mãi thì tốt biết mấy nhỉ.\\nEm muốn cứ tiếp tục như thế này mãi thôi.」"
1998 = "「Nếu nhìn thấy thêm những điều tuyệt vời hơn nữa, em sẽ lại tham lam muốn nhiều hơn,\\nvà chắc chắn sẽ không thể tóm gọn vào một bức tranh được mất.」"
2003 = "「Nói đúng hơn là…… quyết định cuối cùng có lẽ thuộc về những người cấp cao hơn.」"
2004 = "「Cảm ơn anh. Em sẽ cố. Nhưng mà——nhỡ may em mà ngáy ngủ,\\nthì anh gọi em dậy nha~」"
2009 = "「Cảm ơn! Hẹn gặp lại!!」"
2010 = "「Cảm ơn, cảm ơn.」"
2011 = "「Cảm ơn. Thầy Soutetsu.\\nTôi đã luôn tìm kiếm điều này.」"
2012 = "「Thầy đang nói——sẽ cho chạy đường sắt siêu tốc\\nbằng cách điện khí hóa hoàn toàn khổ tiêu chuẩn ở Trọng Quốc sao?」"
2019 = "「Được cả giới thượng lưu lẫn giới trẻ yêu mến, và mang tính thực dụng\\n——Sẽ trở thành một loại hình đường sắt hoàn toàn mới nhỉ. Đường sắt siêu tốc ấy.」"
2021 = "「Và cùng với vé trọn gói——vé Thủy Hử 108,\\nđể mọi người đi vòng quanh các vì sao là các nhà ga địa phương, DISCOVER CHINA!」"
2038 = "「Chuyện đó——tất nhiên rồi. Nếu được đặt hàng chính thức.\\nTất nhiên là em muốn nhận, và nếu nhận em sẽ dốc toàn lực.」"
2039 = "「Cũng rõ luôn. Chuyện nhỏ thôi.」"
2040 = "「Điểm giao thoa hoàn hảo giữa mong muốn của mọi người và đường sắt.\\nĐề xuất này đã vẽ ra điều đó một cách vô cùng sống động.」"
2041 = "「Cái nam châm dán tủ lạnh này trông cũng được lắm ạ.\\nLoại có hình Dongfeng 4 này. Em cũng muốn mua.」"
2042 = "「Đó là bản thảo đề xuất của chúng tôi, Đường sắt Ohimitera,\\nnhằm phục hưng đường sắt quốc gia Trọng Quốc ở thời điểm hiện tại.」"
2043 = "「Đó là một vai trò quan trọng mà chỉ Hachiroku mới có thể hoàn thành.\\nCảm ơn em vì thành quả tuyệt vời này.」"
2044 = "「Ảnh lấy liền, sao ạ?」"
2045 = "「Vì công việc, vì nhóm, vì gia đình. Quan trọng nhất là vì anh hai mà!\\nDù có lỡ không có hứng thì em cũng sẽ cố gắng hết mình.」"
2046 = "「Là một tuyến đường vòng tròn nhỉ. Rất nhỏ.\\nNhưng, là tuyến đường vòng tròn kết nối Hinomoto và Trọng Quốc.」"
2047 = "「Ra là vậy, nếu thế thì những người đã tận hưởng đại khu địa lý đầu tiên,\\ncũng sẽ muốn đi du lịch ở đại khu địa lý khác nhỉ.」"
2048 = "「Nếu vậy——」"
2049 = "「Công sức bỏ ra——\\nchắc chắn sẽ đơm hoa kết trái thôi ạ.」"
2050 = "「Điều đầu tiên tôi cảm nhận được trong chuyến thị sát lần này,\\nđó là \"đường sắt của Trọng Quốc vẫn đang sống\".」"
2051 = "「Vé trọn gói…… kiểu như đi tàu quốc gia Trọng Quốc thoải mái trong dịp Lễ hội mùa xuân sao?\\nCái đó——Suika nghĩ vé đó có vẻ cũng sẽ rất đắt.」"
2053 = "「Hơn nữa, nhu cầu thực tế về vận tải hàng hóa cũng rất lớn.\\nChính vì vậy, ngược lại, tôi đã tự hỏi \"Tại sao chuyện này lại đến tay chúng tôi\".」"
2054 = "「Với lại, phần thưởng. Ừm…… nước cam!\\nMua ở máy bán hàng tự động cũng được, anh mua cho em nha.」"
2055 = "「\"Một chút xíu\" đó, chính là hạt giống của cây đại thụ,\\nlà giọt nước khởi nguồn đấy. Thầy Soutetsu, cô Hibiki.」"
2058 = "「Đó là những vì sao như thế nào vậy?」"
2060 = "「Vậy thì phải làm sao!?」"
2062 = "「Vậy thì, nhờ anh nhé~」"
2064 = "「Nếu vậy, có thể giới hạn chỉ sử dụng tàu thường, hoặc chỉ\\ncó hiệu lực trong một khu vực thuộc sáu đại khu địa lý.」"
2066 = "「Vậy thì, coi như là trò chuyện phiếm——một câu chuyện phiếm vô thưởng vô phạt,\\nnhư một câu chuyện trong mơ, anh có thể kể cho tôi nghe được không.」"
2068 = "「Em thì——ừm…… ngại quá,\\nnhưng vì là kỷ niệm, nên em xin phép được ký tên ạ.」"
2071 = "「Như vậy thì không thể trở thành chuyến tàu du lịch đại diện cho Trọng Quốc được,\\nvà cũng không thể kéo dài tuyến đường ray kết nối trái tim của người dân Trọng Quốc.」"
2072 = "「Tức là——thầy Soutetsu——」"
2073 = "「Vậy thì nhất định phải chụp. A!」"
2079 = "「Đường dài thì dùng máy bay. Đường ngắn thì dùng ô tô Aircra.\\nSự phân chia cách sử dụng đó đã ăn sâu vào tiềm thức, đặc biệt là ở thế hệ trẻ——」"
2084 = "「Mong muốn của anh hai, của em, của chúng ta——của tất cả mọi người!\\nChắc chắn sẽ thành hiện thực, và chúng ta sẽ làm cho nó thành hiện thực!!!」"
2085 = "「Anh hai!?」"
2087 = "「Nếu số lượng đại khu địa lý hoàn thành tăng lên, thì cộng thêm\\nnhững món đồ lưu niệm khác vào phần thưởng tương ứng, cũng là một chiến lược hay.」"
2088 = "「Thầy Soutetsu.」"
2089 = "「Đường ray mà thầy Soutetsu vươn dài, là đường ray biết hát, biết kể chuyện.\\nTôi cũng muốn dệt nên điều đó trên tuyến đường sắt của Trọng Quốc.」"
2090 = "「Trên câu chuyện mang tên đường ray mà thầy Soutetsu vươn dài,\\nchuyến tàu được thiết kế——bức tranh minh họa của cô Hibiki sẽ chạy qua và tô điểm cho nó.」"
2091 = "「Thầy Soutetsu!!!」"
2092 = "「Thầy Soutetsu, cô Hibiki.\\nRất xin lỗi vì phải ngắt lời trong lúc hai người đang trò chuyện vui vẻ với cô Jiang, nhưng mà」"
2093 = "「Thầy Soutetsu, cô Hibiki, Railord Hachiroku.\\nNếu được, mọi người có thể viết vài dòng lên bức ảnh làm kỷ niệm không?」"
2094 = "「Thầy Soutetsu, cô Hibiki, Hachiroku.\\nNếu được, mọi người có thể cầm cái này không?」"
2095 = "「Không có gì phải xin lỗi đâu ạ.\\nEm rất sẵn lòng.」"
2096 = "「Ngài Soutetsu——em thực sự rất vui.\\nViệc ngài mong muốn như vậy, em cảm thấy vừa tự hào, vừa sung sướng.」"
2097 = "「Ngài Soutetsu!? Đó là——\\nMáy ảnh đang nhả ảnh ra kìa.」"
2098 = "「Ngài Soutetsu, xin hãy hô vang tiếng reo hò chiến thắng đi ạ.」"
2099 = "「Ngài Soutetsu, và cả Hibiki nữa. Cả những người đang sử dụng đường sắt hiện tại,\\nlẫn những người không sử dụng——đều đã được hai người thị sát kỹ lưỡng rồi mà.」"
2101 = "「Không đâu, ngài Soutetsu, Hibiki. Không phải vậy đâu.」"
2102 = "「Cảm ơn chị!」"
2103 = "「Cảm ơn thầy rất nhiều! Thầy Migita!!\\nLần tới, Suika muốn đi riêng với Zhihuan thôi.」"
2104 = "「Cảm ơn cô. Cháu sẽ trân trọng cô ấy.\\nChắc chắn, cháu sẽ làm cho cô ấy hạnh phúc nhất thế giới.」"
2109 = "「Rất tiếc, Zhihuan.\\nSuika không thể đồng ý với suy nghĩ đó.」"
2111 = "「Trước hết là 13 vì sao của Bắc Đẩu và Nam Đẩu. Tiếp đến là 108 vì sao của Thủy Hử.\\nĐể rồi sau đó cho chạy tàu siêu tốc trên toàn bầu trời, và đến tận Hinomoto.」"
2123 = "「23 tỉnh. 5 khu tự trị. 4 thành phố trực thuộc trung ương. 2 đặc khu hành chính.\\nTrước hết, liệu chúng ta có thể kết nối 34 khu vực đó lại với nhau một cách khéo léo hay không.」"
2124 = "「DISCOVER CHINA.」"
2272 = "Cô Jiang bật cười khúc khích."
2277 = "Không biết có phải sự phấn khích đã xua tan cơn buồn ngủ hay không.\\nHibiki đột nhiên ngồi dậy, nhìn chằm chằm vào tôi."
2278 = "Cả khi ở trong xe, lẫn lúc ở quán ăn nhẹ nơi chúng tôi dùng cháo buổi sáng, đều không thể nói chuyện."
2281 = "Dù nói vậy.\\nNhưng có vẻ như tôi cũng đã quá căng thẳng từ lúc nào không hay."
2287 = "Đã truyền đạt được rồi.\\nCảm giác chân thực đó khiến đầu lưỡi tôi trở nên trơn tru hơn."
2322 = "Không còn là sự bao bọc ép buộc,\\nmà là đưa thẳng tay phải ra——yêu cầu một cái bắt tay."
2324 = "Mặc dù vậy, cả \"tỉnh\" lẫn \"khu tự trị\" đều quá rộng lớn."
2326 = "Nhưng dù có đối thủ cạnh tranh nào đi chăng nữa,\\nnhững gì chúng tôi cần làm vẫn không thay đổi."
2328 = "Nhưng, chính vì vậy——\\ntôi càng cảm thấy mạnh mẽ rằng việc đánh giá cần phải được thực hiện một cách chính xác."
2330 = "Cuộc họp qua mạng có người đến muộn, có người rời đi giữa chừng, nhưng kết quả là gần như toàn bộ những người liên quan đến Đường sắt Ohito đều đã tham gia."
2332 = "Chỉ riêng khu tự trị Nội Mông Cổ đã có diện tích 1.183.000 km vuông.\\nGấp khoảng ba lần tổng diện tích toàn bộ Hinomoto là 378.000 km vuông."
2334 = "Bên cạnh Zhihuan đang lặng thinh,\\nHachiroku và Hibiki lặng lẽ gật đầu."
2355 = "Hachiroku không hề tỏ ra uể oải."
2358 = "Bàn tay của Hachiroku dịu dàng vươn ra."
2363 = "Mái tóc đen khẽ đung đưa.\\nHachiroku cúi đầu chào thật sâu——với tôi, và với Hibiki."
2365 = "Ánh mắt của Hachiroku, quả nhiên cũng khác với chúng tôi."
2366 = "Giọng nói của Hachiroku nghe có vẻ rất kỳ lạ."
2367 = "Suika đỡ lấy phần cuối câu yếu ớt của Hachiroku."
2368 = "Một giọng nói rất tĩnh lặng, nhưng tràn đầy niềm tin.\\nĐôi mắt dịu dàng nhìn Hibiki nay chuyển sang nhìn tôi."
2369 = "Tôi nghe thấy những giọng nói đồng thanh, thể hiện sự thấu hiểu sâu sắc.\\nHát, sao…… tôi chưa từng nghĩ tới điều đó."
2371 = "Hachiroku cẩn thận chỉnh lại chiếc giường chúng tôi vừa nằm,\\nphẳng phiu đến từng nếp nhăn trên ga trải giường."
2372 = "Lời nói của chúng tôi bị ngăn lại một cách rất nhẹ nhàng."
2375 = "Hachiroku mỉm cười, trông thật hạnh phúc và mãn nguyện."
2380 = "Nhìn Hibiki."
2402 = "Dù vậy, những gì chúng tôi nhìn thấy, những gì chúng tôi có thể làm,\\ntuyệt đối không bao giờ trùng khớp thành một."
2412 = "\"Say Cheese\", bà cất giọng vui vẻ, lớn tiếng."
2415 = "Dù hiểu rõ điều đó, nhưng\\n——tôi không thể ngăn lời nói và suy nghĩ của mình lại."
2418 = "Bởi vì cô Jiang vẫn luôn giữ im lặng\\nvà mải mê đọc đi đọc lại tài liệu mà chúng tôi vừa gửi."
2419 = "Bởi vì, đây là một giấc mơ.\\nLà khả năng vươn xa hơn nữa từ nhà ga cuối cùng."
2422 = "Những gì chúng tôi học được ở Trọng Quốc, cùng với ý kiến và ý tưởng của mọi người.\\nViệc tổng hợp lại tất cả những thứ đó đã tiêu tốn thời gian đến tận bây giờ."
2423 = "Dù trên bản đồ tuyến đường sắt quốc gia Trọng Quốc mà tôi thấy ở Bảo tàng Đường sắt Bắc Cầm,\\nđường sắt hiển nhiên cũng kết nối với Hồng Cảng."
2426 = "Trên chiếc giường mà em ấy từng vui sướng gọi là \"Giường của công chúa\",\\nem ấy nằm ườn ra như một chiếc bánh mochi bị nướng quá lửa."
2428 = "Trên bản đồ vẽ đơn giản Trọng Quốc, Hibiki nhanh chóng vạch một đường."
2429 = "Trên máy bay, một nữ tiếp viên hàng không xuất thân từ Hồng Cảng đã nói.\\n\"Đây là lần đầu tiên tôi nhìn thấy Railord\"."
2432 = "Trên tấm bảng mô phỏng dòng 8620,\\nlà dòng chữ \"Chào mừng! Đoàn Đường sắt Ohimitera\"."
2440 = "Khi vị trí đứng đã tự nhiên được định sẵn, người phụ nữ trung niên cầm máy ảnh\\nnở một nụ cười hiền hậu——"
2442 = "Mọi người gật đầu với tôi. Với nụ cười trên môi.\\nVậy thì bây giờ, hãy để tôi bắt nhịp."
2444 = "Cả hai đều đã lấy lại vẻ bình tĩnh.\\nLặng lẽ, và mạnh mẽ, gật đầu với tôi."
2446 = "Có thể cô ấy đang ám chỉ đến sự tồn tại của các nhà điều hành đường sắt nước ngoài\\ncũng được yêu cầu thị sát và đề xuất giống như chúng tôi."
2448 = "Ngồi ngoan ngoãn ở mép giường, với một nụ cười rất dịu dàng\\nvà mãn nguyện, em ấy lấp đầy trái tim tôi."
2449 = "Tìm hiểu thực sự rất kỹ.\\nBản thân điều đó khiến tôi thực lòng vui sướng. Nhưng mà, bây giờ thì——"
2451 = "Nhẹ nhàng vuốt ve mái tóc rối bời của Hibiki\\nđang chìm trong chiếc giường."
2453 = "Đã truyền đạt được rồi.\\nChỉ cần một lời là có thể hiểu được nhau, nên lời nói cũng trở nên thẳng thắn."
2456 = "Nếu là với Paulette, nếu là với Reina. Nếu là với chị Mayami, và Kisaki.\\nHoặc nếu là với Nagi, và Fukami."
2474 = "Một lần nữa, cô Jiang lại đưa tay về phía tôi."
2476 = "Bắt tay lại với cô Jiang, tôi giao tay trái của mình cho Hibiki.\\nHibiki nắm tay Hachiroku, Hachiroku nắm tay Suika."
2478 = "Một cái gật đầu mạnh.\\nKhông chỉ từ cô Jiang, mà cả từ Suika và Zhihuan."
2480 = "Cô Jiang bất ngờ nắm lấy tay tôi.\\nBằng đôi bàn tay nhỏ bé, cô ấy bao bọc lấy cả hai bàn tay tôi."
2481 = "Cô Jiang đã khéo léo gánh vác phần \"việc thừa thãi\"."
2483 = "Ánh mắt, và lời nói của cô Jiang, như đâm thấu tâm can tôi."
2485 = "Bản thân lời nói của cô Jiang, giống hệt như một bài thơ."
2487 = "Tay cô Jiang buông ra,\\nlần này lại bao bọc chặt lấy hai bàn tay của Hibiki."
2488 = "Đôi môi cô Jiang khẽ mở ra.\\nCùng với lời nói, một nụ cười mỉm hiện lên."
2491 = "Không xưng \"chúng tôi\" mà là \"tôi\",\\ncô Jiang dùng sức lắc mạnh đôi bàn tay đang nắm lấy tay tôi nhiều lần."
2494 = "Với cô Jiang, với Zhihuan, và với Suika.\\nLần này là một cái bắt tay rất ngắn."
2499 = "Tôi thực sự cảm thấy an tâm, thoải mái\\nvà vững dạ."
2508 = "Kết nối Trọng Quốc, và cũng kết nối Trọng Quốc với Hinomoto——\\nChúng tôi chỉ cần dốc toàn lực đề xuất một bản thảo cho chuyến tàu như vậy."
2509 = "Nếu là với Suika, giọng nói của Hachiroku có lẽ sẽ truyền đạt được trực tiếp nhất.\\nHachiroku ngay lập tức tiếp nhận lời nói chứa đựng tâm tư đó."
2518 = "Được khen ngợi hết lời.\\nTôi rất vui."
2542 = "Bàn tay của Zhihuan và Suika đan vào nhau như những người yêu nhau."
2544 = "Giọng của Zhihuan và Suika hòa quyện vào nhau một cách hoàn hảo.\\nHai người nhìn nhau, nở nụ cười thực sự vui vẻ."
2546 = "Tiếng reo hò của Zhihuan và Suika bị chặn lại.\\nGiọng nói tĩnh lặng của cô Jiang chứa đựng sức mạnh đến nhường ấy."
2549 = "Hướng về phía một người đi ngang qua,\\nZhihuan cất tiếng gọi và giao chiếc máy ảnh."
2551 = "Zhihuan nhận lại máy ảnh——\\nỒ, quả nhiên là vậy sao."
2554 = "Có vẻ như mọi suy nghĩ trong đầu Zhihuan cũng đã thay đổi.\\nHướng tới một đáp án duy nhất, chỉ vỏn vẹn bảy chữ."
2555 = "Zhihuan có vẻ cũng đã hiểu ra vấn đề."
2558 = "Zhihuan nhìn chằm chằm vào tôi.\\nỰc, yết hầu cậu ấy chuyển động mạnh."
2559 = "Trước giọng nói sắc bén của Zhihuan, Suika gật đầu và nhắm mắt lại."
2560 = "Zhihuan gật đầu.\\nVới khuôn mặt rạng rỡ. Ánh mắt hướng thẳng về phía tôi."
2568 = "Có lẽ. Là vô lý, thưa——\\nNuốt lại những lời định thốt ra, Zhihuan lộ vẻ mặt đau khổ."
2570 = "Tôi muốn chốt lại những điểm chi tiết nhất có thể.\\nNếu cứ mong muốn thì thời gian có bao nhiêu cũng không đủ."
2571 = "Chắc chắn là,\\ntrong bộ sưu tập của cha Paulette——"
2572 = "Cùng nhau gật đầu.\\nCả tôi, Hibiki và Hachiroku đều cảm nhận được phản hồi tương tự."
2574 = "Quả là anh em, tôi thấm thía nghĩ.\\nCách suy nghĩ và cảm nhận cũng dần trở nên giống nhau——"
2579 = "Tôi bắt tay thật chặt với bàn tay phải\\nmà cô Jiang vẫn đang đưa ra chờ đợi."
2581 = "Lời nhắn để lại trên bức ảnh.\\nBằng một giọng nói tươi sáng, lớn tiếng——"
2582 = "Một sức nóng đồng điệu đang chạy qua những bàn tay đang nắm lấy nhau của chúng tôi.\\nCùng một mong ước, hóa thành đoàn tàu chạy quanh."
2583 = "Bắt tay."
2585 = "Bắt tay lại với tất cả mọi người một lần nữa——\\nTôi cùng Hachiroku và Hibiki bước qua cổng xuất cảnh."
2587 = "Chỉ là để đền đáp công ơn của nhà Migita. Để bảo vệ nguồn nước của Ohimitera.\\nĐể tìm lại món đồ bị mất của một Railord tình cờ kết duyên."
2588 = "Chỉ cần thành thật viết ra những suy nghĩ lúc này thôi!"
2591 = "Tôi trả lại bức ảnh cho Zhihuan đang cười rạng rỡ."
2593 = "Nhận lấy máy tính bảng từ tay em ấy,\\ntôi vỗ nhẹ lên mu bàn tay, và Hibiki cứ thế chìm vào tấm ga trải giường."
2595 = "Như thể muốn dùng giọng nói để ngăn tôi cúi đầu,\\nHibiki vội vã——nhưng lại cất giọng vui vẻ."
2596 = "Nhìn Hachiroku."
2598 = "Đoàn tàu rùng rùng chuyển bánh——\\nToàn bộ cơ thể tôi cảm nhận mạnh mẽ được cảm giác đó."
2600 = "Dù muốn tập trung vào việc kiểm tra lần cuối,\\nnhưng tôi cũng phải cảnh giác tiếng ngáy của Hibiki nữa."
2602 = "Cố tình thả lỏng vai một cách cường điệu và thở hắt ra một hơi dài,\\ncả Hachiroku và Hibiki đều nở nụ cười ngượng ngùng."
2604 = "Vì vậy, tôi nghĩ.\\nTừ tận đáy lòng, tôi thực sự nghĩ vậy."
2605 = "Chắc chắn tôi sẽ nhìn thấy những thứ hoàn toàn khác, tích lũy những kinh nghiệm hoàn toàn khác.\\nVà lập ra một bản thảo hoàn toàn khác."
2608 = "Ý định kiểm tra nội dung của những thứ đó——\\nthậm chí tôi còn chẳng hề nghĩ tới."
2628 = "Lẩm bẩm bằng giọng yếu ớt, Hibiki ngã vật ra."
2630 = "Không hiểu sao, Hibiki lại đang trầm ngâm suy nghĩ."
2632 = "Như chợt nhớ ra điều gì, Hibiki mở cuốn sổ phác thảo."
2633 = "Giọng của Hibiki và Hachiroku đều thấm đẫm cảm giác thành tựu.\\nPaulette đã giao toàn quyền quyết định cuối cùng cho chúng tôi."
2635 = "Hibiki thu xếp lại hành lý.\\nTôi cũng vậy."
2636 = "Quả không hổ danh là Hibiki."
2639 = "Hibiki ngoái đầu nhìn tôi.\\nTrong cuộc họp chúng tôi chưa kịp bàn đến phần \"đặt tên\"——ừm."
2641 = "Hibiki ký một chữ ký điệu nghệ mà em ấy vẫn luôn dùng trong các bản vẽ thiết kế.\\nHachiroku thì viết chữ \"Hachiroku\" bằng những nét chữ nhỏ nhắn, nắn nót."
2643 = "Dù đang nằm ườn ra, em ấy vẫn ngẩng mặt lên.\\nHibiki nở một nụ cười rạng rỡ."
2644 = "Hehe, Hibiki cười khúc khích.\\nKhẽ nắm chặt tay lại, và chạm tay với Hachiroku trong tích tắc."
2647 = "Bàn tay của Hibiki chậm chạp, uể oải vươn ra."
2654 = "Cuộc sống ở Ohimitera, và những chuyến đi. Đường sắt đã cho tôi thấy——\\nhiện tại, quá khứ, và cả tương lai của chính bản thân tôi."
2656 = "Việc Hachiroku và Suika đã thắt chặt sự tin tưởng lẫn nhau.\\nNgay cả những thông tin không thể diễn đạt bằng lời, họ cũng truyền đạt cho nhau qua cộng cảm."
2657 = "Ngay cả cô Jiang, người vẫn luôn giữ thái độ trung lập và quan sát,\\ncuối cùng cũng tham gia vào câu chuyện."
2664 = "Dù có chọn mảnh ghép đó như thế nào đi chăng nữa,\\ncũng không thể nào hình dung ra được bức tranh tổng thể."
2666 = "Nhưng hiện tại——chỉ một điều duy nhất.\\nTôi đang ấp ủ một mong muốn chắc chắn, một mong muốn của riêng mình."
2668 = "Nhưng đền chủ đã liên lạc với các bên liên quan, và đạt được thỏa thuận\\ncông khai toàn bộ dữ liệu vì sự phát triển của đường sắt."
2672 = "Quả thực đây là một thiết kế khơi gợi tâm hồn hướng về đường sắt.\\nNếu vậy, thay vì làm món đồ kỷ niệm chuyến đi, thì ngay từ lúc bắt đầu chuyến đi——"
2676 = "Lời nói của tôi trở thành hiện thực,\\nHachiroku tròn xoe mắt ngạc nhiên."
2690 = "Sự an tâm và niềm vui to lớn mà tôi cảm nhận được khi nhìn thấy nó,\\nvừa như mới ngày hôm qua, lại vừa như một chuyện đã từ rất lâu rồi."
2692 = "Cuối cùng, cô ấy cũng cất tiếng."
2695 = "Tất nhiên, họp qua mạng cũng rất hữu ích. Nhưng\\nso với gặp mặt trực tiếp, kiểu gì cũng sẽ có chút khoảng cách."
2696 = "Đó là đôi mắt đã chứng kiến cả sự vinh quang lẫn suy tàn\\nnhư một phần phong cảnh của chính mình trong thời gian thực."
2702 = "Như thể chờ đợi điều đó, cô Jiang\\nmột lần nữa đặt câu hỏi cho tôi."
2704 = "Một dự án quan trọng đến thế này. Tôi muốn xóa bỏ cả \"chút khoảng cách\" đó,\\nvà trao đổi ý kiến trực tiếp trong chừng mực thời gian còn lại cho phép."
2705 = "Sau đó, cúi gập người.\\nLần này, em ấy cúi đầu chào căn phòng."
2707 = "Và Zhihuan, người vẫn đang nắm tay Suika,\\nđón lấy tay cô Jiang thì——"
2709 = "Những lợi ích có được nhờ điều đó,\\ntôi thực sự cảm thấy to lớn đến mức không thể đong đếm được."
2711 = "Và rồi, những bàn tay, vì khoảnh khắc sẽ đan vào nhau một lần nữa——\\nbây giờ lặng lẽ buông ra."
2713 = "Đó tuyệt đối không phải là một trải nghiệm đặc biệt nào cả,\\ntôi đã học được điều đó từ Hibiki, Paulette——và tất cả mọi người ở Ohimitera."
2717 = "Những giọng nói hòa làm một, những trái tim đồng điệu."
2718 = "Nghe em ấy nói tôi mới nhận ra."
2722 = "Rằng em ấy rất vui khi Master của mình, gia đình của mình được đánh giá đúng đắn,\\nnụ cười đó đã hùng hồn nói lên tất cả."
2725 = "Kể từ vụ tai nạn đó, tôi chưa từng một lần ấp ủ thứ gì như vậy.\\nTôi chỉ lấp đầy khoảng trống của bản thân bằng cách thực hiện mong muốn của người khác."
2732 = "Nếu tôi là đường ray, em ấy sẽ luôn khéo léo uốn nắn tôi,\\nđể tôi không chọn nhầm những nền đất yếu hay những đoạn đường hiểm trở."
2741 = "Tây Bắc, Hoa Bắc, Đông Bắc và Tây Nam, Trung Nam, Hoa Đông——\\nToàn bộ Trọng Quốc được chia làm hai nửa Nam Bắc."
2753 = "Suika di chuyển.\\nCô bé ôm chầm lấy Zhihuan, vùi mặt vào bộ đồng phục của cậu."
2754 = "Suika thốt lên một cách vô thức. Zhihuan định ngăn giọng nói đầy cảm xúc đó của cô bé lại,\\nnhưng đã bị cô Jiang cản lại."
2757 = "Suika ngước nhìn Zhihuan.\\nNhư làm nũng, nhưng lại sâu sắc, như muốn an ủi."
2758 = "Có lẽ cô Jiang muốn xác nhận cảm nhận chân thực của Suika,\\nmột người chưa xem tài liệu——không có kiến thức nền tảng về chuyện này."
2760 = "Nhưng, ánh sáng trong đôi mắt mở to của Suika lại vô cùng mờ nhạt."
2768 = "Nói đúng hơn là, tôi đã từng nhìn thấy một thứ tương tự."
2769 = "Nói rồi, Suika nhắm mắt lại.\\nKhi mở mắt ra, đôi mắt ấy giờ đây——được tô điểm bởi một thứ ánh sáng mạnh mẽ."
2772 = "Không, cả Nagi, Fukami, Hachiroku, Reina và Hibiki nữa……\\nTất cả những người mà tôi có duyên gặp gỡ, đều đã cho tôi thấy điều đó."
2778 = "Nếu nói về tấm gương đó, thì đền chủ Akai, ông Fuchi——\\nPaulette, chị Mayami, Kisaki, ông Mototada——"
2788 = "Từng lúc từng lúc, tôi chỉ làm những việc có thể làm vào thời điểm đó.\\nChỉ có vậy thôi, thế mà——"
2789 = "Tôi đang vượt quá phạm vi công việc được yêu cầu——\\nvượt qua cả kết quả mà mọi người đã thống nhất trong cuộc họp."
2790 = "Cảm giác chân thực đó, khiến trái tim tôi trở nên mạnh mẽ.\\nĐến mức tôi nghĩ rằng, chắc chắn sẽ thành hiện thực——và tôi sẽ làm cho nó thành hiện thực."
2791 = "Quả thực, đây là đề xuất mà chỉ chúng tôi mới có thể làm được.\\nChính vì vậy, tôi muốn truyền đạt nó một cách chắc chắn và mong được đánh giá đúng đắn."
2792 = "Đó là một điều gì đó rất đỗi thiêng liêng——\\ntôi cảm thấy nó giống như một sự mặc khải vô cùng cao quý."
2793 = "Giọng nói đó đã nhuốm màu buồn ngủ."
2794 = "Đôi mắt ấy, đang nhìn tôi.\\nLúc nào cũng vậy, luôn luôn nhìn tôi."
2797 = "Tiếng cười khanh khách nhỏ nhẹ."
2799 = "Vậy thì không còn gì phải do dự nữa.\\nGửi email cho cô Jiang――――xong rồi."
2801 = "Cùng với việc giải thể Teitetsu, bản thân người nắm giữ quyền lợi cũng biến mất.\\nĐền chủ Akai và Niiroku hoàn toàn có thể tư hữu hóa dữ liệu còn sót lại."
2802 = "Trông có vẻ buồn ngủ, nhưng lại rất hạnh phúc.\\nNhìn em ấy, tôi cũng cảm thấy được chữa lành."
2803 = "Tôi cũng ngờ ngợ là tình yêu của Zhihuan và Suika đã đơm hoa kết trái,\\nnhưng được xác nhận dưới hình thức này, tôi cũng thấy nhẹ nhõm hẳn——."
2804 = "Mặc dù đã được Paulette và nhóm Ohimitera kiểm tra kỹ lưỡng và xác nhận,\\nnhưng quả thực tôi vẫn cảm thấy nhẹ nhõm."
2821 = "(Tách!)"
2823 = "(Cả tôi, Hibiki, hay thậm chí là Hachiroku. Không một ai——\\ntừng mơ đến việc kết nối tuyến đường ray giữa Hinomoto và Trọng Quốc.)"
2825 = "1/260.\\nChỉ là một mảnh ghép duy nhất trong số 260 mảnh của một bức tranh xếp hình khổng lồ."

[selections]
