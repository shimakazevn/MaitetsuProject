[script]
1063 = "\"Chúng tôi\" có lẽ ám chỉ cô Jiang và cấp trên của cô ấy.\\nHoặc là dưới sự chỉ đạo của một thế lực \"khác\" ngoài chúng tôi——"
1066 = "……À. Đúng vậy. Tôi cũng thấm thía rằng mình thật may mắn.\\nCảm nhận được cả hạnh phúc lẫn sự sợ hãi——đồng thời, cũng thấy rất kỳ diệu."
1081 = "「Đường ray mà Kuha 26 chạy là khổ hẹp, khổ đường sắt 1067mm.\\nTốc độ tối đa trong vận hành thương mại dừng lại ở mức 100km/h.」"
1083 = "「Kuha 26 là tàu điện thử nghiệm tốc hành. Đoàn tàu đó đã được\\nphục chế hoàn toàn cho kế hoạch Nine Stars——điều này không sai chứ?」"
1086 = "「——\"Tương lai\" của Nine Stars ở Hinomoto,\\ncó cần thiết phải thúc đẩy ở Trọng Quốc không?」"
1089 = "「——Hibiki và Hachiroku, cả hai đều đã làm rất tốt.\\nCho tôi gửi lời cảm ơn từ tận đáy lòng. Cảm ơn hai người.」"
1090 = "「——Tân Cán Tuyến đêm giường nằm.」"
1092 = "「——Rất cảm ơn vì đã chăm sóc chúng tôi!」"
1113 = "「……Không biết từ lúc nào, chúng ta đã đi được một chặng đường khá xa rồi nhỉ.」"
1126 = "「……Giả sử có làm được đi nữa, thì từ sáng đến tối,\\nchỉ có việc ngồi tàu liên tục, làm sao mà đi tham quan được.」"
1127 = "「……Ra là vậy.」"
1131 = "「……Ừm. Tổng hợp thực sự rất tốt.\\nHãy gửi bản thảo này cho cô Jiang và nhờ cô ấy xem xét trước khi nộp chính thức.」"
1132 = "「……Dù có đi du lịch với ai khác, có lẽ tôi cũng sẽ có\\nnhững cảm xúc tương tự——nhưng dù vậy.」"
1135 = "「……Họ đã mời \"chúng ta\" chứ không phải ai khác đến thị sát.\\nTôi tin chắc rằng nếu theo hướng này, chúng ta có thể chứng minh được thành quả đó.」"
1136 = "「……Tôi biết là mình hơi dai dẳng,\\nnhưng việc kéo dài thời gian lưu trú thì sao」"
1139 = "「……Tôi cũng cảm thấy như vậy.」"
1141 = "「……Việc tôi thực sự được ban phước.\\nBây giờ, tôi cảm thấy mình cuối cùng cũng đã hiểu ra.」"
1144 = "「……Dongfeng sẽ trở thành ngọn gió đông, đi vòng quanh toàn bộ bầu trời của Bắc Đẩu và Nam Đẩu,\\nmang theo bình minh——thời đại mới, đến tận Hinomoto xa xôi.」"
1145 = "「……Discover——\\n\"DISCOVER CHINA\"——thì sao.」"
1148 = "「……Được Hachiroku nói như vậy, tôi cũng yên tâm rồi.」"
1149 = "「……Cuốn sổ tay mô phỏng vé tàu ngày xưa của Đường sắt Bayan này,\\nvà huy hiệu cài áo hình logo đường sắt quốc gia Trọng Quốc có lẽ sẽ là tài liệu tham khảo tốt.」"
1151 = "「……Vậy thì tốt quá rồi.」"
1152 = "「……Những chiến dịch kiểu này,\\nngành đường sắt Hinomoto đã có rất nhiều kinh nghiệm rồi phải không?」"
1426 = "「108 vì sao.\\nNhững vì sao mô phỏng theo Thủy Hử thì sao?」"
1428 = "「9.597.000 km vuông chia cho 36.750 km vuông.\\nTính theo tỷ lệ diện tích đơn thuần, Trọng Quốc lớn hơn Kyushu khoảng 260 lần.」"
1429 = "「Ban đầu là Kumakuma. Đồng hồ quả lắc, anh hai và chị hai.\\nĐó là tất cả những gì em có thể vẽ được.」"
1431 = "「Nếu vậy, cuốn sổ đóng dấu của rally thu thập con dấu.\\nDùng nó làm họa tiết cho mặt sau thì sao ạ?」"
1433 = "「Nhưng mà!」"
1443 = "「Là các đại khu gồm khu vực Trung Nam, khu vực Đông Bắc, khu vực Hoa Bắc,\\nkhu vực Hoa Đông, khu vực Tây Bắc, khu vực Tây Nam đúng không.」"
1473 = "「Đường sắt quốc gia Trọng Quốc——Lão sư, Zhihuan, và nhóm Suika——\\nĐầu máy của nhóm Suika, được mọi người tạo ra, bảo vệ và nuôi dưỡng.」"
1474 = "「Kỳ nghỉ dài ngày trung bình ở Trọng Quốc gồm hai đợt 7 ngày.\\nĐó là Lễ hội mùa xuân, tức là Tết Nguyên đán, và Quốc khánh. Vì vậy——」"
1476 = "「Nhưng, với giới trẻ Trọng Quốc hiện nay thì——\\ncó vẻ khó để khiến họ hứng thú với chiến dịch này.」"
1477 = "「Tốc độ tối đa theo thiết kế là 160km/h. Tốc độ này,\\nngay cả trong quá trình chạy thử sau khi phục chế, cũng đạt được một cách dễ dàng.」"
1479 = "「Tất nhiên rồi.」"
1480 = "「Đúng không! Cô Jiang! Đúng không? Anh hai.」"
1481 = "「Mọi người xếp hàng đi xếp hàng đi.\\nCác thầy cô đứng ở giữa——」"
1482 = "「Giả định thời gian di chuyển ban đêm là 8 đến 10 tiếng, và thời gian rảnh rỗi để tham quan.\\nCó thể thực hiện được. Và có thể dự tính được nhiều biểu đồ chạy tàu có vẻ khả thi.」"
1484 = "「Chỉ Đường sắt Ohimitera thôi thì không đủ. Sẽ cần phải tập hợp\\nnhiều trí tuệ và công nghệ hơn nữa từ hai nước Hinomoto và Trọng Quốc.」"
1494 = "「Làm mấy việc này, dù chẳng có gì cũng thấy vui lắm á!\\nEm có thể vẽ được một bức tranh to~ thật là to luôn.」"
1498 = "「Biến cả hai thành đầu máy chính và đầu máy phụ đẩy phía sau, thúc đẩy cả già lẫn trẻ\\nsử dụng đường sắt như một phương tiện giải trí trong kỳ nghỉ dài Lễ hội mùa xuân và Quốc khánh.」"
1499 = "「Hachiroku.」"
1501 = "「Hachiroku, xin lỗi nhưng em giúp tôi được không?」"
1504 = "「Rõ ràng chỉ là lặp đi lặp lại những việc giống nhau,\\nnhưng lại ngày càng tiến xa hơn, ngày càng thấy vui hơn——」"
1505 = "「Chà. Cả những thứ được bán trên xe đẩy bán hàng trên tàu nữa——」"
1506 = "\"Tạm biệt, hẹn gặp lại\"\\n——Cùng với tâm tư, trở thành món quà lưu niệm để lại."
1514 = "「Vậy thì, tôi sẽ!」"
1517 = "「Thiết lập hai chuyến tàu du lịch sang trọng là Bắc Đẩu và Nam Đẩu.\\nĐể hành khách có thể lần lượt đi vòng quanh vào dịp Lễ hội mùa xuân, Quốc khánh, v.v.」"
1518 = "「Đã rõ.」"
1527 = "「Bắc Đẩu Thất Tinh và Nam Đẩu Lục Tinh.\\nHai đoàn tàu du lịch sang trọng đi vòng quanh Bắc Thiên và Nam Thiên.」"
1529 = "「Bắc Đẩu Thất Tinh, Nam Đẩu Lục Tinh. Đối với cả hai chuyến tàu du lịch này,\\nSuika suy đoán rằng cảm xúc mà thế hệ trẻ dành cho chúng, có lẽ lại là sự xa lánh.」"
1531 = "「Ga Bắc Cầm, ga Tây Bắc Cầm, ga Thánh Đô. Bất kỳ nhà ga nào cũng vô cùng tráng lệ,\\nhành khách cũng rất đông. Tàu hỏa cũng là những phương tiện cực kỳ xuất sắc.」"
1538 = "「Bù lại thì cực~ kỳ vui luôn á! Tất cả những gì đã thấy!\\nNhững điều mới mẻ! Dù hơi vất vả nhưng em đã gom gọn được vào một bức tranh rồi.」"
1539 = "「Ra là vậy! Thế này thì thật tuyệt vời.」"
1540 = "「Ra là vậy. Bằng cách cố tình tạo cảm giác hoài cổ,\\ncó thể làm nổi bật sự khác biệt so với việc đi du lịch bằng máy bay nhỉ.」"
1576 = "「Chỉ cần em muốn tiếp tục, thì chắc chắn sẽ tiếp tục thôi.\\nNhững ngày tháng như thế này, những tuyến đường ray mới, tất cả mọi thứ.」"
1577 = "「Chỉ cần họ chịu lên tàu và đi du lịch thôi.\\nVới tuyến đường sắt và lãnh thổ nhường này. Chắc chắn sức hấp dẫn sẽ được truyền tải.」"
1580 = "「Đúng vậy đúng vậy! Anh hai thì không nói,\\nnhưng những gì em làm, thực sự chỉ là một chút xíu thôi.」"
1584 = "「Oa!」"
1586 = "「Oa! Tuyệt quá, chúc mừng hai người nha.」"
1588 = "「Oa! Ảnh lấy liền thật kìa!\\nĐây là lần đầu tiên em nhìn thấy tận mắt đó.」"
1590 = "「Ôi! Đây là tấm bảng chào mừng ở sân bay Bắc Cầm mà.」"
1592 = "「Oa, máy ảnh hoài cổ kìa.\\nĐi một vòng lại thấy cực kỳ sành điệu và ngầu luôn.」"
1594 = "「Ôi, ôi ôi ôi! Hình ảnh hiện lên rồi kìa!\\nCứ như là phép thuật vậy.」"
1596 = "「Oa! ——À ừm, em cũng vậy! Em cũng sẽ giúp anh hai!\\nTất cả của em, lúc nào em cũng sẵn sàng trao cho anh!」"
1598 = "「Hau!!!」"
1599 = "「Ehehe~, vậy thì tốt quá.」"
1600 = "「Ehehe~, tuyệt quá.」"
1602 = "「Ehehehehe~, vậy thì tốt quá rồi!!\\nEm cũng, ừm. Cảm thấy như mình đã làm hết sức rồi á!!」"
1604 = "「!!? Tôi làm gì có tài năng như vậy. Như lúc nãy\\ntôi đã nói, tôi chỉ may mắn nhận được sự giúp đỡ của mọi người xung quanh thôi.」"
