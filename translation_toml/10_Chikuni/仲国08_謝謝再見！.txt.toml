1644 = "「Ừm——quả nhiên nếu cắt xén thời gian ngủ,\\nthì sự mệt mỏi của chuyến đi cũng sẽ kéo theo và bộc lộ ra ngoài nhỉ.」"
1646 = "「Ừm…… cuốn sổ tay có họa tiết vé tàu hoài cổ——hay nói đúng hơn,\\nthiết kế vé tàu hoài cổ, thay vì làm phần thưởng thì……」"
1648 = "「Ừm. Cùng lúc với việc cho Bắc Đẩu Thất Tinh và Nam Đẩu Lục Tinh chạy,\\nchỉ cần giương cao thêm những vì sao thúc đẩy thế hệ trẻ sử dụng đường sắt là được.」"
1649 = "「Ừm.」"
