1626 = "「À.」"
1627 = "「A」\\n「A!」"
1630 = "「Ahaha, đúng vậy nhỉ. Việc có vẽ tiếp bức tranh tiếp theo hay không.\\nNgười quyết định không phải chúng ta, mà là cô Jiang và những người khác cơ mà.」"
1631 = "「!」"
1632 = "「A! Để làm kỷ niệm!!! Để làm kỷ niệm cho chuyến đi, cho chuyến thị sát lần này,\\nxin hãy chụp chung một bức ảnh tập thể.」"
1635 = "「! ——Vậy thưa thầy Soutetsu, thầy còn phương án nào khác không?」"
