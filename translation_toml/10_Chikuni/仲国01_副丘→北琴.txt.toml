[script]
1321 = "……Với lại, ánh mắt của Hachiroku từ nãy đến giờ,\\ncứ đảo qua đảo lại giữa chỗ than antraxit và tôi."
1323 = "……Nói rồi, Hachiroku nhìn quanh."
1325 = "……Tôi đã cố tình gọi món khác với Hibiki,\\nnhưng thật đáng tiếc, món trứng cuộn này chỉ là thứ có thể thấy ở bất cứ đâu."
1329 = "……Tôi định bắt chuyện với em ấy,\\nnhưng tiếc là chẳng có phản ứng gì."
1330 = "……Kisaki đã bí mật cho tôi biết, đó là ý tưởng từ phía Trung Quốc\\nsau khi họ biết Paulette là thị trưởng."
1340 = "「Mầm mống tai họa của \\x%l大戦;#00ffc040;Đại chiến%l;#;.」"
1342 = "「Vì ngài Soutetsu đã dạy em mà.\\nMỗi phương tiện giao thông đều có đặc sắc và thế mạnh riêng ạ.」"
1343 = "「『Em muốn đi lắm chứ! Em muốn đi tàu lắm chứ!\\nNhưng em vừa là thị trưởng vừa là giám đốc, không thể bỏ trống cả tuần được——』」"
1345 = "「…………」"
1356 = "「……Xin lỗi em. Cảm ơn em.\\nAnh cũng sẽ cố gắng để bù đắp cho Hibiki, cho Hachiroku.」"
1359 = "「……Bù đắp những thiếu sót cho nhau, là gia đình, là cộng sự.」"
1365 = "「……Nine Stars phiên bản Trung Quốc, sao.」"
1366 = "「……Đường sắt Trung Quốc,\\nđã lụi tàn đến mức đó rồi sao?」"
1370 = "「……Có thể tưởng tượng được công việc quản lý xuất nhập cảnh vất vả thế nào nhỉ.\\nChỉ thỉnh thoảng gặp hành khách bất đồng ngôn ngữ thôi đã mệt lắm rồi.」"
1372 = "「……Không. Chắc là không còn gì đâu. Đăng ký dấu vân tay bằng máy xong,\\nsẽ có biên lai chạy ra. Lấy cái đó, với thẻ nhập cảnh.」"
1374 = "「……Nhớ lại thì, có lẽ cũng có vài điểm đáng ngờ.」"
1377 = "「……Em viết xong rồi. Có sai sót gì không, Hibiki.\\nEm kiểm tra giúp chị được không?」"
1382 = "「……Nói sao nhỉ, không có cảm giác chân thực——đến tận lúc này rồi\\nmà em vẫn cảm thấy lơ lửng, cứ như đang trôi lơ lửng trên không trung vậy.」"
1385 = "「……Đúng là vậy. Không ngờ đường sắt Trung Quốc lại nằm trong phạm vi hiểu biết của một người đam mê đường sắt ở Hinomoto, thật không thể tưởng tượng nổi.」"
1388 = "「……Đúng vậy. Có vẻ không được thoải mái cho lắm.」"
1397 = "「……Lúc đó trông Paulette,\\nthật sự rất tiếc nuối nhỉ.」"
1399 = "「……Đúng là, một cảnh sắc tuyệt đẹp nhỉ.」"
1400 = "「……『Mong mọi người đến với tâm thế như một tờ giấy trắng』. Có vẻ như anh\\nđã tiếp nhận câu nói đó một cách quá đỗi thật thà rồi.」"
1403 = "「……Sự ồn ào trước khi lên máy bay, cứ như là nói dối vậy.」"
1405 = "「……Internet là tuyến đường sắt thông tin chung của toàn thế giới.\\nVà các nhà cung cấp dịch vụ đang cho chạy các chuyến tàu trên tuyến đường sắt đó.」"
1408 = "「……Trên máy bay, kín chỗ rồi nhỉ. Hơn nữa, có rất nhiều hành khách\\nvới đủ màu da, màu tóc khác nhau.」"
1677 = "「Hoạt động sai\\n——quả thật là rất đáng sợ ạ.」"
1678 = "「Trông có vẻ vậy nhỉ. Cách ăn của cậu trông ngon miệng lắm luôn đó!」"
1683 = "「Dạ không——tôi nghĩ là hầu như không có đâu ạ.\\nCá nhân tôi cũng là lần đầu tiên trải nghiệm.」"
1684 = "「Không.」"
1686 = "「Không đâu, Hachiroku.\\nCông việc của em không chỉ có vậy đâu.」"
1688 = "「Dù có vẻ nói đi nói lại nhiều lần, nhưng em thực sự cảm ơn mọi người.\\nNgài Soutetsu, Hibiki——tất nhiên là cả chị Mayami nữa.」"
1693 = "「Ở thế hệ của tôi……những người độ tuổi 20, ít nhất là ở Hồng Cảng,\\nthì tôi nghĩ đó là một sự tồn tại không mấy quen thuộc——A.」"
1704 = "「Anh hoàn toàn không hiểu tiếng Trung——\\nÀ, không——」"
1706 = "「Có lẽ là vậy ạ. Nếu là xác thực cá nhân của Railord,\\nthì \\x%lタブレット;#00ffc040;thẻ bảng%l;#; này mới là thứ chắc chắn tuyệt đối ạ.」"
1708 = "「Cơ mà, có vẻ không giống như những gì chị Kisaki nói nhỉ.\\nChị ấy bảo là 『Cứ coi như phần thưởng, thoải mái đi』 mà.」"
1709 = "「Ra vậy. Em quan sát đến tận những chỗ đó rồi vẽ lại sao.」"
1712 = "「Không, Internet là một mạng lưới chung trên toàn thế giới,\\nnhưng mà, nhà mạng……ừm……phải nói sao cho dễ hiểu nhỉ.」"
1713 = "「Đúng là vậy. Khoan bàn đến Hibiki,\\nvai trò mà họ kỳ vọng ở chúng ta quả thực rất khó nắm bắt.」"
1718 = "「Hachiroku?」"
1720 = "「Hachiroku. Hay là đợi lúc Hibiki nghỉ tay,\\nanh nhờ em ấy đổi chỗ cho em nhé?」"
1722 = "「\\x%l共感;#00ffc040;Cộng cảm%l;#;! Là \\x%l共感;#00ffc040;cộng cảm%l;#; đúng không ạ!!」"
1726 = "「Bình thường chúng ta vẫn làm được như vậy mà. Thế nên chúng ta mới là một đội tuyệt vời nhất.\\nThế nên, chúng ta mới được mời đến đây.」"
1727 = "「Nói ra thì em, lúc nào cũng chẳng có gì thay đổi cả~.\\nQuan sát nhiều thứ, thu thập tài liệu, sắp xếp lại rồi giao nộp, đó là công việc của em.」"
1729 = "「Hả, dạ không!?」"
1731 = "「Quản lý xuất nhập cảnh, sao ạ?」"
1734 = "「Việc đi ra nước ngoài, quả là một chuyện rất phức tạp nhỉ.\\n……Dù trong đầu em cũng hiểu là vậy nhưng mà.」"
1741 = "「Cảm ơn ngài. Ngài Soutetsu.」"
1743 = "「Ra là vậy. Việc đã chuẩn bị sẵn những thứ đó, nghĩa là.\\nTrong trường hợp khẩn cấp, chúng ta có thể liên lạc thông qua Internet.」"
1744 = "「Ra là vậy. Cảm ơn em đã chỉ cho anh.」"
1745 = "「Ra là vậy. Giống như than bitum nhưng chất lượng cao hơn sao.」"
1746 = "「Ra là vậy. Hai người đang chia sẻ cảnh sắc với nhau sao.」"
1759 = "「Chỉ là phác thảo nhanh thôi mà~ Mời mọi người ăn nha.」"
1760 = "「Ôi chao!」"
1762 = "「Tôi hiểu! Tôi hiểu mà!!\\nTôi và anh hai lúc đầu cũng vậy đó.」"
1766 = "「Migita, Hachiroku——Em, không ngờ lại có ngày,\\nđược mang họ Migita……」"
1769 = "「Ôi.」"
1771 = "「Ể! Gian xảo quá đi!\\nAnh hai, anh hai, lau mặt cho em nữa.」"
1772 = "「Hả!?」"
1774 = "「Hả!? A——vâng, tất nhiên là được ạ.」"
1775 = "「Hả?」"
1776 = "「Hả!? Em, dạ, chuyện đó.」"
1778 = "「Chà, có cả thông báo bằng tiếng Hinomoto nữa.……Ufufu,\\ný nghĩa đúng như những gì ngài Soutetsu đã nói nhỉ.」"
1780 = "「Fufu. Vụn than dính ở mép kìa?」"
1782 = "「Haha, chuyện đó là đương nhiên rồi.\\nThực tế thì chúng ta đang lơ lửng trên không trung thật mà.」"
1784 = "「A……dấu vân tay sẽ thay đổi toàn bộ.\\nÝ nghĩa của việc đăng ký dấu vân tay sẽ hoàn toàn biến mất sao.」"
1785 = "「Hửm. Thật là thất lễ.」"
1787 = "「Hô. Không? Nếu vậy thì, có lẽ đây là——\\nKhoan đã.」"
1788 = "「À.」"
1790 = "「A, vậy là để đi tuyến Internet ở Trung Quốc,\\nthì cần phải có vé tháng của nhà cung cấp ở Trung Quốc đúng không ạ?」"
1792 = "「Ồ. Dễ hiểu thật đấy. Ra vậy,\\nem đã vẽ lại nội dung trong sách hướng dẫn sao.」"
