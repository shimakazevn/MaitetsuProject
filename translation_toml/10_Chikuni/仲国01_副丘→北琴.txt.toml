1846 = "「Ừm. Nó cũng liên quan đến việc cấm mang vật phẩm ra vào mà anh vừa nói lúc nãy. Vì vậy, lộ trình và phương tiện nhập cảnh bị hạn chế.」"
1847 = "「Vâng. Ngày 1 tháng 8. Họ muốn chúng ta đến Trung Quốc khảo sát trong năm nay. Chỉ đích danh anh hai, chị Paulette và em.」"
