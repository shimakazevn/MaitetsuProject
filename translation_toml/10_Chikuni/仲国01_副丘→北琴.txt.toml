1722 = "「\\x%l共感;#00ffc040;Cộng cảm%l;#;! Là \\x%l共感;#00ffc040;cộng cảm%l;#; đúng không ạ!!」"
1726 = "「Bình thường chúng ta vẫn làm được như vậy mà. Thế nên chúng ta mới là một đội tuyệt vời nhất. Thế nên, chúng ta mới được mời đến đây.」"
1727 = "「Nói ra thì em, lúc nào cũng chẳng có gì thay đổi cả~. Quan sát nhiều thứ, thu thập tài liệu, sắp xếp lại rồi giao nộp, đó là công việc của em.」"
