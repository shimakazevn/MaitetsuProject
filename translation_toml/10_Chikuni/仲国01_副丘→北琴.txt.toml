1894 = "「Tôi hiểu rồi, cảm ơn cô.」"
1897 = "「Vâng, ngài cứ nói ạ, ngài Soutetsu.」"
1899 = "「Nếu không giới hạn các địa điểm có thể xuất nhập cảnh như sân bay hay bến cảng,\\nquốc gia sẽ không thể nắm bắt được số lượng người xuất cảnh và nhập cảnh.」"
1900 = "「Mà nếu đã không quen nhìn thấy Railord thì——\\nA! Trước đó. Cô CA là người Trung Quốc sao?」"
1905 = "「Hỏi cho chắc thôi, em có định vẽ cả món này không?」"
1908 = "「Độ cacbon hóa cực kỳ cao, và nhiệt độ bắt cháy cũng cao ạ.\\nĐúng như tên gọi, khi cháy hoàn toàn, nó hầu như không tạo ra khói.」"
1909 = "「Em đã hoàn toàn hiểu rồi ạ.\\n……Việc ra nước ngoài, quả thực là——」"
1911 = "「『Vậy thì quyết định là Hachiroku』,\\nđúng một tuần sau khi nhận được lời mời. Ngày 8 tháng 8.」"
1920 = "「Đúng vậy. Nhưng, đừng vượt quá giới hạn cho phép.\\nDù sao cũng là ở nước ngoài. Nhỡ đâu lại vi phạm luật pháp gì đó thì nguy.」"
1921 = "「Đúng vậy. So với toa xe đường sắt thì sao?」"
