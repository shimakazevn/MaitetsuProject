1365 = "「……Nine Stars phiên bản Trung Quốc, sao.」"
1366 = "「……Đường sắt Trung Quốc, đã lụi tàn đến mức đó rồi sao?」"
1370 = "「……Có thể tưởng tượng được công việc quản lý xuất nhập cảnh vất vả thế nào nhỉ. Chỉ thỉnh thoảng gặp hành khách bất đồng ngôn ngữ thôi đã mệt lắm rồi.」"
1372 = "「……Không. Chắc là không còn gì đâu. Đăng ký dấu vân tay bằng máy xong, sẽ có biên lai chạy ra. Lấy cái đó, với thẻ nhập cảnh.」"
1374 = "「……Nhớ lại thì, có lẽ cũng có vài điểm đáng ngờ.」"
1377 = "「……Em viết xong rồi. Có sai sót gì không, Hibiki. Em kiểm tra giúp chị được không?」"
1382 = "「……Nói sao nhỉ, không có cảm giác chân thực——đến tận lúc này rồi mà em vẫn cảm thấy lơ lửng, cứ như đang trôi lơ lửng trên không trung vậy.」"
1385 = "「……Đúng là vậy. Không ngờ đường sắt Trung Quốc lại nằm trong phạm vi hiểu biết của một người đam mê đường sắt ở Hinomoto, thật không thể tưởng tượng nổi.」"
1388 = "「……Đúng vậy. Có vẻ không được thoải mái cho lắm.」"
