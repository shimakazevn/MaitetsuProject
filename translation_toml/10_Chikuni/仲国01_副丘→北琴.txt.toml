1942 = "「Phiên bản Trung Quốc của Nine Stars thì em hoàn toàn mù tịt mà.\\nNên phải thu thập tư liệu càng nhiều càng tốt thôi.」"
1943 = "「Thứ mà chúng ta không thể nắm bắt được, 『Tuyến đường sắt Trung Quốc\\nqua góc nhìn của Railord Trung Quốc』. Hachiroku. Anh muốn em nắm bắt điều đó.」"
1944 = "「Em nhớ là trước \\x%l大戦;#00ffc040;Đại chiến%l;#;, cũng từng có đầu máy xe lửa và Railord\\nđược xuất khẩu sang Trung Quốc……」"
1948 = "「Cho tôi xin một ly nước lọc là được ạ.」"
1950 = "「Thật là một niềm vinh hạnh ạ.」"
