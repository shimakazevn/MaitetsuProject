1964 = "「Mời mọi người.」"
1965 = "「Mời mọi người nha!」"
1967 = "「Rồi sau khi quyết định chị Paulette không thể đi. Họ liền bảo 『Nếu vậy, nhất định phải là Railord Hachiroku』.」"
1968 = "「Là vậy đó. Rồi chị Paulette vì quá bận rộn, cộng thêm việc kiến thức không thể nào là một tờ giấy trắng được——nên đã từ chối.」"
1971 = "「Xin lỗi quý khách. Cơm cá sốt và trứng cuộn, quý khách dùng món nào ạ?」"
1975 = "「Đưa hai tờ đó cùng với hộ chiếu cho nhân viên kiểm tra là được——trong sách ghi vậy đó!」"
1978 = "「Xin lỗi cô. Đang lúc bận rộn mà lại giữ cô lại lâu thế này.」"
1980 = "「Dấu vân tay……sao ạ.」"
1995 = "「Cả Hibiki nữa đấy? Cùng nhau tận hưởng thật nhiều nhé.」"
1996 = "「Nhưng mà……Hibiki thì là chuyện đương nhiên rồi, không ngờ đến cả Hachiroku cũng vậy.」"
1999 = "「Những thứ Hibiki không nhìn thấy, anh không nghe thấy, chỉ có mình em nắm bắt được. Đó chính là——」"
2000 = "「Hibiki, bữa trưa kìa. Chuyến bay cũng không dài, nếu cứ để đó là sẽ lỡ bữa đấy?」"
2003 = "「Em vẽ xong rồi! Cả cách dùng chén dĩa hay cách bày biện nữa. Biết đâu sẽ là gợi ý cho toa ăn thì sao.」"
2004 = "「Vâng ạ.」"
2008 = "「Đúng vậy.……Hô. 『Trên chuyến bay này đặc biệt có sự phục vụ của tiếp viên có thể nói tiếng Hinomoto』 sao.」"
2009 = "「Đúng không? Thế nên.」"
2011 = "「Ừ. Nghe nói dù có làm cách nào cũng không thể mang thân lái ra nước ngoài được mà.」"
2013 = "「Ừ. Đầu tiên, chuyện này được truyền đến Đường sắt Ohimitera thông qua Kisaki là vào ba tháng trước——tháng Tám.」"
2014 = "「Ừ.」"
2015 = "「Để ngăn chặn rò rỉ công nghệ——sao. Mầm mống tai họa của \\x%l大戦;#00ffc040;Đại chiến%l;#; vẫn còn sót lại ở những nơi không ngờ tới nhỉ.」"
2018 = "「Vâng. Đúng vậy ạ. Ngài Soutetsu. Hibiki đang cho em cùng ngắm cảnh sắc đó ạ.」"
2020 = "「Vâng. Tôi xuất thân từ Hồng Cảng. Tôi học tiếng Hinomoto ở trường đại học.」"
2022 = "「Vâng, em cũng nghĩ vậy ạ, ngài Soutetsu.」"
2023 = "「Định hướng, sao? Nhưng trong tình cảnh hiện tại, thì phương hướng nào cũng——」"
2030 = "「Đúng vậy ạ. Nghe nói giá cả cũng đắt tương đương, nên chúng em hầu như không bao giờ được nhìn thấy nó ở hiện trường đâu ạ.」"
2033 = "「Không, không sao đâu.」"
2034 = "「Đúng vậy. Vì 『Mong muốn một thứ khiến khách du lịch nước ngoài yêu thích』, nên 『Mong mọi người đến với tâm thế càng giống một tờ giấy trắng càng tốt』.」"
2035 = "「Đúng đúng. Và wifi thuê chính là vé tháng cho thuê—— Còn VPN là vé cho phép sử dụng các trang thiết bị trên tàu mà bình thường không dùng được ở Trung Quốc!」"
2036 = "「Ôi chao!」"
2046 = "「Để làm được điều đó thì phải qua cửa kiểm tra nhập cảnh đã! Hãy nhanh chóng, gọn gàng, vượt qua thôi nào!!」"
2049 = "「Với tư cách là một địa điểm du lịch——tất nhiên là cả với tư cách là đối tác kinh doanh ——đây chắc hẳn là minh chứng cho thấy đánh giá quốc tế về Trung Quốc đang ngày càng tăng cao.」"
2050 = "「Vì có ít Railord ra nước ngoài, nên có lẽ điều đó cho đến nay vẫn là một điểm mù.」"
2051 = "「Vẽ xong rồi! Ăn thôi! Anh hai, Hachiroku.」"
2052 = "「Vẽ suất ăn trên máy bay sao? ……Chắc cũng chỉ là đồ làm sẵn thôi, nếu làm tư liệu thì chụp ảnh là đủ rồi mà?」"
2056 = "「Đúng vậy. Chính vì thế, việc chúng ta chuẩn bị chu đáo cũng là giúp giảm bớt gánh nặng cho họ.」"
2058 = "「Thật sự rất biết ơn em. Hay nói đúng hơn là rất đáng tin cậy. Nếu không có Hibiki, không biết chuyện gì sẽ xảy ra nữa.」"
2060 = "「Nếu được vậy thì em rất vui……nhưng sao em cứ thấy…… vẫn chưa nắm bắt được vai trò mình cần phải hoàn thành trong chuyến khảo sát này.」"
2065 = "「Đúng vậy. Mà, nghe nói việc luật pháp Hinomoto áp đặt những hạn chế nghiêm ngặt đối với việc xuất cảnh bằng Aircra bay là vì mục đích quản lý xuất nhập cảnh.」"
2066 = "「Đúng vậy. Khi biết Railord không thể ra nước ngoài dưới dạng vật phẩm, họ đã chỉ cho chúng ta giải pháp tạo hộ tịch.」"
2072 = "「Ưu điểm và nhược điểm của tuyến đường sắt Trung Quốc qua góc nhìn của các Railord Trung Quốc. Em sẽ lắng nghe và thu thập những điểm cần cải thiện, những nguyện vọng của họ.」"
2076 = "「Nói đơn giản thì, đó là một hệ thống giúp em có thể sử dụng Internet bằng chiếc máy tính bảng này ngay cả ở Trung Quốc.」"
2079 = "「Mục đích của chuyến khảo sát là—— 『Lập dự án ý tưởng cho Nine Stars phiên bản Trung Quốc』.」"
2081 = "「Hơn nữa, trong công việc cũng là cộng sự mà. Việc bù đắp những thiếu sót cho nhau là chuyện đương nhiên thôi.」"
2085 = "「Hơn nữa em đang ở trong \\x%l整備体;#00ffc040;thân chính%l;#; mà. Thông tin thị giác dù sao cũng bị hạn chế đi nhiều ạ.」"
2089 = "「Với lại, bao bì thì đậm chất nước ngoài luôn rồi! Nước cam mà gọi là 『Trừng trấp』, thú vị ghê nhỉ~」"
2091 = "「Để lên tàu, cần phải có vé tháng của nhà cung cấp. Vé tháng của Hibiki là của công ty ở Hinomoto nên——」"
2093 = "「Tại sao cô ấy lại tìm hiểu, cô ấy thích điểm nào ở đó. Thị trưởng Paulette đã không nói cho chúng ta biết nhỉ.」"
2107 = "「Đúng rồi. Nhưng phải giao cho nhân viên quản lý xuất nhập cảnh mới được. Giao cho họ, làm xong thủ tục nhập cảnh thì cất đi ngay.」"
2110 = "「Ra là vậy. Nếu thế thì anh cũng giống như Hibiki. Chỉ cần làm như mọi khi là được sao.」"
2111 = "「Người nước ngoài nếu không đăng ký thì không được nhập cảnh đâu. Nhưng mà, thao tác đăng ký có vẻ đơn giản, làm bằng máy là được.」"
2112 = "「Chà, ai biết được. Nếu đã có chuyện 『Nine Stars phiên bản Trung Quốc』 thì chắc là họ có ý định phát triển.」"
2113 = "「Hộ chiếu. Là thứ quan trọng thứ ba sau sự an toàn của bản thân và \\x%lタブレット;#00ffc040;thẻ bảng%l;#;, phải luôn mang theo bên người không được rời nửa bước.」"
2134 = "「Đây là——không ngờ lại là than antraxit sao! Chà chà chà, đúng là một bữa thịnh soạn mà.」"
2135 = "「Dạ……em là Railord ạ.」"
2136 = "「Đối với quý khách là Railord, chúng tôi chuẩn bị than đá có được không ạ?」"
2137 = "「Không……mặt em sạch mà? Có dính gì cần lau đâu.」"
2138 = "「Chuyện đó, chẳng phải tra trên máy tính bảng là được sao ạ?」"
2139 = "「Có gì đâu. Thực ra thì ngay từ đầu chúng ta đã là gia đình rồi mà. Nếu biết có thể làm hộ tịch thì đã làm sớm hơn rồi, nhỉ?」"
2140 = "「Vẽ xong rồi sao. Nhanh thật đấy.」"
2141 = "「Đó là nguyện vọng tha thiết từ phía bên kia. Vì em là người có công lớn trong dự án Nine Stars, lại còn am hiểu lịch sử đường sắt Hinomoto nữa.」"
2142 = "「À——đúng là có lý.」"
2143 = "「Vậy thì! Ghi cả chuyện dấu vân tay vào báo cáo là được mà! Biết đâu lại giúp ích cho sự an toàn của người dân Trung Quốc thì sao.」"
2144 = "「Nó tốt hơn than bitum sao?」"
2145 = "「Chuyện đó, lúc nào anh chẳng bù đắp cho em! Thỉnh thoảng em cũng phải thể hiện chút đỉnh để báo đáp chứ!」"
2146 = "「Nếu nói vậy thì ngài Soutetsu cũng giống như mọi khi chứ ạ? Nghĩa là, đường ray của chúng ta.」"
2149 = "「Về tốc độ thì nó cũng áp đảo hoàn toàn so với Aircra bay. Cũng dễ hiểu khi hầu hết các phương tiện xuất cảnh từ Hinomoto đều là máy bay.」"
2151 = "「Đăng ký cả dấu vân tay sao. Quả nhiên là nghiêm ngặt thật đấy.」"
2152 = "「Ngoài ra, còn cần chuẩn bị gì nữa không?」"
2153 = "「『Với lại, em—— cũng có tìm hiểu chút ít về Đường sắt Trung Quốc rồi~~』 nữa!」"
2155 = "「Nhưng……còn em thì phải làm sao đây—— Nhiệm vụ chính của em là phải gắn liền với 8620 cơ mà.」"
2157 = "「Dạ……còn em thì.」"
2158 = "「Dạ——ngài Soutetsu…… Làm phiền ngài thì thật ngại quá, nhưng mà.」"
2160 = "「Thật là đáng yên tâm nhỉ.——A! Đúng không? Ngài Soutetsu. Nếu người đó có thể nói tiếng Hinomoto thì tốt quá nhỉ.」"
2162 = "「Vì vậy, với tư cách là Master, anh sẽ ra lệnh cho Railord Hachiroku.」"
2165 = "「Vậy thì, một lần nữa 『Mời mọi người』.」"
2167 = "「Trăm sự nhờ em. À, không——còn một điều nữa. Đây không phải mệnh lệnh, mà là mong muốn với tư cách là một thành viên trong gia đình.」"
2168 = "「Vậy thì, trăm sự nhờ cô giáo Hibiki. Chỉ cần làm xong thủ tục nhập cảnh, chắc chắn bạn của Kisaki sẽ đến đón chúng ta.」"
2170 = "「Vậy, cho tôi một ly giống thế.」"
2171 = "「Vậy thì tôi chọn trứng cuộn.」"
2173 = "「Vậy, Hachiroku kiểm tra phần của anh đi.」"
2175 = "「Vậy nên. Hibiki, Hachiroku.」"
2176 = "「Họ bảo chúng ta đến như một tờ giấy trắng mà, đương nhiên rồi. Khi tấm bản đồ đó bắt đầu được lấp đầy, thì anh cứ việc vạch ra đường ray thôi.」"
2178 = "「Ở Hồng Cảng, Railord là một sự tồn tại hiếm hoi sao?」"
2181 = "「Cách sử dụng wifi thuê, và cách dùng cái gọi là VPN. Em đã học và chuẩn bị kỹ càng rồi.」"
2182 = "「Tính cả độ rung lắc thì vẫn thoải mái hơn toa hành khách phổ thông ạ. Dù không bằng toa quan sát hạng nhất, nhưng chắc cũng tương đương hạng hai ạ.」"
2183 = "「Dù động lực chính là động cơ phản lực. Nhưng hiện nay hầu hết hệ thống định vị của các phương tiện giao thông chính đều bắt nguồn từ Railord.」"
2184 = "「Tay cầm sổ phác thảo và bút. Mắt vẫn hướng ra ngoài cửa sổ. Nhưng Hibiki tuyệt đối không độc chiếm cửa sổ cho riêng mình đâu ạ.」"
2185 = "「Vấn đề ngôn ngữ thì chắc chắn là có, nhưng nếu là \\x%l共感;#00ffc040;cộng cảm%l;#;, thì có lẽ em sẽ giao tiếp được với các Railord của Trung Quốc đấy.」"
2186 = "「Dù là đi khảo sát, nhưng hiếm khi có dịp ra nước ngoài lần đầu tiên. Hãy tận hưởng nào——chính công việc này. Và cả đất nước Trung Quốc nữa!」"
2187 = "「Ngài, ngài Soutetsu!? Cái này rốt cuộc là, họ đang thông báo điều gì vậy ạ?」"
2188 = "「Ngài……Soutetsu?」"
2189 = "「Cảm ơn lòng tốt của ngài, ngài Soutetsu. Nhưng em thích cảnh sắc nhìn từ chỗ này hơn ạ.」"
2190 = "「Dạ, ngài Soutetsu. Trò chuyện cũng tốt thôi ạ——nhưng đồ ăn của hai người, nếu không ăn sẽ nguội mất đấy ạ.」"
2191 = "「Tốt nhất là đừng để xảy ra rắc rối nào! Phải ôn lại kỹ càng thủ tục nhập cảnh mới được.」"
2193 = "「Máy bay là một trong những phương tiện an toàn nhất thế giới. Em cứ yên tâm.」"
2199 = "「!」"
2203 = "「!!? Internet của Trung Quốc và Internet của Hinomoto là hai thứ khác nhau sao ạ?」"
2207 = "「(Rào rào! Rộp rộp! Rào rào! Rộp rộp!) ……Phù. Cảm ơn vì bữa ăn. Ngon tuyệt vời luôn ạ.」"
2209 = "「Ok. Vậy, anh hai kiểm tra phần em viết nhé?」"
2211 = "「Ok. Cái này và……tiếp theo, trong sách ghi là cần phải đăng ký dấu vân tay ở cục quản lý xuất nhập cảnh.」"
2302 = "Khuôn mặt rạng rỡ, giọng nói vui tươi ấy khiến tôi vui sướng, vô thức xoa đầu em ấy, xoa cả lên chiếc mũ."
2307 = "Không phải \"thích cảnh sắc\", mà là \"cảnh sắc nhìn từ chỗ này tốt hơn\"——"
2309 = "Tôi vẫn thắt dây an toàn, vươn tay ra, lau mặt cho Hachiroku, người đang mang vẻ mặt nũng nịu."
2324 = "Nhưng——Hachiroku hôm nay có vẻ gì đó căng thẳng và bất ổn. Nếu vậy thì không nên ngắt lời em ấy."
2334 = "Có thể thưởng thức cả hai điều đó như một cảnh sắc duy nhất—— Có lẽ chỗ ngồi của tôi mới là chỗ ngồi đặc biệt nhất cũng nên."
2337 = "Em ấy lại nhìn quanh quất."
2339 = "Nhưng từ chỗ Hachiroku ngồi ngay cạnh ghế sát cửa sổ của Hibiki, thì dù không bằng Hibiki——à."
2342 = "Ánh mắt Hachiroku hướng ra cửa sổ. Chỉ thấy toàn mây và bầu trời——"
2344 = "Hachiroku đưa hai bàn tay nhỏ bé lên, chăm chú nhìn vào những đầu ngón tay."
2345 = "Chớp chớp mắt hai, ba cái. Và rồi đôi mắt Hachiroku lấp lánh, sáng rực lên."
2347 = "Nếu Hachiroku đã cố tình nói vậy, thì chắc phải có lý do gì đó…… À."
2348 = "Phù, một hơi dài——hoàn toàn không thể gọi là khí thải, một \"hơi thở\" ấm áp, đong đầy cảm xúc."
2351 = "Hachiroku say sưa vuốt ve vùng bụng dưới. Với một vẻ mặt dịu dàng đến mức khiến người ta liên tưởng đến hai chữ \"tình mẫu tử\"."
2353 = "Một tiếng reo vui sướng. Chỉ vậy thôi cũng đủ làm tan biến sự ngột ngạt trong khoang máy bay."
2356 = "Khuôn mặt điềm tĩnh đầy vẻ mãn nguyện của Hachiroku. Đôi mắt kiên định của Hibiki khi đang lia bút sột soạt."
2357 = "Sức sống đã trở lại trong đôi mắt Hachiroku. Nhìn thẳng vào mắt tôi."
2361 = "Nụ cười hé nở ấy khiến tôi nhận ra. Từ lúc lên máy bay, Hachiroku chưa hề cười một lần nào."
2362 = "Khuôn mặt vừa thở phào nhẹ nhõm, nhưng rồi lại lập tức xịu xuống."
2364 = "Nghe gọi tên, Hachiroku quay lại nhìn tôi với vẻ mặt vui sướng. Một luồng khí thải lớn phụt ra từ miệng em ấy."
2365 = "Hachiroku làm vẻ mặt hơi bối rối—— À, ra vậy."
2367 = "Em ấy bẽn lẽn. Đôi má ửng hồng hơn một chút, Hachiroku lại nhìn quanh."
2369 = "Gật đầu. Nhưng rồi lại nhìn quanh quất. Hôm nay là lần thứ mấy em ấy nhìn quanh như vậy rồi nhỉ."
2375 = "Mà, bên dưới đó thực chất là chiếc túi đựng hộ chiếu dạng quấn bụng, và cuốn hộ chiếu mà em ấy đã phải rất vất vả mới lấy được——khoan đã."
2376 = "Tôi cũng không rành lắm nhưng…… chắc cũng có thể lấy ví dụ nào đó cho Hachiroku dễ hiểu."
2382 = "Vừa đứng lên, thu dọn hành lý xách tay xong, Hibiki liền đẩy nhẹ vào lưng tôi."
2385 = "Ra vậy, Hibiki cũng đang bất an sao. Lần đầu ra nước ngoài, lần đầu qua cửa kiểm tra nhập cảnh——"
2386 = "Dù có châm chước cho việc đây là lần đầu ra nước ngoài, nhưng tôi vẫn thấy Hachiroku có vẻ hơi nhạy cảm quá mức……"
2392 = "Có vẻ muốn kiểm tra xem nó ở đâu, Hachiroku khẽ nhúm phần bụng váy lên một chút.……Một cử chỉ hơi hớ hênh."
2394 = "Dù không chuẩn bị được gì nhiều, nhưng bằng cách nào đó, chúng tôi đã kịp đến được đây."
2401 = "Khung cảnh trôi qua bên ngoài ô cửa sổ nhỏ của chuyến bay quốc tế—— Góc nghiêng của hai người khi chăm chú nhìn ngắm, trong sáng đến mức ngây thơ."
2403 = "À, không——"
2404 = "Ủa. Navi không cằn nhằn với Hachiroku sao——à không, con bé đã chọn lọc từ ngữ để thể hiện sự bất mãn một cách uyển chuyển rồi sao."
2407 = "「A, đây mới chính là ánh mắt của Hachiroku—— Lấp lánh sắc đỏ rực rỡ như than bitum đang bùng cháy.」"
2408 = "Hửm? À——hành khách khác gọi sao."
2411 = "Nhớ lại thấy thật hoài niệm. Bây giờ thì cứ ngỡ như chuyện từ thuở xa xưa nào rồi."
2419 = "Nói tóm lại là, chắc hẳn em ấy đang căng thẳng đến mức cứng đờ người rồi."
2420 = "Nghĩ lại, tôi chợt thấy biết ơn vô cùng. Dù Hibiki cũng đang trong tình trạng cực kỳ bận rộn——"
2422 = "Vậy thì để thiết đãi Hachiroku——một Railord, chắc chắn họ đã cất công chuẩn bị theo chỉ thị từ \"cấp trên\"."
2427 = "Ngoài lúc xác nhận an toàn khi làm nhiệm vụ, tư thế và ánh mắt của em ấy luôn rất điềm tĩnh. ——Đó mới là trạng thái bình thường của Hachiroku, nên tôi thấy khá bận tâm."
2442 = "Theo hướng nhìn của Hachiroku là một chiếc xe đẩy. Có cả suất ăn trên máy bay nữa, thật xa hoa. Khoan đã——"
2450 = "Tôi cũng sẽ làm như mọi khi. Là đường ray của mọi người——là Master của Hachiroku là được."
2451 = "Tôi cố tình cất giọng tươi tỉnh, vươn tay ra—— gõ nhẹ lên chiếc mũ của Hachiroku để em ấy ngẩng mặt lên."
2453 = "Thấy lạ, tôi đưa mắt nhìn sang bên cạnh thì——"
2460 = "Một khi Paulette ở lại, thì Reina chắc chắn cũng phải ở lại. Nhưng vẫn còn đền chủ Akai và Niiroku. Hoặc là anh Munakata chẳng hạn——"
2481 = "Cuốn sổ phác thảo lật lạch phạch—— Khuôn mặt ngẩng lên trông có vẻ vui mừng."
2483 = "Tôi hiểu lý do Hibiki trách móc. Vì đây là chủ đề dễ khiến người ta nghĩ rằng chúng tôi đang bàn mưu nhập cảnh trái phép."
2485 = "Cả ánh mắt của Hibiki và ánh mắt của Hachiroku, đều đang bị đóng đinh vào một chỗ."
2486 = "Hibiki đã nhanh chóng sắp xếp lại tình hình giúp tôi. Nhờ vậy, tôi có thể quay lại với vai trò mình cần đảm nhận mà không chút do dự."
2489 = "Hibiki cất máy tính bảng đi, lần này lấy ra một cuốn sách nhỏ bìa đen."
2491 = "Là bắt chước. Rất giống phong thái của Paulette. Khả năng quan sát có vẻ cũng phát huy tác dụng ở những chỗ thế này."
2493 = "Hibiki áp sát mặt vào mép trong của cửa sổ, ánh mắt cố định, vừa ngắm nhìn bên ngoài vừa lia bút."
2494 = "Hibiki đưa ánh mắt cầu cứu về phía tôi."
2498 = "Quả không hổ danh là Hibiki, tầm nhìn rộng thật."
2499 = "Giọng Hibiki tươi sáng, rạng rỡ. Thế nhưng Hachiroku lại cúi gầm mặt xuống."
2500 = "Hibiki lập tức lục lọi trong chiếc túi đặt dưới ghế trước, lấy ra một cuốn sổ phác thảo cũ."
2503 = "Hibiki vỗ nhẹ cái \"bộp\" vào chiếc túi đeo chéo."
2504 = "Vừa gật đầu, con bé vừa lấy ra chiếc máy tính bảng yêu thích của mình."
2511 = "Thông báo lần lượt bằng tiếng Trung, tiếng Anh, rồi đến tiếng Hinomoto. 『Khoảng 15 phút nữa sẽ hạ cánh xuống sân bay Bắc Cầm』."
2514 = "Sau khi kiểm tra, chúng tôi chuyền tay nhau kiểm tra chéo thêm một lần nữa. Nhờ mẫu hướng dẫn rõ ràng nên có vẻ không ai điền sai gì cả."
2518 = "Tôi đang định hỏi thêm, nhưng cô CA đã đẩy xe đi sâu vào trong lối đi mất rồi."
2520 = "Nhanh hơn cả lúc tôi định lên tiếng giải vây, Hachiroku đã tự mình nói rõ thân phận."
2523 = "Nhưng nếu bình tĩnh suy nghĩ lại, thì cho đến khi rời khỏi sân bay Bắc Cầm, chắc chắn chỉ có chúng tôi tự xoay xở với nhau."
2524 = "Tôi không nghĩ là hãng hàng không lại dự trữ than đá, huống hồ lại còn là 『loại tốt hơn cả than bitum』."
2526 = "Dù sao thì, cả ba chúng tôi đều là lần đầu đi chuyến bay quốc tế. Hơn nữa, lại còn là một lịch trình dày đặc."
2527 = "Hachiroku, người ban đầu vốn rất thù địch với bản thân Aircra, hiờ đây đã hoàn toàn tin tưởng Navi của Aircra như một người em gái."
2528 = "Mà ngay sau đó, em ấy đã nổi trận lôi đình mắng tôi là 『Hãy biết xấu hổ đi』……"
2529 = "Khi tờ thực đơn được đưa ra, khuôn mặt Hachiroku dịu đi trông thấy."
2530 = "May mà lúc này mọi người đều đang ngồi chuẩn bị hạ cánh—— Lúc lấy hộ chiếu ra vào, chắc tôi phải lấy thân mình che chắn cho em ấy mới được."
2532 = "Nhìn cách phục vụ này, có lẽ nào……"
2540 = "Cô CA tao nhã cúi đầu một chút, và lúi húi lấy thứ gì đó từ dưới khay——ồ."
2541 = "Cô CA gật đầu trước câu trả lời của chúng tôi và nhanh nhẹn chuẩn bị. Sau đó, cô ấy chuyển mắt sang Hachiroku và bất ngờ dừng động tác."
2542 = "Cô ấy cúi đầu cái rụp."
2552 = "Trên cuốn sổ phác thảo là mẫu điền thẻ nhập cảnh được vẽ rất to. Chúng tôi bắt đầu điền theo mẫu."
2553 = "Cô tiếp viên hàng không (CA) tinh mắt nhận ra, đưa ánh mắt dò hỏi \"Có chuyện gì sao?\", tôi cũng dùng ánh mắt để từ chối."
2562 = "Hachiroku không hề tỏ vẻ khó chịu chút nào—— Không hiểu sao Hibiki lại làm vẻ mặt hờn dỗi."
2564 = "Những suy đoán đan xen sự bất an đang cuộn trào trong tôi, nhẹ nhàng bị thổi bay đi mất."
2565 = "Những giải pháp cho những khúc mắc cho đến khi lấy được hộ chiếu, tất cả cũng đều nhờ có sự tư vấn từ phía họ."
2569 = "Vừa bị chỉ ra, động tác của Hachiroku lập tức dừng lại. Rồi em ấy rụt rè quay sang nhìn tôi."
2570 = "Vừa nghe tôi hỏi, Hibiki lập tức làm vẻ mặt nhẹ nhõm, và lại dán mắt vào cuốn sách hướng dẫn."
2571 = "Vì là chuyến khảo sát, nghe nói sẽ có hướng dẫn viên kiêm phiên dịch đi cùng, nên tôi đã hoàn toàn yên tâm——"
2573 = "Sơ đồ ghế ngồi là 2-3-2. Từ chỗ của tôi, tiếc là chỉ có thể nhìn thấy bầu trời từ đằng xa……"
2577 = "Cửa sổ——nói chính xác hơn là cảnh sắc trôi qua bên ngoài cửa sổ—— lẽ ra Hibiki phải luôn được độc chiếm."
2581 = "Nhờ con bé lên tiếng, mà tôi đã không cản trở việc di chuyển của cô CA."
2592 = "Kết thúc cuộc trò chuyện, cô CA lập tức đi sâu vào trong lối đi."
2593 = "Với dáng vẻ quen tay, cô ấy rót nước khoáng từ hộp giấy sang cốc giấy."
2594 = "Cuối cùng thì, chủ đề cũng quay trở lại đúng điều tôi muốn bàn bạc."
2595 = "Nói hơi khó nghe, nhưng chắc hẳn tâm lý con bé là muốn giảm thiểu những yếu tố bị \"để mắt tới\" dù chỉ một chút."
2596 = "Nói rồi, em ấy im lặng, lại nhìn quanh quất. Có vẻ sự tò mò đang dâng cao, Hachiroku cứ bồn chồn không yên."
2609 = "Đó là điều mà Hachiroku, Olivy đã dạy tôi, nên tôi có thể đưa ra chỉ thị cần thiết mà không chút do dự."
2610 = "Câu nói đó khiến tôi thấy vui."
2611 = "Làm như vậy thì Hachiroku cũng có thể thưởng thức cảnh sắc từ cửa sổ máy bay—— Là Hibiki mà. Chắc chắn con bé đã ý thức được điều đó."
2612 = "Vì mục đích của chuyến đi lần này là khảo sát——nhìn và nghe mọi thứ, từ đó nảy sinh ra các ý tưởng."
2614 = "Lối đi không được rộng cho lắm."
2616 = "Đều là người nhà cả. Nếu muốn nói chuyện thì vừa ăn vừa nói sẽ tốt hơn."
2617 = "Ý nghĩa tồn tại của Railord là, bảo vệ an toàn cho tuyến đường sắt. Hoàn thành vai trò được giao."
2620 = "Ngay sau đó là thông báo bằng tiếng Anh. Tôi cũng không phải là người giỏi tiếng Anh, nhưng cũng có thể hiểu được đôi chút."
2621 = "Dù có vẻ sợ sệt, nhưng tất nhiên, bên trong khoang máy bay rất đỗi yên bình—— Ai nấy đều đang thư giãn theo cách riêng của mình."
2627 = "Hạ cánh rồi. Hòa theo những hành khách xung quanh, chúng tôi cũng tháo dây an toàn."
2637 = "（Bong, bong, bong）"
2638 = "(Nếu bỏ qua điều kiện \"người có công lớn trong dự án Nine Stars\", thì chắc chắn có vô số ứng cử viên khác dễ dàng lựa chọn hơn nhiều.)"

[selections]
