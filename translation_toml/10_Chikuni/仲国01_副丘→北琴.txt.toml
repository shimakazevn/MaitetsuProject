1684 = "「Không.」"
1686 = "「Không đâu, Hachiroku. Công việc của em không chỉ có vậy đâu.」"
1688 = "「Dù có vẻ nói đi nói lại nhiều lần, nhưng em thực sự cảm ơn mọi người. Ngài Soutetsu, Hibiki——tất nhiên là cả chị Mayami nữa.」"
1693 = "「Ở thế hệ của tôi……những người độ tuổi 20, ít nhất là ở Hồng Cảng, thì tôi nghĩ đó là một sự tồn tại không mấy quen thuộc——A.」"
1704 = "「Anh hoàn toàn không hiểu tiếng Trung—— À, không——」"
1706 = "「Có lẽ là vậy ạ. Nếu là xác thực cá nhân của Railord, thì \\x%lタブレット;#00ffc040;thẻ bảng%l;#; này mới là thứ chắc chắn tuyệt đối ạ.」"
1708 = "「Cơ mà, có vẻ không giống như những gì chị Kisaki nói nhỉ. Chị ấy bảo là 『Cứ coi như phần thưởng, thoải mái đi』 mà.」"
1709 = "「Ra vậy. Em quan sát đến tận những chỗ đó rồi vẽ lại sao.」"
1712 = "「Không, Internet là một mạng lưới chung trên toàn thế giới, nhưng mà, nhà mạng……ừm……phải nói sao cho dễ hiểu nhỉ.」"
