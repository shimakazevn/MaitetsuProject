1399 = "「……Đúng là, một cảnh sắc tuyệt đẹp nhỉ.」"
1400 = "「……『Mong mọi người đến với tâm thế như một tờ giấy trắng』. Có vẻ như anh đã tiếp nhận câu nói đó một cách quá đỗi thật thà rồi.」"
1403 = "「……Sự ồn ào trước khi lên máy bay, cứ như là nói dối vậy.」"
1405 = "「……Internet là tuyến đường sắt thông tin chung của toàn thế giới. Và các nhà cung cấp dịch vụ đang cho chạy các chuyến tàu trên tuyến đường sắt đó.」"
1408 = "「……Trên máy bay, kín chỗ rồi nhỉ. Hơn nữa, có rất nhiều hành khách với đủ màu da, màu tóc khác nhau.」"
1677 = "「Hoạt động sai ——quả thật là rất đáng sợ ạ.」"
1678 = "「Trông có vẻ vậy nhỉ. Cách ăn của cậu trông ngon miệng lắm luôn đó!」"
