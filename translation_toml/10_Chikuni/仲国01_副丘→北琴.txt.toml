1796 = "「Hô. Vậy sao.\\nThế mà cô lại chuẩn bị sẵn cả than đá nữa.」"
1797 = "「Không đâu ạ. Chuyến bay tuy ngắn nhưng mong quý khách tiếp tục tận hưởng.\\nNếu có chuyện gì, xin cứ gọi tôi bất cứ lúc nào.」"
1798 = "「Không có gì đâu ạ. Tôi mới là người xin lỗi vì đã làm phiền lúc mọi người đang trò chuyện vui vẻ.\\nQuý khách có muốn dùng thêm đồ uống không ạ?」"
1799 = "「Hả!?」"
1803 = "「Hả!? M, mặt sạch……em vui lắm.\\nA!? Không phải, không phải ý đó——a!」"
1805 = "「A——」"
1807 = "「A…………một chút nữa thôi. Chỉ một chút này nữa thôi……ưm!\\nOk! Em ăn đây! Em cũng muốn vẽ lại suất ăn trên máy bay nữa.」"
1810 = "「Ừ……đúng là vậy. Bị hớp hồn luôn mà.\\n『Quả là một con búp bê xinh đẹp』——」"
1811 = "「A……ngài Soutetsu.」"
1812 = "「À. Ra là vậy.」"
1814 = "「À.」"
1816 = "「Aha, em biết mà. Anh hai có những lúc như vậy đó.\\nEm là em gái của anh hai mà——là gia đình mà!」"
1817 = "「A!」"
1818 = "「A!? Tôi thành thật xin lỗi. Tôi hiểu rồi ạ.\\nTôi sẽ chuẩn bị ngay.」"
1821 = "「A, không ạ. Về chuyện đó thì em không hề lo lắng chút nào.\\nVì nghe nói Navi của Aircra đang điều khiển vận hành mà.」"
1823 = "「A, lúc nãy em cũng định hỏi chuyện đó.\\nỞ sân bay mọi người xếp hàng dài lắm, cái wifi thuê đó rốt cuộc là gì vậy ạ?」"
1824 = "「A, vâng.」"
1826 = "「A, chuyện đó để em.」"
1828 = "「A, cô tiếp viên nói được tiếng Hinomoto!\\nUfufu, vui quá! Vậy, cho tôi một ly Trừng trấp! Một ly nữa!」"
1829 = "「Khoan!?」"
1831 = "「Ừm……Có lẽ nếu biết trước những điều đó,\\nđiều kiện tiên quyết 『càng giống tờ giấy trắng càng tốt』 sẽ bị phá vỡ mất.」"
1834 = "「Ưm……hầy——ưm……rồi!\\nĐây! Đây là mẫu nè!!」"
1836 = "「Ừm. Đúng vậy.」"
1838 = "「Hửm. Anh nghĩ đó là một đánh giá khá xác đáng đấy.」"
1839 = "「Ừm. Tất nhiên rồi.」"
1841 = "「Ừ. Có thể cầu cứu chị Kisaki hay chị Paulette.\\nYên tâm thì yên tâm thật đấy nhưng mà——」"
1842 = "「Ừ.」"
1843 = "「Vâng! Không cần anh nhắc em cũng sẽ tận hưởng mà!\\nCứ yên tâm nha? Anh hai, Hachiroku!」"
1846 = "「Ừm. Nó cũng liên quan đến việc cấm mang vật phẩm ra vào\\nmà anh vừa nói lúc nãy. Vì vậy, lộ trình và phương tiện nhập cảnh bị hạn chế.」"
1847 = "「Vâng. Ngày 1 tháng 8. Họ muốn chúng ta đến Trung Quốc khảo sát trong năm nay.\\nChỉ đích danh anh hai, chị Paulette và em.」"
1849 = "「Vâng. Quý khách muốn dùng loại nào ạ?」"
1851 = "「Hửm?」"
1852 = "「Hửm?\\nÀ——đúng vậy nhỉ.」"
1854 = "「A……đúng vậy nhỉ. Hinomoto là một quốc đảo,\\nnên việc đó tương đối dễ dàng phải không ạ?」"
1855 = "「Máy bay động cơ phản lực. Máy bay phản lực.——Đây là lần đầu tiên\\nem đi, nhưng nó khá là thoải mái nhỉ.」"
1858 = "「Tôi nhận được chỉ thị từ cấp trên là phải phục vụ\\ncho quý khách là Railord——xin lỗi quý khách.」"
