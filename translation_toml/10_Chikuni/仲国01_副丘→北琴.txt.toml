1861 = "「Thỉnh thoảng cũng có chuyện này sao?\\nViệc Railord lên chuyến bay quốc tế ấy.」"
1863 = "「Họ đã cảnh báo rằng,\\nviệc làm thủ tục nhập cảnh vào Trung Quốc có thể sẽ mất thời gian.」"
1864 = "「Trên máy bay không được dùng mạng đâu.\\nLỡ sóng điện từ làm thiết bị trên máy bay hoạt động sai thì sợ lắm.」"
1868 = "「Tuyệt quá nha! Hachiroku, suất ăn đặc biệt!」"
1885 = "「Thưa quý bà, quý ông.\\nChào mừng quý khách đã lên chuyến bay số 248 của Hãng hàng không Quốc tế Trung Quốc từ Fukuoka đến Bắc Cầm.」"
1886 = "「Thưa quý bà, quý ông. Chuyến bay dự kiến sẽ hạ cánh xuống Sân bay Bắc Cầm sau 15 phút nữa.」"
1888 = "「Em biết rồi! Mà này, anh hai cũng chuẩn bị đi!\\nChúng ta vẫn chưa điền thẻ nhập cảnh nữa đó!!」"
1890 = "「Vâng! Đã rõ thưa ngài Soutetsu.」"
1892 = "「Vâng. Em hiểu rồi ạ. Em nhất định sẽ làm như vậy.」"
