1741 = "「Cảm ơn ngài. Ngài Soutetsu.」"
1743 = "「Ra là vậy. Việc đã chuẩn bị sẵn những thứ đó, nghĩa là. Trong trường hợp khẩn cấp, chúng ta có thể liên lạc thông qua Internet.」"
