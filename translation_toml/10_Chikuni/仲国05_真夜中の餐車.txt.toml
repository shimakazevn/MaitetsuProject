2150 = "「Đúng vậy, khớp nối toa xe sẽ bị nén lại. Nhưng, nếu không\\nđạp phanh lại đúng lúc, toàn bộ đoàn tàu có thể bị chạy lùi.」"
2152 = "「Chào buổi tối, ngài Soutetsu.\\nMột đêm thật yên tĩnh, dịu dàng và tuyệt vời nhỉ?」"
2154 = "「Trở nên xa vời, chuyện đó――\\nTôi cảm thấy, chắc chắn là không phải vậy đâu.」"
2158 = "「Mẫu đầu tiên, nghĩa là, hình dáng\\ngần giống với máy thử nghiệm của Suika á?」"
2160 = "「Quả nhiên Hachiroku cũng đang phiền não về tình cảm dành cho thầy Soutetsu, và cách xử lý nó, không sai chứ?」"
2165 = "「Không, xin lỗi cô, chỉ là……」"
2166 = "「Thật may là không ai thức giấc.\\nGiá mà cứ thế này khắc phục được sự cố thì tốt.」"
2167 = "「Chưa từng trải qua sao――. Vậy à.\\nTrông hai người có vẻ tin tưởng nhau sâu sắc và mạnh mẽ đến thế cơ mà.」"
2168 = "「Đúng vậy. Vết bánh xe mà chúng ta có thể để lại,\\nthực sự rất mờ nhạt――rất mong manh.」"
2175 = "「Tại sao, lại có thể……\\nmạnh mẽ đến vậy――」"
2176 = "「Không thể kiểm soát. Đó là điều chắc chắn. Nhưng nếu tất cứu,\\nviệc trì hoãn ngày đón nhận sự ngừng hoạt động, là điều có thể.」"
2177 = "「Dù đó là mong muốn gì đi chăng nữa. Tôi.\\nNhất định sẽ đáp ứng mọi điều ngài Soutetsu yêu cầu ở tôi.」"
2180 = "「Tiếp theo là Suika. Hãy giải thích về\\nđoàn tàu hiện tại bao gồm cả đầu máy phụ đi.」"
2181 = "「Cô nghe thấy tiếng thở dài của tôi――\\nnên đã kết nối cộng cảm lại, rồi rủ tôi ra đây phải không?」"
2183 = "「Nhưng, vào ngày Zhihuan được nhận làm nhân viên Đường sắt Quốc gia Trung Quốc. Ngày hôm đó,\\nlần đầu tiên Suika nhìn thấy bóng dáng Zhihuan lọt thỏm trong bộ đồng phục.」"
2188 = "「Mở ra chức năng sinh học……」"
2189 = "「Tất nhiên là được rồi. Rất hoan nghênh.\\nSuika rất muốn biết về tình yêu của Hachiroku.」"
2190 = "「Sợ chứ. Tất nhiên rồi. Chỉ tưởng tượng thôi, cơ thể cũng run rẩy.\\nNhưng mà――. Nhưng mà……tôi……」"
2191 = "「Tôi sẽ đáp lại.」"
2192 = "「Vâng.\\nTất nhiên là có, và trưởng tàu cũng luôn túc trực ở đó.」"
2193 = "「Ở trạng thái khớp nối toa xe bị kéo căng,\\ntất cả các toa xe sẽ trở thành một khối tải trọng duy nhất.」"
2194 = "「Độ rơ của khớp nối toa xe sẽ phân tách đoàn tàu thành từng toa một cộng lại với nhau,\\nchứ không phải là một khối thống nhất. Tức là.」"
2198 = "「Đúng vậy――Đó quả thực là sự thật.」"
2199 = "「Đúng vậy nhỉ.」"
2200 = "「Chắc chắn, Suika sẽ hối hận.\\nNếu cứ tiếp tục lặp lại những khoảng thời gian lảng tránh Zhihuan như thế này.」"
2202 = "「Tuyệt quá……dù bị thu hút đến nhường này……nhưng chỉ một lòng\\n……muốn ở bên cạnh……trở thành Railord tốt nhất.」"
2203 = "「――Tuyệt thật. Cậu Zhihuan và Suika thì khỏi nói rồi,\\nnhưng trưởng tàu ở \\x%l車掌車;#00ffc040;toa xe trưởng tàu%l;#; cũng canh thời điểm quá hoàn hảo.」"
2208 = "「Thật á. Nó đang nghiêng kìa.」"
2210 = "「Hiểu rồi, hãy trả lời là tôi sẽ đến ngay.」"
2215 = "「Đúng vậy nhỉ. Nếu Suika không phiền, tôi cũng nghĩ cách đó là nhanh nhất,\\nđể có thể hiểu được……tôi đã nghĩ vậy.」"
2221 = "「Đoàn tàu dài, hành khách lại đông.\\nVới độ nghiêng này, để khởi hành êm ái thì hơi――a.」"
2224 = "「Và trong các toa hành khách, những vị khách gần như kín chỗ,\\nđều đang chìm trong giấc ngủ say nhỉ.」"
2227 = "「Cô biết không? Suika.」"
2229 = "「Nếu chấp nhận, sẽ không thể quay lại được nữa. Khi phong ấn được mở ra.\\nBởi vì Suika nhận thức rất rõ điều đó.」"
2231 = "「Nếu giống nhau thì Hachiroku. Xin Hachiroku. Hãy nói cho Suika biết.\\nGiả sử thầy Soutetsu, cũng mong muốn giống như Zhihuan thì.」"
2232 = "「Suika này――」"
2233 = "「Suika……」"
2250 = "「Ngay khi thức dậy, Suika đã định kết nối cộng cảm với Hachiroku.\\nNhưng rồi lại thôi.」"
2252 = "「Này? Suika……Nếu cô không phiền, lần này,\\nhãy nhận cộng cảm từ tôi nhé.」"
2254 = "「Suika……Suika thật tuyệt vời.\\nVậy mà có thể chịu đựng được mức độ……mức độ này――ha.」"
2255 = "「Nghĩ rằng không nên nghe lén, nên Suika đã ngắt cộng cảm.\\nChẳng bao lâu sau, thầy Soutetsu và cô Hibiki đã chìm vào giấc ngủ.」"
2258 = "「Suika, luôn khao khát mãnh liệt. Muốn mãi mãi ở bên Zhihuan.\\nMuốn tiếp tục chuyến hành trình, cho đến tận điểm cuối đường ray của Zhihuan.」"
2259 = "「Lý do Suika rủ Hachiroku đi uống trà là.」"
2263 = "「Suika xin giải thích về đoàn tàu hiện tại. Hướng di chuyển từ phía Thánh đô,\\nđầu máy phụ, đầu máy chính, 10 toa hành khách, 1 toa ăn, 1 \\x%l車掌車;#00ffc040;toa xe trưởng tàu%l;#;.」"
2265 = "「Suika!」"
2267 = "「Suika. Lý do cô sợ hãi và từ chối mở phong ấn là.\\nCó phải vì việc mở phong ấn sẽ là khởi đầu cho sự xuống cấp không thể sửa chữa?」"
2268 = "「Tình yêu là――Suika.\\nRốt cuộc, nó là thứ như thế nào vậy?」"
2276 = "「Bọn em sẽ sắp xếp số lượng đầu máy cần thiết để có đủ công suất dư thừa.\\nTrong trường hợp này, bọn em sẽ chờ những đầu máy cứu hộ đó.」"
2277 = "「Mọi người cứ yên tâm ngủ đi nhé.」"
2278 = "「Cảm ơn. Ngủ ngon.」"
2280 = "「Cảm ơn cô, Suika. Ngủ ngon nhé.」"
2292 = "「Phanh của trưởng tàu! Nhả ra!!!」"
2293 = "「Gần giống, hay đúng hơn là giống hệt. Các phụ tùng ngoại thất nhỏ lẻ, và\\ntỷ số truyền. Sự khác biệt về cấu tạo chỉ có bấy nhiêu thôi.」"
2295 = "「Vết bánh xe……dấu vết bánh xe để lại sau khi xe đi qua.\\n――Dấu vết mờ nhạt mà các bánh xe chủ động để lại trên đường ray.」"
2323 = "「Chuyện đó, rốt cuộc làm bằng cách nào.」"
2324 = "「Đó là――」"
2325 = "「Em nghĩ là khớp được. Nhờ Railord của đầu máy chính\\nvào \\x%l車掌車;#00ffc040;toa xe trưởng tàu%l;#;.」"
2327 = "「Làm sao, mà biết được chứ……」"
2328 = "「Đó là cách an toàn nhất và chắc chắn nhất. Một phương pháp không có sai sót nào.」"
2329 = "「Đang nghiêng sao?」"
2330 = "「Thế này là được á! Nén khớp nối toa xe lại, rồi cứ thế từ từ\\nkhởi hành là có thể chạy lại! Chắc chắn làm được á!!」"
2331 = "「Vậy sao――trong cái rủi có cái may nhỉ.」"
2332 = "「Vậy sao. Thế thì trước tiên, hãy xác nhận thuật ngữ đã.」"
2333 = "「Như vậy có thể đưa toàn bộ khớp nối toa xe của đoàn tàu về trạng thái nén.\\nChỉ cần xác nhận được điều đó, phần còn lại thì――」"
2334 = "「Nếu vậy thì, tôi cũng thấy nhẹ nhõm phần nào.」"
2335 = "「Điều quan trọng trong cách khởi hành này là khớp nối toa xe.\\nNói chính xác hơn là tạo ra độ rơ cho khớp nối toa xe.」"
2336 = "「Có phải là tình yêu hay không, chính bản thân tôi cũng không rõ nữa.」"
2337 = "「Toa hành khách này――\\ncó phải đang dừng ở giữa dốc không?」"
2338 = "「Đầu máy này――tôi ngạc nhiên khi thấy đầu máy phụ đã được nối với đầu máy chính rồi.\\nTôi không hề cảm nhận được chấn động nào. Tay lái tốt lắm.」"
2339 = "「Đầu máy này là đầu máy phụ. Đầu máy kéo chính đang bị hỏng là\\nđầu máy chính. ……Ở toa hành khách cuối cùng, có phanh của trưởng tàu không?」"
2340 = "「Là sự thiếu hụt công suất của đầu máy này. Với công suất hiện tại của nó,\\nkhông thể kéo nổi toàn bộ toa hành khách và đầu máy bị hỏng.」"
2350 = "「Vậy――vấn đề trên hết rốt cuộc là gì?」"
2352 = "「Vậy thì, tại sao.」"
2354 = "「Vậy mọi người.\\nXin hãy làm theo như vậy, trăm sự nhờ mọi người.」"
2356 = "「Vậy thì, đi thôi. Hachiroku, Hibiki.」"
2359 = "「Vậy thì, hiện tại toa xe đó sẽ được gọi là \\x%l車掌車;#00ffc040;toa xe trưởng tàu%l;#;.\\nĐến đây có ai có thắc mắc gì không?」"
2362 = "「Nhờ sự chỉ dẫn của Suika đấy ạ.」"
2363 = "「Toàn bộ phanh ngoại trừ phanh của trưởng tàu.\\nNhả rồiiiiii――ngay lúc này.」"
2365 = "「Thầy Soutetsu sao? Suika――\\nkhông hề nghe thấy tiếng bước chân nào như vậy――!!?」"
2366 = "「Đúng như thầy Soutetsu đã chỉ ra. Chỉ với phanh của trưởng tàu,\\nsẽ không thể chịu nổi lực kéo toàn bộ đoàn tàu lùi lại do độ dốc.」"
2367 = "「Ngài Soutetsu, như vậy có được không ạ?」"
2369 = "「Bàn bạc về chuyện gì vậy?」"
2370 = "「Cảm ơn mọi người đã đề xuất. Với phương án này,\\nngười lái tàu cứu hộ lâm thời Lưu Chí Hoàn, sẽ thử cứu hộ chuyến tàu Z49.」"
2372 = "「Người lái tàu dồn toa đưa đầu máy này đến đâu rồi á?」"
2375 = "「!!!!!」"
2376 = "「!!!?」"
2378 = "「!!!?」「Uể!?」\\n「Có chuyện gì vậy!?」"
2382 = "「(Phù~)」"
2383 = "「Kéo toàn bộ trọng lượng của 14 toa xe đầy ắp khách lên dốc cùng một lúc.\\nĐây là một việc khá khó khăn. Nhưng mà.」"
2552 = "Một thứ gì đó lấp lánh――như những giọt nước mắt thoát ra,\\ntừ hàng mi của cô bé, khẽ bay đi và biến mất."
2553 = "Tiếng Hibiki đang say sưa vẽ thứ gì đó.\\nChính vì âm thanh ấy mà tôi tỉnh giấc, tò mò muốn biết em ấy đang nhìn gì."
2558 = "Tầng trên mang lại cảm giác thoáng đãng, lại ở trên cao nên rất thú vị.\\nNhưng, thật tiếc――lại không thể thưởng thức cảnh sắc ngoài cửa sổ."
2561 = "Giỏi――thật sự rất giỏi.\\nCăng thẳng chú ý đến vậy mà hầu như không cảm nhận được chuyển động."
2563 = "Dù cậu Zhihuan và Suika có nói tiếng Hinomoto giỏi đến đâu,\\nnếu không thống nhất các thuật ngữ chuyên môn, có thể sẽ dẫn đến những nguy hiểm không đáng có."
2567 = "Dù vậy, Hibiki vẫn không tỉnh giấc.\\nEm ấy đang say ngủ――với nụ cười hạnh phúc trên môi."
2568 = "Nhưng, tôi đã hiểu ra một điều khác.\\nNhững đứa em gái đáng yêu của tôi, những người đã đơm hoa kết trái cho tình yêu của riêng mình."
2569 = "Dù vậy, bây giờ tôi sẽ trao cho cô ấy.\\nNhững điều quý giá mà ngài Soutetsu đã dành cho tôi."
2570 = "Không. Chắc chắn, tôi yêu ngài ấy.\\nChỉ là, có lẽ hình thái của tình yêu……hoặc chủng loại――"
2574 = "Thậm chí còn lẻn khỏi giường đi dạo――\\nmà không hề xin phép Master."
2591 = "Nhưng……lỡ như từ đoạn bằng phẳng chuyển sang đoạn dốc,\\nphanh bị mất tác dụng và bắt đầu bị kéo tuột xuống thì――"
2593 = "Nhưng, dù đã đóng cộng cảm,\\ntôi vẫn hiểu cô bé đang nói gì."
2595 = "Nhưng ở Trung Quốc, họ đơn giản là bổ sung những gì còn thiếu. ――Quốc đảo và đại lục.\\nĐó có lẽ là sự khác biệt nảy sinh từ sự phong phú của chính tài nguyên."
2598 = "Dù vậy, chỉ đối với tôi, người đã để lại vết bánh xe đó……\\nChỉ đối với tôi và ngài Soutetsu, chắc chắn bất cứ lúc nào――"
2600 = "Nhưng, có lẽ gần như cùng lúc đó,\\nngài Soutetsu cũng đã thức giấc mất rồi nên……"
2602 = "Nhưng tôi không được nhẹ nhàng như Suika.\\nNhỡ đâu lúc leo xuống giường mà――"
2604 = "Dù vậy, tôi vẫn――\\nchắc chắn chưa thực sự hiểu được \"tình yêu\" là gì."
2605 = "Nhưng, chính vì vậy tôi mới truyền đạt. Lý do khiến tôi bất chợt thốt lên,\\nchắc chắn, cũng là một trong những \"câu trả lời\"."
2608 = "Nhưng, dù vậy.\\nDù chẳng nhìn thấy gì, tôi vẫn có thể hiểu được."
2610 = "Mặc dù vậy, tôi lại cảm thấy Suika,\\nđang ở rất gần tôi."
2611 = "Nhưng âm thanh, và cả hơi thở,\\nđã truyền tải rõ ràng tình hình cho tôi biết."
2613 = "Có vẻ như đó chỉ là cảm giác đối với chúng tôi――\\nnhững người làm đường sắt mà thôi, tôi hiểu ra điều đó."
2617 = "Đã đón nhận việc ngừng hoạt động――"
2618 = "Dừng lại. Nhẹ nhàng. Không gây ra bất kỳ chấn động nào, chỉ trong chớp mắt."
2625 = "Tôi chờ nét bút của Hibiki."
2630 = "Hachiroku đón lấy tay cô bé trong giây lát.\\nBắt tay thật chặt, rồi lập tức buông ra, đưa tay chào nghiêm trang."
2634 = "Hachiroku cứ mềm nhũn ra.\\nNhìn kỹ thì mặt em ấy cũng rất đỏ."
2635 = "Từ cửa sau, Hachiroku rướn hẳn người ra ngoài.\\nNhìn bằng mắt thường, xác nhận khoảng cách với \\x%l車掌車;#00ffc040;toa xe trưởng tàu%l;#;."
2638 = "Khí xả của Hachiroku mạnh lên đôi chút.\\nHoặc có lẽ, em ấy đang kết nối cộng cảm với Suika――"
2639 = "Hachiroku khẽ gật đầu,\\nim lặng một lúc."
2649 = "Cộng cảm đã bị ngắt.\\nDù vậy, các mạch điện vẫn xôn xao chỉ vì nghe thấy giọng nói ấy."
2655 = "Tôi không thể nói \"Cô Jiang cũng vậy nhé\"."
2657 = "Hơn nữa, tôi muốn nhân cơ hội này làm nũng!\\nNên tôi đã tựa vào cánh tay của ngài Soutetsu."
2663 = "Dù đang ở trong bóng tối sau khi tắt đèn,\\ntôi vẫn có thể nhận ra đôi mắt của Suika đang cười."
2665 = "Dù tôi có say sưa đọc tiểu thuyết lãng mạn, manga thiếu nữ đến đâu đi nữa.\\nDù tôi có quan sát tình yêu của Hibiki――ở khoảng cách gần đến mức nào đi nữa."
2668 = "Một thoáng. Trống rỗng.\\nMột lúc sau, có tiếng Hibiki gật đầu."
2690 = "Nhưng, dù vậy……tôi cũng muốn cùng hai người họ,\\nngắm nhìn cùng một cảnh sắc từ cửa sổ tầng giữa."
2702 = "Hít vào, thở ra.\\nHít vào, thở ra."
2705 = "Buổi tiệc trà cùng với Suika,\\ntôi có cảm giác muốn giữ bí mật với cả ngài Soutetsu――"
2709 = "À――À――Quả không hổ danh là Hibiki."
2711 = "À, cộng cảm――\\nQuả thật trong những cuộc trò chuyện thế này, chắc chắn nên ngắt nó đi."
2713 = "Chà, giỏi thật.\\nNhả phanh từ từ, vô cùng tinh tế."
2715 = "Ánh mắt chạm nhau.\\nDù đã ngắt cộng cảm, nhưng tôi vẫn cảm nhận được một điều gì đó thật ấm áp."
2723 = "Khi được ngài Soutetsu dịu dàng ôm vào lòng.\\nKhi được ngài Soutetsu thì thầm 『Cảm ơn em』 bên tai."
2725 = "Lượng thông tin áp đảo đến mức, không hề nói quá, khả năng xử lý của tôi không theo kịp,\\nmạch tích hợp dường như sắp quá tải nhiệt, khiến tôi cảm thấy sợ hãi."
2726 = "Đâu đó trong Railord, có sử dụng bộ phận sinh học――\\nvà chỉ riêng bộ phận sinh học là không thể thay thế hay sửa chữa được."
2730 = "Suika đã tính toán hoàn hảo sự cân bằng giữa độ dốc và trọng lượng.\\nCậu Zhihuan đã đáp ứng hoàn hảo thao tác cực kỳ tinh tế được yêu cầu――"
2731 = "Bất chợt, im lặng.\\nDừng việc phác thảo, Hibiki giơ tay lên nhỏ nhẹ nói \"Dạ\"."
2732 = "Tiếng khí nén được bơm vào.\\nVà, chẳng bao lâu sau――"
2738 = "Tất cả bọn họ đều đã ngừng hoạt động từ rất lâu rồi\\n……đó có lẽ là cái giá không thể tránh khỏi cho việc giải phóng bộ phận sinh học――"
2739 = "Cả hai người họ, quả nhiên cũng đang căng thẳng."
2740 = "Một luồng cộng cảm có chút ngái ngủ mời gọi tôi.\\nHỏi tôi có muốn rời khỏi giường một lát để 『trò chuyện』 không."
2742 = "Bằng thì hiện tại. Những cảm xúc lúc này.\\nSuika dùng lời nói, tĩnh lặng kể cho tôi nghe."
2744 = "Vô cùng bối rối――\\nChắc hẳn, giọng nói của tôi đã khiến cô bé sợ hãi."
2746 = "Đôi môi mím chặt, mấp máy cử động nhỏ vài lần.\\nRồi chầm chậm――rất chầm chậm, mở ra."
2749 = "Một tiếng thì thầm. Hơn nữa có lẽ là tiếng Trung."
2750 = "Giọng nói ngái ngủ khiến tôi thấy có lỗi. Nhưng đồng thời cũng làm tôi an tâm.\\nChấn động và tiếng phanh đó. Tôi cảm thấy nó rất khủng khiếp nhưng……"
2751 = "Thật tò mò. Từ cửa sổ tàu, Hibiki đã nhìn thấy cảnh sắc gì.\\nNgài Soutetsu có cùng chiêm ngưỡng nó hay không."
2754 = "Một sự tĩnh lặng mang theo sự căng thẳng tột độ như dây cung kéo căng\\n――nhưng không một ai phát ra tiếng động hay giọng nói nào."
2755 = "Nếu không nằm xuống, nếu không im lặng,\\nkhả năng đánh thức ai đó sẽ tăng lên."
2762 = "Cây bút chì Hibiki đưa,\\ncô Jiang nhẹ nhàng đặt xuống lối đi không người."
2764 = "Cô Jiang ngậm miệng, thò mặt ra lối đi và nhìn quanh.\\nÀ……xung quanh có vẻ vẫn đang chìm trong giấc ngủ say."
2775 = "Tựa vào cánh tay ngài Soutetsu, tôi cùng ngài ấy bước đi.\\nVừa bước đi, tôi ngoảnh lại nhìn Suika một thoáng."
2777 = "Giống như cách tôi từng làm với Haro 2――đứa em gái thân thiết nhất của tôi ngày xưa.\\nNên tôi dùng những ngón tay nhẹ nhàng chải vuốt mái tóc ấy."
2779 = "Ngay cả việc trở mình cũng――"
2780 = "Bí ẩn nho nhỏ suốt bao năm qua đã được giải đáp.\\nChắc hẳn đã có vài đứa em gái của tôi mở được phong ấn đó."
2789 = "Cậu Zhihuan đỡ lấy Suika đang rơi xuống,\\nrồi nhanh chóng xỏ ủng cho cô bé và đặt xuống sàn――"
2790 = "Đây là lần đầu tiên tôi nghe thấy từ này."
2791 = "Tôi nghĩ đây là việc không tốt cho lắm.\\nNhưng chắc chắn chính vì vậy. Tôi lại cảm thấy một niềm vui kỳ lạ."
2798 = "Giường của cậu Zhihuan cũng để nguyên bệ bước chân như vậy――\\nBên này tôi cũng nhẹ nhàng đặt chân lên――Ây da!"
2804 = "Cùng gật đầu.\\nCậu Zhihuan và Suika cũng gật đầu thật sâu."
2806 = "Gương mặt của cậu Zhihuan và Suika đồng loạt sáng lên.\\nÁnh mắt chạm nhau trực diện, cả hai gật đầu mạnh mẽ."
2808 = "Khoảng cách giữa cậu Zhihuan và Suika cũng thật đáng yêu."
2828 = "Tất cứu, tất cứu, tất cứu――\\nCô bé lẩm nhẩm nhiều lần từ ngữ mà tôi đã nghe quen tai."
2829 = "Nếu nét bút của tôi cũng được hòa vào cuộc trò chuyện không lời ấy,\\nđược chia sẻ những suy nghĩ của mình, thì đó sẽ là một kỷ niệm đáng giá biết bao――"
2836 = "Phải làm gương――đó là điều mà mọi người xung quanh mong đợi, và cũng là điều bản thân mong muốn.\\nBởi vì đó đã trở thành một trạng thái bình thường."
2837 = "Hibiki và Hachiroku gật đầu với nhau."
2840 = "Vừa nói, tôi vừa nằm xuống lại."
2841 = "Trước tiếng lẩm nhẩm bất chợt của tôi,\\nHachiroku và Hibiki cũng gật đầu thật sâu."
2843 = "Tôi không biết. Tôi không biết.\\nTôi không biết. Tôi không biết."
2844 = "Tôi không còn cách nào khác ngoài việc chấp nhận kết luận đó.\\nNhưng, dù đã chấp nhận――"
2846 = "Giao phó tất cả, cứ để mặc cho cô ấy dẫn dắt,\\ntôi có thể bước đi đến tận cùng của màn đêm."
2854 = "Tôi vươn ngón tay ra.\\nĐầu ngón tay chạm vào mái tóc của Suika――Suika không hề tỏ ra khó chịu."
2855 = "Những khoảng thời gian chúng tôi đã cùng nhau tích lũy, những chặng đường ray chúng tôi đã cùng nhau đi qua.\\nTin rằng nó sẽ giúp ích phần nào cho tình yêu của Suika, tôi sẽ truyền đạt cho cô ấy."
2856 = "Hít thở sâu giống như chúng tôi. Và Hachiroku,\\nkhông hiểu sao lại ngước nhìn tôi với vẻ mặt như bị chói lóa."
2857 = "Ngắt cộng cảm, chúng tôi nói chuyện bằng giọng nói.\\nDù đã di chuyển đến toa ăn không người, nhưng giờ đang là nửa đêm."
2858 = "「Dù không vi phạm nội quy, nhưng đây là hành vi không nên làm đâu」\\nViệc khuyên can như vậy mới là vai trò của chúng tôi."
2859 = "Chuyến tàu của chúng tôi――chuyến tàu Z49,\\nkhông biết từ lúc nào đã lại trượt vào màn đêm."
2860 = "Điều duy nhất tôi có thể làm là không làm phiền hai người họ.\\nChỉ có thể lắng nghe tiếng bút chạy và tiếng cuốn sổ phác thảo được chuyền qua lại."
2862 = "Tôi thậm chí đã quên cả việc đóng cộng cảm lại.\\nVì đang là nửa đêm, lại ở nơi đất khách. Tôi cứ nghĩ sẽ chẳng có ai tiếp nhận nó."
2863 = "Đã làm phiền thời gian của Suika, làm phiền dòng suy nghĩ quan trọng của Suika,\\ntôi cảm thấy thật có lỗi và xấu hổ."
2866 = "Ngày mà ngài Soutetsu đã hỏi tôi――\\n「mong muốn」 của chính bản thân tôi, rốt cuộc là gì."
2868 = "Dù đã cố kìm nén giọng nói,\\nnhưng tôi có cảm giác nó vẫn vang lên khá lớn."
2871 = "Tôi có lẽ cũng đang mang một biểu cảm tương tự,\\nmột khuôn mặt tự hỏi \"Mình rốt cuộc đang bị hỏi cái gì vậy\"."
2873 = "Sự xôn xao dấy lên từ một nơi sâu thẳm nào đó trong tôi.\\nCó lẽ đó chính là điềm báo của việc mở phong ấn."
2874 = "Dù không hề ra lệnh, nhưng khí xả tự động lọt ra từ miệng tôi,\\ntạo thành một tiếng động lớn không ngờ――!"
2877 = "Hành động phi lý đó,\\ntrái tim tôi lại cảm thấy 『có thể hiểu được』."
2879 = "Khi dồn trọng lượng cơ thể lên, dù thế nào đi nữa,\\nbệ bước chân cũng sẽ hơi kêu cót két."
2881 = "Tình yêu thuần khiết, không tiếc nuối mà cô bé luôn dành cho cậu Zhihuan từ khi còn nhỏ.\\nVà khoảnh khắc hạt giống tình cảm ấy rực rỡ nở rộ thành tình yêu."
2883 = "Tôi kéo mạnh Hachiroku vào trong,\\nôm trọn em ấy vào lòng."
2885 = "Ấn tượng về một cậu thiếu niên của cậu Zhihuan đã biến mất.\\nĐứng trong buồng lái, cậu ấy nhìn thế nào cũng là một người lái tàu."
2886 = "Đó chính là――\\nước nguyện sâu xa của Railord, của một món đồ, tôi nghĩ vậy."
2889 = "Nếu có thêm tranh vẽ minh họa của Hibiki,\\nchắc chắn tôi sẽ có thể giải thích và truyền đạt được."
2891 = "Tôi nhẹ nhàng đóng cộng cảm lại.\\nSuika chớp mắt liên hồi."
2893 = "Hay những đứa em gái đã bị loại bỏ, tháo dỡ\\nngay khi vẫn còn đang hoạt động, tôi nhớ đến họ."
2894 = "Vì vậy, tôi muốn tìm hiểu sâu hơn,\\ntrái tim và mạch điện của tôi đã đi đến cùng một kết luận."
2896 = "Vì vậy tôi nằm xuống, nhưng cho đến khi sự cố được khắc phục,\\ntôi không nghĩ mình có thể chợp mắt được."
2899 = "Chính vì vậy, những điều nhỏ nhặt đến nhường này……\\nđối với chúng tôi, tất cả đều là những cuộc phiêu lưu lần đầu tiên trải nghiệm."
2900 = "Do đó, nói cách khác.\\nNhững gì tôi đang nghĩ……"
2903 = "Vì vậy, thật yên tĩnh."
2905 = "Vì vậy, tôi cũng đáp lại.\\nLời cảm ơn vì đã mời tôi đến buổi tiệc trà tuyệt vời hôm nay."
2908 = "Vì vậy, tôi càng\\nhạ giọng thì thầm nhỏ hơn nữa."
2909 = "Vì vậy, tôi cúi đầu chào cô Jiang,\\nxuống khỏi giường, nhanh chóng chỉnh đốn trang phục."
2913 = "Lời lẩm nhẩm cực kỳ nhỏ của tôi, lập tức được đáp lại\\nbằng những giọng nói cũng được hạ nhỏ hết mức."
2919 = "Càng kéo dài thời gian, khả năng làm phiền\\ngiấc ngủ của ai đó càng tăng lên. Vì vậy, tôi phải nhanh lên."
2931 = "Trong toa giường nằm, nơi đất khách quê người, khi mọi người đều đã chìm sâu vào giấc ngủ.\\nNếu là ở đây, thì ngay cả tôi cũng――"
2934 = "Khi đã nhận ra, thì rõ ràng là nó đang nghiêng.\\nNếu ngay từ đầu đã ở trạng thái này thì không có vấn đề gì lớn."
2955 = "Hibiki chắc đang rất muốn nhảy ra ngoài\\nđể phác thảo lại cảnh hỏng hóc này."
2956 = "Những ngón tay bận rộn của Hibiki cuối cùng cũng dừng lại.\\nVẽ sơ đồ quy trình để xác nhận――rồi, một nụ cười nở rộ."
2959 = "Hibiki mở cuốn sổ phác thảo ra."
2961 = "Những khớp nối toa xe ở trạng thái <Kéo căng> và <Có độ rơ>,\\nlần lượt được minh họa bằng hình vẽ."
2963 = "Nhẹ nhàng như một bản nhạc là nét bút của Hibiki.\\nTừng chữ từng chữ, như được khắc ghi xuống là nét bút của ngài Soutetsu."
2968 = "Tiếng của Hibiki chưa dứt,\\ncậu Zhihuan và Suika đã bắt đầu chạy về phía đầu máy."
2972 = "Một phản ứng dữ dội như thể phát ra tiếng \"phụt\"."
2973 = "Cùng lúc đó Hibiki đóng chặt cửa sau lại――"
2976 = "Quả là chính đạo. Hay vương đạo.\\nQuá chí lý, không có chỗ nào để phản bác."
2980 = "Và, hai người họ đang trao đổi những lời gì,\\nmột cách lặng lẽ đến tột cùng như vậy."
2987 = "Sự gượng gạo luôn đeo bám từ trước đến nay,\\ndường như đã biến mất sạch sẽ."
2990 = "Việc ngài ấy còn quan trọng hơn cả bản thân tôi, hơn cả 8620,\\nchắc chắn sẽ không bao giờ thay đổi dù tương lai có ra sao đi nữa……nhưng……"
3000 = "Railord phiên bản thử nghiệm và Railord phiên bản đầu tiên.\\nCả hai đều luôn mang trên mình trọng trách của người chị cả."
3003 = "Để truyền đạt, vì muốn truyền đạt, mà phải cẩn trọng lựa chọn từng từ ngữ.\\nĐó là một hành động thật bứt rứt, nhưng cũng thật tao nhã và dịu dàng biết bao."
3004 = "Đề phòng lúc nửa đêm tôi muốn di chuyển――\\nem ấy đã để nguyên bệ bước chân mà không cất đi."
3008 = "Cho dù có tính toán――không, có cố gắng tất cứu đến mức nào đi nữa,\\ntôi vẫn luôn bị mắc kẹt trong vòng lặp, chẳng thể tìm ra dù chỉ một chút đáp án."
3009 = "Có thể khẳng định.\\nÝ chí, suy nghĩ và lời nói, cùng vẽ nên một câu trả lời với cùng một tốc độ."
3011 = "Giờ đây, chỉ trong một khoảng thời gian ngắn ngủi,\\nmình đã ấp ủ biết bao nhiêu 「mong muốn」 rồi."
3013 = "Nhưng, các mạch điện lại đang xôn xao.\\nNhững mảnh vỡ của thế giới mà tôi vừa chạm vào, đang náo động bên trong tôi."
3014 = "Tiếng chạy tàu rất khẽ, cạch cạch, xình xịch,\\nlấp đầy khoảng trống của sự im lặng."
3018 = "Khi thiếu hụt vật tư và tài nguyên, người Hinomoto\\nthường cố gắng xoay xở bằng 『sự khéo léo tại hiện trường』."
3031 = "Chức năng sinh học――bộ phận sinh học.\\nNếu là tin đồn đó, tất nhiên tôi cũng biết."
3032 = "Một vết thương được khắc sâu, rất sâu.\\nMột vết thương không bao giờ có thể xóa nhòa."
3034 = "Quả thực, rất sâu sắc, và rất mạnh mẽ.\\nTôi vô cùng tin tưởng ngài Soutetsu――"
3037 = "Bởi vì cho đến khi tàu an toàn chạy lại,\\ncô Jiang chắc chắn sẽ không chợp mắt."
3041 = "Một lời mời thật tuyệt vời.\\nĐâu đó trong mạch của tôi, một sự phấn khích nóng hổi dâng lên."
3047 = "Không gian chật hẹp, chẳng thể nào cử động thoải mái được."
3055 = "Tôi nghe thấy tiếng phanh khẩn cấp.\\nNếu không phải do ngái ngủ mà sinh ra ảo giác, thì ngay trước đó còn có cả một chấn động."
3056 = "Nói xong, Hachiroku im lặng một lát.\\nMột lúc sau, em ấy cất giọng kìm nén. Nhưng vẫn toát lên sự an tâm và vui mừng."
3060 = "Cảm thấy xấu hổ, tôi lại nhớ về."
3062 = "Đúng như nghĩa đen, chỉ cần nhìn qua là hiểu rõ.\\nBởi vì Hibiki, tuyệt đối không bao giờ vẽ những điều giả dối."
3065 = "Do đó tất nhiên, giữa toa ăn và \\x%l車掌車;#00ffc040;toa xe trưởng tàu%l;#;――\\nkhớp nối toa xe ở vị trí cuối cùng trong đoàn tàu này cũng――"
3067 = "Nếu xét đến việc có thể phải dùng cộng cảm,\\nthì Hachiroku cũng bắt buộc phải đi. Nhưng……"
3074 = "Nếu tiến hành mài đường ray, nó sẽ biến mất không tì vết.\\nNgay cả việc từng có vết bánh xe ở đó, cũng chẳng ai nhớ đến nữa."
3075 = "Rồi chầm chậm――\\ncất lên một giọng nói có vẻ khó hiểu, nhưng lại xen lẫn chút buồn bã."
3076 = "Nếu chính Suika đã đảm bảo rằng,\\n『Tất cả mọi người đều đang thở đều đặn trong giấc ngủ say』 thì……"
3078 = "Khi đón nhận điểm cuối của chuyến hành trình, ngay cả với vết thương đó――\\ntôi muốn dẫn dắt bản thân mình để có thể đối mặt trực diện với nó."
3079 = "Để phòng ngừa tai nạn vạn nhất,\\ntôi nắm chặt lấy tay em ấy, tuyệt đối không buông."
3081 = "Pặc, mọi thứ bị cắt đứt.\\nThế giới của tôi, lại trở về với tôi."
3082 = "Ngài Soutetsu và Hibiki,\\ncó vẻ cũng đã bắt đầu cuộc hành trình vào cõi mộng lần nữa."
3083 = "Được tiễn bằng lời đáp lễ dõng dạc của Suika,\\nvà giọng nói nhẹ nhàng đặc trưng của cậu Zhihuan, chúng tôi bắt đầu hành động."
3085 = "Tiếp tục giúp ích cho Master lâu thêm một chút."
3087 = "Tiếng bước chân cũng đã lọt vào tai tôi.\\nVì vậy, tôi đứng dậy để đón ngài ấy."
3089 = "Hơn nữa, trên tàu giường nằm của Trung Quốc, mọi hành khách\\nđều có thể lấy nước nóng từ bình đun tự động bao nhiêu tùy thích."
3097 = "Khi được ôm vào lòng, khi cậu Zhihuan tiến lại gần,\\nSuika đã vô cùng bối rối."
3127 = "Suika ngập ngừng một cách hiếm thấy.\\nĐôi gò má cô bé dần dần ửng đỏ."
3128 = "Suika bất giác vươn tay về phía Hachiroku."
3130 = "Khung cảnh, những cảm xúc mà Suika đã truyền cho tôi――\\nquá đỗi rực rỡ và xinh đẹp. Và, cũng thật đau khổ."
3131 = "Suika lại mang một vẻ mặt ngơ ngác.\\nCô bé nhắm mắt lại, lẩm nhẩm tất cứu, tất cứu, tất cứu――a."
3133 = "Rơi xuống!! Suika rơi ngay trước mắt tôi!?"
3135 = "『Hachiroku』, một luồng cộng cảm mang theo nụ cười chào đón tôi."
3138 = "Một tâm tư mà Suika luôn cố gắng giấu kín đến thế,\\nvậy mà cô bé lại truyền đạt thẳng thắn cho tôi."
3141 = "Đôi tai của Suika thính nhạy hơn tai tôi rất nhiều."
3142 = "Lời nói, mãi không thể tiếp tục."
3145 = "Bím tóc của Suika rung lắc dữ dội.\\nTôi cảm nhận rõ ràng sự bối rối và đồng tình trong lòng cô bé."
3147 = "Đôi mắt của Suika hơi mở to, có vẻ ngạc nhiên.\\nCô bé chớp mắt liên tục, những cái chớp mắt ngắn ngủi."
3149 = "Lần thứ ba――và cũng là lần rõ ràng nhất từ trước đến nay,\\nSuika lộ vẻ mặt ngạc nhiên, chớp chớp mắt."
3151 = "Bàn tay vô cùng ấm áp của Suika,\\nđang nắm lấy tay tôi dắt đi."
3153 = "Suika lộ vẻ mặt bối rối.\\nVẻ mặt bối rối, đôi môi mím chặt."
3154 = "Hiếm khi Suika lại ngắt lời chen ngang vào cuộc trò chuyện.\\nĐôi mắt cô bé tròn xoe――hoàn toàn là một khuôn mặt kinh ngạc."
3157 = "Suika gật đầu với vẻ mặt ngạc nhiên.\\nNiềm vui dần dần trào dâng trong tôi."
3158 = "Suika khẽ gật đầu.\\nVì vậy, tôi mở cộng cảm――!!!!!!!!!"
3160 = "Giữa đêm khuya, hai người. Railord và Railord,\\ncùng nhau lén lút thì thầm to nhỏ."
3162 = "Thà cứ bận rộn chạy ngược chạy xuôi,\\ntâm trạng còn thấy thoải mái hơn nhiều."
3170 = "Lời nói thốt ra trước cả suy nghĩ.\\nMột lúc sau, sự thấu hiểu mới từ từ bắt kịp lời nói."
3171 = "Vừa dứt lời, mọi người lập tức gật đầu."
3179 = "Vì tôi là người chịu trách nhiệm của đội này,\\nnên tôi phải đi thôi."
3180 = "Đoàn tàu bắt đầu gõ nhịp lên từng khớp nối đường ray.\\nChầm chậm, chầm chậm, và rồi, tăng tốc mạnh mẽ!"
3193 = "Tôi vô ý,\\nôm Hachiroku trong vòng tay mãi không buông."
3194 = "Một hành động không hợp lý, phi logic,\\ncác mạch điện của tôi đã đưa ra kết luận như vậy."
3195 = "Tôi hơi bất ngờ.\\nKhông ngờ họ lại ngạc nhiên về điều đó."
3196 = "Đây là――tình yêu. Trái tim đang yêu.\\nThật là một lượng nhiệt khổng lồ làm sao. Thật là một khao khát xót xa biết nhường nào."
3197 = "Âm thanh tuyệt vời ấy, đột nhiên tan chảy đặc sệt.\\nThứ tan chảy ấy, vô cùng đậm đặc và nặng nề――"
3198 = "Như thể ngấm vào và nhấn chìm các mạch điện, nhưng một chút, chỉ một chút thôi.\\nNgọt ngào……làm nhói đau một nơi sâu thẳm nào đó trong tôi."
3199 = "Thật là một âm thanh tuyệt vời làm sao.\\nVà, a――thật là một vinh dự lớn lao."
3200 = "Nếu vậy, tôi nghĩ tình hình đại khái đã được làm rõ.\\nChỉ còn một điểm cuối cùng, cần phải xác nhận lại."
3201 = "Lần này đến lượt cậu Zhihuan lộ vẻ mặt vô cùng kinh ngạc."
3202 = "Thành thật mà nói, cô ấy đã giúp tôi một việc lớn.\\nTôi không muốn thiếu đôi mắt và khả năng ghi chép của Hibiki trong tình huống này."
3205 = "Vừa nói, Suika vừa nhấp một ngụm từ chiếc cốc cũng được chuẩn bị sẵn,\\nchứa loại dầu diesel có hương vị mà cô bé yêu thích."
3206 = "Cây bút chì được đặt xuống từ từ. Nhưng ngay lập tức bắt đầu lăn.\\n――Độ dốc lớn hơn dự đoán."
3212 = "Tôi uống nước――nước lọc ấm.\\nChiếc cốc này do Suika chuẩn bị sẵn cho tôi."
3213 = "Đôi má đỏ ửng của Hachiroku đang dịu đi nhờ hít thở sâu,\\nkhông hiểu sao lại đỏ bừng trở lại."
3214 = "Nhưng từng giây, từng giây trôi qua, sự bối rối ấy\\ntôi cảm giác như nó đã được dệt lại thành một tình yêu sâu đậm và mãnh liệt……"
3216 = "Ngài Soutetsu, rất quan trọng. Là người quan trọng hơn bất kỳ ai khác.\\nLà Master. Là gia đình. Nhưng không chỉ dừng lại ở đó."
3231 = "(……Dù rằng ngày mai là sẽ biết thôi.)"
3234 = "(……Nghề đường sắt, đúng là có duyên nợ mà.)"
3236 = "(……Rõ ràng cùng nằm trên một chiếc giường ba tầng――\\nnhưng tầng trên và tầng giữa lại hoàn toàn là hai thế giới khác biệt nhỉ.)"
3266 = "(Mà, đối với chúng tôi cũng vậy thôi)"
3268 = "(Nhưng làm vậy là thất lễ. Trái với đạo nghĩa.\\nTất nhiên Hibiki cũng đã đủ lớn để kiềm chế được.)"
3270 = "(Cô biết không? Tôi vẫn chưa quen với cấu trúc trong xe\\n……Hơn nữa, trời lại còn tối thế này nữa chứ?)"
3277 = "(Hả? À――Ufufu, ra là vậy. Vâng.\\nNếu vậy thì, tôi chắc cũng có thể xoay xở được.)"
3279 = "(Ôi, thôi chết. Mình thật là……\\ntừ lúc nào lại trở nên tham lam đến mức này cơ chứ.)"
3280 = "(Phịch)"
3281 = "(A――cô cũng đang háo hức lắm phải không.)"
3283 = "(A――Hiếm thật. Hibiki đang khựng lại khi viết gì đó kìa.)"
3285 = "(A――)"
3286 = "(A! Xin lỗi Suika. Tôi đến ngay đây.)"
3288 = "(A! Đợi đã, Suika.)"
3289 = "(Phụt――)"
3290 = "(Cạch――xình――cạch, xình xịch)"
3291 = "(Cót――két)"
3293 = "(Cứ như là……\\nUfufu, giống như những học sinh nội trú trong truyện vậy nhỉ.)"
3295 = "(Ufufu, vâng. Nếu cô làm vậy thì.\\nTôi sẽ rất biết ơn và vui lắm.)"
3297 = "(Được tỏ tình――được ôm vào lòng――a!?)"
3301 = "(Khao khát, mong mỏi, muốn độc chiếm――\\nmuốn được độc chiếm――mãnh liệt đến nhường này, dữ dội không có hồi kết.)"
3303 = "(Phịch)"
3305 = "(Suika……bị mình đánh thức rồi sao……\\nKhông, cô bé đã thức từ trước rồi……phải không?)"
3308 = "(Cảm ơn cô. Suika.)"
3310 = "(Khục!)"
3313 = "(Rốt cuộc cụ thể là chuyện như thế nào,\\ntôi vẫn chưa hiểu rõ lắm――)"
3315 = "(Lúc đó, mình chẳng hề nghĩ ra một mong muốn nào cả, vậy mà)"
3316 = "(Ngài Soutetsu và Hibiki……\\nđang trao đổi thư từ bằng sổ phác thảo――)"

[selections]
