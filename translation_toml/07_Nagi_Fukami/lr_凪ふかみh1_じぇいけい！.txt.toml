1727 = "「Ra rồi, thứ nóng hổi——tinh dịch——của anh Soutetsu——ưm. Đang bắn phụt phụt, đập vào——bên trong——em」"
1728 = "「Xin lỗi nhé? Nagi. Nhưng mà——tại Nagi. Tại Nagi đáng yêu quá cơ.」"
1729 = "「Đúng vậy! Quả không hổ danh anh Soutetsu, rất hiểu chuyện!」"
1730 = "「N, Nagi——kya!?」"
1732 = "「Nagi! Nagi! Nagi! Nagi! Sao rồi! Sướng không!? Hả? Sướng không??」"
1733 = "「Nagi! Không sao chứ, bình tĩnh lại nào? Nhé? Từ từ, hít thở từ từ thôi nhé? Từ~ từ thôi.」"
1735 = "「Nagi!!!」"
1737 = "「Nagi, em muốn sao nào? Phải dùng miệng, nũng nịu anh Soutetsu đàng hoàng chứ.」"
1738 = "「Nagi, đáng yêu quá.」"
1740 = "「Nagi!? Đừng cố quá! Nhả ra khỏi họng đi」"
1744 = "「Nagi? Nếu em không nũng nịu được. Thì chị sẽ cướp mất cậu nhỏ đấy nhé?」"
1746 = "「Nagi, Nagi. Đổi lại, tớ cũng sẽ liếm sạch cho cậu. Ưm——」"
1747 = "「Nagi? Đến lượt chị」"
1749 = "「Nagi? Chị nghĩ ý anh ấy không phải là không đáng yêu đâu? Bởi vì Nagi trông đáng yêu thế này cơ mà.」"
1750 = "「Nagi!!?」"
1751 = "「Fukamiiii」"
1752 = "「Fukami! Nagi——chỉ cho em với! Cách làm cái đó——chỉ cho em với!!!」"
1759 = "「Không có đâu. Chỉ là hướng đi khác nhau thôi, độ đáng yêu chắc chắn là ngang nhau, hoặc Nagi nhỉnh hơn. Đúng không? Anh Soutetsu.」"
1760 = "「Vào cô bé ạ? Hay vào lỗ hậu? Hay là—— A! Thỉnh thoảng làm cú kẹp ngực kép cũng được đó.」"
1763 = "「Bởi vì em! Cũng là 'Nữ' (Joshi) 'Người lái đò xuôi dòng Kumagawa' (Kumagawa kudari sendo) hiện dịch 100% mà!」"
1765 = "「Đêm nào chúng ta cũng bị cậu nhỏ dâm đãng thế này của anh Soutetsu, đâm phập phập vào người cơ mà.」"
1767 = "「Em có thể, sẽ mang thai, mất. Em, và Nagi, cùng nhau—— cùng nhau——bằng cùng một, tinh trùng——của anh, Soutetsu」"
1769 = "「Em muốn thông đít anh Soutetsu!」"
1771 = "「Ngay lúc này, ở thì hiện tại tiếp diễn 100% hiện dịch. Anh—— đang khao khát được hai em 'Lần lượt' (Junban ni) 'Ngậm lấy' (Kuwaete hoshii).」"
1772 = "「Ơ kìa, à——Nagi?」"
1775 = "「Em, quả nhiên vẫn hợp làm con gái hơn. Cho nên, con trai——cậu nhỏ, em xin trả lại nhé?」"
1776 = "「Thế nên, nhé? Lượt của em là~ Ngoạm—— Ưm——liếm——ưm——ưm!!!」"
1779 = "「Sự cương cứng của anh Soutetsu——em……（Ực） Sự cương cứng của em——dùng như cậu nhỏ của em, sao.」"
1781 = "「Vậy thì!!!」"
1784 = "「Thấy chưa!? Ơ——a」"
1785 = "「Đúng không!?」"
1787 = "「Đúng vậy nhỉ, em muốn nuốt trọn toàn bộ mà nhỉ.」"
1789 = "「A, đang cắm vào——đây——」"
1791 = "「Ừm——Một màn khẩu giao phô bày rõ ý đồ vắt kiệt tinh dịch. Không sướng mới là lạ.」"
1792 = "「Đúng vậy nhỉ, Nagi」"
1794 = "「Đúng vậy nhỉ~, Khẩu giao kép JK hiện dịch mà lại! Ufufufu! Nếu vậy thì, nhỉ? Nagi!」"
1795 = "「Hô.」"
1796 = "「Vậy sao, không sao là tốt rồi.」"
1798 = "「Đúng vậy. Là sự cương cứng của Fukami. Em muốn dùng nó thế nào?」"
1805 = "「Chắc chắn không sao đâu! Tại Fukami tự mình đưa miệng với mặt ra đỡ lấy mà~」"
1806 = "「Không, có gì đâu.」"
1810 = "「Fukami cũng——là cái, JK hiện dịch gì đó sao」"
1812 = "「Fukami? Nagi đợi mỏi cổ rồi kìa?」"
1815 = "「Sau đó, em cứ giữ nguyên lưỡi như vậy rồi đẩy mạnh tới, ngậm cậu nhỏ vào miệng càng sâu càng tốt nhé?」"
1816 = "「Sau đó, thử di chuyển lưỡi sang trái phải trong miệng xem, từ từ liếm phần rãnh dưới quy đầu của anh Soutetsu nhé.」"
1818 = "「Tất nhiên rồi ạ!」"
1819 = "「Đương nhiên rồi!!!」"
1825 = "「Công nhận, chính anh cũng thấy đáng nể. Rốt cuộc là, tại sao lại thế nhỉ」"
1827 = "「Hơn nữa nhé. Nagi cũng đã trưởng thành với khuôn mặt và cơ thể đáng yêu, dâm đãng thế này rồi mà.」"
1828 = "「Thấy chưa? Nagi.」"
1829 = "「Này nhé? Để nuốt trọn cậu nhỏ to lớn của anh Soutetsu—— thì phải dùng đến cổ họng cơ.」"
1830 = "「Nagi nói vậy đấy, Fukami. Em thấy sao? Có muốn thử dùng sự cương cứng của anh như đồ của mình một lúc không?」"
1831 = "「Anh ấy nói vậy kìa? Nagi. Tính sao đây? Cứ tiếp tục chóp chép, khẩu giao nông choèn thế này nhé.」"
1832 = "「Có mùi mà? Nagi. Nhắm mắt lại, mở rộng tâm hồn, tập trung tinh thần vào mũi xem~（Khịt khịt——khịt khịt）」"
1834 = "「Có mùi thật! Mùi như mùi động vật ấy—— （Khịt）——Và còn thoang thoảng chút mùi tinh dịch nữa」"
1837 = "「S……sướng……lắm, đó? Ưm…… Không có chuyện——không——sướng, đâu」"
1838 = "「Sướng thì——sướng thật nhưng……ưm~~…… ——A! Liếmmmmm!」"
1839 = "「Liếm」"
1841 = "「Bị Fukami làm những chuyện dâm đãng——chắc sướng lắm. Cả cách Fukami dùng cậu nhỏ nữa……hau」"
1842 = "「Thành thật mà nói thì sướng đến đáng sợ. Vượt xa trí tưởng tượng của anh—— Một khoái cảm lấp đầy tâm trí, khiến anh chỉ còn suy nghĩ duy nhất là phải xuất tinh.」"
1845 = "「Cố gắng lắm rồi nhỉ? Nagi. Nhưng tiếc quá. Cậu nhỏ của anh Soutetsu vẫn còn một chút ở ngoài miệng kìa.」"
1853 = "「Chuyện đó—— là tại anh Soutetsu và Nagi cả mà?」"
1854 = "「Bị, bị nói vậy ngại lắm! Fukami dễ thương gấp trăm lần Nagi cơ.」"
1855 = "「Chuyện đó, hãy để dành cho lần sau nhé. Lần tới, hãy bình tĩnh làm theo sự hướng dẫn của Fukami, từ từ, từng bước một.」"
1856 = "「Cái này, là——」"
1857 = "「Chuyện đó, rõ rành rành ra rồi còn gì!」"
1858 = "「Còn phải hỏi sao! Là viết tắt của 'Nữ' (Joshi) 'Kiếm thuật gia' (Kenjutsuka) đó!」"
1859 = "「Còn phải hỏi sao! Là lượt Nagi biến cậu nhỏ của anh Soutetsu, thành cậu nhỏ của Nagi đó!」"
1862 = "「Dạ, anh Soutetsu——bọn em——ưm, mặc đồng phục——có hợp không, ạ?」"
1864 = "「Vậy thì, cùng cởi nà~o」"
1866 = "「Nếu vậy thì, anh cũng là JK hiện dịch đấy.」"
1867 = "「Vậy thì vậy thì Nagi! Sẽ để dành việc học cách dùng họng cho lần sau! Thế——anh Soutetsu. Bây giờ, anh muốn xuất tinh như thế nào?」"
1868 = "「Nhắm mắt lại, mở rộng tâm hồn~ tập trung tinh thần vào mũi ……（Khịt——khịt——khịt, khịt）——A!!」"
1871 = "「Đã cất công được cả hai em khẩu giao cùng lúc, anh muốn xuất tinh luôn. ……'Theo lẽ thường' (Joushikiteki ni) mà 'Nghĩ' (Kangaete).」"
1880 = "「（Ực）——Anh Soutetsu…… cái miệng của Fukami vừa nãy——sướng đến, thế sao?」"
1957 = "Hãy xuất tinh đi. Một dục vọng, một mệnh lệnh mãnh liệt trào dâng từ sự cương cứng. Chuyển động co thắt, nôn ọe, nghẹn ngào của cổ họng, sự co giật ấy——"
1960 = "Đặc biệt là khi có mặt ba người, Nagi rất hay tránh dùng những từ ngữ thô tục. Hiểu được điều đó, và cũng vì tôi——Fukami đang khiêu khích Nagi."
1964 = "Nguy thật, tôi hoàn toàn bị hớp hồn mất rồi. À không, nói đúng hơn là tôi muốn cứ thế này ngắm nhìn mãi thôi——"
1968 = "Không hiểu sao Fukami lại lộ vẻ mặt thở phào nhẹ nhõm, rồi sau đó thè lưỡi ra liếm——!?"
1981 = "Có lẽ em ấy không hề có ý định dùng cửa tử cung để phục thù cho cổ họng, nhưng nơi sâu nhất của Nagi đang ngậm lấy quy đầu tôi với khí thế không thua kém gì sâu trong cổ họng."
1982 = "Chỉ mới tưởng tượng thôi mà sự cương cứng đã giật nảy lên dữ dội. Nếu như sâu trong cuống họng chật hẹp ấy, thực sự đón nhận tôi thì——"
1987 = "Chẳng cần hai em ấy chỉ ra. Dù cách một lớp vải cũng đủ thấy rõ, tôi đã hoàn toàn cương cứng——bị hai em ấy làm cho cương cứng."
2009 = "Má Nagi phồng lên, tròn vo như chiếc bánh nướng Yakimochi—— A! Ra là vậy. Hèn gì ghen tuông (Yakimochi) lại đồng âm với bánh nướng (Yakimochi)."
2010 = "Nagi và Fukami dùng 20 ngón tay quấn lấy sự cương cứng của tôi, rồi"
2012 = "Nagi đang xấu hổ. Đang bẽn lẽn. Dù chính tôi là người khơi mào, nhưng lại cảm thấy chút ghen tị."
2015 = "Nagi ngây thơ ngậm trọn lấy tôi, rồi bắt đầu luyện thanh——Bài đồng dao nhện nước màu đỏ a i u e o."
2017 = "Nagi cũng cọ xát cô bé vào phần kết nối của chúng tôi. Ngay lập tức, bên trong âm đạo của Fukami không chỉ co bóp mà bắt đầu cuộn trào."
2020 = "Chắc hẳn Nagi là người hiểu rõ nhất việc mình vừa thất bại. Vậy thì tôi không cần thiết phải nhắc lại chuyện đó làm gì."
2022 = "Nagi ôm chầm lấy Fukami để đổi tư thế, rồi nở một nụ cười tinh nghịch mang đậm chất Nagi."
2024 = "Kích thích mà Nagi mang lại đơn giản hơn so với lúc của Fukami. Nhưng chính vì thế, nó càng làm nổi bật cảm giác chân thực rằng ba người chúng tôi đang làm tình."
2025 = "Bên trong nhớp nháp nhưng lại siết chặt lấy tôi. Cô bé của Nagi dù có kề da sát thịt bao nhiêu lần đi chăng nữa——"
2028 = "Chuyển động của Nagi vẫn rất vụng về. Thẳng thắn, đơn giản—— Nhưng không hiểu sao, khoái cảm lại mãnh liệt hơn hẳn bình thường."
2030 = "Bên trong âm đạo của Nagi bắt đầu thở dốc. Sự bám riết của cửa tử cung cũng mãnh liệt hơn. Sự cương cứng của tôi đã chực chờ bùng nổ từ lâu, nhưng tôi muốn cùng ra với em"
2031 = "Trong nháy mắt, Nagi đã lấy lại tinh thần. Quả nhiên là vậy. Sự hỗ trợ của Fukami dành cho Nagi, đúng là không ai có thể thay thế được."
2034 = "Chỉ là một màn vuốt ve bằng môi đơn thuần, giống như cá vàng đớp mồi. Vì vậy, tôi rất kỳ vọng. Vào sự hướng dẫn của Fukami. Và sự trưởng thành của Nagi nhờ điều đó."
2035 = "Nagi cọ má đầy vẻ sung sướng. Tôi vẫn cảm nhận được nét ngây thơ của em. Nụ cười đáp lại của Fukami lại mang đến cảm giác gần gũi với tình mẫu tử."
2036 = "Dù bị chỉ trích là dâm đãng, Fukami giờ đây cũng chẳng hề bối rối."
2044 = "Nửa rãnh quy đầu bên phải đang bị lưỡi của Fukami miết lấy. Đầu lưỡi làm cứng và nhọn lên, cẩn thận, vô cùng cẩn thận liếm láp."
2054 = "Khoảnh khắc não bộ nổ tung ấy, tinh hoàn và sự cương cứng của tôi, phải nhận thêm một cú kích thích chốt hạ——"
2061 = "Hai cô gái nhìn nhau cười khúc khích, trao nhau ánh mắt."
2062 = "Fukami và Nagi lần lượt vạch ngực áo, nâng nách lên để kiểm tra xem có bị bẩn không. Nỗi lo lắng ngay lập tức bị thế chỗ bởi dục vọng."
2063 = "Một nụ hôn sâu! Lấy quy đầu của tôi làm trục trung tâm, Fukami và Nagi quấn lấy lưỡi của nhau, siết chặt và trườn lên——"
2064 = "Hai em ấy đùa giỡn với nhau thật đáng yêu, nhưng tôi không muốn sự cương cứng đã cứng ngắc của mình bị cho ra rìa đâu."
2065 = "Những chuyển động nhỏ của lưỡi và môi khi đọc líu lưỡi kích thích quy đầu liên tục, tôi chìm trong khoái cảm râm ran như bị bầy cá nhỏ rỉa."
2067 = "Dù chỉ là mô phỏng nhưng em đang cắm vào Nagi. Sự hưng phấn đó, có lẽ đã kéo trí tuệ của Fukami xuống dưới mức 0 rồi."
2068 = "Chẳng hề mảy may để ý đến phản ứng của Nagi, Fukami cứ mải miết……chuyển động hông phập phập."
2072 = "Đúng như dự đoán, Fukami đã bộc lộ sự bối rối lần đầu tiên trong ngày hôm nay. Việc tráo đổi lưỡi mà không có sự can thiệp của sự cương cứng của tôi——nói cách khác, đó chính là nụ hôn."
2081 = "Khi cơn xuất tinh cuối cùng cũng lắng xuống, nhịp thở trở lại bình thường, theo đó tâm trí cũng trở nên sáng suốt——!!"
2086 = "Trong lúc tôi đang chìm đắm trong những cảm xúc vô bổ, Nagi và Fukami bắt đầu dính lấy nhau trêu đùa."
2102 = "Một khoái cảm quá đỗi mãnh liệt như bị lột ra khỏi máy bơm chân không, cùng với cảm giác cạo ngược ngọt ngào, thô ráp kéo dài tưởng chừng như vô tận!"
2108 = "Quả thực tôi cũng tự nhận thấy mình đang hưng phấn hơn thường ngày. Đến mức mỗi lần mạch đập, sự cương cứng lại tự động giật giật."
2111 = "Tôi lại một lần nữa gật đầu không chút do dự."
2113 = "Tôi chỉ có thể gật đầu. Không thốt nên lời. Lần đầu tiên khi ở cùng ba người, Fukami mới bộc lộ kỹ năng khẩu giao thực sự——không hề giấu giếm."
2115 = "Nghiến chặt răng. Cả tôi và Fukami. Ép chặt quy đầu vào cửa tử cung, để có thể ra cùng lúc với em."
2117 = "Tôi nghiến chặt răng hàm và thít chặt hậu môn, liều mạng kìm nén dòng tinh dịch đang ồ ạt chực trào ra khỏi lỗ sáo."
2119 = "Tôi đang xuất tinh. Bắn tung tóe. Lên Nagi, lên Fukami—— Không chỉ dính trên miệng và mặt, mà còn vương vãi khắp cả lên tóc hai em."
2121 = "Tôi bắn ra lượng tinh dịch đặc quánh, dính dớp đến mức khó tin đây là lần thứ ba. Cả tôi và Fukami đều rã rời——!?"
2123 = "Đột nhiên, tôi nảy ra một ý. Đồng thời, những lời nói cũng tuôn trào khỏi cổ họng."
2124 = "Một lời đáp trả mạnh mẽ ngoài sức tưởng tượng cho câu nói mang tính lấp liếm của tôi."
2127 = "Giật mình trước cú siết chặt đột ngột, tôi nhìn xuống thì thấy Nagi đang tấn công Fukami từ bên dưới. Em ấy đang ra sức, ngây ngô và đơn thuần cọ xát hai đầu nhũ hoa đang cương cứng vào nhau——"
2129 = "Khẩu giao kép——Cái tên của hành vi mà tôi đang đắm chìm, bị Fukami trực tiếp nói thẳng ra, khiến tôi cảm thấy xấu hổ."
2131 = "Tôi gật đầu ngay tắp lự, không chút do dự."
2132 = "Tôi thô bạo lột lớp vách âm đạo đang cuộn trào bám dính lấy mình để cắm sâu vào. Cửa tử cung nơi sâu nhất ấy lại đột ngột ngọt ngào ngậm lấy quy đầu——"
2134 = "Thế nên, tôi thành thật nói lên suy nghĩ của mình. Nếu xét đến tính cách của Nagi——một cô bé hiếu thắng——"
2136 = "Phần dưới quy đầu bị những đầu lưỡi nhọn hoắt liếm láp, khoét sâu, tinh hoàn thì bị nhào nặn mềm mại, tinh dịch ngay lập tức lấy lại nhiệt độ sôi sục."
2140 = "Vào hết rồi. Bị nuốt trọn rồi. Cổ họng ực một cái chuyển động mạnh, khoảnh khắc đó, một độ sâu chưa từng có, hự!!?"
2146 = "Đề xuất nào cũng quá hấp dẫn, khiến não tôi như muốn rối loạn. Thế nên, tôi phải quay lại. Tua ngược về sự bình tĩnh và hạnh phúc trước khi hỗn loạn."
2148 = "Mỗi lần Fukami cọ xát nhũ hoa, cơ thể, đũng quần, mỗi lần hôn, bên trong âm đạo của Nagi lại càng vui sướng siết chặt hơn bao giờ hết."
2151 = "Vừa trêu đùa tinh hoàn của tôi với một lực nhẹ nhàng tuyệt diệu, Fukami vừa dùng những lời lẽ khích tướng cực kỳ tự nhiên để thúc đẩy Nagi."
2153 = "Fukami cất giọng có chút bối rối, xen lẫn vẻ hụt hẫng."
2155 = "Fukami và Nagi quấn lấy nhau ngã xuống. Một khung cảnh quá đỗi dâm đãng, khiến tôi gần như cảm động."
2157 = "Vừa nhẹ nhàng cọ xát nhũ hoa và toàn bộ cơ thể vào nhau, Fukami và Nagi vừa quấn lấy lưỡi, trao đổi nước bọt ướt át."
2159 = "Fukami hít một hơi thật sâu, từ từ cúi đầu xuống"
2162 = "Bàn tay phải của Fukami lén lút xoa nắn tinh hoàn của tôi. Vừa xoa nắn, em vừa liên tục ép ngực vào tôi."
2164 = "Fukami đẩy mạnh hông tới. Nhưng sai chỗ rồi. Tôi nắm lấy hông Fukami, giữ lại và dẫn đường——"
2166 = "Câu trả lời ngay tắp lự ngoài dự đoán, khiến tinh hoàn tôi co rúm lại."
2167 = "Chẳng cần quay lại xác nhận vị trí, hông của Fukami vẫn cọ xát cô bé và sự cương cứng của tôi một cách chuẩn xác."
2170 = "Được sục mạnh bạo bằng cả khoang miệng đến tận cổ họng, rồi chỉ ngậm mỗi quy đầu, mút mát thật mạnh rồi lại nhả ra."
2172 = "Cô bé của Fukami vốn dĩ đã điêu luyện hơn của Nagi, nay lại cộng thêm những đợt cuộn trào lần đầu tiên xuất hiện, siết chặt lấy tôi——"
2176 = "Tử cung của Fukami dường như định áp dụng phương án của em ấy. Nó siết chặt lấy lỗ niệu đạo, hòng tham lam nuốt trọn không chừa một giọt tinh dịch còn sót lại nào."
2177 = "Giọng nói của Fukami đánh thức bộ não đang tê liệt vì khoái cảm quá đỗi mãnh liệt của tôi. Nagi rõ ràng đang rất đau đớn, có vẻ như em không thể tự mình giải quyết được——!"
2178 = "Fukami cất giọng nũng nịu, đòi hỏi."
2179 = "Sự cương cứng của tôi đang lún sâu vào rãnh của Fukami. Nhận được câu trả lời đúng như dự đoán, tôi càng muốn thử nghiệm hơn."
2182 = "Fukami hơi nhấc hông lên và nhích về phía trước. Để không cản trở việc tôi thỏa sức vặn hông——"
2184 = "Fukami liếm sạch nước bọt dính quanh miệng Nagi, rồi dùng lưỡi làm sạch quanh môi mình, mỉm cười."
2185 = "Chiếc lưỡi mềm mại ướt át của Fukami, cùng chiếc lưỡi căng mọng tràn đầy sức sống của Nagi, quấn quýt và bám chặt lấy phần dưới quy đầu của tôi."
2188 = "Rõ ràng là giọng nói sung sướng của Fukami. Hông em dừng lại. Có lẽ Nagi đã liếm lấy chiếc lưỡi mà Fukami thè ra."
2189 = "Hông của Fukami đang thủ dâm bằng cách sử dụng phần kết nối của chúng tôi. Khoái cảm khi bị cọ xát bởi cô bé khiến cả sự cương cứng và não bộ của tôi như căng phồng lên."
2194 = "Sự trơn trượt hoàn toàn khác hẳn mọi khi. Cảm giác như có một con ốc sên đang áp sát, trườn dọc theo mặt dưới sự cương cứng của tôi."
2198 = "Dù sao thì, Nagi là ưu tiên hàng đầu. Tôi nhẹ nhàng lau đi những giọt nước mắt đọng nơi khóe mắt em, cố gắng giữ giọng nói thật từ tốn và bình tĩnh."
2208 = "Đúng là lúc đầu tôi thấy thích thú với khoái cảm lạ lẫm này——nhưng, chỉ kích thích bằng đầu lưỡi và môi thì vẫn còn thiếu tính quyết định."
2211 = "Còn nửa bên trái thì bị Nagi mút mát và trườn lưỡi liếm ướt đẫm. Chiếc lưỡi nóng rực áp sát, chậm rãi ngọ nguậy dọc theo quy đầu."
2212 = "Trước lời nhận xét quá đỗi thật thà thốt ra từ miệng tôi, đôi mắt Fukami ánh lên nụ cười khúc khích."
2217 = "Màn mút mát ướt át đầy nũng nịu, cùng với cú sục mạnh bạo ở gần gốc dương vật, càng làm tinh dịch sôi sục điên cuồng——!"
2219 = "Chỉ mới bị chạm nhẹ vào tinh hoàn mà tôi đã rên lên sung sướng. Đôi mắt Nagi lóe sáng. À, ra là vậy."
2222 = "Vừa dứt lời, hai cô gái lập tức trao nhau ánh mắt——"
2226 = "Chỉ một cái liếm trêu đùa thôi cũng suýt chút nữa ép tôi xuất tinh."
2227 = "Đương nhiên rồi. Miệng Nagi nhỏ hơn miệng Fukami mà. Nhưng bù lại cảm giác áp sát lại mạnh hơn. Nhiệt độ trong khoang miệng cũng cao hơn nên rất dễ chịu."
2234 = "Nhả ra đến sát tận mép đầu quy đầu. Sự cương cứng run rẩy trước nhiệt độ cơ thể bị nước bọt cướp đi, và cả sự kỳ vọng——!"
