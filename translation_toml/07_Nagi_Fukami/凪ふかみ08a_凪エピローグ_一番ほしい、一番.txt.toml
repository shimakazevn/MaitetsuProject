1848 = "「Nếu bé Fukami đã nói vậy,\\nthì chắc chắn em cũng sẽ thắng được Nakamura!」"
1850 = "「Đâu cần thiết phải kéo dài trận đấu――\\nNếu đã thế này, thì ngay từ đầu đã không cần rồi sao.」"
1852 = "「Gì vậy, là sao!? Chuyến đi như thế nào!」"
1854 = "「Nagi có thay đổi gì sao?」"
1859 = "「Đúng không?」"
1861 = "「Đúng vậy! Anh hai đã ngã gục――\\nEm nghe nói anh ngã xuống sông đó! Đúng không? Bé Fukami.」"
1863 = "「Đúng vậy! Cứ thế này, nếu anh hai lại ngã gục,\\nthì em và bé Fukami sẽ buồn lắm đó.」"
1864 = "「A――」"
1865 = "「Vâng.」"
1866 = "「Ừ. Trong giải đấu, kết quả là tất cả.\\nVà kết quả tốt nhất đang treo ngay trước mắt chúng ta.」"
1868 = "「Đúng vậy đó. Nagi.」"
1869 = "「Đúng vậy nhỉ. Anh cũng không muốn đánh mất lời cầu hôn vừa rồi.\\nNên chúng ta tiếp tục nhé.」"
1872 = "「Đúng vậy nhỉ, hai người lúc nào cũng ở bên nhau mà.」"
1873 = "「Vậy sao. Nếu vậy thì――」"
1874 = "「Hô.」"
1875 = "「Ra vậy, anh hiểu rồi. Vì quá vui vẻ……\\nCó lẽ anh đã ép cơ thể mình làm việc quá sức.」"
1876 = "「Vậy sao? Thế thì――thế thì nhé!\\nEm sẽ vô địch cả giải toàn quốc! Rồi sau đó, sau đó!」"
1877 = "「Đúng. Vậy ạ.」"
1878 = "「Đúng. Vậy ạ. Chắc chắn.」"
1880 = "「Thêm một chút nữa, là sao?」"
1881 = "「『Nếu em trưởng thành hơn một chút nữa』」"
1883 = "「Dù không đến, nhưng chắc chắn Railord đó cũng đang dõi theo.\\nBởi vì cô ấy là người rất thích sự náo nhiệt mà.」"
1884 = "「Cũng đúng nhỉ.」"
1888 = "「Hayase của Đường sắt Ohito đã theo dõi giải đấu này nhiều năm rồi.\\nCô ấy phân tích dữ liệu rất kỹ lưỡng.」"
1892 = "「Người quyết định điều đó, lúc nào cũng là Nagi mà.」"
1893 = "「Em không sao. Ạ. Em thì――\\nEm đã được anh Soutetsu bảo vệ mà.」"
1894 = "「Chị không sao chứ? Bé Fukami, có khi nào――\\nlúc cứu anh hai dưới sông, chị bị va đập ở đâu không?」"
1895 = "「Không sao đâu ạ! Nó ra rồi.」"
1896 = "「Dạ không!? Đâu có chuyện đó.」"
1897 = "「Chuyện đó, đơn giản lắm ạ.」"
1898 = "「Cứ để đó cho em! Giao hết cho em đi!」"
1899 = "「Không có chiếc nhẫn đính hôn nào hợp với em hơn chiếc này đâu!」"
1907 = "「Fukami?」"
1908 = "「Fukami?」\\n「Bé Fukami?」"
1913 = "「Sau đó, nhé? Em――muốn làm mẹ.\\nEm muốn có em bé của anh hai!!」"
1915 = "「Bây giờ vẫn là, BÍ - MẬT!」"
1918 = "「Rất sẵn lòng. Anh muốn kết hôn với Nagi.」"
1919 = "「Tất nhiên rồi.」"
1923 = "「Nagi ngoan lắm.」"
1925 = "「Được hả!? Tuyệt quá!」"
1928 = "「Dải băng đỏ. Aero-Craftech Sendai.\\nTuyển thủ Nakamura Chikage.」"
1929 = "「Cuối cùng thì――cũng đến rồi sao.」"
1932 = "「Tiếp tục là sao?」"
1937 = "「Đẹp. Sao ạ? Cách sống của em?」"
1938 = "「Hơn nữa!」"
1940 = "「Hơn nữa――em…… chỉ kéo anh lên khỏi sông thôi……\\nNên là, không sao cả. Em không bị đau ở đâu hết――ạ.」"
1942 = "「Còn với Fukami, là sự xinh đẹp. Không chỉ là vẻ bề ngoài,\\nmà chính cách sống của em cũng rất đẹp.」"
1945 = "「Cái đó hả? Nagi, anh Soutetsu.」"
1947 = "「Chân bị thương sao?」"
1950 = "「Tuyển thủ Minokasa! Ghi điểm mặt!!」"
1952 = "「Để quyết định chuyện đó thì――」"
1953 = "「Vì nếu em nói ra điều gì đó, nó có thể ảnh hưởng đến\\nNagi và anh Soutetsu.」"
1955 = "「Nếu nói về thể lực và khả năng chịu nóng, Nagi hoàn toàn áp đảo.」"
1957 = "「Làm lại sao? Anh thì――\\nkhông muốn coi như lời cầu hôn của Nagi chưa từng xảy ra đâu.」"
1959 = "「Chị mới là người phải nói――cảm ơn em!\\nChị yêu Nagi nhất! Yêu em nhiều nhiều lắmmm!!」"
1960 = "「Bàn bạc? Là chuyện gì……」"
1961 = "「Xin em――hãy kết hôn với anh.」"
1962 = "「Cảm ơn chị! Em yêu chị nhất!!!」"
1963 = "「Nếu chị trưởng thành hơn một chút nữa thì sao?」"
1968 = "「Tuyệt quá! Làm được rồi Nagi ơi!!\\nLàm được rồi! Làm được rồi!!! Giỏi quá giỏi quá giỏi quá!!」"
1987 = "「Vậy sao…… Hừm. Thật đáng mừng và an tâm nhỉ.\\nĐến lúc đó, anh sẽ nhờ Nagi bảo vệ nhé.」"
1988 = "「Ngày đó, là sao?」"
1989 = "「Cái đó…… thì làm sao đây? Bé Fukami.」"
1990 = "「Em nói quá rồi đấy.\\nBa người chúng ta, lúc nào cũng giúp đỡ lẫn nhau mà――」"
1991 = "「Đó là tâm tư của anh dành cho Nagi. Không thể bỏ mặc,\\nrất nguy hiểm――nên lúc nào anh cũng muốn giúp đỡ Nagi.」"
1992 = "「Chuyện đó, em làm sao biết được.\\nDù có thân thiết đến mấy, em cũng đâu phải là Nagi.」"
1993 = "「Đó là do chiến thuật sắp xếp thứ tự thi đấu tốt thôi.\\nĐến tuổi này mà phải đấu với đám thanh niên thì quả thật rất mệt.」"
1994 = "「Đây cũng là chiến thuật. Là chiến thuật đấy.」"
1995 = "「Cách thay đổi chuyến dã ngoại――\\nHay là…… cách kết thúc chuyến đi, sao.」"
1996 = "「Anh đối xử với một quý cô như vậy là quá đáng lắm đó!」"
1997 = "「Đó là tâm tư gì vậy hả!?」"
1998 = "「Cuối cùng, cuối cùng em cũng hiểu rồi!\\nVị trí số một mà em mong muốn nhất, chính là cái này.」"
1999 = "「Nghe nói vậy, em cũng thấy đúng là thế thật.」"
2003 = "「Chiếc nhẫn đó, đâu phải chỉ của riêng mình em.\\nĐây mới là chiếc nhẫn đính hôn 『đậm chất chúng ta』 nhất!」"
2005 = "「Vậy, em ăn luôn phần của anh hai nhé!」"
2007 = "「Nếu vậy thì, đến lúc đó hẵng kết thúc là được mà!」"
2008 = "「Vậy thì tốt quá rồi!」"
2009 = "「Nếu vậy thì, để anh giúp một tay.」"
2012 = "「Vậy còn em thì sao?\\nTâm tư của anh Soutetsu đối với em là gì.」"
2014 = "「Vậy để anh lấy ra cho.」"
2016 = "「Là nhờ có anh Munakata đấy ạ.\\nVì anh đã giành chiến thắng trong tất cả các trận đấu mà.」"
2017 = "「Vậy――cụ thể thì sẽ thay đổi thế nào?」"
2018 = "「Nếu vậy――thì――\\nÀ ừm, làm lại nhé」"
2019 = "「Anh đã bảo là cầu hôn mà.\\nHàng thật anh cất trong tủ đồ rồi, nên giờ dùng tạm cái này thay thế nhé.」"
2024 = "「Cô Hase và cô Shinjoji đều đã làm rất tốt.」"
2026 = "「Bắt đầu!」"
2027 = "「Chúc mừng hai người! Ngài Soutetsu, Nagi!」"
2029 = "「Để quyết định thì sao?」"
2034 = "「Mặt!!」"
2035 = "「Trước tiên, xin anh hãy nói cho bọn em biết.\\nAnh nghĩ thế nào về Nagi, về em.」"
2038 = "「（Chụt!!）」"
2222 = "Luôn luôn――thật sự là luôn luôn như vậy.\\nNagi luôn bị tuyển thủ Nakamura và huấn luyện viên của cô ấy bắt bài triệt để."
2223 = "Đòn đánh mặt sở trường của Nagi,\\nluôn luôn là miếng mồi ngon cho đòn đánh tay của tuyển thủ Nakamura."
2229 = "Không được. Giọng mình run rẩy mất rồi.\\nMà nếu chỉ viện cớ thế này, họ sẽ lo lắng cho đầu mình mất."
2231 = "Từ lúc nào không hay, mình đã trở thành giống như một giáo viên dẫn đường.\\nDù cùng một địa điểm và thời gian, nhưng chắc chắn không phải là cùng một chuyến đi."
2233 = "Không được kỳ vọng, không được hy vọng.\\nNghĩ vậy nhưng――nếu tâm tư của anh Soutetsu――"
2237 = "Nhưng mà, không sao đâu.\\nMình là một cô gái được anh Soutetsu noi gương cơ mà."
2238 = "Tuy nhiên, không phải lúc nào chúng tôi cũng giành được chiến thắng."
2239 = "Tuy nhiên, ở một giải đấu tầm cỡ như Giải vô địch Kiếm đạo Người lao động Kyushu."
2249 = "Tuyển thủ Nakamura cũng không phải là thiên tài."
2250 = "Tuyển thủ Nakamura giữ thế chánh nhãn đẹp mắt.\\nNagi dĩ nhiên, là thế hữu bán khai đầy uy dũng."
2251 = "Tuyển thủ Nakamura hạ kiếm trúc xuống, chuyển sang thế phòng thủ.\\nChỉ có thể nói là――một hạ sách."
2258 = "Giải vô địch Kiếm đạo Người lao động Kyushu là giải đấu nhằm thúc đẩy phong trào kiếm đạo nữ.\\nĐội 5 người gồm 3 nữ và 2 nam."
2264 = "Sự thật đang thúc đẩy mình từ phía sau.\\nTừng chút, từng chút một, cơ thể mình bắt đầu chấp nhận điều đó."
2267 = "Trận đấu đại diện khi năm người không phân thắng bại,\\ndĩ nhiên cũng sẽ diễn ra giữa các nữ tuyển thủ."
2272 = "Anh ấy cười, phải không? Mình cảm thấy anh ấy đã cười.\\nSợ hãi, mình vẫn không dám nhìn vào khuôn mặt ấy."
2274 = "Trong đôi mắt ấy đang chất chứa những cảm xúc gì――"
2275 = "Ánh mắt đang nhìn về phía khán đài bỗng dịu lại.\\nẤm áp, nhưng đồng thời cũng xen lẫn vẻ cô đơn."
2277 = "Anh ấy bảo là đang rối bời, nhưng mà――\\nLúc anh ấy ngã xuống, người ở bên cạnh là mình cơ mà……"
2278 = "Chắc anh ấy đang nói về Railord nguyên bản của chiếc số IX đó."
2282 = "Anh ấy làm vậy khiến mình thấy áy náy quá.\\nVì nguyên nhân ban đầu là do mình và Nagi mà."
2284 = "Nhưng, tôi không thể thốt nên lời nào.\\nKhông chỉ tôi, cả Nagi cũng vậy."
2285 = "Vậy mà mình chỉ mải nghĩ đến cảm xúc của bản thân."
2287 = "Nhưng bây giờ, mình vẫn chỉ là một thiếu nữ.\\nNên mình sẽ buông tay tình yêu này――một cách thật thiếu nữ, thật mơ mộng."
2298 = "Ngay trước thời khắc quan trọng đó, Nagi vẫn chẳng hề thay đổi."
2301 = "Hachiroku, Hibiki, Paulette, Reina, chị Mayami, Kisaki.\\nMọi người đều đã đến cổ vũ."
2303 = "Hachiroku luôn ở bên cạnh anh Soutetsu.\\nNhưng cô ấy không phải là đối tượng yêu đương."
2306 = "Thực ra mình không muốn nghe nữa. Câu trả lời thì, đã rõ ràng rồi.\\nAnh Soutetsu chắc chắn sẽ khen ngợi mình."
2379 = "Nagi bất giác nín thở.\\nLý do thì, tôi cũng hiểu được."
2381 = "Chắc em ấy đang rất vội vã."
2383 = "Sự an tâm và niềm hạnh phúc,\\nlấp đầy toàn bộ cơ thể Nagi."
2385 = "Nagi vẫn giữ nụ cười rạng rỡ,\\nnắm tay trái lại rồi mở ra, như đang chơi trò oẳn tù tì."
2386 = "Nagi lập tức nở nụ cười rạng rỡ.\\nMột nụ cười giống hệt như một đứa trẻ sơ sinh."
2388 = "Một nụ hôn chớp nhoáng rất mang phong cách Nagi.\\nNhưng lại là một nụ hôn ngọt ngào đến vô cùng."
2390 = "Nagi và tuyển thủ Nakamura lại đứng vào vạch xuất phát.\\nHuấn luyện viên đối phương đang lớn tiếng chỉ đạo điều gì đó."
2394 = "Nagi gọi to người bạn thân của mình."
2398 = "Nagi lúi húi tháo găng tay bảo hộ.\\nĐầu tiên là tay trái――sau đó là tay phải."
2400 = "Em ấy ngơ ngác nghiêng đầu.\\nSao lại có thể nuôi dạy một cô bé ngoan ngoãn đến thế này cơ chứ."
2403 = "Không để tiếng reo hò của Nagi làm phân tâm,\\ntôi tập trung giữ vững thế tàn tâm."
2404 = "Kiếm thuật phái Baisha của Nagi cũng vô cùng đơn giản――\\nLà một loại kiếm thuật được đẩy đến mức độ bạo lực."
2406 = "Nagi nhìn tôi. Chúng tôi gật đầu với nhau.\\nDù thể xác lẫn tinh thần đã trưởng thành, Nagi vẫn chẳng hề thay đổi chút nào."
2408 = "Nagi bất ngờ ôm chầm lấy đầu tôi.\\nRồi thì thầm vào tai tôi."
2409 = "Nagi đỏ bừng mặt.\\nThật sự rất đáng yêu."
2412 = "Trong khoảnh khắc, cơ bắp chân của Nagi cứng lại.\\nKhi tôi vừa buông tay xoa bóp ra, em ấy lập tức bật dậy."
2414 = "Đỡ lấy Nagi đang lao vào ôm chầm lấy mình,\\ntrong một góc trái tim, tôi cũng đang băn khoăn không biết phải làm sao."
2420 = "Hai người họ đã chiến đấu hết mình, giờ mồ hôi nhễ nhại,\\nđang ngồi phịch xuống đó."
2421 = "Ngay khi vừa bắt đầu, một cú đánh thẳng vào mặt từ chính diện."
2426 = "Dù cho người ở bên cạnh anh Soutetsu,\\nkhông phải là mình――thì mình vẫn mong như vậy."
2427 = "Rằng Nagi sẽ thắng.\\nDù đã tin chắc như vậy, cơ thể tôi vẫn run lên."
2430 = "Dù lý trí bảo rằng không được hy vọng, làm vậy chỉ thêm đau khổ thôi……\\nNhưng dù thế nào mình vẫn không ngừng suy nghĩ."
2432 = "Khuôn mặt nhăn nhó chuyển thành một nụ cười.\\nMột nụ cười nhăn nhó, nhưng rạng rỡ và xinh đẹp tuyệt vời."
2473 = "Trừ trái tim ra thì mọi thứ đều ổn.\\nMà trái tim cũng là do mình tự làm khổ mình thôi."
2476 = "Nếu mình thích anh Soutetsu nhiều hơn.\\nNếu tình cảm dành cho Nagi yếu đi."
2478 = "Nếu mình gian xảo hơn một chút――\\nKhông, không phải."
2480 = "Nếu mình có thể nghĩ rằng, dù làm Nagi khóc hay đau khổ,\\nmình vẫn muốn cướp lấy anh Soutetsu."
2484 = "Nhưng chính vì thế, mình và Nagi mới trở thành bạn bè.\\nChính vì thế, mình mới yêu quý Nagi đến vậy, và……"
2485 = "Nhưng dù đó có là những lời khen tuyệt vời và đáng mừng đến đâu――\\nThì chắc chắn, đó không phải là lời mình muốn nghe nhất."
2488 = "Nhưng ngay sau đó, gương mặt anh nhăn nhó vì đau đớn.\\nCó lẽ anh đang đau ở đâu đó."
2489 = "Nhưng. Dù vậy. Nếu mình làm thế,\\nmình sẽ không bao giờ có thể nhìn mặt Nagi được nữa."
2492 = "Nhưng, một nơi nào đó trong tim lại lạnh buốt.\\nCó lẽ, đó là phần con gái trong mình. Trái tim đang yêu này."
2501 = "Điều mình khao khát nhất, vị trí số một."
2506 = "Khoan đã! Mình lại để tâm đến chuyện lúc nãy mất rồi.\\nBây giờ đâu phải lúc để ý mấy chuyện đó!"
2507 = "A, không được. Mình sắp khóc mất.\\nQuả nhiên là mình không muốn nói ra."
2509 = "A, lại nữa rồi. Người hỏi là mình cơ mà――\\nVậy mà trong vô thức, anh ấy lại gọi tên Nagi trước."
2512 = "A, Nagi. Chắc chắn em ấy nghĩ mình ấp úng,\\nlà vì 『khó nói』."
2513 = "Ừm. Bí mật."
2516 = "Ừm. Đúng vậy.\\nNếu mình trưởng thành hơn một chút nữa, mọi thứ chắc chắn đã khác."
2519 = "Vì vậy, nếu kỹ thuật đó bị phá vỡ, cô ấy sẽ không còn cách nào chống đỡ."
2520 = "Chỉ tại mình và Nagi đã quá dựa dẫm――\\nMới khiến một người lớn luôn nỗ lực như vậy phải ngã gục."
2525 = "Cách sống của cô ấy. Sự tồn tại của một thứ tuyệt đối không thể lay chuyển.\\nRa vậy――mình cũng có thứ đó."
2527 = "Cái nóng và sự mệt mỏi. Sự tích tụ đó trở thành gánh nặng,\\nkhiến tốc độ vung kiếm của tuyển thủ Nakamura chậm lại dù chỉ một chút."
2528 = "Giữa những lời chúc phúc rộn ràng,\\ntôi nắm lấy tay Nagi."
2530 = "Điểm đó chắc chắn, mình và Hachiroku cũng\\n\"giống nhau\"――mình cảm nhận được như vậy."
2542 = "Nhờ Fukami giúp đỡ,\\ntháo mặt nạ ra như giật lấy rồi buộc tóc lại――"
2544 = "Em ấy chưa từng từ bỏ bất cứ thứ gì mình đã vươn tay ra,\\nluôn dốc toàn lực đối mặt với tất cả, và đã chạy một mạch đến tận đây."
2546 = "Sự hồn nhiên và đáng yêu đến mức khiến người ta ghen tị.\\nĐiều đó làm mình bất an, nhưng đồng thời mình cũng cảm thấy vui."
2548 = "Đôi má em ấy càng thêm ửng đỏ,\\nkhuôn mặt vỡ òa trong nụ cười ngập tràn hạnh phúc."
2549 = "Em ấy tin rằng, dù khuôn khổ 『chuyến dã ngoại』 không còn,\\nba chúng tôi vẫn sẽ mãi mãi như trước đây."
2552 = "Nếu tuyến đường sắt không kết nối với Đường sắt Mikan,\\nnếu không lập đội liên quân, thì chúng tôi thậm chí còn không được tham gia thi đấu."
2560 = "Với vẻ mặt vô cùng bối rối, anh Munakata\\nrất dè dặt dùng quạt quạt cho Nagi."
2562 = "Một tiếng thở dài.\\nHoặc là một nụ cười mang chút tự trào."
2563 = "Ánh mắt anh Munakata dịch chuyển. Hướng về phía khán đài.\\nTôi cũng bị cuốn theo, ngừng lời――"
2566 = "Ánh mắt anh Munakata hướng ra hành lang phòng chờ bên ngoài hội trường."
2568 = "\\x%l機関士;#00ffc040;Lái tàu%l;#; Munakata――\\nLà \\x%l機関士;#00ffc040;lái tàu%l;#; của Đường sắt Mikan, và là một cao thủ kiếm đạo thất đẳng."
2575 = "Nagi rũ rượi ủ rũ.\\nNgược lại, tim mình lại đập thình thịch liên hồi."
2579 = "Hai bàn tay Nagi bao bọc lấy đôi tay của anh Soutetsu.\\nGương mặt anh Soutetsu hiện lên vẻ an tâm."
2580 = "Nagi lấy hai tay che miệng lại, chỉ dùng ánh mắt,\\nđể xin lỗi 『Em xin lỗi』."
2581 = "Nagi cất lên một giọng nói vô cùng buồn bã.\\nNghe thấy vậy, mình bỗng nghĩ biết đâu mình cũng có cơ hội――"
2583 = "Nagi. Nụ cười.\\nNụ cười rạng rỡ không chút gợn mây như ánh mặt trời."
2585 = "Nagi giật bắn mình! Vươn thẳng lưng lên.\\nAnh Soutetsu bật cười fufu."
2586 = "Đôi mắt thẳng thắn ấy của Nagi,\\nđã xóa tan đi sự do dự trong tôi."
2593 = "Giống như trận đấu của ngày xưa ấy,\\nđang được tái hiện lại một lần nữa――"
2594 = "Mình sẽ dẫn đường cho Nagi và anh Soutetsu,\\nđến nơi mà trái tim cả hai đang hướng về."
2597 = "Giống như lúc chèo thuyền xuôi dòng sông Kuma.\\nNghĩ rằng đây là việc nên làm, cần phải làm, và nở một nụ cười."
2607 = "Một tình yêu gần như là sự cảm động đang sục sôi tuôn trào,\\nnhuộm thắm toàn thân tôi bằng những suy nghĩ về Nagi."
2613 = "Mình sẽ ôm lấy mối tình đã kết thúc này,\\nvà giả vờ như chuyến dã ngoại vẫn đang tiếp tục."
2614 = "Chắc chắn mình sẽ không hiểu được đâu,\\nnhưng mình sợ nếu hiểu ra, nên đã quay mặt đi."
2616 = "Việc mình từ bỏ tình yêu này,\\nvà việc anh Soutetsu cùng Nagi đang hướng về nhau."
2618 = "Tôi cũng từ từ vươn tay ra."
2621 = "Tôi nhẹ nhàng đặt ngón trỏ lên môi Nagi.\\nRồi với cùng sự nhẹ nhàng ấy, đặt lên môi anh Soutetsu."
2623 = "Về cơ bản, Nagi, anh Munakata và tôi,\\nsẽ nhắm tới ba trận thắng, hoặc hai thắng một hòa."
2624 = "Ánh mắt của chúng tôi, dĩ nhiên hướng về phía Nagi."
2625 = "Mình là bạn thân nhất của Nagi cơ mà.\\nKhông sao đâu. Không sao đâu. ――Chắc chắn, tuyệt đối, không sao đâu."
2628 = "Tôi bắt chước Fukami, xoa bóp chân trái cho Nagi.\\nMục tiêu của Fukami, gần như chắc chắn là chiến thuật đánh lâu dài."
2630 = "Tôi quấn sợi dây chun vào ngón áp út của Nagi."
2632 = "Rất đáng sợ, không muốn nghe――chỉ muốn bỏ chạy.\\nNhưng nếu chạy trốn…… mình sẽ mãi trở thành gánh nặng cho anh ấy."
2634 = "Trái tim mình cảm nhận được rất rõ ràng,\\n『Chắc chắn Nagi sẽ được chọn』――"
2635 = "Tôi nắm lấy tay trái của em ấy.\\nĐến nước này thì Nagi cũng đã hiểu."
2638 = "Tôi tháo sợi dây chun đang buộc túm tóc\\ncủa Nagi ra."
2640 = "Tháo mặt nạ ra và trở về khu vực chờ,\\nNagi và Fukami hân hoan chào đón tôi."
2642 = "Dù không muốn nghe gì nữa, dù muốn về nhà khóc một trận.\\nNhưng mình vẫn khao khát những lời nói của anh Soutetsu."
2643 = "Giữ bí mật với Nagi và anh Soutetsu,\\nmình đã để họ trao nhau nụ hôn thề ước. Bằng chính ngón tay nỗ lực này."
2644 = "Mình không thuần khiết đến vậy.\\nTuyệt đối không thể giống như Nagi được."
2648 = "Tôi ôm chặt Nagi vào lòng và chủ động hôn em ấy.\\nNgay lập tức, một cảm giác chân thực trào dâng trong tôi."
2650 = "Mỉm cười nào.\\nKhông sao đâu. Mình là chuyên gia mà. Chuyên gia tiếp khách."
2652 = "Mình lau đi giọt nước mắt vừa ứa ra nơi khóe mắt.\\nBằng chính đầu ngón tay của mình."
2653 = "Sâu thẳm trong cơ thể mình đang kháng cự,\\nrằng không muốn nói, không muốn nghe."
2655 = "Tôi nhìn Nagi.\\nNagi cũng nhìn lại tôi."
2656 = "Cuối cùng, mình cũng có được trong tay."
2657 = "Cuối cùng cũng được nhìn thấy. Nhìn rõ khuôn mặt của anh Soutetsu.\\nĐược nhìn thấy, mình thấy hơi vui, nhưng cũng vô cùng cô đơn."
2661 = "Mình hiểu. Mình đã hiểu. Mình hiểu rõ.\\nĐối với anh Soutetsu, mình――"
2663 = "Nên em ấy mới thay mình――\\nđịnh gánh vác tất cả một mình."
2665 = "Vì vậy.\\nMình muốn anh Soutetsu được hạnh phúc."
2666 = "Vì thế, mình phải nói ra.\\nĐể không bỏ chạy, mình phải dùng lời nói trói buộc bản thân lại."
2673 = "Giữa tiếng vỗ tay vang dội,\\nNagi chạy như bay trở lại."
2676 = "Rồi Nagi nhìn tôi.\\nTừ khoảng cách rất gần, nhìn thẳng vào tôi bằng đôi mắt to tròn."
2677 = "Tiếp đó là những tràng pháo tay và lời chúc mừng,\\ndội xuống từ khán đài."
2683 = "Đáng lẽ trước trận đấu tôi nên vào phòng chờ lấy nó.\\nNhưng mà, có lẽ đợi ra khỏi hội trường thi đấu thì tốt hơn――"
2695 = "Đường sắt Ohito đã nhận chuyển nhượng từ Đường sắt Mikan,\\nđầu máy số IX, chiếc đầu máy đã mất đi Railord của mình."
2704 = "Nên mình cười 『Không sao đâu』――mình cười được.\\nVì Nagi đáng yêu đến mức khiến người ta ghen tị."
2706 = "Không ngờ chúng tôi lại có thể,\\nlọt vào đến tận trận chung kết quyết định ngôi vô địch――."
2716 = "Fukami không chỉ đạo gì cả.\\nChỉ gật đầu thật mạnh đáp lại Nagi khi em ấy nhìn về phía này."
2717 = "Vẫn nhìn thẳng vào Nagi,\\nFukami trả lời tôi."
2720 = "Fukami đã biến khoảng thời gian chỉ có hai chúng tôi thành con số không.\\nVà chuyển sang dành khoảng thời gian đó――để ở bên cả Nagi, thành ba người."
2722 = "Fukami gật đầu.\\nVới một nụ cười rất bình yên, tĩnh lặng."
2724 = "Qua lớp quần hakama, Fukami đang ra sức\\nxoa bóp chân phải của Nagi."
2725 = "Đôi mắt của Fukami rất kiên định.\\nÁnh lên ý chí không chút do dự từ tận sâu thẳm."
2727 = "Ánh mắt Fukami chỉ bắt lấy tôi trong một khoảnh khắc,\\nrồi lại hướng về phía Nagi."
2729 = "Lời chúc phúc của Fukami."
2730 = "Fukami mỉm cười.\\nKhông mang vẻ trêu chọc, mà là một nụ cười dịu dàng."
2733 = "Fukami có vẻ hơi ngạc nhiên.\\nKhông――em ấy đang khóc sao?"
2735 = "Fukami cất lên giọng nói đầy vui sướng.\\nTôi dĩ nhiên cũng đồng tình."
2740 = "Những tiếng nói, tiếng nói, tiếng nói.\\nTừ chú Minokasa, từ bác Seki, từ mọi người ở Đường sắt Mikan."
2741 = "Định cứu anh ấy, nhưng chính mình cũng bị trượt chân.\\nRồi được anh ấy che chở――"
2742 = "Để bù đắp cho sự bất lợi về thể hình, cô ấy chỉ tập trung vào một kỹ thuật đánh tay duy nhất,\\nvà không ngừng mài giũa nó."
2743 = "Vì mục đích thúc đẩy phong trào kiếm đạo nữ――"
2745 = "Khóc lóc thì, đợi khi chỉ còn một mình\\nkhóc bao nhiêu, khóc thỏa thích cũng được mà."
2748 = "Trắng, trắng, đỏ.\\nKhông có sự thay đổi cờ nào――được đưa ra!!"
2753 = "Trắng, trắng, trắng.\\nBa lá cờ trắng lập tức được giơ lên."
2757 = "Thật sự rất ngoan ngoãn.\\nCả anh Soutetsu và Nagi."
2764 = "Chỉ trong một khoảnh khắc."
2767 = "Đúng là như vậy.\\nNên cứ thế này, thêm một chút nữa thôi――"
2781 = "Và rồi, cái 『chỉ một chút』 đó,\\nchính là bức tường luôn――ngăn cách giữa Nagi và tuyển thủ Nakamura."
2782 = "Chỉ nghe vậy thôi là tôi đã hiểu ngay.\\nDù sao thì đối thủ cũng là tuyển thủ Nakamura."
2783 = "Trước lời nói của Fukami, Nagi nở nụ cười rạng rỡ.\\nKhông chút ngượng ngùng, không hề gượng ép, chỉ là một nụ cười thẳng thắn."
2784 = "Ngay khoảnh khắc anh Soutetsu nói vậy,\\nkhuôn mặt Nagi liền giãn ra rạng rỡ."
2786 = "Kể từ trận chung kết thời tiểu học đó, cô ấy luôn đấu với Nagi mỗi khi có cơ hội,\\nvà liên tục đánh bại những lời thách thức của Nagi――Một cao thủ đánh tay."
2794 = "Khi nằm trong vòng tay anh Soutetsu,\\nmình――dù biết là không nên――nhưng mình thấy rất hạnh phúc."
2799 = "Nếu để thời gian trôi qua, chắc chắn mình sẽ nghĩ ra những trò gian xảo.\\nSẽ bị dồn vào đường cùng và tìm cách qua mặt Nagi mất."
2800 = "Nhìn nụ cười ấy, tôi chợt nghĩ."
2810 = "Lời nói như nghẹn lại ở cổ họng."
2811 = "Nói rồi em ấy đội mặt nạ, đeo găng tay bảo hộ――"
2821 = "Nhanh nhẹn và phớt nhẹ,\\ngiống như một chú chim nhỏ mổ lấy quả mọng rồi vụt bay đi."
2822 = "Bao nhiêu năm rồi――\\nTôi đã hy vọng và chờ đợi ngày này."
2823 = "Không được.\\nNgười mệt mỏi nhất lúc này chắc chắn là anh Soutetsu cơ mà."
2824 = "Thật đáng mừng."
2825 = "Đúng nghĩa là trận quyết định.\\nTrận đấu đại diện để phân định đội vô địch."
2826 = "Tôi hoàn toàn bất ngờ.\\nCơ thể cứng đờ trong giây lát."
2827 = "Dưới cái nóng này, đối phương đã thi đấu đến tận trận chung kết cá nhân.\\nMức độ tiêu hao thể lực chắc chắn dữ dội hơn Nagi rất nhiều."
2832 = "Mình sẽ không bao giờ có thể gặp lại\\nngười bạn mà mình yêu quý nhất nữa."
2834 = "Nếu vậy, mình cũng phải đáp lại thôi.\\nThật bình thường, thật bình thường, như mọi khi."
2835 = "Bác sĩ bảo chỉ là làm việc quá sức thôi,\\nnhưng có lẽ nên gọi bác sĩ đến một lần nữa――"
2840 = "Ngoài tôi và Nagi của Đường sắt Ohito,\\ncác thành viên khác là hai người thuộc câu lạc bộ kiếm đạo Đường sắt Mikan do anh Munakata dẫn dắt."
2841 = "Dù không muốn đến mức phát khóc, dù cô đơn đến không thể tả.\\nNhưng nếu vậy――mình sẽ cố gắng hết sức."
2842 = "Cơ thể đã lớn phổng phao,\\nnhưng cách nói chuyện với Fukami vẫn y như hồi đó."
2843 = "Hai bên tiến về vạch xuất phát.\\nCùng giương kiếm trúc thủ thế."
2845 = "Bởi vì, anh Soutetsu. Chắc chắn anh ấy đã có câu trả lời rồi.\\nVà câu trả lời đó, chắc chắn sẽ là một câu trả lời buồn bã đối với mình."
2846 = "Đầu anh Soutetsu cúi xuống.\\nAnh ấy đang cúi đầu trước mình."
2847 = "Anh Soutetsu gọi tên Nagi trước.\\nĐó có lẽ chỉ là phản xạ tự nhiên, hoặc do trùng hợp thôi."
2848 = "Anh Soutetsu im lặng.\\nCó lẽ anh ấy đang chờ đợi lời nói của Nagi, của tôi."
2849 = "Mình đang được khen ngợi rất nhiều.\\nĐôi má nóng bừng đỏ ửng."
2850 = "Hơi bất ngờ một chút.\\nNên mình muốn nghe tiếp."
2851 = "Khuôn mặt anh ấy có chút ngạc nhiên.\\nSau đó, anh Soutetsu khẽ lắc đầu."
2852 = "Anh Soutetsu nhìn tôi."
2853 = "Mắt anh Soutetsu mở to.\\nÁnh nhìn đờ đẫn như bị phủ một lớp màng bỗng trở nên rõ ràng."
2854 = "Chỉ trao đổi một câu với anh Soutetsu,\\nNagi đã trở lại là Nagi của mọi ngày."
2855 = "Anh ấy gọi tên Nagi. Ngay câu đầu tiên.\\nLúc anh ấy ngã xuống, người ở bên cạnh là mình cơ mà……"
2856 = "Cuối cùng anh Soutetsu cũng nhìn tôi.\\nVới ánh mắt có phần đờ đẫn."
2866 = "（……Làm vậy thì đúng là đau đớn thật đấy, nhỉ）"
2877 = "（A）"
2878 = "（Xoạt! Xoạt! Xoạt!）"
2879 = "（A――mình cũng vậy）"
2881 = "（Bốp bốp bốp bốp!!!）"
2882 = "（Xoạt! Xoạt! Xoạt!!!）"
2883 = "（Xoạt! Xoạt! Xoạt!）"
2887 = "（Từ khi nào――nhỉ）"
2889 = "（Bốp!!）"
2890 = "（Bốpppppppp!）"
2891 = "（Không ngờ lại có thể tiến xa đến mức này.\\nNagi dĩ nhiên là vậy, nhưng thông qua việc chỉ đạo, tôi cũng đã trưởng thành lên rất nhiều.）"
2893 = "（Chạm nhẹ）"

[selections]
