1811 = "「Nếu nói về tâm tư đối với Nagi thì――\\nChỉ có một từ thôi, 『Nguy hiểm』.」"
1812 = "「Tâm tư của anh.\\nĐối với Nagi. Đối với Fukami.」"
1814 = "「Hai người bên tôi mới chỉ sơ đẳng và nhị đẳng. Ở giải đấu tầm cỡ này,\\nđây là những thành viên khó lòng giành được cả một trận hòa.」"
