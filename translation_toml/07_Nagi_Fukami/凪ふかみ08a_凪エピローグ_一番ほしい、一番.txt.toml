1541 = "「Sức đột phá của Nagi đôi khi là con dao hai lưỡi.\\nBởi vì đâm vào rất sắc bén, nên khi cần rút ra lại trở thành trở ngại.」"
1542 = "「Thắng rồi nhỉ. \\x%l機関士;#00ffc040;Lái tàu%l;#; Migita.」"
1544 = "「Quả nhiên là chị bị đau ở đâu đó đúng không?」"
1546 = "「Em nói thế thì chiếc nhẫn đính hôn thật biết để đâu cho được.\\nAnh cũng đã cất công chọn lựa kỹ lưỡng lắm đấy.」"
1547 = "「Của anh đây, ạ. Chanh ngâm mật ong.」"
1555 = "「Chuyến dã ngoại sao?」"
1570 = "「Trước tiên, em tháo đôi găng tay bảo hộ đó ra được không?」"
1574 = "「Cụ thể thì, bọn em nghĩ việc tiếp tục chuyến dã ngoại như từ trước đến nay,\\nđã có chút không ổn rồi――là chuyện đó đó.」"
