1497 = "「Ể~ Sao lại là bí mật chứ?」"
1499 = "「Chỉ là――anh đã chờ đợi ngày hôm nay suốt bao nhiêu năm rồi.\\nAnh muốn chuẩn bị một bầu không khí thật lãng mạn, rồi chính anh sẽ là người cầu hôn Nagi cơ.」"
1501 = "「Không. Không đau. Cũng không khó chịu.\\nChỉ là, đầu óc hơi rối bời một chút――Hửm? Bác sĩ sao?」"
1502 = "「Không, ngược lại mới đúng.」"
1504 = "「Không đâu, Nagi.\\nChị không sao. Chị không bị thương ở đâu cả.」"
1506 = "「Không, phần thi của anh đến đây là kết thúc rồi.\\nEm hãy cho Nagi ăn đi, em ấy sắp bước vào trận quyết định rồi.」"
1509 = "「Tuyển thủ Nakamura đã thi đấu đến tận trận chung kết cá nhân,\\ncòn Nagi thì không tham gia giải cá nhân, mức độ mệt mỏi hoàn toàn khác nhau.」"
1511 = "「Cũng không ít lần chúng ta được cứu nguy\\nnhờ những trận hòa của hai cô ấy mà.」"
1513 = "「Hai bên, chào nhau.」"
1516 = "「Cái!?」\\n「Hự!」"
1519 = "「Hôm nay chính là ngày Nagi trở thành công chúa.\\nLà ngày em nhất định phải giành lấy vị trí số một đấy.」"
1526 = "「Nagi cũng đẹp. Nhưng có những thứ nổi bật hơn cả sự xinh đẹp.\\nChẳng hạn như tràn đầy năng lượng――hay 『ồn ào』.」"
1527 = "「Được Nagi cầu hôn,\\nanh cũng thấy vô cùng vinh dự và hạnh phúc.」"
1530 = "「Nagi rất thẳng thắn và không hề do dự. Vì tin rằng mình đúng,\\nnên dù mọi người xung quanh có chỉ ra là sai, em ấy cũng khó mà lùi bước.」"
1532 = "「Sao thế? Nagi.」"
1533 = "「Ý thức được rằng duy trì hiện trạng chẳng khác nào sự suy thoái chậm rãi,\\nluôn khao khát cải thiện, muốn tốt hơn, tốt hơn nữa.」"
1536 = "「Mọi thứ của Fukami đều gắn liền với chuyến xuôi dòng sông Kuma.\\nGiống như Hachiroku gắn liền với tuyến đường sắt vậy.」"
1538 = "「Tâm tư của anh Soutetsu――ạ.」"
