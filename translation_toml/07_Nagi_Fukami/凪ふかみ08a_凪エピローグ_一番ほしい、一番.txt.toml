1220 = "「――Chắc chắn cô ấy đang vô cùng vui sướng theo dõi.\\nDù là nhờ sự kỳ diệu của giải đồng đội, nhưng cuối cùng cũng vào đến trận quyết định ngôi vô địch rồi mà.」"
