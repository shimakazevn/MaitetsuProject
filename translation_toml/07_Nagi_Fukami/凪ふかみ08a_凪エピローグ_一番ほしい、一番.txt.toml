1817 = "「Em hiểu rồi, và em cũng đã thấy rồi, ạ!」"
1820 = "「Tôi hiểu mà. Nhìn vào thứ tự thi đấu từ đầu đến giờ là biết.」"
1821 = "「Vì em quá lo lắng, nên giờ thở phào nhẹ nhõm mới bị thẫn thờ thôi.\\nNhưng mà, giờ không sao rồi. Em tỉnh táo lại rồi!」"
1823 = "「Tâm tư của anh?」"
1825 = "「Anh biết.\\nCả việc Nagi đã từ chối lời khuyên đó nữa.」"
