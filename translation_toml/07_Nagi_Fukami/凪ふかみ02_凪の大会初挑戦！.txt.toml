2223 = "「Đáng sợ á!?」"
2225 = "「Cậu ngầu lắm đó Nagi-chan!\\nĐể tớ lau mồ hôi cho nhé!」"
2226 = "「Nghe nói đây là nơi tu luyện từ nhiều đời trước của sư phụ rồi đó.」"
2228 = "「Tâm. Kỹ. Thể.」"
2235 = "「Sao vậy?」"
2243 = "「Tôi không phiền đâu.\\n——Navi cũng nói là rất sẵn lòng đấy.」"
2247 = "「Lý do sư phụ của Nagi lấy việc vô địch đại hội làm bài tập tu luyện,\\nanh cảm thấy mình cũng phần nào hiểu được rồi.」"
2248 = "「Ừm. Từ giờ tôi sẽ luyện tập với Nagi, nhưng mà——」"
2250 = "「Anh hiểu cảm giác của em, nhưng nếu cả lái tàu và Railord đều vắng mặt thì\\n8620 sẽ không thể chạy được.」"
2252 = "「Anh đã nhìn thấy. Các trọng tài cũng vậy.\\nHơn thế nữa, rõ ràng hơn bất kỳ ai——Nagi đã thấy.」"
2255 = "「Anh có mang theo phần của Nagi đây.\\nThử thủ thế Chính Nhãn xem nào.」"
2256 = "「Anh vốn biết đường kiếm của Nagi rất sắc bén——\\nNhưng không ngờ đấy. Em đã trưởng thành đến mức này rồi sao.」"
2258 = "「Vì vậy, trước mắt hãy chỉ nghĩ đến việc thể hiện hết khả năng của mình thôi.\\nTrong khuôn khổ luật lệ. Nếu là việc giúp đỡ đó, anh cũng làm được.」"
2260 = "「Nghĩa là, đối thủ của Nagi,\\nsẽ là những bé gái bằng tuổi mình và Nagi, hoặc nhỏ hơn một chút phải không?」"
2261 = "「Đ, đâu có đâu!」"
2264 = "「Không tuyệt chút nào đâu! Cả sư phụ, cả anh hai,\\nlẫn Fukami, có đầy chuyện mình không bằng mọi người mà.」"
2265 = "「Xin lỗi, để hai đứa đợi lâu rồi!」"
2269 = "「Cổ tay...」"
2270 = "「Anh nghe nói chủ yếu là các loại thể thuật như đá, chặt tay các kiểu.」"
2273 = "「Đã rõ.」"
2275 = "「Đúng vậy. Làm người khác sợ là do sát khí tỏa ra.\\nNếu sát khí tỏa ra, đối thủ sẽ đoán được hành động của mình.」"
2276 = "「Đúng rồi.」"
2279 = "「Đúng vậy! Thể Xá Lưu là môn kiếm thuật\\ntích cực sử dụng cả những thứ khác ngoài đao kiếm để giành chiến thắng!!」"
2280 = "「Đúng vậy! Thể Xá Lưu bắt nguồn từ Nhất Đao Lưu,\\nrồi từ Thể Xá Lưu lại sinh ra Thứ Nguyên Lưu đó!!」"
2281 = "「Đúng vậy!」"
2283 = "「Đúng rồi đó! Nhưng mà, hôm nay chúng ta chỉ\\nluyện tập tư thế, bước chân và vung kiếm thôi á.」"
2285 = "「Đúng vậy!!\\nMình đăng ký vào nhóm học sinh khối lớp trên của cấp Tiểu học.」"
2287 = "「Đúng vậy! Thể Xá Lưu là số một Hinomoto!\\nĐược Fukami khen, ngài Kurando chắc cũng vui lắm đó!」"
2289 = "「Đúng vậy. Kiếm thuật hướng tới việc đạt đến đỉnh cao của kỹ thuật điều khiển kiếm,\\ncòn kiếm đạo hướng tới việc tu dưỡng đạo làm người thông qua thanh kiếm.」"
2290 = "「Đúng thế.」"
2292 = "「Ừ. Tức tưởi lắm. Và cũng, buồn nữa.」"
2296 = "「Pha lao vào lúc đầu——thế giằng co đó chỉ là mồi nhử.\\nNó làm anh lầm tưởng rằng đối phương đang nhắm vào khoảnh khắc tách ra.」"
2298 = "「Được chứ! Nagi-sama cực kỳ rành mấy đòn vật luôn nha!!」"
2299 = "「Anh không rõ là có vô nghĩa hay không,\\nnhưng chắc chắn là em sẽ không thể chứng minh được kết quả.」"
2302 = "「Có lửng chó á!!? Ở đâu!? Ở đâu!!?」"
2305 = "「Dùng kiếm gỗ mà làm được như vầy sao!?」"
2313 = "「Chính Nhãn? Là sao——」"
2317 = "「Sát khí……」"
2318 = "「Không bằng mình á!?」"
2319 = "「Có đầy rẫy những người mạnh hơn mình rất rất nhiều.\\nNếu không thì, chẳng còn là tu luyện chút nào nữa.」"
2321 = "「Trận đấu tiếp tục.」"
2329 = "「Không có chuyện đó đâu ạ!」\\n「Làm gì có chuyện đó á!」"
2331 = "「Ừm. Đối với cấp Trung học cơ sở trở xuống,\\nvì nguy cơ chấn thương cao nên bị cấm hoàn toàn.」"
2332 = "「Ừm. Do đó ở giải đấu lần này,\\nNagi chỉ tung ra mỗi đường kiếm đó và tiến sâu đến tận đây.」"
2333 = "「Ừm. Để chuẩn bị cho đại hội, em sẽ dùng kiếm tre để luyện tập với anh.\\nVì trong đại hội, đương nhiên là phải dùng kiếm tre mà.」"
2346 = "「Nơi em đang đứng bây giờ,\\ncó phải là chỗ để ngoảnh lại nhìn quá khứ không?」"
2348 = "「Vì đây là kiếm đạo chứ không phải kiếm thuật mà.\\nMục đích không phải là hạ gục đối thủ bằng mọi giá.」"
2349 = "「Làm sao mà không trưởng thành cho được!\\nCả tu luyện, xúc than, chèo thuyền trên sông Kuma lẫn việc học! Em đều rất cố gắng mà!!」"
2350 = "「Tất nhiên. Chắc chắn đối phương cũng nhắm đến đòn đánh lúc tách ra.\\nNhưng——chính vì phòng ngừa được điều đó từ trước, nên anh đã chủ quan.」"
2352 = "「Trăm nghe không bằng một thấy!!\\nMình sẽ tung một nhát kiếm! Nhìn cho kỹ nha! Cả anh hai nữa!!」"
2355 = "「Tư thế ban đầu——không lấy lại được rồi.」"
2356 = "「Sẽ là một đối thủ mà Nagi không quen đối phó đây.」"
2360 = "「Cậu ấy giỏi thật á.\\nCú đánh cổ tay như vậy, tớ bây giờ chưa thể làm được nè.」"
2362 = "「Mục đích, là sao ạ——」"
2363 = "「Tớ cũng muốn cho Hachiroku và chị Hibiki xem nữa nè~」"
2366 = "「Đúng là một người kỳ lạ ha.\\nKhông biết sư phụ làm nghề gì nhỉ?」"
2367 = "「Cậu chu đáo quá đi á.」"
2372 = "「Thật hả!? Vậy lát nữa dẫn mình đi nha, Nagi.\\nĐến viếng mộ chắc chắn sẽ được phù hộ nhiều lắm đây!」"
2373 = "「Thật hả!?」"
2374 = "「Liệu có xuất hiện không nhỉ? Những người như thế.\\nNhững người giỏi cỡ Nagi hay anh Soutetsu ấy.」"
2375 = "「Em hiểu rồi!」"
2377 = "「Đó là môn kiếm thuật đặt cược tất cả\\nvào việc hạ gục đối thủ bằng một nhát chém duy nhất phải không? Thứ Nguyên Lưu ấy.」"
2385 = "「Kiếm tre!」"
2387 = "「Hiệu ứng bụi tre, công nhận lợi hại ghê.\\nRất có không khí——giống như trong mấy câu chuyện cổ tích ấy.」"
2388 = "「Cuối cùng cũng đến lúc rồi á! Trận chung kết!!」"
2394 = "「Mình có điểm gì……khiến Nagi nghĩ là 『không bằng』 cơ chứ\\n——A, chiều cao hay mấy cái tương tự hả? Cỡ ngực chẳng hạn.」"
2396 = "「Làm được chứ?\\nMấy cây quanh đây đều là do sư phụ chém đó!」"
2398 = "「Ngài Kurando?」"
2401 = "「Hà——hà——hà——hà」"
2403 = "「Lao vào áp sát ngay khi đối phương vung kiếm lên để tạo thế giằng co——\\nChỉ cần do dự một khoảnh khắc thôi là không thể làm được.」"
2409 = "「Kakume Kurando! Sư tổ sáng lập Thể Xá Lưu đó!\\nNgay gần bụi tre này có mộ của ngài Kurando đấy!」"
2411 = "「Được khen như vậy,\\nNagi-sama sẽ đắc ý lắm đó nhaaaa……Ơ, hửm?」"
2412 = "「C-cậu đang nói cái gì vậy!?」"
2413 = "「Khí thế lắm.」"
2414 = "「Xin chỉ giáo!」"
2415 = "「Xin hãy cùng em luyện tập.」"
2416 = "「Để anh cho xem.」"
2422 = "「Khoảnh khắc xuất chiêu?」"
2429 = "「Kết hợp với bước chân, từ thế Seigan vung kiếm lên Daijodan.\\nRồi không dừng lại mà đánh thẳng vào mặt thì kiếm của Nagi mới phát huy được.」"
2442 = "「Tất cả những thứ đó,\\nchắc hẳn đã tạo nên một chuỗi liên kết theo hướng tích cực nhỉ.」"
2443 = "「Chuyện, đó——」"
2444 = "「Đó chỉ là suy đoán của anh thôi.\\nCó lẽ là vì——“Vô địch là cực kỳ khó khăn”.」"
2445 = "「Vậy sao.」"
2446 = "「Nếu vậy thì, cũng không bị tính là phạm lỗi, đúng không ạ?」"
2447 = "「Nếu vậy——」"
2448 = "「Bụi tre sâu thế này cơ mà!\\nCó cáo hay lửng chó chui ra cũng chẳng có gì lạ đâu!」"
2449 = "「Lại đây, Nagi.」"
2450 = "「Quá đáng! Nagi-sama không phải là lửng chó nha!」"
2451 = "「Trả đũa Nagi-chan vì dám trêu tớ này!」"
2456 = "「Vậy Nagi cũng làm được mấy cái đó hả?」"
2457 = "「Tại sao lại——ưm, có nhiều loại kiếm thuật\\nđược sinh ra như vậy ạ?」"
2458 = "「Cái đó……Thể Xá Lưu á? Mình chỉ biết mỗi cái tên thôi,\\nnên đang nghĩ không biết nó như thế nào.」"
2460 = "「Đó là vì dùng kiếm tre nên mới làm được như vậy thôi.\\nNếu đây là một trận đấu bằng kiếm thật thì——」"
2462 = "「Vậy thì, Nagi. Chúng ta bắt đầu từ việc chào hỏi nhé.\\n『Xin chỉ giáo』」"
2463 = "「Vậy thì, em sẽ về nhà một chuyến,\\nrồi quay lại ngay ạ.」"
2466 = "「Vậy, ý cậu là sao? Ở điểm nào cơ?\\nViệc mình hơn Nagi ấy.」"
2468 = "「Vì Fukami không tập kiếm thuật mà.\\nNhưng nếu đối thủ là anh hai, lộ sát khí ra thì sẽ phản tác dụng đó.」"
2469 = "「Mình nghĩ họ sẽ cứng đờ người lại thôi. Sát khí, hay những thứ đại loại thế,\\nnếu bị nhắm vào, trước cả khi kịp đọc được chuyển động của đối phương.」"
2470 = "「Anh đã làm Nagi để tâm đến chuyện đó. Thế nên, đường kiếm lại càng thêm chậm chạp,\\nvà đối phương đã nhắm trúng khoảnh khắc xuất chiêu mà đòn đánh đầu tiên không nắm bắt được.」"
2472 = "「Đã bảo rồi mà,\\nđó là do Fukami không học kiếm thuật thôi.」"
2476 = "「Bắt đầu!」"
2478 = "「Dù [Thể] không đổi, nhưng [Kỹ] lại bị trói buộc đáng kể.\\nTrong hoàn cảnh đó, em có thể thể hiện sức mạnh của [Tâm] đến mức nào.」"
2479 = "「Dù tư thế vác kiếm hơi lệch, nhưng đòn đánh đó thì không thể không giương cờ được.\\nTàn tâm cũng tràn đầy khí thế.」"
2480 = "「Với anh Soutetsu á?」"
2481 = "「Không lẽ——sư phụ của Nagi, làm được sao?」"
2482 = "「Căn bản và cũng là tuyệt kỹ của phái Taisha là chém chéo từ tư thế mở nửa người sang phải.\\nNhưng vì đó là đòn cấm, nên đường kiếm của Nagi bị hạn chế.」"
2483 = "「Tư thế Chính Nhãn cũng có trong Thể Xá Lưu mà!\\nVì Thể Xá Lưu! Là một nhánh của Nhất Đao Lưu đó.」"
2631 = "Cờ kìa!\\nTrắng, trắng, trắng!!"
2633 = "Phất!! \\nCờ đồng loạt giương lên!!"
2635 = "Không đúng. Mình."
2636 = "Không được.\\nNếu bị gặng hỏi học từ đâu thì phiền lắm!"
2651 = "Trọng tài chính hô lớn bảo dừng lại,\\nvà đưa Nagi-chan cùng cô bé đối thủ trở về——vạch xuất phát ban đầu."
2653 = "Trọng tài chính ra hiệu cho nhân viên hội trường,\\nnhờ họ lau sạch mồ hôi trên sàn."
2655 = "Và chắc chắn,\\nCũng là để bản thân mình trở thành một người lớn tuyệt vời hơn bây giờ."
2656 = "Hai thanh kiếm tre như cắn chặt vào nhau không nhúc nhích.\\nTrong thế trận đó. Họ đang chiến đấu bằng tiếng thét, bằng khí thế."
2657 = "Cái thế Tsubazeriai đó, nhìn thôi đã thấy mệt rồi.\\nNếu thi gan lỳ thể lực, Nagi-chan không đời nào thua được."
2667 = "Nghĩ lại mới thấy, cậu ấy thật sự rất tuyệt.\\nVới cơ thể nhỏ bé thế này, mà xúc vào hàng tấn than."
2669 = "Nhưng cũng không phải là Nagi hoang dã như động vật."
2672 = "Nhưng mà, mình không thể không hỏi được.\\nBởi vì, bởi vì, bởi vì Nagi——"
2674 = "Nhưng bây giờ thì tôi đã hiểu."
2676 = "Nhưng mà——vì được một người như vậy,\\nchỉ dạy ở một nơi như thế này——"
2684 = "Một con chó hoang đang đói bụng, gầm gừ,\\nvà chặn ngay trước con đường mình đang đi."
2686 = "Thế rồi, nỗi sợ hãi tan biến đi mất.\\nBây giờ, chuyện gì vừa xảy ra……dù sợ, nhưng tôi vẫn muốn biết."
2688 = "Một mạch vung kiếm lên cao, rồi cứ thế lao vào đối thủ——!?"
2689 = "Tuyệt quá——tư thế thật vững chãi và oai phong.\\nNhìn hai người, mình thầm nghĩ. Anh Soutetsu cũng mạnh thật đấy."
2771 = "Bán khai, chắc có nghĩa là mở một nửa.\\nCơ thể của Nagi, đúng như cái tên, xoay nửa người lại——!"
2773 = "Ví dụ như sát khí của Nagi——không phải là hổ,\\nmà chỉ ngang với một con chó hoang đang đói bụng đi chăng nữa……"
2775 = "Ngay cả một người ngoại đạo như mình cũng hiểu được nó lợi hại đến mức nào.\\nKhông bị thân tre dội ngược lại, mà cứ thế dùng kiếm gỗ chém đứt nó."
2776 = "Rằng Nagi đã trở nên trưởng thành đến thế này."
2827 = "Gọi là cô thì hơi tội nghiệp,\\nnhưng gọi là chị thì có vẻ hơi nịnh nọt."
2830 = "A a, buồn cười quá."
2831 = "Ra vậy, là câu chuyện lúc Nagi và anh Soutetsu\\ngặp nhau lần đầu tiên."
2833 = "A——"
2837 = "Vậy nên mới bảo Nagi-chan hãy tiếp nhận nó,\\nvà đợi đối thủ tự tách ra, chắc chắn là vậy!"
2839 = "Nagi-chan toàn luyện tập với người lớn\\nnhư sư phụ hay anh Soutetsu thôi mà——"
2840 = "Vì bờ vai nhấp nhô của cậu ấy đang nhỏ dần lại,\\ntôi có thể thấy, Nagi-chan đang cố gắng ổn định nhịp thở."
2841 = "Bởi vì nước mắt đã rơi lã chã, lã chã thế này.\\nTrào ra mất rồi."
2842 = "Bị vỗ bụng bình bịch trong bụi tre này,\\nNagi trông ngày càng giống một con lửng chó thật sự."
2847 = "Không thể nào……Giỏi quá!\\nThanh kiếm gỗ mà Nagi vung xuống——"
2848 = "Thích ghê.\\nTrông Nagi có vẻ rất vui."
2852 = "Nagi làm vẻ mặt giật mình,\\nrồi cười khúc khích."
2855 = "Một Nagi mà mình không hề biết,\\nđang nói chuyện ngang hàng với anh Soutetsu."
2857 = "Góc nghiêng ấy, khiến tôi thoáng chốc mê mẩn.\\nThật tĩnh lặng, thật xinh đẹp——ngay cả những giọt mồ hôi cũng lấp lánh như ngọc vậy."
2858 = "Rõ ràng đã cố gắng hết sức để cười,\\nnhưng những giọt nước mắt cứ thế phá vỡ và làm tan chảy nụ cười ấy."
2861 = "Nagi, đáng yêu quá.\\nKhông phải kiểu dễ thương của lửng chó, mà là sự đáng yêu của một người con gái."
2863 = "Cậu ấy vẫy cả hai tay thật mạnh.\\nÔng bà của Nagi-chan cũng đang cười thật tươi."
2864 = "Nhìn thẳng, thật thẳng——\\nCậu ấy nhìn anh Soutetsu chằm chằm như muốn xuyên thấu vậy."
2867 = "Tư thế không hề bị phá vỡ, cơ thể vẫn giữ nguyên trạng thái căng cứng,\\nlách qua mọi thứ nhưng lại lao đi trên một đường thẳng! Như một mũi tên vậy!!"
2869 = "Mở mắt ra."
2870 = "Nghe thấy rồi!\\nNghe thấy tức là, cậu ấy không hề mất bình tĩnh!"
2872 = "Nagi-chan lặng lẽ bước đi.\\nCậu ấy đứng trước vạch xuất phát, ngay giữa trung tâm sân đấu."
2874 = "Cậu ấy tự vỗ vỗ vào ngực mình,\\nvới khuôn mặt hơi phụng phịu, để xác nhận lại."
2876 = "Âm thanh thật lớn.\\nNagi thực sự đang tu luyện ở một nơi như thế này sao."
2879 = "Nếu là kiếm thật, Nagi-chan, đã không thể vung kiếm lên được.\\nĐánh vào cổ tay, tức là——giống như chém đứt cổ tay vậy."
2880 = "Nếu chưa nhìn thấy Nagi-chan của ngày hôm nay,\\nchắc chắn tôi đã thắc mắc \"Biện pháp an toàn á?\"."
2882 = "Nếu cố gắng vung vẫy mạnh bạo để thoát ra,\\nchắc chắn sẽ tạo ra sơ hở——trở thành mục tiêu của đối thủ."
2892 = "Nhanh quá! Cô bé này cũng vậy!"
2893 = "Cô bé đối thủ cũng làm động tác \"Sonkyo\".\\nHai cơ thể, hai thanh kiếm tre đối diện thẳng với nhau."
2894 = "Cô bé đối thủ, có vẻ đuối sức rồi."
2895 = "Bám chặt lấy Nagi-chan như thể đang đâm sầm vào,\\nkhiến Nagi-chan không thể vung kiếm xuống được."
2896 = "Đối thủ chắc chắn đang hao tổn thể lực hơn Nagi-chan,\\nthế thì chắc chắn sẽ không thể lao vào như lúc nãy nữa."
2897 = "Nagi giật mình, cuống cuồng cả lên."
2899 = "Vừa nghe thấy tiếng còi, Nagi-chan liền \"bốp\" một cái!\\nCậu ấy dùng hai tay vỗ mạnh vào hai bên má mình."
2901 = "Nagi-chan, đã quay lại từ lúc nào."
2905 = "Fufufu, mới lúc nãy còn luống ca luống cuống,\\nthế mà giờ Nagi đã cười tươi rói luôn rồi!"
2906 = "Nagi kéo hơi mạnh quá rồi!\\nMá mình hơi rát một chút, nhưng mà cũng thấy vui vui."
2908 = "Thế mà Nagi lại lách qua những khe hở tưởng như không có đó,\\nlao đi, lao đi như một cơn gió——"
2910 = "Nagi-chan ngồi xổm xuống.\\nMột tư thế gọi là \"Sonkyo\"."
2912 = "Việc Nagi tham gia đại hội, không phải vì muốn vô địch,\\nmà là vì muốn chiến đấu với đối thủ mạnh……vì muốn tu luyện."
2914 = "Nagi ngó ngoáy tìm kiếm xung quanh.\\nFufufu, giống hệt một con lửng chó luôn!"
2916 = "Quay lại vạch xuất phát, cúi chào.\\nNagi-chan đang chạy về phía này!!"
2917 = "Nagi-chan, nhận ra điều đó, cố dùng nụ cười gượng gạo để ngăn lại\\nnhưng, không thể dừng lại được. Làm sao mà dừng được chứ."
2920 = "Một Nagi trưởng thành hơn Nagi thường ngày.\\nMột Nagi mà mình chưa từng biết đang hiện diện ở đây."
2923 = "Vẻ mặt Nagi trở nên nghiêm túc.\\nBầu không khí thay đổi."
2927 = "Nagi dựng thanh kiếm gỗ vào gốc tre,\\nrồi dùng cả hai tay nắn bóp má mình!"
2929 = "Nhón lấy lát chanh bỏ vào miệng,\\nmắt Nagi-chan dáo dác nhìn quanh khán đài."
2930 = "Nagi-chan,\\nlao sầm vào người anh Soutetsu."
2932 = "Nagi-chan cố tình nhíu chặt gốc lông mày lại,\\ntrông nhăn nhó như mặt quỷ vậy."
2934 = "Trông Nagi-chan có vẻ rất khó chịu."
2937 = "Nagi hít một hơi thật sâu.\\nHít vào, lặng lẽ nhắm mắt lại, rồi từ từ thở ra——"
2938 = "Nagi hít một hơi thật sâu, ánh mắt liền thay đổi."
2940 = "Suất đại diện của tỉnh Kumamoto chỉ có duy nhất một.\\nNagi-chan đang chiến đấu vì suất đó."
2941 = "Nagi-chan vốn rất khó chịu với điều đó, nhưng trọng tài đã tách họ ra——\\nNên tôi đinh ninh rằng thế này là nắm chắc phần thắng rồi."
2942 = "Không có tiếng đáp lại. Làm sao mà trả lời được cơ chứ.\\nNhưng tôi biết, Nagi-chan vẫn nghe thấy rất rõ."
2945 = "Khi đứng lên thì thấy rõ ràng luôn.\\nCô bé đối thủ nhỏ nhắn quá."
2947 = "Sư phụ của Nagi.\\nLà một người lúc nào trông cũng ngái ngủ và ủ rũ."
2949 = "Nagi-chan, không vác kiếm lên vai!!"
2951 = "Ánh mắt Nagi thay đổi."
2952 = "Giọng cậu ấy đột nhiên nhỏ lại.\\nHai má Nagi từ từ ửng đỏ."
2954 = "Gương mặt Nagi-chan nhăn nhó lại."
2956 = "Nagi-chan đứng dậy.\\nAnh Soutetsu đưa cho cậu ấy thanh kiếm tre."
2957 = "Cậu ấy cầm lấy thanh kiếm gỗ, vác lên vai phải và thủ thế."
2959 = "Nagi……\\nKhông phải là Nagi ngây thơ thường ngày nữa."
2961 = "Dải băng trắng của Nagi-chan tung bay phấp phới.\\nDù bề ngoài có vẻ tĩnh lặng——nhưng lực lượng đang giằng co rất quyết liệt."
2962 = "Gật đầu.\\nNagi-chan khẽ gật đầu."
2963 = "Bởi vì người thua cuộc là Nagi-chan.\\nNgười tức tưởi và buồn bã nhất là Nagi-chan mà."
2967 = "Vừa nói, cậu ấy vừa luồn khỏi tay mình,\\nrồi vỗ vỗ vào bụng bình bịch cho mình xem."
2968 = "Cậu ấy tròn xoe mắt, ngơ ngác.\\nNếu con vật lúc nãy là hổ, thì Nagi bây giờ là một con lửng chó nhỏ."
2970 = "Nagi-chan, không sao đâu!\\nHoàn toàn không khác gì bình thường cả!!"
2973 = "Nó bị cắt đứt hệt như cây tre có công chúa Kaguya bên trong\\nở mấy câu chuyện cổ tích trên anime TV ấy!"
2975 = "Trong tình huống đó, dù có học kiếm đạo đi chăng nữa——\\nNếu là mình, chắc chắn vẫn sẽ không thể nhúc nhích được."
2977 = "Dù biết chắc đối phương sẽ đánh như vậy,\\nnhưng để lao vào ngay lúc Nagi-chan vung kiếm lên thì——"
2981 = "Phải mau đổi chủ đề thôi——\\nÀ, đúng rồi!"
2982 = "Cảm giác thật đúng là Nagi và mình.\\nBàn tay của Nagi, mùi hương của Nagi, mình cảm nhận được rất rõ."
2984 = "Người vô địch giải cấp thành phố sẽ tham gia giải cấp tỉnh,\\nrồi phải vô địch cả giải cấp tỉnh mới được dự giải toàn quốc."
2991 = "Cả tâm trí và những ngón tay cùng chuyển động."
2992 = "Cứ thế này không cần vội vàng, chờ hiệp phụ có vẻ tốt hơn."
2995 = "Mình……mình cũng từng được khen,\\nnhưng chưa bao giờ được xoa đầu nhiều như vậy."
2997 = "Tôi ngồi thụp xuống!\\nSợ hãi vì nghĩ có thứ gì đó sắp tới, cơ thể tôi cứng đờ không cử động nổi!"
2999 = "Mình bất giác thốt lên,\\nlàm Nagi giật mình ngạc nhiên."
3001 = "Tôi cũng vậy.\\nTôi đã thở phào nhẹ nhõm."
3003 = "Mình cũng nghĩ đúng là như vậy.\\nXúc than rèn sức mạnh. Chèo thuyền rèn thăng bằng."
3005 = "Cả hai cùng nhón lấy một miếng chanh.\\nMột miếng thật to, ngập tràn mật ong!"
3007 = "Mình thực sự đã rất sợ,\\nthế mà Nagi lại đang tủm tỉm cười, mặt vênh váo."
3011 = "Tôi và Nagi-chan chợt chạm mắt nhau.\\nCùng gật đầu."
3012 = "Không nghe nhầm đúng không?\\nMình quay sang nhìn Nagi, hai đứa chạm mắt nhau."
3014 = "Nên mình nhào tới ôm chầm lấy cậu ấy luôn!"
3015 = "Mình không suy nghĩ sâu xa lắm, chỉ nghe loáng thoáng thôi,\\nnhưng nghe xong những lời vừa rồi, mình cảm giác như đã hiểu ra đôi chút."
3018 = "Dù rất ngạc nhiên,\\nnhưng Nagi không có vẻ gì là đang trêu đùa cả."
3019 = "Mình không hề có ý định cắt ngang câu chuyện của Nagi,\\nnhưng lỡ thốt lên mất rồi."
3022 = "Mình định……khen ngợi cơ mà,\\nkhông hiểu sao Nagi lại ôm đầu."
3023 = "Có thể nghe thấy tiếng thở hắt ra thật lớn.\\nTừ Nagi-chan, từ cô bé đối thủ, và chắc chắn là từ cả hội trường."
3024 = "Qua giọng nói của anh Soutetsu, tôi cũng cảm nhận được.\\nQuả nhiên, đây chính là cơ hội!!"
3026 = "Việc mà tôi có thể giúp.\\nHộp cứu thương, chanh ngâm mật ong, và nước uống thể thao."
3027 = "Nagi-chan từ từ dùng khăn tay,\\nquấn gọn lại mái tóc đang ướt đẫm mồ hôi."
3029 = "Nơi ánh mắt anh Soutetsu hướng tới——\\nỞ phía bên kia sân đấu, là một ông lão trông rất dạn dày kinh nghiệm."
3032 = "Cho nên... đã bị nhìn thấu.\\nBị nhìn thấu——và bị bắt bài như thế này."
3034 = "Lồng ngực của anh Soutetsu——\\nVì thế bây giờ, là của riêng một mình Nagi-chan."
3036 = "Chính vì vậy, nếu nghĩ đến việc phân chia vai trò,\\nđáng lẽ mình nên quan sát sân đấu bên cạnh mới phải."
3038 = "Nhưng, cũng vì thế——\\nĐây tuyệt đối! Là cơ hội của Nagi-chan!!"
3048 = "Đã lỡ vậy rồi thì nhân tiện,\\nmình cảm thấy nên hỏi luôn cho rồi."
3053 = "Dù là những từ ngữ nghe như đùa, như trong manga,\\nnhưng mình vẫn bất giác gật đầu."
3054 = "Cố gắng đẩy ra, cố gắng tách ra không biết bao nhiêu lần,\\nnhưng đối thủ vẫn không chịu buông."
3057 = "Thời gian cứ thế trôi đi.\\nVậy mà, cả hai vẫn không hề di chuyển. ……Không thể di chuyển."
3061 = "Quả nhiên là hổ mà!\\nNagi, thật tuyệt vời, khí thế quá dữ dội!!"
3073 = "Hổ……thì có vẻ hơi quá lời.\\nNhưng mà, mình thực sự đã rất sợ."
3077 = "Bầu không khí trở nên căng thẳng,\\nđến mức người đứng xem như mình cũng phải vươn thẳng lưng lên."
3080 = "Tại sao, lại là đỏ?"
3081 = "Tại sao!? Sao lại thế!!?\\nMàu của Nagi-chan, là màu trắng cơ mà!!"
3082 = "Tại sao chứ? Vẫn còn thời gian mà——\\nA!"
3083 = "Dù là việc nhỏ nhặt đến đâu,\\ntôi tin chắc chắn cũng có việc tôi có thể giúp được."
3088 = "Rồi cả hai cùng đồng loạt,\\nhướng ánh mắt về phía anh Soutetsu."
3089 = "Nagi cúi đầu trước anh Soutetsu.\\nThật sâu, thật sâu. Lưng gập hẳn thành một góc vuông."
3090 = "Cứ thế lao vào,\\nvùi mặt vào ngực anh ấy——"
3091 = "Cậu ấy đội chiếc mặt nạ bảo hộ lên trên chiếc khăn tay quấn tóc."
3093 = "Không phải lúc để mình mải mê xem trận đấu của Nagi-chan\\ncùng với anh Soutetsu."
3105 = "A, không được rồi. Mình lại khiến Nagi-chan phải bận tâm.\\nChuyện kiểm điểm bản thân để sau đi. Bây giờ, phải dành tất cả vì Nagi-chan."
3107 = "Thật đáng ghen tị. Một cuộc gặp gỡ đậm chất drama.\\nAnh Soutetsu lúc đó, mình cũng muốn được thấy thử một lần——"
3109 = "Thứ Nguyên Lưu! Mình biết!!\\nMình hay học hỏi từ mấy cuốn doujinshi lắm!!"
3111 = "Chỉ được mỗi cái cao to——\\nNhưng sâu thẳm trong tim thì thế nào nhỉ……"
3118 = "Vung kiếm thật lớn và thẳng thớm,\\nrồi đánh thẳng vào mặt! Một đòn quyết định tuyệt đẹp!!!!"
3122 = "Bởi vì, mặt cắt——phẳng lì luôn!"
3123 = "Và qua việc tu luyện trong bụi tre này, chắc chắn\\nkỹ thuật và tốc độ cũng được mài giũa."
3128 = "Cứ như trẻ con vậy, đáng yêu hết sức.\\nĐược khen nên cậu ấy cười toe toét, trông vui lắm!"
3129 = "Đỏ! Đỏ! Đỏ!!"
3142 = "Mình tự hỏi, bản thân thì sao nhỉ.\\nLiệu mình có trưởng thành được như Nagi không."
3150 = "Khoảnh khắc nghe thấy điều đó, sống lưng mình hơi lạnh đi."
3151 = "Bị nói là bắt bài...\\nlàm tôi có cảm giác rất không lành."
3156 = "Làm cho chiếc 8620 to lớn như vậy hoạt động trơn tru,\\nhơn nữa, còn làm được cả người lái đò xuôi dòng sông Kuma——"
3174 = "Nói là người sống hòa mình vào thiên nhiên, nhà tự nhiên học,\\nhay là người tự do thì đúng hơn nhỉ……Có vẻ như không có nghề nghiệp ổn định."
3175 = "Một khuôn mặt sắc sảo. Một khuôn mặt nghiêm túc.\\nKhuôn mặt mà mình yêu thích nhất."
3176 = "Nếu là lửng chó nhỏ thì dễ thương lắm,\\nmình cũng chẳng sợ chút nào đâu, nhưng mà——"
3198 = "Nhìn vừa đáng yêu vừa ranh mãnh——\\nLàm mình chỉ muốn véo má cậu ấy một cái!"
3199 = "Bởi vì, đây là bước chuẩn bị cho sân khấu lớn của Nagi-chan mà."
3200 = "Tiếng còi báo hiệu 5 phút trước khi trận đấu bắt đầu."
3201 = "Xoạt, âm thanh như dẫm lên lá khô.\\nPhù, tiếng thở hắt ra. Những âm thanh quen thuộc với đôi tai tôi."
3202 = "Lần này, Nagi-chan vẫn đeo dải băng trắng.\\nDải băng đỏ của cô bé đối thủ trông có vẻ đáng yêu và mong manh làm sao."
3203 = "Lần này đến lượt Nagi làm bộ mặt ngạc nhiên."
3204 = "Dù chỗ đứng cực kỳ tệ,\\ntre lại mọc dày đặc đến mức gần như không có khe hở nào."
3205 = "Chừng đó thì, tôi cũng biết.\\nLà nói về tay, về cổ tay——Nhưng mà!"
3206 = "Khác hoàn toàn với cách cầm kiếm\\nmà mình hay thấy trong manga——"
3211 = "Và sau đó, sau đó——"
3212 = "Rất đáng sợ, chỉ cần chậm một giây thôi là sẽ bị đánh trúng,\\nnếu là tôi, tuyệt đối không thể làm được."
3215 = "——Nó găm vào giữa một thân tre rất to, nói là chẻ đôi cũng được,\\nmà nói là chém đứt bằng kiếm gỗ cũng chẳng sai——Nó lún vào khoảng một nửa."
3217 = "Ngọt quá. Hơi chua chua một chút.\\nĐây là, chanh ngâm mật ong——"
3220 = "Dù không hiểu các thuật ngữ chuyên môn,\\nnhưng tôi cũng thấy rõ Nagi-chan đánh rất đẹp mắt!"
3222 = "Chỉ với một lời của anh Soutetsu,\\nNagi-chan lập tức trở nên nghiêm túc."
3223 = "Sau khi xoa xong, anh Soutetsu vỗ nhẹ lên tóc Nagi một cái,\\nrồi nét mặt anh thay đổi."
3224 = "Chính Nhãn đối đầu Chính Nhãn. Anh Soutetsu và Nagi.\\nHai người đối mặt trực diện, cùng giương kiếm tre thủ thế."
3225 = "Anh Soutetsu lấy ra thứ gì đó từ trong chiếc túi mang theo.\\nA——đây là thứ dùng trong kiếm đạo——"
3226 = "Anh Soutetsu đang ôm một cái túi dài.\\nAnh ấy nhìn quanh cả bụi tre, rồi cất giọng trầm ấm như đang thán phục."
3227 = "Anh Soutetsu đang xoa đầu Nagi.\\nThật nhẹ nhàng, thật dịu dàng, như đang vuốt ve bụng của một chú cún con vậy."
3228 = "Ánh mắt anh Soutetsu lại lóe lên một khoảnh khắc,\\nnhìn về phía ông lão có vẻ là huấn luyện viên ở bên kia sân đấu."
3229 = "Anh Soutetsu nhìn xuống chân, nhìn quanh bụi tre,\\nrồi nhìn chằm chằm vào Nagi."
3230 = "Quả không hổ danh là anh Soutetsu.\\nHình như tôi cũng hiểu ra rồi."
3231 = "Anh Soutetsu có thể cho Nagi-chan lời khuyên về Kendo.\\nNhưng, mình thì không làm được việc đó."
3232 = "Anh Soutetsu ngồi xổm xuống, chăm chú quan sát\\nmặt cắt nơi Nagi vừa rút thanh kiếm gỗ ra."
3233 = "Bị ngón tay của anh Soutetsu chọc nhẹ vào mũi,\\nmắt Nagi-chan mở to tròn xoe."
3234 = "Tiếng hét lớn của anh Soutetsu.\\nNgay sau đó, sự bồn chồn của Nagi-chan lập tức dừng lại."
3235 = "Anh Soutetsu gật đầu cái rụp.\\nKhóe miệng anh ấy nở một nụ cười dịu dàng hơn lúc nãy."
