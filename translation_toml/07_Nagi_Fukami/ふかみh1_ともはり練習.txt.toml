[script]
755 = "——Nhưng mà, tôi cũng muốn làm Fukami lên đỉnh. Tôi hơi nhọn đầu lưỡi, thử đút nông vào cửa mình của Fukami."
758 = "——Suy nghĩ đó, ngay lập tức biến thành hành động."
762 = "「Ây da, ây da——chà, chà——chà, chà.」"
766 = "「……Chắc chắn là ướt rồi. Anh đã cảm nhận được dâm thủy rỉ ra từ nãy đến giờ rồi.」"
772 = "Tại sao số lần lại không bằng nhau, cho đến khi được hai người giải thích, tôi vẫn cảm thấy thật kỳ lạ, nhưng mà……"
779 = "「……Cơ thể của Fukami, không có lấy một chỗ thừa. Khuôn mặt đã đành, nhưng cơ thể cũng thật sự rất đẹp.」"
781 = "（Ùm m m m m m m m m m m m!!!）"
782 = "「……Trở nên kỳ lạ, cũng là điều đương nhiên thôi. Có lẽ, anh đã phát điên vì sự quyến rũ của Fukami mất rồi.」"
942 = "Cảm giác vượt qua được thử thách khiến tôi vô tình thốt lên những lời nhẹ nhõm."
944 = "「Anh cũng muốn Fukami cởi cho anh.」"
948 = "「Nhưng mà, xin em đừng vắt khô kiệt hoàn toàn nhé. Anh muốn giữ lại một phần để lấp đầy âm đạo của Fukami.」"
952 = "Theo từng nhịp lau, nó cứ tiến lại gần rồi lại lùi ra xa, từng giọt, từng giọt nước nhỏ xuống mặt tôi."
964 = "「Hya——ah——tuyệt quá——chỗ đó—— Âm, đạo——nóng, quá——nhầy nhụa——ưm」"
965 = "「Ya——chỗ đó——âm đạo——lối vào——chỗ đó, không được, không được, đâu ạ——lên đỉnh ở đó, ghét lắm——nếu, lên đỉnh」"
967 = "「Hya ah ưm」"
968 = "「Hyan! ——Ưm!!」"
969 = "（Nhóp nhép!!）"
971 = "「Hya! Ha——sướng——sướng quá! Thích lắm, thích lắm! Bị đâm——bị đâm sâu——sâu thế này——em thích, lắm」"
973 = "「Hi ah!? ——Ah! Nóng quá——nóng quá—— Phụt phụt——trong bụng——tử cung——bị gõ——ưm!」"
974 = "「Hyu a!?——Ưm——ưm——ưm——chụt ưm! Chụt rột——rột! Nhóp nhép! Nhóp nhép!!」"
976 = "「Hi e!? Ơ!? Phù ah——a! E——e——em——sao có thể!!」"
977 = "「Hyu ah!? Ah——chỗ đó——vừa rồi——chỗ đó—— Cọ xát——cọ xát, rồi!」"
979 = "「Kh——」"
980 = "「Kh——a……」"
981 = "「Em xin lỗi. Em đang đun nước tắm rồi nhưng…… Chắc là vẫn còn phải mất thêm một lúc nữa.」"
982 = "「Kh oa!」"
983 = "「Kh ah!」"
984 = "「Ực——ực——ưm bụp——ực—— Chụt——chụt rột——ưm, kh——ực」"
985 = "「Oa……giật nảy lên, chuyển động mạnh thế này cơ ạ. Thế này là……anh đang cảm thấy sướng, đúng không ạ?」"
987 = "（Liếm! Liếm——chụt——ngoạm!」"
989 = "「Phù ah!」"
990 = "「Hả!? Ơ!? T, tại sao——vậy, ạ?」"
992 = "Ngay từ đầu đã tung hết sức, tôi hôn lên đường rãnh dọc đang in hằn qua lớp quần lót, rồi cứ thế thè lưỡi liếm láp thật mạnh."
993 = "「Tại sao á, vì anh đã thích Fukami mất rồi.」"
995 = "「Fukami!?」"
997 = "「Hả? Dạ……chuyện đó, là đương nhiên mà.」"
998 = "「Ư!」"
999 = "「A——」"
1001 = "（Liếm! Liếm! Liếm! Nhóp nhép!）"
1003 = "（Rột——chụt! Nhóp nhép! Ực!）"
1004 = "「A……ah——ahhh——a——」"
1005 = "「Ha……ah……ah——ah」"
1007 = "「Ha……ah……nhiều quá……nhiều quá……ưm—— Của, anh……Sou, tetsu……nóng, quá……nhiều quá đi mất」"
1009 = "「Ha——ah! Bị ngoáy——lại——thế này nữa!! Hôn vào, tử cung——thích quá——sướng——sướng quá, đi mất」"
1011 = "「A……ưm——ha——to, quá ạ—— Bụng——của anh Soutetsu——đang đâm, vào——」"
1012 = "「A……ưm——chụt——ưm——ưm——」"
1014 = "「Ưm——phù. Em ướt sũng hết cả rồi. Thế này mà không cởi ra……thì Fukami sẽ bị cảm lạnh mất.」"
1015 = "Màng nhĩ tôi rung lên dễ chịu bởi giọng nói đầy vui sướng, tôi từ từ lột lớp vải đang dính chặt ra, cởi sạch phần dưới của Fukami."
1018 = "Vì thế, bồn tắm ở đây cực kỳ lớn, nên việc đun nước cũng mất khá nhiều thời gian——nghe nói là vậy."
1019 = "「Nhờ em lau người cho nhiệt tình quá nên anh—— Đã hoàn toàn nóng lên mất rồi.」"
1021 = "「A ngoạm! ——Ưm……ưm~~~——chụt!—— Chụt rột——chụt——chụt——rột rột!!」"
1022 = "「A!」"
1024 = "「Ha! Ah! Ah! Ah! Anh, Sou, tetsu, em——em——em! Không, không được nữa rồi!」"
1026 = "「Đúng hơn là, Fukami đang ướt sũng rồi kìa. Nếu em không phiền——anh rất sẵn lòng giúp em lau người đấy?」"
1027 = "「Haa ah! Chỗ đó! Chỗ đó o o o! Căn phòng, của em bé——Tử cung! Ở tử cung!!!」"
1029 = "「A!!」"
1031 = "「“Thích em hơn” sao? Chuyện đó là không thể nào.」"
1032 = "「A, vâng.」"
1034 = "「Chà!」"
1035 = "「Chụt bụp——chụt——chụt——chụt—— Liếm——liếm——liếm liếm liếm——chụt」"
1036 = "「Liếm——chụt! Nhóp nhép! Bụp! Chụt rột! Chụt! Chụt! Chụt rột!!」"
1037 = "「Chụt! Chụt rột! Rột! Chụt! Ưm——liếm——liếm——liếm liếm liếm——nhóp nhép!」"
1039 = "「Chắc chắn là sẽ “thích nhiều hơn”, “thích hơn nữa”…… Nhưng một người đã thích Fukami như anh, thì làm sao có chuyện “bắt đầu thích” được nữa.」"
1040 = "「Ưm——」"
1042 = "「Ưm kyu——hi——lên——ưm ưm ưm~~ưm! Ưm kh——ực——chụt——ực」"
1043 = "「Ưm……kh——ưm——phù——ưm」"
1045 = "Dù độ dày có lẽ chưa đến vài milimet, nhưng chiếc quần lót ướt sũng dính chặt này thực sự quá vướng víu."
1046 = "「Ưm……ah——phù……ư」"
1047 = "「Ưm……ah——phù, a……ah——」"
1048 = "「Ưm……ha——phù ah……phù ah」"
1049 = "「Ưm……ah——bên trong……bị đẩy——vào—— Phù ah——hi——như bị, lộn ngược……vậy——」"
1051 = "「Ưm——liếm——kh——ự, c——」"
1052 = "「Ưm……chụt——chụt——chụt」"
1053 = "「Chà, chà——lau, lau——ưm……sao rồi ạ? Anh Soutetsu đã khô bớt chút nào chưa?」"
1054 = "「Ưm!」"
1055 = "「Ưm hyu! Sâu quá! Bên trong! Tử cung! Tử, cung——phập——ưm, đâm trúng, rồi!!」"
1057 = "「Ưm kyuuu!!」"
1058 = "「!!?——A hyu u u u u u ưm!!!」"
1059 = "「Hả!? A! Anh Soutetsu, khoan hẵng qua đây—— Á!? Oa a a a a a a a!?」"
1061 = "「Ưm gyu!? Hi, ah——đột, nhiên——」"
1063 = "「Ufufu, em vui lắm. Hãy……cảm thấy sướng, đến mức suýt soát……sắp cạn kiệt luôn nhé?」"
1064 = "「……Ư……ưm…………ưm…………」"
1065 = "「Tình yêu! Hoàn toàn có thể làm được mà!!」"
1068 = "Vì tôi mãi không thể xác định được đó có phải là cám dỗ hay không, nên có vẻ như tôi đã vô tình khiến Fukami phải nóng lòng chờ đợi."
1069 = "「Anh hiểu rồi——」"
1070 = "「Vâng! Vâng ạ! Xin anh hãy vào đi, anh Soutetsu.」"
1074 = "「Ư……ưm.」"
1075 = "「Đúng vậy nhỉ! Đúng rồi, vâng. Đúng vậy. Tuyệt đối cần thiết. Em hiểu rồi ạ. Em, sẽ cố gắng điều chỉnh nhé.」"
1077 = "「Hi mo hi hyo fu ha he fu ha ha hi……ưm——liếm—— Chụt——ho he fu han……chụt ưm——」"
1079 = "「Anh, cũng——vậy. Fukami!」"
1081 = "「Hể!!?」"
1083 = "Fukami nhận ra điều đó, nhưng không hề ngoảnh mặt đi. Nếu vậy thì, quả nhiên——đây chắc chắn là một sự cám dỗ rồi."
1085 = "Cơ thể ngày càng nóng lên, những phần da thịt chạm vào nhau ướt đẫm mồ hôi của cả hai."
1087 = "Chỉ là vậy thôi, nhưng không hiểu sao tôi lại cảm nhận được một sức ép khó tả."
1088 = "Sức ép bí ẩn trong giọng nói của Fukami cũng hoàn toàn biến mất, thay vào đó, em ấy bắt đầu trở nên vui vẻ, hào hứng."
1093 = "……Fukami đang ra sức lau người cho tôi. Được em ấy lau cho thì đúng là biết ơn thật đấy, nhưng mà——"
1095 = "「Đ, đúng vậy mà? Anh Soutetsu, cứ sao sao ấy, hơi kỳ lạ.」"
1098 = "「Đúng vậy nhỉ. Đó là một điều hết sức đương nhiên.」"
1100 = "「……“Dù không bình đẳng nhưng vẫn công bằng”——sao.」"
1101 = "「Đúng, vậy nhỉ.」"
1102 = "「Ừ. Vô cùng sung sướng.」"
1103 = "「Vậy sao?」"
1106 = "「Vì thế……phần dưới……ừm, phần dưới——nếu, nếu—— Nếu được……ừm! Nhờ anh, Soutetsu——làm, giúp em……」"
1107 = "「Nếu để anh Soutetsu bị cảm lạnh thì em thấy có lỗi lắm. Em sẽ lau cho anh bao nhiêu cũng được.」"
1110 = "「Fukami——kẹp tóc sắp tuột ra rồi kìa?」"
1112 = "「Fukami——cứ thế này, anh đút vào nhé?」"
1114 = "「Fukami, là một thiếu nữ……đồng thời cũng là một người phụ nữ nhỉ.」"
1115 = "「Fukami!」"
1116 = "（Tròng trành!）"
1117 = "Chiếc thuyền rung lắc dữ dội dù không phải ở chỗ nước chảy xiết. Phản ứng đó khiến tôi nhận ra lời nói của mình thiếu sót trầm trọng."
1118 = "Mong muốn của Fukami là, được cùng tôi luyện tập chèo thuyền, chỉ có hai người với nhau."
1119 = "「Chỉ lau thôi thì……không được đâu…… Chim……phải vắt, cho đến khi……khô kiệt……nếu không……chắc chắn là, không được, đúng không ạ.」"
1121 = "Để tránh làm văng những giọt nước thừa thãi, em ấy bảo tôi nằm xuống, rồi ngồi lên trên, ra sức lắc lư eo, lau người cho tôi."
1123 = "「Một em, đã được anh Soutetsu……khen là đ, đẹp. Em muốn……anh Soutetsu……sẽ, sẽ thích, em, hơn nữa.」"
1124 = "「Lấy ra……giúp em. Lấy ra, tháo nó ra. Em muốn, toàn bộ——trần truồng——trần truồng, luôn」"
1128 = "「Cái……này……」"
1129 = "「Vì vậy, hẹn hò riêng hai người, em sẽ được hai lần, còn bé Nagi một lần. Thế này là vừa đủ công bằng rồi nhỉ.」"
1130 = "「Vậy thì……em sẽ làm nhẹ nhàng thôi. Nhẹ nhàng, thôi ạ—— Ưm……(Chụt!)」"
1133 = "Từng giọt nước nhỏ xuống từ háng em như kéo thành sợi. Eo của Fukami lại bắt đầu đung đưa, cọ quậy."
1134 = "「C, chim của……anh Soutetsu……rõ ràng là, em đã lau, rất kỹ rồi mà. Thế mà vẫn, bóng loáng……ướt sũng, rồi ạ.」"
1135 = "Nói rồi, Fukami đứng thẳng lưng ở mũi thuyền. Dù đang vươn thẳng người, đôi gò má em vẫn dần ửng đỏ."
1136 = "「M……quyến rũ——ưm!」"
1137 = "「!!!」"
1244 = "Đầu dương vật được hôn một cái, một khoái cảm gần như tê dại thấm sâu vào tận xương chậu."
1245 = "Không biết là đã nắm được bí quyết, hay miệng em ấy đã hoàn toàn nắm bắt được hình dáng của dương vật, miệng Fukami uốn lượn, luồn lách, đến để vắt kiệt tinh dịch của tôi."
1249 = "Nhưng khi được ngậm lấy, theo thời gian, nó dần dần, dần dần trở nên ấm áp hơn."
1251 = "Nhưng, tôi không xuất tinh. Chấm dứt khoái cảm này thật sự quá uổng phí, tôi không thể xuất tinh được."
1253 = "Không hẳn là tươi mát, mà đúng hơn là hương vị của nước lan tỏa trong miệng."
1263 = "（Chụt——rột——liếm——liếm liếm liếm）"
1271 = "Âm đạo của Fukami, nơi hội tụ cả vẻ thiếu nữ và người phụ nữ, đã hoàn toàn chi phối tôi, cưỡng ép chuyển động eo của tôi."
1276 = "Vì của Nagi quá chật hẹp, nên lần đầu tiên tôi không cảm nhận được ……nhưng âm đạo của Fukami, quả nhiên cũng khá hẹp và khít."
1295 = "Nhưng âm đạo của Fukami, như muốn nói hãy lên đỉnh cùng lúc, nới lỏng rồi lại run rẩy siết chặt, hoàn toàn kiểm soát tôi!"
1300 = "「Phù——ah——của em——âm đạo—— Miệng của——anh Soutetsu——bằng miệng——」"
1304 = "Khoái cảm chờ đợi từ lâu khiến dương vật giật nảy lên, Fukami giật mình ngẩng mặt lên——"
1305 = "Giọng nói vui vẻ, hào hứng."
1307 = "Ba người……hay nói đúng hơn là, theo thỏa thuận thực tế giữa Fukami và Nagi, số lần hẹn hò được chốt lại là Fukami hai lần, Nagi một lần."
1309 = "Phía bên kia âm đạo của Fukami."
1311 = "Khoảnh khắc phần lớn bề mặt lưỡi tôi chạm vào cảm giác sần sùi như những hạt nhỏ, lưỡi Fukami rung lên dữ dội, bóp cò cho tôi xuất tinh!"
1312 = "「Không sao……ưm.」"
1317 = "Ngay khi quần ngoài và quần lót được tuột xuống, dương vật lộ ra, hơi thở gấp gáp của em ấy phả vào, mơn trớn quyến rũ đầu khấc."
1319 = "Ngay trước mắt tôi, là phần háng quần lót của Fukami đang banh rộng. Nó ướt sũng, ngậm đầy nước và dính chặt vào da."
1321 = "Em ấy dùng âm đạo nhỏ bé ép chặt lấy dương vật đang cương cứng của tôi, và trong tư thế đó, em ấy cẩn thận bôi mật dịch lên."
1323 = "Mái tóc của Fukami, mùi hương từ mái tóc, tỏa ra từ đó——sự quyến rũ, sắc sảo của một người phụ nữ."
1325 = "Em ấy khao khát tôi, đến mức đó—— Cảm giác hạnh phúc lấp đầy não bộ, truyền thêm sức mạnh cho từng chuyển động của cơ thể!"
1326 = "「Ah——phù——cháy, mất——tan chảy, mất—— Của, em——âm đạo——ưm——tan chảy, mất thôi.」"
1334 = "Tử cung vui sướng mút chặt lấy tôi."
1336 = "Mới chỉ là lần làm tình thứ hai, vậy mà em ấy đã nũng nịu đòi mang thai, khao khát hạt giống của tôi đến mức tham lam, cố gắng ngậm lấy đầu khấc của tôi."
1340 = "Toàn bộ tinh dịch, vào tử cung của Fukami—— Tôi không ngừng rót vào nơi yêu thương để tạo ra em bé."
1354 = "Bình tĩnh và từ từ đút vào, tôi mới cảm nhận được."
1355 = "Nhưng, tôi không vội vàng. Bởi vì đây mới chỉ là lần làm tình thứ hai của Fukami thôi."
1356 = "Tâm trí và cơ thể tôi cũng đáp lại điều đó. Cảm giác khao khát Fukami thành thật chuyển hóa thành hành động."
1358 = "「A……của, em……của, em……âm, đạo…… Khuôn mặt của……anh Soutetsu……gần……gần thế này.」"
1361 = "Ngay cả sức lực để gọi tên nhau cũng không còn. Ngay cả trong hoàn cảnh đó, chúng tôi vẫn khao khát nhau, trao nhau những nụ hôn."
1363 = "Vừa bị nụ hôn của Fukami làm tan chảy, vừa——không ngừng thưởng thức, gặm nhấm khoảnh khắc hòa quyện này."
1364 = "Tôi nhổm dậy, ôm Fukami vào lòng và hôn."
1367 = "Tôi cẩn thận dùng đầu lưỡi cạo sạch nó, thể hiện lòng biết ơn và tình cảm theo cách riêng của mình."
1370 = "Cảm giác bị tử cung đẩy mạnh. Cùng lúc đó là tiếng thét kiều diễm của Fukami vang lên. Bản năng lập tức hiểu rằng đó là sự cho phép, và bùng nổ!"
1372 = "Khi tôi liếm âm đạo của Fukami, chỗ đó rung lên mạnh mẽ, ngay lập tức khoái cảm đáp trả bao trùm và lấp đầy dương vật của tôi."
1374 = "Bên trong tôi, vẫn còn một hình bóng không hoàn toàn bị nhuốm màu. Nó thật sống động và chói lóa."
1376 = "Ngay lập tức lưỡi tôi bị siết chặt, nhưng thế này thì vẫn tiến vào được. Đồng thời với sự tự tin đó, tôi làm cứng lưỡi hết cỡ và đẩy sâu vào!"
1378 = "Mùi hương trở nên nồng đậm hơn."
1379 = "「A——」"
1382 = "Chỉ muốn bù đắp một chút cho việc đã khiến em ấy phải chờ đợi."
1384 = "Vắt kiệt toàn bộ sức lực, khi tôi gục ngã ra phía sau, Fukami cũng mềm nhũn ngã theo, trong khi chúng tôi vẫn đang kết nối với nhau."
1385 = "「Nhưng mà……không ngờ lại làm chuyện này trên thuyền xuôi dòng.」"
1387 = "Vượt qua dòng thác này, một lúc sau, chỉ cần để thuyền trôi lững lờ theo dòng nước là được."
1388 = "Thấy phản ứng đó cũng tốt, tôi thử lặp lại chuyển động đó thêm nhiều lần nữa."
1391 = "Tôi làm Fukami ngửa hẳn người ra sau, dùng khoái cảm để ép em ấy quên đi chủ đề vừa nãy."
1392 = "Tôi đã làm Fukami, lên đỉnh. Đồng thời, tôi cũng lên đỉnh."
1395 = "Chỉ một hành động đó thôi, mái tóc xõa tung ra."
1396 = "Khi tôi xoay eo và cọ xát vào phần sần sùi, cơ thể Fukami nảy lên mạnh mẽ, âm đạo siết chặt hơn."
1399 = "Tôi cố tình rút dương vật đang run rẩy ra, ngoáy tròn ở chỗ nông, để thưởng thức Fukami."
1401 = "Có lẽ để được thưởng thức trọn vẹn, thỏa thích trái ngọt chỉ có thể nếm thử vào ngay lúc này, trong cái mùa ngắn ngủi này."
1402 = "Chắc là cảm nhận được tinh dịch đã lấp đầy, âm đạo của Fukami thả lỏng, trả lại sự tự do cho tôi——nhưng!"
1403 = "Có lẽ vì khoái cảm quá mãnh liệt, Fukami lắc đầu nguầy nguậy——!"
1404 = "Có thể vẫn còn những chỗ bị đau, những vết thương còn sót lại. Lo lắng điều đó, tôi chầm chậm, chầm chậm tiến vào như đang thăm dò."
1409 = "Vì thế, tôi không thúc giục em ấy tự nhận thức."
1410 = "Chính vì thế, bằng chính ý chí của mình, không để hở một micromet nào, tôi tiếp tục ép chặt đầu khấc vào cửa tử cung."
1413 = "Vì thế, bây giờ, tôi chỉ muốn cứ thế tan chảy dần dần."
1426 = "Và rồi em ấy gật đầu một cái thật khẽ."
1427 = "Cứ ép chặt như vậy, và xuất tinh."
1431 = "「Vậy sao.」"
1435 = "Dù có bị ép xuất tinh nhiều lần từ nãy đến giờ cũng không có gì lạ."
1440 = "「A, ừm——em——phần trên, em sẽ tự——tự cởi, ừm——em sẽ cởi, nên——」"
1442 = "（Ồ……）"
1446 = "Fukami xấu hổ, vội vàng cúi mặt xuống, rồi áp chặt má vào dương vật đang cương cứng của tôi."
1448 = "Fukami hút lấy tinh dịch của tôi, rồi nuốt xuống cái cổ họng thanh mảnh ấy——"
1451 = "「Đúng vậy. Dù chênh lệch chưa đến mười phút, nhưng người đầu tiên làm tình với anh Soutetsu là……bé Nagi.」"
1453 = "「A! Vâng! Vâng! Trăm sự nhờ anh ạ!!」"
1455 = "Với Fukami, và Nagi. Một buổi hẹn hò trọn vẹn một ngày chỉ có hai người với từng người."
1457 = "Mái tóc đung đưa nhảy múa của Fukami khẽ lướt qua mặt tôi—— Ưm?"
1459 = "Không biết có phải là vô thức hay không. Eo của Fukami đang cử động."
1461 = "Đang trong quá trình lột xác để trở thành một người phụ nữ—— Vẻ đẹp mơ hồ đó, bản thân Fukami vẫn chưa tự nhận thức được."
1464 = "Fukami với mái tóc đen tung bay và cơ thể run rẩy, hoàn toàn, là khuôn mặt của một người phụ nữ, cơ thể của một người phụ nữ."
1465 = "Ngay sát chóp mũi của Fukami, dương vật đang cương cứng của tôi đã nhô cao lên lớp quần."
1466 = "Miệng của Fukami có nhiệt độ thấp hơn dương vật của tôi."
1468 = "Bên trong khoang miệng Fukami, vị chát với độ nhớt cao đến kinh ngạc vẫn còn bám dính lại."
1473 = "Nếu đó là quyết định của Fukami và Nagi, thì tôi cũng không nên xen mồm vào làm gì."
1474 = "Giọng nói đầy quyết tâm. Hơi thở gấp gáp, mạnh mẽ đến mức làm rung chuyển cả dương vật."
1475 = "Giọng nói đứt quãng. Nhưng tôi không cảm thấy em ấy đang đau đớn."
1476 = "Tỏng——tỏng."
1480 = "Lưỡi của Fukami run rẩy rên rỉ trong khoái cảm, truyền sự rung động đó đến tôi——cả hai cùng nhau, khuếch đại cảm giác sung sướng."
1481 = "Lưỡi của Fukami, như thể đang liếm đến tận não tôi, dần dần——bị nhuốm màu của Fukami."
1483 = "Hơn cả giọng nói và da thịt của Fukami, não bộ của tôi đang tan chảy."
1484 = "「A……chỗ này vẫn chưa lau được chút nào cả. Em xin lỗi——ưm……ây da, ây, da.」"
1486 = "Fukami, sẽ vắt kiệt dương vật đang cương cứng của tôi. Cho đến khi khô kiệt hoàn toàn——"
1488 = "Dù sự chật hẹp của một thiếu nữ mà tôi cảm nhận được khi đút vào đã trở nên mạnh mẽ hơn, nhưng sự mềm mại và nhịp điệu của da thịt phụ nữ, lại dính nhớp nháp đè lên trên đó."
1490 = "Chắc là đang tìm xem phần kẹp tóc bị lỏng ở đâu, Fukami khẽ cử động đầu."
1493 = "Những ngón tay của Fukami thoăn thoắt cử động, tháo cúc quần của tôi."
1494 = "Đầu Fukami gật mạnh. Ngay cả âm đạo trước mắt cũng rung lên theo cái gật đầu mạnh mẽ đó."
1496 = "「A, giỏi quá. Anh Soutetsu. Nếu làm như vừa nãy, anh có thể vượt qua dòng thác mà không bị tròng trành đấy.」"
1499 = "「A……v, vâng. ——Đúng, vậy nhỉ. Em……cũng, ướt nhẹp……thế này, rồi.」"
1500 = "Vì thế, Fukami đang lau người cho tôi. Trong khi vẫn đang mặc nguyên bộ quần áo, đồ lót ướt sũng, mỏng tang."
1511 = "Với suy nghĩ đang bị lu mờ bởi nhục dục dính nhớp nháp lúc này, việc đuổi theo hình bóng đó ——không hiểu sao, tôi lại cảm thấy có chút tội lỗi."
1513 = "Nếu như em ấy tự nhận thức được, thì khoảnh khắc đó, Fukami chắc chắn, sẽ trở thành một người phụ nữ thực thụ."
1514 = "Mật ngọt của Fukami tràn ra quá nhiều, buộc tôi phải nuốt xuống, hành động đó làm chuyển động của lưỡi chậm lại."
1520 = "「Không sao đâu——chắc là không lo bị cảm lạnh đâu.」"
1532 = "Tinh dịch tuôn ra ùng ục, vừa trào ra đến đâu, liền bị uống ực ực đến đó."
1533 = "「Vì có tận hai cơ hội mà, nên em nghĩ, lần đầu tiên sẽ ở sân nhà của mình——」"
1535 = "「Chính là điều anh đang mong đợi đấy.」"
1543 = "Không thể đâm sâu như dương vật được. Nên cứ thế, tôi liếm láp một mạch trong phạm vi có thể chạm tới!"
1546 = "「Uoa!?」"
1553 = "「Phù, ah——lưỡi……ấm……quá……ưm.」"
1561 = "「Vì vậy, em muốn anh xem lần đầu tiên. Hình ảnh em đang chèo thuyền trên sân nhà của mình——」"
1562 = "Theo sau lời nói là âm thanh ưm……như tiếng rên mũi. Sau đó, hơi thở nhẹ nhàng từ miệng phả vào dương vật——"
1565 = "Cùng lúc với lời nói, eo em ấy cọ quậy. Cả tâm hồn và thể xác, đều đang khao khát tôi."
1570 = "Mỗi lần tôi đâm vào, em ấy lại run rẩy. Toàn bộ cơ thể Fukami, rung lên vì sung sướng."
1579 = "Sự cảm động đó, nhưng ngay lập tức, đã bị bao trùm bởi một sự cảm động lớn lao hơn."
1580 = "Anh muốn làm em tan chảy. Liếm láp, mút mát nhiều hơn, nhiều hơn nữa. Nhưng để làm được điều đó, thì lớp vải mỏng này——"
1581 = "Vào thời kỳ hưng thịnh, dịch vụ đi thuyền xuôi dòng vào mùa đông rất đắt khách, họ thường cung cấp nước tắm sau giờ làm việc cho những người lái đò bị lạnh cóng."
1582 = "Cứ thế này, tôi sẽ bị ép lên đỉnh một chiều mất. Dù điều đó cũng có thể coi là hạnh phúc, nhưng mà——"
1583 = "Nhận ra điều đó khiến tôi càng thêm nóng rực. Tôi muốn làm Fukami nóng hơn nữa. Muốn âm đạo của em ấy cũng bốc cháy."
1585 = "Khoảnh khắc đó, mọi thứ dịu lại."
1588 = "Em ấy đang nói ra sự thật với giọng điệu đều đều."
1589 = "Lời đề nghị vô cùng hấp dẫn đó, nhưng tôi chỉ từ chối một phần nhỏ."
1590 = "Dù là một âm đạo chật hẹp và khít khao, nhưng sự trơn ướt và mềm mại mạnh mẽ, đã giúp tôi tiến vào dễ dàng hơn."
1641 = "（Xoã!）"
1644 = "（Phụt——phụt――――phụt――――phụt）"
1645 = "（Phụt! Ưm phụt! Phụt! Phụt t t t!）"
1646 = "（Phụt! Phụt! Phụt! Phụt!）"
1647 = "（Phụt! Phụt! Phụt t t t t!!）"
1648 = "（Chọc, chọc——chọc chọc）"
1649 = "（A……nhưng mà——）"
1650 = "（Ồ——ưm——）"
1651 = "「A……ya……thấm, vào rồi——ưm——em, âm đạo——nước bọt của anh Soutetsu……, thấm, vào——nóng, quá.」"
1652 = "（Kyu——kyu kyu!）"
1653 = "（Nhóp nhép——nhóp nhép）"
1654 = "「Hya fu!」"
1655 = "「Nếu vậy thì.」"
1656 = "（Co thắt!）"
1658 = "（Rùng mình!）"
1659 = "Nhìn lại một lần nữa vào âm đạo đã hoàn toàn phơi bày, tôi chăm chú quan sát——"
1660 = "（Áp sát!）"
1661 = "（Đã mềm nhũn và ướt sũng rồi. Thế này thì……）"
1664 = "（Co thắt!!!!!!!!）"
1665 = "（Phập——phập——phập——phập——）"
1666 = "（Phập——rột——rột——cọ xát）"
1668 = "（Ngoáy! Phập——phập! Ngoáy!）"
1669 = "（Phập! Phập! Trượt! Phập!!）"
1670 = "（Phập! Phập! Cọ xát! Phập!）"
1671 = "（Phập p p p! Ngoáy y y y y y y y y y y y!!!）"
1672 = "（Phập! Ngoáy mạnh!!）"
1673 = "（Đâm sâu!!!）"
1674 = "（Trượt sâu u u u u u!）"
1675 = "「Ưm!?」"
1676 = "（Hơi nóng của dương vật——đang xâm chiếm khoang miệng của Fukami sao.）"
1678 = "「Thích……thích……Anh Soutetsu, đối với em—— Đã thích em rồi, sao……phù, ah.」"
1680 = "（Khít……khít……）"
1681 = "Nhưng ngay sau đó, vị mật ngòn ngọt, mang theo chút hơi ấm bắt đầu hòa quyện vào."
1682 = "（Liếm m m m! Liếm! Liếm m m! Rột!）"
1683 = "（Liếm m m m m m m m m!!!）"
1684 = "（Ngoáy——ngoáy——cọ——cọ xát）"

