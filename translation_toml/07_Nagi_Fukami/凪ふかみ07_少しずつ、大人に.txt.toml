2179 = "「Dù vậy――mãi mãi!\\nChúng ta vẫn sẽ luôn là bạn của nhau đúng không? Nagi.」"
2189 = "「Được rồi mà? Tham quan ấy. Chị hiểu rõ rồi.」"
2190 = "「Về mặt ý nghĩa đó, thì hôm nay. Quyết tâm xin đi tham quan buồng lái\\n――được cho phép tham quan, thật sự rất tuyệt, ạ.」"
2192 = "「Nhóc sao, thế thì――\\nNói vậy tội nghiệp Nagi lắm.」"
2193 = "「Chúc mừng nha! Bé Fukami.\\nEm vượt qua kỳ thực tập với thời gian ngắn nhất đúng không? Đỉnh quá!」"
2197 = "「Nếu muốn ở cùng nhau thì hướng tới mục tiêu làm \\x%l機関士;#00ffc040;lái tàu%l;#; chẳng phải tốt hơn sao?\\nA, nhưng mà, kỹ năng tiếp khách của em bỏ xó thì uổng quá nhỉ?」"
2198 = "「Nếu muốn hóng mát thì, ra sông được không ạ?」"
2199 = "「Thấy sao hả? Fukami.」"
2200 = "「Hơi――không, khá là nóng đấy.\\nEm có muốn uống gì không?」"
2205 = "「Rất cảm ơn mọi người đã chúc mừng, nhưng thời gian có hạn.\\nBây giờ mọi người cứ để Fukami từ từ tham quan được không?」"
2208 = "「T-tớ——à ừm——đâu có……\\nFushuuuuuu~~」"
2209 = "「E, em! Em không có âm mưu đen tối gì đâu nhé!\\nThật tình, Nagi xấu tính quá!」"
2212 = "「Chuyện đó, chị cũng vậy mà! Lúc nào cũng\\nnũng nịu, và được anh Soutetsu giúp đỡ――」"
2213 = "「Em cũng vậy, ạ.」"
2215 = "「Em cũng có cùng cảm giác đó. Chỉ cần anh Soutetsu\\nmỉm cười――thì dù ở đâu, em cũng thấy vui, ạ.」"
2216 = "「Anh cũng vậy. Đổ bao nhiêu là mồ hôi rồi.」"
2218 = "「Hồi còn là hành khách em không để ý lắm――\\nNhưng giờ em đã thấy sợ khi có người giẫm lên vạch vàng rồi.」"
2221 = "「Kinh nghiệm lội sông của Fukami khác biệt quá xa rồi.\\nChẳng thể lấy ra làm chuẩn được đâu.」"
2222 = "「Fukami lúc chúng ta mới gặp,\\nlà một cô bé hay khom lưng, lúc nào cũng rụt rè sợ sệt.」"
2224 = "「Em chỉ muốn cùng chạy với mọi người, và cũng trở nên tỏa sáng.\\nVì em không muốn bị Nagi và anh Soutetsu bỏ lại.」"
2225 = "「Chỉ là, anh thấy mình thật hạnh phúc thôi.」"
2228 = "「Về nghiệp vụ của \\x%l車掌;#00ffc040;trưởng tàu%l;#; thì anh chỉ biết qua kiến thức sách vở thôi――\\nNhưng trong phạm vi đó, tất nhiên anh sẽ dạy em tất cả những gì có thể.」"
2230 = "「Rất sẵn lòng!」"
2231 = "「Tớ không muốn làm Nagi phải bận tâm đâu mà~」"
2233 = "「Em hiểu ạ.」"
2235 = "「Không chỉ bán vé, \\x%l改札;#00ffc040;bấm vé%l;#;, hay hướng dẫn cho hành khách.\\nMà nhân viên nhà ga cũng đang duy trì sự an toàn――em đã hiểu ra điều đó.」"
2237 = "「Em! Có động lực rồi! Ạ.\\nAnh Soutetsu――anh đi cùng em, được không ạ?」"
2238 = "「Anh thực sự rất biết ơn.\\nFukami, Nagi. Và tất cả mọi người.」"
2240 = "「Về công việc của \\x%l車掌;#00ffc040;trưởng tàu%l;#; ạ. Dù không vào buồng lái,\\nnhưng em nghe nói \\x%l車掌;#00ffc040;trưởng tàu%l;#; cũng có thể hỗ trợ việc lái tàu.」"
2243 = "「Dù là điều hiển nhiên nhưng——đúng là một công việc tuyệt vời nhỉ.\\nTrông rất vất vả, rất khó khăn——và rất ngầu, desu.」"
2245 = "「Vậy thì đừng vội, cứ từng bước một tích lũy là được. Fukami bây giờ\\nchưa thể đảm đương vị trí \\x%l車掌;#00ffc040;trưởng tàu%l;#;, đơn giản là vì em chưa hiểu rõ về đoàn tàu thôi.」"
2247 = "「Do đó, lúc ấy em đừng ngần ngại mà hãy làm đi.\\nDừng lại mà không có chuyện gì xảy ra, đó mới là điều tốt nhất.」"
2248 = "「Bởi vậy. Lái đầu máy hơi nước thực sự là công việc thủ công.\\nChắc là——cũng trực tiếp giống như con thuyền của bé Fukami vậy đó.」"
2253 = "「Nên em――mới ghen tị với Nagi.\\nEm không nghĩ đến chuyện lớn lao như hỗ trợ mọi người đâu.」"
2255 = "「Nên em sẽ yêu cầu họ lùi lại. Dù là hành khách thì em vẫn sẽ nhắc nhở.\\nVì điều đó gắn liền với sự an toàn――là bảo vệ chính hành khách mà.」"
2257 = "「Chính vì thế đó, anh Soutetsu?」"
2258 = "「Vì vậy \\x%l車掌;#00ffc040;trưởng tàu%l;#; của đoàn tàu đó, phải chạy hết tốc lực 600 mét từ vị trí dừng,\\nđồng thời giơ cao \\x%l信号炎管;#00ffc040;ống pháo hiệu%l;#;.」"
2260 = "「Vì thế, phải làm sao để thưởng thức được cảnh quan, hoặc có hướng dẫn viên thú vị.\\nHơn nữa, còn phải đảm bảo trẻ em và người già cũng có thể đi bộ an toàn nữa.」"
2265 = "「Khăn tay, bẩn mất thôi!!」"
2267 = "「Công việc thủ công…… Bằng cảm giác của đôi tay,\\nmà có thể điều khiển một thứ to lớn và phức tạp thế này——」"
2269 = "「Xin lỗi. Anh chỉ muốn trêu em một chút thôi.\\nTại dáng vẻ cuống quýt của Fukami đáng yêu quá mà.」"
2271 = "「Xin lỗi. Anh dùng từ không đúng.\\nNếu nghe có vẻ như anh làm qua loa, thì anh xin lỗi.」"
2272 = "「Em sẽ nhắc nhở, giải thích và yêu cầu người đó lùi lại, ạ.」"
2280 = "「Đã rõ!」"
2288 = "「Vâng vâng. Vì vậy nên, em.\\nMới nghĩ là, mình muốn trở thành \\x%l車掌;#00ffc040;trưởng tàu%l;#;.」"
2289 = "「Ừ……」"
2290 = "「Đúng, vậy nhỉ. Nagi.」"
2292 = "「Đúng vậy, nhỉ. Nagi. Cứ thế này thì không được.\\nChúng ta――phải trưởng thành hơn nữa.」"
2294 = "「Đúng vậy, nhỉ. Chị cũng thế. ――Nhưng mà, anh Soutetsu thì.\\nVừa phải làm việc, đến ngày nghỉ thì lúc nào cũng dành thời gian cho chúng ta」"
2296 = "「Vâng, ạ. Em――quả nhiên là đã rất ghen tị.\\nVới công việc mà anh Soutetsu và Nagi đang làm.」"
2298 = "「Đúng vậy. Chỉ một thao tác xoay cần đảo chiều, một cái kéo tay gạt van tiết lưu hơi,\\ncũng trực tiếp quyết định luồng hơi nước và chuyển động của đầu máy.」"
2300 = "「Đúng vậy. Trước khi khởi hành, dù là trong hay ngoài buồng lái,\\nđều có rất nhiều việc cần phải xác nhận và chuẩn bị.」"
2301 = "「Đúng vậy ạ. Nagi đã trưởng thành――và xinh đẹp hơn.\\nHôm nay, em ấy cũng rất xinh đẹp.」"
2303 = "「À.」"
2306 = "「À, anh ngạc nhiên lắm đấy.\\nKhông ngờ lại đột nhiên thành buổi thực hành \\x%l列車防護;#00ffc040;phòng vệ tàu%l;#; luôn.」"
2309 = "「Đúng vậy ạ. Em nghĩ việc chỉ đi bộ thôi mà cũng thấy vui,\\nchắc chỉ là khoảnh khắc lúc mới xuống sông thôi.」"
2311 = "「Đúng vậy. Nagi.\\nDù chuyến đi có vui vẻ đến đâu――cũng phải có lúc kết thúc.」"
2312 = "「Vâng. Vì vậy nên, thực ra em định trau chuốt lộ trình thêm một chút nữa.\\nRồi sau đó mới mời anh Soutetsu đến chơi.」"
2315 = "「Đúng vậy. Dù là Nagi, Hibiki hay Hachiroku.\\nNhững người cùng làm nhiệm vụ trên tàu, anh đều cảm thấy như một cộng đồng chung vận mệnh.」"
2317 = "「Đúng vậy nhỉ. Đó là một quyết định hợp lý đấy.」"
2318 = "「Vậy sao. Thật vinh hạnh quá.」"
2319 = "「Ý nghĩa đó sao? Hừm.\\nAnh lại nghĩ lúc ở buồng lái mặt anh trông nghiêm khắc lắm chứ.」"
2320 = "「Là vậy sao?」"
2322 = "「Đúng vậy. Dù thế nào đi nữa,\\nưu tiên số một của bé Fukami vẫn là chuyến xuôi dòng sông Kuma mà.」"
2323 = "「Là kiểu có thể xả mồ hôi được sao?」"
2324 = "「Vâ, ng.」"
2325 = "「Vâ……ng. Ạ.」"
2326 = "「Vâng.」"
2328 = "「Vâng! Giáo quan Soutetsu!\\nTừ nay về sau cũng xin được nhờ anh chỉ giáo! Ạ!!」"
2329 = "「Vâng! Vâng, desu!」"
2335 = "「Thay đổi như thế nào?」"
2337 = "「Có chuyện gì thú vị sao ạ?」"
2338 = "「Tối qua anh định hỏi xem em muốn đi đâu.\\nTrong đầu anh chỉ lờ mờ nghĩ đến rạp chiếu phim hay sở thú thôi.」"
2339 = "「Vốn dĩ, người ta sẽ gắn một toa gọi là \\x%l車掌車;#00ffc040;toa xe trưởng tàu%l;#; ở cuối \\x%l編成;#00ffc040;đoàn tàu%l;#;.\\nVà \\x%l車掌車;#00ffc040;toa xe trưởng tàu%l;#; có trang bị phanh hãm.」"
2349 = "「Vẻ đẹp công năng——ừm. Vẻ đẹp công năng.」"
2354 = "「Bởi vì không chải chuốt, không tô điểm.\\nNên mới thấy được vẻ đẹp thực sự.」"
2356 = "「Không được bước sải dài đâu nha~!\\nBước nhỏ thôi, bước ngắn thôi, cố gắng đừng nhấc gót chân lên quá cao.」"
2360 = "「D-dạ không——à ừm, làm phiền mọi người ạ. Desu.」"
2361 = "「Cũng không có gì…… Chuyện này không phải bí mật hay gì đâu ạ.\\nNhưng mà, nếu để Nagi phải bận tâm kỳ lạ thì em không thích đâu.」"
2362 = "「Dạ không, đâu có ạ.」"
2363 = "「Ừ. Em sẽ làm được thôi. Chắc chắn đấy.\\nGiống như công việc ở nhà ga, nhất định em sẽ học được.」"
2364 = "「Chính xác. Mới một lần mà em đã nhớ kỹ rồi.」"
2365 = "「Dạ không, chuyện đó!\\nLà do em hỏi hơi kỳ cục thôi.」"
2366 = "「Không đâu. Hoàn toàn không! Rất hoan nghênh là đằng khác!\\nHơn nữa——」"
2375 = "「Chị Paulette cũng khen cậu lắm đó nha!!\\nBảo là kinh nghiệm tiếp khách khác biệt hoàn toàn luôn!」"
2378 = "「Fuka――Oái!!?」"
2379 = "「Fukami.」"
2380 = "「Fukami đã bảo là bí mật rồi mà.\\nAnh cũng sẽ không cố gặng hỏi đâu.」"
2382 = "「Fukami!!!」"
2384 = "「Fukami cũng vậy, chúc em có một ngày tuyệt vời nhé.」"
2392 = "「Thế, tiếp theo chúng ta làm gì?\\nNếu Fukami có nguyện vọng khác, anh sẽ chiều theo em.」"
2393 = "「Sau đó, em thấy cô đơn lắm. Quả nhiên em vẫn muốn\\nlàm việc cùng mọi người――Em không muốn bị bỏ lại phía sau.」"
2397 = "「Reina và chị Paulette cũng từng nói thế.\\nNhưng mà, em…… không tự tin là mình có làm được hay không.」"
2400 = "「Tất nhiên rồi.\\nHôm nay, anh sẽ đồng hành cùng Fukami trong mọi việc.」"
2401 = "「Tất nhiên rồi! Em sẽ cố gắng hết mình!!」"
2402 = "「Tất nhiên rồi! Bé Fukami!\\nDù có lớn lên, chúng ta vẫn sẽ mãi mãi, mãi mãi là bạn thân nhất của nhau!」"
2403 = "「Đúng rồi đó. Em đã nghe thấy mà. Ngay tại chỗ luôn.\\nCâu 'Xin hãy cho em làm trưởng tàu' của bé Fukami ấy.」"
2404 = "「Tất nhiên rồi ạ! Thay đổi rất nhiều, hoàn toàn khác luôn! Ạ!」"
2405 = "「Tất nhiên, bây giờ thì em chưa làm được đâu.」"
2407 = "「Tâm trạng chị vui vẻ thế này,\\nchắc buổi tham quan tốt đẹp lắm nhỉ?」"
2408 = "「Tuyệt quá nhỉ. Suy nghĩ đó ấy.」"
2414 = "「Việc biết được Fukami cũng đang có hứng thú với đầu máy 8620.\\nAnh thực sự thấy rất vui.」"
2424 = "「Đúng vậy. Lúc tàu vào ga, nếu có người giẫm qua vạch vàng,\\nthì bắt buộc phải kéo \\x%l汽笛;#00ffc040;còi hơi nước%l;#;.」"
2425 = "「Đúng là khó thật nha. Thế nên, việc bé Fukami\\nhướng tới mục tiêu trở thành trưởng tàu, thực sự khiến chị rất yên tâm đó!」"
2426 = "「Cái đó thì, đúng là có khác một chút……\\nNhưng mà, không sao đâu ạ. Anh giữ thăng bằng tốt mà.」"
2432 = "「Vô số bộ phận được lắp ráp lại với nhau, không có một chi tiết nào thừa thãi.\\nLà kết tinh của cụm từ 'vẻ đẹp công năng'. Đó chính là 8620 của tôi.」"
2433 = "「Cứ hoàn thành tốt công việc ở ga, tranh thủ lúc rảnh rỗi lên tàu để học hỏi là được.\\nVề đoàn tàu, về tuyến đường sắt. Cứ làm thế thì――」"
2438 = "「Hơn nữa, anh cũng rất vui khi biết tấm lòng của em. Rằng em muốn làm \\x%l車掌;#00ffc040;trưởng tàu%l;#;\\nlà để hỗ trợ chúng anh――để cùng nhau đồng hành.」"
2439 = "「Với lại! Em thuộc hệ thủy mà! Em chịu nóng kém lắm――\\nLại còn ở gần lửa thế này thì, không thể nào làm được đâu ạ.」"
2441 = "「Được em khen thì anh vui lắm nhưng mà――」"
2443 = "「Được rủ đi chuyến dã ngoại đó, thật sự rất tuyệt.\\nTừ khoảnh khắc đó――anh nghĩ mình đã thay đổi rất nhiều.」"
2448 = "「Gương mặt anh thì đúng là vậy thật.」"
2449 = "「T, thôi đi! Anh Soutetsu. Đột nhiên lại――\\nNói mấy lời đó, làm em, ngại lắm đấy, ạ.」"
2450 = "「Nói là tỏa sáng thì, anh cũng hiểu.\\nNụ cười của em ấy sau khi hoàn thành nhiệm vụ, đúng nghĩa là tỏa sáng luôn.」"
2451 = "「Thẳng thắn mà nói thì đúng là vậy. Sau hơn một năm đi dã ngoại liên tục,\\nanh bắt đầu có cảm giác đi đâu cũng được.」"
2452 = "「Đúng vậy nhỉ. 8620——và tất cả các đầu máy hơi nước,\\nđều là những cỗ máy vô cùng tuyệt vời và đẹp đẽ.」"
2453 = "「Cảm ơn anh ạ! Dạ, bản thân em\\ncũng đã tự học hỏi và tìm hiểu một chút.」"
2454 = "「Cảm ơn anh, ạ.\\nDù em đột ngột thay đổi kế hoạch mà anh vẫn cho em tham quan.」"
2463 = "「Chỉ một cách chọn lộ trình thôi, mà có thể thay đổi lớn đến việc\\nnó có thành công như một dịch vụ du lịch hay không sao.」"
2481 = "「Khoan――chuyện này――dù sao cũng phải――\\nkéo lên, bờ đã!!」"
2482 = "「Không hề nói quá đâu, chúng ta giao phó sinh mạng cho nhau mà――\\nSinh mạng của hành khách cũng do tất cả cùng gánh vác nữa.」"
2483 = "「Tuyệt thật đấy. Thực sự rất tuyệt.」"
2484 = "「Uổng phí hay không thì em không nghĩ tới――nhưng em không muốn cản trở vị trí của Nagi trong buồng lái đâu.」"
2485 = "「Đó là vì Fukami đã hiểu rõ về nhà ga.\\nDo đó, Paulette mới gỡ bỏ chữ \"học việc\" của em.」"
2486 = "「Ra vậy…… Còn phải bận tâm đến cảnh quan nữa nhỉ.」"
2487 = "「Vậy sao.」"
2488 = "「Khoảng thời gian này. Và tất cả những khoảng thời gian――\\nđã kết nối để tạo nên khoảnh khắc này, đều thật hạnh phúc.」"
2489 = "「Chắc chắn là khó rồi. Khác với \\x%l機関士;#00ffc040;lái tàu%l;#;,\\n\\x%l車掌;#00ffc040;trưởng tàu%l;#; không thể nhìn thấy phía trước lộ trình.」"
2490 = "「Cả cái đôi giày đi nước này nữa……\\nKhông bị trơn trượt thì tốt thật đấy――nhưng mãi mà chưa quen được.」"
2491 = "「Lên đây đi. Hơi chật chội chút, xin lỗi nhé.」"
2495 = "「Về lý thuyết…… thì trong đầu em cũng hiểu rồi ạ.\\nNhưng mà…… em――không biết thực tế mình có làm được hay không nữa.」"
2496 = "「Vì vẫn chưa chuẩn bị gì cả, nên em định\\nchờ hoàn thiện thêm một chút nữa. Nhưng mà, dù sao chúng ta cũng đổ mồ hôi rồi.」"
2498 = "「À, ừm——Hachiroku.\\nTiểu thư Fukami thì…… ừm, chị đừng gọi em như vậy nữa, được không ạ. Desu.」"
2500 = "「Dạ…… Theo kế hoạch ban đầu của anh Soutetsu,\\nthì hôm nay anh định dẫn em đi đâu ạ?」"
2502 = "「Vậy, hẹn gặp lại nhé? Nagi.\\nChúc em làm việc tốt!」"
2504 = "「Có phải là 『Kéo van đỏ』 không ạ?\\nLúc dừng đoàn tàu đó lại, Olivy đã nói vậy.」"
2506 = "「Nếu vậy thì, anh cũng thấy bõ công dạy.」"
2509 = "「Nếu vậy thì, em——\\nxin phép không khách sáo, được tham quan ạ——desu!」"
2512 = "「Đó là dáng vẻ tỏa sáng nhất của Nagi.\\nTrong buồng lái, chắc chắn anh Soutetsu cũng vậy.」"
2513 = "「Lúc đó thì――em sẽ phất cờ. Cờ đỏ.\\nVì nếu tàu tiến vào ga, người đó có thể sẽ chết mất.」"
2515 = "「Vậy ra, động cơ của em có liên quan đến Nagi à?」"
2517 = "「Vậy! Quả nhiên đoạn này phải chốt thôi.\\nCòn lại là, chọn đây làm điểm xuất phát, hay điểm kết thúc――kiểu vậy ạ.」"
2518 = "「Nếu vậy thì, hãy dạy cho em đi! Về nhà ga, về tuyến đường sắt. Dù chỉ từng chút một, bắt đầu từ những thứ em có thể nhớ được ngay bây giờ!」"
2520 = "「Chuyện quá khứ thôi. Nagi bây giờ đã khác xưa rồi.\\nĐã trưởng thành hơn――và đang nỗ lực để trở thành một quý cô.」"
2521 = "「Dù chúng ta đã quyết định và tuân thủ việc chia đều thời gian cho cả ba người――.\\nNhưng thời gian làm việc, em nghĩ mức độ gắn kết vẫn khác biệt lắm.」"
2522 = "「Anh Soutetsu? Không sao đâu ạ.\\nEm sẽ đi gọi người đến ngay!!!」"
2523 = "「Anh Soutets!? ――Kyaa!!?」"
2524 = "「Anh Soutetsu!!?」"
2700 = "Một giọng nói náo nhiệt. Một giọng nói dịu dàng.\\nNhững giọng nói hòa quyện vào nhau mà tôi vô cùng yêu thích."
2702 = "Không được rồi. Fukami đang sợ hãi.\\nEm ấy đang tuyệt vọng kéo cơ thể tôi."
2704 = "Chết dở, trượt chân rồi!\\nKhông biết từ lúc nào tôi đã sải bước dài――"
2706 = "Không phải. Tôi cũng đã được chiều chuộng.\\nTrong khoảng thời gian ở bên hai em, tôi đã nhận được một niềm hạnh phúc to lớn."
2708 = "Không muốn bị bỏ lại phía sau――\\nNagi cũng từng nói y hệt như vậy."
2710 = "Trong lúc lái tàu,\\ntôi phải luôn chú ý phía trước, không có thời gian rảnh rỗi để nhìn Nagi――"
2717 = "Và cuối cùng――tôi đã có thể cất tiếng."
2725 = "Công việc của Nagi, người vẫn đang học việc, được Hachiroku theo dõi sát sao.\\nDĩ nhiên, việc làm qua loa hay sai sót là không thể chấp nhận được."
2726 = "Ở độ tuổi của Fukami――không, dù có lớn tuổi hơn nhiều đi chăng nữa,\\nnhững điều đó tuyệt đối không thể nói là 『không làm được gì』."
2732 = "Nhưng quả thực, nếu đặt mình vào vị trí của Fukami mà suy nghĩ,\\nđó đúng là việc không thể làm được nếu thiếu đi lòng dũng cảm."
2734 = "A, nhưng mà――Nagi, và Fukami, đang bắt đầu lột xác."
2747 = "Fukami vẫn cố vươn tới nắm lấy bàn tay tôi vừa rụt lại――\\nCố sức rướn người, kết quả là tự mình cũng bị trượt ngã!"
2748 = "Khoảng cách chỉ vài bước chân giữa tôi và Fukami,\\nlại có cảm giác xa xăm vô tận."
2749 = "Những giọng nói tôi yêu thích, giờ đây nghe thật xót xa.\\nNhững nỗi buồn, những niềm hối hận, đang cộng hưởng đầy bi thương."
2752 = "Ngón tay Hachiroku đầy tự hào vuốt ve mặt kính của đồng hồ đo mực nước."
2758 = "Gương mặt Nagi, Hachiroku và Hibiki giãn ra với nụ cười 'ufufu'.\\nCó lẽ tôi cũng đang làm vẻ mặt tương tự."
2775 = "Quả nhiên Nagi cũng hiểu.\\nNhận được sự hỗ trợ mạnh mẽ đó, gương mặt Fukami giãn ra nhẹ nhõm."
2778 = "Nagi im lặng trong giây lát.\\nTôi nghe thấy tiếng em ấy――hít một hơi thật sâu."
2779 = "Vừa dứt lời, Nagi đã nhanh chóng chạy ra khỏi buồng lái.\\nHachiroku cũng thong thả bước theo sau."
2788 = "Dù có phải nếm trải bao nhiêu nỗi cô đơn trong một khoảnh khắc――\\nVì sự trưởng thành, tôi cũng muốn hướng tới chuyến đi tiếp theo."
2803 = "Có lẽ vì chuyến tàu BBQ sắp khởi hành,\\nnên thị trấn Ohimitera lúc này thưa thớt người qua lại."
2807 = "Thật tốt vì đã nói cho em ấy biết――Tôi nghĩ vậy.\\nNhững điều vừa nói với Fukami, nhất định tôi cũng sẽ kể cho Nagi nghe."
2810 = "Tôi bỗng có cảm giác muốn chạm vào em ấy một cách tự nhiên.\\nThấy nhớ hơi ấm của Fukami."
2812 = "Tõm một tiếng, Fukami đá nước."
2824 = "Náo nhiệt, tràn đầy kích thích dù tốt hay xấu, và hạnh phúc――\\nChuyến đi mà hai em ấy đã ban tặng cho tôi khoảng thời gian mà tôi từng đánh mất."
2825 = "Những cuộc trò chuyện bình dị và ngây ngô,\\nnghe thật ấm áp và quý giá làm sao."
2827 = "Cái gật đầu đáp lại của em ấy mạnh mẽ đến mức khiến tôi hơi ngạc nhiên."
2828 = "Một mùi hương thoang thoảng, ngọt ngào lan tỏa.\\nGiống như một đóa hoa nở thầm lặng, vẫn là mùi hương thường ngày của Fukami."
2831 = "A, em ấy thật đẹp――tôi quả thực nghĩ vậy.\\nDù cách ăn mặc, cách trang điểm, chẳng có chút gì thay đổi."
2833 = "Nhấc chân lên khá cao――\\nNhưng em ấy vẫn không hề mất thăng bằng dù chỉ một chút."
2835 = "Bây giờ tôi mới thấm thía nhận ra rằng,\\nNagi và Fukami vừa là bạn thân, lại vừa là đối thủ của nhau."
2837 = "Phải cử động. Phải bước đi.\\nPhải tung cánh――Nếu không thì chẳng thể trở thành một người lớn đúng nghĩa."
2842 = "Tôi không thể nói thật được.\\nNhưng cũng không muốn nói dối."
2847 = "Giống như một chú cá, giống như một nàng tiên cá."
2849 = "Giống như lúc chuyến xuôi dòng gặp khó khăn nhất, Nagi đã một mình,\\nvô cùng ngây thơ――giúp đỡ Fukami vậy."
2851 = "Đúng như cô ấy tự nhận mình chỉ là \\x%l車掌;#00ffc040;trưởng tàu%l;#; đại diện lâm thời, khẩn cấp,\\ntôi không nghĩ phong cách làm việc của cô ấy lại đáng ngưỡng mộ đến thế――"
2853 = "Dù em ấy không làm vậy,\\ntôi cũng đã quyết định hôm nay sẽ ở bên Fukami cả ngày rồi mà."
2855 = "Dù Hachiroku có phản đối đi chăng nữa,\\nthì Paulette vẫn sẽ nhất quyết làm thế."
2857 = "Dù cho khả năng giữ thăng bằng của tôi có nhỉnh hơn người bình thường đi chăng nữa――\\nA."
2864 = "Khi không còn cần chúng tôi giúp đỡ nhiều nữa,\\nchúng tôi dồn toàn bộ sức lực vào đường sắt."
2871 = "Được chào đón và tiếp nhận một cách tự nhiên và tươi sáng,\\nFukami đỏ bừng cả mặt."
2888 = "Chỉ mới tưởng tượng thôi mà đã thấy háo hức rồi."
2891 = "Việc hồi phục chậm lại,\\nchắc chắn là do ảnh hưởng của tuổi tác rồi."
2895 = "Chỉ cần hơi vội một chút là chân tôi lại bồng bềnh.\\nDù là vùng nước nông, nhưng dòng chảy của sông Kuma cũng khá mạnh."
2896 = "Không muốn kéo theo Fukami ngã cùng,\\ntôi vội rụt tay lại."
2899 = "Tôi không muốn em ấy phải cố sức. Không muốn làm em ấy lo lắng.\\nNên tôi muốn mở mắt ra và cử động. Thế nhưng――"
2901 = "Quả thực tôi cũng vậy, chỉ tận hưởng được sự mát lạnh và cảm giác của nước trong chốc lát.\\nKhi bắt đầu bước đi, tôi lập tức bị phân tâm bởi sự khó khăn khi di chuyển."
2904 = "Vừa uống nước trong chai nhựa,\\ntôi vừa thong thả hỏi em ấy trên băng ghế nghỉ dành cho khách du lịch."
2906 = "Tôi muốn bắt lấy khoảnh khắc ấy, xem đó là nụ cười như thế nào,\\nnhưng tôi lúc này đến cả ánh mắt cũng chỉ có thể đảo qua đảo lại từ từ."
2908 = "Nghĩ xem nên nói gì……\\nThì ngay lập tức một câu nói nảy ra trong đầu."
2911 = "Tôi đang muốn nghỉ ngơi,\\nnhưng Fukami lại lắc đầu."
2913 = "Tôi muốn nói rằng không phải vậy, nhưng lại không cất nên lời."
2915 = "Tôi cảm nhận được rằng, em ấy hiểu\\nthời gian và khoảng cách quan trọng đến nhường nào đối với sự an toàn."
2916 = "Ngay cả đôi chân đưa Fukami về cũng có chút nặng nề.\\nDù tôi khá tự tin vào thể lực của mình."
2919 = "Tôi thoáng phân vân không biết có nên nói ra hay không.\\nBình thường, khi chỉ có hai người――"
2921 = "Mí mắt tôi mở ra.\\nCơ thể cử động."
2922 = "Tôi bật cười ha hả."
2924 = "Ý nghĩa trong câu nói ban nãy của Fukami,\\ncuối cùng tôi cũng đã hiểu được."
2925 = "Tôi nghe thấy tiếng nói."
2926 = "Tôi hiểu mà."
2927 = "Rằng Nagi cũng nghĩ về Fukami, giống như Fukami nghĩ về Nagi――\\nVà vì thế, em ấy mới trở nên sốt ruột."
2930 = "Vừa nói, tôi vừa xoa nhẹ lên đầu Fukami.\\nNhìn là thấy ngay, gương mặt em ấy đã trở nên an tâm hơn hẳn."
2932 = "Vì thế, có lẽ em ấy đã cố gắng hết sức và nhanh nhất trong khả năng của mình.\\nNagi vẫn đeo găng tay lao động, người dính đầy những vết đen."
2934 = "Nên tôi đã kể lại.\\nKể lại y nguyên những gì tôi nhớ cho Fukami nghe."
2937 = "Kéo van đỏ――Khi có tình huống bất thường xảy ra,\\n\\x%l車掌;#00ffc040;trưởng tàu%l;#; sẽ tự mình đưa ra quyết định kéo phanh khẩn cấp."
2940 = "Dù biết là vậy nhưng――"
2941 = "Nên tôi cũng sải bước dài.\\nVừa vặn khớp với nhịp bước của Fukami."
2944 = "Nghĩ lại thì, tôi cũng tò mò thật.\\nNên tôi bèn hỏi."
2951 = "Mặc kệ Hibiki đang luống cuống,\\nFukami gật đầu mạnh mẽ đáp lại."
2953 = "Nụ cười toe toét của Hibiki có chút gì đó tinh nghịch."
2956 = "Thông báo kết thúc thời gian học việc của Fukami từ Paulette,\\nlà vào chiều tối hôm qua."
2958 = "Fukami, và Nagi, đã thay đổi tôi.\\nĐã dạy tôi niềm vui khi cùng nhau tận hưởng, tự mình tận hưởng."
2960 = "Quá đỗi hạnh phúc và vui vẻ――\\nĐến mức tôi không còn nhận ra cơ thể mình đã mệt mỏi rã rời."
2970 = "Là――nước. Lạnh quá.\\nVô cùng lạnh, nhưng cũng rất dễ chịu."
2972 = "Con mắt nhìn người, và sự quyết đoán. Nhờ có những điều đó,\\nmà Paulette mới có thể dùng đôi vai gầy guộc ấy tiếp tục chống đỡ cho cả thành phố và công ty."
2975 = "Fukami đang bị sốc.\\nKhông giống như đang diễn kịch――À không, ra là vậy."
2977 = "Cả Fukami cũng――\\nKhông, nếu là Fukami, hẳn em ấy còn nhận ra rõ hơn tôi."
2979 = "Ngón tay Fukami vươn tới.\\nTrượt dọc theo đường cằm của tôi, rồi đi lên――"
2982 = "Có vẻ như con bé đang ngắm nhìn theo cảm tính, ánh mắt đưa đẩy tự do.\\nNgó nghiêng xung quanh, dòm ngó chỗ này chỗ kia——"
2983 = "Fukami đã đến xem nơi làm việc của tôi.\\nNagi dĩ nhiên là vậy, cả Hachiroku và Hibiki cũng vô cùng hoan nghênh đón tiếp em ấy."
2985 = "Fukami lại một lần nữa nhìn quanh buồng lái.\\nSau đó, con bé nhìn tôi bằng ánh mắt có chút ngơ ngác."
2987 = "Em ấy dứt khoát nói.\\nÁnh mắt mạnh mẽ nhìn thẳng vào tôi."
2988 = "Theo nguyện vọng của Fukami, người đã vui sướng đến báo tin,\\ntôi đã thay đổi lịch trình hôm nay thành tham quan buồng lái――"
2994 = "Fukami quay lại.\\nVươn tay về phía tôi――"
2995 = "Fukami đã hiểu rất rõ.\\nCảm nhận được điều đó, tôi lại muốn tiến thêm một bước nữa."
2999 = "Em ấy được Paulette tin tưởng.\\nCó sức ảnh hưởng trực tiếp đến ngành du lịch của thành phố Ohimitera."
3001 = "Giống như đang dạy bảng cửu chương từ đầu cho một đứa trẻ không biết gì.\\nFukami bỗng dưng tỏ thái độ giống hệt một giáo viên."
3003 = "Chỉ trong một khoảnh khắc, vạt áo tôi bị túm lấy và kéo đi.\\nĐáng yêu thật đấy, tôi bất giác mỉm cười."
3005 = "Tiếng cảm thán thốt ra."
3008 = "Muốn làm việc cùng chúng tôi. Điều đó có nghĩa là,\\nmuốn trở thành sức mạnh――muốn giúp đỡ chúng tôi sao."
3009 = "Tôi muốn học hỏi về đoàn tàu, về tuyến đường sắt\\ntừng bước một, bắt đầu từ những việc mình có thể làm ngay bây giờ."
3011 = "Em ấy ngẩn người ra. Có vẻ rất ngạc nhiên.\\nThật tốt vì đã nói cho em ấy biết――Tôi nghĩ vậy."
3013 = "Fukami cuống cuồng xua tay loạn xạ."
3016 = "Những điều tôi vừa dạy ban nãy,\\nFukami nhắc lại một cách chính xác."
3017 = "Fukami áp mặt vào bắp tay tôi."
3019 = "Fukami kéo tay tôi.\\nVới nụ cười rạng rỡ, em ấy sải một bước dài tự do tự tại."
3022 = "Fukami dáo dác nhìn quanh quất.\\nA, hiểu ý em ấy, tôi bèn nhìn xuống từ cửa sổ bên hông buồng lái."
3024 = "Em ấy đỏ bừng mặt, xua xua tay――"
3025 = "Fukami đứng bật dậy.\\nLưng vươn thẳng tắp."
3029 = "Bàn tay Fukami khẽ nắm chặt lại trong giây lát."
3030 = "Fukami lẩm bẩm đầy tiếc nuối.\\nDù sao thì cũng đã quá trưa rồi."
3031 = "Giọng Fukami nhỏ dần."
3033 = "Đôi má Fukami ửng hồng rạng rỡ.\\nTrong ánh mắt ánh lên một tia sáng vô cùng mạnh mẽ."
3035 = "Fukami cười khổ.\\nTrông có vẻ như đang xen lẫn giữa sự bối rối và niềm vui."
3037 = "Gương mặt vừa mới giãn ra lại trở nên căng thẳng.\\nTôi lại một lần nữa cảm nhận sâu sắc rằng Fukami rất ham học hỏi."
3038 = "Có lẽ vì muốn che giấu sự xấu hổ, Fukami nói nhanh hơn một chút.\\nNhưng mà…… giờ mới nói điều đó thì――"
3041 = "Cơ thể vẫn đang nũng nịu dựa dẫm vào tôi,\\nFukami bỗng tách ra."
3044 = "Bằng một giọng nói đầy căng thẳng,\\nFukami rón rén bước lên buồng lái."
3045 = "Ngay khoảnh khắc tôi nói vậy, Fukami thở phào nhẹ nhõm."
3046 = "Nghe tôi nói, Fukami khẽ cười bẽn lẽn."
3047 = "Tôi vừa dứt lời, nụ cười của Fukami liền nở rộ rạng rỡ."
3049 = "Chầm chậm,\\nmột nụ cười rạng rỡ vì vui sướng lan tỏa khắp gương mặt Fukami."
3050 = "Nói rồi, Fukami xoay người lại."
3052 = "Một tiếng cười khúc khích nhỏ nhẹ vang lên."
3053 = "Fukami khẽ gật đầu,\\nrồi lại một lần nữa đảo mắt——nhìn quanh buồng lái."
3056 = "Bắn tung tóe, em ấy nhảy lên.\\nĐôi chân xinh đẹp vút lên khỏi mặt nước――"
3057 = "Em ấy lộ vẻ mặt vô cùng kinh ngạc."
3058 = "Fukami quay ngoắt sang hướng khác.\\nCổ em ấy đỏ ửng lên."
3060 = "Để bảo vệ em ấy, tôi vội vàng vươn tay ra――"
3061 = "Để trưởng thành và tung cánh bay cao,\\ncác em ấy đang tự mình đặt dấu chấm hết cho khoảng thời gian phép thuật ngọt ngào và vui vẻ này."
3062 = "Vì một ngày nào đó, khi tuyến đường sắt được nối liền,\\ntôi cũng đang học hỏi đủ thứ từ Hachiroku."
3063 = "Vì sự an toàn, vì để ngăn ngừa nguy hiểm xảy ra.\\nLà việc đoạt lấy quyền điều hành đoàn tàu từ bất kỳ ai khác."
3066 = "Dù có thân thiết đến mấy, hay có lẽ chính vì quá thân thiết,\\nmà vẫn có những điều không thể truyền đạt, không thể nói ra."
3067 = "Cả lý do khiến Hachiroku bối rối,\\nlẫn lý do Fukami lại yêu cầu như vậy."
3073 = "Bây giờ nếu muốn thì vẫn có thể đi được, nhưng đến nơi,\\nchắc chắn chúng tôi sẽ phải trải qua một cách khá vội vã."
3077 = "Quả thực, chuyến đi là thứ…… bắt buộc phải kết thúc.\\nNếu không có bến đỗ, thì chuyến đi nào rồi cũng sẽ trở thành nỗi đau."
3081 = "Quan tâm và hỗ trợ lẫn nhau――\\nTrong vòng tròn ấy, có tôi, có chúng tôi."
3082 = "Fukami và Nagi. Nagi và Fukami.\\nTrong mối liên kết ấy, tôi cũng có thể ở cùng."
3091 = "Nguy rồi. Phản tác dụng mất rồi."
3100 = "Gương mặt ấy, dần dần, mềm mại tan ra,\\ntrông có vẻ ngượng ngùng, lại có vẻ vui sướng."
3101 = "Khi nghe Hachiroku nói, tôi từng cảm thấy\\nchỉ một cái phanh mà cần đến dũng khí thì có hơi nói quá."
3102 = "Nghe gọi, tôi mới nhận ra.\\nMình đang nhắm mắt."
3122 = "Nói ra thì hơi kỳ, nhưng\\ncô Railord tên Olivy đó."
3123 = "Nói rồi, Fukami cười \"ahaha\",\\nmột nụ cười có phần gượng gạo."
3124 = "Nói ra, tôi lại nhớ về những kỷ niệm."
3125 = "Tôi không định làm em ấy ngại――\\nNhưng thấy em ấy ngại ngùng thế này, tôi lại thấy vui."
3136 = "Ở cạnh Nagi thì chúng tôi tránh nói chuyện về Fukami, ở cạnh Fukami thì tránh nói về Nagi,\\ncả hai chúng tôi đều vô tình lảng tránh điều đó."
3137 = "Nếu so sánh với những người thợ lành nghề,\\ntôi và cả Nagi dĩ nhiên vẫn chỉ là dân nghiệp dư."
3140 = "Cơ thể, nặng trĩu. Có cảm giác đang chìm dần.\\nỞ vùng nước nông thế này, không thể nào chết đuối được."
3141 = "Cơ thể không nhúc nhích dù chỉ một chút.\\nTôi không biết phải dùng sức thế nào."
3150 = "Cái này khó quá đi mất.\\nĐi bộ dưới sông thế này, là trải nghiệm mà tôi chưa từng có."
3151 = "Vẫn chưa đầy ba năm――\\nMới chỉ trôi qua chừng ấy thời gian thôi."
3152 = "Tôi có thể cảm nhận như vậy. Rất chân thành.\\nĐến mức tôi nghĩ nó có thể gột rửa cả những vết thương trong quá khứ."
3153 = "Việc nhớ lại vào đúng lúc này,\\nthật có lỗi nhưng cũng hơi buồn cười."
3154 = "Đó là một niềm vui giản đơn, và――"
3155 = "Nhẹ nhàng――\\nNụ cười nở trên môi Fukami lần này lại vô cùng tự nhiên."
3156 = "Đó là chuyện tôi hoàn toàn chưa từng nghe.\\nSự tò mò đã giúp tôi khôi phục lại tinh thần."
3161 = "Đáng yêu thì đáng yêu thật, nhưng cũng tội nghiệp con bé.\\nThêm vào đó——"
3162 = "Dù đã được dòng sông xoa dịu, làm mát,\\nnhưng đôi chân vẫn chẳng nhẹ nhàng hơn chút nào."
3178 = "（Nhưng nếu nắm lấy tay em ấy）"
3182 = "（A――）"
3183 = "（A! Lời chị Mayami dặn,\\n『Phải biết giữ gìn sức khỏe』 là thế này đây sao――）"
3185 = "（Rào rào rào rào）"
3186 = "（Tùm!!!!!）"
3187 = "（Nắn nắn）"
3188 = "（Giật mạnh!）"
3189 = "（Giật nhẹ）"
3190 = "（Nếu vậy thì――mình, cũng phải――）"
3192 = "（Áp sát）"
3193 = "Liệu dòng sông có rung chuyển theo độ rung khi 8620 đi qua không?\\nNếu \\x%l汽笛;#00ffc040;còi hơi nước%l;#; vang lên, liệu mặt sông có gợn sóng lăn tăn không?"

[selections]
