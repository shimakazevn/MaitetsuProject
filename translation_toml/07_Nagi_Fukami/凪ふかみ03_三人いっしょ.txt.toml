1774 = "「Nhân cơ hội đó, bọn em cũng sẽ cố gắng!」"
1794 = "「Cái này... đúng phong cách dã ngoại thật đấy」"
1795 = "「Nhiều thứ lắm. Đủ thứ.\\nVui vẻ, bực mình, hay nhàm chán chẳng hạn」"
1796 = "「À thì——ờm——ờm, là thế này!」"
1797 = "「Ờm...」"
1798 = "「Chuyện đó... cảm ơn hai em」"
1799 = "「Cái này cũng khó phết đấy」"
1800 = "「Để xem thế nào đã. Dù quá trình có tốt,\\nmà thành phẩm tệ thì cũng vô nghĩa」"
1801 = "「Chuyện đó... tụi em biết chứ」"
1802 = "「Cái máy này, gọi là búa máy truyền động bằng dây đai」"
1803 = "「Ờm, dạ.\\nNghe chuyện thì có vẻ không chỉ là lợi ích đâu ạ」"
1804 = "「Ờm, tụi cháu muốn được tận hưởng chuyến đi này ạ.\\nHôm nay mong ông giúp đỡ với trải nghiệm rèn dao ạ」"
1805 = "「Dạ, giữ bí mật thêm chút nữa được không ạ?\\nỜm, em cũng không biết có làm tốt được không nữa」"
1806 = "「Hết cách rồi」"
1807 = "「Không phải \"phong cách\", mà là dã ngoại thật! Hàng thật giá thật đó」"
1808 = "「Vậy sao」"
1809 = "「Uống chứ, tất nhiên rồi. Rượu buồn, mà cũng là rượu mừng mà」"
1810 = "「Nếu vậy thì,\\nít nhất tôi cũng có một người bạn ở Đại học Đế quốc」"
1811 = "「Khoan!? Em đạp mạnh quá rồi đấy」"
1814 = "「Có nước ngọt Ramune mà! Không sao đâu!」"
1816 = "「Cái đó đâu phải lưỡi dao, chỉ là phần thân bị dẹt ra thôi mà」"
1818 = "「Đương nhiên rồi! Đang làm dao mà lị」"
1821 = "「Vậy nhé. Mai gặp lại」"
1822 = "「Vậy thì——」"
1823 = "「Đó là! Chuy... ư!? ——Ưm ưm~」"
1825 = "「Vậy thì, mãi mãi nhé! Tất cả nhé!」"
1826 = "「Để xem tay nghề của em thế nào nào」"
1829 = "「Thế là, tiếp tục ngày hôm nay hả?\\nHay là, từ nay về sau luôn」"
1831 = "「Nếu vậy, vai trò của anh là giáo viên hướng dẫn——」"
1832 = "「Vậy, đến lượt anh nhỉ」"
1835 = "「Vậy thì đi cẩn thận nhé.\\nChúc mọi người có một chuyến đi vui vẻ」"
1836 = "「Đầu tiên là——」"
1838 = "「Thế? Sou-chan trả lời thế nào?」"
1839 = "「Đâu có lỡ mất đâu!\\nChắc chắn là chỉ để dành lại cho sau này thôi mà」"
1843 = "「Anh Soutetsu cũng là học sinh mà. Không phải người hướng dẫn,\\nmà là bạn cùng lớp với em và Nagi」"
1844 = "「Mối quan hệ bạn bè của anh Soutetsu, lúc nhỏ thì có rất nhiều.\\nỜm... sau đó một thời gian thì không có ai. Rồi lên Đại học Đế quốc thì có một người」"
1847 = "「Xin làm phiềnnnnn!」"
1848 = "「!」"
1849 = "「!!?」"
1850 = "「?」"
1851 = "「~~~~~~~~~~」"
1854 = "『「Không phải ạ」\\n「Sai rồi!」』"
1858 = "『（Chụt!）\\n（Chụt!）』"
1996 = "Cùng nhau học hỏi, cùng nhau trưởng thành.\\nKhoảng thời gian đã lỡ mất, sẽ được bồi đắp cùng Nagi và Fukami."
2006 = "Có lẽ ông đang chỉnh lại những chỗ bị cong vênh,\\ngõ nhẹ rồi mài thêm một chút, sau đó lấy cán gỗ mộc ra."
2009 = "Không biết có nghĩ ra điều gì không,\\nmà Fukami bỗng nín thở, rồi mặt đỏ bừng lên."
2010 = "Không hiểu sao,\\nsự quyết tâm trong mắt Fukami lại dao động."
2011 = "Ngay cả búa đập cũng hơi nhúc nhích thăm dò——\\ncó vẻ như nó cũng đang e dè."
2022 = "Nếu vậy, tôi sẽ không dừng bước nữa.\\nCứ đi thẳng đến nơi mình muốn đến thôi."
2032 = "Không ai, không gì cả——\\ntrói buộc tôi."
2035 = "Chắc là cuối cùng cũng nắm được nhịp,\\ntiếng búa đập cũng đã đều đặn hơn."
2036 = "Cách ông Minokasa đối xử với Nagi,\\ndù là khách nhưng vẫn tràn đầy sự dịu dàng của một người ông."
2037 = "Dù vậy, Fukami vẫn không dừng lại mà tiếp tục nói."
2040 = "Nhưng nếu học lại từ đầu ngay tại nơi này, lúc này,\\nthì bao nhiêu thời gian cũng có thể bù đắp được."
2043 = "Nhưng mà, cả chị Mayami, Hibiki, Hachiroku...\\nvà không hiểu sao, đến cả Paulette nữa——"
2044 = "Nhưng nói vậy chứ, để khẳng định chắc chắn là \"thích\" kiểu gì...\\nthì tôi lại không có đủ tự tin."
2059 = "Hai giọng nói lớn đồng thanh vang lên."
2060 = "Vẫn ôm chặt lấy tôi, hai đứa ngước nhìn lên."
2061 = "Tôi đón nhận nụ hôn đầu của cả hai cùng lúc."
2062 = "Hai đứa cụng trán vào nhau,\\nbắt đầu thì thầm to nhỏ."
2065 = "Nói rồi, rốp một tiếng.\\nHachiroku nhai mạnh miếng than đá."
2109 = "Một lời của Nagi đã chỉ cho tôi thấy.\\nDù không thể quay lại thời điểm đó để làm lại từ đầu."
2113 = "Dao Nagi——Nagi đã nói vậy,\\nnhưng đúng là tôi cũng có cảm giác muốn đặt tên cho nó."
2118 = "Có lẽ Nagi và Fukami đã giúp tôi lấy lại được\\nphần nào những kinh nghiệm còn dang dở đó."
2119 = "Nagi và Fukami nhìn nhau,\\nrồi Fukami thay mặt nói tiếp."
2120 = "Như thể muốn làm mẫu, Nagi ngồi trước đá mài,\\nvặn vòi nước, xả nước ào ào liên tục."
2122 = "Của Nagi nghe xoẹt xoẹt rất êm tai,\\ncòn của tôi và Fukami lại rèn rẹt, rèn rẹt, nghe như bị đứt quãng."
2125 = "Nagi thì ngồi phịch xuống, dang rộng hai chân.\\nNgược lại, Fukami lại khép hờ hai chân ngay ngắn."
2126 = "Nagi thì lúc nào cũng tràn đầy năng lượng, còn Fukami thì luôn thận trọng.\\nAnh cũng đã thấy được những dáng vẻ hoàn toàn khác với hình ảnh đó."
2127 = "Nagi phấn khích đến mức\\nhai gò má ửng hồng."
2130 = "Nagi nghiêng đầu một cách khoa trương.\\nFukami cũng lộ vẻ mặt rất khó xử."
2132 = "Nagi đỏ bừng cả mặt.\\nSự hoạt bát thường ngày biến mất sạch, thay vào đó là khuôn mặt nghiêm túc và có chút bất an."
2134 = "Nagi nhìn vẻ mặt của Fukami, cũng gật gù như đã hiểu."
2135 = "Nagi vừa đạp chân ga,\\nbúa đã giáng xuống nhanh gấp mấy lần lúc ông Minokasa làm."
2141 = "Chỉ cầm con dao hướng lưỡi lên trên, hoàn toàn không di chuyển,\\nquả cà chua được thả rơi ngay từ trên xuống——"
2146 = "Khoảnh khắc nói ra, tôi chợt nhận ra."
2150 = "Nhưng nói gì thì nói, lại dùng từ\\n『Xin làm phiền』, ông Minokasa vẫn đón nhận bằng một nụ cười hiền hậu."
2152 = "Nhờ ông Minokasa thấy vậy nên đã đưa tay ra giúp,\\nnên tấm thép vẫn giữ được hình dáng con dao, nhưng——"
2154 = "Tấm thép ban đầu có kích cỡ của dao thái thịt,\\nthế mà của Nagi giờ gần như thành dao thái sashimi rồi."
2163 = "Chỉ có Hachiroku là vẫn vẻ mặt thường ngày,\\ncòn chị Mayami và Hibiki thì hai má đều ửng hồng dễ chịu."
2181 = "Được rọi sáng rực rỡ trong ánh chiều tà đỏ rực,\\nmái tóc đen nhánh, khuôn mặt với những đường nét bóng đổ thật đẹp."
2183 = "Bị hối thúc, tôi mở cuốn sổ tay có dòng chữ\\n“Chuyến đi dã ngoại đặc biệt ở Ohito!” trên trang bìa."
2184 = "Fukami vừa xen vào,\\nNagi giật mình, nuốt lại những lời định nói."
2187 = "Dưới ánh mắt đó, có thứ gì đó cứng ngắc\\ntrong tim tôi khẽ nới lỏng ra."
2193 = "Của mọi người, hay của ông Minokasa cũng vậy...\\nNhưng hơn ai hết, là của Nagi và Fukami."
2197 = "Nói là biết, nhưng lại không nói tiếp,\\nNagi chuyển ánh mắt sang Fukami."
2198 = "Tôi đã được nhẹ nhàng đẩy lưng.\\nĐể có thể tự mình bước đi một bước."
2200 = "Chu đáo thật——tôi thoáng nghĩ vậy,\\nnhưng ngay lập tức lắc đầu, không phải vậy."
2202 = "Nói là không hứng thú ở thì quá khứ,\\nnhưng vẻ mặt lại vô cùng tập trung."
2206 = "Đúng như mong muốn, tôi ôm chặt lại cả hai một cách thật công bằng!"
2208 = "Thừa nhận rồi thì cổ họng lại thông suốt một cách kỳ lạ.\\nLời nói cứ thế tuôn ra."
2213 = "Luôn giữ góc độ của lưỡi dao tiếp xúc với đá mài cố định,\\nnhanh chóng di chuyển tay tới lui."
2214 = "Hiểu rõ mọi chuyện,\\nrồi lại coi đó chỉ là chuyện nhỏ."
2217 = "Ngay cả tôi cũng cảm nhận được, chữ \"thích\" này,\\nkhác với \"thích\" cà rốt hay mèo con."
2227 = "Như được tiếng nói của Fukami thôi thúc, Nagi đứng dậy.\\nLần đầu tiên, tôi thấy hai đứa đứng cạnh nhau trên thuyền."
2231 = "Dù nghĩ thế nào thì đó cũng là chuyện vui vẻ và hạnh phúc.\\nNhưng——chính vì thế mà tôi không thể trả lời ngay được."
2237 = "Có lẽ, cơ thể tôi đã sợ hãi.\\nTrước âm thanh và mùi vị của sắt bị đập và nung nóng ở khoảng cách quá gần."
2239 = "Tôi định làm giống y hệt, nhưng âm thanh lại khác."
2240 = "Nhận ra lời nói của mình có thể bị hiểu theo nhiều cách,\\ntôi vội vàng, cẩn thận giải thích thêm."
2243 = "Muốn nghe chuyện quá.\\nNghĩ vậy, tai tôi cũng tự nhiên ghé sát vào tai Nagi——"
2245 = "Tôi ôm chầm lấy Fukami và Nagi đang lao tới.\\nTâm ý, có lẽ đã tương thông rồi."
2247 = "Lẽ ra tôi cũng có thể trải qua thời kỳ đó như vậy,\\nnhưng tôi lại chỉ sống vật vờ cho qua ngày đoạn tháng."
2249 = "Tôi nhìn vào mắt Fukami, rồi nhìn sang mắt Nagi."
2250 = "Tấm thép của tôi cũng bị đập liên tục,\\nngày càng mỏng và rộng ra."
2253 = "Tôi bị cuốn hút bởi ánh mắt Fukami đang nhìn mình.\\nSự quyết tâm mãnh liệt——khiến Fukami trông trưởng thành hơn hẳn."
2258 = "Tôi mở sổ tay ra.\\nNhưng——không hề ghi rõ như vậy."
2259 = "Tôi mở sổ tay ra xác nhận lại.\\nThì, ba chữ quá đỗi quen thuộc đập vào mắt."
2261 = "Cắm phần chuôi nhô ra ở phía ngược lại của lưỡi dao vào cán——"
2265 = "Đầu ngón tay di chuyển tấm thép cũng đều đặn và mượt mà——"
2267 = "Dù là được làm gì đi nữa,\\nnhìn thấy nụ cười này, tôi cũng thấy có chút mong chờ."
2269 = "Cởi bỏ sự nương tựa, cởi bỏ gông xiềng——\\nTôi không muốn, cũng không dám muốn. Làm vậy, thật đáng sợ."
2274 = "Động tác thả lỏng của Fukami nhịp nhàng đến mức,\\nông Minokasa phải lẩm bẩm khen ngợi."
2275 = "Nhưng nếu để họ nhận ra thì sẽ khiến họ bận tâm.\\nDù không quen, nhưng tôi cũng thử nói dối một câu xem sao."
2278 = "Nếu ông Minokasa đã nói vậy,\\nthì từ giờ trở đi chắc có thể gỡ gạc lại bằng độ sắc bén."
2279 = "Thuận theo câu hỏi, tôi kể về quá khứ của mình."
2292 = "Hibiki, chị Mayami, và cả Hachiroku.\\nCả 3 người——đều nhìn tôi với vẻ mặt nghiêm túc."
2294 = "Hibiki đưa ly ra."
2296 = "Hibiki hăng hái như thể đang ganh đua,\\nliếc nhìn hai người kia, Hachiroku mỉm cười tao nhã."
2297 = "Giọng nói lớn của Hibiki như đánh thẳng vào sống lưng tôi.\\nRa vậy, Hibiki còn hiểu tôi hơn cả chính tôi nữa."
2300 = "Hibiki cũng đặt ly của mình xuống,\\nthẳng lưng ngồi ngay ngắn lại."
2303 = "Bước hoàn thiện cuối cùng, quả nhiên vẫn là do tay ông Minokasa."
2305 = "Dù có bạn bè hay không,\\ntôi vốn nghĩ cũng chẳng khác biệt gì lớn——"
2307 = "Tôi chỉ định đùa thôi, thế mà Nagi lại đáp lại với vẻ mặt nghiêm túc."
2309 = "Chắc là vì thích và muốn có,\\nnên em ấy mới cố tạo hình cho con dao giống kiếm thật chăng."
2313 = "Chính vì cảm giác tội lỗi này, mà hôm nay tôi——chính tôi——\\nmới cảm thấy gượng gạo với chị Mayami và Hibiki."
2321 = "Gió sông thổi khô mồ hôi,\\nthứ tôi cảm nhận được, đúng hơn là một sự mệt mỏi dễ chịu."
2324 = "Mỗi người một giọng, như thể mất hết sức lực, lại như thể đã hiểu ra."
2326 = "Ủ thép xong, lần này sẽ mài bằng máy chà nhám vòng,\\ntạo đường vát phân ranh giới giữa thân dao và lưỡi dao——"
2329 = "Cả Fukami và Nagi đều lộ rõ\\nvẻ háo hức trên khuôn mặt."
2330 = "Dao của Fukami và tôi cũng vậy,\\nquả nhiên là sắc bén tuyệt vời."
2333 = "Hai vai Fukami chùng xuống,\\nchân ga cũng được đạp một cách tự nhiên."
2335 = "Fukami từ tốn ngồi xuống trước máy,\\nkhông thể không nhận ra sự khác biệt lớn về tư thế so với Nagi."
2337 = "Gật đầu cái rụp."
2339 = "Khuôn mặt Fukami giãn ra nhẹ nhõm.\\nNagi cũng lộ vẻ hài lòng, liên tục gật gù."
2341 = "Fukami với vẻ mặt hơi ngạc nhiên,\\ncòn Nagi thì nở nụ cười bẽn lẽn."
2343 = "Fukami nhắm chặt mắt, cúi gầm mặt.\\nRồi từ từ ngẩng mặt lên, mở mắt ra."
2345 = "Vừa lật giở những trang sổ tay được ghi chép cẩn thận,\\nFukami lại lộ vẻ bối rối."
2347 = "Fukami đã nói giảm nói tránh đi, nhưng...\\nTôi chợt nhận ra, kể từ vụ tai nạn đó, quả thực tôi đã thay đổi."
2350 = "Ấm áp, mềm mại.\\nBên phải và bên trái. Nagi và Fukami."
2352 = "Nó bị cắt làm đôi một cách ngọt lịm,\\nlàm sao có thể kìm nén được tiếng thốt lên kinh ngạc chứ."
2354 = "Rồi em ấy đột nhiên tiến lại gần,\\nkéo tay tôi thật mạnh."
2355 = "Nhưng, bây giờ tôi có thể tự đứng vững. Có thể tự bước đi bằng ý chí của mình.\\nVì Nagi và Fukami, chắc chắn đã trao cho tôi hy vọng."
2358 = "Nhưng chắc chắn, thế là chưa đủ.\\nNếu không nói ra thành lời, thì lúc nào cũng là chưa đủ."
2362 = "Không phải cháu gái, mà là một vị khách——\\nÔng Minokasa vẫn tiếp tục đối xử với Nagi như vậy."
2364 = "Tôi cảm giác sự thấu hiểu đang bắt đầu nảy mầm."
2365 = "Dù sao thì em ấy đang là học sinh đi dã ngoại mà.\\nNói \"Cháu về rồi đây\" rồi bước vào thì cũng kỳ."
2367 = "Chắc là không nắm được nhịp độ,\\nNagi liên tục nghiêng đầu, có vẻ đang chật vật lắm."
2368 = "Tôi cứ nghĩ là để cắt thử,\\nnhưng tiếc là không thấy thớt đâu."
2372 = "Nhìn Nagi và Fukami làm,\\ntôi có cảm giác phần nào nắm được bí quyết rồi."
2373 = "Đúng là cái tên nhìn phát biết ngay."
2379 = "Thì thầm \"Đáng yêu quá nhỉ\",\\nchị Mayami nhìn chằm chằm tôi qua chiếc ly rỗng."
2381 = "Chị Mayami vẫn với khuôn mặt tươi cười như mọi khi,\\ntừ tốn hỏi tôi."
2382 = "Chị ấy nói một cách cực kỳ thản nhiên."
2385 = "Lời nói của tôi, bị chị Mayami dịu dàng chặn lại."
2388 = "Ánh mắt rơm rớm đầy bất an, không hề bình tĩnh.\\nNhưng lại vô cùng ấm áp."
2394 = "Đúng là tôi ăn nhiều hơn bình thường.\\nNhưng cũng không đến mức no căng bụng."
2396 = "Khi đã ra hình, ông Minokasa sẽ nhận lấy,\\ncho từng con một vào lò lửa nung để ủ thép."
2398 = "Khi Nagi đi tay không gửi hộp dao cho Fukami đang mang túi xách,\\nông Minokasa định nói gì đó, rồi lập tức lắc đầu nguầy nguậy."
2406 = "Chỉ với một lời đáp lại, biểu cảm của Nagi và Fukami dao động dữ dội."
2407 = "Cuối cùng, tôi cũng đã tự nhận thức được."
2410 = "Tiếp tục, ý em là——"
2415 = "Việc làm như vậy sau khi kết thúc công việc phụ giúp chèo thuyền xuôi dòng,\\ngần đây đã hoàn toàn trở thành thói quen hàng ngày."
2417 = "Đi đâu cũng được——\\nKhoảnh khắc nghĩ vậy, tôi chợt nhận ra."
2419 = "Tấm thép bên dưới đó——\\nRa là vậy, đang dần mỏng ra thấy rõ."
2421 = "Nghe những lời của Nagi và Fukami, tôi cảm thấy vô cùng nhẹ nhõm."
2426 = "Đổi lại, lần này lại kêu keng——keng——,\\nvới nhịp độ chậm rì như tiếng chuông đêm giao thừa."
2427 = "Khoảng thời gian mà Nagi và Fukami đang trải qua,\\nlấp lánh rực rỡ và tràn ngập niềm vui được sống."
2428 = "Khác hẳn với dáng vẻ như con trai thường ngày...\\nEm ấy đang cho thấy sự mong manh của một thiếu nữ, ẩn giấu sau vẻ hoạt bát đó."
2432 = "Nếu không bị trói buộc bởi nghĩa vụ, tôi đã mục nát từ lâu rồi.\\nViệc hoàn thành nghĩa vụ đã giúp tôi sống hướng về phía trước."
2443 = "Chúng tôi được ông bỏ dao vào hộp, rồi gói lại đàng hoàng."
2445 = "Ông Minokasa ngồi trước máy, đạp chân ga,\\nâm thanh rầm rầm vang lên, búa đập hoạt động như pít-tông."
2446 = "Ông Minokasa mang ra 3 quả cà chua."
2448 = "Ông Minokasa đưa cho ba người chúng tôi mỗi người một tấm thép\\ncó hình dáng đại khái giống con dao như nét vẽ của trẻ con."
2451 = "Vừa giúp Nagi một tay, ông Minokasa vừa nở nụ cười khổ\\nnhư thể muốn nói \"Đúng là vậy đó\"."
2461 = "Số lượng câu hỏi quá nhiều, thời gian lại dài,\\nviệc hỏi và đáp đã trở thành một nửa thói quen rồi——"
2463 = "Bên trong ghi chi tiết lịch trình,\\nvà những lưu ý khi đi du lịch."
2467 = "Lý do tôi bắt đầu trả lời là vì hai đứa nài nỉ:\\n『Muốn biết để làm điều đó』."
2468 = "Nếu coi là bạn cùng lớp,\\nthì tôi có hơi già quá rồi."
2469 = "Số lượng bạn bè——nói cách khác,\\ncó lẽ là biểu hiện của việc muốn chủ động giao tiếp với mọi người."
2489 = "Việc tìm hiểu về Ohito,\\nchắc chắn sẽ có ích cho việc rút lại lời mời gọi xây dựng nhà máy."
2490 = "Nói xong——\\nTôi chợt nhận ra, có lẽ là vì thế."
2491 = "Nói rồi, Fukami cười khúc khích."
2500 = "Tôi cứ tưởng là do ánh chiều tà phản chiếu——\\nnhưng ngay cả mặt Nagi cũng hơi ửng đỏ."
2504 = "Cách đạp chân ga cũng hoàn toàn khác.\\nThận trọng... hay nói đúng hơn là đang ở chế độ căng thẳng."
2515 = "Cái này... nhìn và làm khác hẳn nhau.\\nThực sự là khó đấy."
2516 = "Cái này nhìn cũng thú vị phết.\\nHơn nữa——"
2517 = "Đó là sự thật——\\nVà tôi biết ơn vì điều đó."
2518 = "Có lẽ so với Nagi hay Fukami,\\ncông đoạn này tôi làm tốt hơn hẳn."
2519 = "Cái máy lần này là đá mài nước xoay.\\nMột viên đá mài tròn cực lớn, vừa ngâm trong nước vừa xoay."
2520 = "Lần này cơ thể chuyển động trơn tru.\\nNếu đã trơn tru, thì quả nhiên kinh nghiệm sống cũng được thể hiện."
2521 = "Trên \\x%l客車;#00ffc040;toa hành khách%l;#; BBQ do \\x%l8620;#00ffc040;8620%l;#; kéo, có Hachiroku,\\nPaulette làm \\x%l機関士;#00ffc040;lái tàu%l;#; và Hibiki làm phụ lái."
2523 = "Vẫn cười, em ghé sát miệng vào tai Nagi——"
2525 = "Tôi cũng sẽ bắt chước, ở Migitai, với tư cách là một học sinh đi dã ngoại,\\ntôi sẽ khiêm tốn học hỏi."
2527 = "Trong phòng khách, vỏ chai rượu."
2530 = "Để búa đập xuống một cách thoải mái,\\nđập liên tục——cuối cùng, Nagi cũng nhả chân ga."
2532 = "Chưa biết có vui hay không,\\nnhưng cơ hội hiếm có thế này, tôi cũng nên đón nhận một cách tích cực."
2533 = "Mặc dù sau khi kết thúc lịch trình trải nghiệm chèo thuyền trên sông Kuma,\\ncũng không hề ghi rõ là \"Giải tán\"."
2537 = "Tóm lại là không dùng sức đạp chân ga, giữ nguyên một mức độ——"
2538 = "Động cơ làm quay bánh răng có gắn dây đai,\\nchuyển động đó liên kết với búa đập, cơ chế có vẻ là vậy."
2549 = "（Mình... ngay từ đầu,\\nchỉ cần muốn, là có thể đi bất cứ đâu mà）"
2550 = "（Cộc cộc cộc cộc）"
2551 = "（Keng! Keng! Keng! Keng!）"
2552 = "（Phập! Phập!）"
2553 = "（Phập!）"
2555 = "（Vì chuyện không ngờ tới mà cơ thể lại khựng lại mất rồi）"
2557 = "（Giao cho tôi nghĩa vụ, không phải là để trói buộc.\\nMà vì nếu không làm vậy, tôi sẽ sụp đổ mất）"
2561 = "（Keng! Keng! Keng! Keng!）"
2562 = "（Keng! Keng! Keng!）"

