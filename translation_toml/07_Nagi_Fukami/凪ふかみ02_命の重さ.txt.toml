1571 = "「Nhắc đến tuổi thọ, thì nhà xưởng ủ rượu của anh hai\\ncòn lâu đời hơn nhiều á?」"
1573 = "「Bố em gầy nhom á.\\nChắc chắn là không nâng nổi búa rèn đâu.」"
1574 = "「Cảm ơn nha~」"
1575 = "「Cảm ơn em,\\nđi đường cẩn thận nhé.」"
1590 = "「Thế này... mệt quá á.」"
1591 = "「Thế, này——là được rồi á!」"
1592 = "「Đành chịu thôi. Vết bẩn từ than đá chưa kịp rửa sạch,\\nlại còn dính thêm cả bụi bẩn dưới sông nữa mà.」"
1593 = "「Cái đó thì em thấy rồi á. Ngay khi kéo \\x%l手ブレーキ;#00ffc040;phanh tay%l;#; xong,\\nchị ấy đã đổi sang cơ thể lớn hơn rồi.」"
1595 = "「Em nói gì vậy. Việc không có xe,\\nchẳng phải là do ông Seki và mọi người hôm nay cũng đang làm nhiệm vụ \\x%l保線;#00ffc040;bảo trì đường ray%l;#; sao.」"
1597 = "「Đó là vết tích của việc cấy ghép da.\\nTrong quá khứ, anh từng bị thương.」"
1598 = "「Cả chuyên gia cũng vậy sao.」"
1605 = "「Vậy thì, đi thôi á!」"
1607 = "「Vậy thì, tớ lấy bên trái á!」"
1609 = "「Vậy thì, đi thôi.」"
1610 = "「Vậy thì, Fukami sẽ điều hướng thuyền đến chỗ con lăn dưới sông.\\nNagi di chuyển con lăn, còn anh sẽ từ từ kéo thuyền lên.」"
1613 = "「Nếu vậy thì,\\ntrước khi lên thuyền, em sẽ phải lội xuống sông đúng không?」"
1615 = "「Vậy thì, những chiếc thuyền bên này,\\nba chúng ta phải sơ tán chúng thôi nhỉ?」"
1616 = "「Vậy thì... ừm... em kỳ cọ nhé?」"
1618 = "「Vậy thì, em đi đây!」"
1619 = "「Vậy?\\nSao anh hai lại là người thu vé thế?」"
1621 = "「Nhờ anh hành động ngay lập tức không chút do dự,\\nnên em mới được cứu sống ạ.」"
1622 = "「Cửa hàng Đường sắt có chuyện gì sao?」"
1627 = "「Anh Soutetsu... à ừm, muốn vậy hơn, đúng không, ạ?\\nHai đứa, hòa thuận——cùng nhau, á.」"
1628 = "「Anh Soutetsu... lại từng trải qua chuyện như vậy——」"
1629 = "「Anh Soutetsu, chúng ta tiếp tục được chứ ạ?」"
1630 = "「Ngài Soutetsu.」"
1631 = "「Không lẽ, Nagi đã từng bị rồi sao?」"
1633 = "「Bằng sức người á, làm được chuyện đó sao?」"
1635 = "「!」"
1636 = "「!!」"
1637 = "「!?」"
1641 = "「6 cái... không, 5 cái là đủ rồi.\\nDùng 4 cái——một cái để dự phòng.」"
1644 = "「~~~~!!」"
1653 = "『「Hành động tự sát đấy ạ.」\\n「Như thế là không được đâu á.」』"
1655 = "『「Anh Soutetsu」\\n「Anh hai」』"
1657 = "『「!」\\n「!」』"
1803 = "Từng bậc, từng bậc một. Cẩn thận bước lên cầu thang."
1810 = "Không biết do nước nóng, do mệt mỏi,\\nhay là những bọt xà phòng kỳ lưng đồng thời cũng gột rửa đi thứ gì đó."
1811 = "Không hiểu sao em ấy lại rơm rớm nước mắt,\\nliếc nhìn về phía tôi."
1813 = "Có lẽ do adrenaline đang tiết ra,\\ncảm giác mệt mỏi dữ dội lúc nãy giờ gần như biến mất."
1815 = "Không biết có chuyện gì mà vui đến thế,\\nFukami và Nagi nắm tay nhau, nở nụ cười rạng rỡ trên khuôn mặt."
1816 = "Dù có nói gì hay dỗ dành thế nào cũng không thể làm dịu chúng được.\\nCách duy nhất để xoa dịu là đi dạo, chơi đùa hoặc đáp ứng yêu cầu của chúng."
1819 = "Thực ra, bên trong bến thuyền này cũng nồng nặc \"mùi nước\"."
1823 = "Những người từng kỳ lưng cho tôi chỉ có Hibiki hoặc Hachiroku,\\nnhững người biết rõ sự tình, nên tôi đã sơ ý."
1829 = "Năm giây, mười giây, mười lăm giây——"
1832 = "Gì đây.\\nĐứa trẻ của gia đình vừa xuống tàu..."
1838 = "Đang mỉm cười nhìn về phía này, thậm chí còn vẫy tay chào tạm biệt.\\nDù không hợp với tính cách của mình lắm, nhưng cũng không thể không vẫy tay chào lại được."
1839 = "Có lẽ em ấy đã chuẩn bị sẵn từ trước, một kế hoạch rất rõ ràng.\\nNhưng——"
1841 = "Sợi dây an toàn căng cứng,\\ngiằng co dữ dội với một tải trọng khủng khiếp, không thể so sánh với trọng lượng của chiếc thuyền!"
1850 = "Hai người lại còn phối hợp ăn ý,\\nnhịp độ di chuyển khăn tắm hoàn toàn giống hệt nhau——"
1858 = "Nếu xét về phản xạ hay khả năng giữ thăng bằng,\\nNagi chắc chắn vượt trội hơn tôi rất nhiều."
1860 = "Giọng của hai người hòa vào nhau.\\nHiếm khi, Fukami lại là người nói tiếp."
1861 = "Cả hai bỗng nhiên im bặt.\\nIm lặng và nhìn chằm chằm vào nhau."
1863 = "Ánh mắt của Hachiroku hướng về phía Nagi.\\nCô ấy hơi nghiêng đầu, một cử chỉ thay cho câu hỏi dành cho tôi."
1889 = "Nagi nhanh chóng thao tác điện thoại, áp lên tai."
1892 = "Nagi và Fukami lần lượt di chuyển các con lăn,\\nđưa chiếc thuyền leo lên dốc."
1893 = "Hiếm khi thấy Nagi đang nói dở lại ngập ngừng ngậm miệng lại."
1896 = "Những ngón tay mềm mại của Nagi mơn trớn dọc theo vết sẹo của tôi."
1897 = "Lời nói của Nagi\\ngợi lại cảm giác khó hiểu mà tôi vừa cảm thấy lúc nãy."
1899 = "Vừa nghe xong, Nagi liền tỏ vẻ ngạc nhiên."
1900 = "Nagi dùng sức mạnh mẽ,\\nmúc một chậu nước nóng dội thẳng từ đỉnh đầu mình xuống."
1902 = "Nagi mang một vẻ mặt đắc ý hệt như trong tranh."
1911 = "Đừng nói là nền bê tông của bến thuyền,\\nngay cả đỉnh cọc buộc dây thừng đuôi thuyền cũng như sắp bị dòng nước nuốt chửng."
1913 = "Trong lúc ngồi trên tàu, với khói thịt nướng, tiếng xèo xèo và tiếng cười nói,\\ncó lẽ họ đã không để ý đến thời tiết bên ngoài."
1914 = "Mới vừa nãy thôi nó còn quật vào chúng tôi dữ dội đến thế,\\nvậy mà bây giờ, nó lại ôm ấp và xoa dịu chúng tôi một cách ấm áp——"
1929 = "Chỉ cần Fukami đưa thuyền tới gần,\\ntôi kéo dây thừng đuôi thuyền lên là xong."
1931 = "Trong lúc trạng thái này vẫn còn duy trì, chúng tôi phải hoàn thành xong công việc——\\nMọi người đều hiểu rõ điều đó."
1937 = "Ép sát vào nhau, mưa gió hắt vào tôi cũng dịu đi phần nào.\\nHoặc cũng có thể chính mặt đất đang che chắn gió cho chúng tôi."
1939 = "À, ra là vậy——\\nTôi không nhận thức được điều đó lắm, nhưng..."
1940 = "Việc dùng sức khi đang đứng dưới sông\\nnguy hiểm và khó khăn đến mức nào——Fukami bình tĩnh giải thích cặn kẽ."
1943 = "Trong dòng nước đục ngầu cuồn cuộn đôi khi lẫn cả dị vật,\\nFukami tiến lại gần chiếc thuyền đang tròng trành như chiếc lá ở đầu dây thừng."
1947 = "Giữa dòng nước đục ngầu cuồn cuộn này, cứ giữ nguyên lực kéo,\\nchiếc thuyền đang tiến lại gần phía chúng tôi."
1948 = "Trong lúc làm nhiệm vụ trên \\x%l列車;#00ffc040;chuyến tàu%l;#; BBQ thì không nói làm gì,\\nnhưng ngay cả trong lúc huấn luyện, tôi cũng chưa từng trải qua thời tiết khắc nghiệt đến thế này."
1951 = "Thời tiết xấu thế này, quả nhiên ai cũng muốn\\nnhanh chóng trở về nơi an toàn trong nhà."
1953 = "Khuôn mặt rạng rỡ.\\nNhắc mới nhớ, tôi chưa từng nghe Nagi kể về bố mẹ mình."
1956 = "Hai người mỗi người cầm một miếng bọt biển,\\nhòa thuận tạo bọt xà phòng."
1957 = "Chiếc thuyền đã nằm gọn lên trên con lăn."
1959 = "Con bé có vẻ đang chật vật tìm từ ngữ,\\nkhiến tôi cũng phải sốt ruột theo."
1961 = "Rũ bỏ sự nhẹ nhàng thường ngày, đặt an toàn lên hàng đầu,\\nFukami áp sát toàn bộ cơ thể vào mạn thuyền."
1963 = "Được hướng dẫn và luyện tập các ký hiệu tay,\\ntôi trang bị ủng cao cổ, áo phao và quần áo đi mưa."
1964 = "Con bé bám lấy dây an toàn chỉ chậm hơn tôi vài giây,\\nvà cùng tôi kéo lên."
1967 = "Thấy em ấy cúi đầu thật sâu, tôi cũng cảm thấy có chút khách sáo,\\nvà hơi sốt ruột."
1969 = "Đứng trên thuyền còn vững vàng hơn cả trên bờ."
1970 = "Nói xong. Fukami từ từ\\nkéo ra một sợi dây thừng trông rất chắc chắn."
1974 = "Nó đã được cố định chắc chắn vào eo Fukami và tay vịn trên cầu thang.\\nDù vậy, đó vẫn không phải là một cảnh tượng khiến người ta an tâm."
1983 = "Thực tế, tình huống lúc đó cực kỳ nguy hiểm.\\nVì vậy, có lẽ đó là điều bất đắc dĩ——"
1985 = "Dù là người dày dặn kinh nghiệm hay có thể lực, thần kinh vận động xuất sắc,\\ntrong lúc làm việc đó, ai cũng có lúc bị ngã và cuốn trôi——"
1987 = "Dù có bậc thang bê tông làm chỗ đứng,\\nchỉ riêng mưa gió thôi cũng đủ làm tôi mất thăng bằng."
1989 = "Ngay cả khi mở miệng ra, những hạt mưa cũng lập tức bay tọt vào."
1997 = "Mặt sông bình thường, dù tính đến bệ đứng của bến thuyền,\\ncũng thấp hơn cả chiều cao của một chiếc thuyền."
2000 = "Những hành khách bước ra từ \\x%l客車;#00ffc040;toa hành khách%l;#;, ai nấy đều\\nkhựng lại một giây trước màn mưa, khuôn mặt lộ rõ vẻ sửng sốt."
2002 = "Nagi bước xuống từ buồng lái,\\nnhìn vào trong \\x%l客車;#00ffc040;toa hành khách%l;#; rồi hỏi tôi."
2021 = "Giao việc đáp lại đứa bé cho Nagi,\\ntôi hạ tay xuống, tiếp tục công việc soát vé."
2023 = "Tôi đành phải gật đầu."
2025 = "Tôi cũng bắt chước nhìn lại để xác nhận,\\nvà đưa ra câu trả lời hiển nhiên."
2028 = "Đặt rất nhiều đá lên một bậc thang\\nđể tạo thành một con đập đơn giản, rồi đặt con lăn vào bên trong đó."
2029 = "Móc thêm một sợi dây thừng vào dây thừng đuôi thuyền của chiếc thuyền Fukami đang ngồi,\\nrồi cố định nó vào phần cao nhất của tay vịn cầu thang."
2031 = "Chỉ cần tôi hướng ánh mắt sang,\\nHachiroku lập tức trả lời."
2033 = "Tôi chạm mắt với Nagi."
2035 = "Ngoảnh lại thì thấy con bé đang thò mặt ra khỏi cửa sổ buồng lái,\\nvẫy tay thật lớn."
2037 = "Tôi muốn lội xuống sông để bảo vệ cơ thể Fukami càng sớm càng tốt.\\nNhưng nếu làm vậy, tôi cũng sẽ bị cuốn trôi theo mất."
2039 = "Tôi vội vàng đỡ lấy cơ thể con bé, cất giọng ngay sát bên tai."
2041 = "Sức nặng của Fukami. Sức nặng của sinh mệnh——\\nTôi sẽ không buông khỏi đôi tay này."
2042 = "Tôi luồn dây thừng qua nách rồi quấn quanh eo,\\nquay người 180 độ, vừa quan sát Nagi và Fukami vừa kéo thuyền."
2043 = "Tôi vắt dây thừng lên vai,\\nquay lưng lại với chiếc thuyền và dòng sông, chầm chậm bước đi."
2047 = "Tôi chợt lo lắng cho Hibiki,\\ncon bé không may lại đến trường tham gia khóa học mỹ thuật đặc biệt vào lúc này."
2049 = "Lội xuống dòng nước xiết để đẩy thuyền lên——\\nGiờ tôi mới nhận ra đề xuất vừa rồi của mình thật là viển vông."
2051 = "Tôi che chở phía trên Nagi đang thu mình lại,\\ndùng cơ thể mình làm tấm khiên chắn mưa chắn gió cho con bé."
2053 = "Tôi vẽ một hình đơn giản để giải thích,\\nđôi mắt Nagi liền sáng rực lên."
2055 = "Giọng của Nagi đột ngột vang lên bên tai."
2057 = "Mở đôi mắt vừa nhắm lại theo phản xạ ra, sông Kuma hiện ra trước mắt.\\nMực nước đã dâng lên rất cao và đang cuồn cuộn đổ tới."
2059 = "Tôi lập tức lao tới sợi dây an toàn!\\nDùng toàn bộ cơ thể đè lên——"
2060 = "Tôi ngửi thấy mùi như khét lẹt.\\nLực kéo xuống dòng sông dường như muốn lôi cả tôi theo."
2062 = "Nếu tôi lội xuống sông, trượt chân và bị cuốn trôi,\\nchắc chắn tôi sẽ hoảng loạn."
2063 = "Nếu ở cùng Nagi và Fukami,\\ntôi cảm thấy mình có thể làm được điều đó."
2065 = "Chưa kịp dứt lời, Nagi đã nắm chặt tay tôi kéo đi."
2069 = "Quả thực tôi hoàn toàn không hiểu tâm lý phụ nữ,\\nvà Cửa hàng Đường sắt cũng chẳng khác gì nhà của Paulette cả."
2070 = "Một cách bình tĩnh đến kinh ngạc,\\ntôi đã kể cho hai người họ nghe về quá khứ, về vụ tai nạn đó."
2072 = "Cũng mang ý nghĩa xốc lại tinh thần,\\ntôi vắt nước trong găng tay ra, rồi duỗi căng các ngón tay."
2074 = "Ngẩng mặt lên, tôi chợt nhận ra.\\nĐã một lúc lâu rồi không nghe thấy tiếng ai cả."
2078 = "Vậy nên tôi mới cất công đội mưa\\nđến tận nhà tắm Tororyu-yu này."
2081 = "Vì vậy, tôi tự nhủ với bản thân hết lần này đến lần khác,\\nkhắc sâu vào tâm trí một điều duy nhất là không được buông bỏ sức nặng đang nằm trong tay."
2083 = "Kịch, một lực cản mãnh liệt truyền đến.\\nVì là cầu thang nên rất khó để kéo lùi lại."
2085 = "Nagi đang ôm mấy khúc gỗ tròn nhỏ dùng làm con lăn\\nbị cơn gió giật mạnh làm lảo đảo."
2091 = "Sau khi chuẩn bị xong con lăn,\\nNagi bật đèn pin lên, vẽ thành một vòng tròn thật lớn."
2092 = "Nếu đã quên, thì tôi muốn nhớ lại.\\nTôi thành thật nghĩ vậy."
2095 = "Việc nước dâng đến tận cầu thang cũng có nghĩa là,\\nvẫn có chỗ để bám trụ."
2099 = "Người được động vật yêu mến là Hibiki và Reina,\\nnhưng không hiểu sao Nagi lại thu hút được sự yêu thích tuyệt đối từ những đứa trẻ nhỏ."
2101 = "Đáng lẽ càng quen thì công việc sẽ càng nhẹ nhàng,\\nnhưng cứ kéo xong một chiếc, rồi lại một chiếc, cơ thể tôi càng trở nên nặng nề và chậm chạp."
2102 = "Có lẽ do phải chịu tải trọng quá lớn nên nó đã bị giãn ra chăng.\\nCảm giác lỏng lẻo khiến tôi không thể truyền lực một cách tốt nhất."
2104 = "Em ấy hoàn toàn kiệt sức,\\nhay là, đã ngất đi rồi——"
2107 = "Là gỗ trôi dạt sao!?\\nMột vật thể màu đen nào đó"
2112 = "Gió giật mạnh làm tôi nghẹt thở trong giây lát.\\nDù đứng yên không nhúc nhích, cơ thể cũng có cảm giác như sắp bị thổi bay."
2115 = "Vừa lúc Nagi cúp máy.\\nNgay khi cúp máy, con bé liền hối hả tiến về phía tôi."
2117 = "Mỗi khi gió gầm rú,\\ncơ thể Fukami lại chao đảo."
2123 = "Mùi nước sông xộc lên, len lỏi vào tận trong căn phòng đóng kín cửa\\ntừ một nơi nào đó và phảng phất trong không khí."
2132 = "Nói xong, Fukami vội vàng dùng hai tay bịt miệng lại.\\nTrong khi vẫn bịt miệng, em ấy lúng búng hỏi tôi một cách vô cùng rụt rè."
2134 = "Chỉ với một mái chèo cong vút như cây cung,\\nFukami đã khéo léo hòa nhịp với dòng nước sông cuồn cuộn."
2136 = "Cả Fukami và Nagi đều đang để đôi mắt sáng lấp lánh như đang mơ mộng."
2138 = "Fukami lập tức nhảy khỏi thuyền, cúi người xuống,\\nvà vào vị trí đối diện với Nagi đang đưa con lăn ra."
2140 = "Lời nói hốt hoảng của Fukami\\nlại càng làm cho câu hỏi của Nagi trở nên sắc bén hơn."
2142 = "Fukami đặt tay lên mái chèo,\\ndùng bàn tay còn lại ra hiệu cho chúng tôi."
2144 = "Phía sau hướng Fukami chỉ tay,\\ncó xếp chồng mấy khúc gỗ tròn nhỏ."
2146 = "Fukami cúi đầu thật sâu với vẻ mặt đầy áy náy.\\nĐúng như Hachiroku đã nói, trận cuồng phong bão táp này áo mưa cũng chẳng ích gì."
2149 = "Giọng nói của Fukami mạnh mẽ hơn bao giờ hết.\\nSự rụt rè thường ngày bao quanh em ấy đã biến mất."
2151 = "Mặt Fukami bỗng chốc đỏ bừng."
2152 = "Fukami đẩy thuyền né tránh, nhưng phản lực đã làm em ấy mất thăng bằng——"
2153 = "Nói rồi, gật đầu——\\nNhưng Fukami lại bối rối dừng lại ở đó."
2156 = "Fukami gật đầu, còn Nagi thì lắc đầu quầy quậy.\\nĐáng lẽ ra là bạn cùng khóa, nhưng nếu không biết thì cũng đành chịu."
2165 = "Số lượng con lăn càng nhiều, gánh nặng khi kéo lên của tôi càng giảm.\\nNhưng, số lần Nagi phải di chuyển con lăn sẽ tăng lên, kéo theo đó là gánh nặng và sự nguy hiểm cho con bé."
2168 = "Trận cuồng phong bão táp dữ dội lấn át cả tiếng \\x%lブラスト;#00ffc040;khí thải xi lanh%l;#; của \\x%l8620;#00ffc040;8620%l;#;,\\nđang trút xuống và gột rửa sân ga Ohimitera."
2170 = "Để đề phòng vạn nhất cũng không bị tuột mất,\\ntôi quấn dây an toàn quanh người mình, rồi bắt đầu kéo lại."
2175 = "Cứ thế, chúng tôi lại ôm con lăn tiến về phía cầu thang.\\nDù là lần thứ hai nhưng vẫn không quen chút nào, những hạt mưa đập vào người đau điếng."
2176 = "Rồi từng chút, từng chút một——\\nDồn toàn bộ sức lực, không ngừng kéo sợi dây thừng lại."
2178 = "Đi hết đoạn dốc,\\ncố định chiếc thuyền trên mặt đất bằng phẳng."
2181 = "Không chỉ Fukami mà cả Nagi,\\ndường như cũng đang say sưa với việc thoát khỏi cơn nguy kịch."
2186 = "Bị kéo ống tay áo, tôi quay lại\\nthì thấy Hachiroku đang ướt sũng như chuột lột."
2190 = "Nhìn thấy cảnh tượng đó,\\nmột góc nào đó trong tim tôi lại dấy lên cảm giác ngưỡng mộ."
2192 = "Nhìn những gợn sóng rơi xuống bồn tắm,\\ntôi cảm thấy nước thật là một thứ kỳ diệu."
2194 = "Khiến tôi thoáng chốc cảm thấy\\nngưỡng mộ."
2204 = "Quả thực Hibiki cũng là người không muốn cho người khác xem phòng mình.\\nBiết ý, nên tôi cũng không cố tình ghé thăm."
2205 = "Nếu phải làm việc ngoài trời mưa bão như thế,\\nđúng là nếu không bàn bạc trước thì chỉ có nước lúng túng chạy ngược chạy xuôi thôi."
2206 = "Trong nháy mắt, lực cản đột ngột giảm đi."
2209 = "Lời phủ quyết tức thì.\\nKhông chỉ từ Fukami, mà cả Nagi nữa."
2212 = "Fukami đang đứng sát mép nước nhìn thấy vậy,\\ncẩn thận bước từng bước xuống dòng sông."
2217 = "Vậy là xong một chiếc.\\nCòn lại năm chiếc."
2223 = "Lối đi từ bệ đứng đến cầu thang cũng có độ dốc,\\nnên mặt nước... có lẽ đã dâng cao hơn hai mét rồi."
2224 = "Bên trong cũng đọng đầy mồ hôi và nước mưa, vô cùng bí bách,\\nchỉ cần sơ sẩy một chút là có thể tuột ra ngay."
2227 = "Và, nếu người trên bờ là Fukami và Nagi,\\nthì việc dùng dây an toàn kéo tôi lên cũng rất khó khăn."
2229 = "Lời nói của Fukami làm tôi nhận ra mình đã quá vội vàng.\\nTrận bão táp này dữ dội đến mức ngay cả trên sân ga có mái che cũng khó mà nói chuyện được."
2230 = "Nghe Nagi nói vậy, sự căng thẳng của Fukami cuối cùng cũng dịu đi."
2236 = "Bị hai cảm giác hoàn toàn khác biệt chà xát trên lưng,\\nkhiến tôi có một tâm trạng thật kỳ lạ——nhưng, quả thực rất dễ chịu."
2243 = "Mũi thuyền chạm vào bậc thang bê tông."
2247 = "Vừa được bố mẹ dắt tay, đứa bé cứ ba bước lại ngoái đầu nhìn lại một lần,\\nliên tục vẫy bàn tay còn trống với vẻ đầy lưu luyến."
2250 = "Bị dội nước nóng lên người,\\nlàn da trơn trượt bởi một cảm giác mượt mà."
2252 = "Nếu chỉ có cách lái thuyền thì đành giao cho Fukami, nhưng\\nvới điều kiện này, chỉ cần dùng tay đẩy thuyền là được."
2266 = "Nhắc mới nhớ, tôi vẫn chưa kể cho hai người này\\nnghe về quá khứ của mình nhỉ."
2272 = "Nhanh chóng, nhưng cẩn trọng.\\nKhông dùng lực quá mạnh, không để tay bị trượt."
2274 = "Lúc quay lại thì bị gió đẩy đi.\\nCơ thể như chực lao về phía trước khiến tôi bật ra một nụ cười kỳ lạ."
2283 = "Cảm giác này, thật là kỳ lạ."
2284 = "Nếu vậy, tôi có thể vừa quan sát tình hình vừa xử lý."
2285 = "Chiếc xe đã hoạt động vì chúng tôi rồi."
2286 = "Một Nagi như vậy mà lại bị cuốn trôi lộn nhào,\\nthật khó mà tưởng tượng được..."
2287 = "Ngay cả giọng nói của bản thân cũng khó mà nghe rõ."
2288 = "Ngay cả lời nói đó, nếu không cố gắng thì cũng không thể thốt ra được.\\nCơ thể tôi đã quá kiệt sức, ngay cả việc thở ra cũng thấy phiền. Nhưng——"
2289 = "Trên sân ga, bóng dáng gia đình nọ cũng đã khuất dạng.\\nKhung cảnh xếp hàng chụp ảnh kỷ niệm như mọi khi cũng hoàn toàn không thấy đâu."
2290 = "Navi quả nhiên cũng đã đi sơ tán.\\nCả tôi và Nagi chỉ di chuyển một chút thôi mà đã ướt sũng. Nhưng——"
2292 = "Tôi của ngày hôm đó, quá đỗi nhỏ bé và yếu ớt.\\nYếu ớt đến mức không thể nắm giữ cả mạng sống của Michiko và của chính mình."
2294 = "Vậy thì nên giới hạn ở mức sát nút——số lượng tối thiểu cần thiết."
2296 = "Nếu vậy thì Hibiki không sao rồi.\\nNghĩ lại, tôi tập trung vào việc soát vé."
2299 = "Nhờ công \\x%l保線;#00ffc040;bảo trì đường ray%l;#; của ông nội Fukami và những người anh em của ông, ông Seki và mọi người,\\nmà \\x%l8620;#00ffc040;8620%l;#; và \\x%lキハ07;#00ffc040;KiHa 07%l;#; hôm nay mới có thể vận hành được."
2306 = "Lời nói nghe có vẻ như đang trêu chọc,\\nnhưng khuôn mặt Nagi khi nhắc về bố lại rạng rỡ niềm vui."
2308 = "Tất cả đều đồng loạt im lặng,\\nchỉ chờ đợi khoảnh khắc công việc kết thúc——!?"
2313 = "Ô dù chắc chắn sẽ bị thổi lật ngược trong chớp mắt."
2314 = "Mưa tạt ngang đập thẳng vào người,\\nchuyển thành một cơn đau rõ rệt."
2321 = "Gió càng lúc càng mạnh,\\nđến mức cây cối ven đường ray nghiêng ngả không đứng thẳng lên được."
2346 = "（Nhưng——chỉ còn một chiếc nữa thôi.）"
2350 = "（Một người trong buồng lái, một người trong \\x%l客車;#00ffc040;toa hành khách%l;#;. Có lẽ đây là lần đầu tiên họ gặp nhau...\\nChà chà, được yêu thích đến mức này cơ à.）"
2352 = "（Ra là vậy, đứa bé đang vẫy tay với Nagi à.）"
2356 = "（Hự——Hự——Hự——）"
2357 = "（Hự）"
2359 = "（Xoạt——xoạt——xoạt——xoạt）"
2362 = "（Xoạt）"
2363 = "（Ừm. Cảm giác đỡ hơn nhiều rồi.）"
2365 = "（Cộc）"
2366 = "（Ào!）"
2367 = "（Rào）"
2368 = "（Xoạt!）"
2369 = "（Con bé bảo nếu tình hình tệ nhất sẽ ngủ lại ở khu ký túc xá của trường...\\nVới thời tiết này, làm vậy chắc sẽ an toàn hơn.）"
2371 = "（Dây an toàn... không sao chứ.）"
2374 = "（Sao thế này? Găng tay——đang bắt đầu trơn trượt sao.）"
2375 = "（Xoạt! Xoạt! Xoạt! Xoạt!）"
2378 = "（Hự——）"
2380 = "（Michi, ko——）"
2382 = "（Rầm!!!!!）"
2383 = "（Vùuuuu!）"
2388 = "（Thế này——Gì chứ, cũng dễ dàng mà.\\nTrí tuệ của người xưa thật đáng nể.）"
2389 = "（Thế này——thì）"
2390 = "（Mặc dù đã có dự báo bão đang đến gần——\\nNhưng không ngờ thời tiết lại xấu đi đột ngột đến mức này.）"

[selections]
