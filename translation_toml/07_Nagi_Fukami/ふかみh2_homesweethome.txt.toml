1457 = "Dồn sự phản kháng vào đầu ngón tay, em lại tiếp tục ấn mạnh lớp vải lún sâu vào háng."
1458 = "Tôi thay đổi chuyển động của eo, chuyển sang những cú đâm sâu như muốn khoét lấy, trao một nụ hôn chào buổi sáng cho cửa tử cung."
1459 = "Tôi trải tấm nệm đệm xuống chiếu Tatami như thể vứt nó ra, rồi đặt cơ thể Fukami nằm ngang lên trên."
1461 = "Thứ anh muốn chạm vào và thưởng thức, tất nhiên, chắc chắn là phần bên trong rồi——nhưng mà."
1463 = "Tôi rụt eo lại để chống lại lực mút mạnh mẽ đó, nhưng rồi lại ngoan ngoãn chiều theo, đẩy mạnh vào hết cỡ."
1465 = "Tôi đang kìm nén giọng nói của Fukami lại. Thế này thì, chỉ có mình tôi nghe thấy."
1466 = "Tôi nghĩ cố tình nói ra thì có vẻ hơi vô duyên—— nhưng nếu không nói rõ, sẽ càng làm sự hiểu lầm lan rộng thêm."
1468 = "Chuyện đó, tôi không ngờ Fukami lại bận tâm đến thế."
1471 = "Tôi chỉ mấp máy môi, gọi tên Fukami trong im lặng."
1473 = "Cú đâm mạnh mẽ theo quán tính khiến eo Fukami nảy hẳn lên."
1474 = "Khi tôi hỏi bằng ánh mắt, em ấy lập tức gật đầu đáp lại."
1476 = "Khi tôi dùng đầu khấc cọ xát vào những phần sần sùi. Cơ thể Fukami ngay lập tức bắt đầu ửng đỏ rõ rệt."
1479 = "Chắc là vô cùng bất mãn vì tôi đột nhiên dừng lại, lớp thịt âm đạo đó bắt đầu co bóp như muốn vắt kiệt tôi."
1480 = "Tôi đã nói ra những gì mình nghĩ, nhưng có vẻ lại làm em ấy bối rối hơn."
1482 = "Tôi đè lên người Fukami, ngã gục xuống."
1483 = "Vì vậy, dù có phải ép buộc, tôi cũng kìm nén giọng nói của em lại, và với tốc độ tối đa, tôi dập hông hết sức vào nơi sâu nhất!"
1485 = "Vì vậy tôi rút ra, và cứ thế giáng xuống một cơn mưa tinh dịch."
1487 = "Vì thế, tôi ấn mạnh lòng bàn tay mình, vào cái miệng nhỏ nhắn của Fukami, tạo thành một bức tường."
1489 = "Vì vậy tôi sẽ quay về đó với tốc độ tối đa. Cùng với Fukami và Nagi, và tôi. Về nơi ba người chúng tôi có thể ở bên nhau."
1504 = "Tôi kéo quần lót của em ấy sang một bên, áp dương vật vào, rồi cứ thế trượt đi trượt lại, cọ xát như muốn ấn sâu vào."
1505 = "Rồi Fukami nở một nụ cười như bầu trời xanh sau cơn bão."
1507 = "Được chỉ ra đến mức đó, thì tôi cũng hiểu. Thành quả của những chuyến dã ngoại đã cho tôi câu trả lời lúc này."
1509 = "Hành trình của ngón tay dài ra. Quần lót bắt đầu ướt sũng, lún sâu vào hình dáng của khe hở."
1512 = "Thấy vậy, tôi xoa dịu cơ thể đang rạo rực của mình, từ từ, chậm rãi di chuyển phần đang kết nối dính dớp."
1513 = "Đầu ngón tay em ấy vội vã chạm vào âm đạo, bắt đầu xoa xoa dọc theo đường rãnh."
1518 = "Hibiki, chắc sẽ không quay lại trong một lúc nữa đâu, nhưng……"
1520 = "Thật nhẹ nhàng, Hibiki đã quay trở lại nhà kho——!?"
1523 = "Dục vọng đó, cùng với ý thức rằng đây là ở nhà. Hai thứ đó giằng co quyết liệt, thôi thúc cơ thể tôi chuyển động thật nhanh."
1524 = "Sự cương cứng đang trong lúc xuất tinh bị kích thích đến mức đó, từ sâu trong cổ họng, một giọng nói không thể kìm nén dường như sắp bật ra——"
1527 = "Mỗi khi đâm vào cổ họng, lại phát ra âm thanh như tiếng nôn ọe. Dù vậy, Fukami vẫn ra sức mút mát và đảo lưỡi."
1535 = "Vừa lên đỉnh, Fukami vừa uống lấy tinh dịch của tôi."
1536 = "Em ấy cất giọng ngạc nhiên. Nhưng ngay sau đó lại khẽ gật đầu, ra chiều đã hiểu."
1537 = "Có vẻ như đã hiểu ra vấn đề, Fukami gật đầu liên tục nhiều lần."
1541 = "Fukami vừa ấp úng, vừa nhanh tay lật các trang album."
1543 = "Fukami cắn vào tay tôi. Ngay cả nỗi đau đó, tôi cũng cảm thấy như một niềm vui sướng của nhục dục."
1545 = "Lực cắn vào tay tôi rất mạnh. Tôi cảm nhận được nỗi đau rõ rệt."
1547 = "Bằng ánh mắt, bằng hơi thở, Fukami gật đầu. Những giọt mồ hôi rơi xuống từ người tôi, hòa làm một với mồ hôi của Fukami."
1549 = "Fukami, kéo áo hai dây xuống——"
1551 = "Như thể đang cố gắng kìm nén cơn buồn tiểu, Fukami vội vàng chỉnh lại quần lót, gật đầu mạnh."
1553 = "Giống như gặp phải một cơn mưa rào mát mẻ, Fukami say sưa nhắm mắt lại, tắm trong cơn mưa trắng đục của tôi."
1555 = "A~, Fukami há miệng ra, phô bày trọn vẹn bên trong cho tôi thấy."
1556 = "Đặt cuốn album xuống, Fukami từ từ vén váy lên."
1559 = "Ngoan ngoãn làm theo Fukami đang kéo tay, tôi đứng dậy. Gót chân của Fukami, lúc này như đang nhún nhảy chuẩn bị chạy đi."
1560 = "Một hành động hoàn toàn theo xung động tình dục, nhưng Fukami vẫn đón nhận."
1562 = "Phập phập, đầu em ấy lắc lư sang hai bên. Âm đạo siết chặt lại từng cơn."
1564 = "Anh lỡ say sưa vào 『cách chạm quần lót đúng chuẩn』 quá mức điêu luyện này, đến nỗi cứ dán mắt vào chỗ lún sâu đó——"
1566 = "Không thể kìm nén được nữa. Fukami há to miệng, để lọt ra những tiếng thở hắt. Dù vậy, em ấy vẫn bằng cách nào đó tiếp tục kìm nén giọng nói của mình——!?"
1569 = "Fukami đỏ bừng, mồ hôi nhễ nhại, tỏa ra một mùi hương quyến rũ nồng nàn, lấp đầy cả căn phòng."
1571 = "Hứng trọn tinh dịch của tôi bằng cổ họng, toàn thân Fukami co giật dữ dội."
1573 = "Với đôi mắt ngấn lệ, Fukami chớp mắt thật mạnh, đáp lại tiếng gọi của tôi."
1578 = "Âm đạo của Fukami, đột nhiên run rẩy."
1579 = "Cô bé của Fukami cũng ướt át nóng bỏng, những cơn co thắt liên tục, đang trở nên dồn dập hơn."
1580 = "Vì ướt sũng và dính chặt vào da, nên hình dáng bên trong âm đạo đang mở rộng cũng in hằn lên quần lót."
1581 = "Sự siết chặt nhấp nhô của âm đạo Fukami. Ở nơi sâu nhất, tử cung đang mút lấy, làm nũng và ngậm chặt."
1584 = "Ngón tay của Fukami, vẫn không dừng lại."
1586 = "Cảm giác an tâm, xen lẫn một chút trách móc, cả hai điều đó đều truyền đến từ giọng nói của Fukami."
1587 = "Giọng nói xen lẫn sự vui vẻ và một chút tiếc nuối. Khi màng nhĩ rung lên vì điều đó, cảm giác tò mò trong tôi càng bị kích thích."
1589 = "Eo của Fukami cọ quậy. Đôi gò má ửng đỏ hơn, đôi mắt cũng bắt đầu ươn ướt."
1591 = "Lưỡi của Fukami, khoang miệng của em ấy, vừa dính chặt vừa run rẩy bần bật——!!?"
1593 = "Cơ thể Fukami, hoàn toàn không hiểu được tình hình hiện tại."
1595 = "Fukami cau mày, ừm một tiếng, rồi lại lật album trở về."
1597 = "Nỗi bất an trong mắt em bừng sáng lên. Thở phào nhẹ nhõm trước phản ứng đó, tôi tiếp tục nói những lời không cần thiết phải nói."
1598 = "Đỏ bừng mặt và run rẩy——"
1601 = "Đặt ngón tay lên trên quần lót, như thể muốn in hằn hình dáng lên đó, Fukami banh rộng âm đạo ra."
1603 = "Fukami thở hổn hển, khuôn mặt đỏ bừng, ngước mắt lên nhìn tôi."
1604 = "Từng giọt từng giọt, sự nặng nề đục ngầu trút xuống làn da, xuống mái tóc em."
1605 = "Về nhà ga của chúng tôi—— Để cùng nói với nhau câu 『Chào mừng đã về nhà』."
1610 = "Dục vọng độc chiếm, cảm giác thành tựu và cảm giác khủng hoảng, hòa quyện với mật độ cực cao, làm sôi sục tâm trí tôi."
1612 = "Bây giờ nghĩ lại, tôi mới hiểu. Đó có lẽ cũng là một phần nguyên nhân khiến ánh mắt của tôi trở nên hung dữ như vậy."
1614 = "Và xen lẫn trong những nhịp thở khó nhọc đó, thỉnh thoảng lại có một hơi thở vô cùng ngọt ngào——"
1627 = "Tinh dịch, đang sưng phồng và trào dâng lên."
1633 = "Những ngón tay điên cuồng cọ xát, âm thanh nhóp nhép đó cũng khiến chuyển động của tôi trở nên trơn tru hơn."
1634 = "Ngay khoảnh khắc nghe thấy lời đó, tôi đã cởi cả quần ngoài lẫn quần lót ra."
1635 = "Trước câu trả lời thẳng thắn, Fukami lại giật mình lùi người lại. Đôi mắt em không hiểu sao cũng đột nhiên trở nên bất an."
1636 = "Bị thu hút bởi lời nói của Fukami, tôi cũng lật ngược lại các trang album."
1641 = "Nếu em ấy cho anh xem thì anh thực sự rất vui. Cảm ơn em."
1643 = "Dương vật bị vướng lại đập vào bụng, tạo ra một tiếng 'bét' nghe có vẻ rất đau."
1650 = "Vừa bị mùi hương của Fukami hành hạ, vừa trải qua những đêm khó ngủ cũng——"
1660 = "Niềm vui đó, cùng sự tự tin khi được cho phép, khiến anh trở nên tham lam hơn một chút."
1661 = "Không thể nào cưỡng lại được. Việc cưỡng lại cũng chẳng có ý nghĩa gì cả."
1664 = "Nếu vậy thì, Hibiki…… chắc hẳn đã đoán được lý do tại sao chúng tôi không trả lời——"
1721 = "（Trượt）"
