1216 = "「Picha――rero――rero――rero―― reryu――pecho――rero――rero――」"
1217 = "「Juru! Zuryuuuuu! Jubo! Zuryu! Jubo! Juruu! Jubu!!」"
1218 = "「Jumu! Jubu! Jubo! Juba! Ju! Churu! Chubo! Juba!!」"
1219 = "「Gupo! Chubo! Chubu! Chuuuu! Ku! Ryu! Chuuuu! （Ngoạm!!）」"
1220 = "「Juru! Reruuuuu! Rero! Chupa! Ưm! Jubu! Jubo! Ju! Jubu!」"
1221 = "「Juuuuuu! Zubo――go!!!! Juruuuuuu! Zubyo!――Gyu!!」"
1222 = "「Chụt! Thút! Reryuuuu! Jubu! Zuryuu! Chubu! Zuchu! Juba!」"
1223 = "「Zujuuuuuuuuuuuuuuuuuuu!!!」"
1224 = "「Chesutoooooooooooooooo!!!」"
1225 = "「Chesutoooooooooo!!!」"
1227 = "「Ưm――hà――phu――ưm――á――Nagi, sama ――em――đang làm――anh hai――ưm――a!」"
1229 = "「Ưm――hà――a, âm đạo――khít, quá――ưm! Dương, vật, của anh hai――so với, mọi khi, còn」"
1231 = "「Ưm……á――sướng, quá――nhưng mà――a! Vú――nếu to, quá, sẽ vướng víu, lắm」"
1233 = "「Ưm……hà――vú――từ từ――ưm―― từ, xung quanh――bị, xoa nắn――phua!」"
1234 = "「Ưm――phu haa」"
1236 = "「Ưm――pua! A……anh hai, ưm……bị, làm, như vậy――phua――Nagi, sama――tập, trung」"
1237 = "「Ưm――chụt――reru――Nagi, sama―― muchu――tinh dịch――của anh hai――uống hết――ưm」"
1239 = "「Aa――chắc là, vậy. Nếu chỉ nhìn, vào mối quan hệ, nhân quả. Thực tế――ku, a――từ trước đến nay――Nagi, đã nuốt, tinh dịch, của anh」"
1240 = "「Ưm! Ưm ku! Ực! Ực!!!」"
1241 = "「Ưm! Zuryuuuuuuuuuuu!!!!!! Jubooooooooooooooooooo!!」"
1242 = "「Khu hyun!!!」"
1244 = "「Ừ, cũng đúng. Dù là lúc làm nhiệm vụ hay lúc đấu kiếm―― Đối với anh, kích cỡ như bây giờ là tuyệt nhất rồi」"
1246 = "「À thì, nói hoàn toàn không đau thì là nói dối, nhưng……」"
1248 = "「Nyu!!? Fua! Bây giờ, cả ngực cũng—— trong khi cô bé, đang bị đâm, phập phập——ưm!!」"
1249 = "「!!!!!!!? Ưm! Pua! Au!!」"
1251 = "「Nihehe! Anh hai, là đồ ngốc dâm đãng~」"
1252 = "「Ehehe!」"
1254 = "「Ehehe, anh hai. Anh sẽ――ưm――đáp ứng, lời vòi vĩnh của Nagi-sama, chứ?」"
1256 = "「Aa――anh đang, được Nagi ôm ấp nhỉ」"
1258 = "「Vì anh nghĩ——làm vậy, xác suất sẽ cao hơn.」"
1259 = "「Anh Soutetsu! Anh Soutetsu! Anh Soutetsu! Anh Soutetsu!」"
1260 = "「Anh Soutetsu! Yêu anh! Yêu anh! Nhiều lắm, nhiều lắm! Yêu anh lắm! Yêu anh lắm, yêu anh!」"
1263 = "「Anh Soutetsu!? Có phải chỗ vừa nãy bị đập trúng đang đau không!!?」"
1267 = "「Tốt quá rồi!」"
1268 = "「Ý kiến hay đấy. ——Rất tuyệt.」"
1270 = "「Em hiểu rồi! Ehehe! Nagi sẽ phối hợp với chuyển động của anh——nhyu!?」"
1272 = "「Như em, mong muốn——để Nagi——có thể, tiết ra—— thật nhiều——sữa mẹ——đó!」"
1280 = "「C-Chưa chín muồi đâu~ ưm! Nagi-sama, vẫn còn, là vú――căng mọng, tươi trẻ――đấy」"
1282 = "「Anh——muốn——Nagi, trở nên như vậy.」"
1284 = "「Anh cũng vậy, Nagi——ưm!!」"
1285 = "「Anh cũng vậy——Nagi!!!」"
1287 = "「Anh không thể nào chịu đựng được. Anh luôn muốn độc chiếm dáng vẻ dâm đãng của Nagi」"
1289 = "「Ừ」"
1291 = "「Đúng vậy. Nếu em có thể thổi nó đi vùn vụt một cách thật sung sướng thì tốt quá」"
1292 = "「Đúng vậy. Để người khác nhìn thấy một Nagi đáng yêu và dâm đãng thế này thì――」"
1295 = "「Đúng vậy, như thế——chắc chắn——xác suất——thụ tinh—— làm tổ——đó, sẽ——」"
1296 = "「Hô hô」"
1298 = "「Do em mải mê tu hành nên không nhận ra sự hiện diện của anh hai Là do em còn non kém――aa――（Phù, phù）」"
1300 = "「Thì, sao nào?」"
1301 = "「Em muốn――anh hai, làm cho―― vú――sữa――chảy ra――nuôi dưỡng nó――cơ――」"
1304 = "「Cả to và dài hơn nữa. Một Nagi đáng yêu và dễ thương thế này, lại vì muốn làm tình với anh, mà cố gắng đến mức này――」"
1305 = "「Sao lại, không chịu nổi——chứ? Ưm——hự——a—— Khi cả ngực——và cô bé——bị làm, cùng lúc, thì sao?」"
1307 = "「Nagi, sama――không thể, tập trung――vào miệng, được―― Ưm――không thể――liếm, liếm――dương vật――của anh hai」"
1310 = "「Nagi……tự mình——ưm——chủ động—— làm tình——với anh Soutetsu——làm tình——ưm, a!」"
1312 = "「Đầu——Nagi——sẽ trở nên, ngốc nghếch, mất—— Vì sướng quá——nên mọi thứ——sẽ lóe sáng, rồi bay đi, mất」"
1313 = "「Cô bé của Nagi——ưm——đã ăn trọn vẹn—— cậu nhỏ của anh Soutetsu, mất rồi」"
1316 = "「Đúng ý anh rồi」"
1318 = "「Kh-Không. Anh không lên tiếng gọi là lỗi của anh. Anh nghĩ là sẽ làm phiền em tập trung――」"
1319 = "「Kh――――ông……không đến mức, đó, đâu」"
1320 = "「Có vẻ như trúng chỗ không sao. Ở gốc đùi. Tuy rất đau, nhưng đó là chỗ mềm và có vẻ chắc chắn」"
1328 = "「Bây giờ thì, hoàn toàn không thấy đau gì cả」"
1329 = "「Nhờ Nagi mà anh mới trở thành đàn ông đấy. Và, đàn ông thì――」"
1330 = "「Tất nhiên rồi」"
1331 = "「Tất nhiên rồi! Nagi-sama cũng, không muốn cho ai khác ngoài anh hai nhìn thấy dáng vẻ này……đâu……dáng vẻ……này――đâu」"
1334 = "「Đau thì có đau, nhưng còn hơn thế nữa, cơ」"
1337 = "「Đau――――――quá」"
1340 = "「Đau!!!」"
1342 = "「Thật sao? Ufufu~n. Nếu vậy thì――Nagi-sama――kupo!」"
1344 = "「Ra vậy, đúng là thế」"
1346 = "「L-Lúc tu hành vướng víu lắm―― Khi di chuyển, em sẽ mặc quần dài đàng hoàng mà」"
1348 = "「Cả ngực, lẫn cô bé——bị làm, cùng lúc, thế này—— Nagi——không chịu nổi, mất——sướng, quá, đi」"
1349 = "「Gốc đùi sao!!?」"
1350 = "「Có muốn làm 'cơn đau bay đi mất' thêm lần nữa không?」"
1356 = "「Đúng là, vú rồi――cả bầu ngực――lẫn núm vú―― Đều đã chín muồi vừa phải――là vú của――một người phụ nữ trưởng thành」"
1357 = "「Đ-Đó là mồ hôi――cái đó, do em đã cố gắng tu hành, nên mới thế thôi」"
1358 = "「Giọng nói này!? Ơ, waaaaaa?! Không lẽ, không lẽ thanh kiếm gỗ gãy trúng anh hai rồi sao!!?」"
1359 = "「Chắc chắn, rồi——từ đây, này」"
1362 = "「Nếu vậy, anh nuôi dưỡng thêm chút nữa nhé」"
1363 = "「Vậy thì」"
1364 = "「Nếu vậy, Nagi, ví dụ như trong một trận đấu kiếm thuật――」"
1366 = "「Haafuhan――hon, he――chụt――reru―― hihonha, hohoha――hohohehahi――juu――chụt」"
1368 = "「Do anh hai――ưm――xoa nắn――dâm đãng như thế này, nên――của em――mới thành vú của, người lớn――」"
1370 = "「Dù qua lớp quần bó, anh vẫn cảm nhận được độ ẩm ướt từ âm đạo của Nagi. Hơi nóng cũng thật tuyệt. Bốc lên hầm hập」"
1373 = "「Nagi!!!」"
1379 = "「（Phùuu, phùuu, phùuu, phùuu） Aa, vết đỏ không mờ đi chút nào cả――anh hai, có đau không?」"
1437 = "Khoảnh khắc nghĩ đến đầu lưỡi của Nagi, tôi cương cứng đến mức chính mình cũng phải ngạc nhiên. Lời nói dừng lại, chỉ còn tiếng thở phù phù phả vào quy đầu."
1438 = "Âm đạo đã cho tôi câu trả lời trước cả miệng em. Sự co bóp ấy truyền đạt rằng em sắp ra rồi nên hãy xuất tinh đi. Thế nhưng,"
1445 = "Dù có xoa nắn bao nhiêu cũng không thấy chán. Tôi muốn xoa nắn mãi mãi. Bầu ngực nằm gọn trong lòng bàn tay khiến tôi thành thật nghĩ rằng nó là dành riêng cho mình."
1446 = "Và Nagi, một khi đã thành thạo điều gì, sẽ không bao giờ quên, và lặp đi lặp lại một cách ngốc nghếch không biết bao nhiêu lần――"
1490 = "Nagi vừa nói chuyện vừa bú mút cùng lúc. Đồng thời với chuyển động dệt nên lời nói, em ấy tấn công ngọt ngào vào khấc quy đầu."
1492 = "Chỉ cần nhấn quy đầu vào, bụng Nagi lại nhấp nhô. Mồ hôi lẫn vào phần da thịt cọ xát, khiến cảm giác càng thêm tuyệt diệu."
1494 = "Nagi thổi phù phù vào chỗ tôi bị đánh trúng. Mỗi lần như vậy, đũng quần bó sát ngay trên mặt tôi lại đung đưa một cách đầy khêu gợi."
1497 = "Kích thích bằng miệng đơn điệu và mãnh liệt với tốc độ như bị dồn vào chân tường. Có lẽ Nagi cũng giống như tôi, đã sắp đến giới hạn rồi."
1498 = "Cơ thể Nagi vốn đang thả lỏng bỗng chốc cứng đờ."
1501 = "Bị liếm, bị tuốt, bị chiếc lưỡi nhọn đâm vào khe hở lỗ sáo, bị mút, bị ngậm lấy khấc quy đầu bằng hàm răng được che phủ bởi môi――"
1503 = "Nagi ngậm trọn quy đầu của tôi. Vẫn ngậm như thế, em ấy đưa lưỡi liếm một vòng quanh khấc quy đầu ướt át."
1504 = "Nagi mở rộng hết cỡ cho tôi xem. Nhưng không phải là cô bé đang tràn trề tinh dịch——"
1507 = "Âm đạo co giật vì khoái cảm, miệng run rẩy vì tiếng rên rỉ. Nhưng Nagi vẫn dùng chiếc lưỡi và đôi môi run rẩy ấy quấn chặt lấy dương vật không buông."
1509 = "Cửa âm đạo của Nagi đang co giật đòi hỏi sự cắm vào. Dù qua lớp quần bó vẫn cảm nhận rõ chuyển động mút lấy."
1511 = "Chuyển động của Nagi trở nên đơn điệu. Với những cú mút thật dài, vừa siết chặt môi, vừa liên tục đưa đầu lên xuống――"
1514 = "Toàn bộ vách âm đạo của Nagi đang run lên vì sung sướng. Thành âm đạo ôm chặt lấy dương vật cương cứng, co bóp mạnh mẽ kéo nó vào sâu hơn nữa."
1515 = "Giọng nói nũng nịu cất lên khi em đã hoàn toàn kiệt sức. Tôi cũng kiệt sức rồi, nhưng vẫn muốn đáp lại em——!!!?"
1518 = "Làn da của Nagi bỗng trở nên ấm áp. Dù không nhìn thấy mặt, tôi vẫn cảm nhận được nụ cười rạng rỡ của em ấy."
1519 = "Dù cảm giác mượt mà như trượt đi, nhưng lại bám dính lấy lòng bàn tay. Núm vú quả thực căng mọng, như nảy lên và quấn lấy ngón tay."
1521 = "Đầu Nagi bắt đầu di chuyển lên xuống. Vừa tăng cường độ bú mút, vừa như sực nhớ ra, em ấy pha trộn thêm chuyển động của lưỡi khi nói chuyện."
1522 = "Bên trong âm đạo của Nagi cũng đang sốt ruột. Liên tục thít chặt và cựa quậy, nhu động như đang kêu gào muốn tôi nhanh chóng đâm vào tận cùng."
1524 = "Nagi hóp nhẹ cơ bụng, khẽ nâng hông lên. ……Một cơ thể phụ nữ thực sự xinh đẹp, không hề có chút mỡ thừa nào."
1527 = "Bị tôi làm cho lên đỉnh――đạt đỉnh cùng lúc, Nagi bất giác nhả miệng ra, nhưng lại tiếp tục cố gắng ngậm lấy và nuốt trọn tinh dịch của tôi."
1529 = "Cơ thể Nagi khẽ giật mình. Phần tiếp xúc càng thêm nóng bỏng."
1530 = "Em cười khẽ. Hạnh phúc nuốt trọn lấy sự cương cứng của tôi. Bàn tay tôi miết trên cơ bụng mịn màng của Nagi, cảm nhận niềm hạnh phúc dâng trào."
1532 = "Nagi rùng mình, đẩy hông tới như đang bò trườn. Dùng chiếc âm đạo chật hẹp và nóng bỏng tuyệt hảo nuốt trọn dương vật của tôi."
1537 = "Đũng quần ướt đẫm mồ hôi của Nagi vừa mới dốc sức tu hành xong. Hơi nóng và mùi hương bốc lên qua lớp quần bó, thổi bùng dục vọng của tôi."
1541 = "Dù tôi tăng tốc bất ngờ, em vẫn phối hợp nhịp nhàng. Trong khoảnh khắc này, tâm hồn của Nagi và tôi như hòa làm một."
1544 = "Dương vật đang cọ xát vào âm đạo của Nagi một cách từ từ―― như theo quán tính, bỗng chốc trở nên nóng rực!"
1545 = "Ngón tay nâng đỡ dương vật duỗi ra, kích thích nhẹ vào tinh hoàn, muốn lấp liếm tiếng rên rỉ vừa phát ra, tôi tăng tốc chuyển động của ngón tay."
1556 = "Vừa xuất tinh, 99% ý thức của tôi đã bị sự cương cứng cướp mất, nhưng những ngón tay vẫn tiếp tục ấn, xoa và bóp nhũ hoa của Nagi."
1559 = "Thật đáng yêu, thật yêu thương, muốn trân trọng em ấy. Cảm xúc trào dâng khiến những ngón tay cử động trước cả hông."
1562 = "Có vẻ như em ấy đang rất hăng hái. Âm thanh hoàn toàn khác so với bình thường. Thế này thì có khi em ấy có thể chẻ đôi cây tre bằng kiếm gỗ cũng nên――"
1564 = "Tiếng ợ hơi đáng yêu. Mùi tinh dịch thoang thoảng từ đó. Dương vật nhanh chóng lấy lại độ cứng và sức nóng."
1566 = "Nặng quá――nóng quá!? Không――"
1567 = "Nếu anh lên tiếng trước khi đến gần, bảo em dừng tay lại rồi mới bước tới, thì chắc chắn đã không xảy ra chuyện này."
1595 = "Đau, nhưng không sao. Tôi nghĩ đến những chuyện ngớ ngẩn để bình tĩnh lại đôi chút."
1598 = "Khoái cảm mãnh liệt. Sự co thắt chặt chẽ. Quy đầu cọ xát vào phần nhô lên lấm tấm ở trần âm đạo, khiến cơ thể Nagi giật nảy lên một cái thật lớn."
1601 = "Bị bất ngờ, tôi bị đẩy ngã bằng một lực rất mạnh. Phải nói là cái này――tư thế này……"
1602 = "Dâm thủy rỉ ra khiến tôi kinh ngạc. Nagi cũng đã khá sẵn sàng rồi. Nếu vậy, với tư thế này, hai người có thể đạt đỉnh cùng lúc――"
1603 = "Tôi lỡ phát ra tiếng rõ mồn một mất rồi. Lúc này mà lấp liếm thì e là Nagi sẽ càng thêm khổ tâm."
1607 = "Quả thực hai chúng tôi đã cùng nhau học được rất nhiều điều. Thành quả học được, Nagi luôn áp dụng ngay lập tức, bất cứ lúc nào――!"
1608 = "Làn da hai đứa áp sát vào nhau đầm đìa mồ hôi. Dù ẩm ướt và nóng rực như vậy, nhưng cổ họng tôi lại khô khốc."
1610 = "Tôi vội vàng quá. Đáng lẽ nên dành thêm chút thời gian để làm dịu dục vọng bắn tinh rồi mới nhắc đến từ \"kiếm thuật\"――không!!!"
1613 = "Tôi nhấc bổng Nagi lên, lột sạch đồ, vừa ôm chặt vừa xốc lại tư thế!"
1614 = "Tôi đẩy hông tới, áp dương vật vào môi Nagi. Nagi hé miệng, không biết có phải đang trêu chọc không, chỉ dùng đầu lưỡi――"
1615 = "Cơ thể tôi đã ôm ấp không biết bao nhiêu lần. Dù không nhìn thấy cũng có thể cảm nhận được. Nagi cũng cử động hông, áp sát quy đầu vào cửa âm đạo――"
1617 = "Tôi dùng sức rút ngón tay ra, rồi lại tiếp tục trượt dài dọc theo âm đạo."
1620 = "Với tư thế 69, tôi muốn hai người cùng đạt đỉnh. Để làm được điều đó, không phải là hối hận mà là vuốt ve nhiều hơn nữa."
1621 = "Tôi chỉ vuốt ve âm vật và cửa âm đạo đang dính sát vào quần bó. Tập trung ý thức vào đó, rồi hướng đến nơi nhỏ hẹp thắt lại――"
1622 = "Tôi đồng ý từ tận đáy lòng. Ép chặt quy đầu nhóp nhép vào hậu môn của Nagi nãy giờ vẫn bị bỏ ngỏ."
1625 = "Tôi tóm lấy lườn Nagi, rút quy đầu ra đến sát mép."
1626 = "Tôi liều mạng kiềm chế ham muốn vặn hông đang sục sôi, từ từ nâng lên theo từng nhịp rướn người của Nagi."
1629 = "Dù tôi cố tình xoa bóp nhũ hoa mạnh bạo hơn, tiếng rên rỉ của Nagi vẫn ngọt ngào và vô cùng đáng yêu."
1630 = "Thay vì hôn, tôi mút chặt lấy gáy em, hít một hơi thật sâu mùi hương ngọt ngào từ mái tóc Nagi vào tận lồng ngực."
1633 = "Tay phải vẫn mở rộng âm đạo, ngón trỏ và ngón giữa tay trái ép sát nhau, thô bạo trượt dọc lên xuống."
1636 = "Tay trái vừa vuốt ve tiền đình âm đạo thật chậm rãi, vừa bất ngờ ấn mạnh lớp quần bó vào cửa âm đạo."
1637 = "Dùng ngón cái nhẹ nhàng vuốt ve âm vật, như đang bóp nhẹ \"funi funi\", tôi vẽ những vòng tròn vuốt ve hết lần này đến lần khác."
1640 = "Bàn tay ấm áp, cảm giác thật tuyệt. Bầu ngực của Nagi thật rõ ràng. Thưởng thức sự mềm mại đó, tôi bỗng trào dâng một niềm cảm khái."
1641 = "Tinh hoàn như sắp vỡ tung, tôi muốn xuất tinh ngay lập tức. Vì muốn hiện thực hóa mong ước của Nagi, tôi vừa đâm mạnh vừa bóp chặt nhũ hoa em!"
1644 = "Khoảnh khắc đó, tôi nhận ra. Nơi nhỏ hẹp thắt lại đằng sau lớp quần bó―― Đang co giật không chỉ có âm đạo và dương vật."
1648 = "Khi tôi thọc mạnh ngón tay qua lớp quần bó, hậu môn của Nagi liền cắn chặt lấy ngón tay đó!"
1649 = "Ép ngón tay qua lớp quần bó, tôi kích thích cửa âm đạo của Nagi. Dùng ngón cái tay phải nhẹ nhàng vuốt ve âm vật."
1650 = "Xác định vị trí qua lớp quần bó, tôi dùng ngón tay mở rộng âm đạo của Nagi. Khoảnh khắc chạm vào, tôi thấy vui sướng. Thường thì khi tu hành ở đây em ấy đều như vậy,"
1654 = "Bị kích thích bằng những cú mút dài tận sâu trong cổ họng―― Nagi liên tục tấn công vào tất cả những điểm yếu đã học được từ trước đến nay"
1659 = "Dạo gần đây Nagi rất say mê tu hành, nên tôi nghĩ em ấy sẽ ở đây, nhưng――"
1662 = "Khi cơ thể rung lắc, độ tròn trịa của bầu ngực Nagi qua lớp áo sơ mi càng nổi bật. Tôi muốn xoa nắn nó thỏa thích. Nghĩ vậy, dương vật cũng run lên bần bật."
1668 = "Mùi hương phụ nữ hòa quyện giữa mồ hôi và ái dịch càng lúc càng đậm đặc. Cửa tử cung cứ liên tục bám chặt lấy tôi."
1674 = "Tất nhiên, đó cũng là một kết cục vô cùng hạnh phúc. Nhưng mà, hiếm khi mới có được tư thế này――"
1676 = "Sự ngoan ngoãn đó khiến tinh dịch càng được sản sinh thêm. Dù đã bắn nhiều như vậy, tôi vẫn cảm thấy bắn chưa đủ chút nào!"
1678 = "Cặp đùi lộ ra ngoài chiếc quần bó chớp mắt đã nhuộm màu đỏ rực. Có vẻ cuối cùng em ấy cũng hiểu ra đây là tư thế gì."
1679 = "Tinh hoàn đang sưng phồng lên. Một phút nữa――không, ba mươi giây nữa cũng không trụ nổi――nếu vậy!"
1700 = "Khoảnh khắc chạm đáy, một khoái cảm ngọt ngào mút chặt lấy tôi! Cửa tử cung của Nagi đang vô cùng sung sướng chào đón tôi."
1701 = "Quá hưng phấn, ý thức tập trung quá nhiều vào dương vật nên thú thực tôi không rõ. Có thể đến ngày mai sẽ đau dữ dội cũng nên."
1708 = "Dù qua lớp quần bó tôi vẫn cảm nhận rõ rệt. Sự run rẩy ở cửa âm đạo của Nagi. Khoảnh khắc đó, tinh dịch đồng loạt trào lên quy đầu."
1709 = "Khoảnh khắc tôi thì thầm vào tai, cô bé của Nagi đột ngột siết chặt lại. Tôi suýt chút nữa thì xuất tinh, nhưng vì muốn cùng ra với em lần này nên đã cố nhịn."
1774 = "（Trượt――rùng mình――phập――hự――nhóp nhép）"
1775 = "（Phập!）"
1776 = "（Phụt! Phụt! ——Phụt——Phụt——）"
1777 = "（Phụt! Phụt! Phụt! Phụt!!!）"
1778 = "（Phụt! Phụt! Phụt! Phụt!）"
1779 = "（Rắc!!!）"
