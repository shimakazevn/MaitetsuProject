1195 = "「Pua! Huê!? Anh ha――!!!?」"
1197 = "「A! A……đúng rồi, nhỉ. Em……Nagi, sama―― phải thổi bay~ cơn đau cho anh hai, chứ」"
1199 = "「Phua! A――anh hai, ưm――khỏe, ghê, nhỉ, chỗ, bị va trúng――đã, hết đau――ưm――rồi, sao?」"
1201 = "「Phua! Á! Núm vú――núm vú, được vuốt ve nhẹ nhàng―― bằng ngón tay――sướng――quá――ưm!」"
1202 = "「Pua! Á! Á――ưm! Hapu! Reru! Ju! Jumu! Reryuu!」"
1203 = "「Fua! A! A! A! A! A! A! A!!!」"
1204 = "「Fua! A! A! A! Anh Soutetsu! Anh Soutetsu! Em! Em! Ra mất!!」"
1206 = "「Ha! A! Anh Soutetsu, anh Soutetsu! Cô bé, tuyệt quá! Tận cùng, bên trong——cứ bị đâm, thình thịch, thế này」"
1207 = "「A! Em hiểu rồi! Chắc chắn, là vậy! Cùng với anh, Nagi——ưm——cùng nhau, sung sướng, nhất——」"
1208 = "「!!」"
1209 = "「!!!!」"
1210 = "「~~~!!! Ưm! （Hít）――chụt! Reroo! Zuju! Jubu! Reryuuu!」"
