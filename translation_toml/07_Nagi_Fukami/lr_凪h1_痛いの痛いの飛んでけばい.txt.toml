1162 = "「Ưm ku!? Pu――phua――ưm――juru! Jubo! Jubu! Juba! Chuuuu」"
1163 = "「Kua——ha——ha——ha——ha」"
1165 = "「A……hự――kuha――rơi vào tình huống thế này―― chỉ số IQ sẽ dần dần――hòa tan vào tinh dịch mất」"
1167 = "「Ha——a——fua——ưm—— Anh Soutetsu——anh Soutetsu」"
