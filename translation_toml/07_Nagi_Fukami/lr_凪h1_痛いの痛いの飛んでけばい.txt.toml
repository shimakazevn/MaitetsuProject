850 = "「――Na――gi!」"
1073 = "「Một chút thôi, một chút. Chỉ một chút thôi. Vì xuất tinh mạnh quá, thỏa mãn đến mức thả lỏng cơ thể——nên mới thấy hơi đau một chút thôi.」"
