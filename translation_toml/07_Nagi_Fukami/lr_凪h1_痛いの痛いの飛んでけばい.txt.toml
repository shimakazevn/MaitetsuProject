1154 = "「Ở đâu vậy? A! Chỗ này nhỉ!? Uwa, đỏ chót luôn! ――Anh hai, em thật sự xin lỗi」"
1155 = "「Phu――ưm! Ưm ưm~~~! Ưm mu! Ju! Reru! Jubu! Jubo! Zuuuu~~~!」"
1156 = "「Kufu」"
