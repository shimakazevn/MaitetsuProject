1169 = "「A――á――a á!」"
1170 = "「A——ha——a! Ưm!!!!」"
1172 = "「Hà……á――âm đạo, đến tận, sâu nhất――Nagi, sama ――tự mình――nuốt lấy――dương vật――của anh hai――」"
1173 = "「A——fua——sao, lại——tại sao, anh——a——lại muốn Nagi——trở nên, như vậy, chứ?」"
1175 = "「Ha——a——thụ tinh, với tinh trùng, của anh…… ưm——（Ực）——rồi làm, tổ——với trứng của, Nagi」"
1177 = "「A――á――cái đó――phê quá」"
1178 = "「Á――!」"
1180 = "「Phua――á! Á! Á! Cách, sờ―― Tay, của anh hai……so với lúc nãy, còn――dâm đãng hơn――」"
1182 = "「A――chụt――chụttttt――reru―― chimu――chu, chubu――ưm――đúng vậy nhỉ」"
1183 = "「A――」"
1185 = "「A……ưm……phua――á――anh hai…… Mạnh hơn――mạnh hơn, nữa――ưm――mạnh lên, đi」"
1186 = "「A. ……Ufufu——ehehe! Fufufufufu!」"
1187 = "「Phua――anh hai, hơi bạo lực quá rồi――kệpp」"
1190 = "「A……Sắp, được rồi——ưm——hự——a! Một, chút nữa thôi——là vào đến, tận cùng——bên trong, rồi」"
1191 = "「Kua」"
1192 = "「Hahyu!!!!!」"
