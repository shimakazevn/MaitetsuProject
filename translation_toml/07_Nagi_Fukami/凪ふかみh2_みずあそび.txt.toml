1743 = "Gò má ấm nóng của Nagi,\\nvừa căng mọng vừa mịn màng như một chú cá hương non."
1744 = "Âm đạo của Nagi, quả nhiên là hẹp một cách mãnh liệt!"
1747 = "Đột nhiên Nagi ngậm đầy không khí vào miệng,\\nlàm phồng phần má đang kề sát với Fukami lên."
1748 = "Nếu Nagi đã luyện tập chuyện hậu môn,\\nthì chắc hẳn Fukami đã chuẩn bị cho chuyện đi tiểu rồi."
1751 = "Nagi ngay lập tức đón nhận trách nhiệm tôi đùn đẩy một cách trực diện.\\nFukami thì lúng túng, trông có vẻ khá bối rối."
1753 = "Không còn nghi ngờ gì nữa, chắc chắn Nagi đã tự mình tập luyện.\\nMột ngón tay vào rất dễ dàng, và ngay cả khi đã rút ra, chỗ đó vẫn mềm mại."
1754 = "Nagi với thể lực đáng nể,\\nnhìn thẳng vào tôi——rồi từ từ nở một nụ cười gượng gạo."
1760 = "Kích thích đã trở nên mạnh mẽ hơn hẳn so với ban nãy."
1767 = "Ngay cả khi đã nắm chắc phần thắng,\\nFukami vẫn tham lam hướng tới đỉnh cao hơn."
1776 = "Tuy nhiên, nếu ưu tiên Fukami trước,\\nthì sẽ trở nên không công bằng với Nagi."
1785 = "Bằng miệng thì đã ưu tiên Fukami trước rồi,\\nnên âm đạo thì Nagi sẽ là người đầu tiên——"
1787 = "Được bao bọc bởi khu rừng nhô ra và vách đá dựng đứng,\\nnếu không có thuyền thì có lẽ chẳng ai có thể nhìn thấy bãi cạn này."
1789 = "Vì vậy, tôi cũng đã tìm hiểu.\\nCả về chuyện đi tiểu, lẫn chuyện hậu môn."
1791 = "Đúng lúc âm đạo đang thèm khát nuốt lấy tinh trùng này,\\ntôi lại dấn hông sâu thêm một bậc nữa!!"
1798 = "Hai nội dung hoàn toàn khác nhau, lại được nói ra cùng một lúc."
1799 = "Thế nên, đáp lại tiếng gọi của tôi là hai giọng nói cất lên.\\n——Nagi phản ứng nhanh hơn. Nhưng Fukami lại hiểu ý tôi hơn."
1800 = "Xuyên qua lớp da má mềm mại,\\nlưỡi của hai người tự ý liếm láp phần cương cứng của tôi."
1801 = "Phần háng của bộ đồ bơi bị lật lên."
1803 = "Em ấy dùng đầu ngón tay bóp nghẹt tiền đình âm đạo——cửa niệu đạo,\\ndựa theo nguyên lý bóp hẹp miệng ống nước, để bắn nốt phần nước tiểu còn sót lại ra xa."
1804 = "Cú thúc mạnh vào cổ họng,\\nkhiến khóe mắt Nagi ứa ra những giọt lệ đau đớn."
1806 = "Sướng thật. Quả thực là rất tuyệt nhưng...\\nvới mức độ kích thích này, e là vẫn khó mà xuất tinh được."
1810 = "Cửa tử cung mút chặt lấy, toàn bộ thịt âm đạo run lên bần bật!"
1815 = "Vừa ra khỏi âm đạo, nó liền chảy dọc theo đùi xuống sông.\\nBiến thành thác nước màu vàng, rơi xuống từng giọt tỏng tỏng."
1817 = "Sự khác biệt về xúc giác và thân nhiệt ập đến từ hai phía trái phải,\\nlàm khoái cảm trào dâng râm ran."
1826 = "Từ sâu thẳm bên trong âm đạo cho đến gần lối vào.\\nSự siết chặt và run rẩy của thớ thịt âm đạo liên kết với nhau như một chuỗi đèn nhấp nháy."
1832 = "Trăm nghe không bằng một thấy, tôi vuốt ve gò má Nagi.\\nKhông phải bằng lòng bàn tay, mà bằng phần cương cứng."
1836 = "Cả ba chúng tôi cùng ngã xuống mặt sông."
1837 = "Rồi cả ba chúng tôi, cười phá lên,\\nvà trao nhau những nụ hôn tới tấp."
1838 = "Từ nay về sau, ba chúng tôi sẽ,\\nmãi mãi——cùng nhau chia sẻ nụ cười và thời gian."
1841 = "Tôi luồn phần cương cứng vào khoảng trống chật hẹp giữa hai gò má."
1842 = "Bôi chất dịch rỉ ra lên gò má hai người,\\ntôi bất đắc dĩ nhận ra sự khác biệt về xúc giác."
1844 = "Điều đó, khiến tôi rất vui.\\nLời nói, trái tim, dần trở nên vô cùng thành thật."
1845 = "Để nới lỏng nó ra một chút, tôi thử cử động nhẹ đầu ngón tay."
1846 = "Muốn nếm trải chuyển động của Nagi, tôi nhấn vào cánh cửa tử cung,\\nrồi cố tình dừng lại."
1849 = "Thuận theo khao khát của xung động xuất tinh,\\ntôi mặc sức ngoáy sâu vào Nagi, di chuyển hông thật lớn và mạnh mẽ."
1852 = "Nhấc mái chèo lên,\\nphần còn lại phó mặc tất cả cho dòng nước——"
1854 = "Chỉ cần thúc vài cái, Nagi đã đung đưa theo nhịp điệu.\\nNagi đang chủ động lắc hông đón lấy tôi."
1856 = "Tôi thấu hiểu, và tin chắc điều đó.\\nNagi, Fukami, và cả tôi."
1858 = "Tận sâu bên trong Nagi.\\nTôi tuôn trào dòng tinh trùng đặc sệt vào đó, rồi đẩy sâu vào một lần nữa——"
1860 = "Tôi đã mơ hồ nghĩ như vậy,\\nnhưng bầu không khí lúc này không thể nào nói ra được."
1862 = "Tôi thử cắm vào với cảm giác giống như khi làm với Fukami,\\nnhưng có vẻ như thế là quá sâu đối với Nagi."
1864 = "Tôi dang rộng lồng ngực đón lấy Fukami và Nagi đang lao vào lòng mình."
1865 = "Tôi vòng ra phía sau hai cô gái đang say sưa với nhau,\\nđịnh tung một đòn vuốt ve bất ngờ để trừng phạt——!?"
1867 = "Rõ ràng cảm nhận được sự ngọ nguậy của lưỡi, nhưng lại chẳng hề trơn trượt, ướt át hay quấn quýt,\\ncũng chẳng trượt hay mút——thật sự quá bứt rứt."
1870 = "Chỉ cần như vậy thôi cũng đủ truyền đạt rằng,\\nchúng tôi đang có chung một cảm xúc."
1871 = "Tiến về phía hai nụ cười rạng rỡ ấy,\\ntôi chỉ cởi giày ra, lội bì bõm qua vùng nước nông."
1873 = "Lời tôi còn chưa dứt,\\nFukami đã cất giọng đầy tha thiết."
1876 = "Dõi theo ánh mắt của Fukami nhìn quanh,\\ntôi lập tức hiểu ý em ấy."
1877 = "Quần dài và quần lót bị kéo tuột xuống tạo ra phản lực,\\nkhiến phần cương cứng bật lên sượt ngang qua mũi Nagi."
1879 = "Có lẽ do tôi lỡ buột miệng yêu cầu ban nãy,\\nhoặc đơn giản là vì em ấy đang xấu hổ——"
1880 = "Có lẽ do quá bất ngờ trước dị vật, nên nó đã đóng chặt cứng lại.\\nThế này thì quan hệ đường hậu môn là chuyện tuyệt đối không thể."
1885 = "Vì vậy, thật chậm rãi.\\nTôi cẩn thận nói từng lời một."
1891 = "Rồi em ấy quay ngoắt lại nhìn tôi,\\nnở một nụ cười rạng rỡ trên môi."
1892 = "Sau đó tôi rút ra, trút xuống cơn mưa tinh trùng rào rào."
1893 = "Rồi hai người đưa đầu ngón tay của nhau,\\nnhững đầu ngón tay đã gạt đầy tinh dịch của tôi."
1895 = "Trái lại, gò má mát lạnh của Fukami, cứ như chiếc bánh giã xong\\nđược để một lúc, nguội vừa đủ độ ngon vậy."
1900 = "Là đồ bơi.\\nRa là hai em ấy đã mặc sẵn ở bên trong từ đầu rồi."
1902 = "Âm đạo của Fukami và âm đạo của Nagi——không chỉ vậy,\\nmà cả lỗ hậu môn, tất cả đều phơi bày rõ ràng trước mắt tôi."
1918 = "Chắc hẳn em ấy cảm thấy tò mò.\\nFukami chậm rãi ngồi dậy."
1921 = "Fukami cũng làm giống hệt Nagi.\\nThế này, có nghĩa là——"
1924 = "Nhịp thở đều đặn, cùng lượng nước dài và dồi dào.\\nCó lẽ Fukami đã kiểm soát cả việc bổ sung nước cho cơ thể."
1927 = "Fukami và Nagi đưa mắt nhìn nhau,\\nrồi cả hai đồng thời gật đầu thật sâu."
1929 = "Tinh dịch văng tung tóe trên mặt, Fukami, và Nagi,\\ndùng ngón tay và lưỡi của mình gạt lấy——"
1931 = "Bị mút lấy! Đồng thời bị cổ họng của Fukami cắn chặt!!"
1933 = "Fukami ôm chặt lấy Nagi,\\nrồi tôi ôm trọn cả hai người lên."
1934 = "Fukami nhanh nhẹn buộc dây neo đuôi thuyền,\\ngiữ cho chiếc thuyền dừng lại hoàn toàn——"
1937 = "Không biết là thực quản hay thanh quản, Fukami đóng mở sâu bên trong cổ họng,\\nđồng thời thực hiện động tác nuốt vào trong như muốn vắt kiệt tinh dịch của tôi."
1939 = "Fukami cứ như biến thành một con sứa vậy."
1940 = "Giọng nói ngây thơ. Nụ cười rạng rỡ.\\nVà rồi Fukami——"
1941 = "Tiếng nấc nghẹn ngào từ cổ họng cùng chiếc lưỡi run rẩy đã bóp cò súng trong tôi!"
1943 = "Đang chuyển động. Cổ họng của Fukami đang ngọ nguậy.\\nLúc thì hẹp lại, lúc lại mở rộng ra, như thể muốn nuốt chửng tôi vào sâu bên trong——"
1946 = "Giọng nói có vẻ luống cuống của Fukami——!?"
1947 = "Giọng nói của Fukami nghe nũng nịu đến lạ.\\nĐầu lưỡi em ấy khẽ liếm làm ướt đôi môi."
1949 = "Đôi má của Fukami phồng lên——\\nnhưng ngay sau đó, nó chuyển thành một nụ cười đầy thách thức."
1950 = "Âm đạo của Fukami, cũng đã,\\nhoàn toàn tan chảy và sẵn sàng rồi."
1953 = "Quả không hổ danh Fukami là một người chèo thuyền xuất sắc."
1955 = "Fukami cho vào miệng Nagi, Nagi cho vào miệng Fukami,\\nđút vào miệng của đối phương——"
1957 = "Fukami nở nụ cười tự đắc, thậm chí còn an ủi Nagi vất vả rồi."
1958 = "Fukami run rẩy dữ dội,\\nsức lực dần tuột khỏi cơ thể em ấy."
1965 = "Để Nagi không thấy xấu hổ,\\ntôi đành kìm nén tiếng cảm thán trong lòng."
1971 = "Tất nhiên, tôi cũng công bằng với cả Fukami nữa."
1973 = "Không thể phát huy sức mạnh cho đến phút cuối,\\nmàn đi tiểu của Nagi đã kết thúc."
1974 = "Cây cầu nước tiểu sống động mà Fukami vẽ nên,\\nđã khắc sâu những từ ngữ đó vào tâm trí tôi."
1977 = "Một đường parabol màu vàng hoàn hảo."
1979 = "Vừa đáng yêu, lại vừa dâm đãng.\\nTôi cũng muốn cứ thế ngắm nhìn khung cảnh này mãi, nhưng——"
1983 = "Chỉ một thoáng chốc.\\nSự im lặng ăn ý của hai người."
1987 = "Dù đã loãng ra, chẳng còn sức nặng.\\nNhưng một cách hèn mọn, tinh trùng vẫn cứ phun ra thành từng dòng dài——"
1989 = "Trước lời đề nghị như buồn ngủ gặp chiếu manh đó,\\ncơ thể tôi đã phản xạ lại một cách hèn mọn."
1990 = "Có lẽ đã an tâm hơn nhờ câu nói đó, sự căng cứng ở hậu môn của Fukami dần buông lỏng.\\nThay vào đó, Fukami nắm chặt hai bàn tay lại."
1992 = "Xúc cảm của đôi má phồng đầy không khí đúng là rất dễ chịu,\\nnhưng nó chỉ căng phồng một cách đồng đều, vô cùng đơn điệu và thiếu kích thích."
2007 = "Cảm giác bị lưỡi men theo và đè ép qua lớp má cứ nhồn nhột,\\nngẫu nhiên và vụng về, mang đến những khoái cảm ngoài sức tưởng tượng."
2010 = "Chỉ cần bị nhìn chằm chằm thôi cũng đủ làm lồng ngực tôi xao xuyến.\\nĐến cả đôi môi cũng khẽ run lên——"
2016 = "Hai người vừa thốt ra lời,\\nlại đồng thời đưa mắt nhìn nhau với vẻ mặt sửng sốt."
2017 = "Cùng lúc trả lời, Fukami mở to miệng,\\ncho thấy em ấy đang khao khát phần cương cứng của tôi đến nhường nào."
2018 = "Nói đi đôi với làm.\\nFukami dùng ngón tay mở rộng đại âm môi ra——"
2019 = "Cùng lúc với tiếng reo hò,\\nNagi thọc cả hai tay xuống mặt sông——!!?"
2026 = "Vừa mềm mại, ẩm ướt lại như bám dính lấy,\\nkhiến tôi cảm thấy một thứ tội lỗi kỳ lạ khi cọ xát đầu quy đầu vào đó."
2034 = "Thế này... thế này thì tôi không thể chống cự nổi nữa rồi.\\nNhưng——nếu xuất tinh, quả nhiên tôi vẫn muốn dành cho cả hai, cả Fukami và Nagi!"
2035 = "Tươi tắn đến mức chạm vào là nảy lên bần bật,\\nthế mà lại mượt mà, hệt như đang sờ vào tấm lụa thượng hạng."
2036 = "Cứ như vậy chờ đợi lời nói của tôi."
2037 = "Chiếc thuyền xuôi dòng mà tôi được giao phó toàn quyền cập bến,\\nđã lướt theo dòng nước trôi vào bãi cạn do Fukami chỉ định."
2039 = "Nếu vậy——nếu vậy——."
2043 = "Bên trong âm đạo hoàn toàn lầy lội,\\nthịt âm đạo cũng khẽ uốn éo như đang chào đón tôi."
2044 = "Hẹp thì hẹp thật, nhưng hôm nay, Nagi cũng——\\nđang——vô cùng——hưng phấn, mà."
2045 = "Dù cho dòng nước nông đang nổi lềnh bềnh tinh dịch của chính mình,\\nnhưng đối với cơ thể đã quá nhiệt này, nó thực sự rất mát mẻ và dễ chịu."
2060 = "(...Chỉ mình tôi bị ra rìa thế này, cũng có chút cô đơn.)"
2062 = "（——Cái này——tuyệt thật）"
