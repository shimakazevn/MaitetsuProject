2978 = "「Thử học thêm một chút nữa nhé」"
2979 = "「Vậy thì, làm thế nào——\\nÀ, phòng tắm……ở Tororyu-yu chẳng hạn?」"
2980 = "「Nếu vậy, anh hai đi theo em á!\\nSẽ mời anh đến một nơi bí mật thật sự luôn á!」"
2983 = "「Tuyệt quá còn gì」"
2985 = "「Vậy thì, đợi em một chút xíu á!!」"
2987 = "「Thế thì đỡ quá.\\nNhưng, như vậy thì lựa chọn lại càng ít đi」"
2988 = "「Vậy thì tốt quá rồi」"
2989 = "「Nếu vậy, có khi lại đâm ra muốn làm sai cũng nên」"
2992 = "「Nếu vậy tôi sẽ đi pha trà. Sau đó thì……để xem nào,\\nchắc tôi sẽ làm vài cái huy hiệu biểu trưng đầu tàu vậy」"
2994 = "「Nếu Nagi muốn thế thì cứ làm vậy đi.\\nỪm——Đúng rồi, nhỉ……」"
2996 = "「Bây giờ thì, không khóc nữa rồi à?」"
2998 = "「Thế thì có vẻ hợp với Nagi-sama lắm á!!」"
2999 = "「Nếu vậy……để xem nào, ở xưởng đầu máy」"
3000 = "「Nếu vậy anh hai. Phải ngoan ngoãn nghe theo,\\nbất cứ lời nào của Nagi-sama chiến thắng á nha?」"
3001 = "「Vậy thì vậy thì, cùng suy nghĩ thôi á!」"
3002 = "「Rồi sao? Anh hai, mình đi đâu á?」"
3003 = "「Nếu vậy, nếu vậy! Ngực——」"
3004 = "「Thì á! Khen như vậy ngại lắm á——\\nỦa, hửm? Nagi-sama, không được khen nhiều lắm á?」"
3008 = "「Đâu có dễ thế.\\nTôi đây cũng đã quen với nước chút đỉnh rồi」"
3009 = "「Về đồ bơi quy định của trường,\\nanh hai cứ nói hết những gì mình nghĩ ra đi á」"
3010 = "「Hắt——xì!!」"
3011 = "「Còn gì nữa……sao, ừm」"
3014 = "「Không lẽ, xảy ra tai nạn gì」"
3015 = "「Mãi mới được hẹn hò mà,\\nphải xa nhau thì……hơi buồn á」"
3017 = "「Trước tiên là——A, không」"
3018 = "「Trước tiên, là màu sắc. Cái màu xanh đen đậm đặc trưng đó.\\nSau đó là kiểu dáng……Kiểu áo liền quần, đúng không nhỉ?」"
3021 = "「Đến cả cửa hàng Tsuruya hay Olimpia còn không có mà.\\nCó ra Kumamoto hay Yatsushiro thì chắc cũng không có đâu á」"
3026 = "「（Khịt——Khịt——）——Ưm……Mùi,\\ncũng không nồng lắm á」"
3191 = "Cuộn trào, nổi hột,\\ndù đã đâm đến tận cùng rồi mà vẫn cứ mời gọi vào sâu hơn nữa."
3193 = "À không——đúng rồi. Cả tôi và Nagi đều chưa vuốt ve gì cả.\\nÂm đạo của Nagi, vẫn đang trong trạng thái chưa được dạo đầu."
3196 = "『Màu không có sắc độ (Màu vô sắc)』"
3197 = "Có lẽ nhờ lời nói đó mà em lấy được dũng khí,\\nNagi kéo tuột quần bơi của tôi xuống trong một nhịp."
3200 = "Giọt nước lúc nãy có phải là nước tiểu hay không,\\nthì những gì chúng tôi làm cũng không hề thay đổi."
3202 = "Dù có lắc hông bao nhiêu đi chăng nữa,\\nâm đạo bám sát lấy phần cương cứng, ép nó phải nhảy múa theo chuyển động của mình."
3204 = "Không nhìn vào những thứ không đạt được, mà nhìn vào những gì đã có được.\\nĐược những lời của Nagi chỉ bảo, góc nhìn của tôi cũng thay đổi."
3209 = "Lau người cho Nagi khi em lên bờ, rồi tôi cũng tự lau cho mình.\\nGiờ chỉ cần thay quần áo nữa là xong——"
3227 = "Thậm chí còn nghe thấy cả tiếng nói 『Hai anh em thân thiết ghê nhỉ』."
3229 = "Dù vậy, chuyển động lưỡi quá đỗi vụng về, rụt rè của em,\\nlại càng khiến tôi thêm nóng rực."
3231 = "Nhưng ngay lập tức, với dũng khí nhân lên gấp trăm lần, em tiến vào."
3232 = "Nhưng mà——"
3234 = "Nhưng——suýt chút nữa, thì Nagi cũng vậy."
3236 = "Dù vậy, Nagi vẫn không thay đổi.\\nKhóe mắt hơi nheo lại, thoải mái làm nũng với phần cương cứng của tôi."
3238 = "Nhưng mà, có vẻ như mãi vẫn chưa chạm đến đúng chỗ."
3240 = "Nhưng, làm ngay bây giờ thì thật uổng phí.\\nTôi kìm nén dục vọng, nhặt thùng các tông vừa bay vèo đi lên."
3256 = "Dù là hiểu lầm, nhưng tôi không thể chống cự.\\nDục vọng muốn chạm vào, bị độ trơn trượt của chiếc lưỡi phủ lên."
3257 = "Dù đang ở bên kia tấm cửa lùa,\\nnhưng mọi hành động của Nagi đều lọt hết vào tai tôi."
3260 = "Càng vuốt ve, niềm hạnh phúc càng trào dâng, tôi muốn cứ thế này mãi——"
3261 = "Cứ làm theo lời em thì không thú vị chút nào.\\nTôi dẫn dắt Nagi, xoay hông, chà xát nhè nhẹ vào điểm yếu của em."
3263 = "Dù chỉ là bước đi,\\nnhưng tay chân Nagi cũng vung vẩy rất thoải mái và rộng mở."
3267 = "Việc sử dụng cho mục đích cá nhân ngoài giờ làm việc,\\ntrong phạm vi không vi phạm thuần phong mỹ tục, cũng được cho phép."
3330 = "Tinh dịch bị hút và nuốt lấy nuốt để như một đứa trẻ,\\nthế nhưng, chính tôi, lại có cảm giác như mình bị biến thành một đứa trẻ."
3337 = "Nagi ngậm lấy quy đầu của tôi.\\nTrước khoái cảm hằng mong đợi, hông tôi run lên bần bật."
3339 = "Chỉ mỗi quy đầu. Chỉ chỗ đó bị liếm láp và mút mát dai dẳng.\\nKhoái cảm gần như tê dại, tích tụ lại ở nơi đầu chóp."
3341 = "Nagi huơ huơ tay trước mặt tôi.\\nRồi làm mặt hề trêu chọc."
3343 = "Nếu đó là điều hiện lên đầu tiên trong đầu, thì đối với Nagi,\\ncuộc thi đó hẳn là một kỷ niệm vô cùng sâu sắc."
3346 = "Vỗ nhẹ một cái lên trán tôi,\\nNagi hắng giọng một tiếng, rồi ưỡn……ngực……ra……"
3348 = "Nagi chợt khựng lại."
3350 = "Nagi tự mình cố cắm vào, nhưng mãi không trôi.\\nKhít, quá khít. Cảm giác như quy đầu đang bị vặn xoắn."
3352 = "Em chậm rãi gật đầu.\\nSau đó Nagi lắc đầu——"
3354 = "Nagi ôm chầm lấy thùng các tông,\\nrồi xoay một vòng——!!?"
3356 = "Nagi ưỡn người ra sau, thở hắt ra.\\nKhoái cảm như khi được gãi thật mạnh vào chỗ ngứa đã phải nhịn từ lâu."
3358 = "Một giọng nói lanh lảnh, đánh bay mọi sự gợi tình,\\n——Tiếng reo hò chiến thắng."
3360 = "Nagi đang say sưa với máy tính.\\nMột khi đã say sưa, thì vì là Nagi nên cơ thể sẽ tự nhiên chuyển động theo."
3361 = "Nagi lặn tịt xuống nước.\\nTôi cảnh giác sợ bị kéo chân, nhưng——"
3363 = "Với động tác quen thuộc, Nagi kéo khay máy in ra,\\nvà lấy từ đó một tờ giấy A4."
3365 = "Dù vậy, Nagi vẫn dùng ngón tay hứng lấy dòng dịch nhờn rỉ ra,\\nrồi bôi đều lên quy đầu."
3368 = "Nagi lấy tay che hình ảnh lại,\\ncòn tôi thì thanh toán mua hàng trên mạng."
3369 = "Lời nói của tôi, được Nagi viết thoăn thoắt xuống giấy\\nbằng những nét chữ tròn trịa đáng yêu."
3372 = "Những ngón tay của Nagi chầm chậm di chuyển.\\nKhông biết em căng thẳng đến mức nào, mà đầu ngón tay khẽ run rẩy."
3374 = "Đôi mắt Nagi đảo quanh, ngó ngoáy."
3377 = "Chuyển động hông của Nagi, vẽ nên một vòng tròn nhỏ, lỏng lẻo.\\nNhư đang muốn dẫn dắt quy đầu của tôi đến nơi nhạy cảm."
3378 = "Nagi đỏ bừng mặt ngay lập tức.\\nNgượng ngùng từ tận đáy lòng. Thật hiếm thấy. Và cũng thật đáng yêu."
3381 = "Lưỡi em cựa quậy bên trong khoang miệng. Quy đầu được liếm láp cẩn thận,\\nđồng thời lỗ sáo cũng bị mút chụt chụt."
3382 = "Lưỡi của Nagi, lướt qua lại quanh đôi môi đang kề sát."
3383 = "Bên trong âm đạo Nagi đang cuộn trào."
3385 = "Từ người Nagi, những giọt nước bắn ra.\\nTôi tưởng là nước tiểu, nhưng——"
3388 = "Nagi cười tươi rói,\\nrồi vỗ vỗ vào eo mình cho tôi xem."
3390 = "Khi em cười tươi, giọng nói cũng trở nên rộn ràng.\\nNagi, lúc nào cũng thẳng thắn như vậy."
3392 = "Em cười nói.\\nNhưng ngay sau đó, Nagi lại nhún vai một cách phóng đại."
3393 = "Nagi gật gù viết thêm phần bổ sung,\\nrồi nở nụ cười đầy tự tin, ngẩng mặt lên."
3395 = "Nagi giơ tay lên đầy hào hứng."
3396 = "Nagi hăm hở bước sang phòng bên——\\nNhưng trước khi đi, em quay ngoắt lại."
3397 = "Nagi hăng hái viết thêm vào tờ giấy."
3398 = "Nagi chạy ào sang phòng bên,\\nvơ lấy bộ quần áo vừa cởi ra vứt đó."
3399 = "Nagi co thắt lại. Bắt đầu vắt kiệt."
3401 = "Em nhảy lùi lại, mặt đỏ bừng và xua tay rối rít."
3403 = "Đó là gì á? Đôi mắt tròn xoe như đang hỏi vậy."
3404 = "Trên mặt giấy, những đường gạch ngang xoèn xoẹt được vẽ ra."
3406 = "Nagi say sưa, tự mình dập hông."
3416 = "Không phải là xuất tinh sau khi tăng tốc,\\nmà là mực nước dâng lên, rồi từ từ tràn ra ngoài."
3422 = "Hơi thở, mùi hương, hơi ấm——\\nDù chỉ cảm nhận được một chút thôi, cũng đủ thấy hạnh phúc rồi."
3424 = "Cho dù có làm những việc khác nhau,\\nnhưng chỉ cần ở cạnh nhau thôi, cũng đã có ý nghĩa rồi."
3426 = "Dòng máu vừa mới mát lạnh sảng khoái, nay lại bùng cháy.\\nTôi, đã biến Nagi, thành một người phụ nữ."
3433 = "Vậy mà, lại ướt đẫm đến thế này.\\nTừ từ, quy đầu như đang cắm phập vào——!"
3437 = "Một nụ hôn nhẹ.\\nHết lần này đến lần khác, chỉ như đang mổ nhẹ lên môi."
3440 = "Khi tôi dứt nụ hôn, Nagi nhìn tôi bằng đôi mắt đầy ngạc nhiên."
3444 = "Có người qua lại.\\nTôi ghé sát miệng vào tai Nagi."
3446 = "Cùng Nagi, thỏa sức vẫy vùng và ngâm mình trong làn nước.\\nChỉ việc làm thế thôi, cũng đã thấy rất vui rồi."
3449 = "Vấn đề là, cái nơi mà em ấy đã thay đồ bơi.\\nBộ đồ bơi được giao đến nhà tôi, Nagi đã……ngay lập tức——"
3451 = "Ra vậy, một cách làm rất dễ hiểu.\\nTôi cũng sẽ suy nghĩ nghiêm túc."
3453 = "Hửm? ……Sao vậy.\\nĐột nhiên Nagi im bặt."
3455 = "Vì thế, chúng tôi nắm chặt tay nhau.\\nĐể cùng nhau bước tiếp sang mùa tới, và cả những mùa sau nữa."
3456 = "Và ở đó, đũng quần——\\nkhe rãnh của Nagi ập xuống."
3459 = "Dùng máy dập huy hiệu ép xuống,\\nthế là một chiếc huy hiệu xinh xắn đã hoàn thành."
3461 = "Đám cỏ trong không gian được bao quanh bởi cây cối này đã được cắt tỉa gọn gàng,\\nthậm chí còn được trải sẵn cả tấm bạt nilon."
3468 = "Quá gợi tình.\\nChỉ có từ đó là lấp đầy tâm trí tôi lúc này."
3470 = "Không phải cọ xát, cũng chẳng phải tuốt, mà là đang đùa giỡn.\\nKhông phải là chuyển động nhằm mang lại khoái cảm cho tôi."
3472 = "Em cẩn thận dùng ngón tay quệt lấy, rồi nuốt trọn.\\nVui quá. Vui quá. Thực sự rất vui."
3474 = "Em lại dùng vai huých huých tôi.\\nNagi là vậy đấy, cảm xúc và hành động rất dễ liên kết trực tiếp với nhau."
3476 = "Cứ mải miết liếm láp, mút mát theo nhịp độ của riêng mình.\\nChầm chậm, từ từ, tuốt dọc thân dương vật, rồi xoa nắn."
3478 = "Núm vú đáng yêu phơi bày ra ngoài——"
3481 = "Chỉ dùng lưỡi, em liếm láp mặt dưới phần đang cương cứng.\\nGiống như đang thưởng thức một que kem, chỉ liếm láp liên tục."
3483 = "Sau một hồi dụi dụi để lại mùi hương trên người tôi,\\nNagi chậm rãi——"
3484 = "Nhỏ bé, đáng yêu, mang mùi hương của mặt trời, ấm áp.\\nChỉ bấy nhiêu thôi, cũng đủ khiến tôi hạnh phúc đến nhường này."
3486 = "Chẳng có chỗ nào để tự do di chuyển cả."
3489 = "Những ngón tay nhỏ nhắn nắm lấy thân dương vật di chuyển lên xuống,\\ntừ từ, từ từ tăng tốc."
3491 = "Em gõ nhẹ một cái cốc lên trán tôi.\\nSau đó ngó ngoáy, nhìn ngó xung quanh."
3493 = "Tai bị kéo.\\nMá bị chọc chọc."
3495 = "Mặc sẵn đồ bơi bên trong để cởi cho nhanh, rồi quên mang theo đồ lót để thay.\\nĐó là chuyện thường tình của học sinh……mà………………hả?"
3497 = "Em cọ cọ đầu vào tôi làm nũng."
3498 = "Sự đáng yêu đó, cũng có thể nói là rất dễ đắc ý.\\nÔng Minokasa hay phu nhân đều biết rất rõ điều đó, nên……"
3500 = "Ánh mắt em, dõi theo ngón tay tôi.\\nRồi rơi xuống cơ thể Nagi, nơi đầu ngón tay tôi đang chỉ vào."
3503 = "Vẫn giữ nguyên nụ cười đó, lưỡi em trườn qua mặt dưới quy đầu."
3505 = "Không phải là nụ cười. Mà là một khuôn mặt cứng đờ vì căng thẳng."
3506 = "Rồi lại chuyển sang chuyện mặc đồ bơi chững chạc hơn sẽ hợp hơn,\\nthế là cả hai cùng đi tìm——và giờ thì thành ra thế này đây."
3509 = "Rất sướng, nhưng cũng rất bức bối."
3511 = "Khó chịu, bức bối, nôn nóng.\\nTôi muốn một kích thích mạnh mẽ, trực tiếp hơn nữa."
3513 = "Nếu chưa một lần được sử dụng đúng với mục đích vốn có,\\nmà đã bị lột khỏi cơ thể và vứt sang một bên."
3515 = "Chỉ tặng quà đặc biệt cho riêng Nagi.\\nĐiều đó chắc chắn, sẽ làm tổn thương Fukami."
3518 = "Nếu Hachiroku tìm thấy thì còn đỡ.\\nEm ấy sẽ cười khổ, rồi chắc chắn sẽ giấu đi giúp."
3519 = "Nếu bơi ra dòng chính thì sẽ nguy hiểm đến tính mạng.\\nCòn vùng nước đọng nhỏ bé như nơi trú ẩn này thì lại quá chật hẹp để chạy trốn."
3524 = "Vết cháy nắng in hằn từ bộ đồ bơi quy định của trường,\\nlàm nổi bật lên làn da trắng ngần của Nagi."
3526 = "Như đang khao khát tôi, đang giục tôi mau cắm vào,\\ntừng giọt ái dịch rỉ ra, quằn quại."
3534 = "Xếp hình mẫu, màng bọc lên huy hiệu rồi đặt vào máy——"
3542 = "Giống như một thiếu nữ đang phân vân,\\nkhông biết có nên gõ cửa nhà người mình thương hay không."
3559 = "Chớp mắt, danh sách đã biến thành một bảng so sánh.\\nGiữa \"trẻ con\" và \"chững chạc\"."
3560 = "Sống lưng tôi chợt lạnh toát.\\nCuối hè, đang đến rất gần rồi."
3563 = "Từ phía tinh hoàn hướng về phía quy đầu,\\nmột làn sóng co thắt siết chặt đang ập tới."
3568 = "Huy hiệu nguyên bản của Đường sắt Ohito. Một cái bốn trăm yên.\\nTuy giản dị, nhưng đây cũng là một nguồn thu nhập quan trọng."
3572 = "Phải làm sao đây……Không, học theo bà nội của Nagi,\\nlúc này, hãy thử thay đổi hoàn toàn góc nhìn xem sao."
3580 = "Tôi liên tục thay đổi góc độ, nhưng chỉ nhắm vào một điểm mà tấn công dai dẳng.\\nMồ hôi và nước bọt nhỏ xuống ròng ròng, Nagi liên tục ưỡn người lên."
3581 = "Không phải là em đang cự tuyệt.\\nĐể truyền đạt điều đó, tôi dùng đầu ngón tay khẽ vuốt ve đôi môi em."
3582 = "Tôi muốn ngắm nhìn em thật kỹ, thật lâu,\\nnhưng bây giờ phải tránh ánh mắt của mọi người đã."
3585 = "Tôi thử suy nghĩ, nhưng thực sự không hiểu.\\nHai má Nagi phồng lên, trông như đang dỗi."
3594 = "Tôi dừng lại, chỉ tay.\\nChuyển động của Nagi cũng khựng lại."
3596 = "Tôi ngoan ngoãn nằm xuống theo chỉ dẫn,\\nnụ cười của Nagi ở ngay bên cạnh——hửm?"
3597 = "Từ trung tâm thương mại đến cửa hàng đồ thể thao,\\nthậm chí cả cửa hàng quần áo cũ, chúng tôi đã cẩn thận tìm kiếm nhưng——"
3598 = "Chúng tôi rảo bước nhanh, đi xuyên ra đến tận đường lớn."
3599 = "Chúng tôi chỉnh lại đồ bơi, ngâm mình xuống sông,\\nrửa trôi mồ hôi và nước bọt."
3600 = "Cơ thể, cũng gần như áp sát vào nhau.\\nĐầu của Nagi, đang ở ngay trước mũi tôi."
3601 = "Cả lúc nói chuyện về đồ hiệu,\\nNagi cũng rất để ý đến giá cả——"
3602 = "Từ chuyện giờ học bơi, đến chuyện đồ bơi quy định của trường,\\ntôi khen em mặc hợp nhất thế giới thì em lại phụng phịu."
3604 = "Chiếc máy tính làm việc được cấp phát."
3607 = "Tôi ngăn bàn tay đang định vén áo thun lên của em lại,\\nrồi vuốt ve bụng Nagi qua lớp áo."
3608 = "Dương vật vừa mới xuất tinh, lại tràn trề sức lực.\\nNgay lập tức, hình dáng cương cứng trở lại."
3610 = "Có vẻ thích thú khi thấy nó cử động,\\nNagi cười khúc khích, một nụ cười ngây thơ——!?"
3612 = "Mút lấy dòng nước bọt rỉ ra từ khóe miệng, liếm đi những giọt nước mắt,\\nhút nhẹ đầu mũi, rồi hết lần này đến lần khác, tìm đến đôi môi em."
3614 = "Nagi và tôi, cả hai đều ngoảnh mặt đi ngay sát nút,\\nnhưng vừa nãy——đúng là hú hồn——à không."
3615 = "Tôi đỡ người dậy, rồi hôn em."
3618 = "Muốn chạm vào. Muốn liếm láp.\\nÍt nhất phải nói ra dục vọng này, nếu không tôi sẽ nổ tung mất."
3620 = "Tôi muốn chủ động di chuyển,\\nthậm chí muốn chà đạp khoang miệng nhỏ bé của Nagi."
3626 = "Chỉ còn mỗi đầu quy đầu mắc lại——\\nTôi kéo khoảng cách giữa tôi và Nagi ra xa đến mức giới hạn đó trong chốc lát."
3627 = "Suýt chạm vào.\\nTôi đưa ngón tay lại gần đến mức có thể cảm nhận được nhiệt độ, rồi lập tức rụt lại."
3628 = "Khi tôi đưa cả thùng các tông cho em,\\nNagi nở một nụ cười nhếch mép, trông có vẻ táo bạo."
3629 = "Tôi ép phần đũng quần, phần dương vật đã cương cứng cứng ngắc của mình,\\nqua lớp quần, áp sát vào đũng quần của Nagi."
3630 = "Người phụ nữ nhỏ nhắn, trầm lặng ở phía sau tiệm rèn Minokasa,\\ntôi chỉ có ấn tượng như vậy về bà ấy nhưng……"
3633 = "Tôi gập ngón trỏ lại như chiếc móc,\\nrồi gãi gãi, vuốt vuốt."
3635 = "Tôi đang mong đợi \"lời của Nagi-sama\".\\nTôi muốn tuân theo, và được dẫn dắt bởi điều đó."
3636 = "Từ chiếc hộp có nét chữ của Paulette đang trông chừng, tôi lấy ra hình mẫu, màng bọc,\\nvà cả những chiếc huy hiệu trống."
3638 = "Tôi cố tình rút ra ngược với làn sóng co thắt.\\nRồi từ đó dồn toàn bộ sức lực——"
3639 = "Tôi chợt nhớ đến chú mèo con từng thấy ở căn hộ của người bạn trên Đế đô.\\nNó nhào nặn chiếc chăn, rồi mút lấy mút để như đang cố bú sữa."
3642 = "Đồ bơi nữ như thế nào thì trông chững chạc……\\nTôi cố suy nghĩ, nhưng hoàn toàn không mường tượng ra được gì."
3643 = "Tôi muốn trao cho em một nụ hôn sâu bao nhiêu cũng được,\\nvà tất nhiên là cả những chuyện hơn thế nữa."
3645 = "Tôi muốn Nagi. Muốn bắn vào trong Nagi.\\nChỉ vì điều đó, mà não bộ tôi dần trở nên vẩn đục."
3648 = "Rút kinh nghiệm từ thất bại lúc nãy.\\nTôi nhẹ nhàng xoa đầu em."
3650 = "Tôi kéo bàn tay đang nắm lấy, ôm em vào lòng."
3653 = "Tôi chủ động ôm chặt lấy Nagi.\\nTrên cơ thể tôi, trên cơ thể Nagi. Nước bám trên người dần trở nên ấm áp."
3654 = "Tôi liên tục xoa đầu em. Cảm giác chạm vào mái tóc hơi cứng thật dễ chịu.\\nNagi cũng có vẻ mặt như sắp phát ra tiếng rừ rừ trong cổ họng."
3656 = "Nagi của một người phụ nữ,\\nnhưng đồng thời, tôi cũng nhận ra em vẫn là một Nagi thiếu nữ."
3658 = "Có vô số điều \"Làm thế nào thì được\" hiện ra trong đầu,\\nnhưng trước mắt, hãy giải quyết việc này đã."
3660 = "Vì mong đợi được làm tình, nên tối qua tôi đã tắm rửa sạch sẽ.\\nHơn nữa lại còn vừa bơi dưới sông, nên chắc mồ hôi cũng bị trôi đi hết rồi."
3662 = "Không cần phải tưởng tượng, tôi gật đầu ngay lập tức."
3664 = "Rốt cuộc sẽ là bộ đồ bơi như thế nào đây,\\ntừ bây giờ tôi cũng, rất mong chờ——đấy!"
3665 = "Nagi-sama, tôi sẽ không nịnh nọt như vậy đâu.\\nChỉ cần nói ra sự thật, thế là đủ rồi."
3668 = "Tôi dùng tay trái tóm lấy Nagi,\\ntay phải xoa đầu em, ngoan nào, ngoan nào."
3670 = "Có lẽ vì giật mình trước sức bật của dương vật cương cứng đập vào bụng,\\nNagi thốt lên một âm thanh thật giống con gái."
3672 = "Tôi liên tục ép phần cương cứng vào người em.\\nChỉ vậy thôi, cũng đã sướng đến mức muốn xuất tinh rồi."
3674 = "Tiếng kêu, cùng với tinh dịch bị hút cạn.\\nHông, cơ thể tôi run lên bần bật."
3676 = "Máu trong người sục sôi——tôi hoàn toàn cương cứng đến tột độ.\\nChỉ muốn đè Nagi xuống ngay lập tức."
3678 = "Giật thót.\\nCơ thể tôi nóng ran."
3679 = "Cùng với kích thích không ngừng nghỉ lên quy đầu,\\nchuyển động của tay cũng bắt đầu có nhịp điệu."
3682 = "——Dáng vẻ của Nagi, dần hiện ra."
3683 = "Em ép sát cơ thể vào tôi.\\nNhiệt độ của Nagi càng làm tăng thêm thân nhiệt của tôi."
3685 = "Thật đáng tiếc, bản thân tôi cũng\\ngần như chưa từng có kinh nghiệm mua sắm ở Kumamoto hay Yatsushiro."
3688 = "Thuận theo yêu cầu của Nagi, tôi lăn người lại, ngửa mặt lên trời.\\nQua kẽ lá, tôi nhìn thấy bầu trời——"
3689 = "Tôi bắt đầu lo lắng và vểnh tai lên nghe——thì——"
3692 = "Sướng nhưng lại rất bức bối.\\nCàng được làm ướt thì lại càng khát khô."
3693 = "Khi tôi chủ động chọc nhẹ vào em,\\nđầu lưỡi Nagi giật mình rụt lại như thể muốn trốn chạy——"
3697 = "Mà nói đúng hơn, tôi vẫn chưa nhớ đến đoạn đó."
3698 = "Lần đầu tiên tôi nghe thấy luật lệ như vậy.\\nNhưng tôi cũng chẳng có đường nào chống cự."
3699 = "Tôi tiến lại gần Nagi.\\nÔm em vào lòng."
3700 = "Báo trước việc sắp xuất tinh.\\nNhưng Nagi không hề tăng tốc. Không hề chiều chuộng kẻ thua cuộc là tôi."
3708 = "Tự vỗ vào hai má để xốc lại tinh thần,\\nem đón lấy thùng các tông từ tay tôi một cách chắc chắn."
3717 = "Chèo thuyền, luyện kiếm, rồi còn xúc than dồn toa mỗi ngày.\\n——Cơ bắp chắc hẳn phải mệt mỏi lắm."
3719 = "Sau đó Nagi lại ngó ngoáy xung quanh——!?"
3720 = "Không một tiếng động, tấm cửa lùa từ từ mở ra."
3727 = "Thình thịch thình thịch——\\nNhịp đập của Nagi và nhịp đập của tôi hòa quyện vào nhau khi chưa kịp bình tĩnh lại."
3728 = "Camera an ninh.\\nNhớ đến sự tồn tại của nó, tôi kìm hãm lại dục vọng nguy hiểm đang dâng trào."
3732 = "Một Nagi ngây thơ trong sáng, đã bị cơ thể tôi, làm cho thay đổi.\\n——Cảm giác tội lỗi và cảm giác chinh phục, cùng lúc trào dâng."
3734 = "Tay em, bắt đầu chuyển động.\\nTrong khi vẫn ngậm lấy quy đầu một cách ngọt ngào, tay Nagi bắt đầu di chuyển."
3736 = "Huống hồ gì là đồ bơi.\\nGiả sử có ra đến tận trung tâm Kumamoto đi chăng nữa……Không."
3737 = "Chuyện này, vui thật đấy."
3741 = "Phần thừa đáng lẽ——đã nuốt hết,\\nlại bắn lên mặt Nagi."
3751 = "Chính vì sự lo lắng của Nagi quá đỗi tự nhiên,\\nnên tôi lại càng cảm thấy như vậy."
3764 = "Đúng là vậy. Nếu tiêu xài vượt quá mức kiếm được,\\nthì chỉ còn cách tăng thời gian làm việc lên để kiếm thêm tiền."
3768 = "Để xua đi hình ảnh kỳ quặc đó, tôi nói thành lời."
3769 = "Để dạy em cách dùng chuột,\\ntay phải của tôi đang đặt lên tay phải của Nagi——bàn tay phải nhỏ bé ấy."
3778 = "Chi phí bảo trì và thu nhập từ phí sử dụng chỉ bù trừ cho nhau, và Nagi, với tư cách là phụ lái tàu,\\nbiết rõ mức lương của Lái tàu theo quy định là bao nhiêu."
3779 = "Lúc này cứ ngoan ngoãn nương theo cảm xúc của Nagi thôi."
3780 = "Thùng các tông bay vèo đi.\\nTôi khó khăn lắm mới đỡ được Nagi."
3784 = "Có vẻ như em định mặc quần áo trùm ra ngoài đồ bơi."
3787 = "Trắng xóa. Đầu óc trống rỗng."
3798 = "Đúng là, suýt chút nữa.\\nĐầu ngón tay Nagi sượt qua người tôi."
3799 = "Đúng là, bộ đồ bơi sẽ thấy trống rỗng lắm."
3808 = "Tiết kiệm là để buổi hẹn hò tiếp theo đến sớm hơn——\\nCũng đồng nghĩa với việc tăng thêm thời gian tự do."
3826 = "Lại còn hòa quyện với sự nhạy cảm mãnh liệt,\\nnên có bay bổng đôi chút cũng là điều dễ hiểu."
3828 = "Hơn nữa, thứ ở bên cạnh khuôn mặt đó,\\nkhông phải là mặt tôi——mà là phần nhô lên ở đũng quần tôi."
3830 = "Gần như toàn bộ cơ thể đều phơi bày——\\nBộ đồ bơi chỉ che đậy những bộ phận nhạy cảm một cách vô cùng khiêm tốn."
3833 = "Em nói lớn.\\nTừ vòng người đang đứng từ xa nhìn chúng tôi vang lên những tiếng cười khúc khích."
3834 = "Giọng nói nhỏ nhẹ——nhưng đích thực là của một người phụ nữ.\\nMùi hương của Nagi, lại gần đến thế này."
3837 = "Ngẩng mặt lên khi nghe thấy giọng nói chán nản đó,\\ntôi thấy Nagi đang chỉ tay vào màn hình."
3838 = "Không phải là giọng điệu của một người nói mà không hiểu ý nghĩa.\\nQuá ngạc nhiên, tôi bất giác lặp lại như một con vẹt."
3842 = "Đũng quần bơi, bị kéo sang một bên.\\nKhe rãnh của Nagi, khe rãnh đáng yêu ấy phơi bày ra."
3853 = "Khoái cảm chưa từng biết đến từ trước đến nay, trào ra từ lỗ niệu đạo——!"
3854 = "Không biết là do vật lộn nãy giờ, hay là từ trước đó,\\nmà từ lúc nào, đồ bơi của Nagi đã bị xộc xệch."
3866 = "Cảm giác vuốt ve nhè nhẹ lên mái tóc có lẽ lại mang đến sự dễ chịu,\\nđôi mắt Nagi nheo lại trong chốc lát."
3880 = "Vừa dứt lời, tôi chộp lấy mông em——"
3881 = "Đang nói dở, Nagi lắc đầu nguầy nguậy."
3882 = "Một khi Nagi đã nghiêm túc thì chuyển động của em quả nhiên rất sắc bén.\\nLại còn ở dưới nước nữa, nên tôi dần dần bị dồn vào đường cùng."
3885 = "Nói xong Nagi liền dán mắt vào máy tính,\\nnhưng ngay lập tức, em nghiêng đầu hỏi tôi."
3886 = "Vừa nói, tôi vừa nâng hông Nagi lên."
3908 = "Theo đà đó, mồ hôi, nước bọt,\\nnhỏ xuống bụng tôi, mang theo sự nhớp nháp."
3909 = "Không phải là khoái cảm có thể dẫn đến xuất tinh.\\nHơn nữa, ngay trước mắt tôi là——"
3910 = "Cũng phải thôi, chật chội đến mức này,\\nhơn nữa những nếp gấp thịt bên trong âm đạo lại còn bám dính lấy như đang làm nũng thế kia."
3911 = "Thật thú vị. Sự sắc sảo mà Nagi thỉnh thoảng bộc lộ——\\nTôi có cảm giác như mình đã nhìn thấy cội nguồn của nó."
3912 = "Không ổn rồi.\\nMọi người đang bắt đầu đứng từ xa nhìn chúng tôi."
3913 = "Vì thế, phần cương cứng lại giật giật."
3914 = "Đúng nghĩa đen, đây có lẽ là căn cứ bí mật của Nagi."
3915 = "Tiếng kêu của khoái cảm. Tiếng kêu của một người phụ nữ."
3916 = "Dù là lần đầu tiên mua đồ cá nhân trên mạng, nhưng chỉ mất hai ngày,\\nhàng đã được giao đến tận nhà an toàn."
3917 = "Giọng nói nghe thật não nề. Giọng nói vút cao.\\nNagi đã hoàn toàn động dục, trở thành một con cái."
3918 = "Cứ thế này thì thành trò cười cho thiên hạ mất.\\nTôi lấy tay che miệng Nagi lại, rồi cố tình cất giọng ngọt ngào bên tai em."
3919 = "Nói ra những lời thật thiếu nữ làm sao.\\nThật đáng yêu, và tôi muốn bảo vệ em."
3921 = "Trong lúc đó, thật đáng tiếc,\\nNagi cũng đã trở lại bình thường."
3922 = "Âm đạo đang bị phơi bày, đang bị bắt nhịn——\\nÂm đạo mà tôi không được phép chạm vào cho đến khi được cho phép, đang giật giật."
3924 = "Màu sắc của chiếc áo thun cũ kỹ, vốn dĩ là màu trắng ấy,\\nđích thị là màu vô sắc rồi."
3926 = "Chỉ đơn giản là kết nối. Làm tình.\\nDùng cơ thể của nhau, giáng cho nhau những đòn khoái cảm."
3938 = "Lại một loạt,\\nnhững bộ đồ bơi nữ đủ màu sắc hiện ra trong chớp mắt."
3942 = "Để quy đầu hôn lên tử cung——\\nVì khoái cảm đó, em điên cuồng nhảy múa."
3943 = "Quy đầu đã vượt qua chỗ chật hẹp ở cửa mình,\\ndù bên trong vẫn vô cùng chật chội nhưng——"
4005 = "（Nhưng, mà——）"
4009 = "（Phụt! ——Phụt——Phụt——Phụt……）"
4010 = "（Phụt! Phụt! Phụttt! Phụt!）"
4011 = "（Phụt!）"
4015 = "（Hửm）"
4016 = "（A……Nagi, đã trở thành một người phụ nữ rồi nhỉ）"
