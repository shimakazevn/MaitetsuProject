1521 = "Chiếc lưỡi ngắn đỏ chót của Nagi liếm ướt đôi môi mình."
1524 = "Có lẽ vì muốn tôi nhanh chóng cắm vào, Nagi cứ liên tục ép sát đũng quần vào tôi, cọ xát không ngừng."
1525 = "Có vẻ em đã nhớ ra. Nagi đỏ bừng má, hai bắp đùi thon thả bẽn lẽn cọ vào nhau."
1529 = "Nagi đang bối rối tìm từ ngữ. Rất đáng yêu, nhưng cũng thật sốt ruột. Sự chịu đựng của tôi cũng đã đến giới hạn rồi——"
1530 = "Nagi đó, đang nói về ý nghĩa thực sự của tình dục. Em hiểu điều đó, và hơn thế nữa, em đang mong muốn điều đó từ tôi."
1533 = "Nagi nghiêng đầu thật sâu, khẽ gầm gừ một tiếng——! Sau đó, em bắt đầu lắc mông thật chậm, thật chậm."
1535 = "Nagi từ từ kéo quần lót xuống. Một đường rãnh dọc cực kỳ đơn giản, để lộ ra hình dáng đáng yêu."
1537 = "Nagi uốn cong lưỡi làm rãnh, rót nước bọt vào miệng tôi. Tôi mút lấy, thưởng thức rồi nuốt xuống cổ họng. Sự cương cứng càng lúc càng nóng rực."
1539 = "Nagi lên đỉnh trong khi liều mạng kìm nén giọng nói. Quanh miệng tôi vốn đã dính đầy ái dịch, nay lại càng ướt đẫm thêm bởi những giọt nước mới."
1542 = "Sự mệt mỏi tích tụ trên lưỡi sau một hồi hoạt động liên tục để vuốt ve, đã được Nagi nhẹ nhàng liếm sạch."
1543 = "Giọng nói ngọt lịm, phát tình đến cực điểm. Giọng nói của một con cái. Giọng nói của Nagi, người cũng giống như tôi, từng chẳng hề có hứng thú hay kiến thức gì về tình dục."
1545 = "Ái dịch của Nagi hầu như không có vị gì. Thế nhưng, khi liên tục dùng đầu lưỡi chọc vào lỗ niệu đạo, tôi cảm nhận được chút vị mặn——"
1547 = "Vòng tay Nagi ôm chặt lấy đầu tôi. Mùi mồ hôi và mùi hương của Nagi thoang thoảng truyền từ lỗ mũi lan tỏa trong tâm trí tôi."
1548 = "Tay Nagi nhẹ nhàng chạm vào sự cương cứng của tôi, đầu ngón tay bắt đầu miết dọc theo hình dáng của quy đầu."
1551 = "Giọng nói của Nagi rõ ràng cũng tăng thêm phần ướt át và ngọt ngào. Chúng tôi đang chia sẻ khoái cảm này——nghĩ vậy, hông tôi bắt đầu tăng tốc."
1553 = "Khe ngực chẳng có lấy một chút nhấp nhô, nhưng chắc chắn là mềm mại ấy, tôi dùng lưỡi, môi và đầu ngón tay để vuốt ve triệt để."
1555 = "Nagi giật nảy mình!!! Đôi chân tôi đang ôm vùng vẫy dữ dội. Âm đạo siết chặt lấy tôi, cố gắng kéo tôi vào sâu, sâu hơn nữa"
1557 = "Nagi nhìn tôi. Cúi xuống nhìn cơ thể phẳng lỳ của mình, rồi lại nhìn tôi."
1570 = "Kích cỡ để có thể nắn bóp, dù em đang nằm sấp thì tôi vẫn không cảm nhận được. Thế nên——"
1582 = "Nagi mở to đôi mắt vốn dĩ đã tròn xoe của mình, chằm chằm nhìn vào sự cương cứng của tôi rồi chu mỏ lên."
1583 = "Dễ thương quá. Gợi tình quá. Bộ đồ lót này hở hang thật đấy. Đôi tai và chiếc đuôi càng làm tăng thêm sự dâm đãng của nó."
1593 = "Niềm hạnh phúc ấy phình to, chực chờ đẩy toàn bộ dịch thể ra ngoài. Cả tinh dịch, mồ hôi và nước mắt, nếu không kìm nén thì sẽ tuôn trào mất."
1600 = "Khoảnh khắc nhận ra điều đó, lần này đến lượt tôi hóa thành mãnh hổ."
1612 = "Tôi thè lưỡi ra lướt qua, lặp lại chuyển động giống như lúc nãy. Vừa liếm sạch ái dịch tuôn trào, vừa làm cứng và nhọn đầu lưỡi"
1613 = "Tôi thè lưỡi ra cho em thấy. Rồi cứ thế tiến lại gần nụ hoa nhỏ nhắn, đáng yêu của em."
1614 = "Khi tôi đáp lại nụ hôn như em mong muốn, Nagi liên tục đáp trả bằng những nụ hôn ngọt ngào, nhẹ nhàng như chú chim nhỏ mổ mồi."
1616 = "Vừa hôn, khuôn mặt và cơ thể em nhẹ nhàng cọ xát vào tôi. Mùi hương và hơi ấm của Nagi lấp đầy toàn thân tôi, khiến tôi cảm thấy ấm áp vô cùng."
1617 = "Khi nụ hôn kết thúc, Nagi cọ mũi vào tôi. Không chỉ vậy, em còn cọ cả má, trán, toàn bộ khuôn mặt."
1619 = "Tôi lại ghé mặt, đưa môi sát vào em. Cứ tưởng sẽ bị ghét, nhưng Nagi lại ngoan ngoãn chấp nhận."
1623 = "Khoảnh khắc tôi tưởng mình đã xuất tinh hết thì lại bị siết thêm một cú, tinh hoàn trống rỗng đến mức phát đau."
1624 = "Vừa dùng ngón tay vạch ra, ái dịch đã tuôn trào. Từ cơ thể vốn ít mùi của Nagi tỏa ra một mùi hương đặc trưng của con cái."
1626 = "Tôi muốn xuất tinh ngay bây giờ. Muốn pít-tông bằng tất cả sức lực. Tôi kìm nén dục vọng đó chỉ để được nghe Nagi nũng nịu thêm."
1630 = "Tôi lướt môi dọc theo khe hở. Vẫn chưa tiến vào sâu, chỉ dùng môi nhẹ nhàng vuốt ve môi lớn."
1631 = "Tôi đang rót thứ tinh dịch đặc đặc hơn nhiều so với lần bùng nổ vừa nãy, vào tử cung Nagi——nơi tạo ra em bé."
1632 = "Tôi ép quy đầu vào và ấn nhẹ vào một chút, Nagi lập tức cất lên tiếng rên rỉ sung sướng đầy chân thật."
1634 = "Vì muốn em tập trung vào lưỡi nên tôi cố tình ngó lơ nãy giờ, để rồi bất ngờ mút lấy âm vật của em."
1635 = "Cái hông đã hoàn toàn mất phanh của tôi, đang bị lý trí cưỡng ép sửa chữa, tôi nghiến răng kìm nén lại."
1636 = "Chỉ cần phát ra tiếng hay thở hắt ra thôi là tôi sẽ tuôn trào mất. Nhưng vì muốn cùng ra với Nagi, tôi liều mạng kìm nén lại."
1639 = "Tôi vội vàng đưa tay ra sau đóng cửa kéo lại. Dù là đêm chỉ có hai người, nhưng vẫn phải cẩn thận."
1640 = "Tôi kéo khóa quần xuống và phơi bày bộ phận sinh dục của mình ra. Nó cương cứng và cong vút đến mức tôi phải chật vật mới lấy ra được."
1643 = "Kìm nén cái hông đang muốn pít-tông hết tốc lực, tôi ấn đầu quy đầu ngoáy liên tục vào nơi sâu nhất của âm đạo, vào tận cửa tử cung."
1644 = "Thay vì nụ hôn quấn lấy lưỡi, tôi dùng quy đầu ngoáy liên tục, hôn lên cửa tử cung em."
1646 = "Tôi làm theo lời em, nắm lấy chiếc đuôi nhấc lên——hừm. Bên trong có dây thép sao. Thiết kế này cũng hợp lý đấy."
1649 = "Bắn ra mất rồi. Thật thảm hại. Thật xấu hổ. Nhưng, đã lỡ xuất tinh rồi thì phải tận dụng thứ tinh dịch này——"
1650 = "Tôi bọc răng lại bằng môi, dùng đôi môi ấy cắn nhẹ nhũ hoa em, Nagi cất lên tiếng rên rỉ ngọt ngào xen lẫn chua xót."
1653 = "Tôi dùng môi bao trọn lấy xung quanh, đầu lưỡi cố tình tránh đi phần cốt lõi, liên tục chọc chọc chọc chọc vào xung quanh để trêu chọc em."
1654 = "Tôi dùng lòng bàn tay vuốt ve mềm mại rồi ấn vào, dùng ngón tay nhẹ nhàng, thật nhẹ nhàng nhúm lấy nhũ hoa, cọ xát rồi bóp nát——!"
1657 = "Tôi dùng ánh mắt ra hiệu. Cho em thấy hai đầu nhũ hoa nhỏ xíu của Nagi cũng đã cương cứng lên rồi."
1659 = "Dương vật cương cứng đến phát đau. Tôi muốn em chạm vào ngay lập tức, muốn em liếm nó, muốn cọ xát, muốn cắm vào."
1661 = "Dương vật cương cứng đến phát đau. Tôi muốn cắm vào và xuất tinh vào trong âm đạo một cách thỏa thích. Liều mạng kìm nén toàn bộ thú tính, tôi cẩn thận, vô cùng cẩn thận dùng đầu lưỡi——"
1663 = "Tôi rời miệng khỏi cô bé đang co giật liên hồi, và trao cho Nagi nụ hôn theo đúng như em nũng nịu mong muốn."
1664 = "——Tự mình nắm lấy và nhắm bắn, tôi mới nhận ra. Sự cương cứng của tôi, có lẽ vì bất ngờ trước cảm giác lạ lẫm của chiếc găng tay, nên mới bùng nổ."
1666 = "Tôi nhấc bổng cơ thể Nagi lên, bắt em xoay mông lại. Dùng dương vật vẫn đang giật giật cọ nhẹ vào khe hở."
1668 = "Chỉ kết nối với nhau bằng sự cương cứng mà tôi có cảm giác như toàn thân được bao bọc. Bằng cách cắm vào nơi sâu nhất, tôi như đang ôm trọn lấy toàn bộ con người Nagi."
1670 = "Chính tôi đã biến Nagi thành phụ nữ. Và cùng với Nagi, tôi đã trưởng thành như một người đàn ông. Sự bùng nổ của cảm xúc đó, hiện tại tôi đành kìm nén lại trong tinh hoàn."
1673 = "Tôi hôn nhẹ lên trên lớp bao quy đầu, rồi lại cố tình dùng chuyển động tương tự, lần này là dùng đầu lưỡi vuốt ve dai dẳng lên chính phần thân âm vật."
1674 = "Tôi muốn tỏ ra thong dong mà trêu chọc em, nhưng bên trong âm đạo của Nagi thật quá tuyệt vời. Có lẽ vì bất ngờ, nó siết chặt lấy tôi như muốn nghiền nát."
1680 = "Toàn bộ âm đạo đang co bóp. Phối hợp với đó, cửa tử cung cũng nhóp nhép như đang khát oxy, cố gắng ngậm lấy quy đầu."
1692 = "Nơi sâu nhất mút lấy, sự co bóp phản kháng lại, cả hai kết hợp vắt kiệt tôi. Chuyển động ra vào của hông đơn giản là sướng không chịu nổi."
1694 = "Ngay khi tôi đang tận hưởng cảm giác quấn lấy chiếc lưỡi vừa luồn qua môi mình—— Nagi đột ngột quay đầu đi."
1700 = "Khi tôi gục xuống vì quá mệt mỏi, Nagi cũng gục xuống ôm chầm lấy tôi, và chúng tôi trao nhau nụ hôn say đắm."
1704 = "Nghe tôi nhấn mạnh từ \"hay làm gì đó\", Nagi bẽn lẽn. Sự vui sướng, xấu hổ và dục vọng của người phụ nữ hòa quyện, nhuộm đỏ khuôn mặt em."
1718 = "Sự co bóp quá mạnh mẽ, dù đã ướt át đến nhường này, nhưng tôi vẫn cảm nhận được sức kháng cự như thể đang bị xé toạc ra."
1719 = "Không có vằn hổ mới là chính xác. Nagi là một chú mèo con. Dù có nanh vuốt, em vẫn mãi là một chú mèo con vô cùng đáng yêu."
1721 = "Âm đạo siết chặt lại, co bóp liên hồi. Chuyển động vắt kiệt tinh dịch ấy khiến toàn bộ phần thân dưới của tôi trở nên nhạy cảm râm ran."
1730 = "Nhẹ nhàng, thật nhẹ nhàng——Khi nhịp thở của Nagi dần ổn định, sự co thắt âm đạo đau đớn cũng dịu đi đôi chút."
1734 = "Một Nagi với thể lực quái vật cũng đang thở dốc tuyệt vọng. Cố gắng ổn định lại nhịp thở đã bị những cơn sóng khoái cảm làm rối loạn."
1798 = "（Phịch）"
1799 = "（Phập——phập——ngoáy——phập）"
1800 = "（Phập! Phập! Trượt! Phập!!）"
1801 = "（Dù đã vuốt ve đến mức này, đã kề da sát thịt vô số lần…… Bộ phận sinh dục của Nagi trông vẫn hoàn toàn không khác gì lần đầu tiên nhỉ）"
1803 = "（Liếm——mút——phụt——chụt）"
1804 = "（Nhóp nhép——liếm——liếm——ngoáy）"
1805 = "（Chụt）"
1806 = "（Chụt——chụt——nắn——ngoáy——）"
1807 = "（Chụt——nắn——mút——ngoạm）"
1808 = "（Ngoạm! Chụt! Mút! Liếm!）"
1809 = "（Phụt——phụt——phụt——phụt……）"
1810 = "（Phụt————phụt………………phụt…………）"
1811 = "（Phụt! Phụt! Phụt! Phụt!!）"
1812 = "（Phụt! Phụt! Phụt! Phụt!）"
1813 = "（Phập! Phập! Phập! Phập!）"
1814 = "（Phập! Phập! Phập! Ngoáy!）"
1815 = "（Phập! Phập!）"
1816 = "（Phập!!!!）"
1817 = "（Nhóp nhép）"
1818 = "（Phập——phập! Phập——phập!）"
1819 = "（Chụt——chụt——chụt——chụt）"
1820 = "（Chọc!）"
1821 = "（Phập——hự——nhóp nhép——hự——phập——）"
1822 = "（Trượttttt!!!）"
1824 = "（Kéo——Tách!）"
1825 = "（Trượt! Phập! Trượt! Phập!）"
1826 = "（Trượttttt!!）"
1827 = "（Trượt! Phập! Phập! Phập!）"
1828 = "（Phập——phập——nhóp nhép——ngoáy!）"
1830 = "（Phập! Phập! Ngoáy! Phập!!）"
1831 = "（Phập!!——Ngoáy!!）"
1833 = "（Phập!!!! Phập!）"
1834 = "（Phập!!!!!!!）"
1835 = "（Phập!）"
1836 = "（Phập——hự——phập——nhóp nhép!）"
1837 = "（Cọ cọ——cọ cọ——cọ cọ——liếm）"
1838 = "（Vuốt nhẹ）"
1839 = "（Chạm nhẹ——vuốt nhẹ——ngoáy——nắn——）"
1840 = "（Mở rộng）"
1844 = "（Siết!!!）"
1845 = "（Siết!）"
1846 = "（Liếm——ngoáy! Liếm——ngoáy!!）"
1848 = "（Liếm! Ngoáy!!!!!!）"
1850 = "（Liếm nhẹ）"
1851 = "（Liếm——liếm——ngoáy! Chụt, chụt）"
1853 = "（Chụt——chụt——liếm——chụt）"
1854 = "（Gu, gu――――phập! Ngoáy! Phập!）"
1855 = "（Tuột!!!!）"

