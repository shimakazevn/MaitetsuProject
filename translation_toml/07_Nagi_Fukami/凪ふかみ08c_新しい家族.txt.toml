2122 = "「Hai người. Ông là ông đang hỏi về cháu gái của ông đấy nhé.」"
2124 = "「Tính tình con bé không phải cản là dừng được. Chuyến đi dã ngoại gì đó, ông cũng đành từ bỏ mà để nó đi, nhưng――」"
2126 = "「Vậy thì, bắt đầu thôi.」"
2127 = "「Đã rõ!」"
2129 = "「Biết rồi! Nagi sẽ đỡ lưng cho anh!」"
2131 = "「Đã hiểu. Hay nói đúng hơn――vậy, tức là―― Cậu sẽ hướng tới việc thành lập Đặc khu sao!」"
2132 = "「Ừ.」"
2133 = "「Vâng, tất nhiên rồi! Em nghĩ mẹ sẽ rất vui đó. Vậy nên――cuộc họp……buổi trao đổi ý kiến, các ông」"
2135 = "「Như anh thấy đấy, em không sao cả! Vì anh Soutetsu đã che chắn cho em rất cẩn thận……」"
2138 = "「Nếu không có ngày nghỉ, đơn giản là sự mệt mỏi sẽ tiếp tục tích tụ…… Rồi chắc chắn sẽ lại xảy ra chuyện tương tự thôi.」"
2140 = "「Nếu anh Soutetsu và bé Fukami muốn kết hôn thì――!」"
2142 = "「Nếu nói người gần gũi nhất, quả nhiên là Paulette. Kisaki và chị Mayami có lẽ cũng liên quan――」"
2144 = "「Nếu ý tưởng của anh Soutetsu trở thành hiện thực, thì chị Paulette và Reina cũng có thể trở thành người một nhà sao ạ~」"
2146 = "「Chị là người thuộc thế hệ cũ mà.」"
2150 = "「Mảng quảng bá! Về phương diện đó, cứ để em lo!! Trông vậy chứ em là dân chuyên nghiệp đó nha! Sẽ làm tốt công việc đấy?」"
2155 = "「À đúng rồi. Xin lỗi em nhé. Hinai Reina.」"
2156 = "「Đúng vậy nhỉ! Vậy, chuyện đó tụi mình cũng chia nhau ra làm luôn!」"
2157 = "「Nagi.」"
2159 = "「Nagi! Gọi điện sẽ đánh thức anh ấy mất!!」"
2161 = "「Nagi, chuyện đó chúng ta phải dặn dò kỹ với mọi người mới được!」"
2162 = "「Bé Fukami, ăn gian quá đi~!」"
2165 = "「Cái gọi là――nhà chung――a! Không phải sao, kiểu như nơi trú ẩn? Cảm giác vậy hả??」"
2167 = "「Chuyến đi dã ngoại――phải không ạ?」"
2168 = "「Chắc là vậy rồi.」"
2172 = "「Sư phụ cũng từng nói đó! 'Nghỉ ngơi hoàn toàn cũng là một sự tu hành quan trọng'.」"
2174 = "「Làm việc nặng nhọc như thế, không có ngày nghỉ―― Thêm vào đó, cũng không được chăm sóc tử tế chút nào sao!?」"
2179 = "「Đăng ký Đặc khu~?」"
2192 = "「Lưng cũng tệ lắm luôn! Dù Nagi dùng hết sức―― Ngigigi――kua~! Ngón tay cũng không ấn xuống được chút nào!!」"
2193 = "「Sự kết nối lan rộng từ mặt phẳng, sẽ vẽ nên không gian, thậm chí là khối lập thể. Ba người chúng cháu, có lẽ đã trở thành một hạt nhân của sự lan rộng đó.」"
2196 = "「Ở Ohito cũng có đấy ạ. Những lời nhờ tư vấn như vậy, dạo gần đây.」"
2199 = "「Không chỉ doanh thu của Đường sắt Ohito, mà thu nhập thuế của thành phố Ohito cũng cho thấy sự gia tăng hơn hai mươi phần trăm so với năm ngoái.」"
2210 = "「Bảo vệ lẫn nhau, nghĩa là hình thức như thế nào nhỉ?」"
2214 = "「Chuẩn bị kỹ lưỡng đấy. Nếu cậu tiếp cận theo hướng đa thê, tôi đã định khuyên can để cậu khỏi uổng công vô ích rồi.」"
2216 = "「Nhờ Nội các đệ trình dự luật――cái đó, chị nghĩ là một rào cản cao khủng khiếp đấy.」"
2217 = "「Nhận được đánh giá như vậy tôi cũng rất vui, cảm ơn cô.」"
2219 = "「Anh thấy ổn rồi. Anh muốn từ từ ngồi dậy.」"
2221 = "「Dù đã trở thành gia đình, nhưng chẳng có gì, chẳng có chút gì thay đổi nhỉ!」"
2223 = "「Anh……đã ngã một cách tệ hại đến vậy sao?」"
2225 = "「Tôi cũng vậy, nhất định sẽ giúp ích cho ước mơ của ngài Soutetsu. Bất cứ điều gì, bất cứ lúc nào. Xin ngài cứ sai bảo.」"
2227 = "「Cháu, với Nagi, hay với Fukami cũng vậy. Đều không muốn để hai em ấy phải chịu đựng sự gò bó hay vất vả như thế.」"
2228 = "「Không phải nịnh bợ đâu. Không cần cảm ơn đâu nhé? Soutetsu. Về kinh doanh, tôi chỉ nói sự thật thôi.」"
2230 = "「Anh hoàn toàn không ngại những chuyện phiền phức. Nhưng mà, anh không mong muốn một tương lai không kết hôn với ai cả.」"
2231 = "「Em cũng, thật lòng mong muốn như vậy. Muốn được ở bên cạnh anh Soutetsu và Nagi mãi mãi.」"
2233 = "「Em cũng vậy ạ.」"
2235 = "「Tâm ý. Em cũng giống vậy. Ạ. Dù có khó khăn gian khổ thế nào. Ba người chúng ta, sẽ không để ai phải buồn đau, cùng nhau, hạnh phúc.」"
2237 = "「Em cũng vậy, khi Nagi và anh Soutetsu đi chơi, em cũng ở nhà thong thả nghỉ ngơi nhưng mà……」"
2238 = "「Anh cũng nghĩ như thế là không được. Anh không muốn tạo ra dù chỉ một chút khác biệt nào giữa Fukami và Nagi, và――」"
2239 = "「Cháu cũng nghĩ là như vậy. Vì thế cháu cũng, hoàn toàn không có ý định đụng chạm đến hình thái cơ bản đó.」"
2248 = "「Nhất định, sẽ biến Ohito―― thành 'Đặc khu Hình thái Gia đình mới'.」"
2249 = "「Ở bên nhau ba người, rất vui. Dù gặp phải khó khăn gì, nếu là ba người, thì có thể biến nó thành niềm vui.」"
2250 = "「Chỉ là, cháu không muốn rời xa. Vì ở bên nhau rất thoải mái và hạnh phúc. Mối quan hệ này, cháu muốn biến nó thành báu vật cả đời, và muốn bảo vệ nó.」"
2251 = "「Tôi không có ý định phản đối chế độ hôn nhân hiện hành. Chỉ là, tôi mong muốn có thêm một hình thái gia đình mới mà thôi.」"
2252 = "「Chỉ là, sự bảo vệ. Để ngay cả khi chúng ta không thể bảo vệ họ được nữa, họ cũng không phải gánh chịu những bất lợi hay sự bất công.」"
2253 = "「Chúng cháu đã bù đắp cho nhau, thúc đẩy sự trưởng thành của nhau―― Chúng cháu đã xây dựng được một mối quan hệ như vậy, và cũng đã mang lại kết quả.」"
2255 = "「Anh chỉ đơn giản là, muốn ba người chúng ta. Anh, Nagi và Fukami, ba người, cùng nhau xây dựng gia đình――anh muốn chúng ta trở thành người một nhà.」"
2257 = "「Cổ họng anh, khát khô rồi. Xin lỗi, nhưng mà」"
2258 = "「Để có được sự thấu hiểu đó, tôi muốn hành động.」"
2263 = "「Cháu là một kẻ có nhiều khiếm khuyết. Để bù đắp những khiếm khuyết đó, cháu đang nhờ Hayase Fukami và Minokasa Nagi cho mượn sức mạnh.」"
2264 = "「Tất nhiên rồi, rất hoan nghênh. Anh cũng sẽ đến chào hỏi riêng từng người sau, nhưng――」"
2265 = "「Chỉ một điều thôi. Ông hỏi được chứ, Soutetsu.」"
2266 = "「Điều đó, tôi hiểu.」"
2269 = "「Anh đã lờ mờ nghĩ ra vài phương án…… Nhưng hoàn toàn không biết liệu có khả thi hay không.」"
2270 = "「À ừm……chúng em, đi riêng từng người, hoặc đi chung ba người―― Cứ mỗi dịp nghỉ là lại đi ra ngoài chơi nhỉ.」"
2271 = "「Này? Sou-chan. Lập pháp hóa ấy, là chuyện có thể làm dễ dàng thế sao?」"
2275 = "「Anh cũng phải ăn tối nữa, nên từ 19 giờ đến 22 giờ anh sẽ thức. Nếu có chuyện gì cần liên lạc, thì lúc đó nhờ hai đứa nhé.」"
2276 = "「Có lẽ……vậy nhỉ. Khi trưởng thành hơn bây giờ…… Nhiều thứ, cứ thế chắc sẽ phiền phức lắm.」"
2279 = "「Chị sẽ từ từ truyền đạt tâm ý của Sou-chan cho những người cũ kỹ giống chị. Nếu là việc đó, thì chắc chắn, chị có thể giúp được một chút đấy.」"
2281 = "「Thế nên, để có thể ở bên nhau ba người mãi mãi, cháu đã suy nghĩ về đề xuất này――đề xuất gia tăng thêm một hình thái gia đình mới.」"
2283 = "「Vì vậy, một hình thái gia đình mới. Một hợp đồng gia đình có thể kết nối dưới hình thức khác ngoài hôn nhân một vợ một chồng khác giới. Cháu muốn lập pháp hóa điều đó.」"
2286 = "「Không phải của riêng anh đâu!!」\\n「Không phải của cá nhân anh đâu ạ!!」"
2290 = "「Em cũng hiểu là vậy nhưng―― Có thể nhờ cậu xác nhận lại không? Paulette.」"
2296 = "「Đặc khu Lối sống mới――」"
2298 = "「Hình thái gia đình mới ấy――với khuôn khổ gia đình từ trước đến nay, là thứ không thể……thực hiện được sao?」"
2302 = "「Hibiki.」"
2303 = "「Anh cũng nghĩ đúng như Hibiki chỉ ra.」"
2306 = "「Hibiki, cái đó ấy hả? Ừm――thì.」"
2316 = "「A」\\n「Cái đó thì」"
2320 = "「Ồ?」"
2321 = "「Vậy hả!? Bé Fukami.」"
2323 = "「Là người cháu rất yêu, là người cháu phải bảo vệ, là tiền bối quan trọng, là hậu bối dễ thương, là em gái, nhưng đôi khi lại là chị gái, là đồng đội.」"
2325 = "「Lúc em sắp ngã, anh Soutetsu đã che chở cho em, từ đó thì, cả hai cùng ngã nhào――là vậy đó ạ.」"
2327 = "「Là người yêu, là bạn thân, là cộng sự, là người cháu muốn chiều chuộng, muốn được làm nũng, không muốn rời xa, và cũng muốn dõi theo bảo vệ.」"
2329 = "「Điều đó, quả thực là vậy. Vì thế, em đang nghĩ đến việc lập pháp do nghị sĩ đệ trình, sau khi dấy lên làn sóng xã hội và được công nhận về sự cần thiết.」"
2331 = "「Đúng vậy. Hiện tại, để thiết lập quan hệ gia đình với \\x%lレイルロオド;#00ffc040;Railord%l;#;, chỉ có cách lách luật mà thôi.」"
2332 = "「Đúng vậy. Để khi nhìn vào hình ảnh của nhóm cậu Soutetsu, mọi người sẽ nghĩ rằng 'Bọn họ không thể trở thành gia đình thì thật kỳ lạ'.」"
2334 = "「Chắc là vậy rồi.」"
2336 = "「Đúng rồi ạ! Anh vừa mới ngã bệnh xong mà.」"
2337 = "「Đúng vậy!」"
2338 = "「Vâng, nhưng mà.」"
2340 = "「Đúng vậy. Đúng là thế nhỉ.」"
2341 = "「Đúng vậy, Kisaki. Thành phố Đường sắt Ohito là nơi mà con người với con người, con người với \\x%lレイルロオド;#00ffc040;Railord%l;#;, có thể trở thành một gia đình kiểu mới.」"
2343 = "「Bình hút nước sao, em chu đáo quá――đỡ quá.」"
2345 = "「Thời gian, tốt, ạ.」"
2350 = "「Anh cứ nói ra đi ạ! Chuyện nhỏ nhặt cũng được!」"
2351 = "「À ừm, có một vị khách nhỏ tuổi đang khóc―― Hình như chiếc huy hiệu cài áo bị rớt mất.」"
2352 = "「Ra là vậy.」"
2353 = "「Nagi cũng thấy vui khi ở cùng ba người đó nha~!」"
2355 = "「Trói buộc――là sao cơ?」"
2360 = "「Trường hợp kiểu mẫu?」"
2366 = "「Ví dụ như, giống với khi nhận nuôi trẻ em dưới 15 tuổi làm con nuôi, bắt buộc phải nộp đơn lên Tòa án gia đình và được cấp phép chẳng hạn.」"
2368 = "「Ví dụ như, những người độc thân mất đi bạn đời vì một lý do nào đó, sống chung với mục đích hỗ trợ cuộc sống của nhau.」"
2372 = "「Không――」"
2373 = "「Không có gì đâu ạ~」"
2374 = "「Không có chi, ạ. Em mới là người―― phải cảm ơn anh vì đã giúp em, ạ.」"
2375 = "「Không sao đâu, cái đó――Nagi, hoàn toàn không bận tâm đâu! Hai người, cứ kết hôn――đi!」"
2376 = "「Không có chuyện đó đâu!」\\n「Là do em làm mất quá nhiều thời gian.」"
2378 = "「Hiểu như vậy là không có vấn đề gì. Nếu là nghị sĩ Quốc hội được bầu tại địa phương, thì tôi cũng có đường dây liên lạc đấy.」"
2387 = "「Chị Paulette~」"
2388 = "「Fukami à.」"
2389 = "「Chuyện của Fukami, giao cho cậu đấy nhé.」"
2391 = "「Để ứng phó với sự thay đổi của tình hình xã hội, các chính sách liên quan đến việc hồi sinh khu vực sẽ được tập trung thúc đẩy ở một khu vực nhất định. Đó là Đặc khu.」"
2402 = "「Ông nội.」"
2403 = "「Thiệt tình! Ông nội kỳ quá.」"
2404 = "「Ông nội! Ông nội cũng nói gì đi chứ! Nói câu gì hay hay ấy!!! Câu gì hay hay ấy!」"
2406 = "「Reina cũng sẽ, cố gắng hết sức mình luôn nha~!」"
2411 = "「Tất nhiên rồi. Trực giác của Nagi và kinh nghiệm của Fukami đã kết hợp rất ăn ý.」"
2412 = "「Tất nhiên rồi.」"
2413 = "「Tất nhiên rồi! Đó là lời thỉnh cầu của [わ　　た　　し　　た　　ち　　の　　な　　か,7]tình đầu mà.」"
2414 = "「Tất nhiên rồi! Cháu nghĩ đó là! Chuyện quan trọng mà! Còn những chuyện có vẻ không quan trọng thì cháu quên ngay lập tức thôi.」"
2417 = "「Tất nhiên rồi ạ. Bất cứ điều gì.」"
2418 = "「Chỗ, đau thì――」"
2420 = "「Ra là vậy, chuyện này―― Cũng là một dự án liên quan mật thiết đến ý tưởng 'Thành phố Đường sắt Ohito' nhỉ?」"
2423 = "「Thích thật đấy. Ghen tị quá đi mất~! Reina, sẽ cổ vũ cho mọi người nha!!」"
2425 = "「Một gia đình còn ấm áp hơn cả than đá nữa. Đến mức tôi cảm thấy mình không xứng đáng.」"
2427 = "「Mồ~ Không được gọi trống không đâu nha! Reina là, Hinai Reina đó ạ!」"
2429 = "「Chị Mayami!!」"
2435 = "「Đúng là nước của tinh thần làm việc nhóm nhỉ. Cảm ơn hai đứa. Ngon lắm. Anh nếm được hương vị của sự dịu dàng từ hai đứa đấy.」"
2438 = "「Kisaki.」"
2439 = "「Lập pháp hóa――」"
2441 = "「Tiềm thức? Vậy là, anh Soutetsu cũng có, linh cảm gì đó khiến anh nghĩ như vậy sao?」"
2443 = "「Hình thái gia đình, mới――」"
2446 = "「Điều đó thì kết hôn cũng giống vậy thôi. Để ngăn chặn kết hôn giả, mới có giấy đăng ký kết hôn, và yêu cầu xuất trình giấy tờ tùy thân khi nộp.」"
2447 = "「Kết hôn á?」\\n「Hyau!!?」"
2456 = "「Midori――con bé đó là một người không có may mắn. Ông chỉ lo, Fukami cũng sẽ nối gót theo con bé.」"
2458 = "「Một sự cải thiện đáng kinh ngạc, có thể nói là mang tính bước ngoặt đấy. Tôi đánh giá rất cao Soutetsu đấy nhé?」"
2460 = "「Hơn nữa, chuyện này. Cũng là chuyện có liên quan đến tôi mà.」"
2461 = "「Cháu nói thế thì, ông lại chẳng biết nói gì nữa rồi.」"
2462 = "「Mà nói nghe nè, anh Soutetsu, anh không thấy cơ thể nặng nề, hay buồn ngủ vô cớ sao?」"
2468 = "「Bù đắp cho những thiếu sót của nhau. Tuyệt vời thật đấy. Quả không hổ danh là gia đình của ngài Soutetsu.」"
2469 = "「'Tránh được bất lợi' cũng là một loại lợi ích. ――Chuyện đó, Sou-chan chắc chắn phải hiểu rõ rồi nhỉ.」"
2474 = "「Chế độ gia đình cũ, nam nữ làm vợ chồng, vợ chồng sinh con. Đó là chế độ gia đình lấy điều đó làm tiền đề.」"
2476 = "「Để mãi mãi ở bên nhau, phương pháp có lợi nhất về mặt xã hội là kết hôn――nhưng điều này, chỉ có thể làm với một người.」"
2477 = "「Nếu có gì không hiểu tụi em sẽ gọi điện nha! Anh cứ yên tâm mà ngủ đi~」"
2479 = "「Nước đúng không!」"
2486 = "「Họ định bắt đầu cuộc sống chung như vậy. Nhưng mà, công ty bất động sản lại không cho thuê nhà――những chuyện đại loại thế. Thỉnh thoảng cũng có ạ.」"
2487 = "「Cảm ơn hai đứa đã giúp anh. Xin lỗi vì đã làm hai đứa lo lắng.」"
2488 = "「Cháu cảm ơn ông. Cháu nhất định sẽ trân trọng, và mang lại hạnh phúc cho em ấy.」"
2491 = "「Lập pháp do nghị sĩ đệ trình……nghị sĩ Quốc hội đệ trình dự luật―― hiểu vậy là đúng chứ?」"
2501 = "「Cửa đã đóng tốttttt! Rồi nha~」"
2512 = "「Đối với Reina, có lẽ hơi khó hiểu một chút nhưng mà~」"
2513 = "「Chuyện đó. Hỏi ai thì có vẻ sẽ biết, ạ?」"
2514 = "「Đó quả thực là trường hợp mà ý tưởng và sự nỗ lực của nhóm cậu Soutetsu, được phát huy một cách rõ rệt nhất đấy.」"
2515 = "「Cháu nghĩ đó là ảnh hưởng của việc Internet phát triển, cá nhân tự phát tán thông tin, và những thông tin đó được lan truyền và chia sẻ rộng rãi.」"
2516 = "「Chuyện đó, hiện tại em vẫn chưa xem xét kỹ lưỡng. Nhưng mà―― Nghe nói các dự luật được thông qua tại Quốc hội, hầu hết đều do Nội các đệ trình.」"
2517 = "「Đó là vùng xám. Thực tế, nếu ra tòa thì không biết sẽ thế nào. Vì vậy, để không xảy ra kiện cáo, mọi người đều tuyệt vọng che giấu.」"
2518 = "「Đó là, cái hay dùng khi chăm sóc người ốm đúng không! Cậu mang của cô Midori đến à?」"
2519 = "「Vậy à.」"
2520 = "「Nghĩa là……」"
2530 = "「Vậy thì, tốt rồi. Tâm ý của ông, tâm ý của bà nội, hay tâm ý của mấy đứa con trai ông, đều không thay đổi một chút nào cả.」"
2533 = "「Vậy thì, lại mở cuộc họp toàn thể hả?」"
2534 = "「Vậy thì! Cách ngã đó là tốt rồi đúng không!? Cả anh Soutetsu và bé Fukami đều không sao!!」"
2536 = "「Vậy anh thì」"
2538 = "「Nếu vậy, nhà em cũng! À ừm, mẹ em thì, vẫn chưa, thể ra ngoài đi lại được đâu nhưng mà.」"
2540 = "「Vậy thì, bọn em đi đây――nhưng mà, anh nhất định phải nghỉ ngơi đấy nhé! Ngoài khoảng thời gian lúc nãy ra thì phải ngủ.」"
2541 = "「Vậy, em qua \\x%l客車;#00ffc040;toa hành khách%l;#; đây. Hẹn gặp lại ở Yui nhé!」"
2543 = "「Vậy, em sẽ hỏi các ông, và đưa ra các ngày dự kiến sớm nhất có thể! Ạ!」"
2545 = "「Nếu vậy thì lại càng phải cảm ơn sâu sắc hơn nữa chứ.」"
2547 = "「Nếu vậy thì――là vì lý do gì ạ?」"
2548 = "「Vậy, cụ thể thì phải làm sao?」"
2549 = "「Vậy thì, không kết hôn với ai cả, cứ để ba người thế này thì công bằng rồi!?」"
2550 = "「Vậy! Anh Soutetsu! Bọn em, nên làm gì đây?」"
2551 = "「Nếu vậy, để có được 'sự tránh né bất lợi' đó, những trò ngụy tạo hay gì gì đó, có vẻ sẽ tràn lan mất.」"
2552 = "「Vậy nha ông nội! Cháu, sẽ sống thật vui vẻ cùng anh Soutetsu và bé Fukami!」"
2553 = "「Vì vậy, hãy làm thôi.」"
2554 = "「Nếu vậy thì ngài Soutetsu đáng lẽ phải làm tròn bổn phận của một trụ cột gia đình, là đốc thúc mọi người nhanh chóng trở lại làm việc sau khi tìm thấy chứ ạ.」"
2555 = "「Vậy thì, anh Soutetsu. Tụi em về đây. Anh cứ gọi điện thoại bất cứ lúc nào nhé, dù không có chuyện gì cũng được.」"
2557 = "「Không có. Anh ổn. Nhưng mà――」"
2559 = "「Gia đình mà! Tính đãng trí giống nhau cũng là chuyện đương nhiên thôi!」"
2561 = "「Lúc thức cũng không được phụ giúp chị Mayami hay chị Hibiki đâu đó! Phải nghỉ ngơi!!」"
2562 = "「Bước tới cùng với hy vọng. Nhưng ở đó chẳng có sự đảm bảo nào cả. Thậm chí, còn có rất nhiều trường hợp phải gánh chịu những bất lợi mang tính xã hội.」"
2565 = "「Họp toàn thể……hay đúng hơn là buổi thảo luận tập hợp những người quan tâm, sẽ trở thành buổi trao đổi ý kiến nhỉ. Vì chuyện này không liên quan đến công việc.」"
2566 = "「Nếu là anh Soutetsu thì chắc chắn sẽ làm được thôi ạ! Reina, sẽ cổ vũ cho anh nha~!」"
2567 = "「Anh Soutetsu!? Đấm bóp vai hay massage gì đó, anh hoàn toàn không làm chút nào sao?」"
2568 = "「Anh Soutetsu. Lần tới, chúng ta phải học cách nghỉ ngơi thôi.」"
2569 = "「Ngài Soutetsu――」"
2570 = "「Ngài Soutetsu! Nagi! Fukami!」"
2571 = "「Cậu Soutetsu. Chuyện của Nagi, trăm sự nhờ cậu nhé.」"
2572 = "「Soutetsu? Có điều gì bất tiện sao?」"
2579 = "「Trước tiên, anh muốn hai đứa hiểu một tiền đề quan trọng. Anh rất vui khi ở bên hai đứa. Do đó, anh muốn ở bên hai đứa mãi mãi.」"
2583 = "「Phiền phức, sao.」"
2585 = "「Sự liên kết giữa chuyến tàu BBQ và xuôi dòng sông Kuma. Việc đó cũng đã tạo cú hích cho toàn bộ ngành du lịch và công nghiệp của Ohito.」"
2718 = "Hai người nãy giờ vẫn luôn giữ im lặng, tin tưởng và giao phó tất cả cho tôi――"
2720 = "Hai người vốn giữ vẻ mặt nghiêm nghị và im lặng nãy giờ, lại vô tình buông lời đồng ý cùng một lúc."
2724 = "Không, khoan đã."
2727 = "Chưa dứt lời, Nagi đã nhanh nhảu rót một cốc nước mang tới."
2729 = "Dù đối phương là ai, tôi cũng chỉ chân thành truyền đạt suy nghĩ, ý tưởng của chúng tôi mà thôi."
2733 = "Không phải vậy đâu. Cảm thấy thắc mắc, nhưng lại không thể nói ra lời――"
2735 = "Lên chuyến \\x%l列車;#00ffc040;tàu%l;#; mới mang tên gia đình. Hướng tới――một tương lai rực rỡ hơn."
2739 = "Vì đã bù đắp cho nhau, thúc đẩy nhau cùng phát triển. Vì chúng tôi luôn kích thích lẫn nhau, nên mới tạo ra được kết quả."
2741 = "Hôm nay Reina làm nhân viên nhà ga."
2744 = "Lập hộ khẩu mới, và nhận con nuôi."
2746 = "Nhưng, nếu có Fukami và Nagi ở bên, nếu là vì Nagi và Fukami――tôi sẵn lòng đương đầu với nó."
2772 = "Chỉ cần tập trung chú ý, cảm giác như máu đang chảy dần về cơ thể. Cảm giác chân thực từ từ, từ từ hiện rõ trở lại."
2773 = "Cả hai đều tương đương nhau, đều thu được lợi ích một vạn yên."
2776 = "Hachiroku và Reina gật đầu với nhau."
2778 = "Tiếng gọi rất, rất to của Hachiroku. Nagi và Fukami vội vã chạy trở lại \\x%lキャブ;#00ffc040;buồng lái%l;#;."
2780 = "Nhìn Fukami và Nagi ngay lập tức lên tiếng bênh vực tôi với vẻ mặt vui sướng, Hachiroku nở một nụ cười ngập tràn hạnh phúc."
2782 = "\\x%l動輪;#00ffc040;Bánh xe chủ động%l;#; của Hachiroku khẽ rung lên, rồi chầm chậm, chầm chậm bắt đầu quay."
2805 = "Nagi cũng gật đầu với tôi bằng nụ cười tươi rói."
2807 = "Nagi nheo mắt lại như một chú mèo con――Rồi khi cánh tay ấy dừng lại, Nagi thoắt cái bước lên một bước."
2808 = "Để không làm phiền câu chuyện――chắc em ấy nghĩ vậy. Nagi, người nãy giờ vẫn giữ im lặng, bất giác bật cười."
2811 = "Nagi và Fukami lộ vẻ mặt như tuyệt vọng. Hai khuôn mặt ấy nhìn nhau, rồi từ từ gật đầu một cái."
2813 = "Rồi, Nagi và Fukami, nhìn nhau, và đồng thanh nói."
2815 = "Nagi và Fukami vội chạy đến."
2818 = "Giọng nói thở phào nhẹ nhõm, giản đơn của Nagi."
2820 = "Nagi phồng má hờn dỗi. Đôi mắt ông Minokasa híp lại."
2821 = "Lời của Nagi đột nhiên nghẹn lại."
2823 = "Thấy cảnh đó, Nagi thở dài một cái đầy vẻ ghen tị――"
2826 = "Nagi cười tươi rạng rỡ. Không cần nói ra em ấy cũng hiểu được――điều đó, làm tôi rất vui."
2833 = "Đầu óc vốn đang lơ mơ bỗng chốc nóng bừng lên, gom nhặt và hội tụ lại những mảnh ghép ý tưởng đã nghĩ ra."
2846 = "Chỉ có tôi là chưa làm được gì. Nhưng tôi không vội, vì điểm cộng hay điểm trừ, tất cả đều là của chung gia đình mà."
2848 = "Ba người, cùng nhau. Vậy thì chẳng còn sợ hãi điều gì nữa."
2849 = "Thế nhưng, nếu đó là ác mộng, thì có lẽ là một lời cảnh báo từ tiềm thức của tôi."
2859 = "Phủ định quan hệ vợ chồng, đồng nghĩa với việc phủ định gần như toàn bộ lịch sử và hiện trạng của đất nước này――chắc chắn sẽ không được chấp nhận."
2867 = "A, ra là vậy. Fukami quen với việc cho uống nước thế này là vì――"
2872 = "Bốn bàn tay đẩy tôi ngã xuống nệm. Cứ thế giấu luôn hai cánh tay tôi vào trong, rồi đắp chăn lại đàng hoàng."
2874 = "Dự đoán sẽ có những người tham dự như thế, nên Hachiroku mới cố ý đóng vai người đặt câu hỏi giúp tôi."
2877 = "Khi chúng tôi định trở thành những người đầu tiên nộp đơn, Fukami và Nagi đã, rủ 'Cả Hachiroku cũng vào gia đình đi'."
2888 = "Ông Seki cũng tham gia vào câu chuyện."
2891 = "Ông Seki, ông Minokasa, cúi đầu chào chị Mayami. Gật đầu với nụ cười như có vẻ bối rối, chị Mayami hỏi tôi."
2892 = "Tiếng thở dài như muốn nói 'không thể hiểu nổi' của ông Seki, đã được Paulette nhẹ nhàng tiếp nhận."
2893 = "Ánh mắt ông Seki trở nên nghiêm nghị."
2895 = "Ông Seki dịu dàng nhìn Reina―― Rồi giữ nguyên ánh mắt đó, nhìn tôi."
2899 = "Vù――tiếng bay cố ý phát ra cho tôi nghe thấy. A, tất nhiên. Tất nhiên rồi. Navi cũng, luôn luôn, đứng về phía tôi."
2907 = "Cảm giác được giúp đỡ, được bảo vệ tầng tầng lớp lớp, thúc đẩy những lời nói tiếp theo tuôn trào."
2908 = "Nụ cười rạng rỡ, xen lẫn nét thẹn thùng e ấp. Và nhờ dòng nước mát lạnh, đầu óc tôi cũng tỉnh táo hơn hẳn."
2909 = "Nagi và Fukami nhìn nhau―― Ngay lập tức Fukami khẽ gật đầu, như muốn nói 'Nagi nói trước đi'."
2910 = "Chuẩn bị bước ra khỏi phòng, hai đứa ngoảnh lại. Nhìn tôi."
2911 = "Đúng là bảo bọc quá mức mà―― Tôi bất giác mỉm cười gượng gạo, nhưng ngay lập tức thu lại."
2913 = "Cầm cờ vẫy, em ấy mỉm cười, nhưng vẫn rất nghiêm túc, kiểm tra an toàn cho chúng tôi."
2915 = "Như thể viên kẹo ngỡ là nhân mận, nhưng bên trong lại là ớt, khuôn mặt em ấy đột nhiên đỏ bừng lên."
2917 = "Nhìn tôi, nhìn Nagi, rồi lại nhìn tôi―― Đôi mắt ấy ngấn lệ. Cô ấy khẽ gật đầu, nhiều lần."
2919 = "Vừa dứt lời, những ngôn từ, những tâm tư cứ thế tuôn trào. Liên kết thành một chuỗi."
2920 = "Nếu có thể để lại di sản dưới hình thức được pháp luật bảo đảm, thì sẽ an tâm biết bao."
2934 = "Trăm hay không bằng tay quen."
2937 = "Và rồi chúng tôi tăng tốc."
2938 = "Khiến tâm trạng tôi cũng thư thái theo―― Nhưng đồng thời, cảm giác tự trách mãnh liệt cũng dâng trào."
2954 = "Mặt phẳng nhỏ bé mang tên ba người chúng tôi, đã tạo thành một hình hài vững chắc cho sự kết nối to lớn nhường này."
2955 = "Nhẹ nhàng, cụng tay vào nhau. Tôi và Fukami, Fukami và Nagi, Fukami và Hachiroku. Lần lượt từng người."
2956 = "Gia đình được chứng nhận'. Một hình thái gia đình mới được pháp luật bảo vệ, có thể duy trì bằng cách nộp đơn và nhận được sự cho phép của tòa án bốn năm một lần."
2957 = "Hoạt động của chúng tôi đã nhận được sự đồng cảm rộng rãi của dư luận, và chỉ trong vòng bảy năm, chúng tôi đã tiến xa được đến nhường này."
2958 = "Điều đó tôi sẽ lặp lại bao nhiêu lần cũng được."
2961 = "Không có gì ngoài sự biết ơn. Cách để đền đáp lòng tốt này, tôi chỉ có thể nghĩ ra một điều duy nhất."
2963 = "Tôi dồn ý thức vào cơ thể mình. Vẫn để hai tay cho hai đứa nắm, tôi kiểm tra đầu, cổ, vai, thân, eo――chân."
2966 = "Vui mừng và khao khát hơi ấm, tôi đưa tay ra khỏi chăn, hai đứa liền nắm chặt lấy, bao bọc tay tôi."
2968 = "Muốn uống thêm ngụm nữa――chỉ mới nghĩ vậy và hơi nhúc nhích, Fukami đã đưa bình hút vào miệng tôi."
2969 = "Tôi nắm lấy tay Fukami, tay Nagi."
2971 = "Tôi chỉnh lại tư thế, hướng ánh nhìn. Không phải về phía Hachiroku――"
2972 = "Nói vậy cùng với sự nhẹ nhõm. Nhưng lời nói lại vướng víu ở cổ họng một cách kỳ lạ."
2975 = "Tiếng cười khô khốc. Chậm một nhịp, tôi mới nhận ra đó là tiếng cười gượng của chính mình."
2977 = "Những điều tôi mong muốn, đơn giản đến mức chẳng thể làm khác được."
2979 = "Tôi liếc nhìn Nagi và Fukami đang ở ngay bên cạnh. Chỉ cần nhận lại cái gật đầu từ họ, tôi đã có thể lấy lại sự vững vàng."
2980 = "Thật tình, tôi ngu ngốc đến mức nào chứ."
2982 = "Việc gặp khó khăn là điều đã quá rõ ràng."
2984 = "Tôi bàng hoàng trước sự ngu ngốc của bản thân, khi đã quên mất một sự thật đơn giản đến thế."
2986 = "Thở phào nhẹ nhõm. Thấy thật vui sướng. Vậy thì hướng đi tiếp theo, chính là đây."
2987 = "Hibiki từng nói 'Thế thì ngại với Nagi và bé Fukami lắm', và những buổi massage của Hibiki, hình như là……"
2988 = "Vừa dứt lời, Fukami chồm người tới."
2991 = "Trước cảm giác không tự nhiên bất chợt trào dâng, tôi tự hỏi tại sao――và nhìn lại bản thân."
2996 = "Rồi nhanh tay, gạt \\x%l単弁;#00ffc040;van hãm đơn%l;#; về \\x%l行駛位置;#00ffc040;vị trí chạy tàu%l;#;."
3001 = "Lối sống mới――cuộc sống mới――hình thái gia đình mới. Những gì chúng tôi tìm kiếm, sẽ được đúc kết trọn vẹn trong chính cụm từ đó."
3008 = "Lời của Hibiki vang vọng trong tâm trí tôi. Chính xác, là nó đấy."
3013 = "Cô Midori……Chăm sóc cho mẹ của Fukami, đó là kinh nghiệm mà em ấy đã tích lũy suốt một thời gian dài sao."
3014 = "Đúng vậy――đó là mong muốn."
3016 = "Quả thực là vậy. Trong tôi, chắc chắn có một 'sự bất an' mơ hồ, vẫn chưa thể sắp xếp thành lời……"
3018 = "Quả nhiên có bạn bè là tốt nhất. Lời của Paulette đã gợi cho tôi một sự nhận thức."
3022 = "Ví dụ như, giả sử tôi ra đi trước Hachiroku―― Tôi muốn lo liệu để sau này Hachiroku không phải lo lắng chuyện cơm ăn áo mặc."
3027 = "Từ cái vòi nhỏ của bình hút, nước từ từ, từ từ chảy vào miệng. Không quá nhanh, cũng không quá chậm."
3028 = "Việc có thêm một vạn yên vào chiếc ví rỗng là một lợi ích, cũng chẳng khác gì việc được xóa nợ một vạn yên."
3036 = "Khi được Paulette xoa đầu, cô bé hoàn toàn yên tâm, từ từ thốt ra những lời tiếp theo."
3037 = "Paulette vỗ nhẹ một cái 'bốp' vào lưng tôi, rồi sau đó nét mặt trở nên nghiêm túc."
3042 = "Fukami lấy hai tay che miệng."
3044 = "Fukami vẫn im lặng như cũ, nhưng nhè nhẹ, lén lút, túm lấy vạt áo tôi."
3045 = "Hai câu nói mang ý nghĩa trái ngược nhau va chạm giữa Fukami và Nagi."
3047 = "Fukami nhận lấy cốc nước từ Nagi―― Rồi rót nước trong cốc sang một chiếc bình thủy tinh nhỏ."
3049 = "Fukami lao đến ôm chầm lấy ông. Ông Seki dịu dàng đỡ lấy cô bé."
3050 = "Ánh mắt của Fukami không hề yên định."
3052 = "Fukami và Nagi gật đầu với nhau――hả!?"
3053 = "Quả thực, đúng như Fukami nói. Tôi không muốn tiếp tục để hai người họ trong tình trạng bất ổn như vậy――"
3063 = "Gương mặt Reina bừng sáng. Như một đóa hoa tươi tắn đang nở rộ."
3064 = "Giọng nói ngây thơ, vô tư của Reina vang lên."
3067 = "Reina nghiêng đầu, ngơ ngác."
3068 = "Khẽ giãn ra. Tất cả mọi thứ ở đây. Bầu không khí, mềm mại đi đôi chút."
3071 = "Đèn tín hiệu xuất phát hiển thị cho phép đi. Tôi kéo \\x%l逆転機;#00ffc040;cần đảo chiều%l;#; sang \\x%l満檔前進;#00ffc040;cài hết số tiến%l;#;."
3073 = "Nhận thức đó, quả nhiên cũng là điều mà hai người họ đã nghĩ đến đầu tiên."
3074 = "Nếu vậy thì có lẽ Fukami, cũng có linh cảm nào đó về chuyện này."
3078 = "Quả thực, rất ngon. Nước thấm từ cổ họng, lan tỏa khắp cơ thể, đến tận sâu trong tim."
3084 = "Trên gương mặt chị Mayami, không có biểu cảm gì. Ngay cả việc phỏng đoán――những chuyển động trong lòng chị, tôi cũng không làm được."
3090 = "Mục đích đã định, ý chí muốn hiện thực hóa nó cũng vô cùng mạnh mẽ."
3101 = "Kisaki cũng vậy. Cô khẽ mỉm cười nơi khóe mắt."
3102 = "Lời của Kisaki củng cố thêm hình ảnh trong đầu tôi. Sự thấu hiểu dần bắt kịp với những lời nói, ra là vậy sao."
3104 = "Kisaki chợt nhìn xăm xăm về phía xa."
3106 = "Trong khoảnh khắc Kisaki tìm kiếm từ ngữ để giải thích, Paulette đã giải thích cặn kẽ Đặc khu là gì một cách cực kỳ rõ ràng."
3108 = "\\x%l窯;#00ffc040;Lò hơi%l;#; đã được chuẩn bị tươm tất. Nagi cũng nắm chặt lại chiếc xẻng xúc than――"
3110 = "Fukami, và Nagi, đã bộc bạch hết những tâm tư của mình."
3119 = "Mà là hướng về phía ông Minokasa và ông Seki, đang ngồi cạnh nhau ở góc cuối cùng."
3120 = "Giọng nói mang đậm dấu ấn thời gian của ông Minokasa. Khiến sống lưng tôi tự nhiên thẳng lên khi trả lời."
3121 = "Đến đây, cuối cùng chị Mayami cũng cất tiếng. Chỉ bấy nhiêu thôi, ánh mắt của tất cả mọi người đều đổ dồn vào chị."
3122 = "Nghe nói vậy, tôi mới nhớ ra chị Mayami và Hibiki cũng thỉnh thoảng hướng dẫn tôi cách nghỉ ngơi."
3123 = "Nghe hai đứa nói, tôi mới nhận ra."
3124 = "Nghe tôi nói, Fukami và Nagi gật đầu với nhau như đã an tâm. Sau đó, hai đứa đặt tay lên cửa lùa."
3126 = "Đầu óc tôi đang lơ đãng. Mơ hồ. Hoặc có lẽ, tôi chỉ vừa trải qua một cơn ác mộng đơn thuần."
3130 = "Kể từ khi bắt đầu chuyến đi dã ngoại―― Tôi đã hoàn toàn bỏ qua những điều đó――sao."
3132 = "Tất nhiên là, theo hướng tốt đẹp hơn. Dù là từng chút một đến mức không thể nhận ra, nhưng chắc chắn là vậy."
3138 = "Cả ông Minokasa và ông Seki đều im lặng nhìn tôi. Họ đang lắng nghe những gì tôi nói."
3139 = "Bàn tay nhăn nheo của ông Minokasa, vụng về xoa mái tóc Nagi."
3164 = "Lời nói, làm nổi bật lên những tâm tư. Chính tôi cũng ngạc nhiên khi nhận ra Fukami và Nagi lại quan trọng đến nhường này."
3170 = "Vừa dứt lời, tôi bỗng thấy bất an."
3171 = "Vừa dứt lời, Paulette và Kisaki đồng thời gật đầu. ――Nếu phủ định chế độ gia đình cũ, thì sẽ không thể thành lập được."
3172 = "Lúc câu chuyện tạm dừng, sau một khoảng lặng ngắn, Hibiki giơ tay. Tôi cảm thấy hơi bất ngờ, nhưng cũng không có ai khác giơ tay."
3173 = "Vừa nói, Fukami vừa gập cánh tay phải thành hình chữ L, rồi từ từ đổ phần từ khuỷu tay trở xuống về phía lòng bàn tay."
3180 = "Trong lúc tôi và Hachiroku nói chuyện, Nagi và Fukami đã chia nhau ra, hoàn thành nốt phần kiểm tra trước khi khởi hành."
3193 = "Không thể nào chỉ là sức lực của riêng chúng tôi được. Nhưng Paulette thừa biết điều đó, vẫn nhường phần tỏa sáng cho chúng tôi."
3194 = "Những điều đó, tất nhiên là rất quan trọng. Nhưng, đối với tôi, điều không thể thay thế nhất là――"
3195 = "Ý tưởng Đặc khu hóa. Chúng tôi chỉ tự tiện hào hứng với nhau, nhưng mà――"
3196 = "Chỉ bấy nhiêu thôi, trong ngực tôi đã dâng lên một sự ấm áp lạ thường. Dù có xa nhau, tôi vẫn cảm nhận được mình đang được hai người bảo vệ, bao bọc."
3197 = "Dòng nước thấm vào một cách êm dịu và dễ chịu, làm dịu đi cổ họng khô khốc và sâu thẳm bên trong cơ thể tôi."
3198 = "Một mối quan hệ gia đình dựa trên sự tin tưởng, không chỉ phụ thuộc vào tình yêu nam nữ. ――Nhu cầu, nhiều đến mức đáng kinh ngạc."
3199 = "Chỉ bấy nhiêu thôi, cũng đủ để tôi tin chắc rằng, hướng đi mà chúng tôi đang nhắm tới không hề sai lầm."
3201 = "Lời giải thích cặn kẽ của Fukami giúp tôi nhớ lại. Khi tôi sắp ngã, Fukami định đỡ tôi, nhưng lại trượt chân――"
3203 = "Vậy phải làm sao đây, ngay khoảnh khắc nghĩ đến điều đó, tôi đã hiểu ra."
3208 = "Nếu \\x%lレイルロオド;#00ffc040;Railord%l;#; đã được chế tạo trên 15 năm, sẽ được xem là trên 15 tuổi, và 'được hiểu' là không cần sự cho phép của tòa án."
3214 = "Từ xấp giấy được phát, người ngẩng mặt lên đầu tiên là Paulette. Tiếp theo là Kisaki, cô khẽ nở một nụ cười mỉm."
3217 = "（Tuúúúúúúúúú!）"

[selections]
