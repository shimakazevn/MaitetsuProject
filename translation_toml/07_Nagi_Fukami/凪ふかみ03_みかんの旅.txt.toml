2328 = "「À. Quả nhiên là một nơi nguy hiểm nhỉ.」"
2330 = "「Rất nhiều cảnh thiên nhiên ạ.\\nCó trang trại này, rồi còn được cưỡi ngựa nữa.」"
2332 = "「Do đó, dù khoảng cách có vẻ an toàn, nhưng với việc xâm nhập trái phép\\nvào khu vực đường sắt, theo nguyên tắc là phải kéo van đỏ. Dừng tàu và trục xuất」"
2334 = "「Do đó, hãy nhìn thấu 『Thứ mà sư phụ muốn em đạt được thông qua tu hành』,\\nvà hướng tới việc đạt được điều đó mà không cần bận tâm đến giải đấu.」"
2344 = "「Anh hai——lái tàu đã bảo 『đợi ở đây』 mà lị.\\nVì sự an toàn chung, bổn cô nương đành phải đợi thôi」"
2346 = "「Nhưng mà, anh hai đã luyện tập cùng em á.\\nEm cứ nghĩ mình đã chuẩn bị kỹ càng và chiến đấu không chút chủ quan, thế mà.」"
2347 = "「Sự trưởng thành của em,\\nchính là chiến thắng vang dội chỉ thuộc về riêng em——Nagi đại nhân sao!?」"
2351 = "「Thất bại cũng là một bài học, và bài học là thứ để vận dụng vào thực tế, sao.\\n——Giỏi thật đấy, Hibiki.」"
2354 = "「Olivy xem trên mạng rồi. Đẹp lắm, làm tim đập thình thịch luôn.\\nA! Đúng rồi. Nhé? Lần tới hãy cho chạy trên đường sắt Mikan đi」"
2356 = "「Những cô gái khác?」"
2358 = "「Dù thế nào đi nữa thì cũng gượng gạo vô cùng.\\nNói đúng hơn là Fukami đang luống cuống——」"
2360 = "「Em ấy hay mắc chứng hoang tưởng ấy mà.\\nVề cơ bản thì không có hại gì đâu, cứ yên tâm đi」"
2362 = "「Chắc là em ấy không biết cách cư xử với một Nagi đang suy sụp.\\nAnh thì đang cố gắng cư xử sao cho tự nhiên nhất có thể, nhưng mà...」"
2364 = "「Vậy, vào việc chính thôi. Để vực dậy tinh thần cho Nagi và Fukami thì——」"
2365 = "「À, ừm. Đã cất công đi du lịch rồi,\\nmà hai đứa lại chỉ mải nhìn nhau thôi, nên anh thấy hơi buồn cười chút.」"
2369 = "「Tuyệt quá! Đẹp ghê~,\\nlấp lánh lấp lánh dưới ánh mặt trời kìa~」"
2371 = "「Tôi hiểu rồi ạ.\\nNgài đi cẩn thận nhé, ngài Soutetsu.」"
2373 = "「Vâng! Ạ. Ừm, khi xuống khỏi đài quan sát,\\ntừ đó có thể đi bộ đến sát mép miệng núi lửa luôn ạ.」"
2374 = "「Khó quá á! Đau đầu quá á! Nè, nè!\\nTheo ý Fukami-chan thì cái nào là tốt nhất á?」"
2376 = "「『Nếu Nagi học Kendo ngay từ đầu』.\\nGần như chắc chắn cô bé đó sẽ không thể nào là đối thủ của Nagi.」"
2378 = "「Nếu em thích cách đó hơn,\\nthì sẽ có thêm một lựa chọn nữa đấy.」"
2380 = "「Kết quả là, nếu Nagi có thể gặt hái được thành quả lớn, thì điều đó còn tốt hơn nhiều so với việc 『Chiến thắng giải đấu nhưng không trưởng thành được chút nào』.」"
2382 = "「Nếu cứ tiếp tục tu hành như hiện tại mà vẫn có thể chiến thắng,\\nthì cách đó có vẻ tốt hơn á!」"
2384 = "「Việc cứ mãi ủ rũ phiền muộn vì ai đó...\\nNếu là anh hai trước chuyến dã ngoại học tập, anh có làm thế không á?」"
2388 = "「Tưởng tượng về trái tim của ai đó——\\nQuan tâm đến ai đó, chắc chắn cũng là một bài học quan trọng á.」"
2393 = "「Về phía tổ lái thì như vậy là được rồi. Sau khi báo cáo,\\nphần còn lại sẽ do công ty——trong trường hợp này là đường sắt Mikan quyết định」"
2394 = "「Ra vậy. Đó cũng là, một bài học sao.」"
2396 = "「Lùn tịt.」"
2397 = "「Nagi, chan...」"
2399 = "「Nagi-chan lao đi với tốc độ kinh hoàng,\\nchạy tọt vào trong hầm trú ẩn, và thế là, em đã hiểu.」"
2400 = "「Nagi-chan! Không có chuyện đó đâu.\\nNagi-chan tuyệt đối, mạnh hơn mà!」"
2403 = "「Anh trai là lái tàu đúng không? Ngửi mùi là biết ngay.\\nHehe! Olivy đã hứa với lái tàu của Ohito rồi nhé」"
2405 = "「Fukami-chan! Chỗ kia kìa!\\nTrên gò đất cao kia! Có băng ghế á!!」"
2406 = "「Fukami-chan! Không được á! Đừng có kể chuyện tớ giật mình ngã lăn quay\\nrồi bị lấm lem toàn tro bụi chứ~!!」"
2408 = "「Fukami-chan, cậu cười gì á?」"
2410 = "「Có lẽ, giống như chú cún con lần đầu nhìn thấy biển vậy.\\nBất ngờ, vui sướng, và chỉ muốn chạy nhảy tung tăng!!」"
2412 = "「Vâng, đúng vậy. Trong lúc hẹn hò... à không, ừm,\\ntrong chuyến dã ngoại học tập, cấm nhắc đến những cô gái khác, ạ!」"
2417 = "「Có một gã cầm máy ảnh lẻn vào sườn dốc phía núi.\\nCó lẽ hắn muốn chụp cả biển và đoàn tàu trong cùng một bức ảnh」"
2432 = "「Làm gì có chuyện đó! Railord của Đường sắt Hoàng gia\\nlàm sao có thể lùn tịt thế này được chứ.」"
2440 = "「Tôi rất vui vì sự tin tưởng của ngài, nhưng suy cho cùng tôi cũng chỉ là một Railord.\\nTôi không thể nào thấu hiểu hết những nét tinh tế trong tâm hồn con người được ạ.」"
2442 = "「Chắc là vậy đó. Rồi anh hai\\ncòn bảo 『Quả nhiên không phải mình nhìn nhầm sao』 nữa...」"
2444 = "「Anh... và có lẽ cả Fukami nữa,\\nđã vô thức bắt chước cách làm của Nagi nhỉ.」"
2445 = "「Anh không phủ nhận, nhưng không phải chỉ do chiều cao đâu.\\nThực tế thì một người nhỏ bé như Olivy cũng——」"
2448 = "「Đối với một Railord bé nhỏ như tôi,\\ncó vẻ đây là một vấn đề hơi quá khó khăn ạ.」"
2450 = "「Em cũng không biết, nhưng cứ dùng điện thoại\\nbấm đồng hồ bấm giờ. Vừa nói 『Được rồi』 một cái là!!」"
2451 = "「Tôi cũng nghĩ, như vậy sẽ tốt hơn ạ.」"
2455 = "「Dù chúng ta vẫn luôn đi dã ngoại học tập.\\nNhưng thực tế, đây là lần đầu tiên chúng ta cùng nhau đi xa thế này.」"
2456 = "「Tớ đang kể chuyện về núi Aso ấy mà,\\nlúc đó Nagi-chan——」"
2457 = "「Tôi thì không nghĩ vậy đâu...\\nNếu vậy, có lẽ nên hỏi Hibiki thì hơn.」"
2460 = "「Tớ không kể chuyện đó đâu.\\nNhưng mà Nagi-chan? Cậu vừa tự khai ra rồi đấy?」"
2462 = "「Anh đúng là một người đàn ông hạnh phúc.\\nCó được hai cô em gái tuyệt vời nhất trên đời.」"
2463 = "「Tôi hoàn toàn không nhận ra.」"
2465 = "「Ra vậy. Thời gian để sơ tán sao.」"
2467 = "「Em không định nghe lén đâu,\\nchỉ là thấy bầu không khí có vẻ khó chen ngang vào á.」"
2469 = "「Ừ.」"
2470 = "「Chuyện... gì vậy ạ」"
2471 = "「À, không phải ạ. Em gái và Railord,\\nthì anh không xem là con gái đâu nhỉ, quả nhiên là vậy, vâng.」"
2474 = "「Có lẽ vậy.」"
2476 = "「Bởi vậy——em——\\nNghĩ đi nghĩ lại nghĩ mãi. Nhưng mà, dù thế nào đi nữa.」"
2479 = "「Vì vậy, cô bé đó mới có thể đối phó với tốc độ và khí thế của Nagi,\\nvà không bị bối rối trước thể hình của Nagi.」"
2480 = "「Do đó, để chuẩn bị cho chiến thắng tiếp theo,\\nchúng ta có thể nghĩ ra một vài cách.」"
2483 = "「Tôi đã làm phiền dòng suy nghĩ của ngài sao?」"
2486 = "「Xin lỗi nhé, lại khiến cả Hibiki cũng phải bận tâm rồi.」"
2487 = "「Kéo van, đỏ? ạ?」"
2489 = "「Không phải là 『Trong giải Kendo』.\\nMà là con đường giành lấy chiến thắng chỉ thuộc về riêng Nagi, ở một lĩnh vực khác.」"
2490 = "「Xâm nhập, trái phép ạ?」"
2493 = "「Thùy mị và thanh lịch!」"
2495 = "「Hibiki.」"
2498 = "「Đó là một nơi rộng lớn, rất rộng lớn,\\nchỉ toàn tro, cát và đá, không một ngọn cỏ nào mọc nổi ạ.」"
2509 = "「Đúng vậy ạ. Xong rồi, mọi người cũng bắt chước làm theo,\\nkhiến cả em cũng bị cô giáo mắng lây luôn.」"
2511 = "「Anh nghĩ vậy đấy? Thực tế là em đã thua rồi mà.\\nSự chênh lệch về kinh nghiệm Kendo, kinh nghiệm thi đấu Kendo, là quá lớn.」"
2512 = "「Đúng, nhỉ. Aha... ha...」"
2513 = "「Cũng phải.」"
2514 = "「Đúng vậy ạ. Nước màu ngọc lục bảo rất đẹp——\\nNhưng khói bốc lên nghi ngút, quả nhiên vẫn là núi lửa.」"
2517 = "「Đúng á! Đã cất công đi du lịch rồi á!!\\nKhông ngắm cảnh thì uổng lắm á!」"
2519 = "「Nhỉ, giống sông Kuma, nhỉ?」"
2520 = "「Ừm. Vì thế hãy kể cho anh nghe đi.\\nVề những điều thú vị ở Aso, nhiều hơn nữa.」"
2523 = "「Đúng vậy.\\nBao gồm tất cả những điều đó, gọi là \"điểm kinh nghiệm\".」"
2524 = "「Ồ, anh chưa đi bao giờ——nơi đó thế nào?」"
2525 = "「Ồ.」"
2526 = "「Vậy sao, cảm ơn sao.\\nEhehe, không có chi!」"
2527 = "「Ồ. Vậy thì thế nào?」"
2528 = "「Hừm. Thú vị thật.\\nHachiroku hẳn sẽ rất thích, và Hibiki chắc cũng sẽ say sưa vẽ lại phong cảnh đó.」"
2529 = "「Vậy sao. Xin lỗi em nhé」"
2530 = "「Ể~, vui thì vui thật, nhưng khó quá đi~」"
2531 = "「Vậy sao ạ? Khi tình cờ gặp ở nhà ga,\\ntôi thấy em ấy vẫn không có gì khác so với bình thường mà——」"
2532 = "「Vậy sao?」"
2534 = "「Là bé gái nước ngoài á! Tóc vàng á!!」"
2536 = "「Vì là chuyện quan trọng á!\\nNên tớ mới muốn nghe ý kiến của Fukami-chan.」"
2537 = "「Biển á!」\\n「Biển!!」"
2539 = "「Đúng vậy ạ. Chính xác. Là em sai. Nên là cứ thoải mái,\\nnói chuyện về chị Hibiki và Hachiroku-chan đi. Ạ.」"
2543 = "「Đúng rồi đó. Olivy bình thường chỉ làm \\x%l入換;#00ffc040;dồn toa%l;#; thôi.\\nKhông làm trưởng tàu bao giờ đâu, nên lỡ có làm không tốt thì cũng đừng giận nhé.」"
2545 = "「Ừ. Vốn dĩ việc nhắm tới chiến thắng trong giải đấu,\\nchỉ là 『Một phần trong quá trình tu hành kiếm thuật của Nagi』 thôi mà.」"
2547 = "「Vâng.」"
2548 = "「Railord...\\nRailord của đầu máy kéo này——C56 99 sao?」"
2551 = "「Là Aso ạ. Bọn em đi ngắm núi Aso.」"
2552 = "「Đường hầm á! Đường sắt Ohito đâu có đâu á!\\nFukami-chan, cậu biết không á?」"
2555 = "「Thời gian trôi qua?」"
2558 = "「Người đáng lẽ phải hướng về phía trước và bắt đầu hành động đầu tiên, là anh.\\nLà người lớn tuổi nhất mà——bản thân anh thật thảm hại.」"
2559 = "「Người cần phải vực dậy tinh thần đầu tiên, là anh hai á.」"
2562 = "「Chẳng thảm hại chút nào đâu á.\\nBởi vì anh hai, đang trong chuyến dã ngoại học tập mà?」"
2563 = "「Giận sao được——\\nNgược lại, anh còn phải cảm ơn vì đã được em cung cấp thông tin du lịch nữa đấy.」"
2564 = "「Có chuyện gì, thú vị——sao, ạ?」"
2566 = "「Quả đúng là vậy.」"
2568 = "「N, Nagi đại nhân không có lùn tịt đâu á!\\nChỉ là tóc buộc chỏm thôi á!」"
2569 = "「Nagi đại nhân là Minokasa Nagi á! Là phụ lái tàu của Đường sắt Ohito á!」"
2572 = "「Biết ngay mà! Kéo van đỏ!!!!」"
2574 = "「Đã kiểm tra xong! Đây, vé đây.\\nHehe, ngồi hết cả tuyến luôn nhỉ, cảm ơn nha」"
2576 = "「Chắc là báo cảnh sát, nhờ họ đi tuần tra quanh đây chẳng hạn.\\nMà chắc cũng không thành chuyện lớn đâu」"
2578 = "「Không sao không sao đâu!\\nLà tớ đã làm phiền Nagi-chan mà.」"
2579 = "「Không sao không sao đâu á. Gia đình với nhau mà.」"
2580 = "「Đã rõ. Nagi và Fukami cứ đợi ở đây nhé」"
2581 = "「Không——ngược lại cô đã giúp tôi đấy.\\nNếu chỉ có một mình, tôi e là sẽ bế tắc mất.」"
2582 = "「Chính xác là vậy. Thêm vào đó là một người chị tuyệt vời nhất, một giám đốc kiêm thị trưởng tuyệt vời nhất, một người đồng nghiệp tuyệt vời nhất, một đối thủ tuyệt vời nhất——」"
2589 = "「Trôi qua thì... ừm?\\nA! Chiều cao của cô bé đối thủ sẽ tăng lên, chẳng hạn?」"
2593 = "「Đúng không! Nhưng mà nhé, nó còn đẹp hơn nữa cơ!\\nVào lúc bình minh và lúc hoàng hôn ấy.」"
2598 = "「Ngay gần miệng núi lửa có một hầm trú ẩn.\\nBằng bê tông... giống như hầm trú ẩn phòng không ấy ạ.」"
2601 = "「Tro Ngàn Dặm?」"
2610 = "「Hiện tại quả thực là một tình huống cực kỳ ngoại lệ. Nếu vậy thì thà——\\nChúng ta nên tiếp cận một cách có ý thức rõ ràng về điều đó sao?」"
2611 = "「Đương nhiên là được. Đặc biệt là với loại đầu máy hơi nước chở than nước\\nnhư 8620 hay C56, tầm nhìn phía sau coi như bằng không mà」"
2612 = "「Sợ, lắm ạ. Mùi lưu huỳnh cũng nồng nặc nữa.\\nLúc đó em chỉ biết cầu nguyện 『Đừng phun trào nha~』 thôi. Nhưng mà.」"
2613 = "「Biết chứ. Đáng lẽ em nên hỏi anh ngay từ đầu.\\nĐó là một câu trả lời cực kỳ, cực kỳ đơn giản.」"
2614 = "「Tất nhiên rồi ạ.\\nBởi vì em ấy là người phụ lái mà tôi đã tự tay đào tạo mà.」"
2615 = "「Việc phát hiện ra những nguy hiểm mà lái tàu không nhìn thấy,\\nlà công việc cực kỳ, cực kỳ quan trọng của trưởng tàu và nhân viên nhà ga đấy!!」"
2617 = "「Vừa nhìn thấy cái hầm đó, Nagi-chan liền bảo!\\n『Fukami-chan! Bấm giờ! Bấm giờ cho tớ』」"
2619 = "「Thật ngoạn mục. Anh không còn từ nào khác để diễn tả.」"
2620 = "「Hiếm thấy nhỉ! Đường sắt Ohito đâu có đường hầm.\\nNhỉ! Nagi-chan.」"
2623 = "「Nói vậy——thì có lẽ là đúng, nhưng...\\nVậy, với em bây giờ thì quả nhiên không thể thắng cô bé đó á?」"
2626 = "「Ra vậy. Railord và em gái,\\nquả thực, cũng là con gái mà nhỉ.」"
2627 = "「Thế cái kẻ xâm nhập trái phép đó sao rồi?\\nBỏ chạy rồi hả?」"
2635 = "「Cách đầu tiên rất đơn giản.\\nĐó là tăng thời gian luyện tập Kendo.」"
2637 = "「Lần đầu tiên, là sao. Chuyện gì, cơ ạ?」"
2639 = "「Cách thứ hai cũng cực kỳ rõ ràng.\\nĐó là 『Đơn giản chờ đợi thời gian trôi qua』.」"
2642 = "「Câu trả lời.」"
2646 = "「Không có chuyện gì là tốt rồi」"
2647 = "「Đây ạ. Trước khi bàn chuyện khó khăn, hãy ăn chút đồ ngọt đi.\\nĐau đầu chắc chắn là do não thiếu đường đó á.」"
2648 = "「Tiếp tục chuyến dã ngoại học tập.」"
2653 = "「Hơn nữa, ngài còn sở hữu một Railord tuyệt vời nhất nữa, đúng không ạ?」"
2655 = "「Giọng nói thì không giống chút nào,\\nnhưng nội dung câu chuyện thì y hệt. Quả thực rất giống ngài Soutetsu.」"
2659 = "「Chắc phải gấp ba lần những gì\\nanh Soutetsu đang tưởng tượng đấy ạ. Em chưa từng thấy Nagi-chan như vậy bao giờ!」"
2660 = "「Được làm việc ở tuyến đường sắt Mikan số một thế giới cơ mà.\\nDù là \\x%l入換;#00ffc040;dồn toa%l;#; hay gì đi nữa thì chắc chắn cũng rất hạnh phúc rồi」"
2668 = "「Nước... hay nói đúng hơn là nước nóng? Đọng lại ở đó.\\nHồ Caldera... là miệng núi lửa nguyên vẹn biến thành hồ luôn ạ.」"
2675 = "「Bấm giờ? Để làm gì?」"
2676 = "「Trời ơi bé này. Mình muốn đem về nhà quá!\\nĐáng yêu đáng yêu đáng yêu đáng yêu!」"
2684 = "「Cảm ơn hai người. Anh đi đây.」"
2685 = "「Cảm ơn anh lúc nãy đã giúp đỡ nhé!\\nĐến Yatsushiro rồi cũng nhớ đi tàu nữa nha! Chúc chuyến đi vui vẻ!!」"
2693 = "「Nagase bị ngộ độc thực phẩm. Nghe bảo là do sò hỏng.\\nThế nên hôm nay cô ấy không làm việc được, Olivy mới làm thay.」"
2716 = "「Là số một thế giới đó.\\nCảnh sắc nhìn từ cửa sổ tàu số một thế giới, trên tuyến đường sắt Mikan số một thế giới」"
2717 = "「Chuyện đó——」"
2718 = "「Thế thì……tuyệt thật đấy」"
2719 = "「Cũng có thể là vậy, nhưng có một điều chắc chắn hơn.\\nKhi lên cấp học, luật thi đấu Kendo sẽ thay đổi.」"
2720 = "「Cũng là điều không thể tránh khỏi. Bởi vì từ trước đến nay,\\nchưa ai từng thấy Nagi suy sụp sâu sắc đến vậy.」"
2721 = "「Chỉ có thể nói là do——bệnh nghề nghiệp thôi. Thay vì cảnh sắc ngoài cửa sổ,\\nsự chú ý của anh lại cứ hướng về những thứ bất thường」"
2722 = "「Dạ khúc xin phép kiểm tra vé!」"
2723 = "「Nếu vậy thì, có vẻ cũng bớt phải cố sức hơn.」"
2724 = "「...Vậy sao. Cũng phải.」"
2725 = "「Lần đầu tiên nhỉ.」"
2726 = "「Thì đúng rồi! Đương nhiên mà!\\nNhìn kìa nhìn kìa! Nhìn xem, vùng biển này! Biển Yatsushiro!!」"
2727 = "「Ngay cả Fukami cũng mất đi vẻ hoạt bát.\\nDù đã một tuần trôi qua kể từ trận đấu đó rồi.」"
2730 = "「Quá đáng! Uuu…… Nagi ơiii」"
2733 = "「Thật kìa! Chắc chắn từ băng ghế đó có thể nhìn xuống biển nhỉ.\\nTuyệt vời lắm đây... biển và bầu trời nhìn từ nơi đó.」"
2736 = "「Ơ, anh hai!\\nCách nói đó——anh biết câu trả lời sao!?」"
2737 = "「Nếu vậy thì sao?\\nViệc cách đối xử giữa Nagi và Fukami đang thay đổi——」"
2739 = "「Cô bé đó, ở võ đường đã luyện tập đấu tập\\nvới rất nhiều đối thủ——thậm chí là cả người lớn.」"
2741 = "「Nếu vậy, đến lúc đó nhờ cả vào cô đấy」"
2744 = "「Thời gian của Nagi sẽ không đủ. Để làm được điều đó,\\nchắc chắn sẽ cần phải cắt giảm thời gian từ đâu đó, cho việc gì đó.」"
2745 = "「Ở đó có đường dành cho người đi bộ——xong rồi, Nagi-chan,\\nthấy thú vị nên đi sát mép đường, thế là bị giáo viên quát 『Này!』」"
2747 = "「Đến mức đó sao.」"
2750 = "「Anh hai?\\nChuyến dã ngoại học tập này, chẳng phải là để tìm ra điều đó sao á?」"
2751 = "「Đúng không á? Anh hai, anh thấy sao á?」"
2758 = "「Anh Soutetsu, vi phạm phép lịch sự. Rồi ạ!」"
2760 = "「Có cần tôi giúp không?」"
2761 = "「Đơn giản.」"
2897 = "Dù có nghĩ đi nghĩ lại, tôi vẫn không hiểu được.\\nThậm chí càng nghĩ, tâm trí tôi càng trở nên vẩn đục."
2906 = "Nhưng, thế này là được rồi.\\nCánh cửa lòng của Nagi, cuối cùng cũng đã mở ra với chúng tôi một cách chân thành."
2907 = "Dù vậy, Fukami vẫn không nản lòng."
2922 = "Chỉ cần nói ra thành lời như vậy, lòng tôi cũng nhẹ nhõm hơn đôi chút."
2923 = "Chỉ tưởng tượng thôi cũng đủ khiến tôi thở dài thán phục.\\nTôi cũng rất muốn được tận mắt chiêm ngưỡng cảnh tượng đó."
2927 = "Hachiroku luôn dõi theo và hiểu rõ Nagi.\\nNgược lại, cô ấy không có nhiều tiếp xúc sâu sắc với Fukami."
2928 = "Tôi đã kể cho cô ấy nghe sơ qua sự việc rồi,\\nnên Hachiroku chính là người hoàn hảo nhất để cùng bàn bạc."
2930 = "Tôi như được sáng mắt ra."
2933 = "Vẻ điềm tĩnh biến mất khỏi khuôn mặt Hachiroku.\\nCô ấy chìm vào suy tư trầm mặc――――"
2935 = "Đôi mắt Hachiroku mở to,\\nrồi ngay lập tức cụp xuống vẻ trầm ngâm."
2936 = "Hachiroku và chị Mayami vốn dĩ luôn mở đóng cửa kéo rất tao nhã,\\nkhông hề phát ra một tiếng động nào."
2970 = "Có vẻ như Nagi\\nkhông quá cố chấp vào chiến thắng trước mắt ngay lúc này."
2973 = "Nagi quả nhiên vẫn mím chặt môi,\\nchỉ đăm đăm nhìn ra ngoài cửa sổ xe đang vùn vụt trôi qua."
2976 = "Nagi và Fukami——hai người không thể thay thế đó,\\ntôi rốt cuộc nên dùng từ ngữ nào để miêu tả đây..."
2978 = "Cạn lời.\\nCả Nagi và Fukami."
2980 = "Trong lúc Nagi và Fukami mất thăng bằng trên ghế,\\nkhông hổ danh là Olivy, cô bé đã lao đi mất rồi."
2982 = "Nagi, ngước nhìn lên."
2983 = "Giọng Nagi đầy vẻ tự hào và vui sướng.\\nFukami khẽ cười khúc khích trông thật hạnh phúc."
2985 = "Tông giọng thay đổi.\\nFukami im bặt với cảm giác 『Chết rồi』."
2988 = "Đôi lông mày của Nagi nhíu chặt lại.\\nNhưng, bây giờ tôi không bận tâm đến điều đó."
2990 = "Nagi, ngoảnh lại.\\nMột cách rất tự nhiên."
2991 = "Nagi và Fukami, hệt như những đứa trẻ nhỏ,\\nngồi ngược lại trên băng ghế dài và áp sát mặt vào cửa sổ."
2992 = "Nagi háo hức hỏi.\\nFukami khẽ mỉm cười."
2999 = "Đoàn tàu lăn bánh.\\nXuyên qua đường hầm——"
3002 = "Vừa dứt lời, Fukami liền phồng má lên."
3007 = "Tuyệt thật.\\nTrò đùa của Nagi khiến cả Olivy cũng bật cười khanh khách."
3011 = "Nhưng, hãy diễn đạt nó bằng lời đàng hoàng.\\nĐể tạo ra một sự dứt khoát cho Nagi, cho Fukami, cho tôi——cho tất cả chúng tôi."
3033 = "Hừm...\\nVậy là, bản thân tôi cũng khác với ngày thường sao."
3036 = "A, \"Nagi đại nhân\" đã xuất hiện rồi.\\nỔn rồi. Nagi đã hoàn toàn hướng mắt về phía trước, vượt qua thất bại."
3038 = "Cùng với Nagi và Fukami, ba chúng tôi.\\nHôm nay, chúng tôi vẫn đang tiếp tục chuyến dã ngoại học tập của mình."
3040 = "Với cú phanh gấp vừa rồi, kéo theo hai toa hành khách mà xử lý khéo léo thế này——\\nTay nghề của lái tàu chắc chắn vượt xa tôi."
3043 = "A——Nagi,\\ncuối cùng cũng đã chấp nhận thất bại của bản thân."
3053 = "Chắc em ấy cũng đã giải thích xong xuôi với các hành khách khác rồi."
3054 = "Em ấy giơ tay chào.\\nCả tôi và Nagi đều chào lại, Fukami cũng vội vàng bắt chước theo."
3055 = "Trả lại vé rồi cười tươi rói.\\nLần này thì Fukami vặn vẹo uốn éo cả người."
3056 = "Olivy bất ngờ thò đầu ra từ phần nối toa——"
3057 = "Bộp, Olivy vỗ tay một cái.\\nTrước cử chỉ đó, Fukami lại nhũn cả người ra."
3058 = "Olivy nhận lấy với vẻ lóng ngóng thấy rõ,\\nnhìn ngắm một cách trang trọng, rồi bấm tách một cái."
3059 = "Quả là một cử chỉ nhẹ nhàng làm sao.\\nĐúng là đang nhảy cẫng lên vì vui sướng."
3061 = "Hai người cùng đồng thanh,\\nnhìn nhau gật đầu, rồi nhìn tôi."
3063 = "Cơ thể bật nhảy chuyển động,\\nOlivy đang thể hiện niềm vui bằng toàn bộ cơ thể."
3065 = "Ngước nhìn tôi một cái với vẻ lo lắng,\\nnhưng ngay lập tức lại cụp mắt xuống."
3067 = "Olivy vẫy vẫy bàn tay nhỏ xíu, bước qua cửa nối toa,\\nrồi khuất bóng về phía toa hành khách phía trước."
3069 = "Nở một nụ cười rất đỗi dịu dàng, đúng chất Fukami.\\nNhìn Nagi với vẻ rạng rỡ và vui vẻ."
3071 = "Bé, thì đúng là bé gái, nhưng không phải con người."
3072 = "Có vẻ tính cách của cô bé cũng ngây thơ và hồn nhiên y như vẻ ngoài.\\nNụ cười rạng rỡ hiện lên khi nhận được lời cảm ơn, chỉ có thể diễn tả bằng một từ \"đáng yêu\"."
3075 = "Vui vẻ nắm chặt tay làm động tác chiến thắng nho nhỏ.\\nSau đó, mỉm cười nhìn lại tôi."
3077 = "Nếu tương lai điều đó thành hiện thực,\\nviệc chạy liên thông với đường sắt Mikan cũng không còn là giấc mơ nữa."
3087 = "Phải rồi, quả thực là vậy.\\nVì tôi đã bỏ lỡ quá nhiều bài học trong thời niên thiếu——"
3088 = "Ánh mắt của Nagi, hướng về phía Fukami.\\nFukami đón nhận ánh mắt ấy."
3091 = "Đúng lúc đó, tàu chạy vào đường hầm.\\nVậy mà Nagi lại reo lên đầy thích thú!"
3093 = "Dù ban đầu có thấy Nagi phiền phức, nhưng rồi Fukami cũng xiêu lòng,\\nvà cả hai lại trở về với nụ cười quen thuộc——"
3095 = "Hy vọng chuyện đó sẽ làm hắn chừa đi một chút——"
3097 = "Bình thường, bức tranh hoàn toàn ngược lại.\\nFukami suy sụp, còn Nagi thì tiếp cận bằng thái độ không đổi."
3098 = "Từ Ohito đi qua Okoba, Yoshimatsu rồi đến Hayato.\\nĐó chính là kế hoạch khôi phục tuyến đường phía Nam mà Paulette đang ấp ủ."
3110 = "Phanh gấp.\\nChắc là đã dùng phanh khẩn cấp rồi."
3116 = "Ngay khoảnh khắc nghĩ vậy, tôi bật cười,\\nvà bị hai người họ ngơ ngác nhìn."
3117 = "Tôi không định dùng vũ lực để thay đổi tình hình này."
3119 = "Tôi cũng xoa đầu Nagi.\\nLiếc nhìn chúng tôi như vậy, rồi bước đi thoăn thoắt——"
3121 = "Olivy tiến bước về phía đầu máy,\\nhướng tới toa hành khách phía trước."
3122 = "Người duy nhất tôi có thể điều khiển, chỉ có bản thân tôi.\\nNếu vậy, trước tiên tôi phải tận hưởng chuyến đi này đã."
3124 = "Thở phào.\\nMột tiếng thở phào nhẹ nhõm."
3128 = "Phải giải tỏa sự bất an của Fukami mới được——\\nNghĩ vậy, lời giải thích của tôi trở nên chi tiết và nhẹ nhàng hơn."
3129 = "Cảm thấy vui vì điều đó, lời nói của tôi cũng trở nên trôi chảy hơn."
3132 = "Tôi đưa vé của cả ba người ra."
3134 = "Tôi xoa đầu Fukami."
3137 = "Nếu có Hachiroku ở đây, tôi bất giác tưởng tượng xem\\nem ấy sẽ phản ứng với vẻ mặt thế nào."
3138 = "\"Có làm được không?\" Tôi không nói ra mà chỉ nhìn Hachiroku.\\nHachiroku nghiêng đầu vẻ bối rối."
3141 = "Có vẻ lời giải thích đó đã thấm thía,\\nNagi, từ từ, từ từ gật đầu."
3143 = "Tôi, quả thực đã luôn trăn trở——và hối hận.\\n『Làm thế nào, mới có thể giúp Nagi chiến thắng.』"
3145 = "Thứ tôi có thể kiểm soát, chỉ có nỗi phiền muộn của tôi——\\nChính là tâm hồn của bản thân tôi, không gì khác."
3146 = "Tôi cẩn thận lựa chọn từ ngữ.\\nTin tưởng rằng với Nagi hiện tại, chắc chắn sẽ hiểu được."
3148 = "Tôi gật đầu, Hibiki mỉm cười rạng rỡ."
3149 = "Do đó, cả Nagi và tôi đều có thể cư xử bình thường\\nmột cách rất tự nhiên, nhưng——"
3152 = "Vì vậy, tôi sẽ nói chuyện.\\nBây giờ là với Fukami——người có thể nghe thấy lời tôi nói."
3155 = "Rồi lại một lần nữa, nhìn tôi.\\nSự u ám như bị dồn vào chân tường bám trên đôi mắt con bé đã tan biến."
3156 = "Nếu là tôi trước đây, dù ai đó có chìm trong hối hận,\\ntôi cũng chỉ nghĩ 『Sao không chịu hành động đi』."
3161 = "Vì vậy tôi nói chậm lại, chọn lọc từ ngữ\\nsao cho dễ hiểu nhất có thể."
3163 = "Nhận ra điều đó,\\ntôi đã hiểu nên hướng sự chú ý của Hachiroku vào đâu."
3172 = "Hibiki chạy lăng xăng đi đi lại lại.\\nLấy Dorayaki ra và pha trà lúa mạch cho chúng tôi."
3175 = "Cánh cửa trượt mở ra vào một thời điểm không thể hoàn hảo hơn——À không——"
3177 = "Con bé cố tình phồng má lên——"
3178 = "Biết rõ rồi mà Hibiki vẫn hỏi.\\nNên tôi cũng đáp lại bằng một câu trả lời đã định sẵn."
3180 = "Hibiki đứng dậy.\\nƯỡn lưng ra sau với vẻ hơi kiêu ngạo."
3183 = "Hibiki, vẫn luôn là Hibiki.\\nVẫn luôn là em gái của tôi."
3185 = "Là Hachiroku.\\nCô ấy đang ngồi cạnh tôi."
3190 = "Hơn hết thảy——\\nTôi biết điều đó còn chắc chắn hơn cả cảm giác của chính bản thân mình."
3193 = "Hachiroku luôn hỗ trợ tôi. Hibiki giải tỏa nỗi phiền muộn cho tôi.\\n——Họ đã dõi theo tôi đủ kỹ để có thể làm được những điều đó."
3198 = "Khuôn mặt lộ rõ vẻ lo lắng.\\nÀ, ra vậy. Fukami hoàn toàn không hiểu chuyện gì đang xảy ra."
3199 = "Fukami lại nhìn Nagi một lần nữa."
3201 = "Fukami khúc khích cười.\\nChỉ vậy thôi cũng đủ truyền tải được niềm vui sướng lúc đó rồi."
3203 = "Miệng thì bảo bị mắng, nhưng trông Fukami lại rất hạnh phúc.\\nTiếng cười khúc khích nhỏ nhẹ như tiếng chuông reo——"
3207 = "Fukami, khẽ quan sát Nagi.\\nNagi cụp mắt nhìn xuống sàn nhà——"
3209 = "Fukami thở phào nhẹ nhõm.\\nRồi ngước nhìn tôi bằng ánh mắt có phần say mê."
3210 = "Vèo! Fukami vung tay lên mô tả."
3211 = "Giọng nói của Fukami như thể đã nhận ra \"Là vậy sao\".\\nNagi, có lẽ cũng đã hiểu."
3213 = "Gương mặt Fukami bừng sáng."
3214 = "Fukami, khẽ liếc nhìn Nagi."
3216 = "Fukami liếc nhìn Nagi.\\nNhững lời này quả nhiên vẫn không lọt vào tai Nagi."
3218 = "Fukami tròn xoe mắt ngạc nhiên."
3219 = "Fukami thường suy sụp vì những chuyện nhỏ nhặt.\\nNói thế này thì hơi kỳ, nhưng điều đó gần như là \"chuyện thường ngày\"."
3221 = "Giữ ý với nhau——Bây giờ,\\nsự giao tiếp của họ thậm chí còn không đạt đến mức đó."
3224 = "Một lúc sau, một giọng nói bối rối cất lên."
3230 = "Chắc là bị lấm lem tro bụi thê thảm lắm.\\nNagi có vẻ thực sự sốc."
3232 = "Thật vui. Thật đáng quý."
3233 = "Quả là một trò đùa đường sắt mang tính chuyên môn (?) khá cao."
3235 = "Khoé mắt tôi loáng thoáng thấy gì đó——\\nKhi tôi vừa kịp nhận ra, Olivy đã quay ngoắt người lại."
3244 = "Được xây dựng vì khó làm đường bộ——\\nCáp treo, thảo nào, không bị cuốn vào cuộc Đại bãi bỏ các tuyến đường sắt."
3247 = "Nếu tôi cố gắng ép buộc họ hành động,\\ncó lẽ tôi sẽ còn gây ra vết thương lớn hơn cho đối phương."
3248 = "Giọng nói của Hachiroku nghe có vẻ say mê."
3249 = "Nghe Nagi bổ sung, Fukami gật đầu."
3250 = "Bị nói vậy, Railord tên Olivy\\nchăm chú nhìn Nagi."
3251 = "Nhận được thông báo xác nhận an toàn, đoàn tàu bắt đầu lăn bánh êm ái.\\nChỉ với một chút chấn động rất nhỏ."
3252 = "Bị gọi, tôi hướng mắt quay lại trong xe.\\nỞ đó có một dáng vẻ nhỏ nhắn——"
3253 = "Nghe em ấy nói vậy, tôi thấy hơi buồn cười."
3254 = "Nghe vậy, Hachiroku nở một nụ cười ấm áp."
3261 = "Thấy vẻ mặt bối rối của Nagi và Fukami, tôi cũng gật đầu đồng tình."
3262 = "Nhìn Nagi phồng má kháng nghị,\\nOlivy vẫn thản nhiên đón nhận."
3274 = "Vừa thốt ra lời, tôi liền cảm thấy \"không phải\"."
3275 = "Nói ra rồi, tôi mới tự nhận ra.\\nNỗi phiền muộn của Nagi, của Fukami, tất nhiên cũng không phải là của tôi."
3276 = "Nói đến đó, tôi chợt dừng lại."
3286 = "Tuy nhiên, điều đó cũng là đương nhiên.\\nTôi đang chìm đắm trong suy nghĩ mà——"
3287 = "Nỗi hối hận đó, đã làm thay đổi cách tôi đối xử với Nagi...\\nSự thay đổi ấy tạo thành một chuỗi phản ứng, dẫn đến tình huống hiện tại."
3288 = "Điều đó, cứ lặp đi lặp lại.\\nCho đến tận Sendai. Và cả trên chuyến tàu Mikan từ Sendai."
3289 = "Là Nagi và Fukami, là Fukami và Nagi."
3290 = "Lại là Fukami và Nagi như mọi khi.\\nThật sự, không khác gì bình thường."
3291 = "Có lẽ đây chính là cái gọi là điểm ngắm cảnh tuyệt đẹp.\\nBên ngoài cửa sổ, là một vùng biển rộng lớn."
3296 = "Chắc gã cầm máy ảnh không ngờ tàu sẽ dừng lại,\\nnên đã vắt chân lên cổ mà chạy trốn."
3298 = "Nếu vậy, tôi cũng sẽ như mọi khi,\\nchỉ điềm đạm nói ra sự thật."
3299 = "Nếu vậy, chẳng có gì phải lo lắng nữa."
3308 = "Aircra dạng bay vẫn là thứ gì đó rất đặc biệt,\\ncòn Aircra dạng ô tô thì cần có đường bộ."
