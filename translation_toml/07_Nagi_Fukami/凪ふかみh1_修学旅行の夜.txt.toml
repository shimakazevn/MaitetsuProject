2050 = "（Rõ ràng Fukami phải trưởng thành hơn mới đúng, sao lại cảm thấy cứng nhắc thế này——em ấy đang căng thẳng lắm sao?）"
2052 = "（Xoa xoa——xoa xoa）"
2053 = "（Trơn tuột——nhầy nhụa——）"
2054 = "（Sột soạt）"
2056 = "（Siết chặt!）"
