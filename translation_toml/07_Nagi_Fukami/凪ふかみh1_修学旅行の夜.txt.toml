2060 = "（Thế này——thì——nếu cố sức thúc mạnh,\\nkhoái cảm thể xác chắc chắn sẽ vô cùng khủng khiếp——nhưng）"
2064 = "（Nhiệt độ của hơi thở từ mũi……\\nCũng có sự khác biệt giữa mỗi người đến thế này sao.）"

