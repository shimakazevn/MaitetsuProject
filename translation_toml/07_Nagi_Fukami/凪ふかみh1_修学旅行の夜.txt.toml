1673 = "Nagi và Fukami vừa liếm phần cương cứng của tôi, vừa quấn lấy lưỡi của nhau——hai em ấy đang trao nhau nụ hôn lưỡi."
1674 = "Hôm nay tôi không thể ra bên trong âm đạo của Nagi, người đã đến giới hạn rồi. Vậy nếu chỉ xuất tinh bên trong âm đạo của Fukami thôi thì thật không công bằng."
1677 = "Lưỡi Nagi di chuyển theo chiều ngang thật rộng, liếm láp phần cương cứng của tôi!"
1678 = "Để không làm Fukami lo lắng—— Fukami quả nhiên cảm nhận được tâm ý của Nagi rõ hơn tôi nhiều."
1680 = "Ngón tay Nagi——những đầu ngón tay ấm áp như chiếc chăn phơi dưới nắng mặt trời cũng chạm vào phần cương cứng của tôi."
1682 = "Hơi thở của Nagi khô ráo và nóng bỏng, còn của Fukami thì lại ẩm ướt và lành lạnh."
1683 = "Nagi trả lời thẳng thừng dứt khoát, còn Fukami lại ấp úng một cách kỳ lạ."
1685 = "Nagi vênh váo ưỡn ngực. Ngực của Nagi. Đúng là chưa trưởng thành, phẳng lì."
1704 = "Đáng lẽ là vậy, nhưng mà…… Khi ưỡn ra thế này, không ngờ, cũng có chút nhấp nhô nho nhỏ――"
1712 = "Giống như lúc trao nụ hôn đầu tiên, nhưng không phải trên môi, mà là trên bộ phận sinh dục."
1715 = "Vào bộ phận sinh dục đang thư giãn hơn của Nagi."
1716 = "Vì chuyển động quá mạnh bạo, đầu lưỡi của Nagi đã chạm vào đầu lưỡi của Fukami——"
1718 = "Được vuốt ve bởi những chiếc lưỡi mềm mại đan xen hòa quyện vào nhau, tinh dịch của tôi đang bị hút lên mạnh mẽ."
1720 = "Phía sau sự siết chặt và lầy lội đó——"
1721 = "Khoảnh khắc cắm phần đầu vào, thớ thịt đang căng cứng bỗng chốc trở nên mềm mại, bắt đầu trơn ướt."
1723 = "Áp lực mạnh mẽ, sự trơn trượt, sự chênh lệch nhiệt độ cùng nhịp điệu lệch nhau một cách tinh tế, đang dẫn dắt phần cương cứng của tôi đến lần xuất tinh thứ hai."
1727 = "Có lẽ em ấy cảm nhận được nhiều điều hơn tôi. Nagi thậm chí còn nở nụ cười và đáp lời Fukami."
1734 = "Cảnh tượng hai người cùng cười với nhau—— tôi tuyệt đối không muốn phá hỏng nó bằng quyết định của mình."
1735 = "Tôi đã được cho phép. Bởi những chiếc lưỡi, nước bọt, lời nói, và cả ánh mắt."
1736 = "Bốn mắt nhìn nhau. Chỉ bấy nhiêu thôi mà hai người lại trò chuyện tiếp——ư!!?"
1737 = "Mật dịch của hai người hòa quyện vào nhau, được bôi trát lên phần cương cứng của tôi, mang theo sức nóng hầm hập."
1739 = "Ánh mắt ấy tập trung, nhìn chằm chằm vào đũng quần tôi. Đến nước này có vòng vo cũng chẳng ích gì."
1740 = "Ép háng đã cởi quần lót của em ấy vào phần cương cứng đang hướng lên trời của tôi——"
1743 = "Thật sung sướng. Sung sướng nhưng lại bứt rứt không thôi."
1745 = "Nếu cứ mặc sức tham lam tận hưởng khoái cảm của bản thân, chắc chắn sẽ để lại nỗi đau cho bộ phận sinh dục của Nagi——hử?"
1761 = "Dù là cuộc trò chuyện như mọi khi, nhưng tôi cảm nhận được điều gì đó khác thường."
1765 = "Nếu ở trạng thái phát tình tột độ, thì Fukami quả nhiên vẫn gần với sự trưởng thành của cơ thể phụ nữ hơn."
1766 = "Cảm giác bị hút lấy từ tận cùng bên trong."
1776 = "Ba chúng tôi đã cùng nhau chia sẻ khoảng thời gian này, cùng nhau nở không biết bao nhiêu nụ cười."
1777 = "Sự im lặng bao trùm trong chốc lát. Nhưng ngay sau đó, giọng nói dõng dạc của Nagi đã phá vỡ nó."
1779 = "Tôi không thể nào làm thế được, và cũng không muốn làm."
1781 = "Tôi đã xuất tinh. Tôi đã bắn tinh dịch của mình lên người Fukami và Nagi."
1783 = "Cứ thế từ từ rút phần cương cứng khỏi Nagi đang đến giới hạn——"
1784 = "Muốn dừng lại, nhưng không thể dừng được. Bị lớp thịt đang ngọ nguậy mời gọi, cơ thể tôi cứ thế tự động di chuyển——"
1786 = "Tôi đặt hành lý của ba người xuống và thở phào một cái."
1789 = "Gần như phản xạ tự nhiên khi nghĩ như vậy, tôi cố gắng kìm nén ham muốn xuất tinh nguyên thủy, rồi rút ra khỏi người Fukami!"
1791 = "Tôi dồn hết sức đẩy hông lên rồi xoay một vòng lớn, hai thớ thịt đang kẹp lấy tôi đều run lên bần bật!!"
1793 = "Ngón tay của Fukami ấn nhẹ qua lớp da bụng, ngay tại hình dáng phần cương cứng của tôi đang đâm sâu vào bộ phận sinh dục của Nagi."
1795 = "Đó mới chính là bài học thực sự—— Nhịp tim đập thình thịch trong lồng ngực đang mách bảo tôi điều đó."
1796 = "Tôi cảm thấy thế này là tốt rồi. Rằng đây chính là cuộc làm tình của ba chúng tôi."
1798 = "Được vuốt ve bởi hai chiếc lưỡi quấn quýt lấy nhau, tinh dịch vốn đã dâng trào nay lại càng——"
1800 = "Tôi tự mình đẩy hông lên, cố ý nếm trải khe hở của từng người một."
1802 = "Vì vậy, tôi rút ra."
1807 = "Sự kháng cự còn mạnh hơn cả lúc của Nagi."
1816 = "Áp bộ phận sinh dục trần trụi vào với bộ phận sinh dục của Fukami—— Trở thành tư thế hai người cùng kẹp lấy phần cương cứng của tôi."
1817 = "Như thể đó là liều thuốc chữa lành, em ấy dùng ngón tay dính máu chà xát nhiều lần lên phần đang kết nối của chúng tôi."
1819 = "Giọng nói nũng nịu vòi vĩnh làm rung màng nhĩ, phần cương cứng lại một lần nữa run lên dữ dội——"
1821 = "Giọng của Fukami. Nghe có vẻ tiếc nuối, nhưng lại xen lẫn sự nhẹ nhõm."
1824 = "Đã hít vào thì tất nhiên phải thở ra. Luồng hơi mạnh mẽ phả ra từ mũi, khẽ mơn trớn phần đang cương cứng của tôi."
1836 = "Nước và lửa. Chiếc lưỡi ẩm ướt mát lạnh của Fukami, và chiếc lưỡi ấm nóng của Nagi."
1837 = "Đúng vậy. Chúng tôi là con người, mỗi người đều có những việc cần phải làm."
1840 = "Như thể đang đo đạc kích thước và hình dáng, những ngón tay của Fukami vuốt ve lên xuống dọc theo phần cương cứng của tôi."
1843 = "Fukami và Nagi đưa mắt nhìn nhau rồi gật đầu——"
1844 = "Không hề trao đổi tín hiệu gì, nhưng Fukami và Nagi lại hoàn toàn di chuyển cùng một lúc."
1847 = "Fukami thở hắt ra một hơi thật lớn, rồi từ từ, thốt ra những lời nói hòa lẫn cùng hơi thở."
1849 = "Bàn tay mềm mại, mát lạnh nhẹ nhàng nắm lấy phần đang cương cứng của tôi. Chưa kịp hỏi \"Làm gì thế\", Nagi đã lên tiếng làm xao động bầu không khí."
1852 = "Lưỡi của Fukami lướt nhanh qua viền môi. Cảnh tượng đó khiến môi tôi cũng trở nên ướt át."
1853 = "Ánh mắt của Fukami, như đang mời gọi tôi."
1856 = "Hoàn toàn khác với bộ phận sinh dục chật ních của Nagi, sự mềm mại bắt đầu chín muồi xen lẫn trong sự khít khao."
1857 = "Sự lầy lội của Fukami ngày càng tăng. Nhiệt độ bên trong âm đạo cũng đang tăng lên đến mức có thể cảm nhận được."
1859 = "Cơ thể của Fukami đang đòi hỏi một cách ngọt ngào mà mãnh liệt, rằng hãy cứ thế mà xuất tinh đi!"
1863 = "Bên trong âm đạo của Fukami siết chặt lấy tôi một cách hung bạo—— Khoảnh khắc đó, một giọng nói đầy nỗ lực bắt đầu cổ vũ chúng tôi."
1864 = "Bộ phận sinh dục của Fukami, bộ phận sinh dục của Nagi, đang tuôn trào thứ mật dịch nhầy nhụa."
1866 = "Fukami khẽ cựa mình, luồn tay phải vào sâu trong váy chỉ trong một thoáng chốc."
1867 = "Bộ ngực trần của Fukami rung lên bần bật theo từng nhịp hông, dù chỉ khẽ đung đưa, nhưng lại khiến tôi cảm nhận mãnh liệt rằng em ấy đích thực là một người phụ nữ——"
1870 = "Fukami, và Nagi. Hai người đồng thời dùng đầu ngón tay vớt lấy tinh dịch——"
1871 = "Ngón tay Fukami dịu dàng vớt lấy dòng máu đỏ trào ra."
1873 = "Bàn tay của Fukami vuốt ve đùi Nagi, mông Nagi, và cả phần đang kết nối của hai chúng tôi."
1875 = "Như thể nhìn thấu tâm can tôi—— Không, có lẽ là em ấy thực sự nhìn thấu, Fukami lặng lẽ nói tiếp."
1876 = "Fukami lặng lẽ nhắm mắt lại."
1881 = "Dần trở nên ướt át. Không chỉ bộ phận sinh dục, mà cả trái tim tôi."
1885 = "Lời nói của Nagi, bàn tay của Nagi, lần này lại sưởi ấm và xoa dịu Fukami thêm nữa."
1891 = "Trước cảnh tượng đó——tôi lại hèn mọn đòi hỏi được xuất tinh thêm nữa, phần cương cứng của tôi đã hoàn toàn hồi phục sức lực."
1894 = "Chuyến đi dã ngoại lần thứ mười một, là chuyến đi qua đêm có kế hoạch đầu tiên."
1898 = "Nhờ sự vuốt ve của Fukami mà tôi đã cắm được vào tận sâu bên trong. Nhưng Nagi thì nhìn kiểu gì cũng thấy đã đến giới hạn rồi."
1906 = "Cảm giác tội lỗi và khoái cảm xuyên từ sống lưng lên tận não, cơ thể, đầu óc tôi, tất cả đều nhuốm một màu trắng xóa——"
1907 = "Nhờ tiếng của Fukami, tôi mới bừng tỉnh. Trong một thoáng, có gì đó thật kỳ lạ."
1908 = "Lời nói của Fukami làm đôi mắt Nagi sáng rực lên."
1909 = "Giọng nói của Nagi làm nhịp thở của Fukami dần bình tĩnh lại."
1910 = "Nghe giọng nói đầy lo lắng của Fukami và Nagi, tôi vội vã nặn ra vài lời đáp lại."
1912 = "Động được rồi. Động được mà lại còn sướng nữa! Khoảnh khắc tôi vừa nghĩ thế, chuyển động đã trở nên lớn hơn."
1916 = "Cảm giác giải phóng tuôn trào từ tận đáy lòng, và cứ thế, phần cương cứng của tôi rung lên bần bật!!"
1921 = "Bên trong càng lúc càng ướt át, bắt đầu uốn éo nhu động đầy ngọt ngào, như thể đang mời gọi tôi tiến vào sâu hơn nữa——"
1922 = "Lên cơ thể đang rã rời của tôi, Fukami với quần áo xộc xệch rụt rè trèo lên."
1930 = "Tôi định nói tiếp, nhưng lại nuốt lời vào trong."
1931 = "Vừa dứt lời, lông mày Nagi lập tức nhíu lại."
1932 = "Vừa nói, háng hai em ấy càng lúc càng tăng tốc."
1933 = "Nói rồi, hai ánh mắt chạm nhau. Fukami và Nagi trao nhau một ánh nhìn ngắn ngủi nhưng nồng nàn."
1939 = "Khác với lúc mới bị kẹp, một nụ hôn giữa những con cái với nhau đã tan chảy nhầy nhụa, ngập tràn tình yêu và sự phát tình."
1941 = "Cùng với sự căng cứng của cơ thể dần tan biến, âm đạo cũng mềm mại trở lại, mật dịch tuôn trào từ sâu bên trong như đang đòi hỏi tôi hãy chuyển động đi."
1945 = "Câu nói đó đã kích thích tôi. Cơ thể, dục vọng, đang thiêu đốt lý trí."
1946 = "Hoàn toàn khác xa những hành động đó. Phơi bày bộ phận sinh dục, rồi bị hơi thở phả vào..."
1947 = "Khoái cảm hệt như những sợi lông tơ mềm mại tích tụ lại, càng làm tôi thêm khao khát, khiến dục vọng càng trở nên mãnh liệt."
1949 = "Không biết ngón tay, bàn tay, hay cả lưỡi của hai em ấy có giống vậy không nhỉ—— Ngay lúc tôi vừa nghĩ thế,"
1950 = "Ở sâu bên trong khe hở nhỏ bé ấy, nơi lối vào bằng thịt nhỏ xíu, tôi chỉ cắm phần đầu của chỗ cương cứng vào."
1953 = "Nếu vậy, hướng nên nhắm đến đầu tiên tự nhiên đã được định sẵn. Vì tôi muốn yêu thương cả Nagi và Fukami, Fukami và Nagi, cả hai cùng một lúc."
1954 = "Để không làm vướng víu những ngón tay của Fukami, em ấy chạm vào hệt như một chú mèo con đang thèm sữa——"
1957 = "Nếu mong muốn tiến xa hơn nữa, thì đó rõ ràng là làm tình."
1965 = "Thành âm đạo cũng chỉ biết siết chặt hết cỡ, chút dư dả nhỏ nhoi vừa mới sinh ra ban nãy cũng đã biến mất sạch sẽ."
2019 = "（Ngọ nguậy）"
2021 = "（Nhưng——mà——）"
2022 = "（Ư!）"
2023 = "（Phụt——phụt——phụt————phụt）"
2024 = "（Phụt! Phụt! Phụt! Phụt!）"
2025 = "（Nắn——cọ——miết——nhóp nhép——）"
2026 = "（Trơn tuột——nhóp nhép——rột——sột soạt!）"
2027 = "（Nhóp nhép! Sột soạt! Chụt chụt! Trơn tuột!）"
2028 = "（Rột!）"
2029 = "（Phụt!）"
2030 = "（Ép mạnh）"
2032 = "（Chúng tôi đã từng nằm ngủ chung, cũng từng tắm chung. Nhưng, chuyện này——）"
2033 = "（Phập——hự!!）"
2034 = "（Nắn nắn, nắn nắn, xoa xoa, xoa xoa）"
2035 = "（Nắm chặt）"
2036 = "（Kéo……）"
2037 = "（Rút——rột——rột————ư——）"
2038 = "（Thúc mạnh!）"
2039 = "（Phập——rột————rột!）"
2040 = "（Siết chặt——siết——ép chặt）"
2041 = "（Phập——hự——phụt!）"
2042 = "（Phập——ư——）"
2043 = "（Phập——rột! Phập! Sột soạt!）"
2044 = "（Phập!）"
2045 = "（Cọ xát）"
2046 = "（Vuốt ve——sờ nhẹ——cọ cọ——nắn nắn——）"
2047 = "（Sờ nhẹ）"
2048 = "（Lảo đảo）"
2050 = "（Rõ ràng Fukami phải trưởng thành hơn mới đúng, sao lại cảm thấy cứng nhắc thế này——em ấy đang căng thẳng lắm sao?）"
2052 = "（Xoa xoa——xoa xoa）"
2053 = "（Trơn tuột——nhầy nhụa——）"
2054 = "（Sột soạt）"
2056 = "（Siết chặt!）"
2058 = "（Nhu động）"
2060 = "（Thế này——thì——nếu cố sức thúc mạnh, khoái cảm thể xác chắc chắn sẽ vô cùng khủng khiếp——nhưng）"
2064 = "（Nhiệt độ của hơi thở từ mũi…… Cũng có sự khác biệt giữa mỗi người đến thế này sao.）"

[selections]
