1961 = "「Anh lúc nào cũng được Nagi giúp đỡ mà. Chuyến tu học thì khỏi bàn rồi, cả trong công việc, hay việc phụ giúp chèo thuyền trên sông Kuma nữa.」"
1963 = "「Thực tế về mặt y học thì anh không rõ lắm, nhưng theo cảm nhận của bản thân, anh nghĩ là có liên quan đấy.」"
1965 = "「Anh cũng muốn thiết đãi em lắm, nhưng tiếc là, thời gian vẫn còn quá sớm.」"
1967 = "「Anh nghĩ…… sao, hừm.」"
1968 = "「Chuyến tu học cùng Nagi, lúc nào cũng không có kế hoạch gì cả, chỉ là đi cùng để làm những việc Nagi muốn thôi.」"
1970 = "「Nhưng anh nghĩ, hình dáng tố chất của Fukami và Nagi vốn dĩ đã khác nhau. Tố chất của Fukami chỉ tập trung vào du lịch, có thể ví như một chiếc bình hoa.」"
1972 = "「Nên em mới có cảm giác bị bỏ lại phía sau. Cảm thấy bị Fukami——bỏ xa sao?」"
1975 = "「Vậy thì, Nagi ta đây! Sẽ luyện tập!! Cả kiếm thuật, kiếm đạo, tu luyện lái tàu, lễ nghi phép tắc! Và cả người phụ nữ tuyệt vời nữa!!」"
1977 = "「Vì vậy, dù có đổ vào cùng một lượng 'nỗ lực', thì mực nước trong tố chất của Nagi cũng không thể dâng lên nhanh như Fukami được.」"
1978 = "「Vì thế, 3 năm. Sẽ mất chừng đó thời gian để nỗ lực tích tụ đầy trong tố chất của Nagi, và vượt qua ngưỡng tới hạn.」"
1981 = "「Vì vậy, lấy ai đó làm tấm gương, rồi học thuộc lòng nguyên xi kính ngữ của người đó sẽ hợp với Nagi hơn đấy.」"
1982 = "「Làm gì có chuyện đó! Em chẳng cao lên tí nào luôn á?」"
1988 = "「Xin lỗi, anh tới sát giờ qu—— Khụ! Khụ khụ!」"
1990 = "「Nếu em thích thong dong ngắm cảnh——thì Navi thế nào?」"
1991 = "「Một người giỏi hơn Nagi, mạnh hơn Nagi như anh sẽ đảm bảo. Nếu không lười biếng, trong vòng 3 năm tới, Nagi chắc chắn sẽ đạt được thành quả to lớn.」"
1994 = "「Nếu vậy thì.」"
1995 = "「Đã rõ.」"
1997 = "「Thật sao!? ——desu?」"
1999 = "「Cái đó thì đúng là vậy. Nhưng mà…… Quả nhiên là, em vẫn để tâm chuyện đó lắm!」"
2004 = "「Đúng ha. Thuyền khảo sát cũng phải sớm nhất là tầm 7 giờ mới xuất phát.」"
2006 = "「Đúng rồi! Sau những trận mưa lớn, hay dù không có chuyện gì xảy ra, thì mỗi tuần một lần thuyền khảo sát vẫn chạy để kiểm tra luồng lạch!」"
2008 = "「Đúng ha. Tiếc ghê. Nagi ta đây, cũng muốn làm khách thong dong đi thuyền xuôi dòng một lần á!」"
2009 = "「Đúng rồi đó~ hơn nữa! Không phải rau cải bẹ xanh bình thường đâu, mà là rau cải bẹ xanh trộn mè.」"
2011 = "「Đúng vậy. Thế thì——nói chuyện bằng kính ngữ với bạn đồng hành trong chuyến tu học. Em có cảm thấy đây là cách cư xử biết phân biệt TPO không?」"
2013 = "「Ừm. Anh nghĩ vậy. Nagi và Fukami——chuyến tu học này, đã thay đổi anh rất nhiều.」"
2016 = "「Đúng vậy. Giờ này, ở Ohimitera chỉ có cửa hàng tiện lợi là có bán đồ ăn thức uống thôi.」"
2017 = "「Đúng vậy. Trong trường hợp này, đó là ranh giới để đạt được kết quả. Nếu vượt qua được——có lẽ mọi thứ sẽ thay đổi chóng mặt đấy.」"
2018 = "「Đúng vậy. Nếu không phải chạy thay chuyến tàu đầu tiên bằng 8620, thì em cũng chẳng dậy vào giờ này đâu.」"
2021 = "「Đúng vậy. Chuyến 1D khởi hành lúc 05:39 sẽ đến Yui lúc 06:22. Chuyến khứ hồi 2D khởi hành lúc 06:29 sẽ đến ga suối nước nóng Ohimitera lúc 07:16.」"
2022 = "「À.」"
2024 = "「Chắc là vậy. Anh cũng nghĩ thực sự là như vậy.」"
2025 = "「Vậy sao.」"
2026 = "「Thật sao?」"
2027 = "「Thật hả!? Vậy thì Nagi ta đây, sẽ trả ơn bằng cách làm cho vai anh hai thoải mái luôn!」"
2030 = "「Điều anh nghĩ đến đầu tiên là những nơi như quán cà phê. Vừa ngắm Nagi dễ thương, vừa thong thả tận hưởng thời gian, có vẻ sẽ hạnh phúc lắm.」"
2032 = "「Lúc thì hùa theo, lúc thì kìm hãm lại. Nói chung là, một ngày trôi qua nhanh lắm.」"
2034 = "「Chính nhờ đôi bàn tay này, mà em mới có thể hoàn thành khối lượng bài tập lớn đến vậy nhỉ.」"
2035 = "「Chị định làm đơn giản với rau cải bẹ xanh thôi. Nhưng nếu Sou-chan cũng ăn cùng thì chị sẽ làm cầu kỳ hơn một chút.」"
2036 = "「Nagi ta đây, ăn ở khu vực ăn uống của cửa hàng tiện lợi cũng được nha?」"
2038 = "「Sáng nay Nagi ta đây cũng ăn no căng rốn rồi, nhưng hai cái cơm nắm thì không bõ bèn gì đâu!」"
2041 = "「Bây giờ Nagi ta đây!! Đang có tâm trạng muốn vận động cơ thể hết mình!!!」"
2053 = "「Không sao đâu. Như vậy cũng là cách thay đổi không khí mà, với lại ăn hai người lúc nào cũng vui và ngon miệng hơn ăn một mình.」"
2054 = "「Không có chuyện gì thì là tốt nhất, còn nếu em không muốn nói thì anh cũng không ép. Nhưng mà——」"
2055 = "「Không có gì đâu? Chỉ là anh thấy em thực sự rất dễ thương thôi.」"
2056 = "「Chính xác. Vì vậy, khi chỉ có hai chúng ta, hay khi có cả Fukami là ba người, thì cứ như bình thường là tốt nhất.」"
2062 = "「Đối với anh đang dần trở thành người lớn, thì nhũ mẫu không còn cần thiết nữa ——Anh nghĩ là như vậy đấy.」"
2066 = "「Cái tính cố gắng quá sức vì người khác. Và không biết trân trọng bản thân mình ấy.」"
2067 = "「Tại sao vậy?」"
2069 = "「Thế?」"
2074 = "「Bây giờ, khác rồi. Em đang rất trân trọng bản thân mình.」"
2075 = "「Đang là thời điểm quan trọng để ủ rượu mà lị.」"
2076 = "「Có giờ giới nghiêm mà. Nên cũng không đến nỗi quá muộn—— nhưng cũng không ít lần em phải hớt hải đưa con bé về nhà sát nút 21:00.」"
2077 = "「Thay đổi rồi chứ. Theo hướng tốt lên hẳn. Nhưng mà, duy chỉ có chỗ đáng lo nhất là vẫn chưa thay đổi thôi.」"
2079 = "「Ui da da da da da da!?」"
2080 = "「Có chuyện gì sao? Hoặc là có điều gì—— đang khiến em bận tâm à?」"
2081 = "「Vậy là, chuyến tu học của Sou-chan. Đã học hỏi được đàng hoàng rồi nhỉ.」"
2085 = "「Tuyệt thật đấy.」"
2087 = "「Thật.」"
2089 = "「Thật hả!? Anh hai cũng nghĩ vậy——desu?」"
2090 = "「Thật hả!?」"
2092 = "「Em biết rồi.」"
2099 = "「Kisaki sao. Nhắc mới nhớ, em từng bảo sẽ đi nhờ hướng dẫn về lễ nghi phép tắc mà nhỉ.」"
2103 = "「Mà thôi, trước tiên kể anh nghe đi. Rốt cuộc em đã được Kisaki hướng dẫn những gì vậy?」"
2105 = "「Không có chi. Cơ mà——nếu đi xa, thì ăn món gì chắc bụng hơn sẽ tốt hơn chứ?」"
2111 = "「Tập quá sức rồi đấy. Nhìn kìa.」"
2112 = "「Dù sao đi nữa, giờ là lúc nghỉ ngơi. Không chỉ có vai, mà cả chân, eo, toàn thân đều phải được nghỉ ngơi.」"
2116 = "「Có thể trải qua một ngày trọn vẹn vui vẻ mà không cần sự kiện gì đặc biệt. Đó là vì Sou-chan đã biết cách tận hưởng niềm vui rồi đấy.」"
2118 = "「Em lạng bỏ gân rồi thái lát mỏng giúp chị nhé?」"
2119 = "「Nét dễ thương khác với ngày thường!?」"
2120 = "「Ngược lại, tố chất của Nagi lại có đáy rất rộng. Mở rộng và vươn ra mọi phương diện, cố gắng tiếp nhận tất cả.」"
2121 = "「Thuyền khảo sát?」"
2125 = "「Bị bỏ lại phía sau?」"
2126 = "「Chuyện đó, nếu muốn thì để buổi chiều làm cũng được mà.」"
2130 = "「Ngốc nghếch!」"
2131 = "「Nó bảo sao!?」"
2132 = "「Tinh thần như vậy là tốt. Thế——」"
2133 = "「Khí thế lắm.」"
2136 = "「Điều đó chứng tỏ em đã tập trung đến mức nào.」"
2142 = "「Trôi chảy hơn anh tưởng nhiều đấy. Nghe cứ như lời của một người sinh ra và lớn lên ở Đế Đô vậy.」"
2158 = "「Chuyện đó thì——」"
2159 = "「Nghe nói huyệt ở đây có tác dụng giảm mệt mỏi ở vai. Vì vậy, khi vai bị tích tụ mệt mỏi, chỗ này sẽ trở nên nhạy cảm.」"
2160 = "「Nói là nữ tính hơn chăng. Tất nhiên, anh luôn biết Nagi là một cô bé dễ thương rồi——」"
2161 = "「Thì đó là công việc của chị mà. Mà này, Sou-chan thì sao? Dậy sớm thế này hiếm thấy nha.」"
2162 = "「Vậy là sẽ thành món cơm chan nước trà gà hấp rau cải bẹ xanh nhỉ.」"
2163 = "「Anh nói em mới để ý, dạo gần đây hình như em ít thấy nó bay vòng vòng trên đầu anh hai rồi!!」"
2164 = "「Đi từ sớm thế này thì—— hai đứa định đi xa hả?」"
2165 = "「Ăn thế thôi có đủ không?」"
2168 = "「Còn lại thì——chèo thuyền trên sông Kuma cũng còn quá sớm.」"
2169 = "「À thì, sáng nay anh cũng ăn no rồi mà.」"
2170 = "「Vậy thì ngại quá. Nếu mất công thì để em làm cho.」"
2172 = "「Vậy là không liên quan đến công việc hả? A, em uống trà chứ?」"
2174 = "「Thế thì, làm thêm một hiệp nữa nha!」"
2177 = "「Vậy thì, chúng ta ăn thôi nhỉ? Câu chuyện vừa rồi cứ vừa ăn vừa nói tiếp.」"
2178 = "「Vậy thì, trong lúc đó chị sẽ~」"
2180 = "「Vậy em ấn nha! Gyuuu!」"
2182 = "「Vậy thì, chúng ta cùng làm được không. Em cũng có thể giúp được chút ít, sẵn tiện muốn xua đi cơn buồn ngủ nữa.」"
2183 = "「Vậy thì, em vui lắm.」"
2184 = "「Nếu vậy thì tốt rồi——」"
2186 = "「Vậy thì, coi đó là ứng cử viên đầu tiên nhé. Thế——còn gì nữa không…… À, chuyến tàu đầu tiên sắp chạy rồi đấy.」"
2189 = "「Đó là vì Nagi vẫn còn nhỏ tuổi thôi. Khoảng 3, 4 năm nữa, mọi thứ sẽ thay đổi hoàn toàn đấy.」"
2191 = "「Vậy thì, Nagi ta đây cũng là người lớn mà! Sẽ không cưỡi Navi nữa đâu!!」"
2192 = "「Chuyện đó——là hiển nhiên rồi. Em…… còn chưa giành được điểm nào từ anh hai mà.」"
2193 = "「Vậy là cũng có tác dụng với Nagi ha. Không chừng thể chất của chúng ta lại giống nhau đến bất ngờ đấy.」"
2195 = "「Nhờ chị Mayami dạy cho cả đấy.」"
2197 = "「Quan trọng là biết cách sử dụng linh hoạt. Tại nơi làm việc hay khi tiếp khách, nếu em có thể sử dụng được kính ngữ thì là tốt nhất đấy.」"
2201 = "「Ngưỡng tới hạn?」"
2204 = "「Quanh đây á…… Đi sớm thế này mà ở quanh đây thì——」"
2208 = "「Dù biết là chuyện thường tình…… nhưng vất vả cho chị quá.」"
2209 = "「Cả hai tay đều không có gì bất thường. Nhưng mà——」"
2210 = "「Hiếm khi mới có dịp, nên anh hai nghĩ giúp em đi! Anh muốn đi đâu cùng với em trong trang phục này?」"
2212 = "「Trước tiên là tiếp tục luyện kiếm thuật cho đến lúc mặt trời lặn!」"
2216 = "「Cơm nắm trứng cá hồi và cá cơm tía tô.」"
2222 = "「(Ực——ực——ực——) Phù! A... a——xin lỗi nhé. Anh vội quá. Cứu mạng rồi.」"
2223 = "「'Bây giờ giao phó cho mọi người thì sẽ an toàn hơn'. Cô ấy đã nói vậy. Với một giọng điệu vô cùng vui vẻ.」"
2324 = "Chỉ cần vậy thôi là lại mang đậm chất Nagi rồi, tự dưng tôi thấy nhẹ nhõm hẳn."
2326 = "Vì thế chắc chắn tôi đã bỏ lỡ rất nhiều thứ. Ngay cả những khoảnh khắc quan trọng khi Nagi đang dần trưởng thành."
2330 = "Nếu nghĩ rằng đây là kết quả của việc phân biệt 'thời gian, địa điểm và hoàn cảnh', thì trang phục của Nagi càng làm tôi vui hơn nữa."
2331 = "Hấp 3 phút rồi lật lại hấp thêm 2 phút nữa là hoàn thành món gà hấp đơn giản. Đây cũng là một món do chị Mayami dạy tôi."
2334 = "Không phải là 'thiếu nữ mang dáng dấp thiếu niên', mà là một thiếu nữ sành điệu, cố tình chọn phong cách tomboy."
2336 = "Từ lúc nào, những chuyến tu học thường nhật này, đã hoàn toàn trở thành một phần của tôi, khiến tôi quên béng mất. Nhưng mà."
2339 = "Có lẽ vì đã đổ mồ hôi đầm đìa, nên nét u ám trên gương mặt Nagi lúc nãy dường như cũng nhạt đi phần nào."
2352 = "Tuy nhiên, nghĩ lại thì, cách dùng từ của Kisaki cũng có quá nhiều đặc trưng nổi bật."
2354 = "Nhưng, trước nụ cười rạng rỡ đầy tự hào của Nagi, tôi không muốn chêm thêm lời thừa thãi nào làm mất vui."
2355 = "Nhưng mà——nói ra chắc Nagi lại đắc ý cho xem. Thôi thì cứ giả vờ như không có gì, trước tiên phải điều hòa lại nhịp thở đã."
2362 = "——Những mục tiêu mà Nagi hướng tới rộng đến mức đáng kinh ngạc, và mối liên hệ giữa chúng, nói đúng ra là khá mờ nhạt."
2382 = "Nagi vẫn không thay đổi, vẫn là Nagi—— Nhưng ấn tượng mang lại đã thay đổi đến ngỡ ngàng."
2384 = "Dù hơi tiếc nuối vì vẻ bẽn lẽn đã bay biến mất, nhưng sự sảng khoái này mới thực sự mang đậm chất Nagi."
2387 = "Ngược lại, thì có. Ngược lại. Vì tác dụng quá mạnh, đau quá mức, nên cơ thể tôi cứng đờ cả lại."
2422 = "Thoải mái và tự nhiên."
2424 = "Cứng họng, Nagi nhìn xuống cơ thể mình."
2425 = "Quả không hổ danh Nagi. Thoắt cái đã gỡ tay ra, rồi nắm ngược lại tay tôi."
2428 = "Là Nagi của ngày thường. Chỉ cần vậy thôi cũng đủ làm tôi thấy vui rồi."
2431 = "Nụ cười của Nagi lại rạng rỡ như bầu trời quang đãng. Nagi của mọi ngày đang tỏa sáng."
2433 = "Cứ như bị thứ gì đó nhập vào, hay như đang cố gắng rũ bỏ điều gì đó——"
2436 = "Nagi bỗng im bặt. Cứ thế im lặng, không nhúc nhích."
2438 = "Bị Nagi kéo vào trong tiệm rèn—— tôi ngồi xuống chiếc ghế vốn là chỗ ngồi quen thuộc của ông Minokasa."
2439 = "Con bé tống một lúc cả 3 cái cơm nắm đang ăn dở vào đầy mồm."
2442 = "Đôi mắt Nagi ngước lên. Nhìn thẳng vào tôi."
2444 = "Nagi mím chặt môi. Đôi mắt màu nâu đỏ nhìn tôi."
2447 = "Chắc câu trả lời của tôi nằm ngoài dự đoán, nên Nagi lộ vẻ mặt vô cùng ngạc nhiên——"
2449 = "Nagi bật dậy, chạy vụt vào trong rồi khuất bóng."
2452 = "Gương mặt Nagi bỗng chốc đỏ bừng. Ngay lập tức, tim tôi đập thình thịch."
2453 = "Nagi tròn xoe mắt ngạc nhiên."
2455 = "Con bé ngoan ngoãn gật đầu. Trông Nagi thật bé nhỏ làm sao."
2456 = "Nghe vậy, Nagi hơi nghiêng đầu thắc mắc."
2457 = "Nói rồi, con bé định cúi gằm mặt xuống—— nhưng gương mặt đó lại ngẩng phắt lên."
2458 = "Nói rồi Nagi đứng dậy, chạy ra ngoài cửa tiệm rồi lập tức quay lại."
2462 = "Khác với Nagi mà tôi vẫn thường thấy."
2463 = "Có lẽ cũng cảm nhận được điều tương tự, Nagi khẽ gật đầu đồng tình."
2464 = "Đường kiếm rất tốt. Không hề có chút do dự nào."
2470 = "Kiếm thuật, kiếm đạo. Lái tàu, phụ lái tàu, người chèo thuyền, người cầm lái. Giúp đỡ tiệm rèn, huấn luyện đặc biệt về tiếng phổ thông và kính ngữ, học về thời trang."
2472 = "Nagi, lại bé nhỏ đến nhường này sao."
2473 = "Ra là vậy—— Đối với Nagi, Fukami chính là người gần gũi nhất mà."
2491 = "Kết hợp với vẻ đáng yêu của Nagi hôm nay…… A, không ổn rồi. Đáng yêu đến mức tôi không thể thốt nên lời nào nữa."
2493 = "Trong chuyến tu học cùng Fukami, đa phần tôi được giao nhiệm vụ lên kế hoạch."
2499 = "Tôi không định làm con bé giật mình. Vội vàng kìm nén lại cảm xúc và lời nói, tôi từ tốn truyền đạt."
2503 = "Vì tôi nghĩ nếu cứ cố uốn nắn câu chữ bằng sự quan tâm kỳ lạ, thì có khi lại gây ra những hiểu lầm không đáng có."
2504 = "Đánh mất bản thân, chỉ biết sống rập khuôn theo những gì được bảo—— Bây giờ tôi nghĩ, đó là vì tôi đã trở thành một người như vậy."
2505 = "Khi đưa ra phương án thì ít nhất phải có ba cái. Vì tôi đã được cha nuôi dạy dỗ như vậy."
2509 = "Nagi cứ mải miết vung mộc kiếm không ngừng nghỉ. Đến mức một người lớn đóng vai trò đỡ đòn như tôi cũng phải cảm thấy mệt mỏi."
2511 = "Không nói lời nào, con bé chỉ nhìn tôi—— Rồi sau đó, một nụ cười rạng rỡ nở rộ trên môi!"
2513 = "Miệng thì nói vậy, mà đã đánh bay cái cơm nắm đầu tiên cái vèo rồi."
2514 = "Chắc là ví dụ của tôi rất thuyết phục, nên Nagi gật đầu mạnh liên tục."
2517 = "Đôi môi mấp máy một lúc, rồi cuối cùng nở một nụ cười có vẻ hơi bối rối."
2519 = "Sự hoạt bát tràn đầy đã phóng đại Nagi lên nhường nào ——Nhận ra điều đó, tôi lại càng muốn tiếp thêm sức mạnh cho con bé."
2521 = "Vung mộc kiếm nhiều như vậy mà không có lấy một vết xước. Mềm mại, phần thịt ở gốc ngón tay rất dày."
2523 = "Ánh mắt ấm áp của chị nhìn tôi. Ánh mắt của một người chị đang khen ngợi đứa em trai vụng về, chắc chắn là vậy."
2525 = "Một tiếng thở hắt ngắn ngủi nhưng sâu thẳm. Nghe như thể xen lẫn giữa sự nhẹ nhõm và sự bối rối."
2527 = "Giọng nói hào hứng hẳn lên."
2530 = "Một nụ cười rạng rỡ."
2531 = "A, lại trở nên đáng yêu rồi. Đôi má con bé từ từ đỏ ửng lên, bắt đầu bẽn lẽn."
2532 = "Nghề chèo thuyền trên sông Kuma của gia đình. Và sự liên kết với đường sắt. Từ đó tiếp tục mở rộng, tận dụng chính đường sắt để phát triển du lịch——."
2535 = "Nagi vẫn là Nagi, nhưng không phải là Nagi của ngày thường. Làm tôi chẳng biết phải làm sao."
2539 = "Biết phân biệt thời gian, địa điểm và hoàn cảnh. Trên cơ sở đó, cư xử một cách tự nhiên không gồng mình."
2540 = "Tiếng dao thớt lách cách vui tai. Mùi thơm của rau cải bẹ xanh thoang thoảng. ——Cơn buồn ngủ dần nhường chỗ cho sự thèm ăn."
2550 = "Theo lẽ đó—— tôi vừa nghĩ vậy thì một hình ảnh lập tức nảy ra trong đầu."
2555 = "Kim đồng hồ đã chỉ qua 4:30."
2560 = "Và có lẽ chính vì 'chuyện gì đó' này, mà con bé mới bắt đầu để tâm đến lễ nghi phép tắc và kính ngữ."
2562 = "Khi đã cảm nhận được điều đó—— tôi lại càng muốn đối mặt với Nagi nhiều hơn."
2563 = "Vì mải mê ăn quá nên tôi quên khuấy mất."
2566 = "Tự nhiên, tôi cũng cảm thấy hạnh phúc lây. Chỉ biết thành tâm cảm thấy biết ơn sâu sắc."
2568 = "Đúng là, trước kia tôi từng như vậy."
2570 = "Tôi đưa tay ra, đặt lòng bàn tay lên đầu Nagi."
2571 = "Ở giữa gốc ngón cái và ngón trỏ. Tôi lại nhẹ nhàng ấn vào chỗ hõm ở gốc xương của cả hai ngón tay."
2575 = "Vừa ngồi xuống ghế là chị ấy hỏi ngay. A, vừa hay nước cũng đang sôi——mà khoan……"
2577 = "Tôi thở phào một hơi rồi nhìn chằm chằm Nagi đang ngồi bên cạnh. Sau đó, tôi lại nghĩ."
2579 = "Dù nói vậy nhưng tôi vẫn tin chắc. Chắc chắn Nagi đang có 'chuyện gì đó'."
2580 = "Tôi lót hành lá thái nhỏ lên đĩa rồi rưới rượu lên, đặt miếng gà đã dùng nĩa chọc lỗ lên trên, sau đó bọc màng bọc thực phẩm lại."
2583 = "Xì xụp, sột soạt. Trong lúc và bát cơm chan nước trà tuyệt hảo, mọi lời nói đều bị nuốt ngược vào trong."
2585 = "Tôi đặt ngón giữa lên trán Nagi. Rồi ấn nhẹ."
2586 = "Khoảnh khắc những lời đó thốt ra khỏi miệng, Nagi giật mình co rúm người lại."
2589 = "Xới cơm trắng ra bát, cho thật nhiều rau cải bẹ xanh xào mè lên trên, cuối cùng xé nhỏ ức gà hấp xếp lên trên cùng."
2591 = "Không chỉ là chuyện trang phục, mà biểu cảm cũng chững chạc hơn mọi khi——à không……"
2593 = "Khi tôi ấn vào huyệt, phản ứng của con bé còn dữ dội hơn tôi nghĩ."
2595 = "Tôi khẳng định chắc nịch. Nagi hơi phồng má phụng phịu, nhưng đó là sự hy sinh không thể tránh khỏi."
2597 = "Lý do hôm nay Nagi trông sành điệu hơn, đồng thời cũng là lý do tại sao cách ăn nói lại cứ gượng gạo thế kia."
2598 = "Không cần nghe hết câu tôi cũng gật đầu đồng ý. Giờ này, ở Ohimitera chỉ có cửa hàng tiện lợi là mở cửa thôi."
2601 = "Tôi có thể cảm nhận rõ ràng rằng, Nagi rất coi trọng chuyến tu học chỉ có hai người chúng tôi."
2602 = "Để con bé không bị đau, tôi ấn thật nhẹ, như thể luồn xuống dưới xương ngón trỏ."
2603 = "Gà hấp của tôi cũng sắp xong rồi. Vậy thì——chỉ việc cho lên cơm làm cơm chan nước trà nữa thôi."
2606 = "Dù đang cười gượng vì câu nói vừa rồi nghe như chơi chữ, nhưng tôi vẫn chỉ tay lên bầu trời phía trên rặng tre."
2608 = "Một câu nói bâng quơ của tôi, lại bị Nagi phủ nhận kịch liệt với một khí thế kỳ lạ."
2610 = "Vì vậy, tôi tin chắc. 3 năm, nếu Nagi không lười biếng—— mà không đạt được kết quả gì. Một tương lai như vậy là điều không tưởng."
2613 = "Cứ thế, giữ trong 5 giây. Thả lỏng nghỉ 2 giây, rồi lại ấn 5 giây."
2615 = "Rồi ừng ực uống trà để nuốt trôi. Nhìn khung cảnh yên bình và tràn đầy năng lượng ấy, tôi vừa mỉm cười vừa nghĩ."
2617 = "Bình thường thì tôi sẽ vò rối tung lên, nhưng để bày tỏ sự tôn trọng với vẻ đáng yêu hôm nay, tôi chỉ nhẹ nhàng vuốt ve thôi."
2620 = "Sau đó nhanh chóng lật ngược lại, dùng dao ấn xuống, rồi kéo tuột gân ra trong một nhát."
2621 = "Vì vậy, tôi đã hỏi. Một cách thẳng thắn."
2622 = "Vì vậy, tôi trả lời. Thật ngắn gọn. Từ đó, tôi tiếp tục bồi thêm lời nói."
2623 = "Thế nên, tôi tiếp tục ăn cơm nắm, uống trà. Nagi cũng lẳng lặng gặm cơm nắm, rồi từ từ nuốt xuống."
2631 = "Hibiki có đôi mắt của một họa sĩ. Con bé đã luôn dõi theo tôi bằng đôi mắt ấy."
2632 = "Cái kiểu của Hibiki thì đã đạt đến cảnh giới hoàn thiện rồi, nếu sửa lại có khi còn làm mất đi sức hấp dẫn cũng nên——"
2649 = "Là chị em sinh đôi, ngang hàng với nhau. Chính vì vậy, dù chỉ là một khác biệt nhỏ cũng khiến tôi phải hơn thua."
2650 = "Tôi không thể nắm bắt được những gì mình đang nhìn thấy, những lời mình đang nghe."
2653 = "Những lúc Michiko hoàn thành tốt những việc được giao, rồi chỉ có một mình con bé được khen ngợi, thành thật mà nói, tôi rất ấm ức."
2656 = "Tôi không ngờ con bé lại hứng thú đến vậy. Mà nếu đã vậy, thì."
2659 = "Hành động của Fukami luôn nhất quán từ đầu đến cuối, mỗi một bước đi tiếp theo đều được tích lũy một cách hoàn hảo."
2662 = "Để ánh sáng ấy không bao giờ bị che khuất một lần nào nữa——"
2663 = "Thời gian bên Nagi, dù ở đâu hay dưới hình thức nào, lúc nào cũng trôi qua cùng với những hoạt động không ngừng nghỉ."
2664 = "Dù trong chuyến tu học, tôi có trải qua khoảng thời gian gắn bó với Nagi đến nhường nào, thì vẫn không thể sánh bằng những gì Hibiki đã tích lũy từ trước đến nay."
2666 = "Giờ mới bắt đầu sửa soạn—— thì chắc sát nút giờ hẹn 5:00 mất."
2668 = "Nếu Nagi dùng, chắc chắn cũng sẽ không phù hợp với bản thân con bé. Nếu vậy——nếu vậy thì………… a!"
2674 = "Đúng là——Fukami tuy còn nhỏ tuổi, nhưng con bé sở hữu một thứ độc nhất vô nhị, không thua kém bất kỳ ai."
2677 = "Vì Nagi của ngày thường đã lao về với tốc độ tối đa, nên tôi cũng cảm thấy cần phải rào trước một câu."
2680 = "Sau tay trái, tôi chuyển sang xem tay phải. Thấy tôi dành thời gian xem xét cẩn thận, Nagi tò mò hỏi."
2690 = "Chẳng hiểu sao, chị Mayami lại tròn xoe mắt ngạc nhiên. Tôi thì chẳng thấy có gì đặc biệt kỳ lạ cả——"
2692 = "Chị Mayami định nói gì đó, nhưng hiếm khi lại ngập ngừng."
2695 = "Thứ chị Mayami lấy ra từ tủ lạnh là ức gà."
2697 = "Phải không? Ánh mắt chị Mayami như đang hỏi tôi vậy. Mỉm cười——một nụ cười thực sự hạnh phúc."
2698 = "Chị Mayami rưới dầu mè lên rau cải bẹ xanh, rồi xào xèo xèo trên chảo."
2700 = "Chị Mayami vui vẻ bắt đầu thái rau cải bẹ xanh."
2702 = "Chị Mayami bật cười. Trông thật hạnh phúc, thật mãn nguyện."
2712 = "Tôi đã dùng dao rạch hai bên gân của toàn bộ miếng ức gà."
2716 = "Trà xanh nóng hổi được rót vào bát, mùi thơm hấp dẫn tỏa ra ngào ngạt."
2733 = "Ít nhất thì, trong vòng 3 năm tới Nagi chắc chắn sẽ trở thành người lái tàu, và giới hạn độ tuổi trong các giải đấu kiếm đạo cũng sẽ thay đổi."
2735 = "Ít nhất là về góc nhìn thực tế đối với du lịch Ohimitera, hiện tại có lẽ đến cả mẹ của Fukami cũng không thể sánh bằng con bé."
2736 = "So với việc phải qua một bước chuyển đổi, thì thà copy nguyên xi sẽ học nhanh và chính xác hơn."
2747 = "Với tư cách là người lái tàu và phụ lái tàu. Trong lúc luyện tập kiếm thuật. Hoặc là, trên con thuyền xuôi dòng sông Kuma——"
2751 = "Cảm thấy bản thân vô giá trị, nên cố gắng làm theo chỉ thị của người khác, để lấp đầy sự trống rỗng đó. Nhưng."
2757 = "Góc rặng tre. Vừa mở túi đồ cửa hàng tiện lợi đặt trên tảng đá phẳng, là Nagi cũng lập tức bay đến ngay."
2760 = "Thế này——sao đây, có kịp——không!?"
2769 = "Bằng hành động đó, tôi ra hiệu cho con bé phải lắng nghe thật kỹ những gì tôi sắp nói, và tập trung vào."
2770 = "Ra là vậy, mọi chuyện đã kết nối lại với nhau."
2771 = "Lời nói không giống Nagi chút nào khiến tôi ngạc nhiên."
2772 = "Gì thế kia."
2773 = "Có lẽ đây là thành quả của việc vô số lần bị chai phồng rồi lại hồi phục."
2774 = "Chị ấy nói tôi mới nhớ, mục tiêu ban đầu đúng là vậy."
2777 = "Thông qua những ngày tháng tu học, từng chút một."
2778 = "Ngày nghỉ của tôi mà cũng bắt cô ấy phải bận tâm thì thật tội nghiệp. Tôi tắt báo thức, rón rén thay quần áo rồi đi ra phòng khách."
2782 = "Vậy thì, đây là ứng cử viên thứ hai. Tôi muốn có thêm một ứng cử viên nữa."
2783 = "Không phải là không thể vận động, nhưng để mồ hôi và bụi bẩn bám đầy lên thì thật là lãng phí."
2784 = "Từ khi tôi, Nagi và Fukami bắt đầu chuyến tu học, Hachiroku đã chuyển sang ngủ ở phòng của Hibiki——"
2785 = "Nói ra thì có vẻ hơi có lỗi, nhưng quả nhiên Nagi là kiểu người học bằng cơ thể chứ không phải bằng đầu óc."
2805 = "(Nhưng mà…… ra là vậy. Là dựa trên sự hướng dẫn đó sao——)"
2807 = "(Chỉ riêng cái mục tiêu người phụ nữ tuyệt vời gì đó, có vẻ hơi khó để đạt được trong 3 năm ha)"
2810 = "(Ra là vậy ra là vậy. Ngôn ngữ Hibiki của Hibiki, thì ra là sản phẩm từ sự hướng dẫn của Kisaki sao)"
2812 = "（Chát!）"
2813 = "（Bốp!）"
2814 = "(À——)"
2816 = "(Chắc là…… cũng giống như Michiko đối với tôi vậy)"
2818 = "(Bình thường tôi và Nagi…… đâu có đối mặt trò chuyện kỹ càng thế này đâu nhỉ)"
2819 = "（Ấn）"
2822 = "Sở dĩ Navi bảo vệ tôi một cách thái quá như vậy, là vì nếu không làm thế, có lẽ tôi đã vứt bỏ 'chính mình' rồi."

[selections]
