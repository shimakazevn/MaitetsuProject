1419 = "Môi, họng, lưỡi, nước bọt, ngón tay, lòng bàn tay, và cả núm vú.\\nTrước sự vuốt ve xa xỉ và hoàn hảo của Fukami, ham muốn xuất tinh ngày càng dâng cao."
1421 = "Sướng quá. Toàn bộ ý thức của tôi dồn hết vào sự cương cứng.\\nNhưng, nhưng——nếu đây là mô phỏng quá trình ủ rượu, thì."
1423 = "Lại trở về cách gọi anh Soutetsu rồi. Điều đó cũng khiến tôi thấy vui vẻ và yêu thương,\\ntôi thả lỏng cơ thể, dính chặt lấy em và trao một nụ hôn."
1425 = "Chuyển động của miệng cũng phối hợp với tay, trở nên mềm mại và dịu dàng hơn.\\nDùng lưỡi để mút mát theo những chuyển động lớn và chậm rãi——!"
1427 = "Không biết có phải là phần thưởng vì đã đoán đúng không, mà hòn bi của tôi được nhào nặn và ủ ấm thật mềm mại."
1428 = "Hơi thở ngọt ngào. Nhu động ngọt ngào. Mùi hương đậm đặc của Fukami cũng thật ngọt ngào.\\nGiọng nói ngọt ngào thẩm thấu vào tận cùng tâm trí đang bị sự ngọt ngào ấy bủa vây của tôi."
1431 = "Ngực cũng liên tục ép sát vào. Núm vú cứng ngắc cọ xát vào đùi.\\nXuyên qua lớp áo, tôi cảm nhận được nhiệt độ của Fukami đang tăng lên."
1433 = "Cổ tử cung dính chặt lấy và hôn lên quy đầu vừa mới tiến đến.\\nTrước khoái cảm bị mút mát liên tục, tinh trùng bắt đầu vùng vẫy dữ dội."
1440 = "Giống như một đứa trẻ đang sợ hãi bám chặt lấy,\\nâm đạo chỉ siết chặt một cách đầy bộc trực——"
1443 = "Âm đạo của Fukami vẫn dính chặt lấy tôi không rời,\\nvừa dính chặt vừa co bóp, liên tục làm tăng nồng độ và độ nhớt của tinh dịch."
1445 = "Sự co bóp dữ dội của âm đạo, cùng với tiếng hét đầy bối rối.\\nFukami có lẽ đã lên đỉnh. Nhưng——"
1446 = "Âm đạo và sự cương cứng hòa quyện nhóp nhép, đến mức không còn nhận ra ranh giới nữa.\\nTôi chỉ cảm nhận được rõ ràng cảm giác tinh trùng đang sôi sùng sục trong tinh hoàn."
1463 = "Niềm vui sướng mãnh liệt. Khoảnh khắc nó bộc lộ, cảm xúc của tôi cũng vỡ òa.\\nVui sướng, hạnh phúc, sung sướng——Tôi muốn Fukami——"
1476 = "Không còn trượt dài nữa. Thành âm đạo đang siết chặt ngọt ngào,\\ncổ tử cung đang hút lấy, không hề cho phép những chuyển động lớn."
1477 = "Không tự tin là em ấy có hiểu hay không,\\ntôi thử cử động sự cương cứng để ra hiệu."
1479 = "Tôi cũng cảm nhận được. Khoái cảm khi xuất tinh vào trong âm đạo của Fukami vẫn giống như mọi khi,\\nvẫn là cảm giác dính chặt tuyệt vời nhất——nhưng chắc chắn có thứ gì đó sâu sắc hơn thế."
1482 = "Tôi cũng đã đến giới hạn từ lâu. Nhưng tôi cắn răng, kìm nén thêm một chút,\\nmột chút nữa thôi. Để bắn toàn bộ tinh trùng vào trong Fukami!"
1486 = "Âm đạo của Fukami đáp lại từng chuyển động của tôi bằng cách co bóp liên tục——\\nKhông, cơ thể của cả hai chúng tôi đều đang khao khát cùng một chuyển động."
1487 = "Sâu bên trong chiếc váy đang vén lên,\\nchỉ khẽ chạm qua lớp quần lót, đã thấy ướt át trơn tuột."
1489 = "Không phải là dính chặt mà là hòa làm một. Sự gắn kết vượt lên trên cả việc da thịt kề nhau.\\nTrở thành bạn đời, trở thành vợ chồng——"
1490 = "Hơi thở trở nên thô bạo. Tiếng nước và mùi hương ngày càng đậm đặc.\\nTăng tốc, nóng dần lên——nhưng Fukami đột nhiên nới lỏng tay."
1493 = "Bộ phận sinh dục đang bán cương của tôi dễ dàng cương cứng hoàn toàn.\\nFukami nhẹ nhàng cử động tay, vuốt ve sự cương cứng đó."
1495 = "Dù chỉ là ý nghĩ chợt nảy ra, tôi thử dùng phần móng tay vuốt nhẹ.\\nCó vẻ như thế này lại vừa vặn với Fukami lúc này."
1497 = "Tôi mút mát ngón tay vừa rút ra từ âm đạo của Fukami."
1498 = "Mở rộng hai ngón tay thành hình chữ V, đưa không khí bên ngoài vào đường âm đạo của Fukami.\\nSau đó lại khép ngón tay lại——"
1501 = "Dù mới chỉ cắm vào rất rất nông,\\nnhưng âm đạo đã dính chặt và siết chặt, cố gắng dụ dỗ tôi vào sâu hơn."
1503 = "Tôi cứ tưởng em ấy sẽ lao vào làm tình luôn,\\nnhưng em ấy lại hỏi một câu ngây thơ với vẻ mặt ngây thơ."
1504 = "Ngón tay càng giảm tốc độ hơn nữa. Chuyển sang động tác trêu chọc.\\nRõ ràng là em ấy đang cầu xin tôi cắm vào——nhưng——"
1505 = "Thay vì hôn, thay vì ôm, tôi dùng những ngón tay đang\\nđỡ lấy eo em truyền vào đó toàn bộ sức lực."
1507 = "Không thể chờ đợi đến lúc Fukami cởi hết đồ,\\ntôi kéo vòng eo thon thả của em ấy lại và nhấc bổng lên."
1510 = "Vì vậy, tôi bắt đầu di chuyển.\\nHướng đến nơi sâu nhất của Fukami mà từ nãy đến giờ tôi vẫn cố tình tránh."
1526 = "Cảm giác như toàn bộ lông măng trên cơ thể đều dựng đứng."
1530 = "Đám tinh dịch đang nhảy múa trong sự hân hoan, chạy rần rần bên trong sự cương cứng.\\nĐể ngăn chúng bùng nổ, tôi vừa nhấc bổng hông Fukami lên——"
1532 = "Khoảnh khắc tôi lơi lỏng cảnh giác trước cuộc trò chuyện vô thưởng vô phạt,\\nFukami chồm lên người tôi, kéo tuột quần dài và quần lót của tôi xuống."
1541 = "Mồ hôi, nước bọt, nước mắt và ái dịch. Cơ thể Fukami giờ đã ướt sũng.\\nCơ thể tan chảy hơn cả kem, tràn đầy nhiệt khí và nhuốm màu hồng phấn,"
1542 = "Bị siết chặt nhưng không hề thấy đau.\\nTôi chỉ cảm nhận được rõ ràng hơn sự co bóp trong khi vẫn đang dính sát vào nhau."
1546 = "Niêm mạc bên trong Fukami cứ nũng nịu bám chặt lấy tôi.\\nBị dính chặt như vậy, vốn dĩ âm đạo cũng đã khá hẹp rồi——"
1547 = "Chụm các ngón tay lại thành hình khum khum, áp bàn tay đó vào tinh hoàn,\\nvà nhẹ nhàng, mềm mại bao bọc lấy nó."
1550 = "Có lẽ vì cùng tưởng tượng ra cảnh đó nên ái dịch của Fukami cũng túa ra nhiều hơn.\\nChỉ cần chạm nhẹ đầu ngón tay vào cửa mình, nó liền đáng yêu mút lấy."
1552 = "Cùng một cảm giác, không biết có phải em cũng đang nhớ lại khoái cảm này hay không, giọng nói của Fukami\\nnghe có vẻ mơ màng, nhưng, nhưng tận sâu trong đó——"
1554 = "Chiếc lưỡi thò ra từ miệng Fukami.\\nNhưng nó không hề chạm vào sự cương cứng——"
1556 = "Giọng nói ướt át đầy mê đắm của Fukami thấm qua màng nhĩ vào não bộ.\\nLời nói của chính tôi khi qua miệng Fukami, lại mang một ý nghĩa sâu sắc hơn hẳn."
1558 = "Vừa phả ra hơi thở nóng hổi, Fukami vừa luồn lưỡi vào.\\nĐúng là, ngọt thật——hương rượu cũng cực kỳ nhạt——!!"
1560 = "Có lẽ là nửa vô thức. Đầu vú của Fukami đang ép chặt vào đùi tôi\\nđã hoàn toàn cương cứng."
1562 = "Mỗi lần Fukami tuốt lấy sự cương cứng, âm thanh lại càng thêm ướt át.\\nNgoài lượng nước bọt đặc sệt nhỏ xuống, chất dịch bôi trơn cũng liên tục túa ra."
1564 = "Nhìn thế nào Fukami cũng đang say.\\nMặt đỏ bừng, đẫm mồ hôi, nhịp thở gấp gáp."
1565 = "Bằng những câu chuyện ví von, Fukami đang dụ dỗ tôi.\\nChính vì tin chắc điều đó, nên tôi muốn truyền đạt bằng chính lời lẽ của mình."
1568 = "Tiếng rên rỉ vì sung sướng của Fukami nghe như một tiếng thét.\\nCơ thể tôi cũng run rẩy và thở dốc với cùng một nhịp điệu. Bởi vì!"
1570 = "Giọng nói và lời nói bị khóa chặt bởi đôi môi ẩm ướt, căng mọng."
1572 = "Em ấy đã nhìn tôi bằng ánh mắt ngang hàng. Fukami, người luôn lùi lại một bước——\\nngười luôn tôn trọng tôi, dù chỉ trong khoảnh khắc làm tình này——"
1574 = "Miệng Fukami di chuyển lên xuống với tốc độ và cường độ chưa từng có.\\nVừa dùng môi siết chặt, vừa lấy lưỡi làm đường ray dài."
1575 = "Không biết có phải muốn làm chậm chuyển động ngón tay của tôi hay không,\\nnhưng những ngón tay của Fukami đang vuốt ve sự cương cứng của tôi thật mạnh và nhanh."
1578 = "Fukami trộn lẫn tinh chất rượu ngọt với nước bọt rồi xoa lên quy đầu của tôi."
1580 = "Không biết có phải là câu trả lời hay không, mà chuyển động của Fukami lại thay đổi.\\nVuốt ve hòn bi với nhịp độ nhẹ nhàng, nhưng đầu thì lại di chuyển với biên độ lớn."
1583 = "Phản ứng tốt hơn mọi khi rất nhiều.\\nÀ không, có lẽ việc tôi đang ôm hông em ấy đã tạo ra một góc đâm——"
1585 = "Khuôn mặt Fukami càng đỏ bừng hơn, và cuối cùng, em ấy cũng nhận ra."
1586 = "Hai bắp đùi cọ xát vào nhau một cách ngượng ngùng.\\nChỉ bấy nhiêu thôi cũng đủ làm mùi hương phụ nữ trở nên đậm đặc——thổi bùng lên một ham muốn khác."
1588 = "Đột nhiên Fukami ngậm sâu vào——\\nThu trọn toàn bộ sự cương cứng của tôi vào miệng cùng một lúc——!"
1589 = "Cẩn thận, nhớp nháp, dính dấp——chính vì thế,\\ncách dùng lưỡi này lại dấy lên một cảm giác thiếu thốn ngứa ngáy."
1591 = "Lấy lưỡi làm đường ray, nước bọt từ từ rót xuống sự cương cứng của tôi.\\nNhỏ giọt tầng tầng lớp lớp, giống như mật ong rưới lên bánh pancake vậy."
1595 = "Truyền đến sự cương cứng. Cảm xúc trần trụi của Fukami, còn nhanh hơn cả lời nói.\\nCửa mình run rẩy một cách ngọt ngào, như thể em ấy đang khóc vì sung sướng."
1596 = "Vừa hôn, những ngón tay của Fukami vừa sờ soạng đũng quần tôi.\\nXác định vị trí quy đầu qua lớp quần, rồi dùng ngón tay đùa giỡn với phần đầu khấc."
1598 = "Do lực quá mạnh, quy đầu đâm thẳng vào tận cùng cổ họng.\\nCảm giác tội lỗi và khoái cảm chạy dọc sống lưng lên não khiến tôi choáng váng——!!!"
1606 = "Toàn bộ đường âm đạo chật chội đó thắt chặt lại, kyuun.\\nKhông có cảm giác gì đặc biệt khác lạ so với những chỗ khác trong âm đạo, nhưng——"
1608 = "Chuyến tham quan nhà máy nấu rượu chúng tôi ghé qua trên đường đi hẹn hò về.\\nNghĩ rằng rượu shochu vẫn còn quá sớm với Fukami nên tôi đã lấy rượu ngọt cho em ấy."
1621 = "Cảm giác hòa làm một dần tan biến theo nụ hôn.\\nNhưng chắc chắn vẫn còn lại cảm giác không đổi——cảm giác đã trở thành bạn đời của nhau."
1622 = "Thành thật mà nói, tôi muốn bắn tinh ngay bây giờ. Bắn nhiều đến mức em ấy không nuốt kịp,\\nvà tô điểm một lớp trang điểm trắng đục lên đôi má ửng hồng vì say rượu kia."
1630 = "Khẳng định lại rằng em ấy chỉ giả vờ say để vòi vĩnh, tôi chợt nghĩ.\\nTừ trước đến nay, tôi đã bỏ lỡ bao nhiêu lời vòi vĩnh của em ấy rồi nhỉ."
1631 = "Nếu cứ thế này, tôi sẽ bắn tinh mất——\\nPhải tìm cách làm Fukami thả lỏng ra mới được——A,"
1632 = "Khác với mọi khi, lần này là tay trái.\\nKhông thể bất cẩn với cái âm đạo vô cùng vô cùng quan trọng này được, nhưng——"
1635 = "Khoái cảm ập đến chậm hơn một nhịp. Nổi cả da gà. Cảm giác hòa làm một giữa toàn bộ dương vật đang cương cứng và âm đạo của Fukami.\\nChúng tôi dính sát vào nhau không còn kẽ hở cho dù chỉ là một giọt dâm thủy——"
1637 = "Nếu vậy, thì tôi cũng thế. Đơn giản là chụm các ngón tay lại,\\nvà tiến vào sâu nhất có thể bên trong Fukami——"
1643 = "Sự run rẩy của âm đạo đã hoàn toàn nới lỏng và mất đi sự căng cứng.\\nBám chặt kyu kyu, nhu động vừa vắt kiệt vừa dụ dỗ tôi vào sâu hơn."
