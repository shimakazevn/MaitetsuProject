2487 = "「Vì anh nghĩ, nếu cứ khư khư ôm giữ lấy, kỷ niệm sẽ bị bóp méo, và biến chất trong tâm trí mình」"
2489 = "「Nếu là em…… lần đầu tiên ở cùng anh Soutetsu, chỉ có hai người, ở…… cái đó, trong phòng chẳng hạn…… dạ」"
2492 = "「Nếu chỉ đến mức bị ghi đè, bị bôi xóa mất, thì anh nghĩ ngay từ đầu, đó đã không phải là một kỷ niệm gì to tát rồi」"
2495 = "「Buồn sao?」"
2502 = "「Đúng vậy. Có lẽ họ nghĩ rằng, cả nhà ga sẽ bị phá hủy và vứt bỏ. Họ đã tưởng tượng ra điều đó」"
2503 = "「Ra vậy! \\\\x%lバラスト;#00ffc040;Đá ba-lát%l;#; này—— còn có tác dụng thoát nước tốt nữa nhỉ!」"
2505 = "「Là Fukami đó. Mũ rơm. Váy trắng tinh khôi. Và tuyến đường sắt cuối mùa hè」"
2506 = "「Là mặt đất nâng đỡ tuyến đường sắt. Giống như Đường sắt Ohitera, mặt nền được rải \\\\x%lバラスト;#00ffc040;đá ba-lát%l;#; thì gọi là 『mặt nền ba-lát』」"
2509 = "「Đấy, khuôn mặt như thế này chẳng hạn」"
2510 = "「Túp lều \\\\x%l保線;#00ffc040;bảo trì đường ray%l;#;—— tàn tích của nó thôi. Từng là nhà kho chứa dụng cụ \\\\x%l保線;#00ffc040;bảo trì đường ray%l;#;, kiêm luôn chỗ nghỉ ngơi」"
2512 = "「Hạnh phúc…… ạ?」"
2515 = "「Làm rối, cũng được, ạ. Vì đó chắc chắn, cũng sẽ là một kỷ niệm tuyệt vời được tô điểm thêm」"
2517 = "「Đúng rồi. Như vậy trông đẹp hơn」"
2519 = "「Sắp mưa to rồi」"
2524 = "「Sao lại, không được?」"
2525 = "「Sao vậy? Fukami」"
2526 = "「Sao vậy?」"
2527 = "「Sao thế? Hôm nay em để ý đến Nagi nhiều nhỉ」"
2530 = "「Bí mật…… giữa hai người con trai á?」"
2531 = "「C, có nghĩ ạ…… nhưng——」"
2533 = "「Khá là—— nhiều lá cây rậm rạp nhỉ」"
2534 = "「Đẹp như một bức tranh, đến mức bất ngờ đấy」"
2539 = "「Sự vươn lên…… Vậy thì, điều đó, Nagi cũng có, đúng không ạ, chắc chắn là vậy」"
2541 = "「C, chuyện em chỉ tình cờ kể một chút—— Anh Soutetsu vẫn nhớ, em vui lắm. Ạ」"
2544 = "「A, em sẽ đi bộ, ạ. Em cũng muốn xem phía trước nữa」"
2546 = "「Một mình—— ra trước—— ưm—— hà—— Là, không—— chịu—— đâu, ạ—— ưm」"
2547 = "「Anh cũng vậy」"
2548 = "「Anh cũng vậy. Anh muốn toàn bộ của Fukami」"
2550 = "「Em mới chỉ nhìn thấy qua cửa sổ thôi nhưng…… Đây là—— nhà ga bỏ hoang, sao ạ?」"
2552 = "「Em, chỉ là—— chuyện về đường sắt, chỉ có Nagi, được làm cùng với anh Soutetsu, em thấy ghen tị thôi」"
2553 = "「Thứ anh cần, là nước bọt của em mà」"
2554 = "「Anh có thể khẳng định. Những kỷ niệm thực sự quan trọng, dù có chuyện gì xảy ra, cũng tuyệt đối không bao giờ bị bôi xóa, hay bị tổn hại」"
2557 = "「Em băng qua đường ray, có sao không ạ?」"
2559 = "「Em bé—— em—— muốn—— mang thai, Anh Soutetsu, hãy cho, em, em bé, đi」"
2560 = "「Người con gái anh yêu, Fukami, đã mong muốn được đi dạo ở đó, được gần gũi với nó—— thì làm sao anh lại không vui cho được」"
2562 = "「Anh là \\\\x%l機関士;#00ffc040;lái tàu%l;#; mà. Chịu nóng rất giỏi」"
2565 = "「Anh làm vẻ mặt đó sao」"
2566 = "「Anh nghĩ vậy đó—— Thử đứng ở đó một chút xem nào」"
2568 = "「Khi ở riêng hai người với Fukami, sẽ không nói chuyện về Nagi—— Anh đã nghĩ làm như vậy sẽ tốt hơn cơ mà?」"
2570 = "「Anh cũng đoán vậy」"
2572 = "「Anh thậm chí còn cảm nhận được vẻ đẹp của chính sinh mệnh. Trong Fukami, có ẩn chứa vẻ đẹp của sự vươn lên」"
2574 = "「Anh biết chứ, nhưng hình dáng nó dễ nắm thế này thì」"
2575 = "「Để anh cõng đi. Lên lưng anh nào」"
2577 = "「Em biết, ạ. ——Ưm—— hình, dáng—— Của, anh, Soutetsu—— phù—— của, chim——」"
2580 = "「Em muốn…… được cõng thêm một chút nữa cơ, ạ」"
2581 = "「Em sẽ quay lại ngay đây~」"
2583 = "「……Có khi họ đã chia tay rồi cũng nên. Vẽ chiếc ô chung tình lên tấm áp phích ghi chữ 『Tạm biệt』 mà lị」"
2585 = "「Cái đó…… nên—— em, nghĩ là, hôm nay phải——」"
2588 = "「Vì vậy, nó khá là sạch sẽ…… nói đúng hơn là, ở đây có cả mái che đàng hoàng nữa nhỉ」"
2590 = "「Nên, em cũng—— muốn biết thêm một chút, về thế giới của anh Soutetsu và Nagi, em đã nghĩ vậy」"
2591 = "「Bóp méo, là sao ạ……」"
2593 = "「Em không tìm thấy. Một thứ gì đó, để em và anh Soutetsu có thể tô điểm thêm kỷ niệm ở đây」"
2596 = "「Nó sẽ ngày càng nghiêng hơn, và rồi chắc chắn, một lúc nào đó——!」"
2602 = "「Hibiki đang vẽ một bức tranh về dòng sông. Con bé tô lên một màu xanh nước biển tuyệt đẹp. Đó là kỷ niệm đầu tiên」"
2605 = "「V, vậy sao ạ? Hehe」"
2607 = "「V, vâng…… dạ—— dẫu sao thì, hiếm khi mới có buổi hẹn hò của hai đứa, mà…… lần trước thì—— cái đó」"
2608 = "「V, vâng」"
2615 = "「A—— ừ, đúng vậy」"
2617 = "「Đúng là vậy ạ…… Hơn nữa, em lại—— ơ!?」"
2619 = "「Đúng vậy. Điều đó có lẽ—— Anh nghĩ là một điều rất hạnh phúc」"
2620 = "「Ừm. Nếu là vị trí các máy bán hàng tự động dọc tuyến đường sắt, thì anh nắm rõ gần hết đấy」"
2622 = "「Đúng vậy」"
2623 = "「Đúng không ạ!」"
2625 = "「Ừ, đẹp là chuyện đương nhiên」"
2627 = "「Đúng vậy. Nếu phớt lờ điều đó, thì sẽ có vô số lựa chọn khác——」"
2629 = "「Ừ, thậm chí có thể gây ra tai nạn. Vì vậy, nhổ cỏ mới trở thành ưu tiên hàng đầu」"
2630 = "「Ừ. Anh nghe nói ngay trước khi Đại bãi bỏ các tuyến đường sắt diễn ra, do yêu cầu mạnh mẽ của địa phương nên nó vừa mới được tu sửa lại」"
2632 = "「Đúng vậy. Nếu lên đỉnh, thì cùng nhau sẽ tốt hơn」"
2634 = "「Đúng vậy. Ví dụ như chỗ này, tuy rất đơn sơ, nhưng là phòng chờ đấy」"
2635 = "「Ồ」"
2636 = "「Ra vậy. Nếu thế thì là quanh đây nhỉ」"
2637 = "「Vậy à. Thế thì anh xin phép nhé」"
2638 = "「Vậy à, thế thì—— Đúng rồi, hãy quay lại ga Ohitera Onsen trước 17:10 nhé」"
2639 = "「Ra vậy?」"
2640 = "「Vậy sao? À mà cũng đúng, đây đâu phải nơi để cất công đến xem chứ」"
2642 = "「Chắc là do mồ hôi, hoặc là do độ ẩm đấy」"
2644 = "「Đúng vậy. Và nếu cứ để mặc cỏ dại mọc, tuyến đường sắt có thể sẽ dễ dàng sụp đổ đấy」"
2645 = "「Vâng ạ!」"
2647 = "「Đúng, vậy ạ. Em hơi…… muốn ngồi nghỉ một chút, ạ」"
2649 = "「Đúng là cũng có khả năng đó. Nhưng, anh đang giả định là họ bị cấm hẹn hò vì kỳ thi」"
2651 = "「Chỗ này, ạ—— háng—— cô, bé, nữa—— Muốn—— anh Soutetsu—— chạm vào——」"
2653 = "「Thời gian và địa điểm đều không ổn đâu」"
2659 = "「Nước nguội em lại thích hơn, ạ. Bây giờ mà uống nước lạnh đột ngột, chắc em đau bụng mất」"
2660 = "「V, vậy—— sao, ạ?」"
2661 = "「Chỗ đó, cảm giác—— hà—— a—— ngón tay, Vuốt ve—— ưm—— cọ, sang, hai bên」"
2664 = "「Yêu cầu, mạnh mẽ, của địa phương?」"
2681 = "「Nước đây. Em nên bổ sung đi」"
2685 = "「Đúng ý anh đấy. Hãy cùng nhau tô điểm thêm nào」"
2688 = "「Không có gì, Fukami rất thông minh, lại là một cô bé ngoan. Vì thế, anh nghĩ em sẽ chịu đựng được」"
2689 = "「Không sao đâu. Làm vậy thì kỷ niệm sẽ càng sâu sắc hơn mà」"
2690 = "「Không, nếu vậy khi Fukami tham quan \\\\x%l運転台;#00ffc040;buồng lái%l;#;, anh nghĩ mượn \\\\x%lナッパ;#00ffc040;trang phục bảo hộ%l;#; của Hibiki sẽ tốt hơn」"
2694 = "「Fuka…… ưm—— ưm…… chụt」"
2695 = "「Fukami」"
2697 = "「Fukami, thế này, thì—— anh không rút ra được, đâu」"
2699 = "「Fukami, lại đây!」"
2700 = "「Để đảm bảo an toàn, phải làm những việc cần làm mà không được lơ là. Dù là đường sắt hay đường thủy, anh nghĩ bản chất đều giống nhau」"
2701 = "「Sao vậy, là sao?」"
2705 = "「Cứ thế, những màu sắc mới được tô chồng lên. Hết lớp này đến lớp khác. Rồi đến một lúc nào đó, không biết từ bao giờ, chúng tạo ra một sự hài hòa」"
2706 = "「Sau đó, Hibiki lại tô chồng lên một màu hoàn toàn khác. Ví dụ như màu xanh lá, màu trắng. Đôi khi, cả màu vàng hay màu đỏ nữa」"
2707 = "「Em không thấy nóng sao?」"
2712 = "「Thực tế, bây giờ cũng vậy mà. Ở nơi chứa đựng kỷ niệm quan trọng với Nagi, lại được điểm thêm những kỷ niệm sống động với Fukami——」"
2713 = "「Lên kỷ niệm quan trọng của Nagi và anh Soutetsu, bây giờ chúng ta, chắc chắn, đang tô điểm thêm kỷ niệm của mình」"
2716 = "「Mùa hè thì đành chịu thôi. So với cành cây, thì việc nhổ cỏ phải được ưu tiên hơn mà」"
2717 = "「Ngược lại? Sao ạ?」"
2719 = "「Biết, biết gì cơ, ạ?」"
2728 = "「Ra vậy, có lý. Nhưng, nói là hạnh phúc thì——!」"
2729 = "「Đúng là có cảm giác họ quá thiếu suy nghĩ—— Nhưng biết đâu được. Không chừng lại ngược lại đấy?」"
2733 = "「Hóa ra nó nằm ở chỗ này—— Em, hoàn toàn không biết luôn」"
2735 = "「Đây」"
2736 = "「Cái này, là để đáp lễ lúc nãy, ạ」"
2747 = "「Tuyến đường sắt, cũng giống như dòng sông. Nghĩ vậy, em thấy nó đẹp hơn trước nhiều lắm!」"
2752 = "「Việc tuyến đường sắt và Fukami của ngày hôm nay, lại trở thành một bức tranh sống động đến thế này」"
2753 = "「Đường sắt, hay dòng sông, cũng giống nhau. Không được lơ là, cũng không được chủ quan」"
2765 = "「Nếu cỏ bắt đầu giữ nước, nó sẽ càng mọc um tùm hơn, bám rễ sâu, và làm biến dạng mặt nền đường sắt vốn có」"
2767 = "「Quần áo—— hay gì đó—— sao cũng, được—— phù—— ưm—— phù—— a ư」"
2769 = "「Quần áo, mà. Vừa mới mua, lại còn trắng tinh nữa」"
2770 = "「Để chỉ ranh giới khu đất đấy. Phía bên kia hình như, là nơi họ hái và bán dương xỉ tự nhiên hay sao ấy」"
2773 = "「Nếu những dòng nước đó hình thành—— thì sỏi và đất cũng sẽ bị cuốn trôi theo nước mất, ạ」"
2775 = "「Nếu đất quanh \\\\x%l枕木;#00ffc040;tà vẹt%l;#; lún xuống, \\\\x%l枕木;#00ffc040;tà vẹt%l;#; và đường ray cũng lún theo. Độ nghiêng sẽ càng bị đè nặng thêm mỗi khi tàu chạy qua——」"
2776 = "「Nếu nói không nóng…… thì là nói dối mất, ạ」"
2777 = "「Dùng từ bóp méo thì…… có lẽ hơi quá mạnh……. Nếu cứ cất giấu kỷ niệm, ôm giữ nó quá mức」"
2782 = "「Nóng thì sẽ đổ mồ hôi mà nhỉ」"
2784 = "「Ưm…… ướt nhẹp hết cả rồi—— ưm」"
2785 = "「A, từ từ đã, không được đâu!」"
2786 = "「Khi em nói muốn đi dạo dọc theo tuyến đường sắt, thành thật mà nói anh rất ngạc nhiên. Nhưng…… chà, đây đúng là một buổi hẹn hò tuyệt vời」"
2792 = "「Mặt nền đường sắt?」"
2817 = "「Chuyện đó…… nhưng——」"
2818 = "「D, dạ…… hôm nay, vì định sẽ đi bộ nhiều, nên—— em nghĩ là, sẽ nóng, nên mới」"
2819 = "「Vào hết…… rồi nhỉ」"
2820 = "「Chuyện đó! Chuyện đó thật sự rất lãng mạn!」"
2821 = "「Thế này thì—— chịu không nổi」"
2822 = "「Thế này thì gay go đây」"
2823 = "「Thế thì không được! Fukami, đừng rời xa anh」"
2824 = "「Thế thì không được. Để anh chăm sóc nó, kẻo nó giãn ra mất」"
2825 = "「Mây kìa. Đã hoàn toàn chuyển thành mây đen rồi」"
2826 = "「Anh hoàn toàn không đoán được—— nhưng……」"
2827 = "「Chuyện đó, em hiểu mà. Ạ」"
2828 = "「Tại sao lại thế?」"
2829 = "「Nếu vậy, em, muốn tô điểm thêm. Lên trên những kỷ niệm với Nagi, thêm nhiều kỷ niệm mới nữa」"
2830 = "「Cái gốc cây này…… của Nagi」"
2831 = "「Lần này, anh Soutetsu, uống trước đi ạ」"
2832 = "「Cách nghĩ đó—— rất giống anh Soutetsu nhưng…… Nếu là em, chắc em sẽ thấy hơi buồn một chút, ạ」"
2833 = "「Chỗ này, cũng phải chăm sóc trước mới được」"
2834 = "「Nếu là ở đây, chúng ta có thể tránh mưa gió đấy」"
2835 = "「Nơi này…… là」"
2837 = "「\\\\x%lバラスト;#00ffc040;Đá ba-lát%l;#; không chỉ dùng để giảm chấn động của tàu. Nó còn bảo vệ tuyến đường sắt khỏi cỏ dại nữa」"
2838 = "「Vẫn, chưa xong đâu——」"
2839 = "「Đúng thật. Là chiếc ô chung tình à」"
2841 = "「D, dạ—— chẳng hạn, là—— ưm, mông, chẳng hạn…… h… háng—— háng, chẳng hạn, ạ」"
2843 = "「A, cái đó—— cái đó…… anh Soutetsu. Được anh khen, em vui lắm. Vui lắm, nhưng——」"
2845 = "「Không còn là màu nước đơn thuần nữa. Mà trở thành, màu của dòng sông thực sự」"
2854 = "「Vậy thì, anh muốn em cười. Nụ cười hạnh phúc, quả nhiên vẫn là đẹp nhất」"
2855 = "「Vậy, em có muốn thử lên không? Lên \\\\x%l運転台;#00ffc040;buồng lái%l;#; của chiếc 8620. Nếu là tham quan thì lúc nào cũng hoan nghênh」"
2857 = "「Dạ…… xuống—— dưới một chút nữa——」"
2858 = "「Dạ…… anh Soutetsu, cũng uống nước đi」"
2859 = "「Dạ, cái gì là—— thì, tuyến đường sắt, hay những chuyện về đường sắt, ạ」"
2860 = "「Dạ, em. Không có nghĩ đến những điều lớn lao như vậy đâu, ưm, không có—— ạ」"
2861 = "「Dạ, nơi này—— là nơi chứa đựng kỷ niệm, rất quan trọng của anh Soutetsu và Nagi」"
2863 = "「Vậy, lúc đó anh sẽ sắp xếp như thế. ……Bộ quần áo như vậy, không ngờ lại có vẻ hợp với Fukami đấy」"
2865 = "「Vậy thì, hãy để dành niềm vui đó lúc về nhé. Bây giờ, ngồi xuống một lát, duỗi chân ra nghỉ ngơi đi」"
2867 = "「Lúc quay về Ohitera thì em định làm thế nào?」"
2869 = "「Chúng ta phải…… tiếp tục trú mưa thôi」"
2871 = "「Đó là mốc thời gian để thay \\\\x%l枕木;#00ffc040;tà vẹt%l;#;. Dấu X là lần thay sau của lần thay tới. Còn nếu khoanh tròn chữ X đó lại, thì là sẽ thay vào lần thay tới」"
2873 = "「Thậm chí còn chẳng phải là thứ thừa thãi đâu. Ít nhất, nếu đó là Fukami, Nagi và anh」"
2875 = "「Em có thể đi thêm một chút nữa không? ——À, không」"
2876 = "「Chỗ đó—— không—— đừng—— phù, a—— Sướng, quá—— mất—— ưm—— không được, phù, ư」"
2878 = "「Đằng kia—— sao tự nhiên lại có hàng rào vậy ạ?」"
2880 = "「Vậy, tính sao đây? Chúng ta mới chỉ bắt đầu đi dạo thôi mà」"
2881 = "「Vậy, nếu hình dạng mặt nền đó bị rễ cây làm thay đổi thì sao?」"
2882 = "「Giữa hai người con trai」"
2887 = "「Đường sắt, tuyệt thật…… đấy ạ. Tuyến đường dài hơn 20km, mà được chăm sóc kỹ lưỡng đến vậy」"
2888 = "「Đường sắt cũng từng có một thời kỳ như vậy. Một thời đại mà nó được kỳ vọng rất nhiều với tư cách là phương tiện giao thông công cộng」"
2889 = "「Không phải toa xe hay nhà ga, mà là tuyến đường sắt. Mặc dù là xương sống của đường sắt, nhưng lại là một sự tồn tại mờ nhạt, ít được mọi người quan tâm đến bản thân nó」"
2893 = "「Nếu cỏ mọc lên, \\\\x%lバラスト;#00ffc040;đá ba-lát%l;#; và sỏi sẽ bị đẩy sang một bên. Khi đó, chỗ đó sẽ trở thành nơi đọng nước」"
2895 = "「Nghĩ vậy rồi, em thấy được khá nhiều thứ. Ạ. Kiểu như, những ký hiệu được viết trên \\\\x%l枕木;#00ffc040;tà vẹt%l;#;? chẳng hạn」"
2897 = "「Nhổ cỏ」"
2898 = "「Ánh nắng, thật chói chang và dễ chịu, ạ」"
2902 = "「Anh Soutetsu, sao vậy, ạ?」"
2903 = "「Anh Soutetsu? Em bỏ anh lại đó nha~?」"
2904 = "「Anh Soutetsu? Chỗ bên cạnh em, còn trống này?」"
2905 = "「Anh Soutetsu. Mặc thế này, không nóng sao ạ?」"
2906 = "「Anh Soutetsu?」"
2909 = "「Mưa…… vẫn chưa, tạnh, nhỉ?」"
3127 = "Lồi và lõm. Thậm chí ở cấp độ của những nếp gấp thịt, những điểm gồ ghề của quy đầu, chúng cũng đang cắn chặt lấy nhau, thu hút nhau, dính sát rồi lại tách rời nhau."
3129 = "Dòng nước màu trắng chảy quanh miệng em, bên trong chiếc cổ mỏng manh ấy, mỗi khi cử động, lại từ từ trôi tuột xuống bụng Fukami——"
3131 = "Khoảnh khắc đó, một lực siết chặt như muốn vắt kiệt ập đến."
3134 = "Trao nhau nụ hôn, hòa quyện nước bọt vào nhau, đến tận bây giờ tôi mới lại ý thức được sự mỏng manh của Fukami."
3135 = "Hít thở sâu liên tục, khẽ lẩm bẩm \\\"thật tình\\\", rồi sau đó—— cuối cùng em cũng đưa mắt nhìn về phía tôi."
3137 = "Một cơn gió giật mạnh làm tung bay vạt váy của Fukami. Mùi hơi nước trong không khí ngày càng nồng đậm."
3141 = "Không ổn rồi. Có vẻ như tôi cũng đang bị cơn sốt này cuốn đi. Dứt ánh mắt khỏi Fukami——"
3144 = "Không phải là nở nụ cười tự nhiên, mà là sự gượng gạo khiến người ta cảm thấy như đang cố nặn ra."
3146 = "Nhưng…… thôi thì, những nét chữ tròn trịa này, có lẽ là của những người trẻ tuổi."
3148 = "À, ra vậy. Từ vị trí của Fukami thì có thể nhìn thấy sao. Quanh khu vực đó cũng có——"
3156 = "Phần trần của Fukami, nơi những thớ thịt gợn sóng rõ rệt, tôi chậm rãi, miên man vuốt ve xoay tròn."
3166 = "Tham quan \\\\x%l保線;#00ffc040;bảo trì đường ray%l;#;. Dưới danh nghĩa đó, tôi đã xin được giấy phép vào khu vực này cho Fukami."
3170 = "Mỗi khi đôi tay thon gầy ấy cử động, từng giọt từng giọt nước, từ vạt váy rơi xuống tí tách."
3171 = "Nhưng chẳng bao lâu sau, em lại nhìn vào mặt tôi. Trông em có vẻ ỉu xìu đi phần nào."
3174 = "Thế nhưng, bên tai tôi và Fukami, vẫn còn vang vọng tiếng mưa rơi."
3178 = "Sản xuất hàng loạt trong nước, cỗ máy số 1, thực sự thể hiện sự uy nghiêm, niềm tự hào, và cả vẻ đẹp của toàn bộ đất nước Hinomoto."
3185 = "Gió tạt ngang quất những hạt mưa vào người."
3203 = "Dù đã tiếp nhận cơ thể tôi, nhưng vẫn còn bỡ ngỡ với tình dục, ——đó là cảm giác, từ âm đạo, của Fukami."
3206 = "Thời gian cho mỗi cặp đôi, được điều chỉnh lịch trình hàng tuần sao cho đồng đều nhất có thể."
3208 = "Nhưng thêm một cú đâm nữa. Thêm một cú đâm nữa thôi. Đến tận cùng phía bên kia nơi sâu nhất, trong âm đạo của Fukami——!"
3218 = "Khuôn mặt đang cứng đờ vì ngạc nhiên, giờ lại nở rộ nét bẽn lẽn."
3232 = "Nhưng, cơ thể tôi không thể dừng lại. Da thịt của Fukami, và da thịt của tôi đang hô ứng với nhau."
3238 = "Hôn, hôn, hôn. Lặp lại nhẹ nhàng vài lần, bên trong cơ thể tôi nóng dần lên."
3244 = "Chỉ có khu vực xung quanh đó, quả nhiên, tôi cảm thấy bầu không khí có chút khác biệt."
3250 = "Có việc gấp đột xuất, nên buổi hẹn hò bị hủy."
3251 = "Ý nghĩa của việc làm tình, mục đích hướng tới—— Cả ý thức và cơ thể tôi, đều đã thấu hiểu."
3252 = "Nhấn chìm ký ức về Michiko trong lớp hắc ín mang tên cảm giác tội lỗi, tôi đã bóp méo đi hình bóng và ước nguyện thực sự của con bé."
3257 = "Chưa đầy một km nữa, có một nhà ga bỏ hoang vẫn còn trong tình trạng tốt."
3259 = "Cố tình làm vậy cho tôi xem, rồi mới đưa chai nước về phía tôi."
3261 = "Không phải bị cưa đứt, mà là bị đập gãy, gốc cây vẫn còn lưu lại dấu vết rõ mồn một."
3272 = "Mong muốn của chúng tôi, là giống nhau. Tôi kéo rộng khóa quần ra——"
3276 = "Môi lớn cũng mỏng manh, vậy mà nó lại kẹp chặt lấy đầu ngón tay tôi một cách rõ ràng, đòi hỏi nhiều hơn, nhiều hơn nữa."
3282 = "Uống một hơi hết khoảng một nửa rồi rời môi khỏi chai, sau đó như chợt nhận ra điều gì——"
3284 = "Xấu hổ và vui sướng hòa lẫn vào nhau—— A, tôi thấm thía nhận ra, đây mới chính là khuôn mặt của Fukami."
3285 = "Đôi tay đang vắt vạt váy dừng lại, trông như thể em đang bám chặt lấy chiếc váy của chính mình."
3288 = "Chắc em đang tự nhẩm lại những lời tôi nói, để khắc sâu thêm sự hiểu biết."
3290 = "Cẩn thận cầm lon bằng cả hai tay, lần này em không hề lau miệng lon mà——"
3291 = "Như thể vừa làm ra chuyện gì tội lỗi lắm, em run rẩy, ngoảnh lại nhìn tôi."
3294 = "Sự tươi trẻ, ngây thơ, thuần khiết."
3296 = "Vì những khía cạnh đó cũng rất đáng yêu, nên tôi chỉ thành thật, truyền đạt suy nghĩ của mình cho Fukami."
3298 = "Một niềm vui sướng như nước lấp đầy chiếc bình—— Hơn cả một biểu cảm, nó toát lên sự ấm áp."
3300 = "Đáng yêu quá, dễ thương quá, muốn hôn quá—— Tôi phản xạ nghĩ vậy, nhưng bây giờ, đôi môi này còn có việc quan trọng khác phải làm."
3302 = "Ngay cả dáng vẻ tung bay của chiếc váy, quả thực, cũng đẹp như một bức tranh."
3304 = "Vì em cúi gập người một cách rất vô tư, nên dù vạt váy có dài đi chăng nữa, đôi chân vẫn lộ ra khá rõ."
3306 = "Nếu sự kiện đó không xảy ra, chắc chắn tôi đã không thể gắn kết với Nagi."
3308 = "Nếu là mưa rào thì đã tạnh từ lâu rồi."
3309 = "Nếu trí nhớ của tôi không nhầm, đi thêm một chút nữa sẽ có—— a, thấy rồi!"
3312 = "Nếu là Nagi, tôi sẽ mắng là lôi thôi, và lập tức lau đi cho con bé…… nhưng mà."
3323 = "Xuất tinh chồng lên xuất tinh. Tột đỉnh chồng lên tột đỉnh."
3331 = "Như thể em muốn khắc ghi toàn bộ hình dáng sự cương cứng của tôi, lên vùng bụng dưới của mình vậy."
3335 = "\\\\x%lバラスト;#00ffc040;Đá ba-lát%l;#;—— những viên đá dăm được rải dưới tuyến đường sắt, bảo vệ \\\\x%l枕木;#00ffc040;tà vẹt%l;#;, tôi cũng vừa đi vừa thử giẫm lên."
3336 = "Một hành động lãng mạn hơn nhiều so với việc vẽ bậy, tôi và Fukami, cứ như thế này, đang thực sự khắc ghi nó."
3338 = "Mái che còn sót lại trên sân ga đang làm nhiệm vụ của nó, nhưng bất chấp điều đó, chúng tôi vẫn dần ướt sũng."
3352 = "Thường ngày mái tóc em mượt mà như tơ lụa, nhưng hôm nay lại có chút gì đó bám dính lấy tay tôi."
3363 = "Nếu vậy thì tốt. Cứ thế này, cho đến khi Fukami thỏa mãn, hãy tiếp tục tuần tra tuyến đường sắt một cách an toàn nào."
3366 = "Từ nãy đến giờ, bước chân của Fukami, đang dần trở nên nặng nề hơn."
3370 = "Gì thế này, vừa rồi có cảm giác gì đó là lạ——"
3374 = "Không thể bỏ em lại dọc đường sắt được, nên tôi đã chuẩn bị sẵn trước khi xuất phát."
3377 = "Cảm giác giống như đang xoay tròn hơn là cọ xát."
3382 = "Đưa ngón tay trái vào miệng Fukami. Để em thoa đẫm nước bọt lên đó."
3383 = "Lấy thời gian ba người ở bên nhau làm cơ bản, Nagi và Fukami, Nagi và tôi, Fukami và tôi——"
3384 = "Chạy tót vào trong, thở dốc phập phồng. Với vẻ sợ sệt, em đưa mắt nhìn quanh."
3386 = "Tôi dừng chuyển động lại. Nếu không dừng, tôi sẽ bị ép xuất tinh ngay lập tức."
3388 = "Rõ ràng tôi đã dừng lại, hông của Fukami cũng không hề nhúc nhích, nhưng sự nhấp nhô của âm đạo lại đang tấn công tôi."
3390 = "Tách đôi môi em ra, dùng lưỡi mình khẽ chạm vào lưỡi Fukami, ngay lập tức em tiến ngược vào trong khoang miệng tôi."
3392 = "Dục vọng, lại trỗi dậy mãnh liệt."
3393 = "Khi chúng tôi ngồi cạnh nhau trên băng ghế, Fukami ngó nghiêng, tò mò đưa mắt nhìn quanh."
3394 = "Tôi và Fukami, đã hoàn toàn, tận hưởng trọn vẹn khoái cảm của nhau."
3398 = "Tôi đang bị vắt kiệt. Đang tăng tốc. Đang ở giai đoạn cao trào. Phần kết nối của chúng tôi, đã nhão nhoét hòa quyện vào nhau."
3400 = "Muốn ôm em vào lòng, sưởi ấm cho em hết mức có thể. Tuy nghĩ vậy, nhưng bây giờ tôi muốn thưởng thức vẻ đẹp của Fukami bằng mắt trước đã."
3401 = "Tôi không hề có ý định làm em bối rối."
3402 = "Không có bất kỳ lý do gì để từ chối cả."
3403 = "Bất chấp sự kháng cự từ đôi chân Fukami, tôi rút hông lại. Đến ranh giới suýt tuột ra ngoài. Giữ khoảng cách với Fukami đến mức đó——"
3409 = "Đưa ngón tay lên miệng Fukami, em ngay lập tức ngậm lấy."
3410 = "Khi tôi kề lon lên miệng và dốc lên, tôi cảm nhận được ánh nhìn đắm đuối của Fukami."
3413 = "Khi tôi truyền đạt xong mọi lời muốn nói, Fukami sẽ làm vẻ mặt như thế nào đây—— tôi muốn nhìn thấy."
3415 = "Từ đầu núm vú, cho đến toàn bộ bầu ngực."
3418 = "Muốn chạm vào ngay lập tức. Muốn sưởi ấm cho em. Nhưng, như thế này thì vẫn chưa đủ lời lẽ."
3419 = "Muốn nghe những cảm xúc chân thật của em, tôi chậm rãi chờ đợi những lời tiếp theo."
3423 = "Tôi kéo tay Fukami, chạy dọc theo tuyến đường sắt tiến về phía trước."
3425 = "Kéo nắp lon và đưa về phía Fukami, nhưng em lại lắc đầu nguầy nguậy."
3426 = "Đúng như em mong muốn, tôi ấn sâu vào. Nhưng, cứ thế này thì——"
3429 = "Tôi lướt nhẹ qua núm vú của Fukami trong tích tắc. Chỉ bấy nhiêu thôi cũng đủ khiến cơ thể em giật nảy lên."
3430 = "Tôi xoa xoa vò đầu Fukami."
3432 = "Tôi không đút vào âm đạo. Cứ để nguyên như vậy, tôi hơi gập đầu ngón tay lại, cọ xát."
3435 = "Tôi không thể nhúc nhích thêm một lúc nữa. Vì nếu cử động, tôi sẽ xuất tinh mất. Bên trong âm đạo chật chội và thoải mái này, tôi muốn từ từ thưởng thức thêm——!?"
3437 = "Dựa vào sở thích thường ngày của Fukami, dạo phố—— Dự đoán như vậy, nên tôi đã chuẩn bị trang phục sẵn sàng."
3439 = "Thực ra tôi muốn nắm tay em đi song song, nhưng bên cạnh tuyến đường sắt, có nhiều chỗ không đủ rộng rãi."
3440 = "Việc lá cây mọc um tùm chạm vào thân xe gây ra tai nạn, tôi chưa từng nghe thấy bao giờ."
3442 = "Không thể kiểm soát được nữa. Nếu vậy, chỉ còn cách ngấu nghiến hết mình thôi."
3443 = "Tôi ôm chặt lấy Fukami."
3444 = "Cong ngón tay lại như chiếc chìa khóa, tôi miên man vuốt ve phần trần ở phía nông."
3446 = "Chỗ có vẻ như nằm phía trên tử cung. Tôi dùng đầu ngón tay gõ nhẹ vào đó."
3449 = "Cảm giác trơn tuột khi bị nuốt chửng, và cảm giác kháng cự kèm theo sự nhấp nhô khi chen vào giữa những thớ thịt."
3450 = "Tôi bị hớp hồn mất rồi. Nhìn kỹ mới thấy, tôi ngạc nhiên trước chiếc cổ thon thả của em."
3453 = "Tôi vẫn ăn mặc như thường lệ. Dù không cảm thấy nóng, nhưng quanh khu vực \\\\x%l保線;#00ffc040;bảo trì đường ray%l;#; này, có vẻ hơi lạc lõng."
3456 = "Khoảnh khắc đó, tôi chợt lóe lên một suy nghĩ. Đúng rồi, chuyện này…… ví dụ như, một bức tranh chẳng hạn."
3457 = "Vỡ tung. Một thứ gì đó trong tôi, đồng loạt bay biến."
3459 = "Ngay cả chuyển động của hông tôi cũng không thể dừng lại được, thì làm sao có cách nào cưỡng lại được sự cám dỗ này chứ."
3460 = "Chính bản thân tôi, cũng không thể chịu đựng thêm được nữa."
3462 = "Tôi không hề tự nhận thức được. Bất giác, tôi chạm tay lên mặt mình. Nhìn thấy hành động đó, Fukami lại cười khúc khích."
3464 = "Tôi đi bộ cùng Fukami. Bước đi chầm chậm."
3466 = "Nó bám chặt lấy tôi một cách mạnh mẽ, siết chặt ngọt ngào, khẽ ngọ nguậy, nhào nặn tôi bằng vô số thớ thịt mềm mại."
3467 = "Tôi nhớ không lầm thì nhà ga này được xây dựng với lý do là để phục vụ cho việc đi học hay gì đó."
3468 = "Tôi để Fukami ngồi lên ghế, dang rộng cơ thể em ra."
3471 = "Tôi thấm thía cảm nhận được em đã trưởng thành. Và, sự trưởng thành khỏe mạnh đó——"
3472 = "Tôi thấm thía nhận ra em thật tinh tế và nhạy cảm. Hoàn toàn khác biệt với tôi."
3475 = "Thật nhẹ. Thật nhỏ bé."
3476 = "Như thể đang vặn đinh ốc. Tôi ấn sâu quy đầu đang dính chặt ở nơi sâu nhất vào thêm nữa——"
3479 = "Tôi xoa bóp bầu ngực như đang nâng niu nó. Thật nhẹ nhàng, thật mềm mại."
3481 = "Ôm em vào lòng một cách rất tự nhiên, và giữ khoảng cách đủ an toàn với tuyến đường sắt."
3482 = "Lên cơ thể đó, tôi sẽ giáng xuống những cơn mưa, không biết bao nhiêu lần nữa."
3483 = "Có lẽ vì ướt và lạnh. Cơ thể Fukami khẽ run rẩy."
3484 = "Hoặc có lẽ cha mẹ tôi, vừa mong muốn \\\"hãy trở thành như vậy\\\", vừa ban tặng cái tên này cho tôi."
3488 = "Vì vậy, tôi đã bàn bạc với Paulette, Hachiroku, Reina, và dù có chút bối rối, tôi đã ngay lập tức thực hiện mong muốn của Fukami."
3489 = "Thoa đều nước bọt của chính Fukami lên, chăm sóc để nó không bị giãn ra."
3499 = "Dù đã tiếp nhận dương vật của tôi, uống cạn tinh dịch biết bao lần, khe dọc của Fukami vẫn trông thật đơn giản."
3501 = "Rồi em xoay người lại, lại bước một bước như đang nhún nhảy."
3502 = "Lần này em vươn tay ra thật rộng. Phần lưng váy dính chặt vào người vì mồ hôi——"
3503 = "Một nụ hôn nhẹ. Fukami vẫn nhắm nghiền mắt, không nhúc nhích."
3506 = "Điều đó cũng có nghĩa là, cơ hội để gắn kết với Fukami, chắc chắn cũng sẽ không bao giờ đến."
3507 = "Thấy vậy, tôi ôm Fukami vào lòng. Vừa ôm em, tôi vừa chậm rãi vuốt ve phía sau đầu em."
3508 = "Và rồi, tôi đã hiểu ra. Cảm giác kỳ lạ khi nhìn thấy lớp áo mỏng manh ướt sũng của Fukami——"
3509 = "Vì vậy, đầu tiên là quan sát bằng mắt. Sau đó dỏng tai lên nghe ngóng, rồi quan sát lại lần nữa để xác nhận an toàn."
3510 = "Nếu Fukami đã tính toán đến mức đó, và cố tình cởi áo ngực ra thì……"
3513 = "Nếu vậy thì."
3514 = "Dù đã lầy lội ướt đẫm đến mức này, dù đang nhấp nhô chào đón tôi, nhưng vẫn còn rất khít."
3517 = "Một phần nhỏ xíu của cơ thể, tự nó—— Núm vú, đang dần nhô lên căng mọng."
3519 = "A, là khuôn mặt này sao. Khuôn mặt Fukami không phải đang cười, và tất nhiên, cũng không phải đang khóc."
3523 = "Điều cần ưu tiên, luôn là sự an toàn. Tiêu chuẩn để lựa chọn, luôn luôn không thay đổi."
3525 = "Vừa mới mua một chiếc váy liền và mũ rơm mới, nên em muốn đi chơi."
3533 = "Dạng thạch. Từ đó xẹt qua tâm trí tôi."
3542 = "Bốn mắt chạm nhau, em khẽ giật mình, và ngay lập tức đứng thẳng lưng lên."
3544 = "Có thể gọi là sức quyến rũ bẩm sinh chăng—— mỗi lần nhìn thấy những cử chỉ này, tôi lại càng thấm thía Fukami quả đúng là Fukami."
3549 = "Nhìn vào lớp \\\\x%lバラスト;#00ffc040;đá ba-lát%l;#; không có lấy một ngọn cỏ dại, kết tinh từ những nỗ lực hàng ngày của nhóm ông Seki."
3557 = "Fukami đang làm vẻ mặt rất nghiêm trọng. Nhận ra cảm nhận của em khá khác biệt, tôi cẩn trọng lựa lời hơn."
3559 = "Fukami cũng rời môi khỏi lon nước, dõi theo ánh nhìn của tôi."
3561 = "Hai bàn tay Fukami xoa xoa nhào nặn đôi má thon thả của mình."
3563 = "Có lẽ định nói là trật bánh, nhưng Fukami vội vàng nuốt lại lời nói."
3565 = "Chắc em đã nghĩ ra điều gì đó chăng? Giọng nói của Fukami, nghe giống như đã thấu hiểu hơn là ngạc nhiên."
3567 = "Chắc là xấu hổ, Fukami rụt người lại trong chốc lát, rồi lại bước đi như muốn trốn chạy."
3568 = "Một giọng nói nghe có vẻ thực sự khó hiểu. Dù tuổi tác không cách biệt đến một giáp, nhưng tôi vẫn cảm nhận được rào cản thế hệ."
3571 = "Fukami cố nặn ra một nụ cười."
3573 = "Lầm bầm lí nhí, phần sau đó tôi không nghe rõ. Lưng em cong lại, mặt cũng cúi gằm xuống."
3575 = "Qua lớp quần, em ép chặt đũng quần mình vào tôi một cách mãnh liệt."
3579 = "Fukami, rất thông minh. Hơn tôi nghĩ rất nhiều."
3580 = "Giọng nói vui vẻ."
3582 = "Bước chân của Fukami đột ngột dừng lại. Lý do, tôi cũng lập tức hiểu ra."
3586 = "Đôi mắt Fukami nheo lại, trông có vẻ rất dễ chịu. Em ngả người tựa hẳn vào tôi, đòi được xoa đầu nhiều hơn nữa."
3588 = "Vô cùng luống cuống, em vội vàng xua tay. Như để lấp liếm, Fukami đưa mắt nhìn lại tấm áp phích."
3590 = "Rụt rè, Fukami đối mặt với tôi."
3591 = "Đôi chân Fukami ngọ nguậy không yên."
3593 = "Fukami ôm chầm lấy tôi. Em ôm chặt, và trao cho tôi những nụ hôn cuồng nhiệt."
3595 = "Bồm bộp, Fukami tự vỗ vào chân, vào bắp chân của mình."
3597 = "Fukami hiểu rõ sự đáng sợ của nước hơn tôi nhiều. Từ đây trở đi, có lẽ hầu như không cần phải giải thích thêm nữa."
3599 = "Bước chân sải dài của Fukami, tôi cảm giác mạnh mẽ như em đang nhảy múa vậy."
3602 = "Em gật đầu thật mạnh. Rồi Fukami khẽ đặt tay lên gốc cây."
3603 = "Sự siết chặt mạnh mẽ như bị một cái miệng không răng cắn lấy. Vào trong đó, tôi từ từ nong ra, và đẩy sâu vào."
3606 = "Bầu ngực tuy nhỏ nhắn nhưng săn chắc. Tôi nhẹ nhàng, nhẹ nhàng xoa nắn phần đỉnh của nó."
3607 = "Cửa âm đạo của Fukami đang run rẩy. Nó ngọ nguậy tuyệt vọng như muốn tóm lấy đầu ngón tay tôi."
3612 = "Từ khóe miệng Fukami, dòng nước uống lên men từ từ chảy xuống."
3614 = "Trong tay Fukami là một chai nước uống lên men vị soda. Nhưng, chỉ có duy nhất một chai."
3615 = "Đôi mắt Fukami đảo quanh liên tục. Không hiểu sao em cứ thỉnh thoảng ngước nhìn lên trời, rồi lại nhìn xuống cơ thể mình——"
3617 = "Chắc là trong vô thức. Hông của Fukami, đang giật giật với những chuyển động mời gọi."
3619 = "Đôi chân Fukami, đang quấn chặt lấy tôi."
3621 = "Ánh mắt của Fukami, không còn đơn thuần là của một người tham quan nữa, mà trở nên sắc sảo như thể đang thực sự đi tuần tra vậy."
3626 = "Bóng dáng em khuất sau bụi rậm."
3627 = "Cơ thể khẽ, khẽ chuyển động. Không phải do Fukami chủ động làm vậy."
3628 = "Cơ thể Fukami dính sát vào tôi. Hơi nóng của em truyền sang tôi."
3629 = "Đôi mắt của Fukami lại càng nhiệt tình ngó nghiêng xung quanh."
3630 = "Xấu hổ, đôi má em dần đỏ ửng lên. Nhưng, em không cúi gằm mặt xuống."
3631 = "Fukami nhìn tôi, rồi lập tức nhắm mắt lại. Hạnh phúc—— dường như mang một hình dáng cực kỳ dễ hiểu."
3634 = "Fukami tròn xoe mắt. Rồi nở một nụ cười vui vẻ."
3636 = "Fukami, đột nhiên lùi lại một bước."
3637 = "Tôi giơ hai tay lên và nhún vai. Ngay lập tức, Fukami cất giọng có vẻ sốt ruột."
3639 = "Fukami, hiếm khi tỏ vẻ bất mãn."
3642 = "Fukami đỏ mặt đến tận mang tai. Em ôm tim bằng cả hai tay, rồi tự quạt phành phạch cho mình."
3644 = "Fukami bẽn lẽn."
3645 = "Fukami mất hết sức lực chực ngã quỵ xuống, tôi vừa ôm đỡ lấy em, em liền cọ đầu vào tôi ngay lập tức."
3648 = "Đôi má Fukami ửng hồng. Em bẽn lẽn trông thật hạnh phúc, cúi gằm mặt xuống."
3650 = "Tự thân Fukami, dẫn dắt tay tôi."
3652 = "Làn da lạnh buốt vì ngấm mưa của Fukami, đang nóng dần lên. Mồ hôi rịn ra, tạo cho làn da một độ trơn trượt vừa phải."
3654 = "Fukami đi trước, tôi đi sau."
3656 = "Fukami quay lại, ngay phía trước tôi—— trở về vị trí mà tôi đã chỉ định lúc đầu."
3658 = "Đôi chân Fukami ngọ nguậy. Chiếc quần lót ướt dính sát vào da em cũng cử động theo."
3660 = "Em thoát khỏi tay tôi, và đột nhiên nhảy xuống khỏi sân ga."
3661 = "Fukami, khẽ nhắm mắt lại."
3662 = "Fukami chậm rãi, bắt đầu vắt nước ở vạt váy."
3665 = "Vì em vô cùng xấu hổ, cứ lúng búng trong miệng, nên tôi lại càng hiểu rõ em đang định nói gì."
3666 = "Trông có vẻ khó hiểu, Fukami nhìn xuống chân mình——"
3667 = "Như thể ngạc nhiên, bước chân của Fukami đột ngột dừng lại."
3668 = "Vừa nói xong, em gật đầu thật mạnh."
3671 = "Không cần phải bận tâm đến mức đó đâu—— Để truyền đạt điều đó, tôi tiếp tục câu nói mà em vừa nuốt lại."
3678 = "Chiếc băng ghế nhỏ trong phòng chờ này không đủ chỗ cho bốn người lớn ngồi, các học sinh đã từng tranh giành nhau. Liệu đã từng có khoảng thời gian như thế không nhỉ."
3684 = "Chiếc ô chung tình được vẽ ở mép của tấm áp phích thông báo việc nhà ga bị bỏ hoang."
3685 = "Thay vì tìm ra nguồn gốc của cảm giác kỳ lạ đó, tôi có việc cần phải làm trước."
3688 = "Nhìn thấy tóc Fukami bị thổi tung, tôi mới nhận ra. Không biết từ lúc nào, gió đã thổi khá mạnh."
3694 = "Khoảnh khắc đó, nụ cười của Fukami bừng sáng. Em nhẹ nhàng tiến lại gần tôi, một mùi hương ngọt ngào——"
3697 = "Vượt qua đường hầm rừng cây, không còn gì che chắn ánh nắng mặt trời nữa."
3705 = "Tinh dịch, cũng đã trào dâng đến giới hạn cuối cùng rồi. Ngay khoảnh khắc này, chỉ cần thả lỏng là sẽ xuất tinh."
3708 = "Tinh dịch đang dần dần trào dâng lên. Hông tôi, cơ thể tôi đang nóng ran."
3711 = "Kết quả là, điều đó có vẻ như đã khiến Fukami…… phải chờ đợi trong hụt hẫng."
3737 = "Hơn nữa, việc họ vẽ lên tấm áp phích sắp hoàn thành nhiệm vụ và bị bóc đi, cũng khiến tôi cảm thấy có thể châm chước được phần nào."
3738 = "Hơn nữa, nếu quay về cửa hàng đường sắt, em cũng có thể mượn áo blouse thay thế của đồng phục."
3741 = "Ngược lại với tôi——"
3742 = "Bằng giọng điệu nũng nịu, giả vờ hờn dỗi. Fukami ngồi xuống băng ghế——"
3743 = "Khoảnh khắc nghe thấy từ mang thai và giọng nói của Fukami, toàn bộ tinh hoàn của tôi như mở tung, không chừa lại giọt nào, trút hết tinh dịch vào trong em."
3744 = "Vừa hỏi xong, Fukami ngẩng phắt mặt lên. Những giọt mồ hôi nhỏ xíu bắn ra, lấp lánh như những hạt sáng."
3755 = "Ít nhất thì đối với Fukami trước khi quen biết chúng tôi, đường sắt, có lẽ là một di tích hoàn toàn của quá khứ."
3757 = "Ít nhất thì tôi đã từng như vậy."
3761 = "Fukami khi ở trên thuyền, giờ đang ở đây, tỏa sáng rực rỡ ngay trước mắt tôi."
3767 = "Dòng mật ngọt rỉ xuống của Fukami, quấn lấy đầu ngón tay tôi."
3771 = "Dọc theo tuyến đường sắt vào buổi trưa hè—— Nếu không phải là một nơi quang đãng dễ nhìn thấy, tôi cũng muốn cứ thế này đắm chìm trong cơn sốt, nhưng."
3773 = "Để Fukami cười thì—— Những gì tôi nghĩ, đã là câu trả lời rồi."
3782 = "Mặc dù vậy, hôm nay tôi đi cùng Fukami."
3783 = "Vừa nói, tôi chợt nghĩ. Soutetsu—— cái tên của tôi, mang ý nghĩa là tuyến đường sắt song song."
3784 = "Vừa nói, Fukami vừa mở chai nhựa, từ từ, rót nước xuống cổ họng."
3789 = "Bước lên sân ga và thả Fukami xuống, đôi má phớt hồng của em phụng phịu phồng lên."
3791 = "Cảm giác lún nhẹ khi giẫm xuống. Nhưng không bị trượt. Thực sự đã được nén rất chặt."
3802 = "Chỉ là đùa giỡn thôi. Dù vậy, Fukami vẫn nghiêm túc cố gắng thoát khỏi tôi——"
3803 = "Vẻ đẹp nữ tính, cùng với da thịt chưa phát triển đầy đặn của một cô gái chưa trưởng thành hẳn."
3804 = "Sự sâu sắc của một \\\"người phụ nữ\\\" mà tôi không cảm nhận được từ ai khác, tại sao một Fukami còn trẻ tuổi như vậy lại có được chứ——"
3805 = "Khoảng cách chừng đó thì chẳng nhằm nhò gì."
3811 = "Xứng đáng trở thành chuẩn mực cho tất cả những người em gái tiếp bước theo sau—— \\\\x%lレイルロオド;#00ffc040;Railord%l;#; Hachiroku, chính là một sự tồn tại như vậy."
3815 = "Hoạt động trong một thời gian dài đằng đẵng, chứng kiến biết bao điều, Hachiroku, ——không, ngay cả tôi có lẽ cũng đã đánh mất, biểu cảm ngây thơ ấy."
3817 = "Em dùng đầu ngón út, lau miệng chai nhựa."
3819 = "Gần đây không có thiết bị tín hiệu nào."
3821 = "Sự co thắt của âm đạo. Đồng thời với việc xuất tinh. Nơi sâu nhất—— chính xác là nơi sâu nhất."
3827 = "Mùi xà phòng, mùi nắng, hòa lẫn với mùi mồ hôi, trong nháy mắt, bám lấy và bao bọc lấy tôi."
3879 = "（Vù vù）"
3880 = "（Vù vù）"
3881 = "（Phụt! Phụt! Phụt! Phụt!）"
3882 = "（Phụt!!!）"
3884 = "（Bịch!!!）"
3885 = "（Rào rào rào rào rào rào rào rào rào rào!!!）"
3887 = "（Trắng quá…… mà, chân em thon thả thật đấy）"
3888 = "（Vuốt dọc）"
3890 = "（Quyệt）"
3891 = "（Phập—— chụt! Phập! Phập!!）"
3892 = "（Rút ra!）"
3893 = "（Véo）"
3894 = "（Vê nhẹ）"
3895 = "（Trơn—— trượt—— xoa—— nắn）"
3896 = "（Ngoáy—— ngoáy! Ngoáy—— ngoáy）"
3897 = "（Phập! Phập! Phập! Phập!）"
3898 = "（Phập! Cộc!!!）"
3899 = "（Rút ra! Bạch! Phập! Cộc!）"
3900 = "（Rút ra!!!!）"
3901 = "（Phập!!!）"
3902 = "（Nhấn sâu!）"
3903 = "（Miết! Vê! Nhấn! Ấn!）"
3904 = "（Cọ nhẹ）"
3905 = "（Miết—— miết—— xoa—— xoa）"
3906 = "（Cọ—— cọ—— cọ—— cọ）"
3907 = "（Nắn—— xoa）"
3908 = "（Miết nhẹ!）"
3909 = "（Lau nhẹ）"
3910 = "（Gõ nhẹ）"
3911 = "（A——）"
3912 = "（Phập—— chụt—— phập, ngoáy）"
3913 = "（Phập—— chụt——）"
3914 = "（Hự—— phập）"
3915 = "（Phập!）"
3917 = "（Siết chặt）"
3920 = "（Siết chặt!）"
3921 = "（Siết chặt）"
