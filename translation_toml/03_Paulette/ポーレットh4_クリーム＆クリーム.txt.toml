1293 = "Vặn nắp ra xem thử bên trong,\\nquả thực là có lớp kem trắng trông rất mọng nước."
1294 = "Tôi xoa xà phòng tạo bọt khắp cơ thể mình,\\nbiến toàn thân thành một miếng bọt biển——"
