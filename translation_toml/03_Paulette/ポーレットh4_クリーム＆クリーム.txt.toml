1273 = "Chuyển động. Cử động được rồi. Thật dễ chịu.\\nTôi tha hồ đào sâu vào bên trong hậu môn."
1276 = "Khối thịt tuyệt hảo mang tên Paulette,\\nđược bao bọc bởi sự trượt đi của toàn bộ cơ quan sinh dục trên cơ thể tôi."
