1287 = "Từ đầu đến chân,\\nkhông chỉ là vùng nhạy cảm, mà dường như đã biến thành cơ quan sinh dục mất rồi."
1289 = "Tôi muốn hòa tan cùng Paulette,\\nmuốn mọi thứ sụp đổ, hòa quyện làm một!"
