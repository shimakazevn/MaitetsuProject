1324 = "Xoay cô ấy về phía này, rồi một hơi,\\ntôi nhấc bổng toàn bộ cơ thể Paulette lên."
1328 = "Ngâm mình trong bồn tắm."
1330 = "Tôi vội vàng dùng vòi hoa sen thật,\\nxả sạch cơ thể Paulette."
1332 = "Thế nên tôi dội nước ấm từ chậu tắm,\\nưu tiên rửa sạch bọt ở những điểm quan trọng."
1334 = "Quả thật là 'trơn' và 'tuột'.\\nDù tiến sâu vào lỗ hậu cũng không cảm nhận được nếp gấp thịt nào."
1368 = "Vừa nói,\\nPaulette vừa ngó nghiêng nhìn quanh quất."
1369 = "Toàn thân cô ấy co giật bần bật, nước mắt nước dãi giàn giụa."
1370 = "Dang rộng hai chân, gập người xuống,\\ncô ấy nhìn tôi qua khe hở giữa hai đùi."
1371 = "Khi Paulette thốt lên,\\nđiều đó tạo ra một chút không gian nới lỏng."
1372 = "Paulette đang ngập ngụa trong bọt xà phòng một cách hoàn hảo."
1373 = "Dù đã rã rời, cô ấy vẫn thốt lên tiếng kêu sung sướng."
1374 = "Bày ra dáng vẻ khêu gợi thế này trước mặt tôi,\\nmà Paulette lại đỏ mặt ngượng ngùng vì một chuyện thật kỳ lạ."
1375 = "Paulette biết tỏng rồi mà còn cố tình hỏi.\\nGiọng nói nũng nịu rót vào tai khiến dục vọng trong tôi dâng trào."
1376 = "Ngón tay Paulette vạch rộng cô bé ra cho tôi thấy.\\nNgay lập tức, máu nóng dồn lên não tôi."
1377 = "Mông Paulette run bần bật.\\nHậu môn thắt chặt lại."
1378 = "Cơ thể Paulette thoáng chốc cứng đờ.\\nĐầu khẽ lắc nguầy nguậy."
1379 = "Khuôn mặt đang hơi căng ra của Paulette giãn ra mềm mại."
1380 = "Toàn thân bị tôi ôm trọn, cơ thể gần như không thể cử động tự do,\\nnhưng Paulette vẫn ráng di chuyển hông."
1381 = "Cơ thể Paulette khẽ đung đưa."
1385 = "Cả cô bé lẫn lỗ hậu mà tôi cố tình không chạm vào để tránh bị xót,\\ngiờ cũng đã bị bọt che khuất."
1389 = "Sau đó, cô ấy quỳ gối xuống khu vực tắm rửa——"
1390 = "Nhưng——\\nKhông cần phải nhịn đâu."
1393 = "Dù vậy, âm đạo và tử cung vẫn tham lam\\nngọ nguậy không ngừng, như muốn vắt kiệt tinh dịch của tôi."
1395 = "Dù vậy, Paulette không hề có vẻ gì là căng thẳng.\\nCô ấy duỗi tay duỗi chân, ngay cả lời nói cũng thong thả."
1399 = "Khối thịt mềm mại hễ nắm lấy là tràn ra, nhưng giờ tôi không thể nắm trọn được.\\nTrơn quá, đến cả núm vú cũng trượt khỏi đầu ngón tay tôi."
1407 = "Sẽ trở thành cha.\\nSẽ trở thành mẹ."
1410 = "Kem dưỡng da mặt màu trắng, ẩm ướt."
1423 = "Và khi tôi gục ngã,\\nchắc chắn Paulette sẽ là người nâng đỡ tôi."
1424 = "Nghe tiếng gọi, tôi vẫy tay lại,\\nPaulette nở nụ cười, chạy bước nhỏ lại gần."
1430 = "Kể từ lần đầu tiên chạm môi,\\nchúng tôi đã hôn nhau không biết bao nhiêu lần."
1433 = "Bên trong lỗ hậu không hề có mùi vị kinh khủng như tôi sợ——\\nChỉ cảm thấy mùi vị hệt như đang liếm da thịt mềm mại mà thôi."
1436 = "Tinh dịch đặc sệt cũng trào ra từ hậu môn,\\nnhỏ giọt xuống như thể đang nhắm thẳng vào cô bé."
1437 = "Thắt lại, nhưng không cắn chặt."
1440 = "Lỗ hậu, cô bé, hai núm vú——\\nChỉ cần nhấn mạnh những điểm đó thôi cũng đủ thấy dâm đãng đến không ngờ."
1442 = "——Rõ ràng là đang bị siết chặt, vậy mà lại trơn tuột.\\nCảm giác như không có điểm dừng, có thể đi sâu đến vô tận."
1444 = "Tận dụng tối đa cảm giác dính chặt đầy đặn,\\nâm đạo uốn éo quấn lấy, ôm chặt dương vật của tôi từ mọi hướng."
1460 = "Đó là sự dịu dàng vô bờ bến.\\nLà tình yêu thương không chút tiếc nuối."
1461 = "Không phải là sự cự tuyệt mãnh liệt, mà giống như đang khao khát khoái cảm hơn,\\nnhư một hành động nũng nịu."
1462 = "Có lẽ vì xấu hổ, Paulette đỏ mặt,\\nlắc đầu, lắc mông nguây nguẩy."
1463 = "Cứ thế này thì, tôi sẽ xuất tinh mất.\\nCả Paulette chắc cũng sẽ lên đỉnh không biết bao nhiêu lần."
1464 = "Bọt trơn tuột khiến tôi không thể nắm chặt như mọi khi,\\nthật sốt ruột, thật dâm đãng, cảm giác thực sự rất tuyệt."
1465 = "Nghĩ lại thì,\\nđây là lần đầu tiên tôi và Paulette ở riêng bên nhau thế này."
1466 = "Mèo……hay là chồn hương gì đây nhỉ?"
1467 = "Cảm giác sốt ruột lại mang đến sự dễ chịu.\\nBằng cách trêu chọc lẫn nhau, chúng tôi đang chuẩn bị cho sự kết nối."
1468 = "Tinh dịch bắn cả lên tóc cô ấy mất rồi.\\nCảm giác tội lỗi lấn át cả cảm giác chinh phục lẫn cảm giác thành tựu."
1469 = "Lời tôi còn chưa dứt, Paulette đã đáp lời\\nvà nhanh chóng bước ra khỏi bồn tắm."
1473 = "Bên trong đã vơi đi khá nhiều,\\nchắc hẳn là món đồ cô ấy vẫn thường xuyên sử dụng."
1481 = "Trước tiên, cứ bình thường từ eo lên lưng——"
1482 = "Với cơ thể đã nhũn ra như bùn, với hơi thở đứt quãng thoi thóp,\\nPaulette vẫn đáp lời tôi."
