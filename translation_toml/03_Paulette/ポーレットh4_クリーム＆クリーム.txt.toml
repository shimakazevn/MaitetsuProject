1303 = "——Mỗi lần thoa vào sâu trong lỗ hậu,\\ntôi lại có cảm giác như đang nhuộm Paulette bằng chính mình."
1307 = "Mỗi lần tôi kéo hông, phần thịt âm đạo bám víu nũng nịu\\nlại dính chặt vào rãnh quy đầu, kích thích đến mức như muốn lộn ngược nó ra."
