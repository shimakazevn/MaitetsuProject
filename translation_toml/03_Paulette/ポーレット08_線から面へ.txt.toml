1605 = "「Tôi hiểu rồi thưa ngài Soutetsu.」"
1607 = "「Tôi hiểu sự bất mãn của Hachiroku. Bản thân tôi cũng――\\nCũng thắc mắc tại sao tôi và Hachiroku lại phải cùng nhau chèo thuyền.」"
1608 = "「Vậy thì, về chuyện đó.\\nÀ, Nagi, nếu được thì em chuyển điện thoại cho mọi người xem với nhé.」"
1610 = "「Vong linh, thì không ổn đâu á.」"
1613 = "「Chỉ với Nagi và tôi thì――có vẻ là không thể làm được,\\nnên tôi đã nhờ người hỗ trợ.」"
1618 = "「Xin lỗi cho hỏi――\\nTôi là Tadokoro đã đặt trước đây――」"
1620 = "「Xin lỗi. Anh đang lấy lại tinh thần.」"
1623 = "「Xin lỗi vì đã bắt ép cô.」"
1628 = "「Than đá đào được sẽ nhét vào rương báu, và để \\x%lキハ07;#00ffc040;KiHa 07%l;#;\\ncứ thế hướng thẳng đến ga Yui.」"
1630 = "「Là vong linh của những người thợ mỏ ạ. Họ tưởng rằng\\nthan đá quý giá trong hầm mỏ bí mật đã bị đánh cắp, nên tức giận. Và nổi điên lên.」"
1631 = "「Xin hãy――chờ đợi!」"
1633 = "「Thì quá khứ nghĩa là ngài đã chiến thắng rồi nhỉ.\\nCó khách tìm ngài Soutetsu ạ.」"
1636 = "「Chào buổi sáng, Paulette.\\nHôm nay tôi không thể làm thư ký cho cô được, xin lỗi nhé.」"
1638 = "「V-vâng! Chuyện xảy ra quá gấp gáp từ hôm qua đến hôm nay, nên là――」"
1640 = "「Đồ tự làm à. Thật đáng quý.」"
1642 = "「Đúng vậy ạ. Cho các tinh linh thấy hình ảnh đó,\\nđể chúng yên tâm rằng than đá đang được sử dụng đúng cách.」"
1646 = "「Vậy sao? Nếu thế thì... trên đường về cửa hàng đường sắt...\\nỪm. Tôi sẽ chỉ thị cho nó hạ cánh xuống nước quanh khu vực cầu Oshiro.」"
1648 = "「Là tôi ạ. Tôi và Navi.」"
1650 = "「Là Thị trưởng Paulette ạ.\\nCô ấy dặn nếu ngài còn ngủ thì không cần đánh thức đâu ạ.」"
1652 = "「Vâng. Chắc chắn chúng ta sẽ thu hút được những 『người trẻ tuổi hoàn toàn bình thường』,\\nkhông liên quan gì đến các nghệ nhân hay nhà thầu đâu ạ.」"
1654 = "「Vâng ạ. Chuyến về Ohimitera sẽ là chuyến xe trống không có khách,\\nnên rủi ro về mặt an toàn cũng sẽ được giảm xuống mức tối đa.」"
1656 = "「Đúng vậy ạ, kiểu như thế.」"
1658 = "「Vâng thưa ngài Soutetsu.」"
1662 = "「Chị có chuyện gì với tôi sao?」"
