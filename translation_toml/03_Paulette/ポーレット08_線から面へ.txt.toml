1532 = "「Giữa chừng chuyến đi xuôi dòng, một chiếc SL chạy lướt qua cây cầu sắt trên đầu.\\nNhưng, đó chỉ là ảo ảnh. Một chiếc \\x%l8620;#00ffc040;8620%l;#; lẽ ra không thể chạy được nữa.」"
