1669 = "「Đúng vậy nè! Điều đó quan trọng lắm á!」"
1670 = "「Đúng vậy,\\ntừ đó sẽ cho họ đi thuyền xuôi dòng về Ohimitera.」"
1677 = "「Fukami.\\nCó vẻ như cơ thể em ấy đã đỡ hơn nhiều rồi ạ.」"
1679 = "「Sông Kuma, giống như một thiếu nữ tuổi dậy thì――\\nFukami đã từng nói như vậy」"
1685 = "「Và để truyền đạt điều đó đến ngài Soutetsu với hiệu suất cao nhất, tôi\\n――chính tôi đây――lại phải lên thuyền, thật là...」"
1686 = "「\\x%l客車;#00ffc040;Toa hành khách%l;#; chật kín người――những vị khách tràn ngập nụ cười.\\nĐể cho đứa trẻ đó được kéo thêm một lần nữa.」"
1695 = "「Đương nhiên rồi. Nếu muốn liên lạc thì làm ngay đi.」"
1696 = "「Tất nhiên rồi ạ.」"
1697 = "「Tất nhiên rồi nè!\\nMình chụp là để cho Fukami xem mà á!」"
1699 = "「Thật sự――đúng là như vậy nhỉ. Bước đi này là một bước đi cần thiết.\\nDù có vẻ như đang đi đường vòng, nhưng thực ra, chắc chắn sẽ tiến gần hơn đến đích.」"
1700 = "「Giao phó cho Po-chan,\\ncó vẻ chị có thể yên tâm được rồi nhỉ.」"
1705 = "「Tinh linh mỏ quặng không thể qua nước được,\\nnên thuyền xuôi dòng sẽ có ích cho việc trốn thoát đến Ohimitera. Ạ.」"
1707 = "「Khi đến được Ohimitera, chuyến tham quan sẽ tạm thời kết thúc ở đó.\\nSau đó, sẽ là các lựa chọn như anh Soutetsu đã nói.」"
1709 = "「Cháo cũng đã ăn hết sạch rồi ạ.\\nEm ấy nhờ gửi lời đến Nagi là 『Ngon lắm, cảm ơn cậu vì bữa ăn』 ạ.」"
1713 = "「Cây cầu sắt màu đỏ son,\\ncầu số 4 bắc qua sông Kuma, quý khách có nhìn thấy không ạ?」"
1715 = "「Chuyện nhỏ thôi.\\nNhưng mà――cô định nói gì với Navi vậy?」"
1729 = "「Bị hắt nước vào người rồi này.」"
1731 = "「Nếu đến cả Nagi cũng bị cảm,\\nthì từ ngày mai trở đi, việc kinh doanh thuyền xuôi dòng sẽ gặp trở ngại đấy ạ.」"
1732 = "「Thử thách... nói thế thì có vẻ hơi quá.\\nNhưng mà, vâng. Đại loại là vậy.」"
1735 = "「Nghe chị nói mới thấy đúng thật.\\nVậy, đổi thành tinh linh thì sao ạ?」"
1738 = "「Mà nói chứ――hôm nay, ừm, anh có ổn không?\\nChỉ có anh và bé Nagi thôi.」"
1739 = "「Cảm ơn cô. Có cái này thì tôi có thể thực hiện nhiệm vụ mà không gặp tai nạn nào rồi――\\nHửm?」"
1740 = "「Cảm ơn em. Nhờ em nhé.」"
1741 = "「Túi bùa hộ mệnh sao?」"
1742 = "「Cho \\x%l8620;#00ffc040;8620%l;#; chạy khứ hồi giữa Ohimitera――và Yui sao?」"
1743 = "「Sẽ thú vị lắm nếu tinh linh mỏ quặng kéo đến bờ sông.\\nKiểu như 『Các người định làm gì với than đá của chúng ta hả~』」"
1744 = "「Phục sinh nhà ga bỏ hoang mỏ than Jussen và tuyến đường sắt mỏ,\\ntrước tiên, hãy để \\x%lキハ07;#00ffc040;KiHa 07%l;#; dẫn đường trong khu vực đó.」"
1767 = "「Ông anh đó nổi tiếng lắm nha.\\nChắc chắn sẽ tạo ra sóng lớn ở chỗ không ai ngờ tới á.」"
1768 = "「Cái đó! Tuyệt lắm. Ạ.\\nTinh linh mỏ quặng, nghe rất hay. Ạ!」"
1769 = "「Thế là tốt nhất. Đến ngày mai,\\nem có thể thoải mái trò chuyện với Fukami đã hoàn toàn bình phục rồi.」"
1770 = "「Trời ơi.」"
1771 = "「Đây là!」"
1772 = "「Vậy sao. Nếu vậy thì――ừm.」"
1773 = "「Nếu vậy thì, có cần phải nhờ đến diễn viên quần chúng không?」"
1776 = "「Vẫn còn vài chuyện,\\nchúng ta phải giải quyết cho xong mới được á.」"
1777 = "「Với lại, một chút thôi――\\nEm có thể nói chuyện với Navi được không?」"
1785 = "「À thì――cho nên là――ừm, coi như để phòng hờ ấy mà!」"
1786 = "「Ừm... giữ bí mật, được không anh?\\nVì nếu thất bại thì sẽ hơi xấu hổ một chút.」"
1787 = "「Dạ... em」"
1788 = "「Chuyện là... không có gì――em chỉ mong là không có chuyện gì thôi――\\nA! Đương nhiên là, chắc chắn sẽ không có chuyện gì rồi, nhưng mà...」"
1789 = "「Vậy thì tốt rồi.」"
1791 = "「Vậy là quý khách may mắn lắm á!」"
1792 = "「Vậy thì.」"
1793 = "「Vậy thì!」"
1794 = "「Nếu vậy thì cả hai chúng ta, không thể lãng phí dù chỉ một giây nào đâu nhỉ.」"
1800 = "「Chuyện đó, em có manh mối――」"
1802 = "「Anh hai. Nghĩ ra câu chuyện gì đi.」"
1804 = "「Sự liên kết giữa thuyền xuôi dòng và đường sắt.\\nTôi muốn kết hợp cả Mine Treasure vào việc này nữa.」"
1806 = "「Nước sông Kuma tốt cho sức khỏe lắm nha?\\nPhía thượng nguồn còn được gọi là 『Nước trường thọ』 nữa đó nè.」"
1807 = "「Cầu vồng chỉ là sự trùng hợp ngẫu nhiên, nhưng việc để \\x%l列車;#00ffc040;đoàn tàu%l;#;\\nchạy qua cầu sắt cùng lúc với thuyền xuôi dòng. Đây quả là một ý tưởng tuyệt vời.」"
1809 = "「Tuy cũng là vì nhiệm vụ, nhưng em cũng muốn xem anh Soutetsu chèo thuyền nữa.\\n――Thật sự, chỉ có vậy thôi ạ.」"
1810 = "「KiHa 07S cũng là một phương tiện đẹp và đáng yêu,\\nnhưng khi nhìn từ thuyền xuôi dòng, tôi tin rằng 8620 sẽ đẹp như một bức tranh hơn ạ.」"
1811 = "「Ngài Soutetsu. Hướng mười một giờ. Đưa thuyền vào dòng chảy.」"
1812 = "「Ngài Soutetsu! Ngay bây giờ ạ!\\nHãy ra khỏi vùng nước đọng và quay lại dòng chảy ban đầu.」"
1813 = "「Ngài Soutetsu, xin hãy đi vòng rộng sang hướng mười giờ.\\nHướng hai giờ――dưới tảng đá phía trước bên phải là một vùng bãi cạn rộng lớn.」"
1814 = "「Ngài Soutetsu, hướng một giờ. Xin hãy tiến vào bãi cạn.」"
1815 = "「Ngài Soutetsu, hướng hai giờ. Không phải trên trời, mà là hướng hai giờ của đồng hồ.\\nXin hãy điều khiển thuyền vào vùng nước đọng.」"
1816 = "「Ngài Soutetsu? Ngài đã dậy chưa ạ?」"
1817 = "「Hình thêu con ếch――\\nRa vậy, bùa hộ mệnh cầu bình an trở về nhỉ?」"
1820 = "「Đầu tiên, xin phát áo phao cứu sinh cho mọi ngườ――mọi người ạ.\\nXin hãy chú ý mặt trước và mặt sau nhé.」"
1822 = "「Thứ nhất là, chuyện về \\x%l客車;#00ffc040;toa hành khách%l;#; của \\x%l8620;#00ffc040;8620%l;#;.」"
1825 = "「Cá Ayu á! Gọi là cá Ayu cỡ Shaku,\\ncâu được con to cỡ này luôn á~.」"
1827 = "「!」"
1828 = "「!!」"
1969 = "Giọng nói vui vẻ xen lẫn tiếng cười.\\nSự hỗ trợ của Nagi đã làm được một việc lớn."
1970 = "Một người thích mộng mơ, và một người thích đọc sách.\\nSự cộng hưởng giữa họ dường như đang sản sinh ra những ý tưởng."
1971 = "Một giọng nói nhẹ nhàng chen vào."
1972 = "Một phát ngôn không ngờ tới, khiến suy nghĩ của tôi bị đình trệ trong giây lát.\\nVui quá. Vui quá. Vui quá. Vui quá."
1976 = "Thỉnh thoảng lại vấp váp.\\nNhưng tuyệt đối không dừng lại."
1978 = "Không ổn rồi.\\nĐầu óc đã tỉnh táo, nhưng cơ thể lại nặng nề và chậm chạp đến lạ."
1983 = "Chúng ta cũng có thể hướng dẫn họ gia công than đá vừa đào thành đồ trang sức,\\nvà dẫn họ đến chỗ các nghệ nhân."
1985 = "Cũng có những người quan tâm đến mỏ than,\\nnhưng lại chẳng hứng thú gì với việc đi thuyền xuôi dòng――"
1991 = "Nhưng dẫu vậy,\\nHachiroku thực sự vẫn có ý chí và nguyện vọng của riêng mình."
1993 = "Nhưng tôi không muốn làm giảm khí thế của Nagi.\\nCũng không muốn làm Fukami đang ngủ ở phòng trong phải lo lắng thêm."
1995 = "Nhưng nếu đã bị gọi,\\nthì đành phải cố nặn ra vài lời thôi."
1996 = "Nhưng đối với cơ thể lạnh lẽo và mệt mỏi\\ndo rơi xuống nước trong đợt huấn luyện đặc biệt kéo dài đến sát nút, nó thấm vào đến mức đau nhói."
1999 = "Nhưng mà, tôi không thể mải mê ngắm nhìn được.\\nTrụ cầu sẽ lao đến trong nháy mắt."
2009 = "Giọng nói của Hachiroku từ trong phòng vọng ra\\nđã chứng minh suy đoán của tôi là chính xác."
2011 = "Hachiroku là một món đồ.\\nCô ấy tự định nghĩa mình là một món đồ, chấp nhận việc bị tôi sử dụng."
2014 = "Giọng của Hachiroku đầy vẻ cạn lời.\\nCạn lời, nhưng đâu đó vẫn rất dịu dàng."
2015 = "Giọng nói của Hachiroku như đang bao bọc lấy con bé."
2017 = "Bưng chiếc khay màu đỏ son có đặt chén trà,\\nHachiroku lặng lẽ bước vào phòng."
2018 = "Hachiroku nhắm nghiền mắt lại.\\nNhư thể đang cố gắng che giấu và kìm nén mọi thứ."
2041 = "Có vẻ như Nagi cũng đã bật công tắc rồi.\\nCon bé chèo mạnh mái chèo, giúp thuyền nhanh chóng hòa vào dòng chảy."
2043 = "Nagi đi vòng quanh tôi.\\nVừa nhìn chằm chằm, vừa khịt khịt mũi."
2044 = "Tôi suýt soát túm được cổ áo của Nagi,\\nkhi con bé bất ngờ chuyển động chớp nhoáng."
2047 = "Cứng đờ. Giống như bị túm chặt lấy đuôi vậy.\\nNagi ngay lập tức ngoan ngoãn hẳn."
2049 = "Có lẽ,\\nđó là lời nói và hành động y hệt như Fukami."
2051 = "Trong tay Nagi là một thiết bị di động rất thông minh."
2053 = "Nagi khuỵu hẳn hai đầu gối xuống.\\nLưng cũng khom lại, thở ra một hơi dài nhẹ nhõm."
2054 = "Cùng với Nagi đang cười ranh mãnh,\\nchúng tôi vừa lớn giọng, vừa xác nhận lại các hạng mục khác nhau."
2056 = "Vì người bạn không thể thay thế,\\ndáng vẻ của Nagi như thể đang vứt bỏ cả bản thân mình vậy."
2058 = "Lời nói khô khốc như khúc gỗ của tôi,\\nnhờ Nagi đỡ lời mà trở nên có hồn hơn."
2059 = "Lời nói của Nagi đã hoàn toàn trở lại như bình thường,\\nlàm khuấy động bầu không khí với phong thái quen thuộc."
2067 = "Bọt nước vừa rồi làm ướt sũng quần áo hành khách, nếu xử lý sai một li,\\nrất có thể sẽ dẫn đến khiếu nại."
2071 = "Ra vậy, hiểu rồi.\\nNếu đi vào vùng nước đọng, tốc độ thuyền đương nhiên sẽ chậm lại đáng kể."
2073 = "Tôi đang mải nhìn hành khách,\\ncũng vội vàng hướng mắt về phía trước――!"
2092 = "Đồng thời, dồn khí lực xuống bụng, xốc lại tinh thần và thể xác.\\nTừ đây trở đi là――"
2102 = "Sự im lặng do không thốt nên lời,\\nđược lấp đầy bởi vô số tiếng màn trập máy ảnh."
2103 = "Đối với Navi, việc xuôi dòng sông Kuma\\nchỉ là một hành động làm tăng thêm 『nguy hiểm đến tính mạng』 một cách vô ích."
2112 = "Mọi người đều gật đầu.\\nPaulette, và cả Reina cũng vậy."
2115 = "Bất cứ ai nhìn thấy đều cất lên tiếng reo hò.\\nNhững vị khách đoàn hôm đó, tất cả đều nở nụ cười rạng rỡ trên môi."
2119 = "Cúi chào và nói 'Xin lỗi vì đã làm phiền',\\nrồi ngẩng mặt lên, cô ấy lại hỏi tôi một lần nữa."
2120 = "Cô ấy hỏi với giọng điệu dồn dập lạ thường.\\nChắc hẳn cô ấy đang rất lo lắng cho tôi."
2122 = "Sự thấu hiểu của tôi. Rằng chúng tôi đã hiểu ý nhau.\\n――Paulette đang cảm thấy rất vui vì điều đó."
2124 = "Vẫn với ánh mắt đó, Paulette\\nnhìn thẳng, nhìn thẳng đáp lại ánh mắt của chị Mayami."
2126 = "Con bé vùng vẫy loạn xạ,\\nnhư một chú mèo con đang tuổi nghịch ngợm."
2128 = "Cởi bỏ chiếc khẩu trang và găng tay nhỏ xíu cùng tấm ni lông dùng thay cho đồ bảo hộ,\\nbước chân cô ấy tiến về phía này cũng mang lại ấn tượng tươi sáng và nhẹ nhàng."
2129 = "Nagi kiềm chế những cử chỉ thường ngày và giọng Kumamoto-ben,\\nchỉ dẫn cho khách đoàn một cách trôi chảy."
2132 = "Chắc hẳn cô ấy có ý định,\\nđể mọi người có thể thong thả ngắm nhìn cầu vồng."
2134 = "Cao hơn cả đỉnh cầu vồng,\\ncô ấy hướng ánh mắt lên bầu trời, ngay phía trên đầu."
2136 = "Khó chiều. Tâm trạng thay đổi chỉ trong chớp mắt.\\nSâu bên dưới mặt nước trong veo ấy, ẩn giấu những vũng bùn lầy sâu thẳm."
2138 = "Giọng nói còn vang hơn bình thường. Nhờ vậy, cuối cùng tôi cũng hiểu ra.\\nChắc chắn em ấy muốn cuộc trò chuyện lọt vào căn phòng bên trong."
2139 = "Tâm ý bộc lộ rõ ràng qua từng lời nói và thái độ,\\nkhiến tôi thành thật cảm thấy, thật đẹp đẽ."
2140 = "Giọng điệu điềm tĩnh. Vẻ mặt cũng vậy.\\nTuy nhiên, trong đôi mắt ấy vẫn còn đọng lại vẻ không hoàn toàn cam tâm."
2143 = "Trông có vẻ hài lòng――\\nĐồng thời, cũng có chút gì đó cô đơn."
2146 = "Đôi mắt mở to nhìn tôi.\\nChỉ bấy nhiêu thôi cũng đủ cho thấy suy đoán của tôi là chính xác."
2148 = "Cô ấy vội vàng chìa cả hai tay ra.\\nThứ được nắm chặt trong đôi tay ấy là――"
2150 = "Một nụ cười rạng rỡ.\\nCảm giác như đang bước vào một vệt nắng ấm áp."
2151 = "Cái gật đầu nhè nhẹ."
2155 = "Nếu 『Nơi làm việc mang tên Mine Treasure』,\\nđược tất cả người dân Ohimitera chấp nhận."
2160 = "Căng chặt nhượng chân,\\nxoay sào từ hông, điều khiển mà không dùng lực ở tay."
2161 = "Cất bùa hộ mệnh vào túi ngực,\\nrồi tôi đưa luôn cánh tay phải vừa cất bùa ra."
2167 = "Giống như đang nhắc nhở đám trẻ mải mê chơi đùa rằng\\n『Đến giờ về nhà rồi』 vậy."
2173 = "Gần như cùng lúc đó,\\nkhông hiểu sao khuôn mặt của Hachiroku lại ngước lên trời."
2177 = "Cây cầu vồng. Cây cầu sắt. Làn sương mù vẫn còn lảng bảng.\\nNgay chính giữa, \\x%lキハ07;#00ffc040;KiHa 07%l;#; lướt qua với tốc độ êm ái."
2180 = "Lặng lẽ――\\nnhưng đâu đó vẫn phảng phất chút không vui."
2195 = "Mà phải nói là――sự nhanh trí tuyệt vời.\\nChỉ bằng một lời nói, con bé đã biến kỹ năng chèo thuyền non nớt của tôi thành sự kỳ vọng."
2197 = "Sau nhiều lần bị ướt sũng và thậm chí là uống nước sông, điều duy nhất tôi hiểu ra là,\\n“Chỉ với Nagi và tôi thì, tuyệt đối không thể làm được”."
2199 = "Để không bỏ sót chỉ thị của Hachiroku,\\nđể không bỏ qua bất kỳ biến động nhỏ nào, tôi thả lỏng, nhưng vẫn tập trung cao độ."
2202 = "Bởi vì những bàn tay đan vào nhau chắc chắn sẽ truyền tải hơi ấm và lòng dũng cảm cho nhau."
2204 = "Tôi tự nhủ bản thân không được luống cuống,\\nvà lặng lẽ hạ tầm mắt xuống mặt nước."
2208 = "Tôi truyền đạt lại y hệt trình tự\\nmà tôi đã nghe từ Fukami và cô Midori trên giường bệnh."
2209 = "Tuy tôi không am hiểu về thêu thùa,\\nnhưng màu sắc sống động của thành phẩm này, ai nhìn vào cũng phải trầm trồ khen ngợi."
2211 = "Giọng nói tự nhiên bật ra từ cổ họng tôi."
2212 = "Cảm giác như đang bị kiểm tra sức khỏe,\\nkhiến tôi bất giác đứng thẳng lưng lên."
2215 = "Tôi tiếp tục truyền đạt lịch trình ngày hôm nay."
2216 = "Tôi cắm sào xuống nước, đưa mũi thuyền lao thẳng vào dòng chảy sủi bọt."
2218 = "Lau khô người, thay quần áo và khoác áo Happi lên,\\nnhững gì còn lại chỉ là phần trình diễn chính thức thôi."
2220 = "Dù không có ý định mở ra,\\nnhưng hành động của tôi đã gây hiểu lầm, khiến Paulette vô cùng hoảng hốt."
2222 = "Tôi không có tâm trí đâu mà trả lời."
2225 = "Thời gian tôi tắm vòi sen,\\nchắc chắn chưa đến năm phút."
2226 = "Để não bộ không bị nhuộm kín bởi hai chữ đó,\\ntôi nửa gượng ép uốn lưỡi, tiếp tục nói."
2228 = "Chắc hẳn Nagi đã buông mái chèo ra,\\nvừa nói “cỡ này” vừa dang rộng hai tay."
2230 = "Gác lại những thắc mắc trong đầu,\\ncơ thể tôi lập tức làm theo chỉ thị của Hachiroku."
2232 = "Tôi nhìn đồng hồ.\\nVẫn chưa tới sáu rưỡi."
2234 = "Không biết từ lúc nào,\\ntay của Hibiki đã phác họa liên tục một cách điên cuồng."
2235 = "Tôi vươn vai đứng dậy."
2238 = "Sau khi chuẩn bị qua loa và bước vào phòng khách,\\ntôi thấy Paulette đang đợi với vẻ mặt hơi căng thẳng."
2239 = "Giọng của Nagi.\\nĐầu ngón tay từ từ đưa lên."
2241 = "Tôi hiểu cảm giác đó.\\nNhưng mà, nếu buông tay ra thì――"
2242 = "Định bụng sẽ làm y như lúc tập,\\nnhưng có lẽ do ảnh hưởng của sự mệt mỏi, việc chèo lái đã trở nên hơi thô bạo."
2245 = "Tôi vội vàng cắm sào xuống nước, nhưng lại chạm đáy nông hơn dự tính,\\nphản lực khiến bọt nước bắn lên tung tóe."
2246 = "Dùng Navi từ trên không――tôi thoáng nghĩ vậy,\\nnhưng trong trường hợp đó, Navi sẽ hỗ trợ cho chiếc \\x%l8620;#00ffc040;8620%l;#; mà tôi đang lái."
2250 = "Trên sông thì không có thời gian để giả vờ ngoan ngoãn sao.\\nHay đơn giản chỉ là bị khách hàng cuốn theo."
2251 = "Có lẽ nó đã thổi bay lớp mưa mù,\\nmàu xanh của cây cối ven bờ sông trông có vẻ đậm đà hơn."
2252 = "Có lẽ lấy được gợi ý từ lời của Nagi,\\nHibiki mở cuốn sổ phác thảo ra――"
2257 = "Chính vì thế, cách thu thập dữ liệu của nó cũng rất chi tiết,\\nvà việc phân tích khả năng xảy ra tai nạn cũng được thực hiện một cách triệt để."
2263 = "Đầu ngón tay cảm nhận được tiếng sột soạt.\\nCái này, bên trong túi――có gói giấy hay thứ gì đó sao?"
2272 = "Hibiki nói rất có lý."
2276 = "Cuộc tìm kiếm mà tôi đã đi bộ suốt trong khi vẫn bế Reina,\\nvà sau đó là buổi huấn luyện đặc biệt của Nagi."
2283 = "Quả nhiên là có thứ gì đó bên trong."
2288 = "Sào đẩy nước được điều khiển bằng chân và hông."
2289 = "Đúng như cô ấy nói, đó là một chiếc túi bùa hộ mệnh nhỏ bé,\\nnhưng chính vì vậy, sự tỉ mỉ trong từng đường nét lại càng trở nên nổi bật."
2298 = "Nước không quá nóng."
2310 = "Paulette cũng cất lên một giọng nói mạnh mẽ.\\nBị thu hút bởi điều đó, tôi nhìn sang và hai ánh mắt chạm nhau."
2311 = "Có vẻ như cô ấy vẫn chưa quen với những lời khen ngợi.\\nPaulette đỏ bừng mặt, cúi gầm xuống."
2312 = "Paulette mỉm cười."
2313 = "Paulette nói nhanh như thể đang luống cuống,\\nrồi với khuôn mặt càng thêm hoảng hốt, cô ấy cúi đầu cái rụp."
2314 = "Paulette và Fukami đang tung hứng nhịp nhàng."
2315 = "Rất nhẹ nhàng,\\nPaulette xoay chuyển hình tượng 180 độ――"
2316 = "Thì thầm,\\nPaulette nhẹ nhàng đứng dậy."
2317 = "Paulette gật đầu thật mạnh."
2318 = "Cô ấy tròn mắt ngạc nhiên."
2323 = "Fukami nhìn vào, đôi má nhanh chóng ửng hồng.\\nCó vẻ như bệnh cảm đã hoàn toàn khỏi hẳn rồi."
2325 = "Fukami rướn người tới trước."
2334 = "Hôm nay phải nghỉ ngơi cả ngày――để giảm bớt phần nào sự bất an của Fukami,\\nngười đang tuân theo chỉ định của bác sĩ."
2339 = "Đến đó, con bé dừng bặt lại."
2340 = "Mưa phùn giăng mắc,\\nlàm hạn chế tầm nhìn."
2342 = "Khí thế sục sôi xua tan đi sự nặng nề của cơ thể."
2347 = "Quả thực, tôi chưa từng thấy cái nào như thế này.\\nTròn trịa――không khuyết một góc nào, một cầu vồng rực rỡ."
2348 = "Dù nói thế nào đi nữa, hôm qua có vẻ như tôi đã vắt kiệt sức lực quá mức rồi.\\nMột vùng cơ bắp rộng lớn đang xen lẫn cảm giác nhức nhối và đau đớn."
2349 = "Có vẻ không phải lúc để than vãn về sự nặng nề hay chậm chạp nữa rồi.\\nTôi ngồi dậy, cố gắng xua đi sự căng cứng của cơ thể, các khớp xương kêu rắc rắc."
2350 = "Paulette vỗ tay một cái bốp."
2352 = "Khi tôi nhận lấy,\\nPaulette lộ rõ vẻ nhẹ nhõm ra mặt."
2354 = "Nếu mải mê ngắm nhìn thì mức độ nguy hiểm sẽ tăng lên."
2364 = "Một cách tĩnh lặng, nhưng vô cùng dứt khoát,\\nchị Mayami cố tình dội một gáo nước lạnh vào sự nhiệt tình của chúng tôi."
2366 = "Mỉm cười dịu dàng.\\nÁnh mắt chị Mayami chăm chú hướng về phía Hachiroku."
2368 = "Mỉm cười.\\nChị Mayami cười, một nụ cười hoàn toàn khác với thường ngày."
2370 = "Giọng nói vô cùng mềm mỏng và tĩnh lặng của chị Mayami,\\nđã làm tròn bổn phận của một người lớn."
2375 = "Một cái bắt tay ngắn gọn là đủ――\\nChúng tôi mỗi người bước đi về phía con đường vòng của riêng mình."
2404 = "Mà khoan, không lẽ nào――việc điều chỉnh thời gian ở vùng nước đọng vừa rồi――\\nVà sáng nay, chuyện Paulette nói chuyện với Navi là――"
2405 = "Nhưng nếu bảo tôi lúc nào cũng\\nphải ngồi trên thuyền xuôi dòng thì..."
2407 = "Thông qua nhiều cuộc gặp gỡ,\\nđiểm ấy đã vươn dài thành đường ray, thành tuyến đường sắt."
2408 = "Trước thông báo bất ngờ của Hachiroku,\\nngay cả Nagi cũng phải thốt lên kinh ngạc."
2409 = "Khi tôi hỏi, cô ấy bẽn lẽn.\\nTrông có vẻ bối rối, và đồng thời, cũng có chút tinh nghịch."
2413 = "Để \\x%l8620;#00ffc040;8620%l;#; có thể kéo \\x%l客車;#00ffc040;toa hành khách%l;#; chật kín người thì việc phục hồi du lịch là cần thiết,\\nvà hiện tại, tuyến xuôi dòng sông Kuma chính là bộ mặt của du lịch Ohimitera."
2418 = "Nếu bộ mặt đó bị tổn hại nặng nề,\\nthì ngày phục hồi sẽ càng trở nên xa vời."
2420 = "\\x%l8620;#00ffc040;8620%l;#; nhả khói chạy băng qua cây cầu sắt đó――\\nHình ảnh ngước nhìn từ mặt nước sẽ tráng lệ đến nhường nào chứ."
2423 = "Làm cho Ohimitera ngập tràn nụ cười,\\nchính là mang lại nụ cười cho Paulette."
2424 = "Phản ứng này――nếu có thể khơi gợi được điều này từ toàn thành phố Ohimitera,\\nthì việc chấn hưng du lịch chắc chắn sẽ thành công."
2433 = "「Không có phản ứng gì từ căn phòng bên trong.\\nĐó có lẽ là biểu hiện cho sự an tâm của Fukami――」"
2450 = "Đang nói dở, ánh mắt Paulette chợt hướng về phía Nagi."
2451 = "Đúng là vậy.\\nNhưng, không chỉ có thế."
2452 = "Nói thẳng ra là, chẳng có chút hứng thú nào để thức dậy cả."
2453 = "Ba mươi phút cho các giải thích khác nhau như trang thiết bị an toàn,\\nvà hướng dẫn giao thông từ bến thuyền――"
2459 = "Ban đầu, chỉ là một điểm vô cùng nhỏ bé mang tên Hachiroku."
2463 = "Hachiroku vô cùng nhỏ bé,\\nnhưng lại trông giống như một người chị, hay thậm chí là một người mẹ của Nagi vậy."
2473 = "Cứ ngỡ như mình đã lạc vào trong một cuốn truyện tranh――\\nKhung cảnh ấy thật huyền ảo, và đẹp đẽ một cách thuần túy."
2474 = "Đến đây thì nhìn chung tôi đã giải thích xong.\\nKhông có ai lên tiếng thắc mắc gì."
2475 = "Ý nghĩa của việc này, tuyệt đối không hề nhỏ."
2476 = "Nghĩ vậy, tôi liền hiểu ra rằng đây cũng là một trong số đó."
2477 = "Nếu đó thực sự là một thiếu nữ tuổi dậy thì,\\nthì một người như tôi, hoàn toàn không thể đối phó nổi."
2478 = "Một gợi ý lớn đến nhường này,\\ntôi không thảnh thơi đến mức bỏ qua nó đâu."
2481 = "Tất nhiên, khách có thể giữ than đá làm quà lưu niệm,\\nvà cứ thế tự do hoạt động cũng được."
2484 = "Một lúc sau, một giọng nói vang lên như tiếng thở dài."
2486 = "Vòng qua một tảng đá lớn,\\nmột cơn gió mát lạnh lướt qua."
2487 = "Còn chưa kịp nhắc tới, chỉ vừa mới nghĩ đến thôi, bóng dáng Hachiroku đã xuất hiện.\\nTâm trạng tôi cũng phấn chấn lên đôi chút."
2496 = "Dù biết cô ấy giỏi những công việc đòi hỏi sự kiên nhẫn,\\nnhưng thú thật, tôi không ngờ cô ấy lại khéo tay thêu thùa đến vậy."
2497 = "Mặc dù đang là mùa hè, nhưng nước sông Kuma vào ban đêm lại rất lạnh."
2525 = "（Không được）"
2530 = "（Phía trước là chỗ khó đi.\\nKhông cần nhờ vả, tôi cũng sẽ tự tạo ra sóng lớn thôi.）"
2534 = "（Cốp!）"
2537 = "（Tách! Tách tách!!）"
2538 = "（Tách! Tách! Tách! Tách!）"
2539 = "（Tuuuuu!）"
2540 = "（Rào rào rào rào）"
2541 = "（Ào ào!）"
2543 = "（Hự――ào ào!）"
2545 = "（Chắc chắn vẫn còn những việc mình có thể làm.\\nDốc hết sức mình vì Paulette.）"
2547 = "（Việc làm cho giới trẻ, sẽ được tạo ra mới.）"
2549 = "（Mình vốn cũng khá tự tin vào thể lực của bản thân cơ mà――）"
2550 = "（Lảo đảo）"
2553 = "（Và đôi mắt của Paulette――đôi mắt của một chính trị gia mang danh thị trưởng,\\nđã mở rộng từ đường thành mặt――một cách mạnh mẽ.）"

[selections]
