1325 = "「Không đâu――những thứ như thế này,\\ncàng đơn giản thì lời cầu nguyện càng dễ linh ứng đấy.」"
1329 = "「Không chỉ lên thuyền, mà còn phải thành thạo việc chèo lái nữa.\\nCô phải cùng tôi hoàn thành nhiệm vụ của người chèo thuyền.」"
1331 = "「Không phải quay lại Ohimitera sao ạ?」"
1332 = "「Không có á. Lần đầu tiên em thấy luôn.\\nCầu vồng cong tròn vành vạnh――cỡ này á.」"
1334 = "「Dù lý do là gì đi nữa, một sự kiện mang lại mức độ hài lòng nhường này,\\ntôi nghĩ không có lý do gì lại không kết nối nó với việc xúc tiến du lịch.」"
1336 = "「Không đâu, anh Soutetsu. Không phải diễn viên quần chúng mà là diễn viên cố định.\\nChúng ta hãy tuyển dụng họ làm diễn viên cho Mine Treasure luôn đi ạ.」"
1344 = "「Không thể chạy được, tất nhiên là vì không có than đá. Ạ.」"
1351 = "「Sự bất an của khách hàng sẽ trực tiếp trở thành rủi ro cho con thuyền.\\nĐể không bị coi là thiếu kinh nghiệm, phải luôn cư xử thật đường hoàng.」"
1362 = "「Vong linh... giả sử có vong linh xuất hiện\\nở khu ký túc xá bỏ hoang hay mỏ than thì sao ạ?」"
1363 = "「Họ nổi điên và tràn cả ra đường ray――\\nNên \\x%lキハ07;#00ffc040;KiHa 07%l;#; không còn cách nào khác đành phải sơ tán đến Yui sao?」"
1365 = "「Vong linh?」"
1367 = "「Cái gì! Nhanh vậy sao!?」"
1370 = "「Nhưng mà, việc tôi lên thuyền sẽ giúp ích cho đứa trẻ đó.\\nTôi đã hiểu được điều đó, và cảm thấy như cái gai trong lòng đã được nhổ bỏ vậy.」"
1374 = "「Nhưng mà, dẫu có kéo theo một \\x%l客車;#00ffc040;toa hành khách%l;#; không người thì 8620 cũng sẽ không thỏa mãn đâu.\\nĐể hồi sinh theo đúng nghĩa thực sự. Đây là một bước đi cần thiết.」"
1376 = "「Nhưng mà, nếu bắt buộc thì... sẽ gây ấn tượng là\\ncố tình đi đường vòng để lấy tiền đó――」"
1379 = "「Nhưng mà. Nếu đó là thứ tôi không thể đối phó được thì――」"
1381 = "「Thấy chưa! Ổng toàn làm mấy trò bất ngờ cỡ này thôi á!」"
