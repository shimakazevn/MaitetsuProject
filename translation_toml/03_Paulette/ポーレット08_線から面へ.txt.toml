1385 = "「Làm gì vậy á!」"
1387 = "「Vì cớ gì mà,\\nchỉ có một mình tôi vào thăm bệnh chứ ạ?」"
1389 = "「Cho họ giải đố ở khu ký túc xá bỏ hoang, sau đó,\\ndi chuyển bằng xe goòng đến lối vào hầm mỏ. Cho họ trải nghiệm khai thác than.」"
