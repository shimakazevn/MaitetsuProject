1578 = "「Hỗ trợ... là nhờ ai vậy?」"
1584 = "「Cầu vồng! Cầu vồng kìa!」"
1588 = "「Một bước đi, cần thiết... nhỉ.」"
1591 = "「Sao vậy, Hachiroku.」"
1593 = "「Đang đợi――」\\n「Chúng tôi đang đợi quý khách đây ạ. Chào mừng quý khách đã đến.」"
1597 = "「Em――sẽ cố gắng ạ.\\nĐể chị có thể yên tâm giao phó cho em.」"
