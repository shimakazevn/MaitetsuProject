1417 = "「Ra vậy. Nếu là tinh linh thì――\\nSo với người già, người trẻ sẽ tạo ra bầu không khí phù hợp hơn nhỉ.」"
1418 = "「Ra vậy! Lựa chọn 『Tặng than đá vừa đào được cho 8620』\\nnếu thế thì sẽ thêm phần kịch tính lớn đây.」"
1438 = "「Mà phải nói là, em mới là người phải xin lỗi.\\nĐến làm phiền anh từ sáng sớm thế này.」"
1439 = "「Làm được cái nhỏ xíu thế này là em đã cố hết sức rồi đấy.」"
