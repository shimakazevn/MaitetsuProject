1543 = "「Được rồi!」"
1546 = "「Những vị khách quan tâm đến 『SL ảo ảnh』 nhìn thấy từ thuyền, chúng ta sẽ hướng dẫn họ đến \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#; và cho họ gặp \\x%l8620;#00ffc040;8620%l;#;.」"
1548 = "「Nếu có thể lên chuyến tàu \\x%l8620;#00ffc040;8620%l;#; đã sống lại nhờ được tặng than đá――\\nthì chắc chắn sẽ tuyệt lắm, em nghĩ vậy. Ạ.」"
1553 = "「Nếu muốn gặp trước giờ làm nhiệm vụ thì chỉ có thời gian này thôi.\\nCô hoàn toàn không cần phải xin lỗi đâu――có chuyện gì sao?」"
1554 = "「Thế là, các tinh linh mỏ quặng sẽ rất vui,\\nvà quay trở về mỏ với nụ cười trên môi――thì tuyệt lắm. Ạ.」"
