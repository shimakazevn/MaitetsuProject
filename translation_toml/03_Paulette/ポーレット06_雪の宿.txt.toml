2042 = "「Đúng vậy. Giờ nghĩ lại thấy dũng cảm thật đấy.\\n...Biết đâu, đó là tiếng sét ái tình cũng nên」"
2043 = "「Đúng vậy」"
2045 = "「Đúng vậy đúng vậy. Em cũng đã nghĩ đến lộ trình thoát hiểm\\nbằng \\x%lエアクラ;#00ffc040;Aircra%l;#; hay các phương tiện giao thông khác rồi」"
2048 = "「Anh nghĩ là vậy, và chúng ta đã cố gắng như thế.\\nNhưng cả hai đều hiểu lầm theo hướng có lợi cho bản thân mình」"
2049 = "「Dạ~, đúng vậy đó nha~.\\nBởi vì Reina, là Railord mà~」"
2050 = "「Nói là nhìn bằng trái tim, đúng là một cách nói tuyệt diệu」"
2053 = "「Vâng. Đã cất công đến tận đây rồi,\\ncho đến lúc lên chuyến tàu sưởi ấm để về, thì vẫn phải」"
2061 = "「Vậy sao.\\nCon là người muốn nói chuyện với bạn ấy nhất nhỉ」"
2062 = "「Vậy ớ.\\nCả mẹ và ba, cũng đang luyện tập haー」"
2063 = "「Vậy... sao?」"
2064 = "「Vậy sao」"
2065 = "「Vậy sao ạ~?」"
2066 = "「Vậy, sao? Ba ơi」"
2067 = "「Là thế này, chăng?」"
2070 = "「Ngủ ngon nhé, Paulette của anh」"
2071 = "「Chúc ngủ ngon, Soutetsu」"
2072 = "「Sát giờ ăn tối luôn rồi nhỉ」"
2075 = "「Cái gì quay trở lại ớ?」"
2077 = "「Chuyện quan trọng thì quên béng, chuyện kỳ cục thì lại nhớ dai.\\n...Có khi người lớn chúng ta cũng vậy thôi」"
2079 = "「Cô phục vụ cũng vậy mà」"
2086 = "「Mừng quý khách đã về. Quý khách có bị ướt không ạ?」"
2088 = "「Bữa ăn của quý khách vừa chuẩn bị xong ạ」"
2089 = "「So với búp bê Reina kokeshi,\\nHikari dễ bị cảm lạnh hơn đó nha~」"
2090 = "「Vâng. Chúng tôi về rất đúng lúc」"
2091 = "「Không sao không sao.\\nBúp bê kokeshi của Naruko rớt một chút không xước được đâu」"
2092 = "「Không sao đâu nha~. Búp bê Reina kokeshi, thấy không,\\nđang nói 『Tớ về rồi nè』 với Hikari đó」"
2093 = "「Không, cô cũng chỉ có ý tốt thôi mà.\\nTrong tình huống đó thì...」"
2094 = "「Chuyện đó thì, không sao đâu.\\nCũng nhờ có Reina giúp đỡ nữa mà」"
2100 = "「Ngâm mình trong bồn tắm――\\nĐúng là có cảm giác thứ gì đó đang quay trở lại nhỉ」"
2104 = "「Paulette――Mẹ đã dạy cho ba điều đó.\\nVì được dạy dỗ, nên ba cũng đã có thể làm được như vậy」"
2105 = "「Chị Paulette, giỏi quá nha~.\\nNhìn rõ ghê nha~」"
2107 = "「Ướt mất ướt mất」"
2110 = "「Không thể nói ra, nên đành cất giấu đi.\\nCất giấu rồi, lại càng thấy sợ hãi việc phải nói ra hơn nữa」"
2112 = "「Thêm vào đó, tôi muốn truyền đạt rằng 『Nếu thực sự là chuyện quan trọng,\\nthì vì muốn nói ra nên sẽ cố gắng được』. Nhưng mà」"
2114 = "「Ba cũng vậy. Vì ba từng có một cô em gái sinh đôi――\\nNên chỉ cần nói chuyện với em gái thôi, đối với ba như thế là đủ rồi」"
2118 = "「Reina~」"
2120 = "「Reina không thấy khó ớ?」"
2121 = "「Búp bê Reina kokeshi, bị rơi mất tiêu rồi.\\nBị cụng đầu, đau lắm, tội nghiệp lắm ớ」"
2124 = "「Búp bê Reina kokeshi cũng muốn nói chuyện với Hikari,\\nnên mới mượn sức của chị đó nha~」"
2126 = "「Reina, tự bản thân cũng không rõ nữa nhưng――\\nUfufu, em nghĩ là 『có lẽ vậy』 đó nha~」"
2127 = "「Bây giờ xin cô hãy khoan.\\nCon bé hay sợ người lạ, cô có lòng là được rồi」"
2128 = "「Giờ này chắc là đang trống đấy ạ.\\nTôi sẽ đi xác nhận với lễ tân ngay」"
2129 = "「Bây giờ thì,\\nbúp bê Reina kokeshi đã có thể nói chuyện với Hikari rồi đấy」"
2131 = "「Dùng trái tim, là nhìn thấy được tay ớ?」"
2132 = "「Anh thì không nói, nhưng Paulette lúc đó còn rất nhỏ mà.\\nNói là tiếng sét ái tình thì――」"
2133 = "「Có chứ nha~. Chị cũng thấy khó,\\nvà việc nói chuyện, quả thật cũng hơi sợ một chút đó nha~」"
2135 = "「Quả thật, bố và mẹ là người lớn nhỉ.\\nCứ có cảm giác họ là những sinh vật trưởng thành ngay từ đầu vậy」"
2137 = "「Tuyệt vời」"
2138 = "「Thiệt tình, anh cứ hay bắt bẻ vậy áー」"
2140 = "「Đúng chuẩn Hinomoto luôn ha~! \\nCăn phòng thật thư giãn~」"
2142 = "「Thực sự――muốn nói ớ?」"
2144 = "「Điều thực sự muốn nói, chính là như vậy đó.\\nNếu không nói ra, chắc chắn sẽ mãi mãi cảm thấy cô đơn」"
2146 = "「Hết cách rồi nhỉ. Để mẹ đoán cho」"
2149 = "「Thật sao」"
2158 = "「Thẳng thắn tức là, 『nói một cách đơn giản』 ấy mà」"
2159 = "「Thẳng thắn ớ?」"
2161 = "「Dù sao thì, bữa ăn――a, không」"
2163 = "「Con bé đã hoàn toàn lấy lại tinh thần rồi nhỉ」"
2165 = "「Hiểu ra, là hiểu chuyện gì ạ?」"
2166 = "「Những điều mà chúng ta, đã cố gắng truyền đạt ấy」"
2167 = "「Việc gắn kết với con người là một điều tuyệt vời. Nếu vì sợ hãi nỗi đau hay sự hiểu lầm,\\nmà cất giấu những lời muốn nói đi, thì thật sự rất lãng phí」"
2169 = "「Dạ――tôi, tôi muốn xin lỗi cô bé」"
2173 = "「Vì không hiểu nên mới sợ――\\nNếu sợ, thì sẽ không muốn nói chuyện đúng không?」"
2175 = "「Phải truyền đạt sao cho đối phương hiểu được rằng 『Tôi muốn nghe bạn nói』.\\nNếu không làm được như vậy, người ta sẽ không kể cho mình nghe những chuyện quan trọng đâu」"
2177 = "「Phải mạnh thế này ớ?」"
2182 = "「Vì đã hiểu lầm. Vì đã áp đặt lý tưởng của mình lên đối phương.\\nNên có lẽ vì vậy, mà chúng ta mới mãi không thể quên được nhau đấy?」"
2183 = "「Đã truyền đạt được chưa nhỉ?\\nEm cũng không rõ là mình có nói được phần đó không nữa. Nhưng mà」"
2184 = "「Khoan đã!」"
2185 = "「Reina, cảm ơn em.\\nNhưng mà, chạy vào trong còn nhanh hơn là lấy ô ra đấy」"
2186 = "「Điều đáng sợ không phải là việc nói chuyện,\\nmà là việc 『không hiểu được đối phương』 đó nha~」"
2192 = "「Nói chuyện với người lạ, đáng sợ lắm nhỉ」"
2195 = "「Đúng như những gì em nghe thấy đấy」"
2196 = "「Tại sao, Railord thì lại...」"
2205 = "「Tôi cũng mong là vậy.\\nDù không mong ước, thì có lẽ một ngày nào đó, nó cũng sẽ tự nhiên thành hiện thực thôi」"
2206 = "「Cái đó thì...」"
2207 = "「Chà, ai biết được nhỉー」"
2208 = "「Như thế không được đâu.\\nCon phải nắm thật chặt, dồn sức vào」"
2209 = "「Khó lắm ớ?」"
2210 = "「Cứ thế, sự sợ hãi, nỗi cô đơn lấp đầy trong lòng.\\nVà rồi lúc đó nhé? Mẹ đã, gặp được một cậu bé」"
2211 = "「Nghĩ vậy mới thấy, giao tiếp thật sự rất khó,\\nnhưng cũng rất thú vị nhỉ」"
2212 = "「Thấy thứ gì đáng sợ thì nên bỏ chạy, nên trốn đi.\\nVề điểm đó, Hikari làm rất đúng」"
2216 = "「Vậy thì ba cứ nói đơn giản đi chứー」"
2217 = "「Dạ――tôi, tôi xin lỗi! Tôi lỡ...」"
2220 = "「Có chứ. Tự tin.\\nBởi vì, đây là việc Soutetsu làm mà」"
2221 = "「Đó là vì, mẹ đã luôn, luôn dõi theo.\\nDõi theo Soutetsu――người mà mẹ yêu thương nhất, luôn luôn」"
2222 = "「Quý khách đã tận hưởng Naruko đến vậy,\\nđó là niềm vui của chúng tôi ạ」"
2225 = "「Trễ mất tiêu rồi」"
2226 = "「Lúc nãy trong phòng tắm với Hikari. Cụ thể là――\\nem đã kể cho con bé nghe chuyện gì về quá khứ của chúng ta vậy?」"
2227 = "「Dù cũng có lúc gặp chuyện đáng sợ, hay những điều không vui.\\nNhưng dẫu vậy, việc gắn kết với mọi người, vẫn rất tuyệt vời」"
2228 = "「Soutetsu? Không phải vấn đề đó đâu nhé?」"
2229 = "「Soutetsu?」"
2230 = "「Đồ ăn nguội cũng không sao.\\nCô có thể dời bữa ăn lại một tiếng... à không, hai tiếng sau được không?」"
2233 = "「Điều đầu tiên là 『Không cần phải vội vàng』」"
2236 = "「(......Su, su, su, su)」"
2238 = "「(Suya~――Suya~a~)」"
2410 = "Cứ nghĩ đến việc Hikari cũng sẽ có khoảnh khắc như thế,\\nthật sự thấy bất an và không thể bình tĩnh nổi."
2412 = "Một khi đã ngủ say, cả Hikari và Reina,\\nhầu như sẽ không thức giấc."
2415 = "À không, có vẻ không chỉ mình tôi nghĩ vậy.\\nCả Paulette và Hikari cũng đang sững sờ với vẻ mặt ngạc nhiên."
2417 = "Nhưng mà, tôi hiểu điều Paulette muốn nói.\\nChiếc bàn đơn sơ, đệm ngồi, ghế bệt."
2421 = "Hay là vì cô phục vụ còn trẻ――\\nTầm tuổi Hibiki hay Kisaki nên mới được nhỉ?"
2427 = "Một cảm giác có lẽ gần giống với cộng cảm――\\nTôi cũng từng có một người để chia sẻ cảm giác đó."
2436 = "Thế nhưng, vụ tai nạn đã xảy ra.\\nKhi còn quá nhỏ, tôi đã khép chặt trái tim mình lại."
2458 = "Hikari đang định nhặt búp bê Reina kokeshi lên\\nliền vội vàng rụt lại sau lưng Reina hàng thật."
2461 = "Đi trước cặp vợ chồng tình thương mến thương chúng tôi,\\nlà Hikari và Reina đang lẫm chẫm bước đi."
2463 = "Hikari cười.\\nThật ngây thơ."
2465 = "Hikari vội vàng,\\ncất búp bê Reina kokeshi vào ba lô của mình."
2467 = "Vừa mới khóc xong mà ăn ngay thì Hikari cũng nuốt không trôi.\\nĐể lấy lại bình tĩnh thì――"
2469 = "Hikari đã dựa dẫm vào tôi.\\nChỉ nghĩ vậy thôi, tâm trí tôi đã trở nên vững vàng."
2471 = "Mỗi lần vuốt đầu búp bê Reina kokeshi,\\nHikari lại chìm vào im lặng."
2473 = "Với đôi mắt ngấn lệ.\\nHikari nhìn tôi――rồi nhìn chằm chằm vào búp bê Reina kokeshi."
2475 = "Hikari đang chờ đợi câu tiếp theo của cô phục vụ,\\ndù vẫn còn run rẩy sợ hãi."
2477 = "Tiếng thở của Hikari thì ngắn và nhịp nhàng,\\ncòn của Reina thì chậm rãi, hơi thất thường một chút."
2480 = "Đầu ngón tay Hikari dồn sức.\\nThế này thì, không cần đến tay tôi nữa rồi."
2481 = "Giọng Hikari đã khá bình tĩnh lại.\\nReina khẽ buông vòng tay đang ôm con bé ra."
2484 = "Búp bê Reina kokeshi tự tay làm,\\nHikari cứ ôm khư khư mãi, và vuốt ve đầu nó nhiều lần."
2485 = "Ôm chặt búp bê Reina kokeshi,\\nHikari lắc đầu quầy quậy."
2487 = "Hikari nấp kỹ sau lưng Reina, lạch bạch bước đi.\\nCô bé ngồi yên ở góc phòng và hạ ba lô xuống."
2489 = "Hikari vẫn trốn, nhưng có vẻ không bận tâm thêm nữa,\\ncon bé đã thưởng thức bữa ăn sang trọng đến mức không tưởng so với tiền phòng."
2490 = "Vẫn ôm chặt búp bê kokeshi,\\nHikari vươn đôi tay ngắn ngủn ra."
2492 = "Hikari gật đầu.\\nKhông nói một lời, thật mạnh."
2501 = "Ra là vậy. Trên đường từ xưởng về,\\ncon bé cứ ôm khư khư búp bê kokeshi và vuốt ve đầu nó là vì――"
2506 = "Nếu cô phục vụ vẫn ở đây,\\nHikari sẽ không hết sợ hãi được."
2507 = "Không biết có phải phía nhà trọ đã lưu tâm hay không, mà sau khi tắm xong,\\nngười mang thức ăn đến là một cô phục vụ kỳ cựu."
2510 = "Điều đó đã có tác dụng sao?"
2512 = "Có lẽ Paulette đang nhớ về bố mẹ của mình."
2533 = "Ufufu, một nụ cười hạnh phúc khẽ vang lên."
2534 = "Chà, giỏi thật."
2538 = "Nhớ lại chuyện ngày xưa.\\nMichiko quả thực cũng đối xử với nó như vậy."
2541 = "Hành động của tôi, suy nghĩ của tôi,\\nPaulette thường ngày vẫn luôn quan sát kỹ nên đã đọc thấu được."
2542 = "Vì tàu đến trễ,\\nnên chúng tôi quyết định đi tham quan càng sớm càng tốt."
2544 = "Bị đoán trúng rồi.\\nNgay khi tôi vừa trực giác được điều đó, một giọng nói đã vang lên."
2548 = "Trong thoáng chốc, cô ấy nín thở."
2550 = "Những lời nói của tôi,\\ncũng vì thế mà có thể trở nên chân thành đến nhường nào."
2552 = "Cảnh tượng đó khiến tôi liên tưởng đến Nininbaori."
2554 = "Chắc cô ấy đang cố an ủi Hikari.\\nCô phục vụ nói với vẻ bông đùa, pha chút phương ngôn."
2556 = "Trước âm sắc buồn bã hiếm thấy đó,\\nHikari chớp mắt như ngạc nhiên."
2559 = "Cô ấy đang tin tưởng tôi.\\nSự im lặng ấy, truyền đạt điều đó một cách hùng hồn hơn bất cứ thứ gì."
2560 = "Rằng để truyền đạt thông điệp 『Biết được những điều mình không biết là một niềm vui』,\\nthì việc không thay đổi hình dáng ngón tay sẽ là một lựa chọn thích hợp hơn."
2562 = "Chỉ mỉm cười dịu dàng và tiếp nhận lời nói của chúng tôi.\\nĐối với Reina, có lẽ đó là điều hết sức hiển nhiên――"
2563 = "Nói rồi, cô ngẩng mặt lên đầy quyết tâm.\\nCô phục vụ rảo bước nhanh rồi khuất dạng phía cuối hành lang."
2565 = "Vỗ vỗ vỗ, nhè nhẹ, thật nhè nhẹ,\\nrồi vuốt ve phía sau đầu con bé."
2568 = "Ví dụ như một phục vụ kỳ cựu, dù trong tình huống nào đi nữa,\\ncũng sẽ không tự ý làm kêu búp bê kokeshi của khách."
2569 = "Nếu không có vụ tai nạn đó――\\nTôi sẽ thay đổi và trưởng thành như thế nào nhỉ?"
2577 = "Sức lực của một bé gái, lại còn đeo găng tay.\\nĐiều kiện quá tồi tệ khiến con bé mãi vẫn không làm được――"
2580 = "Như mọi khi, trong tấm chăn ấm áp,\\nvợ chồng chúng tôi, nắm tay nhau qua hai cô con gái."
2582 = "Giống như mùa hè năm ấy, ngày hôm ấy, dọc theo tuyến đường sắt đó.\\nGiống như cách Paulette đã nhìn tôi, nhìn thật thẳng."
2597 = "Đột nhiên, cảm giác bị nhìn biến mất.\\nTôi cũng tự nhiên nhắm mắt lại."
2602 = "Việc hòa trộn những suy nghĩ, những ý tưởng.\\nViệc trò chuyện, biến thời gian của một người thành thời gian của hai người."
2606 = "Những lời nói nghẹn lại của tôi,\\nđược Paulette nhẹ nhàng nâng đỡ."
2608 = "Tôi cứ tự mặc định ngay từ đầu rằng,\\nReina bẩm sinh đã giỏi lắng nghe và nói chuyện rồi."
2609 = "Tôi không giỏi diễn kịch hay nói dối.\\nVì thế――tôi sẽ chỉ nói \"sự thật\"."
2611 = "Nếu cứ lặp đi lặp lại 『Điều thực sự muốn nói thì sẽ nói được』,\\nthì không những chẳng an ủi được gì, mà còn phủ nhận mong muốn của con bé."
2619 = "Tôi giữ nguyên hình dáng bàn tay và nhấc lên."
2620 = "Vừa bước vào nhà trọ, cô phục vụ lúc nãy làm thủ tục nhận phòng\\nđã tươi cười chào đón chúng tôi."
2621 = "Khi trở về phòng,\\nPaulette thở hắt ra một hơi nhẹ nhõm."
2622 = "Sau khi tô màu, phơi khô và được phủ một lớp sáp dày.\\nNhững con búp bê kokeshi của chúng tôi đều đã hoàn thiện sáng bóng."
2623 = "Vừa ra hành lang và đóng cửa lại,\\ncô phục vụ liền cúi đầu thật sâu."
2624 = "Để có thể bình tĩnh ứng phó với bất cứ chuyện gì xảy ra,\\ntôi hít một hơi thật sâu――rồi lặng lẽ quay vào phòng."
2627 = "Tôi chỉ dìm tay xuống nước thôi."
2628 = "Tôi khẽ kiểm tra trong làn nước nóng."
2630 = "Tôi cảm nhận mạnh mẽ rằng đây chính là con gái mình.\\nCon gái tôi――là một sinh mệnh mang những nét giống hệt tôi."
2632 = "Tôi giật lại búp bê Reina kokeshi từ tay cô phục vụ đang sững sờ,\\nvà đưa ngay cho Hikari cầm."
2634 = "Cảm giác đó, có lẽ là đúng.\\nHikari vẫn chưa có cách nào để tự bảo vệ mình."
2635 = "Quả đúng là phong cách của Reina, tôi thành thực nghĩ vậy."
2638 = "Câu trả lời mà tôi tưởng mình đã tìm ra,\\ndường như quá thô kệch đối với câu hỏi của Hikari."
2640 = "Thấy an tâm rồi. Thấy trọn vẹn rồi. Giờ tôi không muốn nghĩ thêm gì nữa.\\nChỉ muốn đắm mình hoàn toàn trong sự ấm áp này."
2642 = "Tôi đưa tay phải ra trước mũi Hikari và hỏi thử."
2644 = "Tôi đang định quay lại phòng,\\nthì một giọng nói gấp gáp gọi giật lại từ phía sau."
2646 = "Tôi dùng hai tay mình bao trọn lấy đôi bàn tay bé xíu ấy,\\nủ ấm cho chúng."
2648 = "Theo đà, một vật gì đó――a, búp bê Reina kokeshi lăn lông lốc ra ngoài.\\nChắc là do cất không cẩn thận rồi."
2650 = "Tôi lóe lên một suy nghĩ, hay đúng hơn là có thể hiểu được.\\nBởi vì tôi, cũng từng là trẻ sinh đôi."
2651 = "Trong bóng tối, tôi cảm nhận được ánh nhìn.\\nPaulette đang ngắm nhìn tôi."
2653 = "Thử nhớ lại về bố mẹ mình.\\nVề lý thuyết thì đương nhiên, bố và mẹ cũng từng có thời thơ ấu."
2654 = "Tôi dừng lời và suy nghĩ.\\nNhưng――tôi chỉ có thể nghĩ ra một câu trả lời quá đỗi trực tiếp."
2655 = "Vừa nói xong, lông mày Hikari nhíu chặt lại."
2656 = "Mà khoan, cái này là――"
2661 = "Tôi khẽ đặt lòng bàn tay lên vị trí trái tim con bé.\\nNó đang đập thình thịch, thình thịch."
2662 = "Tôi nhẹ nhàng rút tay lại――"
2663 = "Khi tôi nới lỏng tay ra,\\nHikari rụt rè chạm vào cổ búp bê Reina kokeshi."
2668 = "Một lần nữa, tôi đặt lòng bàn tay lên mu bàn tay Hikari.\\nCầm lấy tay con bé, nắm chặt cổ búp bê Reina kokeshi."
2670 = "Trong lúc Paulette hỏi thăm thông tin du lịch,\\ntôi, Reina và cô phục vụ đã mang hành lý lớn vào phòng."
2672 = "Thế nên, đây chỉ là một sự trả ơn đơn giản.\\nLần này để ba dạy cho con nhé."
2678 = "Mặc dù đã được nói là không sao,\\nnhưng Hikari lại bị sốc."
2680 = "Dù đang ở trong suối nước nóng, Hikari lại khẽ vặn vẹo cơ thể,\\ntrông có vẻ hơi khó chịu."
2690 = "Tay cô phục vụ vươn tới đầu búp bê Reina kokeshi."
2692 = "Việc thấy vui vì không hiểu,\\nnói cách khác, đó là một dạng của khát khao tri thức, trí tò mò――Nếu vậy thì."
2695 = "Định nói là không còn cách nào khác,\\nnhưng rồi tôi lại nuốt lời vào trong."
2716 = "Nghe Paulette nói với vẻ hơi bông đùa,\\nHikari cũng thả lỏng, nở một nụ cười như đã yên tâm."
2717 = "Cô ấy đáng yêu đánh yêu vào người tôi."
2718 = "Tiếng cười khúc khích hạnh phúc lăn trên mặt chăn."
2719 = "Paulette mỉm cười. Nhìn tôi.\\nĐột nhiên, mặt tôi nóng ran."
2720 = "Lực ở những ngón tay của Paulette siết chặt hơn.\\nTôi cũng đáp lại, nắm chặt lấy tay cô ấy."
2721 = "Bàn tay Paulette thật ấm áp, và dù sao thì tôi cũng đã kiệt sức rồi,\\ncơn buồn ngủ đang dần kéo đến."
2722 = "Giống như ngày hai chúng tôi hòa làm một――\\nNhững ngón tay của Paulette khẽ cựa quậy, nũng nịu với tôi."
2723 = "Giọng Paulette rất dịu dàng."
2724 = "Giọng nói của Paulette thật êm ái.\\nCó lẽ cô ấy cũng đang chìm dần vào giấc ngủ rồi."
2725 = "Giọng điệu của Paulette nghe rất vui vẻ.\\nTôi cũng bất giác cảm thấy nhẹ nhõm."
2726 = "Paulette liếc mắt đưa tình."
2727 = "Hướng Paulette vừa cười vừa chỉ tay là――a."
2728 = "Paulette căng thẳng nín thở.\\nNhưng――hơi thở bị nuốt vào trong không bật thành lời."
2729 = "Paulette, đã truyền đạt cho tôi.\\nNhững điều quan trọng, lúc đó.――Và cả bây giờ nữa."
2730 = "Phì.\\nTiếng thở hắt ra lần này của Paulette, gần giống như một nụ cười."
2731 = "Paulette cười rạng rỡ,\\nrồi dịu dàng xoa đầu Hikari."
2746 = "Sau đó cúi thật sâu――\\nCô phục vụ cúi gập người đến mức trán gần chạm đầu gối."
2747 = "Nhưng những gợn sóng lăn tăn và sự khúc xạ,\\nđã ngụy trang khéo léo cho những ngón tay của tôi."
2751 = "Reina liếc nhìn tôi.\\nĐúng là lúc nãy tôi vừa nói câu đó."
2752 = "Cùng với con búp bê kokeshi đang nắm chặt trong tay,\\nHikari được Reina nhẹ nhàng ôm lấy."
2755 = "Reina cười dịu dàng, một nụ cười còn ấm áp hơn cả nước nóng."
2756 = "Reina chìm vào suy tư một lúc.\\nTôi cũng tự nhiên bị cuốn theo dòng suy nghĩ."
2757 = "Paulette cũng không có vẻ gì là bận tâm đặc biệt.\\nNhắc lại chuyện cũ có lẽ cũng không hay."
2760 = "Tiếp nối lời giải thích tuyệt vời của Reina,\\nPaulette cũng ngay lập tức hùa theo."
2761 = "Tôi hơi ngạc nhiên trước từ ngữ bất ngờ thốt ra đó."
2762 = "Bị khẳng định chắc nịch như vậy, tôi chợt thấy rùng mình."
2763 = "Tôi gật đầu trước lời nói của Hikari――\\nTôi có thể hiểu được, nhưng lại thấy bối rối."
2774 = "Bàn tay khẽ cựa quậy trong chăn.\\nTôi cũng, đáp lại."
2777 = "Người được đưa tình lại không hề hay biết,\\nchỉ thong thả nheo mắt với chiếc khăn vắt trên đầu."
2785 = "Dù vậy, có vẻ cô ấy cũng đã tự nhận ra\\nđiểm sai của mình ở đâu rồi."
2786 = "Mặc dù vậy, sai lầm vừa rồi\\nchỉ có thể nói là do không đúng lúc thôi."
2787 = "Đột nhiên bị gọi tên, lại còn được khen ngợi.\\nNhưng Reina vẫn tỏ ra như mọi khi."
2788 = "Chỉ có mẹ và con gái, hai người với nhau.\\nVề ngày hôm ấy, ngày khởi đầu cho sự ra đời của Hikari."
2793 = "Việc trò chuyện cùng nhau.\\nĐơn thuần là trao đổi lời nói."
2796 = "Là một người làm cha mà không giữ được lời nói của chính mình...\\nTôi cảm thấy muốn ngụp lặn chìm nghỉm luôn xuống làn nước nóng."
2807 = "Không phải là giọng điệu động viên hay an ủi.\\nPaulette thực sự, tin tưởng điều đó từ tận đáy lòng."
2808 = "Mà khoan, gay go rồi.\\nPhải mau chóng dỗ dành con bé――"
2809 = "Điều này――thật bất ngờ."
2810 = "Cảm giác chật hẹp vừa vặn cho bốn người.\\nNhà trọ suối nước nóng kiểu xưa――những từ ngữ đó hiện lên trong đầu tôi."
2811 = "Điều đã học được từ bà lão bán hàng rong.\\nĐiều mà cả hai chúng tôi, đều đồng tình."
2812 = "Gần miệng vòi nước. Mặt nước luôn gợn sóng lăn tăn.\\nNếu là chỗ này thì――ừm. Hoàn hảo."
2813 = "Là một loại bùa chú gì đó chăng?"
2814 = "Vậy thì có khi lúc trả phòng chỉ cần để lại chìa khóa là xong.\\nCó lẽ sẽ không bao giờ gặp lại cô phục vụ trẻ tuổi đó nữa."
2819 = "Đó chính là――\\nÍt nhất là với tôi của ngày xưa, điểm khác biệt lớn nhất."
2820 = "Đôi mắt xanh biếc nhìn thẳng vào tôi."
2821 = "Nếu vậy, tôi cũng có thể truyền đạt được.\\nSự xác tín đó, cứ thế trào dâng thành lời."
2822 = "Nếu vậy, thay vì tiếp tục trách móc,\\ntôi nên nghĩ xem phải làm gì cho Hikari thì hơn."
2827 = "Tuy còn nhỏ, nhưng chắc con bé cũng nghĩ đến điều gì đó.\\nHikari gật đầu lia lịa, rất nhiều lần."
2828 = "Dù tôi không thể hiểu hết được, nhưng có lẽ đối với những đứa trẻ nhỏ,\\nbúp bê hay thú nhồi bông cũng giống hệt như sinh vật sống vậy."
2829 = "Dù nằm trong tấm chăn khác với mọi khi,\\nnhưng tư thế vẫn giống hệt, kiểu chữ Xuyên cộng 1."
2836 = "Lăn lông lốc,\\nbúp bê Reina kokeshi lăn đến chân cô phục vụ."
2850 = "(Két!)"
2851 = "（Cộc!）"
2853 = "（Thoăn thoắt）"
2854 = "（Tõm）"
2856 = "（Con bé định vặn cổ cho nó kêu,\\nđể nói chuyện với búp bê Reina kokeshi sao）"
2858 = "（Nắm chặt）"
2859 = "（Tõm）"
2863 = "（Là tự vệ, hay là hợp lý hóa...\\nCó lẽ đó là hoạt động tâm lý của con bé, nhưng――）"

[selections]
