1516 = "「Oáp.」"
1518 = "「Chỗ tôi thì, chỉ có hai ông bà già và một đứa cháu gái. Đứa cháu đó cũng,\\nlà một đứa trẻ ngoan ngoãn có thể tự kiếm cơm ăn được rồi.」"
1520 = "「Em hiểu rồi nè! Nếu để đối kháng với bên kia mà đặt lương theo giờ là 2000 yên\\nthì chuyện đó sẽ ám ảnh về sau luôn nè.」"
1522 = "「Oaoa!\\nChắc chắn, sẽ thành một hộp bento vừa dễ thương vừa ngon miệng đây ạ.」"
1524 = "「Oa! Em vui lắm ạ!\\nVậy thì, hứa rồi nhé, Paulette.」"
1526 = "「Oa, mong chờ quá đi.\\nThực đơn, có vẻ sẽ như thế nào vậy anh?」"
1527 = "「Ủa? Mình đến sớm quá sao?」"
1529 = "「Hả!?」"
