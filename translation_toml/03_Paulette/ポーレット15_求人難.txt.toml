1073 = "「\\x%lマスコン;#00ffc040;Bộ điều khiển trung tâm%l;#;?」"
1074 = "「——Chỉ cần vượt qua cuộc thị sát của bộ trưởng với điểm số vừa đủ đậu là được.\\nChỉ cần làm được như vậy, chiến thắng của chúng ta sẽ không bị lay chuyển.」"
1077 = "「——Em cũng vậy, anh Soutetsu.」"
1078 = "「——Bây giờ,\\ntôi có thể đến chỗ ông được không.」"
1081 = "「——Thực sự đã được cứu rồi.\\nCảm ơn chị, chị Mayami.」"
1082 = "「——Thực sự cảm ơn ông.」"
1099 = "「……Vâng.」"
1103 = "「……Xin lỗi chị. Em hơi kích động.\\nKhông ngờ lại bị dồn đến mức này.」"
1104 = "「……Có vẻ như, không có trở ngại nào phát sinh nhỉ.」"
1107 = "「……Và nếu bị kéo vào một trận ném bùn——\\nthì bên kia, với sức mạnh tư bản và tổ chức vượt trội, sẽ chiến thắng sao.」"
1108 = "「……Tuy hơi tốn công, nhưng truyền miệng thì sao nhỉ.\\nTôi có cảm giác, những thứ như lý tưởng thì chỉ có thể truyền đạt khi đối mặt trực tiếp thôi.」"
1111 = "「……Cứ thế này, chúng ta sẽ bị đánh bại mà không làm được gì sao?」"
1389 = "「Nói chuyện hơi dài rồi nhỉ. Hôm nay đến đây thôi.\\nReina, em nghỉ ngơi cho khỏe nhé.」"
1393 = "「Dù chỉ một lần, nếu thuê người với mức giá đó thì……\\nngười được thuê sẽ kỳ vọng vào mức giá đó. Dạ. Nên là——」"
1394 = "「Không——」"
1396 = "「Không——nhưng mà——\\nCả với anh Hata, và vài người khác nữa, em đã cúi đầu, nhờ vả…………」"
1398 = "「Không chỉ một mình chị Mayami. Cả ông Minokasa, cả đền chủ Akai\\n——nếu có người để dựa dẫm, đáng lẽ em phải dựa dẫm từ tận đáy lòng.」"
1400 = "「Cạnh tranh trên cùng một sàn đấu là điều không tưởng.\\nNếu đấu bằng tiền với tiền, chúng ta hoàn toàn không có cơ hội chiến thắng.」"
1402 = "「Không được, bởi vì——\\nchúng ta, từ nay về sau vẫn sẽ tiếp tục sống ở Ohimitera mà đúng không?」"
1405 = "「Nhưng mà,\\nnhư thế thì có hơi tội nghiệp cho Reina nhỉ.」"
1406 = "「Nhưng mà, chị là chị gái mà lị.\\nChuyện của Sou-chan, dù có bị cho là bao đồng thì chị cũng sẽ giúp thôi.」"
1407 = "「Không cần phải cảm ơn đâu. Vì Nagi và bọn trẻ,\\nbảo vệ nguồn nước của Ohimitera, cũng là mong muốn của tôi mà.」"
1410 = "「Không, em đã được dạy rồi——\\nĐược chỉ dạy tận tình từ đầu đến cuối rồi.」"
1411 = "「Không, người phải xin lỗi là tôi mới đúng.\\nChuyện anh nhờ tôi, tình hình có vẻ không ổn rồi.」"
1416 = "「Mà toàn là những đơn hàng có khối lượng và chất lượng công việc\\nđòi hỏi phải làm cật lực mới kịp thời hạn không à.」"
1424 = "「Ừ——vì là hàng làm thử, nên có khi chỉ có một phần thôi.\\nNếu vậy thì, chúng ta chia nhau ăn thì sao?」"
1426 = "「Niiroku có nói gì không?」"
1431 = "「Được chỉ dạy từ đầu đến cuối rồi——」"
1435 = "「Gì chứ, hai người đi bộ về sao.」"
1436 = "「Hửm?」"
1437 = "「Trời, lại có thứ tiện lợi như vậy sao.」"
1442 = "「Cả chỗ ông Minokasa cũng——sao?」"
1443 = "「Họ đang đến cản trở việc tập hợp người của chúng ta,\\nmột cách không từ thủ đoạn sao.」"
1446 = "「Bằng cách giao thầu phụ……\\nchỉ định phân chia công việc cho các thợ thủ công sao.」"
1451 = "「Trong lúc cải tạo \\x%lキハ07;#00ffc040;KiHa 07%l;#;, hay khi lái thử sau cải tạo——」"
1455 = "「Mine Treasure thì, từ nay về sau vẫn sẽ,\\ntiếp tục hoạt động mà.」"
1457 = "「Nhưng, nhờ họ đã làm như vậy——\\nnên bây giờ, chúng ta mới được giúp đỡ rất nhiều.」"
1459 = "「Em cũng gặp đền chủ Akai rồi sao?」"
1462 = "「Nhiều đối tác khác nhau, lại cùng giao những công việc có chung thời hạn,\\nvào đúng thời điểm này——sao.」"
1469 = "「Trước tiên phải lọc ra mức tối thiểu những việc cần làm.\\nSau đó, bằng mọi giá phải đảm bảo số công sức cần thiết cho việc đó.」"
1472 = "「Hai tháng sau!?」"
1473 = "「Cả hai đều ngon mà ạ?\\nKhác biệt ở chỗ, một bên đậm đà, còn một bên thì thanh mát thôi ạ.」"
1481 = "「Những người chèo thuyền đã nghỉ việc, sao.」"
1482 = "「Cứ giao cho em nè!!」"
1483 = "「Bao gồm cả chuyện đó, anh đã nói chuyện xong rồi.\\nÔng Minokasa cũng bảo sẽ lập tức hành động.」"
1486 = "「Bây giờ không được thì đưa ra một công việc tốt hơn nữa——\\nNếu thực sự cần đến sức mạnh của anh ấy, thì cứ làm vậy để mượn sức là được.」"
1487 = "「Ra là vậy——à, nhắc đến ngon miệng,\\nthì vụ cơm hộp bento cũng đã tiến triển khá nhiều rồi.」"
1489 = "「Công ty này là nhà thầu chính, và họ đã giao cho các đối tác\\nkhó mà từ chối, để họ làm thầu phụ chứ gì.」"
1496 = "「Chết——tiệt.」"
1499 = "「Nhưng mà,\\nchúng ta không thể trả lương cao như bên kia được đúng không?」"
1500 = "「Nhưng, nhìn vào tình hình hiện tại thì.」"
1501 = "「Nhưng mà, đột nhiên lại có những đơn hàng lớn xuất hiện.\\nĐa số đều là việc gấp, hạn chót là hai tháng sau.」"
1513 = "「Hự!?」"
