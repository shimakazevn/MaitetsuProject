1058 = "“Tuyển gấp việc làm thêm ngắn hạn!!”\\n“Công việc liên quan đến công ty Aero-Craftech, an toàn và an tâm”"
1062 = "“Nếu là anh Hata thì sẽ không từ chối đâu” “Chắc chắn anh ấy sẽ hợp tác”\\n——Em chỉ định dựa dẫm và bấu víu vào niềm hy vọng đó thôi."
