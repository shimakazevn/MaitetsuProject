1533 = "「A——ừm. Đúng vậy.」"
1536 = "「A——đúng rồi.」"
1537 = "「A——Fukami cũng đến sao.」"
1540 = "「A……cũng phải nhỉ.\\nDù chỉ một chút, cũng phải tiến hành chuẩn bị mà.」"
1542 = "「A……nhưng mà,\\ncó vẻ họ cũng có thủ đoạn đàng hoàng đấy. Dạ.」"
1543 = "「À……tờ rơi tuyển dụng trên báo sao——\\nHửm, không lẽ Paulette đã——!?」"
1545 = "「A.」"
1546 = "「A!」"
1547 = "「A! Là chuyện về thiết bị lái của 07 sao.」"
1550 = "「A! Nghe anh nói vậy thì có vẻ giống thật.」"
1553 = "「A, không phải đâu anh Soutetsu. \\x%lダイコン;#00ffc040;Trực khống%l;#; là,\\nDirect Control……tức là phương thức điều khiển trực tiếp.」"
1555 = "「A, nếu là chị Mayami thì không sai vào đâu được.\\nDù vậy.」"
1559 = "「A, à không. Không sao đâu——cảm ơn em.」"
1562 = "「A, vâng! Em nghĩ, ý đó rất hay.\\nCái đó——ờm……」"
1564 = "「A, xin lỗi ông.\\nHôm qua tôi về nhà lúc quá nửa đêm——」"
1566 = "「A, vâng. Chuyện Mine Treasure,\\nchuyến đi thuyền xuôi dòng của bọn em, đóng vai trò khá quan trọng mà.」"
1568 = "「A, Paulette! Là anh Soutetsu đó ạ.」"
1569 = "「A, Reina, không phải là bị giật lag đâu ạ?\\nCái đó.」"
1572 = "「A, chuyện đó thì không sao đâu ạ.\\nVì bọn em, sẽ thay phiên nhau mà.」"
1573 = "「A, cơm hộp bento nhà ga nhỉ.」"
1575 = "「A, anh Soutetsu.」"
1576 = "「A, anh Soutetsu. Xin lỗi vì mới sáng sớm nhé.\\nĐêm qua, tôi cũng đã gọi cho anh mấy lần nhưng.」"
1578 = "「Alo, tôi nghe đây. Tôi là Soutetsu.」"
1580 = "「Ừ——ừm……vậy sao, anh hiểu rồi.」"
1581 = "「Ưm…………」"
1583 = "「Ừm. Chắc là……hay đúng hơn là, tuyệt đối.」"
1585 = "「Ừ. Đúng là vậy.」"
1587 = "「Ừ. Em đã cố gắng lắm rồi.」"
1589 = "「Vâng.\\nÀ, còn phía anh Soutetsu thì——」"
1590 = "「Ừ.」"
1591 = "「Vâng, vì lúc bộ trưởng đến thị sát, với tư cách là thị trưởng, em không thể vắng mặt được.\\nEm đã nhờ ông ấy lái \\x%lキハ07;#00ffc040;KiHa 07%l;#; vào lúc đó, và đã được OK rồi ạ.」"
1595 = "「À, đúng vậy nhỉ.」"
1597 = "「Ừ, ý tưởng thực đơn đã khá vững chắc rồi.\\nNghe nói một tuần sau, họ sẽ mang hàng dùng thử đến cho chúng ta.」"
1599 = "「Chà, một phần cũng là do vậy nhỉ.」"
1600 = "「Ây da.」"
1603 = "「Vì cũng gần mà, với lại đêm nay trời rất dễ chịu.」"
1604 = "「Vì đó là một công ty mà em hoàn toàn chưa từng nghe tên……」"
1609 = "「Nếu thù lao xứng đáng, và là công việc phải dùng hết khả năng mới hoàn thành được,\\nthì đó chẳng phải là công việc đáng mừng nhất đối với thợ thủ công sao.」"
1610 = "「Việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; sẽ dẫn đến sự diệt vong của Ohimitera——\\nChẳng phải mọi người đã hiểu ra rồi sao.」"
1615 = "「Tốt quá rồi. Cảm ơn anh.」"
1618 = "「Vâng ạ, chúc ngủ ngon, Paulette, anh Soutetsu.」"
1619 = "「Nếu không có ngày mai, anh rất muốn ở lại.\\nNhưng——bây giờ thì.」"
1622 = "「Nếu nhận được lương gấp đôi thì tốt quá rồi nè.」"
1630 = "「Houshou……Mototada——」"
1631 = "「Houshou Mototada……đã chuẩn bị đến mức đó, và ra tay.\\nĐó là——năng lực mà em hiện tại không thể sánh bằng.」"
1639 = "「Chỉ vì đợt tuyển dụng này sao?」"
1640 = "「Em xin lỗi. Cái gì mà thua trước cám dỗ của đồng tiền chứ——\\nĐó chỉ là những lời lẽ cay nghiệt do sự oán hận vô lý của một kẻ non nớt như em thôi.」"
1641 = "「Em xin lỗi. Là em hoàn toàn sai.\\nBị từ chối liên tục qua những lời mời truyền miệng, chắc chắn em đã trở nên cố chấp rồi.」"
1642 = "「Xin lỗi anh, vì đã giữ anh lại vì chuyện không đâu.」"
1643 = "「Thế này. Về việc tuyển dụng những người từng làm việc ở mỏ than trong quá khứ, và\\n……diễn viên? của công viên giải trí thì——」"
1644 = "「A, thứ đó đã là xăng rồi nhỉ.」"
1645 = "「Bên kia là công ty được lập ra tạm thời.\\nĐạt được mục đích rồi giải tán là xong. Nhưng——」"
1646 = "「Vâng, em đâu có việc gì với anh Hata nào khác đâu.」"
1647 = "「Không hề hấn gì đâu ạ! Chỉ loáng một cái,\\nviệc khôi phục dữ liệu của Reina đã xong xuôi rồi ạ!」"
1648 = "「Nagi cũng sẽ bận rộn hơn với công việc bên đường sắt.\\nNên em đã nghĩ——liệu có thể kêu gọi vài người quay lại làm không.」"
1655 = "「Fukami sẽ đi hỏi những người từng là người chèo thuyền đúng không nè?\\nVậy, em sẽ thử đi nhờ các thợ thủ công xem sao nè!」"
1657 = "「Fukami, cái này——\\nchẳng phải cũng sẽ ảnh hưởng đến chuyện của những người chèo thuyền sao?」"
1659 = "「Sou-chan, em định nhờ chỗ xưởng nồi hơi,\\nlàm chuyện gì vậy?」"
1660 = "「Sou-chan, em chưa được dạy sao?」"
1661 = "「Sou-chan, em thực sự bị dồn vào đường cùng rồi sao?」"
1662 = "「Nếu muốn bày tỏ lòng biết ơn thì Sou-chan à.\\nThể hiện bằng hành động vẫn tốt hơn lời nói nhỉ.」"
1664 = "「Là Master Controller. Điều khiển bằng điện……\\nlà một thiết bị lái giống như hộp số tự động của xe bốn bánh vậy.」"
1666 = "「Đúng vậy. Ở Ohimitera mà lương theo giờ vượt quá 800 yên thì……\\nDù là làm đêm, cũng chỉ tầm 1000 yên hoặc không tới thôi.」"
1667 = "「Nói cách khác là——sẽ tạo thành tiền lệ sao.」"
1669 = "「Dù là ngủ, thì em cũng đã cố gắng mà.」"
1672 = "「Dù có hiểu thì cũng bị cuốn theo thôi.\\nSẽ bất giác nghĩ rằng 『Chỉ mình mình chắc không sao đâu』.」"
1674 = "「Dù vậy——vẫn phải cảm ơn chị.」"
1676 = "「Dù có tập hợp được những người muốn làm diễn viên,\\nthì vẫn chưa có ai có thể hướng dẫn họ cả.」"
1677 = "「Hãy tận dụng tối đa những gì Reina đã được gửi gắm.\\nĐó chắc chắn là điều tốt nhất cho Reina, cho chúng ta, và cả cho Ohimitera nữa.」"
1686 = "「Có qua có lại thôi. Anh cũng,\\ngiao phó rất nhiều việc cho Paulette mà.」"
1689 = "「Sao có thể là bao đồng được chứ——」"
1694 = "「Cái vỏ bọc đó——\\nchắc là các nhà thầu ở Ohimitera cũng bị lợi dụng rồi nhỉ.」"
1696 = "「Tôi e rằng, đây là công ty được lập ra\\nchỉ để phục vụ cho đợt tuyển dụng này thôi.」"
1700 = "「Hay nói đúng hơn là——cảm ơn anh.\\nEm, cứ giao phó hết mọi việc cho anh.」"
1702 = "「Em——đáng lẽ phải nhờ chị Mayami giúp đỡ đầu tiên.」"
1708 = "「Chúng ta không có vỏ bọc nào tiện lợi như thế.\\nDù có, nếu đánh mất lòng tin, thì tương lai cũng không còn.」"
1709 = "「Chúng ta quyết định sẽ thử làm một hộp bento với từ khóa chính là Kijiuma.\\nNhân vật chính Kijiuma, nghe nói sẽ được làm từ cá hương kho ngọt.」"
1710 = "「Bên chúng ta là thiểu số. Điều đó ngay từ đầu đã không thay đổi.\\nNếu cứ đâm đầu vào cùng một sàn đấu, thì không thể thắng được.」"
1711 = "「Điều kiện chiến thắng của chúng ta, ngay từ đầu không hề thay đổi.\\nBên bị dồn ép và đang vùng vẫy, ngược lại là bên kia mới đúng.」"
1712 = "「Chúng ta vào trong nhé?\\nĐứng nói chuyện giờ này cũng hơi kỳ.」"
1714 = "「Tôi nghe nói mọi người đều đã đồng ý tham gia rồi mà.」"
1715 = "「Em đã nhờ chị Mayami rồi ạ. Về phần diễn viên,\\nchúng ta sẽ tuyển dụng qua poster dán ở ga và tờ rơi treo trên tàu.」"
1718 = "「Anh rất vui vì em đã giữ anh lại.\\nNhờ vậy, ngày mai anh lại có thể cố gắng rồi.」"
1719 = "「Em báo cáo hơi trễ, nhưng việc cải tạo Niiroku,\\nlúc kết thúc cải tạo đã thành công mà không có vấn đề gì.」"
1721 = "「Vì vậy……tôi nghĩ thế,\\nviệc thay thế đó, đã được thực hiện với tiền đề là sẽ khôi phục lại.」"
1724 = "「Việc có thể khôi phục dữ liệu, đối với Reina,\\ntrong nhiều ý nghĩa là một điều tốt, bây giờ tôi thực sự nghĩ như vậy.」"
1726 = "「Chị biết mà. Xin lỗi em nhé.\\nChị chưa từng để em thức khuya thế này bao giờ nhỉ.」"
1727 = "「Em gọi điện cho Xưởng rượu Migita Ichi,\\nhọ bảo anh Soutetsu đang đến đây nên.」"
1729 = "「Em phải làm sao đây, chị Mayami. Chưa nói đến những người khác,\\nngay cả anh Hata, cũng đã gục ngã trước sức mạnh của đồng tiền.」"
1732 = "「Mấy việc thế này á, là vì bản thân chị thôi.\\nVì Xưởng rượu Migita Ichi cũng sẽ đầu tư mà.」"
1734 = "「Vì vậy, giống như ông Minokasa, những người chọn tương lai hơn là tiền bạc\\n——chúng ta phải nghĩ ra cách để tập hợp những người như thế.」"
1736 = "「Không phải là chuyện không đâu đâu.」"
1739 = "「Cằn nhằn……với, than vãn sao.」"
1741 = "「Nhờ mọi người nhé.」"
1742 = "「Củ cải (Daikon)?」"
1745 = "「Nghe nói việc khôi phục và cải tạo \\x%lキハ07;#00ffc040;KiHa 07%l;#;, có vẻ sẽ khá dễ dàng đấy ạ.」"
1749 = "「Nếu vậy thì, phải cố gắng làm thế thôi nhỉ.」"
1753 = "「Hibiki đang vẽ vời, những người khác thì ở trong xưởng rượu hết rồi.\\nKhông sao đâu. Dù là cằn nhằn hay than vãn, ngoài chị ra không ai nghe thấy đâu.」"
1758 = "「Dù biết rõ sẽ gây quá tải cho bộ phận chuyển động và hệ điều hành,\\nnhưng vẫn cần phải tiến hành diesel hóa.」"
1761 = "「Đúng vậy ạ.\\nPaulette đã mua xăng chỉ số octan cao để chúc mừng đó ạ.」"
1762 = "「À——」"
1764 = "「Đúng vậy nhỉ.\\nBao gồm cả tất cả những điều đó, chúng ta đã được gửi gắm Reina.」"
1766 = "「Đúng vậy nhỉ. Những việc có thể làm ngay lúc này, chỉ quanh quẩn bấy nhiêu thôi.」"
1768 = "「Đúng vậy nhỉ.\\nNhững công việc gấp rút giao cho các thợ thủ công mà tôi vừa nghe——」"
1769 = "「Đúng vậy ạ.」"
1770 = "「Vậy sao?」"
1772 = "「Có hơi hấp tấp quá rồi chăng.\\nCó khi đi bộ đến lại hay hơn.」"
1774 = "「Sự ngây thơ của em……đã làm hoàn cảnh thêm khó khăn sao.」"
1777 = "「Đúng vậy ạ. Nhưng, các cơ chế các loại để có thể khôi phục,\\nkhi hoạt động dưới dạng \\x%lディーゼル気動車;#00ffc040;toa xe diesel tự hành%l;#;, lại trở thành gánh nặng nhỉ.」"
1781 = "「Đúng vậy ạ. Nên có vẻ lúc đầu cô bé hơi lúng túng.\\nNhưng mà, đền chủ Akai nghe nói cũng có kinh nghiệm thao tác \\x%lダイコン;#00ffc040;trực khống%l;#; nên.」"
1784 = "「Vâng. Nếu có xảy ra lỗi thì chắc là vào những lúc như vậy,\\nông Tororyu-yu cũng đã nói thế ạ.」"
1786 = "「Vâng. Các kỹ sư của đường sắt khai thác mỏ, dường như ngay từ đầu,\\nđã biết việc \\x%lかんそう;#00ffc040;thay thế%l;#; sang diesel là bất khả thi.」"
1787 = "「Vâng!」"
1788 = "「Vâng, vì ông ấy đến đón Niiroku mà.\\nLúc đó ạ.」"
1791 = "「Là vậy sao——\\nÀ, không, chắc là vậy rồi, đương nhiên mà.」"
1793 = "「Lương theo giờ……1600 yên, cơ á.」"
1794 = "「Chúc em ngủ ngon, Reina.」"
1796 = "「Của các kỹ sư mỏ than——\\nnhững người từng làm việc ở mỏ than Jutsusen.」"
1797 = "「Nếu xảy ra lỗi quá nghiêm trọng thì——mới vậy nhỉ. Nhưng mà,\\nông Tororyu-yu bảo là 『Có vẻ không vấn đề gì』.」"
1801 = "「Vì cứ ham muốn những thứ không có nên……\\nem mới cảm thấy mình bị dồn ép hơn cả thực tế sao.」"
1802 = "「Quyết tâm——\\nKhông, nếu là quyết tâm thì.」"
1803 = "「Dạ.」"
1804 = "「Cũng không có gì đặc biệt……chỉ là, có lẽ vì KiHa 07 là \\x%lダイコン;#00ffc040;trực khống%l;#; chăng?\\nCô bé có nói là “Rắc rối hơn tôi tưởng”.」"
1806 = "「Đúng vậy. Trước tiên, phải nắm bắt chính xác hiện trạng của bản thân đã.\\nNếu không làm vậy mà cứ đối phó với bên kia, thì sẽ thành một trận ném bùn đấy.」"
1812 = "「Paulette, đã bắt đầu hành động rồi.\\nCô ấy đang chuẩn bị đăng tuyển dụng qua poster dán ở ga và tờ rơi treo trên tàu.」"
1819 = "「Để làm được như vậy. Chị Mayami.\\nEm muốn chị cho em, cho chúng em——mượn sức mạnh của chị.」"
1820 = "「Để có thể nhanh chóng khôi phục lại thành \\x%l気動車;#00ffc040;toa xe tự hành%l;#; chạy bằng xăng ban đầu sao?」"
1828 = "「Reina. Việc cải tạo thế nào rồi?」"
1830 = "「Reina đi pha trà đây ạ.」"
1831 = "「Để Reina mở khóa cho nha.」"
1833 = "「Reina, chỉ ngủ thôi mà ạ?」"
1837 = "「Lý tưởng, không thể chống lại tiền bạc sao——\\nĐã một tuần trôi qua mà——mới chỉ có sáu người đến ứng tuyển.」"
1840 = "「Con người lại đi hướng dẫn thao tác lái cho \\x%lレイルロオド;#00ffc040;Railord%l;#; sao?」"
1846 = "「Ông Tororyu-yu cũng nói là có ạ.\\nVề mặt hệ điều hành, những xử lý độc lập dư thừa cũng rất nổi bật.」"
1849 = "「Nghe nói là vẫn chưa biết được đâu ạ. Tỷ lệ phát sinh lỗi,\\ncó vẻ tỷ lệ thuận với lượng thông tin được xử lý trong \\x%lいっとき;#00ffc040;một lúc%l;#;.」"
1850 = "「Bao gồm cả việc xác nhận xem đã giải quyết được tình trạng ngủ gật chưa,\\ntôi cũng muốn chạy thử nghiệm càng sớm càng tốt.」"
1852 = "「Thật sự, mong chờ quá đi.\\nA——nhưng mà, không biết có phần của em không nữa.」"
1855 = "「Mong chờ quá nhỉ, hộp bento ấy.」"
1867 = "「Anh Hata là——chỗ xưởng nồi hơi á?」"
1869 = "「Đợi xong lúc bận rộn này,\\nReina sẽ lái thỏa thích luôn!」"
1870 = "「Tóm lại, cứ hành động đã.\\nChuyện dừng lại, đợi đến khi không thể nhúc nhích được nữa cũng chưa muộn.」"
1872 = "「Hơn nữa——chết tiệt,\\nchỉ thuê trong khoảng thời gian cho đến khi bộ trưởng đến thị sát thôi sao.」"
1875 = "「Và gánh nặng đó, cũng là một trong những nguyên nhân,\\ngây ra sự bất ổn của Reina, hay của \\x%lキハ07;#00ffc040;KiHa 07%l;#; sao?」"
1878 = "「Trà đây ạ. Xin mời.」"
1883 = "「Điện thoại từ ông Minokasa. Có vẻ gấp lắm,\\nnên em mang điện thoại con qua luôn.」"
1888 = "「Hành động——thể hiện bằng hành động như thế nào đây.」"
1891 = "「Có nên làm poster hay tờ rơi theo kiểu đó không nè?\\nNgoài ra, còn cách nào khác không nè.」"
1894 = "「Làm thế nào, để vượt qua với điểm số vừa đủ đậu nè?」"
1895 = "「Nếu nói về năng lực, Sou-chan\\ntuyệt đối không thua kém gì ông ngân hàng đó đâu.」"
1899 = "「Bên đặt hàng là ai vậy?」"
1902 = "「Đúng vậy. Nhỉ……ừm.\\nVì ngay từ đầu, đâu có chắc chắn là sẽ bị từ chối đâu.」"
1903 = "「Minh chứng?\\n……!!」"
1908 = "「Đền chủ Akai……ông ấy trông rất vui.\\nÔng ấy bảo nếu có việc gì có thể làm thì ông ấy sẽ giúp bất cứ việc gì.」"
1923 = "「Họ là những người không thể thay thế mà.\\nChị nghĩ là mình hơi bao đồng, nhưng mà.」"
1924 = "「Cái đó, không phải là vấn đề năng lực đâu?\\nĐơn thuần, chỉ là vấn đề quyết tâm thôi.」"
1925 = "「Đây là minh chứng, cho thấy lý tưởng của Sou-chan,\\nkhông phải lúc nào cũng thua tiền bạc.」"
1926 = "「Cái, này là?」"
1927 = "「Vậy sao. Cái nào ngon hơn?」"
1928 = "「Vậy sao.」"
1929 = "「Có giấy đồng ý và danh sách nè. Điều kiện chi tiết thì,\\nchỉ có nhóm Sou-chan mới quyết định được, nên chị chưa điền.」"
1930 = "「Công việc làm thêm như vậy, chưa thấy bao giờ nè!」"
1936 = "「Ông ngân hàng đó, không thèm để ý đến sĩ diện hay thủ đoạn nữa rồi.\\nNhưng, Sou-chan vẫn còn để tâm đến sĩ diện nhỉ.」"
1938 = "「Cái đó……chỗ em——Xuôi dòng sông Kuma,\\nđã từng gặp rất nhiều khó khăn vì chuyện đó, nên em hiểu. Nhưng mà.」"
1939 = "「Cái đó……anh Soutetsu. Nếu được thì——\\nCứ thế này, anh ở lại qua đêm nhé?」"
1940 = "「Cái đó, anh Soutetsu.\\nCái này——anh đã xem chưa?」"
1942 = "「Vậy thì sao nè?\\nTại sao anh hai lại làm vẻ mặt khó khăn thế kia?」"
1943 = "「Thế thì tốt quá.\\nLúc đó, cho anh đi cùng với nhé.」"
1947 = "「Thế thì nhàn quá rồi. So với thứ đó, \\x%l8620;#00ffc040;8620%l;#; hay \\x%lキハ07;#00ffc040;KiHa 07%l;#;,\\nchắc hẳn sẽ có cảm giác như thao tác thủ công kiểu cũ vậy.」"
1950 = "「Được vậy thì tốt quá.\\nChuyện này có vẻ không thể nói xong qua điện thoại được đâu.」"
1953 = "「Vậy thì về mảng đó,\\ntôi sẽ thử thuyết phục vài người ở lại xem sao.」"
1955 = "「Vậy, tôi sẽ đến ngay.」"
1957 = "「Chuyện đó đương nhiên là,\\nlàm cho Mine Treasure thành công rực rỡ rồi.」"
1958 = "「Tất nhiên là, của \\x%l8620;#00ffc040;8620%l;#;——」"
1959 = "「Vậy thì——」"
1960 = "「Vậy, bên mình cũng lập một công ty tạm thời thì sao nè?」"
1961 = "「Nghe nói đều là những đối tác đã làm ăn lâu năm,\\nhọ bảo là 『Dù thế nào đi nữa』 nên mới nhờ vả.」"
1968 = "「Anh hai! Điện thoại! Điện thoại của anh hai.」"
1969 = "「Dù tôi có giữ chìa khóa dự phòng——」"
1970 = "「Nếu vậy——nói thế này thì hơi kỳ nhưng.」"
1972 = "「Cảm ơn ông.\\nNếu không phiền, xin trăm sự nhờ ông.」"
1974 = "「Trước tiên, hãy ngừng ham muốn những thứ mình không có,\\nvà cố gắng tận dụng hết những thứ mình đang có thì tốt hơn nhỉ.」"
1976 = "「!」"
1977 = "「!!」"
1978 = "「!?」"
1981 = "「Kuha 26 là toa xe được trang bị \\x%lマスコン;#00ffc040;bộ điều khiển trung tâm%l;#;. Nên là.」"
2121 = "Một trong những sợi dây sinh mệnh tuyệt đối không được buông tay,\\nchúng tôi lại để mặc nó không chút phòng bị."
2122 = "Việc được cử động cơ thể của mình, đã trở nên vô cùng vui vẻ——\\nCảm giác đó như đang tuôn trào qua từng cử chỉ."
2124 = "Đừng than thở rằng chỉ có 6 người ứng tuyển,\\nmà hãy biết ơn vì trong hoàn cảnh này, vẫn có 6 người đến ứng tuyển."
2126 = "Không đúng.\\nNgười đầu tiên tôi nên cúi đầu nhờ vả là."
2128 = "Không biết là thành quả của việc cải tạo, hay là ảnh hưởng từ việc được giải phóng khỏi nỗi bất an,\\nReina hành động nhanh nhẹn hơn hẳn thường ngày."
2130 = "Dù sao thì cũng phải được một người. Đầu tiên là một người. Cứ thế tiếp tục mời gọi,\\ncó lẽ chúng ta sẽ tìm ra cách xoay chuyển tình thế."
2132 = "Không được.\\nNếu tôi im lặng, sẽ chỉ làm tăng thêm sự bất an thôi."
2134 = "Không. Không phải——\\nNgười đăng quảng cáo tuyển dụng, không phải Paulette."
2137 = "Trên cơ sở đó, hãy tận dụng tối đa\\nnăng lực và ý chí của 6 người họ——a, không, ra là vậy."
2139 = "Hành chính, quan hệ công chúng, khảo sát đo đạc thực tế——\\nCác ngành nghề được tuyển dụng rất đa dạng, và số lượng cũng khá lớn."
2143 = "Tiếp nhận toàn bộ dữ liệu sao lưu của Reina,\\nhơn nữa, nếu hoàn toàn không gây ra sự bất tương thích nào thì——"
2145 = "Nghĩ lại thì, đó là chuyện đương nhiên."
2148 = "Ông ta giăng ra vô số những cái bẫy khiến chúng ta muốn đối phó,\\ngần như là giăng ra một cách mù quáng."
2151 = "Nhưng——Ohimitera đang chìm trong thời kỳ suy thoái kéo dài."
2154 = "Nhưng, cả trong ánh mắt, giọng nói và thái độ của chị Mayami,\\ntôi không hề cảm thấy một chút ý trêu chọc nào."
2156 = "Nhưng, tôi lại không thể trả lời ngay lập tức với chị Mayami.\\nChính điều đó, có lẽ là minh chứng cho sự thiếu quyết tâm của tôi."
2157 = "Nhưng, có lẽ do phản ứng ngược của việc cố ý làm vậy, ngay khi vừa cúp máy,\\ntất cả những lời oán hận kết lại thành một khối, trào dâng từ sâu thẳm trong ngực."
2159 = "Đã đến.\\nNhưng đã từ chối."
2162 = "Chỉ cần như vậy, sự mệt mỏi tích tụ trong cơ thể,\\nnhư được sưởi ấm và xoa dịu."
2178 = "Sáu người thì làm sao mà đủ được.\\nHơn nữa, nghe nói cả sáu người đó đều vừa mới ra trường."
2180 = "Một lời mời ngọt ngào, tôi cũng đã mong đợi được một nửa.\\nNên những lời nói, cứ thế tuôn ra một cách thành thật."
2184 = "Sự thẳng thắn mộc mạc của Nagi, đã chặn đứng lối thoát của tôi."
2190 = "Việc không có nhiều người sử dụng thủ đoạn tàn nhẫn đến mức này,\\nthậm chí có thể coi là may mắn."
2194 = "Vừa mới ngủ dậy nên đầu óc chưa tỉnh táo lắm,\\nnhưng dù sao, tôi cũng áp ống nghe trên tay vào tai."
2198 = "Những ký ức, có thể đi kèm với chúng.\\nSẽ không có chuyện chúng được lôi ra khi ở trong Rail Shop nhưng……"
2202 = "Những người như ông Minokasa, từ chối một mối làm ăn béo bở đến vậy,\\nđể tham gia Mine Treasure……liệu có được bao nhiêu người."
2217 = "Chỉ có người nhà, người em trai nuôi như tôi mới có thể nhờ vả——\\nĐáng lẽ tôi phải dựa dẫm vào chị Mayami ở mức độ đó."
2219 = "Chỉ cần lấp đầy nó——\\nDù đối phương có giành được bao nhiêu người, chúng ta vẫn có thể chiến thắng mà không bị ảnh hưởng."
2221 = "Vậy mà, lại không thể tung ra một nước đi nào thực sự hiệu quả.\\nTrước sức mạnh của đồng tiền——, chúng tôi đang bị chà đạp một cách đơn phương."
2238 = "Ngay khi vừa ngậm một ngụm, tôi đã cảm nhận được.\\nHồng trà hôm nay, đậm đà hơn hẳn mọi khi."
2240 = "Và rồi miệng mở ra, rồi lại ngậm lại——\\ne hèm, hắng giọng một cái."
2242 = "Oán hận người đã chọn công việc tốt hơn, rồi để bụng chuyện đó\\n……thật sự là quá ngu ngốc."
2245 = "Trao nhau nụ hôn không biết bao nhiêu lần nữa——\\nChúng tôi dịu dàng, buông nhau ra."
2250 = "Dù có xảy ra lỗi——thì đó cũng là thứ có thể vượt qua được,\\nchắc hẳn cô ấy cũng đang tin tưởng vững chắc như tôi."
2252 = "Lại hắng giọng một cái, như thể vừa nhớ ra điều gì."
2253 = "Chạy chậm đến cửa,\\nlạch cạch, vui vẻ xoay chìa khóa và mở cửa ra."
2256 = "Lê bước chân nặng trĩu,\\nnhìn bộ dạng đó, tôi cũng dần cảm thấy buồn ngủ lây."
2258 = "Khuôn mặt nhẹ nhõm.\\nCơ thể đang buông thõng, ngồi thẳng dậy."
2259 = "Bằng những con số thực tế,\\ncô bé đã chứng minh trực giác “cao” của tôi là đúng."
2263 = "Khuôn mặt pha lẫn sự bối rối và ngượng ngùng.\\nEm ấy tỏ vẻ nhột nhạt khi bàn tay tôi xoa đầu."
2264 = "Giọng nói có vẻ tiếc nuối đó,\\nkhông hề pha lẫn cảm giác chán nản, khiến tôi thở phào."
2267 = "Những thứ được khôi phục là,\\nthông tin liên quan đến thao tác lái và quản lý bảo trì của \\x%lキハ07;#00ffc040;KiHa 07%l;#; cùng với——"
2270 = "Khuôn mặt bối rối, cái gật đầu mơ hồ."
2272 = "Nếu chuyển sang phòng ngự, sẽ dần suy kiệt và bị nghiền nát.\\nNếu vậy——chúng ta chỉ còn cách chạy thoát bằng trận chiến của riêng mình."
2273 = "Nếu muốn chiến thắng bằng mọi giá, người nên nhờ cậy,\\nkhông thể là ai khác ngoài người đó."
2275 = "Nếu nói theo kiểu Hachiroku thì là thao tác chi tiết tay quay \\x%l逆転機;#00ffc040;cần đảo chiều%l;#;,\\nnếu được điều khiển tự động phù hợp với lượng hơi nước thì……"
2279 = "Nếu ký ức của \\x%lレイルロオド;#00ffc040;Railord%l;#; không chỉ đơn thuần là dữ liệu,\\nthì ý chí và nguyện vọng của Reina, chắc chắn đã tác động đến kết quả."
2284 = "Một điểm mù lớn đến thế này——\\nTôi, chúng tôi, đã bỏ sót sao."
2288 = "Tiến lên——tiến lên——dù sao thì ngoài việc bước ra ngoài,\\nngay từ đầu đã chẳng có cách nào để đánh trả cả."
2298 = "Ra là vậy, tôi nghĩ thầm.\\nMùa hè, cũng sắp kết thúc rồi."
2299 = "Hoàn toàn không có vẻ gì là che giấu,\\nthể hiện một “ý chí” trắng trợn."
2300 = "Điều kiện được đưa ra có mức độ phá giá đến mức nào,\\ncũng có thể tưởng tượng được từ việc tuyển dụng làm thêm."
2305 = "Cho dù Houshou Mototada có giật dây phía sau, nếu không có chứng cứ,\\nông ta có thể dễ dàng trốn tránh bằng một câu 『Đó là việc do công ty \\x%lエアクラ;#00ffc040;Aircra%l;#; làm』."
2314 = "Nhờ được mọi người giúp sức,\\ntôi cảm thấy như đã nhìn thấy một chút tia hy vọng."
2333 = "Chuyện của những người chèo thuyền? Khi tôi còn đang thắc mắc,\\nFukami đã lập tức trả lời."
2335 = "Tôi sẽ không lặp lại sai lầm tương tự."
2336 = "Tôi bất giác nhìn xuống chân Reina."
2338 = "Bất giác nhìn ông Minokasa,\\nchỉ nhận lại được một cái gật đầu đầy cay đắng."
2344 = "Dùng cả hai tay, ba người tạo thành một vòng tròn, ngoéo tay thề ước."
2345 = "Những gì chúng ta đang làm, cũng giống như vận tải đường sắt,\\nhoặc có lẽ, nó giống như tất cả các hoạt động của con người."
2346 = "Cái ôm.\\nVà nụ hôn."
2347 = "Đang bị dồn ép.\\nĐã đến vùng nước nguy hiểm mất rồi."
2348 = "Tôi hoàn toàn, không nhận ra sự hiện diện đó.\\nĐã bị nghe thấy từ lúc nào, một sự bất an mãnh liệt——"
2350 = "Ngay khoảnh khắc nhìn thấy, lòng biết ơn và niềm vui sướng trào dâng,\\nđồng thời, một nỗi sợ hãi như thể mất đi chỗ đứng dưới chân ập đến."
2354 = "Chuyện tôi đã nhờ ông Minokasa."
2356 = "Nhận được điện thoại từ Paulette, tôi đã vội vã lao ra khỏi nhà nhưng……"
2358 = "So với thiết bị lái của Hachiroku,\\ntôi chỉ nghĩ rằng thứ đó đã gọn gàng và đơn giản hơn rất nhiều."
2359 = "Em nghĩ là em đã chuẩn bị tâm lý rồi.\\nEm cũng nghĩ là mình đã cố gắng hết sức."
2360 = "Cúp điện thoại với Paulette.\\nCho đến lúc cúp máy, tôi chắc chắn đã giữ được giọng điệu bình tĩnh."
2362 = "Điều mà tôi cảm thấy không nên nói ra trước khi cải tạo,\\nPaulette đã nhờ vả một cách hoàn hảo."
2363 = "Nghĩ rằng hỏi qua điện thoại thì không tiện,\\nnên tôi đã cố tình không nhắc đến chủ đề này——"
2367 = "Thấy im lặng khác thường,\\nthì ra Reina đang chiến đấu với cơn buồn ngủ sao."
2368 = "Tôi đã hiểu ra, nhưng cũng cảm thấy thắc mắc."
2370 = "Đứng im lặng, tiếng côn trùng râm ran nhẹ nhàng ùa đến."
2371 = "Về câu trả lời của tôi,\\ncó lẽ Paulette cũng đã dự đoán được một nửa."
2376 = "Nên anh Hata đã chọn công việc đó.\\nĐó là một phán đoán đương nhiên."
2394 = "Nếu không phải là ngẫu nhiên,\\nthì đó là tất yếu do ý đồ của một kẻ nào đó gây ra."
2395 = "Nếu chị Mayami là giám khảo,\\nthì chẳng cần phải sợ trả lời sai."
2402 = "Thời gian đã qua nửa đêm."
2403 = "\\x%lレイルロオド;#00ffc040;Railord%l;#; số hiệu đầu tiên của dòng máy tân tiến nhất,\\nquả nhiên được chế tạo với một sự dư dả tương xứng như vậy."
2412 = "Mục đích là gì, ai nhìn vào cũng thấy rõ."
2414 = "Chính vì thế, chắc chắn em ấy mới có thể giữ lại được ký ức."
2417 = "Đó là một lịch trình nuốt trọn toàn bộ khoảng thời gian cho đến lúc bộ trưởng đến thị sát."
2430 = "Cảm nhận được rằng, đây chính là chị Mayami,\\ntôi cảm thấy sự căng thẳng, lại càng được trút bỏ."
2431 = "Đúng vậy. Bên kia chỉ cần dùng người ngoài là xong chuyện."
2444 = "Paulette đã từng nhờ chị Mayami.\\nChuyện đó, hoàn toàn không liên quan gì cả."
2445 = "Tay Paulette làm điệu bộ như đang cầm đũa,\\nlóng ngóng, bối rối không biết để đâu."
2446 = "Phương tiện di chuyển của nhóm Paulette\\ntừ Tororyu-yu về chắc là \\x%lエアクラ;#00ffc040;Aircra%l;#; đường bộ."
2448 = "Giọng nói điềm tĩnh của Paulette,\\nnhư đang chứng minh rằng suy đoán của tôi có lẽ là chính xác."
2449 = "Giọng nói của Paulette thật rạng rỡ."
2450 = "Giọng nói của Paulette không hề u ám."
2451 = "Fufu, một tiếng cười vui vẻ bật ra."
2452 = "Thở phào nhẹ nhõm,\\ncơ thể Paulette hơi thả lỏng, tựa vào lưng ghế."
2457 = "Quả không hổ danh Fukami,\\nngười điều hành thực tế của công ty cổ phần Xuôi dòng sông Kuma."
2459 = "Dè dặt, dù bản thân không làm gì sai,\\nnhưng Fukami lại cất giọng nghe vô cùng áy náy."
2460 = "Khuôn mặt Fukami tối sầm lại."
2462 = "Nơi ngón tay thon thả của Fukami chỉ vào, tên doanh nghiệp tuyển dụng là,\\nCông ty cổ phần Ohimitera Work Service."
2465 = "Vừa nói, Fukami vừa lấy ra một mảnh giấy nhỏ từ túi xách,\\ncẩn thận mở các nếp gấp ra."
2467 = "Điều đó sẽ dẫn đến việc tăng lượng khách,\\nvà lượng khách tăng, đương nhiên sẽ dẫn đến tăng doanh thu."
2470 = "Dù bên kia có đứng ra nghênh chiến,\\nhay xoay chuyển, chủ động tấn công, thì cái gốc đó vẫn không đổi."
2471 = "Dù đó là gánh nặng như thế nào đi nữa,\\nnhận lấy thứ được trao, tiến về phía trước và kết nối với điều tiếp theo."
2473 = "Xong xuôi, có vẻ đã thỏa mãn, Reina lại lạch bạch,\\ntrở về trên đùi Paulette."
2474 = "Bật, đèn được bật sáng.\\nChỉ với nhiêu đó thôi, cũng khiến tôi cảm thấy an tâm."
2477 = "Hoàn toàn bị bất ngờ, cơ thể tôi giật nảy mình.\\nNgay lập tức, Reina còn cuống cuồng hơn cả tôi."
2478 = "Cười tươi rạng rỡ, nụ cười của Reina không chút gượng gạo."
2481 = "Vui vẻ ngồi lên đùi Paulette,\\nReina từ chiếc bình dẹt của mình——"
2486 = "Dù sao thì đối phương cũng là chị Mayami.\\nDù chỉ nghe được một, chị ấy cũng có thể hiểu được mười."
2487 = "Tất nhiên, sự vùng vẫy đó rất mãnh liệt."
2488 = "Tất nhiên. Cũng cần có cả diễn viên cho Mine Treasure,\\nvà về phần diễn viên, chắc chắn sẽ phải đào tạo từ con số không."
2489 = "Khi bóng dáng Reina hoàn toàn biến mất vào bên trong,\\nmột sự im lặng tế nhị……khó tả bao trùm lấy chúng tôi."
2496 = "Khi tôi cúi đầu thật sâu,\\nchị ấy khẽ khịt mũi cười."
2509 = "Những lời an ủi, chị Mayami không đời nào nói với tôi.\\nNhưng——"
2510 = "Giọng điệu của chị Mayami, như đang kiểm tra tôi."
2512 = "Trong tay chị Mayami, có giấy.\\nNhững tờ giấy mỏng, chỉ vỏn vẹn vài tờ."
2515 = "Nghe như đang khẳng định, cũng như đang hỏi han,\\nmột giọng nói dịu dàng."
2517 = "Vô cùng dứt khoát,\\nchị Mayami định tội cho lỗi lầm của tôi."
2518 = "Chị ấy đã cho tôi điểm đậu.\\nChị ấy đã vỗ nhẹ vào lưng tôi."
2521 = "Xung quanh khu mỏ, khu ký túc xá bỏ hoang, tuyến đường xe goòng, nhà máy điện——\\nCó vô số thứ cần được bảo trì, và nhân lực thì có bao nhiêu cũng không đủ."
2526 = "Khả năng chuyên môn của anh Hata,\\nvào thời điểm hiện tại, không phải là thứ tôi khao khát."
2529 = "Anh Hata, chỉ có tác dụng tạo thêm chút thời gian rảnh rỗi cho tôi,\\nhoặc đóng vai trò như một phương án dự phòng an toàn hơn mà thôi."
2533 = "Bị nhắc đến đột ngột, Reina lộ vẻ mặt ngạc nhiên."
2536 = "Cố vươn mình, cứ để lúc nào rảnh rỗi rồi làm.\\nBây giờ, tôi nên thừa nhận sự ngu muội và bất lực của bản thân."
2545 = "Hơn nữa, đêm mùa hè cũng thật dễ chịu.\\nThử đứng chờ trong gió cũng không tệ."
2547 = "Tôi, đã làm bộ làm tịch.\\nDù tự nhận thức được rằng mình đang bị dồn ép, và thế này thì nguy to."
2548 = "Vì dùng đường hàng không,\\nnên có vẻ tôi đã đến hơi sớm một chút."
2550 = "Với một người như chị Mayami,\\ntại sao lại hỏi ngược lại một điều hiển nhiên như vậy chứ."
2551 = "Ý nghĩa của những lời đó, sự nghiêm trọng đâm thẳng vào sống lưng tôi."
2552 = "Nghe giọng nói cộc cằn vì cảm thấy bực bội của mình,\\ntôi mới nhận ra bản thân đang nôn nóng và mất kiên nhẫn đến nhường nào."
2553 = "Khi nghe tôi kể về thực đơn mà phu nhân Nagayama và Hibiki đã cùng nhau nghĩ ra,\\nngay cả đôi mắt của Reina cũng sáng rực lên."
2563 = "Thao tác sang số——"
2564 = "Vừa định tội vừa cười tươi,\\nchị ấy vươn tay về phía tôi."
2567 = "Nếu chị Mayami không hành động trước,\\nthì việc chỗ đó bị phe kia nắm thóp cũng chẳng có gì lạ."
2570 = "Sự phản công như một con gấu xám điên cuồng,\\nnếu chỉ cười nhạo là sự vùng vẫy vô ích, thì sẽ bị nghiền nát ngay lập tức."
2577 = "Lời nói của ông lão Minokasa, hoàn toàn không mang ý ép buộc,\\nmà chỉ chỉ ra sự thật đó."
2586 = "Bị nói thẳng thừng như vậy,\\ntôi nhận ra rằng việc cố tỏ ra cứng cỏi cũng vô nghĩa."
2590 = "Nói là thần giao cách cảm thì hơi quá,\\nnhưng đúng là một sự phối hợp nhóm không tồi chút nào."
2592 = "Quay lại nơi làm việc đã từng vứt bỏ một lần……\\nBản thân việc đó đã có rào cản rất cao rồi——"
2601 = "Mà, nói đi cũng phải nói lại——"
2602 = "Nói đến nửa chừng, tôi chợt nhận ra.\\nBảo dưỡng nồi hơi của \\x%l8620;#00ffc040;8620%l;#; thì……"
2604 = "Thành thật mà nói, tôi cảm thấy có vẻ khó khăn."
2610 = "Phương pháp càng cực kỳ đơn giản, càng khó bị lật đổ.\\nSố công sức tối thiểu cần thiết."
2617 = "Gặp khó khăn trong cuộc sống, phải vứt bỏ công việc quen thuộc——\\nCó lẽ vì em ấy đã chứng kiến vô số ví dụ như vậy ngay bên cạnh mình."
2618 = "Một câu hỏi quá đỗi ngớ ngẩn."
2619 = "Sự trùng hợp như vậy, không thể nào xảy ra được."
2620 = "Đó là điều đáng quý hơn bất cứ thứ gì.\\nTừ đây trở đi——tôi không cần phải do dự nữa."
2627 = "Nếu vậy thì bản thân kế hoạch cải tạo, là do phía quản lý hay ai đó,\\nđã ép buộc phải thực hiện sao?"
2629 = "Nếu vậy, trong tình hình hiện tại thì——"
2630 = "Nếu vậy, có lẽ đó chính là,\\nmục đích của Houshou Mototada cũng nên."
2637 = "Phần thịt thực sự rất ít,\\ntrông giống rễ ngưu bàng hơn là củ cải nhưng——"
2641 = "Tiếng bước chân lạch bạch vang lên trong đêm.\\nHòa cùng với đó là tiếng bước chân nhẹ nhàng bắt nhịp theo."
2647 = "（Ri……ri……）"
2648 = "（Chụt!）"
2650 = "（Thực tế thì……chúng ta đã bị giáng một đòn đau thật rồi.）"

[selections]
