1983 = "「Dạ không, dạ——xin hãy đợi em 30 giây!」"
1984 = "「Ừm. Từ từ nhẹ nhàng——\\nKéo dãn, kéo dãnnnn.」"
1985 = "「Đúng không ạ. Em cũng, có chút ngưỡng mộ rồi đấy.」"
1986 = "Lần này đến lượt tôi gập eo,\\ntừ từ nâng Paulette lên."
1987 = "「Không sao đâu.」"
2002 = "「Sự khác biệt trong cách cảm nhận giữa \"mọi người\" và Paulette.\\nĐó có lẽ chính là thứ gọi là tố chất của một nhà lãnh đạo đấy.」"
2003 = "「Một năm một lần mà. Khám sức khỏe của chúng ta ấy.」"
2004 = "「Để mọi người đợi lâu rồi nha.」"
2005 = "「Ví dụ nhé, Paulette.」"
2006 = "「Paulette, cái này.」"
2010 = "「A, không được. Để anh đính chính lại.\\n『Món này ngon thật đấy, Paulette』」"
2012 = "「Rồi, sau khi đã quyết định được khung hình muốn chụp,\\nanh chỉ cần nhấn nút chụp là——」"
2014 = "「Với tình trạng này thì em nghĩ có thể làm khá dễ dàng,\\nvà còn tiết kiệm được ngân sách nữa. Có điều——」"
2015 = "「Vì là thứ được sử dụng với số lượng lớn mà.\\nMuốn xử lý hoàn toàn chắc chắn sẽ rất phiền phức.」"
2016 = "「Ư yuu~」"
2019 = "「Thế thì đúng là, bầu không khí có vẻ khá tuyệt đấy.」"
2020 = "「Có vẻ chúng ta cần phải bổ sung thêm góc độ đó,\\nvào việc điều tra bên trong hầm mỏ.」"
2021 = "「Có khi xe goòng cũng vẫn còn sót lại ấy chứ.\\nĐường ray bên này, tình trạng tốt hơn em nghĩ rất nhiều.」"
2024 = "「Thật sự cảm ơn anh đã cứu em.\\nCái hồ này…… lỡ mà rơi xuống đó thì.」"
2026 = "「Anh hiểu rồi.」"
2031 = "「Vâng ạ. Bọn em đi nhé~」"
2036 = "「Ngốc! Paulette!!!」"
2037 = "「Nói chung là.」"
2038 = "「Trước mắt, cứ ra ngoài đã.」"
2039 = "「Tạm thời, cứ chụp thử một tấm đã.」"
2040 = "「Nói chung là, trước tiên cứ mang chuyện này về đã.」"
2042 = "「Đúng không.」"
2045 = "「Anh ăn đây.」"
2047 = "「Nếu không chê, hãy khoác nó lên đi.」"
2050 = "「Vì quy mô quá lớn, nên không mang lại cảm giác chân thực.\\nRất khó để cảm nhận được cảnh tượng này là một phần nối dài của cuộc sống thường nhật.」"
2052 = "「Đi \\x%l8620;#00ffc040;8620%l;#; đến tận đây, hoặc đến nhà ga bỏ hoang của mỏ than Jutsu-sen,\\nrồi cho mọi người trải nghiệm khai thác than ở đây.」"
2059 = "「Đường ray, vẫn còn kéo dài anh nhỉ.」"
2077 = "「Vụ này là vấn đề liên quan trực tiếp đến việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;.\\nAnh không biết liệu Hibiki có chịu cho mượn chất xám không, nhưng——」"
2079 = "「Có lẽ đây là cái hồ dùng để phân loại than.」"
2080 = "「Đây là——thứ mà mọi người đã nhắc đến……」"
2081 = "「Đây là…… di tích tuyến đường sắt bỏ hoang sao.」"
2082 = "「Đây chính là cái gọi là mỹ nhân ngoái đầu nhìn lại sao.\\nTrông vô cùng sống động và đáng yêu.」"
2083 = "「Fufufu, được rồi, nước ép cà chua nhé.」"
2084 = "「Nếu có thể biến thành tài nguyên thì không còn gì bằng…… nhưng trong trường hợp không thể,\\nthì khu mỏ bỏ hoang này, sẽ mang đến rắc rối lớn cho Ohimitera.」"
2085 = "「Đây là……\\nhọ đã bỏ lại toàn bộ vật tư và thiết bị luôn sao.」"
2086 = "「Ồ, thế thì tốt quá rồi.」"
2087 = "「Chào buổi sáng, Hikari.\\nĐi rửa mặt với mẹ nhé?」"
2088 = "Nhanh chóng nhưng cẩn thận,\\ntôi rửa mặt, cạo râu, vuốt nước chải lại tóc tai."
2089 = "「Đã từng đạt đến đỉnh cao phồn thịnh như vậy——thế nhưng,\\ndo nhu cầu về than giảm sút, nó đã hóa thành một đống đổ nát không người.」"
2090 = "「Nơi này, từng là ký túc xá anh nhỉ.」"
2095 = "「Đó là trong trường hợp khu vực này,\\ncòn lại những thứ đáng để đầu tư thôi ạ.」"
2103 = "「Dạ——để anh đợi lâu rồi ạ.」"
2104 = "「Dạ! Em cũng, đi chụp…… đi chụp ảnh đây ạ!」"
2105 = "「Chị Mayami cũng khuyên anh không chỉ khám sức khỏe định kỳ,\\nmà còn nên đi khám tổng quát nữa.」"
2106 = "「Dạ, khi nghe nói về việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nem cũng có tìm hiểu một chút về vấn đề ô nhiễm môi trường——」"
2108 = "「Em, dạ」"
2110 = "「Nếu vậy, hãy bắt đầu từ những việc có thể làm đi.\\nHôm nay, em có mang theo máy ảnh đúng không?」"
2111 = "（Tuúúúúúúúúúúú!）"
2116 = "「Nếu vậy, khôi phục lại tuyến đường cũng khả thi chứ?」"
2117 = "「Món này—— ngon thật đấy.\\nEm dùng loại giăm bông thượng hạng à?」"
2121 = "「Nếu vậy, đi thôi.」"
2122 = "「Vậy thì, chúng ta quay về thôi. Anh Soutetsu!」"
2124 = "「Đó là nhà máy…… của, mỏ than sao?」"
2126 = "「Vậy thì, thứ đọng lại dưới đáy này——\\nlà bột than hay những thứ thải ra từ đó sao ạ?」"
2127 = "Hai bồn rửa mặt nằm cạnh nhau.\\nTừ bên cạnh, giọng nói thanh bình của Reina vang lên."
2130 = "「Thế thì——đúng là đỉnh thật.」"
2131 = "Vị mặn mặn vô cùng đơn giản,\\nlan tỏa khắp khoang miệng, lan tỏa khắp cơ thể."
2133 = "「Vì có anh Soutetsu ở bên…… nên em đã lơ là mất.\\nKhông chỉ cảm ơn anh, mà em còn phải xin lỗi anh nữa.」"
2134 = "「Vâng, ổn rồi ạ, anh Soutetsu.」"
2135 = "「Hắt xì!」"
2136 = "Paulette cứ thế gập nửa thân trên về phía trước,\\nlưng tôi tì lên eo Paulette, tạo thành một đường cong."
2137 = "Hai chân tôi chạm đất trở lại."
2138 = "「Ồ—— ồ.」"
2140 = "「Nói ra thì hơi giống trò chơi chữ vô bổ nhưng mà……\\nVí dụ với Hibiki, cảnh tượng này thực sự chỉ là một bức 『tranh』.」"
2141 = "「Chụp, chụp ảnh…… anh Soutetsu, có lẽ——có tài năng đấy ạ.\\nThì, anh là anh trai của Hibiki mà.」"
2142 = "「Anh Soutetsu! Anh Soutetsu! Thấy rồi ạ!!」"
2143 = "「Anh Soutetsu?」"
2144 = "「Định lát cả đường ray trong sân vườn luôn sao?」"
2150 = "「Vâng ạ, bé Hikari~」"
2152 = "「Thị trấn ma……\\nmột thị trấn bị nuốt chửng bởi khu rừng, phải không ạ.」"
2154 = "「Ừm! Trả lời ngoan lắm.\\nVậy, mẹ con em đi một lát nhé.」"
2155 = "「!!!」"
2156 = "「!?」"
2356 = "Sự lụi tàn của một thứ, có quy mô to lớn đến nhường nào.\\n——Cảm giác như vừa chạm vào một phần tận cùng của nó, cơ thể tôi khẽ run lên."
2358 = "Rất nhiều, rất nhiều máy móc——\\nvà ở tận cùng, thậm chí cả bảng điện cũng hiện ra mà không hề có một vết gỉ sét."
2361 = "Một chiếc là máy ảnh phản xạ ống kính đơn——chắc vậy nhỉ?\\nTrông cực kỳ đồ sộ, có vô số cần gạt và nút bấm. Nhưng mà——"
2363 = "Ký ức xa xăm thôi thúc cổ họng tôi cất lời."
2367 = "「Reina mời cả nhà nha.」"
2368 = "「Tiếc quá! Nước ép ngọt hiện tại đã bán hết rồi.」"
2371 = "Dù có tái sử dụng dưới hình thức nào đi chăng nữa, à không, ngay cả khi không làm vậy,\\nthì cũng không thể bỏ mặc nguy cơ ô nhiễm môi trường được."
2375 = "Nhưng——vậy thì tốt rồi.\\nRơi xuống hồ. Ít nhất cũng ngăn chặn được tình huống tồi tệ nhất đó."
2376 = "「Bắt đầu nhé~ Từ từ, từ từ thôi—— ưm…… ưm.」"
2377 = "Thế nhưng, thật vắng vẻ.\\nNếu phóng to lên, ngay cả khoảng trống cũng trở nên sống động."
2388 = "「Vâng ạ.」"
2395 = "「Hikari muốn chơi với ba cơ.」"
2400 = "「Reina cũng rửa mặt xong rồi nha.」"
2401 = "（Bịch）"
2404 = "Thế nhưng ngay lập tức chỉnh đốn lại tư thế,\\nPaulette nhìn thẳng vào tôi."
2405 = "「Fufufu.\\nGiống hệt loại nhà mình hay dùng thôi ạ?」"
2408 = "Nhưng, tôi hiện tại đang dao động và bối rối.\\nTôi không nghĩ mình đang ở trạng thái có thể hỏi một câu hỏi quan trọng như vậy."
2410 = "Thế nhưng, những tố chất hiếm có, cùng trực giác nhạy bén đó. Cả trên phương diện đường sắt lẫn chính trị,\\nPaulette hiện tại vẫn chưa thể phát huy hết được."
2430 = "「Kyaa!」"
2432 = "「Anh Soutetsu và mọi người cũng đi luôn đi ạ.\\nKhoảng 30 phút nữa là đông lắm đấy.」"
2434 = "Mái tóc hơi ngậm nước kia, sao lại bóng mượt đến vậy."
2438 = "Có vẻ như sắt và khói cũng có tác dụng cực kỳ lớn đối với Reina."
2442 = "Nếu tạo tiền lệ dùng chăn đệm làm ghế sofa,\\ncó thể sẽ ảnh hưởng xấu đến việc giáo dục con bé sau này."
2451 = "Paulette cũng đã làm những việc giống hệt tôi.\\nMột sự thật nhỏ bé, nhưng lại khiến tôi thấy vui vẻ và vững tâm đến lạ."
2462 = "Chừng nào con người vẫn còn tiếp bước với tư cách là con người,\\nthì ngày đó, một lúc nào đó chắc chắn sẽ đến."
2464 = "「Phù…… a—— em, cũng—— cứng đờ——\\nhết cả rồi, nhỉ…… ưm…… hiệu quả quá……」"
2466 = "Ngay khi tôi cảm thấy \"đã truyền đạt được rồi\",\\nđiều đó lập tức biến thành một sự thấu hiểu mới về Paulette."
2468 = "Khi cơn đau kèm theo sức nóng nhạt dần đi——\\nKhông sao, không có vấn đề gì với việc hô hấp hay nói chuyện."
2476 = "Mỗi khi nói chuyện với tôi,\\nPaulette luôn quay sang nhìn tôi một cách vô cùng nghiêm túc."
2479 = "Phắt! Paulette dùng hai tay ôm lấy cơ thể mình,\\nxoay nửa người lại như thể muốn che giấu."
2483 = "Cảm giác 『hiểu』 và 『nhìn thấu』 của em ấy quá đỗi rõ ràng,\\nnên có lẽ trí tưởng tượng không thể với tới những người 『không hiểu』 và 『không nhìn thấu』 được."
2484 = "Giọng nói ngái ngủ.\\nMột bàn tay thò ra từ dưới chăn, tiếp đó là cái đầu ngóc lên."
2489 = "「Chăn đệm tính sao đây ạ? Có cần cất đi không nha?」"
2490 = "Trước khi có \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nđường sắt và ô tô chạy xăng đã chống đỡ cho giao thông của con người."
2492 = "「Fufufu, cơ thể được kéo dãn ra, dễ chịu quá nha.」"
2497 = "Vừa lắc lư nhè nhẹ,\\ntôi vừa từ từ, từ từ gập eo sâu hơn một chút."
2500 = "Bên trong đường hầm, mang lại ấn tượng hiện đại hơn nhiều so với dự đoán."
2505 = "Với nhiệt độ và ánh nắng thế này."
2512 = "Đôi mắt xanh thẳm rời khỏi đường ray và hướng về phía tôi."
2515 = "Em ấy nhận lấy và khoác lên người.\\nNgay lập tức, Paulette nheo mắt lại một cách thoải mái."
2516 = "Câu hỏi bị nuốt lại giữa chừng đó,\\ndù vậy, tôi vẫn trả lời."
2519 = "Em ấy cúi gập đầu xuống một cách trang trọng."
2521 = "「Kéo dãn.」"
2522 = "「Á.」"
2525 = "Giống hệt với nụ cười xa xăm hiện lên ở nơi sâu thẳm nhất trong trái tim tôi.\\nỞ nơi quan trọng nhất."
2526 = "Một năm là quá đủ để bệnh tật âm thầm gặm nhấm cơ thể."
2528 = "Hơi thở phả tới mang theo chút ấm áp, khiến tôi thấy nhột nhột."
2529 = "Nghe nói có chụp hỏng bao nhiêu cũng không sao,\\nthì cứ lấy số lượng bù chất lượng xem sao."
2534 = "Em ấy quay lưng lại ngồi xổm xuống, lấy đồ trang điểm từ túi xách ra,\\nbắt đầu dặm lại mặt và chải chuốt lại tóc tai."
2537 = "Vì quá mải mê tìm kiếm thông tin hiện ra phía bên kia ống kính,\\nnên em ấy đã vô tình bước đi vài bước."
2538 = "Em ấy đã hiểu ý tôi."
2539 = "（Hự—— hự hự hự——）"
2543 = "Muốn xác nhận, muốn thử hỏi xem,\\nlồng ngực đang đập thình thịch như bị thiêu đốt."
2545 = "Nếu có thể truyền đạt sao cho lay động được trái tim của Hibiki,\\nthì có lẽ, điều đó cũng sẽ truyền đạt được tới rất nhiều người."
2550 = "Cứ để nguyên chăn đệm làm ghế sofa cũng được,\\nnhưng có Hikari ở đây."
2552 = "Bằng cách chôn \\x%l枕木;#00ffc040;tà vẹt đường ray%l;#; với độ sâu khác nhau để tạo độ cao thấp,\\nngười ta tạo ra một bức tường rào tận dụng nguyên vẹn vẻ đẹp của gỗ mục——"
2555 = "Cho dù Hibiki không hợp tác đến mức đó đi chăng nữa,\\nchúng tôi vẫn còn có chị Mayami, Nagi và cả Fukami."
2556 = "Cho dù con người có từng phồn vinh đến đâu đi chăng nữa,\\nthiên nhiên vẫn kiên nhẫn chờ đợi thời cơ đảo ngược tình thế——và giành chiến thắng."
2559 = "Nó nhìn xuống toàn bộ khu vực——\\ncứ như một pháo đài bảo vệ ngành công nghiệp than đá vậy."
2560 = "Chúng tôi đã đi bộ khá xa đến tận đây.\\nNhưng mà——"
2576 = "Nghĩ vậy, cùng với lòng biết ơn,\\ntôi càng cảm thấy cơn đói cồn cào hơn."
2577 = "Reina hớn hở leo xuống.\\nEm ấy xoay người, quay tấm lưng đáng yêu về phía tôi."
2580 = "Nếu có thể quảng bá tốt sức hấp dẫn của việc trải nghiệm khai thác than——\\nÀ, không, đúng rồi."
2589 = "Chẳng mấy chốc sẽ nóng lên thôi,\\nnhưng đến lúc đó, quần áo của Paulette chắc cũng đã khô rồi."
2590 = "Tôi chợt cảm thấy, đôi mắt ấy nhìn thấy điều gì,\\ncó lẽ cũng chính là sự phù hợp của người đó."
2596 = "Paulette mải mê đi dọc theo di tích tuyến đường sắt,\\ncuối cùng cũng dừng bước."
2597 = "Đã không cùng huyết thống,\\nthì chuyện kế thừa cùng một tài năng là điều không thể."
2598 = "Trên con dốc quanh co,\\nđột nhiên, thứ đó hiện ra."
2600 = "Vì vậy, tôi cố nặn ra từng chữ.\\nTừ khe hở của việc kìm nén mọi cảm xúc."
2601 = "Tôi không cố ý,\\nnhưng kết quả là lại thành ra như đang nhìn trộm."
2604 = "Tôi và Paulette đã từng ngâm chung một bồn tắm ở Tororyu-yu.\\nDù da thịt có lộ qua lớp áo ướt, thì giờ cũng chẳng còn gì để phải ngại ngùng nữa."
2607 = "Tôi đã nắm được cách sử dụng."
2610 = "Tôi đưa Paulette đến nơi có ánh nắng mặt trời.\\nQuay trở lại gần hồ lắng cặn lúc nãy."
2611 = "Tôi nhận lấy chiếc máy ảnh từ tay Paulette.\\nĐầu ngón tay khẽ chạm vào nhau, còn ấm hơn cả hơi thở của em ấy."
2613 = "Thịch, trái tim tôi đập thót một nhịp."
2614 = "Bầu không khí thay đổi khiến tôi thở phào nhẹ nhõm,\\nlời nói cũng trở nên trơn tru hơn."
2617 = "Tôi vừa lao tới vừa kéo tay em ấy lại, kéo ngã lên người tôi!"
2619 = "Tôi cũng chụp vài tấm ảnh tuyến đường sắt bỏ hoang,\\nsau đó thử đặt chân lên."
2621 = "Từ bên dưới tấm bạt ngấm dầu,\\nmột cỗ máy công cụ nguyên vẹn lù lù hiện ra."
2623 = "Tôi buông bàn tay đang ôm chặt lấy Paulette ra,\\nsau khi để em ấy đứng dậy, tôi mượn tay em ấy và cũng từ từ đứng lên."
2624 = "「Hikari thích nước ép cơ~」"
2627 = "「Với ba sao.」"
2632 = "Tôi giơ máy ảnh lên.\\nTrong màn hình, khuôn mặt Paulette cứng đờ vì kinh ngạc."
2633 = "Áo sơ mi của tôi cũng bị ướt, dù không đến mức sũng nước.\\nTôi cởi nó ra, vắt kiệt rồi giũ nhẹ."
2636 = "Chạy tới xem,\\nthì không cần phải hỏi \"Thấy cái gì?\" nữa."
2638 = "Trong khoảnh khắc tôi đã giật mình tưởng mình làm em ấy giận, nhưng——\\nĐây là, cái đó. Khóe miệng đang cố kìm nén niềm vui sướng trào dâng."
2639 = "Cảm thấy có lỗi và xấu hổ, tôi vội vàng tuôn ra một tràng."
2640 = "Paulette là một người phụ nữ cực kỳ xinh đẹp,\\nlần đầu tiên tôi nhận ra điều đó——không, cảm giác như lần đầu tiên tôi được chiêm ngưỡng thì đúng hơn."
2641 = "Ánh nhìn gay gắt.\\nLần đầu tiên tôi thấy nó hiện lên trong đôi mắt xanh thẳm ấy."
2643 = "Tôi vừa gật gù,\\nthì Paulette lại lắc đầu nguầy nguậy."
2645 = "May mắn thay, tôi đã quen,\\nvới việc xử lý những tình huống thế này."
2651 = "Dù hiểu rõ lý thuyết là vậy,\\nnhưng thực tế—— rất khó để xin nghỉ phép đi khám sức khỏe."
2654 = "Nếu tôi đi một mình trên chuyến tàu không có xe đẩy bán hàng này,\\nchắc chắn tôi sẽ phải chịu đựng cơn đói trong suốt chặng đường dài."
2668 = "「Con dậy rồi à, Hikari. Chào buổi sáng.」"
2670 = "「Đúng vậy. Cứ liên quan đến Hikari và chuyến du lịch bằng tàu hỏa,\\nPaulette lại trở nên đáng tin cậy hơn hẳn ngày thường.」"
2672 = "「Xong! Kết thúc.\\nCon đi rửa mặt với mẹ đi.」"
2674 = "「Ừm. Thế này là ổn rồi.」"
2680 = "Ra là vậy.\\nĐúng là như vậy."
2688 = "「Phúc lợi tốt quá! Đường sắt Ohito cũng phải học tập mới được.」"
2690 = "Theo như lời nhóm đi dã ngoại kể lại thì nó nằm ở khá gần đây,\\ntrước tiên cứ nhắm tới khu di tích ký túc xá xem sao."
2701 = "Giống như màu sơn pha trộn giữa nâu và xanh lá,\\nmột màu sắc khó có thể nói là đẹp đẽ."
2702 = "「……Giá như Hikari cũng hấp thụ thật nhiều sắt và khói,\\nđể cải thiện chứng sợ người lạ dù chỉ một chút thì tốt biết mấy.」"
2733 = "「Hả? Nhưng mà Reina làm gì có máu lưu thông đâu nha?」"
2735 = "Như thể muốn nói \"Anh đã hiểu cho em rồi\",\\nPaulette nở một nụ cười nhạt."
2736 = "Cúi gầm mặt, khóe miệng em ấy đang run rẩy."
2737 = "Paulette bước lên trước một bước.\\nSau đó, em ấy ngoảnh lại nhìn tôi."
2738 = "Như thể bị sét đánh trúng,\\nPaulette mở to tròn hai mắt."
2739 = "Nếu chỉ đơn giản là cõng trên lưng——\\nThì không thể kéo dãn eo được, nhưng mà……"
2740 = "Rất tĩnh lặng.\\nNhưng đầy kiên quyết, Paulette cắt ngang lời tôi."
2741 = "Từ chiếc túi mà Paulette xách theo,\\nhai chiếc máy ảnh được lấy ra."
2742 = "「Chính xác nha.」"
2743 = "「（Ngoạm）」"
2744 = "Ngay khi ngón tay Paulette vừa cử động,\\ntrên màn hình hiển thị bức ảnh vừa mới chụp."
2745 = "Rụt rè nhìn xuống mặt nước,\\nPaulette khẽ rùng mình."
2746 = "Trên khuôn mặt Paulette,\\nnở một nụ cười còn rạng rỡ hơn cả ánh đèn đội đầu."
2747 = "Nét mặt Paulette trở nên căng thẳng."
2748 = "Tôi gật đầu đồng tình sâu sắc với giọng nói đầy cảm xúc của Reina."
2749 = "「Ba biết rồi ba biết rồi. Nào. Kéo dãn.」"
2750 = "Paulette đứng ngay sát bên cạnh tôi.\\nHai chúng tôi cùng ghé mắt nhìn vào màn hình phía sau máy ảnh."
2751 = "Paulette chạy vọt đi, bỏ xa tôi một đoạn lớn."
2752 = "「Chị Reina, bái bai!」"
2754 = "Thứ đang được đặt sát mắt Paulette,\\nlà chiếc máy ảnh có ống kính dài."
2755 = "Lần này Paulette dừng chân đứng vững,\\nrồi bấm máy chụp vài tấm ảnh."
2756 = "「Được rồi được rồi. Reina, nhờ em nhé?」"
2782 = "「Ra là vậy, đúng thế thật. Nói mới nhớ,\\nReina còn khỏe mạnh hơn chúng ta nhiều nhỉ.」"
2783 = "Tại sao, họ lại tán thành việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; chứ."
2786 = "Nhưng hiện tại,\\ncả hai đều đang thoi thóp."
2794 = "「Hửm?\\n……Sắt là đường sắt thì anh hiểu rồi, nhưng khói là sao?」"
2796 = "「Ừ, khi nào hai người quay lại thì đổi chỗ nhé.」"
2798 = "Thấy em ấy làm vậy, tôi mới à lên hiểu ra vấn đề."
2799 = "Những đường dây có vẻ như là dây điện, cùng vô số đường ống.\\nHơn nữa còn có thứ gì đó, được bọc trong một tấm vải khổng lồ——"
2806 = "Nhiệt độ trong hầm khá thấp.\\nHơn nữa, những giọt nước cứ liên tục rơi xuống."
2809 = "Ở đó không còn khuôn mặt nào được phản chiếu nữa.\\nPhía bên kia cửa sổ, cũng không còn sự ấm áp nào hiện lên."
2814 = "「Ư, ưm—— cảm ơn em—— đổi chỗ, nào.」"
2817 = "「Fufufu, cái đó là nha.」"
2820 = "Thứ tạo ra màu sắc đó chỉ là lớp cặn dưới đáy,\\ncòn phần nước bên trên lại trong vắt, điều này càng khiến người ta thấy sợ hãi hơn."
2824 = "Như thể muốn làm tan chảy ánh nhìn đó,\\nPaulette từ từ ngước mặt lên bầu trời."
2826 = "Khoảnh khắc nghe thấy tiếng hắt xì,\\ncơ thể tôi cũng bất giác run lên."
2827 = "Khi tôi kể lại trải nghiệm đó,\\nPaulette gật đầu lia lịa, gật đi gật lại thật mạnh nhiều lần."
2836 = "Trên khu vườn cỏ xanh mướt,\\nnhững thanh \\x%l枕木;#00ffc040;tà vẹt đường ray%l;#; dùng thay cho đá lát được xếp nối tiếp nhau một cách có quy luật."
2838 = "Kính vỡ. Tấm rèm bị bỏ lại.\\nDây thường xuân bò đến xâm thực những tấm cửa chớp bằng gỗ đang mục nát."
2855 = "「Anh Soutetsu. Anh nhớ làm từ từ, nhẹ nhàng thôi nhé?\\nReina cũng đang được bảo dưỡng định kỳ rồi mà.」"
2856 = "（Nếu xung quanh không thấy, \\nthì chỉ còn cách đi bộ tìm thôi.）"
2859 = "Em ấy thở phào một hơi như thể đã an tâm."
2872 = "Đứng ở cùng một nơi, cùng phản chiếu một cảnh tượng trong mắt,\\nthế nhưng con người lại \"nhìn\" ra những thứ thực sự rất khác nhau."
2877 = "Sau một cú va chạm nhẹ nhàng mềm mại,\\nlà một cú đập mạnh! Một cơn đau cứng và dữ dội ập đến sau lưng."
2889 = "Phía sau những tòa nhà có vẻ như là nhà lắp ghép,\\ntôi có thể nhìn thấy những khối bê tông như thể đang cắt ngang và chống đỡ sườn núi."
2892 = "Quá khứ này, những dấu tích này.\\nCũng có thể coi là tấm gương phản chiếu tương lai của Ohimitera."
2893 = "Thứ này——thật khủng khiếp.\\nNó cho tôi thấy rõ sức mạnh của thực vật, của thiên nhiên."
2894 = "Khu ký túc xá bỏ hoang này, từng là nơi sinh sống của vô số người,\\nnhưng giờ đây——chỉ còn là một tấm bia mộ khổng lồ mà thôi."
2895 = "「Vậy thì lại đây. Anh kéo dãn cho Reina luôn.」"
2897 = "Quanh khu vực này, ngay cả đường ray cũng vẫn còn sót lại.\\nĐúng là muốn gọi nó là đường sắt hơn là di tích tuyến đường sắt bỏ hoang."
2898 = "「Ngon quá!」"
2899 = "Nếu bản thân ngành công nghiệp khai thác than đang biến mất,\\nthì cũng chẳng có nơi nào chịu mua lại vật tư thiết bị cả."
2903 = "Nóng bỏng và mãnh liệt hơn gấp hàng chục lần,\\nso với khoảnh khắc tôi bị hớp hồn bởi vẻ đẹp của Paulette."
2907 = "Thoạt nhìn có vẻ là một ống kính tele cực kỳ xịn,\\nem ấy dường như đang quan sát tình trạng sườn núi."
2909 = "Có lẽ do tôi nói ra những gì mình nghĩ quá thẳng thắn,\\nPaulette đỏ bừng mặt cúi gầm xuống."
2910 = "Phía xa của con dốc thoai thoải kéo dài,\\nbên kia ngọn đồi, hay nói đúng hơn là ngọn núi nhỏ, có một nhà máy lớn được xây dựng."
2911 = "Trải rộng xung quanh đường ray,\\nlà một khung cảnh lộn xộn."
2912 = "Đường ray làm bằng sắt.\\nGiá trị tái sử dụng cao là chuyện đương nhiên. Nhưng——"
2916 = "Bên cạnh đó là một cánh cửa nhỏ.\\nMay mắn thay, nó không bị khóa."
2920 = "Dù không biết là mười năm sau, một trăm năm sau, hay một ngàn năm sau——"
2921 = "Đi ngược lại lối đi, chúng tôi đi ngang qua những người vừa thức dậy."
2922 = "Tôi chưa bao giờ nghĩ đến việc tự mình chụp ảnh,\\nnhưng một khi đã quyết định giúp một tay, thì việc gì cũng nên làm."
2923 = "Quần thể ký túc xá bỏ hoang cũng vậy,\\nnhưng khung cảnh này cũng mang lại một tác động khá mạnh mẽ."
2924 = "Chúng tôi áp sát lưng vào nhau,\\nhai cánh tay ngoắc vào nhau ở phần khuỷu tay."
2925 = "Tôi cảm thấy không cần thiết phải xin lỗi,\\nnhưng nếu đó là phép tắc của Paulette, thì dĩ nhiên tôi sẽ cứ thế mà đón nhận."
2926 = "Có lẽ vì đó là một thế giới mà tôi hoàn toàn không có hứng thú,\\nnên tôi không tài nào hình dung ra được."
2927 = "Đúng là vậy, nhưng chúng tôi chỉ là anh em nuôi."
2928 = "「A, vâng—— hây dô.」"
2931 = "Đôi má dần dần ửng đỏ,\\nem ấy nhìn tôi chằm chằm."
2939 = "Trên mặt đất nơi Paulette chỉ tay,\\nhiện lên rõ ràng——một con đường tạo bởi \\x%lバラスト;#00ffc040;đá ba-lát%l;#; và \\x%l枕木;#00ffc040;tà vẹt đường ray%l;#;."
2944 = "Một khoảnh khắc giữa chừng chuyển động,\\nđã được bắt trọn sống động thành một bức tranh."
2955 = "「Ừm. Nói đúng hơn là toàn bộ nhân viên chính thức của xưởng rượu Migita đều phải đi.\\nNgoài khám sức khỏe định kỳ, cứ hai năm một lần lại khám tổng quát.」"
2976 = "（Dù vậy……\\nTuy có câu nói \"đẹp trai đến mức nước cũng phải nhỏ giọt\"——）"
2978 = "「Có dầu máy hay thứ gì đó tương tự mà. Kể cả không có,\\nnếu cứ giữ nguyên một tư thế không cử động thì các khớp cũng sẽ bị cứng lại đấy.」"
2979 = "（Két——）"
2981 = "「Không sao đâu, chắc chắn sẽ được mà nha.」"
2985 = "（Rầm!!）"
2987 = "「Nghe an tâm quá nhỉ.」"
2988 = "（Ây da.）"
2991 = "「Vâng! Ba kéo dãn cho con nhé?」"
2992 = "「Em chơi chữ giỏi đấy.」"
2993 = "（Tách——Tách——）"
2994 = "（Tách——）"
2995 = "（Tách）"
2996 = "（Bíp bíp bíp…… Tách!）"
2998 = "（Vì bị ướt nên——\\nquần áo đã trở nên khá trong suốt rồi.）"
3000 = "（Quả nhiên Paulette……\\nvới tư cách là một chính trị gia, em ấy cũng sở hữu tố chất xuất chúng.）"
3001 = "（Tỏng）"
3004 = "Như thể đã đoán trước được tình huống này,\\nPaulette đã bắt đầu mở giỏ đồ ăn ra."

[selections]
