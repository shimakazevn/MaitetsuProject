1187 = "Không chỉ cơ thể Paulette, mà cả cơ thể tôi nữa, đều đang nóng rực như bốc cháy thế này cơ mà."
1193 = "Tóm lại——không còn nhiều thời gian nữa."
1203 = "Vậy mà, cô bé của Paulette vẫn ướt át ngọt ngào, run rẩy đung đưa cơ thể một cách đầy gợi tình."
1205 = "Nhưng, chính vì thế mà ngay lúc này! Với nửa thân dưới đang cứng đờ này!"
1210 = "Nhìn cô bé cứ co giật liên hồi từng đợt nhỏ, cũng đủ biết Paulette đã vượt quá giới hạn từ lâu rồi."
1213 = "Đâm mạnh vào nơi sâu nhất. Ấn con dấu dương vật lên cánh cửa tử cung."
1215 = "Những nếp gấp thịt khi liếm có cảm giác nông, nhưng khi tiếp xúc gần với dương vật cương cứng, lại tấn công một cách chính xác đến vậy."
1223 = "Phần gân nhạy cảm bị âm vật kích thích, tôi suýt nữa đã thốt ra tiếng rên, đành phải nuốt ngược vào trong để kìm nén."
1226 = "Cảm giác bị áp bức và an tâm khi được bao bọc. Và rồi, sự ngọ nguậy của da thịt——"
1228 = "Dù bị siết chặt đến nhường này, nhưng phần thịt của Paulette lại quá mềm mại——!"
1231 = "\"Trong nhà này, thau trộn bột chỉ là đồ tiêu hao\", nếu hiểu rõ điều đó, sự phản kháng của em ấy hẳn sẽ giảm đi nhiều."
1234 = "Khi đã hiểu ra, dù ở tư thế này cũng có thể thấy rõ. Hoàn toàn không cần phải tăng tốc. Việc cần làm bây giờ là hãm phanh từ từ——"
1236 = "Đồng thời hứng lấy mật ngọt, làm tăng thêm độ đậm đặc và sự mãnh liệt của nụ hôn."
1249 = "Tiếp xúc với không khí, e rằng vi khuẩn đang sinh sôi dữ dội—— Không! Không phải. Giờ không phải lúc để nghĩ ngợi."
1250 = "Được dẫn dắt, bình tĩnh lại. Như mọi khi, toàn bộ quy đầu từ từ tiến sâu vào trong âm đạo."
1253 = "Bằng cách nào đó——nếu không thể giữ hông ổn định, chỉ riêng sự ma sát thôi cũng sướng đến mức có thể xuất tinh mất."
1261 = "Độ đặc và lượng ái dịch nhiều đến mức nói cô bé tan chảy cũng không ngoa, nó đang nhuộm đẫm lưỡi, miệng và toàn bộ tâm trí tôi."
1264 = "Mỗi lần như thế tinh dịch lại văng tung tóe—— Nhưng đằng nào thì lát nữa cũng phải tổng vệ sinh rồi."
1266 = "Cái lắc đầu, và cả ánh mắt, bỗng nhiên dừng lại. Nơi ánh mắt dừng lại và hướng đến là——"
1268 = "Những giọt mồ hôi rịn đầy trên toàn thân, thánh thót, rơi xuống bồn rửa."
1270 = "Mồ hôi lạnh. Chiếc tạp dề dính sát vào người, run rẩy theo từng chuyển động mỏng manh của cơ bụng."
1273 = "Bụng dưới thóp lại như muốn nói 'là ở đây này', rồi lại phồng lên. Sự rung động đó truyền đến, khiến dương vật càng thêm cuồng bạo."
1275 = "Giọng nói có phần mơ hồ bỗng bừng sáng lên vì hiểu ra ý tôi."
1276 = "Giữ chặt lấy môi tôi một cách ngọt ngào, chỉ riêng đầu lưỡi, em mổ nhẹ liên hồi như đang cù lét."
1278 = "Không phải là nhịp thở rối loạn do nụ hôn hay mơn trớn. Cũng không phải là mồ hôi vã ra từ cơ thể nóng rực khi động dục."
1281 = "Nước bọt chảy vào, lưỡi quấn lấy lưỡi. Bị mút mát lôi kéo, tôi vươn lưỡi ra, đôi môi em liền kẹp lấy và tuốt dọc theo lưỡi tôi."
1283 = "Ánh mắt em đảo điên. Không ngừng hướng về phía tôi cầu cứu."
1284 = "Giọng nói lọt qua màng nhĩ, thúc đẩy quá trình sản xuất tinh dịch trong tôi. Tinh hoàn đã căng cứng, chứa đầy tinh dịch."
1286 = "Đôi mắt xanh biếc đã ngấn lệ hoàn toàn. Nếu cứ để mặc thế này, có lẽ em ấy sẽ khóc mất."
1287 = "Nếu cứ ép em ấy nhịn thêm nữa, không đùa đâu, có khi em ấy sẽ bị viêm bàng quang mất."
1289 = "Hôn——Nghe em nói vậy, tôi mới chợt nhận ra. Đây cũng là một nụ hôn sâu với Paulette."
1290 = "Nếu cứ suy nghĩ thì sẽ chẳng làm được gì. Chỉ cần, phó mặc bản thân và lý trí——cho tình yêu là đủ."
1313 = "Dòng nước tiểu đã yếu đi nhiều, lỗ niệu đạo vốn bị màn nước che phủ giờ chỉ còn nhỏ từng giọt."
1324 = "Đôi mắt ấy hiện lên đủ mọi sắc thái—— Kỳ vọng, bất an, và cả niềm vui sướng."
1325 = "Bởi kinh nghiệm mách bảo tôi rằng, làm vậy Paulette sẽ lập tức thả lỏng cơ thể."
1328 = "Khoái cảm đã gần như tê liệt, chẳng còn phân biệt được dương vật và cô bé nữa, dù vậy hông vẫn tiếp tục thèm khát đến mức đê tiện——"
1333 = "Lời nói bất ngờ khiến tôi không nhịn được mà bật cười. Nhân tiện, tinh dịch trào ra nhầy nhụa, làm bẩn cả sàn nhà."
1339 = "Ái dịch, chất nhờn rỉ ra từ tôi. Lượng dầu bôi trơn quá dồi dào lúc này lại trở nên đáng ghét."
1340 = "Cảm giác thành tựu và khoái cảm hòa quyện một cách mãnh liệt và đơn thuần, khiến chuyển động của tôi chẳng khác nào một con thú!"
1343 = "Vừa nói, tôi vừa nhấc chiếc thau lên. Mùi hương nồng đậm hơn lúc nãy."
1345 = "Việc tôi hứng lấy nước tiểu của em và liếm nó, đã biến sự căng thẳng của Paulette thành cơn động dục rõ rệt."
1347 = "Tôi cũng không thể nói rằng đây chỉ là ý định nhất thời, nhưng tôi cũng không muốn nói dối——Vậy thì chỉ còn cách chứng minh bằng hành động."
1352 = "Nơi mềm mại nhất của bắp đùi. Chỉ chệch đi vài phân nữa thôi là sẽ chạm đến háng."
1354 = "Rõ ràng là khao khát nhau, bám chặt lấy nhau, nhưng lại không thể khớp hoàn hảo như mọi khi."
1355 = "Làn da đã bao lần quấn lấy nhau, đang khao khát tìm đến nhau như muốn hút chặt lấy nhau."
1356 = "Nhịp thở, chuyển động, đều hòa quyện. Gọi mời nhau, khao khát nhau sâu sắc, nên chúng tôi nuốt lấy nhau."
1357 = "Nhịp điệu được sinh ra, hai cơ thể dính chặt vào nhau, tìm thấy sự cân bằng tại một trọng tâm duy nhất."
1359 = "Chỉ cần cố ấn nhẹ đầu ngón tay vào một chút thôi, lỗ hậu nhỏ bé của Paulette đã phản kháng dữ dội như muốn xé toạc ra!"
1362 = "Muốn xuất tinh. Vào sâu bên trong Paulette. Ý nghĩ ấy tự nhiên thúc ép chuyển động của hông thay đổi."
1364 = "Cẩn thận đặt chiếc thau sang một bên để không làm đổ thứ bên trong. Rồi vươn những ngón tay giờ đã rảnh rỗi ra——"
1365 = "Làn da mềm mại đã quấn lấy nhau vô số lần, cửa mình đã bị ngoáy sâu vô số bận. Dù tư thế lạ lẫm này có mang lại cảm giác mới mẻ đến nhường nào đi chăng nữa."
1366 = "Nước tiểu đã được lau sạch gần hết. Cảm giác nhịn tiểu chắc cũng không còn nữa."
1370 = "Luôn lường trước tình huống xấu nhất, chuẩn bị kỹ lưỡng cho giải pháp tốt nhất."
1372 = "Nếu thử mượn đà để đâm một phát thật mạnh, quy đầu sẽ rất dễ bị tuột ra."
1373 = "Bế bổng lên, hôn một cái, rồi để em ấy đứng trên sàn."
1376 = "Gập người xuống, tôi thè lưỡi áp chặt vào háng Paulette không để lọt khe hở nào."
1378 = "Bế bổng lên. Cơ thể mất sức của Paulette ấm áp hơn mọi khi."
1381 = "Khi tôi thè lưỡi chẻ vào trong, âm đạo của Paulette nóng hổi tan chảy nhưng vẫn rất mềm mại."
1382 = "——Tôi dùng toàn bộ lưỡi trườn qua lại, bôi trét nước bọt của mình vào sâu trong âm đạo."
1383 = "Ôm lấy đôi chân——tóm lấy phần thịt đang nâng đỡ cặp mông, cứ thế duỗi những ngón tay ra, vươn tới——"
1385 = "Tôi không ngờ việc đi tiểu trong bồn rửa lại khiến em ấy phản kháng đến mức đó."
1388 = "Ngay sau khi xuất tinh, tôi đang ở trong cái gọi là 'chế độ hiền nhân'. Vì vậy, tôi đành phải miễn cưỡng dùng nhiệt huyết để lấp đầy lại lý trí."
1389 = "Mỗi lần tôi cố gắng đẩy hông thật mạnh để chạm đến nơi tận cùng, hông Paulette lại nổi lên."
1391 = "Trượt dọc theo phần phồng lên nối với hạt ngọc hết lần này đến lần khác, để truyền hơi nóng, mùi hương và chất dịch của dương vật vào đó."
1392 = "Đâm sâu, ngoáy mạnh bằng quy đầu——Dù vậy, phần thịt mềm của âm đạo vẫn bám sát, xao xuyến chuyển động, gọi mời tôi vào sâu, sâu hơn nữa."
1395 = "Cảm giác an tâm tươi mát như lần đầu nhìn thấy cá Ayu non nhảy múa lúc chớm hè, lấp đầy trái tim tôi."
1398 = "Lưỡi tôi cũng đã thấm mệt. Hay là cứ dùng ngón tay tiếp tục âu yếm thế này cũng được——"
1399 = "Quy đầu đang hôn lên tử cung. Nhưng tôi không thể gõ cửa quá mạnh."
1401 = "Anh biết chứ. Anh cũng muốn đâm sầm sập, đập mạnh quy đầu vào nơi sâu nhất."
1404 = "Chỉ có giọng nói. Chỉ có giọng nói của Paulette. Truyền kích thích đến não bộ đang ngập ngụa trong dục vọng xuất tinh của tôi."
1406 = "Cô ấy bắt đầu run rẩy nhè nhẹ."
1408 = "Có thể cử động, có thể ngoáy sâu. Tùy theo ý muốn."
1410 = "Lau đi, liếm lấy, rồi lại lau đi. Không để sót lại dù chỉ một giọt nước bắn lên."
1411 = "Lau chỗ đó và hứng lấy những giọt nước đọng lại…… Tôi ngẫm nghĩ một chút xem nên làm gì."
1414 = "Tăng tốc. Cơ thể ép buộc phải tăng tốc! Làm sao mà bình tĩnh cho nổi chứ!!"
1416 = "Khi được hỏi, em ấy ngượng ngùng ấp úng. Nhưng, chắc chắn. Chắc chắn là vậy."
1418 = "Thuận theo khao khát của thể xác và tâm hồn, tôi ôm lấy đôi chân Paulette nâng lên."
1419 = "Đang vấy bẩn. Lên làn da không tì vết, lên chiếc tạp dề, lên cả nhà bếp. Tinh dịch đục ngầu của tôi."
1420 = "Vì vậy, rất dễ đoán. Tiếp theo sẽ là một lời thỉnh cầu yếu ớt nào đây."
1422 = "Vì vậy, tôi thì thầm. Thật ngọt ngào, thật chậm rãi, bên tai em."
1432 = "Dứt khỏi nụ hôn, tôi cũng bắt đầu chuyển động hông."
1434 = "Nước tiểu đã ngừng. Nhưng Paulette vẫn còn ướt sũng."
1438 = "Vì vậy, tôi gật đầu. Bây giờ tôi chỉ có thể làm thế chứ chẳng còn cách nào khác."
1446 = "Chính vì tư thế không thoải mái này, cảm giác gắn kết chưa từng có đang bao bọc, hòa tan và đồng hóa chúng tôi một cách mãnh liệt!"
1450 = "Phải rồi—— Tôi đã hứa với Paulette."
1451 = "Đúng vậy. Chính xác là đang ngoáy sâu. Vào phần thịt cô bé của Paulette, vào bên trong âm đạo."
1452 = "Cô bé vừa đi tiểu. Đúng là vậy. Thứ xộc thẳng lên lưỡi đầu tiên là vị nước tiểu nồng đậm hơn. Nhưng——"
1482 = "Mất thăng bằng theo đà, tay Paulette tìm điểm tựa và bám chặt vào bồn rửa."
1483 = "Từ phía Paulette, chiếc lưỡi của em luồn lách vào khoang miệng tôi."
1484 = "Vì tinh thần trách nhiệm của mình, Paulette sẽ dùng giọng điệu ngọt lịm——để đưa ra câu trả lời mà tôi mong đợi."
1485 = "Bất kể ý thức thế nào, có lẽ cơ thể em ấy đã tự tháo gỡ rào cản rồi."
1486 = "Giọng nói buông lỏng, tựa như một tiếng thở hắt ra. Ánh mắt Paulette nhanh chóng dịu lại."
1487 = "Cắn chặt răng bằng đôi môi run rẩy, khó nhọc hé mở từng chút một, lời đồng ý mà Paulette cố gắng thốt ra khiến tôi an lòng."
1488 = "Paulette thích làm bánh, và Reina thì thích giúp một tay."
1489 = "Mồ hôi và những giọt nước nhễ nhại đến nhường này. Chiếc hông không thể dừng lại. Cùng thân nhiệt và mùi hương của một con cái đang động dục tràn trề."
1490 = "Sức chịu đựng của Paulette. Sự bẽn lẽn sâu sắc. Khả năng nắm bắt tình hình. Mặc dù có tất cả những điều đó, nhịp thở của em vẫn gấp gáp. Sự run rẩy ngày càng lớn."
1491 = "Đôi mắt xanh thẳm ngấn nước đang nhìn chằm chằm. Vào dương vật cương cứng dưới lớp quần của tôi——giờ đã cứng đờ như đá."
1492 = "Miệng Paulette hé mở. Đôi mắt ấy chăm chú nhìn tôi."
1493 = "Khuôn mặt đỏ bừng lên ngay lập tức, Paulette lắc đầu nguầy nguậy phản đối dữ dội."
1494 = "Hông Paulette lắc lư bồn chồn. Trông có vẻ dễ chịu——nhưng cũng có chút gì đó sốt ruột."
1495 = "Bằng một giọng điệu hoàn toàn hưng phấn, thế nhưng, Paulette vẫn cố gắng làm tôi bình tĩnh lại——"
1496 = "Giọng nói ngọt ngào xen lẫn tiếng thở dốc. Hơi thở nóng rực, cùng mồ hôi và thân nhiệt."
1497 = "Hông Paulette cũng chuyển động theo. Vì tôi đang đứng ôm em ấy nên tư thế không được vững vàng cho lắm."
1498 = "Có điều gì đó bất thường đang xảy ra với cơ thể Paulette. Nhận ra điều đó——tôi cố gắng giữ giọng điệu và tâm trí bình tĩnh."
1499 = "Bởi vì đôi mắt xanh sâu thẳm, trong veo của Paulette, đang lấp lánh rạng rỡ như mặt hồ tắm mình trong nắng sớm."
1500 = "Đôi mắt xanh biếc đang rung rinh trong làn sóng khoái cảm. Màu sắc hơi đục này, là vẻ đẹp mà trên thế giới này chỉ mình tôi biết."
1501 = "Mồ hôi tí tách rơi xuống bồn rửa, cô bé đã run rẩy liên hồi như đang co giật."
1502 = "Có lẽ do đã mất hết sức lực, cơ thể Paulette không hề nhúc nhích. Nhưng, giọng nói, sức nóng, nhiệt độ, tất cả đều chỉ rõ nơi này là đâu."
1503 = "Phần thịt mềm mại của cô bé Paulette đã tan chảy sền sệt, bám dính lấy dương vật tôi, trượt lên trượt xuống hết lần này đến lần khác."
1504 = "Paulette khẽ lắc đầu. Bộ ngực căng đầy được tôn lên bởi chiếc tạp dề xộc xệch cũng rung lên ngọt ngào."
1505 = "Hông Paulette đẩy ngược lại như để xác nhận."
1507 = "Tuôn trào. Chiếc thau truyền đến một rung động nhẹ."
1512 = "Và rồi. Thật khẽ. Thật tĩnh lặng. Một lời nói. Chỉ một lời duy nhất được thốt ra——"
1513 = "Vậy thì, cứ thế này, đưa em ấy lên giường——"
1515 = "Nhưng tôi vẫn trêu chọc. Dùng phần rãnh quy đầu, cố tình cọ vào phần gốc của âm vật."
1520 = "Và hễ Reina mải mê làm, chiếc thau sẽ rất dễ bị méo mó."
1523 = "Không thể ép sát vào sâu như khi đang nằm. Ở khoảnh khắc cuối cùng của cuối cùng, sự khác biệt về tư thế lại lộ rõ."
1524 = "Lúc này, những nhịp co giật nhẹ nhàng cùng mật ngọt không ngừng trào ra từ bên trong, còn quyến rũ tôi ngọt ngào hơn cả việc mở rộng dang chân ra."
1532 = "Đây hẳn là câu trả lời chính xác."
1535 = "Sự thấu hiểu ngay lập tức dẫn đến giải pháp."
1537 = "Sức nặng và nhiệt độ của chiếc thau tăng lên. Mùi và màu của nước tiểu đậm dần. Đồng thời——sự sốt ruột của tôi cũng vậy."
1538 = "Mực nước trong thau dâng cao, những bọt nước văng tung tóe thậm chí còn bắn ngược lên cơ thể Paulette."
1539 = "Nước tiểu bắt đầu đọng lại trong thau, và ngay lập tức phát ra những tiếng lách tách bắn lên."
1540 = "Định lát nữa sẽ đổ xuống bồn cầu, thứ bên trong, vẫn đang đầy ắp."
1552 = "Tinh dịch sắp sửa vượt quá giới hạn—— Đang điên cuồng chờ đợi lệnh cho phép tiến vào ga, chờ đợi tín hiệu đèn xanh!"
1560 = "Có lẽ vì thế mà những nếp gấp thịt có cảm giác nông hơn, tôi dùng lưỡi cẩn thận lau chùi, liếm sạch mật ngọt như đang rửa ráy."
1561 = "Âm thanh da thịt va chạm. Mật ngọt bắn ra từ nơi giao hợp. Mồ hôi, thân nhiệt và mùi cơ thể nhớp nháp, nhầy nhụa hòa quyện vào nhau——"
1566 = "Và đồng thời, dương vật cương cứng cũng bị cọ xát nóng rực."
1572 = "Vị nước tiểu đã hoàn toàn biến mất khỏi đầu lưỡi."
1581 = "Mật ngọt sền sệt, chảy từ cô bé xuống đùi, xuống mông, tô điểm cho cơ thể chín mọng của Paulette bằng sự quyến rũ và ướt át."
1588 = "Cách để làm cho phần thịt quá đỗi mềm mại của Paulette cứng đờ lại ngay tức khắc——Nếu là cách đó thì tôi biết!"
1594 = "Thành âm đạo quá đỗi đầy đặn, không chỉ từ trên dưới trái phải, mà còn dán chặt những kích thích ngọt ngào từ cả phía trước."
1595 = "Phần thịt cô bé căng mọng, dù căng mọng nhưng tuyệt nhiên không hề cử động để đẩy tôi ra."
1605 = "Tôi cứ tưởng mình đã hiểu rõ đó là lý tưởng, nhưng quả thực với tình huống này thì làm sao mà ứng phó kịp――――hửm!"
1606 = "Điều đó làm tăng thêm khoái cảm, nhưng với tôi thì lại quá đỗi bức bối, khiến hông tôi càng trở nên cuồng bạo hơn."
1607 = "Nụ hôn lần này, là từ cả hai phía."
1608 = "Đầy nũng nịu, và có vẻ bất an. Giọng nói ấy, dù nghe từ đâu cũng nhận ra là của Paulette."
1610 = "Ngay cả những ngón tay cởi quần áo cũng thấy lóng ngóng. Thời gian di chuyển đến giường cũng thật phí phạm."
1614 = "Nếu vậy, cũng giống như khi trao đổi nước bọt cho nhau——"
1615 = "Nếu vậy thì ngay từ đầu đưa em ấy vào nhà vệ sinh còn hơn ……Nhưng giờ mà di chuyển thì chắc chắn sẽ vương vãi khắp nơi."
1617 = "Đang phồng lên. Đang phồng lên dữ dội. Chất lỏng đục ngầu đang trào ngược lên niệu đạo, dồn đến tận quy đầu."
1618 = "Rất muốn đâm vào thật mạnh, nhưng——"
1619 = "Dù mỗi lần chỉ vài giọt nước tiểu, nhưng khi lặp đi lặp lại, thời gian càng trôi qua, vị chát mạnh lẫn với vị mặn bắt đầu nhuốm đậm khoang miệng tôi."
1634 = "（……Nói mới nhớ——Chuyện này. Tôi đã để Paulette phải bày ra một tư thế dâm đãng đến thế này sao.）"
1690 = "（Ngoạm!）"
1691 = "（Bụp!）"
1694 = "（Phập——nhóp——rút——nhép——）"
1696 = "（Liếm! Liếm! Liếmmmm! Trơn tuộtttttt——）"
1698 = "（A……ra là vậy. Vì quá mềm mại, vì đã được nới lỏng. Nên mới nổi lên và trượt ra ngoài sao.）"
1699 = "（Róc——róc rách róc rách róc rách）"
1700 = "（Róc rách）"
1701 = "（Phụt!!）"
1702 = "（Phụt! Phụt! Phụtttt!）"
1704 = "（Phụt! Phụt! Phụtttt! Phụt phụt!）"
1706 = "（Phập! Lắc——nhóp! Phập!）"
1707 = "（Chiếc thau——nhỉ.）"
1709 = "（Đúng rồi……Là vậy đấy.）"
1711 = "（Thế này thì——cần phải đổi vị thôi.）"
1712 = "（Nhấc bổng!?）"
1713 = "（Hự, hự! Hự——tuột——tuột!?）"
1715 = "（Phập——phậpppp——phập!!）"
1716 = "（Phập——phập——phập!）"
1717 = "（Thóp bụng!）"
1718 = "（Đã quá giới hạn rồi mà vẫn cố nhịn—— Không, là do tôi ép em ấy phải nhịn sao.）"
1720 = "（Trơn tuột! Tuột——tuột! Trơn tuột!!）"
1721 = "（Róc——róc rách——……róc……tỏng）"
