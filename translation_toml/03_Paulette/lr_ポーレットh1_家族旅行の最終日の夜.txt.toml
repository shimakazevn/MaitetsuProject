1363 = "Tương tự như vậy, tôi cũng lập tức hiểu được\\nPaulette đang muốn gì, và tất nhiên là tôi sẽ đáp lại."
1370 = "Dù không nói ra tôi cũng hiểu.\\nPaulette mở rộng hai chân, và ở giữa chiếc quần tất――"
1373 = "Chà đạp toàn bộ khoang miệng――đến tận mặt trong của răng, và hút sạch,\\nnuốt trọn toàn bộ lượng nước bọt tràn ra, nụ hôn kết thúc."
1375 = "Đôi mắt xanh biếc khẽ liếc nhìn về phía cánh cửa kéo."
1377 = "Rất tự nhiên, chiếc lưỡi mềm mại tách đôi môi tôi ra và xâm nhập vào trong.\\nChiếc lưỡi Paulette tan chảy ngọt ngào liếm sạch mọi ngóc ngách trong khoang miệng tôi."
1379 = "Khi vòng tay ôm siết chặt hơn, bầu ngực em ấy cũng áp sát vào vòm ngực tôi.\\nVừa ấm áp, vừa mềm mại, mùi hương lại thơm ngát, xúc cảm làn da cũng thật tuyệt vời."
1380 = "Nếu cánh cửa kéo bị mở ra, tôi vẫn đang mặc quần áo che lên người em ấy\\nvà cứ thế giả vờ ngủ là xong. Vì vậy――"
1385 = "Lũ trẻ đã ngủ say. Căn phòng kiểu Nhật rộng lớn được ngăn cách bằng cửa kéo fusuma.\\nTrải đệm riêng ra và đóng cửa kéo lại, thế là thành \"Phòng ngủ của vợ chồng\"."
1386 = "Bắn tinh vào trong người mẹ, ngay bên cạnh đứa con đang ngủ say chỉ cách một cánh cửa kéo.\\nCảm giác tội lỗi và căng thẳng khi đi du lịch càng làm mực tinh dịch dâng cao."
1403 = "Em ấy liều mạng cắn răng kìm lại tiếng rên suýt bật ra.\\nDáng vẻ ấy thật đáng yêu, thật kiên cường và quá đỗi khiến tôi yêu thương――"
1407 = "Bị siết chặt một cách mềm mại và khít khao.\\nNhững ngón tay bị bức tường thịt bao bọc chặt chẽ từ mọi phía."
1409 = "Thứ ấm áp ấy dần chuyển hóa thành một luồng nhiệt vẩn đục.\\nCó lẽ do tư thế không quen thuộc. Những chuyển động vụng về càng khiến tôi thêm nôn nóng."
1418 = "Cơ quan sinh dục cọ xát vào nhau.\\nHết lần này đến lần khác, chầm chậm như để làm quen với nhau."
1421 = "Bị những ngón tay khoét sâu vào cơ quan sinh dục, khuôn mặt nhuốm màu đỏ ửng ấy, mỉm cười.\\nNhẹ nhàng, đáng yêu, hệt như một nụ hoa chớm nở."
1427 = "Tôi liên tục bắt lấy Paulette mỗi khi cô ấy dừng lại để thở và tiếp tục hôn.\\nĐồng thời vẫn không ngừng duy trì những nhịp lắc eo nhỏ nhặt."
1429 = "Vừa nói, tôi vừa giữ chặt phần gốc của dương vật đang cương cứng.\\nPaulette ngay lập tức điều chỉnh hông cho khớp"
1437 = "Vừa hôn nhau, vừa áp sát vào nhau,\\ntôi liên tục lắc eo từng nhịp nhỏ."
1438 = "Dù cả hai đã nuốt xuống không biết bao nhiêu lần, nước bọt vẫn không ngừng nhỏ giọt.\\nNước bọt rơi xuống hòa quyện cùng mồ hôi, chảy ròng ròng xuống tận nơi giao hợp."
1439 = "Tôi nín thở. Nghe ngóng tình hình. ……………………. Ổn rồi.\\nBên kia cánh cửa kéo chỉ có hơi thở đều đều của người đang say giấc nồng."
1440 = "Vừa hôn nhau, vừa ôm nhau, hông của Paulette\\náp sát vào cơ quan sinh dục của tôi, và chầm chậm chuyển động."
1441 = "Nụ hôn trở nên cuồng nhiệt hơn.\\nĐể không phát ra tiếng rên rỉ khi lên đỉnh. Tôi cũng vậy——"
1442 = "Chúng tôi trao nhau nụ hôn không phải để kiềm nén tiếng rên rỉ, mà vì muốn làm thế.\\nÔm nhau không phải để che giấu cơ thể, mà vì muốn ôm lấy nhau."
1444 = "Tôi lên tiếng ngăn lại bàn tay đang định che giấu của Paulette,\\nchụm ngón giữa và ngón trỏ lại với nhau――"
1447 = "Mồ hôi túa ra. Paulette cũng đang ướt đẫm mồ hôi.\\nLàn da dính sát vào nhau trơn trượt, càng làm tăng thêm khoái cảm."
1448 = "Tôi kìm nén sự nôn nóng và từ từ rút tay ra.\\nGiờ không phải là lúc để cho ngón tay vào nữa."
1451 = "Tôi dùng mặt lưng của đốt ngón tay thứ hai vuốt ve phần thô ráp ở phía trên.\\nĐầu ngón tay gập lại thành hình chữ V ngược, vừa ấn vừa cọ xát và vỗ nhẹ vào đáy âm đạo."
1452 = "Tôi từ từ gập các ngón tay lại, thay đổi góc độ rồi ấn và cọ xát.\\nDù có vùng vẫy thế nào thì lớp thịt âm đạo vẫn cứ dồn dập ép sát vào."
1453 = "Tôi lấy cây bút dùng để ghi chú ra khỏi túi, rồi dùng đầu bút móc vào đó."
1455 = "Một cảm xúc mạnh mẽ bất ngờ ập đến. Sự ghen tị và tán dương dành cho chính bản thân mình trong quá khứ.\\nĐã xuất tinh vào trong và làm cho Paulette xinh đẹp này mang thai――"
1457 = "Tôi nhấc bổng Paulette lên và đặt em ấy ngồi trọn vào lòng mình.\\nVừa ôm nhau, tôi vừa thì thầm vào khuôn mặt xinh đẹp ngay sát bên cạnh."
1459 = "Tôi nhoài người tới, nắm chặt lấy đôi chân của cô ấy.\\nĐể đêm du lịch gia đình này——vẫn chưa thể kết thúc."
1461 = "Rất khó để xác định \"chỗ đó\" là chỗ nào.\\nVì vậy, tôi chỉ đơn thuần lặp lại cùng một động tác với cùng một nhịp điệu."
1463 = "Đến giờ tôi mới nhận ra, đó là một điều vô cùng kỳ diệu, cao cả. Và đầy bí ẩn.\\nVì thế, tôi muốn kiểm chứng nó một cách thật cẩn thận."
1465 = "Trong một phạm vi hẹp, tôi dùng sức mạnh nhất có thể.\\nChuyển động đơn giản đó càng khiến trái tim chúng tôi hòa nhịp."
1466 = "Khoảnh khắc đó, âm đạo của Paulette run rẩy.\\nCó lẽ do ảnh hưởng từ đó, mật dịch cũng trào ra"
1469 = "Chưa thèm cởi quần, tôi ép đũng quần mình vào cọ xát.\\nVào đũng quần đang mặc quần tất của em ấy, chắc hẳn cũng đang nóng hầm hập giống như tôi."
1471 = "Kéo áo lót xuống và trêu đùa bầu ngực, tiếng rên rỉ vừa cất lên đã lập tức bị nuốt ngược vào trong.\\nTôi dùng ngón tay chậm rãi vuốt ve quanh núm vú đang cương cứng hoàn toàn."
1472 = "Tôi khẽ cọ xát gò má mình vào má em ấy.\\nChỉ bấy nhiêu thôi, Paulette đã phát ra một giọng nói ngọt ngào như muốn tan chảy."
1475 = "Vừa nói tôi vừa đặt nụ hôn lên mái tóc em ấy,\\nrồi tiến dần đến tai, mí mắt, và gò má――"
1477 = "Do đó, tôi chỉ có thể lặp đi lặp lại cùng một động tác, động tác mang lại khoái cảm nhất.\\nThật đơn điệu, vô cùng đơn điệu. Nhưng điều đó lại càng làm tăng thêm cảm giác hòa làm một."
1479 = "Nhờ vậy mà dương vật nhanh chóng lấy lại độ cương cứng.\\nDù là điều hiển nhiên, tôi vẫn cố tình nói ra."
1481 = "Khi hai môi lớn mở ra, mọi suy nghĩ trong tôi như bị xóa nhòa.\\nChẳng thể tin được là đã từng sinh nở, trông nó chẳng khác gì như lúc ban sơ."
1485 = "Động tác nâng lên hạ xuống cơ thể khiến cánh tay tôi dần trở nên nhức mỏi.\\nNhưng, gấp nhiều lần thế nữa——là những cơn co thắt ngắt quãng quá mức mãnh liệt."
1493 = "Ấn, đè bẹp, cọ xát, xoay tròn, cọ xát, véo, vuốt ve, trêu đùa.\\nTôi dùng mọi kỹ năng có thể nghĩ ra để âu yếm núm vú em ấy."
1495 = "Dù tôi chưa xuất tinh lần nào, dù chưa để em lên đỉnh lần nào,\\nnhưng mùi hương nhục dục đã trở nên nồng nặc đến mức nghẹt thở."
1497 = "Chính vì vậy, tôi không thể chỉ chạm vào một phía.\\nCho đến khi cảm xúc của cả hai hòa hợp, dù có bức bối đến đâu tôi cũng sẽ chịu đựng."
1500 = "Mỗi lần tôi khẽ lắc eo, toàn bộ da thịt trơn trượt lại cọ xát vào nhau.\\nĐôi gò bồng đảo căng mọng của Paulette ép chặt lên lồng ngực tôi đến biến dạng."
1504 = "Không thể thoải mái lắc eo. Nếu hai người không phối hợp nhịp nhàng,\\nthì ngay cả những cử động lớn cũng không thể làm được."
1520 = "Tôi khẽ thổi một hơi.\\nCơ thể Paulette run rẩy quằn quại."
1521 = "Paulette lại nằm lăn ra.\\nDang rộng hai chân, phơi bày âm đạo vừa mới bị bắn tinh vào——"
1522 = "Cô ấy phồng má, rồi vội xẹp xuống, mặt đỏ bừng vì ngượng.\\nChỉ một cái phồng má thôi cũng đáng yêu và chọc người thương đến vậy."
1523 = "Giọng Paulette the thé vang lên.\\nNhịp thở trở nên nông và gấp gáp, đôi mắt cũng đờ đẫn tan chảy."
1524 = "Bầu ngực của Paulette, dù đã qua bao nhiêu năm sau khi sinh, vẫn không hề xẹp đi chút nào.\\nThậm chí còn trở nên căng mọng hơn, đặc biệt là phần núm vú――"
1525 = "Đôi mắt Paulette lấp lánh. Lấp lánh——một cách dâm đãng.\\nBây giờ có lẽ cô ấy sẽ chấp nhận bất kỳ tư thế nào."
1526 = "Những ngón tay trắng ngần của Paulette, chầm chậm đưa xuống vùng kín của chính mình.\\nBên dưới vết rách của quần tất, chiếc quần lót màu hồng――"
1527 = "Bức tường thịt của Paulette thu hẹp lại và uốn lượn,\\nnhư muốn vắt kiệt tinh trùng từ những ngón tay của tôi."
1528 = "Dùng cả hai tay hai chân để tóm lấy tôi, với sức mạnh của một cái ôm,\\nPaulette từ từ, từ từ nuốt trọn dương vật đang cương cứng của tôi."
1529 = "Paulette cũng có chung cảm xúc với tôi. Trở thành một con đực và một con cái đơn thuần,\\nmuốn đè lên nhau, đâm xuyên qua nhau, và thỏa sức lắc hông."
1530 = "Khép lại đôi môi đang định chu lên hờn dỗi,\\nPaulette ngước ánh nhìn lên trên. Chăm chú nhìn vào đũng quần tôi."
1531 = "Cô ấy buông nụ hôn và gọi tên tôi. Dù không nói ra thì tôi cũng hiểu.\\nBởi vì sự co thắt từ âm đạo của Paulette đang thúc giục tôi xuất tinh."
1539 = "Sau khi sinh Hikari, ngực của Paulette rõ ràng đã to lên.\\nTôi cũng từng nghe nói ai sinh xong cũng vậy. Nhưng――"
1541 = "Ở tư thế truyền thống, tôi sẽ không thể kiềm chế được xung động muốn đâm rút hết cỡ,\\nâm thanh va chạm của da thịt chắc chắn sẽ rất lớn."
1545 = "Dương vật đang phình to ra. Âm đạo thì siết chặt lại.\\nCảm giác áp sát tăng lên đến tột độ, dù vẫn là những chuyển động như lúc nãy——"
1549 = "Quả thực là một nụ hôn. Cơ quan sinh dục với cơ quan sinh dục, da thịt với da thịt, thậm chí cả tóc và móng tay.\\nTất cả những phần chạm vào nhau đều đang níu kéo, quấn quýt lấy nhau. Vì thế――"
1551 = "Tinh dịch đặc quánh tích tụ bấy lâu nay\\nđang bắn ra và dính chặt vào thành âm đạo của Paulette."
1552 = "Khoái cảm quá đỗi mãnh liệt và đột ngột khiến nhịp thở của Paulette rối loạn trầm trọng.\\nNhưng, tôi không thể chờ đợi được nữa. Không thể kìm nén thêm một chút nào nữa."
1555 = "Khoảnh khắc vén chiếc áo len lên, mùi hương phụ nữ thoang thoảng bay tới.\\nNồng đậm gấp mấy lần hương thơm của một \"người mẹ\" sau chuyến du lịch gia đình dài một ngày."
1558 = "Nơi sâu thẳm nhất của âm đạo và phần đỉnh quy đầu. Nụ hôn giữa những phần nhạy cảm nhất của nhục dục\\nlại càng――sướng đến mức làm tan chảy cả não bộ và xương cụt――"
1565 = "Khi tôi đè em ấy xuống đệm, một giọng nói chào đón vang lên.\\nHơi nóng và nhịp thở vô cùng ngọt ngào, mang theo chút ẩm ướt trêu chọc tôi."
1570 = "Vì thế, tôi muốn ôm em. Nhưng lại bận tâm phía bên kia cánh cửa kéo,\\nnên không thể mở lời mời gọi một cách tự nhiên như mọi khi."
1571 = "Tư thế này được chọn để có thể dễ dàng che giấu nếu có chuyện gì xảy ra.\\nKhông thể thoải mái cử động. Cũng không thể lắc eo quá mạnh."
1573 = "Qua chuyến du lịch gia đình này, tôi đã nhận ra sâu sắc. Lại một lần nữa được khắc sâu vào tâm trí.\\nRằng vợ tôi, là một người mẹ vô cùng chan chứa tình yêu thương, và là một người phụ nữ tuyệt vời nhất."
1578 = "Cùng với một tiếng thở hắt ra nhỏ bé, nụ hôn tách rời.\\nKhi trán chúng tôi khẽ chạm vào nhau, hương thơm từ mái tóc em ấy làm sống mũi tôi ngưa ngứa."
1579 = "Cùng với sự lan tỏa của hương thơm và sự thấu hiểu,\\nmột thứ gì đó ấm áp cũng từ từ lan tỏa trong tôi."
1582 = "Vừa dứt lời, dù đang thở dốc nhưng Paulette vẫn ngay lập tức đáp lại tôi."
1588 = "Thể lực đã cạn kiệt, lần xuất tinh này cũng quá mãnh liệt.\\nSự suy nhược tựa như cảm giác mất mát đột ngột bao trùm toàn thân tôi. Nhưng——"
1590 = "Cảm giác bám sát như thể phần đỉnh quy đầu đang bị hút vào.\\nKhoái cảm khi phần đầu bị nuốt trọn một chút ấy khiến――"
1592 = "（Chụt——Phụt）"
1610 = "（Nhấc bổng）"
1662 = "（Co thắt dữ dội!!!）"
1663 = "（Cử động——Cử động——）"
1664 = "（Ép——Ngoáy——Bóp——Chụt!）"
1665 = "（Ép——Ngoáy）"
1666 = "（Hự——Phụt——Phập——）"
1667 = "（Ép sát）"
1669 = "（Phụt——phụt, phụt——phụt——phụt……phụt——）"
1671 = "（Phụt——phụt——phụt——phụt——）"
1672 = "（Đâm sâu）"
1674 = "（Phụt! Phụt! Phụt! Phụt!）"
1676 = "（Phụt! Phụt! Phụt! Phụt!!）"
1678 = "（Đâm vào——cọ ra——cọ vào——cọ ra）"
1679 = "（Chọc——Cọ xát! Ngoáy sâu——Cọ xát!）"
1682 = "（Tách ra）"
1684 = "（Rút ra——đẩy vào――――lút cán!!!）"
1686 = "（Ngoáy——Móc——Nắn bóp——Cọ xát）"
1688 = "（Bóp nhẹ）"
1689 = "（Nắn bóp——Mềm mại——Mềm mại! Phụt）"
1690 = "（Cọ xát! Xoa nắn! Cọ xát! Xoa nắn!）"
1693 = "（Xuyên vào）"
1694 = "（Đâm vào——rút ra——đâm vào!\\nCọ xát——rút ra——đâm vào!!）"
1696 = "（Đâm vào——rút ra——cọ xát——nhào nặn）"
1697 = "（Phập——Phập——Nhóp——Nhép）"
1699 = "（Đâm vào——đẩy tới——lút cán!\\nRút ra——đẩy tới——lút cán!）"
1700 = "（Thọc——thọc——nhóp nhép——nhóp nhép——）"
1701 = "（Ngoáy, cọ xát, nhóp nhép, mút）"
1702 = "（Vạch ra）"
1705 = "（Nhóp nhép）"
1706 = "(Đè xuống)"
1707 = "（Đút vào）"
1709 = "（Siết! Siết! Siết chặt!）"
1711 = "（Phập!!! Thúc mạnh!!）"
