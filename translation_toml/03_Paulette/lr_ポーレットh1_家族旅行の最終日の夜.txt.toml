1100 = "「Ưm! ――Phù――A――Ngón tay――ưm! Đột nhiên――hai, ngón――hi――a――」"
1102 = "「Ưm!」"
1103 = "「Ưm!!!!」"
1105 = "「Vâng, chuyện gì vậy? Anh Soutetsu」"
1106 = "「Ừ, sướng tuyệt đỉnh luôn」"
1108 = "「À, vậy thì mặc lại cũng khó chịu thật nhỉ. Xin lỗi em. Anh cứ nghĩ làm trong lúc mặc đồ thì cách này là tốt nhất」"
1109 = "「Hửm?」"
1111 = "「Hửm? Dầu gội khác với mọi khi sao―― À」"
