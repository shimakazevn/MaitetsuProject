697 = "――Được kéo lệch sang một bên, khẽ mở rộng ra. Âm đạo ướt át bóng loáng, khiến tôi dán chặt mắt vào không thể rời đi."
700 = "――Phồng to hơn trước, thậm chí còn tỏa ra vẻ tươi tắn, không ngừng quyến rũ tôi một cách ma mị, như thể muốn được cắn, được véo."
705 = "「——」"
707 = "「――Anh không muốn phá hỏng đêm yên bình của chuyến du lịch gia đình đâu. Em phải cố gắng kìm nén giọng nói đấy nhé?」"
712 = "「『Dễ che giấu hơn』. Đúng không? Anh hiểu rồi」"
716 = "「…………」"
726 = "「……Liệu có thụ thai không nhỉ? Em trai, hoặc em gái của Hikari và Reina ấy」"
728 = "「……Cả Hikari và Reina, em còn chưa kịp dỗ ngủ nữa. Vừa chui vào chăn là hai đứa ngủ khò khò luôn rồi」"
730 = "「……Vừa đặc, vừa nóng——ưm——nhơm nhớp…… A——của anh Soutetsu——đầy ắp, trong âm đạo rồi……」"
732 = "「……Vào một đêm như thế này, họ sẽ lén lút, kìm nén giọng nói―― Nhưng chắc chắn……họ sẽ làm tình――làm tình――ưm」"
733 = "「……Đẹp quá」"
736 = "「……Nơi sâu thẳm này, ngón tay không thể chạm tới được」"
738 = "「………………. Dù chẳng làm chuyện gì xấu, nhưng không hiểu sao lại cứ thấy căng thẳng thế này」"
742 = "「……Quả đúng là đêm của chuyến du lịch gia đình nhỉ」"
949 = "「Chắc chắn là vậy rồi. Nhất định là thế. Làm sao mà nhịn được chứ」"
953 = "「Nếu không phải là muốn anh làm――thì là gì?」"
956 = "「Không được. Đẹp thế này cơ mà」"
958 = "「Nhưng mà nhé? Paulette——」"
959 = "「A, ừm, không phải là em muốn anh làm, mà là」"
961 = "「Nói cách khác, em muốn làm trong lúc vẫn đang mặc đồ sao」"
963 = "「Nghĩ kỹ thì việc mặc lại lần hai cũng chẳng có gì to tát đâu nhỉ. Chỉ cần chịu khó đến cửa hàng tiện lợi, thì có thể vào nhà vệ sinh thay đồ mới ngay mà」"
967 = "「Em muốn, anh làm gì?」"
969 = "「Từ sau khi sinh Hikari, cơ thể chúng ta càng trở nên hòa hợp hơn. Dù chỉ là một tiếp xúc nhỏ bé thế này thôi――」"
971 = "「『Làm trong lúc vẫn mặc đồ』, chắc chắn là yêu cầu của em rồi nhỉ」"
972 = "「Tiếng em lớn quá. Lỡ đánh thức mọi người dậy, rồi phải dừng lại giữa chừng thì chịu sao nổi.」"
976 = "「Nếu chỉ có âm đạo, chỉ có đường âm đạo, hay chỉ có tử cung, thì tuyệt đối không thể nào tạo ra một đứa trẻ được nhỉ」"
979 = "「Dù em có nói vậy. Em bảo là \"không phải là muốn anh làm\" mà」"
984 = "「Nhưng có một điều anh chắc chắn.」"
985 = "「Ra là vậy」"
992 = "「Anh chỉ thấy, căng thẳng thôi sao?」"
994 = "「Càng xuất tinh vào trong nhiều lần」"
995 = "「A――em muốn, em muốn anh làm, cho em――ưm, Bởi anh Soutetsu――bởi người chồng, mà em yêu nhất」"
