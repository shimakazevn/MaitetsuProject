1124 = "「Vâng……ưm――phù――Thật nhiều, thật nhiều―― Tinh trùng, em――sẽ nhận lấy――từ anh Soutetsu」"
1126 = "「Vâng! Vâng――Anh Soutetsu――ưm」"
1129 = "「Toàn bộ dương vật từ gốc đến ngọn đều bị—— Lớp thịt âm đạo siết chặt——cứ như đang vắt sữa vậy——」"
1131 = "「Đúng……vậy……mà――Bởi vì…… Bởi vì――a――nó nóng, đến mức――này, cơ mà――」"
1134 = "「Chính là chỗ này, nhỉ」"
1136 = "「Thì phải ở trong một tư thế dễ che giấu」"
1137 = "「Dương vật của anh, sẽ khoét sâu, cọ xát, và gõ cửa. Rót tinh trùng vào tràn trề, ồ ạt」"
1140 = "「Anh không định mở rộng nó ra bằng sức mạnh đâu. Chỉ là――」"
1142 = "「Hai chúng ta, cùng nhau. Đã trở thành một người mẹ và một người cha」"
1144 = "「Anh chỉ nghĩ, là từ nơi này. Toàn bộ sinh mệnh của Hikari đã được sinh ra từ nơi này」"
1145 = "「Em, trong suốt chuyến du lịch, đã luôn, luôn cố nhịn. Em nghĩ anh Soutetsu, chắc chắn cũng vậy」"
1149 = "「Anh biết mà, Paulette. Nơi duy nhất anh muốn rót trào lượng tinh dịch đã dồn nén bấy lâu nay, chỉ có thể là một chỗ mà thôi」"
1151 = "「Anh đã định rủ em đi tắm rồi thay yukata…… và vài chuyện khác nữa cơ」"
1153 = "「Chắc chắn, thực tế là, chúng đang――hôn nhau đấy―― Anh Soutetsu, và――em, bất cứ nơi nào, chạm vào nhau, cũng vậy」"
1155 = "「Anh chuyển động đây. Paulette」"
1156 = "「Nhỉ? Nếu vậy thì, anh Soutetsu」"
1157 = "「Phương án đó là」"
1163 = "「Nếu mặc, yukata……」"
1165 = "「Vậy thì——này, thêm lần nữa nhé——chụt」"
1169 = "「Đúng vậy. Mỗi lần chạm vào đó——anh cũng bị siết chặt dữ dội.」"
1172 = "「Đúng vậy nhỉ. Sướng hơn trước kia rất nhiều. Anh thậm chí còn có cảm giác như da thịt chúng ta đang hút chặt lấy nhau vậy」"
1174 = "「Vâng. Và chắc chắn là, dù ở gia đình nào, những người làm cha, làm mẹ nào cũng vậy」"
1175 = "「Ừ」"
1176 = "「Vậy sao. Nếu thế thì tốt quá rồi」"
1177 = "「Vậy sao」"
1179 = "「Vâng, đúng vậy. Anh Soutetsu」"
1181 = "「Vâng, ufufu. Vì là dầu gội trong phòng tắm của nhà trọ mà, chắc chắn hôm nay anh Soutetsu, Hikari và cả Reina đều dùng chung một loại」"
1182 = "「Anh Soutetsu――đã biến em…… Biến em――trở thành――một người mẹ」"
1184 = "「Đến, mức đó……ưm――hà――a――ưm―― Ưm fu――sướng……lắm……sao?――a」"
1185 = "「Em định cho hai đứa đi tắm trước cơ, nhưng trông có vẻ kiệt sức lắm rồi. Nên em chỉ thay yukata cho hai đứa thôi」"
1189 = "「Đúng vậy. Hơn nữa――lỡ như đánh thức bọn trẻ dậy」"
1190 = "「Không sao. Anh có một phương án thay thế tuyệt vời.」"
1195 = "「Paulette. Một lần nữa――bao nhiêu lần cũng được. Chúng ta, hãy cùng nhau làm cha làm mẹ nhé」"
1196 = "「Paulette——!」"
1199 = "「Nếu lỡ bị tuột ra―― Đến lúc có chuyện gì, có vẻ khó mà che giấu được」"
1201 = "「Rê ryu——ryu! Chu ru ru ru——（Ực） Pha——nè, anh Soutetsu——ưm——chu, chu mu!」"
1203 = "「Liếm――liếm――liếm――trơn tuột―― Chụt――chùn chụt――zuju――zu――（ực）」"
1207 = "「Hiếm lắm mới có chuyến du lịch gia đình. Khó khăn lắm, bọn trẻ mới chịu ngủ say」"
1208 = "「Lần thứ hai rồi mà. Chuyển động hay âm thanh, em nghĩ mình sẽ kiềm chế tốt hơn nhiều đấy.」"
1209 = "「Có chuyện còn quan trọng hơn thế nhiều」"
1210 = "「Nếu nói về hưng phấn, thì còn gấp mấy lần căng thẳng cơ」"
1212 = "「Lần đầu tiên chúng ta ân ái, anh đã kinh ngạc không ngờ trên đời này lại có thứ khoái cảm nhường này, nhưng」"
1215 = "「Giọng em kìa.」"
1218 = "「Hà――a――Anh, Soutetsu――em―― Râm ran――râm ran, mất, rồi」"
1219 = "「Hà」"
1220 = "「Haaa! A! ——Ưm!? Chụt—— rê ru——rê ryu——chu ru——chụt——chụt」"
1221 = "「A, thiệt tình, xé rách thế này thì―― Đang đi du lịch đấy nhé? Em đâu có mang theo đồ dự phòng đâu」"
1222 = "「Đúng là……như vậy――ưm――nhưng chỉ một mình em ――thì tuyệt đối, không thể, làm được, mà」"
1223 = "「Chà. Ai mà biết được. Chuyện đó thì anh chịu thôi.」"
1231 = "「Điều đó, thì chắc chắn rồi――」"
1232 = "「Chà, khó nói lắm.」"
1233 = "「Không được lãng phí dù chỉ một giây. Phải tận hưởng trọn vẹn cùng anh Soutetsu, đúng không nào?」"
1234 = "「Vì chỗ này lạnh nên em mặc đồ ấm―― Thế nên em, đổ mồ hôi, khá nhiều」"
1236 = "「Chuyện đó, ừm. Paulette」"
1237 = "「Anh Soutetsu」"
1238 = "「Ngay cả lúc anh dùng ngón tay yêu thương em, phía trước quần của anh Soutetsu cũng căng cứng, trông có vẻ rất khổ sở. Thế nên」"
1333 = "Bị vuốt ve nhè nhẹ nơi đũng quần, mọi sự chuẩn bị trong đầu tôi bay sạch."
1335 = "Cảm giác muốn xuất tinh khác hẳn mọi khi râm ran, râm ran dâng trào. Như thủy triều dâng, chầm chậm, từ từ dâng lên."
1337 = "Mặc dù vậy, tôi vẫn dần dần cảm nhận được cấu trúc bên trong âm đạo. Cả việc chạm vào đâu thì phản ứng của Paulette sẽ mãnh liệt hơn nữa."
1342 = "Paulette áp môi vào và lập tức hé mở. Những núm vú căng mọng tràn ra khỏi áo lót đang cọ xát nhột nhạt vào vòm ngực tôi."
1347 = "Nhưng nếu cứ thế này mà làm thì kiểu gì cũng sẽ phát ra âm thanh. Giọng nói có lẽ cũng sẽ không thể nào kìm nén được nữa. Vì thế――"
1355 = "Hai ngón tay. Tất nhiên là nhỏ hơn rất nhiều so với dương vật đang cương cứng. Dù vậy, chúng vẫn bị lớp thịt mềm mại nóng hổi siết chặt đến mức tưởng chừng như sắp đứt lìa."
1363 = "Tương tự như vậy, tôi cũng lập tức hiểu được Paulette đang muốn gì, và tất nhiên là tôi sẽ đáp lại."
1370 = "Dù không nói ra tôi cũng hiểu. Paulette mở rộng hai chân, và ở giữa chiếc quần tất――"
1373 = "Chà đạp toàn bộ khoang miệng――đến tận mặt trong của răng, và hút sạch, nuốt trọn toàn bộ lượng nước bọt tràn ra, nụ hôn kết thúc."
1375 = "Đôi mắt xanh biếc khẽ liếc nhìn về phía cánh cửa kéo."
1377 = "Rất tự nhiên, chiếc lưỡi mềm mại tách đôi môi tôi ra và xâm nhập vào trong. Chiếc lưỡi Paulette tan chảy ngọt ngào liếm sạch mọi ngóc ngách trong khoang miệng tôi."
1379 = "Khi vòng tay ôm siết chặt hơn, bầu ngực em ấy cũng áp sát vào vòm ngực tôi. Vừa ấm áp, vừa mềm mại, mùi hương lại thơm ngát, xúc cảm làn da cũng thật tuyệt vời."
1380 = "Nếu cánh cửa kéo bị mở ra, tôi vẫn đang mặc quần áo che lên người em ấy và cứ thế giả vờ ngủ là xong. Vì vậy――"
1385 = "Lũ trẻ đã ngủ say. Căn phòng kiểu Nhật rộng lớn được ngăn cách bằng cửa kéo fusuma. Trải đệm riêng ra và đóng cửa kéo lại, thế là thành \"Phòng ngủ của vợ chồng\"."
1386 = "Bắn tinh vào trong người mẹ, ngay bên cạnh đứa con đang ngủ say chỉ cách một cánh cửa kéo. Cảm giác tội lỗi và căng thẳng khi đi du lịch càng làm mực tinh dịch dâng cao."
1403 = "Em ấy liều mạng cắn răng kìm lại tiếng rên suýt bật ra. Dáng vẻ ấy thật đáng yêu, thật kiên cường và quá đỗi khiến tôi yêu thương――"
1407 = "Bị siết chặt một cách mềm mại và khít khao. Những ngón tay bị bức tường thịt bao bọc chặt chẽ từ mọi phía."
1409 = "Thứ ấm áp ấy dần chuyển hóa thành một luồng nhiệt vẩn đục. Có lẽ do tư thế không quen thuộc. Những chuyển động vụng về càng khiến tôi thêm nôn nóng."
1418 = "Cơ quan sinh dục cọ xát vào nhau. Hết lần này đến lần khác, chầm chậm như để làm quen với nhau."
1421 = "Bị những ngón tay khoét sâu vào cơ quan sinh dục, khuôn mặt nhuốm màu đỏ ửng ấy, mỉm cười. Nhẹ nhàng, đáng yêu, hệt như một nụ hoa chớm nở."
1427 = "Tôi liên tục bắt lấy Paulette mỗi khi cô ấy dừng lại để thở và tiếp tục hôn. Đồng thời vẫn không ngừng duy trì những nhịp lắc eo nhỏ nhặt."
1429 = "Vừa nói, tôi vừa giữ chặt phần gốc của dương vật đang cương cứng. Paulette ngay lập tức điều chỉnh hông cho khớp"
1437 = "Vừa hôn nhau, vừa áp sát vào nhau, tôi liên tục lắc eo từng nhịp nhỏ."
1438 = "Dù cả hai đã nuốt xuống không biết bao nhiêu lần, nước bọt vẫn không ngừng nhỏ giọt. Nước bọt rơi xuống hòa quyện cùng mồ hôi, chảy ròng ròng xuống tận nơi giao hợp."
1439 = "Tôi nín thở. Nghe ngóng tình hình. ……………………. Ổn rồi. Bên kia cánh cửa kéo chỉ có hơi thở đều đều của người đang say giấc nồng."
1440 = "Vừa hôn nhau, vừa ôm nhau, hông của Paulette áp sát vào cơ quan sinh dục của tôi, và chầm chậm chuyển động."
1441 = "Nụ hôn trở nên cuồng nhiệt hơn. Để không phát ra tiếng rên rỉ khi lên đỉnh. Tôi cũng vậy——"
1442 = "Chúng tôi trao nhau nụ hôn không phải để kiềm nén tiếng rên rỉ, mà vì muốn làm thế. Ôm nhau không phải để che giấu cơ thể, mà vì muốn ôm lấy nhau."
1444 = "Tôi lên tiếng ngăn lại bàn tay đang định che giấu của Paulette, chụm ngón giữa và ngón trỏ lại với nhau――"
1447 = "Mồ hôi túa ra. Paulette cũng đang ướt đẫm mồ hôi. Làn da dính sát vào nhau trơn trượt, càng làm tăng thêm khoái cảm."
1448 = "Tôi kìm nén sự nôn nóng và từ từ rút tay ra. Giờ không phải là lúc để cho ngón tay vào nữa."
1451 = "Tôi dùng mặt lưng của đốt ngón tay thứ hai vuốt ve phần thô ráp ở phía trên. Đầu ngón tay gập lại thành hình chữ V ngược, vừa ấn vừa cọ xát và vỗ nhẹ vào đáy âm đạo."
1452 = "Tôi từ từ gập các ngón tay lại, thay đổi góc độ rồi ấn và cọ xát. Dù có vùng vẫy thế nào thì lớp thịt âm đạo vẫn cứ dồn dập ép sát vào."
1453 = "Tôi lấy cây bút dùng để ghi chú ra khỏi túi, rồi dùng đầu bút móc vào đó."
1455 = "Một cảm xúc mạnh mẽ bất ngờ ập đến. Sự ghen tị và tán dương dành cho chính bản thân mình trong quá khứ. Đã xuất tinh vào trong và làm cho Paulette xinh đẹp này mang thai――"
1457 = "Tôi nhấc bổng Paulette lên và đặt em ấy ngồi trọn vào lòng mình. Vừa ôm nhau, tôi vừa thì thầm vào khuôn mặt xinh đẹp ngay sát bên cạnh."
1459 = "Tôi nhoài người tới, nắm chặt lấy đôi chân của cô ấy. Để đêm du lịch gia đình này——vẫn chưa thể kết thúc."
1461 = "Rất khó để xác định \"chỗ đó\" là chỗ nào. Vì vậy, tôi chỉ đơn thuần lặp lại cùng một động tác với cùng một nhịp điệu."
1463 = "Đến giờ tôi mới nhận ra, đó là một điều vô cùng kỳ diệu, cao cả. Và đầy bí ẩn. Vì thế, tôi muốn kiểm chứng nó một cách thật cẩn thận."
1465 = "Trong một phạm vi hẹp, tôi dùng sức mạnh nhất có thể. Chuyển động đơn giản đó càng khiến trái tim chúng tôi hòa nhịp."
1466 = "Khoảnh khắc đó, âm đạo của Paulette run rẩy. Có lẽ do ảnh hưởng từ đó, mật dịch cũng trào ra"
1469 = "Chưa thèm cởi quần, tôi ép đũng quần mình vào cọ xát. Vào đũng quần đang mặc quần tất của em ấy, chắc hẳn cũng đang nóng hầm hập giống như tôi."
1471 = "Kéo áo lót xuống và trêu đùa bầu ngực, tiếng rên rỉ vừa cất lên đã lập tức bị nuốt ngược vào trong. Tôi dùng ngón tay chậm rãi vuốt ve quanh núm vú đang cương cứng hoàn toàn."
1472 = "Tôi khẽ cọ xát gò má mình vào má em ấy. Chỉ bấy nhiêu thôi, Paulette đã phát ra một giọng nói ngọt ngào như muốn tan chảy."
1475 = "Vừa nói tôi vừa đặt nụ hôn lên mái tóc em ấy, rồi tiến dần đến tai, mí mắt, và gò má――"
1477 = "Do đó, tôi chỉ có thể lặp đi lặp lại cùng một động tác, động tác mang lại khoái cảm nhất. Thật đơn điệu, vô cùng đơn điệu. Nhưng điều đó lại càng làm tăng thêm cảm giác hòa làm một."
1479 = "Nhờ vậy mà dương vật nhanh chóng lấy lại độ cương cứng. Dù là điều hiển nhiên, tôi vẫn cố tình nói ra."
1481 = "Khi hai môi lớn mở ra, mọi suy nghĩ trong tôi như bị xóa nhòa. Chẳng thể tin được là đã từng sinh nở, trông nó chẳng khác gì như lúc ban sơ."
1485 = "Động tác nâng lên hạ xuống cơ thể khiến cánh tay tôi dần trở nên nhức mỏi. Nhưng, gấp nhiều lần thế nữa——là những cơn co thắt ngắt quãng quá mức mãnh liệt."
1493 = "Ấn, đè bẹp, cọ xát, xoay tròn, cọ xát, véo, vuốt ve, trêu đùa. Tôi dùng mọi kỹ năng có thể nghĩ ra để âu yếm núm vú em ấy."
1495 = "Dù tôi chưa xuất tinh lần nào, dù chưa để em lên đỉnh lần nào, nhưng mùi hương nhục dục đã trở nên nồng nặc đến mức nghẹt thở."
1497 = "Chính vì vậy, tôi không thể chỉ chạm vào một phía. Cho đến khi cảm xúc của cả hai hòa hợp, dù có bức bối đến đâu tôi cũng sẽ chịu đựng."
1500 = "Mỗi lần tôi khẽ lắc eo, toàn bộ da thịt trơn trượt lại cọ xát vào nhau. Đôi gò bồng đảo căng mọng của Paulette ép chặt lên lồng ngực tôi đến biến dạng."
1504 = "Không thể thoải mái lắc eo. Nếu hai người không phối hợp nhịp nhàng, thì ngay cả những cử động lớn cũng không thể làm được."
1520 = "Tôi khẽ thổi một hơi. Cơ thể Paulette run rẩy quằn quại."
1521 = "Paulette lại nằm lăn ra. Dang rộng hai chân, phơi bày âm đạo vừa mới bị bắn tinh vào——"
1522 = "Cô ấy phồng má, rồi vội xẹp xuống, mặt đỏ bừng vì ngượng. Chỉ một cái phồng má thôi cũng đáng yêu và chọc người thương đến vậy."
1523 = "Giọng Paulette the thé vang lên. Nhịp thở trở nên nông và gấp gáp, đôi mắt cũng đờ đẫn tan chảy."
1524 = "Bầu ngực của Paulette, dù đã qua bao nhiêu năm sau khi sinh, vẫn không hề xẹp đi chút nào. Thậm chí còn trở nên căng mọng hơn, đặc biệt là phần núm vú――"
1525 = "Đôi mắt Paulette lấp lánh. Lấp lánh——một cách dâm đãng. Bây giờ có lẽ cô ấy sẽ chấp nhận bất kỳ tư thế nào."
1526 = "Những ngón tay trắng ngần của Paulette, chầm chậm đưa xuống vùng kín của chính mình. Bên dưới vết rách của quần tất, chiếc quần lót màu hồng――"
1527 = "Bức tường thịt của Paulette thu hẹp lại và uốn lượn, như muốn vắt kiệt tinh trùng từ những ngón tay của tôi."
1528 = "Dùng cả hai tay hai chân để tóm lấy tôi, với sức mạnh của một cái ôm, Paulette từ từ, từ từ nuốt trọn dương vật đang cương cứng của tôi."
1529 = "Paulette cũng có chung cảm xúc với tôi. Trở thành một con đực và một con cái đơn thuần, muốn đè lên nhau, đâm xuyên qua nhau, và thỏa sức lắc hông."
1530 = "Khép lại đôi môi đang định chu lên hờn dỗi, Paulette ngước ánh nhìn lên trên. Chăm chú nhìn vào đũng quần tôi."
1531 = "Cô ấy buông nụ hôn và gọi tên tôi. Dù không nói ra thì tôi cũng hiểu. Bởi vì sự co thắt từ âm đạo của Paulette đang thúc giục tôi xuất tinh."
1539 = "Sau khi sinh Hikari, ngực của Paulette rõ ràng đã to lên. Tôi cũng từng nghe nói ai sinh xong cũng vậy. Nhưng――"
1541 = "Ở tư thế truyền thống, tôi sẽ không thể kiềm chế được xung động muốn đâm rút hết cỡ, âm thanh va chạm của da thịt chắc chắn sẽ rất lớn."
1545 = "Dương vật đang phình to ra. Âm đạo thì siết chặt lại. Cảm giác áp sát tăng lên đến tột độ, dù vẫn là những chuyển động như lúc nãy——"
1549 = "Quả thực là một nụ hôn. Cơ quan sinh dục với cơ quan sinh dục, da thịt với da thịt, thậm chí cả tóc và móng tay. Tất cả những phần chạm vào nhau đều đang níu kéo, quấn quýt lấy nhau. Vì thế――"
1551 = "Tinh dịch đặc quánh tích tụ bấy lâu nay đang bắn ra và dính chặt vào thành âm đạo của Paulette."
1552 = "Khoái cảm quá đỗi mãnh liệt và đột ngột khiến nhịp thở của Paulette rối loạn trầm trọng. Nhưng, tôi không thể chờ đợi được nữa. Không thể kìm nén thêm một chút nào nữa."
1555 = "Khoảnh khắc vén chiếc áo len lên, mùi hương phụ nữ thoang thoảng bay tới. Nồng đậm gấp mấy lần hương thơm của một \"người mẹ\" sau chuyến du lịch gia đình dài một ngày."
1558 = "Nơi sâu thẳm nhất của âm đạo và phần đỉnh quy đầu. Nụ hôn giữa những phần nhạy cảm nhất của nhục dục lại càng――sướng đến mức làm tan chảy cả não bộ và xương cụt――"
1565 = "Khi tôi đè em ấy xuống đệm, một giọng nói chào đón vang lên. Hơi nóng và nhịp thở vô cùng ngọt ngào, mang theo chút ẩm ướt trêu chọc tôi."
1570 = "Vì thế, tôi muốn ôm em. Nhưng lại bận tâm phía bên kia cánh cửa kéo, nên không thể mở lời mời gọi một cách tự nhiên như mọi khi."
1571 = "Tư thế này được chọn để có thể dễ dàng che giấu nếu có chuyện gì xảy ra. Không thể thoải mái cử động. Cũng không thể lắc eo quá mạnh."
1573 = "Qua chuyến du lịch gia đình này, tôi đã nhận ra sâu sắc. Lại một lần nữa được khắc sâu vào tâm trí. Rằng vợ tôi, là một người mẹ vô cùng chan chứa tình yêu thương, và là một người phụ nữ tuyệt vời nhất."
1578 = "Cùng với một tiếng thở hắt ra nhỏ bé, nụ hôn tách rời. Khi trán chúng tôi khẽ chạm vào nhau, hương thơm từ mái tóc em ấy làm sống mũi tôi ngưa ngứa."
1579 = "Cùng với sự lan tỏa của hương thơm và sự thấu hiểu, một thứ gì đó ấm áp cũng từ từ lan tỏa trong tôi."
1582 = "Vừa dứt lời, dù đang thở dốc nhưng Paulette vẫn ngay lập tức đáp lại tôi."
1588 = "Thể lực đã cạn kiệt, lần xuất tinh này cũng quá mãnh liệt. Sự suy nhược tựa như cảm giác mất mát đột ngột bao trùm toàn thân tôi. Nhưng——"
1590 = "Cảm giác bám sát như thể phần đỉnh quy đầu đang bị hút vào. Khoái cảm khi phần đầu bị nuốt trọn một chút ấy khiến――"
1592 = "（Chụt——Phụt）"
1610 = "（Nhấc bổng）"
1662 = "（Co thắt dữ dội!!!）"
1663 = "（Cử động——Cử động——）"
1664 = "（Ép——Ngoáy——Bóp——Chụt!）"
1665 = "（Ép——Ngoáy）"
1666 = "（Hự——Phụt——Phập——）"
1667 = "（Ép sát）"
1669 = "（Phụt——phụt, phụt——phụt——phụt……phụt——）"
1671 = "（Phụt——phụt——phụt——phụt——）"
1672 = "（Đâm sâu）"
1674 = "（Phụt! Phụt! Phụt! Phụt!）"
1676 = "（Phụt! Phụt! Phụt! Phụt!!）"
1678 = "（Đâm vào——cọ ra——cọ vào——cọ ra）"
1679 = "（Chọc——Cọ xát! Ngoáy sâu——Cọ xát!）"
1682 = "（Tách ra）"
1684 = "（Rút ra——đẩy vào――――lút cán!!!）"
1686 = "（Ngoáy——Móc——Nắn bóp——Cọ xát）"
1688 = "（Bóp nhẹ）"
1689 = "（Nắn bóp——Mềm mại——Mềm mại! Phụt）"
1690 = "（Cọ xát! Xoa nắn! Cọ xát! Xoa nắn!）"
1693 = "（Xuyên vào）"
1694 = "（Đâm vào——rút ra——đâm vào! Cọ xát——rút ra——đâm vào!!）"
1696 = "（Đâm vào——rút ra——cọ xát——nhào nặn）"
1697 = "（Phập——Phập——Nhóp——Nhép）"
1699 = "（Đâm vào——đẩy tới——lút cán! Rút ra——đẩy tới——lút cán!）"
1700 = "（Thọc——thọc——nhóp nhép——nhóp nhép——）"
1701 = "（Ngoáy, cọ xát, nhóp nhép, mút）"
1702 = "（Vạch ra）"
1705 = "（Nhóp nhép）"
1706 = "(Đè xuống)"
1707 = "（Đút vào）"
1709 = "（Siết! Siết! Siết chặt!）"
1711 = "（Phập!!! Thúc mạnh!!）"
1712 = "（Đâm——Sâu——）"
1713 = "（Phập——Thúc——Ép——Sát——）"
1714 = "（Ép——Ngoáy——Từ từ——Phập——Phập……）"
1715 = "（Trơn tuột——Trượt——Nhóp nhép——Cọ xát）"
1716 = "（Trơn, tuột——Trượt, dài——Trơn, láng——Nhóp, nhép）"
1718 = "（Trượt——đâm vào——cọ——rút ra）"
1721 = "（Phập!!!）"
1722 = "（Vuốt ve——Sờ nhẹ——Cọ xát——Cọ xát——）"
1724 = "（Cọ xát——Mút——Cọ xát——Ngoáy sâu）"
1725 = "（Vuốt ve）"
1728 = "（Ôm chặt）"
1729 = "（Siết chặt——co thắt kịch liệt!!）"
