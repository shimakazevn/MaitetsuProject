1697 = "「Nhưng mà, anh thực sự thấy ổn chứ? Hôm nay là ngày nghỉ hiếm hoi của anh mà.\\nĐã mấy tháng rồi anh mới có một ngày nghỉ ngơi đúng nghĩa phải không?」"
