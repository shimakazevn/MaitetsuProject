2000 = "「Anh Sou đang rất cố gắng mà.\\nTờ báo thú vị lắm đó.」"
2001 = "「Anh Sou, cảm ơn anh vì tờ báo nhé.」"
2004 = "「Là thám hiểm trong phiêu lưu thám hiểm ấy. A——không.\\nHay là chúng ta biến nó thành tài nguyên du lịch theo hướng đó nhỉ?」"
2005 = "「Đúng vậy nhỉ.」"
2006 = "「Đường sắt kỳ ảo——\\nHãy phát triển dọc tuyến Yui theo hình ảnh đó.」"
2007 = "「Đường sắt kỳ ảo——\\nLà 『tuyến đường được điểm tô bởi những câu chuyện』 phải không anh?」"
2012 = "「Tôi cũng mong cô giúp đỡ.」"
2013 = "「Vô vàn là...」"
2015 = "「Đáng tiếc là không có ạ. Thế nên ban đầu sẽ là những việc lặt vặt.\\nCó thể anh Soutetsu sẽ thấy hơi nhàm chán một chút.」"
2016 = "「Từ một thị trấn thời gian ngừng trôi, đến thành phố công nghiệp Yatsushiro đại diện cho hiện tại\\n——và nếu có thể, là hướng tới tương lai xa hơn nữa.」"
2020 = "「Sao vậy, Navi.」"
2021 = "「Sao thế? Hôm nay tôi\\nphải giúp cô sơn lại tàu à?」"
2024 = "「Tôi có cảm giác như là lần đầu……\\nHay là do tôi nhớ nhầm?」"
2026 = "「Từ từ, từ từ, từ từ, được rồi.」"
2027 = "「Em nghĩ là được——không, chúng ta sẽ biến nó thành hiện thực.\\nKỷ niệm của anh Soutetsu, của em, và chắc chắn là của tất cả mọi người.」"
2029 = "「Em và Hachiroku. Cả chị Kisaki, chị Mayami\\nvà Navi nữa. Nhóm này sẽ phụ trách củng cố nền tảng.」"
2031 = "「Chà, có phải vậy không nhỉ?」"
2032 = "「Tôi làm thử có được không?」"
2035 = "「Tôi cũng vậy. Tôi muốn nói chuyện thật kỹ với cô.」"
2037 = "「Tôi cũng đã nghĩ đến chuyện đó. Nếu làm được vậy,\\nđường ray sẽ kết nối thành vòng tròn với khu vực Kagoshima――――a.」"
2039 = "「Tôi cũng có suy nghĩ giống hệt vậy.」"
2042 = "「Chúng ta——đã cùng nhau bước đi\\ndọc theo đường ray này vào mùa hè năm ấy sao?」"
2043 = "「Chúng ta hãy kể cho Reina nghe thật nhiều.\\nVà hãy để em ấy kể cho chúng ta nghe thật nhiều.」"
2045 = "「Em, sao ạ? Nếu là em thì——ừm——」"
2047 = "「Em ở đây nè, anh Sou.」"
2049 = "「Em muốn anh Soutetsu và chị Hibiki. Cùng với Reina,\\nNagi và Fukami, đều có những giấc mơ.」"
2051 = "「Em thích làm cái này lắm. Lúc thong thả\\nlàm cùng Reina, em quên hết cả thời gian và mọi chuyện khác.」"
2052 = "「Khi nào chuyến tàu mà anh Soutetsu muốn chạy được khởi hành.\\nLúc đó, em muốn kể tiếp.」"
2055 = "「Em nghĩ không có gì phải nghi ngờ về việc\\nông ấy đang nghiêm túc suy nghĩ cho sự phục hưng kinh tế của Ohimitera.」"
2057 = "「Em hiểu. Cả em cũng vậy.」"
2058 = "「Em hiểu rồi. Việc này nếu thuận lợi,\\nthì cả khâu thiết kế lẫn cải tạo đều có thể thương mại hóa được.」"
2060 = "「Đã rõ.」"
2061 = "「Trông em đẹp hơn bình thường đúng không?」"
2064 = "「Tôi dùng lực một chút nhé?」"
2065 = "「Em nghĩ đó là một điều tốt.」"
2067 = "「Theo em, điều cần thiết nhất tiếp theo\\nchính là 『tài nguyên du lịch khu vực Yui』.」"
2069 = "「Anh sao?」"
2071 = "「Thế nên anh nghĩ đơn giản là nó vẫn chưa đến được tay họ thôi.\\nĐể truyền tải được, vẫn còn vô vàn thiếu sót cần bù đắp.」"
2073 = "「Vì vậy, tôi nghĩ. Thứ đầu tiên có thể bù đắp cho những thiếu sót\\ndù là hy vọng hay quyết tâm——chính là sự dịu dàng.」"
2076 = "「Vì thế, em cũng vậy. Em muốn hoàn thành vai trò của mình.\\nEm muốn củng cố từng bước chân trên con đường chinh phục giấc mơ của anh.」"
2078 = "「Chính vì vậy, tôi càng muốn làm những việc\\nmà bình thường không có cơ hội làm.」"
2079 = "「Vì vậy, việc anh Soutetsu định giao chuyện tiền bạc cho chuyên gia——\\nphía ngân hàng, em nghĩ là một quyết định vô cùng chính xác.」"
2081 = "「Thế, về chuyện lúc nãy.」"
2091 = "「Vậy, tiếp theo là nắp dưới nhỉ.」"
2097 = "「Cải tạo. Vì \\x%l石造機関庫;#00ffc040;Xưởng đầu máy bằng đá%l;#; và \\x%l検修庫;#00ffc040;Xưởng bảo dưỡng%l;#; sẽ không đủ.\\nNên chúng ta sẽ xây dựng Nhà máy chế tạo toa xe ở đây, và hợp nhất chúng lại.」"
2102 = "「Chào buổi sáng, Paulette. Chào buổi sáng, Reina.」"
2103 = "「Chào buổi sáng! Anh Soutetsu.\\nHôm nay, mong anh giúp đỡ nhé.」"
2105 = "「Tôi đã được Paulette cứu rỗi.\\nTôi từng nghĩ nó sẽ kéo dài vô tận——không.」"
2111 = "「À——」"
2112 = "「Đúng vậy nhỉ. Và chỉ có sự đồng cảm thôi,\\nthì chưa đủ để làm chỗ đứng vững chắc.」"
2114 = "「Đúng vậy. Chỉ có sự đồng cảm thì không thể nuôi sống bản thân được.」"
2117 = "「Ừ. Ở Hiroshima có một người tên là Denshahime,\\ncô ấy rất thích Bản tin buồng lái này.」"
2119 = "「Đúng vậy nhỉ. Quả nhiên là vậy.」"
2121 = "「Đúng vậy nhỉ. Để từ đó tiến tới khôi phục tuyến đường sắt,\\nvà kết nối với chuyến tàu hướng đến tương lai của chúng ta.」"
2124 = "「Đúng vậy ạ. Nếu không vượt qua thì không thể tiến bước——\\nChắc chắn, đó là một vết thương của quá khứ.」"
2125 = "「Đúng vậy ạ. Dạo bước dưới ánh trăng cũng tuyệt lắm,\\nnhưng ở đây thì hơi nguy hiểm quá.」"
2127 = "「Đúng vậy. Sự thành công của đoàn tàu du lịch 8620 trên tuyến Yui chắc chắn sẽ\\ntrở thành động lực lớn, thúc đẩy việc mua lại đất để khôi phục tuyến đường sắt.」"
2128 = "「Ừm, đúng vậy.」"
2129 = "「Đúng vậy nhỉ——Dưới ánh trăng chiếu rọi……」"
2131 = "「Đúng vậy ạ? Chính là khoảng thời gian này.\\nNày? Anh nhìn em đi. Anh Soutetsu.」"
2132 = "「Đúng vậy nhỉ, Reina.」"
2134 = "「Chắc là vậy. Và……\\nthứ duy trì sự dư dả đó——trong cuộc sống hàng ngày…… à, là tiền sao.」"
2135 = "「Vậy sao.\\nNavi nói vậy đấy, Paulette.」"
2136 = "「Vậy, sao.\\nThế thì——bằng cách nào?」"
2137 = "「Vậy sao.」"
2138 = "「Vậy ạ?」"
2140 = "「Là ảnh chụp đấy ạ. Cùng với màng nilon, nắp trên và nắp dưới.」"
2142 = "「Vâng. Mặt trời sắp lặn, nhưng ánh sáng vẫn còn sót lại.\\nChính vì thế, bóng đổ sẽ nhỏ nhất, và sự ấm áp vẫn còn lưu giữ.」"
2144 = "「Vâng, đúng vậy ạ. Tất nhiên đó là với điều kiện\\nnó có giá trị như một tài nguyên du lịch.」"
2145 = "「Vâng. Áp dụng hình ảnh đó cho toàn tuyến Yui,\\nđể làm ví dụ thành công cho 『danh mục hóa du lịch tuyến đường sắt』 của anh.」"
2147 = "「Đúng vậy ạ.」"
2148 = "「Vâng. Em cũng hiểu rồi.\\nChỉ cho chạy 8620 thôi thì không thu hút được khách đâu.」"
2150 = "「Ý tưởng cho đoàn tàu du lịch à.」"
2156 = "「Một tuyến đường kỳ ảo nơi thời gian ngừng trôi——nơi ta có thể trở về ngày hôm ấy một lần nữa.\\nNếu có thể phát triển tuyến Yui theo hướng như vậy——」"
2158 = "「Có ạ! Tất nhiên, nếu anh Soutetsu\\nkhông thấy phiền hay ghét việc đó.」"
2166 = "「Chính điều đó đã cứu rỗi tôi.」"
2168 = "「Ví dụ như——để xem nào. Giả sử gia đình cô đến đây.\\nCô bé Paulette sẽ muốn chơi trò gì?」"
2172 = "「Đúng vậy. Khi đó, tuyến Yui sẽ nằm ngoài vòng tròn——\\ntrở thành 『nơi phải cất công chuyển tàu mới đến được』.」"
2173 = "「Chính là nó!!!」"
2174 = "「Vâng, chuyện về nơi này. Về Mỏ than bỏ hoang Jussen ạ.」"
2181 = "「Chị Paulette, từ lúc nghe chuyện đó,\\ncứ cười tủm tỉm rồi bồn chồn suốt, hôm qua á nha~...」"
2182 = "「Paulette cứ buông tay ra cũng được mà?」"
2183 = "「Paulette. Cô, chính là cô bé lúc đó sao?」"
2185 = "「Vậy thì…… ưm——」"
2186 = "「Rất đẹp.」"
2188 = "「Reina! \\x%l閉塞;#00ffc040;Đóng đường%l;#; miệng lại ngay!!\\nChuyện đó là bí mật!! Bí mật đó!」"
2192 = "「Tất nhiên rồi ạ!\\nAnh có biết cách lắp không?」"
2193 = "「Chuyến tàu hướng đến tương lai, và chuyến tàu hoài niệm.\\nMột chuyến tàu chạy từ quá khứ đến tương lai——và từ tương lai về quá khứ.」"
2195 = "「Có vẻ là vậy. Reina chắc đã phải chờ lâu lắm rồi.\\nThấy có lỗi quá đi mất.」"
2198 = "「May mà chúng ta mang theo đèn pin nhỉ.」"
2199 = "「Rất đẹp.」"
2205 = "「Đúng là vậy. Do đó, ở khu vực Yui dọc theo tuyến Yui——\\ncần phải có 『giá trị đáng để cất công chuyển tàu』 sao.」"
2206 = "「Xe goòng à. Ra vậy, ở mỏ than thì chắc chắn là có rồi.」"
2207 = "「Xe goòng! Em muốn đi xe goòng.\\nNếu được, em cũng muốn thử lái nữa.」"
2210 = "「Anh nghĩ vậy em vui lắm. Từ trước đến nay,\\nem vẫn luôn muốn bàn chuyện này với anh.」"
2211 = "「Nếu vậy, tôi cũng thấy nhẹ nhõm hơn.」"
2213 = "「Có chứ ạ. Chắc chắn là có.\\nVốn dĩ, đường sắt được sinh ra từ hầm mỏ mà.」"
2214 = "「Tất nhiên là đào mỏ rồi.\\nSau đó…… sau đó là tìm kho báu.」"
2220 = "「Thị trấn Jussen. Thị trấn từng bị coi là vết thương và bị phong kín này.\\nChắc chắn sẽ mang đến tương lai cho chúng ta.」"
2221 = "「Để vượt qua được, còn cần thêm điều gì nữa?」"
2224 = "「Chúng được dùng cùng với chiếc máy này.」"
2225 = "「Tôi hạ xuống từ từ nhé?」"
2232 = "「Việc chị Hibiki thiết kế đoàn tàu du lịch——\\nnghĩa là cải tạo lại \\x%l種車;#00ffc040;toa xe nguyên bản%l;#;, đúng không anh?」"
2236 = "「Bàn chuyện?」"
2237 = "「Cảm ơn anh, anh Soutetsu.」"
2242 = "「Hình dán…… không, là ảnh chụp à? Của 8620 và KiHa 07S.」"
2245 = "「Michiko?」"
2261 = "「Du khách có thể cảm nhận ngay những gì mình đã học và trải nghiệm.\\nBằng cách bước lên chuyến tàu chạy từ quá khứ đến tương lai.」"
2262 = "「Ý tưởng này khả thi đấy ạ! Tuyệt đối khả thi!!\\nDù từ giờ còn phải bổ sung thêm rất nhiều chi tiết nữa.」"
2263 = "「Đó là một chuyện rất đau khổ. Rất, rất buồn.」"
2264 = "「Như thế không được đâu anh Soutetsu.\\nLàm vậy thì tuyến Yui không thể phát triển được.」"
2265 = "「Vì chiếc máy làm huy hiệu cài áo chuyên dụng này có từ trước rồi mà.\\nEm thấy bỏ không thì phí quá, nên tiện tay làm luôn.」"
2266 = "「Là anh Sou mang đến cho em đó?」"
2267 = "「Phong cảnh này——khiến người ta muốn đi thám hiểm đấy chứ.」"
2268 = "「Nếu vậy, cảnh quan của Ohimitera,\\nhay nhà ga cũ của Yui cũng sẽ được hồi sinh!!」"
2269 = "「À——」"
2270 = "「Đúng rồi đấ——Hả!?\\nÝ em là, khoan đã!」"
2271 = "「Thế này chắc là ổn rồi.」"
2272 = "「Vẻ đẹp này——nếu không phải là hoàng hôn thì sẽ ra sao nhỉ.\\nDù có thể điều chỉnh được thời gian, nhưng giả sử trời mưa thì sao.」"
2273 = "「Nơi này là tài sản hoàn toàn thuộc sở hữu của thành phố.\\nNhưng mà——để tái phát triển thì có rất nhiều trở ngại.」"
2275 = "「Còn lại là——」"
2278 = "「Mà này, còn anh Soutetsu thì sao?\\nCậu bé Soutetsu sẽ muốn chơi trò gì?」"
2279 = "「Nghe em nói vậy anh vui lắm.\\nThực tế thì nó cũng được đánh giá khá cao đấy.」"
2283 = "「Nếu vậy, nhờ anh nhé. Dạo bước dọc theo đường ray——\\ncó một thứ em muốn chúng ta cùng nhau tìm ra.」"
2284 = "「Nào, vậy chúng ta bắt đầu thôi nhỉ.」"
2286 = "「Nếu vậy, hãy cùng đi dạo quanh thị trấn này nào.\\nVà cùng tìm ra thật nhiều điểm tốt của nó nhé.」"
2287 = "「Vậy thì Reina đi xem KiHa 07S đây nha~」"
2288 = "「Nếu vậy, để \"lúc đó\" đến sớm hơn,\\nchúng ta hãy tiếp tục câu chuyện nào.」"
2290 = "「Là nhờ Paulette cả.」"
2291 = "「Tiền bạc rất quan trọng. Nếu không có tiền, không có thời gian,\\ncon người sẽ không thể dịu dàng được nữa.」"
2292 = "「Tèn ten. Vậy là chiếc huy hiệu cài áo 8620\\nđặc biệt của Đường sắt Ohito đã hoàn thành!」"
2293 = "「Danh mục hóa du lịch tuyến đường sắt và phục hưng kinh tế toàn tuyến.\\nNếu đạt được, đây sẽ là bước đệm lớn cho việc mua lại đất khôi phục tuyến.」"
2297 = "「Dù là chuyện buồn——\\nNhưng, cũng là chuyện có thể vượt qua được.」"
2298 = "「Quyết tâm đúng là một nguồn động lực.\\nNhưng chỉ vậy thôi thì không thể vượt qua được.」"
2299 = "「Anh…… Soutetsu.」"
2300 = "「Là vì hôm nay, anh Soutetsu\\nsẽ giúp đỡ chị Paulette cả ngày đó nha~.」"
2301 = "「Anh Soutetsu chắc chắn sẽ chọn 8620 nhỉ.」"
2302 = "「Ngài Soutetsu.」"
2306 = "「Mây mưa có vẻ đang kéo đến. Nếu có việc cần làm ngoài trời,\\nkiến nghị ngài nên hoàn thành sớm.」"
2310 = "「Giờ Vàng?」"
2316 = "「Huy hiệu KiHa 07S cũng\\ndành cho \\x%l運転士;#00ffc040;người lái tàu%l;#; nhỉ.」"
2504 = "Reina, người đã nghiêm chỉnh tuân thủ lệnh \\x%l閉塞;#00ffc040;đóng đường%l;#; miệng, giờ đây đang mỉm cười,\\nngước nhìn tôi với vẻ mặt vô cùng sung sướng."
2512 = "Không——từ nãy đến giờ tôi cứ đinh ninh nó là cái dập ghim,\\nnhưng nhìn kỹ lại thì hình dáng của nó khác hẳn."
2514 = "Không phải.\\nBây giờ tôi mới hiểu, không phải như vậy."
2517 = "Quả không hổ danh là người tự tin trong việc xử lý chi tiết."
2519 = "Chẳng hiểu sao tôi lại thấy nhẹ nhõm vô cùng,\\nnhưng đồng thời cũng cảm thấy có chút tiếc nuối."
2521 = "Chẳng hiểu sao, dù không phải vận động gì nhiều.\\nCơ thể tôi lại nóng ran lên, nhịp tim cũng đập nhanh hơn một chút."
2523 = "Mùi hương ngọt ngào mà từ nãy đến giờ tôi không hề để ý——\\nHương thơm của Paulette tỏa ra thật mạnh mẽ."
2526 = "Vẻ đẹp buồn man mác lúc nãy đã tan biến,\\nthay vào đó, hiện tại lại mang đến cảm giác hơi rờn rợn."
2528 = "Thực tế, tôi đã từng như vậy.\\n『Nhất định phải hoàn thành những gì được giao, phải trở thành người có ích』——"
2533 = "Rốt cuộc thì trời cũng không mưa——\\nMột suy nghĩ chợt lóe lên, dẫn đến một câu hỏi."
2536 = "Nhưng về mặt giữ thăng bằng, tôi cảm giác như thế này lại khó hơn.\\nPhải cẩn thận, đừng để làm rơi——"
2539 = "Nhưng, Paulette không trả lời tôi."
2541 = "Nhưng thiện cảm đó chỉ là thứ mong manh.\\nNếu đả động đến chuyện lấy đi nơi ở của họ, mọi thứ sẽ lập tức đảo ngược."
2558 = "Những kỷ niệm chất chồng của hai chúng tôi,\\nđang chỉ ra con đường hướng tới một tương lai mới."
2562 = "Lại ép một lần nữa."
2564 = "Nếu cứ giữ nguyên tư thế này, e là tôi sẽ để ý đến nhiều thứ hơn cả hơi thở,\\ncảm thấy hơi đáng sợ nên tôi nhanh chóng hoàn thành."
2572 = "Hơn nữa lại còn là thứ chẳng bán được mấy,\\nnghĩ thế nào cũng thấy hiệu quả thời gian quá tệ."
2573 = "Ra vậy, hóa ra đây cũng là một cách giải khuây."
2576 = "Đối diện với nó.\\nHiểu sâu về nó."
2582 = "Nếu chỉ việc tôi giúp đỡ mà cô ấy đã phấn khích đến vậy,\\nthì có lẽ khối lượng công việc hàng ngày của Paulette còn khủng khiếp hơn vẻ bề ngoài nhiều."
2584 = "Chỉ cần đi bộ một chút là có thể nhìn thấy\\nkhung cảnh nơi nỗi buồn và vẻ đẹp của sự mục nát chìm trong ráng chiều."
2586 = "Có lẽ do phản ứng ngược từ việc tiến lại quá gần lúc nãy,\\nPaulette bước đi hơi xa tôi một chút."
2611 = "Dù Paulette đã tạo cơ hội cho tôi,\\nnhưng nếu cuộc sống của tôi bấp bênh, có lẽ cơ hội ấy cũng đã lụi tàn."
2613 = "Dù có che giấu vết thương, ngoảnh mặt đi, khoác lên mình bộ quần áo đẹp đẽ,\\nthì rồi cũng có ngày nó sẽ bị nhuốm màu bởi dòng máu rỉ ra từ vết thương đó."
2616 = "Dạo gần đây tôi quá bận rộn, quá mệt mỏi.\\nNên đã không thể đến gặp Michiko."
2617 = "Đường sắt mỏ than——bởi vì đó là nơi Reina ngày xưa\\nđã sống và trân trọng từng ngày."
2619 = "Động tác đầy sức sống của cô ấy ngược lại,\\ncàng làm cho từ \"bỏ hoang\" vang lên mạnh mẽ hơn."
2620 = "Bóng dáng em ấy khuất dần, cánh cửa khép lại,\\ncho đến khi không còn nghe thấy tiếng bước chân nữa——"
2622 = "Dù dưới ánh trăng mờ ảo, hay trong ánh sáng trắng của đèn pin,\\nsự rực rỡ ấy vẫn không hề phai nhạt đi chút nào."
2625 = "Bóng lưng nhỏ bé và mái tóc vàng óng đã cứu tôi vào một ngày hè xa xăm.\\nĐã bao nhiêu năm trôi qua rồi nhỉ——"
2631 = "Ánh hoàng hôn lay động.\\nNhững đám mây vẫn còn vương lại rải rác trên bầu trời."
2635 = "Bóng tối của màn đêm đang xua đuổi tàn dư của ánh sáng\\nmột cách quá đỗi vội vàng."
2641 = "Gần quá. Gần quá. Gần quá. Gần quá.\\nMùi hương ngọt ngào của Paulette càng thêm đậm đặc."
2643 = "Cô ấy nói lớn và xua tay liên tục——"
2647 = "Cô ấy đang định ấn định ngày đó là khi nào sao?"
2649 = "Thứ cô ấy muốn cùng nhau tìm ra.\\nĐó cũng là thứ mà tôi rất muốn tìm thấy."
2650 = "Một tiếng hắng giọng như để lấp liếm."
2651 = "Lời nói của tôi đã truyền đạt được đến cô ấy.\\nGiống hệt như khoảnh khắc đó của mùa hè năm ấy."
2653 = "Cô ấy chỉ nói một câu rồi dừng lại, xoa đầu khen Reina ngoan,\\nrồi nhìn tôi bằng đôi mắt lấp lánh."
2656 = "Phải chăng vì thế mà lời nói cũng có cảm giác xa cách hơn.\\nChẳng hiểu sao, tôi lại thấy có chút bứt rứt."
2658 = "Theo nhịp thở, ngực cô ấy nhẹ nhàng phập phồng.\\nLàm ngực tôi cũng đập thình thịch."
2660 = "Hình ảnh hiện lên ở đó, là tôi của thuở ấu thơ.\\nCòn hình ảnh phản chiếu trong mắt tôi——là một cô bé."
2661 = "Cô ấy tự tay cài nó lên ngực tôi.\\nThật là vui. Cơ thể và trái tim tôi cứ rộn ràng cả lên."
2662 = "Việc cô ấy nhượng lại \\x%l客車;#00ffc040;toa hành khách%l;#; đã mở đường cho 8620 bắt đầu vận hành thương mại.\\nKết quả là sự chú ý của công chúng dành cho Đường sắt Ohito cũng tăng lên đáng kể."
2667 = "Nghe cô ấy nói vậy, quả đúng là thế.\\nPhép thuật đang dần phai nhạt."
2669 = "Khi ngẩng mặt lên, biểu cảm của cô ấy đã trở nên nghiêm túc."
2670 = "Gần quá. Rất, rất gần. Cảm giác như toàn bộ cơ thể Paulette\\nđang bao phủ lấy tôi."
2673 = "Trở lại trước mắt tôi lúc này, là một Hinai Paulette nhút nhát và dè dặt,\\nnhưng lại là một Thị trưởng kiêm Giám đốc vô cùng tài năng."
2675 = "Nếu mọi người có thể đoàn kết và mọi việc diễn ra suôn sẻ,\\nthì ngay từ đầu tôi đã chẳng quay về từ Đế đô làm gì."
2677 = "Nếu muốn đối diện với một ai đó, nếu muốn nhìn thấy dáng vẻ tự nhiên nhất của họ,\\nthì tốt nhất không nên nói thẳng là muốn \"đối diện\"."
2679 = "Cùng với Michiko, ba và mẹ——\\nNếu như, gia đình tôi đến đây thì……"
2680 = "Đồng thời cũng hy vọng rằng, nếu Paulette cần,\\nlời nói này sẽ chạm được đến cô ấy."
2683 = "Một nụ cười rạng rỡ như hoa nở."
2695 = "Đặt chồng phần nắp trên vừa ép xong\\nlên chiếc đĩa kim loại được gọi là nắp dưới——"
2696 = "Khi Paulette nhả tay cầm ra,\\nthứ cô ấy lấy ra với nụ cười rạng rỡ trên môi là——"
2702 = "Như thể đang cộng hưởng với tâm trạng vui vẻ của Paulette,\\nnụ cười hạnh phúc của em ấy lan tỏa khắp Cửa hàng đường sắt."
2704 = "Những món đồ nội thất và đồ chơi bị bỏ lại trong khu chung cư,\\ntrông như thể là những món đồ vô giá, không thể thay thế."
2709 = "Từ \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; đến \\x%lディーゼル機関車;#00ffc040;đầu máy diesel%l;#;, rồi \\x%l電気機関車;#00ffc040;đầu máy điện%l;#;——\\nsau đó đi vào đoạn đường điện khí hóa, và chuyển thành \\x%l電車;#00ffc040;tàu điện%l;#;."
2733 = "Tôi thầm nghĩ, mình có thể vực dậy được đến mức này,\\ncũng là nhờ có sự đùm bọc chu đáo của nhà Migita."
2737 = "Tôi cũng là người làm trong ngành vận tải đường sắt.\\nĐã \\x%l閉塞;#00ffc040;đóng đường%l;#; rồi thì làm sao mà tiến vào được. Nhưng mà——"
2740 = "Giao lại Cửa hàng đường sắt cho Reina,\\nchúng tôi thong thả dạo bước dọc theo đường ray."
2743 = "Tôi có thể khẳng định điều đó."
2746 = "Kể từ khi được giao chức vụ Trưởng bộ phận Vận hành và \\x%l保線部長;#00ffc040;Bảo trì đường ray%l;#;, không chỉ công việc trên tàu, thực tế và quản lý, mà các cuộc họp, chuyến công tác thay mặt Paulette cũng ngày càng tăng."
2749 = "Tôi bất giác để ý đến nhịp thở.\\nCố gắng hòa nhịp cùng hơi thở sống động của Paulette——"
2750 = "Gần như theo phản xạ, tôi nắm lấy tay Paulette.\\nCó vẻ tôi đã làm cô ấy giật mình, nhưng tôi không muốn buông ra."
2751 = "Tôi cảm nhận được sự chân thực đến nhói lòng.\\nCảm nhận được một nỗi buồn sắc lẹm."
2754 = "Tôi vội vàng đưa tay ra đỡ, nhưng cô ấy đã tự mình đứng vững lại,\\nvà gật đầu thật mạnh nhiều lần."
2756 = "Bật đèn pin lên, trong luồng ánh sáng ấy,\\nPaulette hơi nheo mắt lại vì chói."
2758 = "Tôi ngẩng lên để xem thế nào, thì ánh mắt hai người chạm nhau."
2760 = "Tôi cầm huy hiệu lên, quay lại,\\nvà đối mặt trực diện với Paulette."
2762 = "Tôi hơi ngạc nhiên khi nhận ra Paulette\\nlại ngây thơ và đáng yêu đến thế."
2764 = "Phối hợp nhịp nhàng theo giọng nói của Paulette,\\nchúng tôi hạ thùng carton xuống khỏi kệ an toàn."
2766 = "Khi dồn lực vào bàn tay đang đặt chồng lên tay cô ấy,\\ntôi cảm nhận được sự nhỏ nhắn và hơi ấm từ bàn tay Paulette."
2768 = "Bàn tay tôi đặt lên tay Paulette,\\nnhưng các ngón tay của tôi cũng chạm trực tiếp vào thùng carton."
2770 = "Khi cầm những thành phẩm đó trên tay, tôi thực sự đã nghĩ:\\n『Mình cũng muốn cho Michiko xem』."
2771 = "Một câu nói thăm dò,\\nlại bất ngờ khiến nụ cười rạng rỡ trên khuôn mặt Paulette."
2773 = "Có lẽ nó cũng cùng một loại——\\nvới những gì tôi đang mang, và cả những gì Paulette đang mang."
2775 = "Thế nên, tôi phải nói quả quyết. Phải tự nhủ.\\nVới chính bản thân mình."
2778 = "Chính vì thế mà nó không hề bị bóp méo,\\nvà có thể chạm đến nơi tăm tối nhất tận sâu trong trái tim tôi."
2783 = "Đầu ngón tay tôi bỗng cứng đờ một cách kỳ lạ.\\nThế nên tôi phải thật cẩn thận, vô cùng cẩn thận, cẩn thận——"
2785 = "Paulette nghiêng đầu, mang theo chút gì đó tinh nghịch."
2793 = "Là tiếng tàu chạy.\\nThật nhẹ nhõm."
2796 = "Tôi đã quá bất cẩn.\\nNếu cứ tiến hành khôi phục tuyến mà không có sự chuẩn bị đó——"
2798 = "Giọng của Navi."
2799 = "Lượng khách du lịch vốn đã không ngừng giảm sút,\\ncó thể sẽ còn bị hút đi nhiều hơn nữa."
2809 = "Những lời nói thẳng thắn từ một cô bé mới gặp lần đầu,\\nhoàn toàn không biết gì về tôi."
2810 = "Ví dụ như, dùng lượng than mà du khách đào được trong trải nghiệm đào mỏ\\nlàm một phần nhiên liệu để phát điện bằng nhiệt điện than."
2850 = "Trong một khoảnh khắc ngắn ngủi, Paulette lộ vẻ mặt vô cùng nuối tiếc,\\ncô nhắm chặt mắt lại và hít một hơi thật sâu."
2851 = "Vừa nói, Paulette vừa chỉ vào\\nchiếc dập ghim khổng lồ trên bàn."
2852 = "Chẳng hiểu sao Paulette lại đỏ mặt tía tai."
2853 = "Cô ấy đang cười.\\nPaulette đang cười."
2854 = "Bật ra một tiếng kêu yếu ớt kỳ lạ,\\nPaulette suýt chút nữa thì ngã khuỵu xuống."
2855 = "Paulette thả tay cầm đang dồn trọng lượng vào,\\nrồi lấy vật vừa đặt vào ra."
2856 = "Bản ghi chép của Paulette đã tổng hợp các ý chính\\nmột cách gọn gàng và dễ nhìn."
2857 = "Đôi môi mềm mại của Paulette\\nmấp máy vài lần."
2858 = "Paulette dang rộng hai tay."
2859 = "Paulette khẽ gật đầu.\\nRất khẽ."
2860 = "Thùng carton nằm trên kệ.\\nTôi vươn tay ra từ phía sau Paulette đang cố với lấy nó——"
2861 = "Với vẻ vui vẻ, Paulette mở thùng carton ra.\\nBên trong là——ưm?"
2862 = "Paulette chỉnh lại tư thế, một lần nữa,\\nhướng ánh mắt thẳng thắn về phía tôi."
2863 = "Với động tác thành thạo, Paulette lần lượt đặt\\nnắp trên, ảnh chụp và màng nilon vào phần đuôi của chiếc máy."
2864 = "Paulette gật đầu thật mạnh,\\nrồi vòng ra sau lưng tôi——"
2865 = "Cô ấy đang mỉm cười. Thật dịu dàng, dịu dàng.\\nCứ như thể chính Paulette mới là người đang chìm trong giấc mơ ngọt ngào."
2866 = "Paulette vẫn giữ chặt thùng carton.\\nBàn tay và cơ thể chúng tôi chạm vào nhau."
2867 = "Bàn tay Paulette siết chặt lại."
2868 = "Bàn tay Paulette khẽ di chuyển.\\nLòng bàn tay cô ấy nhẹ nhàng đặt lên trái tim tôi."
2869 = "Bàn tay mềm mại của Paulette nhẹ nhàng đặt lên tay tôi.\\nTôi có thể cảm nhận được hơi thở và nhiệt độ của cô ấy."
2870 = "Ánh mắt của Paulette không chỉ tập trung vào tình yêu đường sắt nữa,\\nmà đã bắt đầu mở rộng ra, phản chiếu nhiều điều hơn."
2871 = "Ánh mắt Paulette vẫn hướng về phía thị trấn.\\nCòn tôi thì không thể rời mắt khỏi cô ấy."
2872 = "Tôi nhìn thẳng vào mắt Paulette.\\nNhìn chính mình phản chiếu trong sắc xanh ấy."
2873 = "Paulette nhìn vào mắt tôi.\\nTôi nhìn lại và gật đầu, cô ấy cũng gật đầu đáp lại thật mạnh."
2874 = "Trông Paulette rất vui vẻ.\\nLàm tôi cũng cảm thấy vui lây."
2875 = "Paulette cười.\\nMột nụ cười mang theo cả sự ngây thơ lẫn tình mẫu tử."
2876 = "Nói với vẻ tự hào, Paulette cầm chiếc huy hiệu cài áo\\nvừa mới làm xong——"
2877 = "Paulette vẫn đỏ bừng hai má,\\nhít vào, thở ra, hít sâu vài lần."
2878 = "Vừa nói, vừa ghi chép.\\nCốc, ngòi bút của Paulette gõ nhẹ lên tờ giấy."
2879 = "Nói rồi, cô ấy cười.\\nBước lùi lại một bước như đang nhún nhảy."
2880 = "Ấn tượng về một Paulette mềm mại\\nnhư hòa quyện vào ánh sáng đang dần tàn, càng trở nên nổi bật hơn."
2881 = "Khẽ nhắm mắt lại, trầm ngâm suy nghĩ,\\nPaulette chậm rãi cất giọng đầy vẻ bối rối."
2882 = "Paulette nhắm mắt lại và bắt đầu suy nghĩ.\\nDòng suy nghĩ của tôi cũng tự động tuôn trào."
2883 = "Paulette bước lại gần một bước.\\nMái tóc vàng óng đung đưa trong gió mùa hè."
2884 = "Paulette quay về phía tôi,\\ndang hai tay ra một cách đáng yêu."
2885 = "Giọng nói vui sướng.\\nĐôi má và nụ cười như tan vào sắc đỏ của hoàng hôn."
2892 = "Rồi cô ấy quay lại, từ từ đưa mắt nhìn quanh một vòng rộng lớn."
2895 = "Reina cũng đang cười tủm tỉm——cười tươi hơn cả mọi ngày."
2896 = "Kiến thức và kinh nghiệm của Reina\\nchắc chắn sẽ giúp ích rất nhiều trong việc đắp nặn cho ý tưởng đó."
2898 = "Hai người vẫy tay chào tạm biệt nhau,\\nvà Reina bước ra khỏi Cửa hàng đường sắt."
2902 = "Sự thức giấc, lúc nào cũng thật đột ngột——"
2904 = "Phép thuật của Giờ Vàng,\\ncó vẻ như vẫn chưa hoàn toàn bị phá vỡ."
2905 = "Giọng nói của Navi khiến cô ấy hoảng hốt đến vậy sao."
2911 = "Bất chợt, tiếng bước chân của Paulette dừng lại."
2915 = "Không nặng đến mức đó.\\nChỉ cần thế này cũng có cảm giác đủ sức giữ vững."
2917 = "Trong cùng chiếc hộp, còn có thứ gì đó dạng màng nilon,\\nvà một vật thể tròn màu bạc."
2923 = "Kết thúc công việc trên tàu buổi chiều, chúng tôi một lần nữa\\nquay lại Ga bỏ hoang Mỏ than Jussen bằng chuyến xe chạy không."
2932 = "Thêm vào đó, tất nhiên là công việc quảng bá của Hibiki vẫn đang tiếp tục.\\nNghỉ ngơi trọn vẹn một ngày, thực tế đúng là chuyện của mấy tháng trước rồi."
2933 = "Chúng được cắt thành hình tròn rất tỉ mỉ."
2935 = "Máy móc hoạt động bằng nguồn điện đó sẽ vận hành nhà máy chế tạo toa xe,\\nvà tạo ra những chuyến tàu chạy về phía tương lai——"
2937 = "Nghe cô ấy nói vậy, tôi chiếu đèn pin một vòng xung quanh.\\n……Ra là vậy, ở đây phép thuật đã bị phá vỡ rồi."
2938 = "Nghe em ấy nói vậy, tôi cảm thấy nhẹ nhõm.\\nBởi tôi tin rằng, tôi và Michiko vẫn đang kết nối với nhau từ tận sâu thẳm tâm hồn."
2939 = "Nghe tôi nói vậy, Paulette gật đầu mạnh đáp lại."
2940 = "Tôi tự giật mình với\\nnhững lời nói chẳng giống mình chút nào vừa thốt ra."
2949 = "Đôi mắt xanh biếc hơi ngấn lệ.\\nCô ấy bước một bước lớn lại gần tôi——!?"
2970 = "Lời nói và suy nghĩ cộng hưởng với nhau."
2971 = "Vừa dứt lời, Paulette nở một nụ cười rạng rỡ như trút được gánh nặng."
2972 = "Mọi thứ đã chuyển đổi.\\nCả nội dung câu chuyện, lẫn bản thân Paulette."
2976 = "Nghe tôi nói vậy, Paulette lập tức bình tĩnh lại.\\nHay nói đúng hơn——? Trông cô ấy có vẻ hơi thất vọng."
2995 = "Michiko vẫn ngồi trên ghế như mọi khi.\\nBên cạnh ô cửa sổ nhìn ra một khung cảnh trông như có thể là bất cứ đâu."
2997 = "Khoảnh khắc Michiko buông tay tôi——\\nTừ bỏ mạng sống của chính mình, trao nó lại cho tôi."
2999 = "Michiko nở một nụ cười rạng rỡ."
3001 = "Giọng nói của Michiko xa dần.\\nTất cả tan biến vào trong ánh sáng."
3003 = "Trên đùi Michiko là tờ 『Bản tin buồng lái 8620』 được gấp gọn gàng.\\nBên trên còn có cả 『Bản đồ minh họa lưu vực sông Kuma』 nữa."
3004 = "Michiko cười.\\nCười khúc khích đầy tinh nghịch——nhưng lại có chút gì đó cô đơn."
3018 = "Những suy nghĩ mơ hồ viển vông\\nhoàn toàn bị tước đi bởi một câu nói đó."
3019 = "Đích thân Thị trưởng kiêm Giám đốc Paulette\\nlại đi làm một món đồ giá bốn trăm Yên đã bao gồm thuế——"
3020 = "Đây chính là công đoạn ép."
3021 = "Một bước tiến lớn."
3023 = "Thông qua việc tạo, phân phát và sử dụng bản đồ minh họa,\\nchúng tôi đã phần nào tạo được mối liên kết với khu vực dự kiến mua lại."
3029 = "Vết thương, của quá khứ."
3030 = "Vết thương quá khứ đau đớn dai dẳng đến mức nào,\\nchúng tôi là người hiểu rõ hơn ai hết."
3036 = "Cô bé của ngày hôm đó đang cười với tôi.\\nThật sự rất vui. Cảm giác như tôi đã phần nào đền đáp được ân tình."
3038 = "Trải nghiệm trong cái ngày đối diện với Hibiki,\\nđã giúp tôi nhận ra một sự thật giản đơn như thế."
3041 = "Mùa hè năm ấy và hiện tại hòa làm một.\\nKý ức bỗng mang theo nhiệt độ và mùi hương."
3042 = "Cô bé đứng dọc theo đường ray này,\\nngười đã kéo tôi lên một chút từ tận cùng của sự đau khổ——"
3043 = "Nếu vậy, tôi cũng sẽ trải nghiệm giống như Paulette,\\nđể cố gắng thấu hiểu cô ấy sâu sắc hơn dù chỉ một chút."
3047 = "Nỗi buồn sắc lẹm ấy cũng đâm vào tôi và tan ra.\\nBởi vì…… chính tôi cũng thấu hiểu nỗi đau mất nhà."
3048 = "Nỗi tuyệt vọng đen đặc ấy, từ tận cùng đáy lòng,\\nđang từ từ bò lên."
3054 = "Ánh sáng vàng, mái tóc vàng.\\nSắc đỏ của ráng chiều, và sắc đỏ trên đôi má."
3057 = "Danh mục hóa du lịch tuyến đường sắt——\\nHình ảnh đó nhanh chóng hội tụ thành một hình hài cụ thể."
3058 = "Mỗi khi đường ray tiến xa hơn,\\nđoàn tàu cũng sẽ thay đổi thành một thứ thuộc về tương lai."
3061 = "Dù cứ tiếp tục làm như vậy, tiếp tục lấp đầy tâm trí,\\nnhưng vết thương vẫn chẳng hề khép miệng."
3062 = "Những điều đó dù còn mơ hồ,\\nnhưng cũng đã tạo thành một bức tranh tổng thể trong tâm trí tôi."
3063 = "Dù không nhớ, nhưng tôi có thể hiểu được.\\nKhi cầm trên tay Bản tin buồng lái số đầu tiên, hay Bản đồ minh họa lưu vực Ohimitera——"
3064 = "Làm vậy tuy không thể chữa lành vết thương,\\nnhưng ít nhiều cũng có thể thấy được cách để sống chung với nó."
3069 = "Mây trôi đúng là nhanh thật.\\nNhưng vẫn chưa ngửi thấy mùi mưa."
3074 = "Bóng dáng một chiếc máy bay vô tình xẹt qua trên đầu."
3087 = "（Nhưng mà——）"
3088 = "（Poooon!）"
3089 = "（Cọc cạch, cọc cạch,\\nxình xịch, xình xịch——）"
3090 = "（Tách）"
3091 = "（Cạch）"
3092 = "（Cạch cạch）"
3093 = "（Cạch）"
3094 = "（Cạch）"
3096 = "（Chạm）"
3098 = "（Có chút lo lắng rồi đây.）"
3100 = "（Chạm nhẹ）"
3103 = "＜Mục tiêu lớn＞ Khôi phục tuyến đường sắt giữa Ohimitera và Yatsushiro"
3106 = "＜Hiệu quả kỳ vọng＞ ・Thương mại hóa việc khôi phục tuyến đường sắt\\n・Phát sinh nhu cầu kiểm tra phương tiện ・Kích cầu du lịch dọc tuyến"

