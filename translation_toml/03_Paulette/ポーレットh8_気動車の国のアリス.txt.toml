2317 = "「Ừ, lúc bị vòi xin chữ ký đến bối rối,\\nnhưng vẫn phóng bút viết chữ 『Ếch』 tuyệt đẹp, đúng là kiệt tác.」"
2318 = "「Vâng, ạ. E hèm.」"
2319 = "「A——vâng!」"
2321 = "「Ừ, đặt may. May theo yêu cầu——\\nNghĩa là đồ thiết kế riêng ấy.」"
2323 = "「Ồ, sao thế Paule——ờm」"
2325 = "「Vâng. Con có mấy việc——hả!?\\nSao mẹ biết——a……chú Miyamoto? Thật tình~」"
2327 = "「Ừ. Anh cầu còn không được.\\nNgay hôm nay, anh vẫn còn có thể cố gắng tiếp đấy.」"
2329 = "「Ừ, một người tửu lượng kém như anh cũng có thể thưởng thức,\\nlà loại rượu vang nhẹ, rất dễ uống.」"
2331 = "「Vâng. Nghe nói là được gia quyến hiến tặng.\\nĐó chính là nền tảng cho ý tưởng xây dựng thư viện truyện tranh.」"
2333 = "「A, đúng rồi nhỉ. À ừm……em nên làm thế nào,\\nđể anh cảm thấy sướng đây ạ?」"
2334 = "「V-vâng. Em, bên trong bụng——\\nbên trong, em muốn được nhuộm màu, theo ý muốn của Anh Soutetsu.」"
2336 = "「Vâng, vô cùng luôn! Thực tế thì câu chuyện cũng rất ngầu nữa.\\nTừ lúc đó, suốt một tuần liền con bé chỉ toàn 『Bác cá mòi』 thôi.」"
2338 = "「Ừ, anh rất sẵn lòng chiêm ngưỡng.」"
2340 = "Paulette chủ động tách môi tôi ra."
2341 = "「Hửm? Lợi hại, là sao——」"
2343 = "「Hửm? Anh cứ nghĩ ôm ấp chính là nhuộm màu rồi chứ——\\nKhông chỉ ôm ấp, mà là nhuộm màu, nghĩa là sao?」"
2344 = "「Ưm~~ (chóp chép)——ưm~~」"
2345 = "「Ư hự hự……cửa hàng của bác ếch, buôn may bán đắt.\\n『Lộp độp tí tách, lộp độp tí tách』」"
2349 = "「Ư hự, may quá. Nếu anh mà tỉnh bơ đáp 『Ừ』,\\nchắc em chẳng biết phải làm sao luôn.」"
2351 = "「Ư hự hự——Thấy chưa? Anh Soutetsu cũng, sướng, đúng không?\\nCó vẻ, sẽ bắn ra, xuất tinh, ngon lành nhỉ?」"
2353 = "「Ư hự hự, em vui lắm. Vậy thì, từ từ thôi nhé.\\nSục——sục——xoa——xoa」"
2355 = "「Ư hự hự, quả nhiên, là vậy nhỉ.」"
2356 = "（Tuột——）"
2360 = "「Fufu, kiểu cô gái thôn quê? Cảm giác vậy đúng không anh?\\nKiểu như, dùng chân giẫm để làm rượu vang ấy.」"
2361 = "「Ư hự hự, anh khen quá lời rồi. Anh Soutetsu.\\nNhưng em rất vui. Chắc là nhờ rèn luyện với Reina đấy.」"
2362 = "「Ư hự hự, hứa rồi nhé?\\nEm sẽ làm sẵn bánh mousse đợi anh.」"
2364 = "「Ư hự hự, dương vật của Anh Soutetsu.\\nXin hãy giúp đỡ nhiều nhé.」"
2365 = "「Yoozo——yoozo——sục——sục——\\nnắn, nắn——sục——sục——ây da」"
2368 = "「Ê hế hế.\\nNghe anh nói vậy, em vui lắm. Rất vui luôn.」"
2369 = "「Ê hế hế.」"
2370 = "Chỉ cắn đứt một nửa."
2372 = "「Ê hế hế——Cảm ơn anh. Trong những bộ em có,\\nem nghĩ bộ này là mang cảm giác cổ tích nhất rồi」"
2374 = "「Ê hế hế~ Được bế rồi.」"
2376 = "「Hể!?」"
2378 = "「Hãy bắn ra, nhão nhoét, phụt phụt phụt,\\nnhuộm toàn bộ con người em, bằng tinh dịch của Anh Soutetsu đi.」"
2380 = "「À——bình thường em vẫn hay đọc truyện cho Reina nghe sao?」"
2381 = "「À——rất hợp với hình tượng của em đấy.」"
2383 = "「Hô. Reina thích loại truyện tranh nào?」"
2384 = "「Ồ」"
2385 = "「Hô, nhạy cảm à.」"
2387 = "「Hô. 『Áo mưa của ếch』 sao.\\nTrông khá cổ điển, nhưng nét vẽ lại rất ấm áp——」"
2389 = "「Sục——sục——xoa——xoa——\\nDương vật ngoan nào——ngoan nào ngoan nào, ráng nhịn nhé」"
2390 = "「Sục——sục——nắn——nắn——oa, dữ quá,\\nhai hòn ngọc——nặng, thật đấy——cái này」"
2394 = "「Cực kỳ đáng yêu luôn!!」"
2395 = "「Công việc nhập khẩu cá nhân cũng là do đặt hàng những thứ liên quan đến mảng đó,\\nrồi bạn bè nhờ vả dần dà mà thành……」"
2396 = "「Mẹ bảo là để bù đắp cho hơn mười năm qua.\\nHơn nữa——cũng là quà tặng cho cậu con trai mới.」"
2400 = "「Say mê thật đấy.」"
2402 = "「Anh cũng rất vui. Thật hạnh phúc.」"
2407 = "Vào chiếc cốc đã được hâm nóng sữa sẵn,\\nngay khoảnh khắc hạt cát cuối cùng rơi xuống, hồng trà được thong thả rót vào."
2409 = "「Vậy sao!」"
2412 = "「Con biết rồi. Vậy, con chuyển máy luôn nhé?\\n——Anh Soutetsu. Anh Soutetsu?」"
2413 = "「Sướng——quá——chỗ đó——nên là, nhé——\\nưm hyu!? Phù——không được——bây, bây giờ, chưa được」"
2416 = "「Nặng quá, đau quá——đặc, quá——ưm——\\nhà——nóng quá, dữ dội quá——em, nhão nhoét hết rồi」"
2417 = "「Vâng!」"
2419 = "「Nếu Paulette thích, thì có khi tiến thêm một bước nữa,\\ntổ chức luôn buổi nếm thử rượu cũng nên.」"
2421 = "「Nếu là rượu vang do Paulette giẫm chân làm ra, anh nhất định muốn uống thử.」"
2426 = "「Vốn dĩ, mẹ em rất giỏi những việc như thế.\\nMay vá này, làm đồ thủ công này, hay còn gọi là đồ handmade ấy.」"
2431 = "「Tử cung……tràn ngập rồi. Thế này——em——\\nnghĩ là mình, có thai được rồi.」"
2436 = "「Ừm. Ohimitera vốn là thị trấn nấu rượu mà——\\nỞ Kumamoto cũng có cả vườn nho lẫn xưởng rượu vang.」"
2437 = "「Xin lỗi em nhé.」"
2438 = "「Nói vậy thì Paulette mới đúng chứ.\\nÀ, ở một góc độ nào đó, cả Hachiroku và Hibiki cũng vậy.」"
2439 = "「Giữ bí mật với cả Reina nhé?\\nCon bé mà biết là kiểu gì cũng phấn khích ầm ĩ lên cho xem.」"
2442 = "「Có chứ. Nếu không có Anh Soutetsu,\\nngày hôm nay, và cả nụ cười của mọi người, tuyệt đối sẽ không hiện hữu.」"
2445 = "「Đúng vậy nhỉ. Những bức vẽ thực sự rất ấm áp và hoài niệm.」"
2446 = "「Vâng, câu chuyện cũng rất thú vị nữa.」"
2447 = "「Thì là. Nhờ bác ấy may cho.\\nTrang phục cho chuyến tàu cổ tích, nhờ mẹ của Paulette ấy.」"
2451 = "「Sẽ là như vậy ạ. Sẽ mời những người có tầm ảnh hưởng ở địa phương lên tàu,\\nvới ý tưởng biến bên trong chuyến tàu thành phòng trưng bày của thư viện truyện tranh.」"
2452 = "「Là vậy đấy ạ.\\nHơn nữa, là, thế này nhé. ——Anh Soutetsu」"
2454 = "「Cả khoảng thời gian là một cô công chúa hạnh phúc, chẳng biết gì cả.\\nLẫn em của hiện tại, đã được học hỏi rất nhiều điều, đều được bao bọc trong chiếc váy này.」"
2456 = "「Ngay cả thư viện truyện tranh cũng vậy sao.」"
2457 = "「Được vậy thì tốt.」"
2461 = "「Đúng là Reina nhỉ.」"
2462 = "「Bay từ Fukuoka đến Thượng Hải, rồi sang Paris sao.\\nSự chăm chỉ của Paulette, chắc là được thừa hưởng từ ba mẹ nhỉ.」"
2468 = "「Sao thế?」"
2469 = "「Làm gì có! Không có chuyện đó đâu.」"
2470 = "「Làm gì có chuyện đó. Là Alice chứ.\\n『Alice câu đố』 ấy.」"
2472 = "「Có lẽ——là vậy.」"
2473 = "「Hãy mang thai nhé——Paulette.」"
2474 = "「Anh không hiểu. Nói rõ hơn cho anh nghe đi.\\nEm muốn anh nhuộm phần nào của Paulette, bằng cái gì của anh?」"
2478 = "……Hương thơm nồng nàn bắt đầu lan tỏa khắp cửa hàng đường sắt."
2479 = "「Cả em cũng suốt——từ nãy đến giờ」"
2488 = "「Hai người Paulette và Reina đã kết nối lại với nhau——\\nchúng ta chẳng qua chỉ đang chạy trên đoạn đường ray đó mà thôi.」"
2489 = "「Chỉ là câu chuyện giữa những người đã đính hôn quá vui vẻ, nên mới đi xa thôi.\\nNếu em xin lỗi, thì anh cũng mang tội chung đấy nhé?」"
2490 = "「Chúng ta đã làm tình, bao nhiêu lần rồi nhỉ.」"
2491 = "「Nhão nhoét hết rồi nhỉ. Chúng ta ấy.\\nNgón tay em và, dương vật như đang hòa tan vào nhau vậy.」"
2492 = "「Chúng ta còn chưa đi qua cột đèn tín hiệu xuất phát nữa mà.」"
2493 = "「Em sẽ thử nhờ xem sao. Em muốn nhờ mẹ.\\nVì dù sao thì trong hôn lễ——em cũng muốn mời mẹ đến mà.」"
2496 = "「Thích, thích lắm——ưm——dương, vật——\\nhôn sâu, vào tử cung——thích lắm」"
2498 = "「Em vui quá! Em yêu anh nhất, Anh Soutetsu.」"
2500 = "「Em vui lắm. Nhé? Vậy thì, lần này, anh cứ chuyển động theo ý thích đi?\\nTừ nãy đến giờ em, chỉ lo cho bản thân mình——ưm!?」"
2502 = "「Từ từ, từ từ, nhớp nháp, sền sệt.\\nTrêu chọc tinh dịch của Anh Soutetsu, làm nó đặc lại.」"
2504 = "「Anh rất mong chờ đấy.」"
2505 = "Lạch bạch lạch bạch, đến cả tiếng bước chân cũng rộn rã."
2507 = "「Làm gì có chuyện đáng yêu hơn cả Alice chứ.\\nAlice là cô bé đáng yêu nhất thế giới mà.」"
2510 = "「Cứ mặc nguyên chiếc váy này, giữ nguyên bộ váy Alice này.\\nEm……muốn được Anh Soutetsu, à ừm……ôm ấp.」"
2512 = "「Anh đang chuyển động, để khiến Paulette tràn ngập——\\nsay đắm anh đấy.」"
2513 = "「Hoàn toàn là thật lòng mà. Paulette vừa đáng yêu,\\nmà chiếc váy cũng rất tuyệt——Đúng chuẩn 『Đồ đặt may』 luôn.」"
2516 = "「Nói gì thì nói, em vẫn thích Alice nhất.\\n『Alice ở xứ sở kỳ diệu』」"
2517 = "「Có anh ở đây để bù đắp cho em mà. Đừng bận tâm đến những tiểu tiết,\\nanh muốn Paulette cứ phát huy ý tưởng của Paulette đi.」"
2518 = "「Anh sẽ nhuộm thắm, ghi đè lên, và đánh dấu.」"
2519 = "「Em cũng từng nghĩ 『Mình là Alice』 đấy.\\nCòn nhờ mẹ may váy cho nữa cơ.」"
2520 = "「Sự cương cứng của anh——dương vật của anh——\\nmuốn, mút mút, nhũ hoa, của Paulette.」"
2523 = "「Thật sự là không thể ngẩng đầu lên trước mẹ vợ được.\\nKhông ngờ bác ấy lại hỗ trợ đến mức này.」"
2524 = "「Anh cũng——tràn ngập Paulette rồi.」"
2526 = "「Em biết mà.」"
2527 = "「Lúc nào cũng?」"
2529 = "「Để khẳng định Paulette là người phụ nữ của anh, là của riêng anh.\\nAnh sẽ để nó thấm sâu vào toàn bộ cơ thể, vào tận xương tủy, và cả trái tim em.」"
2530 = "「Anh nghĩ đây là một chuyến tàu sự kiện cực kỳ xuất sắc. Đúng là dụng nhân như dụng mộc.\\nAnh cũng rất vinh dự khi được đóng góp một phần vào đó.」"
2533 = "「Chỉ dùng cho mỗi ngày hôm nay,\\nem thấy thật sự tiếc quá đi mất.」"
2534 = "「Đã-bảo-là! Em biết Anh Soutetsu nói thật lòng\\nnên em rất vui, nhưng mà xấu hổ lắm đó.」"
2536 = "「Thật vinh hạnh.\\n……Nói sao nhỉ, rốt cuộc cũng bắt đầu cảm nhận được sự chân thực rồi.」"
2539 = "「Vì thế nên……đọc 『Áo mưa của ếch』 xong\\nem mới nghĩ——chất cổ tích, cũng nên thiên về phong cách Nhật Bản.」"
2540 = "「Thế nên——xuất tinh đi, Anh Soutetsu!\\nXuất tinh, thật nhiều. Thật nhiều thật nhiều vào!!」"
2542 = "「Thế nên, mới cần đến mẹ của Paulette.」"
2545 = "「Thế nên, nhé? Anh Soutetsu!?」"
2547 = "「Hãy nhuộm em, toàn bộ——cả bên trong, lẫn bên ngoài cơ thể——\\ncả khi trần truồng, lẫn khi mặc quần áo——cả quá khứ, và cả tương lai.」"
2549 = "「Nhân chuyện trang phục, hãy bàn bạc với bác ấy về thư viện truyện tranh xem sao.\\nBiết đâu bác ấy có thể giúp chúng ta tập hợp truyện tranh trên toàn thế giới cũng nên.」"
2552 = "「Đến lượt anh, làm theo ý thích sao?」"
2554 = "「Câu chuyện hay là đương nhiên rồi, nhưng cách em đọc cũng rất tuyệt.\\nCơn mưa bằng giọng nói của em đã nhấn chìm anh vào câu chuyện.」"
2556 = "「Nếu đã được Anh Soutetsu kiểm chứng thì——\\nchắc chắn là ngon đúng không anh? Rượu vang ở đó ấy.」"
2557 = "「Dù là cá mòi nhưng ngầu lắm đấy!\\nLần tới, em cũng sẽ đọc cho Anh Soutetsu nghe nhé?」"
2559 = "「Anh hiểu rồi.」"
2560 = "「Thích từ hồi còn bé tí luôn ấy chứ!\\nAnh đợi một lát nhé. Em đi pha ngay đây.」"
2563 = "「Vâng. Ư hự hự, chính em cũng không biết điều đó.」"
2566 = "「Đúng vậy nhỉ. Nếu chỉ biến nó thành cơ sở mang tính địa phương của Yunosaka,\\nthì xét về mặt Đường sắt Ohimitera, hầu như sẽ chẳng sinh ra lợi nhuận gì.」"
2568 = "「Vâng ạ. Bọn em cũng sẽ mời cả báo chí nữa——trên thực tế,\\nem nghĩ đây sẽ là buổi giới thiệu, ra mắt cái gọi là định hướng cơ bản.」"
2569 = "「Ừ——」"
2571 = "Paulette hớn hở tháo lớp gói quà trang nhã."
2573 = "「Đúng vậy. Trước mắt cứ quay lại vạch xuất phát đã.\\nĐang nói chuyện 『Chuyến tàu cổ tích』 nhỉ.」"
2574 = "「Đúng vậy nhỉ. Kết hôn.\\nGia đình có thêm người……ừm. Là thế này đây.」"
2577 = "「Đúng là chân váy sọc dọc rất hiệu quả. Hơi cổ điển một chút,\\ncó nằm trong cuốn truyện tranh nào đó của Đức cũng không có gì lạ.」"
2578 = "「Vậy sao. Nếu vậy thì, Paulette là đồng hạng nhất rồi.」"
2581 = "「Là vậy sao.」"
2582 = "「Chỗ này, sao?」"
2586 = "「Tuy còn tùy khẩu vị, nhưng chất lượng thì miễn chê.\\nCá nhân anh đặc biệt thích rượu vang đỏ. Cực kỳ hợp với thịt ngựa sống luôn.」"
2608 = "「Hả?」"
2609 = "「Nếu là quần áo mẹ may, thì dù có làm bẩn, hay làm rách,\\ncũng sẽ được mẹ giặt giũ và vá lại cho thôi.」"
2614 = "「Không sai đâu. Mang lại cảm giác rất cổ tích.\\nCực kỳ đáng yêu, nếu hỏi thích hay không thì anh rất thích.」"
2615 = "「Đúng vậy ạ. Nhưng, vì đây là nền dân chủ——\\nnên việc củng cố phe đa số sẽ là đối sách ưu tiên hàng đầu.」"
2616 = "「Đúng vậy.」"
2617 = "「Cá mòi mà cũng ngầu sao?」"
2626 = "「Pau, lette——」"
2627 = "「Paulette.」"
2628 = "「Paulette!」"
2629 = "「『Vì vậy』, làm bẩn cũng không sao.\\nVì đây là bộ quần áo mẹ làm riêng cho em mà.」"
2635 = "「Yunosaka cũng có thương hiệu! 『Rượu vang Yunosaka』」"
2636 = "「Sự liên kết giữa Yunosaka và truyện tranh là gì?」"
2637 = "「Em cũng đã truyền đạt mối lo ngại đó cho phía Yunosaka.\\nVà đề xuất 『Thư viện Truyện tranh Yunosaka』 đã được đưa ra vào hôm trước.」"
2638 = "「Chuyện về Thư viện Truyện tranh Yunosaka,\\nanh có thể nghĩ xa đến mức đó trong chớp mắt.」"
2643 = "「Tiếp theo đó là đối thoại với phe phản đối.\\nDù không thể khiến họ thay đổi ý kiến, nhưng đó là việc tuyệt đối cần thiết.」"
2645 = "「Ăn gian sao. Vậy thì, rút ra thôi.」"
2647 = "「Hiện tại, việc khắc phục sự yếu kém về yếu tố du lịch ở khu vực Yunosaka,\\nchính là chìa khóa để cải thiện Đường sắt Ohimitera hơn nữa đúng không anh?」"
2650 = "「Theo……ý của em. ——Vâng. Em hiểu rồi.\\nVậy thì, từ từ thôi. Thật từ từ.」"
2653 = "「Phủ lên em lớp tinh trùng nhão nhoét, đánh dấu em,\\nbằng Anh Soutetsu——hãy nhuộm thắm, toàn bộ con người em đi!」"
2654 = "「Ngoan lắm.」"
2656 = "「Thật ạ!? Tuyệt quá, em vui lắm.」"
2657 = "「Thực ra, em rất muốn mẹ lên đi thử,\\nchuyến tàu cổ tích. Nhưng cũng không thể đòi hỏi ích kỷ đến mức đó được.」"
2659 = "「Thật sự luôn.」"
2661 = "「Thầy ấy đã qua đời rồi sao.\\nTiếc thật, anh rất muốn được gặp thầy một lần.」"
2669 = "「Giữ nguyên, bộ váy Alice sao.」"
2670 = "「Mệttttttt quáaaaaa.」"
2675 = "「Ngay cả thư viện truyện tranh ạ. Dù ở quốc gia nào, thời đại nào,\\nem nghĩ chuyện đó chắc chắn cũng giống nhau thôi.」"
2676 = "「Đọc tiếp đi em.」"
2679 = "「Nghe anh nói vậy……em thấy nhẹ nhõm hẳn.\\nCả Anh Soutetsu và Reina, đều rất tuyệt vời.」"
2681 = "「Làm được vậy thì lý tưởng quá. Bán ở cả thư viện truyện tranh nữa,\\nlúc đó gọi là 『Rượu vang cổ tích Yunosaka』 cũng hay.」"
2684 = "「Eo, nhấc. Lên mất——ưm——a a! Em,\\ncơ thể——bị dương, vật——nhấc, bổng lên」"
2686 = "「Bị anh?」"
2690 = "「Bằng tinh dịch——đặc sệt——đục ngầu, nhão nhoét——\\ntràn ngập mùi hương, trần trụi——của Anh Soutetsu.」"
2693 = "「Anh cõng em nhé?」"
2695 = "「Nếu phải giữ bí mật với cả Reina,\\nthì đây là một trong những bí mật tối cao của Đường sắt Ohimitera rồi——Anh hiểu.」"
2697 = "「Nếu nói vậy thì, phải là Paulette mới đúng chứ.」"
2698 = "「Của, Anh Sou——tetsu——cái đó, sau khi, xong ca trực,\\nngay lập tức, chưa kịp tắm rửa gì, à ừm, cái đó.」"
2701 = "「Thôi đi, Anh Soutetsu. Vỗ tay thì hơi quá rồi đấy.」"
2703 = "「Buổi nếm thử rượu ạ?」"
2704 = "「Nhắc mới nhớ, chúng ta có nhận được quà lưu niệm nhỉ.」"
2705 = "「Mà em cũng chưa giải thích gì cả nhỉ.\\nEm xin lỗi.」"
2711 = "Cát trong đồng hồ cát mang màu hổ phách.\\nTuôn rơi nhè nhẹ, chảy trôi giữa quá khứ và tương lai."
2712 = "「Hãy xuất tinh thật nhiều, thật nhiều đi.\\nTinh dịch của Anh Soutetsu, kem tinh dịch, nhão nhoét.」"
2713 = "「Xin hãy, nhuộm em.\\nToàn bộ con người em. Bằng Anh Soutetsu.」"
2714 = "「Hãy nhuộm em, nhiều hơn nữa đi.\\nBên trong em chỉ có Anh Soutetsu thôi. Không chừa lại chút nào, toàn bộ.」"
2715 = "「Hãy trang trí, cho em đi.\\nCả ruy băng, tóc, mắt, quần áo, lẫn ngực nữa.」"
2716 = "「Làm đặc lại, đặc lại nữa, trêu chọc, trêu chọc nữa.\\nBắt anh phải nhịn, nhịn nhiều hơn nữa so với lúc muốn xuất tinh.」"
2717 = "「Mẹ em may sao?」"
2730 = "「Hình tượng của ai cơ? 『Thợ làm mũ xé xác』 ạ?」"
2749 = "「Chẳng phải là chuyện đó sao?\\n『Để nhận được sự thấu hiểu của địa phương』 ấy.」"
2750 = "「Không ích kỷ đâu.\\nLàm tình, là chuyện hai người cùng nhau làm mà.」"
2751 = "「Đây là tinh dịch dùng để nhuộm thắm Paulette.\\nAnh muốn em tự vắt kiệt nó theo ý mình, chứ không phải ý anh.」"
2752 = "「À ừm」"
2753 = "「Vâng.\\nHọa tiết được in lên lớp sô-cô-la trắng đấy ạ.」"
2754 = "「À ừm,\\ntrước tiên anh cứ thử đọc cái này xem sao.」"
2755 = "「Ư hự hự. Cảm ơn anh.\\nNhưng mà——nhé? Anh Soutetsu.」"
2756 = "「Tác giả vẽ cuốn truyện tranh này,\\nthầy 『Kinoko Daisuke』, nghe nói là người gốc Yunosaka đấy ạ.」"
2757 = "「Làm thế thì, không nhuộm cho Paulette được đâu nhé?」"
2758 = "「Ra vậy. Nếu là sản phẩm từ sở thích mà phát triển thành nghề chính,\\nthì chắc hẳn đó là một chiếc váy tuyệt đẹp——và vô cùng đáng yêu nhỉ.」"
2759 = "「Ra vậy. Tuyệt vời thật.\\nÀ——không chừng, ở Yunosaka còn có cả bản gốc của truyện tranh nữa sao?」"
2760 = "「Vậy sao.」"
2761 = "「Thế này, thì sao?」"
2762 = "Paulette nhón lấy một chiếc bánh có họa tiết chùm nho sặc sỡ,\\nrồi đưa về phía tôi."
2763 = "「Kể cả em của thuở thiếu nữ.\\nEm muốn Anh Soutetsu——ôm lấy toàn bộ con người em.」"
2764 = "「Đến mức anh cũng muốn trở thành một hành khách,\\nđể được Alice ở xứ sở toa xe tự hành thiết đãi đấy. Tuyệt vời lắm.」"
2767 = "「Quả nhiên là vẫn có những người bảo thủ——\\nChỉ vì là công trình mới mà đã có ý kiến phản đối rồi.」"
2769 = "「Không có chi cái gì, đây là một bữa tiệc ngon lành không gì sánh bằng đấy.」"
2776 = "Tôi nhét chiếc bánh eclair mini vào đôi môi ướt át của Paulette.\\nHá to miệng như một chú chim non, dùng ngón tay hối thúc."
2777 = "Đưa mắt nhìn xuống khuôn mặt có vẻ bối rối kia,\\nPaulette đang tròn xoe mắt nhìn tôi."
2778 = "「À……ừm……lúc nãy, em đã, được làm——\\ntheo ý thích, của mình rồi nên」"
2779 = "「À ừm……cái đó——không chỉ, ôm thôi đâu. Em——\\nmuốn Anh Soutetsu……nhuộm màu……cho em.」"
2780 = "「À ừm……thì là……cái đó, bằng màu sắc của, Anh Soutetsu——\\ncả cơ thể——của, em——à ừm——cả bộ váy, Alice nữa.」"
2781 = "Đáp lễ ly rượu, à không, đáp lễ bánh eclair.\\nTôi nhón lấy một chiếc có màu như bánh mì nướng, đưa cho cô ấy."
2783 = "「Vậy thì rắc rối đấy.\\nThế thì anh sẽ ngoan ngoãn lắng nghe. Nhờ em giải thích lại nhé.」"
2784 = "「Vâng. Ư hự hự, vui quá đi.\\nĐược uống hồng trà mẹ tặng cùng với Anh Soutetsu thế này.」"
2785 = "「Nếu vậy, thì đã——ưm——phù, a——\\nđếm, không xuể rồi. Bởi vì, Anh Soutetsu, lúc nào cũng」"
2788 = "「Sở thích của anh, cũng là đánh trực diện mà.」"
2790 = "「Thế thì, chẳng phải rất tốt sao?」"
2791 = "「Vậy thì.」"
2793 = "「Vậy thì muốn hiện thực hóa nó quá nhỉ——cái đó……A!\\nLàm sự kiện khai trương cho 『Thư viện Truyện tranh Yunosaka』 luôn」"
2794 = "「Vậy thì nhất định rồi. Anh sẽ mua về, chúng ta cùng uống nhé.」"
2798 = "「Nếu vậy thì anh phản đối việc thiên về phong cách Nhật Bản.\\nCó thể nó sẽ là đối sách tốt với địa phương, nhưng sức hút du lịch sẽ bị giảm sút.」"
2800 = "「Nếu vậy, khi có dịp hãy cho anh gửi lời chào hỏi nhé.」"
2801 = "「Tất nhiên rồi! Vì đó là chiếc váy mẹ đặc biệt\\nlàm riêng cho một mình em mà.」"
2803 = "「Thích quá. Em cũng thích loại như vậy.」"
2804 = "「Thích quá——chỗ đó——làm, nữa đi, ưm, hà,\\na——làm, nữa đi, nhé? Cọ xát, đi, a」"
2805 = "「Chỗ đó, em——chỗ đó, có vẻ, yếu——ưm,\\nấn, vào——đợi——đợi đã, một chút——a, a」"
2807 = "「Vậy thì, lần này,\\nnhờ anh từ miệng xuống họng nhé!」"
2811 = "「Tất cả, đều là nhờ Anh Soutetsu cả.」"
2814 = "「Đồ……đặt may?」"
2815 = "「Sự kiện khai trương——\\nA! Kiểu như 『Trải nghiệm làm rượu vang bằng chân』 ạ?」"
2817 = "「Vậy thì, pha như thế đi.」"
2818 = "「Anh Soutetsu, quả nhiên là lợi hại thật.」"
2819 = "「Dương vật giật giật trông có vẻ khổ sở quá. Anh Soutetsu?\\nMuốn bắn ra, tinh trùng, xuất tinh đúng không?」"
2820 = "「Phần đỉnh dương vật, đang đóng mở liên hồi.\\nĐóng mở mút mút, đang bú, ngực kìa.」"
2825 = "「!」"
2826 = "Hăng hái cắn miếng thứ hai.\\nTôi lỡ ngậm luôn cả đầu ngón tay của Paulette vào miệng."
3017 = "Không phải mạnh bạo.\\nMà là cảm giác mơn trớn lúc chạm lúc không."
3018 = "Không cần nói tôi cũng đang nhìn. Không thể nào không nhìn,\\nbầu ngực của Paulette. Bầu ngực vô cùng đáng yêu."
3020 = "Dù không nói ra, tôi cũng hiểu."
3023 = "Không ổn. Trêu chọc hơi dai rồi.\\nLần này, cùng nhau——đến tận sâu đáy tử cung."
3026 = "Nhưng, nếu sự kích thích——độ cứng của nhũ hoa, đè lên lỗ niệu đạo,\\nvà kích thích nó."
3027 = "Chỉ là, so với chính trị gia,\\ncô ấy còn có năng lực cao hơn ở vai trò giám đốc công ty đường sắt mà thôi."
3035 = "Vậy mà lại quá mềm mại, quá nhẹ nhàng.\\nEo tôi cứ ngứa ngáy muốn cử động bằng mọi giá."
3036 = "Nhưng ngay lập tức mỉm cười trở lại,\\nPaulette tung bay tà váy."
3051 = "Chỉ dễ chịu thôi thì chưa đủ.\\nTôi muốn một kích thích mãnh liệt hơn."
3056 = "Chú ếch Hachiroku cõng trên vai một chú sâu nhỏ.\\nChuột chũi Hibiki trang bị một chiếc xẻng to đùng."
3060 = "Lúc nào cũng có thể nhuộm thắm Paulette.\\nNghĩ vậy, cơn khát cũng vơi đi đôi chút."
3064 = "Chỉ trong một khoảnh khắc, tôi có cảm giác như Paulette thuở ấu thơ,\\nđang chồng chéo lên hình bóng của Paulette hiện tại."
3065 = "Bộ phận sinh dục vừa mới xuất tinh xong,\\ntừ lâu đã lấy lại độ cứng."
3067 = "Thêm vào đó là đồng phục tốc hành Ngân Hà của chúng tôi,\\nvà tất nhiên, cả chiếc váy Alice của Paulette nữa——"
3069 = "Nhanh quá lại trở nên mất thăng bằng.\\nVừa nghĩ vậy, tôi lập tức tìm ra cách giải quyết."
3077 = "Cả bầu ngực mềm mại ướt đẫm đến mức trào ra những âm thanh ngọt ngào,\\nlẫn nhũ hoa đang cương cứng tột độ."
3087 = "Nhưng mà——mình nên tự giới thiệu thế nào đây."
3090 = "Có lẽ do sọc dọc của chiếc váy,\\nmà đôi chân trông thon dài hơn mọi khi——Có vẻ ngon miệng đây."
3098 = "Âm đạo, có vẻ đang rất vui sướng.\\nSự kích thích ngọt ngào bất ngờ khiến tôi thốt lên thành tiếng."
3101 = "Nếu xuất tinh thì phải ở sâu nhất——\\nđể nhuộm thắm Paulette bằng tôi——"
3107 = "Không ổn. Làm cô ấy bối rối mất rồi.\\nCậy mạch chuyện đang trôi chảy mà tôi đã đẩy nhanh tốc độ quá. Nhưng——"
3112 = "Chắc chắn Paulette rất sợ phải ở một mình.\\nVà, cô ấy có tính cách muốn được làm nũng, dựa dẫm hoàn toàn vào một người."
3114 = "「……Paulette.」"
3117 = "Có lẽ đó cũng là một phần của sự trêu chọc, Paulette tạo tiếng động nhóp nhép sủi bọt trong miệng,\\nrồi nhỏ nước bọt xuống."
3119 = "Cô ấy rã rời tựa hẳn vào người tôi,\\ncọ cọ má, làm nũng."
3120 = "Chóp chép, chóp chép, chầm chậm, chầm chậm,\\nnhư đang trêu ngươi, nhai nghiền nát chiếc bánh eclair mini——"
3122 = "Xuyên qua lớp quần, như đang đùa giỡn với sự cương cứng——quy đầu của tôi.\\nLàm đến mức đó thì tôi cũng hiểu ra vấn đề. Do đó, tôi quyết định giả vờ không biết."
3124 = "Nhẹ nhàng ấn vào chỗ đang cương cứng hoàn toàn,\\nnhư thể đang kiểm tra độ cứng của nó vậy."
3125 = "Quyết tâm đang tràn ngập khắp toàn thân.\\nSức mạnh ý chí làm đôi mắt sáng rực lên."
3127 = "Lấy ra từ ngăn kéo có khóa trên cùng của bàn làm việc,\\nPaulette bật mở nó ra cho tôi xem."
3129 = "Bị ôm chặt và hôn."
3131 = "Muốn làm tôi xuất tinh.\\nĐầu ngón tay truyền đạt ý định đó lên dương vật."
3134 = "Chuyển động của những ngón tay quá chậm chạp, thành thật mà nói, rất bức bối.\\nTôi muốn vung hông ngay lập tức. Muốn nhét thẳng vào khoang miệng đó."
3136 = "Cạnh bàn tay mang đến kích thích mềm mại cho hai hòn ngọc.\\nKích thích chỉ ngang mức xoa bằng miếng bọt biển, lại càng làm tôi thêm khao khát."
3137 = "Tốc độ, sức mạnh thay đổi hoàn toàn."
3139 = "Tách. Mặt dây chuyền lập tức bị đóng lại."
3141 = "Bầu ngực áp vào từ phía dưới."
3143 = "Dù cô ấy dùng ngón tay để tạo lực nắm mạnh nhẹ khác nhau,\\nnhưng ngay cả phần mạnh nhất, cũng vẫn quá lỏng lẻo."
3144 = "Biết rõ mà còn giả vờ.\\nTôi đang bị cô ấy trả đũa bằng chính trò chơi mà tôi thường thích."
3146 = "Chấn chỉnh lại biểu cảm đang buông lỏng tan chảy,\\ncô ấy xoay ghế lại đối mặt với tôi."
3148 = "Hiểu nhanh đấy."
3150 = "Ngón cái và ngón trỏ siết chặt lấy dương vật.\\nVì đau, tôi bất giác định lùi eo lại——!"
3152 = "Vừa nói, cô ấy vừa dỗ dành ngoan nào ngoan nào,\\nvuốt ve bằng bàn tay rịn mồ hôi."
3154 = "Bị nhét vào, bị ép chặt.\\nBầu ngực, nhũ hoa đang mang đến sự kích thích mà tôi mong muốn."
3156 = "Vừa mút mát, vừa dai dẳng, chầm chậm——\\nliếm láp phần gốc khớp ngón tay đầu tiên của tôi."
3158 = "Tiếng thở dài xen lẫn niềm vui và sự áy náy."
3160 = "Nụ cười thẹn thùng ngây thơ đến mức vô tư lự.\\nBị cuốn theo, tôi bất giác muốn hỏi."
3163 = "Nụ cười ấy, làm ấm lên những suy nghĩ trong tôi."
3165 = "Đôi mắt cũng ngấn lệ ướt át.\\nPaulette đang động dục trước mùi hương của tôi."
3166 = "Tinh hoàn được khích lệ bởi giọng nói ấy.\\nLượng tinh dịch được sản xuất khẩn cấp làm cho bên trong tinh hoàn càng thêm đặc sệt."
3168 = "Ép chặt, ép chặt vào."
3170 = "「Vì là trà Assam,\\nnên em đề cử pha trà sữa nhé——」"
3171 = "Âm đạo lập tức phản ứng. Siết chặt lại.\\nNổi gai ốc, như không muốn quy đầu rời khỏi tử cung."
3174 = "Đôi mắt xanh biếc dao động trong thoáng chốc,\\nrồi chầm chậm, chầm chậm nhìn thẳng vào tôi."
3175 = "Định dùng lỗ niệu đạo——kẹp lấy nhũ hoa ở đó sao.\\nTôi không nghĩ là làm được đâu."
3179 = "Có lẽ vì quá xấu hổ,\\nmà đỏ bừng đến tận mang tai."
3180 = "Ống nghe.\\nCô ấy đang định đưa nó cho tôi."
3181 = "Cô ấy nhíu mày vẻ nghi hoặc——\\nnhưng khoảnh khắc tiếp theo, oa, đã giãn ra."
3183 = "「À, ừm……」"
3185 = "Giọng nói đượm buồn."
3186 = "Nếu đó là sự yếu đuối của người phụ nữ tôi yêu,\\nthì tôi chỉ việc ôm lấy tất cả sự yếu đuối đó, và yêu thương cô ấy."
3189 = "Nếu không vững vàng thì không thể thưởng thức trọn vẹn được.\\nTăng thêm lực ở cánh tay nâng đỡ, điều chỉnh lại góc độ——"
3191 = "Hết"
3203 = "Từ khe hở của môi lớn e ấp đáng yêu,\\nkhẽ lộ ra màu da thịt, dâm thủy tràn trề lai láng."
3205 = "Phía sau cửa vào, chỗ vừa vặn ngón tay chạm tới."
3208 = "Cùng một vị trí, nhưng tùy cách chạm mà khác nhau sao——\\nVừa quan sát phản ứng của Paulette, tôi vừa tinh chỉnh góc độ."
3214 = "Cảm giác hạnh phúc, cảm giác thành tựu, tính độc chiếm, tất cả hòa quyện thành tinh trùng,\\nnhấn chìm buồng trứng của Paulette."
3223 = "Sự áy náy hoàn toàn không cần thiết.\\nĐể thổi bay nó đi, tôi vuốt ve mái tóc cô ấy."
3249 = "「Ưm——ưm——ưm——」"
3250 = "Lời lẩm bẩm buột miệng thốt ra——một câu nói đùa,\\nlại được Paulette tin là thật."
3253 = "Không cần vội. Tôi muốn nhuộm thắm Paulette hoàn toàn.\\nCả trái tim, lẫn những vùng nhạy cảm."
3254 = "Việc nhắc đến chủ đề này, không hiểu sao tôi vẫn luôn lảng tránh,\\nnhưng nếu là nụ cười này thì——"
3261 = "Trở lại tư thế lúc nãy,\\nPaulette ngước nhìn tôi, mỉm cười rạng rỡ."
3262 = "Muốn cứ thế này mà ôm lấy em.\\nMuốn làm tình với em một cách điên cuồng——!!?"
3263 = "Bộ phận sinh dục vẫn đang kết nối với nhau——\\nPaulette nếm thử tôi, và rồi, thì thầm."
3264 = "Dù không trao đổi bằng lời,\\nnhưng mong muốn của tôi, cũng hoàn toàn giống vậy."
3265 = "Mồ hôi, túa ra.\\nTuôn ra ồ ạt như thể thay thế cho việc xuất tinh."
3268 = "「……Ưm——a. Anh Soutetsu.\\nNhột——quá.」"
3270 = "Vuốt ve, nhưng không thọc sâu vào.\\nCó chủ đích, như muốn trêu chọc lại cô ấy."
3271 = "Chỉ tưởng tượng thôi, cũng đã thấy ngượng ngùng sao đó rồi."
3274 = "Thọc thẳng xuống dưới. Ấn cả eo xuống một nhịp——"
3276 = "Nhưng tôi đã dùng lời thỉnh cầu để khóa chặt dục vọng của một con thú đang nghiến răng ken két.\\nVì đó là nguyện vọng của Paulette, nên tôi xích nó lại."
3277 = "「A——em xin phép ạ.\\nƯm——ngoạm——ngoạm——」"
3279 = "Đã đến lúc không thể chịu đựng, không thể dừng lại được nữa, nhưng tôi vẫn cố kìm lại.\\nBởi giọng nói của Paulette khẩn thiết đến mức buộc tôi phải làm vậy."
3282 = "「Quả thực, là thượng hạng. Một hương vị phong phú tuyệt đỉnh.」"
3283 = "Đến giới hạn, mất rồi.\\nMuốn đè Paulette xuống ngay lập tức, lột đồ và thọc sâu vào trong."
3284 = "Tôi đã khao khát đến mức độ đó.\\nĐến tận đầu móng tay cũng đang gào thét đòi hỏi nhiều hơn nữa."
3290 = "Thật đáng quý. Nếu có thể uống, tôi nhất định muốn uống.\\nDục vọng đang kích hoạt các tế bào não."
3292 = "Lời đồng ý dốc hết sức dâng lên tận cổ họng, cùng cái gật đầu.\\nNhưng tôi đã nghiến răng kìm nén lại."
3294 = "「Phù!? （Lùi lạiiiiiiiii!!）」"
3295 = "Muốn hiện thực hóa mong muốn của Paulette.\\nNhưng cũng muốn xuất tinh ngay lập tức."
3297 = "Cảm giác như có thể nhìn thấu một cách bao quát.\\nNhững góc khuất yếu đuối trong tâm hồn mà Paulette đang ôm giữ."
3298 = "Eo tôi ngứa ngáy. Bất giác cử động như muốn bám víu vào bầu ngực\\nđang chạm hờ kia."
3301 = "Có lẽ không cần phải nói thêm nữa,\\nnhưng để tiếp thêm động lực, tôi tiếp tục lời nói."
3302 = "Tôi bế thốc cô ấy lên, đặt nằm xuống bàn trà.\\nNâng hai chân lên, cứ thế phơi bày phần háng ra."
3304 = "Thọc ngón tay vào khe hở."
3305 = "Tôi đặt cuốn truyện sang một bên rồi vỗ vỗ lên đùi,\\nPaulette lập tức ngồi lên."
3307 = "「A——ưm……chụt——phù——a——\\nchụt——chụt——chụt——chụt——」"
3310 = "「Ư hự hự, hự hự hự hự」"
3312 = "Tuyệt vọng kìm nén thêm một giây nữa."
3314 = "Ngoan ngoãn làm theo yêu cầu đó, đưa đẩy trước sau,\\nquy đầu cọ xát vào phần hạt sần sùi ở mặt trên."
3316 = "Vừa vuốt ve mái tóc, tôi vừa luồn những ngón tay vào.\\nCảm giác của cơn mưa vàng giúp suy nghĩ của tôi tĩnh lặng lại."
3318 = "Dù những ký ức xưa cũ thỉnh thoảng ùa về đứt đoạn,\\nnhưng ngay cả chúng cũng bị giọng nói êm ái cuốn trôi đi mất."
3320 = "Không có cảm giác vướng víu gì đặc biệt.\\nNhưng quả thực, phản ứng của Paulette rất rõ rệt."
3323 = "Khoảng thời gian ba mẹ cô ấy sống hòa thuận bên nhau——\\nPaulette đã được bao bọc trong lớp bông gòn của tình yêu thương."
3324 = "Tôi đã vỗ tay trong vô thức.\\nVì tôi đã hoàn toàn bị cuốn hút bởi giọng đọc của Paulette."
3326 = "Dùng mu ngón giữa,\\ntôi mơn trớn dọc theo âm đạo đáng yêu của Paulette."
3328 = "Tôi luồn tay vuốt ve mái tóc Paulette rồi thả ra.\\nMềm mại, như cơn mưa trút xuống những ngón tay."
3329 = "Tận dụng triệt để cả mu móng tay,\\ntừ từ di chuyển qua lại giữa âm vật và cửa âm đạo."
3331 = "Tất nhiên, tôi không muốn tạo gánh nặng quá lớn cho cô ấy.\\nCố gắng xoa dịu dương vật đang gào thét đòi xuất tinh nhanh thêm lần nữa."
3332 = "「Hàm——chụt——rộp——chụt——\\nchụt——（ực）——rộp——rộp——chụt」"
3335 = "Quả thực, đang bị ôm chặt lấy."
3336 = "Cảm xúc chân thành của tôi, có vẻ đã được truyền đạt một cách trọn vẹn."
3339 = "「Ưm……chụt——chụt——rộp——\\nchụt——chụt——liếm——rộp」"
3341 = "Tinh trùng của tôi, tinh dịch nhão nhoét đục ngầu nặng nề,\\nđang nhuộm đẫm khuôn mặt, cơ thể Paulette."
3343 = "「Không——Anh nghĩ làm bẩn bằng nước bọt thì có lỗi lắm.」"
3344 = "Tôi mặc kệ mà lấn tới thêm bước nữa,\\nPaulette liền tuột xuống khỏi đùi tôi."
3347 = "Gỡ bỏ phanh hãm. Tăng tốc.\\nMuốn cùng nhau lên đỉnh. Chỉ lấp đầy bản thân bằng suy nghĩ đó."
3348 = "Chỉ cần vuốt ve phần hạt nổi cộm đó,\\nPaulette đã nhẹ nhàng lên đỉnh."
3349 = "Xoay cổ tay, gập đầu ngón tay thành hình chiếc móc.\\nCứ thế ấn phập vào——"
3353 = "Dù dòng suy nghĩ vẫn chưa kịp sắp xếp lại,\\nnhưng tôi biết mình phải nhận lấy không chút do dự, chỉ có điều đó là rõ ràng."
3354 = "Lời thì thầm nửa đùa nửa thật của tôi,\\nkhiến Paulette đỏ bừng hai má."
3356 = "Sốt ruột, bực bội, xấu hổ.\\nNhưng nếu đó là mong muốn của Paulette của tôi thì——"
3358 = "Thật đáng mừng. Thật đáng quý.\\nNếu được vậy, có lẽ ngày cử hành hôn lễ cũng sẽ được ấn định."
3359 = "Nhưng, tôi muốn ghi nhớ.\\nManh mối về điểm yếu mới của Paulette——"
3361 = "Nên tôi chầm chậm dò dẫm, chuyển động."
3370 = "Phanh ra, chỉ có dương vật đang cương cứng——"
3382 = "Đầu ngón tay của tôi trong nháy mắt,\\nđã nằm gọn trong khoang miệng nóng hổi ướt át của Paulette."
3404 = "「Am.」"
3412 = "Vì chuyển động chậm rãi, nên tôi cảm nhận rất rõ.\\nBên trong âm đạo Paulette cũng đang chào đón tôi."
3422 = "Sự ẩm ướt và trơn trượt, hòa lẫn giữa mồ hôi, nước bọt và chất nhờn.\\nNhưng đồng thời, cảm giác trên da lại mịn màng đến tuyệt đỉnh."
3427 = "「Xong rồi đây, xin mời anh thưởng thức.」"
3430 = "「Ưm——hự——（ực）」"
3476 = "Ngượng ngùng e thẹn, lảng tránh ánh mắt của tôi,\\nngón tay Paulette vẽ vòng tròn."
3477 = "Nụ cười tự hào và dịu dàng đã truyền đạt tất cả."
3478 = "「Ưm……chụt——ưm——hàm——rộp, rộp,\\nchụt, chụt——chụt——rộp, rộp」"
3479 = "「Oa, hồng trà Fauchon và bánh eclair mini này!\\nVui quá, mẹ vẫn còn nhớ.」"
3480 = "Paulette ngày càng đỏ ửng.\\nCơ thể vặn vẹo, ngọ nguậy một cách bức bối."
3481 = "Paulette phả ra hơi thở nóng hổi.\\nCứ như thể đã say men rượu vang rồi vậy."
3482 = "Paulette khịt mũi một cái.\\nKhóe miệng cô ấy hơi hé mở."
3483 = "「À ừm——nếu vậy.\\nEm cũng, muốn ăn thử, ạ.」"
3484 = "Tiếng nuốt nước bọt. Hơi thở nóng hổi.\\nLực ngón tay của Paulette, tăng lên, một chút."
3485 = "Đang bị ăn. Toàn bộ con người tôi.\\nPaulette đang dùng đôi môi ấy để yêu thương, để nếm thử tôi."
3486 = "Paulette ngồi xuống cạnh tôi.\\nNhững ngón tay mềm mại đặt lên bàn tay đang lật từng trang sách của tôi."
3487 = "Đột nhiên, giọng nói lớn như đang quát tháo."
3488 = "Giọng nói của Paulette. Hơi ấm lan tỏa trên đùi.\\nSức nặng, sự êm ái, mùi hương dễ chịu."
3489 = "「Cái này, cứ thế ăn luôn được à?」"
3490 = "「Anh đợi thêm một chút xíu nữa nhé.」"
3491 = "Từ trong ngăn kéo bàn của mình,\\nPaulette lấy ra một cuốn truyện tranh."
3492 = "Paulette nhấc ống nghe lên,\\nbắt đầu quay số không chút do dự."
3493 = "Chắc hẳn cô ấy vẫn rất vui vì sự giúp đỡ nhiệt tình đó.\\nNụ cười bẽn lẽn của Paulette đáng yêu như một thiên thần vậy."
3494 = "Cô ấy giả vờ phồng má phụng phịu."
3495 = "Cô ấy ngơ ngác nghiêng đầu."
3496 = "Paulette mềm nhũn, mất hết sức lực.\\nViệc xuất tinh, cuối cùng cũng dịu lại."
3497 = "Đầu ngón tay Paulette đang kiểm chứng.\\nHình dáng của tôi, kích cỡ của tôi. Kiểm chứng sự trưởng thành của tôi."
3498 = "Đầu ngón tay Paulette vạch quy đầu của tôi ra.\\nLỗ niệu đạo——tách ra, cứ như thể đang vạch môi lớn vậy."
3499 = "Paulette nửa thẫn thờ cúi nhìn cơ thể mình,\\nchậm chạp đưa ngón tay quệt lấy tinh dịch dính trên má——"
3500 = "Chiếc lưỡi hồng liếm nhẹ bờ môi,\\ntừ từ, từ từ, thốt lên từng lời."
3501 = "Bàn tay của Paulette, đã trở thành bộ phận sinh dục.\\nNhững ngón tay ngọ nguậy hóa thành ống thịt, bắt đầu vắt kiệt tinh dịch."
3502 = "Âm đạo của Paulette đã nhão nhoét hết cả rồi."
3503 = "Giọng nói tràn đầy sự tin tưởng.\\nĐôi mắt cũng lấp lánh sự háo hức."
3504 = "Biểu cảm của Paulette chùng xuống.\\nĐôi mắt rưng rưng như chực khóc."
3505 = "Paulette khẽ dịch ngón cái.\\nNhóp nhép——chất nhầy kéo thành sợi, đuổi theo đầu ngón tay cô ấy."
3506 = "Nụ cười của Paulette cũng bừng sáng.\\nGiống hệt như chú ếch, bác sâu, chuột chũi và tất cả mọi người trong bức minh họa."
3507 = "（Tách——tách——）"
3508 = "Vẻ mặt rạng rỡ của Paulette khiến suy nghĩ của tôi cũng bay bổng theo.\\nMà nói đúng hơn là——ừm."
3509 = "Đôi mắt xanh biếc, lấp lánh nhìn thẳng,\\nchỉ nhìn chăm chăm vào một mình tôi."
3510 = "Paulette ngoan ngoãn ngồi xuống,\\nlọt thỏm giữa hai chân tôi."
3511 = "Paulette hớn hở kéo khóa quần tôi xuống."
3512 = "「Hà……ưm……chụt——chụt——chụt——\\nphù, a——thích quá——Anh Soutetsu, ơi——ưm, chụt」"
3513 = "Bị Paulette đẩy nhẹ,\\ntôi lại phải ngồi xuống giường."
3514 = "Đến cả cơ thể Paulette cũng chuyển động theo lời kể.\\nThật ấm áp. Trông hệt như một người mẹ đang kể về đứa con của mình vậy."
3515 = "Paulette mỉm cười hạnh phúc,\\nrồi dịu dàng đọc tiếp cho tôi nghe."
3516 = "Cô ấy cười khúc khích, vẻ mặt như một đứa trẻ tinh nghịch."
3517 = "Cười gượng, cộc.\\nPaulette gõ nhẹ lên trán mình."
3518 = "Ngay lập tức, Paulette giật nảy mình kịch liệt.\\nNếu vậy thì dĩ nhiên, tôi thử lặp lại chuyển động đó."
3520 = "「……À——Đúng là ngon thật.」"
3523 = "Có lẽ để xua đi bầu không khí ngọt ngào cứ đeo bám mãi không buông,\\ncô ấy hắng giọng, nét mặt thoắt cái trở nên nghiêm túc."
3526 = "Vô số nếp gấp bám chặt lấy tôi,\\nnhững rung động ngọt ngào khe khẽ như đang yêu cầu tôi hãy chuyển động đi."
3529 = "「Ưm……」"
3530 = "Từ đó, trượt lên thọc sâu vào trong.\\nXuống rồi lên——tưởng tượng như đang vẽ một vòng tròn theo chiều dọc——"
3545 = "Lực tác động của bầu ngực, của nhũ hoa rất mạnh.\\nChỉ cần vậy thôi, mọi thứ đã thay đổi."
3546 = "Không phải là tham lam chiếm đoạt, mà là sự kết nối.\\nLúc này, tôi đang nhấm nháp niềm vui sướng khi được hòa quyện vào nhau."
3547 = "Một cảnh tượng mà chỉ có từ \"vấy bẩn\" mới có thể diễn tả được.\\nLớp tuyết trắng đục đó rơi lộp bộp, trút xuống chiếc váy Alice."
3548 = "Đẹp quá.\\nTôi chỉ có thể nghĩ đến một từ đó."
3552 = "Bánh eclair, cùng với lưỡi và nước bọt của Paulette.\\nThứ hỗn hợp sền sệt ấy, từ lưỡi chảy thẳng xuống háng."
3554 = "Những ngón tay trắng muốt, vuốt ve đũng quần tôi qua lớp vải."
3556 = "Có vẻ không phải là sách yêu thích……\\nCác trang giấy trắng tinh, còn mới toanh."
3559 = "Hai hòn ngọc bị lắc lư——không, có lẽ trong vô thức,\\ntôi đã lắc lư hai hòn ngọc để tìm kiếm sự kích thích từ cổ tay Paulette."
3577 = "Sẽ có ngày, Hibiki gọi Paulette\\nlà 『Chị dâu』 chứ?"
3578 = "Cơn mưa mang màu sắc giống hệt trong truyện tranh,\\nnhư đang trút xuống cửa hàng đường sắt, xuống tận cõi lòng tôi——!?"
3582 = "Bị lời nói thu hút, tôi nhìn xuống đôi chân cô ấy."
3583 = "Nghe cô ấy nói, tôi mới nhận ra. Người đang nhịn không chỉ có mình tôi.\\nEo của Paulette cũng đang ngứa ngáy, cử động không yên."
3601 = "Mỏ than Jutsu-sen cũng vậy.\\nNgẫm lại thì, cũng dễ hiểu thôi."
3604 = "Để gọi là trưởng thành thì, có lẽ vẫn còn hơi sớm——\\nnhưng đôi gò bồng đảo trắng ngần ấy đã mang nét tròn trịa của người phụ nữ."
3606 = "「Chiếc váy mẹ vợ cất công may cho mà.」"
3624 = "Nói rồi, cô ấy lại cọ cọ.\\nPaulette lại làm nũng với tôi."
3631 = "Bầu không khí này thật khó mà thú nhận rằng,\\nban đầu chỉ là do tôi muốn uống rượu vang giẫm chân của Paulette thôi——"
3638 = "Mang chút cảm giác rượu vang nhè nhẹ của những trái nho chín mọng——\\nHòa quyện cùng vị ngọt ngào êm dịu lan tỏa."
3639 = "Một mặt dây chuyền kim loại cổ điển——\\nKhông, trong trường hợp này gọi là mặt dây chuyền có lồng ảnh thì đúng hơn."
3640 = "Biểu cảm đó cũng rất tuyệt,\\nnhưng quả nhiên, vào ngày vui thì tôi vẫn muốn cô ấy mỉm cười."
3641 = "Một người phụ nữ xinh đẹp và đáng yêu nhường này,\\nlại muốn sinh con cho tôi."
3648 = "Nếu vậy, tôi không thể để một chút e ngại của bản thân,\\nlàm tổn thương lòng can đảm mà Paulette đã thể hiện được."
3649 = "Thấy vậy, tôi chuyển động chậm rãi, biên độ lớn."
3651 = "Theo đà xuất hiện của chuột chũi, mái tóc đung đưa chạm vào tay tôi.\\nBất chợt, tôi có cảm giác như đó là cơn mưa vàng."
3652 = "Dù không thể ngậm lấy bằng lỗ niệu đạo,\\nnhưng độ cứng của nhũ hoa đang cương cứng tột độ đang đâm chọc vào phần đỉnh quy đầu."
3653 = "「…………Hừm. Cái này——tuyệt thật đấy.」"
3660 = "Cứ bất động thì không thể xuất tinh được.\\nNhư muốn bóc tách âm đạo đang làm nũng ra——"
3663 = "Lái tàu là tôi. Railord, dĩ nhiên là Reina.\\nHai chúng tôi đã cùng mặc chung một kiểu đồng phục."
