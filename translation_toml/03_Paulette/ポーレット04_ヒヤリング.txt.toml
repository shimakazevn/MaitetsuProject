[script]
1117 = "——Áp lực gió. Mạnh đến mức khiến tôi mất thăng bằng, tưởng chừng như sắp ngã nhào sang một bên."
1120 = "——Ông Taito đã dạy tôi. Vì không thể cứu được Michiko, nên việc cứu một ai đó khác mới chính là sự đền đáp."
1122 = "——Michiko đã đẩy tôi ra. Dù biết sẽ bị chia cắt, em ấy vẫn cứu tôi khỏi vụ tai nạn."
1132 = "Tôi không hề."
1135 = "Ngay cả việc đi thuyền xuôi dòng sông Kuma cũng phải cải thiện điểm đó…… Fukami dìm lời khuyên quý giá của mình xuống bằng sự tự trào."
1139 = "……Đôi mắt của Hibiki đang nhìn chằm chằm. Không——không phải. Đơn giản chỉ là, nó đang cực kỳ, cực kỳ lạnh lùng."
1142 = "「——Đúng là, như vậy nhỉ. Kẻ có lỗi——không phải là đường sắt, cũng không phải là \\x%l列車;#00ffc040;đoàn tàu%l;#;.」"
1145 = "「——Thật sự, không phải là không giỏi đối phó đâu ạ. Cô Miyamoto, từng là cánh tay phải của ba em mà.」"
1147 = "「——Nếu vậy, ví dụ như…… Phương án biến than đào được thành một loại tiền tệ ảo thì sao.」"
1157 = "「Những buổi \"điều trần chính thức\" như điều trần công khai hay họp báo, chỉ được tổ chức sau khi kế hoạch dự án đã được nội định thôi ạ.」"
1158 = "「Trọng Văn…… Tài sản Văn hóa Quan trọng.」"
1160 = "「……」"
1166 = "「……Tai nạn.」"
1169 = "「……A——」"
1171 = "「……Phiền phức thật.」"
1173 = "「……Tôi, không thể rời mắt được. Tôi không nhìn thấy đoàn tàu, mà là nhìn thấy vụ tai nạn, trong quá khứ.」"
1174 = "「……Xin lỗi nhé. Vì tôi mà cô đã bỏ lỡ mất cơ hội bấm máy rồi.」"
1177 = "「……Đang dùng dao phay, và lỡ tay cắt trúng tay mình bị thương.」"
1181 = "「……Thế này thì, em. Có thể cố gắng được rồi.」"
1348 = "「Đầu giờ sáng là mấy giờ?」"
1349 = "「Thông thường, chúng ta sẽ biết được ngay từ giai đoạn đầu. Cũng có khi chúng ta sẽ nhận được những ý kiến đóng góp kiểu như 'hãy xem xét lại điểm này'.」"
1353 = "「Không——」"
1354 = "「Không.」"
1355 = "「Đúng hơn là——tôi căm ghét nó. Căm ghét, và oán hận. Thậm chí tôi còn muốn kết liễu nó.」"
1358 = "「Không phải đâu, anh trai.」"
1360 = "「Không. Thích…… ưm——…… Ghét? Đường sắt.」"
1362 = "「Không, tôi không hề thích đường sắt.」"
1364 = "「Không, tôi mới là người phải——hửm?」"
1365 = "「Không, thế nên——không chỉ là đào than thôi đâu…… mà còn……」"
1373 = "「Tai nạn, không tốt. Soutetsu-kun. Sợ, đau. Tội nghiệp quá.」"
1377 = "「Việc đào than, trên đời này có ai gọi đó là hoạt động giải trí không? Không đúng không? Bởi vì tên gọi chính xác của nó là \"lao động\" mà.」"
1380 = "「Nhưng, tai nạn. Không phải lỗi của, đường sắt, \\x%l列車;#00ffc040;đoàn tàu%l;#;. Nên. Ghét, là sai.」"
1385 = "「Nhưng đồng thời em cũng là thị trưởng. Vì vậy, em cũng có thể gọi các trưởng phòng ban phụ trách đến cửa hàng đường sắt, nhưng——」"
1386 = "「Nhưng mà, có lẽ chính vì thế…… nên em mới bị đối xử như trẻ con đấy ạ.」"
1389 = "「Nhưng mà, nếu chỉ có một mình em thì…… chuyện đó…… Em nghĩ hai người sẽ nhận ra được nhiều thứ hơn là một người.」"
1392 = "「Em không giỏi đối phó với cô ấy à?」"
1396 = "「Cô đến đây để chụp ảnh đường sắt sao?」"
1399 = "「Bàn tay đó phải—— Hướng tới tương lai mà hành động nhiều hơn nữa mới được.」"
1400 = "「Anh trở thành người đam mê đường sắt rồi à?」"
1401 = "「Cảm ơn em. Em chịu giúp anh một tay nhỉ.」"
1403 = "「Cũng không hẳn là không giỏi đối phó nhưng mà——」"
1415 = "「Ngoài ra thì, để xem nào. Có thể đổi lấy các vật phẩm như rượu shochu hơi nước, kem hơi nước, hoặc là cơm hộp nhà ga kiểu mới chẳng hạn.」"
1420 = "「Vì tính chất như vậy, nên nếu có người ngoài xen vào…… Họ tuyệt đối sẽ không chịu bàn luận sâu đâu ạ.」"
1421 = "「Của cựu thị trưởng sao.」"
1428 = "「Nguy hiểm. Gần quá.」"
1429 = "「Ra là vậy.」"
1430 = "「Ra là vậy, quả thực phải bắt đầu từ những điều cơ bản. Sự cân bằng giữa giá cả và những gì nhận được sao.」"
1455 = "「Á!」"
1458 = "「Hả? A——vậy, vậy sao, ạ?」"
1460 = "「Em sẽ đi gọi ông nội và các bác thợ thủ công nha!」"
1461 = "「Hơiiiiii~」"
1462 = "「Anh trai này.」"
1463 = "「Ồ.」"
1464 = "「Ồ.」"
1465 = "「Không có gì, vậy tôi xin phép. Tài liệu tôi sẽ để lại đây, mong mọi người tận dụng tốt.」"
1467 = "「Ừm.」"
1468 = "「Hửm?」"
1470 = "「À…… đúng vậy nhỉ. Xin lỗi nhé.」"
1472 = "「À…… ra là vậy.」"
1474 = "「À…… nếu làm vậy thì quả thực, sẽ khó tránh khỏi bị chỉ trích là nhập nhằng công tư nhỉ.」"
1475 = "「A!」"
1476 = "「Ừ, ừm.」"
1477 = "「A, xin lỗi.」"
1478 = "「À, không có gì——」"
1479 = "「À, đúng vậy nhỉ. Làm như vậy, rồi kêu gọi tài trợ, là một ý tưởng rất hay đấy.」"
1483 = "「À, ý đó hay đấy.」"
1487 = "「Thích, đường sắt. Tôi hiểu. Muốn, nhìn gần. Cảm giác đó.」"
1488 = "「Ư, ừm.」"
1489 = "「Ưm~……?」"
1490 = "「Ưm……」"
1491 = "「Ưm…… dù nhanh nhất thì cũng phải như vậy sao.」"
1493 = "「Ừm. Em cũng…… nghĩ vậy. Cái đó, có lẽ—— Đối với hầu hết mọi người thì, không đáng để bỏ tiền ra. Đâu. Ạ.」"
1494 = "「Ừm.」"
1495 = "「Ừm!」"
1497 = "「Ừ, gọi Soutetsu-kun cũng được.」"
1498 = "「Ừ, đúng vậy.」"
1500 = "「Chà, chắc…… là vậy……」"
1502 = "「Chắc cô ấy cũng không muốn làm tăng thêm gánh nặng một cách vô ích thôi. Vì Paulette vốn dĩ đã rất bận rộn rồi mà.」"
1506 = "「Cất công đào được than rồi lại ném vào lò hơi của SL, trên đời này người ta gọi đó là làm công cốc đấy.」"
1508 = "「Được thôi. Tôi không có ý kiến gì. Với nội dung đó, thì mức thù lao là 0 yên được chứ?」"
1511 = "「Được thôi, vậy thì ngay lập tức—— À không, đợi tôi một chút.」"
1512 = "「Nếu chỉ ở mức chi phí điều tra, thì có thể giải quyết bằng cách trình dự luật sử dụng quỹ dự phòng. Tiến hành điều tra trong năm tài chính này. Rồi tùy vào kết quả, sẽ thực hiện các biện pháp bảo vệ môi trường từ năm tài chính sau.」"
1514 = "「Trong trường hợp 『Có vẻ không lấy được』 công nhận Trọng Văn. Thì khi đó——」"
1515 = "「Nếu có thể tăng cường các nguồn tài trợ hấp dẫn. Thì phương án này, có thể trở thành một dự án có khả năng sinh lời.」"
1517 = "「Nếu có thể kết nối việc tái sử dụng mỏ than bỏ hoang Jutsu-sen với chấn hưng du lịch, thì Ohimitera chắc chắn sẽ có được sự huy hoàng vượt xa cả trong quá khứ.」"
1520 = "「Nếu có thể thấy được hiệu quả tuyên truyền, thì các sản phẩm tài trợ, cũng có thể sẽ được cung cấp miễn phí đấy nhỉ.」"
1523 = "「Nếu tiến hành cực kỳ suôn sẻ thì, có khả năng là hai năm sau.」"
1527 = "「Hoàn toàn không có. Mỏ than đó——mỏ than bỏ hoang đó, cố tình không có ai muốn đụng đến cả.」"
1540 = "「Cô Miyamoto. Đây là thư ký đặc biệt mới nhậm chức, anh Migita Soutetsu.」"
1541 = "「Cô Miyamoto có ý kiến gì không?」"
1544 = "「Đúng vậy. Ở đây. Chỗ chụp ảnh tốt. Ba tôi. Nói vậy. Tôi. Không. Chụp ảnh giỏi. Nhưng. Bị nhờ.」"
1545 = "「Đúng. Lúc đó.」"
1547 = "「Ban đầu giả sử có đặt mức giá sát nút đi chăng nữa, nhưng nếu tăng được những nguồn tài trợ như vậy, thì phạm vi lợi nhuận cũng có thể mở rộng ra.」"
1551 = "「Nếu là công nhận tài sản văn hóa cấp thành phố hoặc cấp tỉnh, thì có thể thực hiện ngay trong năm tài chính tới. Phòng Tài sản Văn hóa cũng cho biết, có thể nhắm tới mục tiêu Trọng Văn.」"
1557 = "「Đầu giờ sáng của tòa thị chính Ohimitera là, 8 giờ 30 phút sáng ạ.」"
1558 = "「Cậu Migita đây, là người đã lập ra bản dự thảo mà tôi đang giữ sao?」"
1561 = "「Rất vui được gặp cô, Trưởng phòng Miyamoto. Mong cô giúp đỡ nhiều ạ.」"
1563 = "「Căm ghéyt? Oán hựn?」"
1564 = "「Tại sao, chỉ có đường sắt là……」"
1566 = "「Chuyện đó, em đã nói từ đầu rồi mà.」"
1569 = "「Em cũng sẽ——thử khéo léo nói chuyện với các nhà cung cấp, hay mọi người trong hiệp hội du lịch. Xem sao. Ạ.」"
1570 = "「Chuyện cần bàn bạc là, chuyện mà trước đây em đã từng nói qua một chút…… Em muốn nhờ anh Soutetsu, làm thư ký cho em.」"
1573 = "「Chúng ta chỉ cần đề xuất một kế hoạch tái phát triển có khả năng sinh lời, và để hội đồng thông qua ngân sách cho việc đó là được đúng không?」"
1575 = "「Tôi, vừa ngủ quên sao.」"
1576 = "「Là cà vạt. Thư ký mà không thắt cà vạt thì, đúng nghĩa đen là không ra thể thống gì rồi.」"
1579 = "「Này nhé.」"
1580 = "「Tôi á? Tôi là Soutetsu, Migita Soutetsu.」"
1581 = "「Tôi, muốn được nhìn thấy sự huy hoàng đó. Để làm được như vậy——tôi cần sức mạnh của mọi người.」"
1585 = "「Đứng từ góc độ của cô Miyamoto mà nói, chắc chắn Paulette giống như——」"
1586 = "「Đứng từ góc độ của cô Miyamoto mà nói, Paulette, chắc hẳn vẫn trông giống như một vị thị trưởng chưa đáng tin cậy nhỉ.」"
1588 = "「Em nghĩ cô ấy cũng lo lắng cho em như vậy. Thế nên em cũng không thể phản bác lại được.」"
1589 = "「Em nghĩ việc xây dựng hình ảnh, sẽ vô cùng quan trọng đấy.」"
1591 = "「Em hiểu rồi. Cảm ơn anh rất nhiều.」"
1593 = "「Tôi hiểu rồi.」"
1595 = "「Là Miyamoto đây.」"
1596 = "「Tôi không định làm cô giật mình——」"
1598 = "「Tôi đồng ý kiến với cậu Migita. Đó là một cách giải quyết cực kỳ thỏa đáng và thực tế.」"
1599 = "「Tôi đã gặp tai nạn đường sắt, mất đi rất nhiều thứ, và bị tổn thương.」"
1602 = "「Tôi. Cảm ơn. Anh.」"
1605 = "「Vì vậy, tất cả các hoạt động mang tính chất điều tra trước, đều được xử lý dưới dạng \"điều trần không chính thức\".」"
1607 = "「Vì vậy, từ giờ trở đi, em sẽ rửa sạch cái danh tiếng đó.」"
1609 = "「Xin thất lễ.」"
1612 = "「Xin lỗi vì mới sáng sớm đã đột ngột đến tìm anh.」"
1616 = "「Tiếp theo, về vấn đề mỏ than Jutsu-sen. Thành phố đã nhận chuyển nhượng quyền sở hữu và quyền khai thác mỏ than.」"
1619 = "「Nếu vậy thì——」"
1620 = "「Vì là tiền tệ, nên có thể chọn cách sử dụng. Một trong số đó, có thể là trải nghiệm xúc than vào lò, hay trải nghiệm làm \\x%l車掌;#00ffc040;trưởng tàu%l;#; cũng được——」"
1625 = "「Hibiki.」"
1627 = "「Cũng đúng. Dù không biết có thể giúp ích được bao nhiêu, nhưng tôi cũng rất biết ơn nếu được phép tham gia cùng.」"
1629 = "「Đúng là vậy ạ. Nhưng mà, hợp đồng này rất quan trọng. Nó là điều kiện bắt buộc để tham gia các buổi điều trần.」"
1631 = "「Đúng vậy ạ. Cô ấy lúc nào cũng đúng. Hơn nữa, cô ấy luôn dùng dữ liệu để củng cố vững chắc cho lập luận của mình.」"
1632 = "「Vâng ạ. Thế nên, các buổi điều trần với tư cách thị trưởng, tiến hành trong tòa thị chính, dưới cương vị thị trưởng là cách ít xảy ra sai sót nhất.」"
1636 = "「Vậy sao. Chào cậu, cậu Migita. Tôi là Miyamoto, Trưởng phòng Tổng vụ của Tòa thị chính Ohimitera.」"
1637 = "「Ra là vậy. Thế thì, không cần phải giải thích trước nữa nhỉ.」"
1641 = "「Trường hợp xấu nhất, em cũng có thể sử dụng quyền hạn thị trưởng để tự quyết định, nhưng—— Làm vậy thì cũng đồng nghĩa với việc phủ nhận dân chủ mất rồi.」"
1646 = "「Có chuyện gì sao?」"
1647 = "「Có gì cần vẽ thì cứ nói. Em sẽ vẽ cho.」"
1648 = "「Kẻ có lỗi——kẻ phạm sai lầm lúc nào cũng là」"
1659 = "「Người chết thì không thể sống lại—— Đến cả điều đó, cũng là không công bằng sao.」"
1661 = "「Không sao, tôi cũng đang muốn gặp cô đây.」"
1662 = "「Vậy mà, không ngờ người đó lại trúng cử, đường sắt lại thực sự được khôi phục……」"
1663 = "「Vâng, anh ấy chính là người đã lập ra dự án đó.」"
1664 = "「Đúng, là tôi——Ủa? Không, ừm……」"
1671 = "「Paulette sao.」"
1672 = "「Vâng, Thị trưởng Paulette đã đến ạ. Cô ấy nói có chuyện cần bàn bạc.」"
1673 = "「Để anh có thể tham gia, thì cần phải có chức danh. Bởi vì các buổi điều trần trước mắt, sẽ là những buổi không chính thức.」"
1674 = "「Tại sao cô lại nói như vậy? Tai nạn đường sắt, mà đường sắt và \\x%l列車;#00ffc040;đoàn tàu%l;#; lại không có lỗi sao——」"
1677 = "「Vì không còn hy vọng gì vào nhu cầu than đá nữa, và do điều kiện giao thông nên việc tái phát triển cũng rất khó khăn. Vì vậy, có lẽ họ muốn chuyển nhượng để tránh gánh nặng chi phí duy trì và thuế.」"
1679 = "「Reina sẽ giúp đỡ Paulette nha~」"
1682 = "「Về mặt lý thuyết thì là vậy, nhưng—— Chừng nào chưa thấy được khả năng sinh lời, thì việc lập ngân sách là rất khó.」"
1684 = "「Bị đối xử như trẻ con.」"
1685 = "「Khi ở cửa hàng đường sắt, em không phải là thị trưởng, mà là giám đốc của Công ty Cổ phần Đường sắt Ohito, đúng không ạ?」"
1687 = "「Đúng là, nếu bị nghĩ là 『Bỏ tiền ra để bị bắt làm việc』, thì dù giá vé chỉ có 1 yên, cũng sẽ chẳng có ai tham gia.」"
1692 = "「Thấy anh hai vui vẻ như vậy thì…… Là em gái mà. Đành phải hợp tác giúp đỡ thôi.」"
1694 = "「Trông ngài có vẻ mệt mỏi, nên em đã không muốn đánh thức ngài nhưng——」"
1709 = "「Đúng là vậy đó nha. Bỏ tiền ra để đi đào than. Rồi số than đó lại bị lấy đi mất thì, chẳng vui vẻ chút nào đâu nha.」"
1710 = "「Quả thực, yêu cầu duy nhất chỉ là nghĩa vụ bảo mật. Hơn nữa, cũng không hề quy định hình phạt nào khi vi phạm.」"
1712 = "「Nếu các em có thể tính toán chi tiết chi phí bên phía đường sắt, chị sẽ lập bảng mô phỏng thiết lập giá vé cho nhé.」"
1718 = "「Nói đơn giản thì, tôi không thích đường sắt. Nghĩa là, không phải thích.」"
1719 = "「Gì chứ, đi đường vòng một chút thì đã sao…… vì đã quá quen với sự tiện lợi, nên chỉ một chút bất tiện nhỏ cũng không thể chịu đựng được.」"
1721 = "「Nghe nói cô có chuyện cần bàn bạc.」"
1722 = "「Điều trần?」"
1724 = "「Ít nhất vào những ngày như thế này, tôi muốn được ở một mình cơ mà.」"
1727 = "「Số tiền đã trả, sẽ nhận lại được bao nhiêu đền đáp—— Em nghĩ điều đó, sẽ liên quan đến mức độ hài lòng……. Ạ.」"
1729 = "「Nếu nhắm tới mục tiêu Trọng Văn, thì nhanh nhất là bao lâu mới được công nhận?」"
1732 = "「Nếu trở thành Trọng Văn, quốc gia sẽ cấp chi phí duy tu bảo dưỡng cho tài sản văn hóa, và nghe nói mức độ thu hút khách du lịch cũng sẽ tăng lên.」"
1735 = "「Dao phay?」"
1741 = "「Nếu là những chuyện dễ dàng nghĩ ra được, thì đã có người làm từ lâu rồi đó nha.」"
1742 = "「Ghét? Đã ghét, vậy mà——tại sao, anh——. Tên, ừm——」"
1745 = "「Xin hãy đưa em đến di tích tuyến đường sắt khai thác mỏ bỏ hoang. Kinh nghiệm của em, có thể sẽ giúp ích cho việc khôi phục tuyến đường.」"
1746 = "「Mời vào.」"
1748 = "「Bảo cô ấy đợi tôi năm phút. Tôi sẽ thay đồ rồi ra gặp ngay.」"
1755 = "「Tài trợ và tuyên truyền. Nếu vận hành suôn sẻ, sẽ trở thành mô hình win-win nhỉ.」"
1757 = "「Chuyển nhượng sao?」"
1766 = "「Cái này cũng không được cái kia cũng không xong, cảm giác gò bó kinh khủng. Cho dù em biết rằng nghe theo lời cô ấy rốt cuộc mới là đáp án đúng.」"
1767 = "「Về việc đó, trước tiên cũng phải lập ngân sách cho việc điều tra đã. Nếu chỉ là ngân sách để điều tra, thì việc thông qua hội đồng sẽ dễ dàng thôi.」"
1768 = "「Nói tóm lại bản hợp đồng này—— chỉ là để trao cho tôi chức danh thư ký thôi sao?」"
1769 = "「Chuyện đó không thể nào là trách nhiệm của con dao phay được. Không phải do dụng cụ, mà là do tôi đã sử dụng và bảo quản sai cách——」"
1770 = "「Vậy sao.」"
1771 = "「Vậy sao, cô được ba nhờ đến đây chụp ảnh à.」"
1775 = "「Nếu vậy, vé đi thuyền xuôi dòng sông Kuma nữa! Xin hãy cho phép đổi lấy cả vé đi thuyền nữa! Ạ.」"
1789 = "「Cái đó…… Ừm——」"
1790 = "「Ừm…… Dao phay.」"
1791 = "「Dạ…… nó rất là, lý thuyết chung hay nói cách khác là—— một ý kiến cơ bản. Thôi, ạ.」"
1792 = "「À này, anh. Đã rất nguy hiểm. Bởi vì. Đường ray. Rất gần.」"
1793 = "「À. Không sao. Tôi hiểu. Mà. Anh. Đã cứu. Tôi——Bảo vệ. Cho tôi.」"
1795 = "「Chuyện đó là đương nhiên rồi ạ. Bởi vì thực tế, em là một thị trưởng chưa đáng tin cậy mà. Cho đến tận ngày hôm qua.」"
1796 = "「Vậy thì——tạm gác chuyện tái phát triển hay gì đó sang một bên, nhưng tôi nghĩ các biện pháp bảo vệ môi trường là cần thiết.」"
1797 = "「Vậy thì, việc thành phố tiến hành tái phát triển hay mở lại khai thác than sẽ không có trở ngại gì chứ?」"
1798 = "「Vậy thì, chúng ta sẽ nhắm tới mục tiêu Trọng Văn, và trong trường hợp thấy rõ là không có hi vọng, thì sẽ chuyển hướng sang nhắm tới công nhận tài sản văn hóa cấp thành phố, cấp tỉnh thì sao?」"
1799 = "「Vậy thì, nhờ cô yêu cầu các bên liên quan tiến hành theo hướng đó nhé.」"
1800 = "「Nếu vậy, chỉ còn cách trau chuốt nó thêm thôi.」"
1801 = "「Vậy thì, chúng ta nên làm thế nào đây? Làm thế nào để có thể biến mỏ than bỏ hoang thành một điểm nhấn du lịch?」"
1802 = "「Vậy thì, triển vọng được công nhận là thế nào?」"
1803 = "「Vậy thì, vấn đề này trước mắt tôi sẽ mang về nghiên cứu thêm. Cô Miyamoto, cảm ơn cô rất nhiều.」"
1817 = "「Về việc tái phát triển, có yêu cầu nào từ người dân hay ý tưởng nào từ nhân viên không?」"
1818 = "「Không phải là việc tốt thì phải làm ngay, nhưng mà buổi điều trần—— Hôm nay, làm vào ngay đầu giờ sáng có được không ạ?」"
1819 = "「Mặc dù danh nghĩa là hợp đồng lao động, nhưng thực chất, em chỉ yêu cầu nghĩa vụ bảo mật thôi ạ.」"
1820 = "「Soutetsu…… chan?——kun? Soutetsu-kun?」"
1821 = "「Anh Soutetsu. Chào buổi sáng.」"
1822 = "「Anh Soutetsu.」"
1823 = "「Soutetsu-kun. Dùng, dao phay. Tai nạn. Băm băm băm băm, phập. Đau, sợ.」"
1824 = "「Soutetsu-kun. Sẽ? Ghét. Dao phay. ——Có lỗi? Dao phay.」"
1825 = "「Soutetsu-kun. Tại sao? Ghét, đường sắt. Vậy mà, lại nhìn. Chằm chằm. Ở gần?」"
1826 = "「Ngài Soutetsu! Ngài đang nói mớ gì vậy ạ!!」"
1827 = "「Ngài Soutetsu? Ngài Soutetsu!」"
1829 = "「Cảm ơn cô rất nhiều.」"
1832 = "「Không chính thức, và không công khai sao.」"
1834 = "「Trước tiên, về việc công nhận đền Akai Aso là tài sản văn hóa. Với tài liệu mà cô giao, Phòng Tài sản Văn hóa đánh giá là 『Có giá trị cực kỳ cao』.」"
1838 = "「!」"
1839 = "「!!!!!」"
1840 = "「!!?」"
1841 = "「!?」"
1842 = "「?」"
1985 = "Một câu hỏi mộc mạc. Tôi trả lời ngay mà không cần suy nghĩ."
1987 = "Chị Mayami vốn đang giữ im lặng, bất giác thốt lên lời khen ngợi."
1991 = "Khoảnh khắc tiếp theo, Paulette thở hắt ra một hơi thật dài, rồi rũ rượi, nằm bò ra bàn và duỗi người."
1992 = "Những lời tiếp theo, tôi không thể thốt ra khỏi miệng. Có lẽ ếch bị rắn nhìn chằm chằm cũng mang tâm trạng như thế này chăng."
1995 = "Thậm chí, nếu tôi muốn, tôi có thể chấm dứt hợp đồng mà không phải đền bù bất cứ thứ gì."
1997 = "Không chỉ tôi, mà cả Reina, Hachiroku, chị Mayami, Nagi, Fukami——và cả Hibiki nữa."
1999 = "Không phải nằm dài ngang mặt bàn, mà là đứng thẳng lưng—— Bóng lưng của Paulette, quả nhiên trông như thế mới đẹp."
2001 = "Không xong rồi. Bị lây từ cô ấy, đến cả tôi cũng thấy ngại ngùng theo."
2003 = "Không biết có phải do nghe nói em ấy bị đối xử như trẻ con, hay là do nghe nói cô Miyamoto từng là cánh tay phải của cựu thị trưởng hay không."
2004 = "Không đợi tôi trả lời, Hibiki khẽ hừ mũi một cái rồi nhún vai."
2007 = "Không xong rồi, Hachiroku đang hoàn toàn vô cảm. Có vẻ cô ấy định dùng bộ mặt poker đó để cho qua chuyện này."
2009 = "Không, thực ra hoàn toàn không phải. Người được cứu, là tôi mới đúng."
2016 = "Tai nạn là không tốt. Rất đau, rất đáng sợ…… Chúng tôi, những người phải trải qua chuyện đó——đúng là rất tội nghiệp."
2021 = "Nghĩ lại thì, tôi hoàn toàn không biết gì về Paulette cả. Ngay cả việc trong quá khứ đã từng gặp nhau hay chưa, đến giờ vẫn chưa xác nhận được."
2023 = "Đam mê đến mức muốn lưu lại hình ảnh ngày tuyến Yui được khôi phục, nhưng vì bận công việc nên đành phải nhờ con gái đi thay."
2029 = "Cùng với những lời nói đó, cùng với sự thấu hiểu, từng chút, từng chút một. Lớp rỉ mắt tạo nên từ sự oán hận và căm ghét, đang dần bong tróc và rơi rụng."
2032 = "Nhưng mà——"
2034 = "Vậy mà, tôi lại lỡ nghĩ đến nó. Một khi đã nghĩ đến, thì ý nghĩ đó không tài nào dứt ra khỏi đầu được nữa."
2051 = "Chẳng biết có phải mạng sống của tôi là ưu tiên hàng đầu hay không, nhưng tôi mong nó ngừng cái việc lúc nào cũng bay vòng vòng trên đầu tôi đi."
2052 = "Mặc dù chuyến đi thuyền trên sông Kuma, là một trải nghiệm tuyệt vời, vậy mà tôi vẫn cảm thấy thế."
2055 = "Hachiroku đang cúi xuống nhìn tôi. Sự nhận thức dần dần đánh thức não bộ của tôi."
2063 = "Khoảnh khắc đó, nếu bàn tay của thiếu nữ này không kéo tôi lại——"
2071 = "Dù đã kìm nén hết mức, lời nói của tôi vẫn khiến cô ấy lộ vẻ khó xử. Sự hối hận và cảm giác tội lỗi trào dâng mãnh liệt."
2074 = "Ngay cả với tầng lớp ủng hộ Paulette, hay các nghị sĩ thuộc phe phản đối thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;, cũng không thể nào tán thành một phương án mù mịt và gây áp lực lên tài chính của thành phố được."
2076 = "Ra là vậy, thế thì tôi hiểu rồi."
2079 = "Đồng minh thì im lặng. Còn những ý kiến phản đối thì cứ liên tiếp chồng chất lên nhau."
2087 = "Thế mà——"
2114 = "À. Người này quả thực là trưởng phòng, và rất có năng lực."
2116 = "À, thực sự là liên tiếp hiện ra. Chỉ với tôi và Paulette thì không thể nào cáng đáng hết được."
2117 = "Việc dọa nạt làm một cô gái sợ hãi, đó mới chính là việc không tốt."
2119 = "Vì không ai đụng đến nên không thu hút được sự chú ý, mà một khi đã không ai chú ý, thì cũng chẳng có ai bắt tay vào làm."
2122 = "Tiếp xúc với thái độ cực kỳ nghiêm túc ấy, chút buồn ngủ còn sót lại đâu đó trong đầu tôi cũng bay biến sạch."
2124 = "Cùng với những lời tổng kết, những việc cần làm liên tiếp hiện ra trong đầu tôi."
2125 = "Khi trải nghiệm đi thuyền xuôi dòng sông Kuma, tôi đã cảm thấy \"Thành thật mà nói, hơi đắt\"."
2131 = "Đột nhiên bị đè lên người, chắc cô ấy sợ hãi và kinh ngạc lắm. Nghe thấy tiếng kêu gần như là tiếng thét, tôi vội vàng rời khỏi người cô ấy."
2135 = "Sự căm ghét của tôi không thể truyền đạt được. Những điều sâu xa, sẽ không được thấu hiểu. Tôi cũng sẽ chẳng bao giờ gặp lại cô bé tình cờ lướt qua này nữa."
2137 = "Khuôn mặt vẫn ngoảnh đi chỗ khác. Thế nhưng, tôi chắc chắn đã cảm nhận được."
2140 = "Đôi mắt xanh thẳm vẫn mở to, nhưng đầu chân mày lại nhíu chặt lại như đang bối rối."
2141 = "Đôi mắt em ấy khẽ liếc sang nhìn tôi."
2143 = "Cô ấy gật đầu thật mạnh như thể muốn nói \"Đúng là vậy rồi\"."
2145 = "Những dữ liệu bằng con số, được cho là bản ước tính của Phòng Du lịch, được đưa ra."
2147 = "Tài liệu được trải nhanh ra trên bàn. Rất dễ nhìn. Được sắp xếp gọn gàng."
2148 = "Bởi vì vốn từ vựng vô cùng ít ỏi, nên những lời an ủi ấy lại thấm thẳng vào lòng tôi."
2151 = "Cái tên ấy làm rung động màng nhĩ, khiến nhịp tim tôi đập nhanh hơn. Tôi nhớ lại giấc mơ mình vừa thấy."
2153 = "Ngây thơ——giống hệt như đôi mắt của Michiko—— Nghĩ đến đó, tôi không thể kìm lại những lời sắp nói ra."
2155 = "Nghe cô ấy nói vậy, tôi không thể không đồng ý. Ngân sách chỉ có thể được thiết lập khi thông qua hội đồng thành phố."
2157 = "Đôi mắt mở to tròn, ngơ ngác."
2159 = "Hibiki cười gượng, hắng giọng rồi nhắm mắt lại."
2161 = "Trang phục chỉnh tề không chút sơ hở, cùng nét mặt căng thẳng."
2162 = "Nói rồi, em ấy đứng bật dậy."
2163 = "Nói rồi gật đầu, em ấy đứng dậy. Sự buông lỏng trên khuôn mặt đã hoàn toàn biến mất."
2164 = "Tôi cảm nhận được sức thuyết phục từ lời nói đó."
2169 = "Cứ nằm dài như thế rồi cười gượng, ưm…… Paulette khéo léo nghiêng đầu."
2170 = "Một cái cúi đầu nhẹ. Cùng với mái tóc vàng. A…… nếu vậy, cô bé này."
2172 = "Gật đầu. Đôi mắt hướng về phía tôi một lần nữa, chợt dao động trong thoáng chốc."
2175 = "Dù có làm gì cũng không thể xóa nhòa được, nếu làm thế mà có thể giải thoát khỏi mùi máu tanh và tiếng nghiến ken két này thì——"
2176 = "Nếu họ uống và cảm thấy ngon, thì có thể họ sẽ mua một chai một shou về làm quà lưu niệm."
2177 = "Làm vậy, có lẽ sẽ kéo được toàn thành phố vào công cuộc chấn hưng du lịch."
2182 = "Chúng chỉ là hệ thống, chỉ là công cụ. Không thể nào tự chúng làm nên chuyện gì được."
2192 = "Cô Miyamoto lia nhanh ngòi bút, rồi đặt một tờ giấy nhớ lên mép tập tài liệu."
2193 = "Cô Miyamoto không bình luận gì. Thay vào đó, cô khẽ gật đầu."
2194 = "Mở sổ tay ra và nhanh chóng ghi chép lại, sau đó cô Miyamoto ngẩng mặt lên."
2198 = "Nếu vậy thì sao? Nếu vậy thì——"
2199 = "Những tâm tư mà tôi chẳng thể nói với chị Mayami, với Hibiki, hay thậm chí là với cả ông Taito."
2206 = "Thiếu nữ gật đầu, làm động tác băm băm thái nhỏ, để phản hồi rằng tôi không nghe nhầm."
2225 = "Bởi vì gần khu mỏ than bỏ hoang không thể sử dụng \\x%lエアクラ;#00ffc040;Aircra%l;#;, nên bắt buộc phải đi đường vòng rất xa——"
2229 = "Cách cô ấy lặp lại lời tôi như một con vẹt mà chẳng hiểu gì, giống hệt như đang lẩm bẩm tên một loại rượu Tây nào đó, đã rút cạn đi sự hằn học trong tôi."
2230 = "Đường sắt đã bị bỏ hoang từ lâu, nhờ vậy mà tôi mới có thể an tâm sinh sống ở thị trấn Ohimitera này."
2238 = "Tôi không thể nhớ ra nổi. Đến mức hoàn toàn không có chút ấn tượng nào."
2241 = "Để cắt đứt vòng luẩn quẩn đó…… Chỉ với trải nghiệm khai thác than và SL thôi, có lẽ vẫn còn hơi thiếu sót."
2243 = "Sự tức giận đè nén khiến tôi đau đớn, nếu không bật ra thành lời, tôi thậm chí còn chẳng thể thở nổi."
2245 = "Tôi vừa là con nuôi của nhà Migita, đồng thời cũng là nhân viên được cha nuôi thuê."
2247 = "Bầu trời lần đầu tiên tôi nhìn thấy khi chào đời, có lẽ cũng mang màu sắc này chăng. Bất chợt, tôi có cảm giác như mình vừa nhớ ra điều đó."
2248 = "Nhưng tôi lại băn khoăn không biết mình có thể khẳng định chắc nịch như vậy không. Quả thực, tôi đã dấn thân vào đường sắt sâu đến mức phải băn khoăn về điều đó."
2251 = "Dù đối phương có là Paulette đi chăng nữa, tôi cũng không thể ký kết một hợp đồng gây tổn hại đến lợi ích của cha nuôi được, nhưng——"
2252 = "Tôi cũng không nghĩ mức độ khẩn cấp đến mức phải làm như vậy."
2255 = "Chúng tôi vừa chào hỏi vừa cúi đầu đáp lễ."
2256 = "Trước tiên, cứ nghe Paulette nói đã. Tôi tự nhủ như vậy, và trấn tĩnh lại."
2261 = "Tôi nhặt tờ giấy nhớ lên rồi cất vào túi. Paulette không mảy may để ý, vẫn đang nằm dài trên bàn."
2262 = "Về vụ tai nạn trong quá khứ, về vết thương đó. Tôi trút hết ra khỏi cổ họng những căm hờn, đau đớn và khổ sở."
2264 = "Tôi suýt nữa đã nghe nhầm thành, \"hoàn toàn\" có thể nhắm tới việc công nhận tài sản văn hóa cấp thành phố hoặc cấp tỉnh."
2266 = "Tôi như bừng tỉnh, màn sương mù che khuất tầm mắt bỗng tan biến."
2268 = "Tôi định xoa đầu vò rối tóc em ấy như mọi khi—— Nhưng bàn tay tôi đã bị né tránh."
2270 = "Định cất tiếng bắt chuyện——nhưng tôi lại nuốt những lời đó vào trong."
2271 = "Khoan đã——đúng rồi. Nhắc mới nhớ, cho đến tận bây giờ, chưa một lần nào……"
2274 = "Cái tâm lý lười biếng đó, thật đáng ghét. Tôi không thể chịu đựng được quyết định cực đoan là khôi phục đường sắt chỉ vì lý do đó."
2275 = "Thiếu nữ trong giấc mơ——thiếu nữ trong ký ức của tôi, và Paulette, tôi đã muốn xác nhận xem hai người có phải là một hay không, nhưng……"
2278 = "Ánh mắt tôi bị hút chặt."
2281 = "Tôi nhìn Paulette cầu cứu, nhưng em ấy lại nhìn tôi bằng ánh mắt cầu khẩn với khuôn mặt pha lẫn sự xấu hổ và bối rối."
2283 = "Đối với một thiếu nữ mới gặp lần đầu, rốt cuộc tôi đang đòi hỏi điều gì cơ chứ——"
2284 = "Chỉ vì vẻ bề ngoài mà tôi đã cảm thấy nghi ngờ, thật xấu hổ cho sự nông cạn của bản thân."
2286 = "Hình ảnh của Paulette hiện tại, có nét gì đó trùng lặp với hình ảnh Hibiki đang phản kháng lại chị Mayami."
2287 = "Tôi nghe thấy âm thanh đó. Cơ thể run rẩy, trước mắt tối sầm lại và chuyển sang màu đỏ, lồng ngực như bị bóp nghẹt."
2289 = "Tôi biết chứ. Tôi biết, nhưng nó quá đau đớn, quá ngột ngạt."
2290 = "Do đó tôi giơ tay lên, cô Miyamoto liền hỏi tôi có chuyện gì."
2291 = "Tiếng quát tháo chực trào ra khỏi cổ họng, nhưng bằng cách nào đó——tôi đã nuốt nó xuống."
2294 = "Tôi gật đầu đáp lại giọng nói của Paulette."
2295 = "Có lẽ vì thấy tội nghiệp cho tôi khi bị Nagi chém đứt làm đôi, Fukami rụt rè giơ tay lên."
2296 = "Có lẽ vì cảm thấy \"nguy hiểm\", cơ thể tôi tự động phản ứng."
2300 = "Vì vậy, tôi chuyển hướng góc nhìn."
2302 = "Do đó, chức danh \"thư ký đặc biệt\" của tôi——"
2315 = "Tôi nghe nói điều đó đã dẫn đến yêu cầu khôi phục đường sắt."
2325 = "Nếu cô ấy là cánh tay phải đó, thì ra là vậy, sự xuất sắc của tập tài liệu này cũng là điều dễ hiểu——"
2326 = "Nếu xử lý khẩn cấp hay trị tận gốc đều mất cùng một khoảng thời gian, thì tất nhiên, chúng ta nên hướng tới việc trị tận gốc."
2327 = "Đường sắt đã đẩy Michiko vào chỗ chết, nên nếu nó có bị diệt vong, thì đó cũng là quả báo thích đáng."
2335 = "Hibiki đang hướng tấm lòng của mình về phía chúng tôi."
2336 = "——Không nên nói những điều bất cẩn. Sự phán đoán đó, đã làm thay đổi những lời sắp thốt ra khỏi cổ họng tôi."
2345 = "Cô ấy có hiểu được hay không. Khoảng không tĩnh lặng đầy hoang mang đó, đã được lấp đầy bằng những lời thì thầm."
2348 = "Đúng vậy. Từ bây giờ. Danh tiếng xấu thì cứ rửa sạch là được. Những điều chưa biết thì cứ tìm hiểu là xong."
2360 = "Paulette cũng gật đầu một cái, mím chặt môi lại."
2361 = "Nhanh chóng xóa đi biểu cảm đó, Paulette nở một nụ cười điềm tĩnh."
2362 = "Nhìn là thấy, Paulette đang nín thở. Tiếng bước chân của cô Miyamoto, dần xa…… rồi không còn nghe thấy nữa."
2363 = "Paulette mím môi, liếc nhìn sang tôi."
2364 = "Đối với Paulette, và cả đối với tôi, chắc chắn sẽ làm được."
2365 = "Với Paulette, người có thể gọi cô Miyamoto đến bất cứ lúc nào, thì tờ giấy nhớ này đâu có cần thiết——"
2366 = "Gật đầu xác nhận, Paulette nói thêm với giọng điệu đầy áy náy."
2367 = "Gật đầu xác nhận, Paulette hơi rướn người về phía trước."
2379 = "Vì vậy, để chào đón ngày mai đó. Việc đầu tiên cần làm, chỉ có một mà thôi."
2381 = "Sau đó em ấy từ từ mở mắt ra và nhìn tôi."
2385 = "Nhưng nếu sự lãng mạn của việc dùng than mình đào được để vận hành SL, lại chẳng có chút sức hút nào đối với những người không thích đường sắt thì——"
2387 = "Đó là sự lãng mạn mà tôi và Paulette đều hiểu. Nếu được tự do lựa chọn, thì tất nhiên đó cũng sẽ trở thành một sự lựa chọn."
2388 = "Về lời nói \"trau chuốt thêm\" mà tôi lỡ thốt ra, tại sao Paulette và cô Miyamoto lại lộ vẻ mặt ngạc nhiên đến thế."
2390 = "Khi tôi ký tên vào bản hợp đồng đã được chuẩn bị sẵn, Phù. Khuôn mặt Paulette lộ rõ vẻ an tâm."
2392 = "Trông có vẻ gì đó hơi cô đơn, nhưng cũng có chút vui vẻ."
2400 = "Chỉ vậy thôi. Chỉ những lời nói đó thôi, mà nặng nề như một khối đắng ngắt khổng lồ."
2403 = "Đôi mắt xanh thẳm, nhìn chằm chằm vào tôi."
2411 = "Trao cho tôi chức danh thư ký do Paulette đích thân thuê mướn, và buộc tôi phải chịu nghĩa vụ liên quan đến bảo mật."
2419 = "Cái đường sắt đáng chết kia, nếu xảy ra tai nạn ngay trong ngày đầu tiên khôi phục—— Thì tôi có thể kết thúc mọi thứ một cách 『công bằng』……"
2420 = "Và Reina thì, hoàn toàn không nghe chúng tôi nói gì. Cô bé chỉ đang làm nũng Paulette như một chú mèo con đang cọ mùi."
2422 = "Nghe vậy, tôi mới à lên hiểu ra."
2423 = "Trước một từ quá đỗi đường đột, tôi thử dùng cử chỉ tay để xác nhận lại."
2424 = "Trước lời lẩm bẩm buột miệng của tôi, Paulette và cô Miyamoto, không hiểu sao lại cùng lúc làm ra vẻ mặt ngạc nhiên."
2425 = "Vừa dứt lời, mặt Paulette bỗng đỏ bừng."
2426 = "Theo như lời Paulette, thì người được gọi đến là Trưởng phòng Tổng vụ, nhưng——"
2429 = "Ít nhất là, kết thúc mọi thứ đối với tôi."
2430 = "Thay vì dồn thời gian vào một dự án có khả năng thành công thấp, thì thà dứt khoát từ bỏ và tìm kiếm một phương án tốt thứ hai."
2431 = "Nếu được công nhận là Trọng Văn, có thể kỳ vọng lượng khách du lịch sẽ tăng lên đôi chút. Nhưng nếu chỉ là công nhận tài sản văn hóa cấp thành phố, cấp tỉnh, thì lượng khách gần như không tăng lên."
2439 = "Mùi máu tanh. Tiếng sắt thép nghiến vào nhau. Xúc cảm mềm nhũn, vô lực—— Tất cả đột ngột trào lên, bò từ dưới chân tôi lên."
2441 = "Bị kéo vạt áo khoác, ngay khoảnh khắc tôi phản xạ định quay lại nhìn——"
2450 = "Thế nên tôi bất giác, không thể không hỏi."
2465 = "Đang nói dở, tôi vội vàng nuốt lại những lời đó ở thời điểm nguy hiểm."
2468 = "Đúng là vậy. Ví dụ, than đào được có thể đổi lấy một chai một go—— một cốc rượu shochu hơi nước."
2469 = "Vừa nói, Paulette vừa đưa ra một tờ giấy."
2485 = "Michiko đã chết. Kẻ đã đẩy Michiko vào chỗ chết là tôi, đáng lẽ ra cũng phải chết."
2494 = "Cảm thấy như vậy, sự ngột ngạt trong tôi, cũng dường như dịu đi đôi chút."
2495 = "Sự thoải mái đó, đã bóc trần những suy nghĩ bám chặt nơi cổ họng và trái tim tôi."
2496 = "Lần này đến lượt tôi cúi gập người. Những lời nói mang vẻ bối rối và khó xử lướt qua trên đỉnh đầu tôi."
2497 = "Quả thực đó cũng là, một trong những đáp án đúng không sai."
2498 = "Bước vào phòng thị trưởng, là một người phụ nữ trung niên với vóc dáng cực kỳ nhỏ nhắn."
2503 = "Trước cả khi tôi mở lời nhờ vả, mọi người đã trao cho tôi sức mạnh và những lời động viên."
2504 = "Mái tóc vàng tung bay trong cơn gió vẫn chưa dứt. Đôi mắt màu xanh thẳm. Một màu xanh trong trẻo hơn cả bầu trời Ohimitera, hơn cả dòng sông Kuma."
2506 = "Người đã cứu tôi là Navi, và hiện tại nó vẫn đang giúp đỡ tôi. Chuyện đó tôi biết rõ hơn ai hết, nhưng mà——"
2512 = "Trên tờ giấy nhớ viết tay, là một số điện thoại. Không nghi ngờ gì nữa, chắc chắn là của cô Miyamoto."
2514 = "Thế thì điều trần công khai còn ý nghĩa gì nữa."
2515 = "Nếu vậy, ba của cô bé này chắc hẳn là kiểu người đam mê đường sắt."
2516 = "Nếu vậy, phải tạo ra ấn tượng rằng đó không phải là 『lao động』."
2517 = "Nếu vậy, tôi cứ ngoan ngoãn giữ lấy vậy."
2518 = "Nếu vậy, việc tuân thủ chặt chẽ các bước điều tra——rồi đưa ra biện pháp nếu cần thiết, quả nhiên vẫn là cách tốt nhất."
2530 = "Và rồi trong khoảnh khắc, cô ấy nhìn mặt tôi. Cúi chào Paulette một cái, rồi cứ thế lặng lẽ rời khỏi phòng."
2531 = "Dù nghĩ vậy, nhưng khi thấy khuôn mặt buồn bã của em ấy nói rằng \"Cơ quan hành chính là vậy đó\", thì tôi cũng chỉ còn cách nuốt sự bất mãn đó vào trong."
2532 = "Một trong những ứng cử viên thị trưởng, muốn khôi phục tuyến Yui thành đường sắt của thành phố ……Tôi đã tin chắc rằng sẽ chẳng có ai quan tâm đến một lời hứa hẹn tranh cử như vậy."
2533 = "Mục thù lao hiện tại đang để trống nhưng…… Dù nghĩ thế nào đi nữa, 0 yên mới là con số hợp lý cho nội dung này."
2534 = "Tự bản thân tôi cũng thấy nó thật đơn giản, nhưng được khích lệ bởi lời khen đó, lời nói của tôi cũng thêm phần dõng dạc."
2567 = "（Không, được——chuyện, đó）"
2569 = "（Nhưng nếu làm vậy——những gì Michiko đã làm sẽ trở nên vô ích.）"
2572 = "（Ra là vậy…… Một vòng luẩn quẩn điển hình sao.）"
2575 = "（Cốc cốc）"
2576 = "（Ô kìa?）"
2578 = "（Xình xịch, xình xịch）"
2580 = "（À, đúng rồi——chắc chắn là mình 『làm được』.）"
2581 = "（Cạch）"
2582 = "（Vù!）"
2584 = "（Nếu mình…… cứ thế này bị cán qua thì——）"
2586 = "（Mình đã chấp nhận. Mình đã hiểu rồi. Đó là lý do tại sao, mình vẫn đang sống một cách thảm hại thế này.）"
2587 = "（Giật nhẹ）"
2589 = "（Nghe em ấy nhắc đến từ \"ba\" nhiều như vậy—— Nhưng Paulette đã từng nhắc đến \"mẹ\"…… dù chỉ một lần chưa nhỉ?）"
2590 = "（Gửi cho mình sao.）"
2595 = "（Trong những trường hợp như vậy, từ trước đến nay, chắc em ấy toàn bị ép phải từ bỏ kế hoạch luôn nhỉ——）"
2596 = "（Nhắc mới nhớ, mấy ngày nay, thời gian tôi và Paulette ở riêng với nhau khá nhiều nhỉ.）"
2599 = "（Chắc hẳn cô bé này đã lớn lên trong sự yêu thương—— đến mức không cần phải học những từ như căm ghét, hay oán hận.）"
2601 = "（Nếu vậy——Hachiroku và Reina, chắc, sẽ……）"
2603 = "Navi đã từng nói khi chúng tôi đang ở trên không. Rằng tài năng chính trị của cựu thị trưởng Hinai, được đánh giá rất cao."

[selections]
