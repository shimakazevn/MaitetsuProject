1026 = "「Ưm... phù... v, âng——Tim đập, nhanh——thế này——là lần đầu, tiên... ưm phù.」"
1027 = "「Ưm... hự.」"
1028 = "「Ưm... ưm~~――――ngoạm!」"
1030 = "「Ừm... Chúng ta——đang hòa làm một.」"
1032 = "「Ưm...——Paulette.」"
1034 = "「Không... chuyện này—— Đúng là việc mà những người yêu nhau hay làm thật.」"
1036 = "「Vâng. Bây giờ em sẽ... à ừm, dùng miệng... để làm sạch, cho cậu nhỏ của Soutetsu, nhưng mà.」"
1038 = "「À. Nghe em nói mới nhớ đúng là vậy... nhưng mà.」"
1039 = "「A.」"
1041 = "「Ưm phù! Trực, tiếp——á——tuyệt quá.」"
1042 = "「Ừm!」"
1044 = "「Vâng! Soutetsu.」"
