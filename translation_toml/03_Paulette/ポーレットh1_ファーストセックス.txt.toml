1062 = "「Tuyệt thật... ướt át đến nhường này cơ à.」"
1063 = "「Thật là... sung mãn... hơn nữa, còn lớn quá...」"
1065 = "「Nóng, quá——ưm——tuyệt quá... nhiều... thật... phá——tử cung, ưm——âm đạo, ngập tràn rồi.」"
1066 = "「Anh hiểu rồi.」"
1068 = "「Nếu anh lại... muốn, x, xuất tinh... nữa thì—— Trước lúc đó——hãy báo cho em biết, sớm một chút, nhé?」"
1071 = "「À, ừm——thì là——tì, tì, tìn——tình... Cái đó! ——Ng, ngủ cùng nhau, hay gì đó, em muốn thử.」"
1075 = "「Nhịp tim, quả thực đập rất mạnh——」"
1078 = "「So với lúc ngủ cùng Reina... hoàn toàn... khác biệt—— Tim em đang đập rất nhanh.」"
1081 = "「Ư... em vui, lắm... ngực của, em—— được Soutetsu, thích... như vậy... ưm.」"
1082 = "「E, em... những chuyện ở mức độ kiến thức phổ thông thì, chắc là... em nghĩ là em biết được, mức tối thiểu.」"
1084 = "「Anh cũng vậy.」"
1085 = "「Em! Em, cũng! Ra——ra, mất!」"
1088 = "「Em cũng vậy! Cái đó——... à, ừm............」"
1089 = "「Vì anh rất yêu Paulette. Anh muốn hòa làm một với em. Anh muốn làm tình.」"
1092 = "「Em rất muốn anh xuất tinh vào trong miệng em, em cũng rất muốn uống nó, thực sự rất muốn. Nhưng mà.」"
1095 = "「Anh thấy vui lắm. Nhờ cơ thể Paulette hơi cứng, mà anh mới có thể nhìn thấy dáng vẻ xinh đẹp này ở khoảng cách gần đến thế.」"
1096 = "「Em nghĩ là em có thể giải thích được... Chân em—— Anh giữ chân em, như thế này được không?」"
1098 = "「Anh muốn nhìn thấy cơ thể trần trụi của Paulette, cũng muốn chạm vào nó. Trước đây anh hoàn toàn không có cảm giác này, nhưng bây giờ thì có.」"
1099 = "「Em, âm... đạo... chắc là... ổn rồi... cảm giác, thế——ưm——nên là.」"
1102 = "「Anh xuất tinh——đây——cùng nhau——cùng nhau, nhé.」"
1103 = "「Anh nghĩ là anh đã thay đổi rồi. Paulette, anh yêu em. Anh đã nhận ra mình đang yêu em.」"
1106 = "「Nên là——ưm, hãy di, chuyển... a... Soutetsu, này——bên trong, em——ưm, đi anh!」"
1108 = "「Vậy, nên là... à ừm, cái đó... em và, anh Soutetsu, có thể coi là... ng, người yêu của nhau... đúng không anh?」"
1109 = "「Xin hãy——đón nhận em——ưm——Soutetsu, này—— Hãy cho em——làm——cô dâu, của anh——nhé——ưm.」"
1111 = "「Ở rãnh nứt, cái chỗ giống như môi bên ngoài ấy... môi lớn, Soutetsu——anh hãy dùng ngón tay, vạch nó ra đi.」"
1114 = "「Đ, đúng không anh.」"
1115 = "「V, vậy sao anh?」"
1119 = "「Vâng ạ. Rũ bỏ mọi chức danh, em chỉ đơn thuần là Hinai Paulette. Không cần cố tỏ ra người lớn, là một con người trần trụi, chân thật nhất của em.」"
1120 = "「Đúng vậy, tim anh cũng đang đập rất nhanh.」"
1121 = "「Vậy... sao anh?」"
1122 = "「Vậy, sao.」"
1123 = "「Vâng. Em. Em muốn làm tình với Soutetsu.」"
1126 = "「Có thì có ạ... nhưng mà, có nhiều chuyện lắm.」"
1133 = "「Paulette... anh——sắp——xuất tinh rồi.」"
1134 = "「Paulette. Anh muốn nhìn thấy cơ thể trần trụi của em——muốn nhìn ngực em.」"
1135 = "「Paulette.」"
1136 = "「Paulette!」"
1137 = "「Paulette! Paulette! Paulette!」"
1138 = "「Paulette——, hãy hòa làm một——hòa làm một với anh nhé.」"
1139 = "「Để dễ dàng làm sạch hơn nhé? Soutetsu, anh có thể quỳ gối lên được không?」"
1144 = "「Sau đó... ưm——cứ giữ nguyên thế này, nhé anh. Xin lỗi anh, cơ thể em... hơi cứng.」"
1145 = "「Và, à thì—— Hôm nay, em rủ Soutetsu về nhà là vì, chuyện đó.」"
1148 = "「D, dùng tay chạm vào chỗ đang cương cứng... Cảm giác, tuyệt vời——đến thế sao anh?」"
1149 = "「Đương nhiên rồi. Anh đã coi Paulette là người yêu của anh rồi.」"
1155 = "「Không gian tách biệt với công việc sao.」"
1157 = "「Bị cọ xát——vui, quá——như bị đóng dấu—— là đồ của——Soutetsu——em ấy——ưm.」"
1164 = "「Đây là phòng của Paulette sao.」"
1165 = "「Thế này, là——」"
1166 = "「Ở đây——sao.」"
1167 = "「Vào... rồi, này——ưm——nóng, quá—— Của Soutetsu, này——vào hết——á——trong em, rồi.」"
1168 = "「Hơn nữa! Dù có nhỏ, nhưng em vẫn muốn có một không gian tách biệt với công việc. Em nghĩ điều đó là cần thiết.」"
1169 = "「Thật này... Soutetsu, tim anh, đang đập, rất nhanh nhỉ.」"
1171 = "「V... Vậy thì, em sẽ làm sạch, sẽ làm sạch—— ........................liếm.」"
1173 = "「À, ừm... chúng ta... đã... tỏ tình với nhau rồi, phải không anh?」"
1176 = "「À, ừm, không phải đâu! Soutetsu.」"
1177 = "「Nếu vậy, người đang ở đây không phải là Giám đốc, không phải Thị trưởng, cũng chẳng phải người lái tàu, mà chỉ là một thiếu nữ bình thường, Paulette nhỉ.」"
1178 = "「Lần đầu tiên... ngay từ lần đầu tiên. Em muốn nhận lấy... t, tinh trùng của Soutetsu. Em muốn đón nhận phân thân của Soutetsu, vào trong tử cung của em.」"
1179 = "「Hơi chật hẹp một chút, nhưng anh cứ vào đi ạ.」"
1180 = "「Dù là căn hộ 2K, nhưng nếu có cả Reina thì chẳng phải sẽ hơi chật sao? Là Thị trưởng thì hẳn là có cả dinh thự công cơ mà.」"
1181 = "「Soutetsu... này——ưm——chụt——chùn chụt.」"
1182 = "「Soutetsu... cơ thể khỏa thân của em... chẳng phải anh đã thấy lúc tắm... ở Tororyu-yu rồi sao.」"
1183 = "「Sou, tetsu——này——á——ưm—— Soutetsu, này.」"
1184 = "「Soutetsu——này——á——yêu anh! Yêu anh lắm!」"
1185 = "「Soutetsu...」"
1186 = "「Soutetsu... Soutetsu.」"
1316 = "Cảm giác vừa vặn như thể đầu dương vật đang bị nuốt chửng, bị hút vào. Ngay khoảnh khắc đó, tôi đã hiểu."
1318 = "Một mùi hương ngọt ngào khác với lúc nãy thoảng qua, tôi chợt nghĩ, phải chăng đây là mùi hương khi ngủ của Paulette."
1319 = "Bất an, bối rối hay dục vọng. Tất cả đều bị cuốn phăng đi trong chốc lát bởi một thứ cảm xúc thuần khiết và to lớn hơn."
1324 = "Ngủ cùng nhau thì có gì to tát đâu."
1327 = "Nhưng ngay sau đó, đôi tay ấy kéo áo lót xuống——"
1328 = "Nhưng hơn thế nữa, cảm giác từ lòng bàn tay——"
1330 = "Không, không phải vậy. Sự khác biệt đó, chắc chắn, có lẽ là do——"
1345 = "Trí tưởng tượng khôi phục lại độ cương cứng của dương vật, cùng lúc với sự giải phóng từ bàn tay Paulette ——Hai khoảnh khắc trùng khớp nhau một cách hoàn hảo."
1350 = "Khoái cảm bùng nổ từ sống lưng lên tận não bộ, mọi thứ trước mắt tôi trở nên trắng xóa."
1351 = "Những thứ vừa bị vắt kiệt đang dần được bổ sung lại. Cảm nhận được điều đó, cơ thể tôi dần lấy lại hơi ấm."
1365 = "Rãnh thịt ngập tràn sắc đỏ tươi sống động, đập thẳng vào tầm mắt tôi."
1367 = "Bị mút mát quá đỗi mãnh liệt khiến tôi nghẹt thở, miệng khô khốc."
1373 = "Cùng với ánh mắt đó, ngay cả khí thế trong giọng nói cũng giảm dần——"
1375 = "Khoảnh khắc phá vỡ được rào cản, hông tôi lao thẳng một mạch vào tận sâu bên trong không thể dừng lại!"
1376 = "Khoảnh khắc tôi báo sắp xuất tinh, Paulette liền nhả dương vật của tôi ra khỏi miệng."
1379 = "Nghe theo lời giục, tôi quỳ gối bên cạnh Paulette."
1384 = "Vừa nói, Paulette vừa cởi phăng chiếc quần lót."
1385 = "Cô ấy nói với vẻ vô cùng ngượng ngùng, ánh mắt vẫn không dám nhìn tôi. Sự ngại ngùng đó dường như lây sang cả tôi."
1388 = "Phần kết nối co bóp liên hồi, run rẩy hết sức như muốn dẫn dắt tôi tiến sâu vào trong."
1389 = "Không hề e thẹn, cũng chẳng hề sợ hãi——"
1392 = "Điều đó khiến tôi vui sướng, cơ thể nóng ran và khao khát nhiều hơn nữa, động tác của tôi cũng trở nên bạo dạn hơn."
1394 = "Môi và lưỡi không ngừng di chuyển, khoang miệng thu hẹp lại và mút mát. Khoái cảm quá mạnh mẽ khiến tôi có cảm giác dương vật như bị lộn ngược——"
1395 = "Đôi môi mấp máy thở dốc trông vô cùng đáng yêu, tôi cúi người xuống, trao cho cô ấy một nụ hôn ngấu nghiến."
1397 = "Cô ấy trút những lời nói và cảm xúc vào tôi. Một cách trực diện, vô cùng trực diện."
1400 = "Một giọng nói vô cùng hối lỗi."
1401 = "Cô ấy lại khẽ liếm môi, đôi mắt xanh biếc nhìn thẳng vào tôi."
1404 = "Một giọng nói ngọt ngào. Làm tan chảy màng nhĩ và lan tỏa đến tận não bộ."
1410 = "Cổ tử cung đang chuyển động đòi hỏi tôi. Cả tâm hồn lẫn thể xác của Paulette đều đang khao khát tôi."
1417 = "Đối với Paulette, nơi đó cũng chính là hiện trường nơi gia đình cô tan vỡ."
1418 = "Dù có cứng nhắc theo nghĩa độ dẻo dai của cơ thể, thì đó cũng hoàn toàn không phải là điểm trừ."
1425 = "Khoái cảm cơ thể quá mãnh liệt khiến não bộ tôi có chút mông lung, từ từ, chậm rãi tiếp thu những lời cô ấy vừa nói."
1427 = "Đi bộ từ Rail Shop chưa đầy ba phút. Về vị trí thì đây quả là một căn hộ nhỏ nằm ở khu đất vàng trước ga."
1433 = "Điều đó từ từ tích tụ trong tôi một thứ khoái cảm đi kèm với sự khao khát."
1439 = "Ngay khoảnh khắc nghĩ đến điều đó, cổ họng tôi tự động nuốt khan một cái rõ to."
1442 = "Tình yêu thương, ham muốn độc chiếm, tất cả tuôn trào, hòa quyện, đọng lại thành một thứ sền sệt, tiếp tục dâng trào mạnh mẽ."
1445 = "Trao đổi thể dịch cho nhau, chúng tôi tiếp tục khao khát được hòa quyện vào nhau nhiều hơn nữa."
1446 = "Khi nụ hôn kết thúc, cơ thể Paulette dường như càng thêm ấm áp và mềm mại hơn."
1447 = "Toàn bộ sức lực trong cơ thể cũng bị hút cạn, trút hết ra ngoài, cơ thể tôi đổ gục xuống, được bao bọc trong da thịt mềm mại của cô ấy."
1450 = "Sợ phát ra tiếng kêu kỳ quái, tôi cố kìm nén nó lại nơi cổ họng."
1451 = "Tôi chỉ thốt lên được mỗi câu đó. Dù không nói nên lời, nhưng những ngón tay lại lập tức vươn tới."
1454 = "Có lẽ tôi đã để lộ suy nghĩ ra mặt mất rồi."
1455 = "Tôi lỡ lời rồi. Thị trưởng tiền nhiệm, cha của Paulette, từng sống ở dinh thự công..."
1458 = "Muốn gỡ rối mớ bòng bong đó, muốn cùng nhau tìm ra câu trả lời——"
1460 = "Khao khát. Tôi khao khát mọi thứ của Paulette. Tôi muốn Paulette đón nhận mọi thứ của tôi."
1461 = "Đúng rồi. Paulette đã nhờ tôi làm vậy."
1463 = "Tôi có cảm giác dương vật của mình như đang tan chảy và bị lộn ngược ra."
1466 = "Không biết từ lúc nào, chuyển động của bàn tay tôi đã thay đổi. Từ xoa vuốt chuyển sang nắn bóp, đến mức không thể không thay đổi——"
1468 = "Ôm chặt lấy cơ thể đang nũng nịu của Paulette."
1469 = "Dương vật của tôi đã căng phồng đến cực hạn. Tinh dịch đang điên cuồng muốn tuôn trào ngay lập tức."
1472 = "Dường như cả hơi thở của tôi, cũng đang bị vắt kiệt từ đầu dương vật vào tận tử cung của Paulette."
1473 = "Hình ảnh đó, nhận thức đó, khiến nhiệt độ cơ thể tôi tăng vọt."
1475 = "Dù vậy tôi vẫn cố gắng siết chặt mông, dùng những chuyển động nhấp nhô thật nhỏ để ép đầu dương vật vào tử cung của cô ấy."
1478 = "Rốt cuộc tôi đã trưng ra vẻ mặt như thế nào vậy?"
1479 = "Cảm thấy chạm bằng ngón tay thì thật uổng phí, tôi thử ấn đầu dương vật đang cương cứng vào vị trí vừa được chỉ."
1482 = "Tôi chạm tay qua lớp áo lót, dùng ngón tay xoa nắn và vờn quanh núm vú."
1483 = "Căn phòng mang một vẻ ngoài vô cùng giản dị, đến mức khó tin đây lại là nơi ở của Thị trưởng kiêm Giám đốc Đường sắt Ohimitera."
1492 = "Đang dần được lấp đầy. Vậy mà, lại khao khát nhiều hơn nữa."
1493 = "Nghĩ vậy, tôi cũng nằm xuống bên cạnh Paulette... Nhưng ngay lập tức, tôi nhận ra mình đã nhầm."
1495 = "Dù tôi đang đứng yên, nhưng âm đạo của Paulette vẫn râm ran, xôn xao một cách ngọt ngào."
1497 = "Niềm vui sướng đó khiến tâm trí tôi buông lỏng, tinh dịch đã dâng trào đến mức giới hạn."
1502 = "Đúng như từ \"dành riêng\", Paulette sẽ đón nhận tôi—— đón nhận mọi thứ của tôi, tại chính nơi này."
1546 = "Tôi cảm nhận được Paulette cũng có cùng tâm trạng. Đổi lại việc đón nhận tinh dịch của tôi vào tử cung, chắc chắn cô ấy——"
1547 = "Paulette chủ động ép ngực sát vào tôi."
1548 = "Bàn tay Paulette dẫn dắt tôi."
1549 = "Bàn tay mềm mại của Paulette khẽ khàng chạm vào ngực tôi."
1550 = "Paulette khẽ cựa mình."
1551 = "Bàn tay vừa chạm qua lớp quần, Paulette vội vàng rụt lại vì quá ngạc nhiên——"
1552 = "Paulette bước tới một bước. Một mùi hương vừa ngọt ngào vừa đậm đà xộc vào mũi tôi."
1553 = "Đôi mắt ướt át của Paulette dần ánh lên ngọn lửa. Bàn tay trái của cô ấy rụt rè mơn trớn xuống phía dưới cơ thể tôi."
1554 = "Paulette trông có vẻ luống cuống, vẻ mặt đầy hối lỗi, liên tục nói liến thoắng."
1555 = "Tay chạm vào áo lót... Paulette bỗng khựng lại."
1556 = "Một Paulette luôn dễ dàng ngượng ngùng đỏ mặt, nay lại đang cố nén sự xấu hổ chỉ để dẫn dắt tôi."
1557 = "Paulette đang dạy cho tôi biết về cơ thể con gái."
1558 = "Tôi để Paulette làm sạch dương vật đã vấy bẩn của mình."
1559 = "Paulette dùng lưỡi vét lấy tinh dịch, rồi chu môi hút lấy một cách đầy âu yếm."
1560 = "Như để xoa dịu, như muốn thay đổi bầu không khí, Paulette đã nói với tôi bằng một giọng tươi sáng như vậy."
1561 = "Paulette khịt khịt mũi ngửi. Sau đó cô ấy khẽ liếm môi——"
1562 = "Không biết có phải vì thế mà khó liếm hơn không, Paulette phát ra tiếng kêu như đang sốt ruột."
1563 = "Những ngón tay trắng ngần của Paulette khẽ run rẩy, chậm rãi, lóng ngóng cởi bỏ cúc áo ngoài."
1564 = "Bên trong âm đạo của Paulette ướt át, trơn trượt, nhưng lại bám chặt lấy và siết chặt tôi đến nhường nào."
1565 = "Khuôn mặt đỏ bừng, nhễ nhại mồ hôi, nhưng những ngón tay của Paulette không hề dừng lại một chút nào."
1566 = "Đôi má Paulette ngày càng ửng đỏ——?"
1567 = "Chiếc lưỡi của Paulette đang cẩn thận, mơn trớn khắp khoang miệng tôi và trao đi dòng nước bọt."
1568 = "Hơi thở của Paulette mơn trớn má tôi. Phần da thịt chạm vào nhau cho tôi biết cô ấy đang đổ mồ hôi nhiều đến mức nào."
1569 = "Đôi mắt của Paulette bắt đầu ngấn lệ. Đôi má ửng đỏ, làn da dường như cũng lấm tấm mồ hôi."
1570 = "Cô ấy mỉm cười với đôi mắt rưng rưng ngấn lệ, khiến tình yêu thương và dục vọng trong tôi hòa quyện rồi bùng nổ!"
1571 = "Có lẽ vì nỗi đau khi bị tôi chầm chậm chen vào nơi đó, mà giọng nói của Paulette đứt quãng từng hồi——"
1572 = "Cô ấy cất giọng nửa ngạc nhiên nửa vui sướng, đôi mắt xanh biếc ngước lên nhìn tôi."
1573 = "Giọng nói của Paulette làm tôi giật mình, đồng thời cũng thở phào nhẹ nhõm."
1574 = "Làn da của Paulette quá đỗi trắng ngần, làm nổi bật sắc hồng của nụ hoa một cách đầy khiêu gợi."
1575 = "Âm đạo của Paulette dù đã trở nên vô cùng mềm mại và ướt át, nhưng vẫn còn vương lại một phần thắt chặt, cứng nhắc."
1576 = "Chuyển động nhẹ nhàng từ lòng bàn tay Paulette, không chỉ đơn thuần là để kiểm tra nhịp tim của tôi."
1577 = "Từ vùng kín của Paulette——từ bộ phận sinh dục nữ, mật ngọt trào ra và chảy dài xuống đùi."
1578 = "Paulette nhìn thẳng vào tôi, rồi gật đầu một cái thật sâu."
1579 = "Ánh mắt Paulette vốn đang nhìn tôi chợt lảng đi. Đôi mắt đảo quanh rồi nhìn xuống sàn nhà..."
1580 = "Liếm rồi. Đầu lưỡi của Paulette, đang liếm lấy phần đỉnh dương vật dính đầy tinh dịch của tôi."
1581 = "Cơ thể mềm mại, núng nính của Paulette, không cần phải bàn cãi là rất mềm."
1582 = "Cả cơ thể cô ấy cũng mềm nhũn ra, và rồi Paulette ngã lăn ra giường."
1583 = "——Dù vậy vẫn không đánh mất đi vẻ thẹn thùng, Paulette đã cho phép tôi."
1584 = "Một nụ cười vui sướng. Đôi mắt cô ấy thoáng nhìn tôi rồi lại vội lảng đi ngay."
1594 = "Cô ấy ngậm trọn phần đỉnh dương vật của tôi bằng đôi môi ấy——"
1595 = "——Bàn tay ấy ngay lập tức quay lại phần hạ bộ, và kéo khóa quần tôi xuống."
1596 = "Và rồi một lần nữa, thêm vô số lần nữa, chúng tôi trao nhau những nụ hôn sâu, trao nhau nước bọt, và cả tình yêu."
1600 = "Tuy nhiên, \"khỏa thân\" mà tôi vừa nghĩ tới lúc này, hoàn toàn khác biệt với những gì tôi đã thấy ở Tororyu-yu."
1609 = "Trắng đến mức chói lóa, chính là đây."
1618 = "Không biết có phải do căng thẳng không, mà giọng cô ấy nghe hơi cứng nhắc. Nhưng lại mang một ngữ điệu toát lên sự mạnh mẽ."
1624 = "Dương vật giật giật, cọ xát vào môi và lưỡi của Paulette, phản hồi lại cho tôi một khoái cảm mãnh liệt."
1625 = "Đầu dương vật run lên bần bật, từ nơi tiếp xúc, một khoái cảm khuếch đại dục vọng tuôn trào."
1633 = "Rất dễ chịu, nhưng lại chưa đủ. Cơ thể tôi râm ran từ sâu bên trong, thèm khát một thứ gì đó."
1636 = "Cảm giác sung sướng càng mãnh liệt, dục vọng trong tôi cũng càng căng phồng."
1637 = "Từ đầu gối đang quỳ, dọc theo đùi, cho đến hông tôi đều run lên bần bật."
1639 = "Đỏ. Là màu đỏ. Đỏ chót."
1646 = "Đưa tinh trùng, vào tử cung. Nói cách khác, đó là——"
1650 = "Trần trụi, chân thật... Paulette, khỏa thân."
1653 = "Sủi bọt, tan chảy. Cơ thể, não bộ, và cả nơi kết nối của chúng tôi."
1654 = "Tòa nhà chính của nhà ga thì khỏi nói rồi, ngay cả Rail Shop cũng vậy—— Dù có thể hiện cá tính của bản thân đến mức nào, thì đó vẫn là nơi làm việc."
1655 = "Bị bàn tay mềm mại ấy xoa nắn và ấn lên ngực trái, núm vú của một thằng đàn ông như tôi——bỗng trở nên cứng lại."
1660 = "Màu của da thịt. Màu của nội tạng. Màu sắc trần trụi của Paulette đang chào đón tôi."
1661 = "Tư thế này khiến dương vật của tôi gần như chạm vào môi Paulette."
1663 = "Nếu vậy thì chẳng có lý do gì để chần chừ. Cũng không thể chần chừ thêm được nữa."
1667 = "Nhắm vào núm vú đang cương cứng có thể nhìn thấy rõ qua lớp áo lót màu hồng dễ thương, tôi nhẹ nhàng đặt bàn tay xuống."
1670 = "Cứ mỗi giây trôi qua trong trạng thái gắn kết, sự xôn xao ấy lại càng mạnh mẽ và mãnh liệt hơn."
1671 = "Chỉ cần nằm cạnh nhau, tôi đã cảm thấy Paulette ở rất gần. Khoảng cách được thu hẹp lại giúp tôi hiểu rõ hơn về Paulette."
1720 = "（Nắn bóp——nắn bóp）"
1722 = "（Mút chặt!）"
1724 = "（Đâm phập!）"
1725 = "（Khoan đã——）"
1727 = "（Ra vậy... xuất tinh sao—— Mình đã xuất tinh, chỉ vì được Paulette chạm vào à.）"
1728 = "（Phụt!）"
1730 = "（Đâm phập——chát!）"
1732 = "（Cô ấy đang, uống——Paulette đang... uống lấy thứ tinh dịch bám trên dương vật của mình.）"
1733 = "（Phụt! Phập! Phập! Chát!）"
1737 = "（Phụt——phụt——phụttttt——phụt——）"
1738 = "（Phụt——phụt——）"
1739 = "（Giật nảy!!!!）"
1740 = "（Phập）"
1742 = "（Cô ấy đang cố tình... dùng lòng bàn tay để vờn quanh núm vú của mình.）"
1744 = "（Bật ra）"
1747 = "（Nắn nắn）"
1748 = "（Nắn nắn——nắn nắn——）"
1750 = "（Xoa xoa——xoa xoa）"
1752 = "（Sờ nhẹ）"
1753 = "（Bịch）"
1754 = "（Xoạch...）"
1755 = "（Rỏ xuống——）"
1756 = "（Siết chặt!）"
1758 = "（Phập! Hự! Phập phập! Phập!）"
1759 = "（Miết——xoay!）"
1760 = "（Siết chặt——co bóp——）"
1763 = "（Vạch ra）"
1764 = "（Tuột）"
1766 = "（Tiến vào——tiến vào——）"
1768 = "（Đổ gục!）"
1769 = "（Nằm xuống）"
1770 = "（Nhẹ nhàng）"
1773 = "（Đây là... Đây chính là làm tình sao.）"
1774 = "（Rút ra——đâm vào!!）"
1776 = "（Xích lại gần）"

[selections]
