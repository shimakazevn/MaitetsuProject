1047 = "「A, đúng rồi nhỉ. Soutetsu đã nói vậy mà——」"
1049 = "「Ra là chuyện đó sao.」"
1052 = "「Tại em tự dưng chạm vào. Nên Soutetsu, chắc hẳn đã giật mình và xuất tinh rồi nhỉ.」"
1053 = "「Vì em nghĩ là, em muốn làm chuyện... mà những người yêu nhau hay làm. Em muốn có... một sự gắn kết vững chắc với Soutetsu.」"
