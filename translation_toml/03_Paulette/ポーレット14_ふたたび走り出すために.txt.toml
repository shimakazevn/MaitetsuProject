1154 = "「……Đứng trên lập trường của ông Mototada thì, đúng là vậy nhỉ.」"
1381 = "「Đi cẩn thận nhé! ——Bái bai, anh hai.」"
1383 = "「Lên buồng lái á? Tất nhiên là không sao.」"
1386 = "「Anh vẫn sẽ đối xử với em như vậy. Giống hệt như Reina bây giờ.」"
1388 = "「Chưa, vẫn chưa xong đâu.」"
1397 = "「Mọi chuyện đã được tiến hành ở cấp độ hành chính rồi. Bây giờ muốn lật ngược tình thế, dù là ông Mototada thì cũng khó khăn thôi.」"
1400 = "「Này nha, Niiroku. \\x%lキハ07;#00ffc040;KiHa 07%l;#; á, là một \\x%l気動車;#00ffc040;toa xe tự hành%l;#; tuyệt vời lắmmmm luôn đó ạ.」"
1404 = "「Hai mươi sáu!——Hai mươi bảy!——Hai mươi tám!—— Hai mươi chín!」"
1409 = "「Gì chứ, là cô à——Houshou Kisaki.」"
1410 = "「Làm gì là sao……là đang tiếp thêm sức mạnh cho anh đó? Anh trai. Của cô \\x%lいもうと;#00ffc040;em gái%l;#; dễ thương, dành cho ông \\x%lにい;#00ffc040;anh trai%l;#; đó.」"
1411 = "「Hửm?」"
1412 = "「Dự định á!」"
1416 = "「Lý do tôi mời ba vị đến đây là vì tôi nghĩ vụ việc này, cũng ảnh hưởng mật thiết đến cả ba vị.」"
1418 = "「Ý là muốn nghiền nát kế hoạch Mine Treasure đó hả.」"
1422 = "「Nhưng hội đồng thành phố đã phán quyết rằng——kế hoạch Mine Treasure phù hợp để gửi gắm tương lai của Ohimitera hơn.」"
1424 = "「Nhưng anh nghĩ, nếu là Paulette hiện tại thì sẽ không sao cả. Nếu là chúng ta bây giờ, có thể hỗ trợ lẫn nhau và đưa ra phán đoán tốt hơn.」"
1428 = "「Nhưng mà! Nếu chỉ là một khoảng thời gian ngắn. Ít nhất là trong lúc, thử nghiệm \\x%l客車;#00ffc040;toa hành khách%l;#;……」"
1433 = "「Gì chứ là sao, cậu chào hỏi kiểu gì vậy. Tôi lên đó có được không?」"
1437 = "「Cơm hộp bento?」"
1439 = "「Nếu là thông tin chính xác thì chúng ta cần phải có biện pháp đối phó khẩn cấp…… nhưng nguồn gốc của thông tin đó là từ đâu?」"
1447 = "「Cho các cậu xây lên một lần, rồi sau đó nghiền nát. ——Cha tôi định làm việc đó bằng một trận quyết chiến chớp nhoáng.」"
1452 = "「Nagi cũng hãy tăng tốc độ lên. Trong khoảng hai phút, xúc thêm mười xẻng nữa.」"
1454 = "「Là các bộ trưởng lần lượt quản lý Cơ quan Tài nguyên - Năng lượng và Cục Văn hóa ……đúng không ạ.」"
1459 = "「Sắp đến đoạn dốc lên rồi. Khởi động \\x%l逆転機;#00ffc040;cần đảo chiều%l;#;.」"
1463 = "「Thật tuyệt vời.」"
1464 = "「Cảm ơn cháu. Reina. Vì đã cho phép con bé——làm đến mức đó.」"
1466 = "「Ra là vậy——nói cách khác, đó là những người có thẩm quyền trong việc công nhận mỏ than kế thừa kỹ thuật và công nhận tài sản văn hóa sao.」"
1467 = "「Ra là vậy, cà rốt luộc làm bánh xe sao! Ý kiến hay đấy. Về mặt hương vị, tôi nghĩ cũng cực kỳ hợp nhau.」"
1468 = "「Về chuyện đó sao. Nếu vậy, đó—— không phải là sức mạnh của riêng em đâu ạ.」"
1480 = "「Bây giờ, cho tôi xin chút thời gian được không. Soutetsu.」"
1482 = "「Nhưng mà, như thế——chẳng phải là quá gấp sao!? Mùng 10 tháng sau thì, dù có thế nào đi nữa.」"
1484 = "「Tên……」"
1488 = "「Liên quan đến ông Mototada sao?」"
1490 = "「Ủa, anh hai? Anh đi đâu à?」"
1491 = "「Oaoa!? Xin chú đừng làm vậy mà.」"
1493 = "「Woa.」"
1495 = "「Oa! Nghe ngon quá đi!」"
1496 = "「Ehehe.」"
1497 = "「Ehehe! Vậy, cô Nagayama thấy sao ạ?」"
1499 = "「Dạ?」"
1500 = "「Ồ……ồ.」"
1501 = "「Hửm?」"
1502 = "「A——Cháu cảm ơn ông rất nhiều ạ!」"
1505 = "「A……ra là vậy. Đúng là thế nhỉ. Em đã biết trước rồi, nhưng quả nhiên là vậy nhỉ——ừm!」"
1506 = "「A.」"
1508 = "「A! Ý đó có vẻ hay đấy!! Cá hương cũng là siêu đặc sản của Ohimitera mà.」"
1511 = "「A, hòm kho báu của Mine Treasure á?」"
1512 = "「A, ngài Soutetsu, em—— sẽ đi dọn dẹp hộp tro đây ạ.」"
1513 = "「Ư, hự——」"
1514 = "「Ừ, ừm. Em không nói thì anh cũng đi mà.」"
1517 = "「Vâng. Cứ làm theo những gì ngài Soutetsu tin tưởng, là điều tốt nhất——Hachiroku em cũng tin như vậy.」"
1519 = "「Ừ. Về phần anh thì cực kỳ tán thành. Tất nhiên, cũng phải hỏi ý kiến của nhóm Paulette nữa.」"
1521 = "「Ừ. Một chuyện có thể gây xáo trộn——nhưng, nếu các cậu không biết thì sẽ rất nguy hiểm.」"
1522 = "「Ừ.」"
1523 = "「Vâng ạ!」"
1524 = "「Chà, cũng hợp lý đấy. Anh Akai đang dùng cái đó để xin cấp phép tài sản văn hóa phải không? Nhưng mà……Kijiuma……Thịt gà (kiji) và thịt ngựa (uma) à?」"
1532 = "「Bởi vì, cho dù Reina, có trở nên khác với Reina hiện tại đi nữa thì chị Paulette, và cả anh Soutetsu cũng sẽ.」"
1533 = "「Vì Reina á, là chị gái của Niiroku mà.」"
1539 = "「Bộ trưởng thị sát, sao?」"
1544 = "「Vì phần lớn công việc, anh đều có thể giao cho Paulette mà. Anh chỉ cần lấp đầy những khoảng trống đó thôi.」"
1546 = "「Quá tuyệt vời nè!!」"
1547 = "「Cô ấy nói là cảm thấy 『cách truyền đạt rất khó』.」"
1549 = "「Nói cách khác, cô ấy nghĩ anh có thể chọn được cách thức tối ưu nhất. Để truyền đạt cho em, Paulette——vào lúc nào, và như thế nào.」"
1552 = "「Là như vậy đó——Reina, em thấy sao?」"
1554 = "「Cô bé đó, vẫn tinh ý như ngày nào nhỉ.」"
1556 = "「Xong rồi! Anh hai——e hèm! Anh trai. Anh thấy thế này được không?」"
1558 = "「Nào, mau đi đi! Đi đi, và hãy hạnh phúc nhé.」"
1560 = "「Tuyệt quá, toàn là đặc sản của Ohimitera không à!」"
1562 = "「Đã rõ. Trăm sự nhờ cô.」"
1563 = "「Đã rõ!」"
1564 = "「Nếu không nghĩ đến gánh nặng môi trường và những chuyện trong tương lai. Thì việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; quả thực là một kế hoạch tái thiết xuất sắc.」"
1569 = "「Nếu chuyện đó xảy ra, mây đen sẽ bao phủ kế hoạch thu chi—— có thể sẽ xuất hiện những người do dự trong việc đầu tư.」"
1571 = "「Nếu là Paulette trước đây, có lẽ anh đã truyền đạt một cách thận trọng hơn một chút.」"
1573 = "「Nếu có gì tôi có thể làm được, xin cứ nói.」"
1581 = "「Dù thế nào cũng quá gấp, không kịp chuẩn bị. Đó chính là, mục đích của Houshou Mototada.」"
1582 = "「Của ông Houshou——sao——」"
1583 = "「Là con gái của ông Houshou sao?」"
1584 = "「Houshou Kisaki——Giám đốc chi nhánh Ohimitera của ngân hàng Kumamoto.」"
1590 = "「Ừ. Vì chúng ta đang kéo \\x%l客車;#00ffc040;toa hành khách%l;#; mà—— Phải nghe đánh giá của hành khách chứ không phải ở đây.」"
1592 = "「Ừ. Bộ trưởng Bộ Kinh tế, Thương mại và Công nghiệp cùng Bộ trưởng Bộ Giáo dục, Văn hóa, Thể thao, Khoa học và Công nghệ.」"
1593 = "「Đúng rồi nè, hôm nay.」"
1594 = "「Đúng rồi ạ! Hoàn toàn chính xác. Ở trên, vì là sông Kuma (Gấu) nên đương nhiên sẽ là.」"
1595 = "「Dù chỉ là điều chỉnh \\x%lレイルロオド;#00ffc040;Railord%l;#; thôi, nhưng với cái giá này thì quá.」"
1600 = "「Dù vậy Reina cũng không sao đâu ạ.」"
1603 = "「Em vẽ xong rồi á!?」"
1610 = "「Chuyện thường tình là sao……anh định đi làm gì vậy?」"
1613 = "「Sao cũng được. Chỉ cần được chạy một lần nữa thôi, thế là đủ rồi.」"
1614 = "「Gì vậy?」"
1617 = "「Anh, đã hoàn thành trách nhiệm rồi sao.」"
1619 = "「Không thể nói là không có rủi ro được. Có nguy cơ ký ức của Reina sẽ xuất hiện chướng ngại gì đó đấy.」"
1622 = "「Sức mạnh của anh thì có gì——」"
1627 = "「Ba vị——sao.」"
1628 = "「Mỗi lần như vậy, anh chỉ liều mạng đối mặt với những thứ trước mắt thôi. Có lẽ anh mới là người không nhìn thấu được tương lai nhất cũng nên.」"
1630 = "「Em và 8620, đã có thể, chạy được rồi.」"
1633 = "「Từ trước em cũng đã nghĩ đến chuyện đó rồi…… Lúc nãy, anh hai——anh trai lại nói là muốn dùng làm từ khóa chính nữa.」"
1636 = "「Tôi thì——làm sao có thể từ chối được chứ. Nếu điều này có thể giúp con bé, chạy được một lần nữa——」"
1637 = "「Sao mình lại không nhận ra nhỉ——chắc tại quen mắt quá rồi. Tóm lại là cá hương kho ngọt nhé. Với cả cà rốt luộc nữa.」"
1639 = "「Trước khi bộ trưởng đến thị sát, tôi muốn làm một cuốn sách mỏng. Tôi cũng định nhờ Hibiki giúp một tay——」"
1642 = "「Điều đó——em nghĩ là đúng ạ. Nhưng—— cả \\x%l8620;#00ffc040;8620%l;#; và em, nếu không có Master, sẽ bất an lắm.」"
1644 = "「Anh là……đường ray sao.」"
1646 = "「Em có thể cố gắng. Dù không có ngài Soutetsu ở bên, em vẫn có thể chạy. Vì vậy, xin ngài——」"
1647 = "「Anh sẽ cố gắng hết sức. Để các em có thể một lần nữa, chạy đi mà không chút vướng bận.」"
1648 = "「Tất nhiên là tôi sẽ kết hợp chúng thật hoàn hảo rồi. Vì đây là công việc của tôi mà.」"
1650 = "「Tôi hiểu rồi. Vậy thì, một tuần sau nhé.」"
1651 = "「Em đã thử nghĩ đến việc giữ nguyên hình dáng Kijiuma, hay nhân hóa nó lên, thậm chí là biến nó thành nhân vật moe, nhưng đều không ổn lắm.」"
1653 = "「Anh đi bàn bạc với ông Minokasa. Anh muốn nhờ ông ấy tập hợp các thợ thủ công lại càng sớm càng tốt.」"
1655 = "「Cái này——anh có linh cảm là sẽ thành công đấy.」"
1657 = "「Anh á?」"
1659 = "「Chính vì thế——chúng em mới có thể tiến bước mà không do dự. Cả Hibiki, cả Nagi……và cả em nữa.」"
1660 = "「Vì vậy, anh mới gọi mọi người đến…… và sau khi gọi mọi người đến, anh đã truyền đạt theo cách này?」"
1663 = "「Vì vậy, xin ông hãy chuẩn bị tài liệu hình ảnh về Kijiuma càng nhiều càng tốt. Tôi cũng muốn sử dụng chúng ở những khía cạnh khác nữa.」"
1664 = "「Vì vậy, sao?」"
1667 = "「Nên Reina á, chẳng sợ gì đâu nha.」"
1668 = "「Nên Reina á, muốn để Niiroku cũng được chạy đó ạ. Reina và cậu, hai đứa mình sẽ thay phiên nhau.」"
1673 = "「Xin lỗi cô. Đã gọi cô đến vào giờ này.」"
1675 = "「Xin lỗi nhé Soutetsu. Cho tôi mượn tai cậu một chút——」"
1677 = "「Xin hãy làm theo nguyện vọng của con bé——trăm sự nhờ ông.」"
1678 = "「Từ đây trở đi, mới là trọng tâm của câu chuyện không được để ai nghe thấy này.」"
1683 = "「Ga phế liệu Tsuruha mới, đi qua, tốt!」"
1686 = "「Ngựa……vậy thì, sẽ có ai đó cưỡi lên trên sao?」"
1689 = "「Bộ dạng thợ mỏ này, chắc là để liên kết với Mine Treasure đúng không?」"
1690 = "「Còn gấu thì phải có mật ong nhỉ. Dùng mật ong cho món kho ngọt, phần tráng miệng cũng sẽ có thạch mật ong và quýt yuzu.」"
1693 = "「Nếu vậy thì tốt rồi. Thế——」"
1696 = "「Hibiki——em làm, cái gì vậy.」"
1698 = "「Tôi hiểu rồi. Tôi sẽ chọn lọc và sắp xếp lại. Còn gì nữa không?」"
1699 = "「Đã rõ nè!」"
1700 = "「“\\x%l掛け紙;#00ffc040;Giấy gói cơm hộp%l;#;”」"
1709 = "「Quả thực, là vậy nhỉ. ——Đúng là chuyện thường tình.」"
1711 = "「Ừ. Xin lỗi vì cứ vội vã thế này.」"
1713 = "「Vâng, đúng vậy ạ. Dù còn trẻ, nhưng trong một thời gian ngắn mà đã đạt đến mức này.」"
1715 = "「Đúng vậy, cha tôi cũng phán đoán như thế. Nên ông ấy không định lật ngược đâu.」"
1716 = "「Vậy à……anh hai cũng vất vả thật đấy. Thật sự luôn.」"
1717 = "「Vậy sao.」"
1718 = "「Vậy sao, nếu thế thì.」"
1719 = "「Thế à? Vậy tôi sẽ làm thử nhé. Tôi cũng muốn tuyển chọn nguyên liệu kỹ càng nữa——, cho tôi một tuần được không?」"
1721 = "「Đúng vậy. Nếu sau khi thị sát mà họ đánh giá là không còn cách nào cứu vãn, thì sự công nhận đáng lẽ được thông qua cũng sẽ bị hủy bỏ.」"
1723 = "「Vâng. Đúng là vậy. Những vị đó, dự định sẽ đến thị sát Ohimitera.」"
1724 = "「Vâng.」"
1725 = "「Vâng!」"
1727 = "「À thì——về chuyện đó. Anh đang nghĩ, liệu chúng ta có thể lấy “Kijiuma” làm một từ khóa chính được không.」"
1729 = "「Có chuyện gì bí mật cần nói sao?」"
1730 = "「Ví dụ như, liệu chúng ta có thể biến một loại nguyên liệu nào đó, thành hình dáng giống Kijiuma được không?」"
1732 = "「Không sao đâu. Vì là chuyện về cơm hộp bento mà, đúng không?」"
1733 = "「Ừm. Anh nghĩ nó sẽ là một trợ thủ đắc lực cho việc chấn hưng du lịch, nên đang nhờ cô ấy phát triển một loại 『Cơm hộp bento nhà ga mang đậm chất Ohimitera』.」"
1734 = "「Đúng vậy! Tên của nó là——tèn ten! Bé 『Kijikuma』!」"
1739 = "「Anh định sẽ hỗ trợ Paulette, người đang hỗ trợ Reina. Chắc chắn điều đó, sẽ dẫn đến kết quả tốt nhất.」"
1740 = "「Kiyoharu.」"
1741 = "「Tại sao…… Kisaki lại kể chuyện đó cho anh Soutetsu?」"
1745 = "「Dù có mất đi thứ gì cũng không sao. Nên, xin hãy cho tôi được chạy một lần nữa.」"
1749 = "「Thế? Hộp bento đó——e hèm—— \\x%l掛け紙;#00ffc040;giấy gói cơm hộp%l;#; của hộp bento nhà ga đó, sẽ vẽ hình gì?」"
1751 = "「Và rồi, xin hãy chia sẻ dữ liệu sao lưu của Reina—— cho cả Niiroku nữa nha.」"
1756 = "「Cha tôi cũng đánh giá nhất định về kế hoạch Mine Treasure. Nhưng, ông ấy vẫn cho rằng việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; sẽ tốt hơn.」"
1760 = "「Reina thì——thấy sao?」"
1761 = "「Reina thì——hya!?」"
1763 = "「Reina cũng, không sao đâu ạ.」"
1765 = "「Reina xin nhờ chị Paulette nha. Sau đó, cũng xin nhờ đền chủ Akai nữa ạ.」"
1766 = "「Nếu em muốn biết mong muốn của chị á? Reina. Đó là được nghe 『mong muốn thực sự』 của Reina, một cách chân thật nhất.」"
1770 = "「Xin ngài hãy giúp đỡ Reina, cô em gái của em. Xin ngài——hãy để đứa trẻ đó, một lần nữa được chạy mà không phải bất an.」"
1771 = "「Chuyện đó, là đương nhiên mà ạ.」"
1772 = "「Tạm thời chỉ có vậy thôi. Thay vào đó, thưa đền chủ Akai—— sau khi Niiroku hoàn tất cải tạo, tôi rất mong ông sẽ giúp sức.」"
1775 = "「Tất nhiên, nỗ lực của các em ấy là rất lớn.」"
1776 = "「Tất nhiên, hai người họ rất tuyệt. Nhưng tuyệt vời hơn cả là em đấy, Hachiroku.」"
1778 = "「Có vẻ cậu vẫn để tâm đến lời cảnh báo của tôi nhỉ. Vui thật đấy.」"
1780 = "「Độc ác thật đấy nhỉ.」"
1789 = "「Xác nhận vị trí dừng——\\x%l単弁;#00ffc040;van hãm đơn%l;#;, phanh nhẹ——tốt!」"
1797 = "「Kisaki cũng là tiền bối của Hibiki ở trường học. Vì vậy——」"
1799 = "「Đến lúc nào trả được, tôi sẽ kiếm thêm từ cô sau. Lần này thì, cứ thế là được rồi.」"
1803 = "「Hơn nữa——trông cũng có nét gì đó rất hoài niệm.」"
1805 = "「Thế là. Nhờ câu nói lúc nãy mà em nảy ra ý tưởng! Xoẹt một cái. Vì là Kijiuma, nên em nghĩ cứ vẽ thành con ngựa là được.」"
1812 = "「Là than đá đúng không? Trộn mè đen vào lớp vỏ bột, ta có “Gà rán than đá”.」"
1814 = "「Dự định là, dự định đó. Nghe nói hai vị đó cùng nhau “dự định” sẽ đến thị sát Ohimitera vào mùng 10 tháng sau.」"
1815 = "「Dự định? Dự định là——」"
1817 = "「Món ăn kèm chống ngán cũng là wasabi muối đặc sản—— Gạo cũng dùng gạo Kumamoto, thế là hoàn thành hộp cơm bento nhà ga danh tiếng tự sản tự tiêu rồi nhé.」"
1818 = "「Xin hãy cho phép cải tạo Reina và KiHa 07 ạ. Trở về hình dáng ngày xưa——của \\x%l気動車;#00ffc040;toa xe tự hành%l;#; chạy bằng xăng.」"
1820 = "「Xin lỗi vì đã làm phiền em, nhưng cũng nhờ em luôn nhé.」"
1839 = "「Tớ đi hỏi đây nè!」"
1840 = "「Đó là nguyện vọng của chúng tôi—— nhưng về mặt kỹ thuật, thì liệu có được không ạ?」"
1841 = "「Tất nhiên rồi, Reina.」"
1842 = "「Chuyện thường tình mà? Trong những lúc thế này.」"
1844 = "「Quyết chiến chớp nhoáng……là sao?」"
1845 = "「Như vậy không đủ đâu. Tăng lên 38%. Bù cho phần trọng lượng của \\x%lストーブ客車;#00ffc040;toa xe sưởi ấm%l;#;, 8620 cần nhiều sức mạnh hơn.」"
1847 = "「Cái này——đơn giản là dễ thương thật đấy.」"
1848 = "「Nói chuyện nhanh gọn thật đấy——」"
1853 = "「Nếu đã vậy, thì đi cùng em ấy đi.」"
1854 = "「Không đâu.」"
1857 = "「Nếu vậy thì ngay bây giờ——ngay lập tức.」"
1860 = "「Vậy, em cũng sẽ nhân lúc đó hoàn thiện thêm một chút.」"
1862 = "「Vậy, việc em cần làm là vẽ bao bì cho hộp bento đó nhỉ.」"
1864 = "「Điều đó là tất nhiên rồi ạ. Nhưng còn một điều nữa——đó là nhờ sức mạnh của ngài Soutetsu.」"
1865 = "「Tất nhiên rồi ạ? Vì đây là công việc của em mà.」"
1866 = "「Thế, khi nào thì bắt đầu đây? Bên này thì, lúc nào cũng được.」"
1869 = "「Trong khoảng thời gian đó, anh Soutetsu—— trăm sự nhờ anh nhé.」"
1870 = "「Vậy thì.」"
1871 = "「Nếu vậy, tôi sẽ.」"
1872 = "「Vậy, đây là bảng báo giá nhé.」"
1874 = "「Chính là việc, trong thời gian ngắn như vậy—— em đã rèn giũa hai người họ đến mức đó.」"
1877 = "「Như vậy cũng được——nhưng Kijiuma, hiếm khi mới có một món đồ đáng yêu thế này.」"
1878 = "「Kế hoạch Mine Treasure. Tương lai mà Ohimitera, mà chúng ta đang hướng tới. Ngài Soutetsu đã vạch ra con đường thẳng tắp đó.」"
1879 = "「Ngài Soutetsu, ngài sở hữu sức mạnh đúng như tên gọi của mình.」"
1880 = "「Ngài Soutetsu, ngài là đường ray. Ngài đã chỉ ra hướng đi đúng đắn một cách thẳng tắp.」"
1883 = "「Cá hương……Cá hương kho ngọt (Kanroni).」"
1886 = "「Ở đây cứ để em lo. Hai người, hãy đi nghe đánh giá của chị Fukami và chị Kisaki đi ạ.」"
1889 = "「!!?」"
1890 = "「!!?」"
1892 = "「Ok. Tôi nảy ra ý tưởng rồi đây.」"
1894 = "「Ok. Vậy, buổi trưa hôm nay của một tuần sau, tôi sẽ mang đến tòa thị chính nhé.」"
2046 = "Cơn đau truyền đến từ lưng. Mãnh liệt đến mức không ngờ tới."
2049 = "Không chỉ có vậy. Mà còn cả công việc thực tế trên thân xe, đi kèm với việc cải tạo \\x%lキハ07;#00ffc040;KiHa 07%l;#; nữa."
2052 = "Nếu không phải vậy, thì vì câu chuyện quá đỗi bất ngờ, nên một nửa trong vô thức, cô ấy đang từ chối hiểu nó."
2053 = "Nếu không làm vậy, thì ngay cả “chuẩn bị chưa đủ” cũng không xong."
2057 = "Nhưng……chà, bây giờ nhìn lại, tôi có cảm giác như mọi chuyện đều bắt đầu xoay chuyển từ câu chuyện làm cơm hộp bento nhà ga này."
2058 = "Nhưng, nếu nói tôi là đường ray, thì việc cứ cư xử như bình thường, chắc chắn sẽ là cách tốt nhất."
2061 = "Niiroku gần như không nhúc nhích."
2066 = "Cả Fukami và Kisaki đang đi thử trên \\x%l客車;#00ffc040;toa hành khách%l;#;, có lẽ cũng không cảm thấy dù chỉ một chút khác thường nào."
2071 = "Không ngần ngại quỳ gối xuống sàn, cúi đầu sâu hơn cả Reina, khiến cô bé phải ngẩng cái đầu đang cúi chào lên."
2075 = "Nhưng ngay lập tức, nó đã bị giấu đi dưới nụ cười và đôi mi khép lại."
2077 = "Nhưng bây giờ, chúng lại thấm đẫm trong giọng điệu hờn dỗi, như đang làm nũng."
2079 = "Nhưng, cô ấy đang mang trong mình sự nhiệt huyết. Giọng nói chắc chắn đã thay đổi sắc thái so với trước đây."
2080 = "Bù lại, nếu được chuẩn bị kỹ lưỡng, và có thể chốt ngay trong một lần thử, thì như thế còn đáng quý hơn."
2083 = "Nhưng, khuôn mặt Paulette vẫn còn cứng đờ."
2084 = "Nhưng Reina vẫn chưa ngẩng đầu lên, cô bé tiếp tục——cố gắng dệt nên mong muốn của mình."
2088 = "Chỉ với nhiêu đó, có lẽ họ đã hiểu ý nhau. Đền chủ Akai quay thẳng người lại phía tôi."
2106 = "Hachiroku không đưa ra chỉ thị nào nữa. Chiếc xẻng xúc than của Nagi cũng dừng lại."
2107 = "Khuôn mặt đang ngơ ngác cứng đờ giãn ra thành một nụ cười. Ấn tượng mang lại, trở nên ngây thơ đến lạ."
2110 = "Bàn tay Hachiroku truyền thêm sức lực. Ánh mắt em ấy không rời khỏi tôi."
2112 = "Hachiroku nuốt một ngụm khí, một giọng nói như bị đè nén vang lên."
2114 = "Khuôn mặt Hachiroku dịu lại."
2116 = "Hachiroku ngẩng phắt mặt lên."
2117 = "Tay Hachiroku nhẹ nhàng buông ra. Cái đầu nhỏ bé——cúi gập xuống thật sâu."
2121 = "Trong đó có cả hình dáng Kijiuma quen thuộc, cũng có cả những con thon thả, hay mập mạp."
2123 = "Thậm chí những món độc lạ như sushi cá hương, cũng được ăn rất bình thường ở Ohimitera."
2135 = "Ban đầu, là để bảo vệ thị trấn Ohimitera và môi trường. Thêm vào đó là việc muốn để Hachiroku được chạy một lần nữa——"
2140 = "Một con gấu đang cưỡi trên lưng Kijiuma. Đội mũ bảo hộ, cầm cuốc chim——trong bộ dạng thợ mỏ, với khuôn mặt tràn đầy tự tin."
2163 = "Có thể hoàn toàn yên tâm, giao phó tấm lưng không phòng bị của mình. Chỉ đơn thuần là vì, việc có một người như vậy mang lại cho tôi hạnh phúc."
2164 = "Đúng như lời đền chủ Akai vừa nói—— Tình hình hiện tại đã đòi hỏi phải có biện pháp đối phó khẩn cấp rồi."
2169 = "Dưới sự chỉ đạo không chút do dự của Hachiroku, sự phối hợp nhóm đã thực sự được hình thành ở đây."
2170 = "Không chỉ có cá kho ngọt, mà dĩ nhiên cả cá nướng muối, cá hun khói——"
2173 = "Trong mắt một kẻ ngoại đạo như tôi thì mấy bức đó trông cũng khá ổn, nhưng nếu Hibiki đã nói không ổn thì chắc là vậy rồi."
2174 = "Càng tìm hiểu sâu về kế hoạch Mine Treasure, điều đó lại càng trở nên rõ ràng hơn."
2176 = "Về chuyện của Reina, những việc tôi có thể làm có lẽ hầu như không có."
2178 = "Hibiki ngồi đối diện tôi lộ vẻ mặt bất ngờ."
2188 = "Sự u ám tan biến. Cả giọng nói và biểu cảm đều trở nên rạng rỡ."
2190 = "Bản thân phu nhân cũng đang cắm cúi ghi chép thứ gì đó—— là công thức nấu ăn, với một tốc độ khủng khiếp."
2193 = "Có lẽ con bé đã vẽ rồi tẩy xóa từ khá lâu rồi nhỉ? Trên mấy bản phác thảo nháp đều bị đánh dấu chéo."
2195 = "Ánh mắt em ấy lảo đảo rơi xuống sàn nhà. Lực kẹp tay phải của tôi——, trong thoáng chốc, nới lỏng."
2196 = "Đã không còn ở mức độ học việc nữa. Chỉ trong một thời gian ngắn, hai người họ đã trưởng thành vượt bậc."
2198 = "Vừa nói dứt câu, tay Hibiki đã bắt đầu đưa những nét vẽ với tốc độ chóng mặt."
2200 = "Để cho tôi thấy rằng, dù là một đội không có tôi, họ vẫn có thể chạy đàng hoàng."
2202 = "Mở miệng——cứ thế trong vài giây. Cuối cùng, tôi nghe thấy một giọng nói như đang kìm nén."
2205 = "Việc cô ấy để Hibiki, người đáng lẽ phải đi gặp, lại \\x%l客車;#00ffc040;toa hành khách%l;#;, và cất công đến tận buồng lái một mình thế này thì——"
2209 = "Dù không đủ lớn để bao bọc, chỉ là chạm và kẹp lấy thôi——nhưng lại vô cùng ấm áp và dễ chịu."
2211 = "Nhìn chằm chằm vào tôi, nở một nụ cười có chút gượng gạo."
2213 = "Và rồi cô bé mở cuốn sổ phác thảo ra, thái độ quay ngoắt—— Hỏi lại với vẻ mặt nghiêm túc."
2215 = "Khi sự căng thẳng như sợ hãi biến mất, những gì còn lại——là một nụ cười hiền hậu, vô cùng tự nhiên."
2216 = "Cô ấy khẽ gật đầu. Đôi má ửng hồng."
2218 = "Nếu không làm vậy, có lẽ tôi sẽ lo sợ rằng, Paulette có thể sẽ đưa ra phán đoán sai lầm."
2220 = "Nếu là Paulette trước đây, chắc chắn cô ấy đã nuốt những bất mãn và thắc mắc kiểu này vào trong."
2221 = "Dù ký ức có gặp trở ngại, đó có thể là một bất hạnh lớn—— nhưng sự gắn kết của chúng tôi, tuyệt đối không thể bị cắt đứt."
2223 = "Nếu chỉ nghĩ đến sự ổn định kinh tế—— trong khoảng thời gian trước mắt là 10 năm, 20 năm, thì đó là phán đoán đương nhiên."
2235 = "A. Đúng rồi. Là Kumakuma nhỉ—— con gấu bông là bạn của Hibiki hồi chúng tôi mới gặp nhau chưa được bao lâu."
2236 = "Đúng rồi. Cái này chắc chắn cũng—— là “Nhất Hinomoto” mà tôi đã được nhờ."
2237 = "Hướng về phía Reina đang tròn xoe mắt, một giọng nói êm đềm thấm sâu vào."
2239 = "Giống như cách Hachiroku nghĩ về Reina, Reina cũng nghĩ về Niiroku."
2261 = "Chẳng vất vả chút nào. Dù chỉ là một chút."
2262 = "Không phải là đối với Paulette, mà là cùng với Paulette. ——Lời nói của tôi, đã truyền đạt được."
2264 = "Tôi cũng gật đầu. Nhìn thẳng vào đôi mắt của Reina."
2266 = "Bắt đầu từ đó, tôi giải thích sơ lược cho Hibiki."
2268 = "Chúng tôi có sự gắn kết."
2270 = "Vừa dứt lời, phu nhân đã ngay lập tức hưởng ứng. Ánh mắt cô ấy dán chặt vào xấp tài liệu hình ảnh."
2273 = "Anh chỉ đơn thuần là cố gắng hoàn thành mục đích của bản thân thôi."
2275 = "Tôi mở tài liệu hình ảnh, bản sao nhận được từ đền chủ Akai ra cho mọi người xem."
2277 = "Tôi kể tóm tắt lại diễn biến sự việc từ trước đến nay, đền chủ Akai gật đầu như đã hiểu."
2280 = "Tôi vuốt tóc em ấy. Như cách vuốt ve đầu một chú cún con."
2281 = "Tôi định sẽ quan sát mà không nhúng tay hay xen miệng vào cho đến phút chót, nhưng hầu như tôi chẳng tìm thấy chỗ nào để xen vào cả."
2283 = "Bị bất ngờ, tôi hỏi lại. Tôi nào có làm gì đâu."
2285 = "Để đáp lại sự tin tưởng hướng thẳng về phía tôi, như một lời thề, nhất định sẽ đền đáp."
2286 = "Nhìn theo bóng lưng họ, Hachiroku với thân hình lái tàu nhỏ bé, trong mắt tôi lại trông thật to lớn và đáng tin cậy."
2288 = "Chính vì vậy, tôi đã nhìn thấy rõ ràng. Điều mà Hachiroku muốn cho tôi thấy khi nhờ tôi làm người giám sát."
2292 = "Cũng không đứng dậy, cũng không có vẻ gì là định nắm lại bàn tay đang bị nắm lấy."
2294 = "Nếu đã chốt xong một chuyện, thì chỉ còn cách đi chốt chuyện tiếp theo."
2297 = "Chính vì vậy, những lời tiếp theo không thể chỉ hướng về phía Paulette."
2311 = "Hibiki và Nagi nhìn Hachiroku. Như muốn nói “Hai người đậu rồi”, Hachiroku gật đầu thật mạnh."
2314 = "Hibiki và phu nhân Nagayama, đã truyền cảm hứng cho nhau."
2316 = "Kinh nghiệm làm \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; được tích lũy, có vẻ đã bồi dưỡng thêm sức mạnh——hay đúng hơn là sức mạnh cơ bắp đơn thuần cho Hibiki."
2319 = "Hibiki tỉnh bơ bắt chước lời của phu nhân Nagayama, rồi đưa bức vẽ trong sổ phác thảo cho chúng tôi xem."
2321 = "Được nghe giải thích về thuật ngữ chuyên ngành (?) bằng âm thanh nổi ngoài dự đoán, Hibiki cười trừ ha hả."
2323 = "Đã nói tên của Hibiki là âm thanh vang vọng, tên của chị Mayami là \\x%l枕木;#00ffc040;tà vẹt đường ray%l;#;. Và rồi, về tên của tôi thì——"
2328 = "Hibiki đã vung tay đánh mạnh vào lưng tôi——"
2337 = "Quả nhiên, tôi nghĩ là vậy. Lý do em ấy chỉ yêu cầu tôi đứng nhìn là——"
2344 = "Mỗi nhát xúc phân tán than không chút dư thừa với chuyển động nhỏ nhất, \\x%l火床;#00ffc040;buồng lửa%l;#; của \\x%l8620;#00ffc040;8620%l;#; lại bùng lên những ngọn lửa mới nhảy múa."
2346 = "Ví dụ như, tạo cơ hội chỉ có hai người, sau khi nói ra thì trấn an em ấy, rồi từ đó mới nghĩ cách giải quyết."
2348 = "So với cảm giác của tôi thì quá sớm——nhưng, như vậy là tốt. Vì Hibiki đã tự mình đưa phần trọng lượng tăng thêm của toa khách vào phán đoán."
2357 = "Hừm, phu nhân Nagayama khẽ khịt mũi."
2374 = "Paulette cũng khẽ gật đầu. Chỉ cần vậy thôi, mọi chuyện đã được quyết định."
2375 = "Paulette vẫn nghiêng đầu với vẻ nghi ngờ. Có lẽ vì câu chuyện quá đỗi bất ngờ, nên cô ấy chưa kịp hiểu chăng——"
2376 = "Lời nói đầy vẻ nghi ngờ của Paulette, lại nhận được cái gật đầu từ đền chủ Akai."
2377 = "Không e sợ, không lạc lối, không một chút do dự. Paulette đáp lại mong muốn của Reina."
2378 = "Lên mái tóc của Reina đang ngồi trên đùi, Paulette dịu dàng cọ má vào."
2379 = "Giọng nói và sắc mặt của Paulette thay đổi ngay lập tức."
2380 = "Trong thoáng chốc, đôi mắt xanh lam ấy nhìn tôi. Ánh mắt như muốn dựa dẫm, như đang làm nũng——"
2381 = "Với khuôn mặt vẫn còn bối rối, Paulette lặng lẽ đưa mắt nhìn. Từ đền chủ Akai, đến ông chủ nhà tắm Tororyu-yu——"
2382 = "Như thể đã hoàn toàn bối rối, khuôn mặt Paulette cứng đờ, cô ấy chìm vào im lặng."
2388 = "Và rồi, cô ấy nhích người lại gần."
2389 = "Và rồi lạch bạch, bước đến chỗ Niiroku, dùng hai tay bao bọc lấy tay cô ấy."
2391 = "Reina vụt đứng dậy."
2394 = "Reina cúi đầu thật sâu."
2396 = "Reina đang cười tươi rạng rỡ."
2398 = "Nụ cười bừng sáng. Lời nói của Reina, tràn đầy tự tin."
2400 = "Reina cười rạng rỡ, dịu dàng."
2402 = "Dù sao thì, cũng là người nhà. Là em gái. Nên tôi để phần giải thích chi tiết hoàn cảnh lại sau cùng."
2403 = "Trong lịch trình cấp bách này. Việc phải chờ đợi một tuần có hơi khiến tôi sốt ruột nhưng——"
2408 = "Một tờ giấy nhớ được xé ra, thứ gì đó được viết nhanh lên trên."
2409 = "Vang lên trong sự im lặng đó, là một tiếng lẩm bẩm như muốn nói “Đáng nguyền rủa”."
2415 = "Chắc là họ quan tâm đến đánh giá lắm. Đầu tiên là Nagi, rồi đến Hibiki vội vã bước xuống khỏi buồng lái."
2417 = "Nhìn biểu cảm kinh ngạc của đền chủ Akai, tôi mới sực nhớ ra."
2420 = "Dù nghĩ rằng 'Mình không tin vào mắt mình nữa' thì hơi thất lễ, nhưng quả thực, tôi không thể tin nổi."
2424 = "Lo ngại điều đó nên Kisaki, đã đuổi mọi người đi, để kể riêng cho mình tôi nghe trước."
2425 = "Nên khi tôi thành thật thừa nhận, Kisaki—— không biết đang có cảm xúc gì. Cô ấy khẽ nhún vai."
2428 = "Cú sốc và sự kinh ngạc quá đỗi mạnh mẽ, khiến ngay cả những lời phàn nàn cũng trở nên đứt quãng."
2436 = "Lần đầu gặp mặt, đền chủ Akai trông có vẻ mệt mỏi rã rời—— là do bị Kisaki chèo kéo tham gia phe ủng hộ thu hút nhà máy nên mới phát ngán nhỉ."
2437 = "Công tác chuẩn bị thành lập bộ phận thứ ba làm cơ quan tiếp nhận kinh doanh cũng đang tiến triển, và giấy phép sử dụng độc quyền bãi bồi ven sông cũng đã có."
2443 = "Dù sao thì, thời gian chuẩn bị cũng không đủ. Nếu có phần nào có thể bắt tay vào làm ngay thì phải làm, nếu không sẽ không kịp."
2446 = "Vừa nghe hỏi, ánh mắt Kisaki đảo quanh."
2447 = "Nghe câu nói của Kisaki khi cô ấy bước vào thế chỗ Hachiroku, tôi mới hiểu ra vấn đề."
2448 = "Nghe Hibiki nói vậy, Nagi lập tức thu lại nụ cười rạng rỡ."
2449 = "Âm thanh như thể có thứ gì đó đập vào sườn \\x%l8620;#00ffc040;8620%l;#;. Để kiểm tra, tôi nhìn xuống từ cửa sổ bên hông buồng lái thì——"
2455 = "Cửa kéo fusuma sau lưng bị đóng lại."
2462 = "Công nhận mỏ than Jutsusen là mỏ than kế thừa kỹ thuật. Chỉ định đền Akai Aso là tài sản văn hóa."
2466 = "Nghe em ấy nói vậy, tôi chợt nhớ ra. Nhắc mới nhớ, Hachiroku, vào lúc chúng tôi mới gặp nhau chưa được bao lâu——"
2481 = "Cùng lúc cất giọng, động tác xúc than của Nagi càng thêm mượt mà."
2482 = "Vừa nói, tôi vừa nảy ra một ý tưởng."
2483 = "Vừa nói, những ngón tay của Hibiki đã siết chặt lại. Bắt đầu tăng áp suất phanh."
2484 = "Lên cái lưng vẫn còn đang đau rát, Hibiki dùng sức đẩy mạnh."
2485 = "Nói rồi, phu nhân Nagayama rời đi trước tôi một bước."
2486 = "Ngay sau khi nghị quyết được thông qua, cả chúng tôi và thành phố với tư cách là một tổ chức đều đã hành động."
2508 = "Đền chủ Akai, tiến lại gần Reina."
2509 = "Ánh mắt của đền chủ Akai lặng lẽ đổ dồn vào Niiroku. Cuối cùng, miệng Niiroku cũng mấp máy."
2522 = "Chắc chắn ở đó, cũng sẽ cần đến tài năng và nhân mạch của ông Minokasa."
2523 = "Nếu vô ý để lọt ra ngoài và lan truyền, sẽ là câu chuyện gây ra xáo trộn liên hoàn. Thậm chí có thể ảnh hưởng xấu đến việc thành lập bộ phận thứ ba."
2524 = "Điều đó khiến tôi vui vẻ. Và mãn nguyện."
2525 = "Ngay cả việc bước lên \\x%l運転台;#00ffc040;buồng lái%l;#; của \\x%l8620;#00ffc040;8620%l;#;, tôi cũng cảm thấy đã lâu lắm rồi mới làm cơ mà."
2529 = "Từ Reina vẫn ngoan ngoãn ngồi trên đùi Paulette, đến Niiroku ngồi trên ghế, hoàn toàn không có vẻ gì là phản ứng."
2530 = "Chưa kịp ngăn lại, Hachiroku đã thay sang thân chính bảo dưỡng, và thoăn thoắt bước xuống khỏi buồng lái."
2531 = "Ép cả trán vào lưng tôi, hoàn toàn không cho phép tôi——quay đầu lại."
2533 = "Dịu dàng, ấm áp——không khác gì Reina từ trước đến nay, nhưng, có phần trưởng thành hơn một chút."
2538 = "Từ phía bên kia——con bé đang phấn khích chuyện gì vậy nhỉ? Tôi nghe thấy giọng nói tươi sáng của Hibiki."
2540 = "Dù hình dáng hoàn toàn khác biệt nhưng…… đôi mắt ngây thơ kia, phần nào khiến tôi nhớ lại thứ đó."
2541 = "Dù miệng nói là vui, nhưng khuôn mặt Kisaki lại căng lại nghiêm nghị."
2544 = "Là phản ứng dây chuyền. Một phản ứng dây chuyền cực kỳ tốt đã được sinh ra."
2546 = "Một bảng báo giá cực kỳ đơn giản. Vậy mà Paulette lại làm ra vẻ mặt vô cùng kinh ngạc."
2549 = "Đối diện với Niiroku cực kỳ lạnh lùng, thậm chí còn toát ra vẻ đáng sợ, Reina chỉ đơn thuần bắt chuyện với vẻ vô cùng vui sướng."
2550 = "Đáp lại câu hỏi của Hibiki mà không hề ngẩng mặt lên."
2567 = "（Lúc được nhờ 『Ngài Soutetsu hãy làm người giám sát——』, tôi còn tự hỏi em ấy đang nói cái gì cơ chứ……）"
2569 = "（Cộc, cộc）"
2570 = "（Cạch!）"
2572 = "（A……ra là vậy）"
2574 = "（A……nhắc mới nhớ, đúng là vậy.）"
2575 = "（A……）"
2576 = "（Bốp!!）"
2577 = "（Uúúúúúúúúúúúú!）"
2578 = "（Thật tuyệt vời——）"
2580 = "（Nắm chặt）"
2581 = "（Chạm）"
2584 = "（Đây……là——）"

[selections]
