2418 = "Chỉ cần tàu bắt đầu chạy,\\nchắc chắn sắt và khói sẽ một lần nữa khích lệ Hikari."
2420 = "Sự đáng sợ của giáo dục—— hay nói đúng hơn là sự kinh khủng của nó,\\nnhư được phơi bày rõ mồn một trước mắt tôi."
2422 = "Ngay khoảnh khắc tôi vừa nói, người trưởng tàu bước đến."
2424 = "Giọng điệu có phần hơi gay gắt của cô ấy,\\nđược bà lão nhẹ nhàng xoa dịu bằng nụ cười đầy nếp nhăn."
2428 = "「Ừm. Nếu là động tác đó thì không gian này cũng đủ rồi.」"
2429 = "「Không chịu đâu.」"
2430 = "「À thì…… Hikari cứ đòi 『Mẹ dạy cho con luật đi tàu đi』.\\nNên em mới đọc một chút về Quy định kinh doanh hành khách của Công ty cổ phần Đường sắt Ohito.」"
2432 = "Chỉ cần tàu bắt đầu chạy,\\nchắc chắn sắt và khói sẽ một lần nữa khích lệ Hikari."
2435 = "Tôi vươn tay qua giường, lau cho Reina trước."
2437 = "Tôi lấy mảnh vụn dính trên má con bé,\\nđưa vào miệng đút cho con bé ăn."
2439 = "Tôi cố tình chà xát mạnh quả táo vào quần để lau vỏ."
2441 = "「Thật bất ngờ, đến anh còn không biết đấy.」"
2442 = "Đúng là có một giống táo tên là Hồng Ngọc——\\nNhưng quả này đích thực là một viên ngọc màu hồng tía."
2444 = "Tôi nhẹ nhàng xoa đầu con bé.\\nSợ thì vẫn là sợ thôi, nói lý lẽ cũng chẳng ích gì."
2445 = "Khi có gió mạnh, ngay cả toa xe thép cũng có thể bị lật,\\ndo đó, tuyến đường này được giữ lại vì mục đích đảm bảo an toàn."
2448 = "Phù.\\nThay vì giọng nói, Hikari khẽ thở phào nhẹ nhõm."
2450 = "Giọng điệu có phần hơi gay gắt của cô ấy,\\nđược bà lão nhẹ nhàng xoa dịu bằng nụ cười đầy nếp nhăn."
2459 = "「A, xin lỗi nhé.」"
2464 = "Lại cúi chào.\\nNgười trưởng tàu vội vã bước xuống sân ga."
2465 = "「Vì đây là điểm dừng kỹ thuật ạ.」"
2466 = "（Khi tỉnh dậy…… không biết tàu đã đến đâu rồi nhỉ.）"
2467 = "Nếu là tôi hồi nhỏ, chỉ cần nghe âm vang của những từ đó thôi,\\nchắc chắn tôi sẽ nằng nặc đòi đọc một cuốn sách khác——"
2478 = "Nếu là khung cảnh tuyết trắng thì thật tuyệt.\\nNếu vậy, đây sẽ là lần đầu tiên Hikari được thấy tuyết."
2488 = "Tất cả chúng tôi đều trở nên im lặng.\\nBởi vì trong miệng chứa đầy hương vị thơm ngon của táo."
2489 = "Tôi nhẹ nhàng xoa đầu con bé.\\nSợ thì vẫn là sợ thôi, nói lý lẽ cũng chẳng ích gì."
2490 = "「Ưm ư.」"
2491 = "「Vậy, tôi sẽ sắp xếp như thế.」"
2492 = "「Không biết nữa ạ. Chúng ta vẫn chưa đến Sendai mà——\\nHơn nữa bây giờ là tháng Ba rồi, khả năng có tuyết rơi cũng thấp lắm.」"
2494 = "「Anh chưa nói sao? Anh muốn vận động cơ thể một chút.」"
2495 = "Trượt vào sân ga một cách êm ái, ít chấn động nhất."
2496 = "「Này, đừng đẩy chứ.」"
2503 = "Dù luyến tiếc, nhưng đến đây thì đành phải buông nhau ra thôi.\\nBởi nếu máu trong người nóng lên hơn nữa thì sẽ không ngủ được mất."
2504 = "Sau đó bước xuống giường,\\nlấy miếng táo dính ở khóe miệng Paulette ra và dọn dẹp."
2505 = "Và rồi, từ bên trong——"
2513 = "「Á!」"
2515 = "Reina không thể nào không biết."
2516 = "Xấu hổ, con bé lại trốn đi."
2517 = "Rèm mở ra rồi lại đóng vào,\\nPaulette quay trở về chiếc giường đối diện."
2519 = "「Hửm? ——Ồ.」"
2522 = "「Ra là có quy định như vậy à.」"
2523 = "Câu khẳng định.\\nTrong tình huống này, không còn cách nào khác ngoài việc chấp nhận. Nhưng——"
2526 = "「Anh cứ nghĩ tàu chạy chậm thế này thì tốn nhiều thời gian lắm,\\nnhưng hóa ra việc tốn thời gian cũng có lý do chính đáng của nó nhỉ.」"
2527 = "Trong lúc chúng tôi nói chuyện, có vẻ Reina vẫn chăm chú lắng nghe phát thanh trên tàu."
2528 = "Có vẻ như đó chính là điểm đáng lo ngại nhất."
2529 = "Chắc hẳn bà lão thấy con bé rất đáng yêu."
2530 = "Chắc hẳn là rất hợp khẩu vị.\\nSự ngập ngừng lúc nãy cứ như thể chưa từng tồn tại——"
2531 = "Cổ họng Hikari phát ra tiếng ực."
2541 = "「Hửm?」"
2546 = "Đó là hành động tôi thường không làm ở nhà.\\nĐôi mắt Hikari mở to tròn xoe."
2548 = "Ở lối đi trước giường nằm của chúng tôi,\\nmột bà lão mang theo hành lý cồng kềnh bị đẩy tới."
2549 = "Phát thanh trên tàu.\\nNgay khoảnh khắc âm thanh vang lên, đôi mắt Hikari càng thêm lấp lánh."
2553 = "Giọng nói bực bội từ sân ga vọng vào tận đây qua cửa sổ.\\nNgay lập tức, Hikari trốn sau lưng Paulette."
2556 = "Dù sao thì cũng chỉ còn cách đợi tàu chạy."
2558 = "「Ba, ba ơi.」"
2560 = "Bà lão từ từ lục lọi trong đống hành lý,\\nra vẻ bí hiểm, lấy ra một quả táo nhỏ nhắn đặc biệt——"
2563 = "（……Rõ ràng chỉ là một nụ hôn nhẹ thôi mà.）"
2565 = "Bà lão từ từ, từ từ cởi tấm vải bọc hành lý ra, như cố tình trêu chọc sự tò mò."
2567 = "「Chào buổi sáng. Reina cũng dậy sớm quá nhỉ.\\nChuyến đi này em cứ ngủ nướng thêm một chút cũng được mà.」"
2569 = "Bà lão đặt hành lý xuống.\\nMột tiếng \\\"bịch\\\" nặng nề vang lên."
2571 = "Bà lão nhìn thấy Hikari,\\nliền nở nụ cười rạng rỡ."
2573 = "「Ưm nya.」"
2575 = "Nếu có gió mạnh, việc sử dụng Aircra sẽ bị hạn chế,\\nhành khách sử dụng tàu hỏa tăng vọt cũng là lẽ đương nhiên."
2578 = "Nghe tiếng Paulette, bờ vai Hikari khẽ run lên."
2579 = "Nghe vậy, tôi hướng mắt ra ngoài cửa sổ.\\nCảnh vật trôi qua một cách chậm chạp."
2580 = "「A, ra thì được thôi ạ—— nhưng mà?」"
2581 = "Khuôn mặt đỏ bừng,\\nPaulette lao ra mép giường."
2597 = "「Đây là quà cảm ơn vì đã nhường chỗ cho bà. Này cháu.」"
2600 = "Chắc là tôi đã có thể yêu cầu hoàn lại tiền vé rồi nhỉ.\\nTôi chợt nghĩ đến một chuyện thực sự chẳng thể thay đổi được nữa."
2612 = "「Phù, con ăn xong rồi ạ.」"
2614 = "「Thành thật xin lỗi quý khách, do quá đông đúc,\\nchúng tôi xin phép được đưa hành khách vào lối đi này.」"
2636 = "「Chào buổi sáng, anh Soutetsu.」"
2637 = "「Fufufu, cảm ơn anh vì phần thưởng nha.\\nThế này thì ngày mai em lại có thêm động lực rồi! Chúc ngủ ngon, anh Soutetsu.」"
2638 = "「……Hikari.」"
2639 = "Đúng là vậy thật."
2640 = "「Chuyện nhỏ.」"
2641 = "「Hikari cũng thế này, dính đầy cơm hộp rồi kìa.」"
2642 = "Khi có gió mạnh, ngay cả toa xe thép cũng có thể bị lật,\\ndo đó, tuyến đường này được giữ lại vì mục đích đảm bảo an toàn."
2643 = "「Hả!? Cháu ạ?」"
2645 = "Dù vốn dĩ tàu đã chạy chậm rì,\\nnhưng giờ lại giảm tốc một cách rõ rệt."
2646 = "「A, có cả những bé trạc tuổi bé Hikari nữa nha~」"
2648 = "Còn nhanh hơn cả tôi hỏi,\\nPaulette đã tuôn một tràng giải thích lưu loát."
2650 = "Nếu vậy, có lẽ cấu trúc hành khách, độ tuổi.\\nNhững điều đó cũng được ghi chép lại ở một mức độ nào đó."
2652 = "Giá như tôi cũng biết quy định đó.\\nChuyến tàu tốc hành rơi khỏi cây cầu ngày hôm ấy——"
2654 = "Thế thì tại sao—— Vừa lúc tôi đang nghĩ vậy,\\nthì lần này Reina lên tiếng hỏi."
2659 = "Trốn thì trốn, nhưng có vẻ vẫn tò mò,\\ncon bé chỉ ló mặt ra một chút xíu, chằm chằm nhìn vào khối hành lý to đùng."
2660 = "「Thích quá nhỉ, Hikari.\\nNào, con phải nói 『Cảm ơn』 chứ?」"
2661 = "Bà lão đặt hành lý xuống.\\nMột tiếng \\\"bịch\\\" nặng nề vang lên."
2662 = "Tôi mở mắt ra.\\nHikari đã chuyển sang giường của tôi từ lúc nào không hay."
2664 = "Chẳng lẽ…… tàu đang chạy giảm tốc sao?」"
2666 = "Paulette có tình cảm đặc biệt với Aomori."
2676 = "（♪~）"
2683 = "（Ba hiểu cảm giác đó. Rất hiểu là đằng khác.）"
2685 = "「Bà cứ đặt hành lý xuống đây nếu không phiền ạ.」"
2686 = "（Ngoạm）"
2687 = "「Không có gì.」"
2688 = "（Ưm……）"
2690 = "（A, nhưng mà.）"
2691 = "「Vậy thì, em cũng thế.\\nTuy hơi bất lịch sự một chút.」"

