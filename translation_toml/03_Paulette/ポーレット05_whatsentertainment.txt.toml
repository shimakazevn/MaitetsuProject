[script]
952 = "——Chiếc búa đập vào thanh sắt đang nung đỏ rực. Cảnh tượng đó, âm thanh đó, thật khiến máu trong người sôi sục."
959 = "Việc \"không có một hành khách nào khác\" tất nhiên là một vấn đề lớn, nhưng chỉ riêng hôm nay, tôi đã quyết định sẽ không làm gì ngoài việc tận hưởng."
962 = "……Ừm, cậu bé tên Soya Tarou này, đang được chăm sóc tại nhà của người dì tên Hori sao."
967 = "……Không chỉ là một kẻ bạo lực cứng đầu, mà Tarou này còn khá là ranh mãnh nữa."
968 = "「/////!」"
972 = "——『\"Chậc, mình chẳng muốn dán cửa shoji chút nào\". Nhưng nếu cãi lời dì Hori thì hậu quả sẽ rất đáng sợ』"
975 = "「——Tiểu thư. Cô có muốn đi chơi cùng tôi không?」"
976 = "「『——\"Tarou\", \"Tarou\", dù gọi bao nhiêu lần cũng không có tiếng động gì. 　\"Tarou à, cháu vẫn còn đang ngủ sao?\"』」"
980 = "「『\"Này Tarou, cậu bị bắt dán cửa shoji à\" 　\"Đừng có làm phiền tớ, bây giờ đang đến đoạn thú vị đấy\"』——」"
986 = "「……Ủa ủa? Anh Soutetsu?」"
988 = "「……Có lẽ, chúng ta đành phải nhờ những người hiểu rõ niềm vui của việc vui chơi suy nghĩ giúp thôi.」"
990 = "「『Cuộc phiêu lưu của Soya Tarou』」"
1188 = "「Không đâu, tôi muốn nhờ anh Soutetsu hoàn thiện giúp ạ.」"
1190 = "「Không cần phải quá căng thẳng đâu. Nếu đập đến mức làm hỏng cả hình dạng, thì cũng khá là đáng nể đấy.」"
1193 = "「Nếu không biết niềm vui là gì, thì không thể làm cho người khác vui được. Không phải ai khác, mà chính anh Soutetsu phải chơi đùa từ tận đáy lòng.」"
1195 = "「Đừng suy nghĩ những điều thừa thãi, chỉ cần tận hưởng hết mình là được. Đó mới là cách vui chơi sành điệu đấy.」"
1197 = "「Nhưng mà, sao hôm nay hai cháu lại đến đây, muốn trải nghiệm chuyện này vậy?」"
1202 = "「Từ lúc đó trở đi, có lẽ nó đã biến thành một nghĩa vụ. Ý nghĩ \"phải vui chơi\" đã làm giảm đi sự hăng hái của tôi.」"
1203 = "「Không có ai cả, nên Reina có thời gian rảnh đó nha~」"
1205 = "「Nói ngược lại, để giữ cho nó không bị hỏng và tồn tại lâu dài, thì cần phải làm nguội một cách khéo léo.」"
1209 = "「Mọi chuyện, sao ạ.」"
1219 = "「Hai người đã lên kế hoạch cho chuyến đi tiếp theo chưa vậy?」"
1220 = "「Nếu có gợi ý nào, thì nhất định hãy chỉ cho tôi với.」"
1222 = "「Sao thế, đột nhiên lại.」"
1224 = "「Nghe cô nói vậy, đúng là thế thật. Con người có lẽ đều có một mặt như vậy.」"
1226 = "「Anh đã hét lên đúng không? Anh Soutetsu.」"
1229 = "「Làm dao bếp.」"
1231 = "「Cái gì cơ? Làm dao bếp là sao?」"
1240 = "「Thì ra, tôi đã biết thế nào là niềm vui rồi.」"
1243 = "「Chà, mọi chuyện đều là như vậy mà.」"
1246 = "「Điều gì đã khiến tôi vui đến vậy. Điều gì, đã tạo nên sự khác biệt.」"
1247 = "「Bắt đầu?」"
1249 = "「Ra vậy…… Nếu đi dạo quanh đó, thì có thể học hỏi đồng thời về du lịch và vui chơi sao.」"
1250 = "「Ra vậy.」"
1251 = "「Ra là vậy sao ạ.」"
1267 = "「Bởi vì trải nghiệm này, chỉ có Nagi và đám bạn của con bé là từng làm thôi.」"
1269 = "「Nếu chúng ta có thể kích thích khía cạnh đó một cách khéo léo, thì trải nghiệm khai thác mỏ—— chẳng phải sẽ mang lại một giá trị mới cho họ sao.」"
1270 = "「Ngay cả việc dán cửa shoji, nếu được coi là \"trò chơi thú vị\", thì sẽ có vô số người muốn làm dù phải trả giá.」"
1273 = "「Kya!?」"
1276 = "「Hawaa…… Tarou là một cậu bé nghịch ngợm nhỉ~」"
1277 = "「Oa…… Giọng đọc diễn cảm của anh Soutetsu.」"
1281 = "「Oa! Tarou thông minh quá đi ạ~」"
1282 = "「Oa! Có vẻ vui lắm nha. Reina rất sẵn lòng cùng anh đó ạ~」"
1284 = "「Oa! Là 『Còn tiếp』 nhỉ~」"
1285 = "「Oa! Là sách này. Anh Soutetsu, đến giờ học rồi sao ạ?」"
1287 = "「Oa, đúng vậy nhỉ.」"
1289 = "「Haha, cá ngừ thì tuyệt quá nhỉ.」"
1290 = "「Không, cảm ơn em. Nhờ em mà anh đã có khoảng thời gian vui vẻ nhất từ trước đến nay.」"
1293 = "「Ôi chà.」"
1296 = "「Hả? Anh Miyamoto? A, cháu xin lỗi!」"
1297 = "「Hả? Tại sao vậy?」"
1299 = "「Ôi——chà——cái này——」"
1300 = "「Ồ.」"
1302 = "「Ồ ồ, cô bé cũng khéo tay quá nhỉ.」"
1303 = "「Ồ, làm tốt lắm, làm tốt lắm. Vậy tiếp theo là đến lượt cô tiểu thư Hinai nhỉ.」"
1305 = "「Hô, ra là vậy sao.」"
1307 = "「Fufu-n, nếu vậy thì, em sẽ dẫn đường cho nha!」"
1309 = "「Fufu-n.」"
1310 = "「Ừm.」"
1312 = "「Hửm? Sao thế Paulette?」"
1313 = "「Hửm?」"
1314 = "「A-」"
1315 = "「A……」"
1317 = "「A! Đúng rồi. Là sức nóng. Sức nóng mà ông Minokasa đã nói đến. Cảm giác như nó đột ngột nguội lạnh đi vậy.」"
1319 = "「A, xin lỗi nhé.」"
1320 = "「À, thì ra là vậy.」"
1323 = "「Alo, tôi đây. Vâng——Hả? Ở làng Sagara sao? Vâng——Tôi hiểu rồi, xin hãy đến ngay!」"
1326 = "「Ừm——Ra vậy.」"
1327 = "「Ừm. Chúc em ngủ ngon, Hachiroku.」"
1328 = "「Vâng.」"
1329 = "「Vâng!」"
1330 = "「Ừm, nói cách khác là \"trò chơi\". Khiến họ cảm thấy bản thân trải nghiệm khai thác mỏ chính là một \"trò chơi\".」"
1332 = "「Ừm, có vẻ là một đứa trẻ khá ngỗ ngược đấy.」"
1335 = "「Chà, nói là học thì cũng là học.」"
1336 = "「Hửm?」"
1337 = "「Chậc! Anh hai chẳng có gì đáng để trêu chọc cả nha~」"
1340 = "「Ufufu.」"
1341 = "「Suỵt, chị Paulette. Phải giữ im lặng đó nha~」"
1342 = "「Ồ, làm phiền em rồi.」"
1346 = "「Vì là hai người, nên không phải lo chuyện say sóng đâu. Ạ.」"
1347 = "「Bởi vì nó khá tốn thời gian mà. Khách du lịch thời nay, họ không có thời gian rảnh rỗi để thư thả——」"
1348 = "「Bởi vì lúc nóng nhất, cũng không có nghĩa là sẽ kéo dài mãi mãi mà.」"
1355 = "「『\"Vẫn chưa chịu thua sao!\" Nắm đấm sắt của Tarou giáng xuống như mưa. 　Thằng nhóc mới đến cuối cùng cũng phải giơ tay \"Chịu thua!\"』」"
1356 = "「Oa!」"
1358 = "「Nếu nguội đi đột ngột thì sẽ bị hỏng. Nếu nguội đi từ từ, thì sự dẻo dai sẽ được sinh ra.」"
1360 = "「Than đào được có thể dùng như tiền tệ địa phương—— Cái đó cũng giống trò chơi đồ hàng, có yếu tố vui chơi trong đó nhỉ.」"
1361 = "「Nói sao nhỉ…… Cảm giác như thiếu thiếu một thứ gì đó. Dù đã hoàn thiện, nhưng thành thật mà nói, tôi không hài lòng với kết quả.」"
1364 = "「Đúng vậy đó nha! Fukami hôm nay chọn toàn chỗ dòng chảy xiết thôi đó!」"
1365 = "「Đúng rồi đó!」"
1367 = "「Kẹp một miếng thép giữa hai tấm thép không gỉ, nung nóng, đập và làm cứng nó lại.」"
1371 = "「Đúng vậy ạ. Vì thế, từ hôm nay em sẽ sang ngủ ở phòng của Hibiki.」"
1372 = "「Chính là như vậy đó.」"
1373 = "「Chà, nó là cái máy đúng như cháu thấy đấy. Với cái này, cháu hãy——」"
1379 = "「Trước đây cháu từng khảo sát ở thành phố. Về những địa điểm mà khách du lịch có mức độ hài lòng cao ạ.」"
1384 = "「Ông sẽ ủ mềm thép một chút như thế này. Nếu không thì thép sẽ giòn và dễ bị mẻ lắm.」"
1390 = "「Có lẽ tôi đã rời xa việc vui chơi hơi lâu rồi. Dù tôi nhớ hồi nhỏ mình cũng từng chơi đùa thỏa thích.」"
1392 = "「Không hài lòng gì chứ——」"
1395 = "「Tôi——Tôi! Tôi biết đấy!! À ừm, tôi đã từng tìm hiểu rất nhiều thứ ở thành phố.」"
1398 = "「Đã cất công hai người cùng đến đây mà. Hoàn thiện bằng sự hợp tác của cả hai, sẽ khiến tôi vui hơn rất nhiều, rất nhiều đấy.」"
1400 = "「Là để đi chơi——Cháu đã quyết định sẽ dành trọn một ngày để đi chơi và tận hưởng niềm vui cùng Paulette ạ.」"
1401 = "「Tôi về rồi đây——Ủa? Đang đọc sách sao?」"
1405 = "「Tôi hiểu rồi. Vậy thì chúng ta chia việc ra làm nhé. Tôi sẽ ra lệnh cho Navi đưa cô đi.」"
1406 = "「Tôi sẽ ở lại và hoàn thiện những con dao. À, nếu Paulette muốn tự mình」"
1408 = "「Tập trung vào việc vui chơi quá, mà tôi quên mất cả sự quan tâm cơ bản nhất.」"
1409 = "「Lúc đó cũng rất vui. Vui nhưng——hoàn toàn khác với niềm vui của ngày hôm nay.」"
1411 = "「Tôi, là tôi. Ưu tiên hàng đầu cho niềm vui mà tôi đã tìm thấy, đó chính là \"câu trả lời\".」"
1413 = "「Câu trả lời của tôi, sao——」"
1414 = "「Cháu hiểu rồi.」"
1416 = "「Chính bản thân tôi sao.」"
1418 = "「Phải tin tưởng. Vào niềm vui mà mình đã cảm nhận được. Để có thể nếm trải nó một lần nữa, hãy suy nghĩ xem mình muốn làm gì.」"
1419 = "「Tôi nghĩ những chuyện như vậy có rất nhiều đấy.」"
1424 = "「Dùng cái máy này đập và kéo dài nó ra theo kích thước cháu thích là được.」"
1425 = "「Bám vào tôi đi.」"
1427 = "「Xin lỗi, Reina. Phần tiếp theo của cuốn sách để hôm khác đọc được không?」"
1429 = "「Giống như đấu giá chẳng hạn, tôi nghĩ cũng tương tự như vậy. Chỉ cần nghĩ là \"có giá trị\", mọi người sẽ kích động lẫn nhau và khiến nó trở nên nóng sốt.」"
1435 = "「Giá trị mới.」"
1437 = "「Nếu em muốn vậy, tôi sẽ không cản, nhưng—— tuy nhiên.」"
1438 = "「V-Vâng! Xin nhờ ông ạ!」"
1441 = "「Đúng là vậy.」"
1443 = "「Đúng rồi đó! Nếu là \"hai người\" thì~」"
1444 = "「Đúng vậy——Khiến người khác nghĩ dán cửa shoji là một trò chơi thú vị, không chỉ bắt họ làm thay mình, mà còn nhận được cả quà cảm ơn, nữa——」"
1446 = "「Đúng vậy.」"
1447 = "「Đúng vậy, là 『Còn tiếp』.」"
1449 = "「Vậy sao.」"
1451 = "「Là bởi vì có Paulette ở đó. Bởi vì Paulette, luôn nở nụ cười.」"
1454 = "「Sức nóng đối với chuyện gì cơ ạ?」"
1455 = "「Là sức nóng đối với việc vui chơi. Khi Paulette rời đi, tôi bị bỏ lại một mình, và bỗng chốc…… chẳng còn thấy vui nữa.」"
1456 = "「Đó là một công việc tỉ mỉ, và không chỉ dán một tấm là xong đâu. Chà, nói là phiền phức thì cũng phiền phức thật.」"
1459 = "「Vậy sao?」"
1462 = "「Hả! Vâng! Thật sự——thật sự, rất! Bổ ích——và tôi muốn biến nó thành điều bổ ích. Tôi nghĩ vậy.」"
1465 = "「Vâng, chúc ngài Soutetsu ngủ ngon. Và mong ngài sẽ đón một ngày mai thật tuyệt vời.」"
1469 = "「Điều quan trọng không phải là mánh khóe. Điều quan trọng không phải là diễn xuất. Mà là việc chúng ta, có thể nở nụ cười——một nụ cười từ tận đáy lòng.」"
1470 = "「Vâng ạ. Việc bảo dưỡng cũng đã xong rồi, và hành khách cũng……」"
1478 = "「Không sao đâu ạ. Hibiki cũng sẽ không từ chối đâu. Chắc chắn em và cô ấy sẽ nói chuyện rất hợp nhau mà.」"
1481 = "「Dầu sao ạ!?」"
1486 = "「Chị ấy đi mua sắm một chút rồi ạ. Reina đã về trước một bước đó nha~」"
1487 = "「Của Paulette, khá là nhỏ gọn và dày dặn nhỉ.」"
1488 = "「Chị Paulette! Mừng chị đã về ạ. Bọn em chỉ mới bắt đầu thôi đó nha~」"
1489 = "「Thật bổ ích nhỉ, Paulette.」"
1490 = "「Để xúc tiến du lịch, tôi đã tìm hiểu về những địa điểm nổi tiếng trong thành phố Ohimitera, các sự kiện và những thứ tương tự.」"
1491 = "「Tại sao vậy ạ!? Một trải nghiệm thú vị như thế này mà.」"
1492 = "「Tại sao, khi chỉ còn một mình, cuộc vui lại kết thúc—— Khi chỉ còn một mình, niềm vui lại biến mất nhỉ.」"
1500 = "「Vậy sao? Rồi sau đó ngài Soutetsu thế nào ạ?」"
1501 = "「Sau đó, khi chuyến đi xuôi dòng sông Kuma kết thúc, Nagi đã hỏi: 『Kế hoạch tiếp theo là gì?』 ạ.」"
1502 = "「Chúng ta sẽ đào sâu và mở rộng điều đó hơn nữa. Không phải đào vì phần thưởng, mà biến chính việc đào mỏ thành một trò chơi thú vị.」"
1506 = "「Reina đi pha trà đây ạ~」"
1508 = "「Chỉ có một mình Reina thôi sao? Paulette đâu rồi?」"
1509 = "「Bây giờ, Reina có thời gian rảnh không?」"
1510 = "「Điểm cần đặt câu hỏi là……」"
1511 = "「Tất nhiên là tôi đã hoàn thiện nó. Hoàn thiện xong nhưng thế này——」"
1512 = "「Có chứ! Một địa điểm nổi tiếng được giấu kín đó nha!」"
1513 = "「Tất nhiên, tôi không nói về chuyện làm tốt hay không tốt. Không phải vậy——mà là cái này…… gọi là sự hăng hái chăng.」"
1514 = "「Chà, có vẻ sẽ tạo ra những con dao bếp với những đặc điểm khác biệt đến đáng kinh ngạc đây.」"
1515 = "「Có vẻ như ông đã pha trà quá nóng rồi nhỉ.」"
1520 = "「Cũng…… khá vui. Nhưng——chất lượng của niềm vui, hay nói cách khác là sự hăng hái thì lại khác.」"
1525 = "「Câu trả lời? Của cái gì cơ?」"
1528 = "「Dán cửa shoji là việc đáng ghét lắm sao ạ? Reina chưa làm bao giờ đâu ạ~」"
1531 = "「Hơn nữa lại còn 180 độ…… Ông dùng thứ còn nóng hơn cả nước sôi để làm nguội sao?」"
1533 = "「Để ngài có thể tìm ra câu trả lời đó, Hachiroku chắc chắn sẽ trở thành một chướng ngại vật.」"
1534 = "「Nếu vậy thì, bõ công em cố gắng rồi. Ạ.」"
1535 = "「Vâng ạ, trà pha xong rồi đây nha~」"
1540 = "「Ông Minokasa…… Đương nhiên rồi, ông ấy là một nghệ nhân mà nhỉ.」"
1544 = "「Có cần dùng Navi không?」"
1546 = "「Bằng cách nào ạ?」"
1548 = "「Nếu để nguội thì——」"
1553 = "「Thử đạp nhẹ vào bàn đạp dưới chân xem sao.」"
1554 = "「Nhắc mới nhớ……」"
1559 = "「Tìm hiểu?」"
1560 = "「Xin nhờ ông ạ.」"
1561 = "「Nhất định phải kể chi tiết cho tôi nghe đấy. Làm dao bếp rốt cuộc là——」"
1562 = "「A, cảm ơn anh nhiều ạ.」"
1563 = "「Cảm ơn anh rất nhiều. A, nhưng mà——」"
1564 = "「Cảm ơn em nhé, Reina」"
1582 = "「Cũng đúng nhỉ.」"
1583 = "「Không được đâu, như thế thì.」"
1584 = "「Cái này——Là điều Hibiki muốn dạy cho tôi sao.」"
1585 = "「Đó có lẽ là ưu tiên hàng đầu của Houshou Kisaki.」"
1586 = "「Tại Fukami phục vụ quá nhiệt tình mà.」"
1591 = "「Khá là——ưm——không được, như——ý muốn.」"
1592 = "「Vậy, là thế này.」"
1598 = "「Vậy thì, hai cháu có muốn làm thử không.」"
1599 = "「À ừm.」"
1600 = "「Chất lỏng đó là gì vậy ạ?」"
1602 = "「Vậy, trước tiên là cậu Soutetsu. Hãy ngồi trước cái máy này đi.」"
1603 = "「Chuyện đó thì——」"
1607 = "「Nếu vậy thì, thử xem sao. Nhưng——nói là vui chơi thì.」"
1608 = "「Vậy thì, cùng chơi thôi, anh Soutetsu. Không chơi là không được đâu, tuyệt đối không được.」"
1610 = "「Nếu vậy thì, \"niềm vui\" chính là điều này.」"
1612 = "「Nếu vậy thì Reina, sẽ rất mong chờ phần tiếp theo đó nha~」"
1613 = "「Đương nhiên là đối với việc làm dao bếp—— À, không, không phải.」"
1615 = "「Vậy thì, cùng tôi một chút được không?」"
1616 = "「Vậy thì ngài Soutetsu. Hẹn gặp ngài vào ngày mai.」"
1617 = "「Vậy thì, để có thể tận hưởng hết mình——」"
1618 = "「Phần thép đó sẽ trở thành lưỡi dao sao ạ?」"
1621 = "「Cùng anh, là làm gì cơ ạ?」"
1622 = "「Đọc sách. Tôi sẽ đọc diễn cảm, và tôi muốn em lắng nghe nó.」"
1626 = "「Của anh Soutetsu thì lớn thật đấy. Cảm giác như có thể xẻ thịt cả cá ngừ luôn ấy.」"
1627 = "「Ngài Soutetsu.」"
1628 = "「Vốn dĩ, ngài Soutetsu đâu có kinh nghiệm gì về nghề rèn đâu ạ. Vậy mà ngài lại mong đợi một kết quả mỹ mãn sao——」"
1629 = "「Câu trả lời của chính ngài Soutetsu ạ.」"
1630 = "「Ngài Soutetsu, ngài sắp tìm ra câu trả lời cho mình rồi đấy ạ.」"
1631 = "「Thứ mà hai cháu sẽ được trải nghiệm chế tác, là dao bếp bằng thép không gỉ.」"
1632 = "「!!?」"
1633 = "「!?」"
1634 = "「Là dầu 180 độ.」"
1792 = "Không phải là tôi coi nhẹ lời khuyên của Hibiki, nhưng——"
1795 = "Không được, không được. Hôm nay phải vui chơi. Tôi đã quyết định chỉ tập trung vào điều đó thôi."
1798 = "Tuy nhiên, tài liệu lại là văn học thiếu nhi."
1799 = "Nhưng, nếu đó là một nơi thú vị đến mức Fukami có thể nghĩ ra ngay lập tức, thì có lẽ đây thực sự là một địa điểm tuyệt vời chưa được nhiều người biết đến."
1801 = "Không cần những mánh khóe nhỏ nhặt. Bởi vì chúng tôi là một đội."
1803 = "Muốn giữ cho mối quan hệ không bị đổ vỡ, và kéo dài mãi mãi…… Người mà Paulette mong muốn điều đó là——"
1806 = "Nếu hiểu được ông ấy đang làm gì, thì sự hứng thú với cảnh tượng trước mắt sẽ càng sâu sắc hơn."
1811 = "Chuyện gì vậy? Khi tôi nhìn lại Nagi, em ấy khẽ lắc đầu, cố gắng dẫn dắt ánh nhìn của tôi."
1813 = "Nhưng hôm nay, ông lại gọi là cô tiểu thư Hinai. Không hiểu sao, một lời nói vô tình ấy lại khiến tôi cảm thấy vô cùng vui sướng."
1815 = "Mặt có đường cong thoai thoải—— Hãy kéo dài phần sẽ trở thành lưỡi dao ra cho mỏng, một lời khuyên hết sức hiển nhiên."
1817 = "Chậm rãi đứng dậy, ông Minokasa đi vào phía trong, dặn dò vợ mình điều gì đó."
1819 = "Dù đang giải thích cho chúng tôi, nhưng những ngón tay của ông ấy hoàn toàn không bị cuốn theo nhịp điệu của lời nói."
1821 = "Nhưng, hôm nay thì khác. Tôi của ngày hôm nay——"
1823 = "Trong khoảng thời gian ở cùng Paulette, không chỉ có niềm vui đó."
1825 = "Nhưng cánh tay đó, chiếc búa đó, thanh sắt đó—— chỉ có thể thấy rằng ông ấy đang hoàn toàn kiểm soát và chi phối chúng."
1826 = "Nhưng, tôi hiểu. Tôi cảm nhận được điều đó. Hachiroku vô cùng nghiêm túc, không hề trêu đùa tôi chút nào."
1829 = "Nhưng, khi nhìn vào thứ mà chúng tôi vừa kéo dài xong——"
1830 = "Có lẽ do suy nghĩ đây là sách dành cho trẻ em, nên tôi không tài nào có hứng thú bắt đầu đọc."
1843 = "Việc làm dao bếp vẫn rất thú vị cho đến tận phút cuối."
1860 = "Trước tiên, phải lo được cái ăn. Sau đó mới lấy lại nụ cười."
1866 = "Chống ba ngón tay xuống sàn—— Em ấy cúi đầu thật sâu trước tôi."
1867 = "Hachiroku bước đi như thể không hề có tiếng bước chân—— nhưng tôi có thể cảm nhận được sự hiện diện của em ấy đang lặng lẽ, lặng lẽ xa dần."
1870 = "Tôi suy nghĩ. Về lý do khiến Hachiroku rời đi."
1871 = "Hôm nay em ấy không chui vào mép chăn như mọi khi."
1874 = "Đột nhiên, Hachiroku ngồi thẳng người lại."
1876 = "Giọng nói của Nagi như thể đang đắc thắng."
1879 = "Rốt cuộc, làm thế nào để điều chỉnh nó cho phù hợp với khách du lịch…… Đến mức tôi đã từ bỏ việc vui chơi để bàn bạc về nó. ——A!"
1888 = "Khối kim loại hình con dao, chẳng mấy chốc đã mở rộng ra thành kích thước của một con dao bếp nhỏ."
1899 = "Chỉ mới nói tựa đề thôi mà đôi mắt em ấy đã sáng rực lên. Thế này thì tốt."
1900 = "Chỉ có thể nói là do tính cách. Paulette khác với tôi, cô ấy không đạp bàn đạp liên tục."
1903 = "Hãy biến khu mỏ bỏ hoang, biến Ohimitera thành một nơi như vậy. Để làm được điều đó, chỉ cần suy nghĩ từng việc một là được."
1904 = "Nhìn sang, tôi thấy mặt Paulette đang đỏ bừng."
1907 = "Nhưng, ngay khi chỉ còn một mình, tôi lại trở về là tôi của ngày thường……"
1919 = "Trong suốt khoảng thời gian ở cùng Paulette, tôi đều cảm thấy vui vẻ."
1920 = "Hô…… Ra vậy. Ra là thế. Không ngờ lại dùng cách này để vượt qua——"
1922 = "Ừm. Nếu vậy thì, có lẽ cũng vừa vặn."
1925 = "Tại sao lại không chịu nghe lời cơ chứ—— Bởi vì miêu tả quá đỗi sống động, nên tôi thậm chí còn cảm thấy tức giận."
1927 = "Trong khoảnh khắc tôi bị áp đảo, Paulette ực một cái, uống cạn cốc hồng trà."
1933 = "Mùa hè nóng bức, trong một xưởng rèn nóng bức, với một tách trà nóng. Cảm giác như thiêu đốt từ cổ họng xuống tận bụng, quả thực rất ngon."
1939 = "Cô ấy dừng lại, quay đầu lại và mỉm cười."
1941 = "Trong một thoáng, khuôn mặt cô ấy lộ vẻ ngạc nhiên. Ngay khoảnh khắc tiếp theo, nó vỡ òa thành một nụ cười rạng rỡ."
1943 = "Ngồi đối diện và cách xa tôi một chút, Hachiroku nghiêng đầu vẻ bối rối."
1945 = "Nói rồi, em ấy lạch bạch đi vào phía trong cửa hàng."
1947 = "Paulette giơ một ngón trỏ lên đầy khí thế, và chĩa thẳng vào chóp mũi tôi."
1948 = "Một câu trả lời chẳng khác nào câu đố."
1951 = "Tôi dùng ánh mắt ngăn Paulette lại khi cô ấy định trả lời bằng giọng the thé, và để tôi tiếp quản cuộc trò chuyện."
1952 = "Cô ấy nói là từ anh Miyamoto. Nếu vậy thì có lẽ đó là nhạc chuông dùng cho trường hợp khẩn cấp——bất thường."
1955 = "Đạp xuống đập một nhát rồi nhả bàn đạp ra, đạp xuống đập một nhát rồi nhả bàn đạp ra, cô ấy cứ lặp đi lặp lại từng chút một, cẩn thận và tỉ mỉ."
1957 = "Cánh cửa fusuma được mở ra mà không phát ra tiếng động, rồi lại đóng lại."
1960 = "Nếu có gì đó thiếu sót hay sai lệch, thì chắc chắn sẽ có người khác sửa chữa giúp."
1963 = "Lúc nào cũng vậy, nếu có nụ cười đó, thì chuyến xuôi dòng sông chắc chắn sẽ trở thành một nơi mà mọi người có thể tận hưởng nhiều hơn."
1964 = "Nếu lý do khiến Paulette đỏ mặt dữ dội như vậy, thực sự nằm ở đó thì……"
1974 = "Houshou Kisaki đã nhìn thấu điều đó và bỏ cuộc, chuyển sang thúc đẩy việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;."
1982 = "Ngay cả đền Akai Aso mà tôi đã đi đến bao nhiêu lần, hôm nay tôi cũng có thể coi nó là một \"địa điểm vui chơi\" thú vị."
1983 = "Ngay trong khoảnh khắc này, tôi cảm nhận được Paulette đang quan tâm, muốn tôi được vui vẻ, muốn tôi được chơi đùa."
1985 = "Giá mà Tarou cũng biết chừa một chút thì tốt—— Tôi vừa nghĩ vậy vừa lật trang sách."
2012 = "Nếu vậy thì dù là chuyện gì, chắc chắn cũng là tình huống khẩn cấp. Tôi cũng tò mò không biết có chuyện gì xảy ra, nhưng——"
2016 = "Nếu vậy thì với đôi tai đó, câu chuyện này hẳn không chỉ là một điều viển vông."
2018 = "Nghĩ lại thì, mọi thứ đều liên kết với nhau. Tôi nhớ ra rồi. Nagi hôm nay, Fukami hôm nay, đã đùa giỡn mà không hề căng thẳng."
2019 = "Có cảm giác nếu nắm mạnh thì sẽ làm nó vỡ vụn mất, nên tôi chỉ có thể nhẹ nhàng bao bọc lấy nó."
2023 = "Dù không thể diễn tả cảm giác đó thành lời, nhưng tôi vẫn vắt óc suy nghĩ để cố gắng gợi lại nó."
2025 = "Tôi và Paulette, hai người thay phiên nhau kể chuyện."
2027 = "Tôi nhớ lại. Chuyện của một quá khứ rất đỗi xa xôi."
2030 = "Trong tâm trí tôi hiện lên nụ cười của Paulette. Để có thể nhìn thấy Paulette mỉm cười."
2031 = "Những gì tôi nhận được từ cuộc trò chuyện và trải nghiệm chế tác cùng ông Minokasa, có lẽ chỉ là sự hưng phấn trí tuệ thuần túy."
2033 = "Một thanh sắt dày như chiếc chày dùng để giã bánh giày, đang sáng bóng màu đen ngay trước mắt tôi khi tôi ngồi trên ghế."
2034 = "Một con đường ánh sáng vụt hiện ra—— Tôi có cảm giác như con đường mình nên đi đã được mở ra ngay trước mắt."
2036 = "Một rung động khá mạnh truyền đến. Sự rung động đó làm rung chuyển dữ dội một thứ gì đó nguyên thủy bên trong tôi."
2037 = "Một lực vừa phải, dễ chịu truyền đến từ bàn tay đang được nắm."
2039 = "Bàn tay đặt lên lòng bàn tay tôi mềm mại, nhỏ bé và ấm áp. Hơi rịn một chút mồ hôi."
2042 = "Những lời nói mạnh mẽ và ánh mắt kiên định không ngờ tới."
2044 = "Tôi không thể diễn tả cảm giác đó thành lời một cách trọn vẹn. Đôi tay tôi cứ cử động lung tung một cách vô nghĩa."
2046 = "Hoặc có lẽ khuôn mặt tôi, cũng đã đỏ lên đôi chút."
2049 = "Tôi nhìn Paulette. Đôi mắt ấy nhìn lại tôi, và cô ấy gật đầu."
2050 = "Khi tôi quay mặt về phía Paulette, cô ấy chỉ khẽ lắc đầu."
2051 = "Ngay khoảnh khắc nghĩ vậy, tôi nhận ra \"mình không hề ở một mình\"."
2053 = "Hình như bình thường, ông Minokasa vẫn hay gọi Paulette là ngài Thị trưởng."
2056 = "Tôi vươn tay về phía Paulette khi cô ấy sắp mất thăng bằng."
2057 = "Máy đóng cọc bằng thép—— Nếu không thì, nó giống như một cái máy giã bánh giày vậy."
2060 = "Suy nghĩ về những ý tưởng đó——chỉ cần vậy thôi, chắc chắn rồi. Tôi đã có thể mỉm cười."
2061 = "Một vòng tuần hoàn tốt có lẽ sẽ được sinh ra sau đó. Nhưng——"
2066 = "Nghĩ vậy, tôi thử đạp lên bàn đạp."
2068 = "Việc Hachiroku rời đi có nghĩa là, đó là điều tôi nên tự mình suy nghĩ ——, tự mình tìm ra."
2070 = "Nếu có phản ứng thế này, thì tôi có thể dồn hết tâm sức để đọc rồi."
2072 = "Nếu vậy thì dù chỉ còn một mình, tôi cũng sẽ hoàn thành nhiệm vụ——à không, cuộc đi chơi ngày hôm nay."
2074 = "Nếu nó áp dụng cho tất cả các mối quan hệ con người nói chung, thì tất nhiên, nó cũng sẽ áp dụng cho cả mối quan hệ nam nữ, quan hệ yêu đương."
2077 = "Dù tôi đã xuống thuyền trước, nhưng thế này thì có hơi thiếu tinh ý."
2079 = "Chỉ một cử chỉ đó thôi, với nụ cười không hề thay đổi so với mọi ngày, nhưng lại khiến trái tim tôi thắt lại đến đau nhói."
2081 = "Đã cất công pha trà rồi, vậy mà cô ấy lại không thèm vươn tay lấy cốc."
2083 = "Có lẽ do trà quá nóng, mà khuôn mặt của Paulette đỏ bừng——!!!"
2085 = "Ừ. Đúng vậy. Khi ở cùng Paulette, dù làm gì đi nữa, đó cũng là một trò chơi thú vị."
2089 = "Bị ảnh hưởng bởi hoàn cảnh, bởi con người——bởi những thứ xung quanh, giá trị quan ban đầu sẽ bị thay đổi."
2092 = "Trên bàn là một chiếc bình bi đông. Chỉ trong chốc lát, tư thế lắng nghe đã được chuẩn bị sẵn sàng."
2093 = "Trước một câu hỏi vô cùng giản dị, nhưng suy nghĩ của tôi lại hoàn toàn khựng lại."
2096 = "Niềm vui, sự thích thú, trò chơi——những giá trị quan đó, tôi không tài nào thay thế bằng những ví dụ cụ thể được."
2098 = "Vì không đủ ăn, vì bất an, nên không thể nở nụ cười. Những người không thể nở nụ cười thì không thể nào mang lại niềm vui cho du khách được."
2100 = "Mỗi nhát búa đập xuống đó, đang kết hợp thép không gỉ và thép lại làm một."
2101 = "Ví dụ như, đúng rồi, chuyến xuôi dòng sông. Nếu là thuyền xuôi dòng, tôi cũng từng đi cùng Hachiroku."
2105 = "Không ngờ nhân vật chính của văn học thiếu nhi, lại có thể nói dối trơn tru đến vậy."
2106 = "Vậy mà nó lại không nằm trong kiến thức của Paulette."
2107 = "Chặn trước những lời tôi định nói, em ấy tự mình nhanh chóng đứng dậy."
2118 = "Từ cổ họng Paulette cũng phát ra một tiếng thở phào, như thể đã yên tâm."
2119 = "Khuôn mặt giận dữ. Trông như đang diễn kịch, nhưng cũng có vẻ như đang nghiêm túc."
2120 = "Paulette đưa những ngón tay thon dài xinh đẹp chạm lên cằm."
2121 = "Từ giọng nói đáp lại ngay lập tức của Paulette, tôi cảm nhận được sự căng thẳng."
2122 = "Paulette quay lại nhìn tôi. Đôi mắt nhìn thẳng ấy như hút lấy những lời tôi định nói."
2124 = "Fukami gật đầu với vẻ mặt đồng tình."
2127 = "Và sau đó, ông nhúng nó vào một chất lỏng nào đó."
2131 = "Nụ cười của bố, của mẹ. Và hơn ai hết, nụ cười của Michiko—— Tôi đã yêu nó từ tận đáy lòng, và từng được bao bọc trong nó."
2135 = "Reina quay đầu nhìn quanh quất, đưa mắt dáo dác khắp nơi."
2136 = "Hồng trà do Reina pha, cũng tuyệt đối không thua kém gì Paulette."
2138 = "Reina hớn hở mang ghế của mình đến và ngồi ngay đối diện tôi."
2139 = "Lúc đó, ông Minokasa cũng ở đó, chúng tôi cũng đã trò chuyện. Cùng nhau chế tác đồ vật. Nhưng——"
2140 = "Nếu hiểu theo nghĩa xấu, đó có thể là điểm yếu để những kẻ lừa đảo lợi dụng——"
2142 = "Quả thực……điều đó cũng áp dụng cho cả các mối quan hệ con người, hoặc là những trào lưu, tôi có cảm giác nó cũng áp dụng cho những thứ như vậy."
2144 = "Ngược lại, nếu một người như tôi cũng có thể tận hưởng từ tận đáy lòng, thì trò chơi đó, có lẽ sẽ có đủ giá trị để trở thành điểm nhấn thu hút khách du lịch."
2145 = "Có vẻ như Hachiroku đã tìm ra câu trả lời nào đó trước cả tôi."
2147 = "Trước phản ứng đó, không hiểu sao ngay cả tôi, cũng cảm thấy ngượng ngùng và xấu hổ."
2156 = "Quả thực, có lẽ là như vậy. Cỡ như Reina hay Nagi thì đụng vào cái gì cũng có vẻ vui, nhưng——"
2160 = "Uống trực tiếp không pha thêm gì. Độ nóng, vị ngon và hương thơm phong phú lan tỏa trong miệng."
2172 = "Trước lời nói xen vào ngay lập tức của Nagi, Fukami ho hắng một tiếng."
2173 = "Khi tôi hỏi câu đó đầu tiên, Paulette lộ vẻ mặt vừa áy náy vừa nhẹ nhõm."
2174 = "Nghe ông nói vậy, tôi cảm thấy nhẹ nhõm hơn."
2176 = "Là việc Paulette nở nụ cười. Là việc Paulette cảm thấy vui vẻ."
2178 = "Chiếc thuyền tròng trành, lắc lư dữ dội—— Nếu có thêm một hành khách nào khác, chắc chắn sẽ không thể trải nghiệm được điều này."
2188 = "Không hề gắng sức. Giống hệt như ngày thường, không có gì thay đổi. Thậm chí nét mặt vẫn giữ vẻ hiền hòa."
2189 = "Vật liệu nung đỏ mà ông Minokasa vừa đập và kéo dài lúc nãy. Nó đã có hình dạng giống như một con dao ở một mức độ nào đó."
2190 = "Hoàn toàn bị thuyết phục. Ông Minokasa gật đầu sâu sắc với vẻ mặt như vậy."
2191 = "Ở giai đoạn kim loại mà ông Minokasa gọi là phôi dao bếp, đáng lẽ ra của tôi và của Paulette không có sự khác biệt lớn nào."
2192 = "Một giọng nói hiền từ."
2193 = "Trà do vợ ông pha, được ông Minokasa mang ra cho chúng tôi."
2194 = "Vừa cười, ông Minokasa vừa lấy con dao của tôi trước, lại cho vào lửa, rồi gõ cộc cộc."
2195 = "Dù giọng nói của ông Minokasa rất điềm tĩnh, nhưng tôi vẫn giật bắn mình."
2212 = "Nếu dù có đập thế nào cũng không làm hỏng hình dạng của con dao, thì việc cứ rụt rè e sợ thế này thật là lãng phí."
2217 = "Có lẽ hoàn cảnh cũng giống với tôi. Nghĩ vậy, giọng đọc của tôi cũng trở nên hứng thú hơn."
2223 = "Đền Akai Aso, Chùa Ma, Hội trường Vật sản Suối nước nóng, Xuôi dòng sông Kuma—— Những kỷ niệm của một ngày trôi qua trở nên sống động qua từng lời kể."
2234 = "Ngay khoảnh khắc tôi đạp lên bàn đạp, chiếc chày thép giáng mạnh xuống chiếc bệ sắt."
2242 = "Nói tóm lại, đây chính là \"câu trả lời của tôi\" sao."
2243 = "『Chắc chắn sẽ là một gợi ý tốt đấy』, Hibiki đã nói vậy và cho tôi mượn nó."
2244 = "Nhạc chuông điện thoại của Paulette khác với bình thường."
2245 = "Còn nhanh hơn cả việc cúp máy, Paulette đã đứng bật dậy."
2246 = "Nghĩ vậy, tôi cũng hùa theo. Dù có vụng về, lóng ngóng, tôi cũng cố ý làm ra vẻ diễn kịch."
2249 = "Niềm vui lúc đó, quả nhiên là bắt nguồn từ sự hưng phấn trí tuệ—— từ sự hứng thú với chính việc xuôi dòng sông."
2252 = "Nó ngày càng dài ra, bị kéo dài ra."
2256 = "Thời niên thiếu thì không biết thế nào, nhưng với tôi bây giờ thì lại đồng cảm với dì Hori hơn."
2257 = "Ánh mắt của Paulette, dù chỉ trong một khoảnh khắc, nhưng chắc chắn đã nhìn những con dao đang được \\x%l焼なまし;#00ffc040;ủ mềm thép%l;#;."
2259 = "Dù chuyển động đúng như tôi tưởng tượng, nhưng tôi vẫn bị bất ngờ bởi sức mạnh vượt xa sự tưởng tượng đó."
2278 = "（Keng! ——Keng——Keng!——）"
2279 = "（Keng! Keng! Keng! Keng!）"
2282 = "（Keng! Keng! Keng! Keng!）"
2283 = "（Keng!）"
2284 = "（Keng! Keng! Keng!）"
2286 = "（Không, mình là đồ ngốc sao—— Chẳng phải mình vừa mới nghĩ \"cũng áp dụng cho cả các mối quan hệ con người\" sao）"
2287 = "（Dù cô ấy nói là đã tìm hiểu về các địa điểm du lịch, nhưng——）"
2290 = "（Paulette sao?）"
2292 = "（\"Muốn biến nó thành điều bổ ích\", muốn tận dụng nó—— Paulette quả thực đã nói như vậy）"
2297 = "（Những gì đền chủ Akai đã nói—— và mục tiêu của Houshou Kisaki, cũng đều giống nhau——）"

[selections]
