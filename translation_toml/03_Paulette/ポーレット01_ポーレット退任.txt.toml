1865 = "「Đúng, nhỉ. Chúng ta có thể đi du lịch rồi.\\nChúng ta của hiện tại——với hệ thống của Đường sắt Ohito hiện tại.」"
1867 = "「Đúng vậy nhỉ. Mỗi ngày đều quá đỗi hạnh phúc...\\nThế nên, nỗi sợ hãi cũng lớn dần theo.」"
1870 = "「Vâng. Sợ người lạ, chỉ bắt nạt người nhà. Nhưng lại rất tò mò.\\nPhạm vi sở thích thì hẹp, nhưng chỉ cần nói về chủ đề đó là nói không ngừng.」"
1871 = "「Đúng vậy đó ạ. Lúc đó thì,\\nnó vẫn chưa được gọi là Mine Treasure đâu ạ.」"
1872 = "「Ừ. Chỗ đó không còn là nơi làm việc của chúng ta nữa rồi.」"
1874 = "「Ừ.」"
1875 = "「Đúng vậy nhỉ. Tàu hỏa... Bây giờ mới là tháng Ba, ừm.\\nCó thể cho con bé trải nghiệm một chuyến du lịch ngắm tuyết.」"
1877 = "「Vậy sao. Khoan, hửm?」"
1878 = "「Vậy sao. Thế thì cô yên tâm rồi.」"
1879 = "「Vậy sao? Thế thì, Cựu Thị trưởng Paulette.」"
1881 = "「Chuyến đi cùng ba. Chuyến đi mùa đông đầu tiên trên tàu giường nằm.\\nEm nghĩ chính chuyến đi đó đã tạo nên——em của ngày hôm nay.」"
1883 = "「Cốt lõi của bản thân sao.」"
1885 = "「Ra là vậy.」"
1887 = "「Vâng. Vậy chúng tôi đi đây! Cựu Thị trưởng.」"
1888 = "「Thời gian trôi qua nhanh thật đấy.\\nHai người nhớ thỉnh thoảng ghé qua Tòa thị chính nhé.」"
1889 = "「Chỗ đó, là sao?」"
1893 = "「Có Reina ở đó. Cả vợ anh Takasaki nữa. Cứ giao cho họ đi.」"
1895 = "「Có Reina đi cùng mà, nha~?」"
1906 = "「Như cái tính sát gái bẩm sinh chẳng hạn.」"
1910 = "「Dạ không đâu ạ, do Reina hơi lơ đãng chút thôi ạ.」"
1911 = "「Không sao đâu... ừm!\\nReina không hề bị hỏng hóc hay tổn hại gì đâu nha.」"
1919 = "「Paulette. Không được.」"
1920 = "「Cháu đã trưởng thành rồi nhỉ, bé Paulette.\\nHôm nào rảnh, cô cháu mình cùng đi uống một ly nhé?」"
1921 = "「Cô mới là người phải cảm ơn cháu, bé Paulette. Cảm ơn cháu đã hoàn thành xuất sắc\\nvai trò được giao trong suốt hai nhiệm kỳ tám năm, và đạt được những thành tựu tuyệt vời.」"
1922 = "「Vất vả cho em rồi. Paulette.」"
1923 = "「Paulette, để tôi cầm cho.」"
1927 = "「Mỏ than!? Mỏ than là Mine Treasure sao!?」"
1930 = "「Reina.」"
1932 = "「Reina cũng đã rất ngoan mà.\\nBó hoa và lời chúc của em, anh rất vui. Cảm ơn em.」"
1934 = "「To tiếng quá!\\nChị Reina ghét ba bế ạ?」"
1935 = "「Chị Reina, có sao không ạ?」"
1938 = "「Reina không ghét đâu nha!\\nĐược bế rất thoải mái, Reina vui lắm ạ.」"
1939 = "「Reina!?」"
1940 = "「Lúc đó, mọi chuyện đã diễn ra đúng như Reina nói.\\nAnh trở thành một người cha.」"
1941 = "「Paulette bây giờ đã là người lớn, và ngay cả lần đầu tiên chúng ta gặp nhau,\\nanh cảm thấy Paulette cũng đã trưởng thành quá mức cần thiết rồi.」"
1942 = "「Về câu trả lời cho câu hỏi lúc đó...\\nĐến bây giờ, anh vẫn không thể đưa ra một đáp án rõ ràng.」"
1943 = "「Câu hỏi lúc đó.」"
1944 = "「Nên tất nhiên, trong đó cũng có sức mạnh của chúng ta nữa!」"
1946 = "「Đúng là... đáng sợ thật.」"
1947 = "「Thật sao? Cảm ơn con.\\nNhờ có Hikari theo dõi nên mẹ mới cố gắng được đấy.」"
1953 = "「Điểm này cũng giống nhau đấy. Được khen là lại ngượng ngùng ngay.」"
1954 = "「Mẹ biết không. Mẹ ngầu lắm đó.」"
1956 = "「Ngoan lắm. Con đã cố gắng rất nhiều.\\nCảm ơn con đã ngoan ngoãn theo dõi mẹ đến tận lúc cuối nhé.」"
1960 = "「Hanyaa」"
1964 = "「Nhà. Về nhà đi.」"
1966 = "「Nếu lúc nào Paulette cũng giúp đỡ,\\ncon bé sẽ trở thành một đứa trẻ không biết cố gắng đâu.」"
1972 = "「Nhắc đến phòng Du lịch, phu nhân của anh đâu rồi?」"
1973 = "「Đúng…… nhỉ.」"
1976 = "「Từ nay về sau, cậu cũng hãy tiếp tục hỗ trợ bé Paulette nhé?」"
1977 = "「Tất nhiên, tôi sẽ dốc toàn lực để đảm đương.\\nNhưng đồng thời, từ nay về sau——mong cô hãy tiếp tục góp sức vì Ohimitera.」"
1978 = "「Cảm ơn em, Reina. Cảm ơn mọi người.\\nCảm ơn con, Hikari.」"
1998 = "「Đó chắc chắn không phải là chuyện xấu.\\nNgược lại, anh thấy đó là một điều rất tốt——」"
1999 = "「Cả tôi nữa sao.」"
2000 = "「Tôi mới là người phải cảm ơn cô!\\nHộp cơm bento lúc đó, thật sự rất ngon!」"
2001 = "「Đang là lễ bãi nhiệm đấy. Nhân vật chính rời đi thì còn ra thể thống gì nữa.」"
2002 = "「Hôm nay là ngày trọng đại của Paulette——của mẹ em đó nha~.\\nNếu bé Hikari tặng hoa, mẹ sẽ vui lắm đó nha~.」"
2003 = "「Đương nhiên rồi ạ. Mẹ con mà lị.」"
2004 = "「Đây là hoa từ mọi người ở Đường sắt Ohito và Hiệp hội Thương gia trong thị trấn,\\nvà hơn ai hết, là từ bé Hikari đó nha~.」"
2005 = "「Tất nhiên rồi ạ. Cháu sẽ dốc toàn lực hỗ trợ cô ấy,\\nvà cũng mong được cô ấy dốc toàn lực hỗ trợ lại.」"
2006 = "「Nhưng mà, vậy à. Hôm nay con bé không chỉ muốn ngủ cùng Reina,\\nmà còn đòi tắm chung với Reina nữa sao.」"
2007 = "「Điều đó cho thấy em đang suy nghĩ rất nghiêm túc.\\nCả Hikari và Paulette đều rất tập trung vào những việc trước mắt.」"
2008 = "「Đó là sức mạnh của tất cả mọi người.\\nKhông chỉ của các nhân viên thành phố, mà là của toàn thể người dân Ohimitera.」"
2009 = "「Đúng là vậy thật. Mọi người đều đối xử rất tốt với Hikari.\\nNhưng... điểm đó giống anh ở chỗ nào chứ?」"
2012 = "「Thật vinh hạnh khi được chị khen ngợi quá lời.\\nĐể Ohimitera ngày càng phát triển hơn nữa, chúng tôi sẽ tiếp tục nỗ lực không ngừng.」"
2016 = "「Là thế này nha. Đó là lúc Reina,\\nlần đầu tiên đi xem mỏ than đó ạ.」"
2017 = "「Lúc đó? Lúc đó là lúc nào thế ạ?」"
2019 = "「Vậy thì tốt rồi——\\nXin lỗi, anh làm em giật mình nhỉ.」"
2020 = "「Vậy, Hikari và anh cũng giống nhau sao?」"
2024 = "「Vậy thì, thử đi du lịch xem sao nhé.」"
2025 = "「Thế thì, chúng ta đi thôi?」"
2027 = "「Vậy, hẹn gặp lại.」"
2029 = "「Vậy thì. Tôi xin phép đi trước nhé?\\nTôi không muốn làm phiền công việc của mọi người.」"
2032 = "「Đó là để an ủi Reina đấy.\\nThấy Reina ỉu xìu, con bé đã rất lo lắng.」"
2033 = "「Một khi đã say mê là không còn để ý xung quanh,\\nnhưng lại cực kỳ nhạy cảm với sắc mặt của người khác.」"
2035 = "「Vậy, còn Paulette thì sao?」"
2036 = "「Vậy thì, Reina sẽ thay mặt bé Hikari,\\nmang hoa tặng cho mẹ nha~.」"
2038 = "「Vậy thì, Reina sẽ bế em lên nha~.\\nBé Hikari chỉ cần ngồi yên thôi, chịu không nha~?」"
2040 = "「Vậy thì mọi người, hôm nay chúng ta cũng cùng nhau cố gắng\\nlàm việc nhé——Mọi người cố gắng lên nhé!」"
2042 = "「Nhờ có Hikari, mẹ mới được làm mẹ!」"
2045 = "「Dù có rất nhiều điều đáng sợ, những điều không hiểu và những điều khó khăn,\\nđôi khi khiến em chỉ muốn hét lên một tiếng 'Oa' rồi bỏ mặc tất cả.」"
2046 = "「Anh nói thì đúng là vậy nhưng mà~」"
2047 = "「Dù là do quy định, nhưng việc cô từ nhiệm, tôi thấy rất tiếc.\\nHy vọng sau này chúng ta lại có cơ hội làm việc cùng nhau.」"
2048 = "「Anh Soutetsu.\\nCảm ơn anh——vì đã cho em được làm mẹ.」"
2049 = "「Anh Soutetsu!?」"
2050 = "「Cô đã vất vả rồi. Cựu Thị trưởng Hinai.」"
2051 = "「Hai nhiệm kỳ, tám năm.\\nCô đã vất vả trong một thời gian dài rồi, cựu Thị trưởng Hinai Paulette.」"
2058 = "「Là cựu Thị trưởng rồi mà, Chủ nhiệm Takasaki.\\nCảm ơn anh vì những chuyện hồi đó nhé.」"
2060 = "「Chị Takasaki! Xin lỗi. Trăm sự nhờ chị chăm sóc Hikari nhé.\\nReina, lại đây nào.」"
2220 = "Ngay khi sự náo nhiệt hoàn toàn tan biến,\\nHikari liền chạy tới ôm chầm lấy mẹ làm nũng."
2222 = "Chiều chuộng và được chiều chuộng.\\nMong muốn của cả hai hoàn toàn khớp nhau, giờ đã hòa làm một."
2227 = "Cả cảm giác hạnh phúc gắn liền với thời điểm hiện tại,\\nlẫn khung cảnh thuộc về ký ức của ngày hôm đó."
2229 = "Đến giới hạn rồi. Cả Paulette, Hikari và Reina.\\nCác nhân viên cũng bắt đầu xì xào bàn tán với vẻ bất an."
2232 = "Chẳng biết có hiểu được mong mỏi của Paulette hay không,\\nmà giọng Reina vẫn vang lên đều đều, thong thả."
2236 = "Niiroku có thể điều khiển KiHa 07S, lại có cả thầy tế Akai.\\nĐội ngũ phụ lái cũng đã được tăng cường."
2247 = "Hikari giật tay khỏi Reina,\\nvà nấp sau lưng bà Takasaki."
2249 = "Một ngày nắng đẹp.\\nĐúng nghĩa đen theo cả hai nghĩa."
2251 = "Nhưng, cho dù ý chí, mong muốn có mạnh mẽ đến đâu——\\nChúng tôi đều biết rằng, vẫn có những thứ nằm ngoài tầm với."
2252 = "Nhưng——biểu hiện ra bên ngoài thì quả thực rất giống nhau."
2253 = "Hay nói đúng hơn, trước đó——\\nLẽ ra tôi phải nhận ra từ sớm hơn."
2256 = "Giá như lúc nãy tôi vứt ngay bó hoa đi,\\nthì đã có thể đỡ được Reina khỏi ngã."
2258 = "Nếu là tôi——ít nhất là tôi trước khi gặp Paulette,\\ncó lẽ sẽ chấp nhận, hoặc là bỏ cuộc——"
2267 = "Hikari xấu hổ, lại trốn ra sau lưng vợ anh Takasaki.\\nNhưng…… dù vậy, tôi vẫn thấy rất vui."
2268 = "Hikari và Reina nhìn nhau cười.\\nCả hai đều đang được bế nên tầm mắt gần như ngang bằng nhau."
2271 = "Trong vòng tay của chúng tôi,\\nHikari và Reina vẫn vui vẻ ríu rít trò chuyện."
2273 = "Hikari ngọ nguậy mạnh trong vòng tay."
2276 = "Giọng nói có vẻ ngại ngùng nhưng vui sướng.\\nCó lẽ Hikari cũng đang cảm thấy tự hào theo cách riêng của mình khi nghe Reina nói vậy."
2278 = "Được khen nên vui sướng.\\nHikari vùi mặt vào mặt Paulette như để giấu đi sự ngượng ngùng."
2280 = "Trốn sau váy vợ anh Takasaki,\\nHikari chỉ biết gật đầu lia lịa."
2281 = "Hikari kéo tay Paulette,\\nmở cửa kính bước vào trong——"
2285 = "Hơn nữa, hôm nay có lẽ là lần đầu tiên,\\nHikari chạy thoát khỏi tay Reina——"
2288 = "Là cậu ấy sao.\\nNgay khi tôi vừa nghĩ vậy, Paulette cũng nở nụ cười tươi rói."
2289 = "『Cách chăm sóc đứa lớn khi có thêm đứa nhỏ』\\nĐó là kiến thức mà nhà chúng tôi cũng cần phải chuẩn bị tâm lý."
2300 = "Nhưng. Tương lai của Hikari thì khác.\\nChúng tôi phải dẫn dắt con bé đi đúng hướng."
2302 = "Dù biết vậy, Paulette vẫn cứ hay ghen tị từng chút một.\\nĐó có lẽ là bản năng của người mẹ, không thể giải thích bằng lý lẽ được."
2304 = "Nhưng cho đến khi buổi lễ bãi nhiệm này kết thúc,\\ntôi vẫn muốn cư xử như một người thư ký."
2305 = "Lại một lần nữa, vô số ánh đèn flash chớp sáng.\\nThật sự rất khéo. Cả hai người. Đây quả là một khung hình hoàn hảo."
2316 = "A, không ổn rồi. Lại làm em ấy giật mình nữa sao.\\nHôm nay cơ thể tôi cứ luôn hành động trước cả suy nghĩ."
2317 = "Nói chính xác hơn là, cả thiện ý lẫn ác ý.\\nNgười khác nghĩ gì về mình, tôi đều không quan tâm."
2319 = "Vì Reina quá đỗi ngoan ngoãn,\\nnên chúng tôi đã ỷ lại vào em ấy mà bỏ qua những điều cần lưu ý."
2321 = "Trong lúc các nhân viên khác vẫn đang do dự tìm thời điểm thích hợp,\\nngười bước lên trước mặt Paulette là cô Miyamoto——"
2323 = "Nghe như một người mẹ ruột đang phê bình chính con gái ruột của mình vậy,\\nlà một người cha ruột, tôi nghe mà thấy hơi xót xa."
2330 = "Không biết là cô ấy đã bị thuyết phục,\\nhay là dù không phục nhưng vì tính chất buổi lễ nên đành phải nhẫn nhịn——"
2333 = "Giọng nói hòa làm một, niềm vui sướng khiến ký ức càng thêm sống động."
2334 = "Chị ấy rất giỏi dỗ trẻ con, và Hikari cũng khá quấn quýt với chị ấy."
2336 = "Paulette vội vàng lấy tay bịt miệng."
2339 = "Nếu lúc nào cũng được bao bọc trong đó,\\nthì sẽ không thể hiểu được sự quý giá của không khí cũng như tình yêu thương."
2341 = "Cô ấy đang khen ngợi Paulette, người đã kế nhiệm người cha quá cố,\\nhoàn thành xuất sắc chức vụ Thị trưởng mà bản thân vốn không hề mong muốn hay phù hợp."
2342 = "Trưởng phòng Tổng vụ, người đã gánh vác các công việc thực tế của thành phố Ohimitera\\ntừ thời cha của Paulette, cựu Thị trưởng tiền nhiệm Hinai Kouzou."
2344 = "Một khuôn mặt người mẹ vô cùng rạng rỡ.\\nNếu tôi xen vào thì quả là vô duyên hết sức."
2346 = "Với đôi mắt long lanh hòa tan trong nụ cười,\\nem ấy nhìn tôi, rồi nhìn sang Paulette."
2347 = "Không tệ chút nào.\\nDù có chút gì đó cô đơn đi chăng nữa."
2350 = "Mùi hương ngọt ngào quen thuộc của Paulette,\\nhòa quyện cùng mùi xà phòng giản dị, mộc mạc."
2351 = "Cô ấy trả lời ngay lập tức. Rất thuyết phục. Thuyết phục hoàn toàn.\\nĐồng thời, tôi cũng cảm thấy nể phục Paulette."
2354 = "Nếu không phải mỗi người đang bế Hikari và Reina,\\nchắc chắn chúng tôi đã nắm tay nhau rồi."
2371 = "Cô Miyamoto vừa lùi sang một bên,\\nmột người ôm bó hoa tiến lên——à,"
2372 = "Cô Miyamoto nắm lấy tay phải của Paulette.\\nRồi nhẹ nhàng đặt bàn tay trái lên trên cái bắt tay ấy."
2373 = "Cô Miyamoto khẽ thở ra một hơi ấm áp và nhắm mắt lại.\\nKhông biết sau đôi mi ấy, cô đang hồi tưởng lại điều gì?"
2376 = "Ra vậy, cô Miyamoto cũng nghỉ hưu sao."
2380 = "Trong lúc chúng tôi trao đổi những lời thì thầm hạnh phúc nhỏ bé,\\nKisaki đã rảo bước đến gần."
2382 = "Một lời nói rất đỗi ngây ngô thốt ra từ Reina,\\nchính là bước ngoặt lớn nối liền đường ray đưa chúng tôi đến hiện tại."
2384 = "Cảnh tượng đó,\\ndù chỉ đứng nhìn từ bên ngoài nhưng cũng khiến tôi khá sốc..."
2386 = "\"Thiên hướng\" và \"vai trò được giao\".\\nTôi hiểu rất rõ hàm ý sâu xa trong lời nói của cô Miyamoto."
2389 = "Hikari thậm chí còn buông tay khỏi ống quần Reina, thứ mà bình thường con bé quyết không buông,\\nđể trốn vào trong góc khuất——sau lưng vợ anh Takasaki."
2395 = "Nhận lấy những bó hoa, Paulette cúi đầu thật sâu.\\nTôi cũng cúi đầu theo."
2402 = "Hoàn thành những gì được yêu cầu.\\nTôi từng đinh ninh đó là tất cả sự kết nối với người khác."
2403 = "Tôi không nghĩ điều đó là lành mạnh... Tôi muốn Hikari\\nđược hạnh phúc một cách bình thường——và giản dị hơn."
2406 = "Và rồi, tôi nhận ra.\\nTrở thành một gia đình, cũng có nghĩa là làm cho gia đình ngày một đông vui hơn."
2411 = "Cùng nhớ về một chuyện, vào cùng một thời điểm——\\nĐó là minh chứng cho việc chúng tôi đã luôn trân trọng từng khoảnh khắc bên nhau."
2412 = "Tiếng vỗ tay nồng nhiệt vang lên bao quanh chúng tôi."
2413 = "Sợ xà phòng bình thường có thể quá mạnh với Hikari——\\nnên chúng tôi dùng sữa tắm trẻ em 100% nguyên liệu quốc nội."
2414 = "Nhà báo quen thuộc——anh Ichikawa bắt đầu đuổi theo Kisaki,\\nnhững phóng viên khác cũng bắt đầu tản ra, người thì đi theo, người thì có vẻ quay về tòa soạn."
2416 = "Đội ngũ báo chí——sơ sơ cũng hơn ba mươi người. Thật náo nhiệt.\\nTôi cảm thấy vui mừng vì đây cũng là một sự công nhận đối với những thành tựu của Paulette."
2422 = "Chúng tôi trở lại làm ba người và bước đi.\\nHoàn thành nhiệm vụ để còn về đón Hikari."
2423 = "Lại trùng khớp với nhau.\\nTôi không nghĩ đó là sự tình cờ."
2424 = "Chỉ khi mất đi mới hiểu được giá trị của nó——\\nNhưng tất nhiên, tôi không muốn Hikari phải rơi vào hoàn cảnh đó."
2427 = "Tôi có lẽ là một kẻ đã dành một khoảng thời gian dài bất thường\\nđể sống như một đứa trẻ."
2429 = "Tôi ôm chặt lại những bó hoa vừa nhận,\\nvà bắt tay với họ."
2432 = "Tôi muốn bảo vệ, và sẽ làm mọi thứ để bảo vệ gia đình này. Tôi đã có giác ngộ đó."
2434 = "Mẹ và con gái là như vậy đấy.\\nDù biết rõ, nhưng tôi vẫn không khỏi cảm thấy có chút xa cách."
2436 = "Chẳng cần phải nghĩ ngợi nhiều.\\nĐó chính là những ưu điểm của Paulette hiện tại."
2437 = "Tôi không thể nào san sẻ quá khứ của Paulette.\\nChỉ có thể ở bên cạnh khi cô ấy nhớ về nó, đó là tất cả những gì tôi có thể làm."
2438 = "Muốn nhanh chóng về nhà, để được Paulette cưng chiều.\\nCảm giác ấy, dường như truyền đến tận chỗ tôi."
2441 = "Biết rằng chỉ dùng lời nói sẽ không cản được cô ấy, nên tôi đã nắm lấy tay Paulette,\\nnhưng cô ấy vẫn cố giãy giụa để vùng ra."
2442 = "Một tiếng thở dài rất khẽ của Reina.\\nHay nói đúng hơn là."
2443 = "Tôi loáng thoáng nghe thấy những từ ngữ hoài niệm,\\nnhư \\x%lグランビー鉱車;#00ffc040;toa chở quặng Granby%l;#; thế này thế nọ."
2445 = "Tôi chỉ biết thầm nghĩ, làm mẹ thật tuyệt vời.\\nTôi không thể nào thấu hiểu tâm tư của Hikari đến mức đó."
2447 = "Tôi vừa dứt lời,\\nPaulette liền quằn quại ngượng ngùng."
2450 = "Chỉ cần nói vậy, Paulette đã hiểu.\\nCô ấy im lặng, trầm ngâm suy nghĩ điều gì đó——"
2451 = "Thế nên, chẳng cần thêm lời thừa thãi nào nữa.\\nChuyện tôi có 『muốn làm một người cha hay không』——"
2455 = "Hai người lại mỉm cười với nhau một lần nữa——"
2456 = "Tiếng bước chân lạch cạch chạy lên cầu thang.\\nTôi còn nghe thấy tiếng cười đùa của con bé với Hibiki."
2460 = "Chỉ cần đưa ra câu trả lời hiện tại\\ncho câu hỏi mà cả hai cùng đang nhớ đến là được."
2464 = "Đúng vậy. Từ lúc sinh ra cho đến nay,\\ncon bé luôn được bảo bọc trong tình yêu thương và sự quan tâm vô bờ bến——"
2477 = "Ngay cả khi không tắm cùng Hikari,\\nPaulette vẫn dùng nó, điều này làm tôi hơi ngạc nhiên."
2478 = "Khuôn mặt của Reina, khuôn mặt của một Reina luôn tươi cười ấy, bỗng cứng đờ.\\nViệc này——chắc chắn là một cú sốc lớn đối với em ấy."
2504 = "Bắt tay, bắt tay, bắt tay, bắt tay.\\nNhững bó hoa ôm trên tay trái cô ấy sắp tuột xuống——ái chà."
2505 = "Paulette vừa đặt Hikari xuống đất,\\ncon bé đã tỏ vẻ muốn chạy tót đi ngay."
2506 = "Paulette vẫn luôn trân trọng Reina như trước,\\nthậm chí còn dựa dẫm vào cô bé nhiều hơn, nhưng..."
2507 = "Paulette cũng hiểu điều đó.\\nCô ấy đáp lại tôi với vẻ ra dáng Thị trưởng hơn hẳn bình thường."
2508 = "Ôm những bó hoa vừa nhận được trên tay,\\nPaulette đảo mắt nhìn quanh một vòng lớn."
2509 = "Chắc hẳn Paulette đã biết trước điều này.\\nCô ấy không hề tỏ ra ngạc nhiên, chỉ lặng lẽ chìa tay phải ra."
2511 = "Paulette khẽ cười khúc khích."
2512 = "Paulette bế Hikari lên.\\nBế lên thật dịu dàng, rồi lại cọ má vào con bé."
2513 = "Paulette gật đầu thật sâu."
2514 = "Giọng nói nũng nịu.\\nCô ấy nhích lại gần, dựa sát vào tôi."
2515 = "Paulette liên tục cọ má vào cái đầu nhỏ\\nđang vùi sâu vào ngực mình."
2516 = "Paulette cũng đáp lại một cách xuất sắc.\\nHai người trao nhau nụ cười dịu dàng. Ánh đèn flash máy ảnh nhấp nháy liên tục."
2517 = "Nhiệm kỳ của Paulette đã kết thúc,\\nvà trên giấy tờ, vai trò thư ký riêng của tôi cũng đã chấm dứt."
2518 = "Biểu cảm của Paulette cũng trong xanh như bầu trời.\\nTỏa sáng rực rỡ và chói lọi hơn cả mái tóc vàng của cô ấy."
2519 = "——Paulette nở nụ cười rạng rỡ đón nhận điều đó,\\nrồi ôm chặt lấy Hikari."
2520 = "Cô ấy cắn chặt môi.\\nHai tay cũng nắm chặt lại."
2521 = "Như để nhấm nháp từng lời nói của chính mình.\\nPaulette mím môi lại một lúc."
2522 = "Paulette bật dậy khỏi giường.\\nTôi định bảo để mai hãy làm, nhưng lại nuốt vội lời định nói vào trong."
2523 = "Vừa nghe xong, Paulette đã ôm đầu tiếc nuối.\\nTuy lỡ quên thì cũng tội nghiệp thật, nhưng——"
2539 = "Reina lạch bạch chạy tới.\\nVới nụ cười không hề thay đổi so với mọi ngày, em ấy ôm một bó hoa rất lớn."
2540 = "Có vẻ Reina không tự nhận ra,\\nnhưng Paulette thì hiểu ý tôi."
2543 = "Reina cười tươi rạng rỡ, khuôn mặt dãn ra."
2545 = "Vì Reina lúc nào cũng tươi cười,\\nnên từ trước đến nay tôi không hề để ý, nhưng——"
2547 = "Giọng nói mềm mại, êm ái.\\nPaulette cũng khẽ bật cười ufufu."
2548 = "Bây giờ Hibiki đã là Lái tàu chính thức,\\ncòn Nagi thì vừa là Lái tàu vừa là Nhân viên cơ vụ chính thức."
2549 = "Có lẽ Hikari hoàn toàn không biết cách tự bảo vệ mình.——Không,\\ncon bé hoàn toàn không hiểu ý nghĩa thực sự của việc 'kết nối với người khác'."
2554 = "Chàng trai trẻ tuổi ngày nào giờ đã bộc lộ tài năng,\\ntrở thành nhân vật nòng cốt của nhóm tình nguyện viên, và hiện tại đã là một Chủ nhiệm chững chạc."
2555 = "「Tất nhiên, Reina rất được Hikari quý mến.\\nChị Reina lúc nào cũng hiền lành và cười tủm tỉm.」"
2557 = "「Cho đến khi Hikari ra đời,\\nnhững cảnh tượng thế này vẫn luôn là của Paulette và Reina.」"
2558 = "Paulette và Reina.\\nHai người họ cũng nhớ lại chuyện đó sao."
2559 = "Có lẽ cô ấy không thích không khí trở nên u sầu.\\nThấy Paulette nói đùa, cậu Takasaki cũng cười đáp lại."
2561 = "Thấy cậu Takasaki có vẻ lưu luyến,\\nPaulette tiễn cậu ấy bằng một giọng nói vui vẻ."
2565 = "Đường hoàng và uy nghiêm.\\nĐáng tin cậy——đó là từ hiện lên trong đầu tôi."
2575 = "Vẫy tay nhẹ một cái, Kisaki dứt khoát đi về phía tòa thị chính."
2577 = "Một giọng nói quen thuộc.\\nGiọng nói nũng nịu, như sắp khóc đến nơi."
2582 = "Nói sao nhỉ——\\nCảnh tượng này——"
2583 = "Tình yêu thương mà con bé luôn coi là hiển nhiên,\\nđến một lúc nào đó, có thể sẽ mất đi."
2586 = "Lúc nhận ra thì tay tôi đã tự động đưa ra, xoa đầu Reina."
2587 = "Nói chung, Paulette đã lùi lại,\\nvà tôi cũng buông tay cô ấy ra."
2591 = "Hơn thế nữa, chúng tôi còn được ban cho Hikari.\\nChúng tôi đã trở thành một gia đình."
2604 = "Ánh mắt thẳng thắn, lời nói ngây thơ\\nphát ra từ Hikari——"
2605 = "Lời nói của Kisaki như một tín hiệu,\\ntừ khắp nơi trong hàng ngũ nhân viên, những bó hoa bắt đầu xuất hiện."
2606 = "Ra là vậy, tôi nghĩ mình đã hiểu.\\nTôi là do tuyệt vọng, còn Hikari là do môi trường xung quanh, căn nguyên hoàn toàn khác nhau."
2609 = "——Hibiki, chị Mayami, Hachiroku, Nagi, Fukami, Kisaki.\\nHikari chỉ vui vẻ chịu ở lại khi được những người này trông nom."
2621 = "Nếu những người mà con bé tin tưởng sẽ vô điều kiện yêu thương mình,\\nlại xa lánh... hay đối xử tệ bạc với con bé."
2624 = "Trên giường, Paulette áp sát cơ thể vào tôi."
2627 = "Giữa đám đông như thế này mà con bé không khóc cũng không chạy trốn, vẫn nhìn về phía chúng tôi.\\nDù chỉ một chút thôi, nhưng Hikari thực sự đang trưởng thành."
2636 = "Lời đáp trả đầy tự tin.\\nCô Miyamoto đón nhận nó và nở một nụ cười rạng rỡ."
2637 = "Kisaki dứt khoát chìa tay phải ra.\\nPaulette cũng mỉm cười đón lấy. Một cái bắt tay thật chặt."
2642 = "Chắc là trong vô thức.\\nPaulette dịu dàng cọ má, khiến Hikari ngạc nhiên kêu lên."
2649 = "Nụ cười đó như một ám hiệu,\\nhai người buông tay nhau ra."
2655 = "Hikari bây giờ——dù tôi không hề muốn tưởng tượng——\\nNếu như con bé mất đi chúng tôi, hay là Reina."
2656 = "Với Paulette thì có lẽ chỉ là đang nhìn lại bản thân mình,\\nnhưng quả thực có quá nhiều điểm tương đồng với Hikari."
2662 = "Trước khi kế hoạch Mine Treasure được khởi xướng,\\ncậu Takasaki là người đầu tiên giơ tay ủng hộ."
2664 = "Vợ anh Takasaki, người nên duyên vợ chồng với anh thông qua hoạt động tình nguyện, cũng là một người mẹ có con ba tuổi."
2669 = "（Bíiing boooong）"
2670 = "（Phịch）"
2672 = "（Đến cả tôi còn cảm thấy xa cách và cô đơn.\\nVới một cô bé thích làm nũng như Reina thì——càng khỏi phải nói.）"
2676 = "（Trong buổi hội thảo,\\ntôi đã nghe qua loa vì nghĩ đó là chuyện nhà người ta...）"

[selections]
