1751 = "「Chuyện về Ohito, chuyện về văn hóa.\\nNếu không phải là người luôn quan tâm đến những điều đó thì sẽ không thể nói ra được những lời như vậy.」"
1753 = "「Giả sử các cháu có thể làm ra hộp cơm nhà ga bán chạy nhất Hinomoto,\\nthì tất cả những hội chợ đó sẽ trở thành nơi quảng bá cho Ohito.」"
1755 = "「Trong đống sách của ông Taito——\\nVậy thì có lẽ vẫn còn.」"
1756 = "「Nếu là KiHa 07S thì tất nhiên,\\nvề cơ bản một mình Reina cũng có thể vận hành được ạ.」"
