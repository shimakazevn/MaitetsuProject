1614 = "「Lúc đó... thiết bị đường sắt hay đường ray——\\ncó ai để ý thấy còn sót lại thứ gì không?」"
1615 = "「Các cháu có biết, những con ngựa Kiji này\\ncũng được lưu truyền ở nhiều nơi trên Kyushu không?」"
1617 = "「『Nhờ cháu mà tôi đã nhận ra được một điều tuyệt vời』——\\nCứ hiểu như vậy là được.」"
