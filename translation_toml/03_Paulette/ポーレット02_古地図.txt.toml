1761 = "「Nếu những thứ liên quan đến thợ tiện gỗ vẫn còn ở nhà Migita,\\nthì chắc chắn sẽ giúp ích được gì đó.」"
1763 = "「Nếu vẫn còn nguyên vẹn——\\nThế nào, anh nghĩ ý tưởng này khá thú vị đấy chứ.」"
1768 = "「Nếu là tàn tích mỏ than, thì đợt dã ngoại của trường em có đi rồi nha!」"
1769 = "「Tố chất học giả gì chứ... Không có gì to tát đâu ạ.\\nNhững thứ mình thích——muốn tìm hiểu thêm về nó là chuyện bình thường mà.」"
1771 = "「Câu trả lời rất hay. Nếu tra từ điển,\\nchắc chắn sẽ có những dòng giải thích tương tự như vậy.」"
1776 = "「Đề cử đền Akai Aso làm Tài sản Văn hóa...」"
1777 = "「Sự chung thủy, và sự kiên định,\\ncó lẽ là điều quan trọng để làm nên một việc gì đó.」"
1778 = "「Đúng không ạ?」"
1780 = "「Em cũng có đi. Đợt dã ngoại hồi Tiểu học.\\nNhưng mà, cũng đâu đến nỗi bẩn lắm đâu ạ?」"
1782 = "「Trăm sự nhờ cô.\\nÀ——phải rồi.」"
1784 = "「Là tín ngưỡng tôn thờ bản thân ngọn núi, và thiên nhiên gắn liền với ngọn núi đó như một vị thần.」"
1785 = "「Kể cả những ngày không có phiên họp hội đồng, KiHa 07 vẫn phải chạy mà.」"
1787 = "「Nhà ga biến mất, chỉ còn lại cơm hộp nhà ga tồn tại sao.」"
1792 = "「Tín ngưỡng thờ núi?」"
1798 = "「Theo nghĩa rộng thì đúng là vậy. Nhưng đối tượng tín ngưỡng của tín ngưỡng thờ núi\\nchỉ chuyên biệt vào núi và thiên nhiên gắn liền với nó thôi.」"
1801 = "「Từ đâu?」"
1808 = "「Sao vậy ạ? Anh Soutetsu.」"
1809 = "「Cái gì vậy?」"
1812 = "「Rất nhiều 'xe gì gì đó' mà chúng ta vừa xem,\\nlà những thứ nằm rải rác trên khắp Hinomoto đúng không ạ?」"
1813 = "「Tôi cảm thấy như vừa được khai sáng vậy.」"
1816 = "「Nếu cháu nói sai thì xấu hổ lắm nhưng mà——\\nCái đó, ngựa do thợ tiện gỗ làm ra, nên mới gọi là ngựa Kiji (gỗ) phải không ạ?」"
1818 = "「Cháu cũng vậy...\\nCháu đã từng được xem qua đống tài liệu đó rồi mà.」"
1819 = "「Em cũng vậy ạ.」"
1820 = "「Em cũng không để ý thấy dấu vết đường ray hay gì đâu.\\nChỉ thấy thị trấn đó, tuyệt thật. Đó là ấn tượng sâu sắc nhất của em.」"
1825 = "「Tài liệu có ngày hôm nay, ngày mai có thể sẽ bị thiêu rụi.\\n——Ghi chép và điều tra lịch sử, văn hóa là một cuộc chạy đua với thời gian mà.」"
1826 = "「Bọn cháu đang muốn làm một hộp cơm nhà ga mang đậm chất Ohito. Vì vậy,\\nbọn cháu đến đây để thỉnh giáo thầy về ngựa Kiji ạ.」"
1827 = "「Từ phu nhân Nagayama——\\nvợ của trụ trì chùa Eizan ạ.」"
1829 = "「Cháu có nghe nói ở Fukuoka cũng có ạ.」"
1831 = "「Em, chỉ đơn giản là thích đường sắt, thích đi du lịch bằng tàu hỏa.\\nCũng thích Hinomoto nữa, và muốn biết nhiều hơn, nhiều hơn nữa.」"
1832 = "「Vừa ngồi trên SL đang chạy, vừa thưởng thức hộp cơm nhà ga ngon nhất Hinomoto.\\nCháu chỉ nghĩ đơn giản là nếu làm được như vậy, nó sẽ trở thành một tài nguyên du lịch.」"
1835 = "「Em, là em gái của anh.\\nĐược chứ? Anh hai. Em gái. Là em gái đó?」"
