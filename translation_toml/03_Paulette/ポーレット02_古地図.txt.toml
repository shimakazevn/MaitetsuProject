1579 = "「Nhưng... dù vậy em vẫn thấy hơi. Vui vui. Chăng?」"
1580 = "「Nhưng nếu vậy thì nó phải thành Kijiguruma chứ...\\nNhững chiếc xe khác cũng do thợ tiện gỗ làm ra mà đúng không ạ?」"
