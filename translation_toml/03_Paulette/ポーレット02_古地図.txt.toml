1840 = "「Anh có một chuyện muốn hỏi em.」"
1842 = "「Người như anh thì rất dễ dàng thay đổi ý kiến.\\nSự cố chấp mà Paulette nói, đối với anh có chút chói lóa đấy.」"
1843 = "「Cháu nghe nói ở Đế đô,\\ncó rất nhiều hội chợ cơm hộp nhà ga được tổ chức.」"
1844 = "「Giá trị văn hóa của nó cực kỳ cao đấy ạ.」"
1845 = "「Em thấy hay lắm ạ! Nếu khai thác được chút than nào,\\nthì cũng đỡ đần được phần nào bữa ăn cho Hachiroku nữa.」"
1849 = "「Thế nên, em cũng tự nhiên nảy sinh hứng thú\\nvới sự kết nối giữa vùng đất này và vùng đất khác thôi ạ.」"
1852 = "「Được công nhận là tài sản văn hóa!」"
1856 = "「Gần đó không có, nhưng ở sâu bên trong thì sao?\\nĐường ray đến tận Mỏ than Jussen, chẳng lẽ không còn sót lại chút nào sao?」"
1858 = "「Nếu quy mô đến mức có nhiều khu nhà ở,\\nthì sản lượng của Mỏ than Jussen chắc phải cao lắm nhỉ?」"
1860 = "「Nếu vậy thì——A không, trước đó đã.」"
1861 = "「Nếu khổ đường ray giống nhau,\\nthì có thể chạy thẳng vào tuyến đó được đúng không?」"
1868 = "「Khóa huấn luyện phụ lái của Hibiki cũng đã bắt đầu rồi.\\nĐể xem nào——khoảng ba... à không.」"
1871 = "「Hibiki. Còn chuyện thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; nữa.\\nNếu em cảm thấy không thoải mái thì...」"
1874 = "「Cùng một cấu trúc như nhau, tại sao chỉ có ngựa Kiji,\\nlại được gọi là ngựa, chứ không phải xe ạ?」"
1876 = "「Chị Paulette và anh hai——\\nrõ ràng là rất bận rộn mà.」"
1878 = "「Đúng vậy.」"
1880 = "「Đúng vậy. Yamabushi là những tín đồ thực hành tu luyện trong núi——\\nvới mục đích hòa làm một với ngọn núi và đạt được giác ngộ.」"
1881 = "「Chắc vậy. Trăm nghe không bằng một thấy mà.」"
1883 = "「Thật sự luôn.」"
1885 = "「Đúng vậy! Cứ như thị trấn bị khu rừng nuốt chửng ấy——\\nAnh hai, lát nữa em cho xem sổ phác thảo nha!」"
1887 = "「Vâng, đúng vậy nhỉ!」"
1888 = "「Vậy sao? Nhưng mà——」"
1890 = "「Là từ rất lâu trước Đại bãi bỏ sao.\\nA——Các tuyến đường sắt đã từng bao phủ khắp Kyushu nhỉ.」"
1892 = "「Đúng vậy. Những chiếc mặt nạ được tạo ra như vậy,\\nnghe nói được dùng làm đối tượng để cầu nguyện, hoặc trong các điệu múa, hoặc trong các nghi lễ ma thuật.」"
1893 = "「Vâng ạ. Thích quá đi nha.\\nReina, cũng muốn thử chạy ở đó một lần ạ.」"
1895 = "「Vâng.」"
1896 = "「Vâng! Nếu đường ray vẫn còn nguyên vẹn,\\nthì chỉ cần nối với nó và bảo dưỡng lại \\x%lポイント;#00ffc040;công tắc%l;#; là được ạ.」"
1900 = "「Vâng, ông ấy rất yêu Ohito và đường sắt.\\nÔng ấy đã làm mọi cách để vực dậy hai thứ đó.」"
1902 = "「Vâng, em nghĩ khả năng cao là vậy ạ.」"
1910 = "「Đến mức đó sao.」"
1911 = "「Với chừng này tài liệu, chắc chắn,\\nhọ sẽ bắt tay vào điều tra một cách nghiêm túc thôi!」"
1924 = "「Văn hóa thợ tiện gỗ và——\\nOhito, đền Akai Aso với tư cách là nơi tập trung của văn hóa đó.」"
1926 = "「Thợ tiện gỗ, vừa là những người làm nghề liên quan đến rừng núi,\\nvừa là những chức sắc tôn giáo trong tín ngưỡng thờ núi.」"
1928 = "「Thợ tiện gỗ? ——Là sao ạ?」"
1935 = "「Vì vậy, ở vùng đất Ohito này,\\nmới còn lưu giữ nhiều ngựa Kiji cổ đến vậy sao?」"
1936 = "「Ví dụ như, biến nó thành một mỏ than cho phép du khách trải nghiệm khai thác,\\nđể làm một trong những điểm nhấn chấn hưng du lịch thì sao?」"
1945 = "「Cho ông Taito ạ?」"
1946 = "「Không có nhưng nhị gì hết, anh hai.」"
1947 = "「Là những người thợ mộc du mục——phải không ạ?\\nĐể tìm được gỗ tốt, họ không định cư mà đi từ khu rừng này sang khu rừng khác.」"
1948 = "「Đúng vậy ạ.」"
1957 = "「Paulette...」"
1958 = "「Paulette.\\nChúng ta vừa được nghe một câu chuyện tuyệt vời đấy.」"
1959 = "「Paulette.」"
1960 = "「Cả chị Paulette nữa ạ?」"
1961 = "「Paulette, em thấy sao?」"
1963 = "「Thị trấn ma, xe goòng, và cả bản thân khu mỏ sao.」"
1967 = "「Cố tình để lại——Nghĩa là, những người thợ tiện gỗ\\nđã truyền bá ngựa Kiji đến những nơi họ đặt chân tới sao?」"
1972 = "「Reina, vừa tìm thấy một thứ thú vị lắm nha.」"
1973 = "「Reina, rất hoan nghênh nha.」"
1976 = "「Reina? Có chuyện gì thế?」"
1982 = "「Bọn con trai ồn ào lắm nha.\\nCứ nói gì mà xe goòng thế này thế nọ ấy.」"
1983 = "「Vâng. Về việc đề cử Tài sản văn hóa.\\nTôi rất mong cô sẽ giúp đỡ.」"
1984 = "「Không cố chấp, nếu chắc chắn mình sai thì sẽ dừng lại ngay.\\nDù có đau đớn đến đâu, cũng không để nó hóa thành thù hận.」"
1986 = "「Quả thực, cái đó nghe có vẻ thú vị đấy.」"
1988 = "「Đây là những món đồ thủ công mỹ nghệ từ khắp nơi trên Hinomoto, được cho là có nguồn gốc từ thợ tiện gỗ.\\nNgày xưa, chắc hẳn chúng là đồ chơi dành cho trẻ em.」"
1989 = "「Paulette có tố chất của một học giả nhỉ.\\nThích đào sâu tìm hiểu những điều mình quan tâm.」"
1991 = "「Đã nhìn thấy anh hai vui vẻ đến thế rồi.\\nThì em gái——chỉ còn cách ủng hộ thôi!」"
1995 = "「Chị Mayami cũng đi dã ngoại ở đó ạ?」"
2005 = "「Đường sắt mỏ...」"
2006 = "「Đường sắt mỏ, cũng chở cả các bác thợ mỏ nữa đó ạ!」"
2007 = "「Đường sắt mỏ,\\ncó khổ đường ray khác với đường sắt thông thường không?」"
2008 = "「Chất than đá từ xe goòng sang \\x%l貨車;#00ffc040;toa chở hàng%l;#;.\\nRồi KiHa 07 chở các bác thợ mỏ sẽ kéo đi ạ.」"
2010 = "「Xe goòng——\\nRa vậy, mỏ than thì phải có xe goòng chứ.」"
2012 = "「Khai sáng ạ?」"
2022 = "「Trong một thời gian ngắn như vậy, mà có thể nghĩ ra ngần này phương án.」"
2025 = "「Thôi thì, đi xem thử cũng chẳng mất gì đâu.」"
2027 = "「Hơn hết thảy, thời buổi này mà còn được đi tàu hỏa đến tận mỏ than\\n——A, sao nhỉ? Liệu những người không hứng thú với đường sắt có thấy thú vị không??」"
2029 = "「Mặt khác, những người thợ tiện gỗ lại thể hiện tín ngưỡng của mình bằng cách tạo ra vật ký thác——\\ntức là những chiếc 'mặt nạ' để rước thiên nhiên như núi non, rừng rậm giáng trần.」"
2030 = "「Nghe thầy nói cháu mới nhận ra, đống sách đó——chính là một núi manh mối.\\nCháu cảm thấy hơi xấu hổ vì đã không nhận ra điều đó sớm hơn.」"
2032 = "「Việc có thể đưa ra đề tài đó vào đúng thời điểm như vậy,\\ncũng là một loại năng lực đấy.」"
2033 = "「Cho phép cháu tiến hành đề cử đền\\nlàm Tài sản văn hóa vật thể được không ạ?」"
2036 = "「Dù Đại bãi bỏ các tuyến đường sắt đã diễn ra, số lượng nhà ga giảm mạnh,\\nnhưng cơm hộp nhà ga vẫn luôn được mọi người yêu thích.」"
2037 = "「Anh thì thấy có vẻ thú vị đấy...」"
2048 = "「Ga Jussendo——\\nRa vậy, thời điểm này nó vẫn chưa bị bãi bỏ.」"
2052 = "「Quanh Mỏ than Jussen, người ta xây nhiều khu nhà ở lắm.\\nChắc hẳn ngày xưa sầm uất lắm nhỉ.」"
2053 = "「Thị trấn?」"
2056 = "「Nếu là người theo tín ngưỡng thờ núi, thì Yamabushi là nổi tiếng nhất.\\nEm đã từng thấy trên phim ảnh chưa? Những người mặc đồ trắng, cầm vỏ ốc xà cừ ấy.」"
2057 = "「Nếu là tài liệu cũ,\\nthì có một số thứ tôi đã nhượng lại cho ông Taito đấy.」"
2058 = "「Xa thì đúng là xa thật. Cũng một phần do hồi đó em học Tiểu học——\\nHai, à không, khoảng ba tiếng đồng hồ? Mới đi đến lối vào.」"
2061 = "「Cháu cảm ơn thầy!\\nNgay ngày mai, cháu sẽ sắp xếp để người phụ trách từ Ban Tài sản Văn hóa đến đây ạ.」"
2073 = "「Chuyện của đền Akai Aso, về cơ bản,\\nthầy tế và người phụ trách của tòa thị chính sẽ tiếp tục tiến hành.」"
2078 = "「Chạy sao——Thế nào? Có làm được không?\\nVí dụ như, chạy thực tế bằng KiHa 07.」"
2096 = "「Chắc chắn là đường sắt mỏ đấy ạ.」"
2097 = "「Cảm giác như vừa được khai sáng vậy.」\\n「Cảm giác như vừa được khai sáng vậy.」"
2098 = "「Chính tôi là người đưa ra ý kiến này mà.\\nLàm gì có chuyện tôi phản đối chứ.」"
2099 = "「Chuyện đó... em cũng không rõ nữa.」"
2100 = "「Không đâu, không có vùng đất nào\\nlưu giữ được nhiều ngựa Kiji cổ xưa như Ohito cả.」"
2101 = "「Đó chỉ là một giả thuyết. Một giả thuyết khác biệt. Nhưng——」"
2102 = "「Dạ không, cháu không biết ạ.」"
2103 = "「Đường sắt tư nhân——sao? Cái này.」"
2104 = "「Có lẽ là từ thời \\x%l大詔;#00ffc040;Đại Chiếu%l;#; nhỉ?\\nTuyến Teitetsu Yui này, anh xem, ở đây.」"
2105 = "「Vậy ạ, cảm ơn chị.\\nNhững chuyện chị kể, rất có giá trị tham khảo.」"
2106 = "「Đúng vậy,\\nnó có vẻ sẽ trở thành một tài nguyên du lịch rất tiềm năng đấy.」"
2107 = "「Chuyện đó, không thành vấn đề đâu ạ.\\nChẳng phải có thể dễ dàng giải quyết sao.」"
2108 = "「Cái này... đường kẻ này ạ.」"
2112 = "「Còn một giả thuyết thú vị khác nữa. Ngựa Kiji,\\nchính là dấu vết mà những người thợ tiện gỗ cố tình để lại.」"
2113 = "「Tiếp theo, là giả thuyết cho rằng ngựa Kiji vốn chỉ là Umaguruma (xe ngựa).\\nNhưng vì trông nó cũng giống chim trĩ (Kiji), nên từ Kijiumaguruma được gọi tắt thành Kijiuma.」"
2122 = "「Dạ... đánh giá của mọi người, không được tốt lắm, ạ.\\nHọ bảo chèo thuyền trên sông Kuma còn đỡ hơn, ạ.」"
2123 = "「Chiếc mặt quỷ đó, nghe nói là do những người thợ tiện gỗ dâng lên.\\nNgôi đền này, có lẽ từng là ngôi đền của những người thợ tiện gỗ.」"
2124 = "「Cái đó thì, tiếp theo, là cái này nha.」"
2125 = "「À, thưa thầy. Cháu xin phép hỏi một câu hơi đường đột——\\nỪm... Thầy có tài liệu nào liên quan đến vấn đề này không ạ?」"
2126 = "「Dạ, chị Paulette ơi, cho Reina hỏi một chút được không ạ?」"
2128 = "「Nếu vậy thì cũng dễ hiểu thôi.\\nMối duyên nợ giữa ngôi đền này và những người thợ tiện gỗ không được nhiều người biết đến mà.」"
2131 = "「Chuyện đó, cứ bàn bạc thử xem sao.\\nÝ kiến của Hibiki, Fukami hay chị Mayami chắc sẽ có ích đấy.」"
2133 = "「Vậy thì, chúng ta kiểm tra lịch trình thôi.\\nEm nghĩ nên họp bàn càng sớm càng tốt.」"
2134 = "「Vậy, chị Mayami có thấy thiết bị liên quan đến đường sắt không ạ?」"
2135 = "「Thế thì còn gì bằng.」"
2136 = "「Tuyến đường đó đã bị bãi bỏ từ lâu lắm rồi mà?\\nGần nhà ga Mỏ than Jussen bị bỏ hoang, làm gì còn thiết bị nào...」"
2138 = "「Nếu vậy thì——à, đền Akai Aso.\\nTừ trước đến nay cháu vẫn luôn nghĩ,」"
2139 = "「Vậy nếu chúng ta điều tra cả những vùng đất còn lưu giữ những thứ đó,\\nthì chắc chắn sẽ làm sáng tỏ được quá trình phát triển và dòng chảy kỹ thuật của những người thợ tiện gỗ.」"
2140 = "「Nếu vậy,\\ntrọng tâm của buổi bàn bạc là về đường sắt mỏ phải không ạ?」"
2146 = "「Về cơm hộp nhà ga, chúng ta sẽ liên tục làm thử, ăn thử,\\nđể tìm ra hình thức hoàn hảo nhất.」"
2147 = "「Cơm hộp nhà ga có sức mạnh đến nhường đó đấy.」"
2152 = "「Về vấn đề này, có một vài giả thuyết.\\nĐầu tiên, là do Kijiguruma (xe Kiji) bị đọc chệch thành Kijiuma (ngựa Kiji).」"
2155 = "「Kijiguruma, Kijiguruma, Kijiguma, Kijiuma——\\nChà, nghe cũng có vẻ hợp lý đấy ạ...」"
2157 = "「Chuyện đó thì đúng là vậy, nhưng——」"
2158 = "「Cậu Soutetsu có biết không?」"
2159 = "「Anh Soutetsu cũng tìm được chừng đó rồi ạ.\\nTài liệu ở đây nhiều thật đấy.」"
2160 = "「Thứ anh Soutetsu thay đổi không phải là ý kiến, mà là sai lầm.\\nVì vậy, sự mạnh mẽ của anh đối với em, thật chói lóa.」"
2161 = "「Ngài Soutetsu, xin hãy sử dụng tôi.」"
2162 = "「Không lẽ, đặc trưng của đền Akai Aso,\\nkiến trúc mặt quỷ chính là——」"
2163 = "「Không lẽ, anh Soutetsu——\\nđang nghĩ đến việc khôi phục tuyến đường sao?」"
2167 = "「Mặt nạ, sao ạ?\\nĐiều đó——giống như thợ điêu khắc làm tượng Phật phải không ạ?」"
2172 = "「!」"
2173 = "「!!!」"
2306 = "Nếu không xác nhận điều này,\\nrất có thể sẽ xôi hỏng bỏng không."
2308 = "Đúng là Thị trưởng có khác, thật đáng kinh ngạc.\\nĐó là một ý tưởng mà tôi hoàn toàn không nghĩ tới."
2311 = "Dù Paulette có biết quá khứ của tôi hay không,\\nthì cũng chẳng ảnh hưởng gì đến chúng tôi của hiện tại... Chắc là vậy."
2317 = "Nhưng...\\nÀ không, nếu rút ngắn thời gian điều tra mỗi lần xuống thì——"
2318 = "Nhưng, Paulette lại tỏ vẻ bối rối."
2319 = "Nhưng, với một người chưa nghĩ xa đến mức đó như tôi,\\nthì lại cảm thấy có chút áy náy."
2320 = "Nhưng dù sao thì, trước mắt cứ tập trung vào cơm hộp nhà ga đã.\\nNếu không đi vững bước đầu tiên, bước tiếp theo sẽ trở nên chông chênh."
2321 = "Nhưng——việc xác nhận đó để sau cũng được.\\nĐối với mọi người, thời gian cũng rất quý giá mà."
2324 = "Nhờ di sản mà ông ấy đã kiên định tích lũy,\\nchúng tôi hiện tại đang được giúp đỡ rất nhiều."
2325 = "Nhưng——sợ hãi cũng chẳng ích gì."
2328 = "Nhưng đâu đó——vẫn phảng phất chút buồn bã."
2342 = "Không chỉ gật đầu,\\nthầy còn chỉnh lại tư thế, cúi đầu chào Paulette một lần nữa."
2344 = "Hachiroku ngừng lời, nhìn chằm chằm Hibiki.\\nHibiki đáp lại Hachiroku bằng một nụ cười đầy tự tin."
2347 = "Hachiroku đứng phắt dậy."
2349 = "Gật nhẹ đầu trước lời tôi nói,\\nHachiroku nhìn lại tôi bằng ánh mắt kiên định."
2351 = "Có những món gần như giống hệt ngựa Kiji,\\ncũng có những món rất mộc mạc——giống hệt một con ngựa thật."
2357 = "Nagi dễ dàng thay đổi bầu không khí.\\nFukami cũng ngoan ngoãn hùa theo."
2363 = "Hakata, Saga, Nagasaki, Kumamoto, Kagoshima, Miyazaki, Oita——"
2366 = "Ra là vậy. Quả là một điểm mù."
2368 = "Những lời nói từng tuôn ra mạnh mẽ,\\ngiờ đây được nói ra một cách cẩn trọng, chắc nịch từng chữ một."
2390 = "Không, Fukami à.\\nLý do chữa cháy đó thà không nói còn hơn."
2391 = "Và——không ổn."
2393 = "Cái này... không, thực sự rất thú vị.\\nMột trong những chủ đề của cơm hộp nhà ga, nhất định phải là ngựa Kiji."
2394 = "Nếu phân tích nhân tử lời của Nagi,\\nthì sẽ thành 'Tàn tích Mỏ than Jussen = (Xa + Bẩn) x 2'."
2397 = "Sau khi tuyến đường bị bãi bỏ, việc vận chuyển chúng đi chắc chắn vô cùng khó khăn.\\nVì vậy, tôi có cảm giác nếu vào sâu trong rừng, có thể chúng vẫn còn sót lại."
2398 = "Hơn nữa, nếu in thêm một đoạn giải thích về 'Ngựa Kiji và Ohito'\\nlên mặt sau của giấy gói cơm hộp thì càng tuyệt vời."
2400 = "Trước khi để suy nghĩ đi quá xa,\\nít nhất cũng phải xác nhận lại với chị Mayami đã."
2404 = "Khuôn mặt và lời nói vui sướng tột độ của cô ấy,\\nđã tiếp thêm sinh lực cho tôi đang dần kiệt sức."
2406 = "Sự đánh giá đó, rốt cuộc là từ đâu mà có.\\nPhải chăng Paulette đã biết về quá khứ của tôi."
2408 = "Đôi mắt này, những lời nói này——như đang kéo tôi về quá khứ,\\nnhư đang hòa quyện vào những ký ức quan trọng trong quá khứ."
2410 = "Giọng nói của cô ấy đã lấy lại được sự bình tĩnh."
2411 = "Giống như lúc em ấy giải thích về việc vẽ biển hiệu cho khách hàng——\\nKhuôn mặt đó ngập tràn sự tự tin và tự hào."
2414 = "Nghe cô ấy nói tôi mới để ý, từ ga Mỏ than Jussen\\nđến ký hiệu bản đồ mỏ phía trên chữ Jussendo, có một đường kẻ."
2415 = "Nếu nhờ vả với lý do vì du lịch, vì quảng bá,\\nthì có lẽ chuyện tiến cử đã bị từ chối thẳng thừng rồi."
2418 = "Nếu là loại đó, thì giống như Reina,\\nchắc hẳn cũng không ít người muốn 'lái thử' đâu."
2423 = "Không có kiến thức, cũng đồng nghĩa với việc\\nkhông bị định kiến chi phối, tôi chợt nhận ra điều đó."
2431 = "Thầy tế lại đứng lên, lần này lấy ra\\nnhững món đồ chơi bằng gỗ giống ngựa Kiji hơn."
2432 = "Một cái gật đầu sâu, đầy vẻ mãn nguyện."
2433 = "Giọng nói điềm đạm mang hàm ý khen ngợi."
2434 = "Khi được thầy tế Akai gật đầu cho phép,\\nPaulette ngượng ngùng hỏi."
2438 = "Sở thích đường sắt, cùng với sự quan tâm và kiến thức về mặt văn hóa."
2441 = "Dù có ngần này người,\\ncăn phòng vẫn không hề có cảm giác chật chội."
2443 = "Ngay cả một người như tôi,\\ncũng thỉnh thoảng bắt gặp những tấm băng rôn quảng cáo đó ở các cửa hàng bách hóa."
2448 = "Bình thường, tức là hệ thống Paulette - Reina sao."
2459 = "Đúng như cô ấy tự nhận, 'giỏi những công việc đòi hỏi sự kiên nhẫn'."
2468 = "Có phải tôi đang ép buộc em ấy không——\\nCảm giác đó lại trào dâng trong tôi."
2472 = "Khi cúi đầu xuống, tôi chợt thấy\\nsự thiếu hiểu biết của mình thật nực cười."
2473 = "Nếu là hai chúng tôi, chắc chắn sẽ điều tra được khá nhiều thứ."
2474 = "Tuy là phòng khách, nhưng cũng là đại sảnh."
2476 = "Đôi tay đang dừng lại bắt đầu cử động,\\nmiệng cũng bắt đầu nói năng lưu loát hơn."
2478 = "Đáng lẽ tôi phải là người hỗ trợ Paulette,\\nnhưng lại đang làm mất thời gian của cô ấy."
2481 = "Quay lại, ánh mắt tôi chạm phải ánh mắt Paulette.\\nGần như cùng lúc, giọng nói của chúng tôi vang lên."
2482 = "Tôi, Paulette và Reina.\\nBa chúng tôi đã nhốt mình trong này suốt bốn tiếng đồng hồ."
2484 = "Tôi cúi đầu cảm ơn chị Mayami, và cả mọi người."
2485 = "Giống hệt như lúc cô ấy nói về sông Seine——\\nKhông, tôi còn cảm nhận được sự nhiệt huyết mãnh liệt hơn thế."
2487 = "Căn phòng bên cạnh phòng của tôi.\\nMột căn phòng chất đầy sách và tài liệu của ông Taito."
2490 = "Trước những lời nói bất ngờ đó, tôi ngẩng mặt lên khỏi cuốn sách.\\nĐôi mắt xanh biếc của Paulette cũng đang chăm chú nhìn tôi."
2493 = "Tiếng lẩm bẩm đầy ngưỡng mộ của tôi được đáp lại bằng một cái gật đầu mạnh mẽ."
2495 = "Liếc nhìn Paulette, cô ấy cũng xếp sách thành một đống nhỏ,\\nđang mở một thứ gì đó giống như cuộn giấy ra và chăm chú nhìn vào."
2497 = "Đột nhiên, mọi thứ kết nối lại với nhau."
2498 = "Dù hơi chậm chạp,\\nnhưng tôi đã hiểu điều Hibiki muốn nói."
2500 = "Cố gắng tỏ ra tự nhiên nhất có thể——\\nTôi tiếp tục câu chuyện, cố gắng thay đổi bầu không khí."
2502 = "Tôi ngồi xổm xuống, để tầm mắt ngang bằng với Reina."
2505 = "Nghe tôi lặp lại như một con vẹt,\\nReina gật đầu cái rụp, cả người nảy lên."
2506 = "Tôi gật đầu thật sâu.\\nChuyện đó, chính bản thân tôi là người hiểu rõ nhất."
2507 = "Giọng nói của Reina từ trong góc phòng kéo tôi bừng tỉnh.\\nLúc này, thứ tôi cần đối mặt là sách vở và tài liệu."
2510 = "Vì vậy, tôi cố bật ra thành lời.\\nĐể đối mặt với những gì cần đối mặt."
2512 = "Khi ngẩng đầu lên,\\nHibiki không hiểu sao lại nhìn tôi với vẻ mặt hơi áy náy."
2520 = "Nếu có thể khiến Hibiki rung động đến vậy, thì thị trấn đó,\\nchắc hẳn cũng là một cảnh tượng thú vị đáng để chiêm ngưỡng."
2536 = "Trong giọng nói thốt ra của Hibiki và Hachiroku,\\nnghe như có sự đan xen giữa ngạc nhiên và thán phục."
2539 = "Chuyến dã ngoại của Hibiki, và của Nagi với Fukami,\\nchỉ cách nhau vỏn vẹn vài năm."
2541 = "Hibiki đang tự nhủ với bản thân.\\nGiống như những gì em ấy thường làm khi còn nhỏ."
2543 = "Hibiki giơ một ngón tay lên."
2544 = "Hibiki cười. Một nụ cười rạng rỡ."
2547 = "Chỉ cần hỏi là xong chuyện,\\nnhưng không hiểu sao lời nói cứ nghẹn lại ở cổ họng."
2553 = "Cơm thố Yokokawa, cơm bạch tuộc Nishi Akashi, cơm cua Oshamambe,\\ncơm gà chọi Hitachi Daigo, cơm cá tráp đỏ Izuden Shimoda——"
2559 = "Điều này cũng giống với ông Taito."
2560 = "Cũng phải thôi. Chúng tôi đang chia nhau ra tìm, tôi và Paulette tìm về thợ tiện gỗ, ngựa Kiji, Ohito.\\nCòn Reina thì tìm về đường sắt mà."
2579 = "Paulette là một kho tàng kiến thức về hành chính, du lịch và đường sắt.\\nTôi cũng đang học về mỏ than, dù chỉ là về các vấn đề liên quan đến ô nhiễm môi trường."
2580 = "Paulette có vẻ hơi bối rối.\\nCó lẽ nên giải thích từng bước một."
2581 = "Paulette và Reina,\\nkhông hiểu sao lại nhìn nhau trao đổi ánh mắt."
2582 = "Có vẻ nhận ra ánh mắt của tôi,\\nPaulette ngẩng đầu lên, khéo léo cuộn tròn cuộn giấy lại."
2583 = "Đôi mắt xanh hướng về phía tôi.\\nNhưng tôi vẫn chưa hiểu chuyện gì đang xảy ra để mà 'Đúng không ạ?'."
2584 = "Giọng nói của Paulette.\\nNghe như xen lẫn giữa kinh ngạc và vui sướng."
2585 = "Có vẻ Paulette cũng giống tôi,\\ncảm thấy chưa được thuyết phục lắm."
2586 = "Paulette đột nhiên trở nên bất an.\\nKéo theo đó, tôi cũng bắt đầu thấy thiếu tự tin."
2587 = "Một lời khẳng định chắc nịch.\\nTừ Paulette."
2588 = "Nở nụ cười tinh nghịch,\\nPaulette gật đầu thật mạnh, thật sâu."
2589 = "Một cái giơ tay nhè nhẹ."
2590 = "Paulette xoay người,\\nhướng về góc phòng nơi giọng nói của Reina vang lên."
2591 = "Giỏi quá đi! Paulette vừa xoa đầu Reina,\\nvừa nhanh tay thu thập những tài liệu vừa tìm được."
2592 = "Hai má Paulette ửng đỏ.\\nGiọng nói cũng cứng lại như đang căng thẳng."
2593 = "Cái cổ trắng ngần khẽ nuốt nước bọt."
2600 = "Như để chứng minh cho điều đó,\\nFukami dè dặt nói thêm."
2601 = "Fukami khẽ cười khổ.\\nThật khó để biết nên nói gì với em ấy lúc này."
2603 = "Fukami tóm lấy Nagi, bịt miệng em ấy lại."
2604 = "Fukami giật thót mình, co rúm người lại."
2609 = "Tại sao tôi lại suýt quên mất một điều đơn giản như vậy,\\nchính tôi cũng không hiểu nổi bản thân mình nữa."
2617 = "Tại một điểm mà Reina chỉ vào, có ghi một dòng chữ quen thuộc."
2618 = "Với vẻ đầy tự hào và hoài niệm,\\nReina ưỡn ngực 'ehen'."
2620 = "Reina lạch bạch chạy về phía chúng tôi.\\nThứ em ấy đang dang rộng bằng cả hai tay là——"
2623 = "Thầy tế Akai có vẻ là người khá khiêm tốn——"
2625 = "Tiếng nuốt nước bọt khe khẽ."
2627 = "Đúng là từ lúc nào không hay, tôi cũng đã trở nên khá am hiểu về đường sắt rồi..."
2628 = "Đến cả Paulette,\\ncũng không có kiến thức sâu rộng về Hinomoto đến mức đó."
2638 = "Chị Mayami nhẹ nhàng lên tiếng giải vây."
2640 = "Nụ cười của chị Mayami, vẫn rạng rỡ——\\nnhưng đã biến thành một thứ gì đó ở cấp độ đáng sợ rồi."
2642 = "Nhìn thấy bộ dạng đó, chị Mayami cười khúc khích,\\nnụ cười dần dịu lại, trở nên tự nhiên hơn."
2643 = "Chị ấy nở một nụ cười rạng rỡ,\\nnhư thể chỉ chờ có câu hỏi đó."
2648 = "Chắc cũng có nhiều loại,\\nnhưng loại dùng tay đẩy cần gạt để tiến lên cọc cạch ấy."
2650 = "Trái tim tôi bỗng đập thịch một cái."
2654 = "Đây đã là cuốn sách thứ mười một, bao gồm cả sách đóng gáy kiểu Nhật.\\nThêm sáu tập ghi chép nữa."
2659 = "Không thể nào cho tàu ngừng chạy được."
2664 = "Trong khi tôi mới chỉ kiểm tra được\\nmột nửa phần việc của mình——"
2665 = "Khuôn mặt ngơ ngác.\\nRồi cô ấy lắc đầu nguầy nguậy vẻ áy náy."
2670 = "Có lẽ là tàn tích Mỏ than Jussen.\\nSự xuống cấp đang diễn ra với tốc độ chóng mặt."
2675 = "Nếu giành được danh hiệu Tài sản văn hóa,\\nđộ nhận diện của đền Akai Aso, và cả thành phố Ohito sẽ tăng lên đáng kể."
2705 = "Trước câu hỏi ngây ngô đó,\\nthầy tế Akai không trả lời mà hướng ánh mắt về phía tôi."
2706 = "Nhìn vẻ mặt của chúng tôi, thầy tế Akai gật đầu mãn nguyện."
2707 = "Thầy tế Akai hơi rướn người về phía trước."
2708 = "Thầy tế Akai đột nhiên chuyển ánh nhìn sang tôi."
2709 = "Thầy tế Akai đứng dậy, lấy từ chiếc tủ trang trí ra\\nmột vài món đồ chơi bằng gỗ giống ngựa Kiji."
2710 = "Trà do thầy tế Akai pha rất ngon."
2711 = "Thầy tế Akai gật đầu,\\ncầm chén trà lên nhấp một ngụm."
2712 = "Thầy tế Akai\\ngật đầu thật sâu."
2733 = "Tất cả đều là những 'cơm hộp nhà ga' của các ga đã bị bãi bỏ,\\nnhưng vẫn tồn tại cho đến tận bây giờ."
2734 = "Hai điều đó hiện tại vẫn chưa thể liên kết với nhau,\\nkhiến tôi thậm chí còn nghĩ mình đã nghe nhầm."
2735 = "Đây đúng là trường hợp 'chân đèn thì tối' rồi."
2736 = "Nghĩ vậy, ý thức của tôi cũng được nâng cao.\\nTôi thực sự muốn học hỏi những đức tính tốt đẹp của cô ấy."
2737 = "Câu chuyện thì thú vị thật đấy.\\nNhưng——"
2738 = "Đường kẻ trông như vết khâu đó, hình như là..."
2739 = "Những lúc thế này, có Nagi thật tốt.\\nCắt thẳng vào vấn đề chính, đẩy câu chuyện tiến triển nhanh chóng."
2742 = "Vậy thì, chỉ có một câu trả lời duy nhất được rút ra."
2746 = "Tất cả những nơi này đều có thể đi đến bằng đường sắt——\\nNhững đường kẻ trắng đen liền mạch làm nổi bật lên ánh hào quang của quá khứ."
2747 = "Đường ray là loại thép chất lượng cao. Có lẽ ai đó đã lấy trộm rồi.\\nNhưng khu vực Mỏ than Jussen là vùng cấm hoạt động của \\x%lエアクラ;#00ffc040;Aircra%l;#;——"
2752 = "Chắc cũng có phần do cách pha,\\nnhưng hương thơm của bản thân lá trà thật sự quá ấn tượng."
2753 = "Giọng nói tươi tắn khiến tôi thấy bất an.\\nTôi không biết thể lực của Paulette thế nào."
2754 = "Tôi chưa bao giờ chủ động tìm ăn cơm hộp nhà ga, nhưng——"
2755 = "Nó có nghĩa là 'Làm sáng tỏ những điều chưa biết và được dẫn dắt',\\nnhưng tôi cũng không thể gọi thầy tế Akai là kẻ thiếu hiểu biết được."
2766 = "Xe cá voi, xe chó, xe cá tráp, xe chim cút.\\nTất cả đều mang lại cảm giác rất giống ngựa Kiji, nhưng——"
2771 = "（Nếu cô ấy đang xem xét nội dung,\\nnghĩa là đã tìm xong một lượt rồi sao）"
2773 = "（Là con gái nhà nấu rượu, lại thích dọn dẹp.\\nHibiki không thể nào vô cảm với sự bẩn thỉu được.）"

[selections]
