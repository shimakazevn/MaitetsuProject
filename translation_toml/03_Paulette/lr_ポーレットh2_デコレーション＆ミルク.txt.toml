1300 = "「Anh Soutetsu?」"
1301 = "「Chiều dài của phần dương vật thò ra——\\nThế nào ạ? Có ngắn hơn trước không?」"
1305 = "「Rãnh quy đầu à?」"
1315 = "「（Phù～～～）, chụt! Chu mu——chụt——\\nliếm nhẹ——rê ru——liếm nhẹ——rê ro——pê chu」"
1317 = "「（Chu mu! Chuu! Chu ru! Zuu!）」"
1319 = "「（Chụt! Chuu! Chu mu! Juu u!）」"
1320 = "（Liếm nhẹ）"
1321 = "「（Chụt!）——Ufufu, sao thế? Anh Soutetsu.」"
1323 = "「Decoration」"
1376 = "Ngay từ đầu khoái cảm đã dâng lên quá mức.\\nCứ thế này thì chỉ cần liếm quy đầu thôi tôi cũng bắn mất."
1382 = "Ngay khoảnh khắc nghe thấy từ đó, hình ảnh chiếc bánh kem hiện lên trong đầu tôi,\\nvà tôi lập tức hiểu ra ý nghĩa sâu xa của nó."
1383 = "Kích thích từ một điểm, nhanh chóng lan rộng ra. Paulette dùng chiếc lưỡi nóng bỏng,\\nthoa đều nước bọt lên toàn bộ quy đầu của tôi."
1391 = "Cả hai kích thích hòa quyện mãnh liệt, bổ trợ cho nhau.\\nTôi muốn tận hưởng lâu hơn nữa, nhưng xung động xuất tinh lại quá dữ dội——"
1395 = "Vừa mới nãy tôi đã bắn ra một lượng lớn tinh dịch.\\nNếu bắn phát thứ hai ngay thì tinh dịch sẽ bị loãng, và trông cũng không hay cho lắm."
1397 = "Khi tôi dùng dương vật đã cương cứng trở lại cọ xát nhẹ vào âm đạo,\\nPaulette liền phát ra giọng điệu ngọt ngào——như đang làm nũng."
1404 = "Có lẽ do tinh dịch dính vào mũi, một bong bóng nhỏ xíu phồng lên trong tích tắc,\\nrồi Paulette vội vàng bóp nát nó đi."
1407 = "Sau khi đã nếm trải sự kích thích mạnh mẽ nhất bên trong âm đạo, giờ lại\\nphải tiếp tục chuyển động chậm rãi ở mức độ nông hơn. Thế này thì tôi không thể xuất tinh được——Không."
1410 = "Do đó, tôi thì thầm.\\nNhìn thẳng vào đôi mắt xanh biếc ấy, bằng giọng điệu trầm ấm, ngọt ngào nhất có thể."
1413 = "Môi lớn bám dính lấy dương vật đang cọ xát.\\nĐòi hỏi một cách vô cùng đơn giản rằng hãy đâm vào, hãy xuất tinh đi."
1418 = "Có lẽ cô ấy thậm chí còn chẳng suy nghĩ xem ý tôi là gì.\\nChỉ gật đầu vì muốn, rất muốn, cực kỳ muốn tôi tiếp tục chuyển động thôi."
1421 = "Cô ấy thổi hơi, hôn, rồi liếm——trong lúc đó,\\nphần gốc dương vật vẫn bị bao bọc trong áp lực ngọt ngào."
1422 = "Dòng tinh dịch trắng đục không kịp nuốt hết văng lên gương mặt xinh đẹp, trắng ngần của cô ấy.\\nChảy dọc xuống cằm, rỏ xuống bộ ngực căng tròn——từng giọt, từng giọt dâm đãng và diễm lệ."
1425 = "Cô ấy đỏ bừng mặt, lúng túng run rẩy.\\nRõ ràng là tự mình chọn mua mà——hửm?"
1427 = "Dáng vẻ luống cuống của cô ấy làm tôi thấy vui vẻ.\\nRa là vậy, lần tới vừa làm vừa chọc vào điểm yếu đó cũng không tồi."
1429 = "Sốt ruột, nũng nịu——nhưng vẫn là giọng nói đang cảm nhận rõ ràng khoái cảm.\\nBằng chứng là bên trong âm đạo cũng——"
1431 = "Rãnh quy đầu!!!!\\nNgay giờ phút chót này lại bị liếm ngược từ dưới lên trên!!!"
1432 = "Đôi môi cô ấy liên tục chuyển động trên quy đầu, đẩy sâu vào tận cuống họng.\\nTrong lúc đó, chiếc lưỡi vẫn không ngừng nghỉ, liếm láp quanh rãnh quy đầu và lỗ sáo."
1435 = "Bị cấm cản lại càng muốn nhìn hơn. Nhưng——\\nbây giờ đừng vội, cứ tận hưởng trong phạm vi được cho phép đã."
1438 = "Đôi tay cô ấy hành động còn nhanh hơn cả lời nói.\\nKéo tuột chiếc quần lót của tôi xuống——"
1439 = "Vừa nói, cô ấy vừa dùng ngón tay quệt lớp tinh dịch văng trên mặt——"
1441 = "Cô ấy mỉm cười, trông thật hạnh phúc.\\nVới khuôn mặt tèm lem tinh dịch, cô ấy trông thật hạnh phúc."
1443 = "Sinh vật xinh đẹp này chỉ vì tôi mà thực hiện hành vi dâm đãng đến nhường này,\\nlại còn trông vô cùng hạnh phúc. Sự thật đó càng thôi thúc tôi xuất tinh mạnh hơn——"
1449 = "Đôi mắt cô ấy cười. Miệng chóp chép rồi hé mở.\\nChiếc lưỡi vươn ra, hướng xuống dưới——"
1453 = "Cùng với chiếc miệng nhỏ, đôi gò bồng đảo bao bọc lấy toàn bộ thân dương vật và cả tinh hoàn,\\ndưới sự trơn trượt của nước bọt và mồ hôi, chúng không ngừng kích thích——"
1455 = "Dù có xoa bóp ngực cũng không thể đánh lừa bản thân được nữa.\\nDù đang nắn bóp bầu ngực tuyệt hảo đến vậy mà vẫn——"
1457 = "Từng nếp gấp thịt run rẩy, mút mát, rung lên nũng nịu,\\nkhông ngừng thúc giục tôi xuất tinh, ngay cả khi tôi đang bất động."
1475 = "Gì thế này, từ đầu vú vừa bị nắn mạnh của Paulette,\\ncó thứ gì đó giống như nước phun ra——"
1487 = "Không phải vào sâu bên trong, mà là điểm nhạy cảm ở ngay lối vào.\\nTôi chuyển sang những chuyển động nông, nhẹ nhàng kích thích chỗ đó nhiều lần."
1489 = "Bất giác tôi thốt lên thành tiếng.\\nÁp lực từ đôi gò bồng đảo kẹp lấy tôi dường như mạnh hơn bình thường——A."
1491 = "Khi tôi chìa tay ra, cô ấy liền ngoan ngoãn đặt tay lên.\\nThú vị thật đấy."
1493 = "Tôi định bảo cô ấy há miệng ra,\\nnhưng chợt nhớ ra cô ấy vừa nói sức đề kháng sẽ giảm sút!!!"
1495 = "Tôi đành phải dùng cách trò chuyện để câu giờ. Muốn làm dịu đi khoái cảm,\\nđồng thời cũng muốn dụ cô ấy ngậm lấy nó."
1497 = "Coi nó như một thứ hoàn toàn vô dụng, chỉ để làm vấy bẩn cô ấy,\\ntôi đã bắn tinh dịch vung vãi khắp mọi nơi."
1498 = "Trong cơn hưng phấn như dã thú, tôi kịp thời khóa chặt xiềng xích lại.\\nĐúng rồi——Paulette sắp trở thành một người mẹ mà."
1503 = "Muốn đâm vào, muốn lập tức lắc eo liên hồi\\nvà trút toàn bộ tinh trùng vào tử cung của Paulette."
1504 = "Tôi cởi phăng chiếc quần lót và ôm chầm lấy đôi chân của Paulette.\\nHướng về nửa thân dưới đã bị bỏ mặc nãy giờ——"
1507 = "Tôi dồn toàn bộ sự tập trung vào tay phải đang vùi trong bầu ngực,\\nvà kiềm hãm xung động ấy ngay trong gang tấc."
1509 = "Cảm giác được bao bọc như mong đợi,\\nlại bị thay thế bằng một kích thích nhỏ xíu, như một điểm chạm."
1510 = "Có chứ. Sao lại không có cảm giác được.\\nThế nên tôi mới giả vờ. Để cảm nhận sự kích thích mạnh mẽ, sâu sắc và mãnh liệt hơn nữa."
1511 = "Đã thụ thai rồi. Mang thai rồi. Paulette sẽ trở thành mẹ!\\nBằng hạt giống của tôi——tức là tôi, sẽ trở thành bố!!"
1514 = "Xuyên thấu. Xuyên thẳng một mạch đến tận nơi sâu nhất của người vợ yêu dấu.\\nBên trong âm đạo đầy đặn mềm mại đang hân hoan chào đón tôi."
1515 = "Chỉ là một chuyển động tới lui rất nhỏ.\\nKhông phải dùng eo, mà giống như đang đu đưa cơ thể cô ấy như một chiếc nôi."
1517 = "Vì thế, tôi thận trọng chuyển động eo. Cố gắng kích thích không sót chỗ nào\\nđể âm đạo của Paulette phản ứng tốt hơn——"
1525 = "Cô ấy đặt tay lên tay tôi như muốn nói 『Em nhầm rồi』.\\n……Ra là vậy. Ra là vậy. Có phải tôi đã quá chậm tiêu rồi không."
1531 = "Khám thai mà lại đi khám ngoài giờ vào ban đêm thì cũng kỳ lạ.\\nVậy thì để ngày mai thôi. Nghĩ vậy, tôi bỗng thấy cả người nhẹ bẫng."
1535 = "Do đó, nó càng trở nên nổi bật. Ý đồ phơi bày những bộ phận nhạy cảm.\\nTừ \"con cái\" đã trực trào nơi cuống họng, nhưng tất nhiên, tôi đã nuốt nó xuống."
1541 = "Bắt đầu chảy ra liên tục. Vị nhạt dần biến mất, bắt đầu có thêm chút hương vị.\\nNgòn ngọt, dù không có vị giống sữa lắm nhưng——"
1554 = "Cô ấy không trả lời tôi, mà là trả lời dương vật của tôi.\\nGiọng nói và hơi thở của cô ấy như đang trêu đùa trên bề mặt quy đầu."
1555 = "Paulette há to miệng——"
1556 = "Mỉm cười. Ngón tay Paulette khẽ vuốt ve phần bụng dưới.\\nĐó không phải là cử chỉ của một người mẹ, mà là của một người phụ nữ thực thụ."
1557 = "Khi Paulette dùng cùi chỏ ép ngực lại,\\náp lực mềm mại từ lớp thịt và làn da tuyệt hảo càng trở nên mạnh mẽ hơn."
1558 = "Trong khoảnh khắc, Paulette dừng mọi chuyển động——!!!?"
1559 = "Bàn tay của Paulette khẽ vỗ nhẹ lên dương vật đang cương cứng của tôi,\\nchiếc lưỡi hồng hào khẽ thò ra——"
1560 = "Áp lực từ bộ ngực mà Paulette đang chầm chậm di chuyển,\\nđã hoàn toàn làm tan chảy và phá vỡ sự tập trung cùng khả năng phán đoán của tôi."
1561 = "Bao bọc lấy làn da của Paulette——không, thứ bám sát vào da cô ấy,\\nlà một thứ gì đó còn thiếu vải hơn cả đồ lót, nhưng lại có hình dáng tương tự đồ lót."
1562 = "Liếm xong, cô ấy ngậm lấy quy đầu và hút thật mạnh,\\nnuốt ừng ực dòng tinh dịch vừa được dẫn dắt trào ra."
1563 = "Cô ấy lúng túng quay cuồng. Bình thường tôi sẽ dốc sức hỗ trợ cô ấy,\\nnhưng trong đêm chỉ có hai người thế này, dáng vẻ đó quả thực rất đáng yêu."
1568 = "Cảm giác ấm áp khi được thỏa mãn đã bị cuốn trôi và vùi lấp,\\nbởi một khoái cảm bạo liệt gấp nhiều, gấp hàng chục lần!"
1569 = "Nước bọt nóng hổi lại nhỏ giọt xuống quy đầu."
1580 = "Làm theo lời cô ấy, ngay sau đó tôi nghe thấy tiếng cửa kéo mở ra rồi đóng lại.\\nTiếp đến là một sức nặng ấm áp."
1584 = "Khi tôi hướng ánh mắt xuống, Paulette liền cố khép chân lại.\\nTất nhiên tôi không cho phép, tiếp tục ngắm nhìn mật ngọt rỉ ra từ lớp thịt mềm mại ấy."
1586 = "Paulette luống cuống xấu hổ, ngược lại làm tôi bình tĩnh hơn.\\nTừ nãy đến giờ tôi chỉ toàn bị tấn công một chiều, nhưng——"
1597 = "Cuối cùng, cuối cùng cũng được em ấy ngậm lấy rồi!\\nCảm giác thỏa mãn, thành tựu và an tâm——!!!?"
1602 = "Phần nông phía trên trần. Tôi ép phần nhô cao nhất của rãnh quy đầu\\nvào điểm sưng phồng ấy rồi tạm thời dừng lại."
1603 = "Âm đạo co thắt nhanh hơn, nhiệt độ bên trong cũng nóng rực lên.\\nSự nhu động bám chặt lấy và nũng nịu không ngừng nghỉ cũng làm tăng thêm cảm giác muốn xuất tinh."
1614 = "Bị nói trúng tim đen, tôi vội vã dời ánh mắt khỏi ngực cô ấy."
1621 = "Đồ trang trí, phụ kiện trưng bày, decoration.\\nVới lời giải thích đó, tôi đã chấp nhận khi ngắm nhìn bộ ngực, nhưng——"
1622 = "Không phải là chật hẹp, mà là kín mít. Không gian bị lấp đầy bởi lớp thịt âm đạo,\\ntất cả đều là lớp thịt vân mỡ thượng hạng mềm mại vô cùng——"
1625 = "Nếu là sữa mẹ thì tôi muốn uống. Muốn vắt ra, muốn nó rỉ ra,\\ntôi liều mạng ngậm lấy, dốc toàn lực lắc eo."
1632 = "Phải thưởng cho bé ngoan chứ.\\nCô ấy đã thành thật xin xỏ, tôi cũng sẽ đáp lại một cách thành thật."
1639 = "Thật ngang trái, và cũng thật xinh đẹp. Lên cơ thể người mẹ đang mang giọt máu của tôi, lên khuôn mặt diễm lệ,\\nlên bầu ngực căng tràn sữa mẹ, tôi bắn tinh dịch đã khiến cô ấy mang thai——"
1640 = "Vị nhạt thếch như nước. Chỉ có thể cảm nhận được vậy thôi.\\nKhông hề giống sữa mẹ chút nào, nên tôi càng khao khát nó hơn."
1641 = "Trái ngược với sự kích thích êm ái từ bộ ngực,\\nlà sự dẫn dắt xuất tinh mãnh liệt, mang tính bản năng và trực diện chỉ nhắm vào quy đầu."
1645 = "Tiếng Paulette vọng ra từ sau cánh cửa kéo. Tiếng của vợ tôi.\\nBởi vì đã quá quen thuộc, tôi chợt cảm thấy có chút gì đó là lạ."
1647 = "Dù điều đó là trên hết, nhưng quả thực vẫn không thể sánh bằng cảm giác ma sát\\nkhi dùng toàn bộ âm đạo cực phẩm này để đâm vào tận sâu bên trong."
