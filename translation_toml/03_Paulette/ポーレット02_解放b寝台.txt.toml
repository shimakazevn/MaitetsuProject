1911 = "「Rõ ràng là con bé có hứng thú đến thế,\\nvậy mà tại sao lại không tự mình tận mắt chứng kiến chứ…… thật đáng tiếc.」"
1918 = "「Vâng……」"
1920 = "「Đúng vậy nhỉ. Nhưng chúng ta cũng không thể cứ giấu con bé trong tủ kính mãi được.\\nAnh vẫn mong con bé lớn lên khỏe mạnh.」"
1921 = "「Đúng vậy. Nếu đường sắt một lần nữa,\\ncó thể mang theo kỳ vọng, mang theo những giấc mơ.」"
1925 = "「Đúng vậy. Thời Đế Thiết, thậm chí từng xảy ra sự cố toa xe thép do \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; kéo bị lật do gió tạt ngang cơ mà.」"
1928 = "「Vâng. Họ mượn tuyến đường ray của Tokitetsu, vốn được giữ lại vì mục đích thực dụng, để chạy tàu phục vụ du lịch.」"
1930 = "「Đúng vậy nhỉ. Vậy chúng ta ăn cơm hộp nhé.」"
1931 = "「Vâng. Là một nơi giao thông khó khăn giống như Ohito, hơn nữa tuyết lại rơi dày.\\nĐây là thị trấn giữ lại đường sắt ngay từ đầu như một phương tiện phục vụ du lịch.」"
1933 = "「Đúng vậy.」"
1935 = "「Đúng vậy!\\nEm cũng đã chụp rất nhiều ảnh rồi, và——」"
1936 = "「Vâng. Thật đáng tin cậy.」"
1938 = "「Vậy sao.\\nTất nhiên ba sẽ không ép con đâu.」"
1939 = "「Vậy sao. Cảm ơn em vì đã suy nghĩ rất nhiều.」"
1940 = "「Vậy sao. Nếu thế thì, có lẽ dùng từ \"tiếc\" là không thích hợp rồi.」"
1941 = "「Ồ.」"
1942 = "「Ồ, tiện lợi thật.」"
1943 = "「Thế à? Vậy con có thể tự cởi được không nào?」"
1944 = "「Ghế nằm lăn lóc. Là toa trải thảm.\\nToa này không cần trả phí giường nằm đâu.」"
1946 = "「Vâng. Tùy thuộc vào duyên số, cô bé đó cũng có khả năng——\\nĐến với Đường sắt Ohito của chúng ta đấy ạ.」"
1949 = "「Vâng. Đây là đoạn đường ven biển thường xuyên có gió lớn.\\nCũng may là vùng đất này không thích hợp cho Aircra hoạt động.」"
1950 = "「Vâng. Ngủ say sưa rồi.\\nThế nên em mới muốn nói chuyện với anh Soutetsu.」"
1953 = "「Vâng. Đó là chuyến du lịch kỷ niệm quan trọng—— rất quan trọng đối với em.」"
1954 = "「Có người có kinh nghiệm đi cùng thật là an tâm.」"
1957 = "「Sẵn dịp này, con có muốn đi cùng ba không?\\nTự mình tận mắt nhìn thấy thì tốt hơn.」"
1959 = "「Chào mừng quý khách.」"
1961 = "「Không, anh đang nghĩ đó có phải là chơi chữ không.\\n『Dạo quanh suối nước nóng (Yu wo meguru)』 và 『Dạo quanh những giấc mơ (Yume wo meguru)』, nên mới là 『Yumeguri』.」"
1962 = "「Đó là điều tuyệt vời nhất rồi.」"
1963 = "「Không đâu ạ, mặc dù em nghĩ mình là đứa trẻ hay để ý đến sắc mặt người khác,\\nnhưng nhút nhát…… sợ hãi người khác thì không đến mức đó.」"
1964 = "「Đúng rồi. Bốn cái.\\nKhi leo thang, đầu tiên con phải bám thật chặt bằng cả bốn cái này.」"
1965 = "「Đúng vậy đúng vậy.\\nMặc dù là tàu tốc hành, nhưng riêng đoạn đường đó lại dừng ở khá nhiều ga đấy.」"
1966 = "「Không đâu ạ. Vì lợi ích của Mine Treasure,\\ncô bé được nhượng lại từ Đường sắt Suntetsu hiện tại mới là người phù hợp nhất.」"
1974 = "「Tầng Paulette! Oa.」"
1975 = "「Để làm được điều đó, chúng ta hãy trải nghiệm thật kỹ nhé.\\nCả chuyến tàu sưởi ấm, và cả chuyến tàu 『Yumeguri』 này nữa—— a.」"
1976 = "「Tại sao vậy ạ?」"
1982 = "「Để xem, để xem—— lại là tay phải~!」"
1983 = "「Chụp ảnh!!」"
1984 = "「Rất sẵn lòng.」"
1986 = "「Nào, ba ơi. Aaa.」"
1988 = "「Khóa huấn luyện của ba ạ?」"
1990 = "「Thang máy của ba!」"
1991 = "「Ba ơi, phía trên tay con hết thang rồi.」"
1993 = "「Ba ơi, ba đi chụp ảnh đi!\\nCả giường nằm hạng A và ghế nằm lăn lóc nữa.」"
1997 = "「Reina cũng xuống đi.」"
1999 = "「Reina cũng xuống đây ạ.」"
2001 = "「Chị Reina, chào mừng chị.」"
2002 = "「Reina, em leo lên giường trên trước được không?」"
2004 = "「Sau đó, ba trong số bốn cái tuyệt đối không được nhúc nhích.\\nChỉ được cử động cái còn lại thôi.」"
2005 = "「Thế là cả bốn cái lại không nhúc nhích rồi.\\nTiếp theo, con lại giữ nguyên ba cái và chỉ cử động một cái thôi.」"
2007 = "「Do \\x%lC56;#00ffc040;C56%l;#;—— Pony kéo, gồm 3 toa.\\nMột toa là giường nằm mở hạng B, một toa là giường nằm hạng A. Loại phòng riêng ấy.」"
2010 = "「Tất nhiên là được rồi.\\nNhưng phải cởi giày ra đã, được không?」"
2012 = "「Đúng là vùng ngoại ô Sendai thì không nhiều tuyết bằng Aomori.\\nNhưng tuyến Michitetsu chạy giữa Sendai và Naruko cơ mà.」"
2013 = "「Đúng là không thể nào. ……Paulette hồi nhỏ,\\ncó nhút nhát đến mức đó không?」"
2016 = "「Thế à? Nhưng mà, trên vé thường có ghi ga đi mà.」"
2018 = "「Tiếc thật nhỉ.」"
2020 = "「Con biết! Để bắt những người đi lậu vé!」"
2025 = "「Ra là vậy.\\nVì thế nên chuyến tàu 『Yumeguri』 này mới là của Michitetsu sao.」"
2027 = "「Chị nhân viên nhà ga là người của Tokitetsu!\\nCòn bác trưởng tàu là người của Michitetsu!」"
2028 = "「Khoan đã.」"
2030 = "「Anh Soutetsu.」"
2032 = "「Hơn nữa, ở những ga có lượng hành khách lớn, có vẻ như họ còn thay đổi vết cắt tùy theo khung giờ hoặc ngày tháng nữa đó nha.」"
2034 = "「Cởi giày, cởi giày, cởi giày ra nào, cởi giày ra nào!」"
2036 = "「Vé giường nằm thế nào rồi em?\\nVé của anh, em và Reina thì chắc chắn là có rồi, nhưng——」"
2037 = "「Tàu giường nằm thích thật đấy.\\nTuyệt vời hơn cả những gì anh từng nghe kể. Thực sự rất tuyệt.」"
2038 = "「Nếu dùng chung với vé định kỳ thì không có cách nào chống được đâu...\\nNên nghe nói ngày xưa người ta kiểm tra vé gắt gao lắm.」"
2045 = "「Chụp ảnh kỷ niệm thì đợi đến nơi rồi hẵng hay. Nhỡ lỡ việc thì mất công lắm.」"
2049 = "「Tuy con nói vậy, nhưng vẫn—— à, không.」"
2050 = "「Tuy nhiên,\\nhầu hết sự hứng thú của Hikari đều hướng về đường sắt.」"
2051 = "「Nhắc mới nhớ, chuyện lúc nãy ấy.」"
2052 = "「Nhắc mới nhớ, chuyến du lịch mùa đông của Paulette và ba em là ở Aomori phải không.」"
2053 = "「Không cần thêm câu đính chính đâu con~」"
2074 = "「Chuyện đó……」"
2075 = "「Với cái này thì anh không cần lo nữa. Vẫn còn hơn hai phút nữa cơ mà.」"
2076 = "「Hộp này có hai tầng trên dưới à.」"
2077 = "「Đó là cách thứ nhất. Để dùng cách đó, con phải tham gia 『Khóa huấn luyện của ba』.」"
2078 = "「Tức là, tàu của Michitetsu—— hay nói đúng hơn là tàu của Maitetsu thuộc sở hữu của Michitetsu, đang chạy trên tuyến đường sắt của Tokitetsu à.」"
2079 = "「Nguy hiểm. Ngã bây giờ.」"
2080 = "「Đây là…… mô phỏng theo hộp ấn của Mito Komon sao.\\nRa là vậy, quả bõ công em tìm kiếm.」"
2081 = "「Ngay cả khi có sự điều chỉnh của hệ thống dẫn đường, gió vẫn thổi mạnh đến mức không thể đối đối phó được sao?」"
2082 = "「Thế thì chắc chắn là không thể nghỉ ngơi yên tĩnh được rồi.\\nAnh cũng tò mò muốn xem thử nó như thế nào.」"
2083 = "「Cả toa xe thép cũng bị lật á!?」"
2084 = "「Thế thì, để xem nào—— tay phải ạ.」"
2091 = "「Chuyện lúc nãy?」"
2093 = "「Vậy thì Hikari. Trước tiên đếm tay và chân nào.\\nHikari có tất cả mấy tay và mấy chân?」"
2095 = "「Thế thì con rướn người bò lên giường đi.\\nReina, đỡ con bé giúp anh với.」"
2096 = "「Thế thì thế thì. Bò lên giường!!」"
2098 = "「Vậy thì chúng ta cùng cởi nha.」"
2099 = "「Vậy thì ba ăn nhé.」"
2100 = "「Thế thì thế thì, lần này là tay trái~!」"
2101 = "「Bù lại, con phải tham gia Khóa huấn luyện của ba đàng hoàng đấy nhé?\\nNếu không theo kịp thì không có leo thang gì đâu.」"
2102 = "「Vậy thì chúng ta đợi thêm một lát nữa nhé.\\n1~2 tiếng sau khi xuất phát từ ga đầu là giờ cao điểm chụp ảnh kỷ niệm mà.」"
2103 = "「Vậy thì, lần này con cho ba ăn bạch tuộc nhé.\\nNào, aaaaa!」"
2104 = "「Vậy thì, trong khi giữ nguyên ba cái kia, con đưa tay phải lên nắm lấy thanh ngang phía trên và bám thật chặt.」"
2107 = "「Dấu cắt của kìm bấm gọi là vết cắt.\\nNói là \\x%l検札鋏;#00ffc040;kìm soát vé%l;#; vậy thôi chứ thực ra chỉ là bấm một cái lỗ thôi mà.」"
2111 = "「Ta-da! Là 『Cơm hộp Mito Komon』 đấy!」"
2115 = "「Giường nằm mở!!\\nTuyệt quá! Ngầu quá đi!!」"
2118 = "「Đường sắt Michinoku Yukemuri!」"
2119 = "「Michitetsu!」"
2120 = "「Tuy nhiên…… nó không hợp với những chuyến du lịch gia đình đâu.\\nVì vào buổi sáng, những hành khách đi làm, đi học bình thường cũng sẽ lên tàu mà.」"
2121 = "「Tuy là chuyến đi đầu tiên, nhưng cũng là chuyến đi quen thuộc. Chuyến đi này ấy.」"
2122 = "「Tuy là cần phải có chút mánh khóe để giữ tấm vé đó mà không sử dụng—— nhưng có vẻ cũng có vô số cách để làm chuyện đó.」"
2123 = "「Anh Soutetsu!? Thế, thế cũng được ạ!?」"
2127 = "「Naruko…… à, ra vậy, là vùng đồi núi sao.」"
2131 = "「（Ực——）. Ừm—— Ngon! Tuyệt cú mèo!!!」"
2132 = "「Vết cắt?」"
2276 = "Ngay sau tiếng còi tàu, âm thanh thay đổi, khung cảnh ngoài cửa sổ cũng thay đổi.\\nLà đường hầm."
2278 = "Nhưng mà, tuy nhiên——"
2283 = "Lúc hớt hải chạy qua cửa soát vé, tôi nhớ nhân viên nhà ga là nữ thì phải——"
2289 = "Nhưng, xem kìa——"
2292 = "Dù vậy, Hikari vẫn đắn đo suy nghĩ."
2293 = "Nhưng đồng thời,\\nPaulette cũng là một cô gái, và cũng là người vợ thân yêu của tôi."
2297 = "Khuôn mặt Hikari nhăn nhúm lại vì cười."
2301 = "Paulette cũng hướng dẫn con bé \\x%l喚呼;#00ffc040;hô xác nhận%l;#;,\\nHikari chầm chậm, chầm chậm leo lên thang."
2304 = "Hikari nín thở.\\nMột sự im lặng có phần căng thẳng bao trùm lấy chúng tôi."
2307 = "Bên cạnh Reina đang nhâm nhi từng ngụm dầu diesel, Hikari vừa cười tươi rói vừa gắp những món mình thích và đậu để ăn."
2308 = "Nói rồi, Hikari nhào ra mép giường."
2311 = "Hikari lộ vẻ mặt bối rối.\\nChắc con bé không nghĩ ra cách nào khác để lên giường trên ngoài việc leo thang."
2313 = "Lúc Hikari còn thức, em ấy không thể làm nũng với tôi được.\\nVậy nên, tôi sẽ chiều chuộng em ấy. Nhân cơ hội này, tôi sẽ chiều chuộng em ấy thật nhiều."
2314 = "Hikari khéo léo dùng đũa gắp cơm trộn đưa đến miệng tôi."
2321 = "Trưởng tàu dùng \\x%l検札鋏;#00ffc040;kìm soát vé%l;#; bấm một lỗ nhỏ trên vé lên tàu và vé giường nằm, trả lại vé rồi cúi chào, sau đó di chuyển sang khu vực giường nằm bên cạnh."
2323 = "Ngay khi bóng dáng người trưởng tàu khuất đi, Hikari thở hắt ra một hơi dài."
2328 = "Cách gặp gỡ, cách giao tiếp với mọi người.\\nĐó là những thứ mà ngay cả bản thân mình cũng khó lòng kiểm soát được."
2334 = "Đằng nào thì Hikari cũng không ăn hết một suất được."
2335 = "Ra là vậy."
2336 = "Chỉ có tiếng bánh xe lăn qua những mối nối đường ray vang lên đều đặn trong màn đêm tối đen như mực."
2339 = "Đến cả mình cũng bao bọc con quá mức thì làm sao được.\\nHikari đang khó khăn lắm mới bộc lộ tính tự lập mà."
2341 = "Chắc là để ban đêm không quá chói sáng. Cửa sổ khá nhỏ và nằm ở phía lối đi."
2343 = "Phải chăng đối tượng khách hàng chính là người cao tuổi?\\nMàu sắc tuy có vẻ giản dị, nhưng món ăn thì đa dạng và trông rất ngon miệng."
2348 = "Với cùng một thao tác, tôi cũng đưa Reina xuống dưới.\\nThế là tôi độc chiếm tầng hai rồi."
2357 = "Bốn điểm bám. Cử động một điểm. Lại bốn điểm bám.\\nTay phải, tay trái, chân phải. Chân trái."
2358 = "Trên những tuyến đường ray xa xôi và bị chia cắt thế này,\\nvậy mà vẫn có những người đồng chí đích thực."
2367 = "Em ấy hẳn đã mong muốn đón cô bé đó về đến nhường nào——\\nCó lẽ tôi thậm chí còn không thể tưởng tượng được."
2371 = "Em ấy định ngáp, nhưng vội vàng nuốt lại.\\nKhóe mắt hơi ửng đỏ."
2374 = "Chắc là con bé nóng lòng muốn được thả xuống, nên cứ vặn vẹo trong vòng tay Paulette."
2375 = "Con bé ngủ ngon lành trên giường của Paulette, nên hiện tại, giường trên của tôi đang trống không."
2378 = "Sắp xếp toàn bộ chuyến đi đâu ra đấy, trông chừng Hikari, rồi lại còn khéo léo hỗ trợ cho cả tôi và Reina nữa."
2379 = "Một thoáng im lặng.\\nNhư thể em ấy đang nhấm nháp lại những kỷ niệm."
2381 = "Giọng điệu cuống quýt của cô ấy như muốn nói \"Anh cản con bé lại đi\".\\nĐúng là một người mẹ. Bao bọc quá mức chính hiệu."
2382 = "Một giọng nói đầy phấn khích.\\nCon bé lao ra từ phía sau Reina."
2384 = "Tôi hiểu cảm giác đó.\\nRất hiểu là đằng khác, nhưng——"
2385 = "Dù đã cố kìm nén nhưng giọng nói vẫn đầy vẻ thích thú, khiến tâm trạng tôi cũng phấn khích theo."
2387 = "Nhìn thang, nhìn tôi, nhìn Paulette, rồi lại nhìn Reina.\\nĐôi mắt con bé xoay mòng mòng theo đúng nghĩa đen——"
2389 = "Nụ cười tỏa nắng rạng rỡ.\\nThế này thì chắc là dụ dỗ được rồi."
2391 = "Khuôn mặt ngơ ngác."
2393 = "Con bé phấn khích tột độ.\\nQuên cả cởi giày mà lao thẳng đến chiếc thang——"
2394 = "Người vuốt ve là tôi cảm thấy dễ chịu đã đành, mà Paulette cũng nheo mắt lại, tỏ vẻ vô cùng say đắm."
2395 = "Trong tình hình các tuyến đường sắt tơi tả thế này, bản thân từ \"đi lậu vé\" cũng gần như trở thành từ ngữ chết rồi—— à đúng rồi."
2397 = "Nếu hành khách xuống tàu với vết cắt khác với vết cắt của ngày hôm đó, thì chỉ cần vậy thôi là có thể lập tức vạch trần hành vi đi lậu vé."
2400 = "Giả sử như vậy.\\nNếu Paulette không cứu rỗi tôi——"
2402 = "Cảm giác kín đáo, giống như một căn cứ bí mật tuyệt vời.\\nCả gia đình có thể độc chiếm nơi này—— hửm?」"
2404 = "Với tôi, cái giường này có lẽ hơi chật chội một chút.\\nNhưng ngay cả điều đó cũng có vẻ sẽ trở thành một niềm vui của chuyến đi."
2408 = "Đúng lúc đó, giọng nói vui sướng của Hikari vang lên."
2410 = "Đến cả lời khuyên nhẹ nhàng của Reina cũng khiến Hikari sợ hãi mà lùi sâu hơn vào chỗ nấp."
2416 = "Nhanh lên. Nhanh lên.\\nĐể không mắc phải sai lầm lao lên tàu lúc cửa sắp đóng, tôi bước những bước dài trong phạm vi an toàn."
2425 = "Tôi cũng muốn học hỏi từ dịch vụ của các công ty khác, và đây cũng sẽ là món quà lưu niệm làm tư liệu cho Hibiki."
2428 = "Tôi cứ đinh ninh con bé sẽ chọn thang máy, hoặc là leo không nổi rồi bỏ cuộc."
2431 = "Chúng tôi cứ thế lần lượt bước lên xe, đi qua lối đi nhỏ hẹp."
2432 = "「Là khúc dạ khúc Heykens!」"
2434 = "Trái tim tôi vừa mới rung động vì sự trưởng thành của con bé, vậy mà——"
2436 = "Tôi lại tiếp tục vuốt ve em ấy. Ngoan nào ngoan nào.\\nVuốt ve hết lần này đến lần khác, không hề biết chán."
2438 = "Tôi cứ thế tiếp tục vuốt ve Paulette."
2439 = "Tôi xốc nách Hikari, từ từ đặt con bé xuống.\\nNgay trước khi trao tay cho Paulette, tôi cố tình lắc con bé sang hai bên một chút."
2440 = "Tôi bế Hikari lên, đặt con bé vào thang và cho con bé bám vào."
2443 = "Tôi mở rèm ra."
2446 = "Tôi sẽ bước vào một cuộc đời như thế nào đây,\\nchỉ tưởng tượng thôi cũng thấy đáng sợ rồi."
2448 = "Tôi dùng ngón tay luồn qua mái tóc vàng, để những sợi tóc mềm mại trượt qua kẽ tay như cơn mưa vàng."
2450 = "「Hả? Mới đến Iwaki thôi sao?」"
2452 = "Tôi thực sự nghĩ vậy."
2454 = "Tôi liếc nhìn Paulette, cô ấy gật đầu như thể đã chờ sẵn câu nói đó."
2455 = "Nếu hứng thú đến thế, sao không lại gần mà xem cho rõ——"
2457 = "Tôi thực sự cảm thấy em ấy đúng là một vị giám đốc.\\nPaulette đã đưa ra giải pháp tối ưu nhất với tư cách là một nhà quản lý."
2459 = "「Fufufu, Hikari thích bắt chước mà~」"
2461 = "Vừa gật đầu, tôi chợt nghĩ ra một điều.\\nToa xe sưởi ấm, quả nhiên là sẽ rất nổi bật trong khung cảnh tuyết trắng."
2474 = "Việc quầy bán hàng ở nhà ga bị dẹp bỏ cho thấy tình hình kinh doanh quả thực không mấy dễ dàng."
2477 = "Mặc dù không phải do chính tay mình làm, nhưng Hikari có vẻ hơi bất an."
2479 = "Nói chính xác hơn, đó là hệ thống lái tự động, tự động điều chỉnh của hệ thống dẫn đường Aircra nhằm giảm thiểu tác động tiêu cực của việc giảm trọng lượng thân xe một cách triệt để."
2480 = "Chiếc giường vốn đã chật chội, giờ lại bị vợ chồng tôi chen chúc đến chật ních."
2487 = "Ngay khoảnh khắc tôi vừa nghĩ thế, từ giường trên, Reina cũng chìa tay xuống theo đúng nghĩa đen."
2489 = "Đáng tiếc, ngay khoảnh khắc con bé định leo lên thì đã bị tôi tóm lại."
2491 = "Hai mẹ con cùng cười tươi khen ngợi tôi.\\nNgay sau đó là lời giải thích."
2513 = "Thấy tàu đến, Paulette bước chậm lại, tôi đi nhanh vài bước lên trước mặt và nói với cô ấy."
2514 = "Dù có vẻ không tình nguyện, Paulette vẫn đi theo tôi.\\nTôi bế Reina, còn Paulette bế Hikari."
2515 = "Paulette cúi đầu chào với vẻ mặt áy náy, người trưởng tàu thì nở nụ cười gượng gạo như muốn nói \"Không sao đâu\"——"
2516 = "Paulette vặn vẹo cơ thể có vẻ ngại ngùng, rồi từ khoảng cách rất gần, em ấy chăm chú nhìn vào mặt tôi."
2517 = "Paulette ôm chặt lấy tôi, vùi mặt vào ngực tôi."
2518 = "Giọng Paulette nghe rất chân thực.\\nTôi nghĩ thế giới sở thích thì ở đâu cũng vậy thôi."
2519 = "「Không cần thêm câu đính chính đâu con.」"
2520 = "Paulette lúi húi chui vào nằm cạnh tôi."
2521 = "Paulette cũng lập tức hùa theo.\\nCô ấy cố tình dùng từ 『Khóa huấn luyện』 thay vì 『Thang』."
2522 = "Paulette ôm chặt lấy tôi.\\nA, ra là vậy——"
2523 = "Paulette hớn hở mở nắp hộp ra—— Ồ."
2524 = "Vừa nói, Paulette vừa vội vàng lấy vé ra từ ví đựng vé.\\nMột chiếc ví nhỏ xinh mô phỏng hình dáng KiHa 07S."
2529 = "Để chắc chắn, tôi đưa mắt nhìn Paulette, cô ấy vui vẻ gật đầu đáp lại."
2530 = "Bất kể chuyến tàu mang theo kỳ vọng gì,\\nchỉ cần khổ đường ray giống nhau là có thể chạy được."
2531 = "「Oa oa! Tiền vé tàu tốc hành được miễn phí luôn!」"
2536 = "Reina thì ngoan ngoãn chờ tôi đặt xuống."
2538 = "Vốn dĩ Reina nằm trên Paulette, còn Hikari nằm trên tôi——\\nĐó là cách bố trí giường nằm ban đầu, nhưng rốt cuộc Hikari lại nhõng nhẽo."
2539 = "Reina đón lấy Hikari từ tay tôi và cho con bé ngồi xuống giường dưới."
2541 = "Khi Reina leo lên thang, Hikari cũng định bám theo ngay lập tức, nhưng bị tôi tóm lại."
2543 = "Reina làm mẫu một cách rất tự nhiên.\\nCho Hikari—— và đồng thời cho cả tôi và Paulette thấy."
2544 = "Reina chậm rãi xoa đầu Hikari."
2546 = "Điều tôi đang hướng dẫn là quy tắc ba điểm bám.\\nTư thế cơ bản để di chuyển an toàn."
2548 = "Đúng là hoành tráng thật."
2550 = "Cứ thế này mà bế con bé đưa cho Reina là an toàn nhất.\\nNhưng—— Reina cũng đã làm mẫu cho con bé xem rồi."
2551 = "Cảnh sắc ngoài cửa sổ bắt đầu trôi lùi lại, khiến tôi cảm thấy có chút bùi ngùi——"
2553 = "Trong chớp mắt, Hikari đã trốn sau lưng Reina."
2560 = "Đúng là vậy. Vé tháng không ghi ngày tháng.\\nVì thế, chỉ cần mua vé tháng mệnh giá thấp nhất, rồi nhờ bấm vé ở ga đi——"
2561 = "Tuy trong đầu hiểu rõ là không được bao bọc quá mức, nhưng mà...\\nTôi nhìn Paulette, hai ánh mắt chạm nhau. Cùng lúc nở nụ cười gượng."
2565 = "Động cơ Aero-Craftech thiếu sức mạnh.\\nĐể bù đắp cho điều đó, họ đã thiết kế các biện pháp an toàn thông qua hệ thống dẫn đường Aircra."
2569 = "Giọng Paulette vang lên từ phía bên kia rèm.\\nChỉ bấy nhiêu thôi cũng đủ khiến lòng tôi bừng sáng."
2570 = "Sự đáng sợ của giáo dục—— hay nói đúng hơn là sự kinh khủng của nó,\\nnhư được phơi bày rõ mồn một trước mắt tôi."
2572 = "Huống hồ đây lại là chuyện của Hikari——\\nDù chúng ta có nỗ lực đến đâu, phần mà chúng ta có thể can thiệp vào sẽ ngày càng ít đi."
2573 = "Bị hỏi, Reina ấp úng.\\nCó lẽ em ấy đang suy nghĩ cách giải thích cho Hikari hiểu."
2582 = "Nếu vết cắt ở ga nào cũng giống nhau, thì chỉ cần như thế là có thể tạo ra một tấm vé cho phép lên tàu từ bất kỳ đâu và xuống tàu ở ga đi."
2584 = "Chẳng lẽ…… tàu đang chạy giảm tốc sao?」"
2587 = "Bên trong có bốn vé lên tàu, cùng với——"
2590 = "Để xem, hay là mình——"
2592 = "Công bằng, và đồng thời cũng phải an toàn."
2602 = "Ngay khi tôi vừa nói, con bé liền trốn ra sau lưng Reina."
2603 = "Nói đến đó, Paulette bỗng im bặt.\\nÁnh mắt chạm nhau. Cả hai cùng lúc nở nụ cười gượng."
2610 = "Ga là của Tokitetsu.\\nTàu là của Michitetsu—— nghĩ đến đây thì câu trả lời đã quá rõ ràng."
2622 = "Thật là vui quá đi mất."
2623 = "Một ví dụ thực tế đơn giản,\\nvà chính vì đơn giản nên nó mang lại cảm giác thật vững tâm."
2624 = "Vì là chuyến đi trên tàu hỏa vùng tuyết nên hôm nay Hikari đi ủng cao su.\\nChắc do chưa quen nên con bé cởi mãi không ra."
2625 = "Cơn gió lớn đó mạnh đến mức nào chứ——\\nChắc chắn là đi bộ bình thường cũng vô cùng khó khăn."
2626 = "Nghe nói trên chuyến tàu này không có xe đẩy bán hàng, nên Paulette đã phải cất công tìm mua hộp cơm này ở thị trấn Mito."
2627 = "Vừa nói ra, ký ức lại ùa về."
2630 = "Nó không phải là thứ dễ lật đến mức nói lật là lật được.\\nVậy mà nó lại lật ngang. Hơn nữa, lại còn có sức nặng của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; đè lên nữa chứ."
2635 = "Toa xe kỷ niệm mà Paulette đã từng cùng ba đi du lịch."
2636 = "Trông em ấy thật đáng yêu,\\nvà việc tôi là người nhận ra điều đó trước cũng khiến tôi cảm thấy đôi chút vui sướng."
2639 = "Lúc này, hãy để Hikari tự chọn."
2646 = "「Hửm?」"
2647 = "Đáng lẽ vẫn còn dư vài phút, nhưng trong lòng tôi vẫn nóng như lửa đốt.\\nGiả sử tôi lỡ mất chuyến tàu này——"
2649 = "Không biết cô ấy có uống chút rượu nào không?\\nKhuôn mặt vợ tôi hơi ửng hồng."
2662 = "「Chào buổi sáng quý hành khách.\\nĐoàn tàu sắp sửa đến ga Iwaki.」"
2675 = "（Cọc cạch, cọc cạch——）"
2677 = "（Xình xịch——）"
2678 = "（Tách—— Tách——）"
2679 = "（Tuúúúúúúúúúúú!）"
2681 = "「Chậm hơn lịch trình dự kiến 130 phút rồi nha.」"
2683 = "（Tay chân nhỏ xíu, gầy gò thế kia mà…… giỏi thật đấy.）"
2684 = "……Một đứa trẻ 4 tuổi, rõ ràng chưa từng có cơ hội trải nghiệm,\\nlại cảm thấy hoài niệm về chuyến tàu đường dài thời Đế Thiết."
2685 = "（Ồ——）"
2688 = "Nghe vậy, tôi hướng mắt ra ngoài cửa sổ.\\nCảnh vật trôi qua một cách chậm chạp."
2690 = "（Xình xịch xình xịch——）"

[selections]
