2215 = "「Nên bây giờ con cũng\\nđang vẽ đầu máy hơi nước chứ gì——hửm?」"
2218 = "「Thật sự——\\nTuyệt vời quá nhỉ, con người các ngài ấy」"
2220 = "「Tiếp nhận điều gì cơ ạ?」"
2221 = "「Đúng là, vậy nhỉ」"
2223 = "「Đưa than qua miệng lò tròn trịa,\\nvà dứt khoát ném mạnh than vào buồng lửa nhé」"
2224 = "「Than ơi. Đưa qua miệng lò nào~」"
2228 = "「Xin lỗi. Chuẩn bị hơi mất thời gian」"
2229 = "「Nhận được——sao ạ?」"
2233 = "「Thiết kế đầu máy hơi nước mới à——\\nQuả thực là một giấc mơ tuyệt vời」"
2238 = "「Hibi-tan thì~,\\nlà phụ lái tàu của Đường sắt Hikari!」"
2239 = "「Chị Hibi~!」"
2241 = "「Đã hiểu rồi ạ~! Hikari sẽ cố gắng~!」"
2242 = "「Là do Hikari thiết kế đó~!」"
2247 = "「Câu thần chú!」"
2250 = "「Vâng…… nhưng giờ nhắc lại chuyện đó làm gì ạ?」"
2252 = "「Đúng vậy.\\nNếu lửa trong lò hơi tắt thì tại sao lại rắc rối?」"
2254 = "「Đúng vậy đúng vậy. Lại đi trễ buổi lễ,\\nem thấy hơi kỳ cục đó, vâng」"
2255 = "「Đúng vậy đúng vậy」"
2256 = "「Đúng vậy~. Nên ba không lái được đâu~.\\nLái tàu sẽ là Hikari cơ~」"
2258 = "「Vậy à. Công tác lái tàu ở xứ tuyết có vẻ đặc biệt khó khăn đấy.\\nPhải rèn luyện thật tốt ngay từ bây giờ thôi」"
2259 = "「Vậy sao!」"
2260 = "「Vậy à?」"
2262 = "「Vì Hikari.\\nNói chính xác hơn là vì hành động——sự dũng cảm của con」"
2264 = "「Chắc là lỡ tay viết địa chỉ bên này rồi.\\nHa ha, lúc đó em cũng đang lâng lâng lắm mà」"
2265 = "「Là búp bê gỗ Reina nói cho con biết đó~」"
2268 = "「Vâng. Trưởng thành hơn rất nhiều, với tư cách là một người cha」"
2270 = "「Ra là vậy. Bây giờ cửa sổ của bé Hikari đang mở mà」"
2272 = "「Là người búp bê gỗ!」"
2277 = "「Nagi đại nhân! Sẽ đi gọi liền đây!!」"
2280 = "「Sóc, chồn hôi! Tê giác đen, cá mòi, hươu——\\nQuay lại bạn quạ rồi nè~!」"
2284 = "「Mừng anh về, anh hai!」"
2286 = "「Bạn đang đánh rắm là bạn chồn hôi đó nha?」"
2287 = "「Đầu tiên là phải chào hỏi đã ạ」"
2294 = "「Không có gì khó nói cả.\\nThậm chí, có lẽ tôi còn muốn Hibiki nghe nữa cơ」"
2295 = "「Đúng vậy ạ. Lật cổ tay thật dứt khoát,\\ntrước mắt chỉ cần rải đều than lên buồng lửa là đạt yêu cầu rồi ạ」"
2296 = "「Không sao đâu ạ. Cháu cứ thế mà xúc vào đi」"
2301 = "「Paulette——thì không phải cựu học sinh Học viện Yui,\\nReina lại là Railord——」"
2306 = "「Học viện Yui——Chuyến tàu kỷ niệm 80 năm thành lập à」"
2307 = "「Sự dịu dàng, và dũng khí」"
2308 = "「Lửa tắt thì sẽ không đun sôi nước được,\\nhết hơi nước thì tàu sẽ không chạy được nữa~」"
2311 = "「Tại sao chứ. Đúng là ba chưa từng có kinh nghiệm kéo tàu chở hàng,\\nnhưng giờ ba đã là một lái tàu được chính Hachiroku công nhận là hạng nhất rồi đấy nhé」"
2312 = "「Bạn quạ, rào—— dô ta—— chui qua——\\nờm—— bạn sẻ, rào—— ủa ủa?」"
2313 = "「Bạn quạ, bạn sẻ~」"
2316 = "「Và rồi một ngày nào đó, chúng ta sẽ trở thành hành khách, cùng nhau đi du lịch nhé.」"
2317 = "「Miệng lò, tròn xoe kìa~」"
2318 = "「Ba ơi」"
2319 = "「Ba không lái được đâu~」"
2321 = "「Ba á nha~. Đã chỉ cho Hikari,\\nnên Hikari, mới làm được đó~」"
2324 = "「Ba gặp rắc rối ạ~?」"
2327 = "「Ba ơi! Chỗ mẹ cơ~!」"
2328 = "「Ba ơi! Chỗ mẹ cơ~!!」"
2329 = "「Ba! Hạng nhất!」"
2331 = "「Ba ơi! Mừng ba về!!」"
2333 = "「Ba ơi, sao thế~?」"
2337 = "「Reina cũng vậy đó nha~」"
2339 = "「Reina cũng mải mê nhìn theo luôn đó ạ.\\nBé Hikari, ngầu cực kỳ luôn đó nha~」"
2341 = "「Búp bê gỗ Reina đã nói gì\\nvề cô phục vụ vậy?」"
2342 = "「Than mà Hikari đang xúc bây giờ,\\nlà than dành cho 8620 đấy」"
2344 = "「Cửa sổ của Hikari chắc hẳn đang mở toang rồi」"
2345 = "「Đương nhiên rồi.」"
2346 = "「Chắc chắn rồi, anh sẽ mang tương lai đó đến.」"
2347 = "「Sẽ ổn thôi. Con gái của anh và Paulette cơ mà?」"
2349 = "「Đúng vậy nhỉ——.\\nTrong chuyến đi Naruko, Hikari đã nhận được rất nhiều điều」"
2350 = "「Tuyệt thật đấy」"
2357 = "「Đúng là vậy」"
2361 = "「Khoan đã, bộ dạng này mà lên thì thất lễ lắm.\\nFukami lên tặng hoa thì hơn」"
2363 = "「Học viện Yui là ngôi trường mà Hikari sẽ theo học khi lên lớp một.\\nNhờ có Học viện Yui mà Đường sắt Ohimitera mới có thể tồn tại được」"
2365 = "「Đợi xíu nha anh hai! Em đi thay đồ 30 giây là xong liền!!」"
2366 = "「Không!」"
2373 = "「Đọc đi đọc đi~!!」"
2374 = "「Dù, dù sao thì cầm lấy cái này! Là bó hoa dùng để tặng hoa đó ạ!!」"
2376 = "「Trông cậu có vẻ buồn buồn. Nên tớ hơi tò mò xíu.\\nA! Nếu khó nói quá thì thôi cũng được」"
2377 = "「Nghe thấy chưa, anh Soutetsu!」"
2378 = "「Cháu nghe rõ không? Hikari.\\nĐể xúc than vào bốn góc thật khéo, cháu phải lật cổ tay——」"
2380 = "「Với tư cách là Thị trưởng Ohimitera, tôi cảm thấy vô cùng tự hào khi được chào đón ngày trọng đại này với tư cách là một cựu học sinh」"
2382 = "「Điều đó là tất nhiên rồi ạ. Cho đến khi thân xác và tâm trí này lụi tàn.\\nTôi nhất định sẽ dùng tất cả những gì mình có」"
2384 = "「Đầu máy hơi nước có cấu hình này,\\nít nhất là ở Đường sắt Hoàng gia cũ không hề tồn tại」"
2386 = "「Huấn luyện! Sẽ cố gắng ạ~!」"
2387 = "「Thiết kế?」"
2388 = "「Rất mong được giúp đỡ ạ」"
2389 = "「Rất mong được giúp đỡ ạ!」"
2390 = "「Hãy đổ than lên khay đi ạ.\\nBan đầu không cần vội, cứ từ từ thôi để không bị thương nhé」"
2391 = "「Đại diện học sinh mới tương lai. Và, đại diện Đường sắt Ohimitera tương lai.\\nXin mời bé Migita Hikari」"
2392 = "「Chỉ cho sao ạ? Chỉ chuyện gì vậy ạ?」"
2393 = "「Cháu cảm ơn ạ! Là vậy đó~」"
2394 = "「Đọc đi! Đọc đi! Ba ơi, đọc cho con nghe đi~!!」"
2405 = "「Xuất phát thôi~!」"
2407 = "「Không kịp rồi!!」"
2408 = "「Nối chữ~. Ưm~.\\nQuạ~, Sẻ, Cá killi~, Ốc sên~——Ưm?」"
2410 = "「Vất vả rồi nha! Hachiroku」"
2411 = "「Vất vả cho cháu rồi, Hikari! Cháu làm tốt đến mức không thể tin đây là lần đầu tiên đấy.\\nTuyệt vời lắm. Bài tập xúc than hôm nay đến đây là kết thúc!」"
2424 = "「Cũng có thể nói là vậy ạ――――ơ kìa」"
2425 = "「Không phải gửi cho Sou-chan đâu.\\nGửi cho bé Hika đó」"
2426 = "「Làm sao mà không vui cho được chứ!!」"
2427 = "「Đứa bé này á!\\nLà D53 của Đường sắt Hikari đó~」"
2429 = "「Thế thì gay go rồi.\\nChắc Hachiroku cũng——」"
2430 = "「Khá tốt ạ. Sau khi xúc than lên xẻng,\\ncháu hãy xoay người và đưa than qua miệng lò nhé」"
2431 = "「Và còn nữa!」"
2432 = "「Nếu vậy thì, ờm——\\nA! Chị Mayami!!」"
2436 = "「Vậy, thấy sao nào? Ba có vui không?」"
2438 = "「Nếu vậy! Cứ để em lo!!\\nNói về xúc than thì em là người giỏi nhất Ohimitera đó nha!!」"
2441 = "「Vậy chị đọc nhé\\n『Gửi bé Migita Hikari』」"
2445 = "「Vậy thì, chúng ta bắt đầu thôi nào」"
2446 = "「Vậy thì, chúng ta bắt đầu bài tập xúc than thôi nào」"
2447 = "「Vậy, đi thôi nào.\\nĐến Yui, và xa hơn thế nữa.」"
2449 = "「Vậy thì, kể tớ nghe đi. Tớ muốn nghe」"
2450 = "「Vậy, xẻng đầu tiên nào」"
2451 = "「Bây giờ cô sẽ giải thích về bài tập xúc than.\\nTrước tiên là Hikari. Cháu đứng ở đây nhé」"
2452 = "「Tiếp theo đây, xin mời đại diện cựu học sinh các khóa, Migita——」"
2456 = "「Xong rồi đây~, ủa——\\nHể!? Sao tự dưng lại dạy kỹ thuật cao siêu thế kia~!?」"
2457 = "「Đầu tiên là búa!」"
2459 = "「Bắt đầu thôi~!」"
2462 = "「Anh hai? Chỗ này, chỗ này nè」"
2464 = "「Aburakataburayasaimashimashi~\\nBé Hikari chắc chắn sẽ không sao đâu!!」"
2465 = "「——Dù lúc đó không hiểu ngay lập tức.\\nNhưng Hikari chắc chắn đã tiếp nhận được」"
2466 = "「Anh Soutetsu, Hikari, Reina, và cả em nữa.\\nTất cả chúng ta nhất định, sẽ mãi mãi bên nhau!」"
2467 = "「Ngài Soutetsu」"
2468 = "「Đến cái tương lai xa xôi khi ngài Soutetsu ra đi, thì tôi, và cả đứa bé 8620 này,\\ncó lẽ cũng đã đến lúc kết thúc sinh mệnh của một món đồ vật rồi」"
2469 = "「——Đường ray mà ngài Soutetsu đang kéo dài,\\nchắc chắn sẽ được Hikari kế thừa」"
2470 = "「Máy dọn tuyết!\\nRa vậy, Đường sắt Hikari là tuyến đường sắt chạy ở xứ tuyết nhỉ」"
2477 = "「Ok! Vậy đổi chỗ đi! Hachiroku, thay người!\\nCách sử dụng cổ tay, cứ để em dạy cho!」"
2667 = "Không chỉ có thế.\\nKhông, a——đây, là——"
2668 = "Thậm chí có lẽ, dù tìm khắp thế giới cũng không có.\\nNếu vậy, đây là——"
2671 = "Quả không hổ danh Kisaki.\\nChỉ trong khoảnh khắc đó, cô ấy đã hoàn toàn hiểu được ý đồ của chúng tôi."
2672 = "Những người đã liên tục hỗ trợ sự tồn tại của Đường sắt Ohimitera,\\nchắc chắn là các học sinh đi lại của Học viện Yui."
2674 = "Không biết con bé có hiểu ý nghĩa hay không,\\nnhưng Hikari cũng bắt chước, thè lưỡi ra."
2677 = "Không sao đâu——\\nNếu là tôi của hiện tại thì có thể đáp lại được."
2679 = "Không, không phải. Tôi dù sao cũng đã là một lái tàu dày dạn kinh nghiệm.\\nHơn nữa, còn là lái tàu do đích thân Hachiroku đào tạo."
2690 = "Hôm nay, kỷ niệm 80 năm, các học sinh và hiệu trưởng\\nsẽ lên chuyến tàu kỷ niệm——"
2694 = "Nhưng không hiểu sao, lại có chút gì đó phảng phất nỗi buồn."
2696 = "Nhưng dù vậy, vẫn có sự chênh lệch.\\nVề độ đều đặn và đẹp mắt khi xúc than, không ai có thể sánh bằng Hibiki."
2697 = "Nhưng tất nhiên, mọi chuyện không hề dễ dàng như vậy.\\nQuạ, sẻ, cá killi, ốc sên——"
2699 = "Dù vậy, quả nhiên vẫn không được suôn sẻ.\\nThấy than bị rơi vãi, Hikari thốt lên một tiếng kêu nhỏ."
2717 = "Tiếng bước chân điềm tĩnh. Cửa kéo mở ra nhẹ nhàng.\\n——Là chị Mayami."
2720 = "Vừa thong thả nói,\\nHikari cũng đeo balo lên và đứng dậy——"
2722 = "Sự ngăn nắp thừa hưởng từ Paulette\\nđã khiến những động tác của Hikari thêm phần lúng túng."
2724 = "Hikari vội vàng quay lại vị trí cũ,\\ncất gọn chiếc xẻng làm vườn và đứng nghiêm."
2726 = "Trên tay con bé là một chiếc xẻng nhỏ dùng thay cho xẻng xúc than——xẻng làm vườn.\\nVì dù nghĩ thế nào thì 1kg cũng là quá nặng đối với một đứa trẻ bốn tuổi."
2727 = "Bỏ lại hiệu trưởng phía sau, chạy thẳng một mạch,\\nHikari nhào vào vòng tay của Paulette."
2730 = "Dù cho thực tế Hikari đã vài lần từ chối,\\nhọ vẫn không ngại việc bị khước từ một cách bất ngờ."
2732 = "Nhỏ xíu, chậm chạp.\\nNhưng Hikari đã thực sự gật đầu."
2734 = "Hikari đột nhiên đứng khựng lại.\\nCảnh tượng mà tôi đã thấy không biết bao nhiêu lần."
2736 = "Cánh mũi Hikari phồng lên.\\nHai gò má ửng đỏ."
2737 = "Hikari ngoan ngoãn ngồi lên đùi chị Mayami."
2739 = "Hikari thẳng lưng đứng nghiêm trang.\\nĐây là thành quả từ sự hướng dẫn của Hachiroku."
2740 = "Thừa hưởng sự ngăn nắp từ Paulette,\\nHikari bỏ balo xuống và lấy toàn bộ đồ bên trong ra."
2743 = "Trước mặt Hikari đang nghiêng đầu thắc mắc,\\ntôi đưa ra và cho con bé xem một phong bì dễ thương dành cho bé gái."
2745 = "Hikari nao núng.\\nCũng là điều hết sức bình thường thôi."
2747 = "Dù Hikari có thể đọc được các con số,\\nnhưng nếu vừa làm một công việc phức tạp vừa đọc số thì con bé dễ bị nhầm lẫn."
2750 = "Dưới ánh mắt hiền từ của Hachiroku,\\nHikari đang trừng mắt nhìn đống than."
2752 = "Gật đầu.\\nHachiroku trông thật hạnh phúc."
2754 = "Hachiroku mỉm cười rạng rỡ, cất giọng thật lớn."
2756 = "Hachiroku chỉ vào đống than.\\nHikari cũng lập tức cử động cơ thể."
2757 = "Trước những cảm khái sâu sắc của Hachiroku,\\ntrái tim và cả những ký ức của tôi cũng bị lay động."
2759 = "Ánh mắt Hachiroku nhìn tôi chằm chằm.\\nSau đó, chuyển sang Hibiki, rồi đến Hikari."
2763 = "Chỉ thị của Hachiroku và tính cách của bản thân——\\nNhững yêu cầu trái ngược nhau đã khiến Hikari đơ người ra."
2764 = "Giọng nói của Hachiroku dẫn dắt ánh nhìn của Hikari."
2765 = "Ánh mắt Hachiroku quay trở lại nhìn tôi.\\nKhuôn mặt lộ rõ vẻ ngạc nhiên,"
2767 = "Phù, Hachiroku khẽ thở hắt ra."
2769 = "Ánh mắt Hachiroku dịu lại,\\nnhưng ngay khoảnh khắc tiếp theo, lại trở nên nghiêm nghị."
2777 = "Đầu máy chở hàng của Đường sắt Hoàng gia cũ đã kết thúc ở D51, D52,\\nvà các mẫu cải tiến tương ứng là D61, D62."
2778 = "Vừa bước chân vào nhà Migita,\\nnhững giọng nói vui tươi đã chào đón tôi."
2781 = "Cho dù đường sắt có phục sinh và phát triển đi chăng nữa, thì xu hướng chủ đạo vẫn sẽ là tàu điện và toa xe tự hành.\\nViệc chế tạo mới đầu máy hơi nước trên thực tế là rất khó khăn, nhưng mà——"
2794 = "Chỉ cần có đường ray là ổn.\\nHikari nhất định sẽ chạy trên đó."
2797 = "Làm tốt thì khen ngợi.\\nNếu không làm được thì bình tĩnh chỉ ra nguyên nhân."
2799 = "Có lẽ vì thế mà chỉ với một câu nói,\\nđộng tác của Hikari đã cải thiện rõ rệt ngay tức thì."
2801 = "Có lẽ giọng nói dịu dàng đã làm con bé an tâm, hoặc có lẽ con bé đã gạt bỏ được sự rụt rè\\ngiọng của Hikari trở nên lớn hơn."
2821 = "Phía bên kia chiếc vòng\\nlà một chiếc khay phẳng, khá lớn dùng làm buồng lửa giả."
2822 = "A, là cộng cảm sao.\\nTrước khi tôi kịp suy nghĩ, động tác của Hikari đã dừng lại."
2827 = "Việc vắng mặt ở buổi họp sáng nay do phải chuẩn bị cho bài tập xúc than của Hikari\\nvà lịch làm việc, cũng đã dẫn đến kết quả tồi tệ nhất."
2829 = "Than chất thành đống trên chiếc xẻng làm vườn.\\nHikari trở nên thận trọng để không làm rơi vãi than."
2831 = "Vì chỉ mới một thời gian ngắn trước đây thôi,\\ncon bé còn không thể tặng hoa cho chính mẹ ruột của mình mà."
2833 = "Cho đến khi chúng tôi đến,\\nchắc Kisaki đã cố kéo dài bài phát biểu."
2835 = "Dựa trên lời giải thích của tôi, Hachiroku đã lồng ghép khéo léo các hình vẽ vào.\\nThế này thì Hikari có thể hoàn toàn tập trung mà không hề bối rối."
2836 = "Đứng trước buồng lái KiHa 07S, xa hơn cả hiệu trưởng,\\nPaulette và Reina không hề nhận ra sự bất thường của chúng tôi."
2841 = "Chỉ ngay khoảnh khắc này, lúc này đây, không hề thay đổi so với ngày hôm ấy,\\nđang nhìn tôi――chỉ nhìn mỗi mình tôi."
2842 = "Trên máy tập xúc than thật, người tập phải vừa dùng tay trái kéo xích,\\nvừa dùng tay phải cầm xẻng xúc than."
2844 = "Trong lúc kể, a, ra là vậy,\\ntôi cũng tự xâu chuỗi lại được mọi thứ."
2849 = "Vẻ ngạc nhiên dần tan biến trong tĩnh lặng.\\nChậm rãi, chuyển thành một khuôn mặt vô cùng dịu dàng."
2850 = "Con bé đã hỏi.\\nCon bé đang lo lắng cho tôi."
2853 = "Trông con bé rất vui vẻ.\\nChắc hẳn con bé đã rất mong chờ khoảnh khắc này."
2855 = "Với một giọng nói rất nhỏ và run rẩy.\\nDù vậy, Hikari vẫn đáp lời."
2857 = "Nhìn thấy tôi, chị ấy lộ vẻ nhẹ nhõm,\\nrồi lấy ra một phong thư từ giá cắm thư."
2859 = "Với giọng điệu bình tĩnh, rành rọt, nhưng lại thoảng chút nhẹ nhõm,\\ncô ấy đã hoàn toàn chuẩn bị kết thúc bài phát biểu."
2861 = "Với bộ dạng đó, sau khi bài phát biểu của Kisaki kết thúc thì——"
2863 = "Nụ cười rạng rỡ nở trên môi, ánh mắt khẽ dịch chuyển."
2865 = "Lái tàu và phụ lái tàu. Hiện tại, cả tôi, Hibiki và Nagi\\nđều có thể hoàn thành xuất sắc cả hai vai trò và luân phiên nhau làm."
2867 = "Với một đứa trẻ khóc vì thỏ tuyết bị tan chảy,\\nnếu là Hikari của trước đây, con bé chắc chắn sẽ trốn đi."
2881 = "Đúng rồi.\\nCùng với Mine Treasure, Học viện Jutsu-sen đã hồi sinh từ một ngôi trường bị bỏ hoang."
2887 = "Dù có gọi Hachiroku gửi cộng cảm đi chăng nữa,\\ncũng không giải quyết được tình hình, nhỉ——"
2890 = "Thêm kính ngữ \"cô chủ\" mà bình thường không hay dùng.\\nHachiroku đang mơ về một Hikari đã trưởng thành."
2900 = "Vốn dĩ Đường sắt Ohimitera không có tàu chở hàng chạy,\\nvà đường ray 30kg cũng không thể chịu được chiếc đầu máy có vẻ nặng nề này."
2906 = "Cửa sổ mở ra——quả là một cách diễn đạt chính xác."
2912 = "Đón nhận sức nặng của Hikari một cách mãn nguyện,\\nchị Mayami từ từ mở phong bì họa tiết hoa."
2914 = "Vạt áo khoác bị kéo.\\nQuay lại, là Hikari——!!!"
2916 = "Tôi sẽ không cõng, không chiều chuộng con bé.\\nÍt nhất là trong khoảng một tiếng đồng hồ sắp tới."
2917 = "Lời khen ngợi tự nhiên thốt ra."
2919 = "Kiến thức cũng đã tích lũy được kha khá.\\nCái này…… không phải là vẽ theo một khuôn mẫu nào cả."
2922 = "Tôi cũng chạy ùa tới."
2924 = "Bức thư mà Paulette nhận được cùng với cơm nắm lúc trả phòng\\nlà thư gửi cho Hikari."
2926 = "Tôi và Hachiroku đã say sưa chuẩn bị đủ thứ\\ncũng là để đáp lại mong muốn của Hikari."
2928 = "Vốn dĩ tôi cũng chẳng có vai trò gì đặc biệt trong buổi lễ——\\nDo đó, đã tạo ra một điểm mù."
2929 = "Tôi khẽ đẩy lưng con bé. Chứa chan niềm hy vọng và sự tin tưởng.\\nHikari chậm rãi bước đi."
2933 = "Tôi không thể nghĩ ra lý do.\\nChính vì không nghĩ ra nên tôi mới phải vắt óc suy nghĩ."
2935 = "Tôi chỉ thấy thật vững tâm.\\nVà, đó là một điều vô cùng hạnh phúc."
2936 = "Có vẻ như cô ấy đang mỉm cười,\\ncũng có vẻ như cô ấy vừa buông một tiếng thở dài nhè nhẹ."
2939 = "Tôi trao bó hoa vào vòng tay Hikari, để con bé ôm lấy.\\nNgay lập tức, Kisaki quay sang hiệu trưởng."
2942 = "Tôi xoa đầu, con bé nheo mắt lại vẻ thoải mái."
2944 = "Khi đã hiểu ra và bình tĩnh lại, tôi hoàn toàn bị thuyết phục."
2946 = "Tôi nhìn vào mắt Hikari. Nhìn chằm chằm.\\nKết nối——đường ray giữa ý nghĩa và hành động."
2948 = "Khi tôi giải thích ngắn gọn tình hình, Hibiki à lên một tiếng rồi gật đầu thật mạnh."
2950 = "Tôi ôm trọn lấy cả Hikari và Reina vào lòng.\\nCảm nhận được hơi ấm. Cảm nhận được sự gắn kết. ――Của gia đình chúng tôi."
2951 = "Vào trong khung cảnh hạnh phúc đó.\\nVào trong vòng tay của, gia đình tôi."
2952 = "Có lẽ vì bản thân Hibiki cũng sở hữu \"cửa sổ\" đó,\\nnên mới thốt ra được cách diễn đạt ấy."
2954 = "Vì thế, tôi nói cho con bé nghe.\\nÝ nghĩa của hành động mà tôi mong muốn ở Hikari."
2957 = "Vì thế tôi sẽ chỉ ra. Một cách thật đơn giản.\\nĐường ray kết nối trực tiếp giữa hành động và ý nghĩa."
2959 = "Do đó, Hikari đã vừa học chữ từ Paulette\\nvừa cố gắng hết sức viết thư trả lời rồi gửi đi."
2961 = "Vì vậy, trên chiếc khay được chia làm chín ô,\\nHibiki đã vẽ hình các loài động vật lên từng ô."
2963 = "Những hình vẽ động vật trên chiếc khay được chia làm chín ô.\\nTôi cứ tưởng phải sau này mới dùng đến, nhưng mà——"
2965 = "Nghĩ vậy, lời nói tuôn ra một cách tự nhiên."
2966 = "Tôi lại kể cho Hachiroku nghe về những kỷ niệm\\nmà tôi chưa từng kể chi tiết trước đây."
2968 = "Vậy thì tôi sẽ dùng hết sức mình, để kéo dài và kết nối những tuyến đường ray ấy."
2981 = "Vẻ mặt Hibiki đầy thích thú.\\nCon bé cười tủm tỉm chỉ vào bản vẽ thiết kế D53——!!"
2985 = "Cười toe toét, Hibiki chỉ tay lên bàn.\\nThứ được đặt trên đó là một cuốn sổ vẽ——"
2986 = "Hibiki nhìn chị Mayami với ánh mắt đầy đắc thắng."
2988 = "Vừa quay lại sau khi kiểm tra bảo dưỡng 8620 xong,\\nHibiki đã thốt lên một tiếng ngạc nhiên."
2990 = "Hibiki và Hikari dành rất nhiều thời gian ở bên nhau."
2992 = "Liếc nhìn Hibiki đang ôm đầu tiếc nuối,\\nchị Mayami nở nụ cười rạng rỡ chìa tay ra."
3001 = "Hiệu trưởng mỉm cười nhìn theo bóng dáng của Hikari.\\nHikari chậm rãi, từng bước một, tiến lại gần hiệu trưởng."
3002 = "Hiệu trưởng ngồi xổm xuống,\\nnhận lấy bó hoa từ tay Hikari."
3003 = "Được xoa đầu, Hikari nở một nụ cười rạng rỡ."
3021 = "Paulette tinh nghịch thè lưỡi."
3022 = "Paulette ôm chặt lấy Hikari.\\nÔm chặt lấy và liên tục cọ má vào con bé."
3023 = "Ôm chặt Hikari vào lòng,\\nPaulette khẽ thì thầm với tôi."
3031 = "Fukami dúi bó hoa vào tay tôi.\\nCảm giác hoảng hốt của con bé lây sang cả tôi."
3034 = "Fukami ôm lấy hai má Hikari bằng cả hai tay."
3038 = "Nhìn sang Hikari, nhìn sang Reina.\\nMột cách dịu dàng, dịu dàng, đầy yêu thương."
3041 = "Để an ủi Hikari đang khóc,\\nnhững người xa lạ không quen không biết đã thể hiện lòng tốt của mình."
3042 = "Để đưa tiễn hiệu trưởng và những người bên Yui,\\nchúng tôi sẽ tiếp tục thực hiện nhiệm vụ chạy thêm một vòng nữa."
3043 = "Để cùng tồn tại với Yui, trường đã trở thành một học viện chuyên về khối thương mại và công nghiệp,\\ncả Nagi và Fukami đều chọn theo học ở đó."
3046 = "Sau đó kẹp bức thư nhận từ chị Mayami vào cuốn truyện tranh,\\nrồi lại cẩn thận cất gọn gàng vào trong balo."
3047 = "Chờ đợi, im lặng, im lặng quan sát——\\nđể đảm bảo bản thân không bị cuốn vào chuyện đó dù chỉ là nhầm lẫn."
3049 = "Phía bên kia đống than, đối diện với Hikari là một chiếc vòng lắc eo được dựng đứng.\\nCái này dùng để thay thế cho miệng lò."
3053 = "Thời kỳ phản nghịch thì còn quá sớm, chắc chắn phải có lý do gì đó\\n——Nếu không thì tôi sẽ đau lòng lắm đấy."
3054 = "Hikari bây giờ, chắc chắn có thể làm được.\\nVì hoàn toàn tin tưởng, nên tôi không hề do dự."
3058 = "Nhìn tên người gửi, tôi đã hiểu."
3062 = "Hikari lập tức đặt bút sáp màu xuống và nhảy cẫng lên."
3071 = "Quay lại nhìn chúng tôi, Kisaki chợt khựng lại.\\nĐôi mắt đảo quanh tìm kiếm Hibiki."
3076 = "Kisaki đang ở trên sân ga.\\nCô ấy mặc vest, đứng trên bục và đang phát biểu."
3082 = "Trước câu trả lời đầy năng lượng của Hikari,\\nchị Mayami cũng mỉm cười."
3083 = "Kể từ khi đi Naruko về,\\nHikari đã bắt đầu nhận ra được sức hấp dẫn của hơi khói."
3092 = "Lời từ chối ngay tức khắc.\\nTrong thoáng chốc, chân tôi lảo đảo."
3096 = "Ánh mắt chực khóc và ánh mắt vô cùng bối rối đang cầu cứu tôi.\\nVì thế, tôi chậm rãi gật đầu thật mạnh."
3102 = "Vừa nói ra, tôi liền sực nhớ.\\nTôi và Hibiki nhìn thẳng vào mắt nhau."
3103 = "Nói rồi, Hachiroku nở một nụ cười nhẹ nhàng."
3113 = "Quá phức tạp và đòi hỏi quá nhiều sức lực đối với một đứa trẻ bốn tuổi.\\nVì vậy, chúng tôi đã đơn giản hóa đi rất nhiều rồi, nhưng mà——"
3114 = "Phương pháp hướng dẫn vô cùng đơn giản và rõ ràng của Hachiroku\\ncó vẻ không chỉ phù hợp với tôi mà còn phù hợp với cả Hikari."
3115 = "Tại sao lại như vậy?\\nVì hành động và nhận thức chưa được liên kết tốt với nhau."
3118 = "Nhanh hơn cả lúc tôi định nói 『Muốn nhờ Hibiki hoặc chị Mayami』,\\nhai người họ làm vẻ mặt nghiêm trọng, nắm chặt tay thành nắm đấm."
3119 = "Chưa kịp ngăn lại, Nagi đã chạy đi với tốc độ tối đa.\\nNhưng Hibiki bây giờ cũng đang mặc trang phục làm việc, dính đầy bụi than giống như tôi."
3121 = "Đôi mắt xanh biếc, chăm chú nhìn tôi.\\nGiống hệt như ngày hôm ấy."
3124 = "Hikari cũng dính đầy than,\\nnhưng nếu là Hikari, thì bộ dạng đó cũng mang ý nghĩa không hề thất lễ."
3125 = "Dù đã hiểu rõ đến mức đó,\\nnhưng con bé vẫn khuất phục trước ham muốn nội tâm."
3126 = "Dù miệng lò có rộng đến đâu thì việc xúc than vào bốn góc buồng lửa\\ncũng không dễ gì mà làm suôn sẻ được."
3158 = "（Cố lên, Hikari――）"
3160 = "（Bạch!）"
3161 = "（Rào rào!）"
3162 = "（Píp!!）"
3164 = "（Chắc Paulette và Reina nằm mơ cũng không nghĩ\\nlà tôi lại nhầm lẫn như vậy）"
3165 = "（Giật giật）"
3166 = "（Rào rào）"
3168 = "（Xộp——rào rào!）"
3170 = "（Xộp!——Rào rào!）"
3172 = "（Rơi lả tả）"

[selections]
