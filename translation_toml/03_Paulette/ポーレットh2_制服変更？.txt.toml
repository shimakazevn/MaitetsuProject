929 = "「Hya——á! Ưm——phuê——phuya.」"
931 = "「Hya——ưm——tử cung——bị đâm, phập——vào——a.」"
932 = "「Hya——ưm——âm, đạo——đang được dọn dẹp—— phá——dọn dẹp, cẩn thận quá——đừng, mà.」"
935 = "「Á——nhấn cả——quần lót vào——sao——!?」"
