990 = "「A... nhưng mà. Đợi em một chút nhé, một chút thôi.」"
991 = "「A... hia... á——phá——á——á——a.」"
992 = "「A... phù——á――――hà——hà——」"
993 = "「A... oa... người em, nhão nhoét hết rồi——」"
995 = "「A... ưm——Soutetsu, này——」"
997 = "「A... Sàn nhà, các thứ——phải dọn dẹp, thôi.」"
999 = "「Á... ngón tay——cọ cọ, này——ưm——hà, âm đạo——như đang bị——trêu chọc——khi cọ xát——vậy.」"
1000 = "「A... Soutetsu, này——nhé—— trực tiếp... ngực đi anh.」"
1001 = "「A... Soutetsu, này——Soutetsu.」"
1002 = "「A.」"
