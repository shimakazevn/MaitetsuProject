[script]
715 = "「...Ẩm thực gia đình đúng là tuyệt thật đấy.」"
878 = "「Không đâu. Thế thì phí lắm. Vì nó tiện dụng thế này cơ mà.」"
880 = "「Không được——em——tè dầm——không được đâu—— Đã là người lớn, rồi mà——em lại——tè dầm mất.」"
882 = "「Để anh phải đợi rồi.」"
883 = "「Cũng không to tát đến mức gọi là ẩm thực Pháp đâu ạ——」"
886 = "「Món hôm nay là ẩm thực Pháp sao? Cảm giác hơi giống món bò hầm một chút.」"
889 = "「Nhưng mà... trực giác mách bảo em đó có thể là một ý tưởng hay. Vừa ít tốn kém, lại có thể quảng bá cho Đường sắt Ohimitera mới... có lẽ vậy.」"
891 = "「Nhưng, thực tế là anh đang——」"
894 = "「Em không có gì phải xin lỗi cả. Đây là phòng của Paulette mà, nếu phải dọn dẹp thì anh cũng sẽ giúp một tay.」"
896 = "「Paulette giỏi quyến rũ thật đấy.」"
897 = "「Hỏi thì chắc họ sẽ chỉ cho thôi. Dù là chị Mayami hay Hibiki thì cũng――――hửm.」"
900 = "「Soutetsu thích món ăn gia đình nào vậy?」"
901 = "「Âm đạo cũng đã hoàn toàn tan chảy rồi.」"
903 = "「Nếu thấy xấu hổ, em cứ nhắm mắt lại là được.」"
909 = "「Một chút——nữa thôi——hự——á—— Nếu ra——, thì cùng nhau——」"
913 = "「Em nghĩ đồng phục ở một mức độ nào đó sẽ nhấn mạnh sự khác biệt giới tính. Nhưng mà, bộ này cũng không đến mức đặc biệt khủng khiếp đâu ạ.」"
923 = "「Nhưng mà——nhưng mà——em——em—— á——fuaaaaaaaaaaan!」"
925 = "「May quá. Hợp khẩu vị của Soutetsu là tốt rồi.」"
