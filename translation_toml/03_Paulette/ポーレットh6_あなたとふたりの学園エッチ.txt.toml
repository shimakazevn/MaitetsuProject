1248 = "Dù nụ hôn đã khiến cả hai hòa quyện vào nhau, âm đạo vẫn càng thêm căng mọng, vừa bám chặt vừa cựa quậy."
1249 = "Vừa hôn nhau, vừa trao đổi nước bọt và mồ hôi, cơ thể ướt át vẫn không ngừng chuyển động nhịp nhàng."
1250 = "Một lúc sau, nụ hôn từ từ tách ra. Tôi liếm đi giọt nước bọt lấp lánh vương lại."
1251 = "Hai lồng ngực dán sát vào nhau, nhịp tim của cả hai vang vọng cộng hưởng."
1253 = "Chỉ là phần bề nổi nhất thôi. Nhưng khi nói ra, những lời tiếp theo sẽ tự khắc tuôn trào."
1255 = "Bất chợt, tôi ngộ ra. Không——là Paulette đang dùng làn da và nước bọt để truyền đạt cho tôi."
1256 = "Những bóng người tụ tập sau khi tan học mà không chịu về."
1259 = "Muốn chạm vào. Muốn tiến lại gần hơn nữa. Suy nghĩ ấy lập tức hóa thành chuyển động của lòng bàn tay, của những ngón tay."
1260 = "Dù tôi có từ từ kéo hông lại rồi đâm tới, Paulette lại có vẻ như đang buồn buồn nhột nhột."
1263 = "Tôi đỡ lấy eo cô ấy. Nhưng không hề kéo xuống."
1265 = "Phó mặc mọi thứ cho Paulette——"
1266 = "Bế thốc em lên, rồi cứ thế để em ngồi lại trên người tôi."
1268 = "Mỗi lần quy đầu thúc vào tử cung, âm đạo lại siết chặt lại."
1271 = "Dồn hết sức đẩy hông tới, đúng lúc đó Paulette cũng giật nảy mình run rẩy——!?"
1272 = "Chỉ cần dùng đầu ngón tay ấn cực kỳ nhẹ lên núm vú, giọng nói ngọt ngào cùng làn da căng mịn đã đáp lại tôi bằng một phản ứng đầy thỏa mãn."
1274 = "Chiếc khăn quàng bọc lấy dương vật của tôi. Cứ thế, nó bị kẹp chặt giữa đôi gò bồng đảo của Paulette."
1277 = "Hông không thể cử động tự do. Chỉ có thể ngọ nguậy, cựa quậy một cách thảm hại."
1279 = "Hông tôi run rẩy. Tự động râm ran, tự động cử động."
1280 = "Đầu dương vật cương cứng của tôi, vẫn được quấn trong chiếc khăn, theo đà đâm sầm vào môi Paulette."
1282 = "Tôi có thể cảm nhận rõ ràng, Paulette sắp lên đỉnh rồi. Nên——"
1285 = "Lời phủ nhận thốt ra nghe thật yếu ớt, đến chính tôi cũng phải thừa nhận. Yếu ớt đến mức chẳng thể cản nổi những ngón tay mảnh khảnh của Paulette."
1286 = "Thật vui sướng. Thật ấm áp. Cảm giác như kim đồng hồ rỉ sét bấy lâu đã bắt đầu nhúc nhích."
1288 = "Nếu vậy, bối cảnh tình huống cũng nên điều chỉnh sao cho phù hợp nhất có thể."
1290 = "Nên tôi hôn ngọt ngào lên tử cung, để nói cho nó biết tôi là ai——!?"
1292 = "Muốn em ấy an tâm, muốn em ấy mạnh dạn hơn, nên tôi bất giác nói nhanh hơn một chút."
1295 = "Nhờ vậy mà dương vật càng thêm cuồng bạo, bàn tay của Paulette cũng ngày càng ướt át bởi mồ hôi và dâm thủy——"
1312 = "Thình thịch, thình thịch——Một dòng ấm áp tràn ngập cơ thể, nhanh chóng khôi phục lại dương vật vừa mới xuất tinh xong."
1313 = "Cứ thế cho đến khi đêm buông xuống. Kể cả khi đêm đã buông. Chúng tôi tiếp tục chơi đùa——trong giờ tan trường này."
1316 = "Ngay lập tức, trái tim. Cảm xúc hòa làm một. Tuyệt đẹp hòa quyện vào nhau."
1318 = "Chiếc khăn quàng dần thấm ướt. Hương thơm da thịt tỏa lên ngây ngất. Và nhịp đập——nhịp tim của hai chúng tôi, đang hòa quyện vào nhau."
1345 = "Eo của Paulette cũng đang uốn éo. Chỉ một lòng đòi hỏi khoái cảm, siết chặt lấy dương vật của tôi mà tuốt."
1346 = "Có lẽ thấy nó trông có vẻ cô đơn, Paulette cất giọng đầy âu yếm."
1347 = "Paulette chẳng mảy may để tâm đến điều đó, chỉ một mực làm nũng tôi bằng những nụ hôn——hôn để chiều chuộng tôi."
1348 = "Hà, thở ra một hơi gấp gáp, Paulette lắc đầu nguầy nguậy."
1349 = "Đôi mắt nheo lại đầy vẻ thích thú. Cổ họng trắng ngần khẽ nuốt nước bọt."
1350 = "Như đang trêu chọc. Như đang đùa giỡn. Bên trên dương vật đang cương cứng của tôi, Paulette nhảy một điệu nhảy đầy dâm đãng."
1351 = "Màu hồng. Làn da. Rực rỡ làm sao. Đã hoàn toàn chín muồi, Paulette đã bị nhuộm kín."
1352 = "Hông Paulette chợt nâng lên. Sức nóng và lực siết từ vòng tay đang quàng qua cổ tôi tăng lên đôi chút."
1353 = "Âm đạo vốn dĩ đã vô cùng đầy đặn của Paulette, có lẽ vì bất ngờ trước sự thâm nhập đột ngột này——"
1354 = "Chiếc lưỡi nóng bỏng giày vò không sót một ngóc ngách nào trong khoang miệng tôi, Paulette, và cả tôi, tiếp tục thăng hoa không ngừng nghỉ."
1355 = "Để mang lại khoái cảm mạnh mẽ hơn cho tôi. Và đồng thời, cũng là để tăng cường cảm giác nhục dục cho chính mình."
1356 = "Đôi mắt Paulette, đôi mắt dịu dàng ấy—— Bắt lấy ánh nhìn của tôi, rồi chợt mềm mại đi."
1357 = "Bằng đôi môi ấy của Paulette, bằng chiếc miệng nhỏ bé đáng yêu thậm chí từng không dám nói từ 'dương vật'."
1358 = "Một sự thật giản đơn như vậy, lại được giọng nói của Paulette, người đang thở dốc với khuôn mặt như muốn tan chảy, dạy cho tôi biết."
1359 = "Như đang làm nũng, Paulette cọ nhẹ chóp mũi cô ấy vào chóp mũi tôi trong chốc lát."
1360 = "Giọng nói the thé nghèn nghẹt ở mũi. Âm thanh ấy cù lét màng nhĩ, khiến hông tôi tự động tăng tốc."
1361 = "Tay Paulette dẫn lối cho dương vật cương cứng của tôi."
1362 = "Chầm chậm. Hông Paulette ngọ nguậy. Áp dương vật của tôi vào háng, rồi nhắm nghiền đôi mắt lại."
1363 = "Để mồ hôi và mùi hương của Paulette thấm vào tôi, để hơi nóng và chuyển động của tôi thẩm thấu vào Paulette."
1364 = "Được ôm chặt, tất cả, tuôn trào vào tôi—— Vì thế tôi cũng vậy! Giải phóng toàn bộ bản thân không chút giấu giếm!"
1365 = "Mỗi lần bầu ngực căng tròn của Paulette mềm mại biến dạng, cảm giác từ làn da và chiếc khăn quàng lại kéo tinh dịch của tôi dâng trào."
1366 = "Như điểm xuyết màu sắc vào ký ức đơn sắc của tôi, Paulette đã hòa mình vào khung cảnh ấy."
1377 = "Sau đó, cái miệng đáng yêu hé mở. Như muốn khoe khoang rằng em đã nuốt hết rồi, hãy khen em đi——!"
1378 = "Rồi lại hôn. Hôn. Hôn. Hôn."
1379 = "Và rồi, bàn tay vốn chỉ kẹp ngực của Paulette——"
1380 = "Không để sót lại chút nào. Dùng lưỡi và môi như vắt kiệt, cẩn thận, cẩn thận hút cạn sạch——"
1381 = "Nhưng ngay lập tức, như thể không làm vậy thì không thể thở được."
1384 = "Dù là vậy——"
1393 = "Mùi hương cơ thể ngọt ngào xộc từ mũi lên não, vắt kiệt chút lý trí sâu thẳm nhất trong tôi."
1395 = "Nhìn vẻ đáng yêu đỏ bừng mặt thở hổn hển của em, trái tim tôi chỉ tràn ngập hạnh phúc và lòng tham vô đáy."
1399 = "Chắc là do hiệu ứng của bộ đồng phục học sinh nhỉ? Paulette cúi gằm mặt ngượng ngùng hơn hẳn mọi khi."
1401 = "Lần xuất tinh thứ hai khiến bạch trọc trào ra từ chỗ kết nối. Nó rơi xuống ghế, rỏ xuống sàn——"
1405 = "Tinh dịch không bắn vào sâu trong cổ họng Paulette."
1408 = "Tiếng nuốt nước bọt cái 'ực' rõ to. Chẳng biết là của tôi, hay của Paulette nữa."
1410 = "Xuyên thủng trong một hơi. Quy đầu của tôi cọ sát vào tận sâu bên trong Paulette."
1412 = "Dương vật cương cứng bị xoa nắn giữa khe hẹp ấy, thế nhưng, một thứ ấm áp và chân thực——"
1435 = "——Không biết do an tâm hay vui sướng trước sự đáp lại của tôi. Âm đạo càng cựa quậy ngọt ngào hơn, nhào nặn toàn bộ dương vật."
1437 = "——Nó bám chặt đến mức chèn ép cả dương vật của tôi, bằng sự co bóp đó, nó như đang dò xét, tra hỏi xem tôi là ai."
1439 = "Thứ được bao bọc, được kẹp chặt, không chỉ có dương vật cương cứng. Cảm giác như toàn bộ con người tôi đang được bầu ngực ấy ôm trọn vậy."
1449 = "Dù chỉ là một chấn động rung lắc vô cùng nhỏ, cũng được khuếch đại lên gấp hàng trăm lần, xông lên tận đỉnh đầu."
1456 = "Từ ngữ đó, mỗi khi da thịt kề nhau, tôi đã nghe Paulette nói đi nói lại không biết bao nhiêu lần."
1457 = "Cuộc sống học đường lần đầu tiên được nếm trải. Giờ tan trường lần đầu tiên được trải nghiệm."
1458 = "Không thể nào để nó kết thúc chóng vánh như vậy được."
1459 = "Nếu vậy, cứ thế này—— Để toàn bộ cơ thể dính chặt vào nhau, cứ kết nối thế này——"
1462 = "Vừa được đưa ra khỏi quần, dương vật cương cứng liền khẽ rung lên."
1464 = "Mỗi khi bầu ngực, khi hông chuyển động, mồ hôi lại ròng rốc tuôn rơi, tụ lại nơi khe ngực căng đầy."
1466 = "Chiếc khăn quàng cổ giờ đây đã nhuốm màu đỏ thẫm, tựa như lá phong đẫm mình trong cơn mưa thu."
1467 = "Chiếc khăn vốn đã thấm đẫm chất nhờn rỉ ra từ tôi, nay lại càng ướt sũng, dính chặt lấy quy đầu không chừa kẽ hở."
1470 = "——Sắp rồi. Từ làn da đan xen, từ chiếc lưỡi, từ bộ phận sinh dục đang kết nối với nhau."
1476 = "Ở ngay phía trước, ngay trước quy đầu, đã bị sự mềm mại của chiếc khăn quàng chặn lại——"
1541 = "（Phậppppppp!!!）"
1542 = "（Ngoạm!）"
1543 = "（Múttttttttttt）"
1544 = "（Ồ——ồ——）"
1546 = "（Nhóp nhép! Siết! Siết chặt! Nhóp nhép!）"
1547 = "（Chụt）"
1548 = "（Trượt!）"
1550 = "（Phụt——phụt! Phụt! Phụt——）"
1552 = "（Phụt! Phụt! Phụt! Phụt!）"
1554 = "（Phụt! Phụt! Phụt……phụt, phụt……）"
1558 = "（Phụt——phụtttt——phụt! Phụtttt!）"
1559 = "（Phụt! Phụt——phụt……phụt……phụt）"
1560 = "（Phụt! Phụt! Phụtttt! Phụt!!!）"
1561 = "（A a……）"
1565 = "（Bao bọc）"
1566 = "（Siết chặt!!!）"
1567 = "（Co bóp! Co bóp! Siết chặt! Siết chặt!!）"
1571 = "（Trường học là……Lớp học là. Một nơi tràn đầy sức sống đến thế này sao——）"
1572 = "（Phập——phập——phập——phập——phập!）"
1574 = "（Khao khát——Paulette nhiều hơn nữa. Tôi muốn nhuộm đẫm Paulette bằng chính mình nhiều hơn nữa.）"
1575 = "（Nhóp nhép——nhóp——nhóp nhép——nhóp!）"
1577 = "（Siết chặt!!!）"
1578 = "（Rút——ra——）"
1580 = "（Trượttttt——dập!）"
1581 = "（Xèèèèè）"
1584 = "（Ấn nhẹ）"
1586 = "（Trượt——）"
1588 = "（Nắn nắn——xoa xoa——vuốt ve——cọ xát）"
1589 = "（Bóp chặt!）"
1591 = "（Thọc sâu!!!）"
1592 = "（Chỉ với một bộ đồ……mà ấn tượng thay đổi đến thế này sao.）"
1593 = "（Cọ xát）"
1594 = "（Nếu, vậy thì——）"
1597 = "（Nhễ nhạiiiiii）"
1599 = "（Xoa mạnh——véo!）"
1600 = "（Thọc mạnh! Lắc——ưm——mạnh——nhóp nhép）"
1604 = "（Siết! Siết chặt! Trơn tuột! Tuột!）"
1605 = "（Rùng mình!!!）"
1607 = "（Trượt——nhóp nhép! Trơn tuột——xoa nắn!）"
1609 = "（Chạm nhẹ）"
1614 = "（Thế, này——）"
1615 = "（Đây là……cái gọi là sau giờ học sao——）"
1616 = "（Cái này——là……Cảm giác trơn láng của lớp vải, hòa quyện cùng sự mềm mại ẩm ướt của bầu ngực——）"
1617 = "（Thọc mạnh!）"

[selections]
