1174 = "Đôi môi tóm gọn lấy phần quy đầu, chiếc lưỡi ấm áp luồn lách, làm ướt sũng và dán chặt chiếc khăn vào da thịt."
1176 = "——Đôi môi, chiếc lưỡi ngập tràn tình yêu thương, đang vững vàng nâng đỡ trục trung tâm cơ thể tôi."
1179 = "Nhờ vậy mà tôi được tiếp thêm can đảm. Điều có thể làm trong tư thế chông chênh, không thể cử động mạnh này——"
1180 = "Đôi tay cũng không ngơi nghỉ, ép chặt bầu ngực phồn thực vào dương vật tôi, từ từ đẩy tinh dịch trong tinh hoàn trào ngược lên niệu đạo."
