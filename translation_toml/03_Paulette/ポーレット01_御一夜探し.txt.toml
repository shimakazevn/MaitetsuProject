1792 = "「Fukami. Có chuyện gì vậy?」"
1796 = "「Suối nước nóng, chèo thuyền trên sông Kuma và rượu shochu Kuma.\\nChúng ta vẫn luôn dùng những thứ đó để quảng bá du lịch, nhưng...」"
1797 = "「Để đứng lên từ tàn tích của chiến tranh, sao.」"
1800 = "「Vô số tác phẩm nghệ thuật ca ngợi sông Seine, và sông Seine vẫn luôn chảy trôi tuyệt đẹp.\\nEm nghĩ chính sự tích lũy đó đã làm nên danh tiếng của sông Seine.」"
1801 = "「Cùng với sự phát triển của Paris,\\nvô số bài thơ, bài hát, và những bức tranh đã ra đời.」"
1804 = "「Cứ cho là có đi.」"
1805 = "「Và, nhất Hinomoto.」"
1808 = "「Dùng mi để chấn hưng du lịch... sao.」"
1812 = "「\\x%l8620;#00ffc040;8620%l;#; sẽ bắt đầu hoạt động thương mại như một \\x%l列車;#00ffc040;đoàn tàu%l;#; du lịch.\\nSau đó, em định kết nối nó với việc chấn hưng du lịch như thế nào?」"
1813 = "「Tất nhiên không chỉ bảo dưỡng mà còn sơn lại nữa——\\nNội thất cũng sẽ được làm sao cho phù hợp với \\x%l客車;#00ffc040;toa hành khách%l;#; du lịch nhất có thể.」"
1817 = "「Đúng là anh cũng có nghĩ đến việc chấn hưng du lịch.\\nDù đó không phải là tất cả lý do.」"
1819 = "「Hiện tại thì——không có ạ.\\nNếu là quyết định của ngài Soutetsu, tôi sẽ tôn trọng.」"
1820 = "「Hiện tại, Ohito không có đủ sức hấp dẫn để được chọn làm nơi lưu trú,\\nnên chỉ là một điểm dừng chân chớp nhoáng rồi bị bỏ qua... ra là vậy.」"
1822 = "「Có vẻ như việc trở thành nhất Hinomoto về mặt lịch sử là không thể rồi.\\nNhưng——nếu đã có điểm tham quan thì cứ đi xem thử đã.」"
1825 = "「Đáng tin cậy thật đấy.\\nVậy Nagi đại nhân, xin hãy chỉ giáo.」"
1828 = "「Chị Mayami thấy sao?」"
1829 = "「Nếu phải phân loại thì cô thuộc nhóm \\x%l食べ鉄;#00ffc040;người sành ăn trên tàu%l;#;.\\nTuy cô thích tự nấu ăn hơn.」"
1839 = "「Nếu \\x%l8620;#00ffc040;8620%l;#; chạy, sẽ có rất nhiều người muốn đi thử...」"
1845 = "「Paulette thì khác. Em âm thầm ôm đồm mọi việc mà không ai trong chúng ta chịu làm,\\ncộng thêm cả nghĩa vụ của bản thân, và một mình xử lý tất cả.」"
1846 = "「Chị nói nghe nè, Sou-chan. Chị cũng là người Ohito gốc,\\nnên không biết trong mắt người xứ khác, Ohito có điểm gì hấp dẫn đâu nha.」"
1852 = "「Nghệ thuật, sao——」"
1854 = "「Dùng sông... khó lắm nhỉ? Phải nổi tiếng cỡ sông Seine hay sông Nile,\\nthì người ta mới đến xem chăng.」"
1857 = "「Sẽ là một \\x%l列車;#00ffc040;đoàn tàu%l;#; du lịch như thế nào?\\nCô nên làm loại cơm hộp nhà ga nào đây?」"
1859 = "「Nói đến du lịch Ohito, chắc chắn phải là chèo thuyền trên sông Kuma rồi!\\nChúng ta phải đẩy mạnh quảng bá chèo thuyền trên sông Kuma!!」"
1864 = "「Cảm ơn cô! Đây ạ, 350 yên vừa đủ nha!」"
1865 = "「Cảm ơn anh. Trăm sự nhờ anh.\\nEm——rất vui vì đó là anh Soutetsu.」"
1880 = "「Thế nghĩa là...」"
1881 = "「Chắc là——do không đúng lúc thôi. Chắc bây giờ tình cờ,\\nmọi người đều đi đến những điểm tham quan khác rồi chăng?」"
1882 = "「Cái này... ngon thật đấy.\\nCháu vốn không thích ăn đồ ngọt lắm, nhưng mà——」"
1883 = "「Ba thứ đó chắc chắn có sức hấp dẫn riêng.」"
1884 = "「Đây là cô Nagayama Noriko. Là phu nhân của trụ trì chùa ma——\\nà không, chùa Eizan.」"
1885 = "「Đây là người quen của Paulette à?」"
1886 = "「Chuyện đó... nếu là mua sắm hay đi chơi ở đâu thì\\nem có biết, nhưng mà——」"
1887 = "「Cũng phải nhỉ.」"
1888 = "「Cái này, ngon bá cháy bọ chét luôn.」"
1889 = "「Đây được cho là công trình kiến trúc hiện tồn lâu đời nhất ở Ohito.\\nChắc là... được xây dựng cách đây 130 hay 140 năm gì đó.」"
1907 = "「Ơ...?」"
1909 = "「Vậy em thì sao!? Moga moga~」"
1912 = "「Đương nhiên rồi! Bởi vì cô Nagayama,\\ntừng làm việc trên toa ăn của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; cũ mà.」"
1914 = "「Anh là người phù hợp nhất sao?\\nTừ trước đến nay, anh hầu như không có ký ức gì về việc đi tham quan Ohito cả.」"
1915 = "「Vậy thì, hoặc là quảng bá chưa đủ, hoặc là cách quảng bá có vấn đề.」"
1916 = "「Vậy, giả sử chúng ta kiếm được \\x%l客車;#00ffc040;toa hành khách%l;#; rồi——\\nEm đã có kế hoạch chấn hưng du lịch nào tiếp theo chưa?」"
1918 = "「Vậy thì, chỉ còn cách tự đi tìm thôi.\\nNơi có khả năng cao nhất là... khu vực phố thợ rèn chăng?」"
1919 = "「Vậy, cô cũng rành về cơm hộp nhà ga chứ ạ?」"
1920 = "「Vậy là tuần nào cô cũng bán bánh crepe ở đây ạ?」"
1921 = "「Thế thì đi thôi.」"
1922 = "「Vậy làm thế nào để kiếm được \\x%l客車;#00ffc040;toa hành khách%l;#;?」"
1924 = "「Vậy, cô Nagayama cũng là \\x%lまいてつ;#00ffc040;chủ tàu%l;#; ạ?」"
1926 = "「Vậy thì, Paulette. Em cho anh xem lịch trình tuần này được không?\\nAnh muốn tiến hành càng sớm càng tốt.」"
1927 = "「Vậy thì sao nào. Em có muốn cùng anh đi xem thử không?\\nXem làm thế nào để thúc đẩy du lịch Ohito, dưới một góc nhìn mới.」"
1928 = "「Vậy thì, chuyện đó trông cậy vào em nhé.」"
1929 = "「Vậy, về kế hoạch chấn hưng du lịch cụ thể thì...」"
1931 = "「Xưởng tương miso và nước tương của nhà Kamata cũng là một điểm tham quan,\\nvà cả đây nữa——xưởng trà của nhà Sansuien.」"
1936 = "「Ngoài Di tích thành Ohito và bến tàu chèo sông Kuma ra,\\nthì Nhà máy rượu Migita System cũng là một điểm tham quan nhỉ.」"
1938 = "「Dòng sông Kuma hùng vĩ và tuyệt đẹp thật đấy——\\nNhưng chỉ chừng đó thôi thì không đủ để thu hút khách du lịch sao.」"
1940 = "「Ngựa Kiji, nhìn kỹ thì cũng dễ thương đấy——」"
1942 = "「Anh Soutetsu?」"
1943 = "「Có phải là,\\nvì mục đích chấn hưng du lịch không ạ?」"
1945 = "「Trước hết, phải mang đậm chất Ohito.\\nPhải là một hộp cơm truyền tải được sức hấp dẫn của nơi này.」"
1947 = "「!」\\n「——」"
1950 = "「/////!!」"
2101 = "Tình yêu sâu đậm dành cho quê hương thứ hai,\\ntoát ra từ từng câu từng chữ."
2103 = "Nghĩ đến đó, từ dưới chân,\\ncảm giác buồn nôn và ớn lạnh bò dọc lên."
2105 = "Khi nhận ra nỗi sợ hãi của bản thân, sự căng thẳng bỗng dưng tan biến.\\nSự cứng nhắc biến mất, nhường chỗ cho tiếng thở phào nhẹ nhõm và những lời nói hòa quyện vào nhau."
2108 = "Một khi đã bước lên \\x%l運転台;#00ffc040;Buồng lái%l;#;,\\nthì chỉ có thể nhìn thấy một phần rất nhỏ bên trong."
2111 = "Đúng như dự đoán, Paulette chọn chiếc nhân dâu,\\nvà phần của tôi là chiếc nhân sô-cô-la."
2115 = "Không hổ danh là Thị trưởng đương nhiệm.\\nTrả lời lưu loát mà chẳng cần xem tài liệu."
2117 = "Khoan đã, nói sao nhỉ——Họ dùng phương ngữ Kumamoto.\\nVậy thì, có lẽ họ không phải khách du lịch mà là..."
2121 = "Cơ hội để ngắm nhìn kỹ lưỡng từ bên ngoài thế này,\\ntừ trước đến nay chưa từng có."
2124 = "Nghe vậy cũng có lý. Reina cũng gật gật đầu.\\nPhạm vi hoạt động của \\x%lレイルロオド;#00ffc040;Railord%l;#;, suy cho cùng chỉ nằm trên đường ray mà thôi."
2140 = "Nếu được chị Mayami hướng dẫn,\\ntôi nghĩ ai cũng sẽ có một chuyến tham quan vui vẻ và thú vị..."
2142 = "Nhưng, chẳng hiểu sao mãi không ai đưa ra ý kiến gì.\\nHachiroku và Hibiki đều mang vẻ mặt rất khó xử."
2144 = "Nhưng, tôi không biết liệu nó có chạm đến được tất cả mọi người hay không,\\nvà hiện tại em ấy vẫn chưa được ai biết đến."
2146 = "Nhưng, nếu Hibiki và Hachiroku đã cảm thấy như vậy,\\nthì dù có giải thích thế nào cũng chỉ là lời nói suông."
2148 = "Nhưng, bước chân nhẹ nhàng cũng có cái hay cái dở."
2150 = "Nhưng, Paulette không nhìn Kon.\\nCô ấy chỉ chăm chăm nhìn tôi."
2152 = "Ngon thật sự. Ngon một cách trực tiếp.\\nCái... vỏ bánh crepe này, ngon quá."
2154 = "Khoảng cách thoải mái nhất đối với Paulette,\\nchính là điều phù hợp nhất để nâng đỡ tinh thần cô ấy."
2165 = "Hachiroku ngừng lời,\\nvà chăm chú nhìn Paulette."
2177 = "Dù mùi vị đó lan tỏa khắp khoang miệng,\\nlưỡi tôi vẫn có thể cử động như bình thường."
2178 = "Ra là vậy. Lý do đơn giản vậy thôi sao."
2180 = "Lại thêm một bước."
2184 = "Ngược lại,\\nnghĩa là tôi đã không chấp nhận đề xuất của hai người họ——kiểu như vậy."
2193 = "Ừm. Đây mới là phần quan trọng nhất.\\nNếu được, tôi muốn bà ấy dùng sốt dâu tây đỏ hoặc viết in đậm."
2196 = "Không có Reina xen giữa, không dẫn Hachiroku theo.\\nNên chúng tôi có thể bước đi tự nhiên, không cần phải gượng ép bắt nhịp với ai."
2198 = "Tôi cảm thấy quá đỗi kỳ lạ,\\nthế nên mới suy nghĩ sâu xa và nhận ra."
2204 = "Theo nguyện vọng tha thiết của Paulette,\\nchị Mayami cũng đã có mặt."
2205 = "Có thể đi lại trơn tru thế này,\\nđối với một điểm tham quan du lịch thì quả là tồi tệ."
2213 = "Họ trao nhau ánh mắt bối rối.\\nMột lúc sau, Hachiroku mới chậm rãi lên tiếng."
2216 = "Cô ấy đang rất kinh ngạc.\\nCó lẽ cô ấy đã hiểu ra, nhưng không thể chủ quan được."
2217 = "Cô ấy nuốt lại lời định nói.\\nĐôi mắt xanh biếc nhìn quanh."
2220 = "Ý tưởng mời một kẻ tay mơ như tôi làm thư ký chính sách,\\nrốt cuộc xuất phát từ đâu."
2222 = "Chị ấy nhìn tôi, nhìn Paulette, rồi nhìn Hibiki và Hachiroku.\\nChị ấy nở một nụ cười bối rối, khẽ nhún vai."
2224 = "Khuôn mặt đầy vẻ lo âu bỗng chốc bừng sáng.\\nĐôi chân đang dừng lại cũng bước thêm một bước về phía tôi."
2227 = "Nghe cô ấy nói vậy, tôi mới nhận ra cũng có phần đúng.\\nMột kế hoạch chấn hưng du lịch quy mô lớn, sử dụng bộ máy chính quyền làm đòn bẩy——"
2228 = "Bà ấy đưa hai chiếc bánh crepe ra,\\ntôi để Paulette chọn trước."
2229 = "Túi bắt kem sô-cô-la thoăn thoắt viết những dòng chữ."
2230 = "Đôi tay bà thoăn thoắt cử động.\\nHai chiếc bánh crepe. Một nhân sốt dâu, một nhân sốt sô-cô-la."
2232 = "Nếu vậy thì. Hết cách rồi.\\nNếu có thể, tôi đã muốn tự giải quyết mà không cần nhờ vả..."
2233 = "Chắc có trả tiền bà ấy cũng không nhận,\\nnên tôi quyết định nhận lấy lòng tốt này."
2235 = "Nếu không nghiêm túc cân nhắc đề xuất của Paulette,\\nchắc tôi cũng chẳng có hứng thú ngắm nhìn \\x%l8620;#00ffc040;8620%l;#; kỹ đến vậy."
2239 = "Nếu tính cả đồ vật,\\nthì chỉ có tôi, Kon và——\\x%l8620;#00ffc040;8620%l;#;."
2243 = "Dù vậy, thực tế thì hiếm khi có khách đến tham quan."
2247 = "Khi diễn đạt những điều mình nhận ra thành lời,\\nnó sẽ biến thành một sự thấu hiểu sâu sắc hơn."
2250 = "Đến Nagi mà cũng bị bịt miệng không vùng ra được,\\nchỉ biết giãy giụa loạn xạ."
2253 = "May mà chỉ bị dính một chút trên chóp mũi.\\nTôi dùng ngón tay quệt lớp kem tươi đó đi."
2259 = "Mấy thứ ma quỷ có vẻ hơi quá sức với tôi,\\nnên từ trước đến nay tôi chưa từng đến đó bao giờ——"
2260 = "Chùa ma... À, ra vậy. Chỗ đó cũng là một điểm tham quan nổi tiếng mà."
2264 = "Khi đã hiểu ra, sự mong đợi trong tôi càng thêm dâng trào."
2297 = "Hiếm thấy thật.\\nTôi vừa nghĩ vừa bước chân về phía đó."
2300 = "Lý do tôi kéo Kon đến đây,\\ncó lẽ là vì 'tôi sợ phải ở một mình hoàn toàn'."
2306 = "Chúng tôi lại sóng bước bên nhau.\\nMùi gió mang theo hơi nước từ sông Kuma thật dễ chịu."
2307 = "Từ tốn đi xuống từ Di tích thành Ohito,\\nsẽ ra ngay trước Tòa thị chính."
2308 = "Có sông Kuma, có suối nước nóng, có rượu shochu Kuma.\\nLại có thêm cả \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; nữa."
2310 = "Đợi một lúc, cô ấy vẫn chỉ biết khua tay múa chân luống cuống."
2311 = "Tôi không nghĩ đó là một câu hỏi quá khó——\\nĐang nghĩ vậy thì Paulette chợt lộ vẻ mặt như đã hiểu ra điều gì."
2314 = "Tôi đã tìm thấy ngay một lỗ hổng mà mình cần phải lấp đầy."
2316 = "Nghe những lời đó, tôi chợt thấy thắc mắc."
2319 = "Tôi muốn đối diện với nó một mình,\\nđể xem bản thân cảm thấy thế nào ngay lúc này."
2322 = "Đó chắc chắn là\\ncông việc chỉ có Paulette mới làm được."
2323 = "Tôi nảy ra một ý."
2324 = "Ánh mắt chạm nhau.\\nĐôi má Paulette bỗng chốc ửng hồng."
2326 = "Tôi vẫn không nghĩ mình có thể làm thư ký chính sách."
2327 = "Có lẽ câu đùa nhạt nhẽo của tôi đã chọc trúng chỗ buồn cười của cô ấy, Paulette cố nhịn cười\\nđến mức quệt cả bánh crepe lên mặt."
2330 = "Lần này, mọi người cũng đồng tình.\\nNhưng không hiểu sao——hôm nay lại chẳng ai đưa ra được ý kiến nào xa hơn."
2334 = "Đưa lên miệng, hương thơm ngọt ngào\\nlan tỏa từ mũi lên tận não."
2338 = "Vừa nhận được bánh, nhóm khách du lịch\\nliền cười đùa ríu rít rồi bỏ đi."
2345 = "Vậy thì, tôi thử hỏi Hibiki xem sao."
2347 = "Nếu họ đã nói là sẽ tôn trọng và dõi theo,\\nthì tôi chỉ cần tạo ra kết quả, chứng minh 'quyết định' của mình là đúng đắn."
2349 = "Nếu đã vậy, tôi cũng sẽ không ép buộc thu hẹp khoảng cách."
2351 = "Nếu đã vậy thì——"
2361 = "Ánh mắt của Hibiki cũng hướng về phía Paulette.\\nNhưng chỉ trong chốc lát."
2366 = "Ánh mắt van nài đến nghẹt thở, và khoảng cách hai bước rưỡi——\\nĐây có lẽ là biểu hiện cho sự kém cỏi trong việc nhờ vả của Paulette."
2368 = "Một từ ngữ không phù hợp với hoàn cảnh này,\\nnhưng không hiểu sao, ngay cả Hibiki cũng gật đầu."
2370 = "Một cỗ máy hoàn mỹ đến vậy——\\nLại mang màu sắc cô độc của kẻ bị bỏ rơi."
2376 = "Tôi cứ tưởng cô ấy sẽ bước thêm một bước nữa,\\nnhưng chân Paulette lại dừng ở đó, không nhúc nhích."
2378 = "Paulette tuôn ra những lời lẽ nhẹ nhàng,\\nnhư đang ngâm thơ, như đang ca hát."
2387 = "Vừa nói, phu nhân Nagayama vừa đổ\\nmột lớp bột sền sệt lên chiếc chảo sắt tròn."
2389 = "Phu nhân Nagayama nhanh nhẹn dàn đều một lớp bột bánh crepe,\\nrồi lấy túi bắt kem sô-cô-la."
2401 = "Lời của chị Mayami cắt ngang hướng nhìn của Paulette.\\nNhìn Hachiroku gật đầu, có lẽ đó là một nhận xét xác đáng."
2402 = "Paulette thở dài, nói thêm vào:\\n'Đúng là vậy đó'."
2403 = "Tay Paulette huơ huơ.\\nTưởng được chơi đùa, Kon cũng chạy theo bàn tay ấy."
2404 = "Paulette mở bản đồ minh họa ra.\\nSự chuẩn bị chu đáo này lại khiến tôi cảm thấy vui vui."
2405 = "Paulette đột nhiên đỏ bừng mặt.\\nTiếng trêu chọc vang lên khiến tôi nhận ra mình vừa làm gì."
2406 = "Giọng nói mạnh mẽ như chớp lấy lời tôi.\\nThêm một bước nữa. Paulette tiến lại gần hơn."
2407 = "Lần này bước chân nhẹ nhàng hơn trước,\\nPaulette rút ngắn khoảng cách với tôi."
2408 = "Paulette bước đi nhẹ nhàng vào trong.\\nReina có vẻ vui vẻ, còn Hachiroku và Hibiki thì xị mặt ra."
2411 = "Fukami bình tĩnh xoa dịu Nagi.\\nCó lẽ vì vẻ mặt buồn bã đó, Nagi lập tức im bặt."
2413 = "Nhìn vậy thôi chứ em ấy cũng là người lái đò cừ khôi đấy.\\nSức mạnh của Fukami có vẻ lớn hơn vẻ bề ngoài nhiều."
2415 = "Bên trong \\x%l石造機関庫;#00ffc040;Xưởng đầu máy bằng đá%l;#; lúc sáng sớm, chỉ có tôi và Kon."
2419 = "Khối sắt đen ngòm gợi lại tiếng cọt kẹt trong màng nhĩ,\\nvà tiếng cọt kẹt ấy gợi nhớ đến——mùi vị của máu và cái chết."
2421 = "Sơn sửa lại mọi thứ để vực dậy tinh thần——\\nTôi thấu hiểu cảm giác đó đến mức đau lòng."
2428 = "Bây giờ thì có thể là không có thật——nhưng."
2429 = "Dùng thay sổ tay luôn sao——\\nNgười này thú vị thật đấy."
2434 = "Người này,\\nquả nhiên có tính cách rất thẳng thắn và thoải mái."
2436 = "Thấy cô ấy hào hứng như vậy,\\ndù biết cô ấy rất bận rộn, tôi vẫn muốn thử rủ xem sao."
2438 = "Paulette vừa đưa tay ra,\\nKon liền lăn kềnh ra đòi vuốt bụng."
2448 = "Chị Mayami nói ngắn gọn, rồi quay sang nhìn tôi."
2450 = "Chị Mayami gật đầu thật sâu, kèm theo một tiếng thở dài."
2463 = "Quả thật là vậy.\\nCho đến khi nghe cô ấy nói, tôi cũng chẳng hề để tâm đến."
2466 = "Tưởng được gọi tên, Kon cọ cọ vào chân tôi."
2471 = "Từ tàn tích Sannomaru của thành Ohito, có thể phóng tầm mắt bao quát toàn bộ thị trấn.\\nThành thật mà nói, ấn tượng của tôi về nó chỉ là một thị trấn nông thôn hết sức bình thường của ngày xưa."
2473 = "Nghe cô ấy nói tôi mới để ý, quả đúng là vậy.\\nNgựa Kiji chễm chệ khắp nơi trên đường phố."
2475 = "Dù sao thì, chuyện cũng đã quyết xong.\\nGiờ chỉ cần tranh thủ thời gian rảnh rỗi của Paulette để hành động thôi."
2477 = "Paulette mặt đỏ như quả cà chua luộc,\\ncó vẻ không thể tìm được từ ngữ thích hợp để giải thích nữa rồi."
2480 = "Fukami và Nagi thì——!?"
2481 = "Còn việc lấp đầy những khoảng trống xung quanh đó,\\nchính là nhiệm vụ mới của tôi từ hôm nay."
2482 = "Nghe giọng điệu bối rối của cô ấy, tôi nhận ra mình vừa nói hớ.\\nNhưng ngay sau đó, tôi đã hiểu ra."
2483 = "Nghe Paulette nói,\\nngười phụ nữ trung niên trong quầy hàng nhìn tôi cười tươi rói."
2484 = "Bị chị Mayami hỏi dồn,\\nkhông hiểu sao hai người họ lại giật mình."
2485 = "Tôi khẳng định chắc nịch, mọi người đều gật đầu."
2486 = "Nghe tôi nói vậy, Paulette và phu nhân Nagayama\\nđều nở nụ cười rạng rỡ."
2488 = "Khuôn mặt của Hibiki hiện lên trong đầu tôi.\\nTranh của em ấy, quả thực có thể lay động trái tim tôi."
2495 = "Tất nhiên, những \\x%l客車;#00ffc040;toa hành khách%l;#; đó hiếm khi bị bán đi.\\n——Chỉ cần nghe giải thích là có thể dễ dàng hiểu được."
2497 = "Hiếm khi thấy chị Mayami ấp úng."
2499 = "Dưới góc nhìn của Hachiroku và Hibiki, việc tôi nghe theo đề xuất của Paulette,\\ncó thể hiểu là tôi đã 'lựa chọn' cô ấy sao."
2508 = "Túi bắt kem sô-cô-la bỗng dừng lại."
2527 = "Một người phụ nữ trung niên trông có vẻ rất dễ gần và hoạt bát."
2533 = "Ngon đến mức tôi bất giác mỉm cười.\\nDù biết là ngớ ngẩn, nhưng tôi không thể ngừng khen ngợi."
2534 = "Một con cáo thân thiện đến thế này,\\nchắc cũng hiếm lắm."
2536 = "Ngày xưa, tôi không có tâm trí nào để đi du lịch.\\nCòn bây giờ từ lúc trở về, tôi chỉ cắm đầu vào làm việc."
2541 = "Đám người mặc đồng phục kia, chắc là học sinh đi dã ngoại chăng?\\nPhía sau đám đông đó là gì thế——một quầy hàng sao?"
2542 = "Vậy tại sao, không trực tiếp yêu cầu\\nsự giúp đỡ từ chúng tôi sớm hơn."
2543 = "Quá đỗi khổng lồ. Quá đỗi thô kệch.\\nNhưng những chi tiết lại được mài giũa vô cùng tinh xảo."
2544 = "Vậy thì, nếu kết nối chúng lại bằng một tấm biển quảng cáo thật nổi bật,\\nchẳng phải sẽ tạo ra hiệu ứng cộng hưởng cho tất cả sao."
2545 = "Điều quan trọng không phải là chiều dài hay nghệ thuật,\\nmà là yếu tố 'nhất thế giới'."
2547 = "Trong cửa hàng đường sắt, vẫn là những gương mặt quen thuộc."
2549 = "Đến từng câu từng chữ cuối cùng, về vấn đề này,\\ntôi cần phải giải thích cho rõ ràng."
2551 = "Sông Kuma, rượu shochu, nước, ma quỷ——\\nNhững 'chất Ohito' theo suy nghĩ của cô Nagayama được ghi lại trên đó."
2554 = "Bà khéo léo dàn đều lớp bột, cho thêm kem, chuối,\\ndâu tây rồi nhanh tay cuộn lại, bọc trong lớp giấy——"
2556 = "Món đồ gỗ truyền thống của Ohito, trông như chiếc cờ cá chép được gắn thêm bánh xe,\\ndù to hay nhỏ đều mang vẻ đáng yêu riêng."
2558 = "Hachiroku và Hibiki có vẻ vẫn còn bất mãn,\\nnhưng hai người đó thì không sao đâu. Chỉ cần đưa ra kết quả, họ chắc chắn sẽ hiểu."
2559 = "Quả thực là lâu đời, nhưng...\\nso với cố đô Kyoto có lịch sử 2000 năm thì chẳng thấm vào đâu."
2560 = "Tuy không chịu thiệt hại nặng nề như Okinawa,\\nnhưng hậu quả chiến tranh mà Kyushu gánh chịu cũng không hề nhỏ."
2561 = "Tôi nghĩ đó là do tính cách của cô ấy,\\nnhưng tôi cũng cảm thấy một sự nguy hiểm nào đó."
2562 = "Tuy vậy, tôi tuyệt đối không muốn nhìn thấy cảnh\\nPaulette tiều tụy, gục ngã vì kiệt sức."
2564 = "Thảo nào.\\nHương vị của chiếc bánh crepe này."
2573 = "（...Đúng là thảm hại thật.\\nTôi đã chọn một người bạn đồng hành mà dù có để lộ bộ dạng thảm hại cũng không sao.）"
2583 = "（Mà cũng phải, nếu không thì một phu nhân trụ trì\\nlàm sao lại ra ngoài bán bánh crepe vào ngày nghỉ chứ）"
2588 = "（Cắn）"
2589 = "（À, khoan đã——Ra là vậy）"
2591 = "（Đã bị dồn đến bước đường cùng rồi sao）"
2594 = "（Với tôi, tôi chỉ định đưa ra phương án tốt nhất\\nđể nhóm có thể tiếp tục hoạt động hiệu quả hơn mà thôi...）"
2595 = "（Quyết định?）"
2596 = "（Liếm nhẹ）"
2597 = "（Dù vậy, vẫn chưa quen lắm. Nghĩ lại thì...\\ntôi đã đối mặt với Hachiroku và Hibiki ở khoảng cách gần như bằng không.）"
2599 = "130 năm."

[selections]
