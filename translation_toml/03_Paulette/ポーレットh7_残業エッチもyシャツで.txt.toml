1270 = "Với vẻ mặt ngây dại thế nào, mà lại khao khát sự xuất tinh, tinh dịch của tôi một cách đơn điệu, đầy tính động vật đến vậy——!!?"
1271 = "Khó chịu lắm phải không. Cứ thế mà kích thích——!?"
1272 = "Một sự mút mát đơn thuần đến ngây thơ, một lòng một dạ. Cảm giác ép ngực đơn điệu đến mức bạo lực."
1275 = "Mặt đỏ bừng. Mắt đảo điên. Quả nhiên là quên sạch sành sanh rồi."
1276 = "Ngôn từ ngày càng trở nên đơn giản. Chuyển động cũng trở nên trực diện hơn."
1280 = "Đang được lấp đầy. Đang lấp đầy. Bây giờ, chúng tôi là một cặp đôi hài hòa――――không!"
1281 = "Bị hôn. Lên phần đỉnh dương vật của tôi."
1282 = "Giọng nói như sắp khóc. Giọng nói nũng nịu. Vừa đáng yêu, vừa thấy có lỗi, khiến tôi mãi không thốt nên lời."
1285 = "Việc làm cô ấy lên đỉnh khiến tôi rất mãn nguyện, nhưng cảm nhận được sự cựa quậy đó lại càng kích thích khao khát xuất tinh——!?"
1286 = "Dù đang tan chảy, nhưng vẫn chưa hoàn toàn sụp đổ. Hơi nóng cơ thể, mùi hương giống cái, thôi thúc một thứ gì đó trong tôi."
1287 = "Nếu không nhờ nói ra để bình tĩnh lại, tôi đã sớm xuất tinh thỏa thích vào trong âm đạo này rồi."
1290 = "Nếu tôi bị làm cho lên đỉnh trước, thì coi như lời xin lỗi đã được chấp nhận. Trò chơi trừng phạt sẽ kết thúc tại đó."
1292 = "Nếu là diễn thì đúng là nữ diễn viên tài ba—— nhưng chín phần mười là cô ấy quên béng mất chuyện nhập vai rồi."
1294 = "Giải quyết bài toán khó này có vẻ hơi quá sức với tôi. Nếu vậy thì sao? ——Giao lại cho Paulette thôi."
1296 = "Dù có rút eo ra hết cỡ, cũng không bị tuột theo đà. Độ sâu tuyệt diệu và lớp thịt đầy đặn ôm chặt lấy tôi."
1304 = "Tinh dịch không thể kìm nén được nữa, có lẽ đã rỉ ra, trào lên ở miệng quy đầu rồi."
1308 = "Giọng nói hớn hở đó, đã mang theo điềm báo của sự mất kiểm soát rồi——"
1316 = "Nhiệt độ trong ruột tăng vọt cùng dâm thủy văng tung tóe từ âm đạo, đã nói lên khoái cảm mãnh liệt và mức độ đắm chìm của Paulette."
1318 = "Dâm thủy, hơi nóng, mùi hương——âm đạo đầy đặn siết chặt lấy lưỡi tôi, báo cho tôi biết Paulette sắp lên đỉnh đến nơi rồi!"
1319 = "Như để chứng minh đó là sự thật, dâm thủy càng ứa ra nhiều hơn, bắn cả lên mặt tôi."
1324 = "Tôi không muốn kết thúc trò chơi trừng phạt ở đây. Tuy nhiên, dương vật đã xìu xuống sau khi xuất tinh, cho thấy kết quả của việc massage."
1327 = "Duỗi ngón tay kích thích lỗ hậu, dùng cả lưỡi, môi và toàn bộ khuôn mặt để tấn công dồn dập."
1328 = "Chìa cánh tay ra, trên đó, chiếc đầu nhỏ bé của Paulette yên vị một cách vô cùng tự nhiên và hiển nhiên."
1330 = "Một nụ hôn êm đềm. Chóp mũi chạm vào nhau. Cọ má vào nhau."
1331 = "Bị nhét ngón tay vào lỗ hậu lần nữa, Paulette run lên bần bật——!!"
1333 = "Chỉ có thể nhúc nhích từng chút, từng chút một. Chỉ như sên bò——gần như là bất động."
1334 = "Tôi cứ diễn là chính mình là được. Không cần gượng ép đóng vai người khác. Gợi ý nhận được khiến lòng tôi nhẹ nhõm hơn."
1338 = "Dù tôi hiểu rất rõ, mong muốn của Paulette là gì——"
1340 = "Trong thâm tâm rất muốn vươn vai một cái, nhưng cũng không thể đánh thức Paulette dậy được."
1341 = "Muốn làm Paulette sụp đổ hơn nữa, muốn làm cô ấy lên đỉnh. Chỉ với suy nghĩ đó, toàn bộ con người tôi đang bùng cháy."
1344 = "Muốn lên đỉnh. Muốn cứ thế này xuất tinh. Paulette dịu dàng kích thích những suy nghĩ ấy."
1346 = "Tôi vội vàng dừng lại. Dùng phanh khẩn cấp để kìm nén chiếc eo, cơ thể đang chực chờ chuyển động!"
1348 = "Cài nút tay áo phải vào tay áo trái. Cài nút tay áo trái vào tay áo phải."
1350 = "Rút ngón tay đang tấn công lỗ hậu ra, tôi nắm lấy bờ mông nảy nở của Paulette để nâng đỡ."
1351 = "Làm theo chỉ thị, tôi ngả người nằm xuống. Không hiểu sao Paulette lại tháo nút tay áo rồi trèo lên người tôi."
1354 = "Muốn làm cô ấy rối tung rối mù lên, tôi tăng thêm các thủ đoạn tấn công."
1356 = "Thấy xót xa. Nhưng đây là trò chơi nhập vai. Đã là trò chơi thì phải tận hưởng và chơi tới bến."
1359 = "Không nhìn thấy, khuôn mặt. Nhưng nhiệt độ cơ thể tăng lên đôi chút đã cho tôi biết."
1360 = "Không nhìn thấy, khuôn mặt. Điều đó lại càng làm tăng thêm dục vọng và sự hoang tưởng. Paulette đó, hiện thân của lý trí và trí tuệ——"
1362 = "Lớp nếp gấp thịt đầy đặn mà khi liếm chỉ cảm thấy nông, đối với cảm giác của quy đầu đã nhạy cảm đến giới hạn lại như đâm chọc——"
1363 = "Không bỏ lỡ cơ hội đó——"
1365 = "Bụng tôi và lưng Paulette, cùng với khe hẹp đó đang cựa quậy điên cuồng."
1367 = "Đối với âm đạo ấy, lưỡi thì quá ngắn—— nên ít nhất, tôi cẩn thận liếm láp mọi ngóc ngách trong phạm vi có thể chạm tới."
1368 = "Rãnh quy đầu cọ xát mạnh bạo vào thành âm đạo, thành âm đạo cũng ôm siết lấy rãnh quy đầu không chịu buông."
1371 = "Chỉ cần xoa bóp là ngay lập tức, Paulette sẽ tan chảy ra mất——"
1372 = "Dự đoán hành động tiếp theo của Paulette—— Kỳ vọng vào hành động tiếp theo của Paulette."
1377 = "Nên tôi chỉ——đầu tựa vào đầu, cơ thể áp sát cơ thể, cọ xát thật nhẹ nhàng, thật dịu dàng."
1379 = "Nên thay vào đó, tôi đặt nụ hôn lên mái tóc rối bù. Và rồi tôi cũng——thả lỏng cơ thể trong sự mệt mỏi dễ chịu."
1380 = "Nên tôi áp sát hết sức, và vò nát bầu ngực của Paulette——!?"
1383 = "Nhưng bây giờ, tôi dồn hết sự luyến tiếc vào chuyển động của lưỡi. Ít nhất cũng phải truyền nước bọt thay cho tinh dịch vào âm đạo, vào tử cung."
1384 = "——Việc nói ra bằng lời, quả thực đã kiềm chế được sự mất kiểm soát. Nhưng……khi cô ấy kiềm chế được rồi, không hiểu sao tôi lại thấy hậm hực."
1387 = "Nếu trút bỏ hết mọi diễn xuất, toàn thân tôi sẽ được lấp đầy một cách dễ chịu chỉ bằng tình yêu dành cho Paulette."
1397 = "Bị kéo tuột vào trong một mạch, khoái cảm nhấn chìm cả tâm trí. Thế mà tôi vẫn——cắn răng chịu đựng không xuất tinh. Nhưng……"
1400 = "Nếu vậy, nếu vậy thì—— Không thể để mình tôi lên đỉnh được!"
1402 = "Nhưng, đằng nào cũng vậy. Đến nước này, dù là tôi thì cũng đọc được mạch chuyện rồi."
1414 = "Không báo trước cũng chẳng kiêng dè, tôi đút một ngón giữa vào."
1415 = "Đúng vậy, chỉ tích tụ thôi. Tuyệt đối không cho giải phóng, thật đơn điệu, chỉ đơn điệu thôi."
1442 = "Vừa bú mút quy đầu một cách dai dẳng, Paulette vừa cố tình để nước bọt nhỏ giọt ròng ròng."
1443 = "Điều tôi nhận ra, Paulette cũng đã nhận ra."
1444 = "Vẫn chưa chịu rời khỏi người tôi, Paulette cất giọng hoảng hốt."
1445 = "Eo Paulette bắt đầu đung đưa, vụng về nhưng đầy cuồng nhiệt. Thế này thì——không kìm nổi nữa."
1446 = "Trong khi lỗ hậu vẫn bị tôi moi móc, Paulette thè lưỡi ra và cử động."
1447 = "Dù đang lên đỉnh, thành âm đạo vẫn đang co giật, nhưng Paulette lại dùng đôi môi ngậm lấy tôi——"
1448 = "Trò chơi do chính Paulette cất công đề xuất. Nếu kết thúc dang dở thì thật có lỗi."
1449 = "Việc Paulette vừa thở dốc vì khoái cảm, vừa nhả dương vật của tôi ra, rời môi đi, khiến tôi hận không thể tả."
1450 = "Vì sợ lời đề nghị \"trói bằng dây thừng\" của Paulette sẽ làm cô ấy bị thương——nên tôi muốn tránh nó."
1451 = "Do eo hết sức, hay đơn thuần chỉ là làm nũng, âm đạo ướt át của Paulette ấn sát vào mũi và miệng tôi."
1452 = "Paulette lúc này, đang mỉm cười vì niềm vui thấu hiểu."
1453 = "Lưỡi Paulette thèm khát điều đó, khoét sâu vào đầu niệu đạo, moi móc, liếm láp và mút mát!!!"
1454 = "Đôi tay đang bị trói bằng tay áo của Paulette, đang vươn về phía tôi, giãy giụa trong vô vọng và xót xa."
1455 = "Thịt âm đạo của Paulette căng mọng đầy đặn, vừa đè ép vừa cựa quậy, như muốn kéo tuột tôi vào sâu bên trong, vào tận tử cung!"
1456 = "Âm đạo của Paulette đã đầy đặn thì chớ, khi đẩy eo vào sâu nhất, lại còn đâm mạnh vào cửa tử cung."
1457 = "Với vẻ mặt chân thật đến mức không giống như đang diễn, Paulette xịu xuống thấy rõ."
1458 = "Cơ thể Paulette rung lên bần bật, bầu ngực kích thích ngọt ngào lên dương vật——bởi khoái cảm đó."
1459 = "Ngay cả thành ruột cũng không ngoại lệ, bên trong cơ thể Paulette tràn ngập cảm giác đầy đặn."
1460 = "Chỉ cần ngực Paulette run rẩy, tôi đã suýt nữa thì xuất tinh. Muốn xuất tinh. Rất muốn. Muốn lắm rồi."
1461 = "Chắc hẳn cô ấy đã lơ là cảnh giác lắm."
1462 = "Cảm giác căng mọng mà Paulette sở hữu, chính là đôi gò bồng đảo vô cùng phong nhũ."
1463 = "Háng trần của Paulette—— bộ phận sinh dục, đang ở ngay trước mũi tôi."
1476 = "Để không thành ra như vậy, tôi phải nghiêm khắc và lạnh lùng, quyết tâm thực hiện trọn vẹn màn H trừng phạt & giáo dục này."
1477 = "Dù có diễn thế nào đi nữa, cuối cùng vẫn chỉ là hai kẻ trần trụi. Vì làm tình như bình thường——nên mới sướng đến tột đỉnh như vậy."
1484 = "Và rồi, tôi——không, chúng tôi—— đã vắt kiệt mọi thứ, tiêu xài hết hơi nóng——và sụp đổ."
1485 = "Và rồi chúng tôi……nhìn sâu vào mắt nhau, rồi không ai bảo ai, cùng bật cười."
1486 = "Và rồi thỉnh thoảng, lại nhắm vào phần sần sùi, nơi Paulette cảm nhận mạnh mẽ nhất——"
1487 = "Và dương vật của tôi, lọt thỏm, mềm mại. Bị kẹp chặt giữa khe ngực hẹp của Paulette."
1488 = "Nghĩ thì nghĩ vậy, nhưng tôi không thốt nên lời. Vốn dĩ tôi làm gì có tư cách trách mắng người khác……"
1491 = "Thế mà âm đạo vẫn ôm siết, thắt chặt và không ngừng cựa quậy. Nó truyền vào dương vật một khoái cảm còn hung bạo hơn cả khi dập hết tốc lực."
1495 = "Bối rối. E thẹn. Là diễn kịch, hay là tự nhiên, tôi hoàn toàn không phân biệt được."
1498 = "Biến sự áy náy của người khác thành trò chơi tình dục. Đối với một kẻ mù tịt về phương diện này như tôi, quả nhiên độ khó quá cao."
1499 = "Giờ nói gì cũng bằng thừa. Vì ánh mắt đó, nụ cười đó, đã truyền đạt tất cả rồi."
1507 = "Với khí thế như thể đã kìm nén suốt nhiều năm, đập mạnh vào tử cung của Paulette và lấp đầy nó."
1510 = "Và tôi cũng đã rất cố gắng. Trong âm đạo này—— âm đạo ôm siết, chèn ép đầy ắp thế này."
1512 = "Lý do Paulette tháo nút tay áo, cũng truyền đến qua làn da."
1524 = "Khi chỉ có hai người……Quả thực. Paulette rất dễ mắc phải kiểu sai lầm đó."
1534 = "Độ sâu ấy ôm trọn lấy dương vật của tôi vừa khít, cứ như thể được đo đạc và thiết kế riêng vậy."
1536 = "Chỗ đó. Bao quy đầu tự nhiên tuột lên, để lộ hạt ngọc trai màu hồng, tôi đưa lưỡi liếm âm vật."
1538 = "Lầm tưởng lưỡi là bộ phận sinh dục, thành âm đạo co rúm cựa quậy, nhu động hòng vắt kiệt tinh dịch."
1540 = "Âm đạo, đang run rẩy. Nhanh hơn cả lúc nhận ra điều đó, eo tôi đã đáp lại và bắt đầu chuyển động!"
1545 = "Bản thân cổ tay áo cũng bồng bềnh cọ xát nhẹ nhàng vào tôi, tích tụ khoái cảm râm ran, từng chút từng chút một."
1549 = "Chật——nhưng không phải cái chật chội của lần đầu tiên."
1550 = "Sự an tâm của Paulette làm tôi buông lỏng—— đưa dục vọng đang chực méo mó trở về đúng quỹ đạo."
1560 = "Nói ra, xúc động muốn xuất tinh sẽ vơi đi đôi chút. A, ra vậy. Đúng rồi, là thế này đây——"
1566 = "Sức nặng và hơi ấm yêu dấu ấy, đã kéo cơn buồn ngủ của tôi ra một cách không thể chối từ."
1567 = "Chỉ vậy là đủ rồi. Chỉ cần vậy thôi."
1568 = "Cảm thấy vui vì điều đó—— nhưng niềm vui ấy, giờ cũng phải kìm nén lại vì vai diễn."
1570 = "Nếu là chuyện khiến một thư ký như tôi phải tức giận đến mức trừng phạt…… Đêm nay——trong hoàn cảnh này, tôi chỉ có thể nghĩ ra một lý do duy nhất."
1573 = "Cùng lúc với tiếng thở dốc nghẹn ngào, hơi thở nóng hổi đang cù lét trung khu khoái cảm của tôi."
1574 = "Dù chỉ là kiểu trói buộc có thể gỡ ra dễ dàng bằng cách rút tay khỏi tay áo, nhưng Paulette có vẻ rất mãn nguyện."
1582 = "Bằng sự trơn ướt ấm áp, mơn trớn, dương vật của tôi đang dần bị làm ướt."
1583 = "Chúng chảy vào khe ngực, quấn lấy dương vật của tôi——"
1584 = "Phần đỉnh bị bao trọn hoàn toàn, rãnh quy đầu bị liếm láp, bị mút mát, và bị đôi môi căng mọng tuốt lấy."
1585 = "Bị bao bọc bởi sự mượt mà xen lẫn thô ráp. Phần đỉnh quy đầu bị nuốt trọn một cách nhẹ nhàng."
1590 = "（……Thế này mà liếm thì, đâu còn là trừng phạt nữa——không đúng!?）"
1647 = "（Lắc——nhóp——nhóp nhép! Xoa nắn!）"
1648 = "（Cộp!）"
1649 = "（Phập! Phập! Chụt! Chụt!）"
1650 = "（Phập! Phập! Chụt! Chụt!）"
1651 = "（Chụt!）"
1653 = "（Rột! Rột! Phập! Phập!!）"
1654 = "（Phập!!!!!）"
1656 = "（Phụt! Phụt——phụt! Phụt!）"
1659 = "（Phụt! Phụt! Phụt! Phụt!）"
1660 = "（Phụt! Phụt! Phụt! Phụt!）"
1662 = "（Phụt! Phụt! Phụt! Phụt!）"
1664 = "（Nhóp nhép!）"
1665 = "（Cộp!）"
1666 = "（Thọc——rút——）"
1667 = "（Phụt!）"
1670 = "（Nắn! Bóp! Xoa! Mạnh lên!）"
1671 = "（Nhóp!）"
1672 = "（Thọc——thọc——tuột——phụt!）"
