2017 = "「Coi như là để cảm ơn chuyện lọ mayonnaise.」"
2019 = "「Muốn lật được 2 hoặc J quá đi~~!\\nÂy da! Hoan hô! Là J! Vì thế, ở đây!!」"
2020 = "「Này nhé.」"
2022 = "「Yamagata cũng mang lại ấn tượng là có nhiều đồ ăn ngon mà.\\nĐáng mong chờ đây.」"
2024 = "「Thì sao ạ??」"
2027 = "「Vậy, đúng không ạ? Anh Soutetsu.」"
2028 = "「Vì là tiền tệ, nên có thể chọn cách sử dụng. Một trong số đó,\\ncó thể là trải nghiệm xúc than vào lò, hay trải nghiệm làm \\x%l車掌;#00ffc040;trưởng tàu%l;#; cũng được——」"
2029 = "「Trò chơi lật bài trí nhớ là trò lật tìm\\nđầu máy và toa tiếp than nước cùng loại. Vậy, bây giờ Paulette」"
2034 = "「Xin lỗi vì đã cắt ngang cuộc trò chuyện vui vẻ」"
2039 = "「Vé bốc thăm là vé để rút thăm trúng thưởng đó nha~」"
2040 = "「Vé bốc thăm?」"
2041 = "「Rút thăm trúng thưởng!!」"
2043 = "「Đặt lên nè. Ây da!」"
2046 = "「Chỉ còn lại 2 toa, nhưng lại lật trúng đầu máy 8620 và\\ntoa tiếp than nước của D51 mất rồi!」"
2049 = "Đó là sự lãng mạn mà tôi và Paulette đều hiểu.\\nNếu được tự do lựa chọn, thì tất nhiên đó cũng sẽ trở thành một sự lựa chọn."
2050 = "「Đợi \\x%l車掌;#00ffc040;trưởng tàu%l;#; đến,\\nrồi nhờ nướng hộ kiểu kiểu vậy sao ạ~?」"
2052 = "「Là 『Oyaki』 (bánh nướng). Nghe nói,\\nbên trong có nhân rau củ địa phương gì đó.」"
2056 = "「Nhìn giống nhân đậu đỏ lắm đúng không.\\nNhưng nghe nói ở vùng này, bánh Oyaki nhân đậu đỏ bị coi là tà đạo đấy.」"
2057 = "「Em cũng sẽ——thử khéo léo nói chuyện với các nhà cung cấp, hay mọi người trong hiệp hội du lịch.\\nXem sao. Ạ.」"
2058 = "「——Đúng vậy. \"Trông ngon\" đấy.」"
2061 = "「Đúng là vậy.\\nNhưng mà, đến nước này thì lại muốn hâm nóng rượu lên quá.」"
2062 = "「Vậy ạ~, vẫn còn ạ~.\\nNếu còn thì nha~, ờm——」"
2064 = "「Cơ hội lớn ạ~? Tại sao vậy?」"
2065 = "「Dù rất tiếc nhưng là thất bại hoàn toàn. Cuối cùng lại bị lật ngược tình thế một cách ngoạn mục nhỉ.」"
2068 = "「Vâng. Trên vé cũng có ghi đấy ạ.\\nMọi người cẩn thận kẻo bị bỏng nhé?」"
2071 = "（Nếu vậy——Hachiroku và Reina, chắc, sẽ……）"
2074 = "「Chuyện đó là đương nhiên rồi ạ.\\nBởi vì thực tế, em là một thị trưởng chưa đáng tin cậy mà. Cho đến tận ngày hôm qua.」"
2076 = "「Con đọc được nè~! \\x%lタブレット;#00ffc040;Thẻ bảng%l;#;!!」"
2078 = "Cùng với những lời tổng kết,\\nnhững việc cần làm liên tiếp hiện ra trong đầu tôi."
2085 = "「Không sao đâu ạ.」"
2086 = "「Phần chưa nướng cũng ngon lắm đó nha~」"
2087 = "Trước cả khi tôi mở lời nhờ vả, mọi người đã trao cho tôi sức mạnh và những lời động viên."
2088 = "「Đúng vậy. Vậy, Hikari nên làm thế nào đây?」"
2089 = "「Đúng vậy, đúng vậy」"
2099 = "「Chị Paulette 7 cặp. Anh Soutetsu 9 cặp.\\nBé Hikari 10 cặp! Bé Hikari vô địch rồi ạ!」"
2100 = "「Paulette, có vẻ sắp được rồi đấy.」"
2101 = "Đang nói dở, tôi vội vàng nuốt lại những lời đó ở thời điểm nguy hiểm."
2102 = "「Chị Paulette ơi, mở ra xem thử đi ạ~」"
2104 = "「Đường sắt Yukemuri, toa xe sưởi ấm đi Naruko đang ở tuyến số 2!\\nHành khách đổi tàu xin vui lòng nhanh chân lên!」"
2106 = "「Vì gia đình chúng ta.」"
2109 = "「Tiếp đó, 8 và——a, 5! Trật rồi!!」"
2110 = "「Vậy, 5 là…… Đầu máy có số 5 mà cháu thích là gì?」"
2116 = "「Mine Treasure~!」"
2118 = "「Ba giỏi quá đi~!」"
2120 = "「Ba ơi, chữ này, đọc là gì vậy ạ~?」"
2121 = "「Trật rồi~! Tiếp theo, đến lượt ba~」"
2123 = "「Reina cũng giúp một tay nha~. Tráo bài~」"
2126 = "「Reina, có làm gì đâu ạ~?」"
2127 = "「Vâng ạ. Là 14, 9, 22 và 16 đó nha~」"
2128 = "「Để Reina tổng hợp kết quả nha」"
2129 = "「Reina, sẽ dùng dầu diesel để chung vui nha~」"
2132 = "「Reina cứ để thế này là được rồi ạ~」"
2134 = "「Reina, số của chúng ta là gì vậy?」"
2135 = "「Tất nhiên là có ạ, với lại, nếu có,\\ncho cháu một đồ uống dành cho trẻ em, và cả khô cá hồi nữa ạ.」"
2136 = "「Trông ngon quá đi~」"
2139 = "「Thật đấy. Cái này, có phải dùng gạo không nhỉ?\\nPhần cháy sém cũng tạo nên điểm nhấn rất ngon.」"
2140 = "「Đường sắt Yukemuri, toa xe sưởi ấm đi Naruko đang ở tuyến số 2!\\nHành khách đổi tàu xin vui lòng nhanh chân lên!」"
2143 = "「Cháu biết rồi! Cháu sẽ lật tấm mà mama chưa lật.\\n8! Cháu sẽ ghép nó với đầu máy của Hachiroku! Cái này!」"
2148 = "「Khoan, trước đó, vì số lượng cũng ít đi rồi,\\nnên chúng ta tráo bài một lần nhé?」"
2151 = "「Vâng, xin mời. Trong này có cả đặc sản Yamagata nữa đấy.」"
2153 = "「Đố vui ạ~?」"
2154 = "「Có thể chia cho chúng tôi một chút Mayonnaise được không?\\nNghe nhắc đến Mayonnaise, tôi nghĩ chắc là sẽ hợp với món này.」"
2157 = "「Anh rất vui vì chuyến đi này có thể thực hiện được.\\nPaulette, cảm ơn em vì sự chuẩn bị tuyệt vời này.」"
2159 = "「Của tôi nữa, có phiền không nếu tôi cũng xin một chút?」"
2160 = "「Quy định xử lý liên quan đến tấm vé này,\\nngoài những điều khoản ghi trên mặt vé, còn tuân theo của Đường sắt Yukemuri.」"
2164 = "「Mọi người có dùng Mayonnaise không ạ~?」"
2166 = "「Nói gì thì nói, món bán chạy nhất phải là」"
2170 = "「Cũng đúng nhỉ.\\nThôi, vừa sưởi ấm bên lò vừa uống rượu lạnh cũng không tồi.」"
2171 = "「Cảm ơn cô.\\nVậy, cho tôi dùng nhờ một góc mép nhé.」"
2172 = "「Cảm ơn rất nhiều」"
2173 = "「Cho con xem với~」"
2178 = "「Bà cụ bán bánh đã nói thế đấy.」"
2179 = "「Thắng rồi!!」"
2181 = "「À, không có gì——」"
2185 = "「À, ý đó hay đấy.」"
2202 = "「Tất cả đều là những khu suối nước nóng nổi tiếng nhỉ.\\nRa vậy, vì thế mới gọi là 『Đường sắt Yukemuri』 sao.」"
2203 = "「Chữ này.」"
2204 = "「Nào, sao nhỉ. Cùng đếm thử xem sao.」"
2205 = "Nếu vậy thì sao? Nếu vậy thì——"
2206 = "「Thế còn chữ này?」"
2207 = "「Chữ này đọc là gì?」"
2208 = "「Ờm ờm…… vậy nên là~」"
2209 = "「Cái đó thì không được đâu ạ.\\nNếu đun nước sôi thì sẽ nguy hiểm lắm.」"
2210 = "「Hikari đã nướng đấy! Trông ngon quá đi!」"
2211 = "「Việc đào than, trên đời này có ai gọi đó là hoạt động giải trí không?\\nKhông đúng không? Bởi vì tên gọi chính xác của nó là \"lao động\" mà.」"
2212 = "「Khói đen đấy! Cháy không hoàn toàn rồi.」"
2213 = "「Gọi là gì ấy nhỉ? Ờm——」"
2214 = "Không xong rồi, Hachiroku đang hoàn toàn vô cảm.\\nCó vẻ cô ấy định dùng bộ mặt poker đó để cho qua chuyện này."
2215 = "「Chữ này á, đọc là 『Lò sưởi』.」"
2216 = "「Cái đó thì vẫn chưa biết được đâu ạ.\\nReina có thể đếm sai mất rồi ạ」"
2217 = "「Sau đó là, Hikari.」"
2219 = "「Vậy thì. Tiếp theo nha~…… cái này!!」"
2223 = "「Xin lỗi, cái này, có được dùng tự do không vậy?」"
2225 = "「Thế thì, chữ này?」"
2228 = "Nếu vậy, phải tạo ra ấn tượng rằng đó không phải là 『lao động』."
2231 = "「Vậy thì, hẹn gặp lại nha, cô bé.」"
2232 = "「Vậy thì, để tôi nướng thử xem sao.」"
2235 = "「Vậy, phần của Hikari và anh Soutetsu sẽ nướng nhé——\\nCòn Reina thì sao?」"
2238 = "「Vậy, cùng ăn thôi nào」"
2240 = "「Vậy thì, xin phép được thưởng thức.」"
2242 = "「Vậy, ăn thôi nào.」"
2243 = "「Chuyện đó là đương nhiên rồi. Hai mẹ con mà. Nhỉ~?」"
2245 = "「Vậy còn chữ này.」"
2247 = "Tôi gật đầu đáp lại giọng nói của Paulette."
2248 = "「Vậy tiếp theo là——2 và…… a, trật rồi.」"
2249 = "「Vậy, Reina và tôi sẽ thuộc đội để nguyên」"
2250 = "「Xin phép được thưởng thứ— （Ngoạm） Nhu~!\\nNóng quá! Ngon quá!!」"
2251 = "「Anh Soutetsu ơi! Khói, có khói bốc lên kìa ạ!」"
2252 = "「Anh Soutetsu.」"
2253 = "「Tuyết! Tuyết!!! Tuyết!!!!!」"
2255 = "「Khô mực và khô cá hồi, tuyệt quá đi nha~」"
2264 = "「Số 32 ạ?」"
2265 = "「D51 và D51! Hoan hô!\\nNhà xe của Hikari có Hachiroku và D51 rồi!」"
2267 = "「D51!」"
2269 = "「……Q và——ưm, loanh quanh đây chăng?\\nỒ!」"
2437 = "Ngay khi trở lại không gian chỉ có bốn người trong gia đình,\\nHikari lập tức lấy lại tinh thần."
2438 = "Dù có chậm trễ đến đâu, chỉ cần tiếp tục chạy trên đường ray,\\nthì một ngày nào đó chắc chắn sẽ đến được ga cuối."
2442 = "Đáng tiếc là dáng vẻ vẫn đang trốn sau lưng Paulette."
2443 = "Nhưng, nếu Hikari mong muốn điều đó,\\ntôi sẽ sẵn lòng đóng trọn vai ác."
2452 = "Nói cách khác, với những từ ngữ nằm trong phạm vi hiểu biết——\\nHikari ghi nhớ toàn bộ chuỗi ký tự đó như một 『bức tranh』."
2456 = "Nghĩ lại thì, đây là\\n『món bánh đầu tiên Hikari tự nướng trong đời』."
2461 = "Họ đã để lại bốn phong bì, mỗi ghế một túi."
2463 = "Dù đang ở trước mặt người lạ,\\nnhưng Hikari lại cất giọng rất rõ ràng."
2465 = "Nhưng, những tiếng thốt ra đôi lúc,\\ncuối cùng lại trở thành sự hỗ trợ tuyệt vời, hơn nữa——"
2467 = "Dù chỉ là một thời gian ngắn, nhưng cũng từng gánh vác một phần chính quyền thành phố,\\nlà người từng tham gia vào ngành du lịch."
2468 = "Nhưng mà, ngon tuyệt."
2470 = "Đối với Paulette, và cả đối với tôi,\\nchắc chắn sẽ làm được."
2472 = "「Ban đầu giả sử có đặt mức giá sát nút đi chăng nữa,\\nnhưng nếu tăng được những nguồn tài trợ như vậy, thì phạm vi lợi nhuận cũng có thể mở rộng ra.」"
2485 = "「——Nếu vậy, ví dụ như……\\nPhương án biến than đào được thành một loại tiền tệ ảo thì sao.」"
2487 = "Hikari ủ rũ gục đầu xuống."
2488 = "Con bé nhận lấy tấm vé từ Paulette.\\nMặt sau vé——ra là vậy, có viết rất nhiều chữ nhỏ li ti——"
2490 = "Hibiki đang hướng tấm lòng của mình về phía chúng tôi."
2492 = "Hikari đã có thể nói từ \"Cảm ơn\" ở trong miệng rồi.\\nThế nhưng——thế nhưng."
2494 = "Hơi thở của Hikari trở nên gấp gáp.\\nRa vậy——tôi đã hiểu ra."
2496 = "（Nhắc mới nhớ, mấy ngày nay,\\nthời gian tôi và Paulette ở riêng với nhau khá nhiều nhỉ.）"
2498 = "Mắt Hikari lập tức sáng rực lên.\\nMột ánh nhìn tràn đầy sự an tâm và tin tưởng."
2500 = "Hikari nhìn chằm chằm tôi với ánh mắt sắc lẹm."
2501 = "Ánh mắt của Hikari lại đổ dồn vào kiện hành lý lớn của bà cụ.\\nChắc con bé đang tò mò xem bà sẽ bán gì trong toa xe này đây."
2503 = "Khi trải nghiệm đi thuyền xuôi dòng sông Kuma,\\ntôi đã cảm thấy \"Thành thật mà nói, hơi đắt\"."
2504 = "Từ quy định xử lý, các điều khoản ghi trên mặt vé, quy định kinh doanh hành khách,\\ncho đến các điều khoản liên quan và luật định, Hikari đều đọc trơn tru."
2507 = "Nhanh chóng trốn ra sau lưng Reina, Hikari chăm chú,\\nnhìn những thứ được đặt trên lò sưởi."
2508 = "Hòa cùng tiếng đếm, những tấm thẻ giành được xếp chồng lên nhau.\\n6, 7——"
2512 = "「Nếu vậy, vé đi thuyền xuôi dòng sông Kuma nữa!\\nXin hãy cho phép đổi lấy cả vé đi thuyền nữa! Ạ.」"
2516 = "Bên ngoài cửa sổ, không thấy lấy một mẩu tuyết nào.\\nĐiểm đó thì hơi đáng tiếc một chút, nhưng——"
2518 = "「Ồ.」"
2519 = "Có thể sẽ bị nói là ông bố cuồng con,\\nnhưng mới bốn tuổi mà đã có khả năng đọc hiểu thế này. Tương lai không làm tiến sĩ thì cũng làm bộ trưởng——"
2522 = "Có lẽ do vỏ mỏng, nên khói bốc lên chỉ trong nháy mắt."
2527 = "À, đúng vậy."
2530 = "À, đây cũng là một bước tiến vô cùng lớn rồi.\\nVà rồi, đoàn tàu bắt đầu lăn bánh——"
2532 = "Việc tận dụng đường sắt như một công cụ cho mục đích đó.\\nNếu vậy thì với tư cách là tài sản của toàn khu vực, việc kêu gọi đầu tư cũng sẽ dễ dàng hơn."
2534 = "Trên toa xe sưởi ấm, với chút hơi men chuếnh choáng, cùng nhau chơi bài tây."
2536 = "「Ư, ừm.」"
2540 = "Nhìn lướt qua thì số ghế phải hơn 40.\\nToàn là những con số khá nhỏ tập trung lại."
2542 = "「Dạ…… nó rất là, lý thuyết chung hay nói cách khác là——\\nmột ý kiến cơ bản. Thôi, ạ.」"
2544 = "「Tôi, muốn được nhìn thấy sự huy hoàng đó.\\nĐể làm được như vậy——tôi cần sức mạnh của mọi người.」"
2546 = "Nói lời cảm ơn, và cảm ơn vì bữa ăn.\\nTạo ra một bầu không khí để Hikari dễ dàng cất lời nhất có thể."
2547 = "Ôm lấy chiếc túi chứa đầy rau củ,\\nPaulette nheo mắt lại với vẻ hoài niệm."
2549 = "Với những lần xáo bài cực kỳ tỉ mỉ, lượt chơi của tôi,\\ngần như chỉ còn phó mặc cho may rủi."
2552 = "Được đưa cho chai Ramune, con bé nhận lấy.\\nGiữ nguyên tư thế đó, Hikari đỏ bừng mặt và cứng đờ người."
2555 = "Không phải nằm dài ngang mặt bàn, mà là đứng thẳng lưng——\\nBóng lưng của Paulette, quả nhiên trông như thế mới đẹp."
2559 = "À phải rồi——"
2561 = "Chuyến du lịch gia đình có ngủ qua đêm đầu tiên."
2562 = "Tự bản thân tôi cũng thấy nó thật đơn giản,\\nnhưng được khích lệ bởi lời khen đó, lời nói của tôi cũng thêm phần dõng dạc."
2574 = "Có lẽ con bé chỉ học thuộc lòng chúng mà thôi."
2578 = "Nhận ra điều đó,\\nPaulette và Reina lộ vẻ mặt ghen tị."
2579 = "Lời nói, nếu không được truyền đạt một cách rõ ràng, sẽ không thể chạm đến tai người nghe.\\nNếu không có dũng khí để truyền đạt, thì dù là cảm xúc gì cũng không thể thấu hiểu được."
2583 = "Nghĩ lại thì, tôi hoàn toàn không biết gì về Paulette cả.\\nNgay cả việc trong quá khứ đã từng gặp nhau hay chưa, đến giờ vẫn chưa xác nhận được."
2589 = "「Em nghĩ việc xây dựng hình ảnh, sẽ vô cùng quan trọng đấy.」"
2590 = "Bên trong phong bì nhận được là một tờ rơi in nhiều màu,\\ntrông có vẻ rất tốn kém."
2592 = "Quay lại nhìn, là người đàn ông của cặp đôi lúc nãy.\\nAnh ta dùng ngón trỏ ra hiệu 『Suỵt~』, và đưa cho tôi thứ gì đó——"
2594 = "Chính là cái này."
2595 = "Tôi muốn nói một điều gì đó thật hay——\\nNghĩ vậy, nhưng rốt cuộc lại chỉ thốt ra được những lời đơn giản."
2597 = "Tôi nhận lấy kẹp gắp từ tay Hikari,\\nvà lật nó lại ngay lập tức——"
2598 = "Tôi nhận lấy chiếc vé trượt từ tay Reina, và đưa lại——"
2599 = "Làm việc tốt cho người khác cũng là làm cho chính mình.\\nTôi nhớ đến câu nói đó."
2602 = "Tôi vội vàng gắp nó ra đĩa giấy,\\nnhưng bề mặt đã bị cháy sém, và có lẽ nhiệt vẫn chưa thấm vào bên trong."
2604 = "Tôi đã hiểu ra. Những gì Hikari đọc được, là của Teitetsu cũ——\\nNói cách khác, đó là phần biểu đạt cũng được sử dụng ở Đường sắt Ohito."
2605 = "Tôi bế Hikari cách khá xa lò sưởi,\\nvà để con bé vươn tay cầm kẹp gắp ra."
2607 = "Tôi lấy sổ tay ra và viết lên đó."
2610 = "Tôi hiểu. Với tư cách là một người cha, tôi hiểu.\\nCó lẽ, Paulette và Reina cũng hiểu."
2612 = "Tôi vừa kỳ vọng vừa đợi một lúc,\\nnhưng quả nhiên Hikari vẫn không thốt nên lời."
2614 = "「Ra là vậy, quả thực phải bắt đầu từ những điều cơ bản.\\nSự cân bằng giữa giá cả và những gì nhận được sao.」"
2616 = "——Không nên nói những điều bất cẩn.\\nSự phán đoán đó, đã làm thay đổi những lời sắp thốt ra khỏi cổ họng tôi."
2617 = "Quây quần bên lò sưởi, trò chuyện dăm ba câu với những hành khách xa lạ.\\nNiềm vui này, tuyệt đối không thể nào nếm trải được trên Aircra."
2619 = "Tôi thì thể hiện với Hikari.\\nCòn anh ta thì thể hiện với người bạn gái của mình."
2620 = "Nói rồi, tôi nâng chiếc cốc giấy lên,\\nhai chiếc cốc giấy và một bình tông liền đáp lại."
2621 = "Những lời tiếp theo, tôi không thể thốt ra khỏi miệng.\\nCó lẽ ếch bị rắn nhìn chằm chằm cũng mang tâm trạng như thế này chăng."
2630 = "「Có gì cần vẽ thì cứ nói. Em sẽ vẽ cho.」"
2638 = "Khi bóng dáng mặc áo happi của những người từ Hiệp hội Du lịch khuất đi,\\nHikari liền trở về vị trí cũ."
2639 = "Khi người của Hiệp hội Du lịch tiến đến,\\nHikari lại một lần nữa trốn đi, lần này là trốn sau lưng tôi——"
2642 = "Đọc được Thẻ bảng, Express,\\nnhưng lại không đọc được 『Bracelet』 (Vòng tay)."
2647 = "「Đúng là vậy đó nha. Bỏ tiền ra để đi đào than.\\nRồi số than đó lại bị lấy đi mất thì, chẳng vui vẻ chút nào đâu nha.」"
2648 = "「Nếu có thể thấy được hiệu quả tuyên truyền, thì các sản phẩm tài trợ,\\ncũng có thể sẽ được cung cấp miễn phí đấy nhỉ.」"
2649 = "Hàng người chờ đến lượt cũng đã bắt đầu hình thành.\\nCó lẽ hơi sớm một chút, nhưng đó cũng lại là một hương vị của chuyến đi."
2653 = "「À, đúng vậy nhỉ.\\nLàm như vậy, rồi kêu gọi tài trợ, là một ý tưởng rất hay đấy.」"
2659 = "Không có đứa trẻ nào ghét rút thăm trúng thưởng cả,\\nvà một khi đã thu hút được sự chú ý của trẻ con, thì phụ huynh cũng sẽ bị cuốn theo."
2660 = "Hikari cũng ngay lập tức hồi phục,\\nđưa mắt nhìn luân phiên giữa phần Mayonnaise ở mép đĩa và miếng khô cá hồi."
2671 = "Vì vậy, để chào đón ngày mai đó.\\nViệc đầu tiên cần làm, chỉ có một mà thôi."
2672 = "Paulette và Reina cũng ngay lập tức nhận ra,\\nvà làm theo tôi."
2673 = "Nhưng tôi lại băn khoăn không biết mình có thể khẳng định chắc nịch như vậy không.\\nQuả thực, tôi đã dấn thân vào đường sắt sâu đến mức phải băn khoăn về điều đó."
2674 = "Chắc là phần thưởng nhận được từ người của Hiệp hội Du lịch."
2675 = "Sử dụng chiếc kẹp gắp đặt gần lò sưởi,\\nPaulette vui vẻ xếp khô cá hồi và khô mực lên trên."
2676 = "Không chỉ tôi, mà cả Reina, Hachiroku, chị Mayami,\\nNagi, Fukami——và cả Hibiki nữa."
2677 = "Tại sao lại từ Yamagata——\\nChưa kịp hỏi, một câu trả lời như thể đã chờ sẵn được đưa ra."
2681 = "Đúng vậy. Từ bây giờ.\\nDanh tiếng xấu thì cứ rửa sạch là được. Những điều chưa biết thì cứ tìm hiểu là xong."
2683 = "Sự hỗ trợ của Reina."
2684 = "Thong tha thong thả.\\nReina đổi chủ đề, thay đổi luôn cả bầu không khí."
2687 = "Reina vội vàng xua xua tay."
2688 = "Reina cố tình tỏ ra vẻ quan trọng,\\nkhuấy động bầu không khí dù kết quả đã rõ rành rành."
2694 = "Tất nhiên, Reina cũng không hề có ý định làm vậy."
2696 = "「Reina sẽ giúp đỡ Paulette nha~」"
2697 = "Giọng nói đầy phấn khích của Paulette,\\nkhông ngờ lại đóng vai trò như chim mồi thu hút khách hàng."
2698 = "Có vẻ như sự chậm trễ do chờ \\x%l接続;#00ffc040;kết nối chuyển tàu%l;#;, sẽ được giữ nguyên ở đây.\\nThong thả, chậm rãi, toa xe sưởi ấm tiến bước trên đường ray."
2700 = "Ra vậy, cùng nhau thể hiện mặt tốt,\\nđây là một cơ hội sao."
2705 = "Hết cách rồi.\\nNếu cứ thúc giục, có khi chỉ làm con bé thêm căng thẳng thôi——"
2716 = "Cốc giấy chạm vào cốc giấy, cốc giấy chạm vào bình tông,\\ntạo ra những âm thanh va chạm nghe thật thảm hại."
2722 = "Bà cụ mỉm cười tủm tỉm,\\nrồi cứ thế tiến đến chỗ ngồi tiếp theo."
2724 = "Khi bà cụ tháo kiện hành lý ra,\\nlần này đến lượt mắt Paulette sáng rực lên."
2725 = "Bà cụ thu dọn lại kiện hành lý——"
2728 = "「Thấy anh hai vui vẻ như vậy thì……\\nLà em gái mà. Đành phải hợp tác giúp đỡ thôi.」"
2729 = "Giọng nói vang lên đột ngột.\\nHikari trốn sau lưng Paulette."
2730 = "Bị tiếng gọi đột ngột từ phía sau làm cho giật mình,\\nHikari rúm người lại."
2745 = "Tôi không thể nhớ ra nổi.\\nĐến mức hoàn toàn không có chút ấn tượng nào."
2747 = "「Nếu có thể tăng cường các nguồn tài trợ hấp dẫn.\\nThì phương án này, có thể trở thành một dự án có khả năng sinh lời.」"
2751 = "Nếu không, chẳng có lý do gì con bé lại không đọc được chữ Katakana của từ lò sưởi cả\\n——À, khoan đã."
2768 = "Thành thật mà nói, con bé dễ thương quá. Thật dễ chịu.\\nChính vì thế, tôi phải xốc lại tinh thần để không quá nuông chiều con bé."
2774 = "Bên ngoài cửa sổ tàu, một màu trắng xóa.\\nTừ lúc nào——không——"
2777 = "Âm thanh gõ nhịp lên các mối nối đường ray, lặp đi lặp lại một cách đều đặn."
2788 = "Giống như Paulette vẫn luôn nhớ về nó,\\nchắc chắn nó cũng sẽ đọng lại rất lâu trong ký ức của Hikari."
2789 = "Những ván bài lật hình giống nhau với Michiko ngày xửa ngày xưa,\\nlúc nào cũng bám đuổi sát nút, tôi mỉm cười ấm áp khi nhớ lại."
2790 = "Không phải lúc để nói đùa."
2791 = "Đây thực sự chính là,\\nhương vị của bản thân sự hạnh phúc."
2792 = "Tôi cảm nhận được sức thuyết phục từ lời nói đó."
2797 = "Giọng nói lớn vọng lại từ phía bên kia lối đi.\\nĐôi mắt của Hikari sáng lên lấp lánh."
2800 = "Cùng với một chiếc vé bốc thăm rất mộc mạc,\\nđược làm từ bìa cứng gập đôi và viết số bằng bút lông——"
2802 = "Là người đàn ông của cặp đôi lúc nãy."
2805 = "Nếu là Railord đấu với con người, thì trò lật bài tìm hình giống nhau này chẳng thể thành lập được.\\nReina sẽ trăm trận trăm thắng mất."
2808 = "「Nếu là những chuyện dễ dàng nghĩ ra được,\\nthì đã có người làm từ lâu rồi đó nha.」"
2809 = "Tôi cũng là một người của Ohimitera——"
2810 = "Việc trùng lặp tờ rơi thành thật mà nói chỉ gây thêm rắc rối,\\nnhưng vé bốc thăm và bánh kẹo thì quả thực rất đáng mừng."
2811 = "Có vẻ như là một chiều hướng tốt——\\nnhưng thành thật mà nói, việc bị giao vai phản diện cũng hơi đau lòng."
2812 = "Thật đáng tiếc, nhưng chuyện này thì——"
2813 = "Tôi nghĩ không nên chiều chuộng con bé quá,\\nnhưng bản thân tôi cũng thực sự tò mò, nên đã thử hỏi."
2814 = "Mặc dù không thể nói 『Con đi đây』,\\nnhưng con bé vẫn bẽn lẽn, lén lút vẫy tay nhè nhẹ đáp lại."
2815 = "Dù hơi tội nghiệp cho Hikari vì bị giật mình,\\nnhưng những màn giao lưu thế này cũng là nét đặc trưng chỉ có ở toa xe sưởi ấm."
2816 = "Cốc rượu có giá 300 yên theo giá \\x%l車販;#00ffc040;bán hàng trên tàu%l;#;.\\nChắc chắn chẳng phải là loại thượng hạng gì cho cam, thế nhưng——"
2837 = "（Ực——）"
2839 = "(Cọc cạch, cọc cạch, xình xịch, xình xịch——)"
2840 = "「Cất công đào được than rồi lại ném vào lò hơi của SL,\\ntrên đời này người ta gọi đó là làm công cốc đấy.」"
2842 = "（Nếu vậy, có lẽ con bé mang tài năng thiên về giống Hibiki hơn.\\nKhông phải tiến sĩ hay bộ trưởng, mà là thiên hướng nghệ sĩ chăng——）"
2843 = "（Chọc, chọc）"
2845 = "（Kết nối các điểm du lịch, tập trung quảng cáo tuyên truyền,\\nlà chiến lược nhằm tăng lượng khách quay lại cho toàn khu vực sao）"
2846 = "（Cụp）"
2847 = "（Lật!）"
2853 = "8 và 8.\\nHai tấm còn lại, đương nhiên là——"

[selections]
