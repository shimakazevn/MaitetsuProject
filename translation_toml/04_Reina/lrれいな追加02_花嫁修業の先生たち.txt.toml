1444 = "「Anh cũng vậy.」"
1446 = "「Quan điểm đó rất hợp ý tôi. Thật sự rất tuyệt.\\nKhả năng nhận thức, hay nói đúng hơn là học hỏi rất nhanh——À, không」"
1449 = "「Tôi rên rỉ chỉ đơn giản là vì tôi đã lỡ quên mất.\\nTức là quên mất việc Kisaki là một tiểu thư danh giá chính hiệu.」"
1450 = "「Chị cũng chẳng khiêm tốn đâu.」"
