1454 = "「Dáng ngồi seiza hiện tại của chị là lót gót chân dưới mông.\\nReina chắc cũng đã ngồi seiza theo cách này phải không?」"
1456 = "「Anh không hề biết……Thay vì tăng lượng muối, chị lại làm cho vị đậm đà hơn,\\nthấm hơn……Chị đã tốn bao nhiêu công sức để làm điều đó——」"
1458 = "「Đúng vậy. Vì thế nên thật ra em cũng nghĩ, hay là để chị Mayami\\ndạy nghệ thuật cắm hoa thì tốt hơn chăng?」"
1460 = "「Vì thế, hãy quan sát em ấy thật kỹ nhé? Những nét mặt\\nmà em ấy chỉ cho mỗi bé Rei thấy. Và rồi nhé? Những lúc như vậy...」"
1462 = "「Bé Rei, em đang lo lắng về chuyện đó sao?」"
1464 = "「Mở mắt cá chân ra tạo một khoảng trống, xếp chồng hai ngón chân cái lên nhau.\\nRồi đặt mông lọt thỏm vào khoảng trống vừa tạo ra đó——」"
1466 = "「Thiết kế tài sản cho tương lai——sao.」"
1468 = "「Nếu nghe có vẻ thất lễ thì cho tôi xin lỗi. Tôi hoàn toàn không có gì bất mãn cả.\\nNgược lại, được Kisaki hướng dẫn đúng là điều chúng tôi mong muốn.」"
1471 = "「Cái đuôi câu nũng nịu 'ạ~' đó, trong hoàn cảnh này là không cần thiết đâu.\\nTrả lời thì chỉ cần 『Vâng』. Vậy là đủ rồi.」"
1474 = "「Phong cách Hibiki.」"
1476 = "「Cô giáo Hibiki, mong cô chỉ giáo thêm ạ」"
1479 = "「Cùng một loại hoa mà kỳ diệu thật nha~.\\nChiếc kẹp tóc của Reina thì mềm mại, đáng yêu, còn...」"
1480 = "「Reina hiểu rồi nha~! Là phải kéo dài thời gian ninh đúng không ạ~」"
1482 = "「Vâng ạ~」"
1486 = "「À.」"
1487 = "「Đúng vậy. Chính anh nhìn cũng thấy rất giống phong cách của mình.」"
1489 = "「Ra là vậy.」"
1490 = "「Vậy sao. Cảm ơn em đã cho chị biết nhé.」"
1491 = "「Ra là vậy? Vậy Reina đã tự mình pha trà,\\nhay được ai đó pha trà cho thưởng thức bao giờ chưa?」"
1493 = "「Đúng là rất ngay ngắn. Nhưng ngồi như vậy chân sẽ\\nrất dễ bị tê, và tư thế cũng dễ bị chúi về phía trước. Vì vậy」"
1494 = "「Vâng ạ~——A, 『Vâng』」"
1496 = "「Vâng ạ~. Vừa xinh đẹp, ấm áp, dịu dàng,\\nnhưng cũng có chút xíu đáng sợ nữa nha~」"
1497 = "「Đúng vậy ạ~. Được chị Kisaki bạn thân của chị Paulette làm giáo viên,\\nReina vui lắ~m và rất an tâm đó nha~」"
1499 = "「Vâng ạ~」"
1501 = "「Đúng đúng. Bên đó tùy theo trường phái mà sẽ được gọi là 『Lập hoa』\\nhay 『Hình thức cơ bản』! Lập hoa, nghĩa là hoa đứng đó.」"
1503 = "「À, vậy thì đáng lẽ ra chị nên dạy em điều đó đầu tiên nhỉ.\\nĐược chứ? Nhìn dáng ngồi seiza của chị này.」"
1505 = "「Đúng là vậy. Những động tác chuẩn mực không chỉ hiệu quả mà còn rất đẹp mắt.\\nAnh cảm thấy rằng, lễ nghi chính là sự tích lũy của những điều như vậy.」"
1506 = "「Vâng ạ~, Reina nhớ được ngay luôn rồi nha~」"
1509 = "「Vâng ạ~. Reina đã khép chân lại,\\nvà cố gắng ngồi seiza thật ngay ngắ~n đó nha~」"
1511 = "「Thế này đúng không ạ~. ——Ư hư hư~,\\ntrông giống bàn tay mèo thật đó nha~」"
1512 = "「Vâng!」"
1514 = "「Vâng ạ!\\nReina sẽ cố gắng trân trọng đồ vật hơn nữa nha~」"
1515 = "「Vâng ạ! Nếu chỉ vậy thì Reina làm được nha~」"
1518 = "「Vâng. Tôi cũng rất mong được cô chỉ giáo.」"
1520 = "「Vâng ạ. Nước tương hai muỗng canh.\\nRượu cũng hai muỗng canh. Đường cũng hai muỗng canh. Oa!」"
1521 = "「TPO à. Ra là vậy, em cũng được tiền bối Kisaki\\nchỉ dạy cặ-ặn kẽ về khoản đó rồi nhỉ?」"
1524 = "「Hừm」"
1525 = "「Vâng ạ!!!」"
1528 = "「Không sao đâu không sao đâu. Kể ra thì bé Ha\\ncũng giống như vậy thôi mà. Nhưng mà...」"
1529 = "「Chưa ạ. Reina là Railord mà.\\nA, nhưng mà, việc uống trà thì không sao đâu ạ.」"
1530 = "「Chưa ạ~. Vì mọi người bảo nguy hiểm.\\nViệc Reina có thể làm, chỉ có mỗi pha hồng trà thôi nha~」"
1531 = "「Không có chuyện đó đâu ạ~」"
1532 = "「Đúng đúng đúng! Quả không hổ danh bé Reina, chính xác!」"
1533 = "「Vâng ạ~! Hoa vốn dĩ đã đẹp rồi,\\nnhưng nếu biết chọn lọc, suy nghĩ và cắm lên thì sẽ còn tuyệt vời hơn nữa nha~」"
1534 = "「Đúng rồi, giống nhau cả thôi.\\nVậy, để món ninh có vị đậm đà hơn thì——」"
1535 = "「Đúng đúng. Rồi cứ giữ nguyên bàn tay mèo như vậy\\nchạm nhẹ-ẹ vào sống dao——ừm ừm, giỏi lắm giỏi lắm.」"
1536 = "「Đúng vậy. Bởi vì Sou-chan là một đứa trẻ rất giỏi chịu đựng mà lị.\\nEm ấy giấu giếm nét mặt và cảm xúc rất là giỏi.」"
1537 = "「Đúng vậy. Hoa tự do, viết là Tự do hoa.」"
1538 = "「Đúng vậy đó. Đây cũng là một trong những điều nghệ thuật cắm hoa có thể làm được.\\nSống cùng với hoa, cuộc sống sẽ trở nên tươi đẹp và phong phú hơn.」"
1551 = "「Nếu đổ mồ hôi nhiều đến mức đó, thì chỉ ninh cho thấm vị thôi là không đủ.\\nNhưng ăn quá mặn lại là kẻ thù của sức khỏe. Nên chỉ áp dụng trong trường hợp đó thôi.」"
1554 = "「Để giúp chúng hoàn thành vai trò đó. Ưm……\\nLàm thế này thì——đó, thấy chưa?」"
1557 = "「Tiếp theo, cái này nhé? Đứng lên đây.」"
1558 = "「Vậy thì cho tất cả vào nồi, đậy nắp gỗ otoshibuta lại. Sau đó\\nđể lửa liu riu……ừm, với mùa này thì ninh 25 phút là được.」"
1565 = "「Reina cũng muốn học cách làm món thịt hầm khoai tây\\nmang hương vị nhà Migita!!」"
1569 = "「Reina cũng tiếp xúc với mọi thứ rất cẩn thận.\\nChị nghĩ điều đó không chỉ dành riêng cho trà đạo, mà còn thông suốt với mọi lễ pháp.」"
1570 = "「Reina,\\nthích nghệ thuật cắm hoa lắ-ắm rồi nha~」"
1572 = "「Reina muốn chọn bé này làm vai chính nha~」"
1573 = "「Reina. Sẽ hỏi anh Soutetsu thật cẩn thận nha~.\\nLắng nghe anh ấy, và cùng anh Soutetsu tạo ra hương vị đó.」"
1574 = "「Lắng nghe câu chuyện, và cùng nhau làm sẽ vui hơn rất nhiều.\\nReina đã được chị Hibiki dạy cho điều đó rồi nha~」"
1575 = "「Reina đã nhớ cách ngồi seiza này rồi ạ~.\\nCảm ơn cô giáo Kisaki nha~!」"
1578 = "「Reina muốn học thêm về nghệ thuật cắm hoa nha~.\\nNè, anh Soutetsu, có được không ạ?」"
1580 = "「Bé Rei, em đã từng dùng dao bao giờ chưa?」"
1582 = "「Reina, em đã có kinh nghiệm về trà đạo chưa?」"
1583 = "「Reina, chuyện đó——」"
1585 = "「Bé Reina, nhìn vào gương kia kìa.」"
1591 = "「Tất nhiên công việc thì không vấn đề gì.\\nNhưng lấy tư cách bạn bè cũng được mà?」"
1592 = "「Tất nhiên rồi ạ.\\nVì Reina là Railord, cũng là đồ vật mà nha~」"
1593 = "「Tất nhiên là được rồi, vì đây là Tự do hoa mà.」"
1595 = "「“Đậm chất riêng” à. Đúng thật.」"
1597 = "「Táo bạo——và ngây thơ quá! Nhưng mà, ừm——\\nPhiên bản đã lược bỏ hết những yếu tố dư thừa này có vẻ...」"
1598 = "「Kỳ diệu thật……. Thật kỳ diệu và thú vị.\\nĐây chính là nghệ thuật cắm hoa sao.」"
1601 = "「Vậy sao? Thế thì chúng ta bắt đầu học từ món thịt hầm khoai tây nhé.\\nKhông sao đâu. Quan trọng nhất là đong đếm và quan sát, chỉ vậy thôi.」"
1605 = "「Chị Mayami á?\\nĐược dạy điều gì cơ ạ~?」"
1607 = "「Dạ, chị Mayami?」"
1616 = "「Đúng là vậy——ừm. Thật đáng kinh ngạc.」"
1621 = "「Kisaki thì——dạy thẳng từ chính trà đạo, về lễ nghi,\\ncốt cách, cách sử dụng trà cụ, và tầm quan trọng của việc bảo quản.」"
1623 = "「Quản lý」"
1625 = "「Hoa đồng tiền hồng! Tuyệt quá đi~!\\nCực kỳ hợp với bé Reina luôn!!!」"
1626 = "「Nào.」"
1631 = "「Hơn nữa…… ừm. Quả thực tư thế cũng ổn định hơn hẳn.\\nTrọng tâm được hạ thấp, giải quyết được tình trạng chúi người về phía trước.」"
1633 = "「Chưa hết đâu nhé?\\nNếu cảm thấy chân sắp tê rồi, thì cứ làm thế này……」"
1635 = "「Còn tôi là chồng của Reina mà.」"
1637 = "「Bông hoa thay cho khăn cài túi áo ngực của anh,\\nkhông những làm tôn lên tổng thể mà còn là một điểm nhấn rực rỡ.」"
1638 = "「Thế này nhé? Con người thì sẽ đổ mồ hôi mà lị.\\nKhi đổ mồ hôi, lượng muối trong cơ thể sẽ trôi ra ngoài đúng không.」"
1639 = "「Nghe này, bé Rei.」"
1640 = "「Tự do hoa ạ.」"
1642 = "「Nghệ thuật cắm hoa còn có thể làm được nhiề-ều điều khác nữa cơ.\\nNếu hai người muốn thì...」"
1645 = "「Em có muốn làm thử một chút không?\\nDụng cụ đã chuẩn bị sẵn hết rồi, dễ lắm dễ lắm.」"
1651 = "「Thấy sợ là hoàn toàn chính xác. Dao là một vật rất nguy hiểm mà lị.\\nNgay cả chị bây giờ vẫn còn thấy sợ cơ mà.」"
1655 = "「Hoàn toàn chính xác! ——Xong」"
1656 = "「Chân, chân em, cô Kisaki!\\nCủa Reina, dạ, em duỗi chân ra có được không ạ.」"
1658 = "「Em cảm ơn ạ——Oaaaaaaaa」"
1659 = "「Không, may mà có cô nhắc nhở đấy.\\nTôi chợt nhận ra mình hoàn toàn chưa nghĩ đến một chuyện rất quan trọng.」"
1660 = "「Cảm ơn chị, chị Mayami.\\nKhông ngờ hương vị tuyệt hảo của nhà Migita lại có lý do như vậy.」"
1666 = "「Bàn tay, mèo——quen, rồi, nhưng mà——\\nReina, thấy hơi——sợ——nha~」"
1667 = "「Bàn tay, mèo——bàn tay, mèo——\\nbàn tay, mèo——bàn tay, mèo——」"
1668 = "「Bàn tay mèo!」"
1670 = "「Trong lúc chờ ninh……bé Rei, đây, cái này.」"
1687 = "「Là vậy đó. Tôi cũng có vài người bạn rất thích trà nữa.\\n——Nào.」"
1688 = "「Thế này cũng là nghệ thuật cắm hoa đấy.\\nTuy nói vậy, nhưng đây là cắm hoa theo phong cách Hibiki thôi.」"
1689 = "「Chuyện đó thì, nhé?」"
1690 = "「Dạ, chuyện đó thì, ừm——\\nReina là một Railord đời cũ, nên là...」"
1691 = "「Không sao đâu. Thế là tốt rồi.」"
1692 = "「Thông qua nghệ thuật cắm hoa để thiết kế chính cuộc sống của mình——\\nEm có cảm giác mình đã học được tầm quan trọng của việc lựa chọn và sắp xếp.」"
1693 = "「Đây là gì vậy ạ~? ……Ưm——Oa!!\\nOa! Nè, anh Soutetsu! Anh xem cái này đi.」"
1694 = "「Chắc là do ngay từ đầu, cả hai người đã có sự tôn trọng\\nđối với đồ vật một cách vô cùng tự nhiên rồi nhỉ.」"
1695 = "「Tôi muốn nhờ với tư cách công việc. Như vậy thì mới có thể thoải mái trao đổi mà không cần phải e ngại.」"
1696 = "「Những thứ như thế này là sở trường của em,\\ngọi là 『Tự do hoa』. Đây cũng là nghệ thuật cắm hoa đấy.」"
1697 = "「Là thành quả từ sự chỉ bảo của cô giáo Kisaki đấy.」"
1698 = "「Ra là vậy nha~」"
1699 = "「Vậy à. Thế thì chúng ta bắt đầu từ việc dùng dao nhé.\\nBé Rei, qua đây. Lại đây nào.」"
1701 = "「Thời gian ninh thay đổi theo mùa sao ạ~?」"
1702 = "「Sau đó, sau đó, bọn em còn được dạy về TPO,\\ncả việc quản lý tài chính và đầu tư tài sản nữa nha~」"
1708 = "「Mấy vị khách từ nước ngoài đến ấy mà.\\nHọ còn ngạc nhiên và thích thú gấp 10 lần Soutetsu đấy.」"
1709 = "「Chuyện là thế này nha~, anh Soutetsu.\\nĐiều mà Reina vừa nghe được ấy nha~」"
1711 = "「Thế thì, chị chỉ cần tập trung\\nvào việc dạy nấu ăn thôi là được rồi nhỉ.」"
1713 = "「Vậy thì, bé Hi\\nđã làm một người giáo viên tốt đối với bé Rei đúng không nào?」"
1714 = "「Vậy thì làm thử thôi nào! Đầu tiên là chọn hoa, bắt đầu từ việc\\nquyết định 3 vai trò 『Vai chính』, 『Vai phụ』 và 『Hỗ trợ』 nhé.」"
1717 = "「Nếu vậy thì.」"
1719 = "「Còn bình hoa của bé Reina dưới góc nhìn của anh hai thì sao?」"
1720 = "「Vậy, những kiểu cắm hoa truyền thống——dùng bàn chông kenzan\\nhay những thứ tương tự, là một thể loại khác sao?」"
1721 = "「Vậy thì, bây giờ mới là phần chính của lớp học này!\\nChúng ta cùng di chuyển sang phòng của anh hai và bé Reina nào!」"
1722 = "「Nếu vậy thì, chúng ta di chuyển đến bàn làm việc thôi.\\nTrước tiên, tôi xin phép được lắng nghe nguyện vọng của quý khách.」"
1723 = "「Anh hai?」"
1724 = "「Soutetsu thì…… hình như cũng biết đôi chút phải không?\\nTôi nhớ mang máng là đã nghe Hibiki kể chuyện đó.」"
1725 = "「Soutetsu. Cậu chắc hẳn cũng cùng với Reina」"
1728 = "「Sổ công thức nấu ăn…….\\nDành cho Reina…… mà ghi chép tỉ mỉ đến mức này sao.」"
1730 = "「Hoa Long đởm. Chị vui lắm. Trong mắt bé Rei, chị\\ntrông xinh đẹp đến nhường này cơ à.」"
1732 = "「!」"
1735 = "「（Ực, ực——phù）.\\nTrà rất ngon ạ.」"
1808 = "Một bông hoa được cài lên mái tóc Reina một cách rực rỡ.\\nNgay khoảnh khắc nhìn thấy nó, hai má Reina cũng ửng hồng như hai đóa hoa nở rộ."
1813 = "Không biết là chân đã hết tê chưa,\\nnhưng đôi mắt Reina sáng rực lên và lập tức ngồi lại ngay."
1817 = "……Có thể là do cái nhìn thiên vị của một người chồng, nhưng em ấy rất có gu.\\nMột tác phẩm mang đậm phong cách Reina, đáng yêu, làm nổi bật sắc hồng của bông hoa chính."
1818 = "Có vẻ thích thú với âm điệu của từ đó, giọng Reina trở nên vui tươi hơn.\\nĐủ để thổi bay hoàn toàn chút cảm thương mỏng manh trong tôi."
1824 = "Chị Mayami vòng tay ôm lấy Reina đang đứng trên ghế đẩu từ phía sau,\\nvà chậm rãi, cẩn thận chỉ dạy em ấy cách dùng dao."
1835 = "Phân loại, xếp hàng, sắp xếp gọn gàng, làm rõ vai trò của hoa chính, hoa phụ và hoa hỗ trợ.\\nVới chỉ thị lần này của Hibiki, tôi không còn chút do dự nào nữa."
1837 = "Là chiếc ghế đẩu. Tôi nhớ lại hồi Hibiki còn nhỏ.\\nHibiki cũng từng đứng trên đó tập nấu ăn dưới sự quan sát của tôi."
1839 = "Khuôn mặt đang cúi gầm của Reina ngẩng phắt lên.\\nĐôi mắt em ấy lấp lánh ánh sáng của sự quyết tâm."
1840 = "Phần tôi định dùng để tạo dáng đã bị cắt gọt sạch sẽ.\\nGiản dị, làm nổi bật bông hoa chính——thực sự rất thuận mắt."
1866 = "Vài giây trôi qua, một khoảng thời gian thật ấm áp.\\nÁp má cọ cọ rồi buông Reina ra, chị Mayami nhìn sâu vào mắt em ấy."
1868 = "Kisaki hơi nhấc mông lên, để lộ đôi chân——phần mắt cá chân cho chúng tôi xem.\\nHai mắt cá chân hơi mở ra, hệt như đang vẽ một vòng tròn——"
1880 = "Ngay khoảnh khắc nhìn thấy, tôi đã nghẹn lời.\\nĐây là toàn bộ bí mật về hương vị của nhà Migita——không, của chị Mayami."
1881 = "Sắp khóc sao——tôi thoáng có ảo giác như vậy, nhưng chị Mayami\\ndang mỉm cười. Một nụ cười rạng rỡ và tuyệt đẹp."
1883 = "Tôi tự động cúi đầu xuống."
1885 = "Làm theo chỉ thị dời chiếc bàn trà hình tam giác và sofa đi,\\nKisaki liền nhanh nhẹn trong khoảng thời gian đó——!"
1887 = "Sánh bước cùng Reina, tôi ôm bình hoa trở về phòng."
1889 = "Hai bình hoa mang hai phong cách hoàn toàn khác biệt.\\nThế nhưng chúng lại kỳ diệu mang đến sắc màu và sự hài hòa cho cả căn phòng."
1891 = "Đang được yêu thương. Đang được bao bọc. Cả tôi và Reina.\\nBởi nhà Migita——không, bởi tất cả những người luôn quan tâm đến chúng tôi."
1893 = "Tôi trang trí thật nhiều bông hoa nhỏ xung quanh bình hoa.\\nThật rực rỡ, thật hạnh phúc, tựa như đang ôm trọn lấy Reina vậy."
1895 = "Tôi luồn tay dưới hai nách, từ từ nhấc bổng Reina lên.\\nĐợi cho đôi chân từ từ duỗi thẳng ra hết, rồi lại cẩn thận đặt em ấy ngồi xuống."
1897 = "Tôi nhớ lại hình ảnh Hachiroku mặc tạp dề kappogi\\nmà dạo gần đây thường xuyên nhìn thấy."
1899 = "Bắt chước Reina, tôi cũng chọn hoa và bắt tay vào làm.\\nSau khi chọn xong cả hoa hỗ trợ, chúng tôi bắt đầu thực hành ngay."
1901 = "Hai bàn tay tôi, chỉ có thể bảo vệ được mỗi Reina.\\nChính vì hiểu rõ điều đó, mong muốn ấy lại càng trở nên mạnh mẽ hơn."
1903 = "Tôi thử nhẹ nhàng đặt bình hoa của mình lên hốc tường tokonoma,\\nnơi không có đồ đạc của Reina."
1909 = "\"Người có chứng chỉ chính thức và ở càng gần càng tốt\".\\n——Tất nhiên, Kisaki hoàn toàn đáp ứng được những điều kiện đó."
1926 = "Lách cách, lách cách, chiếc kéo của Hibiki lại di chuyển.\\nCùng là loại hoa vừa điểm tô cho Reina khi nãy——hửm?"
1929 = "Chiếc kéo trong tay Hibiki di chuyển thoăn thoắt.\\nNhững phần thừa thãi bị cắt bỏ, chỉ để lại vẻ đẹp đáng yêu của bông hoa."
1930 = "Hibiki cầm lấy chiếc kéo và một nhành cây.\\nKhông phải hoa, mà là một cành lá xanh tươi xum xuê."
1933 = "Hibiki thoăn thoắt nhấc một bông hoa đã chuẩn bị sẵn lên."
1935 = "Hibiki chỉ tay về phía chiếc bàn.\\nỞ đó mọi thứ——ngay cả dụng cụ, cũng được sắp xếp vô cùng gọn gàng."
1937 = "Hibiki cũng mỉm cười đầy mãn nguyện.\\nChỉ với một bông hoa, căn phòng đã hóa thành một cánh đồng hoa ấm áp."
1939 = "Gật đầu.\\nHibiki đi đến ngay trước mặt Reina, ngồi xuống sát đến mức hai đầu gối chạm vào nhau."
1941 = "Là một cuốn vở khổ lớn.\\nĐược kẹp những tờ giấy nhớ đủ màu sắc vô cùng gọn gàng."
1944 = "Ngoài công thức thông thường, còn ghi rõ cả thời gian ước tính.\\nĐược phân loại chi tiết theo từng trạng thái của tôi, của Hibiki."
1948 = "Vặn nhỏ lửa nồi ninh xuống mức liu riu,\\nchị Mayami nhanh chóng rửa tay dưới vòi nước rồi lau khô."
1953 = "Reina gật đầu liên tục. Có thể thấy Reina cũng giống như tôi,\\nđang đặt niềm tin sâu sắc vào Kisaki."
1955 = "Reina và Hibiki. Hai chị em dâu mỉm cười nhìn nhau.\\nQuả thật, một cuộc sống có hoa thật sự rất hạnh phúc."
1957 = "Trông họ thật hạnh phúc. Cả Reina, cả chị Mayami, cả hai người.\\nCảm giác như bị cho ra rìa, tôi thấy hơi chạnh lòng."
1960 = "Reina hào hứng giơ tay lên.\\nNụ cười rạng rỡ hướng về phía tôi, đôi mắt ngước lên nũng nịu."
1962 = "Reina cầm kéo lên, lạch bạch bước về phía bình hoa.\\nVà rồi——ồ——ồ ồ——chà, cái này."
1963 = "Bình hoa của Reina vươn dài, mộc mạc và vô cùng đáng yêu.\\nCòn của tôi tuy giản dị nhưng lại mang vẻ vững chãi, chắc chắn."
1966 = "Sống lưng Reina thẳng tắp."
1968 = "Cái cúi chào nghiêm trang của Reina khi đang ngồi.\\nHibiki nhìn tôi với ánh mắt ngạc nhiên."
1969 = "Một sự lựa chọn không chút do dự.\\nCả Hibiki và tôi đều gật gù đồng tình."
1972 = "Reina tự nhận ra sự lỏng lẻo của mình.\\nSống lưng em ấy lại một lần nữa thẳng tắp."
1974 = "Góc đồ đạc cá nhân vốn dĩ đã mềm mại đáng yêu của Reina,\\nnay được điểm xuyết thêm bình hoa bỗng trở nên rực rỡ hẳn lên."
1976 = "Đột nhiên, Reina xìu xuống."
1978 = "Reina nhìn chị Mayami.\\nChị ấy mỉm cười gật đầu đáp lại."
1980 = "Được ôm chầm lấy một cách dịu dàng,\\nđôi mắt Reina thoáng ngạc nhiên rồi nhanh chóng nheo lại vì hạnh phúc."
1982 = "Reina nhảy phốc khỏi ghế đẩu, chạy đến ôm chầm lấy tôi.\\nKhi tôi đón lấy em ấy, mùi hương và giọng nói của Reina lan tỏa khắp lồng ngực."
1983 = "Reina khẽ gật đầu trong im lặng.\\nTrán chị Mayami áp vào gáy nhỏ nhắn của Reina."
1984 = "Reina khẽ gật đầu, rồi cứ thế cúi gầm mặt xuống.\\nChị Mayami dùng hai tay nhẹ nhàng ôm lấy đôi má em ấy."
1987 = "Nụ cười rạng rỡ bừng sáng."
1989 = "Reina hớn hở, chỉ chực nhảy cẫng lên.\\n“Vui vẻ chính là TPO”, Hibiki đã dùng hành động để chứng minh điều đó."
1994 = "Chà, khéo thật. Trái ngược hoàn toàn với cách Kisaki dẫn dắt từ khuôn mẫu đến ý nghĩa.\\nHibiki lại dẫn dắt từ ý nghĩa đến khuôn mẫu."
2006 = "Bên tai Reina. Giọng chị Mayami gần như chỉ là tiếng thì thầm.\\nNhưng Reina ngay lập tức lộ vẻ mặt nghiêm túc."
2007 = "Chị Mayami nhẹ nhàng ôm lấy Reina từ phía sau.\\nĐứng trên chiếc ghế đẩu, Reina có chút bối rối."
2008 = "Tôi nghĩ chị ấy thì thầm vì không muốn cho tôi nghe thấy.\\nThế nhưng, quả nhiên, nếu có thể thì——"
2010 = "Chị Mayami ghé sát miệng vào tai Reina.\\nEm ấy thoáng nhột một chút, rồi lập tức lộ vẻ mặt an tâm."
2012 = "Chị Mayami khum hai bàn tay thành hình ống, áp vào tai Reina."
2013 = "Khuôn mặt chị Mayami bừng sáng.\\nĐôi bàn tay cẩn thận đưa ra, nhận lấy bình hoa từ tay Reina."
2016 = "Với vẻ mặt hơi ngạc nhiên, chị Mayami rời trán ra.\\nReina quay ngoắt lại, nhìn thẳng vào mắt chị ấy."
2017 = "Khoảnh khắc chị Mayami thì thầm điều gì đó,\\nReina bật cười khúc khích ư hư hư."
2018 = "Một tiếng cười khúc khích nhỏ vang lên.\\nNhư thể sắp tiết lộ một bí mật quan trọng, giọng chị Mayami trầm xuống."
2022 = "Mỉm cười tươi rói, nhẹ nhàng xoa đầu Reina.\\nLần này, ánh mắt chị Mayami hướng về phía tôi."
2025 = "Rất nhanh nhẹn, dứt khoát.\\nMột Reina như thế này cũng thực sự rất đáng yêu."
2052 = "Tôi chợt nghĩ, cả Kisaki và Reina,\\nmỗi người đều là kết tinh của \"sự giáo dục tốt\" theo cách riêng của họ."
2054 = "Một cái cúi chào của Kisaki, gần giống như chào bằng mắt.\\nCùng với Reina, tôi đáp lại bằng một cái cúi chào sâu hơn."
2056 = "Cách nói đầy tính kịch ấy nhẹ nhàng khiển trách tôi.\\nQuả thực phát ngôn của tôi cũng dễ bị hiểu nhầm là đang mỉa mai."
2058 = "Hiếm khi thấy Kisaki ấp úng như vậy.\\nNằm ngoài phạm vi được nhờ——tức là không phải công việc sao——"
2061 = "Cái gật đầu của Kisaki vô cùng tĩnh lặng."
2062 = "Kisaki thẳng lưng lên, ánh mắt hướng về phía tôi."
2064 = "Hai ngón chân cái của Kisaki xoay nhẹ, đổi chỗ cho nhau."
2066 = "Giọng của Kisaki hạ xuống nhiệt độ của công việc.\\nBình tĩnh và không lẫn chút cảm xúc dư thừa nào."
2067 = "Ánh mắt Kisaki dịu lại."
2069 = "Kisaki nhìn tôi, rồi nhìn Reina."
2070 = "（Nhấc nhẹ）"
2072 = "Kisaki mỉm cười.\\nReina cũng bị cuốn theo, nở nụ cười tươi rói."
2074 = "Kisaki quay lưng về phía chúng tôi và ngồi seiza."
2076 = "Hờ, Kisaki khẽ thở hắt ra.\\nBầu không khí đang căng như dây đàn chợt chùng xuống."
2077 = "Kisaki bước lên chiếu tatami lắp ghép——à không, bước vào phòng trà và chỉnh đốn lại chỗ ngồi.\\nNgay lập tức, bầu không khí trở nên tĩnh lặng, nghiêm trang và cân bằng."
2079 = "Kisaki lẩm bẩm vẻ thích thú."
2081 = "Đầu ngón tay trắng ngần của Kisaki, nhẹ nhàng, thật nhẹ nhàng,\\nchạm vào môi Reina và khép nó lại."
2084 = "Kisaki lặng lẽ nhắm mắt lại.\\nGiọng nói cất lên còn tĩnh lặng hơn."
2086 = "Gật đầu, Kisaki hướng ánh mắt về phía tôi."
2090 = "Nghe nói vậy mới thấy đúng thật. Ngay cả lúc cô ấy gấp bánh pizza lại để ăn——\\nKhông, vốn dĩ hành động gấp bánh pizza lại đó đã……"
2091 = "Nghe vậy, Kisaki mỉm cười tinh nghịch."
2092 = "Lời lẩm bẩm như thể buột miệng thốt ra những suy nghĩ trong đầu. Thấy vui thật đấy.\\nCả tôi và Reina đều đang lo lắng cho nhau. Vì thế——"
2093 = "Nghe tiếng Reina, tôi liền nhìn vào gương.\\nKhoảnh khắc nhìn thấy, tôi không kìm được mà lên tiếng."
2094 = "Mỉm cười trước giọng nói của Reina.\\nKisaki cúi người xuống, ánh mắt ngang tầm với Reina."
2095 = "Lời nói hòa quyện, ánh mắt giao nhau.\\nKhi tôi khẽ gật đầu, Reina tiếp tục nói với giọng đầy nhiệt huyết."
2096 = "Giật mình quay sang nhìn vì giọng nói như pha lẫn giữa sự nhẹ nhõm và tiếng hét,\\ntôi thấy khuôn mặt Reina đang đỏ bừng."
2104 = "Cộc, cộc, tiếng dao thái nhè nhẹ vang lên.\\nTuy không nhịp nhàng, nhưng nghe rất cẩn thận và chắc chắn."
2109 = "Được cô bé chỉ tay tôi mới nhận ra. Ở một góc tường,\\ncó treo một tấm bằng lồng khung ghi dòng chữ 『Sư phạm bậc 4』 cùng tên của Hibiki."
2119 = "So với em ấy, tôi lại có vẻ——"
2125 = "Nhưng nếu có một quá khứ như thế, thì sẽ không có hiện tại của tôi và Reina.\\nNghĩ cũng chẳng ích gì, tôi lắc đầu xua đi dòng suy nghĩ đó."
2130 = "Lần này là 100% nhẹ nhõm.\\nReina ngọ nguậy mông, cố gắng duỗi chân ra."
2131 = "Khuôn mặt được Kisaki chỉ dạy. Tư thế khi được người khác chỉ bảo.\\nReina cảm nhận được điều gì đó, và đang tập trung vào việc học hỏi."
2132 = "Nghe cô ấy nói tôi mới nhận ra. Tôi đâu thể làm việc mãi mãi được,\\nvà sau khi tôi qua đời, Reina vẫn có thể tiếp tục hoạt động cả trăm năm nữa."
2163 = "（Chị Mayami…… lại là một người tràn đầy tình mẫu tử đến thế sao.\\nKhông, không phải. Tình mẫu tử vốn có từ trước. Giờ đây cuối cùng cũng……）"
2168 = "（Lách cách——phập——lách cách………………phập）"
2169 = "（Tách!）"
2170 = "（Tách）"
2172 = "（Dù vậy, giá như hồi đó, chỉ một chút thôi. Giá như chị ấy\\ncó thể dành những khoảng thời gian như thế này cùng Hibiki bé nhỏ……）"
2174 = "（Là do được giáo dục tốt sao.）"
2178 = "（Muốn——đền đáp ân tình này quá.\\nCùng với Reina, dù chậm rãi, dù chỉ từng chút một）"
2182 = "（Nói đúng hơn thì. Reina cũng khá là——）"
2185 = "（Hồi đó chị Mayami hoàn toàn không có thời gian,\\ncũng như tâm trí cho những việc như vậy——）"

[selections]
