1146 = "「Tuyệt thật. Tương lai đó thật tuyệt vời.」"
1147 = "「Giống như ông Denjiro và bà Kayoko vẫn luôn ở trong Reina vậy nha~」"
1150 = "「——Xong. Ư hư hư~, anh Soutetsu ơi~. Xong rồi nha~!」"
1152 = "「Chỉ cùng nhau tận hưởng những niềm vui mà anh biết thì hơi buồn một chút. Anh cũng muốn chia sẻ những niềm vui mà Reina biết nữa.」"
1153 = "「Reina, nếu sau này đường sắt được nối đến tận Katakami. Chỉ một lần thôi cũng được.」"
1156 = "「Thật hạnh phúc, thật vui vẻ—— Ư hư hư~, thật là một điều tuyệt vời nha~」"
1158 = "「Chị Mayami đã dạy Reina rằng, nếu dùng muối hay nước tương để làm đậm vị, thì sẽ không tốt cho sức khỏe của anh Soutetsu đâu nha~」"
1160 = "「Loại chị Mayami muối, loại chị Hibiki muối, và loại Reina muối, tất cả đều được để riêng biệt nha~」"
1162 = "「Quả thực, kết hôn chính là sự gắn kết giữa hai gia đình nhỉ.」"
1165 = "「Gia đình……Gia đình. Sao.」"
