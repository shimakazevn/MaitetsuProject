1124 = "「Ư hư hư~, Reina cũng muốn chia sẻ cùng anh nha~」"
1125 = "「Ê hê hê~, vì hôm nay hẹn hò chúng ta đã đi bộ rất nhiều, nên Reina đã nêm nước dùng đậm đà hơn một chút xíu đó nha~」"
