1239 = "「Ừ, nhưng nếu em cứ một mình bước đi, bỏ anh lại phía sau thì anh sẽ buồn lắm. Anh muốn hai ta cùng nhau bước đi.」"
1240 = "「Đúng thế nha~. Lúc ăn đồ chiên rán, nếu là chanh thì 100% anh sẽ vắt, nhưng nếu là thanh yên hay quýt sudachi thì hầu như anh Soutetsu chẳng vắt bao giờ.」"
1241 = "「Đúng vậy. Những cảnh vật nhìn thấy từ trên cao và cả những nơi xa hơn nữa—— Toàn bộ thế giới này, ngay từ đầu đã là của Reina rồi.」"
1242 = "「Đúng vậy.」"
1243 = "「Đúng là vậy nhỉ. Giống như cha, mẹ, và Michiko vẫn luôn ở trong anh vậy.」"
1244 = "「Đúng là vậy. Vì thế nên chắc chắn cũng có những hạn chế bị áp đặt, và việc coi đó là điều hiển nhiên cũng là chuyện tự nhiên thôi.」"
1245 = "「Đúng vậy nha~. Gắn kết với nhau, và hòa quyện vào nhau nha~. Gia đình của anh Soutetsu, và gia đình của Reina.」"
1246 = "「Đúng rồi ạ. Vì anh Soutetsu rất thích chanh mà nha~. Reina đã thử thay quả thanh yên trong công thức bằng chanh đó ạ~」"
1258 = "「Chị Paulette, ông Denjiro và cả bà Kayoko nữa. Đều là gia đình của Reina, và điều đó sẽ mã-ãi không bao giờ biến mất nha~」"
1259 = "「Kiểu người hâm mộ đường sắt như vậy…… nhỉ. Nhờ chị Paulette mà Reina cũng trở thành kiểu người hâm mộ đường sắt như thế rồi nha~」"
1265 = "「Từ đó đến Okayama. Rồi khôi phục tuyến đường đến tận Katakami à.」"
1267 = "「Cả ba mẹ nữa nha~. Rồi còn——ư hư hư, những người họ hàng nữa.」"
1268 = "「Này, Reina.」"
1269 = "「Reina cũng vậy nha~!」"
1271 = "「Reina cũng vậy nha~. Ư hư hư, vợ chồng mình giống nhau nhỉ.」"
1272 = "「Reina cũng vậy nha~」"
1274 = "「Reina cũng vậy nha~. Một mình thì sợ và chán lắm. Dù có bước vào một thế giới chưa từng biết đến thì...」"
1276 = "「Reina đi pha trà nha~」"
1278 = "「Reina còn ấm hơn chăn nhiều.」"
1280 = "「Reina cũng rất hoan nghênh chuyện đó nha~, nhưng mà...」"
1282 = "「Reina chưa từng nghĩ như vậy bao giờ nha~. Nhưng mà——」"
1284 = "「Cùng với anh Soutetsu là tuyệt nhất. Mãi mãi, dù là đi đến tận đâu.」"
1286 = "「Niềm vui mà Reina biết……」"
1287 = "「Reina là Railord, nên đâu thể có em bé được nha~」"
1289 = "「Reina nghĩ là sẽ không biến mất đâu nha~. Bởi vì」"
1291 = "「Mời anh ạ. Ư hư hư~, Reina cũng xin phép dùng bữa……hửm? Ơ kìa, trống không.」"
1293 = "「Reina. Chúng ta hãy kéo dài tuyến đường sắt ra đi. Xa hơn cả Yatsushiro, Kumamoto, hãy kết nối và kéo dài nó ra một lần nữa.」"
1294 = "「Tất nhiên rồi nha~. Nếu anh Soutetsu không cười tươi, Reina cũng sẽ ỉu xìu và cảm thấy buồn lắm đó nha~」"
1295 = "「Tất nhiên rồi nha~. Chúng ta được kết nối với nhau mà.」"
1297 = "「Đúng thật nha~」"
1299 = "「Thực sự rất ngon. Rất thanh mát. Không gì tuyệt vời hơn để làm sạch miệng. Đúng chuẩn hương vị của nhà Migita.」"
1302 = "「Vậy sao. À không, nghe em nói mới thấy……」"
1303 = "「Vậy sao ạ~?」"
1306 = "「Kết hôn, trở thành vợ chồng. Anh đã nghĩ rằng—— 『Mình đã tạo dựng được gia đình của riêng mình rồi nhỉ』.」"
1310 = "「Kết hôn, sao.」"
1315 = "「Nghe nói là hoa Thiên điểu đó nha~. Reina tìm thấy ở cửa hàng hoa, thấy nó cực kỳ hợp với quả ngô đồng luôn á.」"
1316 = "「Hai ta kề vai sánh bước, cũng rất rất là tuyệt vời. Nhưng mà, hiện tại thì...」"
1319 = "「Muốn xóa bỏ chắc chắn còn khó hơn đó nha~. Bởi vì mọi người ở Đường sắt Ohito cũng là gia đình của Reina mà.」"
1321 = "「Thật đáng tiếc nếu chúng biến mất khi chúng ta chết đi. Dù có lẽ là điều không thể tránh khỏi, nhưng anh thấy sợ và buồn lắm.」"
1322 = "「Sự chồng chất đó, sẽ không bao giờ biến mất nhỉ. Dù bị chia cắt bởi thời gian, khoảng cách. Hay thậm chí là cái chết.」"
1323 = "「Sự hiện diện của Reina trong ngôi nhà Migita này, đang tăng lên từng chút một, và dần dần hòa nhập một cách thật tự nhiên nhỉ.」"
1329 = "「Tương lai. Chắc chắn. Dành cho những đứa trẻ.」"
1330 = "「Ra là vậy.」"
1331 = "「Ra là vậy nha~. Reina là đứa trẻ sinh ra ở Katakami nên không cảm nhận rõ lắm, nhưng mà...」"
1337 = "「Nghe vậy anh thấy yên tâm lắm. Lỡ mà mấy cậu phụ lái tàu xin nghỉ phép trùng nhau, chắc anh phải nhờ Reina giúp một tay quá.」"
1339 = "「Nếu vậy thì đây là——」"
1340 = "「Vậy thì vậy thì, anh cứ dùng những từ ngữ vụng về cũng được nha~」"
1343 = "「Vậy quyết định thế nhé.」"
1344 = "「Vậy, anh cũng xin mời một lần nữa.」"
1346 = "「Nếu vậy thì anh cũng rất vui. Nhưng mà này, Reina.」"
1350 = "「Vậy thì cùng nhau về nhà thôi. Hai ta kề vai sánh bước——」"
1351 = "「Vậy thì, ăn thôi. Mời em.」"
1353 = "「Nếu vậy, chúng ta sẽ phải nhờ Đường sắt Kurogane làm việc nhiều hơn nữa rồi.」"
1354 = "「Vậy thì vậy thì anh Soutetsu, lần tới không phải là trải nghiệm du lịch nữa, mà anh hãy dạy cho Reina đà-àng hoàng nha~」"
1355 = "「Vậy thì, ngày nghỉ tới chúng ta đi đâu đó để đi tàu hay chụp ảnh, thử đi xa một chuyến thì sao?」"
1356 = "「Nếu vậy thì, tất cả những đứa trẻ đó. Sẽ là những đứa con của Reina và anh Soutetsu.」"
1357 = "「Vậy thì, trước tiên phải nối đến cảng Moji, chui qua hầm eo biển Kanmon.」"
1361 = "「Việc kết nối tuyến đường sắt, cũng chính là kết nối chúng ta.」"
1363 = "「Anh Soutetsu thì thấy cái nào vui hơn ạ~? Luyện tập xúc than dồn toa, hay là cùng nhau đi tàu.」"
1364 = "「Chuyện là thế này nha~, anh Soutetsu. Cho đến vài chục năm trước, khu mỏ và thị trấn mỏ là toàn bộ thế giới của Reina đó nha~」"
1365 = "「Anh Soutetsu ơi~, nếm thử món này xem sao nha~」"
1370 = "「（Ực, ực, ực）. ——Khà, ngon quá nha~」"
1372 = "「（Sụp soạp） Ưm……Ưm——ừm. Ngon. Chà, thực sự ổn định rồi đấy. Ngay cả một món dưa muối thôi cũng vậy.」"
1375 = "「?」"
1377 = "「? Chuyện gì vậy ạ~, anh Soutetsu.」"
1478 = "Nhấm nháp và nuốt miếng cuối cùng, tôi đặt đũa xuống."
1483 = "Đối với một Railord thì khá là hiếm thấy nhỉ. À không, không phải. Nếu đã như vậy thì——"
1485 = "Kết nối. Được kết nối. Chồng chất. Được chồng chất. Những hình ảnh đó, cứ thế dần trở thành hiện thực."
1490 = "Phải chăng đây chính là điều mà Hachiroku và Paulette thực sự mong muốn. Việc kết nối tuyến đường sắt, cũng chính là kết nối những tâm tư và lịch sử."
1491 = "Gắp thêm một miếng nữa. ……Không, vẫn không hiểu nổi. Nhưng—— Sự khác biệt mà lưỡi tôi không thể nhận ra, dữ liệu lại chỉ ra một cách rõ ràng."
1496 = "Một mục tiêu quá đỗi lớn lao, lại được Reina dùng sự ngây thơ của mình để chia nhỏ thành một kích thước thực tế hơn."
1521 = "Khi thử thốt lên thành lời một lần nữa, sự thấu hiểu dần dâng trào trong tôi."
1522 = "Cộc, cộc. Chậm rãi và đều đặn——tiếng dao thái bằng bàn tay mèo."
1524 = "Dùng củ cải phơi khô muối chua để thanh lọc hương vị súp Tsubon-jiru trong miệng. Món dưa muối của nhà Migita có đặc trưng là được muối cùng rượu shochu, nhưng……"
1530 = "Hạnh phúc đến mức khiến tôi cảm thấy sợ hãi. Có lẽ vì vậy, mà tôi chợt cảm thấy có chút cô đơn."
1533 = "Khuôn mặt ngạc nhiên. Giọng nói ngạc nhiên. Rồi dần dần tan chảy thành một nụ cười hạnh phúc."
1534 = "Một câu hỏi mộc mạc không ngờ tới. Cùng với lời nói của Reina, người đã sống lâu hơn tôi……không."
1537 = "Em ấy gập tay lại rồi nâng lên—— nhưng bắp tay em ấy làm gì có chút cơ bắp nào."
1539 = "Siết chặt. Vòng tay ôm tôi trở nên mạnh mẽ hơn. Cảm nhận được một nỗi niềm đau đáu nào đó, tôi cũng dịu dàng ôm lại em ấy."
1541 = "Yêu thích hệ thống đường sắt một cách mù quáng. Vì vậy, chỉ đi tàu, chụp ảnh/thu âm hay ăn uống thôi là không đủ."
1543 = "Chính vì những lời nói thong thả, mang theo chút buồn ngủ ấy, mà nó càng thấm sâu vào lòng tôi."
1544 = "Chỉ cảm thấy thật đáng yêu. Chúng tôi trao nhau nụ hôn một cách thật tự nhiên."
1546 = "Dáng đứng thẳng tắp, tư thế và động tác đều mang đậm dấu ấn từ sự chỉ dạy của Kisaki. Điều đó rồi cũng sẽ hòa lẫn vào một phần gia đình của chúng tôi."
1549 = "Mỉm cười rạng rỡ. Nụ cười của Reina dường như không bao giờ tắt. Vì thế, hỏi lại em ấy lúc này có lẽ hơi phá hỏng bầu không khí, nhưng——"
1550 = "Em ấy mơ màng đồng ý. Sự êm đềm đó thật dễ chịu."
1552 = "Đôi chân lại bắt đầu ngọ nguậy."
1554 = "Một giọng điệu ngạc nhiên rất đỗi thong thả. Rồi từng lời, từng lời chậm rãi được cất lên."
1555 = "Nếu coi huyết thống là sự kết nối, thì sự kết nối của tôi rất mỏng manh. Cha mẹ quá cố của tôi đều là con một, và ông bà cũng đã qua đời."
1557 = "Thật thích hợp để khép lại một ngày, một cuộc trò chuyện vô cùng nhẹ nhàng——nhẹ nhàng và êm đềm."
1560 = "Đúng vậy. Chúng tôi là vợ chồng. Vợ tôi là Reina. Cứ truyền đạt cho đến khi em ấy hiểu là được. Chẳng có gì phải vội vàng cả."
1564 = "Dù đã chia nhỏ ra, nhưng đó vẫn là một chặng đường dài đằng đẵng. Nhưng cũng không hẳn là một câu chuyện viển vông."
1578 = "Các điểm du lịch ở Ohimitera giờ đây giống như khu vườn nhà tôi vậy. Tất nhiên tôi có thể giải thích cặn kẽ, và Reina cũng sẽ rất vui."
1584 = "Nghĩ đến đó, những tâm tư cũng dần kết nối lại. Một hình hài rõ rệt, hiện lên thành một điều ước."
1586 = "Để ý kỹ thì không chỉ riêng mỗi hương vị. Ngay cả bông hoa trên bàn ăn cũng vậy——"
1593 = "Tôi gắp thêm một miếng, rồi lại một miếng nữa, từ từ nhấm nháp để kiểm chứng."
1596 = "Tôi của trước kia cũng từng như vậy. Trước khi gặp Reina, trước khi đem lòng yêu Reina."
1600 = "Trên đường về, hai chúng tôi sánh bước bên nhau. Vừa chầm chậm bước đi, tôi vừa nhẹ nhàng vuốt tóc Reina."
1601 = "Những lời nói êm đềm trao đổi cùng nhau dần hòa quyện thành một luồng suy nghĩ. Reina và tôi, đang cùng nhau tạo ra câu trả lời của riêng hai đứa."
1602 = "Cùng chung một suy nghĩ. Chỉ đơn giản vậy thôi cũng khiến tôi thấy vui."
1603 = "Chuẩn bị tinh thần cho những rắc rối. Tôi từng hiểu lầm đó là một câu nói mang ý nghĩa như vậy, nhưng."
1606 = "Cha mẹ và Michiko trong tôi, Paulette trong Reina, cả ông Denjiro và bà Kayoko nữa, chắc chắn đều đang hòa quyện vào nhau."
1607 = "Lòng biết ơn trào dâng sâu sắc. Những phần ẩn giấu trong hương vị của nhà Migita…… Chắc hẳn cả chị Mayami và Hibiki đều đã tỉ mỉ điều chỉnh cho tôi."
1610 = "Tôi có thể cảm nhận được. Tâm tư của Reina——câu trả lời của chúng tôi, thật rõ ràng."
1612 = "Tôi nhấc bổng Reina lên rồi công kênh em ấy trên vai. Cứ thế đứng thẳng dậy, chậm rãi bước đi."
1614 = "Tôi vẫn cõng em ấy trên vai và bước đi. Bằng những sải chân dài nhất có thể."
1618 = "Tôi vững vàng đỡ lấy Reina đang lao vào ôm chầm lấy mình."
1619 = "Tôi cản Reina đang định đứng dậy, rồi bước ra vườn. Rót từ can xăng đầy tràn vào chiếc bình tông."
1622 = "Tôi luồn những ngón tay chơi đùa với mái tóc mềm mại của Reina. Nhiều lần, rất nhiều lần. Lặp đi lặp lại những cái vuốt ve nhè nhẹ."
1625 = "Món dưa muối hôm nay sao mà tốn cơm thế. Quả thật đã có rất nhiều, rất nhiều lần tôi cảm thấy như vậy."
1626 = "Đôi chân đang đung đưa đầy vui vẻ trên vai tôi bỗng dừng lại."
1628 = "Nhẹ nhàng. Tôi chạm vào chân Reina. Em ấy giật mình, phản ứng như bị nhột."
1629 = "Nếu vậy, tôi sẽ đền đáp lại phần ân tình đó. Bằng tất cả những gì tôi có thể làm, bằng cả tấm lòng và sự chân thành."
1631 = "Tôi ngồi xổm xuống, để tầm mắt ngang với Reina. Reina chợt bước lại gần, đầu mũi hai đứa khẽ chạm vào nhau trong chốc lát."
1633 = "Trước câu nói bất ngờ đó, tôi hỏi lại, Reina càng thở hắt ra bằng mũi mạnh hơn, vẻ đầy tự hào."
1634 = "Gật đầu. Tôi chợt nhận ra. À——đây chính là. Có lẽ đây chính là——"
1641 = "Trong Hibiki, trong chị Mayami, trong Paulette, trong Hachiroku, trong Navi, chúng tôi vẫn luôn tồn tại."
1644 = "Giấc mơ của Paulette, tâm nguyện của Hachiroku. Lần đầu tiên, tôi nhận thức rõ ràng đó cũng chính là mong muốn của bản thân mình."
1653 = "Reina vừa vươn vai thật rộng vừa nở nụ cười rạng rỡ."
1655 = "Reina vươn người cựa quậy, áp má cọ cọ vào má tôi. Làn da và nhiệt độ cơ thể cũng mềm mại hòa quyện vào nhau."
1657 = "Bước chân dừng lại. Reina cứ thế ngước nhìn tôi chằm chằm."
1658 = "Ư hư hư, Reina bật cười hạnh phúc."
1661 = "Reina dang rộng hai tay."
1663 = "Reina ôm chầm lấy tôi. Dang rộng đôi tay nhỏ bé hết mức có thể——ôm lấy tôi."
1665 = "Ư hư hư, một nụ cười tủm tỉm đầy vui vẻ."
1666 = "Reina lại tiếp tục kết nối những suy nghĩ của tôi. Ra là vậy. Cho đến nay tôi hoàn toàn không hề có ý thức đó, nhưng——"
1668 = "Một cử động nhỏ. Chắc chắn là cái gật đầu im lặng của Reina."
1669 = "Reina huých vai vào tôi. Đáp lại hành động nũng nịu đó, tôi cũng huých vai lại."
1672 = "Hơi ấm của Reina thấm sâu vào tận đáy lòng tôi. Sự ấm áp này, là một chân lý vô cùng giản đơn."
1674 = "Cọ cọ——dúi dúi. Reina dụi đầu vào ngực tôi. Tuy có hơi đau một chút, nhưng cảm giác đó lại vô cùng dễ chịu."
1675 = "Reina nói một cách rất thản nhiên. Tôi cũng gật đầu một cách rất thản nhiên."
1678 = "Một nụ cười tinh nghịch hiếm thấy ở Reina. Thấy lạ, tôi dừng đũa lại."
1679 = "E hèm, Reina ưỡn ngực tự hào."
1682 = "Nhìn nụ cười rạng rỡ của em ấy, tôi đã hiểu. Ra là vậy, Reina…… tiêu chuẩn tận hưởng niềm vui của Reina là"
1694 = "Kisaki, Nagi, Fukami. Từ đó tiếp tục kết nối và đan xen với tất cả mọi người."
1698 = "Trên bầu trời, tiếng bay rì rì vang lên. Vẫn là sự hỗ trợ tuyệt vời như mọi khi."
1703 = "Yếu tố của chị Mayami. Yếu tố của Hibiki. Yếu tố của tôi. Yếu tố của Hachiroku. Chắc chắn chẳng bao lâu nữa, yếu tố của Reina cũng sẽ trở nên quen thuộc đến mức không còn bận tâm nữa."
1707 = "Và Reina cũng đã học hỏi và làm điều tương tự cho tôi. Tôi quả là một người đàn ông may mắn——có được một gia đình hạnh phúc."
1708 = "Nghe Reina nói bằng giọng điệu ngây thơ như vậy, dù đã bao lâu trôi qua, tôi vẫn luôn cảm thấy có chút gì đó giống như đang chơi đồ hàng. Nhưng——"
1723 = "Chắc chắn ở đó sẽ không còn lưu lại cuộc sống của chúng tôi. Nhưng thay vào đó——"
1724 = "Đó là một sự thật hiển nhiên. Điều mà tôi đã biết ngay từ đầu. Và bây giờ, hay mãi mãi về sau cũng sẽ không thay đổi."
1725 = "Đó là một điều vô cùng hạnh phúc. Dù là một cảm xúc quá đỗi muộn màng——nhưng thực sự là vậy."
1727 = "Mùi thơm ngọt của nước tương và rượu mirin. Chỉ bấy nhiêu thôi cũng đủ kích thích sự thèm ăn. Huống hồ gì còn có món súp Tsubon-jiru đầy ắp nhân. Thật nóng lòng muốn nếm thử một miếng."
1730 = "Khi tôi chui vào chăn, Reina cũng chui vào lòng tôi. Em ấy cuộn tròn lại như một con thú non, dính sát vào bụng tôi."
1732 = "——Tuy không phản đối mạnh mẽ, nhưng việc Reina muốn sống chung với gia đình Migita đã được truyền đạt từ trước khi kết hôn."
1734 = "Súp Tsubon-jiru và cá nướng. Củ cải phơi khô muối chua, và ngưu bàng xào mặn ngọt Kinpira. Trên bàn ăn giản dị, sắc xanh và đỏ điểm xuyết thêm phần rực rỡ."
1739 = "Cổ và vai tôi chịu một lực đè nặng. Reina chồm người về phía trước, cố gắng nhìn mặt tôi."

[selections]
