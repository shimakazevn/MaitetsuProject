1092 = "「Ừm.」"
1094 = "「Ừ. Nhất định chúng ta sẽ đi bằng KiHa 07S. Vì là một chuyến đi dài, nên anh và Paulette sẽ thay phiên nhau lái.」"
1096 = "「Ừ. Nhưng bây giờ thì anh hiểu rồi. Gia đình là sự chồng chất của cuộc sống, là sự kết nối của cuộc sống.」"
