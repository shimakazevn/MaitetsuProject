970 = "「……Những thứ mà chúng ta sẽ cùng nhau vun đắp từ nay về sau.」"
973 = "「Nhưng thực ra, chúng ta có thể đi đến bất cứ đâu, bất cứ lúc nào. KiHa 07 chỉ có thể chạy trên đường ray, nhưng Reina thì, xem này.」"
975 = "「Thế nhưng thực tế, gia đình chúng ta đã tăng lên nhiều đến bất ngờ. Đối với Reina, chị Mayami, Hibiki và cả Hachiroku nữa.」"
977 = "「Nhưng con người cũng vậy thôi. Tùy thuộc vào xuất thân và hoàn cảnh lớn lên, họ bị ràng buộc bởi vai trò, hoặc tự trói buộc chính mình.」"
978 = "「Nhưng mà, Reina là Railord mà nha~」"
981 = "「Nhưng mà, khi đến Ohimitera, gặp được chị Paulette thì. Thế giới của Reina đã mở rộng ra trên rất nhiều tuyến đường sắt khác nhau nha~」"
