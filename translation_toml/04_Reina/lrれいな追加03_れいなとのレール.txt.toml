1060 = "「Oa!」"
1062 = "「Oa! Reina hiểu rồi nha~. Cảnh vật nhìn từ góc độ của chị Navi! Có thể nhìn xa đến mức thấy cả rìa mặt đất cong tròn luôn.」"
