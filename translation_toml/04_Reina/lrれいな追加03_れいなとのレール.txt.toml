986 = "「Em có đôi chân khỏe mạnh và đáng yêu thế này cơ mà. Chỉ cần em muốn và bước đi. Em có thể đi đến bất cứ nơi nào trên thế giới này.」"
989 = "「Ngày nghỉ tới cũng làm vậy sao? Hôm nay……hay đúng hơn là từ trước đến giờ, chúng ta toàn hẹn hò quanh quẩn gần đây thôi.」"
990 = "「Hãy cùng nhau tạo ra những đứa trẻ nhé. Thật nhiều thật nhiều những đứa con của chúng ta.」"
