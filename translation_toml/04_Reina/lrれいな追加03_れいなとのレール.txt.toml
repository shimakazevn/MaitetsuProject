1134 = "「Là người một nhà, là gia đình mà nha~」"
1135 = "「Rất rất là vui luôn nha~. Cả trải nghiệm xúc than dồn toa, đi thuyền xuôi sông Kuma, trải nghiệm làm dao, hay tham quan xưởng ủ rượu nữa.」"
1136 = "「Trường hợp của anh thì……trở thành một gia đình với đơn vị nhỏ nhất là vợ chồng. Rồi anh cảm thấy như thể——mọi thứ đã trọn vẹn vậy.」"
1138 = "「Đi cũng có, chụp cũng có. Cả thu âm tiếng tàu nữa. Ăn uống cũng có luôn. Tất cả những gì bọn em muốn làm cùng nhau lúc đó nha~」"
