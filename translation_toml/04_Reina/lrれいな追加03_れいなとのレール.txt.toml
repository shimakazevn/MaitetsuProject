1171 = "「Mấy đứa trẻ của Teitetsu hay nói về 『Đại gia đình Teitetsu』 nhỉ. Trông có vẻ ngượng ngùng, nhưng lại rất vui vẻ.」"
1173 = "「Kéo dài và kết nối thật nhiều tuyến đường sắt, rồi đường sắt sẽ lại trở nên hưng thịnh, và các Railord mới cũng sẽ được chế tạo.」"
1177 = "「Ngon lắm! Vừa vặn. Đúng là hương vị anh thích. Cách nêm nếm của Reina cũng đã hoàn toàn ổn định rồi nhỉ.」"
1182 = "「Ohimitera vừa đẹp vừa vui, hơn nữa được anh Soutetsu chỉ cho nhiều thứ cũng làm Reina vui lắm nha~」"
1186 = "「Sao thế, có chuyện gì à?」"
1187 = "「Sao thế ạ~? Anh Soutetsu.」"
1188 = "「Anh nghĩ đó đúng là cảm tưởng mang đậm chất Reina.」"
1191 = "「Sẽ trở thành đường ray, chở theo giấc mơ của mọi người nha~」"
