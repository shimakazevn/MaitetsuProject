1344 = "「Ra vậy. Ví dụ như ngủ lại ở một ga nào đó,\\nrồi lấy đó làm điểm xuất phát――có thể sẽ xuất hiện những \\x%l編成;#00ffc040;đoàn tàu%l;#; như thế nhỉ.」"
