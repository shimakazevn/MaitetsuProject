1640 = "「Reina cũng thế nha, yêu anh Soutetsu,\\nrất nhiều rất nhiều, rất nhiều rất nhiều luôn đó ạ~」"
1642 = "「Để Reina xách túi cho nhé~」"
1644 = "「Chỉ cần làm hộ khẩu cho Reina thôi――\\nViệc đó thì, tôi sẽ nhận em ấy làm con nuôi.」"
1646 = "「Reina muốn ở bên anh Soutetsu! Nhìn anh Soutetsu cười,\\nReina cũng thấy hạnh phúc lắm ạ.」"
1648 = "「Reina thấy anh Soutetsu hiểu lầm,\\nthật sự là một điều quá tuyệt vời luôn đó ạ~」"
1651 = "「Thế thì Reina lo lắm ạ~」"
1653 = "「Reina!? Em sao vậy!」"
1655 = "「Cái này ấy, Reina. Là phong ấn đã được mở ra rồi đó.」"
1656 = "「Tất nhiên, nếu Reina không thấy phiền.」"
1659 = "「Cuộc chiến sinh tồn giữa các công ty với nhau, thậm chí có cả sự tham gia của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;,\\nthực sự đã bùng cháy dữ dội cho đến tận ngay trước Đại bãi bỏ các tuyến.」"
1672 = "「Tóm lại là, trước tiên cứ thử nhờ anh Soutetsu xem sao nhé?」"
1673 = "「Tóm lại, anh hãy bế em ấy lên đi.\\nChúng ta phải đưa em ấy đến chỗ nhà tắm Tororyu-yu.」"
1674 = "「Tóm lại, chúng ta hãy mau đến nhà tắm Tororyu-yu đi.\\nChi tiết thì đến đó hỏi Chủ nhân nhé.」"
1675 = "「Tiếp tục xếp hành lý thôi.」"
1678 = "「Chắc chắn là Reina.\\nĐã giúp Ngài Soutetsu nhớ lại rất nhiều biểu cảm rồi nhỉ.」"
1685 = "「Rồi――」"
1686 = "「Được chấp nhận?」"
1688 = "「Nói thẳng ra thì――\\nlái \\x%lキハ07;#00ffc040;KiHa 07%l;#; có chút không thỏa mãn phải không ạ?」"
1690 = "「Nhắc mới nhớ, anh Soutetsu ơi.」"
1691 = "「Cảm ơn cô. Tôi rất vui.」"
1692 = "「Chuyện em đi Yahata ấy.\\nAnh đã hoàn toàn hiểu lầm.」"
1700 = "「Nhàn thì nhàn thật, tôi cũng thấy vô cùng tiện lợi.\\nNhưng về mặt cảm giác điều khiển thì, quả nhiên là...」"
1701 = "「Thay đổi bố trí.」"
1706 = "「Vậy sao.」"
1707 = "「Có gì đâu.」"
1712 = "「Nếu vậy thì... để xem nào. Nhờ người khác thử xem sao nhé?」"
1714 = "「Chỗ đó... đúng là không gần chút nào.\\nNhưng mà, đây là công việc liên quan đến đường sắt mỏ mà em rất thích cơ mà.」"
1718 = "「Một tuyến đường vòng lớn đến thế――\\nliệu các tuyến đường có kết nối với nhau thuận lợi được không?」"
1720 = "「Dạ…… ừm, không có gì đâu ạ.\\nChỉ là vì vui quá, nên Reina hơi giật mình một chút thôi ạ.」"
1721 = "「Dạ... anh biết không? Anh Soutetsu.\\nReina, ừm――sẽ làm cô dâu mà.」"
1722 = "「Aư…… ư………… anh Soutetsu.」"
1723 = "「Vậy Hachiroku, nói cho tôi biết đi.\\nNgoài đi làm cùng nhau ra, còn cách nào để ở bên nhau nữa?」"
1726 = "「Thế thì, hơi tiếc một chút xíu chị nhỉ~」"
1727 = "「Thế có nghĩa là, chị Paulette,\\nsẽ trở thành mẹ của Reina sao ạ~?」"
1732 = "「Vậy, đi thôi.」"
1733 = "「Vậy, đi thôi.」"
1735 = "「Vậy thì, mãi mãi.\\nAnh sẽ ở bên cạnh Reina.」"
1738 = "「Là nhờ Reina đấy.」"
1739 = "「Lúc Reina bị đau bụng ấy.\\nCái \"phong ấn\" đó, rốt cuộc là gì vậy ạ~?」"
1741 = "「Như vậy thì cần phải thay đổi bố trí sao?」"
1742 = "「Tất nhiên rồi. Dù sao thì cũng là Chikuho mà.\\nMỏ than từng là trái tim của Khu công nghiệp Bắc Kyushu cơ mà.」"
1743 = "「Vậy là bên Đường sắt Kurogane,\\ncũng có \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; ạ~」"
1747 = "「Nếu vậy, Reina này.」"
1749 = "「Rất sát rồi nhưng mà sai bét.\\nĐáp án chính xác là từ \"Công ty Cổ phần Đường sắt Kurogane\"!」"
1750 = "「Chuyện đó thì đúng là vậy nhưng mà...\\nNhưng chị Paulette không đi cùng em đúng không ạ?」"
1751 = "「Anh Soutetsu.」"
1752 = "「Anh Soutetsu, anh đã hiểu lầm chuyện gì vậy ạ~?」"
1753 = "「Anh Soutetsu ơi, mình có mang theo gối không ạ~?」"
1754 = "「Anh Soutetsu ơi~?」"
1755 = "「Anh Soutetsu đang bị ràng buộc bởi rất nhiều thứ, đúng không?」"
1756 = "「Ngài Soutetsu, chuyện đó Ngài phải tự mình suy nghĩ chứ.\\nĐến một \\x%lレイルロオド;#00ffc040;Railord%l;#; như em còn biết cơ mà?」"
1758 = "「Ngài Soutetsu? Ngài không cần phải buồn bã thế đâu ạ.\\nĐâu phải chỉ có đi làm cùng nhau mới là cách để ở bên nhau.」"
1759 = "「Trước tiên hơn hết, chúc mừng hai người đã kết hôn!」"
1761 = "「Đường sắt Kurogane,\\nlà tuyến đường sắt chạy ở đâu vậy ạ?」"
1762 = "「Đường sắt Kurogane?」"
1765 = "「!」"
1766 = "「!!?」"
1767 = "「!?」"
1770 = "『「Oa!」\\n「Hả!?」』"
1938 = "Nỗi bất an trào dâng trong ngực."
1940 = "Chẳng hiểu sao lời nói lại ứ nghẹn,\\nrồi tôi chợt nhận ra."
1941 = "Chắc nãy giờ em ấy đang xấu hổ――"
1943 = "Bất kể đối phương là ai, Reina vẫn là Reina.\\nNếu đã quyết định, em ấy sẽ đón nhận bằng nụ cười không đổi."
1947 = "Nhưng mà... tôi không nghĩ những chuyến tàu mình đã thực hiện\\nlại kém chất lượng đến mức có thể dễ dàng giao phó cho người khác như vậy."
1948 = "Tuy nhiên, bản thân công việc trên tàu lại rất vui.\\nĐó là vì――à."
1949 = "Nhưng, hầu như chẳng nhíu lại được chút nào.\\nĐáng yêu vô cùng."
1963 = "Người thay thế.\\nQuả thực, tôi cũng chỉ là \\x%l運転士;#00ffc040;lái tàu%l;#; thay thế cho Paulette."
1966 = "Nuốt lại những lời định nói,\\nPaulette bỗng lộ ra vẻ mặt như chợt nhận ra điều gì."
1968 = "Nhưng Reina không tự mình dứt khỏi nụ hôn.\\nTrái lại, em ấy còn chủ động áp chặt môi mình vào môi tôi."
1985 = "Chỉ nghe thôi cũng khiến đôi tai tôi như muốn tan chảy,\\nnhưng lúc này tôi phải kéo tâm trí mình ra khỏi đó."
1989 = "Hachiroku khẽ liếc nhìn tôi."
1996 = "Thứ đầu tiên tôi được ban cho khi chào đời.\\nThứ mà dù mọi thứ có thay đổi ra sao, vẫn luôn vẹn nguyên như thế."
2002 = "Hachiroku nói tôi đã biểu cảm phong phú hơn――nhưng mà."
2003 = "Reina, người bỗng nhiên trở nên im lặng,\\nnay lại thay đổi thái độ, cười tươi rạng rỡ và bắt đầu lên tiếng."
2004 = "Khuôn mặt Paulette vốn đã tươi cười từ lúc đang nghe điện thoại,\\nsau khi đặt ống nghe xuống, lại chuyển sang một nụ cười đầy ẩn ý."
2008 = "Nhờ lợi thế dễ dàng tiếp nhận nguồn cung ứng đó,\\nmà Khu công nghiệp Bắc Kyushu từng phát triển phồn vinh bậc nhất Hinomoto."
2024 = "Thề với điều gì? Tôi nghĩ, và nhận ra chỉ có duy nhất một thứ."
2028 = "Hoàn toàn ngược hướng\\nvới Fukuoka, nơi có Khu công nghiệp Bắc Kyushu."
2029 = "À, không còn gì phải sợ nữa rồi.\\nNgay từ đầu, chắc chắn đã chẳng có gì đáng để sợ hãi cả."
2032 = "À, ra là vậy.\\nNghĩa là chuyện đó sao!"
2037 = "Nếu có cả chuyến đi Yatsushiro, thì chỉ với 2 \\x%l編成;#00ffc040;đoàn tàu%l;#; \\x%l8620;#00ffc040;8620%l;#; và \\x%lキハ07;#00ffc040;KiHa 07%l;#;,\\nviệc điều động toa xe sẽ trở nên vô cùng khó khăn."
2042 = "Quả là bõ công đã học hỏi trước.\\nTôi khẽ đưa mắt nhìn Reina đang cười tủm tỉm."
2047 = "Dừng tay sắp xếp hành lý,\\nReina cọ cọ người sát vào tôi."
2049 = "Một nụ cười khúc khích, vừa như cạn lời, lại vừa có chút vui vẻ."
2052 = "Đổi thái độ tươi cười ngay lập tức, thoăn thoắt xếp đồ.\\nBỗng nhiên, đôi tay ấy dừng bặt lại."
2053 = "Trông có vẻ hơi bất mãn.\\nLần này đến lượt tôi lấy ngón tay chọc vào cái má đang phồng lên của em ấy."
2054 = "Giọng cô ấy bật lên như thể chỉ chờ có thế."
2057 = "Có lẽ tôi đã khiến cô ấy vô cùng bối rối,\\nđôi mắt xanh kia đang đảo quanh liên tục."
2060 = "Đôi tay ngắn củn cựa quậy, ôm chặt lấy cơ thể tôi.\\nVì thế, tôi cũng tự nhiên ôm chặt lấy em ấy."
2062 = "Bỗng nhiên em ấy lộ vẻ mặt đau đớn, và dừng mọi cử động lại――"
2064 = "Cô ấy nhắm chặt mắt lại một lần,\\nvà rồi――mở ra với một nụ cười!"
2069 = "Câu nói đó khiến tôi bất giác đưa tay ôm mặt.\\nLúc nãy tôi đã làm ra vẻ mặt gì vậy chứ?"
2070 = "Nghe vậy, tôi nhớ lại những gì từng học ở trường.\\nQuặng sắt từ nước Chukoku và than đá từ mỏ than Chikuho."
2071 = "Nói rồi, Reina ngước lên nhìn tôi."
2072 = "Vừa dứt lời, Reina lao thẳng vào người tôi."
2074 = "Tôi đã từng nghe Hachiroku kể."
2076 = "Tôi muốn cứ hôn thế này mãi.\\nTrái tim ngập tràn dục vọng, dần chìm đắm trong đó."
2078 = "Nếu vậy, khi thời gian ở bên Reina ít đi――\\nliệu những biểu cảm trên khuôn mặt tôi có dần biến mất nữa không."
2081 = "Khác với vô số mẫu \\x%l8620;#00ffc040;8620%l;#;――những người chị em trực hệ.\\nNhưng lại là chiếc đầu máy xứng đáng được gọi là \"chị em\" nhất."
2085 = "Tôi thở phào nhẹ nhõm.\\nHơi ấm đang ôm trọn lấy tôi đã làm tan biến mọi bất an."
2094 = "Cho dù hôm qua ở bên nhau, hôm nay cũng ở bên nhau――\\nNhưng chẳng có gì đảm bảo ngày mai vẫn sẽ ở bên nhau."
2097 = "Ngay cả dấu tích của những tuyến đường đã bị bãi bỏ,\\nphần lớn cũng bị bỏ hoang y nguyên như lúc mới bị bãi bỏ."
2115 = "Gì vậy, tiếng \"Anh Soutetsu\" vừa rồi,\\ncảm giác như đã mất đi sự tươi sáng vốn có――"
2116 = "Gì vậy, hai người đang nói chuyện gì thế."
2122 = "Đến tôi cũng lập tức hiểu ra.\\nReina đang mong chờ một lời thề."
2128 = "Là con nuôi của nhà Migita.\\nBị ràng buộc bởi nghĩa vụ, ân tình và lời hứa."
2129 = "Rời khỏi nụ hôn, chúng tôi cọ mũi, cọ trán vào nhau,\\nrồi từ từ, tôi tách cơ thể mình khỏi Reina."
2130 = "Cơ thể chúng tôi áp sát vào nhau,\\nnhiệt độ và mùi hương hòa quyện làm một, thật dễ chịu."
2133 = "Tôi ngạc nhiên với chính bản thân mình,\\nkhông biết có lộ ra mặt không――mà Hachiroku lại cười khúc khích."
2135 = "Tôi biết chứ.\\nBởi Michiko, bố và mẹ đã dạy cho tôi."
2136 = "Tôi sợ hãi tận đáy lòng việc mất đi hơi ấm này.\\nChính vì sợ hãi, tôi mới có thể nâng niu và bước đi cùng Reina."
2138 = "Bất chợt, tôi nhận ra đây chính là nó.\\nThứ cảm xúc chỉ đơn thuần là muốn trân trọng――"
2139 = "Nghe tôi truyền đạt lại y nguyên,\\nHachiroku gật đầu \"À\" với vẻ mặt thấu hiểu."
2142 = "Nắm lấy tay Reina.\\nHai bàn tay đan vào nhau."
2143 = "Cố kìm nén sự thôi thúc muốn che mặt lại một lần nữa,\\ntôi chỉ lặng lẽ gật đầu đáp lại."
2146 = "Cứ suy nghĩ thành thật, một nơi nào đó trong tim lại nhói lên."
2147 = "Tôi quay sang nhìn Reina xem em ấy có biết không,\\nnhưng Reina cũng bối rối lắc đầu nguầy nguậy."
2150 = "Ngực tôi bắt đầu đau nhói."
2152 = "Một ngón tay ngắn ngủn chọc vào má tôi."
2153 = "Vừa đứng lên, Hachiroku lại khẽ mỉm cười."
2155 = "Rằng tôi đã bị Reina thu hút đến nhường này,\\nrằng từ tận đáy lòng, tôi không muốn rời xa em ấy dù chỉ một khoảnh khắc."
2156 = "Cuối cùng tôi cũng hiểu những gì Hachiroku đã nói.\\nCách để mãi mãi ở bên nhau dù không đi làm cùng nhau."
2159 = "Nghe tôi khéo léo sửa lại thành \"chúng ta\" thay vì \"của tôi\",\\nReina cũng cười tươi, gật đầu mạnh mẽ đồng tình."
2160 = "Tôi bị trói buộc ở Ohimitera, còn Reina bị đưa đến Yahata.\\nKhoảng thời gian chúng tôi có thể ở bên nhau sẽ bị xé nát, bị phá hủy."
2162 = "Tôi ôm nhẹ lấy em ấy, rồi trao một nụ hôn.\\nReina buông thõng người, phó mặc cơ thể cho tôi."
2168 = "Tôi nhận ra \\x%lレイルロオド;#00ffc040;Railord%l;#; cũng thở bằng mũi――thực hiện quá trình xả khí.\\nNgay cả cảm giác đó cũng thật dễ chịu, khiến cơ thể tôi bắt đầu nóng lên."
2170 = "Tôi vội vàng vuốt lưng cho em ấy,\\nnhưng vẻ mặt đau đớn vẫn không hề thay đổi."
2171 = "Bước một bước."
2172 = "Tôi dùng hai tay bế bổng em ấy lên như một chiếc nôi,\\nđôi tay Reina yếu ớt ôm lấy cổ tôi."
2174 = "Một nụ cười khổ hiện lên, khuôn mặt tôi hơi nóng ran."
2176 = "Từng nhà máy quy mô lớn đều có tuyến đường sắt chuyên dụng riêng,\\nmột vương quốc của đường sắt chở hàng và khai thác mỏ."
2185 = "Rất mềm mại, ấm áp, lại có mùi hương dễ chịu,\\ntrái tim tôi cũng trở nên ấm áp, ngập tràn hạnh phúc."
2187 = "Nếu em ấy không chịu nói thì có gặng hỏi cũng vô ích.\\nTôi cũng đã xác nhận được nguyện vọng của Hachiroku rồi――"
2196 = "Ra vậy. Sớm muộn gì Paulette cũng sẽ quay lại làm việc.\\nKhi đó, thời gian tôi ở bên Reina sẽ bị giảm đi đáng kể――"
2198 = "Michiko, bố, mẹ.\\nCó lẽ do ảnh hưởng từ việc bị tước đoạt mất họ, nên tôi mới hiểu lầm."
2199 = "Đường sắt Mikan là tuyến chạy từ Yatsushiro về phía nam, hướng Kagoshima."
2202 = "Một lời chúc mừng không hề tô vẽ.\\nĐiều đó đang thấm sâu vào trái tim tôi."
2210 = "Paulette vươn tay ra, dịu dàng vuốt tóc Reina.\\nKhoảnh khắc đó, tôi chợt nhận ra."
2211 = "Khi mà Paulette đang bận tối mắt tối mũi, thì việc lái \\x%lキハ07;#00ffc040;KiHa 07%l;#;\\nchắc chắn vẫn sẽ giao cho tôi cho đến khi mọi thứ ổn định."
2213 = "Khuôn mặt Paulette đỏ bừng,\\nđôi mắt lại đảo quanh liên tục."
2214 = "Paulette không hề hoảng hốt chút nào.\\nCô ấy gật gù liên tục――thậm chí trông có vẻ đầy cảm khái."
2221 = "Để có thể nhận được những toa xe trong tình trạng tốt nhất,\\nđôi mắt của một \\x%lレイルロオド;#00ffc040;Railord%l;#; \\x%l気動車;#00ffc040;toa xe tự hành%l;#; như Reina là vô cùng cần thiết."
2223 = "Để đón những toa xe mới.\\nĐể đón một Ohimitera mới."
2224 = "Để làm được điều đó, việc khôi phục tuyến Yatsushiro - Kumamoto là cần thiết,\\ndù hiện tại nó chỉ là giấc mơ xa vời――"
2226 = "Rồi em ấy sẽ lại ngây thơ kể những câu chuyện hồn nhiên đó,\\nchắc chắn là với một thái độ thong dong."
2230 = "Hôm nay Reina đang tự ngồi một mình.\\nChứ không phải ngồi trên đùi Paulette như mọi khi."
2232 = "Reina ngơ ngác nhìn tôi.\\nBằng ánh mắt như đang mơ màng, hay có lẽ là đang kinh ngạc."
2234 = "Trong vòng tay tôi,\\nReina nhắm mắt lại, khẽ nâng cằm lên."
2235 = "Một giọng nói lớn không giống Reina chút nào vang ra tận bên ngoài.\\nBước chân định bước vào cửa hàng đường sắt của tôi sững lại vì ngạc nhiên."
2238 = "Reina gần như gập người lại thành hình chữ く,\\nom lấy bụng dưới chịu đựng cơn đau."
2241 = "Và rồi Reina dõng dạc,\\nhô to \\x%l喚呼;#00ffc040;xác nhận%l;#;――về tương lai của chúng tôi."
2245 = "Giọng nói của Reina nghe thật thảnh thơi, ngập tràn hạnh phúc."
2246 = "Giọng Reina như sắp khóc.\\nĐiều đó khiến tôi vừa vui sướng nhẹ nhõm, lại vừa thấy tim nhói đau."
2248 = "Đôi má Reina ửng hồng,\\nem ấy vui sướng nhìn tôi."
2249 = "Reina cố gắng nhíu chặt lông mày lại."
2251 = "Nói rồi, đôi má Reina ửng lên sắc hồng phơn phớt."
2260 = "Đau ơi đau ơi bay đi nào――\\nVới suy nghĩ đó, tôi vuốt ve mái tóc em ấy, rồi quay lại phía Paulette."
2273 = "Quả thực là tuyệt vời.\\nNhưng, tôi cũng cảm thấy có chút nghi ngờ."
2275 = "Tự nhiên lại có một cậu con rể lớn tuổi hơn mình,\\nchắc chắn là một cú sốc lớn rồi."
2277 = "Đột nhiên, máu trong tim tôi như rút sạch.\\nKhông――đúng rồi. Đây chỉ là mong muốn đơn phương của tôi mà thôi."
2283 = "Tiếp nhận những toa xe dư thừa,\\nphát sinh từ việc tái cơ cấu mạng lưới đường sắt và toa xe quanh mỏ than Chikuho."
2286 = "Chỉ cần mút nhẹ là có thể nuốt trọn,\\nquá đỗi mỏng manh――khiến tôi sợ mình sẽ làm hỏng mất."
2288 = "Thêm vào đó, tôi còn phải đảm nhận vai trò liên lạc, điều phối giữa các bộ phận,\\ncó vẻ như tôi sẽ phải làm việc như trâu như ngựa cho đến khi mọi thứ đi vào hoạt động."
2291 = "Nghe em ấy nói vậy, tôi thở phào nhẹ nhõm."
2294 = "Đôi má ửng hồng vì hạnh phúc,\\ntừ từ, từ từ đỏ lựng lên như quả cà chua chín."
2309 = "Hành lý xếp thế này chắc ổn rồi."
2311 = "Bị hỏi thẳng như vậy,\\ntôi mới nhìn rõ được cảm xúc của chính mình."
2317 = "Chừng nào chưa thể hủy bỏ việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nthì đường ray của tôi vẫn sẽ bị đặt theo ý muốn của cha nuôi."
2320 = "Nếu thời gian ở bên Reina ít đi, thành thật mà nói,\\ntôi sẽ thấy rất cô đơn."
2321 = "Nếu không có sự hiểu lầm đó,\\ncó lẽ tôi đã mãi mãi không nhận ra."
2323 = "Rằng nếu phải nếm trải nỗi đau đó một lần nữa,\\nthì thà chẳng mong cầu ai, cứ sống cô độc mãi mãi còn hơn."
2326 = "Và rồi, chúng tôi trao nhau nụ hôn.\\nĐôi môi của Reina nhỏ bé, mềm mại đến mức như muốn tan chảy."
2336 = "Vừa nhắc đến Reina là lại muốn gặp em ấy.\\n――Đến cả tâm trạng đó mà cũng lộ ra ngoài."
2337 = "Nói đến đó, đôi mắt Reina tròn xoe."
2344 = "Thay đổi bố trí.\\nBốn chữ đó xẹt qua đầu tôi."
2345 = "Việc thay đổi bố trí, quả thực sẽ xảy ra."
2356 = "Một cái tên tôi mới nghe lần đầu."
2357 = "Đó là một điều đáng tự hào và vui sướng,\\nkhiến tôi có cảm giác muốn gắng sức vì em ấy dù có hơi quá sức một chút――"
2358 = "Nó đơn giản đến đáng sợ,\\nnhưng lại là cách mà tôi của trước đây không bao giờ nghĩ ra được."
2359 = "Thành thật mà nói... tôi cũng có chút muốn thử lái chuyến đó."
2360 = "Cảm giác như được Hachiroku công nhận,\\nđiều đó thực sự khiến tôi rất vui."
2361 = "Nỗi đau quá khứ lại nhức nhối,\\nbò dần lên từ đôi chân, từ từ siết chặt lấy cổ họng tôi."
2364 = "Không phải vậy.\\nLái \\x%lキハ07;#00ffc040;KiHa 07%l;#; rất nhàn, nhưng không hề thú vị."
2369 = "Nếu vậy thì,\\ntôi không còn gì phải do dự nữa."
2373 = "Tàn tích của nó vẫn còn âm ỉ cho đến tận bây giờ,\\nvà các \\x%lまいてつ;#00ffc040;chủ tàu%l;#; đã duy trì sự sống cho một vài tuyến đường còn sót lại."
2375 = "Đó chính là diện mạo thời kỳ hoàng kim của khu vực quanh Chikuho."
2376 = "Nếu vậy thì \\x%l列車;#00ffc040;tàu%l;#; hỗn hợp đi Yatsushiro,\\ncũng sẽ do Hibiki phụ trách."
2384 = "Chắc cũng chẳng cần mang theo trang bị gì to tát,\\nnhưng chính vì thế mà việc chọn lựa đồ đạc lại càng khó khăn."
2385 = "Dù cô ấy nói là \"đơm hoa kết trái\",\\nnhưng đến giờ tôi mới chợt nhận ra một thắc mắc."
2386 = "Dù muốn hôn thêm hàng giờ nữa,\\nnhưng giờ xuất phát cũng đang đến gần."
2387 = "Ngay cả bây giờ, khi Hibiki đang trưởng thành nhanh chóng,\\nHachiroku vẫn công nhận tôi là người \\x%l機関士;#00ffc040;lái tàu%l;#; xuất sắc nhất."
2389 = "Dù chỉ là mối liên kết gián tiếp cũng đủ khiến em ấy vui rồi,\\nnhưng quả nhiên, tôi vẫn muốn một ngày nào đó cho họ trực tiếp gặp nhau."
2390 = "Vui thì vui thật――nhưng sao nhỉ,\\ncó phần nào đó tôi lại khó lòng chấp nhận."
2392 = "Trông tôi buồn bã đến mức bị nhìn thấu hết thế sao.\\nNhưng, bị chỉ ra thì đúng là vậy thật."
2409 = "（Người khác sao? Không phải Paulette, cũng chẳng phải tôi.\\nMà là một người nào đó tôi không hề quen biết――）"
2414 = "（Tôi chưa từng nghĩ mình ghét điều đó.\\nThậm chí tôi còn nghĩ, nếu phải như vậy thì cũng chẳng sao――）"
2417 = "（Phải rời xa Reina,\\nkhông được nói chuyện với em ấy nữa... thật sự rất khó chịu.）"
2418 = "（Hả?）"
2419 = "（A……）"
2421 = "（Gì chứ, mặt tôi biến thành cái bảng trắng rồi hay sao?）"
2423 = "（Phịch）"
2424 = "（Hiểu lầm…… sao.）"
2426 = "（Chọc）"
2429 = "（Thế thì... khó chịu thật.）"
2431 = "（Không lẽ, Reina――\\nKhông, nhưng mà. Đúng là việc tôi rời khỏi Ohimitera rất khó khăn.）"
2432 = "（!）"

[selections]
