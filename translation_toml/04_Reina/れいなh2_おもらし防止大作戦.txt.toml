1392 = "Vẫn ôm chặt con thú bông, cô bé phô bày cho tôi thấy chuyển động của một con cái đang khao khát khoái cảm tình dục."
1394 = "Mặc dù không đến mức sạch sẽ hoàn toàn…… nhưng có vẻ vẫn còn dính lại một chút trên khóe môi và kẽ răng."
1395 = "Đầu nhũ hoa dễ thương lộ ra hoàn toàn—— Dù vậy, những ngón tay vẫn không dừng lại."
1398 = "Cuối cùng, chuyển động của cổ họng cũng dừng lại."
1399 = "Cô bé ôm chặt con thú bông một cách tuyệt vọng, như dùng nó làm điểm tựa, thèm khát và cắn nuốt lấy sự cương cứng, lấy chuyển động hông của tôi một cách tham lam."
1402 = "Cô bé uốn lưỡi phối hợp với nhịp hông của tôi, và dùng lòng bàn tay đỡ lấy tinh hoàn cho tôi."
1403 = "Đến cả giọng nói cũng buông tuồng như đang nói mớ——"
1406 = "Dù có há to thì cái miệng nhỏ nhắn ấy, khi tôi đâm thẳng hông tới, cũng sẽ chạm ngay vào cổ họng."
1408 = "Giọng nói đượm vẻ khổ sở. Nhưng chiếc lưỡi đang ngọ nguậy giãy giụa lại như đổ thêm dầu vào ngọn lửa khoái cảm."
1411 = "Đáng yêu quá, dễ thương quá, muốn giúp cô bé lau dọn sạch sẽ lại quá."
1412 = "Dù nước tiểu vẫn chưa tràn ra, nhưng phía tôi thì đã—— Sắp không kìm nén được lần xuất tinh thứ hai nữa rồi."
1414 = "Đã nuốt hết. Lượng tinh dịch tôi bắn ra nhiều đến thế cơ mà."
1417 = "Nhắc mới nhớ, đây là—— đặc huấn cơ mà."
1419 = "Âm đạo co bóp liên hồi, như muốn vắt kiệt tinh dịch từ đầu lưỡi tôi."
1420 = "Phần thịt màu hồng bên trong, cũng như đang xấu hổ, như đang mong chờ, ướt át bóng loáng, và run rẩy."
1422 = "Đang bị vắt kiệt. Đang bị mút lấy. Tinh dịch của tôi đang bị nuốt chửng một cách tham lam vào tận sâu bên trong Reina."
1425 = "Âm đạo của Reina ngọ nguậy chỉ để vắt kiệt tinh dịch của tôi, như đang lớn tiếng thông báo rằng cô bé sắp lên đỉnh rồi!"
1435 = "Mút mạnh, quấn lưỡi, rồi lại lắc đầu với nhịp độ lúc mạnh lúc nhẹ."
1436 = "Cảm nhận rõ ràng cảm giác muốn xuất tinh đang trào dâng, khoảnh khắc đó tôi chợt nhớ ra."
1437 = "Vị đắng ngắt đáng sợ, mang cảm giác như mùi cỏ đọng lại trên lưỡi, nghĩ đến việc cô bé đã nuốt trọn thứ này, trong ngực tôi trào dâng niềm cảm động."
1441 = "Cưỡng đoạt cái miệng nhỏ nhắn ấy từ chính diện—— Khoái cảm và cảm giác tội lỗi đan xen, khiến chuyển động hông càng lúc càng nhanh."
1450 = "Sự nhầy nhụa này, sự siết chặt này, tôi muốn dùng sự cương cứng để đón nhận tất cả ——Đến mức tôi bất giác bị ép phải nghĩ như vậy."
1456 = "Mỗi lần tôi nhấp hông, Reina lại rung rắc trông thật thú vị. Cái hông ấy cứ bị đẩy tới đẩy lui, xê dịch đi mất."
1458 = "——Khi hông tôi đẩy tới, cô bé đón lấy, khi hông tôi rút ra, cô bé lùi lại."
1460 = "Bất chấp sự siết chặt, tôi trượt hông một biên độ lớn, Reina run rẩy và rên rỉ một cách đáng yêu."
1462 = "Tận hưởng trọn vẹn khoái cảm khi chọc ngoáy và cọ xát vào khe hở rãnh dọc, tôi từ từ, từ từ, ấn quy đầu vào âm đạo."
1465 = "Khắc sâu câu nói đó vào lòng, để chuẩn bị cho lần đặc huấn tiếp theo, trước mắt thì——chúng tôi dọn dẹp bãi chiến trường."
1466 = "Dần dần, nhịp điệu bắt đầu ăn khớp với nhau. Reina tự mình lắc đầu——"
1468 = "Tôi cố tình dừng lại khi mới chỉ đưa phần đỉnh quy đầu vào, Reina bối rối, cất giọng đầy sốt ruột."
1470 = "Tôi hôn, và cẩn thận dùng lưỡi của mình liếm sạch tàn dư tinh dịch."
1472 = "Tôi thèm khát nhiều hơn, nhiều hơn nữa, và cố gắng dùng lý trí cùng hàm răng cắn chặt để kìm nén cái hông đang chực chờ lao tới."
1476 = "Tôi kéo dài nó ra, như thể đang bôi trơn, di chuyển ngón tay thật dai dẳng, thật dai dẳng——"
1477 = "Khi tôi trao một nụ hôn lên trán như một phần thưởng, khuôn mặt Reina đã ngập tràn niềm hạnh phúc."
1478 = "Hướng về phía âm đạo của Reina, tôi trút toàn bộ tinh dịch xuống, không sót lại một giọt nào."
1480 = "Điều tôi muốn làm. Điều Reina muốn thử thách."
1482 = "Tôi nhẹ nhàng đỡ lấy đầu cô bé, để không làm rối nhịp điệu của Reina, từ từ, từ từ nhấp hông."
1483 = "Khi tôi rút sự cương cứng vẫn chưa xuất tinh xong ra, âm đạo bám riết lấy như không muốn, Reina cũng thốt lên tiếng kêu luyến tiếc."
1486 = "Tôi cứ thế trượt lưỡi đi, liếm láp lỗ âm đạo, mút mát và ngoáy ngoáy."
1487 = "Khi tôi dùng ngón tay tách rộng khe hở, cô bé khẽ thốt lên một tiếng rên ngượng ngùng, đôi tay đang ôm bé số 07 siết chặt lại."
1490 = "Được khẳng định toàn bộ bản thân—— sự an tâm như được bao bọc lấp đầy trong tôi."
1492 = "Suy nghĩ ấy lập tức hóa thành tinh dịch, chèn ép niệu đạo và trào ngược lên."
1494 = "Hai bầu má vốn căng phồng, đang bị sự cương cứng của tôi đẩy lên——chỉ còn lại độ phồng bấy nhiêu đó."
1496 = "Khi hông tôi tự động ngọ nguậy tìm kiếm khoái cảm, mặt trong rãnh quy đầu bị cọ xát, khiến tôi rùng mình."
1498 = "Bị phô bày cho thấy dáng vẻ ấy, tôi cũng không thể dừng lại được!"
1500 = "Để không làm bẩn con thú bông, tôi nắm lấy sự cương cứng, nhắm chuẩn mục tiêu, hướng về nơi cần đến——"
1501 = "Lần theo đường rãnh ở gốc đùi, những ngón tay cứ thế hướng thẳng đến vùng kín."
1513 = "Giờ thì, thong thả làm tình thôi—— Ngay khi tôi vừa nghĩ vậy, Reina lại lắc đầu nguầy nguậy."
1515 = "Hạt ngọc đáng yêu và đường rãnh dọc, tôi vuốt ve, chà xát thật nhẹ nhàng để không làm tổn thương cô bé, nhưng lại vô cùng dai dẳng."
1516 = "Nếu đã vậy, tôi vặn người áp sát vào, để tinh dịch không trào ra ngoài dù chỉ một giọt——"
1518 = "Nhận được sự cho phép từ cả tâm hồn và thể xác, cả tâm hồn và thể xác tôi cũng tăng tốc trong một chớp mắt!"
1520 = "Từ ranh giới tưởng chừng như sắp tuột ra, cho đến tận lúc chạm vào cổ họng, cô bé dùng môi và lưỡi yêu chiều sự cương cứng của tôi hết mức có thể."
1522 = "Có thứ gì đó, rỉ ra."
1525 = "Đôi tay mềm mại mơn trớn ướt át, thật sướng. Vì sướng, nên lại càng muốn nhiều hơn, nhiều hơn nữa."
1528 = "Chẳng có gì phải giấu giếm cả. Vì cả tâm hồn lẫn thể xác, đều đang khao khát cùng một điều."
1531 = "Vị mằn mặn nhè nhẹ và chút vị đắng thoang thoảng, đọng lại trên đầu lưỡi tôi."
1534 = "Và rồi, tiếng nước. Ngay lập tức, nó biến thành tiếng nước chảy rào rào."
1538 = "Con thú bông khá lớn, chính vì thế, càng làm nổi bật lên thân hình mảnh mai của Reina."
1541 = "Không biết có phải đang nhịn tè hay không, âm đạo vốn dĩ đã khít của Reina, nay lại siết chặt đến mức hung bạo."
1545 = "Đôi mắt vốn đang đờ đẫn của Reina, nay đã lấy lại được tiêu cự."
1547 = "Kích hoạt tối đa khả năng học hỏi quá đỗi ưu việt của Railord, Reina liên tục tối ưu hóa các chuyển động để khơi gợi phản ứng từ tôi."
1549 = "Reina bẽn lẽn vặn vẹo cơ thể. Mùi hương ngọt ngào cọ vào mũi tôi."
1551 = "Đáng yêu, dễ thương, không thể chịu nổi."
1552 = "Những lời nói tan chảy như mê sảng, và sự run rẩy của âm đạo đã nhầy nhụa ướt đẫm."
1554 = "Hiếm khi thấy Reina ấp úng như vậy. Ánh mắt cô bé lảng tránh, đầy vẻ ngại ngùng."
1558 = "Những ngón tay của Reina từ từ, từ từ, cởi từng chiếc cúc áo blouse."
1560 = "Như thể đang thoa đều lên toàn bộ quy đầu, vừa nựng \"bé ngoan, bé ngoan\", bàn tay Reina vừa kéo dài lớp dịch nhờn ra."
1562 = "Chắc là mải mê chà xát sự cương cứng quá nên quên mất đặc huấn rồi."
1564 = "Một nụ cười rạng rỡ."
1566 = "Giọng nói dịu dàng \"bé ngoan, bé ngoan\". Cùng với chuyển động tay còn dịu dàng và mềm mại hơn thế nữa."
1569 = "Không biết có phải để thể hiện sự vui mừng hay không, Reina dùng lòng bàn tay nhỏ bé, vuốt ve quy đầu của tôi như đang nựng \"bé ngoan, bé ngoan\"."
1572 = "Dùng lưỡi đưa tiễn sự cương cứng đang rút ra của tôi cho đến tận cùng. Và rồi Reina, há to miệng hướng về phía tôi——"
1573 = "Reina dùng cả hai tay kẹp lấy sự cương cứng của tôi, vừa xoa bóp vừa kéo dài lớp dịch nhờn ra khắp toàn bộ thân gậy."
1574 = "Tắm mình trong cơn mưa tinh dịch ở tận cùng sâu thẳm, Reina đã hoàn toàn kiệt sức."
1576 = "Nhũn ra. Biểu cảm thả lỏng, vô cùng thả lỏng——"
1578 = "Tôi bôi thật nhiều mật dịch của Reina đang nhỏ giọt xuống tận đùi, lên sự cương cứng của mình."
1580 = "Reina đã hoàn toàn kiệt sức."
1582 = "Reina, thật đáng khen."
1583 = "Cởi quần dài, kéo quần lót xuống—— Reina phơi bày cả âm đạo cho tôi thấy."
1586 = "Reina dang rộng hai chân, lăn ra với tư thế sẵn sàng đón nhận sự âu yếm của tôi."
1588 = "Tuân thủ nghiêm ngặt lời dạy của Paulette, Reina hớn hở, lóng ngóng, cẩn thận cởi quần dài và quần lót của tôi ra."
1589 = "Reina bắt đầu vụng về lắc lắc hông."
1590 = "Cánh cửa tận cùng sâu thẳm nhất của Reina, cũng dính chặt lấy như muốn mút lấy quy đầu của tôi."
1592 = "Hai má phồng to hết cỡ, nhìn qua cũng thấy cô bé đang nhíu mày khổ sở——"
1595 = "Với thân hình bé nhỏ này, cô bé sẽ đón nhận toàn bộ dục vọng của tôi. Từ tận đáy lòng, tôi cảm nhận được sự ấm áp, nhận ra điều đó hạnh phúc đến nhường nào."
1597 = "Dòng nước tiểu với lực bắn mạnh mẽ đến thế, thật khó tin lại tuôn ra từ một cái lỗ nhỏ xíu nhường này——"
1605 = "Mực nước tinh dịch, đang dâng lên cuồn cuộn. Chờ đợi khoảnh khắc đó, hông tôi rần rần ngứa ngáy."
1607 = "Tinh dịch từ đó trào ra sùng sục, và hòa lẫn không thể phân biệt được với lượng tinh dịch vừa mới trút xuống."
1613 = "Nóng bỏng. Chật hẹp. Đang bị mút chặt. Đang lầy lội. Đang bị siết chặt. Sướng quá."
1621 = "Và dù vậy, Paulette vẫn là Paulette. Chắc hẳn cô ấy đã nhận ra sự chịu đựng đằng sau nụ cười của Reina."
1624 = "Sự cương cứng ưỡn cong lên đến mức như muốn đập vào bụng. Nhìn thấy cảnh đó, khuôn mặt Reina giãn ra vui vẻ."
1628 = "Giữa hạt ngọc và lỗ âm đạo, có một cái lỗ nhỏ, đang giật giật run rẩy, tôi mở nó ra."
1645 = "Sự kích thích từ chiếc lưỡi uốn éo không theo quy luật, và những cái vuốt ve nhè nhẹ lên tinh hoàn."
1646 = "Chiếc lưỡi quấn lấy, bao bọc lấy tôi."
1650 = "Mật dịch lập tức bắt đầu quấn lấy toàn bộ ngón tay tôi."
1654 = "Thế nên tôi cũng đoán ra được, à, là chuyện đó sao."
1663 = "Khoảnh khắc này—— Để đo lường thành quả đặc huấn, chính lúc này, tôi sẽ cố tình!"
1664 = "Tất nhiên, đó là một tư thế vô cùng gợi tình——"
1666 = "Những điểm nhạy cảm của Reina, lần trước chạm vào, tôi đã nhìn và học được rồi."
1671 = "Dù có sự hỗ trợ của Paulette, nhưng lần trước—— lần đầu tiên đó, tôi nghĩ là đã làm tình đàng hoàng rồi mà……"
1675 = "Trước khoái cảm ngày càng mãnh liệt, hông tôi khẽ giật lên, thể hiện phản ứng một cách thành thực."
1681 = "Đầu tiên, tôi cẩn thận âu yếm hai đầu nhũ hoa xinh xắn, rồi men theo mạn sườn, từ từ đưa những ngón tay xuống dưới."
