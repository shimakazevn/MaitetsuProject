[script]
1065 = "——Dù cuộc khảo sát mỏ than có kết thúc, thì việc soạn tài liệu, chuẩn bị cho hội đồng, và cả việc huấn luyện nghiệp vụ trên KiHa 07S nữa, những việc cần làm vẫn còn chất thành núi."
1070 = "『Nếu vậy thì, kéo là được thôi ạ. Dùng 8620 để kéo KiHa 07. Không dùng KiHa 07 làm toa động lực, mà chỉ kéo nó như một toa hành khách bình thường thôi』"
1075 = "……Nơi nào cũng chịu chung một số phận như nhau, thật là đáng buồn."
1077 = "……Khuôn mặt cứng đờ vì mải để ý đến diễn xuất của tôi, đã được nới lỏng ra nhờ nụ cười tự nhiên của Reina."
1087 = "「\\x%lキハ07;#00ffc040;KiHa 07%l;#; thì chở các thợ mỏ, kỹ sư và gia đình của họ. Và lúc đó, nó cũng kéo theo cả \\x%l貨車;#00ffc040;toa chở hàng%l;#; nữa đó ạ.」"
1090 = "「\"Cũng\" được bán làm đồ lưu niệm à.」"
1097 = "「……Đâu cần phải diễn thật giỏi cuộc sống trong một vở kịch làm gì.」"
1099 = "「……Ra vậy. Nhà máy điện đó dùng thứ không bán được gọi là than phẩm cấp thấp để nhiệt điện sao.」"
1103 = "「……Những hạng mục cần kiểm tra và xử lý lại đa dạng và phức tạp hơn dự đoán nhiều nhỉ.」"
1105 = "「……Nhìn vẻ bề ngoài thì không thể nào tưởng tượng được, Reina lại có những kiến thức vô cùng vững vàng và sâu sắc đến vậy.」"
1432 = "「Được sử dụng trọn vẹn một ngày, quả nhiên là thảnh thơi hơn hẳn nhỉ.」"
1436 = "「Xin lỗi vì đã làm em giật mình nhé. Nếu em không thích thì...」"
1439 = "「Nhưng mà, tiện lợi như khu mỏ than này thì hiếm lắm nha~. Có thể dùng chính than đá mình đào được để phát điện nhiệt, tuyệt thật đấy ạ.」"
1440 = "「Nhưng mà, nhóm Reina không có chạy bên trong hầm mỏ đâu ạ? Chạy trong hầm mỏ là xe goòng hoặc xe goòng chở người cơ ạ~」"
1441 = "「Không, không hề ạ. Chuyện đó——bây giờ, đang là thời gian đi khảo sát mỏ than mà.」"
1445 = "「Giống như là, lấy việc bán lợi ích làm tùy chọn, rồi tiện thể bán luôn than đá…… kiểu vậy sao?」"
1450 = "「Viết là xe của người, tức là xe goòng chở người ạ. Đó là phương tiện chở các thợ mỏ đến tận hiện trường khai thác đó ạ~」"
1451 = "「Xe goòng chở người?」"
1458 = "「Hôm nay anh đi làm công tác khảo sát sơ bộ. Đó là một công việc quan trọng để xin cấp ngân sách và bước vào khảo sát chính thức.」"
1460 = "「Công việc hôm nay của mình thế nào ạ?」"
1461 = "「Là nhà máy nhiệt điện than đấy. Nếu không tự cung cấp than được, thì chi phí sẽ đội lên cao đến mức nào, thật không dám tưởng tượng.」"
1466 = "「Nhưng mà……」"
1467 = "「Chỉ là…… tôi, mấy việc như trợ cấp hay giấy phép, có vẻ như sẽ tăng lên khá nhiều nên là――」"
1470 = "「Nhưng mà nhưng mà, máy móc và thiết bị hầu hết vẫn còn sống mà lị~. Thế này thì chắc chắn sẽ xin được ngân sách thôi ạ~」"
1472 = "「Nhưng mà, bây giờ người ta dùng than nhập khẩu rồi. Nghe nói là vừa rẻ lại vừa chất lượng hơn. So với than nội địa ấy.」"
1473 = "「Nhưng mà?」"
1478 = "「Reina đang sống một cuộc sống của riêng mình một cách tuyệt vời. Cùng với Paulette, một cuộc sống khiến cả anh cũng phải ngưỡng mộ.」"
1483 = "「Hơn nữa, có chuyện gì vậy ạ? Tìm tôi có việc gì sao?」"
1485 = "「Ăn cơm――à không, từ từ đã. Vừa đi làm mỏ than về người đen nhẻm, vẫn là đi tắm trước thôi.」"
1491 = "「Reina nhìn thế này thôi chứ khỏe lắm đó nha!」"
1495 = "「Rốt cuộc là có chuyện gì vậy?」"
1496 = "「Em bảo là không cảm thấy cô đơn―― Lúc nãy Reina…… Reina thật sự, đã nói vậy nhỉ?」"
1501 = "「Nguy hiểm là sao, có chuyện gì à?」"
1502 = "「Ra là vậy. Nói cách khác, nó giống như một loại \\x%l客車;#00ffc040;toa hành khách%l;#; chuyên dụng trong hầm mỏ nhỉ.」"
1504 = "「Ra vậy. Tức là axit sunfuric có nguồn gốc từ dầu thô cũng có thể làm ra celluloid. Nên mới nói là 『ở một góc độ nào đó cũng đúng』 nhỉ.」"
1505 = "「Ra vậy. Là để công nghệ khai thác than không bị mai một sao. Đúng là cầu được ước thấy còn gì.」"
1506 = "「Ra là vậy.」"
1515 = "「Nhưng mà nhưng mà, dù không ai dùng lửa hay điện, chỉ cần không khí bị ứ đọng, nó cũng sẽ tự nhiên phát nổ đó ạ.」"
1521 = "「Có vẻ như hơi nguy hiểm một chút rồi đó ạ~」"
1523 = "「Đào hướng lên trên đúng theo nghĩa đen luôn à. ……Nghe có vẻ vất vả phết nhỉ.」"
1524 = "「Kyaa」"
1525 = "「Fufu, trò chơi gia đình này, xem ra cũng khó phết nhỉ.」"
1527 = "「Phù oa.」"
1528 = "「Hả.」"
1529 = "「Oa. Reina, bị ngã mất rồi nha~」"
1530 = "「Oa oa.」"
1531 = "「Oa!」"
1533 = "「Oa! Lại được bế rồi ạ~」"
1535 = "「Oaaa! Thật đó ạ!」"
1536 = "「Oa! Mình ơi, mừng mình đã về nhà nha~」"
1538 = "「Oaaa, Reina vui lắm ạ. E hèm~, anh Soutetsu, nhớ cả những chuyện như vậy luôn đó hả~」"
1540 = "「Oa, thú vị quá đi ạ. Mỏ than, đúng là người ta đào xuống dưới thật anh nhỉ~」"
1541 = "「Hawaa!」"
1543 = "「Ủa ủa? Anh Soutetsu, anh sao thế ạ?」"
1545 = "「Ối chà.」"
1546 = "「Hả!? À, vâng!」"
1548 = "「Hả? À, vâng. Chắc là——không sai đâu ạ.」"
1550 = "「Ồ, từ quặng sắt mà lại chiết xuất được axit sunfuric sao. Thật là kỳ lạ... hơi khó hình dung nhỉ.」"
1551 = "「Chà. Đào quặng sắt à.」"
1554 = "「Hửm? Khu mỏ thường có nhà máy điện riêng sao.」"
1555 = "「Ư, ừm――」"
1556 = "「A――vâng. Đúng vậy nhỉ, chuyện đó thì, đúng.」"
1559 = "「À――chuyện đó, trước đây tôi cũng từng nghe nói. Nhưng mà, chính vì thế nên tất cả các loại dây điện đều được cách điện nghiêm ngặt rồi mà nhỉ?」"
1560 = "「A……」"
1561 = "「A…… nhắc mới nhớ, lần đầu gặp nhau em cũng từng nói thế nhỉ.」"
1563 = "「À. Không——ừm.」"
1565 = "「A」"
1568 = "「Nham nháp…… à, ngon quá. Cảm giác như bao mệt mỏi trong ngày tan biến hết vậy.」"
1569 = "「Aư~, có lẽ là hơi nhanh một chút, so với Reina đó ạ~」"
1570 = "「A!」"
1572 = "「A! Bây giờ thì, ở một góc độ nào đó, ý kiến ấy cũng có thể là đúng đó ạ.」"
1574 = "「A! Anh hiểu rồi sao? Anh nhận ra rồi sao? Cả anh Soutetsu nữa.」"
1575 = "「A, không phải đâu ạ. Dù cũng là một loại quặng sắt, nhưng quặng Pyrit không được dùng làm nguyên liệu sản xuất sắt đâu nha~」"
1577 = "「A, vâng. Việc đó để tôi sắp xếp. Tôi sẽ nhờ cả nhóm Hibiki hợp tác nữa――」"
1580 = "「À, ra vậy! Mỏ trên núi là mỏ trên núi――nghĩa là nó nằm trên núi.」"
1582 = "「À, quả nhiên là tôi làm phiền cô rồi.」"
1584 = "「À, ra là vì vậy nên mới có đường sắt khai thác mỏ. Reina và KiHa 07 cũng từng chạy trong đường hầm ngang đó sao?」"
1585 = "「A, không ạ. Chuyện là…… về việc phát triển mỏ than. Nên là, có chút...」"
1588 = "「A, có vẻ như không được đâu ạ. Ừm, trong tài liệu... ở chỗ này đây.」"
1590 = "「Hả? Khai thác than á—— Ừm, ý anh là ở mức độ lớn hơn cả việc khai thác trải nghiệm sao?」"
1591 = "「Chà, nghe ngon đấy.」"
1593 = "「Về tính tiện lợi, thôi ạ?」"
1594 = "「Hừm……」"
1595 = "「Ừm thì, lý do là vì nha~, quặng Pyrit là quặng sắt sunfua đó nha~」"
1597 = "「Ừ. Lúc Hachiroku hỏi 『Chở hàng hóa sao?』, Reina đã gật đầu xác nhận câu hỏi đó.」"
1599 = "「Ừm. Lái thử KiHa 07 rồi tôi mới hiểu rõ. Lý do Paulette nói 8620 phù hợp với du lịch.」"
1601 = "「Ừ. Chắc là vì tôi đã rất ngạc nhiên. Một \\x%lレイルロオド;#00ffc040;Railord%l;#; nhỏ bé thế này, mà lại đi chở hàng hóa sao――」"
1606 = "「Ừm. Trăm sự nhờ cô.」"
1608 = "「Vâng. Đúng là vậy nhỉ…… Nhưng mà.」"
1609 = "「Ừm.」"
1610 = "「Ừ, cứ giao cho tôi.」"
1611 = "「À, tôi cũng từng nghe nói. Vì thua kém về chất lượng và cạnh tranh giá cả, nên các mỏ than trong nước đều bị đẩy đến bờ vực đóng cửa.」"
1614 = "「Ừ, chị sẽ cố gắng. Và――anh Soutetsu.」"
1615 = "「Ừm, tôi sẽ mong đợi lắm đấy.」"
1617 = "「Hửm?」"
1619 = "「Hửm? Nếu vậy thì……em bảo là Katakami à? Khu mỏ mà Reina từng ở trước đây không phải là mỏ than sao.」"
1621 = "「Hửm? Ở một góc độ nào đó là sao?」"
1622 = "「Hử? Khoan đã, đào nhiều đến mức đem bán cơ à? Dù có điều chỉnh sản xuất, thì thà chỉ đào đủ lượng cần cho phát điện còn hơn...」"
1624 = "「Ư hự hự, mình đi làm vất vả rồi ạ~」"
1626 = "「Ư hự hự, anh thích là Reina vui rồi ạ~」"
1629 = "「Ư hự hự, kỳ lạ anh nhỉ~」"
1630 = "「Ư hự hự, đúng vậy đó ạ~」"
1633 = "「Ư hự hự, Thấy mình ăn ngon miệng thế này em vui lắm đó nha~」"
1634 = "「Ư hự hự~, anh Soutetsu, rõ ràng là anh Soutetsu mà, lại nói chuyện hơi kỳ lạ rồi đó ạ~?」"
1635 = "「Vuông vức——sao.」"
1637 = "「Nhớ lại thì vui lắm ạ. Cả việc kể chuyện ngày xưa nữa. Nhưng mà――」"
1641 = "「Vì vậy, chúng ta phải đưa ra những giá trị cộng thêm. Bán kèm những lợi ích to lớn cùng với than đá.」"
1643 = "「Cả Reina và KiHa 07 đều là những người khỏe mạnh mà lị~」"
1644 = "「Vì ở hình dạng cơ thể bảo dưỡng—— hầu như chẳng bao giờ Reina được bế cả ạ.」"
1645 = "「Thì tại vì, anh Soutetsu, vừa nói là \"Mỏ trên núi\" mà lị~?」"
1648 = "「Vừa đóng vai trò là \\x%l客車;#00ffc040;toa hành khách%l;#;, lại vừa kéo cả \\x%l貨車;#00ffc040;toa chở hàng%l;#; sao.」"
1654 = "「Kỳ lạ?」"
1657 = "「Em ấy nhận ra những điều anh không nhận ra, nhìn thấy những thứ anh không thấy. Kiến thức lại phong phú, anh còn có cảm giác mình hoàn toàn vô dụng nữa kìa.」"
1659 = "「Vâng ạ. Chị Paulette cũng cố lên nhé ạ~」"
1660 = "「Vâng ạ.」"
1661 = "「Vâng!」"
1663 = "「Vâng ạ, hôm nay có thịt hầm khoai tây, và súp miso nấu với hành và váng đậu đó nha~」"
1664 = "「Vâng ạ, em đun nước sẵn rồi đó nha~」"
1666 = "「Chị hiểu rồi. Vậy thì, cố lên nhé! Nhưng nếu gặp khó khăn gì, phải nói với chị ngay đấy, biết chưa?」"
1669 = "「Oaa! Vậy mình đi thôi――phù oa!?」"
1672 = "「Nếu vậy thì Reina cũng vui lắm ạ~」"
1673 = "「Nếu không phải vì nhu cầu than đá giảm mạnh, thì dự án vẫn sẽ được tiếp tục. Chuyện là như vậy, nên tất nhiên, trữ lượng chắc chắn vẫn còn đủ ạ.」"
1675 = "「Nếu tìm được đầu ra cho than, thì đó tất nhiên là giải pháp tốt nhất rồi.」"
1677 = "「Quả nhiên, nếu đưa máy móc vào khai thác quy mô lớn thì―― dù có thu hẹp quy mô ở mức tối thiểu, chi phí vẫn sẽ tăng vọt ạ.」"
1683 = "「Lượng đó thì 8620 không thể nào tiêu thụ hết được. Vậy thì... phải tìm cách kiếm người mua thôi――」"
1684 = "「Thật không giống như vừa mới huấn luyện nghiệp vụ xong. Cứ thế này đi đâu cũng được ấy chứ.」"
1689 = "「Các chuyên gia đã nỗ lực đến mức đổ máu, cuối cùng vẫn không thể thắng về giá cả và chất lượng đúng không? Vậy thì.」"
1690 = "「Nhân tiện, Reina này. Than đá ấy, thường được sử dụng ở những nơi như thế nào vậy?」"
1691 = "「À, tôi có chuyện muốn hỏi. Mỏ than này, liệu trữ lượng than có còn không?」"
1693 = "「Như lúc nãy Reina đã nói, quặng pirit là quặng sắt và lưu huỳnh. Vì thế nên chủ yếu nó được dùng làm nguyên liệu sản xuất axit sunfuric đó ạ.」"
1695 = "「Vuông vức giống hệt viên xúc xắc luôn nha~. Nó tỏa ra ánh vàng xỉn, đẹp lắ-ắm luôn nha~」"
1697 = "「Là những người thợ mỏ đi từ mỏ này sang mỏ khác đó ạ. Thế nên chuyện về mỏ than, Reina cũng biết một chút ạ.」"
1699 = "「Là quặng sắt kết hợp với lưu huỳnh đó nha~. Tinh thể của nó lấp lánh và vuông vức, giống như kho báu vậy ạ~」"
1701 = "「Chính là celluloid đó ạ. Reina được dạy là người ta làm nó từ axit sunfuric lấy từ quặng pirit, cùng với axit nitric và cellulose đó ạ.」"
1703 = "「Dù chưa đến mức ngạt thở, nhưng ở mỏ than, không khí bị đục là rất nguy hiểm đó ạ~」"
1705 = "「Cứ thế này đi nhanh thôi. Trời mà tối thì việc khảo sát sẽ khó khăn lắm.」"
1707 = "「Kết quả công việc thế nào rồi ạ~」"
1713 = "「Đào hướng lên trên.」"
1715 = "「Rất tuyệt vời. Vì người cộng sự của anh quá xuất sắc mà.」"
1717 = "「Đáng tiếc thật. Dù sau này có thế nào, tôi không nghĩ chúng ta có thể cạnh tranh với than nhập khẩu về mặt hiệu quả chi phí.」"
1720 = "「Sao vậy, Reina.」"
1721 = "「Sao vậy? Paulette. Có chuyện gì——」"
1726 = "「Tái hoạt động, là sao cơ?」"
1727 = "「A, anh về rồi đây. À――ừm, mệt quá đi mất.」"
1734 = "「Chúng ta cũng không yêu cầu họ chuyển sang dùng toàn bộ than của mình. ……Nếu bán theo gói, kiểu như mua để dự phòng thì.」"
1735 = "「Chúng ta mới ở phần rất nông của đường hầm mà. Làm gì đến mức bị ngạt thở cơ chứ.」"
1736 = "「Bản báo cáo chúng ta mang về chắc chắn sẽ tiếp thêm động lực cho những người đang dao động. Nhờ có Reina, mọi chuyện có vẻ đang tiến triển theo hướng tốt.」"
1737 = "「Anh đổi ý rồi, bụng đói cồn cào không chịu nổi nữa. Thôi thì, cho anh ăn cơm trước được không?」"
1742 = "「Để tìm kiếm những ý tưởng cộng thêm đó, tôi muốn tiến hành thêm các cuộc khảo sát quanh mỏ than bỏ hoang Jussen――」"
1745 = "「Tôi hiểu mà, chính vì thế, nên tôi mới nhờ cô dạy lái \\x%lキハ07;#00ffc040;KiHa 07%l;#; mà.」"
1747 = "「Lái tàu và khảo sát, tôi sẽ thực hiện không để xảy ra sự cố nào. Hơn thế nữa――chắc chắn, tôi sẽ tìm ra được manh mối gì đó.」"
1748 = "「Việc xác nhận các vấn đề về quyền lợi và giấy phép, tôi xin nhận. Tôi sẽ sắp xếp tình hình sớm nhất có thể rồi trả lời anh.」"
1749 = "「Nghe nói trong số các nghị sĩ ủng hộ việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;, cũng có người có vẻ sẽ tán thành kế hoạch này.」"
1751 = "「Này, Paulet——ủa?」"
1753 = "「Tiến bộ công nghệ là để con người không phải đổ mồ hôi nữa. Nhưng với 8620, ta phải đổ mồ hôi sôi nước mắt. Nếu không thì nó không thể chạy được.」"
1756 = "「Không có chuyện đó đâu ạ! Vì có anh Soutetsu ở bên, nên Reina mới không cảm thấy cô đơn đó ạ! Á.」"
1761 = "「Thật sự thì, sự tiến bộ của công nghệ đúng là một điều vĩ đại.」"
1763 = "「Xin lỗi nhé, Paulette. Cô đang mải suy nghĩ gì à?」"
1765 = "「Người ta đào một đường hầm ngang sâu vào trong núi, rồi từ đó đào các hầm dọc hướng lên trên, lên trên nữa để khai thác tầng khoáng sản đó ạ.」"
1769 = "「Nhờ có sự dư dả thời gian, tôi có thể tập trung quan sát hơn. Về tính tiện lợi, động cơ diesel vượt xa động cơ hơi nước.」"
1775 = "「Nếu khả năng không phải là không, thì cứ thử xem xét cũng chẳng mất gì. Tôi được dạy như vậy, và tôi chỉ luôn làm theo như thế thôi.」"
1778 = "「Reina hiểu rồi ạ~」"
1784 = "「Dạ đúng rồi~. Ở mỏ thì \\x%l列車;#00ffc040;tàu%l;#; là để chở hàng hóa mà. Nên loại chỉ dùng để chở người thì được gọi đặc biệt là xe goòng chở người ạ.」"
1787 = "「Dạ đúng rồi~. Reina, từ giữa chừng đã trở lại làm Reina thật mất rồi ạ~」"
1788 = "「Dạ đúng rồi~, nếu chất than đào được từ trải nghiệm khai thác lên \\x%l貨車;#00ffc040;toa chở hàng%l;#;, thì nó cũng trở thành một \\x%l列車;#00ffc040;tàu%l;#; hỗn hợp đàng hoàng đó ạ, Reina nghĩ vậy~」"
1794 = "「Dạ đúng rồi~. Ở mỏ Katakami thì đó là chuyện bình thường ạ. Bên Teitetsu thì hình như gọi là \\x%l列車;#00ffc040;tàu%l;#; hỗn hợp hay sao ấy ạ~」"
1796 = "「Dạ đúng rồi ạ~」"
1797 = "「Vâng……」"
1798 = "「Vâng. Nếu mở rộng được kênh phân phối―― thì mọi chuyện sẽ êm xuôi cả. Thật sự luôn.」"
1801 = "「Ừm. Nhờ vậy mà chúng ta cũng thu được kết quả tốt.」"
1803 = "「Được đấy. Thời gian cỡ đó thì vẫn còn.」"
1804 = "「Đúng vậy. Quả là một điểm mù.」"
1806 = "「Vâng. Kể từ lúc đó, Mine Treasure sẽ trở thành \"mỏ than đỏ\" chuyên đào ra lỗ vốn mất.」"
1808 = "「Dạ đúng rồi~, Reina chưa làm thử bao giờ nhưng mà, chắc chắn là vất vả lắm luôn đó ạ~」"
1809 = "「Vậy sao. Nếu thế thì chúng ta đã hoàn thành công việc rồi nhỉ.」"
1810 = "「Vậy sao.」"
1811 = "「Vậy sao ạ~?」"
1813 = "「Reina được dạy đó ạ. Từ các kỹ sư, hay là các thợ mỏ lang thang. Ở mỏ có rất nhiều người am hiểu kiến thức lắm ạ.」"
1815 = "「Vâng ạ~. Như vậy sẽ tiện lợi hơn mà nha~」"
1818 = "「Vâng. Nếu được chọn làm \"Mỏ than Kế thừa Công nghệ\", thì sẽ có trợ cấp của nhà nước ạ.」"
1819 = "「Vâng. Hình như gọi là \"Phát điện đốt trực tiếp\" ạ. Nên than phẩm cấp cao sẽ bị tồn lại nguyên xi.」"
1821 = "「Vâng ạ~. Các góc cạnh cũng vậy, vuông vức vuông vức tạo thành góc vuông hoàn hảo——Oa!?」"
1822 = "「Vâng ạ.」"
1823 = "「Đúng đúng! Chính xác, là cảm giác đó! Nó là hiện thân của những gì đã mất đi trong quá trình hiện đại hóa nhỉ, \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; ấy.」"
1828 = "「Có ạ! Reina có giữ một cục nè, lần sau Reina cho anh xem nha~」"
1829 = "「Vâng đúng rồi ạ. Có mạch khoáng sản nằm bên trong núi, thì gọi là mỏ trên núi... Nên mỏ trên núi là phải đào hướng lên trên ạ.」"
1833 = "「Vậy sao——cái đó là một loại nhựa dẻo mà... tôi cứ tưởng người ta làm từ dầu mỏ hay gì đó chứ.」"
1834 = "「Chuyện đó thì đúng là vậy nhưng mà……」"
1835 = "「Có cả hiện tượng đó xảy ra sao――」"
1837 = "「Sao lại giật mình?」"
1838 = "「Có chỗ nào bị đau à?」"
1840 = "「Em có bị thương không?」"
1843 = "「Có vẻ khó khăn sao?」"
1849 = "「Máy móc, nhân sự, bảo trì thiết bị――doanh thu từ \\x%l列車;#00ffc040;tàu%l;#; chỉ như muối bỏ bể thôi. Thế này, lỡ như trợ cấp bị cắt thì sao.」"
1851 = "「Chúng ta đã kiểm tra xong một lượt máy móc và thiết bị rồi ạ, để chắc chắn, mình cứ ra ngoài sớm đi ạ~」"
1858 = "「Không phải ạ, dạ—— Reina chỉ hơi giật mình một chút thôi ạ.」"
1859 = "「Không có gì đâu ạ. Chỉ là Reina sợ mình sẽ thấy cô đơn, nên hơi lo lắng một chút thôi ạ~」"
1860 = "「Không sao đâu ạ. Reina không bị hỏng hóc hay tổn hại ở đâu hết ạ.」"
1861 = "「Không phải là không thích đâu ạ! Được bế thế này nhàn nhã lắm, Reina vui lắm ạ.」"
1862 = "「Đúng vậy. Ở quy mô lớn hơn nhiều—— Nếu không thì, tôi có cảm giác sẽ không thể nào tái hoạt động được.」"
1863 = "「Đúng vậy. Dù nói thế nhưng than đá cũng đâu vô dụng. Nhập khẩu luôn đi kèm với rủi ro về biến động tỷ giá và chính trị mà.」"
1864 = "「Vâng ạ~! Katakami là mỏ quặng Pyrit đó nha~」"
1874 = "「Thợ mỏ lang thang?」"
1877 = "「\\x%l列車;#00ffc040;Tàu%l;#; hỗn hợp à, nghe thú vị đấy. Mà khoan, à, không... Việc chúng ta làm ở Mine Treasure, nói cách khác thì...」"
1882 = "「Đục.」"
1887 = "「Than đá có chứa khí metan mà lị. Nếu nó đậm đặc lên, bắt lửa một cái là bùm luôn đó ạ.」"
1889 = "「Mỏ than còn có những chỗ nguy hiểm khác nữa, Reina còn nghe nói nước sông cũng có thể chảy tràn vào đó ạ.」"
1892 = "「Reina, em ổn chứ? Không có chị thì em có sao không?」"
1894 = "「Không khí, Reina có cảm giác hơi đục một chút xíu ạ.」"
1897 = "「Dạ để xem nào. Những viên kết tinh cực kỳ đẹp ấy, cũng được bán làm đồ lưu niệm đó ạ~」"
1899 = "「Reina là \\x%lレイルロオド;#00ffc040;Railord%l;#; nên không bị thương đâu ạ. Đổi lại thì chỉ bị hỏng hóc và tổn hại thôi ạ~」"
1904 = "「Reina đã từng chứng kiến cuộc sống của rất rất nhiều người, nên cứ tưởng mình sẽ làm tốt hơn cơ ạ~」"
1906 = "「Reina mạnh mẽ thật đấy.」"
1907 = "「Reina từng nghe nói là ở trong nước Hinomoto từ xưa đến nay, hầu hết đều dùng cho các nhà máy nhiệt điện và nhà máy luyện thép đó ạ.」"
1908 = "「Bụi than đá siêu nhỏ, khi bụi than đặc đến một mức độ nào đó, nó sẽ tự bốc cháy và phát nổ luôn, Reina nghe nói thế đó ạ.」"
1909 = "「Reina nói ạ?」"
1912 = "「Reina, trăm sự nhờ anh giúp đỡ.」"
1913 = "「Bây giờ người ta không chiết xuất axit sunfuric từ quặng pirit nữa đâu ạ. Hầu hết đều được chiết xuất từ lưu huỳnh sinh ra trong quá trình tinh chế dầu mỏ ạ.」"
1914 = "「Khi nghe nói từ axit sunfuric đó có thể làm ra celluloid, Reina đã nghĩ con người thật là tuyệt vời đó ạ.」"
1917 = "「Việc nhà máy điện có khả năng hoạt động lại là một tin tốt đấy. Reina tinh mắt thật.」"
1919 = "「Quả thực…… là có khả năng đó. Chỗ này cũng nằm ngay sát sông Kuma mà.」"
1920 = "「Quả không hổ danh là được Hachiroku huấn luyện. Anh Soutetsu tiếp thu nhanh thật đấy, làm tôi ngạc nhiên luôn.」"
1922 = "「Quả nhiên là thấy cô đơn sao? Nhìn mỏ than, lại nhớ về ngày xưa ấy.」"
1926 = "「Nhưng mà, may nhờ có Hachiroku giúp đỡ nhỉ.」"
1927 = "「Đáng tin cậy quá nhỉ. Nhờ em cả đấy.」"
1940 = "「Quặng sắt sunfua?」"
1949 = "「Tinh thể……mà lại hình xúc xắc…… Hừm, thứ trong tự nhiên lại có hình dạng như vậy sao?」"
1950 = "「Khu mỏ có nhà máy điện riêng cũng không hiếm mà nha~. Reina chỉ tìm trên bản đồ xem có không thôi ạ~」"
1954 = "「Hơn nữa, còn nhìn được rất xa nữa ạ. Thế này thì chắc chắn, tìm gì cũng thấy ngay luôn đó ạ.」"
1955 = "「Điều đó chắc chắn cũng giống với sức hấp dẫn của khu mỏ mà Reina yêu quý. Vì vậy, lấy mỏ than và 8620 làm chìa khóa du lịch, chắc chắn sẽ hiệu quả.」"
1959 = "「Tự nhiên phát nổ?」"
1961 = "「Trợ cấp?」"
1966 = "「Ổn hay không thì phải thử mới biết được ạ. Nhưng mà, Reina sẽ cố gắng hết sức mình luôn đó ạ~」"
1967 = "「Mình ăn cơm trước nhé? Hay là đi tắm trước ạ?」"
1969 = "「Nếu là nhà máy luyện thép thì ở Kyushu cũng có những cái lớn―― như Yahata ở Fukuoka chẳng hạn.」"
1971 = "「Mặc dù vậy, mặt trời lặn rồi thì không thể điều tra được nữa. Nên chúng ta cũng không thể cứ thong thả mãi được.」"
1972 = "「Đúng, là vậy nhỉ……」"
1975 = "「Celluloid... là cái thứ lấp lánh và trong suốt ấy à——」"
1986 = "「Cái này…… lợi nhuận sít sao quá――hay nói đúng hơn là, nguy cơ lỗ vốn còn cao hơn à.」"
1987 = "「Cái này…… Tôi đã nhờ ngân hàng hợp tác để lập ra đấy ạ.」"
1988 = "「Dạ để xem nào, nếu mà cứ đi bộ suốt trong đường hầm ngang thì vất vả lắm anh nhỉ~」"
1989 = "「Điều đó thú vị lắm sao? Ở cái mỏ Katakami gì đó mà Reina từng làm việc thì khác à?」"
1990 = "「Ra vậy.」"
1991 = "「Khả năng. Nếu vậy thì, có thể sẽ có đấy.」"
1992 = "「So với thao tác lái \\x%l8620;#00ffc040;8620%l;#;, thì cái này cứ như là được làm tự động hoàn toàn vậy.」"
1996 = "「Sau đó thì, tất nhiên là sập hầm rồi ạ~」"
2004 = "「Ừm thì, giấy phép các thứ có vẻ sẽ lấy được…… Trợ cấp hình như cũng có, nhưng mà...」"
2006 = "「Vậy thì tốt quá rồi. Nhưng mà xin lỗi em nhé. Tôi đi nhanh quá phải không.」"
2007 = "「Đúng là vậy rồi nhưng—— liệu có dễ dàng nhìn thấy thế không?」"
2010 = "「Đương nhiên rồi. Do đó, ngoài giá cả và chất lượng ra, chúng ta phải tạo ra một điểm bán hàng nào đó.」"
2012 = "「Xin kiếu chuyện đó đi. Phải nghĩ cách nào đó để duy trì mà không cần dựa vào trợ cấp mới được.」"
2013 = "「Vậy thì, cố gắng thêm một chút xíu nữa, mình qua kiểm tra khu ký túc xá luôn nha anh?」"
2015 = "「Vậy thì, quặng pirit đào được đó, có được dùng làm đồ trang sức hay gì không?」"
2016 = "「Nếu vậy, có lẽ chúng ta nên sử dụng cái tên \\x%l列車;#00ffc040;tàu%l;#; hỗn hợp. Nghe có vẻ mới lạ, chắc chắn sẽ làm tăng thêm không khí du lịch đấy.」"
2018 = "「Vậy thì, tiếp tục khảo sát mỏ than thôi.」"
2019 = "「Vậy thì, có khả năng khai thác than trở lại không? Ý tôi là, về mặt quyền lợi và giấy phép các thứ.」"
2020 = "「Vậy thì, ngoài làm đồ lưu niệm ra—— công dụng chính của quặng pirit là gì vậy?」"
2025 = "「Anh Soutetsu tuyệt quá đi ạ! Reina ngay từ đầu đã nghĩ là không được rồi.」"
2026 = "「Anh Soutetsu?」"
2031 = "「Tinh thể quặng pirit vuông vức và lấp lánh như thế nào, thực tế cứ nhìn tận mắt là dễ hiểu nhất đó ạ~」"
2035 = "「!」"
2040 = "『「Reina!?」\\n「Reina!?」』"
2189 = "Tôi cảm thấy một nghĩa vụ mãnh liệt phải làm như vậy. Nếu thế, tôi sẽ dốc hết sức mình để hoàn thành nó."
2192 = "Đáng tiếc là tôi chưa từng kết hôn với ai―― À, đúng rồi. Cứ nhớ lại bố rồi bắt chước theo là được nhỉ."
2195 = "Không cần bận tâm đến lượng hơi nước hay lượng nước cấp, chỉ cần chú ý đến tốc độ và áp suất \\x%lブレーキ;#00ffc040;phanh%l;#;, quả thực là nhàn hạ."
2197 = "Không biết từ lúc nào, tôi đã bỏ xa Paulette ở phía sau."
2203 = "Vậy có nghĩa đó chỉ là những trường hợp ngoại lệ mà thôi."
2206 = "Xác nhận được điều đó, Reina reo lên thích thú, trông hệt như một chú cún con. Cô bé cứ lăng xăng chạy tới chạy lui. Cực kỳ phấn khích."
2217 = "Nhưng, tình trạng lại tốt đến đáng kinh ngạc. Đến mức tôi không cảm thấy quá ngần ngại khi ngồi xuống chiếu tatami."
2218 = "Đúng là, Hachiroku mà tôi vẫn thường hay bế là ở hình dạng lái tàu——tức là cơ thể cỡ búp bê."
2221 = "Dù chẳng thấy cục chuột nào nổi lên, nhưng lần này, thật kỳ lạ, tôi lại thấy em ấy vô cùng đáng tin cậy."
2222 = "Ngay cả việc vận hành \\x%l8620;#00ffc040;8620%l;#; thôi, mà đã cần đến ngần ấy than đá rồi, nên là——"
2228 = "Chỉ vừa liếc mắt nhìn qua, tôi cũng bất đắc dĩ phải mang biểu cảm giống hệt Paulette."
2230 = "Vắt cũng chẳng thấy mồ hôi chảy ra, còn bồ hóng thì, một chút xíu cũng không dính."
2232 = "Một cơn ớn lạnh chạy dọc sống lưng tôi lúc này. Dù tình trạng có tốt đến đâu, đây vẫn là một mỏ than bỏ hoang đã bị bỏ mặc hàng chục năm."
2236 = "Lại là nụ cười bẽn lẽn. Pha lẫn chút tiếc nuối."
2241 = "Nếu đảm bảo được nguồn điện, không chỉ riêng Mine Treasure, mà việc vực dậy cả một khu vực... cũng——"
2243 = "Thứ cần thao tác chỉ có \\x%lダイコン;#00ffc040;kiểm soát trực tiếp%l;#;――Direct Controller, cùng với cần số và \\x%lブレーキ;#00ffc040;phanh%l;#; mà thôi."
2247 = "Đáng tiếc là trên cánh tay ấy, chẳng có lấy một chút nhô lên nào."
2259 = "À, đúng rồi――thực tế là như vậy. Reina sống lâu hơn tôi, và chắc chắn đã nhìn thấy, nghe thấy nhiều điều hơn tôi."
2260 = "À, nếu vậy thì... phòng tắm có lẽ, đã hoang tàn lắm rồi."
2267 = "Vì nếu lơ là, bước chân của tôi cũng sẽ nảy lên đôi chút, và có vẻ như sẽ gặp nguy hiểm mất."
2268 = "Cứ nghĩ đến \\x%lレイルロオド;#00ffc040;Railord%l;#; là tôi lại tự động bế lên mà không cần suy nghĩ."
2272 = "Sau mỗi chuyến đi, nó sẽ ướt sũng mồ hôi đen kịt, dù có giặt bằng xà phòng cục thế nào đi nữa, cũng chẳng bao giờ trắng lại được."
2273 = "Một cuộc khảo sát sơ bộ để chuẩn bị cho cuộc khảo sát của các chuyên gia. ――Đó cũng là một trong những nhiệm vụ chúng tôi phải hoàn thành lần này."
2275 = "Ngay khi vừa tắm mình dưới ánh sáng mặt trời, cảm giác căng thẳng liền dịu đi. Reina cũng trở lại với vẻ mặt mềm mại như trút được gánh nặng."
2277 = "Hồi mỏ than còn hoạt động, chắc hẳn mọi thứ đều diễn ra suôn sẻ. Nhưng mà..."
2280 = "Không khí bên trong hầm có ở trạng thái nguy hiểm đến mức nào, cũng hoàn toàn không có gì lạ."
2290 = "Đôi mắt ngước lên nhìn như thể đang chiêm ngưỡng một thứ gì đó chói lóa. Nó lấp lánh đến mức khiến tôi có chút ngượng ngùng."
2292 = "Paulette đang cúi gằm mặt, bước đi chậm chạp. Nhắc mới nhớ, nãy giờ cô ấy cứ im lặng suốt——"
2293 = "Lại là điệu bộ khoe chuột bắp tay."
2295 = "Cô bé gập cánh tay gầy guộc lại thành góc vuông, tạo dáng như thể muốn khoe chuột bắp tay vậy."
2297 = "Cuộc sống bình dị của những người thợ mỏ mà Reina luôn ao ước, chắc chắn là sự ấm áp của món thịt hầm khoai tây và súp miso này."
2299 = "Cô bé bám lấy bàn tay tôi vẫn đang chìa ra, chậm rãi đứng dậy."
2301 = "Nếu em ấy đã không muốn nói, thì chắc hẳn có điều gì đó em ấy muốn bảo vệ, dẫu có phải giấu đi sự cô đơn của mình."
2303 = "Với vẻ mặt đầy áy náy, cô ấy đưa cho tôi vài tờ giấy."
2304 = "Trong chớp mắt, khuôn mặt em ấy đỏ bừng. Hơi nóng đó dường như truyền đến tận ngực tôi."
2306 = "Cô bé gật đầu một cái thật mềm mại."
2310 = "Lời nói thật thà của cô bé khiến tôi tự nhiên thấy hối lỗi. Tôi đã cứ thế đi theo nhịp độ của mình mà không nghĩ đến bước chân của Reina."
2311 = "Tiếng bước chân nhẹ nhàng lạch cạch chạy về phía trong―― Thế nhưng lại dừng bặt lại với một tiếng \"A\" ngắn ngủn."
2312 = "Nếu không có kinh nghiệm từ lần trước, thì lần này chắc tôi cũng không thể tóm được tay em ấy."
2317 = "Đảm bảo an toàn là nghĩa vụ hàng đầu, tất nhiên không chỉ riêng trong ngành đường sắt."
2321 = "Tập trung giải quyết từng việc một, không được nóng vội, đó có lẽ là điều tốt nhất mà chúng tôi có thể làm lúc này."
2322 = "À, ra vậy. Cứ nói sự thật là được chứ gì."
2326 = "Giống như một học sinh bị giáo viên gọi tên khi đang ngủ gật, Paulette giật thót mình, cơ thể co rúm lại vì quá đỗi kinh ngạc."
2333 = "Cảm giác như những tâm tư sâu thẳm trong đôi mắt nhắm nghiền kia đang truyền đến tôi―― Vì vậy, tôi chỉ biết lặng lẽ đón nhận."
2345 = "Tôi không giỏi mấy trò ứng biến kiểu này. Nếu vậy thì――"
2348 = "Đạp lên đám cỏ dại mùa hè, trên đường ray cũ đã hoàn toàn bị vùi lấp, tôi nhớ lại vai trò của nó."
2349 = "Tuyến đường sắt của chúng tôi bị cô lập chỉ giữa Ohimitera và Yui, cứ như thể là biểu tượng cho kênh phân phối của chúng tôi vậy."
2350 = "Tôi chợt nhận ra rằng, chỉ riêng một nụ cười thôi, cũng đủ để mang lại hạnh phúc cho người ngắm nhìn nó."
2353 = "Trước tiên và quan trọng nhất là khảo sát khu mỏ than. Trong đầu tôi chỉ nghĩ được đến việc đó, nhưng——"
2356 = "Cảm giác lạnh sống lưng thoáng qua, tôi rảo bước nhanh ra khỏi đường hầm."
2358 = "Ôm Reina đang cười tủm tỉm, tôi cứ thế tiếp tục bước đi."
2360 = "Tôi vừa gật gù thán phục, vừa cảm thấy câu chuyện đã được kết nối lại. Nếu nó thú vị đến vậy thì——"
2362 = "Giống như những gì Paulette vẫn thường làm, tôi bỗng có cảm giác không thể không vuốt ve mái tóc của Reina."
2364 = "Tôi lướt mắt qua trang tài liệu được chỉ định."
2365 = "Nhìn chiếc khăn vừa lau mặt, tôi thấm thía nghĩ thầm."
2367 = "Cảm giác như đã lâu lắm rồi mới thấy biểu cảm đó của cô ấy khiến tôi thở phào nhẹ nhõm, lời nói của tôi cũng trở nên trôi chảy hơn."
2369 = "Bị nói vậy, tôi thử nhớ lại lời mình vừa nói nhưng―― Không hiểu gì cả."
2370 = "Tôi thử nghĩ đến những khả năng khác nhưng... với lượng kiến thức của mình, tôi không tài nào tìm ra được câu trả lời."
2374 = "Tôi đưa tay ra! Nhưng lại với không tới——"
2375 = "Khi tôi quay mặt sang, Reina cũng mỉm cười rạng rỡ nhìn tôi."
2378 = "Tôi cứ đinh ninh mình đóng vai người bố, nhưng nếu gọi là \"mình\" thì chắc là vai người chồng rồi."
2380 = "Vì vậy, tôi không gặng hỏi thêm nữa."
2385 = "Vừa đi được một lúc, Reina bỗng thốt lên \"À đúng rồi\", với một giọng nói tràn ngập niềm vui."
2392 = "Nếu vậy, từ việc khảo sát mỏ than thực tế, chắc chắn chúng ta sẽ thu được những kết quả có ý nghĩa."
2394 = "Nếu vậy, giải pháp tốt nhất là——"
2395 = "Một khi đã không biết cách nào khác, thì cứ dốc hết sức mình, và lần này cũng lặp lại điều đó thôi."
2398 = "Nếu một chuyên gia về mỏ như Reina đã nói vậy, thì tôi không có lý do gì để phản đối cả."
2400 = "Lẽ ra phải là chuyện đáng mừng, nhưng lời nói của Paulette lại nặng nề lạ thường."
2406 = "Đúng là trăm hay không bằng tay quen."
2411 = "Khu vực đó――Khu công nghiệp Bắc Kyushu, chắc chắn nguồn cung cấp than ban đầu phải là Mỏ than Chikuho."
2414 = "Đúng vậy. Chính sự lặp lại đó đã đưa tôi đến vị trí ngày hôm nay."
2415 = "Bước đi xạo xạc."
2431 = "Khuôn mặt ngơ ngác. Miệng Paulette há hốc ra."
2432 = "Kết quả là, Paulette và Reina đã được giải phóng khỏi chuyến đi khứ hồi định kỳ ngày hôm nay."
2433 = "Paulette cúi đầu thật sâu trước tôi."
2434 = "Gương mặt Paulette bừng sáng."
2435 = "Vừa vẫy tay cuống quýt, Paulette vừa đáp lại với giọng hơi nhanh."
2436 = "Bàn tay Paulette dịu dàng vươn ra, chầm chậm vuốt ve mái tóc Reina."
2437 = "Khuôn mặt hơi tái đi, nhưng Paulette vẫn đáp lại bằng một cái gật đầu mạnh mẽ."
2438 = "Paulette khẽ liếc nhìn Reina."
2439 = "Paulette thực tế hơn tôi nhiều, và cũng hiểu biết rộng về xã hội."
2440 = "Cộc, Paulette khẽ gật đầu."
2442 = "Vai diễn bị phá vỡ rồi."
2459 = "Nếu là cuộc khảo sát để đánh giá tính khả thi của kế hoạch đó, thì khả năng được cấp ngân sách bổ sung là hoàn toàn có thể."
2461 = "Tuy nhiên, câu chuyện của Reina lại rất thú vị và hữu ích. Nếu không được nghe trong lúc di chuyển thì thật đáng tiếc."
2466 = "Ý nghĩa của cái gật đầu và sự đồng ý đó, chắc chắn Reina còn hiểu rõ hơn cả tôi."
2467 = "Vừa nhìn thấy căn phòng trong khu ký túc xá này, em ấy đã nài nỉ tôi \"Cho em chơi trò gia đình đi\"――"
2469 = "Khuôn mặt ngơ ngác. Có lẽ Reina không nhớ, nhưng――"
2473 = "Reina đồng tình, vừa đồng tình vừa cười khúc khích."
2475 = "Em ấy ngã phịch mông xuống đất, nở nụ cười bẽn lẽn. Trông có vẻ không bị chấn động gì lớn, nhưng——"
2477 = "Reina nheo mắt lại, vẻ đầy hoài niệm. Bất chợt, hình ảnh ấy chồng lấp lên một khung cảnh trong góc khuất ký ức của tôi."
2479 = "Reina, người đáng lẽ phải biết rõ――hay chính vì biết rõ, mà cô bé nãy giờ vẫn im bặt."
2481 = "Tôi đưa tay chạm vào mái đầu đang hơi cúi xuống."
2483 = "Ngơ ngác, Reina nghiêng đầu―― Nhưng ngay giây tiếp theo, nét mặt cô bé trở nên nghiêm nghị."
2484 = "Không trả lời câu hỏi của tôi, Reina cứ thế đẩy mạnh vào người tôi."
2487 = "Cười tủm tỉm tủm tỉm."
2489 = "Đôi tay khua khua như đang tự quạt cho mình. Mũi Reina khẽ hếch lên ngửi ngửi."
2491 = "Đôi mắt của Reina trở nên ấm áp hơn hẳn ngày thường."
2493 = "Gương mặt Reina bỗng trở nên chín chắn. Một nét gì đó uy nghiêm, cao quý hiện lên đằng sau những đường nét ngây thơ ấy."
2495 = "Nụ cười của Reina cũng trắng tinh khôi. Paulette bên cạnh cũng gật đầu vẻ hài lòng."
2497 = "Khuôn mặt Reina có vẻ tiếc nuối, nhưng rốt cuộc vẫn tràn ngập niềm vui."
2498 = "Bước chân nhảy cẫng lên quá đà, khiến Reina suýt nữa thì vấp ngã."
2499 = "Bị tôi bế lên, Reina phát ra một tiếng kêu gần như hét lên. Tiếng kêu đó khiến cả tôi cũng phải giật mình."
2500 = "Tôi bẻ cong cổ tay làm điệu bộ \"chịu thua\", Reina liền vui vẻ mỉm cười giải thích cho tôi."
2503 = "Reina nói ra cảm nghĩ vô cùng chân thật, rồi rướn dài cổ ra."
2506 = "Một nụ cười ngây ngô, trẻ con nở trên môi. Nụ cười của Reina có vô vàn sự thay đổi, thật thú vị."
2510 = "Với ánh mắt có vẻ lo lắng, cô chằm chằm nhìn Reina."
2513 = "Có vẻ Reina cũng đã hiểu ra rằng, tôi chỉ đang nói sự thật mà thôi."
2514 = "Có vẻ như cả Reina, và cả Paulette nữa, đều đã nhận ra mối lo ngại giống hệt tôi."
2516 = "Nhìn cử chỉ ngây thơ đó, một cảm giác bùi ngùi chợt trào dâng trong lồng ngực tôi."
2518 = "Nhìn tôi nghiêng đầu khó hiểu, Reina càng trở nên vui vẻ hơn, và tiếp tục với giọng điệu rộn ràng."
2522 = "Nhìn nụ cười của Reina, tôi tự xốc lại tinh thần."
2528 = "Ánh mắt của Reina, người xuất thân từ đường sắt khai thác mỏ, đã giúp chúng tôi nhìn ra những điều mà bản thân không hề hay biết."
2539 = "Nhờ câu nói đó của Hachiroku, Hibiki và Nagi đã hoàn thành xuất sắc vai trò đại diện lái tàu và phụ lái tàu——"
2541 = "Nghe em ấy nói mới để ý, cảm giác như bị tù đọng vậy... Quả thực là khác hẳn với bầu không khí trong lành ở bên ngoài này."
2542 = "Nhờ cuộc khảo sát hôm nay, tôi cảm thấy như mình đã xác định rõ được thứ tự ưu tiên."
2548 = "Hơn nữa Reina lại còn đang say sưa nói chuyện, thậm chí khua chân múa tay. Như thế mà bảo không vấp ngã thì hơi vô lý."
2550 = "Và giọng nói của Reina lần này, nghe ngập tràn một niềm vui sướng thuần khiết."
2555 = "Lời nói bộc lộ cảm xúc chân thật của tôi đã khiến Reina cười khúc khích, mang nụ cười vui vẻ trở lại."
2556 = "Ngay khi tôi vừa dứt lời, gương mặt Paulette tối sầm lại."
2557 = "Vừa nghe tôi hỏi, nụ cười của em ấy bừng sáng rạng rỡ."
2558 = "Nghe tôi hỏi vậy, vút một cái—— gương mặt Reina thoáng hiện lên vẻ buồn bã."
2561 = "Nếu mà lên \\x%l8620;#00ffc040;8620%l;#;, thì số phận của chiếc khăn này sẽ thê thảm lắm."
2565 = "Nếu tiến hành khảo sát quy mô lớn, thì kiến thức và năng lực của Reina e là vẫn chưa đủ."
2575 = "Nhận được nụ cười của Reina, bóng đen bất an làm mờ đi đôi mắt xanh của Paulette cũng dần tan biến."
2584 = "Nói đến đó, Paulette bỗng ngập ngừng."
2585 = "Nói rồi, cô hắng giọng nhẹ một cái. Giọng nói của Paulette chuyển sang điệu bộ như một giáo viên."
2593 = "Đây là…… bản năng bảo vệ sao. Tôi muốn đối xử với em ấy dịu dàng hơn, nâng niu hơn nữa."
2594 = "Nơi thang máy hướng đến là dưới lòng đất."
2595 = "Lần này là một nụ cười bẽn lẽn, ngượng ngùng."
2596 = "Chỗ này cũng vậy, chắc hẳn đã bị bỏ hoang hơn mười năm rồi."
2597 = "Điều đó tôi biết rõ mười mươi, nhưng――"
2599 = "Phục hồi kinh tế thành phố thông qua Mine Treasure và việc hồi sinh mỏ than."
2608 = "Sau đó, Reina dành chút thời gian, từ từ cử động cơ thể để kiểm tra xem sao."
2609 = "Dù tuyến đường sắt có được nối liền, tôi cũng không nghĩ là sẽ dễ bán đến thế, nhưng mà――"
2610 = "Dù là khác thật nhưng――"
2616 = "Tôi nghiêng đầu khó hiểu trước câu nói như đánh đố đó. Reina hơi bối rối, bắt đầu giải thích thêm."
2628 = "（Hửm――\"Mình\" cơ à?）"
2629 = "（Nhẹ nhàng nhấc bổng）"
2631 = "（Chộp lấy）"
2632 = "（Phịch）"

[selections]
