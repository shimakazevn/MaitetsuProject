1603 = "Đỉnh quy đầu sưng tấy đỏ lựng được vuốt ve cưng nựng. Chỉ một chút kích thích đó thôi cũng đủ làm tôi run rẩy."
1604 = "Với đôi tay quen thuộc, em ấy kéo khóa quần xuống, và mở toang phần trước của chiếc quần lót."
1607 = "Giọng nũng nịu ngọt ngào tan chảy như ngậm kem tươi. Thế nhưng trong một thoáng, sống lưng tôi lại lạnh toát."
1608 = "Một giọng nói rạng rỡ, chân thật và đầy vui sướng. Dù trong lúc này, quả nhiên Reina vẫn luôn là Reina."
1609 = "Đôi môi mềm mại mơn trớn dọc theo rãnh quy đầu. Reina vừa mút mạnh, vừa kéo ra cho đến sát mép"
1611 = "Khoảnh khắc nghĩ rằng giọng điệu của em ấy giống như đang làm bánh, tôi chợt nhận ra. Hiện tại, tôi chính xác đang bị Reina nhào nặn."
1614 = "Đôi môi đang siết chặt sát mép lại một lần nữa nuốt trọn lấy đến tận gốc với chiếc lưỡi làm đường ray. Quy đầu chạm vào thành họng."
1616 = "Lỗ sáo bị liếm láp. Như thể đang thăm dò xem có thể đi vào trong từ đó không, chiếc lưỡi ướt át nóng hổi của Reina miết dọc theo khe hở hết lần này đến lần khác."
1618 = "Bàn tay cuộn tròn những ngón tay lại, nắm lấy tôi thật chặt. Ép chặt lấy sự cương cứng của tôi. Cứ thế mà nắn bóp kích thích."
1620 = "Một nụ cười rạng rỡ, đầy vẻ mãn nguyện. Giữ nguyên nụ cười đó, Reina há miệng thật to, thật to, thật to,"
1625 = "Xuất tinh xong rồi. Ngay khoảnh khắc tôi nghĩ vậy, Reina hút mạnh một cái, làm thêm một cục tinh dịch nữa tuôn ra từ lỗ sáo."
1645 = "Muốn tận hưởng trò chơi đóng vai——cảm giác đó trong chớp mắt, đã bị cuốn trôi bởi dục vọng xác thịt cháy bỏng."
1649 = "Dù đã làm theo cảm tính, nhưng sức nặng đè lên cánh tay cũng lớn, mà hôn nhau cũng khó nữa. Thế này thì, tạm thời..."
1650 = "Tôi không ghét trò chơi đóng vai. Nếu đó là mong muốn của Reina, tôi rất sẵn lòng tham gia."
1653 = "Tăng tốc. Để làm Reina lên đỉnh, để nhuộm đẫm em ấy trong khoái cảm, tôi vắt kiệt toàn bộ sức lực của cơ thể."
1655 = "Mắt chạm mắt với Reina trong gương. Trong khoảnh khắc, tôi nín thở."
1657 = "Quá sướng khiến tôi không thể thốt nên lời. Ý chí cố gắng tập trung đang bị hút cạn từ đỉnh quy đầu."
1660 = "Tôi cảm thấy một sự sai trái đối với Reina, và với chính bản thân mình. Tôi thì to lớn như vậy, còn Reina lại nhỏ bé đến thế sao."
1662 = "Cứ như thể tôi đang coi cơ thể Reina là một món đồ chơi vậy. Cảm giác sai lệch và tội lỗi hòa quyện với khoái cảm ở vùng bụng dưới."
1664 = "Suýt chút nữa thì xuất tinh, tôi phải gồng siết toàn bộ cơ mông lại. Tôi đang hoàn toàn đâm xuyên qua Reina. Sướng đến mức đầu óc quay cuồng."
1665 = "Tôi có thể hiểu rõ. Cảm nhận được điều đó. Reina đang muốn tôi phải van xin. Muốn tôi làm nũng."
1667 = "Tôi lột phăng bộ đồ lót của em ấy ra, rồi nhấc bổng Reina nhỏ bé lên——"
1670 = "Tôi áp sát đũng quần vào chóp mũi nhỏ nhắn của Reina."
1672 = "Kìm nén giọng nói chực chờ lạc đi, tôi cũng cố nén luôn cả khao khát muốn túm lấy đầu em ấy và nhấp hông thật mạnh."
1675 = "Tôi ấn vào bụng em ấy để vắt kiệt toàn bộ nước tiểu ra ngoài. Rồi từ từ——rút sự cương cứng ra khỏi âm đạo của Reina."
1676 = "Tôi vuốt ve mái tóc ấy, và trao một nụ hôn. Sau khi xuất tinh, sự mệt mỏi ập đến cánh tay ngay lập tức, nhưng tôi vẫn cố gắng chịu đựng thêm 1 phút nữa."
1678 = "Nếu tôi cố tình gọi tên bộ phận sinh dục một cách trực diện, Reina sẽ lắc đầu nguầy nguậy——"
1680 = "Cảm giác muốn trêu chọc em ấy một chút lập tức bị phá vỡ bởi lời van nài. Tôi tiến vào Reina một cách chậm rãi, thật chậm, thật chậm——"
1682 = "Tôi đang xuất tinh. Trong lúc xuất tinh, tôi vẫn điều chỉnh góc độ cơ thể của Reina."
1683 = "Tôi ra lệnh đưa tay nhưng lại không chìa tay mình ra. Reina bối rối, nghiêng đầu một cách đáng yêu."
1685 = "Cọ xát đỉnh quy đầu vào tận cùng bên trong, lực siết lại càng trở nên mạnh hơn. Dù đã chạm đến tận cùng, em ấy vẫn khao khát ngọ nguậy muốn tiến sâu hơn nữa một cách ngọt ngào."
1688 = "Reina chun mũi, âu yếm ngửi đi ngửi lại mùi của phần thịt đã cương cứng hoàn toàn bên dưới lớp quần của tôi."
1689 = "Có tiếng nuốt nước bọt ực một cái. Sức nóng từ phần da tiếp xúc tăng lên. Làn da của Reina phản chiếu trong gương ửng đỏ, những giọt mồ hôi bắt đầu hiện rõ."
1690 = "Đâm sâu vào bên trong rồi lập tức cọ xát ngoáy mạnh, Reina cất lên một âm thanh ngọt ngào, không thành tiếng——"
1693 = "Cho nên, tôi lại càng muốn nhiều hơn. Tham lam không biết điểm dừng. Tôi muốn nhuộm đẫm toàn bộ Reina bằng tất cả những gì tôi có."
1696 = "Cánh tay đã mỏi mà âm đạo cũng khít chặt——hay đúng hơn là âm đạo còn hung bạo hơn. Chỉ việc nhấc bổng cơ thể Reina lên thôi cũng khiến sự cương cứng như muốn đứt lìa."
1698 = "Hai cánh tay bắt đầu run bần bật. Cơ bắp lên tiếng phản đối trước cả não bộ, báo hiệu rằng điều đó là quá sức."
1704 = "Nếu vậy thì, không còn gì phải do dự nữa. Mọi giác quan của tôi đều bị thu hút bởi chiếc lưỡi và đôi môi của Reina."
1706 = "Còn tôi, vì là một người đàn ông. Tất nhiên, sẽ biến mong muốn của Reina thành hiện thực."
1708 = "Mỗi lần em ấy nhấp đầu tới lui, đôi tai đáng yêu lại giật giật. Đáng yêu đáng yêu sướng quá, não tôi không thể nghĩ được gì khác ngoài điều đó."
1713 = "Cùng với đó, một âm thanh không thành tiếng truyền đến. Xuyên qua sự cương cứng, qua da thịt, qua xương mu truyền đến não, và chạm đến tận tâm hồn."
1714 = "Dù Reina có nhỏ bé đến đâu, thì tư thế này cũng khá là khó khăn. Thời gian hai cánh tay có thể chịu đựng được chắc không còn đến 10 phút nữa."
1719 = "Rồi lại nuốt toàn bộ vào trong miệng. Sướng quá sướng quá sướng quá. Mỗi lần nhấp chậm và sâu, từ mông lên đến sống lưng tôi lại râm ran tê dại."
1720 = "Từ đó, tốc độ tăng vọt! Để đáp ứng lời cầu xin của tôi, em ấy chuyển động đầu hết cỡ, vắt kiệt tinh dịch của tôi!"
1723 = "Bản thân Reina cũng đang hưng phấn vì những lời nói đó. Mật dịch từ giữa hai chân nhỏ giọt xuống. Vòng eo đang ngọ nguậy không yên."
1726 = "Có lẽ vì đã lên đỉnh, đôi mắt đang thẫn thờ của Reina chớp chớp vài cái, rồi ngay lập tức nhìn chằm chằm vào một điểm."
1728 = "Lè lưỡi một cái, Reina thè chiếc lưỡi ra. Chỉ vậy thôi, sự cương cứng của tôi đã giật nảy lên trong mong đợi."
1730 = "Trên chiếc lưỡi đã nuốt trọn tinh dịch của tôi, Reina để cục tinh dịch vừa bị vắt kiệt cuối cùng lên đó, rồi há miệng thật to cho tôi xem."
1732 = "Nuốt trọn sự cương cứng vào tận sâu nhất, Reina cứ thế, dùng cổ họng, dùng đôi môi thầm thì điều gì đó."
1734 = "Reina gọi sự cương cứng bằng tên tôi, dùng những ngón tay ngắn tròn trĩnh của mình, mơn trớn vuốt lấy những giọt rỉ ra phía trước."
1736 = "Tôi dần dần bị nuốt chửng vào cái lồn nhỏ bé của Reina. Cảm giác sai trái đến từ thị giác thỏa mãn cảm giác thành tựu và ham muốn chiếm hữu của tôi."
1737 = "Sự cương cứng đang cong lên cứng ngắc, được những ngón tay của Reina cẩn thận, nhẹ nhàng dẫn dắt ra bên ngoài."
1740 = "Ngón tay Reina bắt đầu di chuyển vẽ những vòng tròn một cách đầy thích thú. Ngay trên sự cương cứng, hay đúng hơn là ngay trên đỉnh quy đầu của tôi."
1742 = "Đôi bàn tay của Reina nhẹ nhàng, thật nhẹ nhàng, xoa nắn sự cương cứng của tôi đang nằm trong âm đạo từ bên ngoài bụng."
1744 = "Như để thưởng thức trọn vẹn toàn bộ quy đầu, chiếc lưỡi của Reina ướt át nhớt nháp, cuộn tròn bao bọc lấy rồi liếm láp xung quanh."
1746 = "Cửa âm đạo của Reina cũng đã ướt đẫm nhầy nhụa. Tôi áp đầu quy đầu vào đó, và từ từ cất tiếng hỏi."
1747 = "Nước bọt trào ra từ miệng Reina. Nó nối thành một sợi tơ ngắn, rồi ngay lập tức bị cuốn lấy trong lòng bàn tay em ấy."
1749 = "Reina đang bồn chồn một cách kỳ lạ. E thẹn—— một từ có vẻ không hợp với Reina lại hiện lên trong đầu tôi."
1751 = "Reina ngồi xổm xuống. Ngay trên tấm nệm vừa mới trải xong. Tôi lập tức nhận ra. Bộ đồ lót này không chỉ dễ thương thôi đâu."
1755 = "Làm tình bằng miệng. Làm tình bằng chỗ đó. Thật là những từ ngữ đáng yêu làm sao."
1756 = "Reina đã hoàn toàn nhập vai. Với nụ cười rạng rỡ, cô bé trông như sắp vẫy đuôi đến nơi rồi."
1761 = "Đột nhiên, Reina khựng lại——ư!!!"
1769 = "Tinh dịch đồng loạt bắn ra. Toàn bộ phần dưới thắt lưng như tan chảy và rót thẳng vào trong âm đạo của Reina."
1770 = "Tinh dịch dồn lên cùng một lúc khiến tinh hoàn đau nhói. Sự cương cứng nóng hổi tan chảy trên đôi môi, đến mức khoái cảm cũng trở nên tê dại——"
1772 = "Tinh dịch tong tỏng tràn ra từ âm đạo. Reina nhìn chằm chằm vào chính mình trong gương với ánh mắt có phần rực lửa."
1786 = "Cơ thể tôi gần như tự động di chuyển. Dùng ngón chân kéo chiếc thau rửa mặt luôn được chuẩn bị sẵn ở góc phòng vào ban đêm lại gần."
1789 = "Lần này chiếc lưỡi cong lên, ấn mạnh từ dưới lên. Như thể đang thưởng thức sự cương cứng của tôi đang trượt qua, em ấy liếm láp móc ngoáy——"
1790 = "Cả ruột, rồi cho đến tận lỗ bài tiết. Tôi muốn nhuộm đẫm toàn bộ Reina bằng tinh dịch của mình——ư!?"
1792 = "Một chiếc bàn trang điểm nhỏ xíu được chạm khắc họa tiết hoa văn, trông như đồ chơi đóng vai. Món đồ nội thất của Reina trong phòng chúng tôi bỗng chốc nhuốm màu dâm đãng."
1797 = "Chiếc thau rửa mặt dưới bàn trang điểm——nếu xả nước vào đó, thì cảnh tượng ấy sẽ bị chiếc gương thu lại không sót một chi tiết nào."
1799 = "Vòng eo của Reina ngọ nguậy, nhưng phạm vi có thể di chuyển lại rất hẹp. Có lẽ do sự bồn chồn thôi thúc, giọng nói của em ấy cũng dần trở nên ướt át."
