1269 = "「Vậy sao ạ~.\\nNếu thế thì Reina cũng muốn giúp một tay nha~」"
1270 = "「Vậy sao?」"
1272 = "「Nó được lắp dưới chiếu tatami sao ạ~?」"
1274 = "「Đúng vậy. Người có chứng chỉ chính thức và ở càng gần càng tốt.\\nNhờ chị ấy tìm thử theo phương hướng này thì sao?」"
1276 = "「Vâng ạ~. Reina muốn trở thành một cô dâu tuyệt vời.\\nMuốn trở thành một đôi vợ chồng tuyệt vời hơn nữa với anh Soutetsu. Cho nên」"
1278 = "「Đúng vậy ạ~. Lúc Reina được cải tạo thành toa xe diesel tự hành,\\nbác ấy cũng đưa ra rấ~t nhiều yêu cầu cho người của hãng sản xuất đó nha~」"
1279 = "「Đúng rồi ạ~」"
1280 = "「Đúng rồi ạ~. Đào ở đâu và đào như thế nào,\\nnếu không tính toán cẩn thận thì sẽ sập hầm ngay lập tức đó nha~」"
1283 = "「Đúng rồi ạ~. Thức ăn của con người, thế hệ Railord của Reina\\nbình thường đâu có ăn đâu nha~」"
1284 = "「Vâng ạ~. Cô Kayoko thì, ừm, dạ~」"
1285 = "「Đúng vậy. Nghe nói họ đã lắp hệ thống sưởi sàn chuyên dụng cho phòng trải chiếu tatami.\\nLúc mới về, tôi cũng ngạc nhiên lắm.」"
1289 = "「Đúng vậy ạ~. Cùng anh Soutetsu chuẩn bị đủ thứ chuyện,\\nReina thấy rấ~t là vui luôn đó nha~」"
1290 = "「Đúng vậy ạ~. Cơn buồn ngủ của Reina cũng biến mất rồi,\\nvà nỗi lo về hệ thống chuyển động của KiHa 07S cũng được giải quyết nha~」"
1292 = "「Đúng vậy ạ~. Nếu là dầu diesel, loại dành cho vùng ấm áp\\ncó khi còn dịu nhẹ hơn loại dành cho vùng lạnh giá nữa cơ~」"
1295 = "「Đúng vậy. Và điều đó không chỉ giới hạn ở cách mặc kimono,\\nmà có lẽ còn liên kết với toàn bộ khóa tu dưỡng tân nương nữa.」"
1297 = "「Đúng vậy. Dạo này trông chị ấy cực kỳ khỏe mạnh. Công việc ở xưởng rượu\\nlà một cuộc chiến cam go với cái nóng mùa hè và cái lạnh mùa đông cơ mà.」"
1299 = "「Đúng vậy ạ~. Dù chỉ khác biệt một chút xíu xiu thôi nha~」"
1300 = "「Vâng ạ~. Anh Soutetsu đã bóc cho đó nha~.\\nReina cũng ăn ngon miệng lắm ạ~」"
1302 = "「Cũng tốn khá nhiều thời gian nha~. Nhưng mà, cô Kayoko\\nlúc nào cũng tươi cười, lắng nghe ý kiến của rất nhiều người」"
1305 = "「Ra là vậy. Hóa ra là thế.」"
1306 = "「Là vầy nè~, anh Soutetsu.」"
1308 = "「Là ảnh đen trắng sao. Màu ngả nâu sepia trông rất có hồn.」"
1312 = "「Em có một việc nhất định phải nhờ chị Mayami.」"
1318 = "「Chẳng có gì là không được cả, anh còn muốn nhờ em nữa là đằng khác.\\nÀ không, sai rồi. Hãy để anh được yêu cầu Reina.」"
1319 = "「Đúng rồi ạ~. Cô Kayoko đã luôn\\nlàm giáo viên ở Học viện Katakami đó nha~」"
1323 = "「Chị Paulette cũng vui lắm đó nha~.\\nBảo là 『Nhờ có anh Soutetsu đã thúc đẩy』 đó ạ~」"
1325 = "「Dầu gội và xà phòng là mùi đồ dùng ở nhà.\\nBột giặt và nước xả vải cũng vậy…… Tóm lại, mùi giống hệt anh thôi.」"
1328 = "「Vì tương lai của vợ chồng chúng ta, xin em hãy hoàn thành\\nkhóa tu dưỡng tân nương. Tất nhiên, anh cũng sẽ hỗ trợ Reina.」"
1330 = "「Rồi lại nhờ giáo viên tiếp theo dạy môn tiếp theo nhỉ~.\\nReina vụng về lắm, nên được học từng thứ một là vui lắm nha~」"
1332 = "「Đường sắt mỏ Katakami có chuyến tàu cuối sớm lắm nha~」"
1333 = "「Reina——. Reina. Nhớ ra rồi ạ~.\\nCứ nghĩ là không liên quan đến mình, nên Reina đã quên mất nha~」"
1335 = "「Reina.」"
1337 = "「Việc anh Soutetsu cảm thấy cô đơn á~,\\nReina ghét lắm đó nha~」"
1338 = "「Reina cũng nghĩ chắc chắn là như vậy đó ạ~」"
1340 = "「Reina nhớ rõ lắ~m nha~. Dạ ừm~,\\ntrà đạo, cắm hoa, dọn dẹp, giặt giũ, nấu ăn, khâu vá và cách mặc kimono ạ~」"
1342 = "「Reina là Railord mà…… A.」"
1345 = "「Mùi của Reina, không phải là mùi dầu mỡ sao ạ~?」"
1350 = "「Tốt nghiệp…… bổ túc ban đêm.\\n——!? Gì cơ, Reina đã tốt nghiệp học viện sao?」"
1351 = "「Ở Katakami thời đó, cũng có khá nhiều người\\nmuốn học mà không được học đó ạ~」"
1352 = "「Reina nghe nói là khi có quyết định đưa toa xe tự hành vào Katakami,\\nvà công ty muốn tự tuyển người lái, bác ấy đã tự ứng cử đó ạ~」"
1353 = "「Dù bị mắng là 『Lớp bổ túc ban đêm đúng là vớ vẩn』.\\nCô ấy vẫn lắng nghe và nói 『Xin hãy chỉ ra những điểm chưa tốt đi ạ』」"
1354 = "「Đương nhiên rồi ạ~. Trước khi trở thành người lái toa xe tự hành,\\nbác Denjirou từng là một kỹ sư mỏ đó nha~」"
1356 = "「Một câu nói thật sâu sắc. Quả đúng là vậy.\\nReina giỏi thật đấy. Bình thường em vẫn hay suy nghĩ những chuyện như thế sao?」"
1362 = "「Chị Mayami.」"
1363 = "「Chị Mayami, vất vả cho chị rồi.」"
1378 = "「Ra là vậy. Kỹ sư mỏ là một công việc cực kỳ quan trọng đối với mỏ than,\\nvà mang trách nhiệm rất lớn lao nhỉ.」"
1379 = "「Rất ngọt ngào. Nếu có thể dùng từ 'mùi cơ thể',\\nthì đây chắc hẳn là mùi cơ thể của Reina nhỉ.」"
1380 = "「Đúng là vậy. Nhưng, nếu đã nói thế thì」"
1381 = "「Kỹ sư mỏ.」"
1382 = "「Cả chuyện về mỏ than, cách đổ rác, phép lịch sự trong rạp chiếu phim,\\ncách dỗ em bé, cả cách ép hoa sao cho đẹp nữa——a」"
1385 = "「Trong một khoảng thời gian dài thậ~t dài,\\ncó lẽ mùi của chị Paulette đã thấm vào người Reina rồi cũng nên nha~」"
1387 = "「Tốt quá nhỉ. Hai đứa vừa ăn quýt cùng nhau à?」"
1393 = "「Anh có muốn xem album ảnh của Reina không ạ~?」"
1394 = "「Mở rộng? À, ra vậy. Khai thác mỏ là việc liên tục đào sâu vào trong hang\\n——tức là, phải luôn không ngừng mở rộng.」"
1396 = "「Có thể là vậy nhưng mà…… Reina á, không thể nào trở nên\\ngiống cô Kayoko dù chỉ một chút xíu xiu nào đâu nha~」"
1397 = "「Nếu là xăng chỉ số octane cao, Reina thấy X-Power\\ncủa Dầu mỏ Showakai là hợp khẩu vị nhất nha~」"
1398 = "「Xin chị hãy dạy cho Reina. Cho Reina và anh Soutetsu.\\nKhóa tu dưỡng tân nương đi ạ~」"
1402 = "「Chị vất vả rồi nha~」"
1403 = "「Chuyện lớp bổ túc ban đêm, cả chuyện Railord nữa, cô Kayoko\\nđã thông qua bác Denjirou để đàm phán với giám đốc đó ạ~」"
1411 = "「Đó chắc chắn là mùi hương của tình yêu thương. Của Paulette, và tất nhiên\\nlà của tất cả những người đã luôn trân trọng Reina.」"
1412 = "「Bức ảnh này,\\nđược chụp vào khoảng thời gian nào sau khi em xuất xưởng vậy?」"
1413 = "「Có vẻ là vì chứng sợ lạnh của chị Mayami trở nên nghiêm trọng hơn.」"
1414 = "「Là ảnh kỷ niệm một năm nhậm chức đó ạ~」"
1415 = "「Thế này còn dễ xem hơn nữa nhỉ.」"
1416 = "「Vậy thì giúp ích cho Reina lắm nha~.\\nCòn thứ tự tu dưỡng tân nương thì sao ạ~?」"
1417 = "「Bản thân lớp bổ túc ban đêm cũng chưa có sao.」"
1421 = "「Mấy chị sắp lấy chồng cũng nói y chang vậy đó ạ~!\\nNào là 『Cổ hủ quá』 hay 『Bây giờ đâu còn là thời đại đó nữa』」"
1423 = "「Nếu vậy, bác ấy mới bắt đầu học lái toa xe tự hành từ lúc đó sao?」"
1425 = "「Nếu vậy, anh muốn lấy họ làm tấm gương.\\nKý ức về đôi vợ chồng mà Reina vô cùng trân trọng ấy.」"
1426 = "「Vậy thì tốt rồi.」"
1428 = "「Vậy thì làm thôi. Dù là khóa tu dưỡng tân nương sau khi đã trở thành cô dâu,\\nnhưng chắc chắn là không hề muộn màng chút nào đâu.」"
1432 = "「Vậy thì chúng ta cũng noi theo điều đó đi.」"
1433 = "「Vậy thì cứ nhờ theo hướng đó nhé.\\nReina còn băn khoăn chuyện gì nữa không?」"
1434 = "「Thì tất nhiên rồi, dù sao thì quýt cũng là trái cây mà.」"
1435 = "「Nếu vậy chắc chắn, khóa tu dưỡng tân nương cũng thế,\\nđó là điều có giá trị để hai ta cùng nhau vượt qua nhỉ.」"
1436 = "「Nếu vậy——\\nChắc hẳn cuộc đàm phán đó đã diễn ra rất khó khăn nhỉ?」"
1442 = "「Cả Railord cũng được tiếp nhận ngay từ đầu sao?」"
1444 = "「Bác Denjirou và anh Soutetsu hoàn toà~n không giống nhau,\\nvà Reina cũng không giống cô Kayoko chút nào, nhưng mà~」"
1445 = "「Đúng là bất ngờ thật, nhưng có lẽ chuyện là vậy nhỉ.」"
1446 = "「Anh Soutetsu là chồng, còn chị Paulette là Master.\\nReina hạnh phúc gấp 2, gấp 3 lần luôn đó nha~」"
1450 = "「!」"
1453 = "「!?」"
1541 = "Tôi lỡ nghĩ đến cảnh Reina lúc nhỏ chắc hẳn sẽ đáng yêu lắm, rồi lại cười gượng.\\nReina là Railord, làm gì có chuyện ngoại hình thay đổi cơ chứ."
1543 = "Không biết là do học hỏi bắt chước từ những ngày đầu hoạt động,\\nhay là phương pháp đó vốn dĩ đã phù hợp với bản tính thiên bẩm của Reina."
1545 = "Không phải thuyết phục, mà là lắng nghe.\\nNghe hết mọi lời phàn nàn, chỉ đơn thuần nhẹ nhàng đồng cảm."
1568 = "Thực ra, nếu kiên nhẫn lắng nghe thì Reina giải thích rất giỏi. Dù vậy,\\nchuyển hướng nghề nghiệp ở độ tuổi đó mà có thể trưởng thành nhanh đến thế thì——"
1594 = "Trước thời của Paulette. Trước khi chuyển đến Đường sắt Ohito. Thời còn ở mỏ than Katakami.\\nThực sự tôi rất tò mò. Tôi muốn biết nhiều hơn về Reina."
1596 = "Từ trong những mùi hương đó, thoang thoảng tỏa ra một sự ngọt ngào.\\nDù khó mà tin được Railord lại có mùi hương này, nhưng mà——"
1600 = "Tôi cảm thấy thật vui. Không chỉ tôi, mà cả chị Mayami, Hibiki và Hachiroku,\\ncũng đã xem Reina như một thành viên trong gia đình một cách vô cùng tự nhiên."
1611 = "Trên đùi tôi, Reina ngước hẳn mặt lên.\\nĐưa hai bàn tay ngắn ngủn ra vỗ vỗ, chạm vào má tôi."
1613 = "Vừa bóc vỏ quýt, tôi vừa khẽ quan sát tình hình xung quanh."
1615 = "Ngay trước mắt tôi, người vừa tự nhủ——mình đã nói một câu rất hay,\\nlông mày Reina lại cụp xuống vẻ đầy bối rối."
1617 = "Rốt cuộc đó là công việc như thế nào,\\nngay khoảnh khắc tôi vừa nghĩ vậy, Reina đã mỉm cười."
1619 = "Lời nói nửa đùa nửa thật của tôi lại khiến khuôn mặt Reina tối sầm lại."
1623 = "Tôi tựa cằm lên tóc Reina, cứ thế tận hưởng hương thơm dịu nhẹ.\\nMột mùa xuân đến sớm chỉ dành riêng cho khứu giác của tôi."
1624 = "Tôi lột xong những sợi xơ trắng bám trên lớp vỏ lụa.\\nVừa đưa ra, Reina đã thong thả há miệng."
1626 = "Tôi nhớ lại nhận xét của Hachiroku về bản vẽ thiết kế khi cải tạo.\\n\"Quả là một bản cải tạo tràn ngập sự dịu dàng làm sao\"."
1628 = "Tôi khẽ chọc vào chiếc mũi thấp của em ấy.\\nChiếc mũi giật mình lùi lại, rồi tự cọ vào ngón tay tôi làm nũng."
1630 = "Tôi bế Reina từ trên đùi xuống và đặt ngồi cạnh mình."
1632 = "Tôi ôm đầu Reina kéo lại gần.\\nMuốn xua tan đi chút buồn bã mỏng manh ấy. Muốn truyền hơi ấm của tôi cho em."
1634 = "Tôi xoay người Reina đang ngồi trên đùi mình lại.\\nTừ chính diện, tôi nhìn thẳng vào đôi mắt em."
1635 = "Khoảnh khắc tôi ngồi thẳng lưng, Reina cũng làm theo tôi.\\nSự ăn ý nhạy bén ấy khiến tôi vui mừng, nên tôi càng thêm nghiêm túc."
1638 = "Tôi nhân cơ hội này hít hà thành tiếng khịt khịt.\\nChắc vì xấu hổ, Reina hơi cựa quậy một chút."
1640 = "Tôi ngồi khoanh chân, đặt Reina lọt thỏm vào lòng mình."
1641 = "Tôi khẽ vuốt ve mái tóc của Reina.\\nNhắm mắt lại, rồi mở ra. Reina thốt ra những lời tiếp theo."
1642 = "Tôi nhẹ nhàng vuốt ve mái tóc của Reina.\\nMái tóc tơ mềm mại bám nhẹ vào tay."
1645 = "Tôi gật đầu, và chào bằng ánh mắt một cách vô cùng tự nhiên."
1646 = "Ở phía bên kia tấm cửa lùa, chị Mayami đang vươn vai thật lớn.\\nÀ, ra vậy——chị ấy đang đợi chúng tôi sao."
1652 = "Trách nhiệm lớn lao thì tất nhiên sẽ đi kèm với thù lao xứng đáng.\\nKhi đã hiểu ra, tôi có cảm giác bức ảnh như được điểm thêm chút màu sắc."
1655 = "Sàn gỗ, tường gỗ, chiếc bàn nhỏ vô điều kiện gợi lên nỗi nhớ nhà.\\nReina với khuôn mặt căng thẳng đang ngồi ngoan ngoãn ở đó."
1656 = "Tôi chỉ định hỗ trợ gián tiếp thôi,\\nnhưng nếu Reina đã mong muốn như vậy, thì tất nhiên là chúng tôi sẽ cùng nhau tu dưỡng rồi."
1670 = "Nếu vậy thì bác Denjirou trong ảnh trông khá là lớn tuổi rồi."
1673 = "Reina cũng nghĩ đến bàn sưởi kotatsu.\\nNgay cả một sự trùng hợp nhỏ nhoi như vậy, cũng khiến tôi hạnh phúc vô bờ."
1675 = "Reina cũng có bí mật. Và em ấy đã chia sẻ nó với tôi.\\nMột niềm vui sướng dai dẳng kỳ lạ cứ sục sôi trong lồng ngực."
1677 = "Ngón tay Reina chợt khựng lại. Hơi run rẩy.\\nNgay cả đôi mắt ngước nhìn tôi cũng dao động đầy vẻ bất an."
1680 = "Một nụ hôn phớt lên má trẻ con, áp sát vào nhau.\\nCảm giác yêu thương bỗng chốc phình to và cháy bỏng."
1682 = "Trên đùi tôi, Reina ngọ nguậy cọ xát cơ thể vào người tôi."
1684 = "Vừa nhâm nhi xăng chỉ số octane cao, vừa thích thú thao thao bất tuyệt.\\nHành động thì giống hệt bợm nhậu, nhưng lại đáng yêu không chịu nổi."
1686 = "Reina gật đầu, trông vô cùng hạnh phúc."
1687 = "Khi tôi hỏi, Reina nhoẻn miệng cười."
1689 = "Mỉm cười, Reina gật đầu thật mạnh."
1691 = "Chậm rãi, nâng niu. Từng trang album được lật mở."
1693 = "Reina chầm chậm gập từng ngón tay ngắn ngủn lại một cách hạnh phúc."
1695 = "Đôi mắt Reina ngước nhìn tôi cong lên như hình vòng cung.\\nTrông đầy hoài niệm, và cũng pha chút đượm buồn."
1697 = "Vỗ vỗ vỗ. Vừa nghịch ngợm đôi má của tôi,\\nnụ cười của Reina càng lúc càng rạng rỡ và mềm mại hơn."
1698 = "Bốp, Reina vỗ hai tay vào nhau."
1700 = "Đáp lại cái vẫy tay nhỏ xíu,\\nReina liền ghé sát miệng vào tai tôi."
1702 = "Đôi bàn tay nhỏ bé xua xua liên tục."
1704 = "Reina cúi đầu thật sâu. Lần này đến lượt tôi làm theo em ấy.\\nLúc này tôi nên giao phó mọi chuyện cho Reina."
1705 = "Hơi thở làm nhột tai tôi."
1707 = "Reina hơi ngập ngừng.\\nTôi bèn xoa đầu em ấy, thầm nhắn nhủ rằng \"Anh sẽ nghe bất cứ chuyện gì\"."
1709 = "Cái \"một chút xíu\" được thể hiện qua vòng ngón cái và ngón trỏ\\nlà một khe hở nhỏ xíu đến mức khó mà nhìn rõ được."
1711 = "Đôi mắt của Reina đã chứng kiến biết bao mảnh đời ở thị trấn mỏ than.\\nTôi thấu hiểu được chiều sâu ẩn sau ánh sáng dịu dàng ấy."
1713 = "Đôi mắt ngái ngủ của Reina hướng về phía rổ quýt trên bàn trà."
1715 = "Reina đột nhiên hạ giọng.\\nTôi nghiêng đầu ghé sát tai lại, đón nhận lời thì thầm bí mật."
1717 = "Gương mặt Reina dịu lại đầy nhẹ nhõm.\\nPhần cơ thể chạm vào nhau cũng trở nên ấm áp hơn đôi chút."
1719 = "Ni he~~~, nụ cười của Reina tan chảy.\\nCòn nhũn hơn cả miếng bánh mochi trong canh zouni nấu quá lửa."
1721 = "Khuôn mặt Reina bừng sáng như hoa nở."
1722 = "Reina đã kế thừa trọn vẹn cách làm của cô Kayoko.\\nMột sự lắng nghe không hề áp đặt bất kỳ đánh giá, chỉ trích hay chỉ đạo nào."
1725 = "Nói rồi, Reina bẽn lẽn mỉm cười."
1726 = "Reina lật các trang album.\\nGiữa những trang ảnh đen trắng, dần dần bắt đầu xuất hiện ảnh màu."
1729 = "Reina đang thư giãn một cách uể oải.\\nBiểu cảm nửa nhắm mắt kia hệt như một chú mèo đang sưởi ấm trong bàn sưởi kotatsu vậy."
1730 = "Lạch bạch, lạch bạch, tiếng bước chân nhẹ nhàng leo lên cầu thang rồi xa dần."
1732 = "Thâm trầm và dịu êm.\\nGiọng nói tròn trịa đáng yêu của Reina mang một độ ẩm ướt khác hẳn ngày thường."
1734 = "Reina nhắm mắt lại, chu môi ra như một chú chim non.\\nTôi vốn không định làm vậy, nhưng bị vòi vĩnh đáng yêu thế này thì"
1737 = "Cách gọi \"chị\" vô cùng tự nhiên.\\nCó vẻ như những lời thỉnh cầu lặp đi lặp lại của chị Mayami cuối cùng cũng đơm hoa kết trái."
1738 = "Reina dính chặt lấy bên cạnh tôi——\\nhay nói đúng hơn là áp sát cả cơ thể vào tôi."
1743 = "Trước sự ngây thơ quá đỗi của Reina, chị Mayami cười khanh khách.\\nHạnh phúc thì có hạnh phúc, nhưng cũng toát mồ hôi lạnh."
1747 = "Khi kết hôn với Reina, chị Mayami, cha nuôi, mẹ nuôi,\\nvà cả chú Mototada đều khuyên răn tôi rằng nhất định phải tổ chức lễ đính hôn."
1749 = "Chầm chậm, chầm chậm mở cửa lùa ra,\\nchị Mayami ngồi xuống đối diện chúng tôi."
1753 = "Hoàn toàn có khả năng đó.\\nNhưng mà, mùi hương đó không chỉ thuộc về riêng một mình Paulette."
1759 = "Hai nụ cười đối diện nhau.\\nChỉ chừng đó thôi, cũng đủ khiến tôi hạnh phúc vô bờ bến."
1769 = "Từng lời nói thấm đẫm vào tâm trí đang nóng bừng của tôi.\\nReina vẫn giữ nụ cười ngây thơ không đổi, nhưng——"
1770 = "Nghe tiếng thì thầm của Reina,\\ntôi chợt nhận ra mình cũng đã vô thức hạ giọng, bèn cười gượng."
1771 = "Bị nói vậy làm tôi cũng thấy bận tâm.\\nHơn cả việc sẽ học những gì trong \"khóa tu dưỡng tân nương\"——"
1772 = "Một chú voi tai to đang nâng đỡ dưới mông Reina.\\nKhông hiểu sao hình ảnh đó lại được gợi lên bởi giọng nói ngọng nghịu kia."
1774 = "Chắc chắn vẫn có điều gì đó thay đổi. Giữa lúc chúng tôi mới gặp nhau\\nvà bây giờ——Reina quả thực đã thay đổi rất nhiều mà."
1778 = "Khung cảnh nền mang đậm nét gia đình thời kỳ đầu Showa.\\nHay đúng hơn là…… ừm. Đồ nội thất và cách bài trí, trông khá là——"
1780 = "Tôi đè nén ý nghĩ \"Tưởng chuyện gì\" vừa lóe lên trong đầu.\\nBởi tôi cảm nhận được rằng đối với Reina, đây là một chuyện quan trọng."
1796 = "Nói rồi Reina cử động ngón tay nhanh nhẹn hơn hẳn bình thường,\\nlần lượt chỉnh lại cổ áo, cổ tay áo và nơ."
1797 = "Nói rồi Reina lấy ra chiếc bình tông,\\nuống một ngụm ừng ực trông vô cùng ngon lành."
1808 = "Sau chuyến tàu cuối. Sau giờ làm. Tuyển sinh những người có nguyện vọng theo học, gọi là lớp bổ túc ban đêm.\\nCô Kayoko sau khi nghỉ hưu đã trở thành giảng viên của lớp học đó."
1809 = "Một đôi vợ chồng già vô cùng đẹp đôi, từ \"xứng lứa vừa đôi\" rất hợp với họ.\\nNgồi ở giữa là một Reina đang mỉm cười rạng rỡ."
1810 = "Đến mức đó thì cũng không phải chuyện hiếm. Nhưng mà——"
1811 = "Tôi có thể dễ dàng tưởng tượng ra được. Một người chồng kỹ sư cuồng công việc,\\nvà một người vợ đảm đang, khéo léo trong giao tiếp xã hội. ——Hửm."
1819 = "Tôi giật mình.\\nVì suy nghĩ trong lòng đã bị nói trúng phóc."
1823 = "（Không ổn rồi. Lần này là nhờ chị Mayami nên mới thoát được, nhưng mà……）"
1826 = "Nếu là Hachiroku hoàn toàn không biết đọc bầu không khí,\\nhay Hibiki đang trong chế độ tập trung cao độ, thì e là đã thành tai nạn mất rồi."
1829 = "（Cả tôi và Reina đều vẫn cần tu dưỡng nhiều lắm——\\nÀ, đúng rồi.）"
1830 = "（Album ảnh của Reina sao……）"

[selections]
