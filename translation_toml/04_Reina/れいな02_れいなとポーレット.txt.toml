63 = "Công việc ở \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; tại Đế đô cũng khắc nghiệt đến mức đó sao ——Vừa nghĩ đến đó, tôi lập tức nhớ ra, à, đúng là như vậy."
1156 = "——Lắng nghe những chuyện này, thật vui. Tôi không hề cảm thấy ghen tị với quá khứ như mình từng lo lắng."
1158 = "——Người ta hay ví von như vậy, đủ thấy quốc gia thắng trận trong cuộc \\x%l大戦;#00ffc040;Đại chiến%l;#; năm xưa, Meikoku, có tầm ảnh hưởng to lớn đến Hinomoto như thế nào."
1159 = "――Chuyện này để sau khi tàu vào ga an toàn rồi nói tiếp vậy."
1167 = "\"Là mọi thứ, là mọi người đó ạ!\" ——Reina nói, hai má em ấy giờ đã đỏ ửng như hoa hồng."
1169 = "Meikoku mà hắt hơi một cái, là Hinomoto sốt ba mươi chín độ."
1171 = "\"Chắc cũng có trường hợp cần phải \\x%l改軌;#00ffc040;cải khổ đường ray%l;#; đấy\", đền chủ Akai lẩm bẩm."
1180 = "……Lúc chơi đồ hàng tôi cũng đã cảm nhận được, Reina có một niềm khao khát khá mãnh liệt muốn trở thành \"con người\"."
1182 = "……À. Ra vậy. Có lẽ do khoảng cách thế hệ, những đứa trẻ như Nagi đã không còn biết đến \\x%l列車;#00ffc040;tàu%l;#; chở hàng nữa rồi."
1186 = "……Có lẽ không nên hỏi thì hơn. Nghĩ vậy, nhưng tôi không thể không xác nhận."
1187 = "……Biết đâu anh Soutetsu cũng muốn nhìn thấy khuôn mặt này, nên mới hỏi Reina về chuyện đường sắt mỏ than."
1193 = "……Paulette giải quyết chính xác từng ý kiến, câu hỏi liên tiếp được đưa ra."
1196 = "……Reina dường như cũng đã hết căng thẳng, em ấy tràn đầy năng lượng, đưa ra những thông tin bổ sung chính xác đúng chuẩn \\x%lレイルロオド;#00ffc040;Railord%l;#;."
1210 = "「Khi \\x%lグランビー鉱車;#00ffc040;toa chở quặng Granby%l;#; đến, việc dỡ hàng trở nên vô cùng nhàn nhã, các chú thợ mỏ mừng lắm luôn đó nha~」"
1211 = "「\\x%lグランビー鉱車;#00ffc040;Toa chở quặng Granby%l;#; nha, là loại toa dùng đường ray dẫn hướng để nghiêng thân xe, tự động đổ quặng xuống đó nha~」"
1215 = "「Nếu làm \\x%lヘッドマーク;#00ffc040;biểu trưng đầu tàu%l;#; bằng sắt, thì tôi rất sẵn lòng làm cho mọi người đó.」"
1219 = "「Việc điều chỉnh \\x%lレイルロオド;#00ffc040;Railord%l;#; cứ giao cho tôi.」"
1223 = "「Chủ yếu là \\x%l客車;#00ffc040;toa hành khách%l;#;, thêm khoảng một \\x%l貨車;#00ffc040;toa chở hàng%l;#; thì em làm được không? Vì anh nghĩ việc này vừa thu hút khách du lịch, vừa mang tính quảng bá nữa.」"
1226 = "「――Hủy bỏ giới hạn tốc độ, rõ!」"
1228 = "「Ngược lại, sao ạ?」"
1229 = "「…………」"
1234 = "「……Vậy sao.」"
1235 = "「……Phải cảm ơn anh Soutetsu thôi.」"
1238 = "「……Vẫn chưa――được.」"
1561 = "「Cảm ơn cô. Lúc nào cũng vậy. Nhờ có cô quan sát từ trên cao mà tôi được giúp đỡ rất nhiều.」"
1568 = "「Trong ba người, hai người được hạnh phúc và chỉ một người được hạnh phúc, em thấy cái nào tốt hơn?」"
1570 = "「Không ạ. Nếu ngài Soutetsu đứng ra sắp xếp, thì về mặt tâm lý, Thị trưởng Paulette sẽ cảm thấy...」"
1572 = "「Không hổ danh là ngài Soutetsu.」"
1575 = "「Không ạ~, là 508mm đó nha. Hẹp lắm ạ. Nên Reina cũng từng ước gì có \\x%l貨車;#00ffc040;toa chở hàng%l;#; Granby nha~」"
1578 = "「Không ạ, cô ấy không có vẻ gì là bị sốt hay ốm đau―― Nhưng mà, bầu không khí……cứ như là――」"
1586 = "「Để chị đợi lâu rồi nha~! Chị Paulette, Reina kì cọ lưng cho chị nha~」"
1588 = "「Cũng có nhiều trường hợp được đảm bảo tuyến chuyên dụng đấy chứ? Ví dụ như tuyến chuyên dụng từ mỏ than đến nhà máy luyện thép chẳng hạn.」"
1595 = "「Chuyện gì vậy ạ? Chuyện gì Reina cũng nói cho anh biết hết nha~.」"
1596 = "「Lấp lánh, là cái gì lấp lánh?」"
1597 = "「Hôm nay, cảm ơn mọi người đã đến đây nha~.」"
1600 = "「Công việc hôm nay thế nào? Em đã nói chuyện gì với anh Soutetsu vậy?」"
1601 = "「Hôm nay, chúng tôi mong mọi người góp ý về công dụng của lượng than dự kiến khai thác tại Mỏ than Jussen thuộc Mine Treasure.」"
1613 = "「Trong thời buổi này, thứ người ta tìm kiếm ở đường sắt du lịch không phải là tốc độ, mà là những hành trình đi đường vòng, nên tôi nghĩ ý tưởng này rất khả thi.」"
1615 = "「Nhưng mặt khác, cũng có rất nhiều ngành công nghiệp hoàn toàn đánh mất đi năng lực cạnh tranh.」"
1618 = "「Nhưng mà, nhưng mà, ở trong nước! Tuy chỉ ở phạm vi hẹp thôi, nhưng hiện giờ vẫn còn rất nhiều \\x%l列車;#00ffc040;đoàn tàu%l;#; chở hàng đang hoạt động năng nổ đó nha~」"
1622 = "「Em đưa chị đến đây sao? Chuyện em nài nỉ 『Chị dẫn em đến nhà tắm Tororyu-yu đi』, thực ra là vì chị à?」"
1623 = "「Không còn nữa tức là—— Giống như Mỏ than bỏ hoang Jussen, ít nhất vẫn còn lại đường ray chứ?」"
1624 = "「Em nói đúng.」"
1625 = "「Chuyện đó đã được xác nhận thực tế chưa?」"
1629 = "「Vâng ạ~ Có chuyện gì vậy nha~?」"
1634 = "「Anh làm tốt lắm ạ. Anh Soutetsu, anh vất vả rồi ạ.」"
1636 = "「Vào ga Ohimitera đường ray số 1. 17:00.」"
1639 = "「Toa chở quặng Granby?」"
1646 = "「Hai phút một chuyến á!?」"
1649 = "「Cả chị Hachiroku và chị Navi đều vậy ạ?」"
