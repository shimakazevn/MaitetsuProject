1675 = "「Khi ở bên cạnh anh Soutetsu, Reina lại càng yêu quý mọi người và mọi thứ hơn nữa đó nha~.」"
1676 = "「Hả?」"
1678 = "「Hả? Ơ——Chuyện này là sao vậy chị Paulette. Tim Reina đập thình thịch, cảm giác nghẹn lại khó thở quá nha~」"
1679 = "「Ơ, khoan đã? \"Cũng có\", vậy là còn lý do khác nữa sao?」"
