1687 = "「Ơ kìa? Nhắc mới nhớ, tại sao lại vậy nhỉ? Ở bên anh Soutetsu, mọi thứ cứ lấp lánh lên nha~.」"
1689 = "「Hả?」"
1691 = "「Hả? Nhưng mà…… chuyện dùng đường sắt để vận chuyển hàng hóa, bây giờ vẫn còn nơi làm thế sao——khụ, vẫn còn sao anh?」"
1692 = "「Hả? Nhưng mà, làm gì có nhiều hành khách đến thế...」"
1695 = "「À——Đúng rồi, Reina.」"
1696 = "「Hể, chở hàng có trước sao nè? Bất ngờ quá nè!!」"
1700 = "「Aaa」"
1701 = "「A――Ý ngài là chuyện này ạ?」"
1704 = "「A—— Vậy thì, chuyện em nhờ là...」"
1706 = "「À…… Trong cuộc chiến giá cả, thì không thể nào cạnh tranh lại than nhập khẩu đúng không?」"
1708 = "「A…… Thật là thư giãn.」"
1709 = "「À……chắc là do sự mệt mỏi tích tụ quá nhiều rồi.」"
1712 = "「A…… ra vậy. Những thứ quá nặng không thể tháo rời được, thì \\x%lエアクラ;#00ffc040;Aircra%l;#; không chở nổi——Ơ, vậy tại sao ở Hinomoto lại...?」"
1714 = "「A」"
1717 = "「Ahaha.」"
1718 = "「Auu」"
1719 = "「A ư~」"
1721 = "「A! Đúng rồi! Thế thì sẽ thành một hình thức quảng cáo. Đối với nhà máy luyện thép mà nói.」"
1724 = "「A! Chắc chắn là vậy rồi nha~. Nhưng mà……」"
1725 = "「A! Nếu được vậy thì, chắc chắn sẽ giúp được chị Paulette đó ạ!」"
1727 = "「A, đúng là vậy ạ. Nếu trong lòng còn vướng bận, thì dù có được đi chuyến tàu yêu thích cũng…… không vui nổi ạ.」"
1728 = "「À, loại thuốc bổ ấy hả? Nếu chỉ là mệt mỏi thể chất đơn thuần…… và kéo dài liên tục, thì chắc chắn là có hiệu quả rồi.」"
1733 = "「A, ra vậy. Là phương tiện của \\x%l特殊軌道;#00ffc040;khổ đường sắt đặc biệt%l;#;——giống xe goòng nhỉ. Khổ bao nhiêu? 610mm à?」"
1735 = "「A, cũng có những tuyến như vậy ạ. Nhỉ.」"
1737 = "「Ừm thì Reina nha, rất yêu quý mọi người và mọi thứ xung quanh.」"
1739 = "「Ừm, trừ những trường hợp cực kỳ nghiêm trọng, chứ bình thường chẳng ai muốn đến bác sĩ để xua tan mệt mỏi đâu.」"
1742 = "「Ừm. 'Luyện thép bằng loại than giống hệt loại dùng cho đầu máy hơi nước du lịch \\x%l8620;#00ffc040;8620%l;#; nổi tiếng.' ——Đó sẽ là một lời quảng bá mang lại hình ảnh tốt cho nhà máy luyện thép.」"
1745 = "「Vâng. Chuyện gì vậy nha~? Chị Paulette.」"
1747 = "「Ừ. Quá tuyệt luôn. Mình…… có khi hơi sợ nữa.」"
1748 = "「Ừ. Nếu được thì cho chị tham gia với nhé?」"
1750 = "「Ừ. Chắc mình cũng muốn đi thử.」"
1752 = "「Ừm. Với kiến thức và sự chuẩn bị của Paulette, cộng thêm những góc nhìn khác, biết đâu sẽ nảy ra ý tưởng gì đó.」"
1753 = "「Ừm.」"
1754 = "「Hửm!?」"
1755 = "「Ừm, em cũng vất vả rồi.」"
1757 = "「Ừ, đúng vậy nhỉ. Giỏi quá, Reina thông minh lắm!」"
1758 = "「Ừm.」"
1759 = "「Hửm? Tôi sao?」"
1761 = "「Ehehe~, không có chi đâu nha~」"
1763 = "「Ehehe~, cũng có lý do đó nha~. Reina cũng biết tắm suối nước nóng giúp xua tan mệt mỏi mà lị~」"
1765 = "「Ehehe~, chuyện gì vậy nha~?」"
1767 = "「Ehehe~, được khen rồi nha~——Á!?」"
1768 = "「Ehehe~, thoải mái quá đi nha~」"
1771 = "「Ehehe~, chị hãy thư giãn cho thật thoải mái nha~」"
1776 = "「Vì con người, tiền bạc và công việc đều tập trung ở Đế đô mà.」"
1777 = "「Vì có động thái chính trị nhúng tay vào mà. Một khi đã bị Meikoku gây áp lực, thì chẳng có quyền nói không.」"
1783 = "「Ở trong nước, 80% than được tiêu thụ bởi các nhà máy luyện thép và nhiệt điện. Việc bán kèm với hàng hóa hay sản phẩm có lẽ sẽ rất khó khăn.」"
1785 = "「Trước cuộc Đại bãi bỏ các tuyến đường sắt, không chỉ có mạng lưới đường sắt chở khách, mà cả mạng lưới đường sắt chở hàng cũng bao phủ khắp Hinomoto đấy nhé?」"
1788 = "「Có đó ạ, ở Đế đô thì có. Dù hai phút một chuyến, nhưng vào giờ cao điểm đi làm, các \\x%l客車;#00ffc040;toa hành khách%l;#; vẫn chật cứng như nêm ạ.」"
1792 = "「Nhờ có Paulette mà chúng ta đã sắp xếp được cả \\x%l客車;#00ffc040;toa hành khách%l;#; lẫn \\x%l貨車;#00ffc040;toa chở hàng%l;#;, các vấn đề về quyền lợi và giấy phép cũng đã được giải quyết ổn thỏa.」"
1795 = "「Nhờ Hachiroku đã rèn giũa nền tảng cho anh đấy. Mà――Paulette sao thế?」"
1802 = "「Thỉnh thoảng cô ấy còn ôm đầu suy nghĩ nữa. Nhìn những lọn tóc vàng óng rũ rượi rơi xuống, thật sự rất xót xa ạ.」"
1804 = "「Vì đây là mệt mỏi về thần kinh và trí óc mà. Cần phải thư giãn—— Nếu vậy thì…… Đúng rồi. Nếu là Paulette thì」"
1807 = "「Cô ấy đổ bệnh rồi sao?」"
1808 = "「Vâng ạ~. Nhè nhẹ thôi——rào」"
1810 = "「Vâng ạ~」"
1811 = "「Oa!」"
1813 = "「Nếu chỉ nhìn khu vực quanh Ohimitera thì chắc cháu không tin đâu nhỉ. Nhưng ở khu vực thủ đô thì câu chuyện hoàn toàn khác đấy.」"
1815 = "「Dù vậy mà vẫn phải bán, thì chắc chỉ còn cách bán kèm thôi nhỉ.」"
1816 = "「Nếu cô ấy có thể đi du lịch bằng đường sắt, thì đó sẽ là cách giải khuây tốt nhất ạ.」"
1818 = "「Nếu được như vậy, không chỉ giải quyết được vấn đề chi phí vận chuyển, mà còn tạo ra thêm điểm nhấn nữa đúng không ạ?」"
1822 = "「Cảm giác như hoàn toàn bế tắc rồi nhỉ?」"
1824 = "「Đúng như chị nói. Nhưng…… xin mọi người hãy xem tài liệu trên tay.」"
1832 = "「Đường sắt chở khách với đường sắt chở hàng, khác nhau ở chỗ nào vậy?」"
1833 = "「Cường quốc đường sắt chở khách~?」"
1834 = "「Đường sắt chở khách là đường sắt chuyên chở hành khách, còn đường sắt chở hàng là đường sắt chỉ chuyên chở hàng hóa…… à, đúng không ạ?」"
1837 = "「Quảng bá, sao ạ?」"
1841 = "「Biến các mỏ than, mỏ quặng bỏ hoang như Mine Treasure thành điểm du lịch, và cho chạy \\x%l列車;#00ffc040;đoàn tàu%l;#; hỗn hợp kiêm luôn mục đích du lịch trên đó——sao.」"
1843 = "「Chị Paulette. Đúng vậy nhỉ, chị ấy đang rất mệt mỏi nhỉ.」"
1844 = "「Như Reina vừa nói, vẫn còn những tuyến đường chở hàng đang hoạt động, và cũng có rất nhiều dấu tích đường ray bỏ hoang chưa bị đụng đến.」"
1846 = "「Nghĩa là sẽ có \\x%l客車;#00ffc040;toa hành khách%l;#; thong thả dạo quanh các mỏ than, nhà máy, cùng với \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; và hàng hóa đó, Nagi nè.」"
1856 = "「Tuyến đường vòng sầm uất nhất Đế đô. Ở tuyến Yamanote, cứ hai phút lại có một chuyến \\x%l列車;#00ffc040;tàu%l;#; chạy không ngừng nghỉ ạ.」"
1864 = "「Kết quả của sự phổ cập có phần khiên cưỡng đó, như mọi người đã biết. Sự tiện lợi trong đời sống được nâng cao, và GNP cũng tăng trưởng mạnh mẽ.」"
1868 = "「Từ Yatsushiro có tuyến đường sắt Mikan đó ạ. Nhưng chị Paulette, bây giờ chắc chắn không muốn đi đâu ạ.」"
1876 = "「Sao vậy?」"
1878 = "「Cảm ơn mọi người rất nhiều.」"
1880 = "「Reina nghĩ là vậy nha~? Vì đường ray đi đến mỏ than bỏ hoang thì chẳng có ai đi qua cả mà lị~.」"
1881 = "「Mà nói đúng hơn thì, vốn dĩ đường sắt sinh ra là để vận chuyển hàng hóa mà nha~?」"
1882 = "「Chị cũng thấy thoải mái lắm. Ở trong nước, Reina nhẹ hơn bình thường nhiều.」"
1885 = "「Cho tôi tham gia với. Mấy chuyện thế này, tôi có ích lắm đấy nhé?」"
1887 = "「Em sẽ vẽ \\x%lヘッドマーク;#00ffc040;biểu trưng đầu tàu%l;#;! Cả áp phích và tờ rơi nữa!」"
1889 = "「Chúng tôi đang nói về Paulette. Quả nhiên, có vẻ như cô ấy đang khá mệt mỏi.」"
1891 = "「Chỉ một chuyện thôi. Có điều này anh muốn hỏi em.」"
1894 = "「Tôi muốn giải quyết vấn đề chi phí vận chuyển, vốn là rào cản lớn nhất. Mang tiếng là công ty đường sắt mà không thể tự mình vận chuyển thì thật cay đắng.」"
1897 = "「Anh nghĩ vậy. Hoặc cũng có thể thiết lập thêm lựa chọn tham quan nhà máy cho hành khách đi \\x%l列車;#00ffc040;đoàn tàu%l;#; hỗn hợp.」"
1900 = "「Nếu là cựu nhân viên \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; thì tôi có quen biết. Khi nào cần, xin cứ gọi tôi bất cứ lúc nào.」"
1906 = "「Vì trông Thị trưởng Paulette có vẻ quá mệt mỏi, nên em đã chủ động đề nghị 『Hôm nay cứ để tôi』 ạ.」"
1907 = "「Em từng nghe nói, nếu phụ thuộc vào thuốc, thì khi không có thuốc sẽ không thể cố gắng được nữa——đại loại vậy ạ.」"
1909 = "「Do đó, chúng ta vẫn cần một giá trị gia tăng nào đó. Hơn nữa, phải càng mạnh mẽ càng tốt――Ồ. Giới hạn 40, rõ!」"
1910 = "「Vì vậy, đặc biệt là ở các khu vực đại đô thị, cần phải đảm bảo có tuyến đường sắt chở hàng chuyên dụng.」"
1913 = "「Vì thế đường sắt mỏ than, chính là mẹ của mọi loại đường sắt đó nha~」"
1914 = "「Bây giờ, chỉ cần tìm được người mua than đá, thì mọi thứ sẽ diễn ra suôn sẻ thôi nhỉ.」"
1928 = "「Đúng vậy. Những nơi như thế sẽ không được cải tạo lại cho \\x%lエアクラ;#00ffc040;Aircra%l;#; đi, mà cứ bị bỏ hoang như vậy——a.」"
1930 = "「À…… Làm như vậy…… sẽ tạo ra mạng lưới đường sắt sớm hơn và rẻ hơn nhiều so với việc mua lại đất và làm lại đường ray.」"
1934 = "「Đúng vậy. Vì \\x%l列車;#00ffc040;đoàn tàu%l;#; hỗn hợp đó sẽ do \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; kéo, và được thiết kế thành \\x%l列車;#00ffc040;đoàn tàu%l;#; du lịch mà.」"
1936 = "「Đúng vậy nhỉ. Đúng là thế nhỉ.」"
1938 = "「Ừ, rất là khó chịu. Khi mọi thứ phải đình trệ chỉ vì một điểm tắc nghẽn duy nhất.」"
1940 = "「Ừ, thậm chí với Navi, trạng thái không lo lắng gì mới là hiếm thấy đấy.」"
1942 = "「Ừ. Dù đã phân tán bớt gánh nặng―― nhưng những phần quan trọng nhất thì vẫn chỉ có thể trông cậy vào cô ấy.」"
1943 = "「Đúng vậy.」"
1946 = "「Đúng vậy——, ít nhất cũng khiến người ta muốn đi thử một lần. Nếu có khả năng thực hiện thì đây là một ý tưởng cực kỳ thú vị.」"
1947 = "「Đúng vậy, Reina.」"
1948 = "「Vâng ạ~, tất nhiên là cực kỳ thích——」"
1950 = "「Chắc chắn rồi. Thậm chí, điều kiện khoảng cách còn tệ hơn. Chi phí vận chuyển vốn đã là một vấn đề, nay lại càng tăng cao.」"
1952 = "「Đúng vậy nhỉ, đó là cách tốt nhất.」"
1953 = "「Vậy sao?」"
1954 = "「Vậy sao? Tại sao thế?」"
1955 = "「Đúng vậy. Ngoài ra, \\x%l列車;#00ffc040;tàu%l;#; chở hàng chạy trên tuyến chở khách cũng là chuyện thường xuyên xảy ra.」"
1959 = "「Đúng vậy. Trong nước vẫn còn một vài nơi, còn ở nước ngoài thì rất phổ biến. Vì vận chuyển bằng \\x%lエアクラ;#00ffc040;Aircra%l;#; không phải là vạn năng mà.」"
1962 = "「Vâng. Giả sử ngài Soutetsu có toàn quyền quyết định, ngài sẽ làm thế nào để đảm bảo đầu ra cho sản phẩm?」"
1966 = "「Rồi ạ. Vì các bạn đam mê đường sắt bỏ hoang thường đăng lên blog mà.」"
1967 = "「Vâng ạ~. Thế nên hôm nay Reina đã kể cho anh ấy nghe về toa chở quặng Granby đó nha~.」"
1970 = "「Vâng ạ~. Reina muốn nhờ bà chủ nhà tắm Tororyu-yu một chuyện nha~」"
1971 = "「Vâng. Đúng vậy nha~?」"
1974 = "「Vâng ạ~. Reina cũng đã nhờ anh Soutetsu, chị Nagi, và cả những người hay đến Cửa hàng đường sắt nữa đó nha~」"
1975 = "「Vâng ạ~」"
1976 = "「Vâng ạ~, đúng như chị Fukami nói đó nha~」"
1981 = "「Là vậy sao ạ. Vậy thì không nên dùng thuốc nhiều quá nha~.」"
1982 = "「Vậy sao ạ?」"
1983 = "「Vậy sao ạ!? Ở khu mỏ, hễ mệt là mọi người lại đến bác sĩ, nhờ tiêm cho một mũi đó nha.」"
1984 = "「Một đầu máy kéo cả \\x%l貨車;#00ffc040;toa chở hàng%l;#; và \\x%l客車;#00ffc040;toa hành khách%l;#;, gọi là \\x%l列車;#00ffc040;đoàn tàu%l;#; hỗn hợp, ngày xưa cũng từng chạy đó ạ.」"
1991 = "「Nhờ một chuyện? A, lẽ nào, lúc nãy em nói chuyện với bà ấy là vì chuyện đó?」"
1997 = "「Không sao đâu, Reina. Không sao đâu. Cảm giác đó ấy à? Là một sự rung động vô cùng tuyệt vời đó.」"
1998 = "「Không ngờ cô ấy lại phiền não đến mức đó…… Thảo nào Reina lại lo lắng đến vậy.」"
1999 = "「Không ạ~, vì \\x%lグランビー鉱車;#00ffc040;toa chở quặng Granby%l;#; là phương tiện chạy trong hầm mỏ mà. \\x%l軌間;#00ffc040;Khổ đường sắt%l;#; hẹp nên Reina không kéo được đâu ạ.」"
2001 = "「Đúng vậy. Và có lẽ, chính tình huống đó, ngược lại, đang tạo ra một áp lực rất lớn.」"
2002 = "「Đúng là vậy ạ. Sau này, người ta không chỉ vận chuyển hàng hóa, mà còn muốn chở cả người, nên \\x%l客車;#00ffc040;toa hành khách%l;#; mới ra đời.」"
2004 = "「Đúng rồi, rào một cái. A! Nhưng nhớ xối nhè nhẹ thôi, đừng để nước bắn tung tóe nhé?」"
2005 = "「Xối nước, là múc nước nóng xối lên người ạ~?」"
2017 = "「Paulette. Cô có thể dựa theo hướng này để đề xuất và đàm phán được không?」"
2018 = "「Chị Paulette, chỉ cần không luống cuống, thì chuyện gì cũng có thể làm tốt được hết ạ.」"
2019 = "「Chị Paulette lúc nào cũng bảo, khi đi tàu với tư cách hành khách, chị ấy không muốn làm gì khác ngoài việc tận hưởng đâu ạ.」"
2020 = "「Để phổ cập \\x%lエアクラ;#00ffc040;Aircra%l;#; với tốc độ chóng mặt, Hinomoto đã không dang tay cứu trợ các phương tiện giao thông công cộng.」"
2022 = "「Để giúp đỡ chị Paulette đang gặp khó khăn. Anh Soutetsu, chị Hachiroku, xin hãy tham gia cuộc họp nhé ạ.」"
2023 = "「Tại sao lại phải tách riêng chở hàng và chở khách ra?」"
2025 = "「Dù là \\x%lレイルロオド;#00ffc040;Railord%l;#; hay cô em gái không có thực thể của em, đều biết lo lắng cả. Khả năng suy nghĩ tự nhiên sẽ sinh ra sự bận tâm thôi.」"
2029 = "「Và, em muốn nhờ anh Soutetsu tiếp tục bao quát toàn bộ mọi việc, bao gồm cả em nữa——Có được không anh?」"
2030 = "「Thế nên, cuộc họp. Sẽ bắt đầu vào lúc 9 giờ tối ngày mốt nha~. Vì vậy, nếu lúc đó chị Paulette không mệt thì...」"
2033 = "「Reina cũng từng kéo \\x%lグランビー鉱車;#00ffc040;toa chở quặng Granby%l;#; đó sao?」"
2035 = "「Reina cũng vô cùng biết ơn anh Soutetsu đó nha~.」"
2038 = "「Reina đã bảo đi bác sĩ rồi đó ạ~. Nhưng chị Paulette cứ bảo là 『Không sao』.」"
2039 = "「Reina sao ạ?」"
2040 = "「Reina là \\x%lレイルロオド;#00ffc040;Railord%l;#; mà. Mấy chuyện phức tạp như lo lắng, Reina không làm được đâu ạ.」"
2044 = "「Reina không lo lắng gì đâu ạ?」"
2047 = "「Ngoan lắm, Reina. Lại đây nào.」"
2048 = "「Reina nghĩ là hai người được hạnh phúc thì tốt hơn nha~.」"
2049 = "「Trong ba người, cả ba đều được hạnh phúc, Reina nghĩ đó mới là điều tốt nhất nha~.」"
2050 = "「Reina nghĩ là, ngoài việc bán than ra, mọi người nên cùng nhau đóng góp ý tưởng để tìm thêm điểm nhấn nha~」"
2054 = "「Reina, không được chạy đâu đấy?」"
2055 = "「Reina—— Em từng nói hễ có mỏ than là có đường sắt mỏ than đi kèm đúng không?」"
2058 = "「Reina, em thích anh Soutetsu sao?」"
2060 = "「Reina, sao thế? Em đang lo lắng chuyện gì à?」"
2061 = "「Này? Reina.」"
2062 = "「Này? Reina.」"
2065 = "「Tất nhiên rồi. Nếu tôi có thể giúp ích, xin hãy để tôi làm.」"
2066 = "「Đương nhiên là được rồi nha~! Oa, thế này thì chắc chắn sẽ nghĩ ra được ý tưởng hay nha~」"
2067 = "「Công việc của mình, sao.」"
2068 = "「Có vẻ hôm nay chúng ta cũng sẽ về đến Ohimitera an toàn nhỉ.」"
2069 = "「Có vẻ, là vậy. Quả nhiên, nếu không đưa ra được lợi ích cụ thể thì...」"
2073 = "「Màn vào ga rất xuất sắc thưa ngài Soutetsu.」"
2074 = "「Đúng vậy nha~. Ở trong nước, cơ thể cứ bồng bềnh bồng bềnh nha~」"
2083 = "「Đường sắt mỏ than, hiện giờ đang ở tình trạng thế nào?」"
2087 = "「Toàn quyền à, một giả định có vẻ hơi bao quát quá nhỉ——」"
2088 = "「Chị Paulette, dạo này có vẻ hơi thiếu sức sống đó ạ. Thế nên, Reina cứ nghĩ xem mình có thể làm gì cho chị ấy không.」"
2089 = "「À thì? Nagi nè.」"
2090 = "「Nghe có vẻ thú vị nè! Mình muốn đi thử nè!」"
2094 = "「Cuộc đàm phán với nhà máy luyện thép Yahata, có vẻ như đang gặp rất nhiều khó khăn đó ạ.」"
2100 = "「Đến Yatsushiro thì đi xe \\x%lエアクラ;#00ffc040;Aircra%l;#; mất khoảng bốn, năm mươi phút nhỉ? Nếu đi bằng loại bay được của tôi thì còn tiết kiệm thời gian hơn nữa.」"
2104 = "「Bận tâm……nói thế thì có vẻ hơi nói quá, nhưng mà ạ」"
2106 = "「Mà này, mấy người định bán than cho ai thế?」"
2107 = "「Bọn em đã nói rất nhiều chuyện nha~! Anh Soutetsu có vẻ rất hứng thú với đường sắt mỏ than đó ạ.」"
2108 = "「Cảm ơn em nhé. Reina.」"
2109 = "「Cảm ơn anh.」"
2110 = "「Cảm ơn em, Reina.」"
2111 = "「Cảm ơn anh. Anh Soutetsu. Nhờ có anh mà cuối cùng em cũng nhìn thấy được con đường mình cần đi.」"
2112 = "「Em kì lưng cho chị cũng tốt, nhưng chị muốn ngâm mình cho ấm lên một chút. Reina cũng vào tắm chung luôn không? Nhớ xối nước trước nhé?」"
2126 = "「Cái từ mà đền chủ Akai vừa nói, 『Kaiki』——Rốt cuộc nó có nghĩa là gì vậy?」"
2127 = "「Đi cùng với \\x%l列車;#00ffc040;tàu%l;#; chở hàng luôn nè!? \\x%l客車;#00ffc040;Toa hành khách%l;#; như thế, nghe có vẻ thú vị quá nè!!」"
2133 = "「Hachiroku, một \\x%lレイルロオド;#00ffc040;Railord%l;#;, và cả Navi, trợ lý ảo \\x%lエアクラ;#00ffc040;Aircra%l;#; của anh, có thể coi là họ hàng xa của em, cũng biết trăn trở và lo lắng như người bình thường đấy.」"
2151 = "「Chuyện đó——cụ thể là sao nè?」"
2152 = "「Thế này thì khó thật đấy. ……Chỉ khi nào đồng Yên mất giá chưa từng có, 1 đô la Mỹ đổi được hơn 200 Yên thì mới may ra ngang ngửa.」"
2153 = "「Chuyện đó là tùy thuộc vào anh Soutetsu đấy ạ?」"
2154 = "「À thì. Hinomoto đã thúc đẩy sự phổ biến của \\x%lエアクラ;#00ffc040;Aircra%l;#; quá sớm và quá khiên cưỡng.」"
2156 = "「Vậy sao…… Ra là vậy.」"
2157 = "「Vậy sao. Em biết ơn anh ấy về chuyện gì?」"
2158 = "「À——」"
2159 = "「Vậy sao, nếu thế thì」"
2160 = "「Vậy thì, \\x%l8620;#00ffc040;8620%l;#; cũng sẽ kéo \\x%l列車;#00ffc040;đoàn tàu%l;#; hỗn hợp ạ? Bánh xe của em lớn…… nên em không giỏi kéo đồ quá nặng đâu ạ.」"
2165 = "「Vào ga an toàn rồi ạ. Ga Ohimitera. Đúng giờ. 17:00.」"
2166 = "「Cũng có nơi vẫn còn giữ lại đó nha. Nhưng cũng có rất nhiều nơi đã không còn nữa rồi nha~.」"
2167 = "「Có cả loại như vậy sao.」"
2168 = "「Vẫn chưa, đâu――một chút nữa thôi――」"
2174 = "「Chưa chắc đâu.」"
2175 = "「Vậy thì tốt rồi.」"
2177 = "「Đó là vì, Hinomoto từng là một cường quốc về đường sắt chở khách.」"
2179 = "「Vậy thì, ngoài việc khuyên đi bác sĩ ra. Reina nên làm gì cho chị Paulette đây ạ~?」"
2180 = "「Vậy thì phải tìm cách giải quyết trước đã. ……Có lẽ nên tổ chức một cuộc họp, tập hợp mọi người lại để cùng nhau suy nghĩ xem sao.」"
2181 = "「Vậy thì, ở vùng nông thôn như chỗ chúng ta, thì không có tuyến chở hàng chuyên dụng đúng không ạ?」"
2182 = "「Nếu vậy, trước tiên dù chỉ ở cục bộ, không phân biệt chở hàng hay chở khách, hãy kết nối những đường ray còn dùng được lại, và cho chạy \\x%l列車;#00ffc040;đoàn tàu%l;#; hỗn hợp.」"
2184 = "「Vậy thì, Reina sẽ đi nhờ mọi người nha~. Làm thế thì chị Paulette chắc chắn sẽ không để ý lắm đâu ạ~.」"
2190 = "「Về chất lượng than, mọi người nhìn biểu đồ ở trang 4 sẽ dễ hiểu hơn đó nha~.」"
2191 = "「Hủy bỏ giới hạn tốc độ, rõ ạ」"
2192 = "「Giới hạn, 40. Rõ ạ.」"
2193 = "「Chuyện đó, ngoài việc bán ra thì còn cách nào khác sao?」"
2195 = "「Đường sắt chở khách thì số lượng đường ray còn lại chưa tới 20% so với thời kỳ hoàng kim. Nhưng đường sắt chở hàng thì vẫn còn khoảng một phần ba đó nha~」"
2196 = "「Anh Soutetsu đã dạy, đã cho Reina thấy rất nhiều điều tuyệt vời mà Reina chưa từng biết. Thế nên——」"
2197 = "「Ngài Soutetsu có suy nghĩ gì không ạ?」"
2199 = "「!」"
2201 = "「Navi chỉ đang hoàn thành công việc của mình thôi.」"
2381 = "Càng nghĩ, tôi lại càng muốn biết."
2385 = "Vừa dứt lời, những cái gật đầu đã đáp lại. Không chỉ từ một mình Paulette."
2388 = "Khi nghe Reina kể về \\x%l列車;#00ffc040;đoàn tàu%l;#; hỗn hợp, tôi cũng có cảm nghĩ y hệt như vậy——!"
2391 = "Cũng phải thôi. Trong thời buổi này, hoàn cảnh này. Nếu thực sự nghĩ đến việc đi du lịch bằng đường sắt thì……"
2393 = "Việc tốt thì phải làm ngay, tôi định hướng về phía Cửa hàng đường sắt—— Nhưng vừa cất bước, bàn tay Hachiroku đã giữ tôi lại."
2404 = "Hôm nay trước khi bắt đầu công việc, trông cô ấy vẫn chẳng có gì khác lạ—— Chắc là cô ấy đã cố gắng để không cho chúng tôi thấy vẻ phiền não của mình rồi."
2408 = "Nhắc mới nhớ, chính lời gợi ý của Navi đã khơi mào cho mạch câu chuyện này."
2410 = "Thay vì tiếng \\x%lブラスト;#00ffc040;khí thải xi lanh%l;#;, âm thanh bánh xe lướt qua các mối nối đường ray vang lên rõ mồn một."
2417 = "Nhưng trong ánh mắt ấy, lại ánh lên một tia sáng mạnh mẽ chưa từng thấy—— Đó là tình cảm chân thành dành cho Paulette."
2419 = "Nhưng ý tôi không phải vậy. Không chỉ đơn thuần là giới tính nữ——"
2421 = "Paulette vẫn đang cần mẫn và vững vàng tích lũy từng thành quả một."
2423 = "Bây giờ thì cảm giác…… Ừm, tôi đã nắm bắt được rồi."
2428 = "Dù hoàn cảnh khó khăn chẳng có gì thay đổi, nhưng sắc mặt và biểu cảm của cô ấy lại rạng rỡ như một ngày nắng hiếm hoi giữa mùa mưa dầm."
2431 = "Hachiroku buông thõng hai tay xuống, làm ra vẻ mặt u ám, đầy oán hờn."
2432 = "Chiếc kìm soát vé trong tay Hachiroku vang lên tiếng lách cách. Cô ấy thao tác thoăn thoắt với một sự nhiệt tình đến lạ lùng."
2436 = "Hachiroku làm một vẻ mặt rất khó tả. ——Đó là khoản lỗ lũy kế khổng lồ vào thời kỳ cuối của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;."
2438 = "Hachiroku đã trải qua thời chiến. Chắc chắn đó là một hoàn cảnh khắc nghiệt đến tột cùng."
2445 = "Đôi má Nagi nhanh chóng ửng hồng."
2448 = "Từ đây là một đoạn đường thẳng với tầm nhìn rất tốt. Tôi thở phào nhẹ nhõm từ tận đáy lòng."
2450 = "Lúc nãy không muốn cắt ngang mạch câu chuyện, nên tôi đành để đó không hỏi——"
2451 = "Lúc đầu tôi còn bỡ ngỡ, phải nhờ Reina chỉ dẫn \"Ở đây ạ\"――"
2453 = "Reina gia nhập vào hàng ngũ giáo viên, và ưỡn ngực \"E hèm!\" đầy tự hào."
2457 = "Dù ở trong nước, Reina vẫn thích bám dính lấy tôi như thường ngày."
2460 = "Dù vậy, thời điểm thao tác lại khá khác biệt. Bởi vì \\x%lキハ07;#00ffc040;KiHa 07%l;#; nhẹ hơn \\x%l8620;#00ffc040;8620%l;#; rất nhiều."
2462 = "Ra là vậy. Nghĩa là, \"bây giờ không muốn đi\" là vì lý do đó sao."
2464 = "Khuôn mặt ủ rũ của Reina bỗng bừng sáng lên một vẻ đầy tự hào."
2470 = "Nhưng giả thuyết đó ngay lập tức, đã bị một cô bé trạc tuổi Nagi phá vỡ."
2480 = "A…… Ra vậy. Cho đến tận khoảnh khắc này, Reina vẫn chưa hề nhận ra."
2489 = "Bởi vì ngay lúc này, khoảnh khắc này, cuối cùng tôi cũng đã hiểu ra."
2490 = "Bởi vì tôi biết. Tôi biết rằng lựa chọn của mẹ là sai lầm."
2491 = "Vì tôi nghĩ, việc trân trọng hiện tại và tương lai của Reina mới là điều quan trọng nhất. Nhưng mà——"
2492 = "Bởi vì, Reina là Reina. Là Reina bé nhỏ quan trọng của tôi."
2496 = "Mỗi người đều có công việc riêng của mình. Và họ đều hoàn thành nó với sự tự hào."
2498 = "Dường như bị bí từ, em ấy ném ánh mắt cầu cứu về phía Paulette."
2500 = "Cô ấy sẽ cảm thấy áy náy vô cớ với tôi và những người tham gia, có khi lại càng lún sâu vào bế tắc hơn."
2502 = "Em ấy lắc lắc mái tóc xẹp lép của mình—— nhưng cố lắc thật khẽ để nước không bắn ra xung quanh."
2503 = "Sự bối rối chắc hẳn đã hoàn toàn tan biến. Màu xanh trong ánh mắt cô ấy trong trẻo như bầu trời sau cơn bão."
2505 = "Một giọng nói nhẹ bẫng."
2508 = "Em ấy thích thú nhún nhảy lên xuống, làm nước văng tung tóe."
2509 = "Nếu không phải là Reina mà là tôi đi mời, thì chưa chắc họ đã chịu đến dự."
2512 = "Nếu tôi có thể nắm giữ quyền lực lớn hơn hiện tại. Điều đầu tiên cần giải quyết, có lẽ chỉ có một."
2514 = "Nếu tình yêu của Reina thành hiện thực. Thì Reina, anh Soutetsu, và cả tôi."
2516 = "Soát vé xong, Reina lạch bạch chạy tới."
2520 = "Gia đình là điều quan trọng. Nhưng ngoài ra, còn có một điều gì đó quan trọng không kém."
2525 = "Ánh mắt em ấy cũng mơ màng, tan chảy trong hạnh phúc."
2526 = "Tôi có cảm giác như mình đang được gặp gỡ một Reina trong quá khứ mà tôi chưa từng biết."
2529 = "Dù \\x%l逆転機;#00ffc040;cần đảo chiều%l;#; có chuyển thành hộp số, tay gạt \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;#; có chuyển thành tay gạt \\x%lダイコン;#00ffc040;kiểm soát trực tiếp%l;#;, nhưng thao tác với \\x%l自弁;#00ffc040;van hãm tự động%l;#; và \\x%l単弁;#00ffc040;van hãm đơn%l;#; thì \\x%l8620;#00ffc040;8620%l;#; và \\x%lキハ07;#00ffc040;KiHa 07%l;#; gần như giống hệt nhau."
2532 = "Cho dù em ấy có lề mề lúc cởi quần áo đến đâu, cũng không thể nào mất đến hơn mười phút được."
2535 = "Dù chính phủ có đưa ra đề xuất dùng quốc khố để cứu trợ, thì dư luận xã hội có lẽ cũng không cho phép điều đó xảy ra."
2537 = "Em ấy thậm chí còn mời được cả những người như Houshou Kisaki, đền chủ Akai và bà chủ nhà tắm Tororyu-yu tham gia cuộc họp."
2546 = "Đam mê đường sắt bỏ hoang——Có cả những người như vậy sao. Sự sâu sắc của thế giới những người đam mê đường sắt đang mở rộng thế giới của chúng tôi."
2547 = "Giọng nói quen thuộc phát ra từ bộ đàm."
2550 = "Chuyện về mỏ than. Chuyện về công việc trước đây của Reina. Tôi đã cố tình không hỏi đến."
2552 = "Giá như mình cũng thẳng thắn được như đứa trẻ này—— Tôi bất chợt nghĩ như vậy."
2557 = "Tôi tạm thời nuốt sự ngạc nhiên vào trong, tập trung trở lại vào việc thao tác \\x%lブレーキ;#00ffc040;phanh%l;#;."
2559 = "Không được do dự. Không có chút dư địa nào để do dự cả."
2561 = "Nhận thấy ánh mắt của tôi và cái vẫy tay, Reina lập tức chạy lại gần. Tôi ghé sát tai em ấy, hỏi bằng một giọng thật nhỏ."
2563 = "Ba người chúng tôi. Tôi tin rằng chúng tôi có thể cùng nhau——hướng đến tương lai."
2565 = "Khi tôi cuối cùng cũng đưa mắt nhìn sang, thì bắt gặp nụ cười ấm áp của Reina."
2566 = "Tôi ôm chặt lấy Reina. Ôm lấy em ấy, cọ má vào em ấy, và không bao giờ buông ra nữa."
2568 = "Dù tôi có gợi ý, Reina vẫn chỉ lắc đầu yếu ớt."
2569 = "Thú thực, tôi nghĩ mình đã làm mọi chuyện trở nên phức tạp. Nhưng…… thật kỳ lạ là tôi không hề hối hận."
2570 = "Tôi đã để Reina phải làm đến mức này. Tôi thậm chí còn không nhận ra mình đã khiến em ấy lo lắng đến vậy."
2575 = "Ban đầu tôi cứ tưởng em ấy đòi đến đây là do ảnh hưởng từ Hachiroku và anh Soutetsu, nhưng lẽ nào——"
2577 = "Reina và tôi. Đây là lần đầu tiên hai chúng tôi đến nhà tắm Tororyu-yu cùng nhau."
2578 = "Có lẽ từ lúc nào đó, khao khát ấy đã vô tình tạo ra một kiểu trói buộc, rằng \"bản thân là một \\x%lレイルロオド;#00ffc040;Railord%l;#; thì không thể\"."
2580 = "Dường như muốn làm ấm lại bầu không khí có phần chùng xuống, Reina cất giọng đầy sức sống."
2585 = "Nếu là Reina, chắc chắn có thể làm được. Nếu là anh Soutetsu và Reina, chắc chắn, tôi cũng sẽ được hạnh phúc."
2586 = "Vì vậy, trước tiên. Tôi sẽ ủng hộ Reina. Không phải là lùi bước. Cũng không phải là đóng vai nữ chính bi kịch."
2595 = "Vậy thì, Navi chắc chắn đang bay theo hỗ trợ tôi ở phía trên nóc tàu. Sau nhiều lần cùng nhau làm nhiệm vụ, Reina cũng biết rất rõ điều này."
2599 = "Dù đang ở trong \\x%l運転台;#00ffc040;buồng lái%l;#;――hay nói đúng hơn là ở ghế lái, nhưng lại thoải mái chẳng khác gì bên trong \\x%l客車;#00ffc040;toa hành khách%l;#;."
2609 = "Cảnh tượng trên sân ga có vẻ khác mọi khi. Người đang vẫy \\x%l緑旗;#00ffc040;cờ xanh lá%l;#; kia là――"
2611 = "Quả nhiên, mình không hề sai. Nếu Reina cũng mong muốn như vậy, thì mình sẽ rút lui một cách êm đẹp——"
2614 = "Tôi cố kìm nén khoảnh khắc mà kinh nghiệm mách bảo phải hét lên \"Bây giờ!\"――"
2623 = "Chắc hẳn đã đi đến cùng một giả thuyết, đôi mắt xanh ấy nhìn tôi."
2624 = "Nắm lấy bàn tay đang đưa ra, chúng tôi trao nhau một cái bắt tay thật chặt."
2625 = "Paulette cúi đầu thật sâu."
2626 = "Rằng Paulette là người có tính cách luôn tự mình ôm lấy trách nhiệm khi không thể giải quyết được tình huống đó."
2627 = "Paulette lập tức mỉm cười, và thay Reina nói tiếp những lời còn dang dở."
2630 = "Fukami hô \"Dạ\" và giơ tay lên."
2639 = "Giọng nói của Navi phát ra từ bộ đàm."
2641 = "Sau đó, em ấy lạch bạch chạy về phía cổng soát vé để tiến hành soát vé."
2643 = "Chuyện mỏ than và bao nhiêu thứ khác, đã lấp đầy tâm trí tôi đến mức nghẹt thở."
2652 = "Lông mày Reina rũ xuống buồn bã."
2654 = "Dội sạch sành sanh chậu nước nóng lên người, Reina ướt sũng từ đầu đến chân."
2656 = "Reina vẫn luôn là Reina. Là người sẵn sàng bao dung mọi thứ của tôi, và tôi cũng có thể bao dung mọi thứ của em ấy."
2657 = "Reina nhảy xuống sàn, nhanh nhẹn tháo lắp \\x%lタブレット;#00ffc040;thẻ bảng%l;#;."
2659 = "Có lẽ Reina còn hiểu rõ điều đó hơn cả tôi."
2661 = "Bàn tay nhỏ bé của Reina tõm một cái, múc nước nóng trong bồn áp lên má mình."
2662 = "Một âm thanh khẽ lọt ra từ miệng Reina, nghe giống như một tiếng thở dài――"
2667 = "Nụ cười của Reina rạng rỡ đến mức như muốn tan chảy."
2668 = "Một giọng nói dường như chứa đựng chút ý cười. Chỉ còn một chút nữa là đến Ohimitera, \\x%lエアクラ;#00ffc040;Aircra%l;#; đã có thể hoạt động từ lâu rồi."
2670 = "Giọng Reina có chút căng thẳng, hiếm thấy."
2672 = "Bùng nổ. Khuôn mặt Reina lập tức đỏ bừng."
2674 = "Tủm tỉm, tủm tỉm. Hai má Reina ửng hồng khi cười."
2675 = "Em ấy ngượng ngùng. Reina cọ đầu vào người tôi, làm nũng."
2677 = "Vẫn là giọng điệu thong thả như thường ngày."
2681 = "Reina đang mang vẻ mặt của một thiếu nữ. À không, vốn dĩ——\\x%lレイルロオド;#00ffc040;Railord%l;#; cũng là con gái mà."
2695 = "Có vẻ như cô ấy định một mình đảm nhận cả việc đó ――Không, trông có vẻ như cô ấy muốn đảm nhận thì đúng hơn."
2696 = "Không ngờ Reina lại mời cả Navi tham gia cuộc họp qua giọng nói."
2698 = "Khi tôi khép chân duỗi thẳng ra, em ấy liền ngồi gọn lỏn lên đùi tôi như một lẽ đương nhiên."
2701 = "Thật biết ơn."
2706 = "Ngồi cạnh Kisaki đang làm điệu bộ bó tay, ông Minokasa cũng nghiêng đầu với vẻ mặt bối rối."
2707 = "Trưởng ga Kon cứ quấn quýt quanh chân em ấy, chỉ nhìn thôi cũng thấy ấm lòng."
2709 = "Phía bên kia, là những đường ray và sân ga vắng vẻ đìu hiu. Hibiki mím chặt môi lại."
2712 = "Để Reina phải lo lắng đến mức này, tôi chợt cảm thấy áy náy vô cùng."
2717 = "Và thế là, mẹ đã. Chọn điều quan trọng không kém đó, dẫu phải vứt bỏ gia đình."
2719 = "Tôi cũng có một điều quan trọng như vậy. Đó là tình yêu dành cho anh Soutetsu."
2720 = "Nagi gật đầu mạnh trước lời của Paulette. Nhưng cái gật đầu ấy ngay lập tức chuyển thành cái nghiêng đầu thắc mắc."
2721 = "Hachiroku gật đầu mạnh trước từ \"\\x%l改軌;#00ffc040;cải khổ đường ray%l;#;\" mà tôi không hiểu, rồi cũng hướng đôi mắt lấp lánh về phía tôi."
2722 = "Khi tôi hỏi lại, ánh mắt Reina càng thêm lấp lánh niềm vui."
2723 = "Nghe Fukami nói vậy, tôi cũng bất giác gật đầu."
2724 = "Lời nói của Reina khiến tôi phải chấn chỉnh lại tinh thần."
2725 = "Nghe tôi nói vậy, em ấy phát ra âm thanh yếu ớt. Ánh mắt bối rối nhìn tôi và Hachiroku như muốn cầu cứu."
2729 = "Cảm giác làn da cọ xát vào nhau thật dễ chịu. Cơ thể Reina mềm mại, mịn màng như em bé vậy."
2732 = "Nếu tôi cứ tiếp tục ôm ấp thứ tình cảm này, một Reina tốt bụng chắc chắn sẽ tự bóp nghẹt mối tình đầu của mình."
2735 = "Nếu tìm ra câu trả lời trong cuộc họp thì không có vấn đề gì. Nhưng với tinh thần trách nhiệm đó, lỡ như mọi chuyện không suôn sẻ thì……"
2754 = "Nói đến đó, đền chủ Akai nhìn sang Hachiroku. Ngay lập tức, Hachiroku cất giọng đầy tự hào."
2764 = "Đền chủ Akai và Paulette trông như một giáo viên kỳ cựu và một giáo sinh thực tập vậy."
2778 = "Quả nhiên, sự kết hợp của hai người họ thật tuyệt vời. Cả hai đều làm cho nhau tỏa sáng hơn."
2779 = "Như một hiệu lệnh, mọi người tản ra thành từng nhóm nhỏ và bắt đầu hành động."
2780 = "Về điểm đó, tôi rất biết ơn vì gánh nặng thao tác lái tàu đã giảm đi đáng kể. Dù vẫn phải chú ý quan sát phía trước, nhưng tôi không còn phải gồng mình, mà có thể giữ được sự thong dong."
2781 = "Cuối cùng thì tôi cũng nhận ra một điều hiển nhiên như vậy."
2783 = "Qua chuyện vừa rồi tôi mới nhận ra. Có vẻ Reina không rành các quy tắc ở nhà tắm công cộng lắm."
2787 = "Thì tôi đã có thể nói thích anh Soutetsu sớm hơn rất nhiều…… và chắc chắn sẽ không phải ôm những cảm xúc phức tạp như thế này."
2788 = "Nếu vậy, bằng mọi giá tôi phải biến hiệu ứng cộng hưởng sinh ra từ cuộc họp này thành hiện thực."
2792 = "Như bị cuốn theo lời nói đó, ánh mắt Hibiki hướng về phía cửa sổ của Cửa hàng đường sắt."
2794 = "Dù cảm thấy tự trách, nhưng niềm vui trong tôi lại to lớn hơn gấp bội."
2795 = "Dù không nghĩ cô ấy có thể tính toán trước được điều này, nhưng nhìn vào kết quả, thì đó quả thực là một câu hỏi rất hiệu quả."
2796 = "Dù không thể nhìn sang, nhưng tôi chắc chắn biểu cảm của em ấy vẫn rạng rỡ và ấm áp như mọi khi."
2797 = "Đúng như sự tin tưởng của Reina, tuy không đến mức \"chuyện gì cũng được\" nhưng――"
2799 = "Thảo nào lúc nãy Reina vào bồn tắm lại chậm trễ đến lạ thường."
2821 = "（Nhưng mà nói đi cũng phải nói lại…… Reina đã rất cố gắng nhỉ.）"
2824 = "（Ơ, kìa? Thế này là……）"
2825 = "（Cạch）"
2826 = "（Kịch）"
2827 = "（Hửm?）"
2831 = "（Giá như mình cũng hỏi em ấy sớm hơn thì tốt biết mấy.）"
2833 = "（Tùm）"
2834 = "（Chính Reina—— đã xua tan đi đám mây mù trong lòng Paulette.）"
2837 = "（Ra là vậy…… Chắc chắn mẹ đã đầu hàng trước mớ cảm xúc phức tạp này.）"
2838 = "（Hơn nữa, Reina chắc chắn sẽ mang lại hạnh phúc cho anh Soutetsu mỗi ngày.）"
2843 = "（Đó là một sự thật đơn giản đến đau lòng. Mẹ đã không thể vứt bỏ điều đó.）"
2844 = "（Ra vậy…… Đúng thế nhỉ. Chính vì quá khứ vui vẻ và tuyệt vời đó, mà Reina mới trở thành Reina của hiện tại.）"
2845 = "（Dù không biết sẽ dưới hình thức nào. Nhưng tuyệt đối, không ai bị bỏ lại, không ai bị tổn thương.）"

[selections]
