2385 = "Vừa dứt lời, những cái gật đầu đã đáp lại.\\nKhông chỉ từ một mình Paulette."
2388 = "Khi nghe Reina kể về \\x%l列車;#00ffc040;đoàn tàu%l;#; hỗn hợp,\\ntôi cũng có cảm nghĩ y hệt như vậy——!"
2391 = "Cũng phải thôi. Trong thời buổi này, hoàn cảnh này.\\nNếu thực sự nghĩ đến việc đi du lịch bằng đường sắt thì……"
2393 = "Việc tốt thì phải làm ngay, tôi định hướng về phía Cửa hàng đường sắt——\\nNhưng vừa cất bước, bàn tay Hachiroku đã giữ tôi lại."
2404 = "Hôm nay trước khi bắt đầu công việc, trông cô ấy vẫn chẳng có gì khác lạ——\\nChắc là cô ấy đã cố gắng để không cho chúng tôi thấy vẻ phiền não của mình rồi."
2408 = "Nhắc mới nhớ, chính lời gợi ý của Navi\\nđã khơi mào cho mạch câu chuyện này."
2410 = "Thay vì tiếng \\x%lブラスト;#00ffc040;khí thải xi lanh%l;#;, \\nâm thanh bánh xe lướt qua các mối nối đường ray vang lên rõ mồn một."
2417 = "Nhưng trong ánh mắt ấy, lại ánh lên một tia sáng mạnh mẽ chưa từng thấy——\\nĐó là tình cảm chân thành dành cho Paulette."
2419 = "Nhưng ý tôi không phải vậy.\\nKhông chỉ đơn thuần là giới tính nữ——"
2421 = "Paulette vẫn đang cần mẫn và vững vàng\\ntích lũy từng thành quả một."
2423 = "Bây giờ thì cảm giác……\\nỪm, tôi đã nắm bắt được rồi."
2428 = "Dù hoàn cảnh khó khăn chẳng có gì thay đổi, nhưng sắc mặt và biểu cảm của cô ấy\\nlại rạng rỡ như một ngày nắng hiếm hoi giữa mùa mưa dầm."
2431 = "Hachiroku buông thõng hai tay xuống,\\nlàm ra vẻ mặt u ám, đầy oán hờn."
2432 = "Chiếc kìm soát vé trong tay Hachiroku vang lên tiếng lách cách.\\nCô ấy thao tác thoăn thoắt với một sự nhiệt tình đến lạ lùng."
2436 = "Hachiroku làm một vẻ mặt rất khó tả.\\n——Đó là khoản lỗ lũy kế khổng lồ vào thời kỳ cuối của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;."
2438 = "Hachiroku đã trải qua thời chiến.\\nChắc chắn đó là một hoàn cảnh khắc nghiệt đến tột cùng."
2445 = "Đôi má Nagi nhanh chóng ửng hồng."
2448 = "Từ đây là một đoạn đường thẳng với tầm nhìn rất tốt.\\nTôi thở phào nhẹ nhõm từ tận đáy lòng."
2450 = "Lúc nãy không muốn cắt ngang mạch câu chuyện,\\nnên tôi đành để đó không hỏi——"
2451 = "Lúc đầu tôi còn bỡ ngỡ,\\nphải nhờ Reina chỉ dẫn \"Ở đây ạ\"――"
2453 = "Reina gia nhập vào hàng ngũ giáo viên,\\nvà ưỡn ngực \"E hèm!\" đầy tự hào."
2457 = "Dù ở trong nước, Reina vẫn thích\\nbám dính lấy tôi như thường ngày."
2460 = "Dù vậy, thời điểm thao tác lại khá khác biệt.\\nBởi vì \\x%lキハ07;#00ffc040;KiHa 07%l;#; nhẹ hơn \\x%l8620;#00ffc040;8620%l;#; rất nhiều."
2462 = "Ra là vậy.\\nNghĩa là, \"bây giờ không muốn đi\" là vì lý do đó sao."
2464 = "Khuôn mặt ủ rũ của Reina bỗng bừng sáng lên một vẻ đầy tự hào."
2470 = "Nhưng giả thuyết đó ngay lập tức,\\nđã bị một cô bé trạc tuổi Nagi phá vỡ."
2480 = "A…… Ra vậy.\\nCho đến tận khoảnh khắc này, Reina vẫn chưa hề nhận ra."
2489 = "Bởi vì ngay lúc này, khoảnh khắc này,\\ncuối cùng tôi cũng đã hiểu ra."
2490 = "Bởi vì tôi biết.\\nTôi biết rằng lựa chọn của mẹ là sai lầm."
2491 = "Vì tôi nghĩ, việc trân trọng hiện tại và tương lai của Reina\\nmới là điều quan trọng nhất. Nhưng mà——"
2492 = "Bởi vì, Reina là Reina.\\nLà Reina bé nhỏ quan trọng của tôi."
2496 = "Mỗi người đều có công việc riêng của mình.\\nVà họ đều hoàn thành nó với sự tự hào."
2498 = "Dường như bị bí từ,\\nem ấy ném ánh mắt cầu cứu về phía Paulette."
2500 = "Cô ấy sẽ cảm thấy áy náy vô cớ với tôi và những người tham gia,\\ncó khi lại càng lún sâu vào bế tắc hơn."
2502 = "Em ấy lắc lắc mái tóc xẹp lép của mình——\\nnhưng cố lắc thật khẽ để nước không bắn ra xung quanh."
2503 = "Sự bối rối chắc hẳn đã hoàn toàn tan biến.\\nMàu xanh trong ánh mắt cô ấy trong trẻo như bầu trời sau cơn bão."
2505 = "Một giọng nói nhẹ bẫng."
2508 = "Em ấy thích thú nhún nhảy lên xuống, làm nước văng tung tóe."
2509 = "Nếu không phải là Reina mà là tôi đi mời,\\nthì chưa chắc họ đã chịu đến dự."
2512 = "Nếu tôi có thể nắm giữ quyền lực lớn hơn hiện tại.\\nĐiều đầu tiên cần giải quyết, có lẽ chỉ có một."
2514 = "Nếu tình yêu của Reina thành hiện thực.\\nThì Reina, anh Soutetsu, và cả tôi."
2516 = "Soát vé xong, Reina lạch bạch chạy tới."
2520 = "Gia đình là điều quan trọng.\\nNhưng ngoài ra, còn có một điều gì đó quan trọng không kém."
2525 = "Ánh mắt em ấy cũng mơ màng, tan chảy trong hạnh phúc."
2526 = "Tôi có cảm giác như mình đang được gặp gỡ\\nmột Reina trong quá khứ mà tôi chưa từng biết."
2529 = "Dù \\x%l逆転機;#00ffc040;cần đảo chiều%l;#; có chuyển thành hộp số, tay gạt \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;#; có chuyển thành tay gạt \\x%lダイコン;#00ffc040;kiểm soát trực tiếp%l;#;,\\nnhưng thao tác với \\x%l自弁;#00ffc040;van hãm tự động%l;#; và \\x%l単弁;#00ffc040;van hãm đơn%l;#; thì \\x%l8620;#00ffc040;8620%l;#; và \\x%lキハ07;#00ffc040;KiHa 07%l;#; gần như giống hệt nhau."
2532 = "Cho dù em ấy có lề mề lúc cởi quần áo đến đâu,\\ncũng không thể nào mất đến hơn mười phút được."
2535 = "Dù chính phủ có đưa ra đề xuất dùng quốc khố để cứu trợ,\\nthì dư luận xã hội có lẽ cũng không cho phép điều đó xảy ra."
2537 = "Em ấy thậm chí còn mời được cả những người như Houshou Kisaki,\\nđền chủ Akai và bà chủ nhà tắm Tororyu-yu tham gia cuộc họp."
2546 = "Đam mê đường sắt bỏ hoang——Có cả những người như vậy sao.\\nSự sâu sắc của thế giới những người đam mê đường sắt đang mở rộng thế giới của chúng tôi."
2547 = "Giọng nói quen thuộc phát ra từ bộ đàm."
2550 = "Chuyện về mỏ than. Chuyện về công việc trước đây của Reina.\\nTôi đã cố tình không hỏi đến."
2552 = "Giá như mình cũng thẳng thắn được như đứa trẻ này——\\nTôi bất chợt nghĩ như vậy."
2557 = "Tôi tạm thời nuốt sự ngạc nhiên vào trong,\\ntập trung trở lại vào việc thao tác \\x%lブレーキ;#00ffc040;phanh%l;#;."
2559 = "Không được do dự.\\nKhông có chút dư địa nào để do dự cả."
2561 = "Nhận thấy ánh mắt của tôi và cái vẫy tay, Reina lập tức chạy lại gần.\\nTôi ghé sát tai em ấy, hỏi bằng một giọng thật nhỏ."
2563 = "Ba người chúng tôi.\\nTôi tin rằng chúng tôi có thể cùng nhau——hướng đến tương lai."
2565 = "Khi tôi cuối cùng cũng đưa mắt nhìn sang,\\nthì bắt gặp nụ cười ấm áp của Reina."
2566 = "Tôi ôm chặt lấy Reina.\\nÔm lấy em ấy, cọ má vào em ấy, và không bao giờ buông ra nữa."
2568 = "Dù tôi có gợi ý, Reina vẫn chỉ lắc đầu yếu ớt."
2569 = "Thú thực, tôi nghĩ mình đã làm mọi chuyện trở nên phức tạp.\\nNhưng…… thật kỳ lạ là tôi không hề hối hận."
2570 = "Tôi đã để Reina phải làm đến mức này.\\nTôi thậm chí còn không nhận ra mình đã khiến em ấy lo lắng đến vậy."
2575 = "Ban đầu tôi cứ tưởng em ấy đòi đến đây là do\\nảnh hưởng từ Hachiroku và anh Soutetsu, nhưng lẽ nào——"
2577 = "Reina và tôi.\\nĐây là lần đầu tiên hai chúng tôi đến nhà tắm Tororyu-yu cùng nhau."
2578 = "Có lẽ từ lúc nào đó, khao khát ấy đã vô tình tạo ra một kiểu trói buộc,\\nrằng \"bản thân là một \\x%lレイルロオド;#00ffc040;Railord%l;#; thì không thể\"."
2580 = "Dường như muốn làm ấm lại bầu không khí có phần chùng xuống,\\nReina cất giọng đầy sức sống."
2585 = "Nếu là Reina, chắc chắn có thể làm được.\\nNếu là anh Soutetsu và Reina, chắc chắn, tôi cũng sẽ được hạnh phúc."
2586 = "Vì vậy, trước tiên. Tôi sẽ ủng hộ Reina.\\nKhông phải là lùi bước. Cũng không phải là đóng vai nữ chính bi kịch."
2595 = "Vậy thì, Navi chắc chắn đang bay theo hỗ trợ tôi ở phía trên nóc tàu.\\nSau nhiều lần cùng nhau làm nhiệm vụ, Reina cũng biết rất rõ điều này."
2599 = "Dù đang ở trong \\x%l運転台;#00ffc040;buồng lái%l;#;――hay nói đúng hơn là ở ghế lái,\\nnhưng lại thoải mái chẳng khác gì bên trong \\x%l客車;#00ffc040;toa hành khách%l;#;."
2609 = "Cảnh tượng trên sân ga có vẻ khác mọi khi.\\nNgười đang vẫy \\x%l緑旗;#00ffc040;cờ xanh lá%l;#; kia là――"
2611 = "Quả nhiên, mình không hề sai.\\nNếu Reina cũng mong muốn như vậy, thì mình sẽ rút lui một cách êm đẹp——"
2614 = "Tôi cố kìm nén khoảnh khắc mà kinh nghiệm mách bảo phải hét lên \"Bây giờ!\"――"
2623 = "Chắc hẳn đã đi đến cùng một giả thuyết, đôi mắt xanh ấy nhìn tôi."
2624 = "Nắm lấy bàn tay đang đưa ra, chúng tôi trao nhau một cái bắt tay thật chặt."
2625 = "Paulette cúi đầu thật sâu."
2626 = "Rằng Paulette là người có tính cách\\nluôn tự mình ôm lấy trách nhiệm khi không thể giải quyết được tình huống đó."
2627 = "Paulette lập tức mỉm cười,\\nvà thay Reina nói tiếp những lời còn dang dở."
2630 = "Fukami hô \"Dạ\" và giơ tay lên."
2639 = "Giọng nói của Navi phát ra từ bộ đàm."
2641 = "Sau đó, em ấy lạch bạch chạy về phía cổng soát vé\\nđể tiến hành soát vé."
2643 = "Chuyện mỏ than và bao nhiêu thứ khác,\\nđã lấp đầy tâm trí tôi đến mức nghẹt thở."
2652 = "Lông mày Reina rũ xuống buồn bã."
2654 = "Dội sạch sành sanh chậu nước nóng lên người,\\nReina ướt sũng từ đầu đến chân."
2656 = "Reina vẫn luôn là Reina.\\nLà người sẵn sàng bao dung mọi thứ của tôi, và tôi cũng có thể bao dung mọi thứ của em ấy."
2657 = "Reina nhảy xuống sàn,\\nnhanh nhẹn tháo lắp \\x%lタブレット;#00ffc040;thẻ bảng%l;#;."
2659 = "Có lẽ Reina còn hiểu rõ điều đó hơn cả tôi."
2661 = "Bàn tay nhỏ bé của Reina tõm một cái,\\nmúc nước nóng trong bồn áp lên má mình."
2662 = "Một âm thanh khẽ lọt ra từ miệng Reina,\\nnghe giống như một tiếng thở dài――"
2667 = "Nụ cười của Reina rạng rỡ đến mức như muốn tan chảy."
2668 = "Một giọng nói dường như chứa đựng chút ý cười.\\nChỉ còn một chút nữa là đến Ohimitera, \\x%lエアクラ;#00ffc040;Aircra%l;#; đã có thể hoạt động từ lâu rồi."
2670 = "Giọng Reina có chút căng thẳng, hiếm thấy."
2672 = "Bùng nổ.\\nKhuôn mặt Reina lập tức đỏ bừng."
2674 = "Tủm tỉm, tủm tỉm.\\nHai má Reina ửng hồng khi cười."
2675 = "Em ấy ngượng ngùng.\\nReina cọ đầu vào người tôi, làm nũng."
2677 = "Vẫn là giọng điệu\\nthong thả như thường ngày."
2681 = "Reina đang mang vẻ mặt của một thiếu nữ.\\nÀ không, vốn dĩ——\\x%lレイルロオド;#00ffc040;Railord%l;#; cũng là con gái mà."
2695 = "Có vẻ như cô ấy định một mình đảm nhận cả việc đó\\n――Không, trông có vẻ như cô ấy muốn đảm nhận thì đúng hơn."
2696 = "Không ngờ Reina lại mời cả Navi\\ntham gia cuộc họp qua giọng nói."
2698 = "Khi tôi khép chân duỗi thẳng ra,\\nem ấy liền ngồi gọn lỏn lên đùi tôi như một lẽ đương nhiên."
2701 = "Thật biết ơn."
2706 = "Ngồi cạnh Kisaki đang làm điệu bộ bó tay,\\nông Minokasa cũng nghiêng đầu với vẻ mặt bối rối."
2707 = "Trưởng ga Kon cứ quấn quýt quanh chân em ấy,\\nchỉ nhìn thôi cũng thấy ấm lòng."
2709 = "Phía bên kia, là những đường ray và sân ga vắng vẻ đìu hiu.\\nHibiki mím chặt môi lại."
2712 = "Để Reina phải lo lắng đến mức này,\\ntôi chợt cảm thấy áy náy vô cùng."
2717 = "Và thế là, mẹ đã.\\nChọn điều quan trọng không kém đó, dẫu phải vứt bỏ gia đình."
2719 = "Tôi cũng có một điều quan trọng như vậy.\\nĐó là tình yêu dành cho anh Soutetsu."
2720 = "Nagi gật đầu mạnh trước lời của Paulette.\\nNhưng cái gật đầu ấy ngay lập tức chuyển thành cái nghiêng đầu thắc mắc."
2721 = "Hachiroku gật đầu mạnh trước từ \"\\x%l改軌;#00ffc040;cải khổ đường ray%l;#;\" mà tôi không hiểu,\\nrồi cũng hướng đôi mắt lấp lánh về phía tôi."
2722 = "Khi tôi hỏi lại, ánh mắt Reina càng thêm lấp lánh niềm vui."
2723 = "Nghe Fukami nói vậy, tôi cũng bất giác gật đầu."
2724 = "Lời nói của Reina khiến tôi phải chấn chỉnh lại tinh thần."
2725 = "Nghe tôi nói vậy, em ấy phát ra âm thanh yếu ớt.\\nÁnh mắt bối rối nhìn tôi và Hachiroku như muốn cầu cứu."
2729 = "Cảm giác làn da cọ xát vào nhau thật dễ chịu.\\nCơ thể Reina mềm mại, mịn màng như em bé vậy."
2732 = "Nếu tôi cứ tiếp tục ôm ấp thứ tình cảm này,\\nmột Reina tốt bụng chắc chắn sẽ tự bóp nghẹt mối tình đầu của mình."
2735 = "Nếu tìm ra câu trả lời trong cuộc họp thì không có vấn đề gì.\\nNhưng với tinh thần trách nhiệm đó, lỡ như mọi chuyện không suôn sẻ thì……"
2754 = "Nói đến đó, đền chủ Akai nhìn sang Hachiroku.\\nNgay lập tức, Hachiroku cất giọng đầy tự hào."
2764 = "Đền chủ Akai và Paulette\\ntrông như một giáo viên kỳ cựu và một giáo sinh thực tập vậy."
2778 = "Quả nhiên, sự kết hợp của hai người họ thật tuyệt vời.\\nCả hai đều làm cho nhau tỏa sáng hơn."
2779 = "Như một hiệu lệnh,\\nmọi người tản ra thành từng nhóm nhỏ và bắt đầu hành động."
2780 = "Về điểm đó, tôi rất biết ơn vì gánh nặng thao tác lái tàu đã giảm đi đáng kể.\\nDù vẫn phải chú ý quan sát phía trước, nhưng tôi không còn phải gồng mình, mà có thể giữ được sự thong dong."
2781 = "Cuối cùng thì tôi cũng nhận ra\\nmột điều hiển nhiên như vậy."
2783 = "Qua chuyện vừa rồi tôi mới nhận ra.\\nCó vẻ Reina không rành các quy tắc ở nhà tắm công cộng lắm."
2787 = "Thì tôi đã có thể nói thích anh Soutetsu sớm hơn rất nhiều……\\nvà chắc chắn sẽ không phải ôm những cảm xúc phức tạp như thế này."
2788 = "Nếu vậy, bằng mọi giá tôi phải biến\\nhiệu ứng cộng hưởng sinh ra từ cuộc họp này thành hiện thực."
2792 = "Như bị cuốn theo lời nói đó,\\nánh mắt Hibiki hướng về phía cửa sổ của Cửa hàng đường sắt."
2794 = "Dù cảm thấy tự trách,\\nnhưng niềm vui trong tôi lại to lớn hơn gấp bội."
2795 = "Dù không nghĩ cô ấy có thể tính toán trước được điều này,\\nnhưng nhìn vào kết quả, thì đó quả thực là một câu hỏi rất hiệu quả."
2796 = "Dù không thể nhìn sang, nhưng tôi chắc chắn biểu cảm của em ấy\\nvẫn rạng rỡ và ấm áp như mọi khi."
2797 = "Đúng như sự tin tưởng của Reina,\\ntuy không đến mức \"chuyện gì cũng được\" nhưng――"
2799 = "Thảo nào lúc nãy Reina vào bồn tắm\\nlại chậm trễ đến lạ thường."
2821 = "（Nhưng mà nói đi cũng phải nói lại…… Reina đã rất cố gắng nhỉ.）"
2824 = "（Ơ, kìa? Thế này là……）"
2825 = "（Cạch）"
2826 = "（Kịch）"
2827 = "（Hửm?）"
2831 = "（Giá như mình cũng hỏi em ấy sớm hơn thì tốt biết mấy.）"
2833 = "（Tùm）"
2834 = "（Chính Reina——\\nđã xua tan đi đám mây mù trong lòng Paulette.）"
2837 = "（Ra là vậy…… Chắc chắn mẹ đã đầu hàng\\ntrước mớ cảm xúc phức tạp này.）"
2838 = "（Hơn nữa, Reina chắc chắn\\nsẽ mang lại hạnh phúc cho anh Soutetsu mỗi ngày.）"
2843 = "（Đó là một sự thật đơn giản đến đau lòng.\\nMẹ đã không thể vứt bỏ điều đó.）"
2844 = "（Ra vậy…… Đúng thế nhỉ. Chính vì quá khứ vui vẻ và tuyệt vời đó,\\nmà Reina mới trở thành Reina của hiện tại.）"
2845 = "（Dù không biết sẽ dưới hình thức nào.\\nNhưng tuyệt đối, không ai bị bỏ lại, không ai bị tổn thương.）"

