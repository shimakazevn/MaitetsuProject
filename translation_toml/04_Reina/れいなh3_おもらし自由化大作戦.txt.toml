1478 = "Trái tim tôi, khao khát điều đó một cách thành thực."
1480 = "Cảm giác tinh dịch đang sủi bọt sùng sục.\\nDục vọng muốn xuất tinh bùng nổ phình to."
1481 = "Tôi bế Reina lên, và trao một nụ hôn."
1483 = "Tôi cố tình rút hông ra thật mạnh. Nếu ra, tôi muốn ra cùng lúc,\\ntôi muốn cô bé tè dầm cùng lúc với tôi xuất tinh——"
1485 = "Học từ Paulette sao? Tôi định hỏi vậy,\\nnhưng rồi lại nuốt ngược vào trong."
1487 = "Tôi không có ý định hỏi Paulette, hay bất kỳ ai khác.\\nThậm chí tôi còn cảm thấy không cần thiết phải tra cứu tài liệu."
1491 = "Sự cương cứng của tôi, xử lý nốt phần nước tiểu còn sót lại của Reina.\\nÉp toàn bộ những giọt nước còn đọng trong bàng quang ra ngoài."
1492 = "Giọng nói đượm vẻ khổ sở, cùng lúc đó là cảm giác co thắt,\\nquy đầu bị chèn ép chặt cứng."
1494 = "Tôi thử liếm thứ chất lỏng dính trên bắp tay mình.\\nQuả nhiên, không phải vị của nước tiểu."
1495 = "Nói là cử động, nhưng tôi vẫn chưa cử động.\\nReina ngoan ngoãn, lo lắng nhíu mày nhìn tôi."
1497 = "Khoảnh khắc đó, tôi chợt hiểu ra.\\nNói cách khác——nghĩa là chuyện như vậy."
1507 = "Thế nên dù có cố gắng dừng lại,\\nkhoái cảm cũng chẳng hề giảm đi chút nào."
1508 = "Thế nên, tôi hôn.\\nLên mái tóc, lên vành tai, lên cánh mũi, lên đôi môi."
1509 = "Thế nên, như muốn nong rộng bên trong âm đạo,\\ntôi xoay hông, chà xát vào phần trần của vách thịt."
1512 = "Dù đã xuất tinh liên tục như vậy,\\nthế mà tôi, sự cương cứng của tôi, vẫn khao khát Reina."
1514 = "Ngay khoảnh khắc hiểu ra, hông tôi đã tự động cử động.\\nNghe giọng nói khổ sở ấy, tôi nghĩ \"phải dừng lại thôi\" nhưng——"
1520 = "Sâu hơn cả phần đáng lẽ ra là tận cùng.\\nCảm giác bị nuốt chửng vào nơi đó mang đến một nỗi sợ hãi nguyên thủy——"
1524 = "Cảm nhận được sự đàn hồi phía bên kia lớp thịt mềm mại,\\ntôi nhận ra sự mỏng manh và nhỏ bé của âm đạo Reina cùng với khoái cảm."
1526 = "Mỗi lần cọ xát, đôi môi nhỏ nhắn lại lật ra,\\nphần màu hồng bên trong càng thêm đậm sắc, và đang giật giật."
1527 = "Thứ chất lỏng không có vị mặn cũng chẳng có vị chát ấy,\\ncó vẻ mang một chút vị chua nhè nhẹ."
1532 = "Mật dịch trào ra phủ kín toàn bộ quy đầu,\\nchảy dọc theo thân gậy, rồi nhỏ giọt xuống nền gạch."
1533 = "Dù sao thì, việc làm tình của chúng tôi,\\nlà điều hoàn toàn trọn vẹn chỉ giữa hai chúng tôi."
1535 = "Và rồi Reina, há miệng thật to thật to——"
1540 = "Sự chật hẹp của khoang miệng và lực hút tạo ra cảm giác bám chặt,\\ntừ từ, đẩy tinh dịch của tôi dồn lên phía lỗ niệu đạo."
1541 = "Bị một thứ gì đó chật hẹp siết chặt và làm cho run rẩy,\\ncả cơ thể, trái tim, và não bộ đều bị rung lắc dữ dội."
1545 = "Cơ quan sinh dục chưa trưởng thành đầy tham lam của Reina, với sự trơn ướt, rung rinh và săn chắc,\\ntự bản thân nó, cứ ép chặt lấy tôi hết mức có thể."
1546 = "Khao khát quy đầu, sự cương cứng của tôi,\\nReina sốt sắng đong đưa hông."
1547 = "Reina cũng không hề tỏ ra mệt mỏi,\\nlắc lắc cái mông bẽn lẽn đáp lại sự khao khát của tôi."
1550 = "Chuyển động dừng lại.\\nSu hi su hi, hơi thở từ mũi cô bé phả vào quy đầu nhột nhạt."
1552 = "Đứng bật dậy một cách đầy khí thế,\\nReina kéo tay tôi lôi đi xềnh xệch."
1555 = "Reina đang dùng toàn bộ cơ thể nhỏ bé của mình, theo đúng nghĩa đen,\\ncố gắng hết sức để mang lại cho tôi một khoái cảm mãnh liệt."
1556 = "Chiếc lưỡi màu hồng liếm láp ngọ nguậy, làm ướt quanh viền môi."
1558 = "Dù trong bộ dạng khổ sở đến thế, nhưng để tăng thêm khoái cảm cho tôi,\\nReina vẫn thu hẹp cổ họng, liều mạng hít vào rồi thở ra."
1561 = "Từ từ, thật từ từ, Reina cử động đầu,\\nâu yếm sự cương cứng của tôi không chừa một chỗ nào."
1563 = "Nụ cười rạng rỡ, tràn ngập sự an tâm.\\nLàm ấm áp cả trái tim tôi."
1565 = "『Anh có thể cử động』, Reina đang mời gọi tôi."
1569 = "Và rồi Reina dùng lưỡi liếm láp quanh môi,\\nmỉm cười với tôi bằng khuôn mặt ngây thơ vô tội."
1570 = "Chuyển động vuốt ve thân gậy bằng cả hai tay,\\ntừ chậm rãi dần dần tăng tốc độ và lực độ."
1571 = "Hai tay Reina vuốt ve mạnh bạo sự cương cứng của tôi,\\nkéo tuột lớp bao quy đầu xuống tận gốc bụng."
1573 = "Ngay lập tức Reina dừng lại,\\nchỉ dùng ánh mắt ngước lên nhìn tôi, nở một nụ cười tinh nghịch."
1575 = "Âm đạo của Reina, vẫn không ngừng co giật từng nhịp nhỏ.\\nSự cương cứng của tôi, cũng đang cử động trong trạng thái nhạy cảm."
1576 = "Miệng âm đạo nhỏ bé của Reina đã giãn ra hết cỡ.\\nMật dịch liên tục trào ra, sủi bọt sùng sục."
1579 = "Vừa uống cạn tinh dịch của tôi,\\nâm đạo của Reina, vừa run rẩy như đã kiệt sức."
1581 = "Lưỡi của Reina, trườn bò khắp khoang miệng tôi.\\nTôi cứ để mặc cho cô bé làm theo ý muốn——"
1585 = "Như thể bị sét đánh trúng,\\nReina giật mình nảy người lên một cái rõ mạnh."
1586 = "Cùng lúc với cơ thể Reina run rẩy,\\nâm đạo cũng run rẩy siết chặt lấy tôi."
1587 = "Tận cùng sâu thẳm của Reina không ngừng mút lấy, khao khát tinh dịch."
1589 = "Ngay trước đũng quần tôi, Reina đang ngồi chễm chệ.\\nHay đúng hơn là, tôi đang bị bắt đứng trước mặt Reina."
1590 = "Khuôn mặt đỏ bừng, Reina vặn vẹo cơ thể."
1593 = "Màu bạc——khoảnh khắc đó, tôi chợt nghĩ.\\nNó hợp thành một cặp với dòng nước tiểu màu vàng lúc nãy."
1595 = "Đến cả âm đạo, Reina cũng thật ngoan ngoãn."
1596 = "Khi tôi gấp một con thỏ bằng khăn tắm, Reina vui sướng đưa tay ra đón lấy.\\nNếu không gọi đây là cực lạc, thì còn gọi là gì được nữa chứ."
1598 = "Cô bé nói một cách thản nhiên,\\nvừa giật giật đôi tai của con thỏ khăn tắm."
1600 = "Reina, nũng nịu cọ cọ vào tôi.\\nBằng cánh mũi, bằng trán, bằng môi, bằng nhũ hoa, bằng bụng, bằng đùi."
1602 = "Trong vòng tay tôi, cơ thể Reina,\\nmềm mại đàn hồi, nhẹ nhàng và vô cùng dễ chịu."
1614 = "Lần lên đỉnh thứ hai có lẽ đã đến rất gần, nhưng vì quá sung sướng,\\ntôi muốn tiếp tục tận hưởng khoái cảm hiện tại càng lâu càng tốt."
1621 = "Tinh dịch từ bên trong ép lên lỗ niệu đạo.\\nTôi muốn nhanh chóng giải phóng cho Reina, không muốn nghe giọng nói khổ sở ấy nữa!"
1623 = "Khi nụ hôn kết thúc, lần này Reina,\\nlại rúc vào ngực tôi làm nũng."
1626 = "Bà ấy bảo dạo này thức khuya hơi mệt,\\nnên nếu chúng tôi xả nước và dọn dẹp bồn tắm, thì có thể tự do sử dụng đến sáng hôm sau."
1627 = "Nghe cô bé nói vậy, tôi mới nhận ra.\\nSự cương cứng của tôi, cũng trở nên cứng hơn mức bình thường."
1629 = "Âm đạo của Reina, vẫn siết chặt một cách mãnh liệt,\\nnhư muốn vắt kiệt tinh dịch của tôi."
1631 = "Mỗi lần đào sâu vào lớp thịt mềm mại dính sát ướt đẫm ấy,\\nlại có cảm giác như đang lật tung, khoét sâu vào trong."
1633 = "Nó bị nuốt chửng vào tận sâu hơn nữa, qua cả vòm họng của Reina!"
1639 = "Được tấm thảm lưỡi dẫn đường,\\nsự cương cứng của tôi cứ thế, bị hút tuột vào trong miệng Reina."
1651 = "Khung cảnh này quả thực vô cùng tuyệt vời,\\nnhưng tôi vẫn chưa hiểu chuyện gì đang xảy ra."
1652 = "Sự kiên cường ấy, sự đáng yêu ấy, khiến chuyển động hông của tôi càng lúc càng nhanh."
1653 = "Lúc này, không nên nhắc đến tên của người phụ nữ khác.\\nĐiều quan trọng nhất là, Reina đã vì tôi mà đi học hỏi."
1654 = "Sự mâu thuẫn ấy càng làm bùng lên thú tính.\\nCơ thể tôi không ngừng gào thét rằng tôi là giống đực, thế nhưng——lúc này tôi phải kìm nén."
1655 = "Đến cả tiếng cười, cũng biến thành âm thanh như bị bóp nghẹt.\\nĐến cả tiếng cười, cũng hóa thành khoái cảm mãnh liệt vắt kiệt quy đầu."
1661 = "Âm đạo nhỏ bé run rẩy liên hồi,\\nvừa siết chặt một cách hung bạo, vừa ngọt ngào bám chặt lấy tôi."
1667 = "Phần đỉnh quy đầu và cửa âm đạo,\\nkhao khát lẫn nhau, dính chặt lấy nhau, và trao nhau nụ hôn."
1668 = "Và rồi phần rãnh quy đầu lộ rõ ra,\\nđược chiếc lưỡi ngắn ngủn của cô bé liếm láp một cách đầy nỗ lực."
1669 = "——Rút ra khỏi cổ họng, trở lại khoang miệng, nhưng quy đầu vẫn được bao bọc,\\ntinh dịch tiếp tục trào ra, không sót một giọt nào, đều bị Reina nuốt chửng."
1718 = "（Làm tình và——tè dầm và——tôi và——Reina）"
1720 = "（Phụt——rột——phập——nugo——）"
1721 = "（Nhópppppppp! Phậpppppp!!）"
1722 = "（Nhóp——nhép——phập!）"
1723 = "（Nhóp! Nhép! Phập! Phập!）"
1724 = "（Phụt! Phập! Rột! Rột!）"
1725 = "（Phậpppppp!!!）"
1726 = "（Cái rột!）"
1727 = "（Nhóp nhép）"
1728 = "（Phụt——phụt——phụt——phụt——）"
1729 = "（Phụt! Phụt! Phụt!! Phụt!）"
1730 = "（Phụt! Phụt! Phụt! Phụt!）"
1735 = "（Bạch! Bạch! Bạch! Bạch!）"
1738 = "（Rộtttttttttttttttttttttttttttttttttttttttt!!!）"
1739 = "（Cọ cọ）"
1740 = "（Àooooooooooooooo!）"
1741 = "（Àooooooooooooooo）"
1742 = "（Ào!）"
1743 = "（Ào）"
1744 = "（Phụt!）"
1745 = "（Phụt!）"
1747 = "（Phậpppppppppppp!!!!）"
1748 = "（Phậpppppp!）"
1749 = "（Chạm nhẹ）"
1751 = "（Reina đang——mình……\\ndùng cổ họng——\"nuốt\" lấy sự cương cứng của mình sao）"
1752 = "（Siết chặt! Siết chặt! Siết chặtttttt!）"
1753 = "（Siết chặtttttt!）"
1754 = "（Siết chặttttttt）"
1758 = "（Liếm）"
1760 = "（Cái gì——chuyện gì thế này——）"

