1334 = "「!?」"
1335 = "「~~~~~っっっ」"
1337 = "「~~~~~~~~!!!」"
1437 = "Trò chơi nào cũng có thể thử, nhưng nếu không hợp thì dừng lại ngay.\\nĐó có lẽ là một điểm cực kỳ quan trọng."
1446 = "Nhưng sự bức bối này thật sự không thể chịu đựng nổi.\\nTôi muốn nhanh chóng được xuất tinh bằng dương vật——bằng dương vật——"
1447 = "Mặc dù tôi đã bảo đợi đã,\\nnhưng Reina vẫn lấy một lượng lớn gel ra tay."
1449 = "Nhũ hoa mà đã thế này. Nếu là âm vật thì sẽ ra sao đây——\\nNgay khoảnh khắc ý nghĩ đó xẹt qua, tay tôi đã tự động làm thử."
1450 = "Âm thanh ướt át, nhầy nhụa hoàn toàn không chỉ do nước bọt của Reina tạo ra.\\nNói cách khác, tôi bị buộc phải hiểu rằng đó là dịch ruột của chính mình."
1455 = "Dù tốc độ xuất tinh đã giảm, nhưng độ đặc vẫn không hề suy giảm.\\nGiống như thạch tokoroten nóng hổi đang được vắt ra vậy."
1456 = "Ra, là vậy. Tôi đã hiểu được logic của Reina.\\n“Chậm rãi và cẩn thận” thì không thể làm được nếu không dùng tay thuận——nếu vậy thì"
1462 = "Tinh dịch bị ép lại ngày càng đặc sệt,\\nbị ép đẩy lên tận lỗ sáo, mang đến một sự kích thích tột độ."
1464 = "Có lẽ do gel đã hòa tan vào dâm thủy, nên cảm giác ma sát càng trở nên mạnh mẽ hơn.\\nLực siết chặt cứng ngắc khiến tôi càng cảm nhận Reina rõ rệt hơn."
1466 = "Trái ngược với sự vụng về của tay trái,\\nbàn tay phải đang tấn công lỗ hậu lại ngày càng trở nên điêu luyện hơn."
1474 = "「Phu a——a——háng——khe——của Reina,\\nkhe hở——ưm——khe hở cũng——hột le, cũng——」"
1475 = "っ!"
1481 = "Cổ họng tôi hơi rát, nhưng mức độ này thì vẫn chịu đựng được.\\nQuan trọng hơn cả chuyện đó——"
1485 = "Nhũ hoa thoa đầy lotion bị ép bẹp vào vòm ngực tôi,\\nchỉ truyền sang một cảm giác yêu thương dễ chịu đến vô ngần."
1488 = "Trong lúc tôi đang suy nghĩ, sắc mặt Reina ngày càng sầm lại."
1490 = "Có thể di chuyển được. Dù đây hoàn toàn không phải là tư thế dễ vận động.\\nLực siết chặt hung bạo của âm đạo hẹp hòi của Reina vẫn y nguyên như vậy"
1500 = "Bôi trơn quá có khi lại mất sướng——\\nTôi định nói vậy, nhưng rồi lại nuốt ngay vào trong."
1503 = "Độ dính và độ trơn của gel khiến dương vật càng thêm nhạy cảm.\\nHoặc cũng có thể đây là dư âm từ việc lỗ hậu bị kích thích lúc nãy."
1536 = "May thay, ở nơi vừa tầm với tay, có một chiếc——"
1538 = "Tôi vội vàng cố gắng kìm nén, nhưng cổ họng lại tự động rên rỉ.\\nNgón tay của Reina từ từ tăng dần biên độ ra vào."
1546 = "Vừa xuất tinh, tôi vừa không ngừng đùa giỡn nhũ hoa Reina.\\nÂm đạo hẹp hòi phản ứng lại bằng cách co bóp, vắt kiệt toàn bộ tinh dịch trong niệu đạo của tôi."
1548 = "Để nhanh chóng làm sạch miệng Reina, tôi chỉ còn cách này.\\nQuấn lấy lưỡi em ấy, liên tục truyền nước bọt sang."
1550 = "Tôi muốn bảo em ấy đợi đã, nhưng giọng nói như chực nghẹn lại nên không thể thốt nên lời.\\nReina vừa vuốt ve lỗ hậu, vừa đưa bàn tay trái còn trống về phía trước."
1552 = "Cảm giác này, đúng là ngực rồi. Đầu ngón tay và cả tôi đều đồng ý như vậy.\\nVì là khoái cảm hiếm khi được nếm trải, nên tôi cứ thế trêu đùa ngực và nhũ hoa em ấy."
1553 = "Đầu ngón tay định khẽ véo lấy nhũ hoa thì lại bị lớp gel làm trơn tuột.\\nCó vẻ Reina thấy rất sướng, eo em ấy bắt đầu ngọ nguậy."
1556 = "Khi tôi cọ xát dương vật đẫm gel dọc theo khe háng,\\ngiọng Reina trong chốc lát đã biến thành tiếng kêu của một con thú cái."
1557 = "Khoảnh khắc bàn tay trượt từ ngực xuống háng và chạm vào viên ngọc nhỏ,\\nReina lên đỉnh."
1563 = "Tôi đã hiểu. Và nhớ lại lời mình vừa nói lúc nãy.\\nBất kể trò chơi kỳ quái nào, ít nhất cũng phải thử một lần"
1564 = "Tôi thở phào nhẹ nhõm. Hai tay ôm chặt lấy, nắm lấy nó.\\nNếu vậy, nếu cứ thế này mà sục thật mạnh thì"
1566 = "Tôi kéo Reina vào lòng và trao em một nụ hôn."
1569 = "Có nhiều điều muốn nói, nhưng tôi lại không thể sắp xếp thành lời.\\nKhoái cảm râm ran khiến suy nghĩ của tôi trở nên hỗn loạn."
1570 = "Không thể phủ nhận, làm sao mà phủ nhận được chứ.\\nChỉ một khoảnh khắc vuốt ve thân dương vật, rồi túm lấy quy đầu rồi lại buông ra thôi mà"
1572 = "Tôi không hề nhận ra. Reina đang dùng tay bao lấy quy đầu,\\nvà hứng lấy toàn bộ tinh dịch——!?"
1574 = "Gần như nhấc bổng Reina lên rồi thả xuống.\\nCứ thế đẩy nhanh tốc độ, tăng mạnh lực đâm"
1576 = "Có lẽ do nôn nóng trước những chuyển động nhấp nhô nhỏ và sự vuốt ve nhũ hoa,\\nmà Reina phát ra âm thanh nghe như tiếng khóc. Nếu vậy thì"
1578 = "Lỗ hậu của tôi đang bị Reina điều khiển.\\nNước bọt của Reina đang dạy cho lỗ hậu của tôi cách tạo ra âm thanh."
1580 = "Mặt tôi nóng bừng lên. Không phải vì khoái cảm, mà vì sự nhục nhã.\\nLà một thằng đàn ông, việc thừa nhận điều này quả thực là..."
1582 = "Thật là một lời cầu xin thảm hại. Thực sự rất đáng xấu hổ và thảm hại.\\nNhưng——còn đỡ hơn nhiều so với việc xuất tinh bằng lỗ hậu."
1584 = "Tôi có thể cảm nhận được, và cũng hiểu được. Có lẽ……\\n……nhờ Paulette. Chúng tôi đã cùng nhau chia sẻ một nhận thức mới."
1586 = "Khoái cảm khiến đầu óc trắng xóa. Thật đặc. Tinh dịch đặc và nặng.\\nNhững khối đặc sệt chen lấn qua lỗ sáo, nong rộng nó ra."
1587 = "Dù tôi cố gắng bóp mạnh, nhưng độ trơn của gel lại khiến nó trượt đi mất.\\nCảm giác đó cũng thật mới mẻ, mang lại sự thích thú và dễ chịu cho những ngón tay."
1589 = "Khi gọi tên em ấy——\\nMột khi đã gọi tên, thì ngay lập tức sẽ biến thành lời cầu xin."
1590 = "Tôi đổi chuyển động hông thành kiểu mài xát, và đùa giỡn nhũ hoa em ấy một lúc.\\nMồ hôi túa ra cũng trở thành chất bôi trơn, hòa tan tôi và Reina vào nhau."
1593 = "Đột nhiên, ngón tay rút ra khỏi lỗ hậu.\\nVà rồi, bàn tay phải nhẹ nhàng chạm vào dương vật."
1600 = "Khoảnh khắc tôi hôn em ấy, một mùi lạ xộc thẳng lên mũi,\\nvị đắng và chát tràn ngập khoang miệng——nhưng——"
1604 = "Thế là ngay lập tức, tôi bò bằng bốn chân và quay lưng lại.\\nHai ngón tay——dù Reina có định làm gì đi nữa, tôi cũng sẽ chấp nhận một lần."
1607 = "Tiếng hân hoan thốt ra từ cổ họng tôi, nghe sao mà xa xăm đến thế."
1609 = "Gel đang dần dần hòa tan vào mật ngọt của Reina.\\nCửa mình nhỏ nhắn của em ấy đang không ngừng co bóp."
1611 = "Tiếng cởi nút áo lách cách vang lên.\\nReina hoàn toàn ở phía sau tôi. Nhưng——"
1612 = "Mỗi lần bị chà xát, tôi lại có cảm giác tinh dịch bên trong bìu đang bị ép lại.\\nSự dồn nén, kích thích và ép buộc xuất tinh còn mạnh hơn cả khoái cảm."
1617 = "Rốt cuộc Paulette đã tiêm nhiễm thứ gì vào đầu Reina vậy chứ.\\nÝ chí tấn công lỗ hậu quá mãnh liệt thế này, tôi biết phải làm sao đây."
1618 = "Dòng nước nhỏ rỉ ra nhanh chóng vẽ thành một vòm cung màu vàng."
1621 = "Bên trong lỗ hậu, ngón tay Reina cong lại như một cái móc.\\nTôi giật mình trước tiếng kêu lạc đi vì bị ép phát ra của chính mình."
1623 = "Tí, tách, hai giọt, rồi thêm một giọt nữa. Rơi xuống tấm ga trải giường chống thấm vải bông xù\\nmà chúng tôi luôn lót mỗi khi làm tình."
1628 = "Có lẽ trong vô thức, những ngón tay của Reina bắt đầu tự vuốt ve cơ thể mình.\\nEm ấy xoa đều lớp gel còn sót lại trên da, trát lên đó khoái cảm và sự quyến rũ."
1634 = "Reina cũng vậy. Em ấy mềm nhũn, rũ rượi.\\nNên tôi dịu dàng ôm lấy và đỡ em ấy."
1638 = "Hơi thở của Reina nông và gấp gáp, làn da nóng bừng lên.\\nTín hiệu cho thấy em ấy sắp lên đỉnh, tôi cũng buông bỏ sự kìm nén bấy lâu!"
1640 = "Bằng một tiếng thì thầm, Reina rót thuốc kích dục vào tai tôi.\\nGiọng nói ngọt ngào, mềm nhũn thấm từ màng nhĩ vào tận não."
1641 = "Trong chăn, Reina càng áp sát vào tôi hơn.\\nCơ thể nhỏ bé dán chặt vào tôi không một kẽ hở."
1644 = "Reina ngoan ngoãn kích thích tôi. Nhưng như thế vẫn chưa đủ.\\nThứ mà tôi đang khao khát hơn bất cứ điều gì lúc này là——"
1645 = "Em ấy đang cố gắng hết sức để sục cho tôi.\\nNhưng có lẽ vì không phải tay thuận, nên động tác vô cùng vụng về và gượng gạo."
1647 = "Rất nhẹ nhàng, toàn bộ lòng bàn tay em ấy vuốt ve thân dương vật.\\nTrong lúc đó, Reina vẫn ngoan cố tiếp tục trêu đùa lỗ hậu của tôi."
1649 = "Có lẽ em ấy đang cố nhịn cười.\\nCảm giác như lưỡi của Reina đang dừng lại và phồng lên bên trong tôi."
1652 = "Sự chật hẹp của Reina, gần lối vào. Nơi sần sùi của Reina.\\nTôi vừa ấn ép, chà xát nơi đó, vừa như muốn khoét sâu vào tận cùng bên trong!"
1654 = "Ngón tay ướt át của Reina chậm rãi vuốt ve lỗ hậu của tôi.\\nDương vật dù chưa hề bị chạm tới đã giật giật, thở dốc một cách khó coi."
1656 = "Hai ngón tay.\\nReina thoa đều gel lên đó, rồi nhìn tôi với vẻ thích thú."
1657 = "Giống như rót đẫm mật ong lên chiếc bánh pancake bơ nóng hổi.\\nGiọng nói của Reina thậm chí còn pha lẫn chút ngây thơ."
1659 = "Trong miệng Reina, tinh dịch vẫn còn dính chặt,\\nmùi ngai ngái nồng nặc bốc lên."
1661 = "Ngón tay cong lại như chiếc chìa khóa của Reina, chà xát bên trong tôi——\\nngay tại điểm giữa hậu môn và gốc dương vật."
1662 = "Giọng nói mang vẻ thắc mắc, nhưng đôi tay lại tràn đầy sự tự tin.\\nChậm rãi, cẩn thận, không vội vã tích tụ khoái cảm."
1665 = "Chắc Reina cũng không còn sức lực nào nữa. Động tác của em ấy vô cùng chậm chạp.\\nVừa run rẩy nửa thân dưới vừa vươn người ra——hửm?"
1666 = "Lời nài nỉ của Reina.\\nTôi cố gắng kiềm chế cơ thể đang muốn đáp ứng ngay lập tức."
1669 = "Giọng nói mềm nhũn, lời nói đứt quãng. Nhưng tôi vẫn hiểu được ý em ấy."
1670 = "Reina mỉm cười nhìn tôi.\\nÁnh mắt em ấy dần dần hướng về phía dương vật của tôi——và nhìn xa hơn thế nữa."
1673 = "Những ngón tay ngắn đáng yêu của Reina đẫm đầy nước bọt.\\nGiống như chất bôi trơn vậy——"
1674 = "Vào khoảnh khắc em ấy thở phào nhẹ nhõm, tôi khẽ ấn nhẹ vào bụng dưới của em ấy."
1676 = "Reina cũng tự mình uốn éo phối hợp.\\nHoàn toàn đọc được chuyển động của tôi và đáp lại."
1677 = "Ngực Reina rất phẳng. Nhưng độ dính vừa phải của gel——"
1679 = "Reina mơ màng lau đi vệt nước bọt quanh miệng,\\nrồi ngước nhìn tôi với vẻ mặt ngạc nhiên."
1684 = "Sự thấu hiểu nhường chỗ cho niềm hân hoan, niềm hân hoan nhường chỗ cho dục vọng hoang dã.\\nTăng tốc. Cả dục vọng, cả chuyển động, cả mọi thứ."
1689 = "Em ấy nói một điều thật lạ."
1694 = "Bầu không khí và nhiệt độ thay đổi hoàn toàn——\\nMột nụ cười mang theo sự ẩm ướt và ướt át."
1702 = "Nếu xuất tinh thì phải xuất ở nơi sâu nhất, giờ tôi chỉ nghĩ được đến thế.\\nVừa dồn toàn lực nghiền nát nơi sần sùi yếu ớt của Reina"
1704 = "Giọng nói nũng nịu. Giọng nói vòi vĩnh.\\nDương vật vốn đã cứng ngắc của tôi lại càng nảy lên."
1705 = "Lớp gel đã khéo léo làm chệch đi áp lực đau đớn từ thành âm đạo.\\nTôi đang tự do tự tại tận hưởng cái lỗ âm đạo nhỏ bé này!"
1710 = "Mỗi lần da thịt va chạm, mỗi lần dâm thủy bắn ra từ nơi giao hợp,\\nlực siết chặt của âm đạo Reina lại càng trở nên hung bạo hơn."
1718 = "Không thể giảm nhịp độ hông được. Vì đó là mong muốn của Reina.\\nThay vì hôn để phân tán sự chú ý, tôi vùi mũi vào mái tóc Reina."
1726 = "Con sên khẽ rung lên một cách đáng yêu,\\nsự rung động đó làm rung chuyển cả tinh hoàn và tinh dịch bên trong của tôi."
1729 = "Sự kích thích bị dồn nén bấy lâu cuối cùng cũng đến!\\nReina đang dùng hai lòng bàn tay nhỏ nhắn đáng yêu để sục cho tôi!"
1734 = "Điều cô ấy nói cũng có lý.\\nNhưng mà——"
1735 = "Vừa nói, tôi vừa bế Reina đang trần truồng lên đùi.\\nLấy một lượng lớn gel cạo râu vừa mới mua ra tay."
1742 = "Tư thế này. Ánh mắt của Reina. Chất bôi trơn.\\nChẳng lẽ nào——"
1743 = "Lần này lại là nụ cười ngây thơ như mọi khi. Nụ cười của Reina.\\nThế nhưng, tôi vẫn cảm nhận được một sức quyến rũ đến rùng mình."
1746 = "Nông hơn đốt ngón tay đầu tiên rất nhiều——có lẽ chỉ bằng một nửa móng tay.\\nChỉ đưa vào chừng đó thôi mà cả cơ thể tôi như bốc hỏa."
1747 = "Ngay từ trước khi thoa lên, nhũ hoa của Reina đã cương cứng và nhô cao.\\nLấy đó làm tâm, tôi vẽ những vòng tròn——"
1748 = "Tuy có chút kháng cự, nhưng sự tò mò lại lớn hơn rất nhiều.\\nKhi tôi làm theo lời em ấy, tấm chăn liền trượt tuột xuống."
1753 = "Khi nụ hôn kết thúc, mồ hôi túa ra đầm đìa.\\nTỉ lệ nghịch với lượng mồ hôi tuôn ra, sức lực trong cơ thể tôi như bị rút cạn."
1754 = "Xuất tinh. Đang tuôn ra. Tinh dịch đặc sệt,\\nbám chặt và thấm đẫm vào bên trong đường hầm âm đạo chật hẹp của Reina."
1756 = "Một hơi nóng ướt át dính chặt lấy,\\nnhư thể một con sên ngọt ngào và dịu dàng đang xâm nhập vào đường ruột."
