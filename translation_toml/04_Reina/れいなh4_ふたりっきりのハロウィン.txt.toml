3257 = "（Phụt phụt! Phụt! Phụt! Phụt!)"
3258 = "（Phụt! Phụt! Phụt! Phụt!）"
3260 = "（A……ra là vậy. Lý do mà thói quen này\\nđược hình thành giữa Paulette và Reina là……）"
3262 = "（Phập! Phập! Phập! Rầm!!）"
3263 = "（Rầm! Phập! Phập! Phập!!）"
3266 = "（Chụt——chọc——chọc chọc——chọc chọc!）"
3267 = "（Chụt——liếm——liếm——chụt）"
3268 = "（Chụt）"
3269 = "（Puy——puy——choro——chooooooo）"
