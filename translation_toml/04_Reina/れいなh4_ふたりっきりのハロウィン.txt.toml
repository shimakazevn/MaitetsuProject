2131 = "「Họ đã cảm ơn đến mức khiến chúng ta thấy ngại luôn mà.\\nCúi đầu hết lần này, đến lần khác」"
2133 = "「Lạ nhỉ. Lấy hộp sơ cứu, rốt cuộc để làm gì cơ chứ?」"
2134 = "「Ha——mãnh, liệt——quá——fu——n-a——\\nbụng, của——Rei, na——đang, quặn, lại」"
2136 = "「Anh hiểu rồi.」"
2137 = "「Một cô dâu đáng yêu làm sao!\\nAnh đúng là một kẻ hạnh phúc nhất trần đời!」"
2140 = "「Vâng ạ~. Vậy thì, cần giỏ, tai và đuôi sói,\\nđĩa, nĩa, dao và tương cà nhỉ~」"
2141 = "「Được thôi.」"
2143 = "「Giờ thì. Cả hai đều đã ấm áp nhờ nụ cười rồi,\\nchúng ta quay lại chủ đề chính nào. Halloween.」"
2145 = "「Ướt nhẹp, rồi, núm vú cũng, sưng lên——cho nên,\\nReina——ngực của Reina, sắp bị nhìn thấy hết rồi」"
2146 = "「Vâng ạ!」"
2147 = "「Vâng ạ~! Nếu là Master, thì tuyệt đối tuyệt đối,\\nsẽ tìm thấy bé này thôi ạ~!」"
2150 = "「Vâng ạ~! Vậy thì, trạm dừng đầu tiên,\\nlà ga ngân hàng Kumagin nhỉ. 『Xuất pháaaaat, tiến lênggggg!』」"
2152 = "「Tuyệt lắm. Thực sự rất tuyệt vời.\\nReina, nếu được thì một lần nữa đi.」"
2153 = "「Vâng ạ~, Reina hiểu rồi ạ~!」"
2155 = "「Ma! Quả nhiên, hóa trang thì……\\nUuuu, nhưng mà, Reina thấy tiếc lắm ạ~」"
2156 = "「Bằng không ạ~」"
2160 = "「Bí quá thì cứ trùm một tấm ga trải giường trắng toát lên người,\\nrồi làm ma là được mà.」"
2161 = "「——Thực tế cứ mặc thử xem sao, rồi hẵng nghĩ tiếp nhỉ.」"
2162 = "「Em đã kể chuyện Rail Shop là một tòa lâu đài.\\nVà giới thiệu ngân hàng giống như một thánh đường đó ạ~」"
2165 = "「Chỗ, đó——của Reina——chỗ đó, nữa đi」"
2166 = "「Đúng vậy ạ~, là thú bông Cô bé quàng khăn đỏ ạ~」"
2167 = "「Có vẻ như nó đang mang lại hiệu quả đấy.\\nNhững khách du lịch với hình thức chưa từng có từ trước đến nay đang tìm đến đây.」"
2170 = "「Chỗ, đó——của Reina——chỗ, cửa vào——\\nưm——dương, vật——của——anh, Soutetsu」"
2172 = "「Chỗ, đó——như tan, chảy——bám chặt, lấy\\n——fua——cọ——cọ xát——cùng, nhau」"
2174 = "「Cả chỗ đó, cả núm vú, cả hai——a!?\\nKhông phải, không phải cả hai, là tất cả ạ~!!」"
2175 = "「Món đồ ma quái của Cô bé quàng khăn đỏ……\\nƯm, nĩa và dao dính đầy máu chẳng hạn ạ~?」"
2176 = "「Cô bé quàng khăn đỏ ơi, Cô bé quàng khăn đỏ.\\nMaster của em, là người như thế nào vậy ạ~?」"
2179 = "「Railord và Master, và cả thú bông nữa,\\nchắc chắn là giống nhau đó ạ~」"
2182 = "「Chuyện là thế này ạ~……hóa trang, cho lễ Halloween」"
2183 = "「Cho dù có nhận ra là đã làm rơi trên tàu,\\nthì sớm nhất cũng phải đến ga Mine Treasure mới dừng lại được.」"
2185 = "「Lỗ đít——wa! Đúng rồi nhỉ~.\\nLỗ đít, cũng là chỗ bị đồ bơi che khuất ạ~」"
2188 = "「Ngầu á?」"
2194 = "「Tuyệt vời. Thực sự rất đáng yêu.」"
2196 = "「Hình thức chưa từng có……là, hình thức như thế nào ạ~?」"
2199 = "「Sao vậy? Tự nhiên lại」"
2200 = "「Sao em lại nói với cái giọng vô tư thế hả.」"
2202 = "「Chầm chậm——chỗ, đó——bị, đào bới\\n——fua——a——chỗ——thắt, lại」"
2205 = "「Em hiểu rồi ạ~! Nếu vậy, có thêm tai\\nhay đuôi của sói nữa thì tốt quá nhỉ~」"
2207 = "「Anh cũng vậy. Thế nên, khoảnh khắc này,\\nchúng ta hãy càng thêm trân trọng khoảng thời gian được ở bên nhau nhé.」"
2209 = "「Anh cũng suy đoán như vậy. Chắc là để kịp giờ tàu chạy,\\nngười đó đã chạy vội, làm rơi mà không nhận ra và cứ thế lên tàu.」"
2210 = "「Anh cũng, rất yêu Reina.」"
2215 = "「Rằng khoảng thời gian bên nhau——rồi sẽ có lúc kết thúc sao.」"
2216 = "「Chúng ta đã kết hôn rồi mà. Anh và Reina.\\nNên là, anh sẽ vui hơn nếu em gọi bằng một danh xưng phù hợp hơn đấy.」"
2217 = "「Được gặp nhau thế này, được ở bên nhau.\\nChỉ bấy nhiêu thôi, đối với anh đã là hạnh phúc hơn bất cứ điều gì rồi.」"
2219 = "「——Anh chỉ đang nghĩ về sự tuyệt vời của việc thời gian chất chồng lên nhau thôi.\\nAnh cũng muốn được như Reina và Paulette vậy.」"
2220 = "「Ngoạm♪」"
2221 = "「Vinh hạnh cho anh.」"
2223 = "「Anh cũng mong là vậy.\\nReina, em thấy thế có được không?」"
2224 = "「Giỏ ở đây là cái loại dùng để đựng đồ lặt vặt cơ.\\nCó mà, cái giỏ hay dùng khi đi dã ngoại ấy.」"
2226 = "「Anh đã nhờ Kisaki, nếu có ai hỏi thăm về con thú bông,\\nthì hãy gọi vào điện thoại di động của Reina.」"
2229 = "「Vẫn——chưa——cùng nhau——\\nCho nên——chịu đựng——chút đi——」"
2231 = "「Nên là, anh phải gọi Reina là 『Mình·ơi』\\nthì mới được chứ ạ~」"
2233 = "「Thế nên, nếu cứ phiền não về ngày mai chưa biết trước,\\nmà làm cho đôi má này xị xuống thì phí lắm đấy.」"
2235 = "「Thế nên, chúng ta mới có thể gặp nhau đấy.\\nVì Reina đã luôn, không ngừng nỗ lực mà.」"
2237 = "「K-Không phải vì giọng đáng yêu đâu,\\nmà là vì em làm mọi người giật mình thôi ạ~」"
2241 = "「Tàu quay đầu, rốt cuộc cũng là chuyến tàu\\nđã đi đến tận Yui.」"
2244 = "「Tiếc sao?」"
2245 = "「Tiếc?」"
2247 = "「Không sao đâu, Reina.\\nSự tình có lẽ, vô cùng đơn giản và rõ ràng.」"
2250 = "「Khách du lịch ạ~」"
2253 = "「Nếu vậy thì bọn mình, đi tìm Master của bé này\\ncũng không sao nhỉ.」"
2257 = "「Dù đã chụp ảnh kỷ niệm chung con thú bông và ngân hàng,\\nnhưng lại không nhận ra ngay là mình đã làm rơi con thú bông.」"
2262 = "「Vâng ạ~. Việc phát hành file .pdf trên internet,\\ncũng có số lượt tải về khủng lắm, chị Paulette đã nói vậy ạ~」"
2263 = "「Đúng vậy nhỉ. Cứ buồn bã vì những chuyện chưa biết,\\nmà làm cho hiện tại đang hiện hữu phải u sầu thì phí lắm ạ~!」"
2265 = "「Vâng ạ~. Reina. Những chỗ bị đồ bơi che đi,\\nđược dạy là không được cho ai xem mà~」"
2266 = "「Đúng vậy nhỉ. Reina, đã kết hôn rồi nên……\\nlà vợ, là bà xã của anh Soutetsu nhỉ.」"
2268 = "「Vâng ạ~」"
2270 = "「Thật sự là tốt quá rồi ạ~. Giúp được em bé đi lạc,\\nanh Soutetsu lại còn rất ngầu nữa. Lại còn mua được đồ!」"
2271 = "「Đúng vậy nhỉ. Nếu nhận ra, thì chắc chắn sẽ quay lại\\ntìm ngay lập tức nhỉ.」"
2274 = "「Đúng vậy ạ~, lúc vào cửa hàng,\\nReina, giật mình nên lỡ hét lên luôn á~」"
2276 = "「Đúng vậy nhỉ. Một khi đã biết đến hơi ấm này rồi——\\nthì việc phải trở lại một mình, thật sự, rất đáng sợ.」"
2277 = "「Đúng vậy nhỉ. So với cửa hàng âu phục thì chắc ở đó sẽ có\\nnhiều đồ náo nhiệt hợp với Halloween hơn nhỉ.」"
2279 = "「Đúng vậy. Do đó hậu môn cũng là nơi——\\nKhông được cho ai xem ngoài người mình yêu, tức là anh.」"
2282 = "「Vâng, đúng vậy ạ~. Reina, trở thành vợ của\\nanh Soutetsu, được ở bên anh cả sáng lẫn tối」"
2283 = "「Ừ.」"
2286 = "「À thì đúng là vậy, nhưng vì là cửa hàng quần áo jeans,\\nnên anh nghĩ chắc sẽ có nhiều quần áo dành cho giới trẻ.」"
2288 = "「Ừ. Em nói là năm nay sẽ tổ chức Halloween đúng không.」"
2289 = "「Đúng vậy nhỉ, phía anh cũng thấy, cảm giác sờ khác mọi khi nên mới mẻ lắm.」"
2291 = "「Anh muốn nhìn. Núm vú đáng yêu của Reina.」"
2294 = "「Đúng vậy. Hơn nữa, anh nghe nói đây cũng là nơi có thể làm tình.\\nQuan hệ tình dục qua lỗ đít, hình như gọi là quan hệ cửa sau.」"
2295 = "「Đúng vậy ạ~, là Halloween đó ạ~」"
2296 = "「Vậy sao.」"
2297 = "「Vậy sao. Nếu thế, hãy ăn sạch anh đi.」"
2299 = "「Khá đáng sợ đấy. Nhưng, Paulette có khi ngất xỉu mất.\\nLễ hội mà, làm quá lố cũng không hay.」"
2301 = "「Là người rất thiếch rất thích kính màu ghép ạ~?」"
2302 = "「Em học từ chị Fukami đó nha~? Khi cosplay\\nthì phải dán băng cá nhân để che những chỗ quan trọng lại.」"
2305 = "「Vâng ạ~. Lúc nào gặp nguy hiểm,\\nem cũng làm thế với chị Paulette đó ạ~」"
2306 = "「Vâng! Vâng ạ~. Reina cũng, ngực,\\nnúm vú——muốn anh Soutetsu, nhìn thấy nha~」"
2309 = "「Càng thêm……trân trọng?」"
2310 = "「Giả thuyết thuyết phục hơn——là gì vậy ạ~?」"
2313 = "「Có ạ~. Anh hãy vuốt ve em đi ạ」"
2316 = "「Có chứ. Ở trong cái kệ đằng kia kìa.」"
2320 = "「Thế nên, Kisaki đã suy luận giúp anh, rằng chủ nhân của con thú bông,\\ncó lẽ cũng đang đi tham quan các địa điểm được giới thiệu trong chuyên mục.」"
2322 = "「Thuốc nổ? Là mìn dynamite ấy hả!!\\nNguy hiểm thì không sai, nhưng cảm giác Halloween thì bằng không đấy.」"
2325 = "「Mỗi lần phát hành số lượng in đều tăng lên đáng kể,\\nchuyện này Reina cũng biết đúng không?」"
2326 = "「Ví dụ, như là. 『Mình ơi』 chẳng hạn.」"
2327 = "「Em không trả lời được sao. Nhưng không sao đâu!\\nAnh Soutetsu, chắc chắn sẽ đưa em về nhà đó ạ~」"
2328 = "「Chính nó. Trong cái giỏ đó, nếu bỏ thêm thứ gì đó nguy hiểm\\nvào, anh nghĩ sẽ tăng thêm cảm giác Halloween.」"
2329 = "「Đúng vậy nhỉ.」"
2335 = "「Chị Paulette tuyệt lắm đó nha~!\\nCứ cần mẫn từng chút từng chút một, tuyệt lắm luôn ạ~!」"
2336 = "「Từ \"dừng lại\" mà Paulette nói,\\nkhông phải là ngừng hoạt động, mà là nghỉ lại qua đêm đấy.」"
2338 = "「Thuốc nổ chẳng hạn ạ~?」"
2348 = "「Xong rồi thì, anh ngồi xuống đó,\\nvà ôm Reina vào lòng đi ạ~」"
2349 = "「Và, vấn đề là. Nơi này được giới thiệu trong Bản tin Ohitoyoshi\\nchỉ duy nhất một lần, trong chuyên mục 『Từ cửa sổ toa xe 07』 thôi.」"
2350 = "「Nên là Reina, sẽ bị hỏa táng, rồi biến thành ma.\\nNhưng——nhưng mà, quả nhiên linh kiện thì nên để lại cho các chị em」"
2351 = "「Rồi Reina, mặc quần lót vào thấy ngứa ngáy quá,\\ncho nên, em đã không mặc quần lót đó.」"
2353 = "「Ở gần Mine Treasure điện thoại di động cũng không có sóng\\nnữa……Reina, chắc chắn là vậy rồi! Em nghĩ vậy đó ạ~」"
2355 = "「Master đó, đã chụp ảnh kỷ niệm ở đây, sau đó\\nlập tức di chuyển, và làm rơi con thú bông.」"
2356 = "「H-Hậu môn của Reina, cả chỗ đó——của Reina,\\ncả ngực nữa, tất cả, chỉ dành cho——anh Soutetsu thôi.」"
2359 = "「Reina, muốn ở bên anh.\\nMuốn ở bên anh mãi mãi cơ ạ~」"
2361 = "「Reina——muốn anh Soutetsu,\\nlàm mạnh——mạnh bạo hơn nữa cơ~」"
2363 = "「Reina. Không phải gọi như vậy chứ.」"
2364 = "「Reina」"
2366 = "「Reina cũng vậy đó ạ~! Hạnh phúc nhất từ trước đến nay,\\nấm áp lắm. Thế nên, em không muốn phải cô đơn nữa đâu」"
2367 = "「Reina, đi tìm thử nha~」"
2370 = "「Reina, rất là vui luôn đó nha~.\\nHãy nhìn ngắm Reina thật nhiều thật nhiều nha~」"
2371 = "「Vui lắm ạ~. Reina, muốn anh Soutetsu,\\nlàm cho tất cả đều sướng lên nha~」"
2372 = "「Reina đã cố cầm bé quàng khăn đỏ sao cho thật nổi bật rồi.\\nNhưng mà hầu như chẳng có ai đi ngang qua, nên không tìm thấy ạ~」"
2374 = "「Reina lấy về rồi đây ạ~! Cái này có đúng không ạ~?」"
2377 = "「Reina, là cô bé quàng khăn đỏ mạnh mẽ mà~.\\nCả sói cũng, ăn thịt luôn đó nha~」"
2380 = "「Reina, trông thế nào ạ~? Với bộ dạng này, Halloween,\\nmọi người có sợ hãi mà cho em kẹo không ạ~?」"
2381 = "「Reina, nhìn thế này thôi chứ cũng cũ rồi,\\nlại còn là Railord vẫn luôn làm việc liên tục không ngừng nghỉ nữa」"
2382 = "「Reina!?」"
2384 = "「Reina!? Sao vậy, em không sao chứ!?」"
2385 = "「Reina, để em phải đợi rồi——ưm?」"
2386 = "「Reina. Tuyệt vời lắm. Rất hợp với em.\\nĐáng yêu quá. Anh chỉ muốn biến em thành cô dâu của anh ngay lập tức thôi.」"
2389 = "「Chỗ đó của Reina——sâu nhất——\\ntử cung——hãy đâm mạnh vào đi ạ~!」"
2391 = "「Bằng dương, vật——của——anh, Soutetsu——\\nđến tận——chỗ——chạm vào, sâu nhất——ưm」"
2393 = "「Dùng Navi——à không, khoan đã,\\nnhớ không lầm thì, trong tờ rơi kẹp báo sáng nay」"
2394 = "「Không cần em phải nhờ đâu.」"
2395 = "「Tất nhiên rồi. Không cần phải hỏi. Anh muốn độc chiếm\\ntoàn bộ Reina, và chỉ mình anh được nhìn ngắm thật kỹ.」"
2396 = "「Tất nhiên rồi. Anh muốn em làm ngay.」"
2397 = "「Vâng ạ~, Reina không phiền đâu ạ~!」"
2403 = "「Rất là, đáng yêu. Tất cả đều nhỏ xíu, dễ thương lắm.」"
2405 = "「Tội nghiệp quá, đỏ ửng hết lên rồi này.」"
2408 = "「Dam dam dam.\\nDribble dribble——cut in——shoot!」"
2412 = "「Đúng là vậy nhỉ.\\nCơ thể em đã cho anh biết điều đó rồi.」"
2415 = "「Đợi chút đã Reina. Quần lót đâu rồi.\\nKhông lẽ nào, em quên mặc à?」"
2417 = "「Từ từ đã, ai, đốt cái gì cơ?」"
2421 = "「Giỏ ạ~?」"
2422 = "「Bên trong giỏ, có đĩa dính máu, thịt,\\nvà cả patê gan nữa thì đáng sợ lắm nhỉ~」"
2424 = "「Chỉ phần đỉnh to thôi——thì sao nào?」"
2426 = "「Tinh dịch——nóng hổi——trong bụng, Reina——\\ntrong bụng——trong tử cung——nhiều quá! Nhiều quá」"
2433 = "「Tai và đuôi thì chắc phải tìm sau thôi.\\nChén dĩa thì ở trong bếp, còn cái giỏ thì hình như ở trong phòng này.」"
2434 = "「Nghe nói người đó không hề giao dịch qua ATM hay tài khoản gì cả.\\nNói cách khác, người đó chỉ đơn thuần là 『đến ngân hàng để chụp ảnh kỷ niệm』 thôi.」"
2436 = "「Được, hôn——ưm——dương, vật,\\nđến——khao, khát——nữa——đang tới, rồi」"
2437 = "「Quan hệ cửa sau……quan hệ tình dục qua lỗ đít.\\nVậy thì, lỗ đít gọi là hậu môn nhỉ~」"
2440 = "「Ng-Ngực——núm, vú——Reina,\\nnó sưng lên——to ra——rồi, ạ~」"
2442 = "「Đã tự kiểm tra xong rồi ạ~.\\nKhông có chỗ nào kỳ lạ hết nha~」"
2445 = "「Vốn dĩ là lễ hội xua đuổi tà ma,\\nnên những món đồ gợi nhớ đến tà ma, ma quỷ sẽ phù hợp hơn.」"
2446 = "「Halloween sao.」"
2447 = "「Dù nói là Cosplay, nhưng Cosplay dịp Halloween\\nlà nghiêng về phe ma quỷ cơ. Ác quỷ này, phù thủy này, bí ngô này.」"
2451 = "「Fua——không được——chỗ, đó——vẫn chưa, được.\\nCùng nhau——với anh, Soutetsu——cùng, nhau」"
2452 = "「Fua——lưỡi——lưỡi, sướng lắm ạ~——\\nưm——chỗ đó——tất cả——hãy liếm láp đi ạ」"
2453 = "「Fua——a——Reina——tè dầm, mất——ưm,\\ntrực, tiếp——vào miệng——anh, Soutetsu」"
2454 = "「Fuaa——ngực——núm vú——vuốt, vuốt——\\nxoa——xoa——ưm! Sướng, quá, ạ~」"
2455 = "「Fuya——fua——anh Soutetsu」"
2456 = "「Fuaa」"
2457 = "「Fua……a……a……ya——ưm——\\nchỗ đó——tinh dịch——đang tràn——ra ngoài」"
2458 = "「Fuaaaaa——Reina, vào miệng——\\nanh Soutetsu——nkyu!? Fuaa——an!!」"
2459 = "「Fua! A! Sướng, quá——sướng, quá.\\nƯm——a——ha——a——fua——a」"
2460 = "「Mình sẽ đi mua sắm, ở đâu vậy ạ~」"
2465 = "「Tê rần rần——là cách nói ẩn dụ sao?\\nHay là, thực sự bị như vậy?」"
2466 = "「Nói anh nghe xem? Reina. Ngực của Reina,\\nđã trở nên như thế nào rồi?」"
2467 = "「Mặc nhiều lớp hay không thì, anh không muốn ai khác ngoài anh,\\nnhìn thấy quần lót của Reina, huống hồ là cái mông.」"
2468 = "「Đúng là vậy. Nhưng, đối với Reina, anh của ngày hôm nay,\\nkhông chỉ đơn thuần là Migita Soutetsu đúng không?」"
2469 = "「Ngày mai sẽ ra sao, chẳng ai biết trước được.\\nReina, và cả anh nữa, về điểm đó thì hoàn toàn giống nhau.」"
2470 = "「Chà, ai biết được nhỉ?」"
2500 = "「Đi lạc……là, búp bê——à không, thú bông à?」"
2501 = "「Ý hay đấy. Nó đó, cứ theo hướng đó đi.\\nCô bé quàng khăn đỏ ma quỷ đã nấu chín con sói.」"
2502 = "「Cái đó thì——」"
2503 = "「Lời dạy đúng đắn đấy. Nhưng mà.」"
2504 = "「Thế là đúng rồi còn gì. Reina là,\\nvợ, là bà xã, là hiền thê của anh mà.」"
2505 = "「Đó sẽ là phương án cuối cùng.\\nHiếm khi chúng ta có thời gian rảnh rỗi thế này mà.」"
2506 = "「Vậy sao.」"
2507 = "「Ra vậy, người có kinh nghiệm à.\\nHèn chi động tác lại điêu luyện thế——không phải.」"
2508 = "「Toàn bộ chỗ đó, là ở trạng thái này cơ?」"
2509 = "「Điều đó khiến em vui và hạnh phúc lắm, em cứ nghĩ giá mà nó kéo dài mãi mãi\\n——rồi sau đó, em lại bất giác nghĩ ngợi ạ~」"
2510 = "「Có thể chạm vào toàn bộ cơ thể Reina.\\nCó thể làm cho toàn bộ Reina cảm thấy sung sướng.」"
2511 = "「Chỗ này, vẫn đang phơi bày ra hết đây này?」"
2512 = "「Nghĩ như vậy,\\nthì có lẽ cho họ biết thông tin liên lạc cũng tốt.」"
2517 = "「Có tìm thấy bình an vô sự hay không thì anh hoàn toàn không biết.\\nNhưng, có vẻ như xác suất sẽ cao hơn là tìm kiếm mù quáng.」"
2518 = "「Với lại, anh Soutetsu.」"
2520 = "「Nếu vậy thì, ở đây có hộp sơ cứu không ạ~?」"
2524 = "「Ưm, hóa trang,\\ncũng giống như cosplay đúng không ạ~」"
2525 = "「Cái đó, cái đó, cái đó——Tại vì, fuwawa.\\nCái đó, cái từ đó——」"
2526 = "「Nè? Anh Soutetsu.\\nReina, lại tự kiểm tra, có được không ạ~」"
2528 = "「Bé đó, và cả Master của bé đó nữa,\\nđều rất rất là vui mừng nhỉ.」"
2529 = "「Vậy là tốt rồi.」"
2532 = "「Vậy thì càng an tâm hơn nữa nhỉ.\\nThế, bọn mình, bắt đầu tìm từ đâu đây ạ~?」"
2533 = "「Vậy, bắt đầu nhé~.\\nHít vàooooooooo. Thở raaaaaa」"
2535 = "「Vậy thì, chúng ta hãy đợi ở ga Ohimitera Onsen xem sao.\\nNếu ở cửa soát vé cùng với con thú bông đó」"
2537 = "「Nếu là mong muốn của Reina thì anh sẽ đáp ứng.\\nTrước tiên, là chuẩn bị cho việc đó đã.」"
2538 = "「Nếu được như vậy thì, đó là niềm vinh hạnh của anh.」"
2541 = "「Cái từ đó, tại vì,\\nlà cách vợ gọi chồng mà ạ~」"
2542 = "「Cả hai ta, hãy cùng sung sướng hơn nữa nào.\\nĐể làm được điều đó——ưm!」"
2545 = "「Tất cả là nhờ anh Soutetsu,\\nđã vuốt ve em đó ạ~」"
2547 = "「Cái loại dùng để đi dã ngoại chắc chắn bị vứt ở đâu đó\\n……A, trong đó hình như cũng có cả đĩa và chén dĩa luôn rồi.」"
2551 = "「Bên trong ngân hàng cũng không có ai báo mất đồ cả.\\nNhưng mà, anh nghe được một thông tin có vẻ rất khả quan đấy.」"
2552 = "「Rail Shop cũng vậy, ban đầu chẳng có aaaaai đến cả.\\nThế mà bây giờ lại nhộn nhịp thế nàaaaay, lại còn có cả lễ hội mới nữa!」"
2556 = "「Núm vú cũng được nhưng——」"
2557 = "「Anh Soutetsu thì, nên hóa trang thành cái gì ngầu ngầu ấy ạ~.\\nMa cà rồng này, hay là người sói chẳng hạn.」"
2558 = "「Quả nhiên, anh Soutetsu giỏi quá đi mất!\\nĐã tìm ra Master của bé này rồi」"
2559 = "「Anh Soutetsu, anh đi đâu vậy ạ~?」"
2560 = "「Anh Soutetsu, là muốn.\\nĐộc chiếm ngắm nhìn mông của Reina đúng không ạ~?」"
2561 = "「Anh Soutetsu ấy,\\nlà chồng của Reina mà ạ~」"
2562 = "「Anh Soutetsu, hãy cùng với Reina,\\nhít vàoooo, thở raaaa đi ạ~」"
2563 = "「Anh Soutetsu, anh Soutetsu.」"
2564 = "「Anh Soutetsu? Anh sao vậy ạ~?」"
2566 = "「Nếu là chỗ nổi bật, thì là ngực.\\nReina? Em tự nhìn xem.」"
2567 = "「Vì là cosplay nên em không mặc quần lót đâu nha~?」"
2569 = "「Cosplay! Nếu là Cosplay thì Reina biết đó ạ~.\\nReina từng nghe chị Fukami kể rồi ạ~」"
2776 = "Ngày Halloween, có chỉ thị là ngoài giờ làm việc, tất cả mọi người\\nđều phải hóa trang, nhưng mà——"
2778 = "Không được. Mải mê suy nghĩ nên tay tôi dừng lại mất rồi."
2780 = "Không, hay là, cứ để cô bé mặc cả hai bộ trang phục luân phiên nhau\\nthì có khi lại hay hơn."
2781 = "Chưa kịp mong ước đã được đáp ứng.\\nNhưng đồng thời cũng bị từ chối luôn."
2788 = "Từ đó về sau, là Paulette, chim sẻ và cáo, dầu diesel,\\nHachiroku, cầu sắt, Rail Shop, ngân hàng, và——」"
2790 = "Chẳng có độ phồng nào đủ để gọi là ngực cả.\\nNhưng vẫn có một sự mềm mại thoang thoảng."
2795 = "Nhưng nếu Paulette là người chủ động làm việc này,\\nthì chắc chắn nó phải có một ý nghĩa thiết thực nào đó."
2796 = "Nhưng——"
2797 = "Nhưng——không ngờ đến cả Ohimitera,\\nmà nó lại lan truyền nhanh đến vậy."
2808 = "Dù dính chặt lấy nhau như thế này, nhưng Reina không còn đỏ mặt như lúc nãy nữa."
2810 = "Ra là vậy.\\nMặc dù Railord như Reina chắc không cần hít thở sâu làm gì……"
2818 = "Nhưng, chỉ riêng hôm nay, nó lại có chút gì đó chưa đủ."
2819 = "Cứ để tự nhiên, khi thời gian làm vợ chồng chất chồng lên nhau,\\nrồi sẽ có một ngày chúng tôi tìm được hình thái phù hợp với mình thôi."
2821 = "Trong lúc đọc thì cảm thấy vô cùng nhẹ nhàng thư thái,\\nnhưng đọc xong thì ngoài ấn tượng hạnh phúc ra, chẳng đọng lại gì cả."
2830 = "À, chỉ cần có thế,\\nReina đã trở nên ấm áp đến nhường này."
2831 = "Chắc là ngoài sức tưởng tượng lắm,\\nReina đang xấu hổ bỗng bật cười khúc khích."
2834 = "Thì ra cô bé đã sợ hãi đến mức đó sao——vừa thấy thương,\\nvừa thấy đáng yêu, tôi siết chặt vòng tay ôm cô bé hơn nữa."
2836 = "Hai tiếng \"Mình ơi\" và \"Mình à\", đối với Reina,\\nchắc hẳn là một sự giao tiếp mà cô bé đã khao khát từ rất lâu rồi."
2839 = "Có lẽ không muốn cho con thú bông nghe thấy,\\ncô bé khẽ dùng hai tay bịt tai con thú bông lại."
2841 = "Phía trên khuôn mặt ngã nhào theo đà——\\nNụ cười của Reina, và cả vùng kín, đang nở rộ."
2842 = "Cô bé đã bắt đầu tự kiểm tra rồi——\\nCảm nhận được điều đó, bàn tay tôi lại càng trở nên dịu dàng hơn."
2844 = "Nếu như tôi bị lạc mất Reina,\\nvà Reina không thể tự mình di chuyển được——"
2846 = "Dù có chọn ma cà rồng đi chăng nữa,\\nthì sự đáng yêu của Reina cũng chẳng thể nào bị lu mờ được."
2848 = "Đối với người đã giúp đỡ Reina, đương nhiên tôi cũng sẽ,\\ncúi đầu và nói lời cảm ơn nhiều đến nhường nào cũng không đủ."
2849 = "Nếu Reina đã bị loại khỏi biên chế vận hành,\\nthì có lẽ chúng tôi đã chẳng thể gặp nhau."
2851 = "Nếu Michiko không đẩy tôi ra,\\nthì có lẽ tôi cũng chẳng có mặt ở đây."
2858 = "Cửa tử cung. Vách thịt dày, nhưng lại đang chào đón tôi.\\nVì khao khát tinh trùng, toàn bộ lối vào đang mút chặt lấy."
2861 = "Reina lúc ngượng ngùng vô cùng đáng yêu.\\nKhuôn mặt đó, cứ như là cô bé quàng khăn đỏ tự nhiên vậy."
2865 = "『Vì tôi muốn gửi lời cảm ơn đàng hoàng』,\\nhọ đã nài nỉ đến mức dai dẳng nhưng mà……"
2872 = "Giống như tập trung độ trơn trượt của da và sự nhầy nhụa của mồ hôi vào một chỗ là núm vú,\\nkhông phải xoa bóp, mà là vuốt ve mơn trớn."
2883 = "Đến cả đôi mắt cũng đảo tròn đảo tròn không yên."
2886 = "Vừa vuốt ve, tôi vừa chầm chậm đưa đẩy.\\nĐưa đẩy, nhưng cố tình không đâm vào tận sâu bên trong."
2887 = "Vừa trăn trở, vừa suy nghĩ,\\ntôi cố gắng chọn những từ ngữ đơn giản và tròn trịa nhất có thể."
2889 = "Tôi lặp đi lặp lại việc xoa đầu ngoan ngoan không biết bao nhiêu lần.\\nMái tóc tơ mềm mại cọ cọ vào lòng bàn tay tôi buồn buồn."
2890 = "Đúng là đối với tôi, chuyện đó cũng hơi nặng nề thật."
2895 = "Vẫn đang kết nối, Reina tự mình chuyển động hông.\\nNhư thể đang hỗ trợ tôi, hoặc là đang quyến rũ tôi."
2896 = "Reina và tôi, đều là những người vợ, người chồng mới cưới."
2897 = "Dứt nụ hôn, tôi thay đổi tư thế.\\nReina mỉm cười thật tươi với tôi."
2899 = "Vậy thì mút núm vú thôi, vừa nghĩ vậy,\\nmột lời kháng nghị bay thẳng vào mặt tôi."
2901 = "Hướng về nơi sâu thẳm chật hẹp đó,\\nđể trút toàn bộ tinh trùng, không chừa lại một giọt nào!"
2902 = "Chỉ có tôi và Reina, trong phòng của tôi."
2905 = "Tôi cứ thế đùa giỡn theo yêu cầu.\\nDù nhỏ bé nhường này, mà chẳng thấy chán chút nào."
2907 = "Quả không hổ danh là vợ của tôi, muốn ôm lấy,\\nmuốn xoa đầu, muốn cọ má và hôn cô bé quá đi mất."
2909 = "Nhưng, để chìm đắm trọn vẹn vào niềm hạnh phúc ấm áp đó thì——\\nMạch câu chuyện có vẻ hơi không ổn."
2911 = "Tôi muốn chuyển động. Muốn ngấu nghiến theo sự mong cầu của em ấy.\\nNhưng, vẫn chưa được. Phải nhẫn nhịn thêm chút nữa."
2913 = "Vuốt ve. Vuốt ve Reina. Giống như cách Paulette đã làm.\\nCũng là để trấn an trái tim đang bất an của chính tôi."
2915 = "Há to miệng và mắt,\\ntôi cố gắng bắt chước biểu cảm độc đáo đó dù chỉ một chút."
2917 = "Để Reina có thể hiểu được, để có thể truyền đạt được,\\nnhưng đồng thời cũng không làm cô bé sợ hãi——"
2919 = "Reina quả thực là một người phụ nữ,\\nlà do tôi đã biến em ấy thành phụ nữ——Nghĩ đến đó, đũng quần tôi nóng ran."
2922 = "Từ từ, thật từ từ. Tôi dùng lòng bàn tay,\\nvuốt ve mái tóc tơ mềm mại của Reina như đang ấn nhẹ xuống."
2923 = "Reina trong vòng tay tôi bỗng trở nên ấm áp hẳn lên."
2925 = "Tôi chọc chọc vào đôi má mềm nắn bóp của Reina.\\nCô bé nhột nhạt, cười khúc khích——"
2927 = "Tôi rút một tờ từ kệ để tờ rơi của ngân hàng,\\nđưa cho Reina tờ giấy quen thuộc."
2929 = "Một nửa lóng tay đầu tiên.\\nChỉ bấy nhiêu thôi, tôi thử đưa vào hậu môn."
2931 = "Khi tôi ghé sát mặt vào, Reina lập tức đáp lại."
2932 = "Tôi đỡ lấy Reina đang khuỵu gối xuống,\\nnhanh chóng đặt em ấy nằm xuống tấm nệm đã trải sẵn——"
2934 = "Tôi ngồi xuống chiếc ghế băng mà cô bé chỉ,\\nngay lập tức Reina trèo lên đùi tôi."
2936 = "Tôi trêu đùa đôi môi đáng yêu, để em ấy liếm mút ngón tay mình.\\nDùng ngón tay thấm đẫm nước bọt đó, định vị lại dương vật đang cương cứng của mình."
2938 = "Tôi đã nghĩ hay là cứ kích thích hậu môn, vừa khai phá vừa đợi\\nnó tự bong ra cũng được. Nhưng——"
2941 = "Tôi dùng ý chí kìm lại đôi tay đang định bế cô bé lên kiểu công chúa.\\nKìm lại thì tốt rồi, nhưng giờ phải làm sao——"
2942 = "Tôi nuốt ngược lại câu nói \"Chắc không vấn đề gì đâu\" định thốt ra."
2944 = "Lời đáp lại, bằng toàn bộ cơ thể tôi."
2947 = "Tôi ôm chặt lấy Reina.\\nDùng hết sức xoa đầu em ấy."
2949 = "Tôi hung hăng đào bới âm đạo của Reina.\\nKhông chút ngần ngại, tôi giáng toàn bộ sức mạnh của mình vào nơi sâu nhất ấy."
2951 = "Dùng ngón tay mở ra, và ngắm nhìn.\\nChỉ bấy nhiêu thôi, Reina đã cảm nhận rõ ràng rồi."
2954 = "Tôi dùng ngón tay quệt lấy chỗ kết nối,\\nrồi thử đưa đầu ngón tay đó lên miệng Reina——"
2956 = "Vậy là được. Muốn truyền đạt rằng đó là sự chuẩn bị,\\ntôi dùng lưỡi gõ nhiều lần vào lỗ niệu đạo. Và đồng thời——"
2957 = "Tôi dùng cả hai tay, từ từ từ từ bóc ra.\\nLực dính, đã giảm đi khá nhiều vì mồ hôi."
2959 = "Bằng cách dùng mũi kích thích âm vật, tôi đã hoàn tất việc chuẩn bị trước.\\nNếu em ấy sắp tè dầm, thì cứ để em ấy tè ra trước, rồi tôi uống là được."
2961 = "Trên chiếu tatami.\\nNếu tôi ngồi khoanh chân, Reina sẽ lọt thỏm ngay vào lòng."
2963 = "Tôi có thể khẳng định chắc chắn rằng,\\nngày hôm nay tồn tại là để Reina khoác lên mình bộ trang phục này."
2965 = "Tôi mới biết lần đầu tiên,\\nnhiệt độ cơ thể của Railord lại dao động nhiều đến thế theo cảm xúc."
2967 = "Tôi ôm chặt lấy Reina."
2968 = "Khi tôi vuốt ve nhẹ nhàng hậu môn đang co giật,\\nReina rung lắc cơ thể dữ dội."
2972 = "Hút sạch cho đến những giọt nước tiểu cuối cùng——!?"
2973 = "Tôi muốn chạm vào Reina nhiều hơn nữa."
2974 = "Ngay lập tức, khi tôi áp tay mình lên, những ngón tay buông ra,\\nvà vô cùng tự nhiên, đan vào nhau kiểu tay trong tay của những người yêu nhau."
2979 = "Trong tay tôi, nhiệt độ đang dần dần, nhưng chắc chắn, lạnh đi đôi chút."
2991 = "Rồi, em ấy há miệng thật to——"
2995 = "Giọng nói của Reina.\\nÂm vang hơi nũng nịu một chút vẫn đáng yêu như mọi khi."
2997 = "Đập vào mắt tôi đầu tiên là miếng băng cá nhân.\\nChe kín hoàn toàn chỗ đó."
3004 = "Không thấy Reina đâu.\\nTôi vội vàng nhìn quanh——"
3006 = "Thuốc sát trùng thì……hơi khó hiểu,\\nvậy chắc là dùng băng gạc chăng."
3010 = "Để xua tan đi sự lo lắng của Reina,\\ntôi lại tiếp tục vuốt ve cô bé một cách dịu dàng hơn nữa."
3012 = "Rồi Reina gật gật đầu, biểu cảm cứng đờ lúc nãy,\\ntừ từ, từ từ tan chảy thành một nụ cười rạng rỡ."
3016 = "Mặt Reina đỏ bừng lên.\\nThực sự rất đáng yêu. Đáng yêu không chịu nổi."
3019 = "Chắc hẳn là vui lắm.\\nÂm đạo của Reina nhân cơ hội này siết chặt lấy."
3021 = "Reina phạch phạch cởi phăng quần áo,\\nrồi tựa vào người tôi."
3023 = "Vòng tay của Reina vươn tới.\\nCô bé nắn nắn xoa xoa mặt tôi——"
3024 = "Cô bé lẩm bẩm, như thể đang mơ vậy.\\nSau đó Reina, ngước nhìn thẳng vào tôi."
3028 = "Có vẻ như Reina, còn rành hơn cả tôi nữa.\\nVậy thì, anh sẽ chỉ truyền đạt những điểm chính thôi."
3030 = "Reina nở nụ cười rạng rỡ,\\nnũng nịu cọ má vào tôi."
3031 = "Giọng nói như thể đang bị dồn vào đường cùng.\\nMột lời vòi vĩnh đáng yêu, quá đỗi trần trụi."
3033 = "Chắc hẳn những cặp vợ chồng ở thị trấn mỏ than mà Reina từng chứng kiến,\\ncũng đã sống những tháng ngày như thế, không ngừng lặp đi lặp lại."
3036 = "Reina vùi mặt vào ga giường,\\nliều mạng kìm nén bản thân."
3038 = "Reina ngẩng mặt lên,\\nrồi lại cúi xuống, ngơ ngác. Nhìn tôi với vẻ vô cùng khó hiểu."
3040 = "Lạch bạch lạch bạch,\\ncô bé ôm một vật gì đó màu đỏ chạy về phía tôi."
3041 = "Sự run rẩy của Reina khi liều mạng chịu đựng. Giọng nói. Mồ hôi. Mùi hương. Hơi thở.\\nTất cả những thứ đó, đang đẩy tôi lên đỉnh điểm."
3043 = "Lạch bạch, Reina xách túi đồ mua sắm\\nbước sang phòng bên cạnh——rồi đột nhiên dừng lại."
3047 = "Reina lon ton,\\nvừa đung đưa con thú bông vừa hỏi tôi."
3049 = "Quả nhiên Reina, từ đầu đến cuối,\\nchỉ nghĩ đến việc tìm kiếm chủ nhân của con thú bông này."
3052 = "Những ngón tay nhỏ bé nhỏ bé của Reina,\\nnắm lấy ngón út của tôi."
3056 = "Giọng Reina, vì thế bắt đầu pha lẫn sự khô khát.\\nSự nũng nịu đáng yêu, chút bất mãn nho nhỏ, và dục vọng của một người phụ nữ."
3059 = "Một giọng nói ngọt ngào, ngập tràn hạnh phúc và thỏa mãn."
3060 = "Đối với tôi, chuyên mục của Reina là như vậy đấy,\\nnhưng có vẻ như người chụp ảnh đã cầm trên tay cuốn 「Bản tin Ohitoyoshi」."
3061 = "Chỗ đó của Reina ướt nhẹp."
3063 = "Âm đạo của Reina đang run rẩy.\\nKhao khát đến tột cùng, bám chặt lấy và không ngừng co bóp."
3066 = "Âm đạo của Reina, vách thịt vô cùng chật hẹp và mềm mại,\\nbám chặt lấy dương vật cương cứng của tôi, vừa gợn hột vừa nhớp nháp ngọt ngào."
3067 = "Reina ưỡn lưng dữ dội,\\nsiết chặt lấy đầu ngón tay tôi như muốn đứt lìa."
3068 = "Tôi nhẹ nhàng gỡ tay cô bé ra,\\nđể con thú bông cũng được nghe cùng."
3071 = "Tiếng cười khúc khích của Reina chuyển thành tiếng cười nắc nẻ.\\nĐôi tay cô bé lại vươn về phía tôi."
3072 = "Sự ngọt ngào trong giọng nói của Reina pha lẫn chút nhớp nháp."
3074 = "Không biết là vui mừng, hay là xấu hổ, hai má Reina ửng đỏ,\\ncô bé lắc lắc cái đầu nhỏ xíu như thể đang phủ nhận."
3076 = "Mật ngọt của Reina tràn ngập trong miệng.\\nChút vị chua nhẹ, chỉ có bấy nhiêu đọng lại trên đầu lưỡi."
3078 = "Khuôn mặt vừa mới bình tĩnh lại của Reina,\\nlại một lần nữa bùng nổ đỏ bừng."
3080 = "Khoảnh khắc nhìn thấy, toàn thân Reina càng đỏ bừng lên."
3082 = "Đột nhiên, Reina hạ thấp hông.\\nĐáng ngạc nhiên là, trông khá ra dáng."
3083 = "Pyokon, Reina đứng phắt dậy.\\nNở nụ cười rạng rỡ hết cỡ, cô bé ngoái lại nhìn tôi."
3086 = "Reina cười khúc khích, lắc lư cơ thể,\\nmùi xà phòng cọ vào mũi tôi."
3088 = "Reina như một lẽ đương nhiên,\\ndính chặt lấy tôi."
3089 = "Nói xong, Reina bẽn lẽn tỏ vẻ ngại ngùng.\\nCó lẽ việc Cosplay khiến cô bé thấy hơi xấu hổ."
3090 = "Vừa nói cô bé vừa gật đầu cái rụp.\\nReina ngước nhìn tôi, ánh mắt ngập tràn hạnh phúc."
3091 = "Mặt Reina đỏ bừng bừng.\\nĐến mức khiến tôi thoáng lo lắng không biết cô bé có bị quá tải nhiệt hay không."
3094 = "Rất nhẹ thôi, nhưng em ấy đã cắn.\\nNhìn tôi kinh ngạc, Reina nhoẻn miệng cười."
3095 = "Reina xoay người lại và cúi xuống,\\ncái mông đáng yêu lộ ra hoàn toàn——!!?"
3099 = "Lần này, Reina mới lạch bạch bước sang phòng bên.\\nĐi thì cũng được thôi nhưng mà……"
3101 = "Nhắc lại hai lần từ \"tuyệt\",\\nđôi mắt Reina lấp lánh sáng ngời."
3102 = "Luồn lách qua vòng tay nới lỏng của tôi,\\nReina làm mặt hề và tạo dáng."
3105 = "Reina say sưa nheo mắt lại.\\nCứ thế lặng lẽ nhắm mắt."
3106 = "Ưm, Reina rơi vào trầm tư."
3108 = "Khuôn mặt như thể đúc kết lại từ hai chữ \"bất ngờ\"."
3110 = "Cô bé nở nụ cười ấm áp như chiếc đèn lồng giấy,\\nnhưng rồi đột nhiên Reina lại xìu xuống buồn bã."
3111 = "Reina trông vô cùng bất an."
3112 = "Reina gật đầu.\\nĐồng thời cô bé cũng gật gật đầu con thú bông."
3114 = "Cú sốc quá đỗi ngọt ngào làm rung chuyển màng nhĩ,\\ncứ thế chạy dọc sống lưng, truyền lên não, xuyên thấu trung khu thần kinh của tôi."
3118 = "Để nâng cao độ nhận diện của Đường sắt Ohito, của thành phố Ohimitera,\\ncuốn sách nhỏ được bắt đầu thực hiện dưới sự dẫn dắt của Hibiki."
3122 = "Thấy Reina cười, tôi lại càng muốn làm cô bé cười nhiều hơn nữa."
3125 = "Đây là——đây là——đây là quá sức đáng yêu!!"
3127 = "Đáng yêu quá. Dễ thương quá. Chịu không nổi.\\nDương vật vừa mới xuất tinh, lại bừng bừng lấy lại khí thế."
3128 = "Đáng yêu quá. Xinh đẹp quá.\\nNên tôi lại càng muốn làm em ấy ngượng ngùng hơn nữa."
3132 = "Thật dễ chịu. Chỉ một cảm giác dễ chịu thuần túy.\\nReina cũng đắm chìm, nhắm nghiền mắt lại."
3137 = "Quả thực, rất tuyệt. Chỉ có thể nói là đáng yêu.\\nVới sự đáng yêu này, thì kẹo có thu gom bao nhiêu cũng được."
3138 = "Đúng là, chuyên mục của Reina. Dù mang tên là 『Từ cửa sổ toa xe』\\nnhưng phong cảnh dọc tuyến đường chỉ được giới thiệu trong số đầu tiên."
3144 = "Chỉ với chừng đó gợi ý mà cô bé đã hiểu.\\nĐiều đó khiến tôi cảm thấy vô cùng, vô cùng vui sướng."
3148 = "Những ngày tháng bên cạnh Reina, mang trong mình nỗi lo âu về hệ thống truyền động và sự quá tải do cải tạo quá mức,\\nchắc hẳn không phải lúc nào cũng êm đềm."
3153 = "Cảm nhận được mái tóc suôn mượt qua lớp vải trơn láng.\\nBản thân lòng bàn tay tôi đang reo vui."
3156 = "Nói là em bé thì đúng hơn là một bé gái được cách điệu hóa.\\nRất đáng yêu, và cũng không bị trầy xước gì."
3159 = "Màu sắc cũng, hồng hào tươi tắn như thịt tươi vậy."
3182 = "Bị đốn gục, là cảm giác này sao."
3183 = "Thế này thì sẽ không làm Reina đau lắm——"
3184 = "Quả đúng là, định mệnh."
3188 = "Nếu đã vậy, nguyện vọng của Reina,\\ndù thế nào anh cũng sẽ thực hiện cho bằng được."
3194 = "Mặc dù dạo gần đây đã được cải thiện đáng kể,\\nnhưng tâm lý của Paulette, về bản chất vẫn rất yếu đuối trước những rắc rối."
3250 = "（Lảo đảo）"
3251 = "（Xoẹt——xoẹt——）"
3252 = "（Phập!）"
3253 = "（Phập——phập phập——）"
3254 = "（Chụt）"
