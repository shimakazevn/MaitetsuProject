1567 = "「Anh Soutetsu. Reina là vợ mà,\\nnên để Reina cởi quần lót cho anh nha~」"
1568 = "「Anh Soutetsu.」"
1569 = "「Anh Soutetsu? Âm đạo của Reina. Nơi để đút dương vật vào.\\nAnh biết là ở đâu chưa?」"
1571 = "「Nó phồng to lên thế này,\\nlà vì đang lớn và cứng lên nhỉ~」"
1574 = "「~~~~!」"
1752 = "Khoảnh khắc đó, đột nhiên,\\nkhuôn mặt Reina bừng sáng với một nụ cười."
1755 = "Trải mềm mại bên dưới dương vật đang cương cứng, em ấy cứ thế di chuyển đầu,\\ntừ từ nuốt trọn và bao bọc lấy tôi, sâu dần vào tận cuống họng."
1759 = "Không chỉ cưỡng ép đẩy vào,\\nmà còn có thể đẩy tới lui xoay vòng, khắc sâu bản thân vào âm đạo."
1773 = "Những thứ đó đang hướng thẳng vào hạ bộ của tôi.\\n……Tiếng nói của cơ thể là gì, dù muốn hay không tôi cũng đã nhận ra."
1780 = "――Nhưng rồi em ấy lập tức cử động lại.\\nNhiệt tình gật gù đầu lên xuống, cố gắng khơi gợi khoái cảm và tinh dịch từ tôi."
1782 = "Nhưng, tôi không vội.\\nChỉ mới lúc nãy thôi, âm đạo này vẫn còn run rẩy vì đau đớn."
1785 = "Nhưng trong đó,\\nvẫn lẫn lộn sự an tâm không thể che giấu."
1787 = "Thế nhưng, hông tôi vẫn cứ tiến tới."
1788 = "Nhưng, nếu Reina đã muốn thế――\\nthì tôi chẳng có lý do gì để từ chối cả."
1791 = "Nghĩ thì nghĩ vậy, nhưng chiếc lưỡi và đôi môi của Paulette,\\nđang mang đến khoái cảm như một liều độc dược, đánh sập lý trí của tôi."
1793 = "Nhưng bây giờ, có vẻ Reina đã biết rồi.\\nNhìn là thấy ngay, niềm vui sướng đang tràn ngập khắp cơ thể em ấy."
1809 = "Chỉ bằng những lời trao đổi đó,\\nnhưng chúng tôi, đã gắn kết với nhau."
1810 = "Giọng nói của Reina làm lớp vải quần lót khẽ rung lên.\\nChỉ vậy thôi cũng đủ khiến sự cương cứng giật nảy."
1821 = "Ngay khoảnh khắc tôi ấn quy đầu vào,\\nthịt âm đạo đã rung lên đầy ngọt ngào, như muốn dẫn lối tôi vào trong."
1829 = "Dù vậy, Reina vẫn nhìn tôi.\\nĐôi mắt lấp lánh nhìn thẳng, cô bé cứ đăm đăm nhìn tôi."
1830 = "Dù chưa hề âu yếm,\\nPaulette đã ướt đẫm rồi."
1839 = "Nước bọt rỉ ra từ khóe miệng,\\ncả khuôn mặt lẫn cơ thể đều tan chảy."
1841 = "Mặt khác, chiếc lưỡi của Paulette lại rất trơn tru.\\nChuyển động của nó vô cùng tỉ mỉ và cẩn thận."
1843 = "Phải dành thời gian để cô bé từ từ làm quen——\\nNếu không, sẽ chẳng thể tiếp tục được nữa."
1845 = "Nếu ý thức về \"cơ thể\",\\nsẽ nhận ra nguyên nhân của sự bồn chồn nằm ở đó."
1851 = "Như thể đang được yêu thương――đến mức cơ thể tôi gần như hiểu lầm,\\ncô ấy chà xát nước bọt vào từng nếp nhăn một."
1854 = "Chạm vào trong tích tắc, rồi trượt ra――\\nThế này cũng mang lại một cảm giác dễ chịu kỳ lạ."
1857 = "Dục vọng dâng trào vì kích thích đã cuốn trôi đi sự ngại ngùng.\\n\"Muốn được chạm vào\". Trong đầu tôi giờ chỉ tràn ngập suy nghĩ đó."
1858 = "Nếu chỉ vì màn làm mẫu mà lại thấy quá sung sướng,\\nthì thật có lỗi với Reina."
1865 = "Hai người họ lúng búng trò chuyện với nhau,\\ntôi chẳng hiểu gì sất, nhưng có vẻ họ lại rất hiểu ý nhau."
1867 = "Hoàn toàn với khuôn miệng của một đứa trẻ đang làm nũng, như thể đang mút ngón tay,\\nvừa hôn, cái miệng nhỏ ấy vừa mút mát quy đầu đầy ngọt ngào."
1868 = "Tè――không phải, là rỉ nước tiểu rồi."
1871 = "Cô ấy hiên ngang ưỡn bộ ngực mặc áo lót lên,\\nvà dõng dạc chỉ bảo cho tôi."
1872 = "Không phải là được chỉ tay vào.\\nCũng chẳng phải được chỉ dẫn bằng lời nói."
1875 = "Ấm áp đến vô tận——\\nđủ để bao dung và tha thứ cho cả những vết thương đang khẽ run rẩy của tôi."
1879 = "Tí tách, những giọt nước mắt không thể kìm nén tuôn rơi.\\nBàn tay Paulette dịu dàng lau đi, rồi liếm láp chúng."
1880 = "Sự đau đớn đã biến mất khỏi giọng nói.\\nChỉ còn lại niềm hoan lạc thuần túy, làm rung chuyển màng nhĩ và não bộ tôi."
1881 = "Trong giọng nói, rõ ràng có sự hoan lạc."
1882 = "Ánh mắt nũng nịu. Giọng nói nũng nịu.\\nNhưng nó không hướng về phía tôi, mà là hướng về——"
1884 = "Hiện tại, gánh nặng là quá lớn.\\nÂm đạo của Reina, và có lẽ cả cơ thể cô bé, đã đến giới hạn rồi."
1887 = "Những ngón tay ngắn ngủn, đầy vẻ háo hức――\\nvươn tới hông tôi."
1889 = "Nếu không hành động, chắc chắn Reina sẽ tiếp tục suy nghĩ.\\nDù câu trả lời đã được định sẵn, và chỉ còn cách tiến tới đó."
1896 = "Nơi cuống âm đạo của Reina,\\ncô ấy mơn trớn viên ngọc trai bằng thịt nhỏ xíu xiu."
1897 = "Ngay khoảnh khắc cuộc trò chuyện kết thúc, Reina bất ngờ tăng tốc!"
1899 = "Bên trong nó bám chặt, dính dấp lấy tôi,\\nmời gọi tôi, khiến tôi rạo rực――nhưng mà――"
1900 = "Ướt đẫm và nhỏ giọt lượng mật dịch khổng lồ đến mức khiến người ta lầm tưởng rằng thịt đã tan chảy,\\ncô bé đang run rẩy."
1904 = "Âm đạo đang co thắt từng đợt.\\nMật ngọt bắt đầu lẫn chút vị chua, và tôi cũng cảm nhận được mùi hương mang theo hơi ấm."
1906 = "Thịt âm đạo cũng đã trưởng thành, săn chắc và đàn hồi,\\ndù hơi cứng nhưng vẫn bao bọc lấy tôi như muốn làm tan chảy."
1908 = "Như thể đang nâng niu một tờ giấy mỏng manh dễ rách,\\nem ấy từ từ, từ từ cẩn thận kéo chiếc quần lót của tôi xuống――"
1910 = "Dù đã được giải phóng về mặt tình dục,\\nnhưng về tình yêu có lẽ——cô bé còn không hiểu bằng tôi."
1931 = "Có lẽ cực khoái tình dục quá mãnh liệt,\\nkhiến Reina không thể kiểm soát được việc bài tiết nữa."
1935 = "Khoảnh khắc nghĩ vậy, tôi đã vung hông hết cỡ.\\nDi chuyển thật rộng, thật mạnh."
1940 = "Cảm giác như vừa chọc thủng thứ gì đó,\\nhông tôi tiến thẳng vào trong một mạch——"
1941 = "Có cảm giác chạm vào tận sâu bên trong."
1945 = "Tôi bị mê hoặc mất rồi.\\nBởi rãnh nhỏ đơn sơ nơi hạ bộ của Reina."
1946 = "Tôi không hề chạm vào ngực em ấy.\\nChắc là Paulette đang giúp tôi ái ân."
1949 = "Cảm thấy không thể thua kém được,\\ntôi khiến chuyển động của lưỡi trở nên mạnh mẽ và táo bạo hơn."
1954 = "Ngay khoảnh khắc tôi định gật đầu,\\ntinh hoàn đã bị ngậm chặt lấy."
1960 = "Hòa chung nhịp thở, gật đầu với nhau――\\nTừ từ, từ từ, tôi đẩy hông tới."
1961 = "Lần đầu tiên, chắc chắn chúng tôi sẽ trở thành người lớn.\\nVà như thế, sẽ trở thành một gia đình."
1962 = "Khít rịt không một kẽ hở, lực siết chặt vẫn không đổi.\\nNhưng vách thịt ướt đẫm tan chảy, nhầy nhụa một cách quá đỗi ngọt ngào."
1963 = "Làn da kề sát, trao nhau nụ hôn.\\nTrong lúc đó, hông tôi vẫn không ngừng nhấp liên tục từng nhịp nhỏ."
1964 = "Có thể ra cùng nhau.\\nNghĩ vậy, tôi liền rút hông ra thật mạnh."
1967 = "Trinh tiết của Paulette, đã bị tôi cướp mất.\\nDù đó là điều cô ấy mong muốn——"
1969 = "Nãy giờ tôi vẫn đợi mãi mà……\\nChẳng thấy Paulette hay Reina xuất hiện gì cả."
1971 = "Muốn in đậm dấu ấn của mình lên Reina,\\ntôi uốn cong lưỡi lại và dốc hết sức!"
1973 = "Nỗi bất an cứ thế lớn dần."
1976 = "Tôi từ từ, từ từ rút ra.\\nChỉ vậy thôi cũng đủ khiến khuôn mặt Reina lại trở nên đau đớn."
1977 = "Ép chặt môi vào âm đạo――\\nNgay khoảnh khắc đó, tôi nhận ra Reina đã ướt sũng."
1979 = "Để làm Reina an tâm――tôi buột miệng nói ra những lời ấy,\\nvà Paulette lập tức hùa theo hỗ trợ."
1980 = "Vừa cảm thấy biết ơn,\\nnhưng đồng thời cũng thấy sự quan tâm đó lúc này lại phản tác dụng."
1981 = "Nhìn dương vật cương cứng chạm tới tận rốn của tôi,\\nReina say sưa, mê mẩn ngắm nhìn."
1984 = "Ngay trước hạ bộ gần như khỏa thân của tôi,\\nReina và Paulette cũng gần như khỏa thân đang kề mặt vào nhau."
1986 = "Não bộ tự động đưa ra sự so sánh.\\nKhoang miệng của Reina mềm mại hơn hẳn."
1987 = "Hông tôi, run rẩy.\\nCảm giác như toàn bộ tinh dịch đang trào ra không sót một giọt."
1990 = "Đột nhiên, tôi chợt nghĩ.\\nĐúng hơn là, tôi đã hiểu ra."
1991 = "Tôi chợt cảm thấy mình đã hiểu ra."
1993 = "Cuối cùng, đến tận bây giờ tôi mới hiểu ra.\\nMở phong ấn, nói cách khác chính là giải phóng chức năng tình dục."
1995 = "Ai đó khẽ nuốt nước bọt cái ực.\\nĐến mức này――chính tôi cũng không ngờ tới."
1997 = "Cô ấy chỉ tay vào sự căng cứng nơi hạ bộ của tôi――\\ntức là sự cương cứng."
1998 = "Tôi trao em một nụ hôn, rồi đưa quy đầu đến cửa âm đạo."
1999 = "Tôi hôn và từ từ vuốt ve mái tóc cô bé,\\nbiểu cảm đau đớn dần dịu đi, Reina say sưa nhắm mắt lại."
2000 = "Lời chưa kịp dứt, chưa kịp xác nhận câu trả lời,\\nmột sự kích thích mạnh mẽ và ngọt ngào đã bao trọn lấy quy đầu."
2003 = "Chỉ còn mỗi chiếc quần lót.\\nChỉ một mảnh vải mỏng manh ấy, tôi lại cảm thấy như chiếc phao cứu sinh."
2005 = "Vừa nói, tôi vừa móc ngón tay vào cạp quần――"
2013 = "Thế nên, tôi có thể di chuyển."
2014 = "Vì vậy, tôi nuốt lấy.\\nChỉ một mực nuốt lấy."
2017 = "Dù có ý định dừng lại,\\nnhưng cơ thể lại khao khát khoái cảm."
2024 = "Bản năng đang cố gắng bóp nghẹt lý trí."
2031 = "――Đúng, chính là điều đó.\\nĐó chính là điều khiến tôi cảm thấy vô cùng bất an."
2034 = "Quần lót ướt sũng đến mức trông có vẻ nặng nề,\\nPaulette không chút do dự, cởi phăng ra."
2052 = "Mút mạnh đến mức khiến tôi liên tưởng đến hai chữ \"chân không\",\\nPaulette mới chịu nhả quy đầu của tôi ra khỏi khoang miệng cô ấy."
2053 = "Tiếng rên rỉ bật ra từ kẽ răng của Paulette,\\nkhông chỉ đơn thuần là chịu đựng sự đau đớn."
2054 = "Nghe Paulette khẳng định dứt khoát,\\nReina lập tức gật đầu mạnh mẽ."
2055 = "Bàn tay của Paulette đang vuốt ve mái tóc Reina một cách vô cùng dịu dàng.\\nVuốt ve không ngừng, vô cùng dịu dàng."
2056 = "Những ngón tay thon dài, thanh tú của Paulette,\\ntách mở âm đạo của Reina ra để tôi dễ dàng nhìn thấy."
2057 = "Giọng nói bình tĩnh, ánh mắt tĩnh lặng, đã ngăn tôi lại."
2058 = "Ướt đẫm nước tiểu của Reina——\\nKhông, liệu có phải chỉ ướt vì nước tiểu của Reina thôi không?"
2059 = "Nụ cười thoáng chút đượm buồn——\\nnhưng ngay lập tức, lại nở rộ."
2060 = "Ngón tay Paulette khẽ cử động."
2061 = "Bằng ánh mắt, Paulette dò hỏi tôi.\\nVề mặt lý thuyết, việc đổi chỗ là không cần thiết."
2062 = "Ánh mắt, giọng nói, và cả bàn tay của Paulette cũng vậy."
2063 = "Chẳng hiểu sao, Paulette lại đỏ mặt.\\nCô ấy khẽ nuốt nước bọt, rồi gật đầu mạnh mẽ như đã hạ quyết tâm."
2064 = "Đôi mắt xanh, trong khoảnh khắc, dao động."
2065 = "Để được chỉ dạy điều đó, cần phải có sự chuẩn備."
2066 = "Chị Paulette còn dạy cả những chuyện như thế này sao."
2069 = "Dòng nước chảy mạnh.\\nPhản xạ tự nhiên khiến khuôn mặt tôi tự động cúi xuống."
2072 = "Tinh dịch dâng trào đến tận cùng, như sắp sửa tuôn trào.\\nNhưng, nếu cứ thế này mà ra mất thì――"
2074 = "Cảm giác chinh phục, cảm giác thành tựu rần rần,\\nchạy dọc sống lưng trong một chớp mắt!"
2075 = "Để giành lại tôi, cơ thể Reina đã nhanh chóng trưởng thành,\\nchỉ để tiếp nhận tôi."
2076 = "Ba người là một——để vượt qua nỗi đau và trở thành một gia đình,\\ntôi sẽ làm những gì mình cần phải làm."
2077 = "Ba ngày ở Yahata để nhận chuyển nhượng toa xe――\\nReina có vẻ mất tập trung, cứ bồn chồn không yên."
2078 = "Để tiếp tục mang lại khoái cảm, tôi dùng quy đầu cọ xát vào chỗ nham nhám\\nmà Reina vừa chỉ lúc nãy."
2083 = "Tiếng thở hắt ra đầy thán phục \"Hawaa\".\\nGiọng nói của Reina bắt đầu pha lẫn một sự quyến rũ mà tôi chưa từng nghe thấy."
2084 = "Rồi trút toàn bộ!\\nTrút toàn bộ con người tôi vào hết cỡ!!!"
2087 = "Reina cũng run rẩy dữ dội——"
2088 = "Phấn khích trước giọng nói của Reina, tôi tập trung toàn bộ vào nơi đó,\\nliếm láp, mút mát một cách triệt để."
2092 = "Reina đang ngước nhìn tôi.\\nĐôi mắt ướt đẫm, như thể có thể khóc òa lên bất cứ lúc nào."
2094 = "Giọng nói đượm vẻ tiếc nuối."
2096 = "Reina, Reina đang ngậm lấy bi của tôi.\\nEm ấy đột nhiên ngậm trọn lấy tinh hoàn của tôi!"
2098 = "Reina đang tan chảy."
2101 = "Reina, khựng lại."
2102 = "Khuôn mặt Reina như sắp khóc.\\nNhìn chằm chằm vào tôi, cô bé lắc đầu nguầy nguậy."
2103 = "Đôi mắt xanh biếc——đang dịu dàng, dịu dàng ngắm nhìn\\nkhung cảnh lần đầu tiên được chứng kiến ấy."
2104 = "Reina biến chiếc lưỡi của mình thành một tấm thảm."
2106 = "Đôi môi đáng lẽ phải ngậm trọn lấy,\\nlại trượt tuột khỏi quy đầu."
2109 = "Không hề báo trước, một cách vô tư, đầu ngón tay Reina chạm vào dương vật đang cương cứng,\\nnhưng rồi lại lập tức rụt lại."
2110 = "Đôi môi đáng yêu của Reina. Đôi môi nhỏ bé xíu xiu ấy.\\nĐang đặt nụ hôn lên phần quy đầu phình to xấu xí của tôi."
2113 = "Cái gọi là \"phong ấn\" của Reina,\\nrốt cuộc là gì, trong đêm ở Yahata tôi vẫn chưa thể hiểu được."
2115 = "Mỗi khi đôi môi Reina cử động,\\nmột khoái cảm ngọt ngào, run rẩy lại tích tụ nơi tinh hoàn."
2117 = "Cửa âm đạo của Reina,\\ndang bị kéo căng ra hết cỡ."
2118 = "Âm đạo của Reina ướt sũng nhầy nhụa."
2120 = "Trái tim của Reina, vẫn còn rất non nớt."
2121 = "Một khi đã chạm vào quần lót,\\nđộng tác tay của Reina trở nên thận trọng."
2123 = "Ánh sáng lấp lánh trong trẻo tô điểm tuyệt đẹp cho đôi mắt Reina.\\nCảm giác tội lỗi và dục vọng đan xen vào nhau, ngày một lớn dần."
2125 = "Lời nói của Reina khiến tôi nhớ ra.\\nNguyên nhân sự bồn chồn của Reina là――nếu vậy thì……"
2129 = "Cơ thể Reina rất nhỏ bé.\\nNếu cố ép, e là sẽ làm em ấy bị tổn thương mất."
2130 = "Cơ thể Reina căng cứng hết cỡ.\\nMiệng hé mở, cô bé đang thở hổn hển một cách đau đớn."
2132 = "Lông mày Reina nhíu lại."
2134 = "Chứng kiến cảnh đó,\\nReina nở một nụ cười hạnh phúc \"ư hự hự\"."
2136 = "Reina đứng cạnh Paulette,\\nrồi cả hai cùng ngồi xổm xuống."
2137 = "Mỉm cười rạng rỡ,\\nReina vừa khóc xong lại cười một cách đáng yêu."
2139 = "Reina ngậm miệng lại.\\nCó vẻ như đang cố gắng tìm kiếm, mãi mà không thốt nên lời tiếp theo."
2141 = "Ánh mắt Reina đuổi theo hướng nhìn của đôi mắt xanh kia."
2150 = "Xoáy sâu, cưỡng đoạt âm đạo bé nhỏ của Reina,\\nnhuộm nó thành của riêng tôi."
2153 = "Hôm nay đến đây thôi.\\nTôi không muốn vì thỏa mãn thú tính của bản thân mà khiến Reina phải chịu đau đớn——"
2155 = "Vẻ mặt em ấy trở nên đau đớn,\\nđến mức tôi cũng có thể cảm nhận được nỗi đau đó."
2171 = "Tinh dịch căng phồng như chực chờ vỡ tung.\\nTôi muốn trút toàn bộ con người mình vào tử cung của Reina."
2173 = "Chất lỏng trắng đục của tôi tuôn trào lên khuôn mặt Reina, lên mái tóc Paulette.\\nTôi đã làm vấy bẩn cả hai người họ mất rồi."
2174 = "Giọng nói ngây thơ. Ánh mắt trong sáng."
2179 = "Cảm giác tội lỗi trào dâng――\\nThế nhưng sự xuất tinh đáng xấu hổ của tôi dường như lại càng mãnh liệt hơn."
2181 = "Thế nhưng, tôi hoàn toàn có thể hiểu rõ.\\nBản năng đang mách bảo cho tôi biết."
2182 = "Nghe giọng nói yếu ớt, tôi ngẩng mặt lên——\\nKinh ngạc, buồn bã, và cả vui mừng."
2183 = "Giọng nói như sắp khóc khiến cơ thể tôi tự động cử động.\\nDùng cả khuôn miệng bao trọn lấy âm đạo nhỏ bé――!!!?"
2186 = "Dương vật cương cứng ưỡn cong lên hoàn toàn,\\nsừng sững như một chiếc cột vươn lên giữa hai khuôn mặt đang kề sát nhau."
2188 = "Cảm giác lúc ấn vào, hoàn toàn khác với lúc nãy."
2198 = "Hông tôi, run rẩy.\\nToàn bộ tinh dịch, đã cạn sạch."
2206 = "Khác với thường ngày,\\nPaulette tràn đầy sự chắc chắn và tự tin."
2210 = "Những giọt mật tuôn trào không ngừng từ sâu thẳm bên trong âm đạo của Reina,\\nnhư đang dẫn dắt đầu lưỡi tôi, bảo rằng \"Tiến lên đi\", \"Sâu hơn nữa đi\"."
2213 = "Có lẽ vì cảm thấy an tâm khi được bao bọc,\\ndòng nước tiểu của Reina càng lúc càng mạnh."
2222 = "Vượt qua nỗi đau, hòa chung nhịp đập trái tim.\\nChúng tôi, cứ như thế——trở thành một gia đình."
2225 = "Dục vọng của cơ thể kết nối với trái tim.\\nTôi hiểu rằng sự cương cứng của mình là một hiện tượng đúng đắn. Nhưng――"
2232 = "Đây chính là, \"làm mẫu\".\\nMẹ của Reina, mẹ vợ của tôi."
2233 = "Và rồi, hướng về phía Reina cũng vừa nhả miệng ra,\\ncô ấy dịu dàng, nhẹ nhàng chỉ bảo thêm."
2234 = "Cảm giác khiến tôi nhận ra, là chỗ này sao."
2238 = "Bằng cách để tất cả cùng chịu đựng nỗi đau.\\nBằng cách vượt qua nó."
2239 = "Đã trao cho những kẻ còn non nớt trong tình yêu như chúng tôi,\\ncùng với một nỗi đau dữ dội."
2240 = "Quá sung sướng khiến tôi vã cả mồ hôi hột. Mồ hôi tuôn ra như suối.\\nThế này――thật tuyệt vời."
2243 = "Bản năng của giống cái, liệu Railord cũng có sao?"
2248 = "Dễ chịu thì có dễ chịu, nhưng lại thấy bứt rứt.\\nTôi muốn một sự kích thích mạnh mẽ và sâu sắc hơn."
2255 = "Nhiệt độ cơ thể cũng ấm áp hơn Paulette,\\nmang đến cho sự cương cứng của tôi cảm giác hạnh phúc khi được bao bọc."
2258 = "Từ chỗ kết nối, dòng máu đỏ tươi trào ra."
2260 = "Cảm giác quy đầu chạm vào cuống họng.\\nReina thoáng nhăn mặt như thể vừa ăn phải thứ gì đó đắng ngắt――"
2261 = "Khi quy đầu đâm sầm vào tận sâu bên trong Reina,\\nmột lực hút như muốn cắn nuốt lấy phần đỉnh ập đến!"
2262 = "Toàn bộ quy đầu đã được bao bọc trọn vẹn.\\nNiềm vui sướng đã mong chờ từ lâu khiến cơ thể tôi nóng bừng lên trong chốc lát."
2315 = "（Nhưng……mà——）"
2316 = "（À――）"
2318 = "（Nhóp——nhép——phập——bạch!）"
2319 = "（Nhóp——nhép——nhóp——nhép——）"
2320 = "（Nhóp——nhép——）"
2321 = "（Nhóp! Phập! Chụt! Rột!）"
2322 = "（Sụt……）"
2323 = "（Nhóp——sột——soạt——phập!）"
2324 = "（Phập phập phập phập!!）"
2325 = "（Phập）"
2326 = "（Ực! Ực! Ực! Ực!）"
2327 = "（Ực――ực――ực――ực――）"
2328 = "（Phụt――phụt――phụttttt――phụt――）"
2329 = "（Phụt! Phụt! Phụt! Phụttttt!）"
2341 = "（Rộp――rộp――rộp――sụt）"
2342 = "（Rộp! Rộp! Sụt sụt! Sụt!）"
2343 = "（Nhóp——nhép——）"
2344 = "（Sụt――sụt sụt――）"
2345 = "（Phậpppppppp!——Bạch!）"
2346 = "（Sụttttttttttt!!!）"
2347 = "（Trượt!）"
2348 = "（Tuột——）"
2350 = "（Rộp! Rộp! Sụt! Sụt!\\nLiếm! Liếm! Rộp! Sụtttt!）"
2351 = "（Chuuuu!）"
2352 = "（Rào――róc rách――――róc rách――phụt!）"
2353 = "（Rào ràooooooooo!）"
2354 = "（Rào ràoooooooo）"
2355 = "（Phập）"
2357 = "（Bật ra!!!）"
2359 = "（Thế nên, Paulette mới cố tình làm vậy）"
2361 = "（Tách ra）"
2363 = "（Chạm nhẹ）"
2364 = "（Trơn tuột!）"
2366 = "（Reina, đã khao khát tôi……\\nVà chính cảm xúc đó, đã giải trừ phong ấn sao.）"

