1390 = "Nóng quá. Không chỉ mình em, mà cả chị Mayami cũng vậy.\\nĐến mức vượt qua cả khao khát muốn làm nũng mãi với đầu ngực của chị——!!"
1392 = "Chỉ cần lơ là một chút là tinh dịch sẽ bị vắt kiệt ngay lập tức.\\nNhưng không thể nào, không thể ra nhanh và nông thế này được."
1394 = "Là do em, hay là do chị Mayami.\\nDù đã dừng hông lại nhưng âm đạo và dương vật vẫn tự động cọ xát vào nhau."
1401 = "Đầu ngực đã bắt đầu cương cứng lại, em bọc răng bằng môi,\\ncắn nhẹ một cái, rồi kéo với lực vừa đủ để nó tự nhiên tuột ra."
1402 = "Đầu ngực nằm gọn gàng trên lưỡi em một cách tự nhiên.\\nMột lần nữa, môi và cổ họng em lại tự động mút mát."
1412 = "Dù sữa không ra, nhưng bản năng vẫn khao khát được uống.\\nThế nên, em không thể không dùng đủ mọi cách để kích thích nó."
1428 = "Đầu ngực đã sưng phồng lên hết cỡ. Mồ hôi ướt đẫm toàn thân, mùi hương nồng nặc.\\nMột câu trả lời đã quá rõ ràng, nhưng em vẫn muốn được nghe chính miệng chị nói ra."
1458 = "À, hoàn toàn không phải tự động. Là do chị Mayami——\\nDù đang ở một tư thế khó khăn, chị ấy vẫn đang cố gắng chuyển động hông."
1460 = "Môi và cổ họng em đã phản ứng nhanh hơn cả suy nghĩ.\\nChắc hẳn là do bản năng——nếu vậy, em sẽ phó mặc tất cả cho nó."
1462 = "Cùng với sự biết ơn, dòng máu nóng rực cuồn cuộn dồn xuống đũng quần.\\nEm áp dương vật đã cương cứng vào âm đạo của chị Mayami."
1465 = "Trong lúc cô đặc tinh dịch của em, chị Mayami cũng đã luôn cố gắng nhẫn nhịn.\\nSự thấu hiểu đó lập tức truyền đến cả trái tim và cơ thể em."
1466 = "Ngón tay đang mơn trớn quy đầu,\\nnhẹ nhàng trượt từ bao quy đầu xuống dọc thân dương vật."
1472 = "Không phải chị nuôi, không phải vợ, thậm chí không phải mẹ.\\nChỉ là một người đàn bà mang tên Mayami. Người đàn bà, của anh."
1473 = "Chị ấy chỉ tuốt lột một cách cực kỳ hờ hững.\\nKích thích trực tiếp mà em khao khát đến thế, giờ đây lại trở thành một cực hình."
1475 = "Một cú tuốt cực kỳ nhẹ nhàng.\\nChỉ vậy thôi mà tinh dịch đã cuồn cuộn dâng lên."
1478 = "Em cảm nhận được chúng em đang có cùng chung một tâm trạng.\\nVì thế, em nép sát người vào chị trong lớp chăn."
1480 = "Tiếng thì thầm. Rồi những ngón tay tàn nhẫn rời khỏi dương vật của em——"
1483 = "Một nụ hôn dính chặt lấy nhau.\\nVà rồi những lời nói êm đềm cất lên."
1485 = "Trái ngược với giọng điệu quở trách, âm sắc của chị lại nhuốm màu dục vọng.\\nKhao khát được uống sữa mẹ bị pha lẫn với những ham muốn không trong sáng."
1486 = "Miệng thì bảo biết, nhưng kích thích vẫn chẳng mạnh lên chút nào.\\nHông em tự động nảy lên dữ dội, nhưng những ngón tay quá đỗi hời hợt kia chẳng hề đáp lại."
1488 = "Một nụ cười hạnh phúc. Nụ cười của chị Mayami, bao bọc lấy toàn bộ con người em."
1490 = "Thật bứt rứt, thật khó chịu, chị ấy chỉ mơn trớn mỗi quy đầu.\\nEm muốn thốt lên sự bất mãn này——"
1492 = "Giống như những gì đã làm với bầu ngực và đầu ngực,\\nem há to miệng tròn vo rồi mút trọn lấy vùng xung quanh âm vật."
1506 = "Đầu ngực đã trở nên cứng ngắc và bầu ngực thì quá đỗi mềm mại,\\nkhiến em không thể nào rời môi ra được."
1511 = "Muốn làm dịu đi dù chỉ một chút sự bốc đồng quá đỗi mãnh liệt này,\\nem rút ra cho đến tận sát quy đầu——"
1512 = "Xấu hổ quá——cảm giác đó lập tức chuyển hóa thành một khoái cảm mãnh liệt,\\nđiều đó lại càng khiến em thấy xấu hổ hơn nữa."
1516 = "Bù đắp cho khoảng thời gian nhẫn nhịn, em ra sức nắn bóp. Dùng cả hai tay nhào nặn thật mềm mại,\\ncàng bóp, bầu ngực càng trào ra qua kẽ tay."
1520 = "Khi khoái cảm dần lắng xuống, chỉ còn lại sự yêu thương dâng trào.\\nHơi ấm, mùi hương của chị Mayami thấm đẫm vào người em."
1526 = "Nhất định, sẽ làm cho chị Mayami mang thai.\\nKhi ý thức mãnh liệt điều đó một lần nữa, nó lại dẫn đến một sự thấu hiểu tiếp theo."
1529 = "Vì thế, em vừa mút vừa đảo lưỡi ở tốc độ cao,\\nkhiến những âm thanh ngọt ngào và hơi thở của chị Mayami bật ra."
1534 = "Những chuyển động lại một lần nữa hô ứng với nhau.\\nMỗi khi cơ thể hòa quyện, cảm xúc cũng ngày càng gắn kết sâu đậm hơn."
1535 = "Hòa quyện vào nhau và trao nhau nụ hôn."
1536 = "Hai chiếc lưỡi quấn quýt lấy nhau, trao đổi nước bọt và hơi thở."
1538 = "Chỉ có thể nắn bóp ngực và chuyển động hông.\\nCả cơ thể, trái tim lẫn tâm trí đều bị lấp đầy bởi dục vọng và tính chiếm hữu."
1540 = "Thay cho cái gật đầu, em mút lấy đầu ngực rồi liếm một vòng.\\nCuối cùng thì vòng tròn được tạo bởi ngón cái và ngón trỏ của chị cũng siết lại——"
1542 = "Cô đặc, hình như em vừa nghe thấy từ đó.\\nEm cứ tưởng là sẽ được vắt kiệt chứ——!"
1544 = "Vì khát, nên em càng thèm muốn hơn.\\nMuốn liếm sạch những giọt nước bọt đang nhỏ giọt kia, em điên cuồng mút mát."
1546 = "Bàn tay đang nắn bóp cũng tiếp nhận được niềm mong mỏi tha thiết ấy.\\nNóng quá. Nhịp tim đập dồn dập. Cả em và chị Mayami, đang hòa làm một."
1548 = "Em muốn gọi tên chị, nhưng lúc này chẳng thể cất nên lời.\\nThế nên em đành dồn hết mọi tâm tư vào những ngón tay——"
1550 = "Em định nói gì đó nhưng miệng đã bị đầu ngực và bầu ngực chặn lại mất rồi."
1551 = "Em há to miệng tròn vo theo lời chị nói,\\nbàn tay trái đang đỡ đầu em khẽ đung đưa dẫn lối."
1553 = "Anh cũng phát điên từ lâu rồi. Toàn bộ dây thần kinh đều dồn vào dương vật,\\nđầu óc choáng váng, chỉ có thể thở những nhịp ngắn."
1556 = "Cảm thấy xấu hổ. Cũng có chút kháng cự.\\nNhưng nếu sắp trở thành một người cha, em không thể cứ mãi làm một đứa em trai nuôi được."
1558 = "Hay nói đúng hơn là, không thể nào. Không liếm láp bầu ngực và đầu ngực này\\nmà cứ vô tư mút mãi, thì đến trẻ con cũng chẳng làm được."
1560 = "Chỉ dùng tay trái đỡ lấy hông,\\nem ra sức nhào nặn bầu ngực đang bị ép mềm nhũn!"
1562 = "Để đầu ngực lọt qua kẽ tay rồi kẹp chặt lại.\\nChôn vùi những ngón tay vào sức nặng đẫy đà ấy mà nắn bóp liên tục."
1564 = "Áp quy đầu vào cửa mình ướt sũng, nhưng em không đút vào.\\nEm trượt dọc theo rãnh môi lớn, cọ xát thật chậm rãi hết chiều dài của nó."
1567 = "Đơn điệu, chỉ đơn điệu với nhịp điệu và tốc độ mà Mayami thích nhất.\\nThế nhưng tiếp theo đây, từ lúc này trở đi——"
1569 = "Lưỡi em tự động cử động. Sữa mẹ em mong muốn chẳng thấy đâu,\\nchỉ thấy toàn vị mồ hôi, nhưng vị ngọt ngào lại chảy vào từ đôi tai em."
1571 = "Dù vậy, cuối cùng, lông mu của em cũng chạm vào chị Mayami.\\nĐến mức này rồi, thực sự chỉ còn một chút nữa thôi——nhưng mà——"
1573 = "Em kề mũi lại gần bộ phận sinh dục đang co giật và ướt đẫm.\\nMùi hương ngai ngái phả vào mũi càng làm dương vật của em thêm cương cứng."
1574 = "Vừa thỏa sức trêu đùa bầu ngực và đầu ngực,\\nem vừa ra sức dập hông, ép sâu vào tận cùng rồi xoáy mạnh."
1575 = "Dừng lại. Một chốc.\\nCả chuyển động của hông. Cả bàn tay đang nắn bóp ngực."
1577 = "Mỗi một milimet tiến vào theo sự mời gọi của âm đạo đang co bóp,\\ncảm giác muốn bắn tinh lại trào dâng mãnh liệt đến mức buồn nôn."
1580 = "Em cảm nhận được. Nhịp đập. Hơi nóng. Cả niềm mong mỏi tha thiết.\\nTừ sự mềm mại của bộ ngực đang bị ép chặt, những cảm xúc ấy tuôn trào mạnh mẽ."
1581 = "Chị ấy đang khao khát một cách rõ ràng.\\nEm có thể cảm nhận được sự co bóp thắt chặt."
1583 = "Không thể thốt nên lời. Em đang phải cắn chặt răng.\\nKhông phải hông mà là lỗ hậu môn. Em tập trung ý thức vào đó và siết chặt lại."
1584 = "Trượt ngược lại đường cũ, khi quy đầu vừa hơi lún vào cửa mình,\\nem cảm nhận được sự run rẩy, sự mong đợi của chị Mayami truyền đến."
1587 = "Vừa gật đầu, em lại vừa cảm thấy một sự ghen tị vô cớ.\\nBởi vì hai cơ thể đang dán sát vào nhau này quá đỗi mềm mại và ấm áp."
1594 = "Phòng ngủ của hai vợ chồng sau khi kết thúc tuần trăng mật.\\nDù chỉ là đi du lịch ở gần đây, nhưng chuyến đi vẫn là chuyến đi, em cảm nhận rõ rệt cảm giác trở về nhà."
1600 = "Đầu ngực hãy còn mềm mại áp vào môi em. Ngay lập tức——"
1607 = "Như để thay thế cho tinh dịch đang bị kìm nén,\\nmồ hôi túa ra đầm đìa từ từng lỗ chân lông."
1611 = "Tiếng nhóp nhép, chùn chụt của nước vang dội khắp căn phòng,\\nđộ nhớt và độ ẩm cứ tăng lên theo từng giây. Thế mà——"
1613 = "Đang trào dâng. Tinh dịch sôi sùng sục mãnh liệt trào lên——\\nCửa tử cung của chị Mayami, áp chặt quy đầu vào chỗ đó"
1628 = "Đáng yêu quá mức khiến thứ gì đó bùng nổ, không thể dừng lại được nữa!"
1629 = "Chị Mayami ngậm ngón tay vào miệng. Nước bọt trào ra từ ngón tay chị ngậm,\\nchảy ròng ròng dọc theo độ cong của bầu ngực."
1632 = "Kê gối dưới lưng, từ đó nâng hông lên cao hơn nữa——\\nChị Mayami nâng cao hạ bộ, phơi bày ra ngay trước mắt em."
1634 = "Chị Mayami ôm trọn lấy em.\\nBằng bộ ngực, bằng giọng nói, bằng hơi ấm của chị."
1635 = "Giọng nói dịu dàng. Một cái gật đầu khẽ. \\nBầu ngực rung rinh nhẹ nhàng cọ vào mặt em."
1638 = "Từ tinh hoàn đến hậu môn. Bốn ngón tay\\nnhung nhúc luồn lách giữa hai nơi đó. Trêu đùa vần vò."
1642 = "Trong chăn, những ngón tay của chị Mayami khẽ khàng chuyển động.\\nChị nhẹ nhàng lấy dương vật đang cương cứng của em ra, rồi trượt ngón tay dọc theo rãnh quy đầu."
1644 = "Hơi thở nóng hổi và ẩm ướt.\\nPhả nhẹ vào quy đầu khiến em cảm thấy nhồn nhột."
1645 = "Giọng nói của chị ấy đã đượm vẻ ướt át, làm ướt sũng cả người em."
1646 = "Giọng nói của chị Mayami vẫn êm ái như mọi khi.\\nNhưng đêm nay, pha lẫn trong đó không phải là sự ngái ngủ, mà là sự ướt át."
1648 = "Thay cho lời nói.\\nChị Mayami ôm chầm lấy em thật chặt, thật chặt."
1649 = "Chị Mayami chậm chạp thay đổi tư thế.\\nBầu ngực rời khỏi em. Thay vào đó——"
1663 = "Bị mắng, dương vật đang cương cứng của em khẽ run lên.\\nEm chỉ cảm nhận rõ từng nhịp đập thình thịch, thình thịch."
1665 = "Đồng thời em cũng bị siết chặt. Cảm giác như những con sên đang phát sốt\\nvì quá đông đúc mà quằn quại tìm đường thoát thân vậy——"
1666 = "Chầm chậm, chầm chậm. Dương vật cương cứng đang dần bị âm đạo nuốt chửng.\\nSự co bóp của âm đạo chị Mayami đang mời gọi em."
1669 = "Được tiếp nhận. Nơi sâu nhất của âm đạo, cổ tử cung.\\nNgay lập tức, như thể ở đó có một thiết bị xác thực vậy——"
1670 = "Hòa làm một ngay tức khắc. Dương vật và âm đạo tan chảy vào nhau.\\nBên trong âm đạo vốn chật chội nay nhờ sự ướt át mà trở nên mềm mại!"
1684 = "Buông lơi đầu lưỡi, những nụ hôn mổ nhẹ như chim non mang đầy tình yêu thương.\\nEm cũng đáp lại bằng những nụ hôn tương tự——rồi chợt, ánh mắt hai người chạm nhau."
1692 = "Chưa kịp nói hết câu, chị Mayami đã phơi bày bầu ngực đẫy đà của mình ra.\\nRồi chị để em gối đầu lên đùi và nằm xuống……"
1701 = "Đôi gò bồng đảo quá đỗi đẫy đà này, rồi sẽ có ngày em không còn được độc chiếm nữa.\\nDù tự nhủ rằng sao lại đi ghen tị với chính đứa con tương lai của mình chứ, nhưng mà"
1702 = "Lần này là ngậm thẳng, và ngậm thật sâu.\\nNhư thể thu trọn toàn bộ từ đầu ngực cho đến quầng vú vào trong khoang miệng."
1703 = "Hơn cả lần đầu tiên làm tình, hơn cả khoảnh khắc trong lễ cưới\\n——Tận sâu thẳm trong lòng, em cảm nhận được mình đã \"trở thành một người đàn ông\"."
1704 = "Một tính chiếm hữu quá sức vớ vẩn.\\nEm không thể nào nói ra được, nhưng cũng chẳng muốn nói dối——!"
1705 = "Nghe chị nói em mới nhận ra. Vì quá say sưa mút mát,\\nmà em đã ngậm chéo bầu ngực, ngậm chéo đầu ngực của chị Mayami mất rồi."
1709 = "Một cú siết chặt quá đỗi tàn bạo.\\nNhưng cuối cùng thì——cuối cùng, nhờ nó, mà——"
1710 = "Bất ngờ, một cú siết quá đỗi mãnh liệt!\\nChính em cũng không thể tin nổi là mình lại có thể kìm nén được việc bắn tinh."
1717 = "Khoái cảm khi chất hồ dính nhớp nháp tuôn trào một mạch qua niệu đạo.\\nNếu không phân tán sự chú ý, đầu óc em sẽ phát điên mất——"
1718 = "Quy đầu của em bị vuốt ve một cách trơn tuột.\\nBằng những ngón tay ướt đẫm nước bọt của chị Mayami——"
1800 = "（Nắn nắn——bóp bóp——xoa xoa——nhào nhào）"
