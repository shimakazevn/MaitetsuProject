[script]
656 = "——Nhìn tấm lưng rộn ràng ấy, tôi cũng thấy an tâm sâu sắc.\\nSự an tâm ấy lại một lần nữa khiến tôi cảm nhận rõ rệt sự nhỏ bé của nó."
657 = "——Cảm giác như bàn tay ấy đã mất đi nơi nương tựa,\\nnên tôi nắm chặt lấy nó bằng chính đôi tay mình."
668 = "……Hachiroku không dùng mũ gội đầu.\\nNói cách khác, em ấy hẳn là một Railord đã vượt qua mức trưởng thành rồi."
672 = "……Vì Reina đang ra sức kỳ lưng cho chị Mayami,\\nnên toàn bộ tấm lưng của cô bé cứ lắc lư liên tục."
678 = "……Chị Mayami rất thông minh. Hơn nữa chị ấy còn yêu tôi.\\nTôi có thể cảm nhận được rằng, điều đó đã hoàn toàn được truyền đạt."
681 = "……Bắt đầu tò mò không biết đó là căn phòng như thế nào rồi.\\nKhi nào về nhà, phải xin xem album ảnh mới được."
682 = "……Giọng nói rõ ràng đã nhỏ đi, nhưng chuyển động thì chẳng thay đổi mấy.\\nTôi bất giác bật cười."
683 = "「Cả việc không thể dịu dàng với Michiko. Cả vụ tai nạn.\\nCả những ngày tháng ôm hận mọi thứ, chỉ dùng sự căm ghét để chống đỡ bản thân」"
687 = "「——Rằng xưởng rượu không hợp với Hii-chan,\\nđó không phải là nơi để Hii-chan sống」"
688 = "「——Ừ」"
689 = "「——Đúng vậy nhỉ. Chị cũng cảm thấy chói lóa.\\nHii-chan, nhìn chuyến tàu đó」"
697 = "「『Tài năng như vậy』. Thật sự, là vậy nhỉ.\\nChị, lần đầu tiên được tiếp xúc với thứ như thế, nên lỡ」"
699 = "「…………」"
702 = "「…………Vậy, sao」"
704 = "「…………Ấm áp thật đấy, rất ấm áp」"
705 = "「……」"
717 = "「……Chắc là vậy.\\nTài năng của Hibiki, anh cũng cảm thấy đó là một tài năng như vậy」"
720 = "「……Nhưng mà, chị lập tức hối hận ngay.\\nRằng chị không được phép áp đặt điều đó lên con bé」"
722 = "\"「……Ưm.」\""
724 = "「……Ừ. Đúng là có thể sẽ thành ra như vậy.\\nNhưng mà, cũng có thể sẽ không phải vậy」"
725 = "「……Ừ, đúng vậy thật」"
727 = "「……Chúng ta cũng đã trở thành vợ chồng rồi nhỉ」"
728 = "「……Tuyệt thật nhỉ. Phong vị của chuyến tàu cuối cùng」"
731 = "\"「……Nếu đúng là vậy, thì phải chi\\nPaulette cũng hiểu được lòng Reina thì tốt biết mấy.」\""
905 = "\"「!」\""
1038 = "\"「Chắc chắn là vậy rồi.」\""
1043 = "「Đã căng sức, lại còn phấn khích nữa.\\nNói thật là anh cũng từng lo không biết em ấy sẽ làm hướng dẫn viên thế nào」"
1044 = "「Tất nhiên là sức hấp dẫn của thành phố Ohimitera, và cả sức hấp dẫn của chị Mayami nữa」"
1045 = "「Không giả vờ như đã hiểu, đó là sự thành thật đấy.\\nChứng tỏ Pau-chan, rất trân trọng bé Reina」"
1047 = "「Cả truyện tranh, sách tranh, hay từ điển hình ảnh.\\nChỉ cần là sách có vẽ hình, thì cái gì cũng thích. Bây giờ cũng vậy」"
1049 = "\"「Không chịu đâu ạ~. Reina không với tới lưng được,\\nnên muốn được chị kỳ lưng cho cơ——A!」\""
1050 = "「Không, không có gì」"
1052 = "「Không, nếu là chuyện đó thì」"
1056 = "\"「À không,\\nđúng là Reina lớn tuổi hơn chúng ta rất nhiều mà.」\""
1058 = "\"「Ra là vậy, em——chúng ta,\\nsẽ nuôi dưỡng gia đình của chúng ta, tổ ấm của chúng ta sao.」\""
1061 = "「Thì là trẻ con mà. Nhưng mà nhé? Cũng quen nhanh lắm,\\nrồi Hii-chan lại lên tầng trên ngủ」"
1064 = "「Trời ạ. Nhất định anh phải xem mới được」"
1069 = "「Nhưng, Hibiki của hiện tại thì biết.\\nNếu là Hibiki đang sống rất sôi nổi, tận hưởng công việc mỗi ngày」"
1071 = "「Nhưng mà, khoảng thời gian đó, không kéo dài được lâu」"
1073 = "\"「Bình thường em không nhờ Po-chan gội đầu cho à?」\""
1075 = "「Có lẽ em đang hăng hái quá rồi. Nếu em bớt cử động lưng lại một chút,\\nthì anh sẽ đỡ vất vả hơn nhiều đấy」"
1077 = "「Không có gì phải xin lỗi đâu.\\nChị——chị, vui lắm」"
1079 = "\"「Chị Mayami quả thực là một người chị lớn.\\nĐến mức Reina——thậm chí cả Hachiroku cũng muốn làm nũng.」\""
1081 = "\"「Vậy thì tốt quá.」\""
1083 = "\"「Trở nên như thế nào á, nghe tủi thân thế.\\nPhải nuôi dưỡng nó theo cách mà Sou-chan muốn chứ.」\""
1085 = "「Nếu đây không phải là trên tàu,\\nchị đã ôm chầm lấy Sou-chan rồi——vui đến mức đó luôn」"
1087 = "「Nấu ăn! Reina, muốn thử làm ạ!\\nNhưng mà nhưng mà, Reina, là Railord mà——」"
1091 = "「Dù vậy, nếu là tắm chung thì vẫn được mà.\\nChỉ cần chị mở lời rủ, thì chắc chắn là được」"
1092 = "\"「Dù có hiểu lầm, dù có tức giận, thì cũng không thể nào ghét nhau được.\\nTừ tận sâu thẳm trong lòng, dù thế nào đi nữa họ cũng đã tha thứ cho nhau rồi.」\""
1093 = "「Bị lay động tâm can sao」"
1097 = "「Chị cũng vậy đó, biết không? Chị cũng từng nghĩ đến những điều tương tự.\\nRằng, chị cũng muốn được dành thời gian như thế này cùng với Hii-chan」"
1100 = "\"「Vèo cái là không chịu đâu ạ~. Anh phải kỳ từ từ thôi đó nha~.\\nÀ, nhưng mà, anh Soutetsu chỉ kỳ nửa bên phải thôi nhé.」\""
1102 = "\"「Lực vừa vặn lắm, sướng cực kỳ luôn ạ~.\\nCảm giác như mọi vết nhơ trong lòng đều được gột rửa sạch sẽ vậy đó nha~」\""
1104 = "\"「Đến nơi mà chúng ta muốn đến. Trở thành hình dáng mà chúng ta mong muốn.」\""
1111 = "\"「Chỉ thỉnh thoảng thôi. Thậm chí có những lúc em ấy còn tỏ ra người lớn hơn cả Hachiroku.\\nNhưng mà, nếu chỉ nói riêng Reina của ngày hôm nay thì……」\""
1113 = "\"「Chỉ nửa bên phải thôi à. Đã rõ.」\""
1114 = "\"「Chỉ mong rằng, cho đến tận cuối hành trình của em.\\nChị Mayami——hãy cùng em đi hết chuyến đi này.」\""
1116 = "「Được thôi? Về nhà chị sẽ cho xem.\\nChị giấu Hii-chan, cất giữ cẩn thận lắm đó」"
1118 = "「Nếu bị nghĩ là phiền phức,\\nthì Reina, không thích thế đâu ạ」"
1120 = "「!」"
1121 = "「!!!!」"
1123 = "「Fufu」"
1125 = "\"「Ưm fufu, ra là vậy.」\""
1127 = "\"「Ưm fufu, được đấy. Đúng kiểu con trai nhỉ.」\""
1128 = "\"「Ưm fufu, có khi Rei-chan\\nđã nương theo chị cũng nên.」\""
1130 = "\"「Ưm fufu, đã rõ.\\nNhờ em kỳ cho lưng chị thật sạch nhé?」\""
1132 = "「Ưm fufu, đúng vậy. Sở thích của đứa trẻ đó không hề thay đổi.\\nKhuôn mặt vẫn là của thường ngày, chỉ là thêm chút xíu điệu đà thôi」"
1133 = "「Khò……khò……khò……khò」"
1135 = "\"「Từng chút, từng chút một trở thành gia đình.\\nTừ trong những tháng ngày hạnh phúc đó, em lại có được một hạnh phúc to lớn hơn nữa.」\""
1137 = "\"「Oaaa!\\nNếu là ba người thì Reina sẽ ở giữa đó nha~」\""
1139 = "「Oa! Đúng vậy ha.\\nDzo, dzo, dzo, dzo」"
1140 = "「Oa! Giường tầng」"
1141 = "\"「Haha,\\nReina làm gì có vết nhơ nào trong lòng chứ.」\""
1143 = "\"「Ôi chà.」\""
1145 = "「Ây da ây da Sou-chan, sao thế」"
1146 = "\"「Ôi chà, cảm ơn em. Tất nhiên là hoan nghênh rồi.\\nNè? Sou-chan thì sao? Có muốn kỳ cọ cho nhau không?」\""
1149 = "「Ehehe. Để cảm ơn chị đã dạy nấu ăn,\\nReina sẽ cố gắng hơn nữa, kỳ lưng cho chị thật sạch nha」"
1150 = "\"「Ehehe, vậy Reina tiếp tục nha~」\""
1152 = "「Hả?」"
1153 = "\"「À……」\""
1154 = "「Ưm……để xem」"
1155 = "\"「Ưm……hơi nhẹ quá thì phải.\\nEm kỳ mạnh hơn chút xíu nữa thì tuyệt lắm.」\""
1157 = "「Nmyu……n……a……\\nFuwaaaaaaaa」"
1158 = "\"「A……」\""
1160 = "「A. ……Sou-chan」"
1161 = "「A」"
1162 = "「À——」"
1164 = "\"「Au……Không phải vậy đâu ạ~」\""
1166 = "\"「A! Chị hiểu cảm giác đó, bồng bềnh!\\nỪm——bồng bềnh nhỉ. Vẫn còn chỗ nào đó chưa thực sự ổn định.」\""
1167 = "\"「A, chị hiểu ý em rồi.\\nVậy lát nữa, chị sẽ kỳ nửa bên trái cho em nhé?」\""
1169 = "\"「A, thỉnh thoảng Sou-chan cũng nói thế nhỉ.\\nRằng Rei-chan rất người lớn.」\""
1172 = "\"「À, nếu là cái đó thì đương nhiên rồi.\\nVì chị, là chị mà lị.」\""
1173 = "「Funyaa」"
1174 = "\"「Ừm. Cho đến tận cuối hành trình của chị.\\nSou-chan, hãy cùng chị bước tiếp nhé?」\""
1177 = "「Ừ. Rồi, chị nghĩ không thể để Hii-chan sống mòn ở xưởng rượu được……\\nMột cảm xúc giống như sự cảm động, khiến chị như bay bổng lên」"
1178 = "\"「Ừm.」\""
1180 = "「Ufufuu, hai anh chị, đang trong tuần trăng mật mà nha?\\nChuyện đó là đương nhiên rồi ạ」"
1182 = "「Ưm fufu, là tuần trăng mật mà lị」"
1183 = "「Ufufuu, hãy để nó trở nên ấm áp hơn nữa nha!」"
1185 = "「Ừ ừ」"
1186 = "\"「Ừ ừ. Cảm ơn em.\\nVừa vặn lắm rồi.」\""
1189 = "\"「À, đúng rồi nhỉ. Là trưởng thành. Thực sự là vậy.」\""
1191 = "「Ừ. Dù vậy nếu em vẫn muốn truyền đạt,\\nthì chỉ còn cách tìm đủ mọi cách, lặp đi lặp lại nhiều lần thôi」"
1192 = "「Ừ. Hii-chan hiếm khi vòi vĩnh lắm nha.\\nChắc là xem trên truyện tranh hay gì đó, nên thích mê luôn」"
1195 = "「Ừ. Chị biết mà. Khoảng thời gian đó, tất cả đã dẫn đến,\\nHii-chan tuyệt vời của hiện tại」"
1197 = "「Ừ. Anh thấy rất vui.\\nNhờ có Reina, anh lại một lần nữa nhận ra sức hấp dẫn của nơi này」"
1199 = "\"「Ừm. Sou-chan, chị và mọi người cùng nhau làm điều đó.」\""
1201 = "「Ừm. Chói lóa thật. Vì Hibiki của hiện tại rất tự do.\\nBay lượn theo ý muốn, vỗ đôi cánh mạnh mẽ hơn bất kỳ ai」"
1203 = "\"「Ừm. Mấy việc đó em ấy làm tuy thong thả nhưng rất chu toàn.\\nThế nên——nói là nương theo thì……có lẽ là bị cuốn theo mới đúng.」\""
1204 = "\"「Hửm? Cả em nữa à?」\""
1207 = "\"「Ufufu~! Chính xác luôn ạ~」\""
1208 = "「Dzo, dzo, dzo, dzo」"
1210 = "\"「Ufufu~, lưng chị Makura to quá nha~」\""
1212 = "\"「Phù——ehehe, ào một cái sướng quá đi ạ~.\\nReina quên mang theo mũ gội đầu đúng là may quá nha~」\""
1214 = "「Hô. Chị Mayami và Hibiki dùng sao?」"
1220 = "\"「Ha-chan cũng là gia đình mà.\\nViệc con bé làm nũng——hay nói đúng hơn là làm nũng với nhau là chuyện đương nhiên mà.」\""
1221 = "「Được yêu thương mà. Đứa trẻ này được yêu thương rất nhiều, và chắc chắn là mãi mãi.\\nNên mới dịu dàng. Vì dịu dàng, nên mới được đối xử dịu dàng」"
1222 = "「Bởi vì chị, đã đuổi Hii-chan đi mất rồi」"
1223 = "「Nhưng mà, vì không có thời gian nên không thể cải thiện thói quen ăn uống được.\\nNên để không động chạm đến chuyện đó, mới phải lén lút」"
1224 = "「Vì chị Mayami, lúc nào cũng bận rộn mà」"
1227 = "「Mọi người cùng quay ngoắt sang hướng ngược lại nha.\\nLần này Reina, sẽ kỳ lưng cho anh Soutetsu ạ!!」"
1228 = "\"「Nhí nhảnh đến mức em muốn dùng từ ngây thơ để miêu tả luôn.\\nCó lẽ Reina cũng đã chơi đùa cùng chị Mayami——cùng chúng ta đấy.」\""
1231 = "\"「Hai người họ luôn quan tâm đến nhau.\\nNhưng cũng chính vì quan tâm nên mới sinh ra hiểu lầm.」\""
1233 = "「Em ấy đang vẽ sao?」"
1235 = "「Chắc là em ấy mệt lắm rồi. Hôm nay đã căng sức cả ngày,\\ncố gắng làm hướng dẫn viên cho chúng ta mà」"
1236 = "\"「Chị ấy bảo 『Xin lỗi Reina. Chị biết rồi nhưng mà chị bận quá』.\\nReina cũng biết là chị ấy bận, nhưng mà, dù vậy thì.」\""
1239 = "「Từ lúc nhỏ xíu thế,\\nHibiki đã thích truyện tranh rồi sao?」"
1240 = "\"「Vâng ạ~. Chị Makura cũng nhớ nói cho Reina biết nhé.」\""
1242 = "\"「Ăn uống. Ăn uống đàng hoàng quan trọng lắm đấy.」\""
1247 = "\"「Được rồi, Rei-chan. Chị xả dầu gội nhé,\\nnhắm chặt mắt lại nha~」\""
1248 = "「Nếu chị muốn làm mà không thành hiện thực.\\nThì không phải là 『Không làm』 mà là 『Không thể làm』. Chắc chắn là vậy」"
1250 = "「Nếu em nói gì đó. Người ta bảo 『Chị hiểu rồi』 để em yên tâm.\\nNhưng sau khi an tâm rồi lại bị phản bội, thì còn đau lòng hơn nhiều」"
1252 = "「Nếu phần quan trọng nhất của một hướng dẫn viên\\nlà 『giúp khách hàng tận hưởng chuyến đi』, thì em ấy đã đậu điểm tuyệt đối rồi」"
1255 = "\"「Gia đình, sao.」\""
1256 = "\"「Gia đình luôn thay đổi. Và trưởng thành qua những thay đổi đó.」\""
1262 = "「Xin lỗi. Không phân biệt hoàn cảnh——\\nlại lỡ, say sưa quá mất rồi」"
1263 = "\"「Đúng vậy ạ. Nhưng mà Paulette cứ hễ bận rộn,\\nlà lại toàn ăn mấy cái thanh năng lượng hay thạch trái cây thôi.」\""
1264 = "「Đúng. Toàn bộ căn phòng nhìn từ trên giường.\\nKhông chỉ thế đâu……ưm fufu, cả khuôn mặt lúc ngủ của chị nữa」"
1268 = "「Hii-chan á? Việc con bé ghét xưởng rượu……hay đúng hơn là,\\nviệc con bé cảm thấy sợ hãi, đều là do chị cả」"
1271 = "「Hii-chan……hồi đó giỏi làm nũng lắm.\\nNên bố mua cho ngay lập tức」"
1272 = "「Hii-chan nhé? Rất thích xưởng rượu, nên đã vẽ nó cho chị xem.\\nKhi chị nhìn thấy nó——khi lỡ nhìn thấy nó. Chị đã 『À』 lên một tiếng」"
1274 = "「Hii-chan, là chú chim có thể bay cao hơn bất kỳ ai mà」"
1275 = "「Sou-chan……」"
1276 = "「Cảm ơn em, Sou-chan. Nhờ Sou-chan đã nói vậy,\\nmà chị, thực sự cảm thấy nhẹ nhõm hơn rất nhiều」"
1280 = "\"「Như hôm bữa đó, Reina và Paulette……\\nđã hơi cãi nhau một chút……」\""
1283 = "「Lén lút là vì chị ấy đã hiểu được tâm ý của em đó.\\nHiểu nhưng không thể sửa đổi được, nên mới thấy có lỗi」"
1284 = "「Chính vì như bình thường nên mới nói đó ạ! Rõ ràng Reina đã cố gắng\\nbảo chị ấy 『Chị phải ăn uống đàng hoàng mới được nha』 rồi mà」"
1286 = "「Sự hối hận đó, đã trói buộc chị Mayami suốt thời gian qua sao」"
1288 = "「Dù có bước vào chiếc lồng chim mang tên xưởng rượu, thì nếu cứ bịt kín lối vào……\\nChỉ cần vậy thôi, chắc chắn con bé sẽ tự mình bay đi mất——」"
1290 = "「Dù vậy, em vẫn muốn truyền đạt đúng không?」"
1302 = "\"「Được gắn kết với chị Mayami, được kết hôn với chị.\\nTừ đó, 『Gia đình』 của em lại bắt đầu bồng bềnh lên.」\""
1304 = "「Từ hồi đó là đã, sột soạt, sột soạt,\\nnghe thấy tiếng vọng xuống từ tầng trên rồi」"
1310 = "\"「Làm sao mà Reina ghét chị ấy được chứ ạ!\\nVì cực kỳ yêu quý nên mới lo lắng——」\""
1311 = "\"「Không có chuyện đó đâu. Nếu là nương theo thì em ấy phải\\nlàm một hướng dẫn viên bài bản theo đúng nhịp độ của mình mới đúng.」\""
1312 = "\"「Chăm sóc gì đâu chứ.\\nChị đã được con bé chơi cùng rất nhiều mà.」\""
1313 = "「Đủ mọi cách……\\nLà thử thay đổi cách nói chuyện sao ạ?」"
1320 = "\"「Chị nằm giường nào cũng được.\\nSou-chan chọn giường em thích thì chị sẽ vui hơn.」\""
1322 = "「Anh không biết. Anh không phải là Hibiki. Chỉ là anh đang thử phóng chiếu\\nkinh nghiệm của chính mình lên Hibiki mà thôi」"
1324 = "「Chị cũng nghĩ vậy đó.\\nPau-chan, cũng đang cố gắng hết sức để tỏ ra như bình thường mà」"
1327 = "「Chẳng có cộng cảm, nói chuyện cũng không hiểu nhau,\\ncứ như thể Reina, không còn hiểu gì về chị Paulette nữa vậy」"
1328 = "\"「Gia đình của chúng ta, từ nay sẽ trở nên như thế nào nhỉ.」\""
1330 = "「Lúc anh hỏi xem Reina có thể làm hướng dẫn viên được không,\\ncả Paulette và Reina trông vẫn như bình thường mà」"
1331 = "「Anh yêu em, chị Mayami.\\nVà, anh vô cùng——vô cùng vô cùng vô cùng biết ơn em」"
1333 = "\"「Em đã từng một lần đánh mất gia đình vì sự ngu ngốc của bản thân.\\nNhưng chính nhờ việc đánh mất gia đình đó, em mới trở thành một thành viên của gia đình mới.」\""
1336 = "\"「Đó là do Rei-chan quan tâm đến Po-chan thôi mà.\\nĐâu phải cãi nhau, chỉ là hiểu lầm chút xíu thôi.」\""
1337 = "「Cố gắng hết sức, là sao ạ?」"
1340 = "「Hiện đại cơ à.\\nChà chà, đúng là Hibiki thật đấy」"
1342 = "「Đặt ở phòng nào vậy?」"
1348 = "\"「Dù đường ray của Hibiki hay đường ray của Hachiroku,\\nbiết đâu đến một lúc nào đó sẽ phải rẽ sang một hướng khác.」\""
1351 = "「Hibiki là người cực kỳ trọng tình nghĩa. Đã thế lại còn một lòng một dạ.\\nNếu đã quen với cuộc sống ở xưởng rượu, có khi em ấy sẽ tự nhốt mình lại cũng nên」"
1353 = "「Reina, lo lắng đến thế cơ mà, chị Paulette vẫn cứ\\nlén lút ăn mấy thứ như thạch thay cơm」"
1355 = "\"「Reina hiểu rồi ạ~, mạnh hơn chút xíu nhé.\\nDô ta, dô tà——Thế này được chưa ạ~?」\""
1357 = "\"「Đã rõ. Tóm lại là như thế này nhỉ.」\""
1359 = "「Là vậy……sao.\\nNếu được vậy thì chị, cũng được cứu rỗi rồi」"
1361 = "\"「Đúng vậy.」\""
1362 = "「À……」"
1364 = "「A……ừ. Đúng là vậy thật」"
1365 = "「Đúng vậy」"
1367 = "\"「Đúng vậy. Dù những thành viên trong gia đình ban đầu không hề thay đổi,\\nnhưng mối quan hệ giữa chúng ta đã có chút khác biệt.」\""
1368 = "\"「Vậy sao?」\""
1373 = "\"「Được chơi cùng à, nghe hay đấy.」\""
1375 = "「Vì có Reina làm hướng dẫn viên,\\nnên anh mới có thể cảm nhận sâu sắc đến vậy」"
1378 = "\"「Tình mẫu tử. Chị làm gì có thứ đó chứ.」\""
1379 = "「Không đâu, em đã làm hướng dẫn viên rất tuyệt vời.\\nNhờ có Reina, anh đã có thể một lần nữa cảm nhận sâu sắc sức hấp dẫn đó」"
1380 = "「Không đâu ạ, giống như người họ hàng xa của Reina……\\nBé Kurenai của Tuyến đường sắt Nansatsu cũ, nấu ăn cực kỳ giỏi luôn nha」"
1381 = "「Đúng vậy. Anh cũng cảm nhận được rằng, 『Ohimitera trong mắt Reina』,\\nquả thực là một nơi ấm áp như ánh nắng mặt trời」"
1382 = "「Đúng vậy đó. Cách truyền đạt, thời điểm truyền đạt. Tùy vào những điều đó,\\ncó khi những thứ hoàn toàn không lọt tai, lại dễ dàng được thấu hiểu đấy」"
1383 = "\"「Đúng vậy nhỉ. Nghe câu chuyện hôm nay,\\nchị cũng cảm thấy như thế.」\""
1384 = "「Đúng vậy. Nếu tỏ ra gượng gạo,\\nthì chỉ càng làm bé Reina buồn thêm thôi」"
1392 = "\"「Paulette và Reina cũng là gia đình nhỉ.\\nDù giữa họ chẳng hề có chung huyết thống.」\""
1393 = "\"「Nói chính xác hơn là, bởi tình mẫu tử của chị Mayami.」\""
1394 = "\"「Sao em lại lo lắng là 『chắc chị ấy không hiểu đâu』 thế?」\""
1399 = "「Vậy thì vậy thì dù có bận rộn đến mấy,\\nchị Paulette, nhất~định sẽ ăn nha」"
1400 = "\"「Thế rồi Po-chan nói sao?」\""
1401 = "\"「Nên Reina mới bảo là 『Không ăn uống đàng hoàng là không được đâu nha~』\\nReina lo lắng quá nên đâm ra cáu gắt luôn.」\""
1404 = "\"「Reina……chỉ là,\\nmuốn Paulette ăn uống đàng hoàng thôi ạ.」\""
1406 = "\"「Reina là một Railord trưởng thành rồi mà.\\nChỉ cần có mũ gội đầu là Reina có thể tự gội được luôn đó nha~」\""
1408 = "「Reina cực kỳ yêu quý chị Paulette, không muốn\\nbị nghĩ là phiền phức, nhưng chỉ riêng chuyện ăn uống thì——」"
1410 = "\"「Lưng của Reina thì lại nhỏ xíu.\\nChắc vèo cái là kỳ xong rồi.」\""
1412 = "\"「Reina nhận lệnh rồi ạ~.\\nDô ta, dô tà. Dô ta, dô tà.」\""
1414 = "「Reina, nếu học được cách nấu ăn,\\nthì có thể nấu cơm cho chị Paulette ăn rồi nha」"
1416 = "\"「Reina muốn kỳ cọ cho nhau cơ!\\nLưng của chị Makura, để Reina kỳ cho được không ạ~?」\""
1417 = "\"「Reina thấy sao?」\""
1420 = "\"「Nè, chị nghe được không?\\nChuyện gì mà hai người lại cãi nhau vậy?」\""
1421 = "「Reina. Đã hiểu là mình được trân trọng rồi ạ.\\nNhưng mà, dù vậy thì——chuyện ăn uống vẫn rất quan trọng mà」"
1422 = "「Anh cảm thấy tấm lưng của Reina quá đỗi nhỏ bé.\\n——Nhưng tấm lưng của Michiko, còn nhỏ bé hơn thế nữa」"
1423 = "\"「Đương nhiên rồi.」\""
1424 = "「Tất nhiên rồi! Để chắc ăn hơn,\\nchị sẽ dạy em những món có thể ăn nhanh gọn lẹ luôn」"
1425 = "\"「Chắc chắn là có. Nếu dùng từ tình mẫu tử nghe hơi quá thì……\\nĐể xem nào, gọi là 『Sự ra dáng một người chị lớn』 cũng được.」\""
1429 = "「Thật ngây thơ.\\nKhi ngủ, trông con bé hoàn toàn giống một đứa trẻ」"
1431 = "「Đúng là trẻ con nhỉ」"
1433 = "「Thật sao ạ!\\nVậy thì vậy thì, hãy dạy Reina nấu ăn nha」"
1437 = "\"「Chị Makura, thấy sao ạ~?」\""
1440 = "\"「Reina biết rồi ạ~. Nhắm chặt đây ạ~」\""
1446 = "「Đúng vậy」"
1447 = "「Đúng thật nhỉ. Có bé Reina ở đó,\\nchắc chắn mọi người cũng sẽ dần trở nên dịu dàng hơn」"
1449 = "\"「Chị mệt rồi đúng không. Lịch trình hôm nay kín mít,\\nlại còn phải chăm sóc Reina suốt nữa.」\""
1450 = "「Waai! Em cảm ơn ạ!!」"
1453 = "「Một vòng tuần hoàn tốt đẹp. Vì thế, anh——\\nNgười như anh thì……」"
1460 = "\"「Bị cuốn theo á, bởi cái gì?」\""
1462 = "「Chị, dạy em nấu ăn nhé」"
1465 = "「Giá như anh có thể dịu dàng hơn……\\nBất chợt, anh đã nghĩ như vậy」"
1470 = "「Fua!? A!? Waa, Reina ngủ quên mất rồi!?\\nXin lỗi ạ, rõ ràng Reina đang làm hướng dẫn viên mà」"
1471 = "「Lời nói là không bao giờ đủ.\\nDù có dâng hiến toàn bộ thời gian của mình, anh cũng không biết có đủ hay không」"
1472 = "「Nên là, Pau-chan không thể hứa suông được」"
1473 = "\"「Bằng chứng là, Rei-chan,\\nem đâu có ghét Po-chan chút nào đâu đúng không?」\""
1474 = "\"「Thay đổi sao……là trưởng thành mới đúng chứ? Chắc chắn là vậy.」\""
1486 = "「Chịu thôi. Chuyện quá khứ mà, chỉ là giả định.\\nĐáp án chính xác, dù có hỏi chính Hibiki thì em ấy cũng làm sao mà biết được」"
1487 = "「Nghe nói là giường ngủ loại B mở.\\nVốn dĩ có thể chứa đến 4 người, nhưng hôm nay là của riêng chúng ta」"
1488 = "「Ra là vậy……đúng là thế nhỉ」"
1489 = "\"「Vậy thì đó là biểu hiện của một trái tim nhân hậu và thuần khiết đấy chứ.\\nVết nhơ cái gì, làm gì có chuyện đó.」\""
1490 = "\"「Vậy sao. Nếu vậy thì em sẽ nằm tầng trên.」\""
1499 = "「Tất cả những điều đó, đối với khoảng thời gian được ở bên chị Mayami lúc này,\\nanh nghĩ là điều không thể thiếu. Vì vậy, anh đang rất hạnh phúc」"
1500 = "「Thế nào? Theo ý Sou-chan thì sao」"
1502 = "「Thế thì vui quá」"
1504 = "「Vậy thì chắc chắn, bé Reina cũng sẽ trở nên cực kỳ giỏi thôi」"
1506 = "「Cái giường đó nhé? Đêm đầu tiên Hii-chan nằm tầng trên.\\nNhưng ngay lập tức 『Cao quá sợ quá~』 thế là đổi chỗ」"
1509 = "\"「Vậy anh cũng bắt đầu đây.\\nNếu mạnh quá hay yếu quá thì nhớ bảo anh nhé.」\""
1511 = "\"「Vậy chị xả nhé. Ba, hai, một. Ào.」\""
1514 = "「Từ hồi đó Hii-chan đã là Hii-chan rồi, cái giường á,\\n『Cái này đẹp nè!』 con bé chọn một thiết kế rất hiện đại」"
1515 = "「Hồi đó Hii-chan vẫn chưa có phòng riêng.\\nỞ chung phòng trẻ em với chị」"
1516 = "\"「Đương nhiên là bởi chị Mayami rồi.」\""
1517 = "「Vậy thì」"
1518 = "\"「Vậy Reina bắt đầu kỳ lưng đây ạ~!\\nReina sẽ cố gắng hết sức đó nha~」\""
1519 = "「Vậy thì tất cả đều đã góp phần mang lại hạnh phúc cho Hibiki.\\nCả những nỗi buồn, sự cay đắng của cô đơn, hay nỗi đau không được thấu hiểu」"
1520 = "\"「Vậy, chị không kỳ lưng cho em cũng được nhỉ?」\""
1521 = "「Vậy thì, nè? Nếu bé Reina muốn」"
1522 = "\"「Thế, chị Mayami bây giờ thích giường nào hơn?」\""
1523 = "「Railord, thì không được nấu ăn sao?」"
1526 = "「Điều đó đúng là có thể xảy ra.\\nNhưng, anh cũng cảm thấy Hibiki có thể đã không bay khỏi lồng chim」"
1527 = "「Giường tầng. Nhà mình cũng từng có đó.\\nNgày xửa ngày xưa. Từ trước cả khi Sou-chan đến nhà mình nữa」"
1532 = "「!」"
1620 = "Vẫn là nhà tắm Tororyu-yu được bao trọn gói như mọi khi.\\nChỉ có những người tham gia là sự kết hợp chưa từng có."
1626 = "Không hiểu sao,\\ntôi cảm nhận được chút gì đó ướt át trong giọng nói của chị Mayami."
1628 = "Giọng nói nhỏ nhẹ. Cả tôi và chị Mayami.\\nDù trong toa xe hầu như không còn hành khách nào khác."
1631 = "Hai chị em thân thiết ai cũng công nhận.\\nNhưng đâu đó, vẫn có một lớp giấy mỏng manh ngăn cách không thể xé rách——"
1636 = "Nhưng dấu chấm hỏi mỏng manh ấy,\\nđã bị Reina thổi bay một cách nhẹ nhàng."
1638 = "Nhưng, chính vì trong bầu không khí này, và vì đối phương là chị Mayami.\\nNên tôi muốn bày tỏ những gì mình cảm nhận thành lời."
1643 = "Một cử động nhỏ đến mức khó nhận ra.\\nNhưng chị Mayami đã gật đầu một cách rõ ràng."
1644 = "Dù vậy tôi vẫn không thể không nói ra.\\nDù có rõ ràng đến đâu, tôi cũng không thể không dùng lời nói để truyền đạt."
1645 = "Dù khiến tôi giật thót một phen, nhưng nụ cười của chị Mayami vẫn rất đỗi dịu dàng."
1654 = "Chuyến tàu xình xịch tiến về phía trước.\\nChẳng mấy chốc nữa là đến ga bỏ hoang Taragi, nơi chúng tôi sẽ chia tay Reina và xuống tàu."
1670 = "Lưng chị Mayami giật thót cứng đơ, làn da đỏ ửng lên.\\nChà, đây là——ừm, bị chọc ghẹo thì sẽ ngượng ngùng thôi."
1673 = "Em cảm nhận sâu sắc rằng mình đang ở trên một chuyến tàu, đang trên một hành trình.\\nDù toa giường nằm hạng B này đã không còn lăn bánh trên đường ray nữa."
1674 = "Nói đoạn, chị Mayami ngồi xuống giường dưới,\\nnên tôi cũng ngồi xuống bên cạnh."
1676 = "Khi đã quen, em có thể nắm bắt được nhịp điệu chuyển động của Reina.\\nNương theo đó, em cũng chầm chậm đưa miếng bọt biển."
1678 = "Khoảnh khắc nghĩ vậy, tôi chợt hiểu ra.\\nChân tướng của cảm giác bồn chồn cứ bám lấy tâm trí tôi từ nãy đến giờ."
1684 = "Phù, một tiếng thở hắt ra. Một nửa là an tâm——\\nNhưng nửa còn lại nghe như mang theo sự chán nản."
1686 = "Em hiểu cảm giác đó.\\nCả của Paulette, và cả của Reina nữa."
1688 = "Khi ở cùng Reina, tôi cũng đã thấy biểu cảm này không biết bao nhiêu lần.\\nNhư đang bao bọc lấy, ngọt ngào, và vô cùng mềm mại."
1690 = "Bàn tay đang vuốt ve Reina dừng lại.\\nNên tôi cũng ngừng lời. Vì tôi cũng chẳng có ý định thuyết phục chị ấy."
1692 = "Lời khẳng định chắc nịch. Khiến tôi thấy vui lây.\\nMối liên kết của hai chị em quả nhiên, mạnh mẽ đến mức người như tôi không thể đong đếm được."
1693 = "Chị ấy đã hiểu. Chị ấy đã đón nhận nó một cách trọn vẹn.\\nKhoảnh khắc cảm nhận được điều đó, tôi có cảm giác như chính mình cũng được cứu rỗi."
1696 = "Khắc sâu màu đỏ rực rỡ vào trái tim đã khép kín của tôi.\\nNgay cả một người thực tế như Kisaki, cũng bị tài năng của Hibiki mê hoặc."
1700 = "Cả giọng nói và tấm lưng đều bừng sáng."
1701 = "Giọng nói hân hoan, tấm lưng cũng rộn ràng."
1702 = "Giọng nói vô cùng êm ái——à không, nói đúng hơn là,\\ncó lẽ chị Mayami cũng đang buồn ngủ rồi."
1703 = "Vừa nói ra, một cảm giác tươi sáng xen lẫn buồn cười\\nđã trào dâng từ sâu thẳm trong ngực."
1705 = "Phù, một hơi thở hắt ra.\\nNhư thể lẫn lộn giữa tiếng thở dài, sự bối rối, hay cả sự an tâm."
1714 = "Ufufu~, một tiếng cười ngập tràn hạnh phúc vang lên."
1721 = "Bất chợt, khuôn mặt chị Mayami ghé sát lại."
1727 = "Vừa an tâm một cái là bao nhiêu mệt mỏi lập tức ùa về.\\nBọn em hôm nay cũng đã vận động cả ngày, lại còn liên tục đùa giỡn nữa."
1732 = "Trước kia tôi cũng từng trải qua những khoảng thời gian như thế này——\\nKý ức bị đóng kín dần rịn ra, thấm vào từng lời nói."
1735 = "Và thế là, chuyến tàu của chúng em tiếp tục lăn bánh."
1736 = "Nắm lấy tay nhau. Thật dịu dàng và chặt chẽ.\\nGiữ lơ lửng giữa không trung, để không làm phiền giấc ngủ của Reina."
1738 = "Với chị Mayami thì vì là vợ chồng. Còn với Reina thì vì thỉnh thoảng chạm mặt sau giờ làm.\\nEm đã tắm chung với mỗi người không biết bao nhiêu lần rồi."
1740 = "Tôi nhớ lại sự xao động trong lồng ngực lúc đang tắm. Trong bầu không khí yên bình này,\\ntôi cảm thấy đây không phải là điều nên nói ra, nhưng——"
1742 = "Càng ngẫm nghĩ lại, ấn tượng của em càng gom lại thành một màu duy nhất."
1743 = "Em nhớ lại căn phòng của chính mình.\\nVà thoáng nghĩ về những thăng trầm của nó."
1745 = "Tôi nhớ lại. Việc tắm cho Hibiki hồi nhỏ,\\ntừ sau khi tôi được nhận nuôi, đã trở thành nhiệm vụ của tôi suốt một thời gian dài."
1747 = "Cảm giác ấm áp lan tỏa.\\nKhông phải do điều hòa, mà là hơi ấm từ câu chuyện ngày xưa của chị Mayami."
1750 = "Em nắm lấy tay chị.\\nCứ thế lặng lẽ——trao một nụ hôn của lời thề, của sự cầu nguyện."
1751 = "Lời hỏi han mà có lẽ chị ấy đã biết rõ câu trả lời.\\nNên tôi cũng cố tình đáp lại bằng một sự thật lấp lửng."
1754 = "Em nhìn chằm chằm vào khuôn mặt chị Mayami.\\nNhìn vào đôi mắt mà từ nhỏ em đã luôn khao khát một cách vô thức."
1755 = "Có lẽ vì quá phấn khích, nên chị ấy đã lỡ buột miệng thốt ra.\\nNhưng tôi không thể hối thúc chị Mayami nói tiếp được."
1763 = "Xoa, xoa, xoa. Bàn tay nãy giờ vẫn dịu dàng vuốt ve Reina,\\ngiờ lại chuyển sang anh——ôn tồn bao dung lấy anh."
1764 = "Bàn tay đang vuốt ve tôi dừng lại,\\ncũng không quay về phía Reina đang ngủ trên đùi——"
1768 = "Là chị gái của Hibiki, là chị nuôi của em——\\nKhông chỉ vậy, em còn có cảm giác chị ấy như là chị lớn của cả Ohimitera này."
1774 = "Đến bây giờ em mới có thể chân thành gật đầu đồng ý.\\nRằng Michiko, bố và mẹ, đều đã tha thứ cho em."
1777 = "Hơn thế nữa, tôi khao khát mãnh liệt.\\nMong muốn chị Mayami được hạnh phúc hơn bất kỳ ai khác."
1778 = "Vì đã từng một lần đánh mất, nên em\\ncó lẽ cũng hiểu được phần nào sự quý giá của nó."
1780 = "Được nghe lại từ đó,\\nem chợt cảm thấy nó quả thực là một từ ngữ, hay đúng hơn là một khái niệm thật kỳ diệu."
1781 = "Chẳng hạn như việc Hachiroku chuyển sang phòng Hibiki.\\nHibiki bắt đầu thể hiện sự ra dáng người chị lớn giống như chị Mayami."
1790 = "Vậy mà, tôi lại thấy sốt ruột."
1792 = "Thế nhưng, giọng Reina vẫn chưa thực sự vui vẻ trở lại.\\nCó lẽ sự hiểu lầm này sâu sắc hơn em tưởng."
1795 = "Gật đầu cái rụp.\\nMột cái gật đầu dứt khoát và mạnh mẽ đến mức cả tấm lưng cũng chuyển động theo."
1796 = "Giọng nói bừng sáng rạng rỡ của Reina.\\nLàm sao em nỡ lòng nào dập tắt sự hào hứng đó được chứ."
1799 = "Giọng Reina bỗng xìu xuống.\\nCó lẽ em không nên đùa cợt về chủ đề này."
1800 = "Reina ngập ngừng một cách hiếm thấy.\\nChị Mayami không nói gì, chỉ chậm rãi chờ đợi cô bé nói tiếp."
1802 = "Reina khẽ cựa mình, kéo thế giới ùa về thực tại.\\nÀ, đúng rồi. Đây là trên tàu——một nơi công cộng cơ mà."
1804 = "Khẽ rùng mình, cơ thể vươn vai.\\nĐến giờ tôi mới cảm nhận được, Railord quả thật rất giống con người."
1838 = "Chị Mayami, Hibiki, Hachiroku, bố nuôi, mẹ nuôi.\\nÔng Taito, và vô số những người kết nối từ đó."
1840 = "Chị Mayami thả lỏng cơ thể, tựa hẳn vào người tôi.\\nHòa cùng hơi ấm truyền sang, một giọng nói nhỏ nhẹ vang lên."
1842 = "Cuộc trò chuyện nhàn nhã giữa chị Mayami và Reina\\nrõ ràng là rất hòa thuận, đáng lẽ ra phải khiến em thấy bình tâm mới phải."
1843 = "Chị Mayami ngồi trước, Reina ở giữa, còn em ở cuối.\\nKhi ba chiếc ghế đã được xếp ngay ngắn, Reina liền bắt đầu tạo bọt xà phòng."
1845 = "Chị Mayami khẽ nhắm mắt lại.\\nNhư thể đang nhớ lại điều gì đó."
1847 = "Chị Mayami không ngoảnh lại.\\nVẫn quay lưng về phía Reina, chị nói như đang tự lẩm bẩm."
1850 = "Một tiếng nuốt nước bọt khẽ vang lên.\\nLà do ngạc nhiên, hay do xấu hổ đây."
1854 = "Bàn tay chị Mayami đang được tay tôi bao bọc chực cử động.\\nTôi nhẹ nhàng nới lỏng ra, bàn tay ấy lại lặng lẽ vuốt ve mái tóc Reina."
1855 = "Bàn tay chị Mayami chậm rãi, chậm rãi,\\nvuốt ve mái tóc của Reina đang ngủ say trên đùi chị."
1857 = "Tông giọng của chị Mayami không hề thay đổi một chút nào.\\nChỉ đơn thuần là đang thong thả kể lại một câu chuyện hoài niệm."
1858 = "Chắc là cố ý, giọng chị Mayami nghe nhẹ nhàng và tươi sáng hẳn lên."
1860 = "Trông thật đau xót, lại đầy yêu thương.\\nMột cách nghịch lý, tôi cảm nhận được mối liên kết bền chặt giữa chị Mayami và Hibiki."
1862 = "Dù vẫn đang quay lưng lại để được kỳ cọ,\\nnhưng giọng nói của chị Mayami như đang dịu dàng ôm lấy Reina."
1870 = "Chờ Reina cựa quậy ngồi dậy,\\ntôi cúi đầu cảm ơn."
1891 = "Nói rồi em chợt nghĩ,\\nchưa chắc đó đã là lời nói đùa."
1892 = "Khoảnh khắc thốt ra những lời đó,\\nem nhận ra như thế vẫn chưa đủ."
1893 = "Nghe chị ấy nói vậy, có lẽ là thế thật. Xuôi dòng sông Kuma, rèn dao,\\ntập xúc than dồn toa, tham quan xưởng rượu. Dù tất cả anh đều đã trải qua——"
1899 = "Một giọng nói dịu dàng, hòa lẫn với hương xà phòng."
1904 = "Sự cố chấp đến mức một lòng một dạ này, khiến tôi bất chợt cảm nhận được quá khứ của Reina.\\nCó lẽ Reina——đã từng biết đến nạn đói."
1905 = "Những tấm lưng đang mỉm cười.\\nCả lưng của Reina, và cả tấm lưng của chị Mayami nhìn qua vai Reina nữa."
1906 = "Mỗi giây phút êm đềm trôi qua, những thứ từng cứng nhắc cũng dần vỡ vụn,\\nchầm chậm chầm chậm ấm lên, rồi tự nhiên bong tróc đi."
1907 = "Em cũng muốn hai đứa nằm ngủ ôm nhau,\\nnhưng giường này quá chật để làm thế."
1909 = "Ga cuối cùng——\\nchắc chắn vẫn còn ở một nơi rất xa, rất xa nữa."
1913 = "（……Hoài niệm thật đấy）"
1917 = "（À. Ra là vậy——Hồi còn nhỏ, tôi cũng……\\nNhưng mà, ừm. Lưng của Michiko, còn nhỏ hơn thế này rất nhiều）"
1919 = "（Vậy mà, cái cảm giác bồn chồn này là sao chứ.）"

[selections]
