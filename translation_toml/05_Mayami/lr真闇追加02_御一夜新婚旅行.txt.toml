[script]
731 = "\"『Chưa đổ được than vào rồi. 22 điểm, thưa chị Mayami』\\nGiọng nói tự dưng hiện lên trong đầu em lúc này đã bị em cố tình gạt đi.\""
737 = "……Nếu công việc của một hướng dẫn viên là làm cho khách hàng vui vẻ,\\nthì em phải công nhận Reina hôm nay chính là hướng dẫn viên tuyệt vời nhất."
740 = "……Mải nói chuyện này nọ,\\nnăm phút đã trôi qua trong chớp mắt."
743 = "……Hibiki chắc chắn sẽ không bao giờ nghĩ là bị làm phiền đâu.\\nEm dám chắc chắn như vậy, nhưng em cũng không muốn phủ nhận ý kiến của chị Mayami."
746 = "\"「『Tuy rất linh hoạt trong mọi việc,\\nnhưng lại cực kỳ kém trong việc thể hiện mong muốn của bản thân』 đúng không ạ~」\""
747 = "\"「『Một tính cách tuyệt vời, luôn hết mình và say sưa với mọi việc』\\n——Đó là những gì em thấy được.」\""
755 = "\"「……Chị làm mượt mà hơn từng chút một rồi đấy ạ.\\nTuyệt quá nha~」\""
757 = "\"「……Oaaaa. Học hỏi được bao nhiêu thứ luôn đó nha~」\""
758 = "\"「……Ưm. Ngon tuyệt.」\""
760 = "\"「……Một đoàn tàu đẹp đẽ và lộng lẫy đến vậy, do chính Hi-chan lái.」\""
1111 = "\"「Vậy thì sẽ giống người mẫu lắm đúng không?\\nChị cũng muốn xem thử một lần xem sao.」\""
1117 = "\"「Để lần sau Paulette dẫn Reina đến rồi chụp cũng được ạ~.\\nBây giờ Reina đang làm nhiệm vụ hướng dẫn viên mà.」\""
1120 = "「Ây da, vậy thì Sou-chan\\nkhông chừng cũng giải thích kém lắm nhỉ?」"
1122 = "\"「Không phải là thẳng, mà là 『giữ cố định không dùng lực cổ tay』\\n『đưa chéo vào, hơi nâng lên rồi đổ chéo xuống』.」\""
1123 = "\"「Không phải gạo Kuma ạ?」\""
1125 = "\"「Dù đúng hay sai thì chị cũng đừng khách sáo nhé.\\nNhân vật chính của tuần trăng mật luôn là cô dâu Mayami mà.」\""
1127 = "\"「Nếu không phải chỉ một khâu,\\nthì tức là phải điều chỉnh tốc độ của toàn bộ quá trình cho đồng đều với nhau đúng không?」\""
1129 = "\"「Không được không được! Thế thì không được đâu. Chị xin kiếu.\\nChị tuyệt đối không muốn làm phiền công việc của Hi-chan đâu.」\""
1130 = "\"「Tốt lắm. Em có thể làm chậm lại một chút,\\nnhưng hãy chú ý đừng làm rơi vãi than nhé.」\""
1133 = "「Cái đó, là lúc chị tự làm rồi bị vướng nên được dạy cho.\\nTình cờ bé Reina cũng gặp khó khăn ở chỗ đó nên chị mới nói được thôi」"
1135 = "\"「Không đâu, cả hai người đều đang cầm đấy.\\nLại còn là thứ rất quen thuộc nữa cơ.」\""
1141 = "\"「Những địa điểm quen thuộc thì trong lúc làm nhiệm vụ người ta vẫn hay để ý mà.\\nHuống hồ lại còn có người đang vẫy mũ ra hiệu nữa chứ.」\""
1142 = "\"「Cạn ly.」\""
1143 = "\"「Cạn ly ạ~」\""
1145 = "\"「Cái gì cơ. Giả gái á.\\nThế thì sẽ thành một cô gái khá là cao kều đấy.」\""
1156 = "\"「Nhưng lúc đầu, chị cứ giữ cố định đi.\\nĐưa thẳng vào rồi đổ thẳng xuống. Chỉ cần vậy thôi.」\""
1157 = "\"「Canh đến đâu á……em nói thế thì.\\nChị chẳng biết đường nào mà lần đâu.」\""
1161 = "\"「Chị nhất định phải nói trực tiếp với em ấy nhé. Nghe được những lời này,\\nchắc chắn cả Hibiki và Hachiroku sẽ rất vui đấy.」\""
1163 = "「Cả xuôi dòng sông Kuma, và trải nghiệm rèn dao,\\nReina, đều là lần đầu tiên nên hồi hộp lắm ạ」"
1165 = "\"「Chị hiểu đúng rồi đấy. Thử làm xem nào.」\""
1166 = "\"「Em thấy à?」\""
1167 = "\"「Đến rồi kìa.」\""
1169 = "\"「Ma sơ! Ôi chà,\\nkhông biết chị mặc có hợp không nhỉ.」\""
1173 = "\"「Cầm bằng hai tay rồi kẹp chặt nách——như thế này hả?」\""
1175 = "\"「Cứ thế lặp lại khoảng 5 xẻng xem sao.\\nKhông cần phải tăng tốc độ đâu.」\""
1181 = "\"「Đến nơi rồi ạ~」\""
1182 = "\"「Bây giờ thì chỉ chênh lệch chút xíu thôi,\\nnhưng hồi chưa quen thì sự khác biệt giữa mỗi người là khá lớn đấy.」\""
1183 = "「Lượng này, vừa đúng 1 kilogram」"
1187 = "\"「Tàu hóa trang, Cosplay Train ấy. Ví dụ lấy chủ đề là 『Tàu viễn tây』\\nrồi thống nhất toàn bộ từ nhân viên, hành khách cho đến nội thất.」\""
1189 = "\"「Chuyện nhỏ thôi mà. Hơn nữa, chính em cũng muốn xem thử.\\nCơ hội được ngắm nhìn từ góc này hiếm lắm.」\""
1190 = "\"「Cũng giống như men koji đang sống, bản thân xưởng rượu này cũng đang sống.\\nLần đầu tiên anh cảm nhận được... trải nghiệm được điều đó.」\""
1191 = "\"「Ra là vậy.\\nNếu không đóng lại ngay thì hơi nóng sẽ thoát ra từ cửa buồng lửa đúng không?」\""
1200 = "\"「Cũng chỉ là một chút thôi——ừm. Nếu chị Mayami và Reina\\nmuốn chụp thì em có thể hướng dẫn vài mẹo cơ bản.」\""
1202 = "\"「Chỉ có em là chẳng làm gì nên cũng hơi ngại, nhưng mà——\\nNâng ly vì công việc tuyệt vời hôm nay của chị Mayami, Hibiki và Reina nào.」\""
1203 = "\"「Đúng vậy nhỉ. Có từ 'thanh mát cay nồng' (Tanrei Karakuchi) để miêu tả rượu, nhưng...\\nHương vị này khiến người ta muốn gọi là 'thanh mát ngọt ngào' (Tanrei Amakuchi) mất thôi.」\""
1205 = "Vì ông Minokasa là thợ thủ công, nên ông dạy bằng cách làm mẫu cho xem.\\nNhưng với Reina, cách đó không mấy hiệu quả."
1208 = "\"「Là cậu bé đánh giày trong bộ phim đó ạ~!\\nPaulette bảo là Reina đóng vai đó chắc hợp lắm.」\""
1210 = "\"「Tên! Trước tiên, hãy cho em biết tên của chai rượu này.」\""
1213 = "\"「Hyau.」\""
1215 = "\"「Ưfufu, chẩn đoán tính cách qua cách xúc than của anh Soutetsu,\\ntrúng phóc luôn đó nha~」\""
1217 = "「Ufufu, làm hướng dẫn viên,\\nlà một công việc cực kỳ thú vị luôn nha」"
1218 = "\"「Ưm fufu. Chị hiểu rồi. Rei-chan? Nào, cười lên.」\""
1220 = "「Không không, em thì vẫn vừa làm vừa suy nghĩ.\\nNên có lẽ em có thể giải thích tốt đấy——em nghĩ vậy」"
1222 = "\"「Ưm fufu, do tính cách cả mà.」\""
1223 = "\"「Ưm fufu, cảm ơn em.\\nNào? Hi-chan, Sou-chan. Cả Rei-chan nữa.」\""
1224 = "\"「Ưm fufu, cảm ơn em nha, Rei-chan.」\""
1228 = "「Đúng vậy. Có lúc thân chính của Hachiroku cũng tập xúc than dồn toa ở đây.\\nNếu không làm thường xuyên, tay nghề sẽ bị mai một」"
1230 = "\"「Ơ, chị hai!? Anh hai!?\\nTuần trăng mật kết thúc rồi á!? Đừng nói là đi về trong ngày nha!?」\""
1232 = "\"「Oaaaa! Giống hệt lúc trải nghiệm làm dao bếp luôn ạ.\\nGiải thích dễ hiểu cực kỳ luôn đó nha~」\""
1233 = "\"「Oa, thất bại mất rồi ạ.\\nLàm Reina giật cả mình nha~」\""
1236 = "\"「Oaaa! Chị làm đẹp lắm luôn đó ạ~」\""
1239 = "\"「Oa! Trúng phóc luôn ạ! Paulette cũng hay khen\\nReina là lúc nào cũng cố gắng hết mình đó nha~」\""
1240 = "\"「Oaaa! Reina cũng muốn thử——à không phải,\\ntừ chị Makura trước mới đúng ạ, Reina là hướng dẫn viên mà~」\""
1243 = "\"「Oa! Được chị Makura hướng dẫn,\\nReina vui lắm luôn đó nha~」\""
1244 = "\"「Oa oa oa! Nghe có vẻ thú vị lắm đó nha~」\""
1246 = "\"「Oaaa, đẹp lắm luôn đó ạ~」\""
1248 = "\"「Oa, oa!\\nNếu vậy thì Reina cũng muốn thử chụp một tấm cho biết ạ~」\""
1250 = "\"「Oa, chị đập trúng cửa buồng lửa mất rồi ạ~」\""
1252 = "\"「Oa, cái này――――Hương vị chưa từng có từ trước đến nay.\\nKhác hoàn toàn với Migitakazu, cũng chẳng giống Hitoshizuku chút nào...」\""
1254 = "\"「Hauuu~ Reina cũng muốn uống thử quá đi mất~」\""
1256 = "\"「Ôi chà. Rei-chan,\\nsao em lại giới thiệu chỗ này thế?」\""
1258 = "\"「Ôi chà. Vậy là việc chị đến xem mọi người làm việc,\\nHi-chan cũng...」\""
1259 = "\"「Ôi chà. Vậy thì không được thất bại rồi.\\nChị nhất định sẽ cố gắng hết sức.」\""
1261 = "\"「Ây da.」\""
1262 = "\"「Ôi chà, Hi-chan.」\""
1263 = "\"「Ôi chà! 1006 gram!」\""
1266 = "\"「Ôi chà, tuyệt quá nhỉ. Trúng phóc luôn!\\nNè? Sou-chan, vậy còn tính cách của chị thì sao?」\""
1268 = "\"「Ôi chà, vậy ra đây cũng là một danh lam thắng cảnh của Ohimitera.」\""
1269 = "\"「Ôi chà, nghe thú vị thật đấy!」\""
1271 = "「Càng thành thạo thì việc diễn đạt bằng lời càng khó chăng.\\nĐặc biệt là khi đã làm một cách vô thức」"
1272 = "\"「Ể? Reina làm gì có máy ảnh nào...」\""
1275 = "\"「Ehehe. Reina còn có cộng cảm nữa mà.\\nĐược nghe tiếng còi hơi nước kéo dài hay tuyệt cú mèo luôn đó nha~」\""
1277 = "\"「Ehehe, Reina được khen rồi đó nha~」\""
1279 = "\"「Dù chỉ là 1kg, nhưng cứ lặp đi lặp lại thì cũng mệt thật đấy.\\nTư thế lại còn phải khom lưng nữa, mỏi eo ghê.」\""
1280 = "\"「Ưm fufu, em đùa à.\\nLàm sao mà hai đứa nó nhận ra chị được chứ.」\""
1283 = "\"「Ưm fufu, Rei-chan làm giỏi quá ta.」\""
1285 = "\"「Ưm fufu, vậy thì Rei-chan sẽ cải trang thành gì nào?」\""
1286 = "\"「Ư……ừm. Nếu là yêu cầu của chị Mayami,\\nthì em sẽ xem xét giải quyết theo hướng tích cực vậy.」\""
1288 = "\"「Để xem nào. Đầu tiên là tụi em đi thuyền xuôi dòng Kuma này~」\""
1290 = "\"「A…….\\n——Vâng! Nếu vậy thì, em muốn đi tham quan ạ.」\""
1291 = "\"「À……em nhớ là có nghe nói rồi.\\nVụ đó có liên quan đến bố nuôi đúng không?」\""
1294 = "\"「A……Cái này……」\""
1296 = "\"「Ôi chà dễ thương quá! Thế thì hợp quá còn gì.」\""
1298 = "\"「Ahaha, cảm ơn em. Nhưng mà, dù không có chuyện nấu rượu đi chăng nữa,\\nthì chị cũng chịu thua cái trò này thôi.」\""
1300 = "\"「Á. Được chị hai hướng dẫn thì em vui lắm.\\nNhưng không phải bây giờ. Nhỡ làm phiền tuần trăng mật của hai người thì sao.」\""
1302 = "\"「A! Nếu được thế thì tốt quá.\\nVậy thì nhé? Sou-chan sẽ phụ trách chụp ảnh.」\""
1304 = "\"「A! Quả nhiên lúc nãy\\nlà chị hai, anh hai và bé Reina mà.」\""
1306 = "\"「À, ừ! Để xem——\\nCó mẹo nào để chụp ảnh đường sắt đẹp không, chỉ chị với?」\""
1307 = "\"「À, ừm. Chị cảm giác như trong đầu thì hiểu rồi đấy.\\nNhưng mà dạo này chị chả vận động gì sất.」\""
1309 = "\"「À, điều đó thì anh hiểu.」\""
1311 = "\"「A, ra là vậy, Reina\\nchưa nghĩ đến chuyện đó ạ~」\""
1313 = "\"「A, khoan đã Rei-chan, nếu chị mà đến đó,\\nngười ta lại tưởng là đi thị sát hay kiểm tra đột xuất mất.」\""
1314 = "\"「Dạ? Á!」\""
1316 = "\"「Ồ, nghe thú vị đấy.\\nNhân tiện đây, chúng ta thử một lần xem sao nhé?」\""
1317 = "\"「Cải trang cũng được đấy nhỉ. Nè, Rei-chan.\\nMỗi người nên cải trang thành gì thì hợp nhỉ?」\""
1318 = "\"「Cải trang á!」\""
1319 = "\"「Ừ——A!」\""
1320 = "\"「Ưm——để xem——A.」\""
1322 = "\"「Ưm……để xem——Lấy phần hông của mình làm đỉnh,\\nrồi tạo thành một tam giác cân với than và cửa buồng lửa đúng không?」\""
1323 = "\"「À——」\""
1325 = "\"「Ưm……À, đúng là cầm thế này thì\\ncổ tay mới cử động linh hoạt được nhỉ.」\""
1326 = "\"「Ưm……ưm, dô——」\""
1328 = "\"「Ưm……để xem——Ừ. Cỡ này được chưa?」\""
1330 = "\"「Ừm. Nè?\\nHai người có muốn thử không? Cả Sou-chan và Rei-chan nữa.」\""
1331 = "\"「Ừm. Nước Bikoku, Rei-chan có biết không?」\""
1333 = "\"「Vâng. Em muốn uống. Hôm nay em cũng xong việc rồi.」\""
1336 = "\"「Ừm. Đúng là anh đã nói vậy.\\nReina nhớ giỏi thật đấy.」\""
1337 = "\"「Để xem nào. Tính cách của chị Mayami là——」\""
1338 = "\"「Ừm. Cảm ơn em. Chỉ đến đây thôi á?\\nChị đã được hai người thực hiện cho rất rất nhiều mong muốn rồi đấy.」\""
1342 = "\"「Vâng. Đó cũng là công việc của Hibiki. Không chỉ thiết kế toa xe,\\nmà với tư cách là một lái tàu, em ấy cũng đã hoàn toàn trưởng thành rồi.」\""
1343 = "\"「Ừm. Một cây cầu danh tiếng không hề hổ thẹn với cái tên oai phong đó.\\nDù là nhìn từ trên xuống lúc đang làm nhiệm vụ, hay ngắm nghía từ bên hông thế này.」\""
1344 = "\"「Ừm. Chuyện là vầy nhé?」\""
1346 = "「Vừa đúng á, dù em chỉ xúc đại thôi sao?」"
1348 = "\"「Em làm! Tất nhiên rồi!!\\nNhất định em sẽ làm——nhất định sẽ tạo ra một thiết kế tuyệt vời nhất!」\""
1350 = "\"「A, hình như chị cũng từng thấy rồi.\\nBức ảnh đó có in trên lịch của Đường sắt Ohito đúng không?」\""
1351 = "\"「Đúng vậy, không nên cố quá.\\nVậy thì chúng ta dừng tập xúc than ở đây nhé.」\""
1353 = "\"「Oaaa, mùi hương tuyệt quá đi ạ~.\\nThoang thoảng dịu nhẹ lắm luôn đó nha~」\""
1355 = "「Hêê——\\nA, dùng cái xẻng này để tập sao?」"
1358 = "\"「Ừm, cũng chính xác luôn. Thế nên,\\nxưởng mình mới mua lại, định ủ thử xem sao.」\""
1359 = "\"「Ừm, tốt lắm.」\""
1361 = "\"「Hừm?」\""
1363 = "\"「Hửm? À, ừm. Đúng rồi nhỉ.」\""
1364 = "\"「Ehehe——A.」\""
1365 = "\"「Ehehe, tại vì Reina cảm thấy nó đúng lắm luôn đó ạ~」\""
1368 = "\"「Ufufu~. Vì Reina nghĩ nếu đi tham quan Ohimitera, thì nhất định nhất định\\nphải ghé xem cửa hàng đường sắt một lần đó nha~」\""
1370 = "「嘿嘿嘿，導遊真是個特別有趣的工作」"
1372 = "\"「Ehehe, Reina cũng chụp một bức ảnh kỷ niệm đây ạ~.\\nHai người đứng sát vào nhau nào——Nào, dầu diesel.」\""
1374 = "\"「Ehehe, hôm bữa Reina xem phim với Paulette,\\ncó ma sơ xuất hiện trong đó, tuyệt vời lắm luôn đó nha~」\""
1376 = "「Thao tác của em rất điêu luyện mà.\\nKhông hề giống làm lần đầu chút nào」"
1378 = "\"「Ehehe, em cũng vui lắm luôn!\\nMà hôm nay mọi người đã đi những đâu vậy?」\""
1380 = "\"「Ehehe, Reina đã cố gắng hết sức rồi ạ.\\nChẩn đoán tính cách thế nào rồi ạ~?」\""
1381 = "\"「Ehehe, cảm ơn anh. Mà, quan trọng hơn là tuần trăng mật.\\n……Không phải là bị gián đoạn đấy chứ?」\""
1382 = "\"「Ưm fufu, cảm ơn em! Đó là lời khen tuyệt vời nhất đấy!!」\""
1385 = "\"「Nếm thử một ngụm nhỏ đi?\\nRồi hẵng đánh giá công việc của chị sau nhé.」\""
1388 = "\"「Giữ cố định——đưa thẳng vào——rồi kéo xích.」\""
1390 = "\"「Vì đã đi du lịch thế giới bên ngoài. Vì đã làm quen với vùng đất lạ.\\nGiữ nguyên được những ưu điểm vốn có, lại thu được thêm những hương vị hoàn toàn mới.」\""
1392 = "\"「Với khoảng cách này mà dùng camera điện thoại thì không thể chụp cầu kỳ được đâu.\\nTrước tiên, chị chỉnh zoom sao cho toàn bộ cây cầu vừa vặn nằm trong khung hình đi.」\""
1393 = "\"「Theo đà xúc than, chị kéo dây xích để mở cửa buồng lửa,\\nném một xẻng than đầy vào trong, sau đó thả xích ra để đóng cửa lại.」\""
1407 = "\"「Gạo về thăm quê hương... vậy, vậy gạo đó\\nđã đi du lịch về hả chị~?」\""
1409 = "\"「Tuyệt quá——tuyệt vời quá đi mất!\\nHi-chan mà lại lái được một chuyến tàu hoành tráng đến thế!」\""
1411 = "\"「Chính xác luôn ạ, năm nào cũng có in đó nha~」\""
1413 = "\"「Dùng sức quá cũng không tốt đâu. Lúc đầu cứ làm thật chậm thôi.\\nĐừng ném vào, mà hãy tưởng tượng như mình đang đổ than vào ấy, thử xem sao.」\""
1414 = "\"「Nghe chưa kìa. Vậy thì, được rồi,\\nRei-chan, trao cờ cho em đấy.」\""
1416 = "\"「Tuyệt quá. Nhưng cứ từ từ đã.\\nEm muốn chuẩn bị xong xuôi trước khi tàu đến.」\""
1418 = "\"「Ok. Vậy mời mọi người vào tham quan nhé.\\nChị đi chuẩn bị ngay đây——sẽ không để mọi người đợi quá năm phút đâu.」\""
1419 = "\"「Có những chuyện tưởng chừng như đã biết mà hóa ra lại chẳng biết gì.\\n……Rượu shochu, hóa ra được làm ra như thế này nhỉ.」\""
1421 = "\"「Vâng ạ~」\""
1423 = "\"「Vâng! Xin lỗi đã để đoàn tham quan phải chờ lâu ạ~」\""
1425 = "\"「Dạ vâng ạ! Nãy giờ Reina có xem rồi, với lại Reina cũng khỏe lắm,\\nchắc chắn sẽ làm giỏi luôn đó nha!!」\""
1426 = "\"「Vâng ạ! Reina sẽ cố gắng hết sức nha~」\""
1428 = "Vừa nói những lời như thể đã hoàn toàn vứt bỏ công việc hướng dẫn viên,\\nReina vừa lạch bạch dẫn chúng tôi đến bãi tập xúc than dồn toa."
1430 = "\"「Oa. Nếu vậy thì!」\""
1431 = "\"「Tốt lắm.」\""
1433 = "\"「Tại chị cứ đòi hỏi ích kỷ,\\nxin lỗi em nhé? Tự dưng lại bắt em thêm lịch trình thế này.」\""
1434 = "\"「Hôm nay, khi nhìn thấy công việc của Hi-chan.\\nChị chợt nghĩ, loại gạo nấu rượu này, thật giống với Hi-chan.」\""
1437 = "\"「Không có gì phải xin lỗi đâu ạ, một chút cũng không luôn đó nha~?」\""
1446 = "\"「Vừa rồi là lỗi của em, xin lỗi chị.\\nTừ 'thẳng' của em dùng chưa chuẩn.」\""
1451 = "\"「Hi-chan chắc chắn là ít nhất rồi nhỉ.\\nỞ giữa là Sou-chan, còn nhiều nhất là Na-chan.」\""
1452 = "\"「Trên cây cầu này, chiếc 8620 do Hi-chan lái sẽ chạy ngang qua.」\""
1454 = "\"「Hi-chan, em ngầu lắm.」\""
1456 = "\"「Cả Po-chan và thầy cúng nữa cơ á!」\""
1457 = "\"「Đối với Sou-chan á——\\nMỗi người lại khác nhau đến thế cơ à?」\""
1458 = "\"「Sou-chan, cảm ơn em đã dẫn chị đến đây!\\nRei-chan, em là hướng dẫn viên tuyệt vời nhất đấy!」\""
1461 = "\"「Đúng ý đó rồi đấy. Lúc đầu cứ làm mọi thứ thật chậm rãi cũng được.\\nKhi đã quen dần, chị mới bắt đầu tăng tốc toàn bộ chuỗi động tác lên.」\""
1466 = "\"「Hàng trăm lần ư——tức là hàng trăm ký luôn á!?」\""
1469 = "\"「Đứng nhìn và cổ vũ từ xa——\\nChỉ như vậy thôi là chị đã mãn nguyện lắm rồi.」\""
1473 = "\"「Làm gì có chuyện phiền hà chứ.」\""
1475 = "Tôi gật đầu đồng tình sâu sắc với lời của Reina.\\nAi là hướng dẫn viên đây. Người ngoài nhìn vào chắc chắn sẽ hiểu lầm hoàn toàn."
1476 = "\"「Thật vinh hạnh. Mà nếu được, chị hãy nói trực tiếp\\nvới Hibiki và Nagi nhé. Tàu 8620 cũng sắp về đến ga rồi đấy.」\""
1479 = "\"「Em hiểu! Em hiểu mà!! Sợ người ta phải bận tâm,\\nnên dù có hứng thú cũng không dám đi tham quan xưởng rượu nhà mình nhỉ.」\""
1481 = "\"「Ra là vậy. Nếu thế thì, Reina! ——Ô ồ!?」\""
1483 = "\"「Chị hiểu rồi. Chị sẽ tưởng tượng lại động tác lúc nãy của Sou-chan,\\ntrước tiên cứ làm thử từ từ đã. Nên là, chỉ cho chị với nhé?」\""
1484 = "\"「Đã rõ.」\""
1485 = "\"「Reina biết ạ~, Reina xem trong phim 『Cây đàn hạc của Bikoku』 rồi.\\n『Aoshima ơi! Cùng nhau về Hinomoto nào』 đó nha~」\""
1487 = "\"「Sou-chan, Na-chan và cả Hi-chan nữa,\\nchị thấy mọi người thực sự rất tuyệt vời và ngầu lắm luôn ấy.」\""
1491 = "\"「Chụp ảnh đường sắt thú vị đến thế cơ à?」\""
1493 = "\"「Đã rõ. Lưu ý là tuyệt đối không được di chuyển máy ảnh nhé.\\nCứ giữ cố định khung cảnh, rồi để đầu máy chạy vào trong đó.」\""
1496 = "\"「Thế nên, nhé? Hi-chan.」\""
1498 = "「Không đâu, thực tế ông Minokasa cũng rất ấn tượng mà.\\n『Cách truyền đạt như vậy thì dễ hiểu quá nhỉ』 ông ấy bảo thế」"
1500 = "\"「Đúng vậy ạ~. Cả Paulette và thầy cúng Akai\\nthỉnh thoảng cũng đến đây chụp ảnh đó nha~」\""
1501 = "\"「Đúng vậy——sắp đến rồi đấy.\\nHửm?」\""
1503 = "「Vậy thì,\\nSou-chan, Hii-chan và Na-chan cũng tập ở đây sao?」"
1506 = "\"「Đúng vậy. Rất sắc sảo nhưng lại ngọt ngào.\\nCảm giác như vị ngọt thanh của gạo ấy.」\""
1508 = "\"「Đúng vậy. Tính cách cũng bộc lộ qua những việc thế này đấy. Khá là rõ ràng luôn.」\""
1509 = "\"「Đúng vậy.」\""
1511 = "\"「Đúng vậy đúng vậy ạ! Mong muốn của cô dâu và chú rể,\\nReina sẽ hướng dẫn tận tình và biến chúng thành hiện thực luôn đó nha~」\""
1512 = "\"「Chưa chắc đâu? Không hẳn là vậy đâu. Nhìn kìa.」\""
1514 = "\"「Vậy sao?」\""
1517 = "\"「Thú vị thật. Cảm giác giống hóa trang hơn là cải trang rồi\\n……Nhưng mà, có khi cho chạy một chuyến tàu như thế cũng hay đấy.」\""
1518 = "\"「Nếu em có hứng thú, hay là thử đi tham quan xưởng rượu xem sao?\\nChị muốn làm hướng dẫn viên cho Hi-chan lắm.」\""
1520 = "\"「Liếc ngang một cái là thấy ngay. Em thấy có ai đó đang vẫy tay.\\nHachiroku thì cứ cười tủm tỉm kỳ lạ, nên em mới đoán vậy.」\""
1521 = "\"「Vốn dĩ là gạo Kuma.\\nNhưng mà nhé? Đây là loại gạo đã đi xa rồi mới trở về quê hương đấy.」\""
1525 = "\"「Dầu diesel á.」\""
1529 = "\"「Chính xác là vậy. Nhưng mà cũng không được nôn nóng đâu đấy.\\nNếu chỉ chăm chăm muốn làm nhanh ở một khâu nào đó, thì sẽ làm hỏng bét hết cả.」\""
1533 = "\"「Nước thì vẫn vậy, vẫn là nước nguồn sông Kuma.\\nThế nên, thứ thay đổi là gạo.」\""
1535 = "\"「Làm gì có chuyện gián đoạn.\\nNhưng mà, vụ tham quan xưởng rượu, đang không biết phải làm sao đây.」\""
1536 = "\"「Không đâu ạ, là lỗi của Reina mà.\\nTrong lúc làm nhiệm vụ, dù có chuyện gì xảy ra cũng không được phép dao động đâu ạ~」\""
1537 = "\"「Ừ ừ, đúng rồi, cứ thế nhé.\\nCố lên Rei-chan, cố lên cố lên.」\""
1542 = "\"「Paulette thích lắm đó nha~. Mà nhắc mới nhớ,\\nanh Soutetsu cũng từng được học một chút rồi đúng không ạ?」\""
1545 = "\"「Tuyến Yui dài khoảng 25km, vừa ngắn lại vừa bằng phẳng mà.\\nĐối với em, một chiều đi thường chỉ tốn khoảng 550 xẻng là cùng.」\""
1548 = "\"「Sau đó, chỉ cần canh xem đầu máy chạy đến đâu thì bấm máy,\\nrồi chớp lấy khoảnh khắc đó là được.」\""
1549 = "\"「Tiếp theo, hai người cầm điện thoại bằng hai tay, kẹp chặt nách lại.\\nKẹp chặt nách sẽ giúp cố định tư thế, giảm thiểu tình trạng rung tay.」\""
1553 = "\"「Reina không chụp à?」\""
1554 = "\"「Reina cũng xong rồi ạ~」\""
1556 = "\"「Reina cũng vậy ạ~.\\nDù là qua ảnh thì Reina xem suốt rồi.」\""
1558 = "\"「Có Reina cổ vũ rồi, chắc chắn chị sẽ làm tốt thôi ạ~」\""
1560 = "\"「Reina! Nghĩ ra cách hay rồi ạ~.\\nNếu vậy, nếu vậy thì, chúng ta cải trang thì sao ạ~?」\""
1562 = "\"「Địa điểm Reina muốn giới thiệu là ở đây ạ~!\\nChính là xưởng rượu Migitakazu đó nha~」\""
1564 = "Vì chị Mayami quá đỗi chiều chuộng,\\nnên Reina đã hoàn toàn bước vào chế độ tận hưởng."
1565 = "\"「Reina làm thử đây ạ! Dô ta, dô tà.」\""
1567 = "\"「Tất nhiên là được rồi.\\nChị vui lắm. Thanh tao thật đấy. Uống cùng bằng mùi hương cơ à.」\""
1568 = "\"「Chắc chắn là hợp rồi. Khá là——không, thực sự rất tuyệt đấy.\\nThú vị thật. Em hoàn toàn chưa nghĩ đến trang phục tu sĩ luôn.」\""
1569 = "\"「Cứ thế đổ thẳng vào chỗ trống」\""
1571 = "\"「Bất ngờ thật đấy. Chị đoán chuẩn luôn.」\""
1573 = "\"「Thực sự rất tuyệt. Khói trắng muốt, tiếng còi hơi nước cũng vang vọng.\\nCả mắt và tai đều có thể cảm nhận được em đang điều chỉnh lò hơi rất tốt.」\""
1574 = "\"「Thật sự! Thật sự cảm ơn hai người rất nhiều!!」\""
1578 = "\"「Chị Mayami! Kẹp chặt nách cố định lại! Đừng cử động nhé.」\""
1580 = "\"「Chị Makura thì đóng giả ma sơ là tuyệt nhất ạ~.\\nVừa giấu được mặt, mà khí chất cũng hợp vô cùng luôn đó nha~」\""
1588 = "\"「Đúng thật. Chị có năng khiếu đấy.\\nNếu không vì chuyện nấu rượu thì...」\""
1591 = "\"「Cả hai người họ chắc hẳn đang rất quan tâm đến đánh giá của mọi người.\\nĐặc biệt là khi chị Mayami vừa được tận mắt chứng kiến công việc của họ.」\""
1592 = "\"「Với lại, chị cũng muốn cho em xem công việc của chị.\\nHôm nay chị đã được chiêm ngưỡng công việc tuyệt vời của Hi-chan rồi mà.」\""
1594 = "\"「Nghe có vẻ thú vị nhỉ.\\nChị cũng muốn thử tham quan một chút, nhưng mà……」\""
1599 = "\"「Mà này, nếu chị không phiền thì cho em hỏi——\\nLoại rượu này có gì khác so với bình thường vậy? Do nước hay do gạo?」\""
1600 = "\"「Mà này, Hi-chan.」\""
1601 = "\"「Cảm ơn em nha, Sou-chan.\\nĐược trải nghiệm một việc mới mẻ thế này, chị vui lắm.」\""
1602 = "\"「Cảm ơn Sou-chan, Rei-chan.\\nĐã cho chị thấy những thứ mà chị muốn thấy.」\""
1603 = "\"「Chị hai, cảm ơn chị. Cảm ơn chị đã cho em xem công việc của chị.\\nDù lĩnh vực hoàn toàn khác nhau, nhưng em đã học hỏi được rất nhiều điều.」\""
1610 = "\"「Lắc lư sang hai bên là nguyên nhân làm rơi than đấy.\\nKhi vặn người, em nhớ chú ý đừng để xẻng than bị nghiêng nhé.」\""
1612 = "\"「Vất vả cho em rồi. Bọn anh có xem đấy. Chuyến đi tuyệt lắm.」\""
1625 = "Tôi cắm xẻng wansuko vào đống than đá dùng để tập luyện, rồi xúc thử cho xem."
1626 = "\"「Cây cầu này,\\nđược đặt một cái tên thật oai phong nhỉ, Cầu sắt số 4 sông Kuma cơ đấy.」\""
1627 = "\"「Chuyến tàu như thế, là chuyến tàu như thế nào?」\""
1628 = "\"「Nếu vậy thì chị cũng muốn thử cho biết.\\nNhưng mà, chị có mang theo máy ảnh đâu?」\""
1629 = "\"「Tên của chai rượu shochu này là——」\""
1630 = "\"「Thiết kế nhãn mác cho chai rượu shochu này.\\nChị rất muốn nhờ Hi-chan làm giúp.」\""
1631 = "\"「Vì đây là một 'địa điểm quen thuộc' mà.\\nTrong lúc làm nhiệm vụ, em vẫn thường thấy bóng dáng của mấy tay thích chụp ảnh tàu ở đây.」\""
1632 = "「Vâng ạ. Đây là bãi tập xúc than dồn toa tự hào của Đường sắt Ohito nha.\\nCác bác lái tàu, cũng thực sự tập luyện ở đây đó ạ」"
1633 = "\"「Sai số ngần ấy thì chị thông cảm cho em đi.\\nTrong lúc làm nhiệm vụ, việc xúc 1kg than này phải lặp đi lặp lại hàng trăm lần đấy.」\""
1636 = "\"「Hơn nữa... nhé.\\nNgày nào cũng làm những việc thế này một cách hoàn hảo mà không hề xảy ra tai nạn nào...」\""
1637 = "\"「Vẫn chưa xong đâu, Hi-chan.」\""
1638 = "\"「Vậy thì, chụp một tấm kỷ niệm ba người luôn đi.」\""
1641 = "\"「Chị sẽ làm vậy. Nếu chị mà di chuyển máy ảnh,\\nchắc hình sẽ rung bần bật mất.」\""
1642 = "\"「Vậy thì」\""
1643 = "\"「Chị thấy vui là tốt rồi.」\""
1644 = "\"「Vậy, chị cũng phải cố gắng thôi nhỉ.\\nSou-chan, chị phải làm thế nào đây?」\""
1646 = "\"「Nếu vậy thì em cũng xin một ngụm. Cho em uống cùng với nhé.」\""
1648 = "\"「Nghe vậy chị cũng vui lắm!」\""
1651 = "\"「Nếu vậy thì quay video luôn đi.\\nNhư thế chắc chắn sẽ ghi lại được những khoảnh khắc đẹp.」\""
1653 = "\"「Vậy, còn chị Mayami thì sao? Nên cải trang thành——」\""
1655 = "\"「Vậy ra đây vốn dĩ là gạo Kuma nhà mình hay dùng sao?\\nHương vị thì đúng là……nhưng mà, mùi vị lại khác hoàn toàn.」\""
1656 = "\"「Nếu vậy, nếu vậy thì, mấy trò như bói xúc than hay chẩn đoán tính cách qua cách xúc than,\\ncó khi cũng làm được luôn đó nha~」\""
1657 = "\"「Tại chị nói leo vào đấy.」\""
1659 = "\"「Cồn có thể là nguyên nhân gây ra cháy bất thường,\\nnên Reina chỉ xin ngửi mùi thôi được không ạ~」\""
1661 = "\"「Sắc sảo và thanh mát,\\nnhưng hậu vị lại là vị ngọt dịu êm nhẹ nhàng...」\""
1662 = "\"「Anh Soutetsu có khuôn mặt đẹp,\\nnên nếu mặc đồ con gái chắc chắn sẽ hợp lắm đó nha~」\""
1664 = "\"「Chính xác. Loại gạo nấu rượu này ấy à? Là một phần trong chương trình hỗ trợ kinh tế cho Bikoku,\\nđược trồng thử nghiệm bên đó, vốn dĩ là gạo Kuma đấy.」\""
1665 = "\"「Tưởng tượng.」\""
1672 = "\"「Hai điểm cần lưu ý nhất khi mới bắt đầu.\\nĐó là không được kéo xích quá mạnh và không được mở cửa buồng lửa quá lâu.」\""
1678 = "\"「!」\""
1680 = "\"「! Ôi chà, fufu, đúng là vậy nhỉ.」\""
1681 = "\"「! Em muốn đi!!」\""
1683 = "\"「!!」\""
1743 = "Nhìn sang, em thấy Reina đã cất điện thoại đi rồi."
1747 = "Chỉ mới 5 xẻng.\\nChỉ vậy thôi mà chị Mayami đã vung vẩy cánh tay trông có vẻ rã rời lắm rồi."
1749 = "Từ chai rượu Issho, loại rượu shochu Kuma trong vắt như nước suối\\nđược rót ra những chiếc cốc nhựa nhỏ dùng để uống thử."
1750 = "Thêm một ngụm nữa.\\nÀ, quả nhiên là——"
1756 = "Tiếng còi báo hiệu trước khi lên cầu sắt.\\nKhông còn thời gian để trò chuyện nữa."
1763 = "Ra là vậy, quả không hổ danh chị Mayami.\\nĐẳng cấp hoàn toàn khác biệt với đứa đang đứng hình không biết phản ứng sao như em."
1777 = "Ừm. Tuyệt thật. Dù không biết Reina đã xem phim gì,\\nnhưng một hình ảnh khá rõ ràng đang tự nhiên hiện lên trong tâm trí em."
1779 = "Chị Mayami cười mỉm, dịu dàng gật đầu.\\nVẫn giữ nguyên nụ cười đó, chị cất giọng nhẹ nhàng."
1784 = "Câu trả lời ngây thơ của Reina khiến nụ cười của chị Mayami càng thêm dịu dàng.\\nNếu vậy, có lẽ chính bản thân chị ấy cũng cảm thấy đúng như thế."
1785 = "Bộ ngực căng đầy càng thêm nổi bật, khiến em thoáng chốc mất tập trung.\\nNhưng đây là một bức ảnh quan trọng. Em lập tức xốc lại tinh thần."
1789 = "Nụ cười bỗng chốc trở nên nghiêm túc.\\nChiếc 8620 do Hibiki điều khiển——chắc hẳn chị ấy muốn chụp lại thật đẹp."
1791 = "Giọng nói dịu dàng, nhưng vô cùng dứt khoát.\\nĐương nhiên, em cũng gật đầu đồng ý nhiệt liệt."
1793 = "Hai má ửng hồng mơn mởn, thoạt nhìn,\\nchị ấy trông cứ như một thiếu nữ bé bỏng vậy——"
1794 = "Đầu và ánh mắt của chị hướng về phía chiếc 8620 vừa chạy khuất.\\nChẳng hiểu sao, điều đó lại khiến em cảm thấy vô cùng hạnh phúc."
1796 = "Từ trong hộp thiếc, một cuốn sổ phác thảo bay vọt ra."
1797 = "Em ấy thốt lên như reo mừng.\\nRồi vội vàng lấy hai tay bịt miệng lại."
1798 = "Một tiếng thở hắt ra thật khẽ."
1800 = "Ma sơ á, lại là một ý tưởng khá bất ngờ đây——"
1810 = "Chưa kịp uống mà em đã thấy say men hạnh phúc rồi."
1813 = "Vừa nói, em vừa chậm rãi làm mẫu.\\nBị nhìn chằm chằm như muốn ăn tươi nuốt sống thế này, quả thực cũng có chút ngại ngùng."
1816 = "「Ehehe, là nhờ ông Minokasa và chị Mayami đó ạ.\\nLời khuyên của chị Mayami, rất dễ hiểu luôn」"
1819 = "Vừa giục chị Mayami, em vừa nhìn sang Reina,\\nđúng lúc cô bé đang đội lại chiếc mũ."
1821 = "Vừa dứt lời, Reina đã \"Dạ!\" rồi giơ tay lên."
1823 = "Em ngạc nhiên thật sự. Trong lúc tập xúc than mà có thể hình dung thực tế đến mức đó——\\nKhả năng này chắc chắn là một tố chất không thể bàn cãi."
1825 = "Ngay khoảnh khắc bật cười vì câu khẩu lệnh kỳ quặc ấy, tiếng màn trập vang lên.\\nBức ảnh này chắc chắn đã bắt được một nụ cười rất tự nhiên."
1827 = "Em đã bấm máy vào đúng khoảnh khắc hoàn hảo nhất.\\nNhìn sang chị Mayami, thấy chị ấy vẫn giữ khư khư chiếc điện thoại——"
1828 = "Trong giọng nói của chị Mayami có thoảng chút căng thẳng.\\nDù chị đang cố gắng nói chuyện một cách tự nhiên nhất có thể——"
1829 = "Việc Reina đi tham quan cửa hàng đường sắt thì quả thực rất thú vị.\\nNhưng việc chị Mayami đi tham quan xưởng rượu Migitakazu thì……"
1831 = "「À, nó gọi là wansuko.\\nMột cái xẻng xúc được đúng 1kg mỗi lần」"
1833 = "Em nhìn vào đống than phía sau cỗ máy tập luyện. Vì không có ai hướng dẫn nên đương nhiên là,\\nthan vương vãi khắp nơi trông khá là hoành tráng."
1835 = "Nâng chiếc cốc lên, đưa thẳng vào miệng——!!"
1837 = "Nói xong, chị ấy nở nụ cười khúc khích vui vẻ."
1859 = "Hibiki cũng nghiêng cốc,\\nnhấm nháp thật chậm trong vài giây——rồi mới nuốt xuống."
1861 = "Nghe Reina nói vậy, cả em và Hibiki đều gật gù đồng tình."
1863 = "Một Hibiki đang hừng hực khí thế, một chị Mayami đang từ tốn đón nhận.\\nA, thật là……trông họ mới hạnh phúc làm sao."
1865 = "Câu hỏi ngây ngô của Hibiki\\ncàng làm cho khuôn mặt chị Mayami thêm phần rạng rỡ."
1866 = "Ánh mắt Hibiki hướng thẳng về phía chị Mayami.\\nSau đó, em ấy cúi đầu thật sâu."
1868 = "Hibiki thoáng lộ vẻ ngạc nhiên, rồi——\\nỪm? Em ấy bỗng dưng bẽn lẽn lạ thường, mãi không thốt nên lời."
1871 = "Là Hibiki. Em ấy đã thay đồng phục rồi,\\nnhưng tay vẫn xách theo chiếc hộp thiếc nửa vầng trăng, nhìn là biết vừa xong nhiệm vụ."
1881 = "Năm nào cũng có——đúng là vậy thật.\\nÍt nhất là từ khi em bắt đầu làm việc cho Đường sắt Ohito, năm nào cũng vậy."
1882 = "Chính xác là vậy.\\nCảm xúc mà em đang trải qua lúc này, có lẽ ông Minokasa cũng đã từng cảm nhận được."
1884 = "\"Tắm rửa, ăn uống và lên chuyến tàu Kiha 07S.\\nChuyến tham quan Ohimitera chỉ còn lại những việc đó để khép lại.\""
1886 = "Em nghĩ thời điểm hoàn hảo nhất là khi đầu máy vừa chạm đến\\ntrụ cầu sát bờ đối diện theo hướng di chuyển……nhưng mà……"
1888 = "\"Để du khách dễ dàng quan sát, chiếc xô đã được đặt lên bàn cân và chỉnh về 0kg,\\ntôi xúc một xẻng than rồi đổ rào rào vào đó.\""
1892 = "Và rồi, một nụ cười rạng rỡ nở rộ trên môi chị."
1894 = "Khuôn mặt giật mình trong bức ảnh nhanh chóng chuyển thành nụ cười.\\nReina cũng vội vàng lấy điện thoại của mình ra và giơ lên."
1896 = "「Ufufuu, sao đây ta,\\nReina cũng cực kỳ mong chờ luôn nha」"
1899 = "Quả không hổ danh là ý thức chuyên nghiệp,\\nReina lại bắt đầu lại từ đầu, chầm chậm từng chút một."
1901 = "Suốt quãng đường được dẫn đi, em đã cứ nghĩ là không thể nào đâu, không thể nào đâu,\\nnhưng không ngờ lại đúng chóc thế này——"
1903 = "Reina hơi nghiêng đầu, nhưng ngay sau đó,\\nvẻ mặt ngơ ngác đã được thay thế bằng một nụ cười rạng rỡ."
1905 = "Vừa được khen xong đắc ý cái là keng một phát!\\nXẻng đập vào cửa buồng lửa, Reina lộ vẻ tê rần cả tay."
1909 = "Thật hiếm thấy. Khuôn mặt chị Mayami thay đổi liên tục.\\nTừ xấu hổ, bối rối cho đến e thẹn——"
1936 = "Chị Mayami bước đến trước cỗ máy tập luyện.\\nChị chậm rãi bắt chước động tác của em——rồi gật đầu thật sâu."
1938 = "Chị Mayami lại một lần nữa\\nnhấc chai rượu chưa dán nhãn lên."
1939 = "Kết quả xúc than của chị Mayami đã bị chôn vùi dưới đống than của Reina.\\nNhưng em vẫn có thể trả lời mà không chút do dự."
1942 = "「Ưm fufu. Thấy bé Reina vui vẻ,\\nchị cũng vui lắm」"
1944 = "Nghe chị Mayami giải thích tình hình,\\nHibiki \"À——\" lên một tiếng rồi gật gù thấu hiểu."
1947 = "Chị Mayami dịu dàng xoa đầu Reina.\\nSau đó chị quay một vòng, hơi nheo mắt nhìn ngó xung quanh."
1949 = "Chuyển động cơ thể của chị Mayami hoàn toàn đúng như những gì em chỉ dẫn.\\nVăn võ song toàn một cách rất tự nhiên——Em cảm nhận rõ ràng dòng máu giống hệt Hibiki đang chảy trong chị."
1950 = "Ánh mắt chị Mayami lại một lần nữa hướng về phía cỗ máy tập xúc than."
1952 = "Chị Mayami nhẹ nhàng ngắt lời Hibiki.\\nRồi tay chị nhấc lên một chai rượu Issho chưa dán nhãn."
1955 = "Chị Mayami cũng đã chuẩn bị sẵn một cốc nhựa cho mình.\\nVậy thì, người bắt nhịp nâng ly nên là chú rể như em mới phải."
1957 = "Bị xoa đầu qua lớp mũ,\\nReina tròn xoe mắt trong thoáng chốc, rồi lập tức nheo lại tận hưởng."
1960 = "Đôi mắt chị Mayami thoáng chốc tròn xoe,\\nrồi lại chăm chú nhìn em."
1966 = "Một tiếng còi hơi nước kéo dài hết sức hào phóng.\\nCột khói trắng dài tuyệt đẹp cuồn cuộn tuôn ra như bị tiếng còi đẩy lên."
1971 = "Lượng than trong khoang chứa của cỗ máy tập luyện đã giảm đi trông thấy.\\nEm chỉ mới rời mắt đi một chút thôi mà——"
1976 = "Bị lặp lại y hệt, em mới chợt nhận ra.\\nNhững lời em vừa nói cũng chỉ là lặp lại y chang những gì Hachiroku đã nhồi nhét vào đầu em mà thôi."
1982 = "「Đúng vậy ạ. Được chị chỉ dạy bằng lời, Reina mới\\nhiểu ra 『À, là như thế này sao』 đó ạ」"
2002 = "Vừa dứt lời, em chợt nhận ra điều gì đó và vội nói thêm."
2003 = "Nói xong, Reina liền hăm hở bắt đầu xúc than.\\nRa là vậy, thế này thì——khá là ra dáng đấy chứ."
2004 = "Nói rồi, chị Mayami cũng uống cạn sạch cốc rượu của mình."
2005 = "Nói rồi, Reina đúng nghĩa vò đầu bứt tai.\\nVò qua vò lại——Bốp, cô bé vỗ hai tay vào nhau."
2014 = "Cái gọi là \"Trẻ con trước cổng chùa không học cũng thuộc kinh\"——kiến thức ở mức độ đó,\\nem cũng có, mà Hibiki thì lại càng rành hơn. Nhưng mà——"
2015 = "Ý tưởng bất ngờ đó khiến chị Mayami bật cười thành tiếng."
2016 = "Chủ đề này mà kéo dài thêm thì nguy hiểm lắm.\\nLinh tính mách bảo thế, nên em phải nửa ép buộc cắt ngang."
2017 = "Đây chính xác là tính cách của chị ấy.\\nChị Mayami bắt đầu xác nhận lại từ cách cầm xẻng than."
2022 = "Dù đang trong tuần trăng mật, nhưng đây là lời mời từ chính cô dâu,\\nvới lại——cũng coi như là một chén rượu mừng."
2037 = "（Tách）"
2038 = "（Tuúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúú!!!）"
2039 = "（Tu!!）"
2041 = "（Keng!!!）"
2043 = "（Trông chị Mayami mới hạnh phúc làm sao.）"
2045 = "（Phập）"

