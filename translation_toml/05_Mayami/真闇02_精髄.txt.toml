1628 = "「À, việc ra đón là vì em có chuyện muốn báo cáo ạ. \\nMột tin tức vô cùng tốt lành vừa mới đến.」"
1630 = "「À không, đúng là vậy nhưng mà——」"
1632 = "「A~……Nếu được ngồi thì thích thật đấy. \\nNhưng mà, vẫn chưa có \\x%l客車;#00ffc040;toa hành khách%l;#; đúng không?」"
