1666 = "「À, vất vả nhưng mà vui lắm. \\nCó lẽ, nó cũng giống như công việc ủ rượu của chị Mayami thôi——Á.」"
1667 = "「Hửm?」"
1669 = "「Ừm? \\nQua câu chuyện vừa rồi, tại sao chị lại nghĩ vậy?」"
