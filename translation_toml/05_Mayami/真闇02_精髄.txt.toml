1681 = "「Chị gái, là chị gái mà.\\nĐồ mà em gái đang muốn có, không được phép nẫng tay trên đúng không?」"
1682 = "「Vì là chị gái sao?」"
1683 = "「Một phần hơi nước chảy vào xi-lanh sẽ nguội đi ở đó, \\nvà biến trở lại thành nước. Vì vậy, phải mở van để xả nó ra ngoài.」"
1684 = "「Nấm men, nói cách khác chính là nguồn gốc của quá trình lên men. Nếu thiếu cái này, \\nthì không thể phân giải lượng đường thành cồn được.」"
1687 = "「Cảm giác thế nào ạ? Ở trên buồng lái ấy.」"
1691 = "「Bé Hachiroku, năng lực phân tích và độ chính xác trong công việc tuyệt vời lắm.\\nĐã đào sâu đến mức chị cũng chẳng thể bắt chước được luôn đó.」"
1692 = "「Nhờ vậy mà chị cũng tìm thấy manh mối cho loại shochu hơi nước mới rồi. \\nPau-chan, cảm ơn em đã cho chị đi nhờ nhé.」"
1697 = "「Ngạc nhiên thật đấy.」"
1700 = "「Ngài Soutetsu có tài năng của một \\x%l機関士;#00ffc040;lái tàu%l;#; đấy ạ——đại loại thế, \\ncứ có dịp là em ấy lại hết lời khen ngợi em.」"
1703 = "「Em ấy làm việc với tâm trạng rất tốt đấy? \\nThỉnh thoảng trong lúc nghỉ ngơi, em ấy lại vui vẻ kể cho chị nghe chuyện về Sou-chan.」"
1705 = "「Em ấy còn nói là nhờ em hỗ trợ rất nhiều, \\nnên em ấy mới có thể thoải mái chuyển đổi tâm trạng để tập trung vào việc ủ rượu đấy?」"
1706 = "「Tin tốt lành sao ạ?」"
1708 = "「Nóng quá! Chật chội quá! \\nThế nhưng lại rất vui!」"
1709 = "「Nào, từ đây sẽ là \\x%lブレーキ;#00ffc040;phanh%l;#.」"
1713 = "「Một, con người.」"
1717 = "「Đúng vậy.」"
1720 = "「Tại sao á, Sou-chan.」"
1721 = "「Nếu là Sou-chan thì chỉ cần suy nghĩ một chút là hiểu ngay thôi. \\nShochu hơi nước trước đây và loại này, khác nhau ở điểm nào?」"
1723 = "「Cái tay gạt em vừa kéo về đó hả?」"
1725 = "「Là thế đó.\\nSou-chan cũng hiểu mà đúng không? Em cũng là anh trai mà.」"
1726 = "「Em nghĩ đó là một quyết định hoàn toàn chính xác.\\nĐây…… không phải là tạp vị, mà là hương vị.」"
1729 = "「Và mong cho những thứ thực sự muốn,\\nchắc chắn sẽ có thể đạt được.」"
1735 = "「Thú vị lắm! \\nThực sự ngồi lên mới hiểu được nhiều điều.」"
1739 = "「Nói sao nhỉ…… việc tự cho mình là ngoại lệ ấy――\\nViệc cứ đinh ninh rằng, chỉ có bản thân mình là không được phép.」"
1740 = "「Em…… em thì――」"
1741 = "「Em, á―― sao?」"
1742 = "「Dù là con người, hay \\x%lレイルロオド;#00ffc040;Railord%l;#;. Em tin rằng, bất cứ ai có ý chí,\\nđều có quyền mang trong mình những ước muốn, và quyền được hiện thực hóa chúng.」"
1747 = "「Những thứ không quan trọng thì em nhường.\\nNhưng nếu là thứ em thực sự muốn, thì dù có bị khóc lóc em cũng không nhường đâu.」"
1749 = "「Giải Grand Prix. Giải thưởng cao nhất. Của ISC.」"
1750 = "「Đầu tiên, em đóng \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;# lại.」"
1755 = "「Em á? Em thì―― đâu có nhường nhịn đến mức đó đâu?」"
1757 = "「Vì vậy, nếu lượng hơi nước bơm vào xi-lanh tăng lên, \\ntốc độ quay của \\x%l動輪;#00ffc040;bánh xe chủ động%l;# cũng sẽ nhanh hơn, và tàu sẽ tăng tốc——Á.」"
1761 = "「Sou-chan cũng, được phép muốn có đúng không?」"
1762 = "「Vì vậy, việc thiết kế sao cho khi không khí thoát ra thì \\x%lブレーキ;#00ffc040;phanh%l;# sẽ hoạt động, \\nlà để nâng cao thêm tính an toàn.」"
1766 = "「Vậy nên, \\nhai tuần nữa \\x%l客車;#00ffc040;toa hành khách%l;# sẽ đến Ohimitera!」"
1771 = "「Giống như tình trạng bơm đầy không khí vào ống tiêm, bịt kín đầu lại, \\nvà cố gắng đẩy pít-tông vậy ạ.」"
1773 = "「Vậy thì, tiếp theo―― thứ mà em vẫn luôn muốn có,\\nchắc chắn em cũng sẽ lấy được cho xem.」"
1774 = "「Thêm gạo nấu rượu đã vo sạch và hấp chín cùng với nước vào \\x%lもろみ;#00ffc040;cơm rượu%l;#; lên men lần một đã làm ra đó, \\ncho lên men để tạo thành \\x%lもろみ;#00ffc040;cơm rượu%l;#; lên men lần hai.」"
1780 = "「Chuyện là vậy đó. Chị Mayami có nguyện vọng gì không? \\nĐể có thể vận hành như một chuyến \\x%l列車;#00ffc040;tàu%l;# shochu.」"
1782 = "「Vậy thì, \\x%lもろみ;#00ffc040;cơm rượu%l;#; lên men lần hai sau khi làm xong sẽ được xử lý như thế nào?」"
1786 = "「Nếu vậy thì.」"
1787 = "「Vậy thì, khi nào được cho phép thì——」"
1792 = "「Đúng vậy! Không phải chỉ có xúc than vào thôi đâu!」"
1793 = "「À——」"
1794 = "「Vậy sao. \\nNếu chị Mayami đã nói thế, thì chắc là vậy rồi.」"
1795 = "「Vậy sao?」"
1796 = "「Vậy sao? Vậy thì việc triển khai cứ giao cho Paulette, \\nnếu trong quá trình vận hành có trục trặc gì thì sẽ cải thiện sau.」"
1798 = "「Vâng. Giữa Ohimitera và bên đó, \\nhình như có một mối duyên nợ xa xưa nào đó về đất đai thì phải——」"
1799 = "「Đó là, men kōji——men kōji gạo và \\x%lもろみ;#00ffc040;cơm rượu%l;#;.」"
1806 = "「Dạo gần đây——Tại sao chị lại tránh mặt em——À không, \\ntại sao chị lại tránh việc gặp gỡ và trò chuyện ở đây như thế này?」"
1808 = "「Có rồi. Mong muốn. Thứ em muốn có.」"
1810 = "「Có khả năng đó. \\nVì vậy cần phải mở bypass——lối thoát cho không khí.」"
1818 = "「Chào mừng mọi người đã về. Mọi người vất vả rồi.」"
1819 = "「Vô cùng hoan nghênh!」"
1822 = "「Bên trong xi-lanh có piston. \\nChuyển động của piston đó sẽ biến thành chuyển động quay của \\x%l動輪;#00ffc040;bánh xe chủ động%l;#.」"
1824 = "「Đúng thế nhỉ, không biết được đâu nhỉ.」"
1825 = "「Đúng vậy. Sau đó, cồn và nước bốc hơi do bị đun nóng \\nsẽ được làm lạnh bằng máy làm lạnh để ngưng tụ lại, thế là hoàn thành món shochu gạo.」"
1826 = "「Đúng vậy đúng vậy. Nếu không thì, Hachiroku-chan \\nđã chẳng vui vẻ kể cho chị nghe chuyện công việc trên tàu như thế đâu.」"
1831 = "「Dù đã gây nhiều gánh nặng cho Paulette rồi nhưng——\\nchuyện đó, tiếp tục nhờ em được chứ?」"
1842 = "「Quản lý nhiệt độ đã khớp một cách tuyệt diệu nhỉ.\\nDù phong phú, nhưng lại là một hương vị rất trong trẻo.」"
1843 = "「Để biến ý tưởng của Sou-chan thành hiện thực, \\nchị phải cố gắng nhiều hơn nữa mới được——Á.」"
1844 = "「Là để phòng trường hợp ống \\x%lブレーキ;#00ffc040;phanh%l;# bị hỏng, \\nhoặc \\x%l客車;#00ffc040;toa hành khách%l;#・\\x%l貨車;#00ffc040;toa chở hàng%l;# bị tách rời ạ.」"
1846 = "「Chị muốn tận dụng sự mộc mạc này.\\nNên phần lọc, chị cũng thử để không lọc luôn.」"
1847 = "「Tại sao mở ra rồi lại đóng lại ngay?」"
1848 = "「Tại sao sau khi chưng cất mà hương vị vẫn còn đọng lại nhiều đến vậy?」"
1849 = "「Tại sao lại phải nhân giống nấm men?」"
1850 = "「Tại sao lại làm cấu tạo phức tạp đến vậy?」"
1853 = "「Chỉ cần vặn van cấp nước ở đó, nước trong tender \\nsẽ được bơm vào lò hơi.」"
1854 = "「Cái đồng hồ đo mực nước này hiển thị lượng nước trong lò hơi. \\nViệc giữ vạch chỉ thị ở mức 80 là rất quan trọng đó!」"
1858 = "「Chính xác ạ!」"
1861 = "「Bây giờ, tay gạt \\x%l自弁;#00ffc040;van hãm tự động%l;# đang ở vị trí \\x%l常用;#00ffc040;phanh thường%l;#——\\nlà vị trí \\x%lブレーキ;#00ffc040;phanh%l;# sử dụng thông thường.」"
1863 = "「Được chứ chị Mayami. Vô cùng hoan nghênh luôn.」"
1865 = "「Nhìn bề ngoài thì có vẻ khó thật——\\nnhưng động cơ hơi nước, về nguyên lý thì khá đơn giản.」"
1867 = "「Thật sự là chu đáo quá đi mất. \\nĐã cho đi nhờ rồi mà còn ra tận nơi đón nữa.」"
1868 = "「Thật sự đấy. \\nThiết kế quá tuyệt vời. Thú vị thật!」"
1880 = "「Chị Mayami. \\nManh mối cho shochu hơi nước là——」"
1882 = "「Nhờ vào kinh nghiệm tích lũy từ trước đến nay, \\nchị Mayami có thể tận dụng những loại vi khuẩn hay nấm mốc để tạo ra loại rượu ngon.」"
1884 = "「Chị Mayami. \\nHửm? ……………………Gì vậy, không có ở đây sao.」"
1886 = "「Chị Mayami thấy thế nào? Cảm giác ngồi trong buồng lái ra sao?」"
1888 = "「Ý chị thế nào, chị Mayami. Em biết chị rất bận, \\nnhưng chị có muốn thử ngồi lên chiếc \\x%l8620;#00ffc040;8620%l;#; một lần không?」"
1892 = "「Mong cho giải Grand Prix của ISC.」"
1896 = "「Em vừa xả nước khỏi xi-lanh. \\nMở van xả nước xi-lanh này ra, rồi đóng lại.」"
1899 = "「Hơn nữa, nhìn hai người làm việc cũng thú vị lắm. \\nSou-chan có thể điều khiển những cỗ máy phức tạp thế này một cách thuần thục nhỉ.」"
1901 = "「Hơi nước, \\nkhông chỉ dùng để chạy, mà còn giúp ích cho việc dừng lại nữa.」"
1903 = "「Và hoạt động của những vi khuẩn axit lactic hay nấm mốc đó, \\nkhông chỉ bắt nguồn từ nguyên liệu hay nước, mà sẽ quyết định cái gọi là hương vị sao.」"
1904 = "「Nếu chị đã nói vậy……\\nthì có lẽ, là thế nhỉ.」"
1905 = "「Không sai đâu. Sou-chan có tài năng \\ntruyền động lực cho những người xung quanh bằng cách đó đấy!」"
1907 = "「\\x%l運転台;#00ffc040;Buồng lái%l;#; á……Có được cho lên ngồi không?」"
1920 = "「Chưng cất. Trong trường hợp của shochu hơi nước thì——\\nlà chưng cất áp suất thường sử dụng hơi nước đun bằng lò hơi đốt than nhỉ.」"
1922 = "「Giấu em?」"
1925 = "「Nếu có Hachiroku-chan ở đây, em ấy sẽ dùng lý lẽ để \\ngiảm bớt sự dao động. Có thể tái hiện lại, và đào sâu hơn nữa.」"
1926 = "「Nếu chưng cất xong mà mùi vị nào cũng giống nhau, \\nthì việc ủ rượu đâu cần đến \\x%l杜氏;#00ffc040;trưởng hầm rượu%l;#; làm gì.」"
1930 = "「Quản lý nhiệt độ của cái gì?」"
1933 = "「Ở vị trí này, khí nén trong \\x%lブレーキ;#00ffc040;phanh%l;# \\nsẽ được \\x%l減圧;#00ffc040;giảm áp%l;# 0.4kg/cm2.」"
1938 = "「Việc duy trì \\x%lブレーキ;#00ffc040;phanh%l;# là nhờ hoạt động của khí nén. \\nVà động lực của \\x%l空気圧縮機;#00ffc040;máy nén khí%l;# tạo ra nó, tất nhiên cũng là hơi nước.」"
1972 = "「Đây là……chỉ nhờ quản lý nhiệt độ mà được thế này sao?」"
1973 = "「Không phải vì Ohimitera, cũng không phải vì nhà Migita.\\nMà với tư cách cá nhân, em đơn thuần chỉ muốn chiến thắng. Bằng loại rượu này.」"
1974 = "「\\x%l逆転機;#00ffc040;Cần đảo chiều%l;# này, nếu so với ô tô thì giống như cần số vậy. \\nCó thể cài đặt tiến, lùi, và \\x%lミッドギア;#00ffc040;số trung tính%l;#——tức là Neutral.」"
1975 = "「Ờm…… thì.\\nNói sao nhỉ, đúng rồi. Vì chị là chị gái mà.」"
1976 = "「Làm gì có chuyện đó……\\nBan ngày gặp nhau suốt còn gì.」"
1978 = "「Đó là công việc của Hii-chan sao?」"
1979 = "「Cái đó thì để sau hẵng hay. \\nĐể chị thử nghiệm xong rồi mới nói.」"
1980 = "「Nếu loại rượu này là một trong những lý do.\\nVậy những lý do khác, là gì?」"
1981 = "「Việc hỗ trợ thì……tất nhiên, \\nem đang cố gắng hết sức có thể nhưng——」"
1982 = "「Shochu hơi nước theo ý tưởng mới sao?」"
1983 = "「Loại do Hachiroku quản lý nhiệt độ có rất nhiều tạp vị. \\nNói thẳng ra là, không ngon.」"
1984 = "「Được tinh chế bằng sức mạnh của con người và \\x%lレイルロオド;#00ffc040;Railord%l;#;, của lửa và nước.\\nĐây, quả thực chính là một giọt tinh túy của hơi nước.」"
1986 = "「Vừa rồi em làm gì vậy?」"
1987 = "「Hương vị của tiềm năng sao. Từ đây, sẽ có bao nhiêu loại shochu ngon, \\nvà một tương lai mới nào sẽ được sinh ra nhỉ.」"
1988 = "「Chị đã cảm nhận được từ SL đó.」"
1989 = "「Làm như vậy thì nấm men kōji sẽ sinh sôi. Thêm men shochu và nước vào men kōji gạo này, \\nnhân giống nấm men lên để tạo thành \\x%lもろみ;#00ffc040;cơm rượu%l;#;.」"
1991 = "「Nếu cứ để nguyên như vậy mà tiếp tục chạy, \\nthì xi-lanh sẽ bị hỏng mất sao?」"
1992 = "「Khi đó, một mối quan hệ mới giữa con người và \\x%lレイルロオド;#00ffc040;Railord%l;#; sẽ được thiết lập. \\nBởi vì một cánh cửa mới sẽ được mở ra trong lĩnh vực cảm giác của con người.」"
1994 = "「Nếu nói vậy thì phải là em mới đúng. \\n\\x%l機関士;#00ffc040;Lái tàu%l;# và \\x%lレイルロオド;#00ffc040;Railord%l;# chẳng khác nào tuy hai mà một.」"
1996 = "「Nước sông Kuma, và đất của Ohimitera. \\nTất cả được cô đọng lại trong này.」"
1997 = "「Rượu. Và gạo. \\n——Là rượu, làm từ gạo nhỉ.」"
1998 = "「Đây quả thực, vô cùng xứng đáng với cái tên shochu hơi nước.」"
1999 = "「Nếu nói là đội thì phải là em chứ! \\n\\x%l機関士;#00ffc040;Lái tàu%l;# và \\x%l機関助士;#00ffc040;phụ lái tàu%l;# là một cặp bài trùng mà!」"
2003 = "「Với phương pháp dùng khí nén để tạo \\x%l圧;#00ffc040;áp suất%l;# \\x%lブレーキ;#00ffc040;phanh%l;#, \\nthì khi bị tách rời, toa khách và toa hàng sẽ mất kiểm soát vì không có \\x%lブレーキ;#00ffc040;phanh%l;#.」"
2008 = "「Thế?」"
2009 = "「Chị gái…… cũng được phép muốn có, sao?」"
2013 = "「Vậy thì, khi nào làm ra được loại rượu ngon, \\nhãy cho em đóng góp thêm ý tưởng của mình vào đó nhé.」"
2015 = "「Thế thì tuyệt quá! Vậy thì, đến lúc đó」"
2016 = "「Vậy thì tốt quá.」"
2018 = "「Đó có phải là loại shochu hơi nước mới mà chị Mayami đang hướng tới không?」"
2022 = "「Vậy là được rồi. \\nChị có biết gì về đường sắt đâu.」"
2023 = "「Đương nhiên rồi. Chị Mayami, trước khi là một người chị gái,\\nthì cũng là một con người mang tên Migita Mayami mà.」"
2024 = "「Là một đội mà? Phải có mặt tất cả mọi người chứ.」"
2025 = "「Men kōji gạo được làm từ cái gì, và làm như thế nào?」"
2033 = "「Nước trong lò hơi sẽ chuyển thành hơi nước nhờ sức nóng của than cháy. \\nHơi nước sinh ra, thông qua tay gạt \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;# này——」"
2035 = "「Đào sâu, sao.」"
2041 = "「Chuyện về em sao?」"
2047 = "「Tạp vị và hương vị chỉ cách nhau một ranh giới mỏng manh. Yếu tố quyết định hương vị là, \\nnguyên liệu, men, quá trình lên men, quá trình ủ——A!」"
2048 = "「Không lẽ nào, liên quan đến \\x%l客車;#00ffc040;toa hành khách%l;#!?」"
2053 = "「Hấp gạo nấu rượu, rắc bào tử men kōji lên, giữ ấm, \\nđảo đều và ủ.」"
2054 = "「Chúng ta đã được nhượng lại \\x%l客車;#00ffc040;toa hành khách%l;# rồi! \\nLà \\x%l客車;#00ffc040;toa hành khách%l;# được cải tạo từ \\x%l気動車;#00ffc040;toa xe tự hành%l;#, từ Đường sắt Suntai.」"
2059 = "「!」"
2060 = "「!!」"
2061 = "「っ!?」"
2064 = "『「Cạn ly」\\n「Cạn ly」』"
2072 = "『「Hết hạn chế tốc độ! Rõ!」\\n「Hết hạn chế tốc độ! Rõ!」』"
2189 = "Không hiểu sao chị Mayami lại há hốc mồm ngạc nhiên."
2190 = "Không hiểu sao hôm nay tôi cảm thấy cái nóng có vẻ gay gắt hơn mọi khi, \\nnên tôi hơi lo lắng không biết chị Mayami có chịu nổi không."
2194 = "Vì tự nhận thức được điều đó nên tôi chắt lọc từ ngữ,\\ncẩn thận để không nói ra những điều thừa thãi."
2195 = "Ban ngày thì vẫn gặp nhau bình thường, \\nvà trò chuyện cũng như mọi khi."
2197 = "Không, người tuyệt vời là chị Mayami mới đúng. \\nChỉ với một câu nói vừa rồi mà đã hiểu được."
2202 = "Chẳng có ai cấm đoán việc tôi muốn có thứ gì cả."
2215 = "Điều đó…… quả thực, là vậy nhưng――"
2217 = "Hoàn toàn khác với mùi bùn đất——\\nMà chỉ là một sự ấm áp trù phú."
2218 = "Nhưng với một kẻ bị bỏ lại như tôi…… điều đó có vẻ thật tội lỗi.\\nVì thế, chắc chắn tôi đã luôn cố gắng để không mong muốn bất cứ điều gì."
2221 = "Nhưng giờ thì, không có xiềng xích cũng không sao rồi."
2235 = "Bên trong buồng lái quả thực là một nơi chật hẹp, \\nnhưng thêm một mình chị Mayami thì cũng không ảnh hưởng gì đến việc vận hành."
2239 = "Sau khi xác nhận biển báo và \\x%l喚呼;#00ffc040;hô xác nhận%l;# xong, mắt Hachiroku khẽ động. \\n……Phía trước một đoạn sẽ là khu vực trong rừng."
2242 = "Trên khuôn mặt Hachiroku thoáng hiện một nụ cười gượng gạo, \\nnhưng đây là đoạn đường không có giới hạn tốc độ——thế này thì giải thích sẽ dễ hiểu hơn."
2244 = "Có thể nói đó là loại rượu nguyên thủy, \\nnhưng ở trạng thái này, có quá nhiều tạp chất."
2245 = "Sau khi vượt qua khúc cua, chúng tôi cũng ra khỏi khu rừng."
2249 = "Bù lại cho việc vị ngon không được chắt lọc sắc bén,\\nở đó còn đọng lại một sự mạnh mẽ vững chãi."
2256 = "Cùng với giọng nói là tiếng xúc than. \\nChúng tôi đồng loạt lấy đà và vọt lên! Tàu bắt đầu tăng tốc."
2260 = "Nguyên thủy, mang sự phức tạp từ những thứ đơn giản kết hợp lại,\\nmạnh mẽ, không hào nhoáng, và tuyệt đẹp."
2264 = "Tầm nhìn vốn bị thu hẹp lại của tôi đã trở lại――\\nVà ngay khi nó trở lại, tôi chợt nhận ra, à, ra là vậy."
2276 = "Tuy nhiên, những việc tôi làm thay Hachiroku, \\nhầu như chỉ là kiểm tra và bảo dưỡng trong phạm vi tôi có thể làm."
2278 = "Có lẽ tâm trí chị ấy đã hướng về loại shochu hơi nước mới rồi——\\nChị Mayami lộ vẻ hơi ngạc nhiên trước lời nói của tôi."
2295 = "Một \\x%l杜氏;#00ffc040;trưởng hầm rượu%l;#; của nhà Migita, và một nạn nhân của vụ tai nạn.\\nVai trò, hay có lẽ là bổn phận."
2301 = "Uống cạn, trong một hơi."
2315 = "Đó là bởi, tôi vẫn có sự e dè của anh em nuôi,\\nvà cả sự tự ti vì mình là con nuôi nữa. Nhưng, với Michiko thì――"
2319 = "Trên thế giới chắc chắn vẫn còn rất nhiều \\x%lレイルロオド;#00ffc040;Railord%l;#; mất đi \\x%l列車;#00ffc040;đoàn tàu%l;#; của mình \\nđang sống sót."
2323 = "Giới hạn 60——\\nNgay khi xác nhận biển báo, tiếng \\x%l喚呼;#00ffc040;hô xác nhận%l;# của tôi và Hachiroku vang lên đồng thanh."
2330 = "Bối rối trước cử chỉ không quen thuộc ấy, \\ncổ họng tôi tự động buột ra những lời đó, rồi trái tim mới nhận ra muộn màng."
2332 = "Ực một cái, thứ trong cốc được uống cạn sạch trong một hơi."
2334 = "Một tiếng hùa theo hoàn toàn không có chút gượng ép nào.\\nLàm cõi lòng tôi cũng được nới lỏng ra."
2335 = "Hibiki điều khiển chiếc xẻng xúc than một cách điêu luyện, \\ntiếp tục duy trì ngọn lửa trong \\x%l火室;#00ffc040;buồng đốt%l;#."
2340 = "Ánh mắt chị ấy nhìn tôi cũng tràn đầy tự tin, \\nnhư thể muốn xóa tan đi mọi sự do dự trong tôi."
2342 = "Mặc dù đó là một lời chỉ trích hoàn toàn hiển nhiên, nhưng tôi vẫn cảm thấy bối rối."
2343 = "Bị hỏi một chuyện chán ngắt rồi.\\nBiểu cảm đó hiện rõ mồn một trên mặt chị."
2345 = "Giọng nói đang dang dở bỗng vỡ òa thành một nụ cười gượng."
2347 = "Chị Mayami xoay người lại,\\nvà trút ra một tiếng thở dài, mệt mỏi."
2350 = "Chị ấy thản nhiên rót đầy một chiếc ly và đưa cho tôi."
2352 = "Nếu không như vậy, tôi sẽ đánh mất đi ý nghĩa sống của mình."
2354 = "Nếu chỉ muốn nói chuyện, \\nthì buổi sáng hay sau giờ làm việc, chắc chắn vẫn có thể tạo cơ hội được——"
2356 = "Nếu không ai có ước muốn, thì tôi chẳng thể giúp họ hiện thực hóa điều gì cả."
2358 = "Hồi đó―― nếu không tự trói buộc bản thân thật chặt,\\nchắc chắn tôi thậm chí còn chẳng thể đứng vững được."
2362 = "Paulette kể cho chúng tôi nghe \\nmột cách vô cùng trôi chảy và đầy hào hứng."
2363 = "Đúng rồi. \\nNhờ tìm hiểu về việc ủ rượu, tôi đã có thêm một nhận thức mới."
2364 = "Dù là với Hibiki, hay với Hachiroku――\\nChỉ cần tâm tư đủ chân thành, thì nhất định nó sẽ được truyền đạt."
2367 = "Về phần mình, tôi thậm chí còn có cảm giác \\nkỹ năng của một \\x%l庫内手;#00ffc040;máy rửa lò%l;#; đang tăng lên vùn vụt."
2370 = "Nếm thử trong tình trạng chưa ủ, \\nmà nguyên liệu và men lại hoàn toàn giống nhau, vậy thì——"
2376 = "Nhận được loại \\x%l客車;#00ffc040;toa hành khách%l;# nào, và quá trình được nhượng lại ra sao."
2378 = "Kể từ cái ngày mất đi Michiko đó,\\nviệc thực sự muốn có một thứ gì đó……"
2389 = "Cảm giác như đang ngó nghiêng, nhìn quanh."
2391 = "Tôi lơ đãng nghĩ rằng liệu có phải vì Michiko và tôi là anh em sinh đôi không,\\nnhưng rồi lại lập tức phủ nhận điều đó."
2394 = "Cảm giác như đã hiểu được thứ chị ấy muốn, \\ntôi trả lại chiếc ly nếm thử mới chỉ uống một ngụm vào tay chị ấy."
2398 = "Tôi cứ ngỡ dạo gần đây, \\nnhịp độ đó đã được thiết lập rồi chứ……"
2400 = "Ừm ừm, hai chúng tôi đối diện nhau, gật đầu, và cùng bật cười."
2402 = "Cứ tưởng sẽ làm chị ấy giật mình, \\nnhưng chị Mayami chỉ nở một nụ cười gượng gạo như đang bối rối."
2405 = "Mở rồi đóng van xả nước xi-lanh, \\ngạt \\x%l逆転機;#00ffc040;cần đảo chiều%l;# về \\x%l前進フルギア;#00ffc040;cài hết số tiến%l;# một lần nữa, đồng thời đóng \\x%lバイパス弁;#00ffc040;van bypass%l;# lại——"
2407 = "Tôi cảm nhận được chị Mayami đang gật gù ra chiều đã hiểu."
2412 = "Đưa \\x%l自弁;#00ffc040;van hãm tự động%l;# về \\x%l重なり位置;#00ffc040;vị trí giữ phanh%l;#, vừa duy trì lực \\x%lブレーキ;#00ffc040;phanh%l;#, \\nvừa nạp lại khí nén."
2414 = "Tôi bước ra từ sau bồn chứa."
2415 = "Tôi lấy lại chiếc ly từ chị Mayami, \\nvà nốc cạn phần còn lại trong một hơi."
2418 = "Nó không phải là thứ được ban cho,\\nmà tôi có cảm giác như chính loại shochu này, đã tự mình múc nó ra."
2422 = "Từ từ đưa \\x%l自弁;#00ffc040;van hãm tự động%l;# về vị trí \\x%l常用;#00ffc040;phanh thường%l;#."
2426 = "Tôi gõ nhẹ ngón tay vào \\x%lバイパス弁;#00ffc040;van bypass%l;# đang mở \\nđể chỉ cho chị ấy."
2429 = "Một giọng nói hào hứng mà tôi chưa từng nghe thấy. \\nNhưng chợt, trên khuôn mặt chị Mayami lại thoáng nét buồn bã."
2430 = "Uống cạn thêm một ly nữa,\\ntôi thậm chí còn cảm thấy như cơn gió rát bỏng của mùa hè Ohimitera, vừa lướt qua cuống họng."
2432 = "\"Chị gái\" mà tôi biết,\\nchỉ có duy nhất một mình chị Mayami mà thôi."
2434 = "Được nụ cười đó xoa dịu, \\nvị giác của tôi cũng bắt đầu tìm lại được ngôn từ."
2437 = "Tôi buông tay đang giữ \\x%l自弁;#00ffc040;van hãm tự động%l;# ra một thoáng, \\nvà làm động tác cho thấy đây là thứ điều khiển \\x%lブレーキ;#00ffc040;phanh%l;#."
2440 = "Với Hibiki, quả thực có lẽ tôi đã nhường nhịn khá nhiều."
2441 = "Kiến thức và tình hình thực tế, cuối cùng cũng đã kết nối với nhau."
2442 = "Dù không hiểu tại sao, tôi vẫn cố gắng xoa dịu đội \\x%l8620;#00ffc040;8620%l;# đang tỏ vẻ bất mãn, \\nvà quay lại nhìn chị Mayami."
2445 = "Giọng nói hào hứng của chị khiến tôi thở phào nhẹ nhõm."
2446 = "Chắc chắn tôi muốn chị Mayami. \\nNhìn thấy công việc của mình——và thích nó."
2449 = "Khi tôi vừa cười gượng vừa giải thích những chuyện đó, \\nkhông hiểu sao chị Mayami lại lộ vẻ mặt thấu hiểu."
2451 = "Chỉ mới bị hỏi thôi, mà tôi đã thấy bối rối rồi.\\nChẳng hiểu sao, tôi lại không thể trả lời ngay là \"Không có\"."
2454 = "Vừa nói, tôi vừa gạt \\x%l逆転機;#00ffc040;cần đảo chiều%l;# về \\x%lミッドギア;#00ffc040;số trung tính%l;#. \\nTôi thao tác chậm rãi và rõ ràng để chị ấy dễ hiểu."
2460 = "Hachiroku và Hibiki sau khi thay sang \\x%l整備体;#00ffc040;thân chính%l;# \\ncũng bước xuống từ buồng lái."
2468 = "Lời nói mà tôi định dành cho chị Mayami, lại như một tiếng keng,\\nbật ngược trở lại chính bản thân tôi."
2470 = "Cùng với lời nói, \\x%l8620;#00ffc040;8620%l;# từ từ giảm tốc độ."
2472 = "Nếu vậy, nếu để chị Mayami tìm hiểu về \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;, \\nthì biết đâu sẽ lại có một điều gì đó mới mẻ được sinh ra."
2477 = "Chị Mayami cũng nói là đã tìm thấy manh mối rồi, \\ntôi muốn nhân đà này để đạt được thành quả luôn."
2479 = "Nếu đó là một ý tưởng mà chị Mayami không có, \\nthì có lẽ tôi cũng có thể đóng góp chút ít vào chuyện này."
2481 = "Nếu vậy, tôi muốn đáp lại sự mong đợi đó."
2492 = "Hibiki và Hachiroku chen vào như thể đang tranh giành."
2495 = "Cùng một loại gạo nấu rượu, cùng một loại nước, cùng một loại men, cùng một thiết bị, \\nvà phương pháp chưng cất cũng hoàn toàn giống nhau."
2497 = "Hương vị của đất."
2508 = "Càng uống, vị giác càng được gột rửa, \\nchỉ còn đọng lại một giọt duy nhất."
2510 = "Trong những lúc rảnh rỗi khi đi tuần tra đêm, \\ntôi thường thong thả trò chuyện với chị Mayami về shochu hơi nước."
2515 = "Đúng rồi, tôi phải xác nhận điểm đó mới được."
2520 = "Bị kích động bởi những câu hỏi dồn dập, \\nnụ cười của Paulette càng thêm rạng rỡ."
2528 = "Mùi rượu nồng nặc, thoang thoảng mùi gạo. \\nA, tôi lập tức nhận ra đây là thứ gì."
2535 = "Tất nhiên, ý tưởng về chuyến \\x%l列車;#00ffc040;tàu%l;# shochu cũng rất quan trọng. \\nNhưng trước đó."
2537 = "Shochu gạo, tất nhiên rồi. \\nQuá đỗi hiển nhiên và mộc mạc, vị ngon khó tả thành lời."
2538 = "Kết thúc chuyến chạy thử nghiệm suôn sẻ và bước xuống ga Ohimitera, \\nPaulette đón chúng tôi với nụ cười rạng rỡ trên môi."
2539 = "Cỡ như tôi thì mãi mới hiểu được cấu tạo của nó, \\nthậm chí còn phải nhờ vẽ cả sơ đồ ra nữa cơ mà……"
2542 = "Vậy thì tiếp theo——tôi chỉ cần đào sâu suy nghĩ thêm nữa là được."
2543 = "Có vẻ như chị ấy đang chăm chú nhìn vào động cơ hơi nước, \\nhơn là ngắm phong cảnh qua khung cửa sổ hẹp của buồng lái."
2544 = "Do tôi mở van khá lớn, nên việc tăng tốc kèm theo một cú sốc."
2572 = "Một khuôn mặt có chút sững sờ."
2573 = "Chắc hẳn chị ấy đang rất vui, \\nhai má chị Mayami ửng hồng lên thấy rõ."
2576 = "Thêm một cái nữa.\\nChị Mayami lấy ra một cái cốc, và rót Hitoshizuku vào đó."
2579 = "Chị Mayami đã tóm tắt lại giúp tôi, khiến tôi thở phào nhẹ nhõm. \\nCó vẻ như kiến thức của tôi cho đến nay không có gì sai sót."
2581 = "Chị Mayami hơi cúi người, \\nngước mắt nhìn tôi với vẻ nũng nịu."
2583 = "Nói với vẻ thấm thía, \\nchị Mayami tinh nghịch nhìn tôi."
2585 = "Chị ấy khẳng định chắc nịch."
2587 = "Sau một khoảng lặng đầy do dự, \\nchị Mayami hé mở đôi môi đang khẽ cắn."
2590 = "Chị Mayami mỉm cười hài lòng. \\nMức độ này thì tôi hoàn toàn hiểu rõ."
2591 = "Một cái gật đầu thật sâu đầy mãn nguyện. \\nTrên khuôn mặt chị Mayami nở một nụ cười như muốn nói rằng tôi đã đạt điểm chuẩn."
2593 = "Một tiếng thốt lên tỏ vẻ đã hiểu. \\nCó vẻ như lời giải thích bổ sung của Hachiroku đã giúp chị Mayami hiểu rõ hơn."
2596 = "Tiếng ậm ừ của chị ấy như đang thúc giục tôi suy nghĩ thêm. \\nVì vậy, tôi ngoan ngoãn diễn đạt suy nghĩ của mình thành lời và sắp xếp lại."
2597 = "Vô cùng ngưỡng mộ. \\nMột tiếng thở dài và đầy nhiệt huyết."
2598 = "Một khuôn mặt nhẹ nhõm."
2600 = "Rẹt một cái, chị Mayami xích lại gần.\\nGần quá. Gần quá."
2603 = "Chị Mayami thở phào, nở một nụ cười nhẹ nhõm."
2605 = "Nếu tửu lượng mạnh như chị Mayami, thì uống nó cũng chẳng khác gì uống nước\\n――Nhưng dù vậy, trông chị như thể đang cố gắng làm cách nào đó để được say."
2607 = "Khuôn mặt chị Mayami méo mó một cách kỳ lạ. \\nNhư thể đang cố nhịn cười, lại như đang che giấu sự đau khổ."
2608 = "Gật đầu cái rụp. \\nChị Mayami đưa tay về phía tôi."
2610 = "Chị Mayami dịu dàng hướng ánh mắt ấm áp xuống chiếc ly nếm thử, \\nrồi nốc cạn một nửa."
2612 = "Một tràng cười rộn rã vang lên."
2615 = "Quả đúng là vậy."
2622 = "Ở giai đoạn \\x%lもろみ;#00ffc040;cơm rượu%l;#; lên men lần hai, \\nhầu hết lượng đường đã được phân giải thành cồn."
2633 = "Và quả thực chị Mayami……\\nlà người luôn nhường nhịn rất nhiều thứ, vì Hibiki, vì tôi."
2635 = "Tiếng bước chân rón rén. \\nTiếng thở bị kìm nén."
2636 = "Nghe chị ấy nói vậy, tôi cũng thấy hơi khó hiểu bản thân mình."
2637 = "Tôi nghe nói, vốn dĩ trong thời gian tập sự, \\n\\x%l機関士;#00ffc040;lái tàu%l;#; hướng dẫn cũng sẽ đi cùng."
2646 = "Hơn là để phát huy khả năng của Hachiroku. \\nLà để bằng mọi giá mở ra con đường rút lại quyết định kêu gọi đầu tư nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;——"
2649 = "Dù thêm vào thứ gì, hay bớt đi thứ gì,\\nhương vị này cũng sẽ bị phá hỏng một cách thảm hại."
2681 = "Ngay khoảnh khắc tôi vừa dứt lời, khuôn mặt chị ấy bừng sáng."
2682 = "Nói dứt khoát như vậy, \\nchị Mayami quay hẳn người về phía Paulette."
2683 = "Không đủ từ ngữ để diễn tả. \\nNhưng dù không đủ, thì mọi lời nói đều là thừa thãi."
2707 = "Đã có tên rồi.\\nMột cái tên thật xứng đáng."
2708 = "Vì bản thân nó cũng có mùi hương và hương vị,\\nnên tùy thuộc vào việc lấy đi bao nhiêu, mà mùi vị sẽ lại thay đổi."
2709 = "Hương vị khác hẳn."
2710 = "Hương vị này. Và \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;.\\nHai hình ảnh hòa quyện vào nhau một cách hoàn hảo."
2712 = "Mộc mạc, và mãnh liệt."
2713 = "Lần này đến lượt tôi, rót rượu,\\nrót đầy ăm ắp vào chiếc cốc không."
2714 = "Ly Hitoshizuku thứ ba này,\\nthấm vào bụng một cách sảng khoái hơn bất kỳ loại rượu nào tôi từng uống cho đến nay."
2715 = "Là đoạn đường không có đường ngang, tín hiệu và biển báo cũng ngắt quãng. \\nDù không thể ngừng chú ý phía trước, nhưng vẫn có thời gian để nói chuyện."
2716 = "Hương vị gạo đặc trưng của Kuma shochu thì tốt đấy, \\nnhưng nó quá mạnh, đến mức trở nên vẩn đục."
2717 = "Rượu, làm cho đôi môi trở nên trơn tru."
2718 = "Rượu. \\nTừ lưỡi và mũi truyền đến não, chỉ có từ đó vụt qua."
2720 = "Vì chúng tôi đã luôn hoàn thành nó quá tốt,\\nnên ngoài điều đó ra, chúng tôi chẳng biết phải làm thế nào nữa."
2724 = "Nó thiếu đi sự thanh mát một cách đáng ngạc nhiên."
2730 = "Việc lọc trong nấu rượu tức là, công đoạn lọc bỏ\\nphần cồn dư thừa sinh ra khi \\x%lもろみ;#00ffc040;cơm rượu%l;#; lên men."
2737 = "Ngoài vị ngọt và hương thơm thoang thoảng của gạo, \\ncảm giác mộc mạc và đậm đà này là——"
2743 = "Và chúng tôi, nâng ly cạn chén như một lẽ đương nhiên."
2744 = "Rồi tôi từ từ đóng \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;# lại, \\nvà mở \\x%lバイパス弁;#00ffc040;van bypass%l;# cho chị ấy xem."
2746 = "Rồi, lẩm bẩm. \\nChị Mayami nói thêm một câu như đang tự nhủ."
2747 = "Bên kia tầm nhìn rộng mở là một khung cảnh đồng quê vô cùng thanh bình. \\nĐi thêm một đoạn nữa, sẽ có một con sông và cây cầu sắt đang chờ đón."
2749 = "Bị chị Mayami cuốn theo, nên suy nghĩ đó tự nhiên nảy sinh thôi nhưng……"
2750 = "Có tinh thần là tốt, \\nnhưng nếu vì tranh giành mà làm hỏng bầu không khí tốt đẹp thì cũng vô ích."
2751 = "Dù nghĩ rằng đây là một lời giải thích thừa thãi, \\nnhưng tôi vẫn tiếp tục nói về \\x%lブレーキ;#00ffc040;phanh%l;#."
2753 = "Dù là con nuôi, tôi cũng là một thành viên của nhà Migita. \\nQuy trình làm rượu thì tôi cũng đã được học qua một lượt rồi cơ mà——"
2754 = "Nói thì nói vậy nhưng việc xúc than cũng không thể thiếu."
2755 = "Chúng tôi không hề có hẹn trước. \\nChỉ là tôi đơn phương tìm đến thôi."
2756 = "Dù có gần thì cũng chẳng có ý nghĩa gì đặc biệt――\\nNhưng tôi lại trở nên bối rối một cách tồi tệ, không thể nào kiểm soát được."
2757 = "Tôi có cảm giác mình chỉ đang chọn và thực hiện nước đi tốt nhất \\nđể đạt được mục đích của bản thân mà thôi……"
2761 = "Rõ ràng là có thứ tôi đang mong cầu,\\nnhưng tôi lại có cảm giác sợ hãi tột độ khi phải nhìn thẳng vào nó."
