[script]
669 = "「Em cũng nghĩ vậy. Vậy thì cũng không thể nhờ Nagi được. Đối mặt với khách quen sẽ rất ngại」"
671 = "……Chắc do đang phấn khích vì được bay trên trời, Reina trông trẻ con hơn ngày thường. Thật sự rất ấm áp. Ấm áp là vậy, nhưng——"
677 = "……Chính vì là chuyện thường tình nên mới thấy chạnh lòng. Nhưng Reina thì không bận tâm."
689 = "「……Đúng là vậy thật. Lúc nào Hibiki cũng dành rất nhiều thời gian để chọn lựa quần áo này nọ」"
690 = "「……Tính xong rồi ạ. Đi hết tất cả những chỗ đó, vẫn còn dư dả thời gian để ăn trưa luôn nha」"
692 = "Câu trả lời của một đứa trẻ ngoan. Tiếp đó là nhịp thở đầy háo hức. Nhưng rồi, nó lại biến thành một giọng nói có chút xịu xuống."
700 = "「Nếu không làm vậy nữa, thì kiểu gì cũng sẽ buông tay thôi. Trong lúc còn nắm tay nhau, bao bọc quá mức cũng tốt mà」"
701 = "「……Đã có chuyện như vậy sao」"
703 = "「……Vậy thì đơn giản là, lúc nào cũng chuẩn bị dư ra một chút hơi nước là được mà nhỉ?」"
1007 = "「Tất nhiên rồi. Nếu chị Mayami có thời gian」"
1010 = "「Hau. Em xin lỗi ạ. Reina, chỉ là, nghĩ nếu có thể nói chuyện với anh Kato Suzume trên trời thì tốt biết mấy」"
1012 = "「Khi trời mới bắt đầu mưa, đường ray sẽ đặc biệt trơn trượt. Nên sẽ cần nhiều sức mạnh hơn bình thường đó ạ」"
1014 = "「Không có gì đâu ạ. Reina sẽ cố gắng hết sức nha! Đây cũng là công việc mới của Reina mà」"
1016 = "「Vậy mà, chị thực sự muốn đi 『Du lịch Ohimitera』 sao? Nếu vì lý do thời gian, em có thể dời lại thêm nữa」"
1018 = "「Không sao đâu, em cứ mặc thoải mái đi? Chắc là, vừa vặn——」"
1019 = "Chị Mayami dĩ nhiên không có kinh nghiệm nuôi dạy con cái. Vậy thì đây hẳn là những suy nghĩ dành cho Hibiki, tôi chợt nhận ra."
1023 = "「Dù vậy, đội lái có Hibiki, Nagi và Hachiroku mà. Tất nhiên là sẽ không có vấn đề gì đâu」"
1024 = "「Dù vậy thì vẫn tốt hơn nhiều so với việc thiếu hơi nước khi lên dốc. Vì sứ mệnh hàng đầu của đường sắt, luôn là sự an toàn」"
1026 = "「Hướng dẫn viên của Phòng Thương mại thì hơi... Chị chắc chắn sẽ thấy gượng gạo lắm」"
1029 = "「Tai nạn」"
1033 = "Quả quyết. Nhẹ nhàng. Lời khẳng định đó, không chút gượng gạo hay màu mè."
1035 = "「Tụi em vừa mới xác nhận với nhau là, không cần phải lo lắng gì cả đó ạ」"
1036 = "「Ừ. Được thôi」"
1039 = "Lời nói đầy lý trí của tôi, chỉ bằng một tiếng hùa theo đầy gợi cảm, đã mang theo hơi ấm sống động đến chân thực."
1040 = "「Hửm? Vậy tại sao」"
1043 = "「Lúc làm hướng dẫn viên mà trời mưa, Reina, sẽ mặc cái này đi nha」"
1048 = "Nhắc mới nhớ, chị Mayami vẫn chưa từng ngồi Navi. Lần này nhất định phải để chị ấy đi thử, nhưng chuyện đó tính sau."
1053 = "「Lần lượt là 17:27, 18:34, 19:41 xuất phát từ ga Ohimitera ạ. Dừng đỗ tạm thời tại ga bỏ hoang Taragi lúc 18:04, 19:11 và 20:18 nha」"
1055 = "「Tàu sẽ trượt ngược xuống con dốc đang cố leo lên. Nếu là tàu khách, thì phần nặng nhất chính là đầu máy ở phía trước mà」"
1059 = "Tôi chợt nhớ đến thị trấn nhỏ nơi tôi sinh ra. Nơi đó cũng được coi là một thị trấn có khách du lịch đến thăm, nhưng——"
1060 = "「Ra vậy, bộ đồ thời trang mà Hibiki đã cất công nghĩ ra, sẽ bị chiếc áo mưa che khuất hết sao」"
1061 = "「Chuyện đó, đợi bị từ chối rồi hẵng nghĩ. Nếu có phương án dự phòng, tự nhiên sẽ thấy chùn bước mà」"
1071 = "Bất chợt, tôi ngửi thấy mùi hương của chị Mayami. Một mùi hương quá đỗi quen thuộc, nhưng một khi đã ý thức được, nó lại ngọt ngào đến mức nguy hiểm."
1073 = "Ngay khoảnh khắc nghe thấy, giọng nói vui vẻ reo lên, đủ để xác định luôn đây là ứng cử viên số một."
1076 = "「Kyaa♪」"
1077 = "「!」"
1079 = "「Ufufu. Lạ thật đấy. Hồi Sou-chan mới đến nhà này, chị nằm mơ cũng không nghĩ là sẽ được nghe những chuyện thế này đâu」"
1080 = "「Trên đùi của phu nhân Mayami, không phải là trang bị tiêu chuẩn của cỗ máy này」"
1083 = "「Ufufu. Bé Reina ngoan quá đi. Vừa ngoan ngoãn lại thông minh, đúng là một đứa trẻ tốt」"
1084 = "「Nhưng, chúng ta có Navi. Nếu ở trong nội địa Hinomoto, thì lịch trình này đủ để đi bất cứ đâu」"
1086 = "「Ưm fufu, nghe thú vị đấy. Vậy thì cô hướng dẫn viên ơi. Có thể cho hết mấy cái vừa nói vào lịch trình được không?」"
1087 = "「Ây da」"
1089 = "「Wa, wa, wa, được thật ạ! Tuyệt quá đi Reina, sắp biến thành bạn ếch rồi ạ」"
1090 = "「Oa」"
1092 = "「Là vậy đó. Dù có nghe thấy, chắc anh ấy cũng không bay lên được độ cao này đâu」"
1094 = "「Wawawa, đúng rồi ha」"
1096 = "「Nghĩa là, Kumagin ở đằng kia—— A, thấy xưởng rượu nhà mình rồi」"
1097 = "「Đã rõ. Tiến hành xoay vòng」"
1099 = "「Fuwaaa! Kích cỡ vừa in với Reina luôn ạ」"
1101 = "Để dễ dàng ngắm nhìn cảnh sắc bên dưới, Navi nghiêng thân máy bay một cách vô cùng mượt mà."
1102 = "「Waaa! Là áo mưa màu bạn ếch ạ」"
1104 = "「Oa! Reina, quên mang theo ô mất rồi ạ」"
1106 = "「Oa! Chị Mayami mà nổi giận thì chắc đáng sợ lắm nha」"
1108 = "「Oa. Đúng là dân chuyên nghiệp…… Mà này, đi chuyến muộn hơn một chuyến có được không?」"
1109 = "「Waai. Reina làm hỏng bét rồi mà, vẫn được khen nên vui quá đi ạ」"
1112 = "「Fuwaa, mưa xối xả luôn rồi kìa. May mà về kịp sát nút nha」"
1114 = "「Ây da, hay quá nhỉ. Chị cũng bắt chước thử xem. Hii-chan, Haa-chan, có nghe thấy không~?」"
1116 = "「A——ufufu. Đúng thế, chắc chắn rồi. Pau-chan, có vẻ bao bọc quá mức nhỉ」"
1118 = "「Chà chà. Vậy thì, được chứ? Sou-chan」"
1119 = "「Em hy vọng sự biến đổi này cũng là một niềm hạnh phúc đối với căn phòng. Em cứ vẩn vơ suy nghĩ những điều như vậy」"
1121 = "「Ây da da. Quên mất là mình đang cầm cái này」"
1123 = "「Ây da, hai người đang nói chuyện gì vậy?」"
1125 = "Đột nhiên Reina hét lớn. Sự bối rối trong chốc lát đó, không biết là do tôi hay Navi nữa."
1126 = "「Ây da. Nếu trời mưa thì không ngắm cảnh thị trấn được nữa rồi」"
1129 = "「Chà chà, giỏi quá ta」"
1131 = "「Waai waai! Có nghe thấy không, chị Paulette! Reina, đang gọi từ trên trời đó nha」"
1133 = "「Eeeee, trông không giống thế chút nào đâu ạ. Rất đẹp, cứ như đồ mới luôn ấy」"
1134 = "「Ehehe, ra là vậy ạ」"
1136 = "Lời nói đó có chứa đựng cảm xúc đặc biệt nào không, mà sự phấn khích của Reina lại tăng thêm một bậc."
1137 = "「Ehehe, em cảm ơn ạ. A, nhưng mà, Reina cần thêm một chút thông tin nữa」"
1140 = "「Fufu. Chắc chắn là nghe thấy rồi. Cả Paulette, Hibiki và Hachiroku nữa」"
1144 = "「Về chuyện đó chị cứ yên tâm. Nếu có chút gì quá sức, Paulette sẽ không cho nhận đâu」"
1145 = "「Aaa」"
1147 = "「Aha! Đúng vậy nhỉ. Vậy thì, ừm. Lần sau chị sẽ làm thế. Vậy, cái này」"
1149 = "「Ây da ây da bé Reina, hét to như vậy, làm chị giật cả mình đó」"
1152 = "「A! Đúng rồi ha. Reina vì chuyện đó mới được cho lên Navi ngồi mà nhỉ」"
1153 = "「! Hồi nhỏ anh Soutetsu, trông như thế nào vậy ạ?」"
1155 = "「À đúng rồi. Quanh đó khó tìm chỗ đáp máy bay nhỉ. Đang đi tuần trăng mật mà phải lội bãi cỏ lau ven sông thì cũng không hay lắm」"
1156 = "「À, số hiệu tàu đấy. Xuất phát từ Ohimitera là số lẻ. Xuất phát từ Yui là số chẵn」"
1159 = "Giọng nói dịu dàng của chị Mayami vang lên ngay bên cạnh. Kéo tôi từ những suy nghĩ hạnh phúc trở về với thực tại ngập tràn hạnh phúc."
1161 = "「Aaaa, ra là vậy. Là ý đó nhỉ」"
1162 = "「À, đúng là vậy nhỉ. Cả cái ấm đun nước ở nhà, cũng phải mất một lúc mới sôi được mà」"
1164 = "「Ra vậy. Vậy cứ quyết định thế đi」"
1166 = "「Hừm. ……Làm sao đây. Anh thì không nghĩ ra chỗ nào đặc biệt cả——」"
1168 = "「……Reina hơi tiếc một chút ạ. Chắc là anh Kato Suzume, không nghe thấy tiếng rồi nhỉ」"
1170 = "「Ra vậy. Có thể sẽ thú vị đấy. Vì là quê hương nơi mình sinh ra và lớn lên, tưởng chừng như đã biết rõ mọi ngóc ngách, nên ngược lại」"
1172 = "「Ừ. Chuyện đương nhiên mà. Tại chiếc áo mưa này hoài niệm quá, nên chị hơi sến sẩm một chút thôi」"
1174 = "「Ừm. Sự hăng hái của Nagi, sự thận trọng của Hachiroku. Thêm vào đó là sự cân bằng của Hibiki, thực sự kết hợp rất hoàn hảo」"
1175 = "「Em chỉ đang mải suy nghĩ thôi. Căn phòng này, trong thời gian ngắn đã thay đổi công năng bao nhiêu lần rồi nhỉ」"
1176 = "「Hừm hừm」"
1177 = "「Wawawa! Reina không biết luôn! À này, chị Mayami, Reina, sắp hét to nha」"
1178 = "「Ừ, đúng vậy đó. Là một chiếc áo mưa, khá là cũ rồi」"
1181 = "「Waaa! Tuyệt quá đi ạ! Thành phố Ohimitera, trở nên nhỏ xíu luôn ạ」"
1182 = "「Thì, nó là đồ cũ nhưng hoàn toàn chưa qua sử dụng mà. Chị đã tự ý mua dù không hợp với sở thích của Hii-chan」"
1185 = "「Ừ, đúng là vậy thật」"
1186 = "「Hửm?」"
1189 = "「Hửm? Gì thế」"
1190 = "「Không đâu. Chị vẫn chưa ngủ, chỉ nhắm mắt thôi」"
1191 = "「Ufufu. Vui quá. Cảm ơn em nha」"
1194 = "「Nhưng, đêm nay——hay nói đúng hơn là một thời gian tới, em muốn kiềm chế lại. Dù sao thì, kỳ nghỉ cho tuần trăng mật cũng」"
1196 = "Có tựa đầu siêu cao cấp thế kia, tất nhiên rồi. Khoảnh khắc nghĩ vậy, tôi tự nhận thức được sự ghen tị thoáng qua, rồi bật cười."
1197 = "Giọng nói lần này, mang theo sự nũng nịu và vòi vĩnh. Đáp lại điều đó, tôi lặng lẽ trao một nụ hôn chúc ngủ ngon."
1199 = "「À」"
1201 = "「Mưa có thể sẽ tiếp tục rơi rất lớn cho đến sáng mai. Navi khuyên ngài nên trở về nhà」"
1203 = "Dù nụ cười của tôi có phần tự trào, nhưng Reina lại đón nhận nó một cách rất tích cực. Vậy thì cứ ngoan ngoãn hùa theo thôi."
1205 = "「Là vậy đó. Bây giờ về thì có thể vẫn kịp trước khi trời mưa」"
1207 = "「Chúng ta chỉ chắc chắn có thể cùng nhau nghỉ phép trong hai ngày. Rõ ràng là không thể đi du lịch dài ngày được」"
1209 = "Nhẹ nhàng. Nhưng đầy kiên quyết. Giọng nói của chị Mayami vẫn như mọi khi, không chút do dự."
1211 = "「Vâng ạ! Reina hiểu rồi. Reina sẽ cố gắng suy nghĩ chỗ nào hay nhất nha!」"
1213 = "「Lần sau muốn hét to, thì báo trước cho chị một tiếng là được rồi」"
1214 = "Chị Mayami cười khúc khích, nhẹ nhàng vuốt ve má tôi."
1217 = "「Chị cũng nghĩ vậy đó. Nhưng mà, biết sao không?」"
1219 = "「Theo ý chị thì, cứ tắm rửa và ăn tối xong xuôi ở Ohimitera đi. Đến nhà trọ rồi thì chỉ muốn tận hưởng giấc ngủ thôi」"
1221 = "「Lúc đó chị cũng đang bù đầu bù cổ, nên đã lớn tiếng 『Không cần thì vứt đi』」"
1222 = "「Với chị thì, chắc chắn không thể bỏ qua trò xuôi dòng sông Kuma và trải nghiệm rèn dao rồi. Còn Sou-chan thì sao?」"
1225 = "「Hồi đó chị cũng còn trẻ mà. Đôi khi cũng muốn Hii-chan mặc đồ do chị chọn」"
1227 = "Gật đầu rồi tôi chợt thấy kỳ lạ. Từ khi Hachiroku gia nhập, số lượng thành viên trong gia đình đâu có tăng thêm."
1231 = "「Đúng vậy」"
1234 = "「Hii-chan á? Đã cố gắng giải thích cho chị là 『Nếu mặc cái này, tất cả sẽ biến thành ếch mất』 đó」"
1235 = "「Từ hồi bé xíu Hii-chan đã có gu thẩm mỹ cao rồi. Quần áo hay gì đó, toàn tự mình chọn hết」"
1237 = "「Nếu là cái Hii-chan chọn, thì hợp ơi là hợp, chị mới vỡ lẽ ra. Nhưng mà, biết sao không?」"
1239 = "「Kiha 07S của bé Reina cũng vất vả mà nhỉ. Chỉ có một mình Pau-chan」"
1241 = "「Chị Mayami. Trong số những người không có bất kỳ mối quan hệ làm ăn nào với xưởng rượu Migita System, chúng ta thử nhờ Reina làm hướng dẫn viên thì sao?」"
1243 = "Khi còn là phòng của tôi và Hachiroku, mùi sắt khá nồng, nhưng giờ tôi cảm giác nó đã chuyển thành hương men kōji thoang thoảng."
1245 = "「Đúng rồi ạ. Về điểm này, nếu đi tàu thì Kiha 07S tự hào của Đường sắt Ohito sẽ dừng đỗ tạm thời, đưa anh chị đến nơi dễ dàng luôn nha」"
1247 = "Quả là một chiếc thuyền cứu sinh kịp thời——à không, máy bay cứu sinh mới đúng."
1249 = "Vừa nói ra tôi đã thấy mình như đang lảm nhảm, nhưng chị Mayami lại gật gù, vui vẻ hùa theo."
1257 = "Ngay cả khi đã trở thành vợ chồng, cách xưng hô giữa tôi và chị Mayami vẫn không hề thay đổi."
1264 = "「怎麼啦，小雙？」"
1269 = "「Nói đúng hơn là, nếu muốn quay lại mặt đất thì nên làm sớm. Dù cũng có lựa chọn bay trên cao đợi mưa tạnh」"
1271 = "「Ưm fufu, cuối cùng, cũng sắp đến rồi nhỉ. Xin lỗi em nhé? Chị lại bắt em phải chờ đợi rồi」"
1273 = "「Nếu được cho xem bên trong ngân hàng thì chắc sẽ vui lắm, nhưng chuyện đó để dịp khác ngoài tuần trăng mật cũng được nhỉ」"
1278 = "「Bọn em đang nói chuyện về đường sắt ạ. Bảo là mưa xối xả đột ngột thế này thì 8620 vất vả lắm」"
1279 = "「Chị mới là người phải cảm ơn em vì đã nhận lời đó」"
1280 = "Cuối cùng thì lịch trình của cả hai cũng khớp nhau. Do đó, việc chuẩn bị cho tuần trăng mật hầu như vẫn chưa tiến triển gì."
1281 = "「Nhân lúc đang ở trên không. Vừa ngắm nhìn thị trấn, em muốn bàn về lịch trình cho tuần trăng mật」"
1283 = "Cơ thể tôi ngập tràn hạnh phúc đến mức tự động bật cười. Nhận ra điều đó, khuôn mặt tôi lại giãn ra."
1285 = "「Ừ. Nếu thử đóng vai du khách đến thăm, chị nghĩ mình sẽ thấy được một Ohimitera mà chị chưa từng biết」"
1287 = "「Ưm……Chuyện đó thì——」"
1289 = "「Anh thì dĩ nhiên là theo nhịp độ của chị Mayami rồi」"
1290 = "「Nè, nè. Chị Mayami. Cửa hàng đường sắt ở đâu vậy ạ?」"
1292 = "「Em không tự nhận ra sao? Em vừa cười khúc khích đấy, Sou-chan. Như đang nhớ lại chuyện gì vui vậy」"
1295 = "「Sou-chan sẽ làm cho gia đình hưng thịnh sao? Cùng với chị」"
1296 = "「Thế nên lái tàu——nếu là đầu máy hơi nước thì lái tàu và Railord sẽ cùng nhau ước lượng xem cần khoảng bao nhiêu ạ」"
1298 = "「Không có đâu? Nhưng mà…… Lúc đó làm Hii-chan khóc, chị tự ghét bản thân mình lắm」"
1301 = "「Tất cả biến thành ếch! Fuwawa, tuyệt vời như một giấc mơ vậy nha」"
1303 = "「Reina hiểu rồi ạ. Bữa ăn và việc tắm rửa, mỗi cái cần dự trù bao nhiêu phút vậy ạ?」"
1306 = "「Bầu trời cũng đẹp, nhưng cảnh sắc bên dưới cũng tuyệt vời lắm đấy. Thị trấn quen thuộc, nhìn từ trên cao hoàn toàn khác biệt so với dưới mặt đất」"
1307 = "「Được thôi. Đến nhà trọ bằng tàu đi. Hôm đó Paulette sẽ lái tàu một mình à?」"
1310 = "「Đúng vậy ạ. Chị Paulette lái một mình cũng siêu giỏi, Reina đảm bảo là an toàn, an tâm và thoải mái luôn nha」"
1311 = "「Ufufuu, anh Soutetsu trông cũng vui quá kìa! Vui lắm đúng không ạ, bầu trời. Rộng lớn đến nhường này cơ mà」"
1312 = "「Đúng vậy ạ. Đặc biệt là 8620 chắc sẽ vất vả lắm nha」"
1314 = "「Đúng vậy, mưa lớn hơn tưởng tượng nhiều. Thế này thì làm nhiệm vụ cũng vất vả lắm đây」"
1316 = "「Vâng. Navi dự đoán sẽ có mưa trong vòng 20 phút nữa」"
1319 = "「Giờ ăn tối, và mấy giờ anh chị muốn về lại nhà trọ. Nhà trọ là Blue Train Taragi đúng không ạ」"
1324 = "Nhà, và tổ ấm. Lần đầu tiên nghe hai từ này đặt cạnh nhau, tôi mới hiểu ra sự khác biệt giữa một công trình kiến trúc và một gia đình."
1331 = "「Thật tốt khi có thể bàn bạc theo một cách không ngờ tới. Nhưng, thật sự xin lỗi vì đã đánh thức chị」"
1332 = "「A, xin lỗi, em làm chị thức giấc à?」"
1333 = "「Đúng vậy. Thế nên anh mới nói với Reina rằng cơn mưa xối xả đột ngột này sẽ rất mệt mỏi đấy——」"
1334 = "「Chính xác. Vậy, hãy thử tưởng tượng một con dốc cao xem. Để leo lên hết, sẽ cần lượng hơi nước nhiều hơn hẳn so với đường bằng」"
1335 = "Sự đính chính nghiêm túc của Navi, khiến chị Mayami nở nụ cười ấm áp."
1344 = "「Đầu tiên là phòng sách của ông Taito. Sau đó em được dùng làm phòng riêng」"
1346 = "「Cũng không muốn đem đi đổi trả. Cứ thế để đó luôn. Sau đó, Sou-chan đã dẫn em ấy đi mua một chiếc áo mưa khác」"
1351 = "「Đúng rồi đó, bé Reina. Trên đùi chị, hôm nay là ghế đặc biệt của bé Reina đó」"
1353 = "「Khi phân vân thì phải chọn phương án an toàn nhất nha. Nếu không thì sẽ xảy ra tai nạn đó ạ」"
1355 = "「Vì Reina là Railord mà lị. Chỉ cần có thông tin từ trước thì tính toán dễ ẹc à」"
1357 = "「Reina, muốn mượn áo mưa ạ!!」"
1359 = "「Bé Reina thì vui vì điều đó, còn Hii-chan thì lại buồn. Nói là sở thích khác nhau, thì cũng chỉ đơn giản là vậy thôi」"
1360 = "「Bây giờ em không làm người thay thế nữa. Hibiki cũng là em gái của em, không phải với tư cách là em gái của vợ, mà là em gái của chính em」"
1361 = "Giống như hùa theo, lại giống như nói mớ. Giọng nói cho thấy cơn buồn ngủ đã quay trở lại."
1363 = "「Hồi đó thì——nếu là em của hồi đó, ừm. Chắc chắn là em đã làm \"người thay thế\" như một nghĩa vụ, nhưng……」"
1364 = "「Hơn nữa, nè? Nếu có thể nhờ bé Reina làm hướng dẫn viên. Chị cũng có thể tham gia vào buổi bàn bạc chi tiết được không?」"
1365 = "「Chị khẳng định thế sao. Rốt cuộc là vì lý do gì」"
1366 = "「Fufu, nghe cách nói của chị Mayami, lại thấy việc bao bọc quá mức là một điều rất tốt」"
1368 = "「Tuyệt quá. Đó tất nhiên là câu trả lời chính xác. Nhưng lý tưởng mà nói, than đá là vật tư tiêu hao, nên cũng không muốn lãng phí quá nhiều」"
1369 = "「Dễ thương quá đi. Đẹp quá đi. Mượn mặc thì ngại lắm ạ」"
1372 = "「Ufufuu, cảm giác ngồi tuyệt vời quá đi ạ. Đúng là Navi mà anh Soutetsu luôn tự hào có khác nha」"
1376 = "……Paulette thì quá bận rộn, nếu nhờ vả, cô ấy có thể sẽ cố sức nhận lời——a"
1377 = "「Nhân tiện, chị Mayami, Reina này」"
1379 = "「30 phút hay 1 tiếng thì lúc nào cũng xoay sở được. Vậy thì, cùng nhau nhé. Nếu em ấy nhận lời」"
1382 = "「Reina hiểu rồi ạ. Vậy thì, có vẻ sẽ dư thời gian để tham quan kỹ một nơi nào đó nữa nha」"
1390 = "Nếu vậy thì……ừm. Loại Hibiki và Hachiroku khỏi danh sách ứng cử viên thôi. Chuyến du lịch gia đình có cả hai người họ nên để dịp khác."
1394 = "「Lần đầu lên trời vui quá mà. Chị cũng quên béng mất luôn đó」"
1399 = "「Rồi Haa-chan đến. Sau đó Haa-chan lại chuyển sang phòng của Hii-chan」"
1401 = "「Waai! Vậy thì quyết định thế nha. Vậy thì vậy thì, mấy giờ anh chị muốn về nhà trọ ạ」"
1402 = "「Em hiểu rồi. Nếu vậy em không có ý kiến gì. Nhưng——tại sao lại là Ohimitera?」"
1403 = "「Nghe lời chị Navi đúng là tốt quá ha. Không là mọi người ướt sũng hết rồi」"
1407 = "「Mức độ 『sức mạnh cần thêm』 đó phụ thuộc vào tình huống. Đó là một lĩnh vực mà cả Railord cũng không thể tính toán được」"
1411 = "「Động cơ hơi nước có phản hồi rất chậm. Vì đặc tính là đun sôi nước thành hơi nước rồi mới tạo ra động lực」"
1413 = "「Sắp mưa sao?」"
1415 = "「Cỡ Kisaki, hay Fukami thì…… cũng có liên quan đến xưởng rượu nên chắc sẽ ngại ngùng nhỉ」"
1417 = "「Một địa điểm du lịch nổi tiếng mà chị chưa từng đến thăm bao giờ. Nên, chị muốn thử đi 『Du lịch ngắm cảnh』 xem sao」"
1420 = "「Đơn giản thôi. Nếu giữa chừng lên dốc mà hơi nước—— tức là động lực bị thiếu hụt thì」"
1421 = "「Cảm ơn em nhé, Sou-chan. Cả hồi đó và bây giờ—— đã thay chị, chăm sóc cho Hii-chan」"
1422 = "Vừa dứt lời, chị Mayami cựa quậy nhích người lại gần."
1439 = "「Nếu được, bé Reina nhận lấy nhé? Có vẻ em rất thích nó mà」"
1440 = "「Ra là vậy ạ. Màu bạn ếch, Reina cũng nghĩ là sẽ rất hợp với chị Hibiki mà」"
1441 = "「Ra là vậy. Thế thì hai người cùng nhau chọn là được rồi mà」"
1442 = "「Ra là vậy, sến sẩm ha」"
1443 = "「Không đâu, nãy chị cũng nói rồi mà? Chị, vẫn chưa ngủ đâu」"
1444 = "「Vậy sao? Vậy thì yên tâm rồi. Vui quá đi」"
1445 = "「Vậy thì……để xem. Cả bữa trưa, bữa tối và tắm rửa, mỗi cái 1 tiếng nhé」"
1446 = "Giọng nói vui vẻ. Việc tâm tư được thấu hiểu khiến tôi cũng thấy vui lây."
1447 = "「Có gia đình mới thành tổ ấm. Sự hưng thịnh, chẳng phải là điều mà chúng hằng mong ước sao」"
1448 = "「Nếu nhà cửa hay phòng ốc mà có cảm xúc, thì chắc chắn chúng sẽ thấy hạnh phúc rồi」"
1449 = "「Đúng thật nhỉ. Vậy có nghĩa là, nó khá cũ rồi sao?」"
1453 = "「Thế cũng là giỏi lắm rồi. Chị thì còn lâu mới làm được thế」"
1455 = "「Vậy thì Reina, để cảm ơn chiếc áo mưa, sẽ làm thật nhiều thật nhiều búp bê cầu nắng nha!」"
1456 = "「Đã rõ. Nhưng, không chắc chắn là em ấy sẽ nhận lời đâu. Nếu không được thì ứng cử viên thứ hai sẽ là ai đây」"
1457 = "「Ừ, thật sự tuyệt vời quá nhỉ. Chị cũng, lần đầu tiên nhìn thấy cảnh sắc như thế này đó」"
1458 = "「Vậy thì ghé qua xưởng nhà chị một lát đi. Ô, ủng hay áo mưa, chị đều cho mượn được hết」"
1460 = "「Vậy thì chốt đi tàu nhé. Em cũng muốn thử đi Kiha 07S do Paulette lái một mình xem sao」"
1462 = "「Vậy thì, chỗ đó giao cho cô hướng dẫn viên đấy. Một nơi đậm chất Ohimitera nhất mà hướng dẫn viên đề xuất」"
1465 = "「Cái gì vậy?」"
1467 = "「Vậy thì chắc chắn sẽ thành tai nạn rồi. Nếu có cả tàu chạy phía sau nữa thì sẽ là tai nạn lớn mất」"
1469 = "「Vậy thì vậy thì, từ bây giờ chúng ta bắt đầu bàn bạc nha. Cảm ơn anh chị đã nhờ Reina làm hướng dẫn viên ạ」"
1470 = "「Tùy vào đó mà chuyến tàu sẽ tự động được quyết định nhỉ. Các lựa chọn sẽ là——khoảng 21D, 23D, 25D chăng」"
1473 = "「Chắc để dịp khác thì tốt hơn. Đã cất công đi tuần trăng mật. Dù sao thì cũng mong trời nắng」"
1474 = "「Đường ray đường ray……a! Kia rồi nha. Vậy thì vậy thì——thấy rồi! Cửa hàng đường sắt!!」"
1477 = "「Vậy thì để xem. Đầu tiên, hãy cho Reina biết những nơi mà anh chị nhất định muốn đến tham quan nha」"
1479 = "「Nếu vậy, 27D chắc chắn là lựa chọn tối ưu nhất rồi. Reina, anh nhờ em làm hướng dẫn viên cho đến khi lên tàu 27D được không?」"
1486 = "「Đường sắt luôn di chuyển giữa các điểm cố định, nên cần chuẩn bị bao nhiêu hơi nước và ở đâu thì theo kinh nghiệm là biết được, nhưng」"
1487 = "「Để xem, trước tiên tìm đường ray đã」"
1490 = "「Nhưng mà, bé Reina cũng bận lắm đúng không? Nếu làm em ấy phải cố sức dù chỉ một chút」"
1494 = "「Ngoài hai nơi đó ra, chắc là đi tàu khách do 8620 kéo nhỉ. Dù sẽ phải đi khứ hồi đến Yui, nhưng cũng có thể trải nghiệm xúc than dồn toa nữa」"
1495 = "「Ngài Soutetsu. Xin lỗi vì đã cắt ngang cuộc họp của ngài. Áp suất không khí đang giảm mạnh」"
1499 = "「Áo mưa!」"
1501 = "「Lượng hơi nước lớn cần thiết đó, tất nhiên, phải được đun sôi trước khi đến con dốc thì mới kịp」"
1504 = "「Hưng thịnh, sao. Chị em trở thành vợ chồng, khả năng đó sẽ lớn dần lên nhỉ」"
1505 = "「27D thì sẽ là chuyến tàu cuối cùng đấy. Xuất phát từ ga Suối nước nóng Ohimitera lúc 21:35, dừng đỗ tạm thời tại ga bỏ hoang Taragi lúc 22:09」"
1510 = "「??? Chị Hibiki là em gái của anh Soutetsu, chẳng phải là chuyện đương nhiên sao ạ?」"
1512 = "「Kiha 07S là toa xe diesel tự hành mà, nên có vất vả thì cũng không bằng đầu máy hơi nước đâu ạ」"
1570 = "Quả nhiên là hiểu rất nhanh. Nghĩ rằng có thể sẽ là thừa thãi, nhưng tôi vẫn nói thêm."
1576 = "「Thì đó. Nhà, là tổ ấm mà」"
1585 = "「Biết không? Sou-chan. Lý do rất đơn giản」"
1606 = "Dù vậy, tôi vẫn nhớ đó là khoảng thời gian rất thú vị. Trả lời vô số câu hỏi của Hibiki, là trải nghiệm mà tôi chưa từng có với Michiko."
1609 = "Xen lẫn với giọng nói đầy năng lượng của Reina, là một giọng nói trầm tĩnh bất chợt vang lên."
1610 = "Thể theo nguyện vọng mạnh mẽ của chị Mayami, Reina đã nhận công việc hướng dẫn viên. Dưới hình thức là một đơn đặt hàng chính thức gửi đến Bộ phận Du lịch của Đường sắt Ohito."
1613 = "Chết tiệt, chữ \"khá\" đó thật thừa thãi. Không có can đảm để phản ứng lại, nên đành lơ đi thôi"
1616 = "「Ưm……」"
1619 = "「Ehehe, đúng là ghế đặc biệt có khác nha. Cực kỳ êm ái và mềm mại luôn ạ」"
1627 = "Chỉ một tiếng đó là đủ hiểu rõ. Đôi mắt của Reina lúc này, chắc chắn đang lấp lánh hết cỡ."
1634 = "「Cả hai đều vậy mà. Em cũng hoàn toàn không thể sắp xếp được lịch trình」"
1636 = "Giọng nói của tôi và chị Mayami, và có lẽ cả suy nghĩ, đã hòa làm một. Ra vậy, Reina——"
1638 = "Tôi chợt nhớ lại. Số tiền chị Mayami giao cho, và Hibiki. Nhớ lại bản thân trong quá khứ đã tuyệt vọng thế nào để không tuột mất cả hai thứ đó."
1639 = "Tôi có cảm giác như nhìn thấy sự tội lỗi lẩn khuất trong từng nhịp thở hòa lẫn với lời nói. Nên tôi trả lời thật nhẹ nhàng. Nhẹ nhàng và tươi sáng nhất có thể."
1641 = "「Em cười sao. Em không nhận ra luôn đấy——」"
1644 = "Vừa nói ra những gì nhớ lại, chị Mayami khẽ nở nụ cười."
1647 = "「Đúng vậy」"
1649 = "「Du lịch ngắm cảnh, sao」"
1650 = "「!」"
1653 = "Áo mưa của Hibiki thì tôi nhớ. Tôi cũng đi cùng để chọn mua. Màu cam kẻ sọc……đúng kiểu Hibiki thích."
1654 = "「Nghe chị nói vậy, đúng là thế thật」"
1657 = "Reina lại hứng thú với một chủ đề không ngờ tới. Chị Mayami như chỉ chờ có thế——!"
1663 = "Đặc biệt là Hachiroku có xu hướng cầu toàn rất mạnh, nên nếu đốt phí than sẽ bị coi là điểm trừ. Nhưng——"
1667 = "——Cả Reina, chị Mayami và tôi đều có lịch trình sau đó. Dù bầu không khí có vui vẻ đến mấy thì cũng phải vào việc chính thôi."
1668 = "Chị Mayami đưa tay ra gõ nhẹ vào chiếc mũi của Reina đang ngẩn tò te."
1671 = "「Vâng ạ. Reina nhất định sẽ làm vậy ạ」"
1673 = "Sự hứng thú còn mãnh liệt hơn cả lúc nãy. Sự quan tâm đến quá khứ của tôi, bị vứt bỏ trong chớp mắt."
1675 = "Một giọng nói nghe là biết không hiểu 100\\%. Fufufu. Nụ cười của chị Mayami cũng thật vui vẻ."
1677 = "Vừa nhìn ra ngoài cửa sổ, Reina vừa cất giọng có chút đắc ý."
1678 = "Cúi gập người. Cảm ơn. Sau đó Reina ngẩng mặt lên với nụ cười tươi rói."
1681 = "Reina xua tay như muốn nói \"Rút lại rút lại\"."
1683 = "Sự ngây thơ của Reina đã cứu tôi. Lần này là toa xe tự hành cứu sinh."
1685 = "「Ehehe, nếu vậy thì vui quá ạ. A! Đúng rồi, anh Kato Suzume~! Có nghe thấy không ạ」"
