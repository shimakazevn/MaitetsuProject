[script]
41 = "(Phạch――phạch――phạch)"
817 = "――Chầm chậm, từ từ. Âm đạo chị Mayami lại một lần nữa, nuốt trọn lấy dương vật của tôi."
821 = "……Nhịp điệu này thì em biết. Nói cách khác, đây là――"
826 = "「……Ưm――. Tôi cũng vậy, rất thích chị Mayami.」"
828 = "「……Chị vừa, hôn lên chim của Sou-chan…… mất rồi.」"
972 = "「Thật xấu hổ, nhưng có vẻ là vậy.」"
974 = "「Không phải……Là do chị Mayami――từ đoạn này――đang hẹp―― a――lại――đó――」"
976 = "「Hai ta cùng nhau――sướng nhé?」"
977 = "「Không nặng đâu. Ngược lại còn thấy sướng nữa.」"
984 = "「Lớn chừng này tuổi gì chứ…… Chị chưa đến tuổi để nói những lời như vậy đâu.」"
985 = "「Cái!?」"
989 = "「Nhưng em chỉ có chút kiến thức mơ hồ về chuyện tình dục thôi, nên không biết phải làm sao.――Dù có nhờ cậy chị Mayami đi nữa thì」"
991 = "「Nên là, nhé? Sou-chan. Từ nay về sau, mãi mãi nhé.」"
997 = "「T-Toàn bộ……Sou, chan……vào hết rồi, đúng không?」"
1001 = "「Không cần an ủi chị đâu, Sou-chan. Phụ nữ độc thân quá tuổi hai mươi lăm thì bị nói gì cũng phải chịu thôi.」"
1010 = "「A――cái này――sâu quá――a――bên trong――ưm.」"
1011 = "「A……a――Sướng, quá―― từ từ――như đang――tích tụ lại, vậy――」"
1013 = "「Hya!!?」"
1014 = "「Á!? A……ưm――」"
1015 = "「Kya!?」"
1021 = "「Phu……ưm――sướng, quá――」"
1023 = "「Chị cũng vậy mà? Chị cũng muốn được thưởng thức Sou-chan.」"
1025 = "「Hii――ưm――Quy đầu――của Sou-chan――a―― đang cọ xát――lật lên――ưm ư!」"
1027 = "「Hia――r-ra mất――Sou-chan―― Chị――ra mất――tử cung――bị hôn rồi.」"
1028 = "「Uwa!?」"
1029 = "「Úi.」"
1031 = "「Ư――」"
1032 = "「Ư――a――」"
1033 = "「Kua――a――」"
1034 = "「A――Đột nhiên――ưm――Nóng quá――phư.」"
1036 = "「A――a――a――aa――」"
1038 = "「A――a――ahi――hyu――ha――a, phụt đi, bắn đi, tinh dịch――đập vào đi――ưm.」"
1039 = "「A……」"
1040 = "「A……phư――a.」"
1041 = "「A……ưm」"
1043 = "「A…… Sou-chan, lúc nãy có thích không?」"
1044 = "「A.」"
1047 = "「A a……a――」"
1048 = "「Hapu――ưm――rột――chu――rột.」"
1049 = "「Au!?」"
1050 = "「A ưm!」"
1052 = "「A, nè? Chim của Sou-chan―― Vậy nên, vào ngực của người chị này――」"
1053 = "「A! A! Chị Mayami――Chị Mayami!!」"
1055 = "「Ừm. Ừm. Chạm đi――ưm―― Cả ngực, tất cả――tất cả, Sou-chan cứ làm gì mình thích――đi.」"
1056 = "「Chụt――ưm……ưm chụt――liếm――liếm ――ưm……ưm fufu……fu」"
1058 = "「Chụt chụt――chụt――rột――ưm chụt.」"
1059 = "「Ư――phư――」"
1060 = "「Ua――a――a――a――」"
1061 = "「Ua……ha――a――」"
1062 = "「Ua!」"
1063 = "「Aphuun.」"
1064 = "「Ưm――ực――ực――ưm……a……phuha―― kya!?」"
1065 = "「Ưm――ư――」"
1066 = "「Ừm――thấy rồi. Cái bướm, của chị Mayami.」"
1068 = "「Ưm……」"
1069 = "「Ưm……nước bọt……hả?―― Ưm~~――chu chu chu.」"
1071 = "「Ưm……a――đang vào, này――ưm ưm―― chim, của――Sou, chan――phua.」"
1073 = "「Ưm……chụt――ưm――Sou-chan――ưm―― Sou-chan……rất……thích――ưm chụt.」"
1075 = "「Ưm……rột――ực.」"
1076 = "「Ưm……ưm……chụt」"
1078 = "「Ưm……Cái bướm trinh nữ ủ lâu năm của chị, dành riêng cho Sou-chan――」"
1080 = "「Ưm……Sou-chan――a――to quá――――ưm phư.」"
1082 = "「Ưm……xin lỗi nha Sou-chan, có nặng không?」"
1084 = "「Ừ. Sướng đến mức tôi chẳng biết chuyện gì vừa xảy ra nữa.」"
1085 = "「Ưm.」"
1086 = "「Ưm hyu!?」"
1089 = "「Ưm!? Ưm――ực――phuha――a―― ưm――rột――ực――ực――ực.」"
1090 = "「Ưm a!!?」"
1091 = "「Ưm ư――cái này――chạm vào rồi―― Tử cung――cộc một cái――phư――a ưm!」"
1092 = "「Ưm ưm ưm~~~~~~~~!」"
1094 = "「Ưm! Ưm――chụt――ưm, chụt――chụt.」"
1095 = "「Ưm!」"
1097 = "「Ừm, chim của Sou-chan thì sao.」"
1099 = "「Ừm. Em cứ mải nghĩ xem đêm nay, liệu có phải là phần tiếp theo của lúc ban ngày―― hay không, thế nên……」"
1101 = "「Vâng. Vì đã nghe chị nói vậy nên em mới càng phiền não hơn. Thế là dòng suy nghĩ cứ luẩn quẩn mãi――」"
1102 = "「À, xin lỗi. Nếu nghĩ đến chuyện muốn có con trong tương lai, thì」"
1104 = "「Ưm. Đúng ha.」"
1106 = "「Ừ, đúng vậy. Mãi mãi, mãi mãi.」"
1108 = "「Ừm. Là minh chứng đó. Minh chứng cho việc, chị đã dâng hiến lần đầu tiên cho Sou-chan.」"
1109 = "「Đôi môi――Ra vậy, vừa rồi là……」"
1112 = "「Pua――a……cái này」"
1113 = "「Ngoạm!」"
1115 = "「Ừm. Cùng làm nhé.」"
1117 = "「Được mà? Sou-chan.」"
1119 = "「Tuyệt thật……cái này――những nếp gấp, cứ bám riết lấy, rồi lại――tuột ra.」"
1121 = "「Nếu Sou-chan nghĩ như vậy, thì có lẽ việc cẩn thận ủ rượu lâu năm cũng tốt nhỉ.」"
1122 = "「Chị, là trinh nữ mà. Nên không tự tin là có thể làm tốt đâu.」"
1128 = "「Sou-chan――Sou-chan――chị, ra mất!」"
1129 = "「Sou-chan.」"
1130 = "「Em bị say sóng nhiệt đó? Sou-chan, lúc đang tắm ấy.」"
1131 = "「Sou-chan, em không biết sao? Đây gọi là gối đùi đó.」"
1133 = "「S-Sou-chan!?」"
1135 = "「Đó là――dương vật của em.」"
1137 = "「Chỗ này, nha? Ưm――」"
1140 = "「Mạnh hơn á…… Ưm――vậy thì, nè.」"
1142 = "「Tuyệt lắm đúng không? Bằng ngực và miệng của chị, em hãy tận hưởng cảm giác sướng hơn, hơn nữa đi.」"
1145 = "「Không hỏng được đâu. Trừ khi ở trong môi trường quá tồi tệ.」"
1148 = "「Suy nghĩ nhiều quá á?」"
1151 = "「Chị nói rồi mà? Chị là của Sou-chan. Cái bướm, bộ ngực, cả cái rốn của chị nữa, tất cả.」"
1154 = "「Tôi cũng――vậy――đang chầm chậm, lắng đọng――thật sâu.」"
1155 = "「Tôi cũng――tôi cũng vậy――chị Mayami!」"
1156 = "「Đúng vậy. Vô cùng dễ chịu.」"
1159 = "「Ngực――Tôi chạm vào ngực chị, được không?」"
1161 = "「Em, rất vui vì chị Mayami vẫn luôn giữ gìn bản thân trọn vẹn cho đến tận bây giờ.」"
1162 = "「Lần này, tôi muốn…… làm cho chị Mayami được sướng.」"
1165 = "「Chuyện đó thì em biết. Nhưng ý em là, tại sao em lại――」"
1167 = "「Tôi muốn được kích thích, mạnh hơn nữa.」"
1168 = "「Chính vì thế. Em muốn được thưởng thức chị Mayami.」"
1171 = "「Xin lỗi em nhé, chị đúng là một người chị không đáng tin cậy. Đã lớn chừng này tuổi rồi mà còn không thể dẫn dắt Sou-chan.」"
1173 = "「Vậy thì. Để sướng hơn nữaaaa――nè?」"
1175 = "「Vậy sao? Xã hội khắt khe với phụ nữ độc thân quá tuổi hai mươi lăm đến thế ư?」"
1176 = "「Có vị của sắt――hơi âm ấm.」"
1178 = "「Vậy thì. Nè?」"
1179 = "「Sẽ làm được thôi. Vì có tôi cùng làm mà.」"
1181 = "「Đau――~~~~~!!」"
1183 = "「B-Bị nhờ cậy thì chị cũng khó xử lắm! Bởi vì, chị, từ trước đến giờ hoàn toàn không có……ờm, kinh nghiệm……yêu đương……mà.」"
1186 = "「Thấy không? Sou-chan. Cái bướm, của chị nè.」"
1190 = "「Chị……Mayami――」"
1192 = "「Chị, Mayami……được chứ? Sâu――sâu hơn nữa nhé.」"
1205 = "「Chị Mayami――sướng quá―― thật sự, rất sướng.」"
1206 = "「Chị Mayami――Tôi ra, mất――thế này thì――」"
1208 = "「Chị Mayami……nước bọt――nước bọt, á…… Chị có thể……nhỏ xuống, phần đỉnh của tôi――được không?」"
1210 = "「Chị Mayami……chuyện là――em, thấy rất khó chịu.」"
1211 = "「Chị Mayami……máu kìa.」"
1213 = "「Chị Mayami……Thế này là――」"
1214 = "「Bên trong……âm đạo, của chị Mayami……a―― uốn lượn――nếp gấp này, là sao――ư.」"
1216 = "「Chị Mayami!」"
1218 = "「Chị Mayami, làm gì――!?」"
1219 = "「Trong lúc mải nghĩ thì bị say sóng nhiệt hả?」"
1223 = "「Huống hồ lại là chị Mayami. Một nguyên liệu tuyệt hảo được nuôi dưỡng trong môi trường tốt nhất. Tuổi tác của chị Mayami, đúng hơn là nên được tôn vinh như một quá trình ủ rượu lâu năm mới phải.」"
1225 = "「Cảm giác khi chạm vào……thế này…… Sướng――quá đi mất――」"
1229 = "「Ngực――Mau lên!」"
1234 = "「Máu……của minh chứng.」"
1241 = "「Bên trong……trong âm đạo, của chị……cùng nhau, ưm――sướng, nha?」"
1242 = "「Xin hãy――biến chị thành của Sou-chan đi.」"
1249 = "「Cái――gì――thế này――」"
1250 = "「Ở lối vào âm đạo này――ngay cửa mình, chim của Sou-chan, sẽ đút vào đây đó.」"
1251 = "「Ra vậy……Em suy nghĩ nhiều quá nên bị say sóng nhiệt sao.」"
1254 = "「Chứ sao nữa.」"
1256 = "「Vậy thì……tốt quá――ưm――Da dẻ, thì……bình thường……không phơi nắng――Nên chị, rất tự tin, đó――a, ưm!」"
1258 = "「Vậy thì, nè? Sou-chan.」"
1259 = "「Vậy thì!」"
1260 = "「Nào là ế chồng, bà cô già, hàng tồn kho…… Thậm chí còn bị nói là nước ối bị hỏng nữa cơ.」"
1264 = "「Ủ rượu lâu năm.」"
1267 = "「Quá trình ủ lâu năm đúng là tuyệt thật. Nếu không từ từ khắc sâu―― chúng ta, chắc chắn đã không thể được như thế này.」"
1271 = "「Khó chịu á……chị, phải làm sao cho Sou-chan đây?」"
1272 = "「!」"
1273 = "「!!?」"
1363 = "Cửa âm đạo co bóp liên hồi, lớp thịt hồng hào quanh âm đạo, như đang làm nũng, bám chặt lấy dương vật tôi để làm quen."
1364 = "Lần đầu tiên, tôi chỉ biết cắm đầu đâm vào, chẳng còn tâm trí đâu mà nghĩ đến chuyện tận hưởng――"
1370 = "Không biết là không nhúc nhích, hay không thể nhúc nhích, chị Mayami khựng lại ở đó."
1372 = "Nếu không rút khỏi ngực chị ấy, tôi sẽ làm bẩn khuôn mặt xinh đẹp đó mất."
1382 = "Nhưng, cũng chính vì thế―― Dục vọng lại càng bùng lên."
1384 = "Dòng chất lỏng đục ngầu nhỏ giọt xuống khe ngực ấy――"
1386 = "Chỉ vậy thôi cũng đã thấy sướng rồi. Ngay cả lớp thịt bên trong âm đạo, cảm giác chạm vào da thịt chị Mayami cũng quá đỗi tuyệt vời."
1387 = "Giống như nhung lụa. Trơn tuột. Trực giác ấy, chỉ khi chuyển động mới biết nó nông cạn đến nhường nào."
1397 = "Chị Mayami trong tình trạng khỏa thân, chỉ còn vướng lại chiếc quần lót ở chân, leo lên người tôi."
1400 = "Vừa muốn làm vậy, lại vừa không muốn, sự nôn nóng khiến tôi nói chẳng thành lời."
1404 = "Gì thế――vừa rồi là―― Phần đỉnh có cảm giác ướt át, mềm mại――"
1416 = "Nghĩ vậy, rồi em chợt nhận ra. À đúng rồi. Không phải là nóng bức của thời tiết, mà rõ ràng là cơ thể đang phát sốt."
1417 = "Hóa ra nụ hôn lại đơn giản đến thế sao. Lại có thể diễn ra tự nhiên đến thế sao."
1420 = "Một lần nữa, lại gần cửa mình. Chị Mayami lại hơi thay đổi góc độ một chút."
1428 = "Men theo khe hở nhỏ xíu giữa hai bầu ngực đang ép chặt, nước bọt chạm vào dương vật đang chôn vùi ở đó của tôi."
1430 = "Chạm thật khẽ――chỉ bằng đầu ngón tay, tôi mân mê xoa nắn, ấn nhẹ vào nhũ hoa của chị Mayami."
1441 = "Ký ức bị lu mờ vì cơn sốt, có vẻ như đã dần rõ nét lại nhờ câu nói đó."
1443 = "Đột nhiên, nhịp quạt trở nên nhanh hơn. Tóc mái có hơi rối một chút, nhưng như thế này đầu óc lại mát mẻ và dễ chịu hơn."
1449 = "Lớp nếp gấp thịt như nhung lụa ấy, được cấu tạo thành nhiều tầng."
1454 = "Vừa ngước mắt lên nhìn tôi, chị Mayami vừa hé đầu lưỡi ra một chút."
1455 = "Chiếc quạt dừng hẳn lại."
1458 = "Giọng nói đầy ngạc nhiên. Rồi dần dần, gương mặt chị Mayami giãn ra thành một nụ cười rạng rỡ."
1459 = "Hơi nhấc hông lên một chút, ngón tay chị Mayami kéo dương vật của tôi ra từ dưới mông chị."
1462 = "Nghe những lời đó, tôi không thể dừng lại được nữa. Tôi ép sát hông mình vào hông chị trong một nhịp!"
1464 = "Chị Mayami nhóp nhép miệng tạo ra âm thanh, rồi tích tụ nước bọt trong khoang miệng."
1466 = "Điều đó khiến tôi sung sướng."
1469 = "Sự an tâm ngay lập tức chuyển hóa thành ham muốn. Em muốn được thưởng thức đôi môi của chị Mayami nhiều hơn, nhiều hơn nữa."
1479 = "Cửa mình nuốt trọn dương vật của tôi căng ra, nong rộng, xiên qua――một từ như thế xẹt qua tâm trí tôi."
1482 = "Như bị rót thứ độc dược phát tác chậm, chuyển động từ từ và sự trơn trượt đang dần ăn mòn lý trí của tôi."
1483 = "Lớp nhung lụa hảo hạng nhất bám sát lấy dương vật, cứ thế râm ran, khẽ run rẩy, dụ dỗ tôi tiến sâu vào bên trong."
1486 = "Sau gáy em có cảm giác như đang dính chặt vào miếng bánh mochi vừa mới giã xong, thế nhưng từ mặt xuống ngực lại rất mát mẻ."
1487 = "Hơi nóng tích tụ sau gáy, cùng mùi hương ngọt ngào thoang thoảng từ bên dưới, đã khiến những điều em từng phiền não trở nên vô cùng đơn giản."
1495 = "Không ngờ lại phát triển lớn đến mức này. To lớn, trông có vẻ rất mềm mại, và đang ướt đẫm mồ hôi."
1497 = "Từ từ, hết sức cẩn thận―― như thể đang e sợ điều gì, chị Mayami nhấc hông lên."
1498 = "Bốn chữ mà tôi từng cho là thô tục ấy, lần đầu tiên trong đời tôi mới nhận ra nó lại vang lên ngọt ngào đến thế."
1501 = "Dù không rành về nước ối, nhưng em biết các loại chất lỏng không dễ bị hỏng đến thế."
1504 = "Một nụ hôn nữa. Chị Mayami làm nũng ngả đầu vào tôi, tôi cứ thế chậm rãi vuốt ve chị, chẳng sót chỗ nào."
1505 = "Làn da áp vào nhau chậm rãi đến mức sốt ruột. Điều đó, đã cho tôi biết rõ."
1507 = "Bị đẩy ngay lúc hông còn đang run rẩy sau khi xuất tinh, tôi dễ dàng ngã lăn ra chiếu tatami."
1509 = "Được chị chấp nhận, tôi thấy thật vui."
1510 = "Tôi muốn hơi nóng, mùi hương, và thể dịch của mình, thấm sâu và đậm đặc hơn nữa vào người chị Mayami."
1512 = "Đầu lưỡi em vừa liếm lên môi chị ấy để nếm thử, đã bị chiếc lưỡi vươn ra từ khuôn miệng hé mở ấy quấn lấy đầy ngọt ngào."
1515 = "Cất lên tiếng kêu không thành lời, cơ thể chị Mayami run lên bần bật――rồi rũ rượi, đổ gục xuống."
1517 = "Theo hướng ánh mắt ngước lên của em, chị Mayami mang một vẻ mặt vô cùng áy náy."
1519 = "Em muốn đến gần hơn nữa, ép sát cơ thể vào nhau, rồi nhận ra. Dương vật của em đã cương cứng lên từ lúc nào."
1521 = "Vẫn ôm chặt lấy chị, tôi vuốt ve mái tóc. Từ từ mơn trớn vùng gáy trơn láng, rồi đến tấm lưng trần."
1524 = "Muốn đâm sâu hơn chút nữa vào tận cùng, tôi nảy hông lên, đỉnh quy đầu liền hôn lấy một bộ phận có xúc cảm khác hẳn từ trước đến giờ――"
1526 = "Suýt chút nữa thì phát ra tiếng kỳ quặc, tôi cố kìm nén bằng cách thở hắt ra bằng mũi."
1527 = "Tôi ôm lấy cơ thể mềm mại và ướt đẫm ấy. Vẫn trong tư thế kết nối――tôi trao cho chị một nụ hôn thật sâu và nóng bỏng."
1529 = "Khi em nhìn thẳng vào gương mặt chị ấy, chị Mayami nhẹ nhàng nhắm mắt lại."
1531 = "Tôi đặt tay lên eo chị Mayami, và từ từ――kéo cơ thể chị sát lại gần."
1533 = "Tôi bắt đầu đẩy hông dữ dội, khiến chị ấy bối rối trong thoáng chốc. Nhưng ngay lập tức, chị Mayami đã bắt kịp nhịp độ của tôi."
1535 = "Cảm thấy đó là một việc rất tự nhiên, tôi dùng đầu ngón tay quệt lấy máu rồi liếm thử."
1536 = "Tôi chỉ có thể thốt ra những lời như vậy. Không gì có thể sánh bằng, đó đơn giản là khoái cảm tuyệt vời nhất."
1539 = "Cứ thế uốn éo, co giật, đòi hỏi tôi xuất tinh một cách mãnh liệt và ngọt ngào."
1541 = "Ngay khoảnh khắc dương vật sắp tuột khỏi âm đạo, chị nhấc hông lên đến đó rồi――"
1546 = "Bằng đầu lưỡi nhạy bén hơn bất kỳ ai, thứ đã chống đỡ cho nhà Migita, chị liếm láp và bắt trọn lấy phần đỉnh dương vật của tôi."
1549 = "Em ngồi dậy."
1550 = "Toàn bộ dương vật bị cọ xát dữ dội, hơi thở ngưng bặt trong tích tắc, hoa mắt chóng mặt."
1552 = "Và rồi chúng tôi lại một lần nữa, chầm chậm, từ từ, hòa quyện vào nhau."
1553 = "Chỉ vậy thôi mà những giọt dâm thủy đã nhỏ tong tỏng, làm ướt đẫm cả bụng tôi."
1561 = "Mỗi lần chị ấy ngượng ngùng vặn vẹo cơ thể, một khoái cảm ngọt ngào, lâng lâng lại tích tụ nơi bụng dưới của em."
1564 = "Để lấy được sợi lụa tốt nhất, con tằm chỉ ăn những thứ tốt nhất, và được nuôi dưỡng trong hộp theo đúng nghĩa đen."
1566 = "Và rồi như đang làm mặt xấu, chị thè lưỡi về phía khe ngực――"
1619 = "Chị Mayami cũng đang cảm thấy sướng. Điều đó mang lại một cảm giác hạnh phúc ngập tràn."
1623 = "Chị Mayami dường như cũng đã nhận ra điều đó."
1625 = "Chị Mayami vươn lưỡi ra hứng lấy và húp trọn, nuốt gọn gàng xuống cổ họng không sót một giọt nào."
1627 = "Hơi nóng và sự trơn ướt từ trong miệng chị Mayami truyền đến, khiến dương vật của tôi run lên dữ dội, và hông tôi tự động nảy lên."
1629 = "Chị Mayami đang thong thả quạt cho em. Gương mặt ấy, vòng ngực ấy, đang ở ngay phía trên mặt em."
1631 = "Chị Mayami đưa ngón tay xuống háng, và mở rộng âm hộ của mình ra."
1633 = "Hông chị Mayami bắt đầu uốn éo. Chà xát quy đầu của tôi vào cánh cửa dường như là lối vào tử cung."
1636 = "Chị Mayami dùng đầu ngón giữa, chỉ vào cái lỗ đang tuôn trào mật ngọt."
1639 = "Âm đạo của chị Mayami uốn éo, co thắt lại như đang vắt kiệt."
1642 = "Ngay sát bên khóe môi em, một giọt mồ hôi từ chị Mayami rơi xuống."
1643 = "Chắc hẳn đã thấm thía đến tận xương tủy, nên giọng chị Mayami nghe nặng trĩu."
1645 = "Làn da, bộ ngực, và tất cả mọi thứ của chị Mayami, cũng giống như vậy, không một vết xước, được chăm sóc và nuôi dưỡng vô cùng cẩn thận."
1647 = "Bộ ngực của chị Mayami――hồi mới được nhận nuôi, chỉ có một lần duy nhất chúng tôi tắm chung……"
1648 = "Bộ ngực của chị Mayami quá lớn, với độ dài dương vật của tôi, chỉ có phần đỉnh là nhô ra được."
1651 = "Mỗi khi lưỡi chị Mayami chuyển động, mỗi khi lưỡi và khoang miệng bị liếm láp, cơ thể em lại càng nóng bừng lên."
1653 = "Chỉ cần nghe một tiếng đó của chị Mayami thôi, sự khó chịu lại càng phình to thêm."
1655 = "Lớp thịt bên trong âm đạo chị Mayami tuy trơn nhẵn, nhưng lại quấn chặt lấy phần đỉnh của tôi không một khe hở."
1656 = "Sức nặng của chị Mayami, hơi nóng từ cặp mông đang đè chặt lên người tôi, tạo ra một sức ép dễ chịu kích thích từ làn da cho đến tận xương tủy."
1658 = "Chị Mayami ngượng ngùng cởi bỏ quần áo và đồ lót, rồi thả rơi xuống sàn."
1660 = "Chị Mayami cũng đang rất nóng, vậy mà vẫn cho em gối đùi, và dịu dàng quạt cho em suốt."
1661 = "Hình thái gia đình mới, mối quan hệ mới giữa chị Mayami và tôi. Không cần vội vã, chúng tôi sẽ từ từ để nó chín muồi."
1662 = "Khe ngực của chị Mayami mềm mại, trơn láng, tuy mềm nhưng lại ép sát chặt chẽ, kích thích sự cương cứng của tôi."
1665 = "Mở mắt ra, quả nhiên là vậy. Đây là nhịp điệu của chiếc quạt tròn."
1668 = "Hai hòn bi như sưng phồng lên, áp lực quá đỗi mãnh liệt trào ngược ồ ạt qua niệu đạo."
1673 = "Dù tinh dịch tuôn trào như dòng thác, nhưng chị Mayami vẫn không buông miệng ra mà nuốt lấy tất cả."
1675 = "Cuối cùng, một tiếng chụt vang lên. Phần đỉnh dương vật cắm phập vào giữa khe cửa mình."
1676 = "Cảm giác ôm khít, mỗi khi cọ xát lại lật mở râm ran, bám chặt lấy rãnh quy đầu, chà xát không ngừng."
1681 = "Giọng nói đã nhuốm vị ngọt ngào. Từ lúc nào, bụng tôi cũng dính đầy mật ngọt rỉ xuống."
1685 = "Toàn bộ dương vật bị ôm chặt lấy. Âm đạo của chị Mayami bám rịt không buông."
1686 = "Dương vật bị ép chặt vào giữa háng chị ấy―― Chỉ vậy thôi cũng đủ sướng đến mức muốn xuất tinh rồi."
1693 = "Chuyển động của lưỡi, khuôn miệng mút mát, dòng nước bọt tràn ra, bộ ngực ép sát vào, tất cả khiến đầu óc tôi trở nên trống rỗng."
1697 = "Dù rất sướng, nhưng lại khiến em bồn chồn. Em lại khao khát mãnh liệt hơn nữa."
1699 = "Đang chảy máu. Từ chỗ kết nối, máu đỏ tươi đang rỉ ra."
1702 = "Bị kẹp chặt giữa hai bầu ngực, phần đỉnh được ngậm lấy dịu dàng, và mút mát――"
1705 = "Khắc sâu vào da thịt, vào tâm trí tôi rằng, đây là nơi duy nhất để xuất tinh."
1714 = "Không giống như khoái cảm vụt qua, khi được kẹp giữa hai bầu ngực và liếm láp."
1715 = "Cảm giác như xé toạc da thịt, bóc tách lớp màng bám chặt."
1716 = "Đây không phải làn da mà tôi biết. Có phải vì bị hai tay ép chặt từ hai bên không――"
1717 = "Cảm giác này――thật tuyệt vời. Sướng đến mức cả cơ thể như muốn lộn ngược lại."
1718 = "Hơi ấm ấy thắp lên ngọn lửa từ sâu thẳm bên trong cơ thể em, làm rõ nét lại những cảm giác đang mờ mịt vì cơn say sóng nhiệt."
1724 = "Nương theo nhịp điệu chậm rãi, tay tôi cũng không cử động thô bạo."
1728 = "Cơn gió dễ chịu nhè nhẹ thổi qua. Làm dịu đi cơ thể đang nóng hừng hực của em."
1730 = "Chim."
1731 = "Khoái cảm khi đôi môi rời đi khiến tinh dịch lại trào ra thêm, làm vấy bẩn khuôn mặt chị Mayami."
1734 = "Chờ đón khoảnh khắc nó nhô ra, miệng và lưỡi của chị Mayami đã trực sẵn, mút lấy, liếm láp, cắn nhẹ, ngậm lấy――"
1735 = "Để phần đỉnh trượt dọc theo lớp thịt hồng hào của âm hộ, chị Mayami chầm chậm, từ từ di chuyển hông."
1736 = "Tốc độ chậm chạp như sên bò, khiến mọi cảm giác bất giác đều dồn hết vào dương vật."
1745 = "Nếm thử, thấy có vị mặn. Đồng thời, có cả vị ngọt dịu và hơi ấm."
1787 = "（Tuột）"
1790 = "（Liếm nhẹ）"
1792 = "（Phậpppppp!!）"
1793 = "（Mút――chu, chụt）"
1794 = "（Trượt!!）"
1795 = "（Tách ra）"
1796 = "（Chụt）"
1797 = "（Trượt! Ép sát! Trơn tuột! Mềm nhũn!）"
1799 = "（Bịch）"
1801 = "（Phụt! Phụt! Phụt! Phụt!）"
1803 = "（Phụt! Phụt! Phụt! Phụt!）"
1804 = "（Trượt――trượt――ưm）"
1806 = "（Trượt――――tuột――――tuột――）"
1807 = "（Trượt――trượt――trượt――）"
1808 = "（Trượt!!!!）"
1810 = "（A a……Làn da này, hệt như sợi lụa vậy.）"
1811 = "（Phạch――phạch――phạch――）"
1812 = "（Phạch phạch phạch phạch）"
1813 = "（Tách）"
1815 = "（Chu――trượt）"
1816 = "（Thắt lại! Siết chặt! Co bóp!）"
1817 = "（Thắt lại）"
1819 = "（Hửm? ……Sao lại nóng đến mức này nhỉ?）"
1822 = "（Phụt! Phụt! Phụt! Phụt!）"
1823 = "（Phụt!）"
1824 = "（Ép chặt!!!）"
1826 = "（Ép! Trượt! Cọ! Mềm nhũn!）"
1827 = "（Trượt）"
1829 = "（Đang……uống sao――Chị Mayami――tinh dịch, của tôi.）"
1830 = "（Là ngực――）"
1831 = "（Trượt――phập――tuột――――tuột――tuột――）"
1832 = "（Trượt――trượt――trượt――ưm――）"
1833 = "（Nhỏ tong tỏng）"
1835 = "（Làn da chất lượng cao đến nhường này……Tôi lại đang dùng dương vật―― và những giọt dịch rỉ ra, để làm vấy bẩn nó.）"
1837 = "（Từ hồi đó đã lớn rồi――Vì xấu hổ nên tôi không dám tắm chung nữa……）"
1838 = "（Ép mạnh!）"
1840 = "（Ngoáy――Trượt!）"
1841 = "（Giật mạnh）"

[selections]
