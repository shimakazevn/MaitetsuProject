1814 = "Sợ hãi sẽ lại bị rút ra, tôi buông những lời thô tục theo sự dẫn dắt, và được thưởng bằng cách từ từ đưa vào sâu thêm một chút nữa."
1816 = "Lưỡi lại liếm vào lúc này——!!!!!!!"
