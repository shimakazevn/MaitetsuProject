1822 = "Người tôi ngưỡng mộ, người phụ nữ đầu tiên, người chị gái nuôi, người vợ quan trọng. Tất cả những điều đó đang hòa tan vào trong tiếng gọi 『Chị』."
1824 = "Đỏ bừng mặt, chị ấy cố gắng ép tiếng kêu của mèo ra khỏi cổ họng. Sự không giống chị ấy thường ngày, sự thiếu quen thuộc đó, khiến dương vật của tôi lập tức tăng thêm độ cứng."
1827 = "Khuôn mặt đỏ bừng lan đến tận mang tai. Có lẽ vì nhớ lại tiếng bắt chước mèo vừa nãy, hoặc là do câu nói của tôi quá xấu hổ."
1828 = "Bầu ngực trượt mạnh sang một bên, phần đỉnh dương vật bị ném ra ngoài và trở nên lạnh lẽo. Cảm giác hụt hẫng ập đến bất ngờ——!!?"
1830 = "Chuyển động hông chuyển sang chiều dọc. Chị Mayami chỉ để quy đầu hơi lún vào cửa âm đạo một chút, rồi lại rút ra, rồi lại dính vào."
1832 = "Một nụ cười rạng rỡ như hoa nở, ngập tràn hạnh phúc hiện rõ trên khuôn mặt. Nhìn thấy điều đó, a, tôi đã hiểu ra."
1834 = "Nóng, nóng không chịu nổi. Hoàn toàn tan chảy vào nhau. Não cũng hoàn toàn tan chảy——tất cả, đều biến thành tinh dịch."
1836 = "Nếu cứ thế này mà ra thì đúng là quá xuất tinh sớm. Để kìm hãm lại, tôi giảm bớt chuyển động, bắt đầu suy nghĩ và lựa lời."
1840 = "Chuyển động trái phải đồng bộ, ép chặt dương vật. Như thể đang cố gắng nén tinh dịch bên trong lại vậy."
1853 = "Tưởng tượng thụ tinh, bốn chữ đó hiện lên trong đầu với sự nhu động mạnh mẽ. Bên trong âm đạo đang cố nuốt trọn những tinh binh chưa được phóng ra không chừa một giọt."
1858 = "Hai chị em tôi đã xây dựng một sợi dây liên kết chắc chắn còn đậm sâu hơn cả máu mủ. Thừa nhận và phó thác điều đó lúc này——thật ngọt ngào và bình yên làm sao."
1860 = "Lại siết chặt nữa, nhưng, không hề khó chịu—— Không chỉ siết chặt mà âm đạo còn đang rộn ràng cựa quậy."
1862 = "Tôi ngẫm lại những lời mình vừa nói. Hoàn toàn không hiểu chuyện gì đang xảy ra."
1865 = "Muốn điên cuồng nhấp hông, muốn thúc mạnh lên. Nhưng bây giờ——em đã hứa, với chị rồi."
1867 = "Đúng như lời nói, cửa tử cung ngậm chặt lấy quy đầu, trong trạng thái đó, hông chị ấy xoay vòng cọ xát đầy ngọt ngào."
1868 = "Tiếng \"Hả\" suýt thốt ra, tôi may mắn dùng cuống lưỡi chặn lại được. Không, nhưng mà, nói vậy cũng hơi quá đáng——đấy."
1870 = "Tôi đặt bút xuống. Dù đang dở việc kiểm tra, nhưng chỉ là cho ý kiến thì quá đơn giản."
1872 = "Bàn tay định vươn ra chạm vào núm vú, đã bị ngăn lại bởi bầu ngực thể hiện ý chí rõ ràng, bởi áp lực dồn lên dương vật."
1875 = "Tôi ôm chặt chị Mayami, đè chị xuống. Lần này, đến lượt tôi phủ lên người chị."
1877 = "Của quý đang cương cứng của tôi bị bên trong chị Mayami nuốt trọn rồi lại lộ ra. Mỗi lần hông chuyển động mạnh lên xuống, cặp vú lại nảy lên bần bật."
1878 = "Dương vật lập tức lấy lại độ cứng. Chị Mayami đang đè lên tôi, tôi muốn nhanh chóng được cửa âm đạo đang nhỏ dãi của chị ấy nuốt trọn."
1881 = "Trái tim, cơ thể và linh hồn, tất cả đều giao phó cho chị Mayami. Toàn bộ con người tôi bị hút chặt vào tử cung, cứ thế chìm đắm."
1883 = "Hông tôi tự động chuyển động. Đồng thời, cổ họng tôi tuôn ra những lời nói thẳng từ trái tim."
1884 = "Nhìn thẳng vào mắt chị Mayami——chúng tôi nhìn nhau."
1887 = "Cổ họng vẫn còn vương mồ hôi và tinh dịch của chị Mayami chuyển động mạnh. Nuốt nước bọt——chậm rãi, chậm rãi, thở ra."
1889 = "Bị siết chặt đến mức đau đớn, hiện thân của chiếc kẹo và cây roi. Dù tôi chỉ định hùa theo chuyển động hông cho tốt thôi nhưng."
1890 = "Tôi gật đầu. Bằng cả cái đầu, trái tim và dương vật, không chút do dự, bằng tất cả sức lực. Và đồng thời, tôi đã hiểu ra."
1892 = "Vì vậy, không cần kìm nén. Không cần cố gắng. Chỉ cần để tinh trùng tuôn trào, trút toàn bộ vào tử cung là đủ."
1894 = "Vì vậy, tôi ôm chặt lấy chị. Để chứng minh rằng tôi không chỉ là em trai——mà còn là một người đàn ông, là chồng của chị."
1896 = "Khoái cảm khi vứt bỏ quyền chủ động, tôn nghiêm, và mọi thứ khác. Tất cả của tôi đều được bao bọc trong lồn của chị Mayami."
1899 = "Mỗi lần cửa âm đạo hôn lên quy đầu, cảm giác bám dính lại tăng lên. Toàn bộ nửa thân dưới đang bồn chồn muốn được đưa vào càng sớm càng tốt."
1900 = "Mỗi khi hông chị Mayami nhảy múa, dịch nhờn từ chỗ nối lại rỉ ra, rơi lõm bõm xuống vùng kín của tôi, rồi chảy tràn ra."
1902 = "Mỗi lần lặp đi lặp lại như vậy, dương vật lại càng đẫm nước bọt. Sự trơn ướt từ nước bọt được bổ sung, càng làm tăng thêm khoái cảm kẹp ngực."
1908 = "Tinh dịch sền sệt nhỏ giọt, làm vấy bẩn khuôn mặt và cơ thể chị Mayami. Cả khoang miệng đang hé mở, cũng bị chất lỏng trắng đục của tôi làm vấy bẩn."
1915 = "Khoảnh khắc nhìn thấy, toàn bộ công việc đang làm dở đều bay biến sạch. Nghe nói là đồ lót, nhưng mà ngực và cả chỗ đó đều phơi bày hết ra rồi kìa——!"
1954 = "Vừa dẫn dắt dương vật của tôi vừa chuyển động hông, chị Mayami liên tục cọ xát quy đầu vào điểm sần sùi ở phía nông gần bụng hết lần này đến lần khác."
1955 = "Chị Mayami ngượng ngùng lắc đầu, bầu ngực đung đưa, cọ xát vào dương vật đang cương cứng——có vẻ như tôi đã nói trúng tim đen."
1958 = "Chị Mayami cũng tăng tốc và nóng lên. Mỗi lần cặp vú nảy lên dữ dội, những giọt mồ hôi văng ra, mùi hương nồng nàn của phụ nữ thấm sâu vào não tôi."
1960 = "Chị Mayami lè lưỡi ra khoe. Nhớ lại cảm giác đó, dương vật lập tức giật nảy lên."
1962 = "Hơi thở của chị Mayami trở nên gấp gáp. Chị ấy bồn chồn, vô cùng ngượng ngùng. Những kích thích chồng chất từng chút một đó, cũng thúc giục tôi xuất tinh mạnh mẽ."
1964 = "Chị Mayami di chuyển bầu ngực trái phải lệch nhau. Sự thay đổi áp lực theo độ trễ thời gian dễ dàng đùa giỡn với dương vật đang cương cứng."
1966 = "Nước mắt đọng trên khóe mi chị Mayami. Tôi dùng đầu lưỡi nhẹ nhàng hôn lên, rồi nuốt trọn giọt nước mắt ấy."
1968 = "Hông chị Mayami chuyển động nhè nhẹ. Đưa đỉnh quy đầu về phía cửa tử cung, như thể muốn bôi trét thứ dịch bôi trơn đang chảy ròng ròng lên đó vậy."
1970 = "Hông chị Mayami vẽ thành những vòng tròn. Đặt cửa âm đạo vào đỉnh quy đầu của tôi, trượt qua lại, bôi đều dịch nhờn lên toàn bộ quy đầu."
1972 = "Chuyển động hông của chị Mayami dừng lại trong chốc lát. Đôi mắt vẽ thành một đường cong nụ cười, chiếc lưỡi đỏ chót liếm nhẹ đôi môi."
1973 = "Ánh mắt chị Mayami dao động. Như đang tìm kiếm nơi dừng chân, ánh mắt chị ấy cứ đảo quanh——"
1976 = "Chị Mayami cười. Nụ cười ngập tràn niềm vui xen lẫn chút thong dong, đúng chuẩn nụ cười của một người chị lớn."
1977 = "Chị Mayami ngượng ngùng cụp mắt xuống. Làn da càng thêm nóng rực. Độ ẩm hòa cùng mật độ, đòi hỏi tôi phải chuyển động hông."
1980 = "Làn da đỏ ửng rịn mồ hôi, càng làm tăng thêm sự mềm mại và ẩm ướt của bộ ngực tuyệt hảo của chị Mayami."
1981 = "Cuối cùng, cuối cùng cũng được đưa vào. Dù chỉ mới được một nửa quy đầu. Cảm giác an tâm và hạnh phúc tràn ngập, càng làm ham muốn tình dục bùng nổ."
1987 = "Hơn nữa cái lưỡi đó còn đang di chuyển!! Chờ đợi đón lấy tôi để liếm, rồi lại đuổi theo ngay khoảnh khắc tôi rút ra."
1989 = "Sự dồn ép từ ngực quá mãnh liệt. Do đó hông tôi tự động đẩy tới!"
1990 = "Vứt bỏ quần áo, đẩy ngã, đè lên. Bởi vì tôi chắc chắn rằng, đó chính là điều chị Mayami mong muốn."
2001 = "Chuyển động hông đột ngột dừng lại. Sự nhu động, sự co giật của cửa tử cung ——Và rồi nhịp đập. Nhịp đập của chị Mayami truyền đến tôi."
2007 = "Lưỡi gõ vào lỗ sáo. Đầu lưỡi nhọn hoắt cố gắng chui vào nhưng trượt ra, rồi lại tiếp tục gõ."
2010 = "Nụ hôn đáp xuống phần đỉnh dương vật đang bị xoa bóp bởi màn kẹp ngực lệch nhịp. Đầu lưỡi hơi cong lên, liếm láp, bám chặt và gõ vào quy đầu."
2016 = "Kích thích thị giác, sự bất ngờ, và áp lực từ da thịt mềm mại quen thuộc. Sự kích thích ba trong một khiến ham muốn xuất tinh nhanh chóng phồng lên——"
2026 = "Ý nghĩ đó, tuy nhiên lại càng làm tôi rùng mình phấn khích. Được chị Mayami trêu đùa và ăn tươi nuốt sống——bởi vì đó là một sự sung sướng tột cùng."
2027 = "Lại bị siết chặt và tôi đã hiểu ra. Sự phấn khích mà tôi đang cảm nhận này, có lẽ, có lẽ là——"
2028 = "Sự bao dung, đang được thể hiện rõ nét. Dương vật của tôi đang chìm đắm trong biển ngực, sắp nghẹt thở vì khoái cảm."
2029 = "Khi tôi ấn vào núm vú đã cương cứng từ khoảnh khắc bước vào phòng, chị Mayami phát ra tiếng kêu như một con mèo cái đang động dục——a."
2039 = "Khoảnh khắc chạm vào đầu lưỡi nóng bỏng, cảm giác được chào đón và mút lấy! Khi giọt đầu tiên đi qua lỗ sáo, tất cả sẽ tuôn ra cùng một lúc!!"
