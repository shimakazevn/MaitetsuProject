1829 = "「Là một chuyện rất quan trọng.\\nNói tóm lại―― em thích chị Mayami.」"
1830 = "「Ừ. Là sự kết hợp giữa Đường sắt Karatsu và Xưởng rượu Koubu ở tỉnh Saga.」"
1833 = "「Của hãng President Fine Liquor bên Eikoku (Vương quốc Anh).\\nHọ hỏi xem đơn hàng tối thiểu là từ bao nhiêu chai.」"
1834 = "「Anh hai nói mà?\\nChỉ cần nói ra là có thể sắp xếp lại được mà.」"
1837 = "「Có chuyện gì đáng cười sao?」"
1839 = "「Có chứ. Đó là chuyện đương nhiên mà.」"
1843 = "「Nhân dịp này.\\nMọi người cùng nâng ly chúc mừng nhé?」"
1847 = "「Em không sao đâu.\\nChắc là do em suy nghĩ hơi nhiều chút thôi.」"
1848 = "「Trời ạ, chị chui vào trong bồn ủ rượu luôn sao.」"
1849 = "「Không có chuyện đó đâu, làm gì có chuyện đó.」"
1850 = "「Không sao đâu. Sou-chan.\\nĐiểm đó của em, mọi người cũng đều thích cả mà.」"
1856 = "「Paulette có vẻ cũng định như vậy.\\nTrước mắt, cô ấy bảo sẽ khôi phục lại tuyến đường đến tận Sendai.」"
1861 = "「Từ luồng gió này chắc chắn sẽ lại tách ra thành vô số giọt nước khác,\\nvà chúng sẽ lại tạo ra những luồng gió mới mạnh mẽ hơn.」"
1862 = "「Tại sao lại……\\nlà tất nhiên, vậy?」"
1864 = "「Không vẽ nổi, là thiết kế nhãn hiệu sao?」"
1869 = "「Anh còn được nghe nói là có một lý do khác nữa――\\nLúc đó anh cũng đang say, nên chỉ trả lời qua loa thôi.」"
1870 = "「Thế nên, em đã nhận ra. Chẳng liên quan gì đến nghĩa lý hay ân huệ cả.\\nEm, muốn được chị Mayami. Muốn được chị công nhận.」"
1873 = "「Phiền muộn của anh là…… chuyện gì vậy?」"
1877 = "「Dù sao thì, đó cũng là nơi bắt nguồn của đường sắt và \\x%lレイルロオド;#00ffc040;Railord%l;#; mà.\\nSau đợt đại bãi bỏ tuyến, có vẻ cũng có rất nhiều \\x%lレイルロオド;#00ffc040;Railord%l;#; lui về ở ẩn.」"
1879 = "「Tất nhiên rồi. Nếu đó là việc anh có thể làm.」"
1880 = "「Tất nhiên rồi. Chị chỉ nhắm đến chức vô địch thôi mà.」"
1881 = "「Tất nhiên là, anh muốn giúp đỡ, để biến ước muốn của chị Mayami thành hiện thực.」"
1882 = "「Nhận, nhận ra―― sao?」"
1883 = "「Thôi nào, Nagi. Không được chen ngang như thế đâu.」"
1886 = "「Làm gì có chuyện anh là quái vật như thế.\\nAnh cũng chỉ là một con người thôi.」"
1891 = "「Chị Mayami, có ở đó không?」"
1893 = "「Chị Mayami.\\nEm mong chị Mayami sẽ trở thành người yêu của em.」"
1895 = "「Con hiểu rồi. Bố đi đường cẩn thận nhé. A, nhân tiện,\\nmua quà lưu niệm cho―― a, vâng. Vâng. Con nhờ bố nhé.」"
1899 = "「Lọt vào top 8, sao.」"
1902 = "「Những loại rượu được ISC đánh giá,\\nchỉ được sản xuất ở những nước đó và Hinomoto thôi sao?」"
1905 = "「Anh Quốc á.」"
1907 = "「Anh hai cũng có, những phiền muộn đang phải gánh vác sao?」"
1912 = "「Haaaa――\\nTiếc thật đấy. Không vô địch được sao.」"
1913 = "「Hảảả」"
1917 = "「Đơn đặt hàng sao?」"
1918 = "「Thôi đi, khách sáo quá đấy, anh hai.\\nGiữa em và anh hai với nhau mà.」"
1921 = "「Nhỉ? Sou-chan.」"
1923 = "「Cảm ơn em nhé. Hibiki.」"
1928 = "「Không chỉ ít nhiều đâu, mà là rất nhiều đấy. Với tư cách là \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; thì đã đành,\\nem còn dạy anh biết bao điều về Ohimitera nữa―― anh thực sự rất biết ơn em.」"
1933 = "「Chị vất vả rồi, chị Mayami.」"
1947 = "「Chuyện――á――」"
1948 = "「Cái đó…… thì. Chuyện đó, là」"
1949 = "「Điều đó chứng tỏ,\\nhọ rất coi trọng lịch sử và truyền thống.」"
1950 = "「Đây là……mắt xanh――\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; nước ngoài sao?」"
1952 = "「Chuyện đó thì không sao đâu. Nếu là anh hai thì chắc chắn sẽ làm được……\\nĐó là ước muốn mà chỉ có anh hai, mới có thể thực hiện được thôi.」"
1953 = "「Chuyện đó thì em cũng giống chị thôi.\\nDù có phiền phức và rắc rối, em vẫn muốn yêu chị Mayami.」"
1954 = "「Chà, cũng đúng nhỉ.」"
1955 = "「Cái này là――」"
1956 = "「Cũng không thể nào. Tất cả các loại rượu đều được rót vào cùng một loại ly,\\nnói cách khác, chúng được đánh giá trong tình trạng hoàn toàn bị che giấu mọi thông tin xung quanh.」"
1957 = "「Nếu vậy―― anh hai. Chuyện này――\\nViệc Hitoshizuku đạt hạng 8 ấy.」"
1958 = "「Nếu vậy thì, cả em nữa. Migita Hibiki cũng là con gái nhà Migita――\\nÍt nhiều gì…… em cũng từng giúp ích được gì đó cho anh hai, đúng không?」"
1961 = "「Cả nhãn hiệu mà bé Hii thiết kế cho nữa. Thật sự,\\nnó đã trở thành một thứ vô cùng xứng đáng với \"Hitoshizuku\" rồi.」"
1962 = "「Vậy thì――」"
1964 = "「A, à. Em cũng, định đi về rồi. Nhưng mà,\\nNavi bảo là, 『Bỏ lỡ thì phí lắm đó』, nên là」"
1970 = "「Lúc đó, Hibiki đã hỏi em.\\nNếu lý do là vì nhà Migita, thì chẳng phải bản thân em ấy cũng giống vậy sao――」"
1971 = "「À này, em. Có vẻ vẽ được rồi. Rất nhiều ý tưởng luôn.\\nAnh để em một mình một lát được không?」"
1972 = "「À này, điện thoại. Ờm, có khi nào bị hết pin, hay gì đó――」"
1973 = "「Vậy thì, tốt rồi.」"
1975 = "「Nếu vậy, có phải là do phân biệt đối xử hay gì đó không ạ?」"
1976 = "「Vậy thì, chọn cô bé đó đi.\\nChắc là phải bàn bạc với bên kia về quy trình tiếp nhận và mấy thứ khác nữa nhỉ.」"
1977 = "「Vậy thì, chúc mừng Hitoshizuku đạt giải 8 tại ISC, và\\nchúc mừng tình yêu của em và chị Mayami đã đơm hoa kết trái, cạn ly!」"
1978 = "「Chị tắt điện thoại là đúng đắn đấy.\\nCứ để vậy thì chắc chắn đêm nay khỏi ngủ luôn.」"
1980 = "「Anh hai thông minh mà, nên chắc anh sẽ giải quyết được thôi――\\nNhưng em thì ngốc lắm, chắc chắn sẽ càng làm mọi thứ rối tung lên cho xem.」"
1982 = "「Chị hai――và cả anh hai nữa. Chúc mừng hai người.」"
1984 = "「Ngoài miệng thì bảo cản, nhưng mà chị lại là người xem chăm chú nhất đó nha」"
1985 = "「Dù nghĩ vậy, nhưng quả nhiên sự tiếc nuối vẫn lớn hơn sao?」"
1986 = "「Ngài Soutetsu, xin chúc mừng ngài.」"
1987 = "「Cất công――\\nđược mọi người tin tưởng giao phó thêm lần nữa mà.」"
1989 = "「Đặc biệt là nhãn dán ở vai chai rất đẹp.\\nNó mang lại cảm giác \"đang kết nối\".」"
1994 = "「Thứ nhất, việc sắp xếp lại suy nghĩ và việc giải quyết vấn đề là hai chuyện khác nhau.\\nThứ hai, Hibiki không hề ngốc.」"
1995 = "「!」"
1996 = "「!!!」"
1997 = "「!!?」"
1999 = "「Navi á? A……Ra vậy――\\nCó lẽ em thuộc tuýp người dễ đoán quá nhỉ.」"
2000 = "「Yes――Yes――\\nThank you for your Inquiry. BYE.」"
2005 = "『「Cạn ly!」\\n「Cạn ly!」』"
2007 = "『「Uây!?」\\n「Á!?」』"
2168 = "Nhanh chóng quay trở lại vị trí an toàn là một cô em gái nuôi,\\ntôi lại muốn được anh nâng niu, chiều chuộng như từ trước đến nay với tư cách là em gái."
2172 = "Cả đám ùa vào."
2174 = "Cứ mặc kệ đi, rồi sẽ có cơ hội.\\nBiết đâu lại có thể vãn hồi được."
2175 = "Không được rồi―― tôi không chịu nổi nữa."
2180 = "Quả không hổ danh là cửa hàng bán buôn rượu lâu đời――\\nĐúng là người trong nghề có khác."
2184 = "Dù có sống xa nhau bao nhiêu năm đi nữa, anh hai vẫn là anh hai.\\nLà người đã luôn dõi theo những mặt yếu đuối nhất của tôi."
2185 = "Cả đường sắt, lẫn việc nấu rượu.\\nChắc chắn mọi thứ đều sẽ thay đổi theo cách như vậy."
2188 = "Ý anh là, ủa?\\nSắp xếp lại suy nghĩ và giải quyết vấn đề là khác nhau, nếu vậy thì――"
2199 = "Tiếng hô cạn ly,\\ncùng tiếng ly thủy tinh chạm nhau leng keng."
2211 = "Thật chậm rãi, thật chậm rãi,\\nchậm rãi xoa đầu tôi."
2212 = "Chuyện anh gặp và nói chuyện với chị Mayami vào ban đêm.\\nAnh kể cho tôi nghe mà không giấu giếm chút nào."
2215 = "Bị hỏi vặn lại, tôi mới chợt nhận ra mình vừa nói cái gì――"
2221 = "Nhưng――nếu đó là mong muốn của chị Mayami,\\ntất nhiên, em chỉ có việc đáp ứng thôi."
2222 = "Nhưng, giờ không chỉ có thế nữa rồi――\\nDù bản thân anh hai, hiện tại vẫn chưa nhận ra."
2225 = "Nhưng phải nói lúc tỉnh táo.\\nNếu không nói lúc tỉnh táo, thì tình cảm khó khăn lắm mới nhận ra này sẽ bị bóp méo mất."
2227 = "Nhưng mà em vẫn muốn nhìn thấy nụ cười của chị hơn,\\nnên vội vàng nói tiếp."
2229 = "Nhưng, chỉ riêng chị Mayami……\\nEm đã luôn cảm thấy chị là một ngoại lệ, là bởi vì――"
2232 = "Nhưng mà, hiện tại thì――\\nKhông tuyệt vời cũng chẳng sao cả――"
2233 = "Nhưng hiện tại, Hibiki đã hoàn toàn\\ntrở lại là Hibiki của ngày xưa."
2235 = "Sao vậy, nhân vật chính là chị Mayami lại bỏ ly xuống mất rồi."
2237 = "Vậy mà anh hai lại tròn xoe mắt,\\ntrông ngơ ngác cực kỳ."
2238 = "Nhưng, tôi vẫn sẽ nói. Chính vì vậy, tôi mới nói.\\nDù cho có một giọng nói rất lớn đang vang vọng bên tai bảo tôi dừng lại."
2241 = "Nhưng, vẻ mặt anh hai lại lộ rõ sự lo lắng,\\nlàm tôi tự hỏi bộ dạng mình thê thảm lắm sao? Cảm thấy xấu hổ quá đi mất."
2243 = "Nhưng, bây giờ đang là ban ngày, lại ở trong xưởng rượu.\\nEm không thể đáp ứng mong muốn của chị Mayami ngay lập tức được. Thế nên――"
2249 = "Nhưng, tôi không thể không hỏi.\\nDù có lẽ đã biết trước câu trả lời――"
2252 = "Hachiroku, Hibiki, Paulette, Reina, Nagi, Fukami――\\nRất nhiều tâm tư, rất nhiều giọt nước đã tạo nên luồng gió hiện tại."
2253 = "Hachiroku luôn thấu hiểu tôi.\\nDù là \\x%lレイルロオド;#00ffc040;Railord%l;#; hay con người, thì những chuyện đó cũng chẳng liên quan gì cả."
2259 = "Chắc chắn, khoảng mười năm nữa,\\nkhi nhìn lại, tôi cũng sẽ tự nhủ rằng mình đã rất tuyệt vời, đã rất cố gắng."
2263 = "Tầm ảnh hưởng từ việc Hitoshizuku bất ngờ nổi tiếng trên toàn thế giới,\\nđã tác động đến cả quyết định của công ty \\x%lエアクラ;#00ffc040;Aircra%l;#;."
2267 = "Nagi, Fukami, Hachiroku,\\nHibiki, Paulette, và cả Reina nữa."
2278 = "Số điện thoại mà chị Mayami bảo cha nuôi có thể tiết lộ,\\nchính là số của chiếc điện thoại di động đó."
2322 = "Con gái nhà Migita, và con nuôi nhà Migita."
2326 = "Vẫn như mọi khi, suy đoán đó hoàn toàn chính xác."
2327 = "A, nhìn kìa, quả nhiên là vậy.\\nKhuôn mặt anh hai, đang ngạc nhiên…… và bối rối."
2329 = "Dù cho điều đó là không thể, dù cho có bị từ chối đi chăng nữa, thì lời tỏ tình này,\\ntôi cũng muốn nó được diễn ra một cách đẹp đẽ và kịch tính hơn."
2331 = "Dù tôi có cảm giác rằng,\\nđiều đó sẽ làm tổn thương chính mình, nhưng dù thế nào đi nữa."
2334 = "Chắc chắn chị Mayami đã luôn che giấu,\\nlấp liếm đi cả những nhịp đập con tim nhỏ bé nhất bằng phong thái người lớn và sự điềm tĩnh của mình."
2338 = "A―― tôi, đang cố gắng gượng cười để kìm nén.\\nThấy sự yếu đuối của bản thân thật thảm hại, nhưng rốt cuộc tôi vẫn làm như vậy."
2339 = "A―― tôi nói sai trình tự mất rồi.\\nSai thì cũng sai rồi, giờ có muốn làm lại cũng chẳng được."
2341 = "Thế này, tệ thật――"
2342 = "À, hơn nữa――"
2348 = "Người mà tôi thích, người mà tôi mong muốn được hạnh phúc,\\nkhông chỉ có một mình anh hai."
2352 = "Không muốn bị nhìn thấy bộ dạng đang gục mặt xuống bàn,\\ntôi lập tức bật người ngồi thẳng dậy."
2353 = "Dùng thủ đoạn hèn hạ để làm chị ấy suy sụp, rồi tự cho mình là người chiến thắng,\\ntôi không muốn sỉ nhục chị Mayami đến mức đó――"
2354 = "Anh hai, bởi vì…… anh hai, bởi vì,\\nlà người luôn kìm nén bản thân đến mức khiến người khác phải thấy xót xa mà."
2361 = "Tại một ISC mang đậm tính truyền thống và bảo thủ đến mức đó――\\nLiệu shochu của đất nước Hinomoto có thực sự được chấp nhận hay không."
2363 = "Lựa chọn thời điểm này, liệu có phải là thiếu suy nghĩ không.\\nTôi không biết. Tôi chẳng có kinh nghiệm, mà đây cũng không phải thứ có thể học được."
2364 = "Sự bồn chồn đó cũng lây sang cả Nagi và Fukami."
2366 = "Ân huệ. Nghĩa vụ. Trở nên có ích.\\nNhững điều mà anh hai lúc nào cũng nói."
2374 = "Vừa nói, chị vừa mở nắp chai."
2375 = "Sau khi được dạy cho một bài học quan trọng,\\nchỉ trong 2, 3 ngày chúng tôi đã có chút ngượng ngùng."
2378 = "Chị ấy thì thầm vào tai em.\\nNgay lập tức, em như bị chuốc say từ đôi tai."
2380 = "Đôi mắt tròn xoe ngơ ngác hướng về phía tôi.\\nNgay lập tức, đầu óc tôi quay cuồng."
2382 = "Gập hết một bàn tay,\\nrồi, một, hai――"
2384 = "Giọng điệu thất vọng của chị ấy.\\nLại làm trái tim em rộn ràng, xao xuyến."
2386 = "Đôi mắt to tròn, ươn ướt và rung rinh,\\nnhư thể chị đã say mèm từ lúc nào."
2387 = "Nhận ra điều gì? Đôi mắt chị như đang gặng hỏi."
2390 = "Cổ họng chị ấy chuyển động.\\nChị Mayami nuốt nước bọt, phát ra một tiếng ực rõ to."
2391 = "Một cái gật đầu nhẹ.\\nĐôi môi chị Mayami mấp máy nhưng không phát ra thành tiếng."
2394 = "Nói rồi, chị ấy gật đầu nhè nhẹ."
2398 = "Nếu bật khóc thì chắc chắn sẽ càng làm anh ấy bối rối hơn――\\nTôi lấy hết sức bình sinh, dồn nén xuống tận đáy lòng, và nói."
2400 = "Nếu lý do là vì \"nhà Migita\",\\nthì đáng ra em cũng không được dựa dẫm vào Hibiki mới phải."
2401 = "Cứ suy nghĩ thêm về điều đó,\\ntôi lại càng thấy buồn hơn nữa."
2403 = "Người có thể mang lại hạnh phúc cho anh hai. Người luôn cười đùa bên cạnh anh.\\n……Giá như là tôi, thì tốt biết mấy."
2404 = "Nếu để anh hai thấy mình khóc, chắc chắn,\\nanh ấy sẽ lại bận tâm những chuyện không đâu mất――"
2412 = "Gương mặt như thể bị dồn vào đường cùng.\\nGiọng nói cất lên đầy khó khăn."
2413 = "Nên vui mừng, hay nên tiếc nuối.\\nGiữa lúc còn đang bối rối, điện thoại lại một lần nữa đổ chuông."
2419 = "Sơ yếu lý lịch, hay đúng hơn là hồ sơ cá nhân.\\nKhi em đưa cho chị Mayami một xấp dày cộp, mắt chị ấy tròn xoe."
2423 = "Nhóm người lớn thì dùng Hitoshizuku, còn nhóm học sinh thì dùng nước Ramune hơi nước,\\nrót đầy tràn vào cốc của mỗi người."
2429 = "Trái tim tôi, đau nhói.\\nDù đã biết trước kết quả, nhưng quả nhiên tôi vẫn chực trào nước mắt."
2432 = "Mặc kệ đi,\\ntrái tim nguội lạnh của tôi thì thầm."
2437 = "Dù có ở trong phòng cũng chẳng nghĩ ra được gì,\\nnên tôi mới xuống phòng khách, nhưng rốt cuộc vẫn chẳng có gì thay đổi."
2441 = "Thứ mà em gái đang muốn có――\\nVì vậy nên chị ấy mới tránh mặt anh hai sao――"
2442 = "Đã truyền đạt được.\\nVì vậy, em cũng đón nhận."
2445 = "Thật sự, rất khó nói."
2448 = "Trong lúc đó, em\\nmột mình uống cạn ly rượu vào miệng."
2450 = "Vừa gọi một tiếng, đã có tiếng đáp lại ngay lập tức.\\nNhưng phải một lúc sau mới thấy bóng dáng chị ấy."
2451 = "Trong một khoảnh khắc, tôi đã tưởng anh hai quay lại,\\nnhưng, bàn tay đang xoa đầu tôi, lại thật nhỏ bé."
2455 = "Hai đôi môi dính chặt vào nhau,\\nem từ từ, truyền rượu sang."
2458 = "Chị Mayami cẩn thận kiểm tra lại điện thoại,\\nvà từ tốn gật đầu đáp lại rằng không sao cả."
2459 = "Phải vẽ cái gì và vẽ như thế nào,\\ntrong đầu tôi chẳng nảy ra được một chút ý tưởng nào cả."
2462 = "Truyền chén rượu mừng, sang cho chị Mayami."
2464 = "Chỉ lúc này thôi, tôi muốn anh ấy chỉ nhìn về phía mình,\\nnên tôi không nói ra tên của chị Mayami."
2466 = "Bất giác tôi bật cười.\\nLàm cái mặt nghiêm túc thế kia, mà lại nói ra mấy lời hơi kỳ cục."
2468 = "Không phải ở thì quá khứ, mà là ở thì hiện tại."
2472 = "Tôi đã nhìn sâu, thật sâu vào cảm xúc của chính mình,\\nvà có lẽ đã sắp xếp lại được phần nào."
2474 = "Tâm tư, sự nồng nhiệt,\\nđang được chưng cất bởi tình cảm vô bờ bến."
2475 = "Chị Mayami đang run rẩy.\\nDù vậy, ánh mắt chị ấy không hề rời khỏi em."
2477 = "Nghe anh ấy nói vậy, tôi lại cảm thấy đúng là như thế thật."
2478 = "Nghe nói ông được nhà Migita mời về làm rể.\\nDo đó, kỹ năng của cha nuôi với tư cách là một người bán buôn rượu, đương nhiên là cực kỳ xuất sắc."
2479 = "Khi tôi cất tiếng gọi, chị Mayami cuối cùng cũng tắt nguồn điện thoại,\\nvà vươn vai thở hắt ra một hơi thật dài."
2480 = "Vừa gật đầu, chiếc cốc đã được đưa sang,\\nvà Hitoshizuku được rót đầy ăm ắp."
2481 = "Hoặc có lẽ chính vì vậy,\\nmà Paulette lại bồn chồn, không thể ngồi yên."
2484 = "Chính vì thế…… tôi lại muốn hỏi em ấy.\\nDù biết đó có thể là một điều tàn nhẫn."
2485 = "Mọi người đồng loạt gật đầu.\\nTrong im lặng, tất cả cùng lúc――ngoại trừ Reina đang ngơ ngác."
2487 = "Giữa lúc mọi người đều cứng đờ trong giây lát,\\nmột giọng nói thong thả, thậm chí có phần bình thản vang lên."
2490 = "Gần đến mức ngực hai người sắp chạm vào nhau.\\nChị Mayami cứ thế ngước lên nhìn em."
2499 = "Hạng 8 ISC.\\nLà loại rượu đầu tiên ngoài khu vực Tây Oushu đạt được thành tích này."
2502 = "Lính mới thì bắt đầu từ việc dọn dẹp trước."
2505 = "Chắc chắn là nó đang đến.\\nMột luồng gió lớn và mạnh mẽ hơn rất nhiều so với những gì chúng em từng tưởng tượng."
2509 = "Vì sự bối rối đó chứng tỏ rằng, đối với anh hai,\\nhình bóng của tôi với tư cách không phải là em gái nuôi, chắc chắn vẫn còn đọng lại."
2521 = "Mối quan hệ được ban cho, và vì thế mà tuân theo đó,\\nHibiki đã tự mình―― bước tới, và thay đổi nó."
2523 = "Hibiki giật mạnh tay áo tôi."
2525 = "Nét mặt Hibiki bắt đầu tối sầm lại, sắc mặt Nagi cũng trở nên tệ đi.\\nTôi cũng…… có cùng cảm giác đó."
2530 = "Rõ ràng là một chuyện vô cùng đáng mừng,\\nnhưng cứ nghĩ đến việc phải làm tốt hơn nữa, đầu óc tôi lại trở nên trống rỗng."
2533 = "Chênh lệch múi giờ là chín tiếng, vậy thì……\\nBên Eikoku (Vương quốc Anh) mới chỉ sáu giờ tối thôi."
2535 = "Kim đồng hồ đã chỉ ba giờ sáng."
2552 = "Bàn tay Fukami thõng xuống một cách vô lực,\\nvà ngay lập tức, Nagi thở hắt ra một hơi thật lớn."
2554 = "Để không làm phiền đến quá trình chuẩn bị cho ISC,\\ntôi đã kìm nén việc thổ lộ cho đến tận hôm nay."
2555 = "Tại sao lại làm như vậy―― khi nghĩ đến đó,\\ncâu trả lời chỉ có một mà thôi."
2556 = "Nói đến mức này rồi,\\nmà tại sao anh ấy vẫn không nhận ra chứ, tôi thấy thật buồn――"
2557 = "Nuôi dưỡng mầm sống mới."
2558 = "Anh ấy đang bối rối. Rõ ràng là tôi không hề muốn làm khó anh ấy,\\nnhưng thấy anh bối rối vì mình, thành thật mà nói tôi lại thấy vui."
2563 = "Đôi môi nóng hổi ấy cứ thế nhẹ nhàng,\\nghé sát vào tai em."
2566 = "Những lúc tệ nhất, mắt chị ấy còn trợn ngược lên cơ――\\nNên em cũng hiểu được phần nào lý do chị ấy không muốn cho anh hai thấy."
2572 = "Nằm gọn trên đùi Paulette,\\nReina đang ngủ say sưa."
2573 = "Trên nhãn dán vòng quanh vai chai,\\n\\x%l8620;#00ffc040;8620%l;#; đang tiếp tục chạy trên những đường ray uốn lượn."
2578 = "Và trên nhãn dán ở thân chai, nổi bật trên hình ảnh dòng nước sông Kuma và những bông lúa trĩu hạt,\\nlà dòng chữ thư pháp sắc nét mang tên \"Shochu hơi nước・Tinh túy -Hitoshizuku-\"."
2579 = "Hoàn toàn hoan nghênh.\\nKhông có lý do gì để từ chối."
2583 = "Quả đúng là chị Mayami, tôi thầm nghĩ.\\nĐã cất công làm, thì phải giành chức vô địch――"
2599 = "Chị Mayami gật gù liên tục,\\nrồi lại thở ra một hơi cảm thán."
2601 = "Chị Mayami mệt mỏi dựa hẳn người vào em.\\n……Bận rộn đến mức này, cũng không trách được."
2603 = "Như thể vừa nốc cạn một hơi loại rượu mạnh 90 độ,\\nchị Mayami đỏ bừng mặt, lan đến tận đầu ngón tay."
2605 = "Chị Mayami gập ngón tay lại đếm."
2608 = "Điện thoại của chị Mayami đổ chuông."
2609 = "Trong lời nói của chị Mayami không hề có chút căng thẳng nào.\\nÁnh mắt chị dịu dàng, hướng về phía Hibiki."
2612 = "Lật lật vài trang hồ sơ,\\nchẳng mấy chốc chị Mayami đã bó tay."
2613 = "Tôi đặt ngón trỏ lên môi,\\ncả Nagi và Fukami đều lập tức im lặng."
2615 = "Kinh ngạc, và thán phục.\\nChị Mayami đang thể hiện chính xác những từ đó."
2619 = "Em cảm nhận sâu sắc rằng điều đó hoàn toàn đúng.\\nMột giọt mang tên em, một giọt mang tên chị Mayami."
2626 = "Đột nhiên, em muốn uống một ngụm rượu thật mạnh.\\nEm đang rất xấu hổ, bồn chồn và gần như nghẹt thở."
2629 = "Một trong số đó…… quả nhiên là chuyện của anh hai."
2632 = "Cứ thế, nó sẽ trở thành một giọt tinh túy――"
2639 = "Dù là người ít tham gia vào quá trình nấu rượu nhất――"
2654 = "Một nụ hôn phớt qua trong khoảnh khắc."
2661 = "Lý do tôi ghét bị đem ra so sánh, lý do tôi buồn khi không được công nhận,\\nlà bởi vì―― tôi rất yêu quý và ngưỡng mộ chị ấy."
2662 = "Được giao phó vẽ nhãn hiệu mới cho shochu hơi nước.\\nĐiều đó có nghĩa là nhãn hiệu trước đó đã được công nhận."
2669 = "Tiếng điện thoại reo không ngớt,\\nlà minh chứng hùng hồn nhất cho thấy điều đó tuyệt vời đến nhường nào."
2670 = "Kể từ lần đầu tiên được anh lắng nghe tâm sự,\\ntôi đã luôn, luôn luôn ao ước điều đó."
2671 = "Lần này em chủ động hôn,\\nnhư một câu trả lời thay cho lời nói gửi đến chị Mayami."
2672 = "Dù có nghĩ thế nào thì……\\nGiọng điệu này cũng không giống như đang báo tin vui."
2675 = "Vậy thì, cả chị Mayami cũng?\\nNhưng…… thái độ như vậy, chưa một lần nào――!"
2681 = "Mùi rượu. Mùi gạo.\\nChị Mayami mang ra một chiếc cốc thủy tinh giản dị."
2687 = "Quy tắc thép này, dù đối phương có là \\x%lレイルロオド;#00ffc040;Railord%l;#; đi chăng nữa,\\ncó vẻ vẫn được áp dụng không ngoại lệ."
2693 = "Một tiếng thở dài.\\nVậy là kết nối được rồi nhỉ, tôi nghĩ thầm."
2696 = "Anh hai rời đi.\\nMột cách thật dễ dàng."
2698 = "Bàn tay anh hai khẽ vươn ra,\\nnhưng rồi lại khựng lại đó, như thể đang ngần ngại."
2700 = "Dạo gần đây, anh hai và chị Mayami,\\nđêm nào cũng ở trong hầm rượu trò chuyện vui vẻ với nhau."
2703 = "Nở nụ cười gượng gạo, anh hai bắt đầu kể."
2704 = "Bàn tay của anh hai.\\nMột bàn tay thật lớn."
2706 = "Và chắc chắn, trong một khoảng thời gian dài tương đương,\\ntôi đã khiến chị Mayami phải nhẫn nhịn, phải che giấu điều đó."
2708 = "Chuyện nẫng tay trên, và lời tỏ tình của tôi.\\nTrong tâm trí anh hai, chắc hẳn không còn vướng mắc gì nữa."
2709 = "Vì sợ bị những thông tin trước đó làm phân tâm,\\nnên từ trước đến nay tôi đã cố tình không xem chúng, nhưng――"
2710 = "Tất nhiên là đáng mừng hơn việc bị trượt, nhưng……"
2711 = "Tôi thở phào nhẹ nhõm vì may quá không phải là anh hai,\\nnhưng đồng thời cũng thấy có chút tiếc nuối――"
2712 = "Dù hơi để ý ánh mắt của những người thợ nấu rượu,\\nnhưng em vẫn nhẹ nhàng xoa đầu chị ấy."
2713 = "Rõ ràng là do tôi bảo anh ấy làm vậy,\\nnhưng sự thật là tôi vẫn――!!?"
2714 = "Những lời nói nhằm xoa dịu vẻ mặt bất mãn của Paulette,\\nlại vô tình làm dấy lên sự bất an trong tôi."
2715 = "Dù có hơi bất ngờ một chút,\\nnhưng cũng đỡ mất công phải đi thông báo cho mọi người."
2716 = "Nói thì dễ, nhưng với một thử thách khó khăn đến nhường này,\\nrốt cuộc có bao nhiêu người dám thực sự dốc hết sức mình để đương đầu chứ."
2717 = "Chắc chắn tôi sẽ bị tổn thương,\\nvà cũng sẽ làm tổn thương cả anh hai nữa."
2723 = "Trên màn hình máy tính bảng mà Hibiki đang chỉ vào,\\nhiển thị danh sách các loại rượu từng đoạt giải của ISC qua các năm."
2730 = "Tại hội trường cuộc thi, nơi chỉ có hội viên hoặc người được hội viên mời mới có thể vào,\\ncha nuôi đang thay chúng tôi có mặt ở đó."
2731 = "Gật đầu. Chỉ có vậy.\\nNhưng em cảm giác như đã được chấp nhận, nên bước tới một bước."
2743 = "（♪～～）"
2744 = "（Rầm rầm rầm rầm rầm!）"
2746 = "（Suỵt~）"
2747 = "（Hôm nay. Chính là hôm nay. Dù cho kết quả có ra sao――\\nChỉ cần có kết quả, mình sẽ nói ra.）"
2750 = "（Mình cũng…… phải học tập Hibiki thôi.）"
2752 = "（Tút）"
2754 = "（Thật sự…… chỉ một lần cũng chưa từng……\\nNhư thế, bởi vì―― quá không tự nhiên―― không thể nào.）"
2756 = "（Anh hai…… chắc chắn đã đánh mất đi suy nghĩ rằng――\\nbản thân mình cũng là một người được ai đó yêu thương.）"

[selections]
