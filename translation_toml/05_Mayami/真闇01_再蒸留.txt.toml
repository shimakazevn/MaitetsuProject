[script]
53 = "Vì \\x%lエアクラ;#00ffc040;Aircra%l;#; tự động lái, nên dù có lên tàu trong tình trạng say xỉn \\nthì cũng không có vấn đề gì về mặt luật pháp hay an toàn."
973 = "——Tôi phải trở nên mạnh mẽ hơn, hữu ích hơn mới được."
975 = "——Tôi có cảm giác mọi thứ đã kết nối lại với nhau."
978 = "——Dù sao thì, bây giờ hãy làm những việc cần làm đã."
989 = "……Từ đó về sau là một sự sụt giảm tiêu chuẩn. \\nPhải mất hàng chục năm mới cho thấy dấu hiệu phục hồi khó khăn——"
1003 = "「\\x%lエアクラ;#00ffc040;Aircra%l;#; \\nđã đào thải đường sắt một cách nhanh chóng như vậy đó ạ.」"
1007 = "\"「——Rồi, xong.」\""
1009 = "\"「——Trên thực tế thì, đã có thành quả gì chưa?」\""
1010 = "「——Do đó, hướng nỗ lực vào chất lượng là đúng đắn.」"
1019 = "「“Migita Ichi” đã là một loại shochu hoàn thiện rồi. \\nHương vị đó không thể thay đổi được.」"
1034 = "\"「……Vậy là không màng đến lợi nhuận sao? Quả thực những nỗ lực như vậy\\ncũng có thể góp phần thúc đẩy kinh tế địa phương, nhưng mà——」\""
1035 = "「……Dù tốt hay xấu thì Ohimitera vẫn là một thị trấn cổ mà.」"
1043 = "「……Không được cố quá hay giả vờ như không có chuyện gì đâu đấy nhé? \\nCó gì cần giúp đỡ thì phải nói với chị, biết chưa?」"
1045 = "\"「……Khò…………khò.」\""
1047 = "\"「……Nè, Sou-chan. Em nghe thấy không?」\""
1049 = "「……Năm \\x%l大詔;#00ffc040;Taisho%l;#; thứ 35——\\ntức là năm Showa thứ nhất, là năm chiến bại nhỉ.」"
1053 = "\"「……Ngân hàng, hay nói đúng hơn là,\\ncũng có rất nhiều người mang ơn ông Mototada mà.」\""
1055 = "「……Chắc là vậy rồi. Tiếc thật.」"
1057 = "「……Độ nổi tiếng không phải là thứ có thể kiểm soát được. \\nNhững mánh khóe kiểu đó, về lâu dài chắc chắn sẽ gây ra ảnh hưởng xấu.」"
1060 = "「……Và kết quả của những việc đó, là việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; sao.」"
1063 = "「……Vài năm gần đây ở Đế đô đang rộ lên phong trào uống rượu shochu. \\nKhông ít loại đã trở thành hàng hiếm đắt đỏ đâu.」"
1067 = "「……Nói đến tài nguyên du lịch mà các khu suối nước nóng khác không có, còn chúng ta thì có, \\nđó là \\x%l8620;#00ffc040;8620%l;#; và rượu shochu.」"
1069 = "「……Cảm ơn em. Sou-chan.」"
1073 = "\"「……Giờ này chắc là đang đi tuần tra nhỉ?」\""
1074 = "「……Đúng là một cuộc chiến thực sự nhỉ.」"
1274 = "「Cuộc thi tiếp theo sẽ được tổ chức khi nào vậy?」"
1277 = "「Không đâu. Ở Đế đô cũng toàn những cuộc thi hữu danh vô thực thôi.」"
1278 = "「Không dựa vào trực giác hay cảm giác của \\x%l杜氏;#00ffc040;trưởng hầm rượu%l;#; nữa, \\nmà tạo ra một loại shochu chỉ bằng dữ liệu.」"
1282 = "「Thêm một chút nữa——không, phải là rất nhiều. Chị muốn nâng cao chất lượng, \\nđể xem có thể đứng trên cùng một đấu trường với họ được không.」"
1285 = "「Nếu ở mỗi tỉnh, \\ndù có ngắn đến đâu mà vẫn còn sót lại tuyến đường sắt thì——」"
1293 = "\"「Nhưng, mà.」\""
1294 = "「Nhưng mà nè, ông ấy còn làm nhiều thứ khác nữa cơ. Đủ thứ luôn.」"
1295 = "「Nhưng Houshou Mototada không hề yêu cầu bất kỳ sự hợp tác nào. Ông ta cứ khư khư bám lấy cá nhân, \\nnhư thể từ chối việc tạo ra kết quả, chỉ tiêu tốn công sức mà thôi.」"
1296 = "「Mà, những thử nghiệm nhỏ nhặt kiểu đó, hết cái này đến cái khác. \\nÔng Mototada đã rất tích cực thử nghiệm đấy. Trong một khoảng thời gian dà~i.」"
1297 = "「Nhưng shochu hơi nước cũng đâu phải loại kém chất lượng. \\nĐể nâng cao chất lượng từ mức này thì——」"
1298 = "「Nhưng mà, nếu là đầu năm thì……\\nBắt đầu ủ từ con số 1——lịch trình cũng vừa khít luôn nhỉ.」"
1299 = "「Nhưng mà, nếu vậy thì Sou-chan sẽ」"
1301 = "「Không đâu. Không chỉ có mặt tốt, mà cũng có mặt khắc nghiệt. \\nTất cả các loại rượu chưng cất đều được đánh giá chung. Shochu cũng không được đối xử đặc biệt.」"
1303 = "「Không, không chỉ giới hạn ở rượu shochu hơi nước đâu. \\nVí dụ như, có thể uống thử để so sánh các loại——」"
1307 = "「Đại sứ quán của các nước trên thế giới hầu hết đều sử dụng các loại rượu giành chiến thắng hoặc đoạt giải. \\nNhững người thích uống rượu cũng sẽ đổ xô đi mua.」"
1310 = "「Nói cách khác……Chị định giao việc quản lý ủ rượu cho Hachiroku sao?」"
1313 = "\"「Chẳng có gì cả.」\""
1314 = "「Sao thế? Sou-chan.」"
1318 = "\"「Cá nhân ông ấy.\\nTiền thuê nhà rẻ hơn giá thị trường rất nhiều.」\""
1327 = "「Dưới dạng một tour du lịch sao——Cũng không tồi. \\nỪ, anh nghĩ thực sự rất có triển vọng đấy.」"
1329 = "\"「Em đợi chị một chút nhé?」\""
1335 = "「Chị nghĩ đó là một ý tưởng hay. Ý tưởng hay nhưng mà……ở giai đoạn này, \\nOhimitera có thể sẽ bị lu mờ và bị bỏ qua mất.」"
1344 = "「Hachiroku và em là một cặp bài trùng mà. \\nCó em hỗ trợ, gánh nặng của Hachiroku sẽ giảm đi rất nhiều.」"
1346 = "\"「Còn chuyện gì khác nữa……rốt cuộc là chuyện gì?」\""
1350 = "「Nếu Hachiroku có thời gian rảnh rỗi……thì chị muốn nhờ.」"
1354 = "「Năm thứ 11 là năm cái gọi là đạo luật \\x%lエアクラ;#00ffc040;Aircra%l;#; được ban hành đấy.」"
1366 = "\"「Nếu Sou-chan ký vào đây, chị sẽ cho em vay hai trăm triệu yên,\\nkhông lãi suất, không cần thế chấp.」\""
1368 = "「Dù là vậy, \\nnhưng độ nổi tiếng và được yêu thích lại chênh lệch quá lớn——A.」"
1376 = "\"「Migita, là đại diện cho rượu shochu Kuma……\\nhay nói đúng hơn là đại diện cho những giá trị truyền thống của Ohimitera nhỉ.」\""
1378 = "「Từng địa phương……sao ạ?」"
1380 = "「Oa……Thế này thì tàn tạ cũng phải thôi.」"
1382 = "「Chà chà, sở thích tệ thật đấy.」"
1383 = "\"「Làm gì có công việc nào là không vất vả chứ?」\""
1385 = "\"「Ưm——.」\""
1386 = "「Ừm——Không, nhưng mà.」"
1387 = "「À——Hình như có bản đồ đường sắt nhỉ.」"
1389 = "「Hừm.」"
1391 = "「À. Là vị thánh bảo trợ cho những bệnh nhân nghiện rượu.」"
1393 = "\"「Ưm, tụi nó đang hát hơi chậm rãi nhỉ.\\nChà, xem ra mẻ rượu mùa thu năm nay cũng không thể vượt mức trung bình được rồi.」\""
1395 = "「Chị chịu thôi. Không biết được đâu. \\nChị đâu phải là ông Mototada.」"
1396 = "\"「À——」\""
1398 = "\"「À——ra là vậy.」\""
1401 = "「A——Nếu vậy thì, từ vài năm trước đó \\nđã là thời kỳ phát triển của \\x%lエアクラ;#00ffc040;Aircra%l;#; rồi nhỉ.」"
1404 = "「A——Nếu vậy thì có lẽ, đây là năm mà Paulette, \\nvà biết đâu cả Reina cũng bắt đầu tham gia vào Đường sắt Ohimitera nhỉ.」"
1406 = "\"「À……vâng.\\nHình như là do một ông lão tự mình bán thì phải……」\""
1408 = "「A……Đúng nhỉ.」"
1410 = "「A……Vậy thì, chắc chắn \\nmọi chuyện sẽ tiến triển tốt đẹp thôi nhỉ.」"
1411 = "「A!」"
1414 = "「A! Vậy ra, “từng địa phương” là——chạy những chuyến \\x%l列車;#00ffc040;tàu%l;#; shochu \\nđể thưởng thức rượu shochu đặc trưng của từng địa phương.」"
1416 = "「A! Vậy thì, \\nsẽ làm thành một chuyến \\x%l列車;#00ffc040;tàu%l;#; có thể uống thử các loại shochu hiếm sao?」"
1421 = "「À, vâng. \\nEm nghĩ có lẽ chỉ là lo bò trắng răng thôi, nhưng——」"
1423 = "「A, vâng. Tất nhiên rồi. \\nEm cũng sẽ suy nghĩ thêm.」"
1425 = "「A, hình như chị có……nghe nói rồi? \\nỪm……Cái tổ chức ở……Meikoku (Mỹ) ấy hả?」"
1429 = "「A——Tôi từng thấy trong sách giáo khoa hay ở đâu đó rồi. \\nTrong các cuộc không kích, đường sắt cũng bị nhắm làm mục tiêu phải không?」"
1432 = "「Ừ. À, tất nhiên, \\nchi tiết thì phải hỏi Paulette mới được……」"
1434 = "「Làm thôi. Chắc chắn sẽ làm ra được một loại rượu ngon đấy nhỉ.」"
1436 = "「Ừ. Và những loại shochu đó ở Đế đô gần như không thể mua được, \\nnhưng ở nhà chúng ta——đại lý bán buôn Migita, thì vẫn có bán bình thường.」"
1438 = "「Vâng. \\nNó được coi là cuộc thi rượu công bằng nhất thế giới.」"
1439 = "「Vâng. Nghe nói ở Kagoshima, Miyazaki và cả Oita, \\nđường sắt vẫn còn tồn tại và tiếp tục hoạt động.」"
1441 = "「Ừ. Vậy em cũng bàn bạc với Pau-chan trước đi nhé?」"
1442 = "\"「Vâng.」\""
1443 = "「Hừm hừm.」"
1445 = "「Cũng là chuyện đương nhiên thôi. Nhưng——trong khoảng thời gian đó, \\nmức độ sụt giảm số lượng người sử dụng ga lại tương đối chậm.」"
1449 = "「Vâng. Em sẽ không ngần ngại nhờ vả chị đâu. \\nVì em biết đây không phải là lúc để giữ kẽ nữa rồi.」"
1452 = "「Ừ, đúng vậy, trong tương lai. Nếu các tuyến đường sắt được kết nối, \\nthậm chí chúng ta có thể đi một vòng Kyushu bằng \\x%l列車;#00ffc040;tàu%l;#; shochu cũng nên.」"
1454 = "「Vâng. Là em đây.」"
1456 = "「Vâng. Đúng là vậy. \\nỞ đó vẫn còn một bức tường nữa cần phải vượt qua.」"
1457 = "\"「Ừm. Em nghe thấy rồi. Là tiếng lên men của men kōji nhỉ.」\""
1460 = "「Mọi người thấy thế nào. \\nNếu việc cho uống rượu trên \\x%l列車;#00ffc040;tàu%l;#; không có gì bất ổn thì——」"
1462 = "「Vâng, ngài Soutetsu.」"
1466 = "「Bởi vì chúng em vẫn tiếp tục chạy không ngừng nghỉ. \\nTrong thời chiến, ngày chiến bại, và cả những ngày sau đó, luôn luôn như vậy.」"
1467 = "「Bởi vì em muốn gắn bó sâu sắc hơn nữa——với nhà Migita. \\nEm muốn cùng nhau làm ra rượu shochu.」"
1468 = "「Bởi vì khi càng về cuối cuộc \\x%l大戦;#00ffc040;Đại chiến%l;#;, \\nthì người ta càng không còn tâm trí đâu mà đi du lịch nữa ạ.」"
1470 = "「Nếu là trước khi chính thức tham gia phong trào kêu gọi đầu tư——\\nthì cũng không có ai phản đối phong trào chấn hưng của Houshou Mototada đúng không?」"
1471 = "「Bản thân phong trào thu hút đầu tư thì đã có từ thời thị trưởng trước của trước nữa rồi. \\nViệc ông Mototada chính thức tham gia là “sau những chuyện đó”, nhỉ.」"
1474 = "「Ở khu vực Đế đô, \\ncó tổ chức cuộc thi shochu nào đàng hoàng không?」"
1477 = "「Nhờ chị mà em cảm thấy mình đã thấy được những gì cần làm. \\nThật tốt vì đã nói chuyện với chị. Cảm ơn chị.」"
1482 = "「Cuộc thi á?」"
1484 = "「Thánh John of God là ai vậy?」"
1487 = "「Nếu là rượu shochu hơi nước thì」"
1489 = "「Nếu chất lượng đó có thể nhận được đánh giá khách quan thì——\\nA, không.」"
1491 = "「Nếu sau một đêm mà chị không nghĩ ra được ý tưởng nào hay hơn, \\nthì chị sẽ vui vẻ tham gia vào kế hoạch hiện tại.」"
1492 = "\"「Còn một chuyện nữa.\\nChị sẽ cho Sou-chan một lựa chọn nhé.」\""
1496 = "「Đấu trường.」"
1497 = "\"「Sự đối đầu công khai sẽ sinh ra hiềm khích……\\nMà một khi đã như vậy, thì sẽ không dễ gì xóa bỏ được đâu.」\""
1502 = "「Sou-chan.」"
1503 = "「Sou-chan!」"
1504 = "「Này, Sou-chan. \\nChuyến \\x%l列車;#00ffc040;tàu%l;#; đó, em định cho chạy bao nhiêu chuyến?」"
1506 = "「Dù không tiến triển, em cũng sẽ làm cho nó tiến triển. \\nVì mục đích đó, em sẽ không ngần ngại bất kỳ nỗ lực nào.」"
1508 = "\"「Có làm ăn phát đạt thì cũng chẳng trụ lại lâu mà lại chuyển lên Kumamoto……\\nNgược lại, mấy quán nổi tiếng ở Kumamoto mở chi nhánh ở đây thì lại ế khách.」\""
1511 = "「Dù có bị điểm 0 đi nữa, thì khách hàng nhà mình cũng chỉ cười và nói rằng \\n『Mấy tên nhà quê ở Meikoku thì biết gì về mùi vị của rượu chứ』 thôi.」"
1513 = "「Cho dù là Houshou Mototada đi chăng nữa, \\nnhững thử nghiệm ở mức độ cá nhân cũng chẳng thể nào thay đổi được cái gốc rễ đó đâu.」"
1515 = "\"「Dù có khiến họ hủy bỏ dự án đi chăng nữa, nhưng nếu cấu trúc đối lập vẫn còn tồn tại\\nthì chắc chắn nó sẽ cản trở sự phát triển lâu dài về sau.」\""
1517 = "「Gì vậy Sou-chan, chỉ có chuyện đó thôi sao.」"
1530 = "\"「Mức trung bình, sao.」\""
1532 = "「Quản lý ủ rượu. \\nChị muốn quản lý trạng thái lên men bằng chủ nghĩa dữ liệu triệt để.」"
1535 = "「Tiếp tục giảm từ năm thứ 8 đến năm thứ 10, \\nsự sụt giảm nghiêm trọng vào năm thứ 11, đây là……」"
1545 = "「Ohimitera là một thành phố không thích sự thay đổi. Houshou Mototada biết điều đó. \\nChuyện kêu gọi \\x%lエアクラ;#00ffc040;Aircra%l;#; tất nhiên cũng sẽ không được hoan nghênh.」"
1548 = "「Triệt để……nghĩa là sao?」"
1551 = "\"「Mang ơn……ý chị là,\\nđược ông ấy cho vay vốn sao?」\""
1554 = "「Phía tôi cũng đã lấy được số liệu từ tòa thị chính rồi.」"
1555 = "「Em chỉ nghĩ đến một việc không phù hợp với một cửa hàng lâu đời như Migita Ichi thôi. \\nVí dụ như, cũng có cách tham gia các cuộc thi.」"
1558 = "「Em nghĩ là chúng ta có thể tham gia cuộc thi rượu chưng cất. \\nISC——International Spirits Competition.」"
1559 = "\"「Em đến đây vì có chuyện muốn hỏi chị Mayami.」\""
1562 = "「Em hiểu rồi. Nếu vậy, hãy cho \\nnhững kẻ nhà quê ở Meikoku biết, sự thơm ngon của rượu Kuma shochu là như thế nào.」"
1563 = "「Em nghĩ Hibiki cũng có cùng cảm xúc đó. \\nChính vì vậy mà bức tranh nhãn hiệu của shochu hơi nước mới làm rung động lòng người.」"
1565 = "「Cuộc thi mà em nói đến hoàn toàn khác. \\nShochu——nói tóm lại là rượu chưng cất (Spirits) mà.」"
1568 = "「Em đến vì muốn nói chuyện với chị. \\nPaulette rất hứng thú với kế hoạch này.」"
1570 = "「Vậy nên, mới là shochu hơi nước sao?」"
1571 = "「Cho nên là. Một chút thôi——\\nCho chị suy nghĩ một đêm có được không?」"
1574 = "「Điểm số sẽ được công khai toàn bộ. Trong quá khứ, từng có xưởng rượu bị điểm 0, \\nvà bị đẩy đến bước đường phá sản.」"
1575 = "「Hay quá——Phân bố các chuyến \\x%l列車;#00ffc040;tàu%l;#; shochu rải rác khắp nơi. \\nVà rồi, trong tương lai. Một ngày nào đó, chắc chắn.」"
1582 = "「Nếu có chuyện tốt như vậy thì」"
1590 = "「Ra vậy——Nếu làm một chuyến \\x%l列車;#00ffc040;tàu%l;#; như thế, \\nthì ai cũng sẽ đổ xô đi uống các loại shochu hiếm nhỉ.」"
1593 = "「Đúng vậy. Nếu chỉ đơn thuần là một khu suối nước nóng thì người ta vẫn sẽ \\nhướng đến Yufuin, Beppu hay Ibusuki thôi.」"
1594 = "「Đúng vậy.」"
1596 = "「Đúng vậy. Với tư cách cá nhân. \\nBỏ tiền túi ra, dùng cả nhân mạch của bản thân nữa.」"
1597 = "「Ra vậy……Tầm quan trọng của việc vận chuyển và di chuyển, \\ndù là trước, trong hay sau chiến tranh cũng không thay đổi nhiều nhỉ.」"
1598 = "「Vậy sao.」"
1599 = "「Thế à?」"
1601 = "\"「Là em đây. Xin lỗi vì đã làm chị giật mình.」\""
1603 = "「Đúng là như vậy ạ. \\nChính vì thế mà trong thời chiến, chúng em cũng gặp rất nhiều vất vả.」"
1604 = "「Đúng vậy. Và hầu hết giám khảo là người Meikoku. \\nNgười Hinomoto, nếu có thì cũng chỉ khoảng 2-3 người là cùng.」"
1607 = "「Đúng vậy ạ. Thậm chí, tuyến chính Tokaido…… chạy dọc bờ biển, \\ncòn được cho là sẽ bị nhắm bắn bởi hải pháo nữa cơ ạ.」"
1608 = "「Được tổ chức vào đầu mỗi năm. \\nLễ trao giải diễn ra vào đầu tháng 3……vào ngày lễ Thánh John of God.」"
1610 = "「Có rồi. Của năm \\x%l正和;#00ffc040;Showa%l;#; thứ 37 là cái này, \\ncòn của năm \\x%l正和;#00ffc040;Showa%l;#; thứ 46 là cái này.」"
1617 = "「“Morinozou” của nhà Morinozou. “Meiou” của nhà Shiratama. \\n“Hyakunen no Kodoku” của nhà Kuraki phải không?」"
1621 = "「Năm \\x%l正和;#00ffc040;Showa%l;#; thứ 42 là năm \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; giải thể. Cùng với đó, có lẽ \\nở Kumamoto, đại bãi bỏ các tuyến đường sắt cũng đã diễn ra đồng loạt.」"
1626 = "\"「Ví dụ như……để xem nào,\\nSou-chan, em còn nhớ không?」\""
1628 = "「Đúng vậy nhỉ.」"
1632 = "\"「Tại sao, người phất cờ khởi xướng phong trào phản đối việc xây dựng nhà máy,\\nlại không phải là chị Mayami?」\""
1633 = "「Tại sao lại cứ phải cố chấp làm với tư cách cá nhân chứ. Nếu lôi kéo được thành phố, người dân, hay là \\nngân hàng vào cuộc, thì khả năng thành công và tính sinh lời sẽ cao hơn mà.」"
1638 = "「Nếu đi bằng \\x%lエアクラ;#00ffc040;Aircra%l;#; thì có thể dễ dàng đi một vòng mà. \\nBiến nó thành một tour du lịch rồi bán là được chứ gì.」"
1641 = "「Chỉ riêng khu vực quanh Ohimitera đã từng sầm uất đến thế này mà…… \\nĐến năm 46, lại chỉ còn mỗi Tuyến Yui thôi sao.」"
1642 = "\"「Đương nhiên rồi. Nếu được, xin hãy cho em đợi.」\""
1643 = "「Thì sao nào?」"
1652 = "「Ý chị Mayami thế nào? Nếu không có vấn đề gì, \\ntrước tiên em muốn mang kế hoạch này đến cho Paulette.」"
1655 = "\"「Nếu chị Mayami phất cờ——thì sẽ tạo ra một cục diện ép buộc mọi người phải lựa chọn\\ngiữa việc theo phe Migita hay theo phe ngân hàng sao.」\""
1656 = "「Vâng——」"
1663 = "「Chắc chắn là……vậy rồi. Trong trường hợp đó, việc không được uống \\ncó khi lại dẫn đến rắc rối cũng nên.」"
1664 = "「Quả thực Ohimitera cũng bất lợi ở điểm đó. Dù có dùng Aircra, \\nnhững thành phố lớn dễ tiếp cận cũng chỉ có Yatsushiro và Kumamoto.」"
1668 = "\"「Vất vả thật đấy.\\nViệc hướng tới một đỉnh cao mới ấy.」\""
1672 = "「Việc có thể dễ dàng đi lại bằng \\x%lエアクラ;#00ffc040;Aircra%l;#; cũng là một lợi thế lớn nhỉ.」"
1676 = "「Vốn dĩ nó đã là hàng hiếm rồi. \\nViệc yêu cầu tăng số lượng cung cấp——chắc chắn là không thể nào.」"
1687 = "\"「Được thôi? Em cứ hỏi đi.」\""
1693 = "「Chị định tham gia sao?」"
1696 = "「Xây dựng một hệ thống \\x%l車販;#00ffc040;bán hàng trên tàu%l;#; và dịch vụ không để khách say xỉn. \\nChỉ cần làm được điều đó, chắc chắn có thể tránh được hầu hết các rắc rối.」"
1699 = "\"「Nếu \\x%l杜氏;#00ffc040;trưởng hầm rượu%l;#; của nơi đó mà phất cờ phản đối,\\nthì phong trào phản đối chắc chắn sẽ bị công khai hóa mất.」\""
1702 = "「Nếu nói là rượu ngon thì “Migita Ichi” cũng rất tuyệt vời rồi. \\nEm nghĩ nó tuyệt đối không hề thua kém các loại shochu cao cấp đâu.」"
1704 = "「Nếu có lý do gì để không tham gia thì em nói cho chị nghe thử xem.」"
1711 = "「Ai mà biết được? Chuyện của người khác thì chị không rõ đâu.」"
1712 = "\"「Ai đó?」\""
1713 = "「Em muốn chị Mayami trực tiếp nhờ vả hai người họ. \\nLàm vậy chắc chắn sẽ là một nguồn động viên lớn đấy.」"
1714 = "「Xin hãy để em làm. Dù chỉ là gián tiếp——\\nEm cũng muốn giúp đỡ công việc ủ rượu của chị Mayami.」"
1715 = "「Việc khiến mọi người nghĩ rằng “không còn cách nào khác”... \\nchắc chắn là một phương pháp cực kỳ hữu hiệu để buộc họ chấp nhận sự thay đổi nhỉ.」"
1716 = "「Vào thời kỳ hoàng kim của đường sắt, những tuyến đường sắt tư nhân vận hành các chuyến \\x%l列車;#00ffc040;tàu%l;#; bia \\nhoàn toàn không phải là chuyện hiếm đâu ạ.」"
1725 = "「Đi thôi, Hachiroku.」"
1726 = "\"「Trên con phố trước ga, đoạn vừa qua khỏi cột đèn giao thông đầu tiên ấy,\\ntrước đây từng có một quán bánh dango Yaniwa.」\""
1745 = "「Cái này……Có nghĩa là Ohimitera không có giá trị nào khác với tư cách là một địa điểm du lịch, \\nngoài giá trị của một \\x%lターミナル駅;#00ffc040;ga đầu mối%l;#; nhỉ.」"
1747 = "「Những điểm đó thì chắc phải bàn bạc với Paulette và đền chủ Akai thôi nhỉ \\n——Á.」"
1748 = "「Những thứ đó……tất cả đều làm với tư cách cá nhân sao?」"
1749 = "「Vào năm \\x%l正和;#00ffc040;Showa%l;#; thứ 50 này, có chuyện gì đã xảy ra vậy?」"
1750 = "「Năm \\x%l正和;#00ffc040;Showa%l;#; thứ 42 này đã có chuyện gì vậy? \\nNó tụt hẳn xuống, chỗ này cũng là một thung lũng thê thảm đấy.」"
1751 = "「Về điểm đó, nếu chúng ta có thể đảm bảo được những nhân viên phục vụ trên tàu giỏi, \\nthì em nghĩ sẽ không sao đâu ạ.」"
1752 = "「Đúng vậy, Sou-chan!」"
1753 = "「Đây là……bồn chứa rượu shochu hơi nước sao?」"
1754 = "「Đó là năm mà ông Hinai——\\nBố của Pau-chan nhậm chức Thị trưởng Ohimitera nhỉ.」"
1755 = "「Ra là vậy!」"
1756 = "「Vậy thì……Ví dụ như mỗi ngày chạy một \\x%l編成;#00ffc040;đoàn tàu%l;#;, \\nvà giới hạn mỗi người chỉ được uống hai go cho mỗi loại……」"
1758 = "「Chuyện đó thì hoàn toàn không có vấn đề gì…… Á.」"
1759 = "「Chị biết mà, mấy chuyện đó.」"
1760 = "\"「Cái đó thì cũng có phần đúng.\\nNhưng không chỉ có vậy đâu.」\""
1763 = "\"「Chị sắp xong rồi đây.」\""
1765 = "「Vậy là——Sẽ bị đem ra so sánh với \\nwhisky hay brandy sao?」"
1771 = "\"「À thì……chuyện là…………」\""
1772 = "「Này, đợi đã anh hai!」"
1774 = "「Chà, cũng đúng ha. \\nNhưng nhờ vậy mà em đã hiểu ra vài điều rồi.」"
1778 = "「Nếu vậy, chỉ cần chứng minh điều ngược lại là được. \\nChứng minh rằng “vẫn còn cách khác” bằng một kết quả xác đáng.」"
1779 = "「Nếu vậy, chúng ta thiết kế một chuyến \\x%l列車;#00ffc040;tàu%l;#; có thể uống rượu shochu thì sao?」"
1782 = "「Đó là vai trò của những người ngoại đạo. \\nĐường sắt, Hachiroku và em là những người phù hợp nhất.」"
1783 = "\"「Quán đó đóng cửa, để trống suốt một thời gian dài,\\nrồi ông Mototada mua lại và cho thuê mặt bằng với giá rất rẻ đấy.」\""
1785 = "「Vậy là chuyến \\x%l列車;#00ffc040;tàu%l;#; uống thử so sánh không thể thực hiện được sao ạ?」"
1787 = "\"「Vậy thì. Suỵt.」\""
1789 = "「Nếu vậy thì, với Hachiroku-chan và Hii-chan」"
1792 = "\"「Ngân hàng mua sao? Hay là đích thân Houshou Mototada mua?」\""
1794 = "「Ngài Soutetsu. \\nEm đã nhận được dữ liệu từ Reina và tổng hợp lại thành bảng rồi ạ.」"
1795 = "「Thời gian rảnh thì có thể tạo ra được.」"
1799 = "「Xin lỗi nhé. Giúp ích nhiều lắm.」"
1800 = "「っ!」"
1801 = "「っ!!?」"
1802 = "「Với \\x%l客車;#00ffc040;toa hành khách%l;#; bằng thép dài 17m, nếu bố trí chỗ ngồi rộng rãi một chút, \\nthì sức chứa khoảng 60 người phải không ạ?」"
1808 = "「Loại rượu có tổng điểm cao nhất từ 300 vị giám khảo sẽ giành chiến thắng. \\nNhận được vinh dự là rượu Spirits ngon nhất thế giới.」"
1810 = "「60 người thì mỗi ngày một loại rượu sẽ tốn 12 sho……」"
1930 = "Tuyến đường sắt \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; năm 37 bao phủ rộng khắp Kyushu. \\nTừ Ohimitera, hướng Bắc vượt qua Yatsushiro đến Kumamoto - Hakata, và xa hơn nữa."
1934 = "Việc đó sẽ làm mất mặt Houshou Mototada, và khiến những người tán thành chủ trương của ông ta \\nnảy sinh ác cảm."
1936 = "Không xong rồi, đến giờ rồi. \\nThời gian trôi qua nhanh như chớp."
1939 = "Bất kể ý định thực sự của Houshou Mototada là gì, hành động của ông ta \\nchắc chắn đã củng cố bầu không khí cho rằng việc kêu gọi \\x%lエアクラ;#00ffc040;Aircra%l;#; là bất đắc dĩ."
1941 = "Dù là do các tổ chức dân sự hay các hiệp hội trong ngành khởi xướng. \\nMục đích chính của những sự kiện đó cũng chỉ là để “đánh bóng tên tuổi”."
1944 = "Nhưng nếu có thể đạt được điều đó bằng cách giúp đỡ Hachiroku, \\nthì dù công việc có tăng lên bao nhiêu, tôi cũng tuyệt đối không cảm thấy vất vả."
1946 = "Không, không phải. \\nChỉ như vậy thì vẫn chưa đủ."
1961 = "Không phải là loại bánh được đóng gói đẹp đẽ bán cho khách du lịch,\\nmà là loại bánh dango bán cho người dân địa phương, tính tiền theo từng cái."
1963 = "Có lẽ chị ấy đã làm xong một công đoạn, giọng nói nghe thật sảng khoái.\\nHương rượu thoang thoảng. Hơi ấm của xưởng rượu. Ánh mắt dịu dàng chuyển hướng sang em."
1966 = "Thế nhưng, lấy năm \\x%l正和;#00ffc040;Showa%l;#; thứ 8 làm ranh giới, nó lại bắt đầu vẽ nên một đường đi xuống."
1968 = "Nhưng bàn tay đó lại nắm lại thành một nắm đấm nhỏ."
1970 = "Thế nhưng, Houshou Mototada vẫn kiên nhẫn tích lũy thành tích. \\nThành tích chứng minh rằng “những nỗ lực thiết thực không thể mang lại sự phục hưng”."
1972 = "Thế nhưng... \\nNếu chị Mayami đứng ra chứng minh thì sẽ gây mất lòng."
1974 = "Thế nhưng, dù có suy nghĩ thế nào đi chăng nữa,\\ntrong lòng em vẫn không thể nào thông suốt được."
1977 = "Dù “không nhận được” sự hợp tác từ thành phố hay hiệp hội thương mại, ông ta vẫn cố gắng. \\nHình ảnh đó rất dễ nhận được sự đồng cảm. Nhưng mà——"
1978 = "Sự mâu thuẫn đó đánh thức những nghi vấn, \\nvà những nghi vấn ngay lập tức kết nối với ký ức."
1981 = "Giọng của Hachiroku rất tươi sáng và mạnh mẽ."
1982 = "Ngoài ra ví dụ như, nhà Yotsume sản xuất loại shochu lúa mạch đang trở thành hàng hiếm \\n“Kamehachi”, thì nằm ở Oita."
1992 = "Tất cả các loại rượu dự thi \\nsẽ được rót vào những chiếc ly chỉ dán số thứ tự."
1997 = "Sự phức tạp của Hibiki, \\nmà khi mới gặp tôi hoàn toàn không thể hiểu được."
2002 = "Hướng Nam phân nhánh tại Yoshimatsu, chạy về phía Hayato - Kagoshima, \\nvà phía Miyakonojo - Miyazaki."
2018 = "Nếu chỉ xét về mặt lý thuyết, thì em hoàn toàn có thể tự nhủ rằng\\n\"Chuyện này cũng mang lại lợi ích cho chị Mayami\"."
2041 = "Với “Morinozou”, với “Meiou”, \\nvới “Hyakunen no Kodoku”, và với “Kamehachi”."
2043 = "Nếu đạt mức trung bình thì cũng đã là quá ngon rồi——\\nThế nhưng giọng điệu của chị Mayami lại có vẻ không hài lòng, điều đó khiến em cảm nhận sâu sắc."
2050 = "Ưm——\\nMột tiếng thở hắt ra thật khẽ."
2052 = "Miệng thì nói vậy, nhưng trên góc mặt nhìn nghiêng của chị Mayami khi đang ghi chép,\\nem lại cảm thấy sự thỏa mãn hiện lên rõ nét hơn là sự vất vả."
2053 = "Mặc dù có vẻ như sẽ được một bộ phận người hâm mộ đường sắt đón nhận, \\nnhưng tôi không nghĩ nó có thể đạt được độ nổi tiếng ngang với các loại shochu cao cấp."
2056 = "Chính vì vậy mà em ngập ngừng, nhưng ngay cả sự im lặng mà em vô tình tạo ra ấy,\\nchị cũng khéo léo đi trước một bước và lấp đầy nó."
2058 = "Nếu như những nền tảng đó được tích lũy, và “trên cơ sở đó”, \\nngười ta thấy rằng Houshou Mototada đã quyết định kêu gọi đầu tư như một biện pháp bất đắc dĩ thì——"
2060 = "Rượu ngon……\\nChỉ vậy thôi thì chưa đủ, với tư cách là một đại lý bán buôn, tôi biết điều đó."
2067 = "Câu trả lời nhẹ nhàng ấy khiến em nhận ra sự thiếu hiểu biết của mình."
2070 = "Chị ấy ngơ ngác. \\nCũng phải thôi."
2071 = "Cười khanh khách, \\nnhưng ngay sau đó, chị Mayami lại nheo mắt lại đầy nghiêm túc."
2074 = "Việc Paulette, một người lớn lên ở Frank, hay nói cách khác là một người ngoại lai,\\nđứng ở một thái cực, là một câu chuyện hoàn toàn khác."
2076 = "Chị ấy cười sảng khoái. \\nHoàn toàn không có chút giả tạo nào."
2077 = "Hiếm khi thấy chị ấy\\nnói với giọng điệu có vẻ bối rối như vậy."
2078 = "Giọng nói vang lên đầy kiêu hãnh. \\nNhưng khuôn mặt lại có vẻ gì đó đau khổ."
2079 = "Giọng nói vui vẻ. \\nVà rồi, một bàn tay từ từ, lặng lẽ đưa ra."
2084 = "Trông như chị ấy đang thưởng thức hương rượu, \\nnhưng cũng có vẻ như đang bất mãn điều gì đó."
2086 = "Bàn tay tôi đưa ra đã được nắm lấy."
2087 = "Con bé nói, liệu có thể làm ở từng địa phương được không."
2089 = "Một tiếng lẩm bẩm nhỏ. \\nĐôi mắt chị Mayami nheo lại như đang suy nghĩ sâu xa."
2092 = "Với ánh mắt tinh nghịch, chị Mayami đặt ngón trỏ lên môi,\\nyêu cầu em giữ im lặng hệt như đang dỗ dành một đứa trẻ."
2094 = "Nếu có biến cách từ bên ngoài ập đến, \\nnhững thứ cũ kỹ kiểu gì cũng sẽ thu mình lại phòng thủ thôi——"
2096 = "Nếu xếp chúng cạnh nhau và vẽ thành biểu đồ, \\nchúng sẽ lập tức nổi bật lên."
2097 = "Nếu những cửa hàng đã có tiếng tăm từ ngoại tỉnh chuyển đến,\\nthì tất nhiên cũng sẽ góp phần chấn hưng kinh tế."
2100 = "Nếu những người chuẩn bị khởi nghiệp thuê mặt bằng đó,\\nthì sẽ giúp ích cho việc đào tạo nhân lực."
2102 = "Nếu có mầm non mới nhú, \\nthì thay vì bám rễ ở mảnh đất cũ, hướng tới vùng đất mới là điều hiển nhiên thôi."
2104 = "Một nhà cải cách vô tâm phá vỡ những giá trị cũ. \\nNếu hình tượng đó là cần thiết, tôi nhất định sẽ trở thành như vậy."
2106 = "Nếu có thể thiết lập các điều kiện một cách hoàn hảo, thì có thể loại bỏ được sự dao động. \\nSẽ có thể liên tục cho ra chất lượng cao nhất."
2109 = "Đó là tác phẩm tiêu biểu mang tên xưởng rượu, \\nđược ủng hộ bởi một lượng fan trung thành vững chắc."
2118 = "Đối với những thế hệ còn e ngại điều đó, \\ncũng có thể nghĩ đến phương án tổ chức tour du lịch bằng xe buýt."
2120 = "Ngay cả ở thời điểm hiện tại, đây cũng là một ý tưởng giúp chấn hưng từng khu vực. \\nNếu là chuyện này, tôi có thể tự tin đề xuất với bất kỳ xưởng rượu nào."
2126 = "Dù có ngẫm nghĩ lại bao nhiêu lần,\\nthì kết luận vẫn không hề thay đổi."
2131 = "Đã sắp 7 giờ rồi. \\nChị Mayami phải đến xưởng rượu, còn chúng tôi phải đến cửa hàng đường sắt."
2145 = "Kể từ đó, lượng khách sử dụng nhà ga đã tăng lên, dù chỉ là một chút."
2149 = "Sự suy thoái của Ohimitera gắn liền với việc mất đi giá trị của một điểm trung chuyển đường sắt. \\nNói cách khác——"
2152 = "Những người muốn đi \\x%l8620;#00ffc040;8620%l;#; thì dù không có shochu họ cũng sẽ đến thôi \\n……Kế hoạch này, không thể kỳ vọng nhiều vào việc mang lại lợi ích thiết thực cho Ohimitera."
2156 = "Em rón rén chui ra khỏi chăn để không đánh thức em ấy,\\nkhông bật đèn, bước xuống nhà——rồi hướng về phía xưởng rượu."
2159 = "Tuy tôi nghĩ quả không hổ danh Paulette——\\nNhưng số lượng khách du lịch lưu trú hầu như không cho thấy sự cải thiện nào."
2160 = "Tôi lỡ nghĩ rằng chị ấy thật đáng yêu, \\nvà rồi lại cảm thấy vô cùng xấu hổ vì chính suy nghĩ đó của mình."
2164 = "Loại rượu trứ danh \"Migitakazu\" của xưởng rượu nhà em,\\nlà một loại rượu rất được ưa chuộng ở địa phương, chỉ riêng lượng đặt trước trong thành phố đã chiếm tới chín mươi phần trăm doanh số."
2165 = "Cũng không phải chuyện gì đáng giấu giếm——"
2168 = "Tôi dừng bước chân đang định rời đi, quay lại xem có chuyện gì xảy ra——\\nNhưng ở đó vẫn là chị Mayami như thường ngày."
2169 = "Đi vào phòng trong tìm kiếm, \\ntôi phát hiện ra một xấp bản đồ đường sắt đúng ở nơi mình nhớ."
2171 = "Em lại ỷ lại mất rồi.\\nLại một lần nữa, dựa dẫm vào sự dịu dàng của chị Mayami."
2174 = "Vì vậy, tôi nắm lấy, bắt tay và rồi kinh ngạc."
2175 = "Tôi đang dựa dẫm vào bàn tay này. \\nCảm giác xấu hổ chuyển thành một tinh thần trách nhiệm mạnh mẽ."
2177 = "Em đã tạo gánh nặng cho chị ấy mất rồi."
2181 = "Giúp đỡ việc phục hồi \\x%l8620;#00ffc040;8620%l;#; và sắp xếp \\x%l客車;#00ffc040;toa hành khách%l;#;, \\nđể giảm bớt gánh nặng cho Paulette dù chỉ một chút."
2184 = "Tôi ghé qua vì nghĩ chị ấy vẫn còn ở đây, và chị ấy đúng là ở đây thật. \\nChị ấy ngay lập tức nhận ra tôi."
2186 = "Để mang lại một tương lai nơi dự án bị hủy bỏ,\\nlàm hết sức mình mới chính là nhiệm vụ của em lúc này."
2187 = "Em chân thành cảm thấy chị ấy thật đẹp,\\nvà tự hỏi không biết khuôn mặt của mình khi làm việc thì trông sẽ ra sao."
2190 = "Tôi nuốt lại những lời lỡ buột miệng, \\nnhưng vì chưa nuốt trôi hẳn nên bị gặng hỏi."
2192 = "Nếu là hoàn thành vai trò thì tôi đã quen rồi."
2194 = "Để em không bị đuổi khỏi nhà Migita,\\nchị Mayami đã phải chịu đựng biết bao vất vả, em biết rõ điều đó cơ mà."
2195 = "Những lời tôi thốt ra với ý định sắp xếp lại mọi thứ, \\ncứ thế trở thành một kết luận."
2197 = "Tôi trả lời không chút do dự. \\nÝ tưởng này rất đáng để thúc đẩy."
2199 = "Từ trong chăn phía dưới chân, những âm thanh đều đặn vang lên.\\nCó vẻ như Hachiroku đang ngủ rất say."
2205 = "Khi tôi hỏi, chị Mayami ậm ừ, \\nđôi mày nhíu lại."
2206 = "Khi tôi hỏi, chị Mayami hừ mũi một cái."
2207 = "Vừa hỏi xong, tôi liền bị hỏi ngược lại."
2208 = "Em định bụng nếu chị ấy không có ở đây thì sẽ về ngủ tiếp……\\nNhưng chị ấy có mặt thì em lại lo không biết mình có làm phiền chị ấy không."
2209 = "Vừa nói tôi vừa bước lại gần, rồi chợt nhận ra. \\nChỗ chị Mayami đang đứng là——"
2213 = "Vì vậy, em mới hỏi. Em có thể làm được điều đó.\\nVứt bỏ cái vẻ bề ngoài \"không ỷ lại\" kia đi."
2215 = "Thế nên, em không thể tùy tiện nhờ vả được.\\nTrừ khi có chuyện gì đó vô cùng trọng đại, bằng không em không được phép nói những lời ỷ lại."
2217 = "Nắm lấy bàn tay mà chị Mayami đã chìa ra——\\nđó chính là phương pháp tốt nhất."
2219 = "Theo đà này, \\ncó lẽ chị Mayami cũng khó mà rút lại lời nói."
2226 = "Dữ liệu, bản đồ, và những lời nói đã giúp tôi hiểu sâu hơn."
2227 = "Số lượng khách du lịch lưu trú tại thành phố Ohimitera theo từng năm, \\nvà số lượng người sử dụng ga Ohimitera."
2240 = "Hibiki giơ tay, \\nvà chồm người về phía trước."
2241 = "Dù chưa uống một giọt nào, em lại có cảm giác hơi say say,\\nvà những lời muốn nói cứ thế tuôn ra một cách tự nhiên."
2249 = "Morinozou và Shiratama ở Kagoshima, Kuraki ở Miyazaki——"
2253 = "Mỗi ngày 12 sho trong suốt 365 ngày——\\nVới khối lượng xử lý hiện tại, chúng ta không thể nào đáp ứng nổi."
2264 = "Thua về lượng nước nóng. Thua về độ nổi tiếng. Thua về đặc sản tắm cát. \\nLại còn thua cả về sự tiện lợi giao thông, thì làm sao có cửa thắng với tư cách là một khu suối nước nóng."
2267 = "Những lời tôi nói với ý định sắp xếp lại mọi thứ, \\nkhông ngờ lại nhận được một giọng điệu hờn dỗi đáp lại."
2271 = "Ban giám khảo không có bất kỳ thông tin hay định kiến nào, \\nhọ sẽ chấm điểm độ ngon cho từng ly rượu mang số thứ tự mà mình nếm thử."
2273 = "Vượt qua thời đại đó, số lượng người sử dụng ga Ohimitera \\ncùng với số lượng khách lưu trú tại thành phố Ohimitera đã phục hồi vững chắc——"
2282 = "Loại rượu shochu hơi nước do \\x%lレイルロオド;#00ffc040;Railord%l;#; quản lý quá trình ủ, \\nvà sử dụng cùng loại than với \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; làm nguồn nhiệt."
2286 = "Dù sao thì, nhắc đến các cuộc thi trong khu vực này thì——"
2288 = "Bởi vì chính bản thân tôi cũng đang khao khát được nếm thử——\\nloại shochu hơi nước tiến hóa hơn, một loại rượu hoàn toàn mới."
2290 = "Quả thực, tôi đã quá lo xa rồi. \\nOhimitera chính xác là một thị trấn như vậy."
2310 = "Chuẩn bị mọi thứ một cách trơn tru,\\nchị Mayami nhanh thoăn thoắt viết gì đó lên giấy."
2312 = "Chắc chị ấy cũng hiểu được điều đó. \\nChị Mayami lập tức gật đầu thật sâu."
2313 = "Câu trả lời của chị Mayami là sự im lặng. \\nChị ấy chỉ gật đầu."
2316 = "Giọng điệu có chút bối rối của chị Mayami, \\nvà những sự thật mà tôi vừa được biết."
2318 = "Chị Mayami lắc đầu nguầy nguậy như thể đã kiệt sức."
2319 = "Ánh mắt chị Mayami trở nên dịu dàng hơn."
2321 = "Đối với Hachiroku cũng có tác dụng ở một mức độ nào đó. \\nCòn đối với Hibiki thì đó là một sự khích lệ vô cùng lớn."
2324 = "Cơ thể chị Mayami khẽ run lên. \\nBàn tay khẽ cử động một chút."
2325 = "Chị Mayami bừng sáng nụ cười rạng rỡ."
2328 = "Nói những điều hiển nhiên một cách hết sức tự nhiên, \\nchị Mayami nhún vai."
2329 = "Chị Mayami đang giơ tay. \\nKhi tôi hỏi có chuyện gì, chị ấy cất giọng đầy vẻ áy náy."
2330 = "Một giọng nói như thể đang bị dồn vào chân tường."
2331 = "Chị Mayami đang nói rằng, không phải là ăn theo sự nổi tiếng của chúng, \\nmà là muốn đối đầu trực diện."
2335 = "Nói rồi, chị Mayami đếm trên đầu ngón tay. \\nNào là thu hút các giải đấu thể thao, rồi đồng tổ chức lễ hội mùa hè với lễ hội nhạc rock."
2337 = "Một cái gật đầu lặng lẽ.\\nKhóe môi chị Mayami khẽ nhếch lên một chút."
2341 = "Quả thực là vậy. \\nDù “Migita Ichi” là độc nhất vô nhị ở địa phương, nhưng độ nổi tiếng trên toàn quốc lại thấp."
2347 = "Bút lông, mực, và cả giấy bán chỉ."
2348 = "Hachiroku, người biết về chiến tranh, \\ngật đầu đồng tình với vẻ mặt u ám."
2353 = "Nếu chị Mayami đã đồng ý tham gia, \\nthì tôi phải chuẩn bị một nền tảng tốt nhất có thể cho chị ấy."
2355 = "Bây giờ, có lẽ tôi đã có thể cảm nhận được điều đó một cách rất gần gũi."
2357 = "Và chị Mayami, chính là người hiểu rõ về Ohimitera và cuộc sống nơi đây \\nsâu sắc hơn bất kỳ ai."
2359 = "Nghe thấy tiếng em, khuôn mặt chị ấy thoáng vẻ nhẹ nhõm.\\nNhìn khuôn mặt ấy, chẳng hiểu sao em cũng thấy nhẹ nhõm theo."
2360 = "Người trong nhà chấm điểm cho nhau, rồi trao giải cho nhau, \\nthì không thể nào gọi là “đàng hoàng” được."
2363 = "Đó không phải là nâng cao chất lượng, mà là thay đổi chất lượng từ gốc rễ——\\nĐây là một ý tưởng như vậy, nhưng……"
2366 = "Hai trăm triệu yên, rủi mà không trả được,\\nthì rõ ràng sẽ giáng một đòn nặng nề lên cả chị Mayami và xưởng rượu Migitakazu."
2374 = "Vừa được hỏi, tôi liền nhận ra sự thiếu sót trong kế hoạch của mình."
2376 = "Tạo ra linh vật địa phương rồi cho ra tranh cử tổng tuyển cử, \\ntổ chức cuộc thi nấu ăn để tìm ra đặc sản mới——"
2379 = "Việc thay đổi hương vị của Migita Ichi \\nchẳng khác nào gây chiến với người dân địa phương——A."
2380 = "Nếu ông ta thực sự nghĩ rằng làm vậy sẽ thay đổi được Ohimitera, \\nthì Houshou Mototada——có lẽ còn ngu ngốc hơn tôi tưởng."
2382 = "Việc nhà máy được kêu gọi đầu tư cũng có nghĩa là…… \\nSẽ cướp đi công việc nấu rượu shochu của người này."
2385 = "“Tài nguyên của chúng ta” có thể được tận dụng nhiều hơn thế. \\nCó thể khai thác một cách triệt để."
2397 = "Chị ấy đang lo lắng cho tôi. \\nNgay khoảnh khắc cảm nhận được điều đó, tôi chợt nhận ra."
2413 = "Chỉ bấy nhiêu thôi cũng khiến tôi vui sướng, \\nvà lại cảm thấy hơi lâng lâng như say."
2414 = "Lần này, tôi không hề cảm thấy \\nnó nhỏ bé một chút nào."
2415 = "Khu vực \\x%lエアクラ;#00ffc040;Aircra%l;#; không thể hoạt động đã giúp Tuyến Yui tồn tại, \\nnhưng nếu nhìn từ giá trị của một địa điểm du lịch thì nó lại trở thành xiềng xích."
2417 = "Bàn tay ấy vẫn vậy, mềm mại đến đáng ngạc nhiên, nhưng——"
2419 = "Năm đó là đáy sâu nhất của thung lũng sụt giảm nghiêm trọng lượng khách lưu trú."
2420 = "Vì vậy, tôi tiếp tục nói. \\nDùng lý trí để che giấu cảm xúc là sở trường của tôi."
2424 = "Đang không hiểu có chuyện gì mà phải ngậm miệng lại,\\nthì trong sự tĩnh lặng ấy, lý do lập tức bắt đầu thì thầm."
2425 = "Nếu em hỏi chị ấy có rảnh không, chắc chắn chị ấy sẽ cố sắp xếp thời gian cho em.\\nĐó chính là con người của chị Mayami."
2429 = "Nếu hỏi Paulette thì có lẽ sẽ dễ dàng có câu trả lời, \\nnhưng tôi không muốn tạo thêm gánh nặng cho cô ấy, cũng không muốn có định kiến."
2430 = "Em vẫn còn nhớ lờ mờ về nó."
2431 = "Tôi cảm nhận sâu sắc sự thiếu hiểu biết của bản thân, \\nnhưng dù vậy, tôi cũng không thể không nói."
2432 = "Em vẫn luôn tự nhủ phải ghi nhớ kỹ điều đó,\\nnhưng chỉ riêng lần này thì…………đành chịu thôi."
2433 = "Tôi nghĩ bụng, đúng là tuyệt thật. \\nNhưng đồng thời cũng cảm thấy có chút gì đó trống rỗng."
2438 = "Thật đáng tiếc, trong việc ủ rượu, tôi——\\nchứ đừng nói đến Hibiki, cũng không thể giúp ích gì được cho chị Mayami."
2444 = "（Nếu nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; được xây dựng, thì một ngày nào đó——\\nNó cũng sẽ gây ra những ảnh hưởng chí mạng đến xưởng rượu Migitakazu.）"
2448 = "（Chỉ cần em nhờ vả, chắc chắn chị Mayami sẽ đáp ứng.\\nDù đó có là một lựa chọn đau khổ đến nhường nào đi chăng nữa——）"
2449 = "（Lách tách, lách tách——bục——lách tách）"
2452 = "（Bàn tay của chị Mayami…… \\nLại nhỏ bé và mềm mại đến thế này sao?）"
2455 = "（Đây là……lần bắt tay thứ hai nhỉ.）"

[selections]
