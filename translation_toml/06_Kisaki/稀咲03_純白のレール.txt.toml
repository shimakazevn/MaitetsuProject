[script]
71 = "——Rất nhiều tiếng chúc phúc vang lên, chiếc \\x%l8620;#00ffc040;8620%l;#; chạy xa dần về phía Kagoshima."
73 = "Một tiếng \\x%l汽笛;#00ffc040;còi hơi nước%l;#; của \\x%l8620;#00ffc040;8620%l;#; vang lên——"
76 = "Tiếng \\x%lブラスト;#00ffc040;khí thải xi lanh%l;#; xình, xịch, xình, xịch. \\x%l動輪;#00ffc040;Bánh xe chủ động%l;#; quay, chiếc \\x%l8620;#00ffc040;8620%l;#; chầm chậm bắt đầu rời khỏi sân ga."
77 = "Từ cửa sổ buồng lái, khuôn mặt của Hachiroku trong trạng thái \\x%l運転体;#00ffc040;cơ thể vận hành%l;#; ló ra."
1310 = "Hay nói đúng hơn——phải rồi, đây là nhà ga. Từ cửa sổ buồng lái, từ \\x%l客車;#00ffc040;toa hành khách%l;#;, vô số ánh mắt đang đổ dồn về phía chúng tôi."
1313 = "——Dù đã được Hibiki cảnh báo, vậy mà cho đến tận lúc này, tôi vẫn chưa nhận ra."
1315 = "Những đường ray tỏa sáng thuần khiết mà chưa ai từng chạy qua—— tôi và Kisaki, chắc chắn cả hai sẽ cùng nhau."
1316 = "——Có lẽ đã không kịp nữa rồi. ——Có lẽ, đã quá muộn rồi."
1326 = "……Chắc là sẽ như vậy thôi, tôi thầm nghĩ. Giống như Hibiki đang lo lắng và bắt chuyện với tôi lúc này."
1329 = "……Tiếng bước chân bước lên cầu thang, chẳng mấy chốc đã trở nên tĩnh lặng."
1332 = "「——Cho dù không được ở cùng ngài trong \\x%l運転台;#00ffc040;buồng lái%l;#;, thì em vẫn đang chạy cùng với ngài Soutetsu mà?」"
1335 = "「——Anh không muốn đón nhận một tương lai như thế. Anh chỉ nghĩ đến điều đó một cách sâu sắc thôi.」"
1337 = "「——Xin lỗi cậu. Tôi đến muộn.」"
1338 = "「——Tôi đã nghe Kisaki kể lại như vậy.」"
1349 = "「『Dù biết là vậy nhưng vẫn áp lực』, ra là cảm giác này sao.」"
1350 = "「『Để tiếp tục duy trì đường ray』, sao.」"
1351 = "「…………」"
1352 = "「……」"
1359 = "「……Nói tóm lại là, anh.」"
1362 = "「……Hôm nay làm đến đây thôi.」"
1366 = "「……Hô hô, không tệ. Nếu là cái này thì bên nhận cũng sẽ đồng ý thôi.」"
1369 = "「……Suy nghĩ, sao.」"
1373 = "「……Vậy sao.」"
1374 = "「……Sẽ tốn kém đấy, nhưng không phải là bất khả thi. May mắn là nó chưa bị phát triển thành khu dân cư.」"
1375 = "「……Cậu Soutetsu. Lát nữa chúng ta đi làm một ly chứ.」"
1623 = "「Mười ngàn đơ——ơ, hả? Vì mỗi cá nhân đầu tư một suất là từ 100.000 yên cơ mà…… vậy là 1 tỷ yên cơ á!?」"
1624 = "「Giai đoạn đầu thì chỉ có từ Đường sắt Ohito thôi. Nhưng chẳng bao lâu sau, Đường sắt Hisatsu Mikan cũng đã đăng ký tham gia.」"
1625 = "「Đừng cảm ơn em chứ. Khách sáo quá. Chúng ta là anh em mà, đúng không.」"
1627 = "「Cho dù là anh Urakami, hay bất cứ ai khác. Houshou Kisaki——tôi không muốn giao cô cho ai cả.」"
1629 = "「Tốt lắm, rất tốt.」"
1632 = "「Không, nhưng mà, cái đó.」"
1636 = "「Nói tóm lại là——tôi――――chuyện đó, tôi——」"
1637 = "「Nói cách khác, Công ty TNHH Đường sắt Hoàng gia không chỉ thu mua đường ray, mà còn tập hợp cả con người và kỹ thuật liên quan đến \\x%l保線;#00ffc040;bảo trì đường ray%l;#; nữa sao.」"
1643 = "「Cũng có khía cạnh đó. Dù sao thì, có Kisaki ở đó, mọi việc sẽ tiến triển rất trơn tru.」"
1644 = "「Có lẽ là vậy. Vì được nhìn thấy khuôn mặt của cô Kisaki mà.」"
1645 = "「Có lẽ là vậy.」"
1657 = "「Nóng nực gì chứ. Nguy hiểm thật đấy. Vừa quay lại Ohimitera là đã lơi lỏng rồi sao?」"
1658 = "「Kẻ như anh gì chứ. Anh là người phù hợp nhất đấy.」"
1659 = "「Hả? Ể? ……Nhẫn nhịn?」"
1661 = "「Vậy thì. Hôm nay tôi tập hợp mọi người lại đây là vì, nhờ hồng phúc của mọi người, quỹ My Rail kỳ 1 đã bán hết sạch.」"
1667 = "「Có lẽ việc tiếp cận thông tin của họ cũng bị chậm trễ tương ứng. Tuy nhiên…… ngay từ lúc bắt đầu huy động, chúng ta đã ghi rõ là theo thứ tự đăng ký rồi mà——」"
1669 = "「Nếu cứ giữ nguyên tình trạng hiện tại thì…… vâng. Hơi khó.」"
1673 = "「Khi \\x%l帝鉄;#00ffc040;Teitetsu%l;#; bán thanh lý, các nhà thầu trúng thầu với danh nghĩa tham gia dự án, rốt cuộc lại chia nhỏ ra để bán lại mất rồi.」"
1677 = "「Trong bất kỳ lĩnh vực nào, bản thân tôi cũng chẳng phát huy được kỹ năng hay trí tuệ gì to tát cả.」"
1679 = "「Tuy nhiên, chúng ta không thể hành động cho đến khi hoàn tất việc thu mua của kỳ 1 và chi trả cổ tức. Huy động quy mô lớn liên tục như vậy có thể làm tổn hại đến sự tín nhiệm.」"
1680 = "「Nhưng mà, khi gặp lại nhau. Quả nhiên em lại thích anh. Cảm giác đó, có chút gì đó không cam tâm.」"
1682 = "「Tuy nhiên, phần của kỳ 1 đã bán hết sạch rồi. Vì vậy, tôi muốn mượn trí tuệ của mọi người xem nên xử lý thế nào.」"
1685 = "「Nhưng——mọi chuyện lại không như vậy. Bởi vì người kia…… đã có người mình thích.」"
1689 = "「Anh có nghĩ rằng——từ nay về sau cũng muốn ở bên cạnh tiền bối Kisaki không?」"
1690 = "「Đường sắt, tài chính, hành chính. Ohimitera cũ và Ohimitera mới. Thậm chí cả công ty \\x%lエアクラ;#00ffc040;Aircra%l;#;——anh có một mạng lưới nhân mạch vô cùng mạnh mẽ.」"
1694 = "「Em có chuyện gì muốn nói với anh sao?」"
1702 = "「Tất nhiên là có rồi! Về mặt vận hành \\x%l列車;#00ffc040;đoàn tàu%l;#;, về mặt tiện lợi, về mặt cắt giảm chi phí, và cả về mặt phát triển khu vực nữa.」"
1711 = "「Hai điều?」"
1712 = "「Hachiroku, chị định nói chuyện đến bao giờ thế?」"
1717 = "「Và rồi, anh trai sẽ nhận ra. Hai điều, chắc chắn là vào lúc đó.」"
1719 = "「Kích thích sao?」"
1720 = "「Ra là vậy…… không phải trường hợp nào cũng giống như kỳ 1, chính quyền địa phương mua lại toàn bộ để làm đất làm đường nhỉ.」"
1738 = "「Chỉ đơn giản là có lợi trong công việc thôi. Những chuyện không vui cũng giảm đi đáng kể.」"
1740 = "「Không, nhưng mà. Chúng ta làm gì có kỹ thuật và nhân sự để làm việc đó.」"
1744 = "「Migita Soutetsu. Anh, thích tôi. Thích Houshou Kisaki, đúng không?」"
1750 = "「Fufu, anh Soutetsu.」"
1752 = "「Fufu, chúc mừng nhé, hai đứa.」"
1753 = "「Phù.」"
1754 = "「Hả?」"
1755 = "「Hả? Á!? Cổ họng.」"
1757 = "「Oa…… cái này tệ thật đấy. Phân mảnh một cách ngoạn mục luôn.」"
1758 = "「Oa.」"
1760 = "「Oa!? Anh Soutetsu? Có chuyện gì vậy, sao mặt mũi đáng sợ thế.」"
1762 = "「Oa——nhiều quá.」"
1764 = "「Trời ạ, em đúng là. Vậy thì, ngài Soutetsu.」"
1765 = "「Hả?」"
1767 = "「Ể? Ể——ể? Thế tức là——」"
1768 = "「Tôi hoàn toàn không nhúng tay vào chuyện hội sở hữu cổ phần đâu. Đó là do các hội viên tự bỏ phiếu quyết định nơi đầu tư mà.」"
1769 = "「Anh trai——」"
1772 = "「Anh trai và tiền bối Kisaki rất thân thiết. Vẫn cứ thân thiết như vậy, vẫn nghĩ rằng thế này là ổn rồi, và thời gian cứ thế trôi qua.」"
1773 = "「Quả nhiên là rất hợp nhau nhỉ. Anh trai và tiền bối Kisaki ấy.」"
1775 = "「Anh trai——lúc ở cùng tiền bối Kisaki, trông anh có vẻ rất vui nhỉ?」"
1776 = "「Ồ, Hibiki à.」"
1777 = "「À.」"
1779 = "「À…… không, chuyện đó.」"
1780 = "「À…… ừm.」"
1782 = "「A…… ừm. Đúng là vậy—— nhưng, tôi sẽ cố gắng xoay xở tìm nhân sự.」"
1784 = "「A…… ra vậy. Là chuyện về những người gửi thư đó nhỉ.」"
1786 = "「À…… ra là vậy.」"
1788 = "「A——…… quả nhiên, sẽ thành ra như vậy nhỉ. Vâng.」"
1789 = "「A——không ạ. Ừm…… Em, có một người bạn. Một cô gái bằng tuổi ở học viện.」"
1791 = "「A.」"
1792 = "「A!」"
1793 = "「A! Lâu rồi không gặp, anh đến thật này.」"
1797 = "「A! Ừm, đúng là vậy. Sẽ có cả \\x%l列車;#00ffc040;đoàn tàu%l;#; của các công ty khác chạy qua nữa, nên nếu để họ quản lý toàn tuyến với cùng một chất lượng và phương pháp thì sẽ tốt hơn.」"
1799 = "「A, anh trai.」"
1800 = "「À, ừm.」"
1801 = "「A, vâng.」"
1804 = "「A——xin lỗi cô. Vì nóng quá.」"
1805 = "「A, xin lỗi cô. Lại để cô phải làm đến mức này.」"
1806 = "「À, không.」"
1809 = "「À…… không lẽ, là đơn đăng ký sao?」"
1810 = "「Này, cổ áo xộc xệch quá kìa.」"
1813 = "「Alo, tôi đây. Cho tôi xin chút thời gian được không?」"
1815 = "「À, tôi đây. Sắp xếp cho tôi một cuộc hẹn với nhà phân tích Nogami đi.」"
1818 = "「Anh thích em. Anh——thích em, Houshou Kisaki.」"
1819 = "「Thích.」"
1820 = "「Ư ư ư~ Dù hơi tiếc, nhưng mà, chúc mừng hai người ạ.」"
1821 = "「Ưm——fufu, cuối cùng cũng chịu nói! Bắt anh phải nói ra! Em đã phải nhẫn nhịn vất vả lắm đấy. Suýt chút nữa là em đã nói ra trước mất rồi.」"
1823 = "「Hừm.」"
1824 = "「Ừm…… phải rồi. Không hẳn là cảm giác mới mẻ…… mà nếu phải ví von thì, giống như giúp não bộ tăng tốc độ xử lý vậy.」"
1827 = "「Ưm…… Kisaki, sao vậy? Em muốn nói gì à.」"
1829 = "「Ừm. Hẹn gặp lại sau nhé.」"
1830 = "「Ừ. Có vẻ như những người lớn tuổi mong muốn đường sắt hồi sinh rất nhiều nhỉ. Không ngờ thời đại này rồi mà vẫn còn nhiều đơn đăng ký gửi qua đường bưu điện đến vậy.」"
1832 = "「À.」"
1833 = "「Ừm!」"
1835 = "「Ừm, tôi cũng sẽ cố gắng hết sức để chuẩn bị cho buổi họp báo.」"
1836 = "「Ừm, ngủ ngon nhé. Hibiki.」"
1837 = "「Vâng. Có ạ. Dạ——này, anh trai.」"
1839 = "「Hừm?」"
1840 = "「Fufu.」"
1842 = "「Fufu. Tôi là một cấp trên đáng tin cậy đến vậy sao? Thôi được rồi. Nào——đưa đây.」"
1843 = "「Fufu, cảm ơn anh. Dù tôi nghĩ Urakami chắc cũng nhận ra rồi.」"
1845 = "「À.」"
1847 = "「Vì tôi có cảm giác chúng ta có thể khai thác được nhân mạch đường sắt từ đây mà. Nếu có thể, tôi muốn gửi cho họ một câu trả lời mang tính tích cực.」"
1855 = "「Anh hai, ngầu lắm á!」"
1857 = "「Có lẽ là nhờ ảnh hưởng đó chăng? Một thời gian ngắn sau, những lá đơn đăng ký gửi qua đường bưu điện từ các bên liên quan đến đường sắt đã đổ về dồn dập.」"
1859 = "「Đánh giá quá cao rồi. Nhưng được cấp trên cũ đánh giá cao như vậy, tôi thực sự rất biết ơn.」"
1862 = "「Nếu anh tìm thấy câu trả lời…… thì sau này cũng được, hãy nói cho em nghe nhé, câu trả lời đó.」"
1871 = "「Xin lỗi cô. Lúc nào cũng làm phiền cô thế này.」"
1872 = "「Xin lỗi em, Hibiki. Cảm ơn em.」"
1873 = "「À, tôi cũng phải——」"
1874 = "「À này, Thị trưởng Paulette, chẳng phải ngài đang đau đầu sao. Về việc \\x%l保線;#00ffc040;bảo trì đường ray%l;#; đoạn Ohimitera - Kagoshima ấy ạ.」"
1876 = "「Có thể làm tài liệu tham khảo sao? Câu trả lời của một kẻ chẳng biết gì về tình yêu như anh.」"
1877 = "「Đúng vậy, nhẫn nhịn. Em cũng có sự bướng bỉnh và sĩ diện của riêng mình chứ. Dù nó thực sự là một thứ ngớ ngẩn——」"
1881 = "「Hồi nhỏ. Anh chẳng hề thèm để mắt đến em. Vì thế, em đã rất ghét anh.」"
1882 = "「『Đợt huy động bổ sung kỳ 1; Tuyến đường đang hoạt động của Công ty CP Đường sắt Ohito・Đoạn Ohimitera - Yunoi』 sao ạ.」"
1884 = "「Đúng đó! Thay vì mở miệng thì hãy động tay đi, lúc nàaaaao Hachiroku cũng nói vậy mà.」"
1886 = "「Đúng vậy, anh hãy tự mình, trăn trở thật nhiều thật nhiều đi.」"
1889 = "「Cảm giác như được thúc đẩy từ phía sau sao?」"
1891 = "「Là vậy đó. Hãy giữ bí mật nhé.」"
1893 = "「Dù biết là vậy nhưng vẫn áp lực. Một kẻ như tôi, lại là đại diện của công ty TNHH sao.」"
1895 = "「Cô bạn đó cứ tự nhiên nghĩ rằng họ sẽ luôn ở bên nhau. Hợp nhau đến thế cơ mà, chắc chắn, sẽ mãi mãi ở bên nhau.」"
1899 = "「Công ty TNHH Đường sắt Hoàng gia, sao.」"
1906 = "「Của Đường sắt Ohito…… đoạn Ohimitera - Yunoi sao?」"
1908 = "「Áp đảo nhất là đoạn Ohimitera - Yatsushiro. Nếu có thể khôi phục tuyến đường này, nó sẽ tạo thành một tuyến đường vòng tròn với tuyến đường của Đường sắt Mikan.」"
1911 = "「Có chuyện gì sao? Anh trai.」"
1917 = "「Chúc mừng hai người. Cuối cùng cũng thành đôi rồi nhỉ. Dù là chuyện của người khác, nhưng tôi cũng đã phải thấp thỏm lo âu đấy.」"
1918 = "「Xin chúc mừng hai người. Tuần trăng mật, tôi đề xuất một chuyến đi bằng \\x%l列車;#00ffc040;tàu%l;#; nhé?」"
1923 = "「Em nhất định sẽ đưa những vị khách đang ngồi kín chỗ này, cùng với những nụ cười, đến tận Kagoshima.」"
1925 = "「Tôi cũng nghĩ vậy. Nhưng mà…… chi phí thì, ừm——có lẽ sẽ gấp mấy lần kỳ 1——」"
1928 = "「Bây giờ tôi mới nhận ra. Không, có lẽ tôi đã nhận ra từ lâu rồi—— nhưng bây giờ, nhìn cô và anh Urakami, tôi mới thực sự hiểu.」"
1930 = "「Từ rất lâu trước khi anh bắt đầu thích em. Anh Soutetsu, anh biết không? Em đã thích anh rồi đấy.」"
1932 = "「Cho anh một miếng nhé.」"
1934 = "「Tôi và…… Urakami?」"
1936 = "「Tôi muốn, Kisaki. Cô hãy luôn ở bên cạnh tôi. Và, điều này, có lẽ——đây chính là, tình yêu của tôi.」"
1938 = "「Anh, làm sao?」"
1940 = "「Em muốn dùng nó làm tài liệu tham khảo cho sau này. Cả em nữa——cái đó, cũng có hứng thú với tình yêu mà.」"
1943 = "「Chắc chắn, trong số những người nộp đơn qua thư này, cũng sẽ có những người từng là kỹ thuật viên \\x%l保線;#00ffc040;bảo trì đường ray%l;#; đúng không ạ?」"
1946 = "「Tôi hiểu rồi. Nhưng mà, tôi cũng không muốn bắt họ phải chờ đợi lâu cho đến đợt huy động kỳ 2, hay từ chối họ một cách \\x%l無碍;#00ffc040;phũ phàng%l;#; đâu.」"
1947 = "「Anh sẽ suy nghĩ. Và chắc chắn, anh cũng sẽ truyền đạt câu trả lời cho em.」"
1949 = "「Hạt giống tình đầu của em, còn chưa kịp tỏ tình đã bị bóp nát mất rồi. Thế nên, em chẳng biết một chút gì về tình yêu đâu.」"
1950 = "「Vì là dự án có liên quan đến anh Urakami nên mọi người mới nhất trí đầu tư đấy. Vâng, Houshou bên tôi đã——」"
1951 = "「Em nghĩ rằng, để công ty của ngài Soutetsu tiến hành bảo trì và quản lý đường ray theo cách này thì sẽ không có gì sai sót đâu ạ.」"
1952 = "「Tôi nghĩ điều đó có tác động cực kỳ lớn. Thực tế là, trong giai đoạn đầu tiên của đợt đăng ký trực tuyến, hầu hết đều đến từ các tổ chức tài chính.」"
1956 = "「Thế nên…… em mới nhẫn nhịn sao?」"
1957 = "「Về chuyện đó thì——ngài nghĩ sao nếu dùng số tiền đó để mua lại toàn bộ đường ray của Đường sắt Ohito ạ?」"
1960 = "「Chính vì thế mới có thể làm tài liệu tham khảo được. Bởi vì em cũng, chẳng biết gì về tình yêu cả.」"
1963 = "「Chính vì thế. Công ty của ngài Soutetsu sẽ mua lại 『toàn bộ đường ray thuộc sở hữu của Đường sắt Ohito』 ạ.」"
1965 = "「Vì thế, em đồng ý. Hãy ở bên nhau nhé. Từ nay về sau, mãi mãi, mãi mãi nhé!」"
1966 = "「Chính vì vậy, ngài Soutetsu cũng」"
1969 = "「Xin lỗi, cô Kisaki. Cho tôi xin chút thời gian được không?」"
1974 = "「Đúng vậy nhỉ. Anh sẽ suy nghĩ thật kỹ.」"
1978 = "「Đúng vậy, rất vui. Lời nói của cô ấy là một sự kích thích tốt.」"
1979 = "「Đúng vậy, anh Soutetsu. Tất nhiên em cũng sẽ, đồng hành cùng anh chứ?」"
1980 = "「Đúng vậy, anh Soutetsu. Sắp đến giờ rồi.」"
1981 = "「À, quả nhiên là rất khó khăn sao?」"
1982 = "「Vâng ạ.」"
1984 = "「Ra là vậy sao. Nếu thế thì tôi sẽ ghi nhớ điều đó.」"
1993 = "「Nhanh hơn dự đoán khá nhiều đấy. Việc công ty \\x%lエアクラ;#00ffc040;Aircra%l;#; tham gia với tư cách pháp nhân và cả hội sở hữu cổ phần nữa. Sự tham gia của cả hai bên đã khiến quỹ thu hút được sự chú ý chăng?」"
1995 = "「Không——tôi chỉ đang cảm thấy hơi tiếc nuối khi phải tiễn em đi trong ngày vui này thôi.」"
1996 = "「Không có ý kiến.」"
1997 = "「Chính xác là vậy ạ.」"
1998 = "「Đúng vậy, nhẫn nhịn. Muốn anh phải là người nói ra trước, nên em đã luôn chờ đợi.」"
1999 = "「Không đâu, anh đã liên lạc trước rồi mà. Cất công từ Sendai đến tận đây, tôi mới là người phải xin lỗi.」"
2006 = "「Cô thấy sao, Paulette.」"
2012 = "「Với cô đấy, Kisaki.」"
2013 = "「Để truyền đạt mong muốn của chúng ta, ước mơ của chúng ta, đến với nhiều người hơn nữa. Dù chỉ một chút.」"
2017 = "「Và chắc chắn, ngay khoảnh khắc đó. Anh trai cũng sẽ nhận ra.」"
2018 = "「Và chắc chắn, ngay khoảnh khắc đó. Anh trai cũng sẽ nhận ra. Rằng bản thân mình cũng đã biết yêu——nhưng, không thể nói ra được nữa rồi.」"
2019 = "「Thế nhưng, tiền bối Kisaki lại ngày càng trầm tư nhiều hơn. Trông có vẻ buồn bã khiến anh lo lắng, vì thế, anh đã lên tiếng hỏi han.」"
2023 = "「Tạo thành đường vòng tròn thì có lợi ích gì sao?」"
2025 = "「Nếu dùng cách ví von của các anh thì là 『bánh xe chủ động đã bắt đầu quay rồi』 đúng không? Giờ không còn dừng lại được nữa đâu.」"
2027 = "「Tất nhiên là em biết chứ? ……Dù nói vậy, nhưng hồi làm chung ở ngân hàng thì em cũng không nhận ra đâu.」"
2028 = "「Tất nhiên rồi, chuyện gì vậy?」"
2029 = "「Anh sẽ cố gắng hết sức cho buổi thuyết trình.」"
2031 = "「Đúng là được tóm tắt rất tốt. Không chỉ không có cảm giác bị ép buộc…… mà còn thấy rất hào hứng nữa.」"
2034 = "「Tôi hiểu rồi. Tôi sẽ liên lạc ngay.」"
2038 = "「Cảm ơn anh rất nhiều về quỹ My Rail kỳ 1. Nhờ có hội sở hữu cổ phần nhân viên của Aircra Hinomoto mà——」"
2042 = "「Kisaki——」"
2044 = "「Kisaki.」"
2050 = "「Chi tiết cụ thể thì từ giờ sẽ kiểm tra kỹ lưỡng và chốt lại sau—— Anh thấy sao, anh Soutetsu. Một bản giải trình huy động vốn mang cảm giác thế này.」"
2051 = "「Và rồi một ngày nào đó, người đó sẽ xuất hiện. Một người có thể trò chuyện vui vẻ với tiền bối Kisaki hơn cả anh.」"
2057 = "「Cô có thể hỏi xin lịch trình của ông Mototada được không? À, cả của anh Urakami nữa.」"
2058 = "「Được ngài cảm thấy tiếc nuối là một vinh dự đối với em——」"
2064 = "「Cuộc họp kéo dài quá.」"
2066 = "「Nếu không có ý kiến phản đối, tôi muốn tiếp tục đi sâu vào chi tiết với phương án huy động bổ sung kỳ 1 này.」"
2068 = "「Giả sử mở đợt huy động kỳ 2, thì địa điểm ứng cử là ở đâu?」"
2072 = "「Cảm ơn mọi người.」"
2073 = "「Cứ để cậu hiểu lầm mãi thì cũng không hay. Xin vài giây thôi được không?」"
2093 = "「Chuyện đó…… sao nhỉ. Anh chưa quen với việc suy nghĩ về tương lai.」"
2094 = "「Cái này…… có lẽ sẽ trở thành một mô hình kinh doanh mới đấy. Nói cách khác, có thể sẽ có những người đi sau bắt chước và tham gia ở khắp nơi trên đất Hinomoto.」"
2095 = "「Không phải đáng sợ. Đây là vẻ mặt nghiêm túc đấy.」"
2096 = "「Chỗ này…… khoảng bao nhiêu vậy?」"
2097 = "「Bởi vì câu trả lời đó, chỉ có anh trai mới có thể tìm ra được thôi.」"
2098 = "「Đau đầu thật đấy, vì đã bán hết sạch ngay lập tức rồi. Quỹ MRF kỳ 1: Quỹ khôi phục tuyến Ohimitera - Kagoshima ấy.」"
2099 = "「Bởi vì đây là tuyến đường mà ngài Soutetsu đã khôi phục lại mà. Nếu không có nó, ngày hôm nay đã không bao giờ đến.」"
2100 = "「Chuyện đó thì tôi biết quá rõ rồi. Nhưng mà——」"
2101 = "「Chuyện đó thì đương nhiên rồi. Ơ——cậu sao vậy? Cậu Soutetsu.」"
2102 = "「Sự khôi phục các tuyến đường ở các khu vực sẽ được đẩy nhanh, và sức mạnh tổng hợp của ngành đường sắt cũng sẽ hồi sinh. Khi đó, một cuộc cạnh tranh lành mạnh sẽ nổ ra, và toàn ngành sẽ được tái cơ cấu.」"
2103 = "「Thế là đủ rồi. Nhờ ai trong tình huống nào. Người lãnh đạo chỉ cần không nhầm lẫn điều đó là được.」"
2104 = "「Ra là vậy. Những người 『từng là』——đúng thế nhỉ, những chuyên gia thất nghiệp do Đại bãi bỏ tuyến chắc chắn bị chôn vùi nhiều như núi.」"
2105 = "「À.」"
2106 = "「Thế là xong. Đừng có lơ đễnh nữa đấy nhé? Thật tình.」"
2107 = "「Tôi vẫn chưa kiểm tra kỹ, nhưng có hơn mười ngàn đơn đấy.」"
2109 = "「Nào…… nếu mỗi người một suất là 1 tỷ, trung bình mỗi người năm suất thì sẽ là 5 tỷ tiền vốn, sao.」"
2111 = "「Vậy thì, anh hãy thử tưởng tượng xem.」"
2113 = "「Cô bạn đó cũng có một người rất hợp với mình. Một người luôn lắng nghe, và thúc đẩy cô ấy từ phía sau.」"
2116 = "「Vậy thì, hãy thực hành thử xem nào? Đống này——chúng ta phải làm sao đây.」"
2118 = "「Vậy thì, chúng ta sẽ tiến hành theo hướng đó. Cảm ơn trí tuệ và thời gian của mọi người.」"
2120 = "「Nếu được thế thì đúng như mong muốn rồi.」"
2122 = "「Nếu vậy, anh nên suy nghĩ đi thì hơn? Phải làm sao để chuyện đó không xảy ra.」"
2123 = "「Vậy thì, đợt huy động kỳ 2 sẽ lấy việc khôi phục tuyến đường đó làm mục tiêu quyết định nhé.」"
2125 = "「Nếu vậy thì, với chuyện gì. Mà anh Soutetsu lại trở nên nghiêm túc đến vậy?」"
2126 = "「Vậy thì, chúc ngủ ngon. Anh trai.」"
2128 = "「Các tổ chức tài chính…… Không có sự đầu tư nào từ các bên liên quan đến đường sắt sao ạ?」"
2134 = "「Anh hai, tiền bối Kisaki! Chúc mừng hai người——!」"
2135 = "「Dù anh không biết tình yêu là gì——」"
2136 = "「Tôi nghĩ việc chia nhỏ đến mức này cũng là trường hợp hiếm gặp thôi ……nhưng cả thời gian lẫn chi phí, có lẽ sẽ gấp mấy lần kỳ 1——」"
2137 = "「Anh Soutetsu và chị Kisaki, sắp kết hôn rồi đúng không ạ! Thật sự, xin chúc mừng hai người nha!」"
2138 = "「Cậu Soutetsu, về những chi tiết cụ thể thì」"
2139 = "「Ngài Soutetsu, xin chúc mừng ngài!」"
2140 = "「Ngài sao vậy, ngài Soutetsu?」"
2141 = "「Anh đang nói lời yếu đuối gì vậy, anh Soutetsu.」"
2142 = "「Giao phó một cách chính xác. Đưa ra quyết định vì điều đó. Và chịu trách nhiệm. Nếu can thiệp sâu hơn thế, ngược lại sẽ chỉ gây ra sự hỗn loạn thôi.」"
2145 = "「Chút phiền phức này thì có sao đâu. Dù sao thì cũng là quan hệ giữa tôi và anh mà.」"
2146 = "「!」"
2147 = "「!!?」"
2319 = "Không chỉ vì nghĩ rằng nói vậy sẽ tàn nhẫn với người bạn đó, mà còn có thứ gì đó gợn gợn đang bóp nghẹt cuống họng tôi."
2321 = "Không phải, ông Mototada không phải là người của \"bên tôi\"—— tức là một thành viên của Công ty TNHH Đường sắt Hoàng gia."
2323 = "Nói rồi, em ấy im lặng."
2325 = "Dù Hachiroku có hiểu điều đó hay không, chắc chắn em ấy cũng sẽ cùng hành khách tạo nên một chuyến đi tuyệt vời nhất."
2327 = "Chỉ cần vậy thôi, chúng tôi đã có thể thấu hiểu nhau."
2336 = "Ánh mắt Hibiki rất nghiêm túc—— hay nói đúng hơn, tôi thậm chí còn cảm nhận được sự níu kéo."
2338 = "Dù vậy, tôi đã nhận thức được một cách rõ ràng. Nếu thế, tôi chỉ muốn truyền đạt cảm xúc này."
2341 = "Tuy nhiên, Paulette lại im lặng chìm vào suy tư, ông Mototada cũng khoanh tay, cau mày nghiêm nghị."
2343 = "Thế nhưng lúc này, vẫn còn quá sớm để chìm đắm trong điều đó."
2345 = "Nhưng mà, đau thật. Cảm giác như trái tim bị đầu kim đâm trúng…… một cơn đau nhẹ nhàng nhưng rất chân thực."
2349 = "Chỉ một câu ngắn gọn, nhưng đã thể hiện được bản chất sự nghiệp của chúng tôi, của Công ty TNHH Đường sắt Hoàng gia."
2358 = "Giọng nói đầu tiên cất lên là của ông Mototada. Ngay sau đó, những tiếng \"Không có ý kiến\" lấp đầy căn phòng."
2362 = "Chỉ mới tưởng tượng thôi mà đã đau đớn đến nhường này. Nếu nói ra, chắc chắn cũng sẽ khiến Kisaki phải chịu nỗi đau tương tự."
2366 = "Trải bản đồ lên bàn, Hachiroku mượn bút từ Kisaki."
2377 = "Công ty TNHH Đường sắt Hoàng gia mới thành lập, không có cả kỹ thuật lẫn nhân sự để \\x%l保線;#00ffc040;bảo trì đường ray%l;#; đã được khôi phục."
2383 = "Thế nhưng, tôi lại phớt lờ nó đi. Chắc chắn là vì sợ hãi việc sẽ đánh mất, sẽ phá vỡ."
2385 = "Chiếc bàn làm việc từng là của anh Urakami, giờ đây lại thuộc về tôi. ——Trong một khoảng thời gian ngắn như vậy, thực sự đã có rất nhiều thứ thay đổi."
2390 = "Khát nước quá. Chắc do làm việc quá sức nên lưng cũng đau nhức."
2393 = "Chẳng cần đợi lâu, máy in bắt đầu nhả giấy ra. Với một cử chỉ hết sức tự nhiên, anh Urakami liền gom chúng lại."
2397 = "Nếu sự nghiệp của chúng tôi thành công, nó sẽ trở thành thanh \\x%l枕木;#00ffc040;tà vẹt đường ray%l;#; đầu tiên, đánh thức những người tiếp bước, cùng với sự cạnh tranh và phát triển."
2399 = "Chỉ cần một câu này là đủ. Và tôi cũng hiểu ra tại sao, mình lại không thể nói ra được câu đó."
2402 = "Nếu có Kisaki, đợt huy động kỳ 2 và cả những đợt tiếp theo nữa, chắc chắn sẽ thành công."
2413 = "À, không, ra là vậy. Dù ở đây chỉ có hai chúng tôi, nhưng Hibiki lại gọi tôi là——"
2421 = "Hừm? Cảm thấy sảng khoái tức là, trước đó tôi đã có gì đó vướng bận trong lòng…… sao? Nhưng mà, tại sao——"
2423 = "Bởi vì mỗi ngày đều quá bận rộn, bởi vì khoảng cách quá đỗi gần gũi. Nói gì cũng hiểu nhau ngay lập tức, cảm giác đó quá đỗi dễ chịu."
2425 = "Lời thuyết phục đầy cảm xúc của Paulette đã khiến ngay cả ông Mototada cũng phải rướn người về phía trước."
2429 = "Tiếng vỗ tay. Bế mạc. Đồng thời, mọi người bắt đầu tản ra."
2431 = "Phải làm sao đây…… một sự im lặng nặng nề bao trùm."
2434 = "Từ buồng lái, và từ cửa sổ của \\x%l客車;#00ffc040;toa hành khách%l;#;——"
2437 = "Một nụ hôn nữa. Lần này, chỉ là một cái chạm môi sượt qua."
2439 = "Khuôn mặt ngơ ngác. Không…… có chút sợ hãi xen lẫn trong đó chăng?"
2441 = "Em ấy bật cười ha hả. Hoàn toàn không chút gượng ép, vô cùng nhẹ nhõm."
2442 = "Gợi ý thì tôi đã nhận được rồi. Vậy thì trước tiên hãy thử thực hành nó xem sao."
2445 = "Cốc sữa trên tay Hibiki phát ra tiếng lạch cạch nhỏ."
2446 = "Trong tài liệu mà Paulette đưa ra, có liệt kê danh sách các chủ đất của đoạn đường cần khôi phục."
2448 = "Dù đã được bảo phải suy nghĩ, dù đã suy nghĩ, nhưng nếu chỉ dùng lý trí, thì chẳng thể nào chạm đến được câu trả lời."
2451 = "Với đôi mắt ươn ướt như sắp khóc, em ấy không hề hối thúc, chỉ lặng lẽ nhìn tôi."
2452 = "Nghe đến đây, cuối cùng tôi cũng có cảm giác mọi thứ đã được xâu chuỗi lại."
2454 = "So với lúc chỉnh cà vạt cho anh Urakami, Kisaki đang nép sát cơ thể vào tôi——nhiều hơn thế nữa."
2456 = "Đúng như liên lạc trước khi xuất phát, anh ấy đến trễ 14 phút."
2461 = "Đúng rồi, hôm nay anh Urakami cũng sẽ lại từ Sendai đến đây. Tôi cũng phải đi chào hỏi mới được——!"
2471 = "Như thể để xốc lại tinh thần, em ấy bước một bước thật dài."
2478 = "Công ty TNHH Đường sắt Hoàng gia——Teikoku Railroad LLC."
2482 = "Tiến lại gần theo tiếng gọi, một bàn tay nhỏ bé vươn ra từ cửa sổ, nhẹ nhàng chạm vào tóc tôi."
2484 = "Việc nhận được sự tham gia từ họ, đã thu hút sự chú ý sâu sắc của những người trong ngành đường sắt đối với quỹ."
2496 = "Kisaki đang mỉm cười, trông thật đáng yêu."
2502 = "Cô gái này, lại đáng yêu đến nhường này, kẻ ngốc nghếch như tôi, đến tận bây giờ mới nhận ra."
2505 = "Ngay khoảnh khắc cảm nhận được hơi thở của Kisaki, nhịp thở của tôi trở lại bình thường."
2507 = "Tôi không thể tìm được từ ngữ thích hợp. Hibiki vẫn đang chăm chú nhìn tôi."
2509 = "Lời Kisaki thường xuyên nhắc đến—— tôi gật đầu trước câu nói mà đôi tai mình đã hoàn toàn quen thuộc."
2513 = "Khôi phục tuyến đường thành công, nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; quyết định chuyển đến Sendai. Chuyến \\x%l列車;#00ffc040;tàu%l;#; du lịch đoạn Ohimitera - Kagoshima bắt đầu lăn bánh."
2515 = "Chúng tôi gần gũi đến thế, vậy mà câu nói thích nhau, chỉ điều đó thôi——lại mãi chẳng thể thốt nên lời."
2518 = "Đến tận bây giờ tôi mới cảm nhận sâu sắc được sự tuyệt vời của hệ thống dẫn đường \\x%lエアクラ;#00ffc040;Aircra%l;#;, thứ có thể đọc thấu hoàn toàn tình hình giao thông."
2522 = "Tôi vừa cúi đầu xuống, thì một giọng nói đã vang lên trước cả khi tôi kịp ngẩng đầu lên."
2523 = "\"Nếu là Kisaki thì cô sẽ làm thế nào\"——câu nói đã trực chờ trên đầu lưỡi, nhưng tôi lại nuốt nó xuống cổ họng."
2524 = "Có lẽ là vậy thật. Tôi thành thật nghĩ thế."
2527 = "Vừa cắn miếng bánh quy, tôi vừa ngồi xuống đối diện Hibiki."
2529 = "Cố gắng tìm kiếm từ ngữ…… rốt cuộc lại quay về với câu nói đó."
2531 = "Đang định suy nghĩ về ý nghĩa của hành động đó, tôi lại tự nhủ rằng điều cần nghĩ lúc này chỉ có một mà thôi."
2532 = "Rõ ràng là tôi định nói thẳng cảm xúc của mình ra bằng lời, vậy mà cứ có cảm giác hoàn toàn không đủ, thật bực mình."
2535 = "Nhói một cái——tôi cảm thấy một cơn đau nhẹ. Nếu là nhồi máu cơ tim thì chắc chắn không chỉ dừng ở mức này đâu."
2536 = "Cảm nhận được ánh nhìn, tôi quay lại thì thấy Hibiki đang chằm chằm nhìn mình. Dường như——em ấy muốn nói điều gì đó."
2539 = "Nắm lấy tay Kisaki, tôi bước đi."
2541 = "Tôi cảm thấy một cơn đau như bị kim đâm vào tim."
2542 = "Cuối cùng, tôi cũng hiểu."
2544 = "Cho đến nay tôi chưa từng nghĩ nhiều về mức độ hòa hợp, nhưng khi được nhắc đến, quả thực tôi rất hợp nói chuyện với Kisaki."
2547 = "Lưỡi tôi líu lại. Hơi thở trở nên khó khăn. Lúc đó, Hibiki đã dạy tôi thế nào nhỉ?"
2551 = "Bị giục, tôi quay lưng về phía \\x%l列車;#00ffc040;đoàn tàu%l;#;."
2553 = "Tôi cảm nhận được sức nóng chân thực trong giọng điệu ấy."
2557 = "Ngay cả sức lực để đi tắm cũng không còn. Chỉ uống chút nước rồi——hửm?"
2558 = "Tôi cứ ngỡ em ấy sẽ quay lại, nhưng quả nhiên, Hibiki vẫn quay lưng về phía tôi."
2560 = "Trả lời một cách bâng quơ, nhưng tôi lại cảm thấy có gì đó sai sai."
2561 = "Là đang xấu hổ với ai, vì điều gì—— tuy trong lòng bối rối, nhưng tôi vẫn không dừng lời."
2562 = "Nhìn theo ánh mắt của Hachiroku, nơi đó là một đường ray trải dài thẳng tắp——"
2565 = "Do đó, về vấn đề này, chúng tôi đã thảo luận với Công ty Cổ phần Đường sắt Ohito để nhờ họ nhận thầu công việc——"
2567 = "Ôm một chồng bưu phẩm, Kisaki bước vào phòng."
2575 = "Dọn dẹp đĩa bánh quy và cốc sữa gần như chưa đụng đến, em ấy định nhanh chóng rời khỏi phòng khách."
2577 = "Khẩu hiệu được đính kèm với đợt huy động vốn."
2581 = "Khi các chuyên gia ở những lĩnh vực khác nhau cùng chung một ý kiến, thì tôi chẳng có lý do gì để phản đối cả."
2582 = "Vì đã hiểu điều đó, nên không còn chần chừ gì nữa."
2584 = "Việc anh Urakami chuyển cơ sở hoạt động đến Sendai, có nghĩa là Sendai đã trở thành ứng cử viên sáng giá nhất cho việc thu hút nhà máy."
2587 = "Nếu có thể giấu nhẹm chuyện đó với Kisaki suốt ngần ấy thời gian, thì việc tôi không nhận ra màn giả nam của anh Urakami cũng là điều khó tránh khỏi."
2610 = "Đánh ực một cái, Hibiki uống cạn cốc sữa trong một hơi."
2613 = "Nếu vậy thì Hibiki đang muốn nói một chuyện rất quan trọng. Bất cứ câu hỏi nào lúc này cũng sẽ chỉ làm gián đoạn câu chuyện."
2615 = "Đôi vai của Hibiki khẽ giật mình——một cái."
2617 = "Hibiki cho đến tận phút cuối cùng, vẫn liên tục gọi tôi là anh trai. Em ấy nhất quyết không cho tôi thấy một Hibiki của ngày thường, một Hibiki với khuôn mặt thật."
2619 = "Nhìn núi bưu phẩm lấp đầy không biết bao nhiêu là thùng các tông, Hibiki tròn xoe mắt ngạc nhiên."
2621 = "Chính Hibiki đó."
2623 = "Vẫn quay lưng về phía tôi, bước chân của Hibiki chợt khựng lại."
2624 = "Một tiếng thở hắt ra nhè nhẹ."
2627 = "Ánh mắt của Hibiki xuyên thấu tôi. Trực diện, không một chút do dự, đến mức khiến tôi phải chùn bước."
2628 = "Hai tay ôm trọn cốc sữa, nhưng em ấy không hề đưa lên miệng."
2630 = "Trước mặt Hibiki là một cốc sữa và một đĩa bánh quy. Nếu vậy, có lẽ em ấy đã đợi tôi xuống."
2632 = "Bất kỳ nhân viên nào của Aircra Hinomoto cũng hiểu được sự thật đó, và có vẻ như điều này đã làm tăng thêm sự tin tưởng của hội sở hữu cổ phần đối với quỹ My Rail."
2635 = "Rõ ràng chỉ là chuyện giả định, nhưng những mũi kim đâm vào tim tôi lại đột ngột tăng lên."
2637 = "Nếu không nói ra, sẽ không thể truyền đạt được. Chắc chắn, càng là những chuyện quan trọng thì càng như vậy."
2640 = "Quả nhiên là vậy. \"Anh trai\"."
2650 = "Sau một khoảng lặng như đang do dự, cổ họng của Hibiki dù chưa uống ngụm nào vẫn kêu cái 'ực'."
2651 = "Không có yết hầu. Nói cách khác, anh Urakami không phải là nam giới——"
2660 = "Không hổ danh là thị trưởng, hay phải nói là có mối liên hệ mật thiết với chính quyền nhỉ."
2661 = "Paulette và ông Mototada."
2662 = "Tiếng gọi của Paulette. Mặc dù lo lắng cho tình trạng của Hibiki, nhưng lúc này tôi phải chuyển đổi tâm trạng."
2663 = "Nghe tôi hỏi, cô ấy cười gượng. Đây là…… vẻ mặt của người đang cố quá sức rồi."
2664 = "Tôi vừa gợi chuyện, Paulette liền đứng bật dậy như thể đã chờ đợi từ lâu."
2686 = "Khẽ vỗ tay cái bộp, anh Urakami gọi tôi lại gần và thì thầm vào tai."
2687 = "Nét mặt anh Urakami rạng rỡ hẳn lên trông thấy."
2688 = "Anh Urakami, có vẻ như thực sự đang chúc phúc cho chúng tôi từ tận đáy lòng……"
2689 = "Anh Urakami tỏ vẻ vô cùng áy náy, ngồi ghé xuống mép ghế sofa."
2690 = "Anh Urakami nới lỏng cà vạt như thể giấu mình vào cơ thể tôi, rồi chỉ vào vùng cổ họng như muốn nói 'đây này, đây này'——"
2691 = "Tiếng hắng giọng của anh Urakami. Tầm nhìn của tôi bừng sáng, trở lại với thực tại."
2698 = "Anh Urakami lặng lẽ lùi lại một bước. Rời khỏi tầm nhìn của tôi."
2701 = "Để tiếp tục duy trì đường ray. Nếu cần phải vận hành tập trung, quản lý tập trung, thì tôi nhất định sẽ làm được điều đó."
2704 = "Sau đó, bằng một đường kẻ đỏ, cô ấy khoanh một vòng tròn lớn bao quanh đoạn Yunoi - Ohimitera - Kagoshima."
2705 = "Và rồi, tôi nhớ lại. Những lời Hibiki đã từng nói với tôi."
2709 = "Đến bây giờ tôi mới nhận ra, dự án kỳ 1 đã được ưu ái về mọi mặt điều kiện đến mức nào."
2710 = "Tuyến đường vòng tròn mang lại lợi ích to lớn đến nhường nào."
2711 = "Nhưng quả thực, chỉ gọi bằng họ thì dễ gây nhầm lẫn thật."
2713 = "Dù sao thì Kisaki cũng là một nhà lãnh đạo xuất sắc được mọi người công nhận của Kumagin chi nhánh Ohimitera mà."
2717 = "Đã đến giờ khởi hành—— ở cuối sân ga, Paulette đang phất \\x%l緑旗;#00ffc040;cờ xanh lá%l;#;."
2721 = "Thấy tôi gật đầu, cô ấy nở nụ cười vui vẻ, fufu."
2724 = "Nhìn biểu cảm ấy, tôi ngày càng trở nên bất an—— nhưng cảm xúc trong tôi không hề nhỏ bé đến mức bị sự bất an đè bẹp."
2761 = "Môi Kisaki mấp máy, như muốn nói điều gì đó——"
2763 = "Tôi đang được Kisaki——dẫn dắt. Em ấy đang dạy tôi rằng, như thế này là được rồi."
2764 = "Chạy chậm lại gần, Kisaki tiến sát anh Urakami. Khoảng cách gần đến mức tưởng chừng như cô ấy sắp lao hẳn vào ngực anh Urakami vậy."
2766 = "Như thể vùi mình vào thân hình cao lớn ấy, cô ấy đang thân mật chỉnh lại cà vạt cho anh."
2768 = "Kisaki nói một cách dứt khoát, rồi đặt phịch chồng bưu phẩm xuống bàn làm việc."
2770 = "Ánh mắt Kisaki ngạc nhiên nhìn sang anh Urakami—— rồi chớp mắt một cái, ngay lập tức quay trở lại phía tôi."
2772 = "Hai tay Kisaki vươn ra. Bắt lấy tôi từ phía dưới."
2773 = "Nụ cười của Kisaki làm dịu đi bầu không khí. Đây là thời điểm tốt để bắt đầu câu chuyện."
2777 = "Đùng một cái, mặt Kisaki đỏ bừng lên. Nóng bừng lên ngay tắp lự như thể vừa bị nhúng vào nước sôi."
2778 = "Kisaki nhào vào lòng tôi. Bằng đôi môi ấy, áp lên môi tôi——"
2780 = "Trước lời nói của anh Urakami, Kisaki bật cười sảng khoái."
2782 = "Kisaki đã nói đúng những gì tôi đang nghĩ trong lòng."
2783 = "Nói rồi Kisaki chỉ vào chồng bưu phẩm mà cô ấy vừa mang vào."
2786 = "Nói rồi Kisaki quay sang máy tính, và bắt đầu gõ phím một cách mãnh liệt."
2789 = "Bất chợt Hachiroku cất tiếng, hướng khuôn mặt về phía Paulette."
2791 = "Và từ đầu bên kia sân ga, những lời chúc phúc ấm áp cũng được gửi đến."
2794 = "Kisaki đang yêu, nhưng bản thân cô ấy lại không nhận thức được, không thể thừa nhận điều đó——đó là điều thứ nhất."
2798 = "Nụ hôn thứ ba là từ phía tôi."
2800 = "Thứ hai, đối tượng \"yêu\" không phải là tôi. Một người nói chuyện thân thiết với Kisaki hơn cả tôi——ví dụ như anh Urakami."
2802 = "Trông cứ như một cặp vợ chồng mới cưới——"
2809 = "Dù sao thì, cũng phải hướng về phía trước. Để tiếp tục duy trì đường ray."
2810 = "Rồi một ngày nào đó, chắc chắn chúng tôi sẽ trải những đường ray mới. Để kết nối ai đó với ai đó, để chạy tới một tương lai mới."
2817 = "Vốn dĩ, tôi cũng đâu có tiếp xúc thân mật đến thế——"
2819 = "Đứng nhìn cảnh đó từ sân ga, thực sự là một cảm giác rất chi là, vi diệu."
2820 = "Bị khẳng định dứt khoát như vậy, nỗi bất an vơi đi hẳn. Đôi mắt của ông Mototada đã nhìn thấy cơ hội thành công mà tôi không thể thấy."
2821 = "Bị lay động bởi giọng nói rộn ràng của Kisaki, tôi sực nhớ ra."
2822 = "Nghe như tiếng thở phào nhẹ nhõm, lại vừa giống như một tiếng thở dài."
2824 = "Đường sắt Mikan là công ty đường sắt sở hữu tuyến đường từ Kagoshima đến Sendai, và vẫn đang tiếp tục duy trì hoạt động kinh doanh."
2843 = "Bị khẳng định một cách dứt khoát như vậy, tôi cũng có cảm giác là như thế thật."
2862 = "Ngay khoảnh khắc nói ra, mọi vướng bận đều tan biến."
2863 = "Nói rồi, Hibiki dùng mũi chân gõ nhẹ xuống sàn nhà."
2864 = "Nói xong, Hibiki đứng dậy."
2865 = "Vẫy vẫy tay, Hachiroku ra hiệu gọi tôi lại gần."
2866 = "Nhắc mới nhớ, từ giữa cuộc họp, em ấy đã có vẻ như đang trầm tư suy nghĩ điều gì đó——"
2869 = "Nhìn vào dòng chữ được ghi trên chứng khoán, tôi chợt nhớ lại lời nói của Hibiki khi lần đầu tiên được giao làm đại lý \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#;."
2871 = "Hồi sinh đường sắt—— tức là, phải thu mua lại đất đai."
2891 = "Vào cái ngày tôi trở về Ohimitera, đây là một khung cảnh mà tôi thậm chí còn chưa từng mơ tới."
2892 = "Vẫn có thể tiếp tục nhận được sự hợp tác từ ông Seki và những tình nguyện viên \\x%l保線;#00ffc040;bảo trì đường ray%l;#; khác."
2894 = "Nếu vậy thì từ nay trở đi, Đường sắt Ohito sẽ không cần phải sở hữu nhân sự và thiết bị phục vụ cho việc \\x%l保線;#00ffc040;bảo trì đường ray%l;#; nữa——"
2896 = "Nghĩ vậy, lòng biết ơn trong tôi lại càng dâng trào mạnh mẽ hơn."
2897 = "Nếu vậy thì, có lẽ. Người \"bạn\" đó có thể chính là Hibiki."
2898 = "Tầm nhìn càng rộng càng tốt, trí tuệ càng nhiều càng hay. Mượn điện thoại, tôi bấm số mà mình đã ghi nhớ trong đầu."
2899 = "Lời mào đầu còn chưa dứt, ông Mototada đã bắt ngay vào chuyện. Nhưng như thế lại vừa vặn. Hãy nương theo đà này mà tiến hành thôi."
2901 = "Cô bé từng yếu đuối đến mức bám víu lấy cả tôi, một người gần như mới gặp lần đầu, giờ đây lại cố gắng thúc đẩy tôi từ phía sau một cách mạnh mẽ như vậy."
2903 = "Vậy thì, đoạn Ohimitera - Kagoshima sẽ xử lý ra sao đây——"
2909 = "Tuy không phải là một con số nhỏ, nhưng hoàn toàn không đủ cho chi phí khôi phục tuyến đường kỳ 2."
2910 = "Dù cảm thấy có lỗi vì đã chiếm dụng khoảng thời gian quý giá trước khi xuất phát, nhưng nhờ được nói chuyện với em ấy, tâm trạng tôi đã trở nên sảng khoái hơn rất nhiều."
2911 = "Dù không hẳn là có chung sở thích, nhưng ngay cả những chủ đề vô thưởng vô phạt cũng rất ăn khớp."
2912 = "Dù chỉ là anh em nuôi nhưng vẫn là anh em, có lẽ cảm quan ngôn ngữ cũng đã trở nên giống nhau từ lúc nào không hay."
2913 = "Cảm thấy bối rối không biết đột nhiên em ấy đang nói chuyện gì,"
