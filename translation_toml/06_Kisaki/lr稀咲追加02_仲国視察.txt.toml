1323 = "「Nếu một sự tồn tại đáng mơ ước đánh mất đi ánh hào quang của nó……\\nthì cái gọi là sự lỗi thời đang chờ đợi phía trước sao?」"
1325 = "「Chắc là vậy. Cả toa giường nằm lẫn toa ăn, tôi đều chưa có duyên đi thử.\\nVì thế, tôi có cảm giác như đang khao khát những món đồ cổ vậy.」"
1326 = "「Đó hoàn toàn là việc nâng cao mức độ yêu thích đối với đường sắt ạ.\\nBiến đường sắt thành một thứ được chú ý, được quan tâm và được kỳ vọng.」"
1327 = "「Em nghĩ là đúng như những gì anh Soutetsu vừa nói lúc nãy ạ.\\n'Tinh tế, thời trang, tiên tiến' v.v., có vẻ sẽ rất được yêu thích.」"
1329 = "「Tôi chỉ là một thư ký thôi,\\nđể sắp xếp được thì cần phải có sự chuẩn bị và làm thủ tục từ trước.」"
1331 = "「Tôi cũng cảm thấy đúng là như vậy.\\nThế thì cuối cùng chúng ta cũng có thể tiến tới việc xem xét nội dung cụ thể rồi.」"
1332 = "「Tôi cũng nghĩ hướng đó là tốt nhất. Vì vậy, trước tiên tôi muốn biết\\nđại đa số các cặp đôi trẻ ở Trọng Quốc có sở thích như thế nào.」"
1334 = "「Tôi cũng tán thành——á chà.」"
1337 = "「Tôi vô cùng hứng thú.\\nXin anh hãy kể chi tiết cho tôi nghe với.」"
1339 = "「Việc tiếp đón hai vị ở Bắc Cầm vẫn sẽ diễn ra theo đúng kế hoạch ban đầu,\\nchúng tôi đã đặt trước một nhà hàng có phòng riêng hoàn toàn.」"
1342 = "「Vâng, có chuyện gì vậy thưa anh Soutetsu.」"
1343 = "「Chị muốn nghe cảm nhận của riêng Suika thôi nhé——\\nSự khác biệt lớn nhất giữa đường sắt Hinomoto và đường sắt Trọng Quốc là gì vậy?」"
1346 = "「Tôi hiểu rồi. Đó quả thực là một nước đi tồi.\\nỞ Trọng Quốc cũng vậy, nếu bị lộ chắc chắn sẽ vấp phải sự phản đối gay gắt.」"
1347 = "「Tôi không có ý kiến gì khác.\\nNếu có thể, tôi rất muốn được đi thử.」"
1349 = "「Tôi nghe nói điều tương tự cũng đã xảy ra trong thời kỳ suy thoái của Đường sắt Hoàng gia.\\nTức là, việc sử dụng tàu hỏa trở nên thường nhật hóa, và hành khách dần quay lưng lại với toa ăn.」"
1350 = "「Vì vậy, Suika xin hứa chắc chắn\\nsẽ đáp ứng được kỳ vọng của hai vị ạ.」"
1352 = "「Vậy nên chuyện này——không hề có sự sắp xếp đặc biệt nào cả,\\nđây là trạng thái hoàn toàn bình thường phải không?」"
1353 = "「Mà này, anh Soutetsu? Cái đó là gì vậy……\\nXe Oiran? ấy.」"
1357 = "「Được chị Kisaki khen ngợi Lão Sư,\\nSuika cảm thấy vô cùng vinh hạnh.」"
1359 = "「Rất vinh hạnh khi được chị khen ngợi. Nhưng sự sạch sẽ của toa ăn này,\\ncó lẽ đơn giản chỉ là do số lượng người sử dụng quá ít thôi.」"
1361 = "「Xin lỗi, xin lỗi. Vậy chúng ta hạ nhiệt một chút nhé.」"
1362 = "「Xin lỗi vì đã làm em xấu hổ nhé.\\nNhưng đó là những gì chị thực sự cảm nhận được mà.」"
1364 = "「Không, là do câu hỏi của chị không tốt. Nếu bình tĩnh suy nghĩ lại thì,\\nviệc chỉ nêu ý kiến của bản thân cũng khó thật. Chắc chắn sẽ có sự ảnh hưởng từ những người xung quanh mà.」"
1367 = "「Việc từ bỏ tầng lớp đó thật lãng phí và vô nghĩa.\\nThậm chí, nhu cầu du lịch cũng có thể được kỳ vọng tùy thuộc vào cách quảng bá.」"
1371 = "「Là món cô Khương gợi ý mà. Chắc chắn là ngon rồi,\\ntôi cũng muốn ăn thử——nhưng không biết có để được đến tối không nhỉ.」"
1373 = "「Với mức độ đông đúc và nhộn nhịp thế này. Có lẽ——hay nói đúng hơn là theo trực giác của tôi,\\nnhu cầu thực tế sẽ không bị cướp mất đâu.」"
1380 = "「Ở Hinomoto có rất nhiều tuyến đường sắt dọc theo các con sông,\\nvà cũng có vô số nơi nền đất không được vững chắc. Không chỉ vậy,」"
1383 = "「Ừm. Dù chưa được sắp xếp lại, nhưng tôi cảm thấy mình\\ncó thể nghĩ ra vài ý tưởng. Nhưng mà……」"
1385 = "「Đó là một từ trong cổ văn của Trọng Quốc.\\nNó mang ý nghĩa 'truy tìm nguồn gốc và đi sâu vào bản chất của sự việc'.」"
1387 = "「Đúng vậy.\\nSo với chiếc 8620 của chúng ta thì cứ như người lớn với trẻ con vậy.」"
1389 = "「Là do chuyến tàu này là tàu đường dài sao?\\nHay là những chuyến tàu nội thành…… kiểu như tàu điện ngầm đi làm cũng vậy?」"
1391 = "「Đúng vậy. Master đời trước\\nđã đánh giá rất cao khả năng quan sát và phân tích của Suika.」"
1393 = "「Đúng vậy. Trong lúc đi dọc theo các toa hành khách thông thường và toa giường nằm,\\ntôi cũng dần hiểu ra rồi.」"
1395 = "「Vâng. Dù những nghiên cứu của Lão Sư là do ông ấy tự mình thực hiện,\\nnhưng Suika hiểu rằng sự Tất Cứu của ông ấy vô cùng sâu sắc.」"
1396 = "「Vâng. Vì vậy, em nghĩ phạm vi những câu hỏi em có thể trả lời\\nsẽ rộng hơn một chút so với các chị em khác ạ.」"
1399 = "「Vâng. Nếu có thể thu hút được 'những cặp đôi đang hẹn hò'\\nmà hai vị vừa chỉ ra là không có mặt lúc nãy thì tốt quá.」"
1401 = "「Vâng, chính xác như lời anh Soutetsu nói ạ.\\nVì vậy, nước lọc và nước nóng trên tàu được sử dụng miễn phí và tự do.」"
1403 = "「Vâng. Nó chính xác là chiếc Oya 31 của Đường sắt Hoàng gia cũ ạ. Suika\\nđã từng có cơ hội đến Hinomoto để khảo sát.」"
1405 = "「Ra là vậy, trang tin tức sao.」"
1407 = "「Đó là biệt danh của xe đo giới hạn kiến trúc. Để đo giới hạn kiến trúc,\\nnhững thanh gắn cảm biến nhô ra trông giống như trâm cài tóc của các Oiran vậy.」"
1411 = "「Ban đầu là mặc âu phục ăn ở toa ăn, còn bây giờ là mặc đồ thường ngày\\năn mì ly. Có cảm giác nó đã trở thành thứ đồ dùng thiết thực nhất rồi.」"
1412 = "「Vâng. Giả sử chính phủ bãi bỏ lệnh hạn chế mua, và giá cả giảm xuống,\\ntôi dự đoán sức mua sẽ bùng nổ.」"
1414 = "「Có lẽ vậy. Sự tinh tế, thời trang hay cảm giác tiên tiến mà giới trẻ yêu thích,\\nquả thực hoàn toàn trái ngược——với toa hành khách.」"
1420 = "「Dongfu 4…… là chiếc màu xanh lá cây vừa nãy chúng ta xem. Hình như là——\\nđầu máy diesel-điện được chế tạo dựa trên công nghệ của nước Lỗ.」"
1424 = "「Chào mừng hai vị đã quay lại.\\nBên trong đoàn tàu thế nào? Anh Soutetsu, chị Kisaki.」"
1426 = "「Đúng như chị nói ạ. Tất Cứu là câu cửa miệng của Lão Sư.」"
1430 = "「Đúng như lời chị Kisaki nói, chiếc Dongfu 4 số 1\\nđang được trưng bày chính là em gái của Suika.」"
1434 = "「Đúng như chị Kisaki suy đoán ạ. Hiện tại đang là giờ ăn trưa,\\nnhưng rất hiếm thấy ai dùng bữa trưa xa xỉ tại toa ăn.」"
1436 = "「Chính xác là vậy ạ. Nghe nói vào thời điểm mới đưa vào sử dụng, những hành khách mặc âu phục\\nđã xếp hàng chờ đợi cả ngày lẫn đêm ở toa ăn.」"
1437 = "「Đúng vậy. Vì thế, giả sử có thay giá chuyển hướng để chạy đi chăng nữa,\\nthì nó cũng sẽ vượt quá giới hạn kiến trúc trên đường ray của Hinomoto.」"
1438 = "「Đúng vậy. Chà…… nếu vậy thì khá là khó đấy.\\nMục tiêu càng rộng và nông, thì càng khó thu hẹp các lựa chọn.」"
1442 = "「Nhưng sau vài lần lượng khách giảm sút và giảm giá,\\ntỷ lệ hành khách mặc đồ thường ngày sử dụng dịch vụ ngày càng tăng lên.」"
1450 = "「Hiện tại thì đúng như chị nói ạ. Tuy nhiên,\\nSuika cảm nhận rất rõ 'sự khao khát chính vì không thể sở hữu' của mọi người.」"
1453 = "「Phương pháp PR tối ưu nhất cho giới trẻ là thông qua internet và điện thoại thông minh,\\nđể truyền tải sức hấp dẫn của đường sắt——có phải vậy không?」"
1457 = "「Tất nhiên,\\nem nghĩ anh Soutetsu đã quá quen với việc này rồi ạ.」"
1458 = "「Tất nhiên rồi!\\nNếu không phiền, xin hãy cho chúng tôi tham gia với.」"
1461 = "「Không sai vào đâu được.」"
1462 = "「Đúng vậy. Tôi cũng nghĩ nếu dừng câu chuyện ở đây\\nthì thật là đáng tiếc, nhưng mà——」"
1463 = "「Đồ ăn ở toa ăn của Cục Thánh Đô nổi tiếng là rất ngon,\\nnên nếu có thời gian, tôi rất muốn thiết đãi hai vị.」"
1466 = "「Thật sự rất ấn tượng.\\n……Tôi chưa từng mơ tới việc nó lại ấn tượng đến mức này đấy.」"
1467 = "「Thực sự cảm ơn em nhé. Suika.\\nNhờ em mà chị cũng được khen lây đấy.」"
1473 = "「Chắc là vậy. Dù việc chuyển đổi sang Aircra chưa tiến triển,\\nnhưng xe hơi chạy bằng xăng chắc hẳn đã khá phổ biến rồi.」"
1474 = "「Đúng vậy.\\nVì thế, chúng tôi rất mong có thể phá vỡ được bế tắc đó.」"
1475 = "「Đúng vậy.」"
1476 = "「Thật sự rất ấn tượng. Dù ở Hinomoto chắc chắn sẽ không thể chạy được——\\nNhưng chính vì thế, nó càng khiến tôi cảm nhận sâu sắc sự hùng vĩ của đại lục.」"
1481 = "「'Stealth marketing' là gì vậy?」"
1491 = "「Vẫn duy trì cảm giác lộn xộn vốn là đặc trưng hiện tại, cũng như nhu cầu thực tế.\\nTrên cơ sở đó, thực hiện riêng các biện pháp thu hút tầng lớp mục tiêu mới.」"
1494 = "「Khổ đường sắt ở Hinomoto là khổ hẹp 1067mm,\\ncòn chiếc đầu máy này được thiết kế cho khổ tiêu chuẩn 1435mm.」"
1497 = "「Người già và các gia đình đi cùng nhau rất nhiều, còn người trẻ thì cực kỳ ít.\\nĐặc biệt là hầu như không thấy những cặp đôi đi hẹn hò.」"
1501 = "「Ở phía toa giường nằm, có người đang ăn một loại thịt gì đó màu nâu nhạt.\\nĐiều khiến tôi ngạc nhiên là ở phía toa hành khách, có người đang ăn mì ly.」"
1502 = "「Không có gì đáng để hai vị phải cảm ơn đâu ạ.\\nNhưng nếu có thể giúp ích được gì, Suika cũng cảm thấy rất vui.」"
1506 = "「Với hiện trạng này, đây là phương tiện di chuyển có chi phí thấp nhất.\\nNếu xe hơi Aircra được bán ra thị trường với mức giá có thể phổ cập cho đại chúng thì」"
1509 = "「Nếu vậy thì anh Soutetsu, em vô cùng xin lỗi.\\nThật đáng tiếc, nhưng bảo tàng đường sắt Bắc Cầm không có trưng bày chiếc xe đó ạ.」"
1510 = "「Nếu là chuyện đó thì, anh Soutetsu, chị Kisaki.\\nSuika có thể vẽ một bản vẽ phác thảo đơn giản ạ.」"
1516 = "「Được khen nhiều quá, Suika sắp bị quá nhiệt đến nơi rồi ạ.」"
1532 = "「Suika tuyệt đối không rành về chuyện này đâu ạ,\\nnhưng trong phạm vi quan sát của Suika thì, cái đó……」"
1535 = "「Suika chỉ là một người ghi chép đơn thuần thôi.\\nĐối với Lão Sư, em chắc chỉ giống như một cuốn sổ tay điện tử thôi ạ.」"
1544 = "「Suika cũng nhận thức được như vậy ạ.」"
1545 = "「Tất nhiên là em biết ạ. Một nhà thiết kế toa xe trẻ tuổi đầy triển vọng,\\nđang dần đại diện cho Hinomoto, thậm chí còn được gọi là thiên tài.」"
1547 = "「Master đời trước của Suika,\\ncó vẻ rất am hiểu về tình hình đường sắt ở Hinomoto nhỉ?」"
1549 = "「Xung quanh Suika cũng toàn là những người rất gọn gàng ngăn nắp.\\nVì vậy, sự chỉ điểm vừa rồi của chị giúp em học hỏi được rất nhiều ạ.」"
1551 = "「Để em xác nhận ạ——Em đã xác nhận xong. Đầu máy kéo của chuyến tàu quay về là\\nDongfu loại IV. Đây là chuyến tàu do em gái của Suika phụ trách ạ.」"
1553 = "「Suika, điều đó không sai chứ?」"
1554 = "「Suika này. Chuyến tàu quay về ấy——có không gian nào giống như toa ăn\\nvừa nãy, nơi chỉ có chúng ta không?」"
1557 = "「Việc cố tình tạo ra hiệu ứng truyền miệng rất khó nhỉ.\\nỞ Hinomoto là sẽ bị làm ầm lên là 'stealth marketing' ngay.」"
1559 = "「Nếu nói thế thì Nagi cũng sẽ vui sướng lắm đây.」"
1561 = "「Nếu khen thì anh phải khen Suika mới đúng.\\nNhìn hình vẽ này, ai mà chẳng hiểu được chứ?」"
1562 = "「Không đâu, chúng tôi mời hai vị đến là để tham quan mà.\\nĐó thậm chí còn là điều chúng tôi rất mong muốn. Chỉ là——」"
1564 = "「Việc tạo ra những chuyến tàu hấp dẫn có hiệu quả với những người có hứng thú với đường sắt.\\nNhưng vốn dĩ hầu hết giới trẻ đều không có hứng thú với đường sắt.」"
1565 = "「Thì cũng không đến mức tạo thành một động lực mạnh mẽ để cất công đi thử.\\nĐúng nhỉ, ừm. Không có hứng thú với lĩnh vực đó là như vậy đấy.」"
1566 = "「Đúng vậy. Stealth Marketing.」"
1567 = "「Nhân tiện, chiếc xe đo giới hạn kiến trúc trong bản vẽ này.\\nTrong mắt tôi, nó trông giống hệt chiếc Oya của Đường sắt Hoàng gia cũ.」"
1568 = "「Cảm ơn lời khuyên của em. Nhưng mà, không sao đâu.」"
1575 = "「Hai vị vất vả rồi. Bữa trưa hai vị muốn dùng gì?\\nĐây là toa ăn mà, hai vị cứ gọi món mình thích nhé.」"
1593 = "「Thứ này——Tuyệt thật đấy.」"
1594 = "「Ý, ý chị là sao ạ?」"
1595 = "「Đó quả là một đề xuất vô cùng tuyệt vời.\\nChúng tôi rất mong em có thể làm người hướng dẫn cho chuyến khảo sát này.」"
1596 = "「Tuyệt thật đấy, cái này.\\nĐúng là cảnh tượng 'Con trai thích mấy thứ như thế này phải không?' luôn.」"
1597 = "「Đã đến rồi sao!\\n90 phút mà cứ thảo luận thì trôi qua nhanh thật đấy.」"
1598 = "「Trong bảo tàng này có trưng bày xe đo giới hạn kiến trúc không?\\nTôi nhìn sơ qua thì không thấy.」"
1599 = "「Tôi nghĩ cách đó cũng được. Nhưng mà——」"
1600 = "「Vậy sao. Ra là thế——Vậy nên mới có mì ly nhỉ.\\nHừm.」"
1601 = "「Ra là vậy.」"
1602 = "「Vậy sao, thế thì phải chuẩn bị xuống tàu thôi.」"
1603 = "「Vậy sao, thế thì tốt quá rồi.」"
1604 = "「Đó cũng có thể coi là sự phân định rạch ròi với Aircra.\\nNói cách khác, cảm giác khủng hoảng trước nguy cơ bị Aircra đào thải cũng là một điểm chung ạ.」"
1605 = "「Toa ăn này——hình như gọi là toa nhà hàng nhỉ?\\nỞ đây tuyệt thật đấy. Có một sự sạch sẽ tràn ngập nét hoài cổ.」"
1606 = "「Câu chuyện có vẻ thú vị đấy.\\nNày, cô Khương. Nếu cô Khương cũng có hứng thú thì——」"
1607 = "「Đây là đầu máy phụ dùng để quay về,\\nnên chúng tôi đã sắp xếp để chỉ có Suika phụ trách cho đến ga Tây Bắc Cầm.」"
1610 = "「Tàu đi làm mới chính là thường nhật đấy.\\nĐó đơn thuần chỉ là sự di chuyển theo nhu cầu mà thôi.」"
1615 = "「Chuyện đó, nếu có thể thì xin hẹn vào một dịp khác.\\nBây giờ, hơn hết là chúng ta cần thời gian để bàn bạc.」"
1616 = "「Lớn quá. Không, tất nhiên là tôi biết\\nđầu máy hơi nước vốn dĩ rất to lớn và đồ sộ rồi, nhưng mà」"
1618 = "「Vậy, có thể cho chúng tôi mua mang về được không?\\nChúng tôi sẽ mang theo và ăn trên chuyến tàu quay về Bắc Cầm.」"
1619 = "「Tôi cảm thấy đây giống như một phương tiện di chuyển hơn là một bầu không khí tận hưởng chuyến đi.\\nĐặc biệt là bên trong toa hành khách thông thường, nói sao nhỉ, vô cùng lộn xộn.」"
1621 = "「Nếu vậy, chúng ta cứ gửi ở nhà hàng sắp tới,\\nrồi nhờ họ dọn ra cùng với các món ăn khác cho đẹp mắt nhé.」"
1625 = "「Nếu vậy thì chúng tôi sẽ khiến hai vị thật hài lòng.\\nSuika?」"
1626 = "「Vậy, quyết định thế nhé!」"
1629 = "「Vậy thì thứ tiếp theo chúng ta cần khảo sát,\\ncó lẽ là 'chính hiện trạng của Đường sắt Quốc gia Trọng Quốc' nhỉ? Anh thấy sao? Anh Soutetsu.」"
1631 = "「Đó là do ai đó mang theo bình thủy hay thứ gì đó lên tàu sao?\\nHay là do nhân viên bán hàng trên tàu pha sẵn rồi bán?」"
1634 = "「Chắc chắn, nhu cầu thực tế mà Đường sắt Quốc gia Trọng Quốc đang đảm nhận hiện nay sẽ bị cướp mất tận gốc rễ.\\nSuika đang rất lo ngại về điều đó.」"
1636 = "「Thế thì tốt quá. Cảm ơn cô đã sắp xếp.」"
1637 = "「Đó chắc là van hãm phanh nhỉ.\\nHiện tại có vẻ như tay cầm đã được tháo ra…… còn thao tác động lực thì——」"
1638 = "「Vậy thì Suika. Em nghĩ Đường sắt Quốc gia Trọng Quốc,\\nviệc đầu tiên cần làm để duy trì sự tồn tại của đường sắt là gì?」"
1640 = "「Vậy cho tôi hỏi, trong bảo tàng đường sắt này\\ncó trưng bày xe đo giới hạn kiến trúc không?」"
1643 = "「Là vậy đó, cô Khương, nhờ cô sắp xếp nhé.\\nCòn Suika, em có thể làm hướng dẫn viên cho chúng tôi được không?」"
1644 = "「Vậy, tôi cũng muốn hỏi Suika một câu.\\nVí dụ như Hibiki…… à, về Hibiki thì」"
1645 = "「Kể cho chị nghe tất cả được không?」"
1649 = "「Về vấn đề đó, Suika đã chịu ảnh hưởng rất lớn từ cách diễn giải của Lão Sư——\\ntức là Master đời trước của Suika ạ.」"
1651 = "「Xe đo giới hạn kiến trúc——\\nÝ anh là xe Oiran đúng không ạ?」"
1653 = "「Ngoài ra, thông qua các ứng dụng nhắn tin ngắn,\\nhọ cũng thường xuyên nhận được thông tin truyền miệng từ người khác ạ.」"
1655 = "「Anh Soutetsu và chị Kisaki đã dùng những từ như lộn xộn, cảm giác sinh hoạt, thư giãn để diễn tả——\\nnhưng chính điều đó lại khiến giới trẻ xa lánh đường sắt.」"
1656 = "「Anh Soutetsu, chị Kisaki.\\nTàu sắp sửa đến ga Hotei rồi ạ.」"
1657 = "「Anh Soutetsu, chị Kisaki.\\nThật đáng tiếc, nhưng tàu sắp đến ga Tây Bắc Cầm rồi ạ.」"
1658 = "「Việc có ít cặp đôi trẻ tuổi chắc cũng là do ảnh hưởng của điều đó nhỉ.\\nThành thật mà nói, tôi không nghĩ đây là chuyến tàu mà người ta muốn đi khi hẹn hò đâu.」"
1660 = "「Không đâu, anh Soutetsu. Chắc chắn là em gái ạ.\\nBởi vì chiếc Dongfu 4 2000 của Suika là nguyên mẫu thử nghiệm của toàn bộ series này.」"
1663 = "「Giống như DINE ở Hinomoto sao.\\nRa là vậy, về mặt đó thì không có sự khác biệt so với giới trẻ Hinomoto nhỉ.」"
1666 = "「Toa ăn…… nghe nói toa giường nằm cũng vậy,\\nkhi mới xuất hiện, chúng được trân trọng như những món đồ xa xỉ đắt tiền.」"
1668 = "「Đầu tiên là sự cần thiết của đường sắt siêu tốc. Theo quan sát của Suika,\\nở cả hai quốc gia, đây là điều bắt buộc để khôi phục lại nhu cầu thực tế đối với đường sắt ạ.」"
1674 = "「Chiếc số 1 không phải là chị sao?」"
1678 = "「OK. Tôi nghĩ mình đã hiểu rồi. Nếu chiếc đầu máy siêu lớn này mà\\nchạy ở Hinomoto, nó sẽ phá hủy hết các công trình xung quanh đường ray nhỉ.」"
1682 = "「OK. Vậy cho chị hỏi thêm một chút nữa nhé? Lần này ngược lại,\\nem cảm thấy điểm giống nhau giữa đường sắt Hinomoto và Trọng Quốc là gì?」"
1685 = "「OK. Vậy làm thế nào để khiến họ cảm thấy hứng thú.」"
1686 = "「Tất Cứu?」"
1728 = "Vì quá vui sướng nên tôi lỡ buột miệng, trong thoáng chốc tôi cảm thấy mình đã nói hơi thừa."
1730 = "Không biết là do niềm vui khi đã hiểu ra vấn đề, hay do lời khen ngợi của tôi,\\nmà Kisaki trông có vẻ hơi ngượng ngùng."
1731 = "Từ lúc nào, Suika đã đi lấy đồ ăn mang về.\\nCó vẻ là một loại bánh bao thịt nào đó. Quả thực là một mùi hương vô cùng hấp dẫn."
1739 = "Nhưng Kisaki lại mắt sáng rực hỏi lại,\\nkhiến tôi càng thêm hăng hái."
1740 = "Khoảnh khắc nhớ ra, tôi gật đầu.\\nĐiều đó quả thực rất giống với những gì tôi đã thấy bên trong chuyến tàu ngày hôm nay."
1743 = "Vì tính chất công việc, tôi đã xem qua bảng giờ tàu để xác nhận."
1744 = "Tàu đang giảm tốc độ.\\nNghĩ đến một khả năng, tôi nhìn đồng hồ thì——"
1747 = "Việc đi bộ xuyên suốt đến tận cuối toa hành khách, quả thực là một công việc khá nặng nhọc.\\nVừa ngồi xuống ghế, Kisaki liền uống cạn một hơi ly nước."
1757 = "Nhưng mà, sự khác biệt so với buồng lái của 8620 quả là một trời một vực.\\nĐầu tiên là rất rộng. Và vô cùng hiện đại."
1760 = "Khác với Hibiki, cô bé không lấy ra một cuốn sổ phác thảo.\\nMà là một cuốn sổ tay nhỏ bình thường, cùng với một cây bút bi cũng nhỏ nhắn không kém——"
1761 = "A, ra là kiến thức của em ấy chưa đến mức đó.\\nNếu đây đã là bảo tàng đường sắt thì…… à."
1765 = "Kisaki đã hiểu và nắm bắt được câu nói mà tôi vội vàng nói thêm vào."
1771 = "Hơn nữa, có vẻ cô bé cũng rất am hiểu tiếng Hinomoto và tình hình đường sắt của Hinomoto.\\nViệc từ 'xe Oiran' thốt ra một cách tự nhiên như vậy thật đáng nể."
1774 = "Vẻ điềm tĩnh và hoạt bát từ nãy đến giờ bỗng chốc thay đổi, cô bé trở nên bẽn lẽn.\\nNếu vậy thì có lẽ Suika chính là 'người trong cuộc của một cặp đôi' rồi."
1776 = "Một câu trả lời ngay lập tức cùng với nụ cười rạng rỡ."
1777 = "Vì cô bé nói tiếng Hinomoto quá trôi chảy nên tôi có chút bất ngờ."
1780 = "Tôi liếc nhìn sang cô Khương,\\nvà nhận lại một cái gật đầu đồng tình."
1794 = "Gật đầu đáp lại sự đồng tình của Kisaki,\\ncô Khương chợt hướng mắt về phía cánh cửa dẫn sang toa hành khách."
1796 = "Tôi hơi bất ngờ trước lời nói của cô Khương. Đúng là từ nãy đến giờ,\\nbên trong toa ăn vẫn chỉ có mỗi chúng tôi, nhưng mà……"
1798 = "Nghe vậy, cô Khương gật đầu mạnh."
1800 = "Cô Khương vẫn giữ nụ cười điềm tĩnh,\\nvà vô cùng tự nhiên cất thực đơn đi."
1801 = "Đáp lại tiếng gọi của cô Khương,\\nmột Railord trông rất lanh lợi bước tới."
1803 = "Giọng nói của cô Khương cất lên rất đúng lúc."
1825 = "Như đang chờ khoảng lặng trong cuộc trò chuyện,\\nSuika rụt rè giơ tay lên."
1827 = "Vì ánh mắt của Kisaki hướng về phía tôi, nên tôi liền nói ra những gì mình cảm nhận được."
1828 = "Giọng nói của Suika cất lên như một phản xạ vô điều kiện.\\nCô bé ngượng ngùng bịt miệng lại, nhưng tôi lại càng muốn nghe cảm nhận thực tế của cô bé hơn."
1830 = "Tôi cảm thấy vui mừng. Thông qua dự án My Rail Fund, Kisaki cũng đã\\nhiểu biết hơn rất nhiều về đường sắt…… hay nói đúng hơn là về đường ray."
1833 = "Gần đây, khi Hibiki đang nghiên cứu về toa ăn,\\ntôi chợt nhớ lại câu chuyện về Đường sắt Hoàng gia mà Hachiroku từng kể."
1835 = "Tất nhiên là tôi rất có hứng thú. Nếu có thể, tôi thậm chí còn muốn được tự mình lái thử\\ntrong lúc dồn toa nữa kìa. Nhưng mà——"
1836 = "Tôi liếc nhìn Kisaki trong chớp mắt, và nhận lại một nụ cười mãn nguyện.\\nNếu vậy thì tôi rất sẵn lòng để cô bé làm người hướng dẫn."
1838 = "Chắc là muốn sắp xếp lại suy nghĩ,\\nKisaki bắt đầu lầm bầm."
1839 = "Như để không làm phiền cuộc trò chuyện của hai vợ chồng,\\ncô Khương, người nãy giờ vẫn đứng chờ ở xa, liền bước tới."
1843 = "Vì vậy, đây là di chuyển chứ không phải du lịch.\\nÍt nhất thì tôi không cảm nhận được sự khác biệt của một chuyến đi xa."
1845 = "Từng nét vẽ thoăn thoắt, đôi tay vô cùng điêu luyện.\\nCảm giác như cô bé đang trực tiếp tái hiện lại ký ức——hay nói đúng hơn là những dữ liệu đã được ghi chép."
1846 = "Khi cô Khương ra chỉ thị cho Suika,\\nSuika liền lập tức hướng về phía nhà bếp của toa ăn."
1848 = "Nếu theo đúng ý nghĩa 'phòng riêng hoàn toàn' mà cô Khương nói,\\nthì chắc chắn 'những chuyện nói ở đó sẽ không bị lọt ra ngoài'——"
1866 = "Có vẻ như đã hoàn toàn lấy lại tinh thần, Suika vừa xua tay vừa phủ nhận."
1872 = "Chắc chắn nó có thể là một gợi ý để phân tích hiện trạng.\\nTôi sẽ cố gắng nhớ lại câu chuyện của Hachiroku một cách chi tiết nhất có thể."
1894 = "Kisaki hít một hơi thật sâu, Suika cũng nghiêm túc làm theo.\\nQuả là một cảnh tượng thanh bình."
1895 = "Ngón cái lại đưa lên môi. Tôi cảm thấy sự hứng thú và những suy nghĩ của Kisaki,\\nđang bắt đầu đi sâu vào vấn đề này."
1898 = "Cả Kisaki và cô Khương đều cười rạng rỡ.\\nĐến cả Suika cũng mang một khuôn mặt vô cùng vui vẻ."
1900 = "Cả tôi và Kisaki đều chủ động nắm lấy tay nhau."
1902 = "Kisaki đặt ngón cái lên môi và chìm vào suy tư.\\nNếu vậy, tôi cũng sẽ hỏi những gì mình vừa nghĩ ra."
1903 = "Kisaki cố tình tỏ ra hài hước và nói 'Thất bại rồi, thất bại rồi'.\\nKhuôn mặt Suika ngẩng lên như trút được gánh nặng."
1905 = "Điều khiến Kisaki chú ý là gói đồ nhỏ mà Suika vừa đưa.\\nĐó là đồ ăn mang về từ toa ăn lúc nãy."
1908 = "Kisaki gật đầu sâu, trên khuôn mặt Suika cũng hiện lên một nụ cười.\\nTrông họ hệt như giáo viên và học sinh vậy."
1910 = "Kisaki đưa ngón cái lên chạm vào môi.\\nTôi cứ tưởng em ấy định cắn móng tay, nhưng như chợt nhận ra, em ấy lại bỏ tay xuống."
1912 = "Một giọng nói xen chút áy náy, cùng với một nụ cười vô cùng điềm tĩnh.\\nTrong nháy mắt, một cuộc trao đổi không lời đã diễn ra."
1914 = "Khép hờ miệng suy nghĩ một chút.\\nKisaki lại một lần nữa hướng ánh mắt về phía Suika."
1916 = "Nói rồi, Kisaki nhìn tôi."
1918 = "Ngón tay thứ hai được giơ lên."
1923 = "Tiếng 'Hừm' của Kisaki mang rõ sắc thái thích thú.\\n——Đến mức một kẻ bị coi là khúc gỗ như tôi cũng nhận ra. Chắc chắn không sai được."
1924 = "Kisaki chỉ vào bản vẽ và hỏi."
1925 = "Vừa dứt lời, Kisaki liền mỉm cười,\\nvà chọc nhẹ vào má tôi như muốn trêu chọc."
1926 = "Vừa nói, Kisaki vừa giơ một ngón tay lên."
1928 = "Mọi thứ được sắp xếp một cách trôi chảy.\\nDù đã kết hôn với tôi, Kisaki vẫn luôn là một 'Houshou Kisaki'."
1930 = "Trên biển số là 2101. Và dòng chữ Quốc Hệ Hào."
1933 = "Hơn nữa, không chỉ có một người.\\nMà là nhiều người——hay nói đúng hơn là một số lượng khá lớn."
1934 = "Ngay lập tức, cô Khương mỉm cười một cách vô cùng thích thú."
1936 = "Được nhắc đến, tôi nhớ lại ngay.\\nCảnh tượng mà Kisaki đã kéo tay áo tôi và giục tôi nhìn."
1937 = "Quả thật rất lanh lợi. Không hổ danh là nguyên mẫu thử nghiệm——một tinh anh.\\nCô bé đã khéo léo đưa câu chuyện quay trở lại chủ đề chính."
1950 = "Nhoẻn miệng cười——Nụ cười của Suika đầy vẻ tự hào."
1951 = "Chắc là do Suika đã gọi món giúp.\\nKisaki lại thấm giọng bằng ly trà ô long vừa được mang ra."
1954 = "Một cái cúi chào thật sâu.\\nĐợi cô bé ngẩng đầu lên, Kisaki liền lập tức đặt câu hỏi."
1956 = "Một vệt ửng đỏ đầy vui sướng hiện lên trên má Suika."
1957 = "Đôi mắt của Suika nhanh chóng mở to,\\nvà đôi má dần dần ửng hồng."
1959 = "Một phản ứng có chút ngượng ngùng. Kisaki cũng phản ứng lại 'Hửm?'.\\nCó vẻ như Suika, dù là một Railord nhưng——"
1960 = "Nói xong, Suika vội vàng nói thêm."
1961 = "Cả buồng lái của chiếc Dongfu loại 4 mà Suika cho chúng tôi lên, và\\ncả Kisaki đang phấn khích, đều thu hút trọn vẹn ánh mắt, đôi tai và cả trái tim tôi."
1965 = "Suika nhìn quanh một vòng.\\n——Sự sạch sẽ mà Kisaki nhắc đến, giờ đây lại mang đến cảm giác cô quạnh."
1969 = "Bị hỏi ngược lại, Suika hơi cúi mặt xuống."
1984 = "Điều này——Thật đáng kinh ngạc. Không biết ảnh hưởng từ vị Master đời trước\\ncủa Suika lớn đến mức nào, nhưng đây quả thực là một quan điểm vô cùng sắc bén."
1985 = "Bảo tàng Đường sắt Bắc Cầm. Bước chân nhảy múa của Kisaki đang đi tham quan,\\nbỗng dừng bặt trước một chiếc đầu máy hơi nước siêu lớn."
1986 = "Toa ăn——hay còn gọi là toa nhà hàng của chuyến tàu đi từ Bắc Cầm đến Thánh Đô.\\nCô Khương, người đang đợi chúng tôi, cất công kéo ghế ra cho chúng tôi."
1992 = "Bên trong toa ăn lúc này, ngoài chúng tôi ra không hề thấy bóng dáng vị khách nào khác.\\nCó lẽ nhận ra ánh mắt của tôi, Kisaki cũng nhìn quanh một vòng."
1993 = "Cuối cùng thì nhóm khách thứ hai cũng xuất hiện, một nhóm 4 người. Bầu không khí nhộn nhịp ồn ào,\\ndù là chuyện của người khác nhưng cũng khiến tôi bất giác vui lây."
1997 = "Vệt ửng đỏ vui sướng trên má cô bé càng thêm đậm.\\nCó vẻ như Suika đã hoàn toàn mến Kisaki rồi."
2001 = "(Nhưng mà——\\nDù mang tiếng là rất ngon nhưng mà……)"
2003 = "(Nói đúng hơn là Kisaki đang khiến cô bé nói ra.\\nChỉ trong một thời gian ngắn, cô ấy đã xây dựng được một mối quan hệ tin cậy vô cùng ấn tượng.)"

[selections]
