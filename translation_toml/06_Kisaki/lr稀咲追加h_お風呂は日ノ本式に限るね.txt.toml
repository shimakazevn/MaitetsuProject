1351 = "「Vậy sao――（Liếm nhẹ）」"
1352 = "「Làm thế này thì không có vấn đề gì nữa chứ.」"
1353 = "「Chỗ này, chắc chắn rất dễ bẩn…… nhỉ——Ưm——Fu, phải cọ rửa——cho thật sạch——mới, được.」"
1354 = "「Phía bên này. Nâng cao phần cửa âm đạo lên.」"
1355 = "「Vẫn chưa——được sao——Anh Sou, tetsu——Tôi, không ——chịu nổi nữa——không chịu nổi nữa——ưm——Xin anh đấy, anh Sou, tetsu.」"
1356 = "「Quả nhiên là——không được——không được đâu——ưm—— Giới hạn rồi——Tôi lên đỉnh mất! Tôi, tôi, không chịu nổi nữa.」"
1358 = "「Cái đó, thì――đúng――vậy mà.」"
1360 = "「Nếu vậy, lúc chúng ta làm tình lần đầu tiên.」"
1361 = "「Anh Soutetsu——Anh Sou, tetsu——Này, tôi——tôi——sắp, sắp——này——lên đỉnh——rồi——ưm——aa.」"
1362 = "「Soutetsu.」"
1363 = "「Soutetsu! Soutetsuuu! Xin anh! Xin anh! Xin anh! Xin annhhh!」"
1365 = "「Lúc, lên đỉnh! Cùng nhau——nhé——Thế nên—— Thay đổi——nhịp điệu đi——Lúc lên đỉnh——Lúc lên đỉnh ấy.」"
1366 = "「!」"
1435 = "Là nụ cười gượng gạo chăng. Hay là tự trào. Tiếng thở dài không hợp với hoàn cảnh này, khiến tôi vô cùng tò mò."
1439 = "Bầu ngực, nhũ hoa, mỗi lần xoa bóp lại trơn tuột trượt đi mất. Mỗi lần như vậy, đầu nhũ hoa cứng ngắc lại lưu lại một kích thích dễ chịu trên ngón tay."
1450 = "Nhà trọ mà chúng tôi buộc phải chọn làm nơi lánh nạn khẩn cấp này, không ngờ lại có bồn tắm rất tuyệt, hơn nữa khu vực tắm rửa cũng rất rộng."
1459 = "Thử xem sao, tôi liếm lên gáy Kisaki. Vị thì……không có. Nếu phải nói thì――"
1462 = "Dù lúc nãy khao khát xuất tinh là thế, nhưng giờ đây tôi lại đang liều mạng kìm nén. Chỉ vì muốn tận hưởng khoái cảm này lâu thêm chút nữa——"
1473 = "Vì có vẻ trơn trượt, nên tôi đã định thử làm thật chậm và dài, nhưng nếu Kisaki đã yêu cầu như vậy thì——!!!"
1475 = "Đôi chân khẽ mở và vẫy vùng, khiến bộ phận sinh dục lúc ẩn lúc hiện. Một lời mời gọi vui vẻ và đáng yêu thế này, sao tôi có thể từ chối được chứ."
1477 = "Bên dưới âm đạo, Kisaki chu môi lên, nhưng ngay lập tức, em ấy ngượng ngùng quay đi chỗ khác."
1478 = "Ngay khoảnh khắc tôi tưởng như đã xong, cơ thể tự động thở hắt ra một hơi dài rồi hít vào."
1485 = "Chỉ một cử động cơ thể rất nhỏ thôi, cũng đủ mang đến một khoái cảm râm ran như được liếm láp khắp toàn thân."
1486 = "Mỉm cười."
1488 = "Chuyển động của những ngón tay rõ ràng đang cố tình dừng lại ngay trước vạch đích, cho tôi biết rằng đó có lẽ chính là 'bí quyết' mà em ấy nói."
1490 = "Biến mông và lưng thành một miếng bọt biển, em liên tục cọ xát cơ thể vào tôi. Khi hai bộ phận sinh dục cọ xát vào nhau, những âm thanh dâm đãng vang vọng khắp phòng."
1492 = "Những ngón tay di chuyển xuống dưới. Hai hòn dái bị xoa bóp cứ trơn tuột trượt đi, càng làm tăng thêm sự nôn nóng."
1494 = "Làn da vẫn còn dính lotion. Tôi nhẹ nhàng vuốt ve phần bụng trên, ngay vị trí của tử cung."
1495 = "Sau khi nhịp thở dần ổn định lại, Kisaki cố gắng cất giọng nói gần giống với thường ngày nhất."
1497 = "Âm vang của từ 'chuẩn bị trước' mà thoáng chốc tôi không hiểu được ý nghĩa, dần dần biến thành sự thấu hiểu, và rồi là niềm vui sướng."
1499 = "Thật dễ thương. Thật đáng yêu. Muốn cắm vào quá. Muốn xuất tinh trong thật thỏa thích. Tôi cố gắng kìm nén sự thôi thúc đó, chỉ với một mong muốn duy nhất là được nghe tiếp câu chuyện."
1502 = "Sướng quá. Cảm giác từ những ngón tay của Kisaki hoàn toàn khác so với mọi khi. Sự khéo léo và tinh tế vẫn vậy, nhưng những ngón tay như biến thành chiếc lưỡi"
1506 = "Người đang liếm là tôi cũng thấy mới mẻ. Cổ của Kisaki, gáy của em, tai của em, lại đẹp đến nhường này sao."
1508 = "Lotion quanh âm đạo giờ đã hòa tan hoàn toàn vào dâm thủy. Vì thế, những đầu ngón tay của tôi không chút khó khăn nào, mở rộng âm đạo của Kisaki ra."
1514 = "Lỗ niệu đạo bị móng tay trơn trượt cọ xát một cách ngọt ngào. Hiểu rằng đó là một lời cảnh báo, tôi ngoan ngoãn phó mặc mọi thứ cho Kisaki."
1516 = "Chất nhầy mang theo thân nhiệt của cả hai, bắt đầu sủi bọt trắng nhẹ. Độ nhớt càng tăng cao, tạo ra những âm thanh nhóp nhép đầy gợi tình."
1521 = "Trở nên đáng yêu đến mức không thể chịu nổi, tôi áp đỉnh quy đầu vào cửa âm đạo. Lún vào hay không lún vào, chỉ đơn giản là áp sát ở cự ly số không."
1528 = "Tạo ra những đứa trẻ. Mang thai những đứa trẻ. Tôi khao khát điều đó đến nhường này. Nếu không gặp và gắn kết với Kisaki, tôi nghĩ hiện tại này sẽ không thể xảy ra."
1534 = "Trêu đùa bộ phận sinh dục trơn trượt của nhau, và tiếp tục nhẫn nhịn cơn cực khoái. Dù đầu óc có mụ mẫm đi vì nóng, tôi vẫn lập tức nghĩ ra cách giải quyết."
1535 = "Khi cả hai cùng bước ra khỏi bồn tắm, Kisaki liền lập tức trải một thứ gì đó giống như nệm hơi ra."
1536 = "Theo giọng nói của Kisaki, phần cơ thể đang chạm nhau của chúng tôi cũng run rẩy. Cửa âm đạo run lên dữ dội, như muốn nuốt chửng lấy quy đầu của tôi."
1538 = "Tôi muốn xoa đầu khen em ấy ngoan. Muốn truyền đạt cho em ấy biết. Nhưng dù có tìm mỏi mắt cũng chẳng còn chút dư dả nào để làm việc đó."
1539 = "Nhìn qua bờ vai, cơ thể Kisaki bóng loáng và trơn tuột vì lotion. Đôi nhũ hoa, trông cứ như những trái cây căng mọng nước vậy."
1540 = "Tôi rút người ra khỏi bên dưới Kisaki, và cứ thế dang rộng hai chân em ấy ra——"
1542 = "Tôi luồn tay vào khe hở giữa dương vật và âm đạo, thoa đẫm lotion lên âm vật."
1544 = "Cơ thể tôi đáp lại mong muốn của Kisaki, trong khi vẫn cắm bên trong, tôi đè mạnh xuống như muốn nghiền nát cơ thể em ấy."
1545 = "Tôi ấn mạnh dương vật đang cương cứng vào háng Kisaki. Chỉ bấy nhiêu thôi, Kisaki cũng đã hiểu được ý đồ của tôi."
1548 = "Tôi xoa bóp bầu ngực căng tròn như muốn dồn chúng về phía đầu nhũ hoa. Sự trơn trượt khiến cho màn ái ân quen thuộc mang lại một cảm giác hoàn toàn mới mẻ."
1550 = "Thay đổi nhịp điệu một chút, Kisaki liền phát ra âm thanh sung sướng. Tâm trí và cơ thể của chúng tôi hoàn toàn hòa quyện vào nhau."
1551 = "Tôi định trêu chọc em bằng lời nói, nhưng giọng điệu của Kisaki lại nghe rất vui vẻ."
1554 = "Dù tôi cố thử véo đầu nhũ hoa với lực mạnh hơn bình thường, nhưng cái đầu nhũ hoa đang cương cứng đó lại trơn tuột vuột khỏi kẽ tay."
1555 = "Chỉ cần gõ nhẹ bằng đầu ngón tay, Kisaki đã phát ra âm thanh nũng nịu. Từ đó, chỉ cần duỗi ngón tay ra thôi cũng đủ khiến cơ thể em ấy giật nảy lên."
1557 = "Tinh hoàn của tôi cũng bị cơ thể ép chặt, dù đã bắn ra nhiều tinh dịch đến thế, nhưng vẫn tiếp tục bị vắt kiệt một cách thảm hại."
1560 = "Dù lý trí đã bị thuyết phục, nhưng cơ thể thì không thể nhẫn nhịn thêm được nữa. Để kích thích Kisaki thêm chút nào hay chút đó, tôi càng ra sức ái ân ngọt ngào hơn."
1562 = "Nếu lên tiếng thì sẽ xuất tinh mất. Hiểu rõ điều đó nên tôi nghiến chặt răng, nhưng những tiếng rên rỉ vẫn tự động bật ra từ sâu trong cổ họng."
1564 = "Tôi có thể cảm nhận được tâm trạng của Kisaki đến mức nhói lòng. Nhưng với tư thế này, tôi thậm chí còn không thể trao cho em ấy một nụ hôn."
1565 = "Vì thế tôi thì thầm. Vừa hôn lên tai Kisaki, vừa như mút trọn cả lớp lotion."
1567 = "Vì vậy, tôi muốn bày tỏ lòng biết ơn. Dù những gì tôi có thể làm bây giờ thực sự rất nhỏ bé."
1570 = "Vì vậy Kisaki đã giả vờ như có rất nhiều kiến thức để dẫn dắt tôi. Dẫn dắt tôi một cách khéo léo, khiến tôi đắm chìm vào tình dục."
1580 = "Động tác véo bị cản trở bởi độ trơn trượt của lotion. Dù có cố gắng ấn xuống, đầu nhũ hoa cũng ngay lập tức trượt mất."
1584 = "Nếu chỉ có thể lên đỉnh bằng cách xuất tinh trong, thì tôi muốn xuất tinh trong ngay lập tức. Hai lần, ba lần, hay bốn lần, tôi muốn xuất tinh vào trong âm đạo của Kisaki thỏa thích."
1590 = "Những đầu ngón tay dính đầy lotion, vuốt ve trượt dọc phần cuối dương vật của tôi một cách vô cùng cẩn thận."
1596 = "Bầu ngực trơn trượt mang lại cảm giác mới mẻ và đầy khiêu khích, chính vì thế, nó khiến tôi nhận ra một điều dù đã muộn màng."
1598 = "Dù vậy, khoái cảm mà màn ái ân mang lại thông qua lớp gel, giống như đang đun riu riu tinh dịch trên ngọn lửa nhỏ, tuyệt đối không cho nó sôi trào."
1600 = "Do lotion làm trơn tuột nên sự kích thích và ma sát bị giảm đi. Khoái cảm nửa vời đó cứ từ từ tích tụ lại khắp cơ thể."
1629 = "Không giống với bình thường, Kisaki phấn khích đập chân tung tóe trong bồn tắm ……À không, sai rồi. Đây đúng là một sự quyến rũ rất mang phong cách Kisaki."
1630 = "Kisaki cũng hiểu rằng tôi không còn chút dư dả nào. Thật là một người phụ nữ thông minh và tuyệt vời. Khao khát xuất tinh càng lúc càng dâng trào."
1633 = "Kisaki dừng cử động cơ thể. Chỉ có quy đầu là vẫn bị trêu đùa một cách dai dẳng và trơn tuột."
1634 = "Toàn thân Kisaki ửng lên một màu hồng đào tuyệt đẹp. Sự ham muốn nhục dục xen lẫn sự ngượng ngùng, đang làm cho Kisaki trở nên vô cùng rực rỡ và quyến rũ."
1637 = "Kisaki đột nhiên thốt lên một giọng đầy ngạc nhiên."
1638 = "Vừa vuốt ve đỉnh quy đầu, Kisaki vừa nhẹ nhàng đưa đẩy hông, cọ xát thân dương vật và âm đạo vào nhau, hòa quyện dâm thủy và lotion lại."
1640 = "Hai ngón tay dính đầy lotion, được Kisaki mút mát kỹ càng trong miệng. Những ngón tay dính lotion hòa lẫn nước bọt, lại một lần nữa vuốt ve dương vật của tôi."
1642 = "Cầm lấy một cái chai bán trong suốt, giống như hộp đựng nước sốt, Kisaki bôi chất lỏng bên trong lên khắp cơ thể mình."
1643 = "Mặc dù đã khiến tôi cảm thấy đáng yêu và vui sướng đến nhường này, nhưng giọng điệu của Kisaki lại có vẻ thực sự hối lỗi."
1646 = "Rồi Kisaki ngượng ngùng thì thầm."
1649 = "Ngay cả trong lúc ngập ngừng thở, cửa âm đạo của Kisaki vẫn không ngừng run rẩy. Tôi chợt có một suy nghĩ ngớ ngẩn rằng âm đạo dường như đang hô hấp vậy."
1651 = "Dưới tư thế chắc hẳn là rất khó khăn, Kisaki vẫn cử động hông. Cố gắng nâng âm đạo lên, như muốn nuốt trọn lấy dương vật đang cương cứng của tôi."
1654 = "Dùng hai tay trơn tuột bao bọc lấy quy đầu, giữ nguyên tư thế đó, Kisaki bắt đầu chuyển động mạnh mông và lưng."
1655 = "Kisaki dùng hai tay nhẹ nhàng ái ân quy đầu, đồng thời ấn nghiêng dương vật của tôi xuống. Dương vật cương cứng lún sâu vào khe hở ướt át của Kisaki một cách trơn tuột."
1657 = "Lòng bàn tay phải ướt đẫm của Kisaki bao bọc lấy dương vật đang cương cứng của tôi. Những ngón tay thon dài ngọ nguậy, xoa tròn quanh phần đỉnh quy đầu."
1659 = "Trơn trượt. Lưng của Kisaki, mông, và cả háng nữa."
1661 = "Kisaki mỉm cười. Một nụ cười đầy quyến rũ. Chiếc lưỡi màu hồng thoáng hiện ra, làm ướt đôi môi em."
1663 = "Những ngón tay của Kisaki vẫn một mực trêu đùa quy đầu và hai hòn dái. Cả hai đều khao khát được xuất tinh trong. Nhưng lại đang trêu ngươi lẫn nhau."
1665 = "Trượt từ cổ xuống hai bầu ngực, những ngón tay của Kisaki quấn lấy lớp lotion bao phủ toàn thân em――"
1666 = "Cửa âm đạo của Kisaki run lên bần bật."
1669 = "Ở giữa đôi chân mở rộng, bộ phận sinh dục của Kisaki chạm và cọ xát vào dương vật đang cương cứng của tôi. Cảm giác đó, hoàn toàn khác biệt so với bình thường."
1675 = "Sự co thắt mạnh mẽ từ âm đạo của Kisaki! Từ giọng nói, cơ thể, mùi hương cho đến sức nóng đều đang báo hiệu rằng em ấy sắp ra rồi!"
1676 = "Ranh giới giữa âm đạo của Kisaki và dương vật của tôi đã không còn phân biệt được nữa. Toàn thân nóng rực, nhầy nhụa, và có cảm giác như bị tê liệt."
1677 = "Toàn bộ dương vật cương cứng bị âm đạo của Kisaki siết chặt và vuốt ve ngược lại!!"
1678 = "Âm đạo của Kisaki đã hoàn toàn sẵn sàng. Chỉ chực chờ vắt kiệt tinh dịch, nó phục kích lấy dương vật cương cứng của tôi."
1679 = "Bên trong âm đạo của Kisaki đã ướt sũng và mềm nhũn ra, đến mức lớp lotion trên ngón tay tôi ngay lập tức tan chảy."
1681 = "Kisaki quay lưng về phía tôi, rồi cứ thế nằm lên người tôi. Cơ thể trắng ngần và mùi hương ngọt ngào, áp sát vào nhau không một kẽ hở――"
1684 = "Luôn dư dả thời gian, tràn đầy tự tin. Những hành xử như vậy của Kisaki, lúc nào cũng là điểm tựa cho tôi."
1689 = "Dương vật lại một lần nữa được bao bọc bởi lớp lotion trơn nhớt."
1711 = "Nếu đã nói dối, thì trước mắt đó là một việc xấu. Như một hình phạt, tôi khẽ búng nhẹ vào âm vật của em ấy."
1716 = "Bàn tay ướt đẫm đang bao bọc lấy quy đầu một cách ngọt ngào, lại một lần nữa bắt đầu chuyển động điêu luyện."
1721 = "Tôi đang được nắm chặt hơn lúc nãy. Cảm giác trơn trượt mới mẻ cũng rất tuyệt, nhưng mà――"
1722 = "Lần này, vừa vuốt ve phần đỉnh quy đầu như dỗ dành một đứa trẻ, Kisaki vừa khẽ bật cười khúc khích."
1723 = "Nói cũng đúng thật. Một cú lộn nhào phơi bày cả âm đạo ra ngoài."
1725 = "Tiền đình âm đạo nóng rực và ướt át đến mức như muốn tan chảy quấn lấy thân dương vật. Kisaki đang thủ dâm bằng cơ thể tôi. Nghĩ đến đó, dương vật lại càng cương cứng hơn."
1727 = "Liếm sâu hơn một chút, vị mặn mồ hôi của Kisaki rịn ra, nói là tao nhã thì cũng tao nhã thật, nhưng mà"
1728 = "Dù nói là tắm rửa cho nhau, nhưng với tư thế này. Nơi Kisaki có thể dùng tay để rửa, chỉ có duy nhất một chỗ."
1733 = "Chuyến bay bị hoãn khá lâu. Đến sân bay Fukuoka khi đã quá nửa đêm. Tất nhiên, tôi cũng đã cân nhắc việc gọi Navi đến để cố về nhà."
1737 = "Khi tôi vùi trọn quy đầu vào trong, Kisaki thở hắt ra một hơi đầy nghẹn ngào."
