[script]
1223 = "Ngay sau khi tôi kể lại toàn bộ câu chuyện đã nói với Kisaki, Houshou Mototada thẳng thừng tuyên bố."
1232 = "「Nước thải từ nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; đáp ứng tiêu chuẩn quốc gia. Về mặt pháp lý cũng như bảo vệ môi trường, hoàn toàn không có vấn đề gì.」"
1234 = "……Đáng lẽ đến tìm Kisaki, nhưng ông ấy lại chăm chú lắng nghe tôi nói."
1241 = "「……Không phải là chịu ảnh hưởng lớn―― mà chỉ là quá nhạy cảm với sự thay đổi, có khả năng đó không?」"
1245 = "Vẫn giữ nguyên ánh mắt sắc bén, bác Mototada quay sang Kisaki."
1251 = "「……Trong trường hợp mọi khả năng khác đều đã bị loại trừ. Thậm chí phải kiểm tra từng cử động của nhân viên qua camera an ninh.」"
1253 = "「……Ví dụ như trong công việc ở ngân hàng. Điều em coi trọng nhất là gì?」"
1256 = "「Là mệnh lệnh công việc. Giám đốc chi nhánh.」"
1260 = "（Cộc cộc）"
1499 = "「Không. Bản thân anh ít khi tính nhẩm. Dùng máy tính vẫn chắc chắn hơn.」"
1501 = "「A……ừm…… Không sao đâu, nhỉ?」"
1503 = "「Trái lại, em phản đối việc chỉ biết khư khư tích trữ tiền bạc đấy? Bởi vì em nghĩ tiền chỉ thực sự là tiền khi nó được lưu thông đúng cách.」"
1504 = "「Chẳng phải đã đóng cửa rồi sao? Không có khách hàng, sao lại nhộn nhịp thế này.」"
1508 = "「Em cứ hỏi thoải mái. Nhưng――nếu muốn nói chuyện một cách cởi mở về vấn đề đó thì...」"
1512 = "「Dù quá trình điện tử hóa có tăng lên đến mức nào, thì nghiệp vụ giao dịch tại quầy cũng không bao giờ biến mất.」"
1514 = "「Không, hồi đại học anh có một người bạn giỏi toán―― anh học được từ cậu ấy thôi.」"
1515 = "「Không, ý anh không phải là những bữa ăn sang trọng――mà là những bữa cơm gia đình cơ. Ví dụ như rau củ hầm, rong biển Hijiki chẳng hạn.」"
1524 = "「Cũng không hẳn đâu. Lỗi nhập liệu lọt top 5 nguyên nhân gây ra bất cân xứng đấy.」"
1527 = "「Có qua có lại thôi mà. Chúng ta là cộng đồng chung lợi ích cơ mà.」"
1534 = "「Anh ấy…… anh ấy đã giải quyết xong công việc rồi. Chắc là, tất cả luôn rồi.」"
1539 = "「Một mảnh giấy vụn có thể được lưu thông như một loại tiền tệ, như một vật thay thế cho sức lao động―― đó là vì có niềm tin đặt vào nó đúng không?」"
1540 = "「Lợi ích thì có đấy. Nếu thành phố Ohito suy tàn, thì shochu Kuma, chèo thuyền trên sông Kuma hay đường sắt cũng sẽ lụi bại theo.」"
1543 = "Thứ bị đánh mất. Niềm tự hào, truyền thống――và sự tự tin được xây đắp từ những điều đó."
1544 = "「Nhưng, nằm trong tiêu chuẩn và không gây ảnh hưởng, không phải là một.」"
1547 = "「Nhưng nhân viên giao dịch lại sơ ý trả nhầm thành 82,000 yên. Trong trường hợp này, sẽ thiếu hụt 81,180 yên đúng không?」"
1549 = "（Ồ.）"
1551 = "「Nếu chỉ lấy ra từng cái một, thì có thể là vậy. Nhưng, nếu kết hợp chúng lại, chúng ta có thể tạo ra những giá trị hoàn toàn mới.」"
1557 = "Khoảnh khắc bị áp đảo bởi những lời lẽ mạnh mẽ đó, đã bị phá vỡ bởi một giọng nói lạnh lùng xen vào."
1559 = "「Không, tốt gì chứ.」"
1562 = "「Vừa làm việc á? Cả lúc ăn luôn sao?」"
1563 = "「Em có ăn uống tử tế không đấy?」"
1565 = "「Em vừa nói \"như mọi khi\"…… Em thường xuyên gọi pizza đến vậy sao?」"
1566 = "「Đúng như bác nói. Đó là định hướng cơ bản của chúng cháu.」"
1569 = "「Anh nghĩ ra điều gì rồi sao? Vậy thì.」"
1572 = "「Nào, cứ lấy món mọi người thích đi.」"
1573 = "Nếu thay chữ tiền bằng chữ niềm tin, tôi cảm thấy mình có thể hiểu sâu sắc hơn về giá trị quan của Houshou Kisaki――à, khoan đã."
1579 = "「Chuyện đó……chẳng phải là đương nhiên sao.」"
1581 = "「Nghiệp vụ ngân hàng, sau khi đóng cửa mới là lúc bắt đầu mà.」"
1584 = "Nếu là vậy thì tôi hoàn toàn có thể đồng cảm―― Nghĩ đến đây, tôi chợt thấy xấu hổ về bản thân lúc nãy."
1585 = "「Hả? Cái gì mà ra vậy?」"
1586 = "「Đã rõ. ――Hửm?」"
1587 = "「Ra là vậy.」"
1604 = "「Việc thành phố Ohito bị chia rẽ là điều không nên. Chúng ta cần cố gắng đạt được sự đồng thuận từ càng nhiều người càng tốt――」"
1606 = "「Những lúc không phải ăn uống quây quần cùng mọi người thì vậy. Nếu bớt thời gian ăn uống, thì thời gian rảnh rỗi cho việc khác sẽ tăng lên mà.」"
1609 = "「Hơi tiếc thật. Nếu anh hiểu được nguyên lý của Cửu khứ pháp, thì em giải thích sâu hơn sẽ dễ dàng hơn nhiều.」"
1611 = "「Pizza mà dễ ăn á? Anh thấy nó khó ăn mới đúng……」"
1612 = "「Ây da. Là do cách nói của chị không tốt rồi.」"
1614 = "Bắt đầu từ cổ, giống như có ai đó đang phun sơn vậy. Khuôn mặt Kisaki dần dần, thấy rõ là đang đỏ bừng lên."
1617 = "「Dạ……khi đi ăn ngoài với em, thì thường ăn thức ăn nhanh hoặc ở quán cà phê.」"
1618 = "Tôi không thể nghĩ ra lời phản bác ngay lập tức. Đó quả thực là――một sự thật tàn khốc."
1620 = "「Đúng hơn là―― Cháu cảm thấy việc mời gọi nhà máy không phải là một kế hoạch phục hưng xuất sắc cho lắm.」"
1623 = "（Rầm）"
1624 = "Hibiki tròn mắt ngạc nhiên. Trái ngược với con bé, vẻ nhẹ nhõm bắt đầu lan tỏa trên khuôn mặt Kisaki."
1626 = "「Hả!? Cả mấy ngày trời á?」"
1628 = "「Nhìn thế này thôi chứ em là Giám đốc chi nhánh đấy nhé? Những ngày không có tiệc tùng hay ăn uống xã giao còn ít hơn ấy chứ.」"
1629 = "「Một tờ có thể sử dụng ở khắp mọi nơi trên toàn quốc Hinomoto, còn một tờ thì không ai coi nó là tiền tệ cả.」"
1630 = "Một nụ cười gượng gạo lộ liễu. Và rồi Hibiki liên tục thốt ra những lời lấp liếm."
1633 = "「Nếu mọi người không tin tưởng vào tiền, thì tiền giấy cũng chỉ là những mảnh giấy vụn mà thôi.」"
1634 = "「――Hừm. Có một sự hiểu lầm lớn ở đây.」"
1636 = "Bác Mototada cười nhếch mép, đưa tay vuốt cằm."
1637 = "Một tiếng thở hắt ra từ mũi."
1639 = "Vui mừng vì đã tìm được tiếng nói chung, tôi có hơi vội vàng quá."
1640 = "Chỉ với vài lời. Đã đủ làm lung lay tận gốc rễ những lập luận của chúng tôi."
1641 = "「À――ra là vậy. Vậy nên sau khi đóng cửa mới giải quyết một lượt sao.」"
1643 = "「A……」"
1644 = "「Đúng vậy. Dù chỉ nhượng bộ một bước―― cũng sẽ phá hủy đi niềm tin mà shochu Kuma đã dày công gây dựng bấy lâu nay.」"
1647 = "「Anh không nghĩ em cần phải xin lỗi đâu. Thực tế thì, chúng ta đã có một cuộc thảo luận rất tốt mà.」"
1648 = "Vẻ mặt như thể bị đánh trúng điểm yếu."
1649 = "「À không, không phải. Anh im lặng là vì anh đang có chút thắc mắc.」"
1651 = "「Aha.」"
1652 = "Người đã hành động đúng như toan tính, không chỉ có mình Houshou Mototada."
1653 = "「À, ừm.」"
1655 = "「À, nếu như anh làm phiền cuộc nói chuyện công việc của hai người thì――」"
1656 = "「A, đến rồi kìa.」"
1658 = "「A, vậy thì em xin phép―― lấy phần pizza thập cẩm nhé.」"
1659 = "「Ồ.」"
1660 = "「Hê, anh giỏi tính nhẩm sao?」"
1662 = "「Ừm.」"
1664 = "「Đúng vậy. Không khớp thì ắt phải có nguyên nhân. Nếu không tìm ra được, thì không có tư cách xử lý tiền mặt nữa.」"
1665 = "「Ừm. Nếu không phiền, thì chúng ta cứ ở lại đây.」"
1668 = "「Vâng. Chị đã cho em xem―― Tuyệt lắm ạ.」"
1669 = "「Ừm.」"
1670 = "「À, ra vậy. Tốt nhất là không nên di chuyển nhỉ. Ở những nơi có người ngoài thì……hơi khó nói.」"
1672 = "Hibiki nghiêng đầu vẻ khó hiểu."
1674 = "「Hừm, anh kém tính nhẩm đến thế cơ à.」"
1676 = "「Hửm? Vậy thì, vấn đề đến mức gọi là rắc rối thì――」"
1677 = "「Fufu.」"
1679 = "Một bàn tay trắng ngần, đưa thẳng về phía tôi."
1680 = "「Ồ?」"
1681 = "Ánh mắt nhìn tôi sắc bén lại."
1682 = "「Hê, câu trả lời hay đấy. Hơn cả em mong đợi…… Nói vậy thì hơi thất lễ, nhưng là một câu trả lời rất hay.」"
1687 = "Dường như đã hiểu ra, đôi mắt Hibiki sáng long lanh và mở to."
1688 = "「Ohito là thị trấn của shochu, và cũng là thị trấn của suối nước nóng. Ảnh hưởng từ sự thay đổi của nguồn nước sẽ lớn đến mức đó đấy.」"
1689 = "「A!」"
1694 = "「May quá. Lần này xong sớm nhỉ. ……À, ra là có người để quên tiền mặt ở máy đổi tiền.」"
1695 = "「Sai sót và gian lận lúc nào cũng đi đôi với nhau mà. Thế nên, phải dập tắt nguyên nhân, chặn đứng ngay từ cửa ngõ.」"
1698 = "「Rồi, công việc hôm nay đến đây là xong nhé. Vất vả cho em rồi, Hibiki. Tiếp theo em định làm gì?」"
1700 = "Sao thế này, Hibiki đang phồng má giận dỗi."
1701 = "「Tôi hiểu rồi.」"
1702 = "「Ta mong chờ sự nỗ lực hết mình của con. Đừng làm ta thất vọng đấy nhé?」"
1704 = "「Việc ngăn chặn sự suy tàn của thành phố Ohito không liên quan trực tiếp đến việc mời gọi nhà máy. Chúng cháu tin rằng có những cách khác để phục hưng Ohito.」"
1705 = "「Chuyện đó――」"
1708 = "「Được rồi, chốt vậy đi. Anh gọi món giúp em được không? Cứ như mọi khi, còn lại thì anh xem cân bằng dinh dưỡng nhé.」"
1710 = "「Nếu nguyên nhân không phải do sai số hàng chục hay hàng đơn vị thì sao?」"
1711 = "「Hửm?」"
1713 = "「Nếu em chưa mệt, chúng ta vừa ăn vừa bàn bạc thêm chút nữa được không?」"
1715 = "「Cháu không thể chuẩn bị ngay lúc này được. Nhưng――」"
1719 = "「!」"
1721 = "「Những lúc không tìm ra thì có tìm đến sáng cũng không ra. Trong trường hợp đó, ngày hôm sau, rồi hôm sau nữa vẫn phải tiếp tục tìm nguyên nhân.」"
1723 = "「Kết hợp, nhỉ.」"
1724 = "「Nếu nguyên nhân là do sai số hàng chục hay hàng đơn vị, thì số đó sẽ chia hết cho 9. Ví dụ……xem nào. Giả sử tình huống cần phải trả 820 yên nhé.」"
1726 = "「Vậy thì, Giám đốc chi nhánh Ohito. Việc mời gọi nhà máy cứ để ta lo. Con hãy rút lui khỏi chuyện đó, và tập trung vào phương án khác đi.」"
1729 = "「Anh nhìn nhé? Này, nếu làm thế này――」"
1730 = "「…………」"
1740 = "「Houshou Kisaki, em――」"
1741 = "Nhìn thẳng vào cô ấy, tôi truyền đạt những lời muốn nói một cách trực diện."
1743 = "「Nghe này, Houshou Kisaki.」"
1747 = "「Dứt khoát là tiền sao.」"
1749 = "Một tiếng kêu như thích thú của Kisaki. Trong một khoảnh khắc ngắn ngủi, Houshou Mototada nhíu mày vẻ khó chịu."
1751 = "「Dù vậy vẫn xảy ra. Phần lớn là do lỗi của con người, nhưng thỉnh thoảng máy móc cũng gặp trục trặc.」"
1753 = "「Anh mong rằng chúng ta không chỉ dừng lại ở việc bảo vệ quan điểm của mình, mà có thể có một cuộc thảo luận thực sự mang lại kết quả.」"
1757 = "「Từ phòng này có thể nhìn xuống tầng một. Chị từng cho Hibiki xem rồi nhỉ?」"
1765 = "「Phải triệt tiêu mầm mống gian lận như vậy sao.」"
1768 = "「Dạ? À, không có gì đâu! Không, ưm, không có gì đâu ạ. Em ổn.」"
1769 = "「Làm phiền gì chứ! Làm gì có chuyện――à không, không có chuyện đó đâu ạ. Anh trai.」"
1775 = "「Haha, vậy là cháu muốn nói điều này sao. 『Cháu có một kế hoạch phục hưng Ohito xuất sắc hơn việc mời gọi nhà máy』.」"
1777 = "Dù không có ánh mắt đó, tôi vẫn muốn đối mặt. Tôi muốn thử thách và mài giũa bản thân bằng những lời chỉ trích sắc bén của Houshou Mototada."
1779 = "「Sổ sách và tiền mặt không khớp nhau sao――tệ thật.」"
1783 = "「Ồ.」"
1785 = "「Tất nhiên, chúng ta cũng sẽ nỗ lực làm điều đó. Nhưng nếu hai bên đều không chịu nhượng bộ, thì chỉ còn cách đối đầu thôi.」"
1787 = "Một cái bắt tay ngắn ngủi. Nhưng đầy mạnh mẽ."
1789 = "「Em cũng có cảm giác tương tự. Thế nên em mới muốn nói chuyện. Em muốn biết anh đã nhìn thấy điều gì để đứng ở lập trường phản đối việc mời gọi nhà máy.」"
1791 = "「Thật vậy sao?」"
1792 = "「Mệt thì em cũng không mệt lắm...」"
1793 = "Nói rồi, bác Mototada quay sang tôi. Trong ánh mắt ấy không còn sự sắc bén như lúc nãy nữa."
1796 = "「Nếu vậy……Ohito sẽ đánh mất thương hiệu shochu Kuma. Khoản lợi nhuận bị mất đó――đúng là không thể phớt lờ được.」"
1798 = "「Khoan, khoan, đợi một chút đã―― Hiện tại đang có khách――Hibiki và Soutetsu đang ở đây.」"
1799 = "Chậm rãi, sâu sắc. Kisaki gật đầu."
1800 = "「Dù góc nhìn và những gì chúng ta thấy có vẻ khác nhau, nhưng anh cảm nhận được mong muốn phát triển Ohito của chúng ta là như nhau.」"
1804 = "「Rất tiếc là, hầu như chưa có gì. Ngay cả việc tận dụng 8620――đường sắt như thế nào, cũng chưa được xác định.」"
1805 = "「Bàn bạc công việc chỉ là cái cớ thôi. Chị muốn dành thời gian―― để chúng ta có thể nói chuyện sâu hơn một chút.」"
1809 = "「Ra là vậy. Phiếu mua hàng cũng thế nhỉ. Vì biết là dùng được, vì tin tưởng được nên nó không phải là giấy vụn.」"
1810 = "「Xin lỗi. Tự nhiên anh thấy tò mò thôi.」"
1815 = "「Làm gì có chuyện đó!」"
1816 = "Nếu niềm tin đó bị phá vỡ―― Ví dụ như quốc gia phát hành bị phá sản, thì tiền tệ cũng sẽ sụp đổ."
1820 = "「Đáng tin cậy thật, trăm sự nhờ em nhé.」"
1822 = "「Cửu khứ pháp à. Anh có hay dùng không?」"
1826 = "「Hả!?」"
1828 = "「Chắc là vậy. Anh cũng có lúc phải nhờ ngân hàng xử lý tiền thuế hay tiền bảo hiểm.」"
1830 = "「Nói cách khác, niềm tin vào đơn vị phát hành chính là thứ bảo chứng cho giá trị của tiền tệ sao.」"
1832 = "「Vậy sao―― Cảm ơn anh đã sử dụng dịch vụ.」"
1833 = "Đối đầu với nhau, và kẻ yếu hơn sẽ bị nuốt chửng."
1834 = "「Anh thấy vậy sao? Lúc nào cũng tầm này thôi mà.」"
1835 = "「Đúng vậy, chính xác. Các khoản nợ cần phải được thanh toán chính xác――ối.」"
1838 = "「Em cũng vậy.」"
1844 = "「Nguyên nhân của bất cân xứng phần lớn là do sai số hàng chục hoặc hàng đơn vị, nên nếu chia hết cho 9, trước tiên phải nghi ngờ và kiểm tra lại những chỗ đó.」"
1845 = "「Bất cân xứng?」"
1846 = "「Cân xứng là khi tổng số liệu trên chứng từ khớp với số dư tiền mặt. Không khớp thì gọi là bất cân xứng.」"
1851 = "「Kiểm tra lại chứng từ chuyển khoản, nộp tiền, nếu vẫn không phải thì――á!」"
1852 = "「Hừ.」"
1862 = "「Anh không cần phải xin lỗi đâu. Em rất vui vì được anh quan tâm. Nhưng――thay vì chuyện đó, chúng ta hãy bàn chuyện quan trọng hơn đi.」"
1863 = "「Không sao. Anh không kén chọn đâu. Tùy em quyết định.」"
1864 = "「Anh tin chắc là vậy. Dù không có ảnh hưởng ngay lập tức nhưng dần dần, chắc chắn sẽ xảy ra.」"
1865 = "「Mọi người thường có phản ứng như vậy đấy. Những người không hiểu đúng về giá trị của đồng tiền.」"
1866 = "「Nhạy cảm sao.」"
1867 = "「Một ngân hàng không coi trọng và không bảo vệ nổi một yên―― thì rốt cuộc sẽ có ai muốn sử dụng chứ, anh nghĩ chuyện này cũng tương tự như vậy.」"
1868 = "「Đúng vậy. Không quan trọng số tiền lớn hay nhỏ. Dù chỉ lệch một yên, cũng phải làm rõ nguyên nhân.」"
1878 = "「Để rút ngắn thời gian chờ đợi của những khách hàng như vậy, các loại công việc giấy tờ đành phải gác lại giải quyết sau.」"
1879 = "「Sao anh lại hỏi vậy? Soutetsu, anh là mẹ em hay sao thế?」"
1880 = "「Bởi vì……tờ giấy tiền bối Kisaki viết tay, chỉ là một mảnh giấy vụn có viết chữ một vạn yên――A.」"
1886 = "「À thì――a! Đúng rồi, Rõ ràng bác ấy đến tìm tiền bối Kisaki để nói chuyện mà――hả!?」"
1887 = "「Ta vào được chứ? Có chuyện công việc.」"
1896 = "Kisaki rời mắt khỏi tầng dưới, nhìn thẳng vào tôi."
1899 = "「Chia cho 9?」"
1901 = "「Hãy cho ta xem đi. Bản tính con người cháu.」"
1904 = "「Tất nhiên là không phải rồi. Không phải nhưng mà……ừm――」"
1907 = "「Thắc mắc? Chuyện gì vậy?」"
1911 = "「Khi xảy ra thì phải làm sao?」"
1912 = "Đôi mắt của Houshou Mototada lại nheo lại, quan sát tôi thật kỹ."
1914 = "「Tiếc thật. Hôm nay có vẻ xảy ra bất cân xứng rồi.」"
1916 = "「Nhanh thật đấy.」"
1929 = "「Tiền bối Kisaki, anh Uragami, hai người cũng vất vả rồi. Hôm nay em lại được mọi người giúp đỡ nhiều quá.」"
1931 = "「Soutetsu, cháu có muốn dùng không?」"
1937 = "「Với tư cách là Giám đốc chi nhánh, cháu xin phép được phản đối ý kiến đó.」"
1939 = "「Ồ?」"
1941 = "「Khoan đã……vừa rồi mà gọi là 『sớm』 á?」"
1942 = "「Tóm lại, trong trường hợp sai số hàng chục và sai số hàng đơn vị――ví dụ thay vì 820 yên, lại trả 280 yên, thì số tiền chênh lệch sẽ chia hết cho 9.」"
1943 = "「Rong biển Hijiki!」"
1945 = "「Fufu, vinh hạnh thật.」"
1947 = "「Tư cách xử lý tiền mặt, sao…… Cho dù số tiền không khớp chỉ là một yên?」"
1950 = "「Khi ăn trong phòng này thì khá thường xuyên. Vì nó dễ ăn và giao hàng nhanh.」"
1955 = "「Ra là vậy. Thế thì, chắc em phải bắt đầu khảo sát từ đó thôi nhỉ.」"
1956 = "「Bởi vì anh ấy…… là người như vậy mà.」"
1961 = "Tôi cảm nhận rõ ràng mình đang bị thử thách. Đồng thời, một câu hỏi tự vấn được gieo vào tâm trí tôi."
1965 = "「!」"
1979 = "「Phải tìm ra nguyên nhân. Nếu không thì không thể đóng cửa được. Nên trước tiên, cứ lấy số tiền chênh lệch chia cho 9.」"
1983 = "Kisaki rõ ràng đang dao động."
1984 = "「Nghe vô lý vậy? Soutetsu. Chẳng phải phạm vi quy định được đặt ra để ngăn chặn những ảnh hưởng xấu sao?」"
1985 = "Kisaki mỉm cười đáp lại lời nói đầy vẻ hoài nghi của Hibiki."
1986 = "「Chuyện đó, ừm, Hibiki à」"
1987 = "「Hả?」"
1988 = "「Anh biết.」"
1989 = "「Nếu là vậy thì anh rất hoan nghênh.」"
1990 = "「Vậy sao. Nếu thế thì tôi xin tuân lệnh.」"
1991 = "「Vậy thì, thế nào. Chuyện mời gọi nhà máy, em có thể xem xét lại được không.」"
1992 = "「Anh hai ngây thơ quá! Thế này là trúng kế của ổng rồi còn gì!」"
1994 = "「A――」"
1998 = "「Đừng vội vàng thế, Soutetsu. Chuyện lớn như vậy, một Giám đốc chi nhánh như em làm sao có thể quyết định ngay được.」"
1999 = "「Bố em á? Tò mò chuyện gì cơ――」"
2000 = "「Vậy thì, không có vấn đề gì cả.」"
2002 = "「Vậy để anh sửa lại là 『Trong trường hợp của anh, dùng máy tính chắc chắn hơn』. Nếu tính nhẩm, có lẽ anh sẽ mắc lỗi gấp mười lần lỗi nhập liệu mất.」"
2004 = "「Đếm lại tiền mặt, kiểm tra nội dung chứng từ và nội dung đã nhập. Đối chiếu chứng từ với lịch sử giao dịch của từng thiết bị.」"
2008 = "「Một cuộc chiến――」"
2009 = "「Vậy, chúng ta gọi đồ ăn đến nhé. Xem nào……pizza thì sao? Nếu anh không thích, thì món khác cũng được.」"
2011 = "「Đó là vì anh chưa ăn quen thôi. Có bí quyết cả đấy. Để có thể vừa ăn vừa làm việc.」"
2012 = "「Tất nhiên, mức độ vừa rồi còn chưa được tính là rắc rối đâu.」"
2016 = "「Toàn đồ ăn nhẹ thôi sao.」"
2021 = "「Tiền là……thù lao cho sức lao động. Dùng nó để đổi lấy thù lao từ sức lao động của người khác.」"
2022 = "「Tiền――là.」"
2023 = "「Tiền là……ra vậy. Niềm tin sao.」"
2024 = "「Giá trị của đồng tiền?」"
2035 = "「Ngân hàng mà cũng xảy ra chuyện đó sao? Cả người và máy móc xử lý tiền bạc đều là chuyên nghiệp mà.」"
2036 = "「Ra là vậy――đó chính là, 『giá trị của đồng tiền』 đối với Houshou Kisaki sao.」"
2038 = "「Là tiền. Đó là tất cả của ngân hàng mà.」"
2046 = "「Ồ, nếu cháu có ý tưởng khác thì thú vị đấy.」"
2048 = "「Vì thực tế thì đó là một thỏa thuận tốt. Việc không bị thiệt thòi, chúng ta cũng hoàn toàn giống nhau mà?」"
2050 = "Kisaki gật đầu đồng tình với lời nói hùng hồn của Hibiki. Tôi cũng đồng tình với điều đó."
2052 = "「A.」"
2053 = "「Cháu định từ giờ sẽ chuẩn bị sao? Bằng cách kết hợp suối nước nóng, shochu và cả đường sắt nữa.」"
2054 = "「Soutetsu. Đối với anh, tiền là gì? Trước tiên, anh có thể cho em biết điều đó được không?」"
2055 = "「Ưm……cũng phải.」"
2056 = "Điều đó là đương nhiên. Nhưng tôi vẫn cẩn thận trong cách trả lời."
2057 = "「Cách sử dụng tiền bạc……và con người, sao ạ.」"
2058 = "「Soutetsu?」"
2061 = "「Thực sự là một cảnh tượng khá ấn tượng đấy. Ngân hàng vừa mới đóng cửa, em cũng muốn Soutetsu xem thử.」"
2063 = "Lại một sự thật phũ phàng nữa khó lòng phản bác."
2065 = "「――Ngoạm. Thấy chưa? Vừa làm việc vừa ăn mà không bị rơi vãi chút nào.」"
2067 = "「81180――à, là một số chia hết cho 9 nhỉ.」"
2157 = "「Nhưng, xưởng nấu rượu thì có quan tâm. Nếu nhượng bộ điểm đó, một thứ gì đó rất quan trọng sẽ bị đánh mất.」"
2159 = "Tầng một đang xôn xao. Rất nhiều người đang tập trung lại quanh một chiếc bàn."
2161 = "Kisaki vẫn giữ vẻ mặt điềm nhiên, lặng lẽ nhìn chằm chằm vào Houshou Mototada."
2162 = "「Xin lỗi nhé. Bố em. Ông ấy……là người như vậy đấy.」"
2163 = "Trong một khoảnh khắc ngắn ngủi, chân mày Kisaki nhíu lại rõ rệt."
2170 = "Một khung cảnh hoàn toàn khác với ngân hàng thường ngày―― Một sự hỗn loạn, hay nói đúng hơn là một bầu không khí tràn đầy nhiệt huyết hiện ra trước mắt."
2172 = "「Sao vậy, Hibiki?」"
2173 = "Tôi thực sự ngưỡng mộ cô ấy về nhiều mặt―― nhưng trái ngược với tôi, Hibiki lại thốt lên một giọng kinh ngạc."
2176 = "Không chỉ giận dỗi thôi đâu…… Trông con bé còn có vẻ gì đó hơi đau khổ."
2178 = "Nụ cười trên môi Kisaki ngay lập tức, chuyển sang một vẻ gì đó đầy thách thức."
2180 = "Bị dồn vào chân tường bởi chính lời nói của mình, Hibiki cứng họng, con bé nhìn tôi với ánh mắt cầu cứu."
2181 = "Tôi cũng từng nói chuyện này với Hibiki rồi, sự khác biệt trong \"những gì nhìn thấy\" dẫn đến sự khác biệt trong thái độ."
2190 = "Nếu lấy sự suy giảm chất lượng nước không thể đo đếm được làm cái cớ cho việc giảm sút chất lượng sản phẩm, thì dù có bị đánh giá là sự yếu kém và dựa dẫm của nhà sản xuất cũng đành chịu."
2192 = "Khi ông ấy nhún vai, tôi mới nhận ra đôi vai đó thật vạm vỡ, trái ngược với thân hình mảnh khảnh."
2193 = "Biểu cảm đó có nét gì đó giống Kisaki, khiến tôi có suy nghĩ thảnh thơi rằng “Quả đúng là cha con”."
2195 = "「Nếu vậy thì tất cả đều là di vật của quá khứ. Không thể dẫn đến sự phục hưng của Ohito được đâu.」"
2198 = "Nhưng, em ấy trân trọng điều gì ở Ohito, có lẽ chúng tôi đang có sự khác biệt ở điểm đó."
2200 = "Nhưng Kisaki lại không hiểu điểm đó. Rốt cuộc, tôi nên truyền đạt thế nào đây――"
2210 = "「Kisaki là đứa con gái đáng tự hào của ta. Nó sẽ giúp ích cho việc lập kế hoạch kinh doanh đấy.」"
2211 = "「Vậy thì hãy cạnh tranh xem bên nào ưu việt hơn đi. Một cuộc chiến.」"
2213 = "Một khoảnh khắc im lặng, như thể không biết phải làm sao――"
2214 = "「Ta nghĩ thế này, Soutetsu. Bản tính của một con người, có thể nhìn thấu qua cách họ sử dụng tiền bạc và con người.」"
2218 = "Đó là vì Kisaki là khách VIP của họ chăng――"
2230 = "Ra là vậy. Thì ra―― Ngân hàng, chính là một công việc như thế."
2235 = "Dù là ở cửa hàng rượu……hay bất cứ nơi nào làm việc liên quan đến tiền bạc và sổ sách, thì chuyện này đều có thể xảy ra, nhưng――"
2240 = "Ồ, từ lúc nào mà…… Miếng pizza thập cẩm đã biến mất tiêu rồi."
2245 = "Tôi cứ nghĩ coi trọng hiệu suất là phong cách của Kisaki cơ――"
2248 = "Nhờ cô ấy đi thẳng vào vấn đề chính, tôi cũng lấy lại được tinh thần."
2252 = "Giọng cô ấy hơi trầm xuống, như thể thất vọng vì không đúng như mong đợi."
2254 = "Cô ấy ngạc nhiên lặp lại lời tôi. Rồi Kisaki nhìn tôi chằm chằm như thể đang nhìn một sinh vật lạ."
2256 = "Ở độ tuổi này mà đã là Giám đốc chi nhánh ngân hàng. Hơn nữa, còn có những thành tích được đánh giá là tài năng xuất chúng."
2257 = "「Một khi đằng nào cũng mang lại lợi ích cho ngân hàng, em sẽ toàn tâm toàn ý, dốc hết sức hợp tác với anh.」"
2259 = "Dễ dàng tưởng tượng được rằng đằng sau đó là những nỗ lực phi thường――"
2261 = "「À thì, em chỉ hơi tò mò――chuyện đó――a! Chuyện bác Mototada, bố của tiền bối Kisaki ấy.」"
2263 = "Trả lời ngay lập tức. Không một giây do dự."
2265 = "Cô ấy lẩm bẩm như đang tự nói với chính mình, giọng điệu có chút yếu ớt và vô cùng ngượng ngùng——"
2267 = "Động tác thành thạo đến mức trông như một bức tranh―― Thế nhưng, tôi vẫn không khỏi cảm thấy bất an."
2269 = "Một nụ cười có phần lạnh lùng―― Với ánh mắt như đang dò xét tôi."
2271 = "Một cái cúi đầu và giọng nói tự nhiên――mang lại cảm giác như vậy."
2273 = "「……Bố đang nói với tư cách là Bố, hay là Chủ tịch vậy?」"
2274 = "Kisaki chớp mắt vài lần, rồi từ từ thốt lên bằng một giọng như mất hết sức lực."
2276 = "Lời nói và khí phách của cô ấy khiến tôi bất ngờ."
2278 = "Đôi mắt con bé có chút bất an, khiến tôi cảm thấy phải giải tỏa nỗi lo lắng đó."
2280 = "Cô ấy liếm nhẹ lớp phô mai dính trên đầu ngón tay, rồi dùng khăn giấy lau tay."
2282 = "Kisaki cười khổ, đưa tay vân vê lọn tóc dài của mình."
2285 = "Những tờ tiền giấy ngày hôm qua sẽ biến thành giấy lộn, và chỉ có ngoại tệ, vàng bạc hay đá quý mới có thể đổi lấy một mẩu bánh mì."
2287 = "「Để ta hỏi ngược lại cậu. Shochu Kuma, là loại rượu dễ dàng bị hủy hoại chỉ vì một giọt nước bị vấy bẩn sao?」"
2288 = "「Đúng rồi……nói cách khác, nó gần như là một.」"
2291 = "「Mục tiêu của bác chắc chắn không phải là việc mời gọi nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;. Việc mời gọi nhà máy chỉ là phương tiện để phục hưng Ohito và chấn hưng kinh tế thôi, đúng không ạ.」"
2297 = "「……Đúng như ta đã nói. Nếu là loại rượu vừa rẻ vừa ngon, ta cũng rất sẵn lòng thưởng thức.」"
2298 = "「Nhưng mà, Ohito đang khốn khó. Dù là rượu rẻ tiền, nếu không có nó thì sẽ chết khát mất.」"
2300 = "Cả chúng ta nữa, nếu có thể lập ra một kế hoạch tái thiết ưu việt hơn, thì việc mời gọi nhà máy sẽ bị rút lại――chúng ta đã có được lời hứa hẹn tương đương như vậy."
2302 = "「Tuy nhiên, việc làm ô nhiễm nguồn nước không mang lại lợi ích gì cho chúng cháu. Ngược lại, dù không thấy ngay trước mắt, nhưng rủi ro về lâu dài là rất lớn.」"
2317 = "Tôi bất giác thốt lên."
2321 = "「Thêm vào đó, Houshou Kisaki――còn có được sự giúp đỡ của em nữa. Nếu nói về được mất, anh nghĩ điểm số của chúng ta còn cao hơn đấy.」"
2322 = "Đúng là như vậy, nhưng……"
2323 = "Không biết có phải do cho quá nhiều Tabasco vào pizza không, nhưng tay Kisaki hơi rịn mồ hôi và ẩm ướt."
2325 = "「Nếu có loại rượu vừa rẻ vừa ngon, thì ta cũng muốn nếm thử xem sao.」"
2331 = "Tôi vừa lấy một miếng thập cẩm, Kisaki cũng lập tức lấy một miếng Salami."
2332 = "Tôi vừa hỏi, Kisaki liền mỉm cười."
2333 = "Tôi vừa dứt lời, Kisaki ngước nhìn tôi, ánh mắt dịu lại."
2334 = "Nhân viên của \\x%lエアクラ;#00ffc040;Aircra%l;#;――Tôi liếc nhìn về phía anh Uragami, chắc chắn anh ấy nghe thấy, nhưng biểu cảm không hề thay đổi."
2337 = "「Thế? Cụ thể thì kế hoạch của các anh tiến triển đến đâu rồi?」"
2338 = "Rốt cuộc, một kẻ như tôi, sẽ đối xử với tiền bạc, với con người như thế nào?"
2341 = "「Người mua không quan tâm đến môi trường nước đâu. Tiêu chí để họ quyết định mua chỉ là ngon hay dở, đắt hay rẻ mà thôi.」"
2343 = "Tôi bày tỏ những lời muốn nói cho Hibiki nghe một cách thành thật nhất."
2344 = "Tôi không hỏi Kisaki mà hỏi Hibiki, con bé trả lời với giọng hơi bối rối."
2346 = "「Một yên đối với ngân hàng, cũng giống như một giọt nước sông Kuma đối với xưởng nấu shochu vậy.」"
2349 = "Tôi nhìn sang Hibiki, con bé gật đầu không nói gì."
2351 = "Việc em ấy trân trọng Ohito, tôi thực sự đã cảm nhận được."
2354 = "「Ồ――đến giờ rồi. Một cuộc nói chuyện thú vị. Cảm ơn nhé.」"
2355 = "Trong lúc tôi đang do dự không biết có nên nói ra suy nghĩ đó hay không, thì hộp pizza đã được mở ra nhanh chóng."
2356 = "Tôi trầm ngâm suy nghĩ và sắp xếp lại từ ngữ."
2358 = "Theo lời mời, tôi tiến đến gần cửa sổ và nhìn xuống tầng một."
2360 = "Hoặc cũng có thể do tôi quá cổ hủ chăng――"
2379 = "「Nhưng, thế nhưng――cũng giống nhau thôi. Tờ một vạn yên thật, dù được in ấn đẹp đẽ……thì rốt cuộc cũng chỉ là một mảnh giấy.」"
2382 = "Nghe tiếng Kisaki, Hibiki liền quay mặt lại."
2384 = "Nước quan trọng thế nào đối với shochu…… Hibiki hiểu rõ điều đó từ tận gốc rễ."
2385 = "「Cháu nghĩ những gì bác nói hoàn toàn chính xác.」"
2387 = "Thấy vậy, Kisaki lấy ra một tờ một vạn yên từ trong ví, sau đó viết \"Một vạn yên\" lên một tờ giấy nhớ."
2388 = "Nói đến đó, Hibiki ngập ngừng, rồi nhìn tôi như dò hỏi."
2391 = "「Anh hai――ưm――anh trai. Anh đã biết thế rồi, tại sao còn...」"
2393 = "「Ngân hàng là nơi xử lý niềm tin dưới hình thức tiền bạc. Thế nên, dù chỉ là một yên, cũng không thể làm tổn hại đến nó được.」"
2399 = "Con số tính ra được sẽ bằng với số dư khi chia số ban đầu cho 9, và ngay cả khi loại bỏ các cặp số có tổng bằng 9 như 3 và 6, 4 và 5, kết quả vẫn giống nhau."
2402 = "Kỷ luật, ngăn nắp――chính vì được duy trì tốt, nên mới có được sự nhanh nhẹn như vậy, tôi cảm thấy thế."
2403 = "Suy cho cùng, tiền là vật thay thế để nâng cao sự tiện lợi. Nếu hỏi nó thay thế cho cái gì thì――"
2413 = "Anh Uragami cũng lấy ba miếng pizza thập cẩm, rồi lập tức quay trở lại chỗ ngồi."
2415 = "Anh Uragami cầm điện thoại lên và bắt đầu đặt món ngay lập tức."
2420 = "Rồi sau đó, trên gương mặt Kisaki nở một nụ cười cực kỳ tự nhiên, đúng với lứa tuổi thiếu nữ của mình."
2426 = "Điều đáng lo ngại nhất lúc này, tất nhiên, không phải là chế độ ăn uống của Houshou Kisaki."
2431 = "Thái độ mà Hibiki và Kisaki thể hiện khi làm biển hiệu, cũng đã mang lại cho tôi những cách nhìn nhận mới."
2432 = "Với hiệu suất cao đúng như đã tuyên bố, có vẻ Kisaki đã dùng bữa xong."
2435 = "Thấy động tác quá đỗi quen thuộc đó, tôi bỗng nảy sinh một thắc mắc nhỏ."
2469 = "Một nụ cười hoàn toàn vô tư lự, khiến tôi có cảm giác không giống Kisaki chút nào."
2472 = "Vừa nói, Kisaki vừa tiến lại gần tôi. Đôi mắt cô ấy ánh lên niềm tự hào."
2473 = "Vừa nói, Kisaki vừa gõ nhẹ lên bàn phím, hiển thị con số 820 trên màn hình."
2475 = "Cách nói hơi đùa cợt của Kisaki khiến nụ cười của Hibiki càng thêm rạng rỡ."
2478 = "Kisaki đưa mắt nhìn xuống dưới cửa sổ. Có vẻ như cảnh tượng đó đang diễn ra ngay lúc này."
2480 = "「A……ra vậy. Ra là thế. Ra là thế―― Đó là điều không thể nhượng bộ, nhỉ.」"
2482 = "「Tiền là thù lao cho sức lao động――câu trả lời của Soutetsu chắc chắn là đúng. Nhưng hơn thế nữa, em cho rằng tiền chính là niềm tin.」"
2484 = "Tấm lưng thẳng tắp dường như thể hiện chính thái độ của Kisaki đối với ngành ngân hàng."
2486 = "Như muốn chuyển chủ đề, Kisaki di chuyển chuột thật nhanh, hướng sự chú ý của tôi trở lại con số 820."
2488 = "Không biết là do chất giọng Kumamoto-ben vừa bật ra đã vội kìm lại, hay là do một điều gì khác."
2490 = "Đôi má hơi ửng hồng, cô ấy nhìn tôi rồi lại nhìn bác Mototada bằng ánh mắt bất an."
2491 = "Kisaki ậm ừ với giọng bối rối. Tốc độ nói của cô ấy chậm lại."
2494 = "「Tại sao lại là đương nhiên chứ.」"
2495 = "Tay phải rảnh rỗi điều khiển chuột, cô ấy vừa ăn pizza vừa kiểm tra màn hình máy tính."
2497 = "Kisaki thốt lên vẻ hài lòng, rồi đứng dậy khỏi ghế."
2498 = "Ánh mắt của Kisaki liếc nhẹ sang tôi một cái, rồi ngay lập tức quay trở lại phía Hibiki."
2501 = "Nơi Kisaki đang nhìn, tầng một đã không còn một bóng người."
2503 = "Cảnh ăn uống có phần khác với ấn tượng đoan trang của Kisaki, đã khiến tôi nảy sinh sự tò mò thừa thãi……hay đúng hơn là bao đồng."
2504 = "「Không ai dùng đâu, một ngân hàng như thế. Vậy nên……shochu mà không bảo vệ nổi nguồn nước, thì sẽ không còn ai uống nữa?」"
2506 = "「……Trước mắt thì……tóm lại, hãy để em đưa ra những con số cụ thể. Trong trường hợp đánh mất thương hiệu shochu Kuma――」"
2508 = "「Cả hai tờ này đều là tờ một vạn yên. Một tờ do Ngân hàng Hinomoto phát hành, và một tờ do cá nhân Houshou Kisaki phát hành.」"
2511 = "「Phản đối?」"
2516 = "Một giọng nói rạng rỡ vang lên đến tận đây: 『Khớp rồi!』"
2518 = "Bất ngờ bị gọi tên, Hibiki vội vàng nuốt miếng pizza."
2525 = "Anh Uragami chỉ khẽ cúi đầu đáp lại, rồi ngay lập tức quay lại nhìn màn hình máy tính với vẻ mặt điềm nhiên."
2526 = "Tôi gật gù trước quan điểm về bữa ăn của Kisaki. Nhưng mỗi lần như vậy, một cảm giác khác lạ nhỏ bé lại dâng lên."
2527 = "「Đúng là vậy. Dù kết quả có ra sao, bác Mototada cũng không thiệt thòi. Cho dù chúng ta có lập được kế hoạch tái thiết tốt hay không.」"
2528 = "Cách trả lời quá đỗi rõ ràng, khiến tôi thậm chí còn cảm thấy một sự xúc động kỳ lạ."
2530 = "「T-tiền bối?」"
2538 = "Bị hỏi vặn lại, tôi mới thấy đúng là vậy. Tôi chẳng có tư cách gì để bận tâm đến những chuyện đó."
2557 = "「Nếu chỉ vì không bảo vệ được một giọt nước mà làm giảm hương vị, thì shochu Kuma suy cho cùng cũng chỉ là loại rượu tầm thường thôi.」"
2567 = "Pizza gồm――một chiếc thập cẩm cỡ lớn, và một chiếc nhỏ hơn một chút, phủ đầy xúc xích Salami."
2569 = "Có lẽ đó cũng là một cảnh tượng rất đỗi bình thường trong căn phòng này."
2570 = "「Nếu nhận được sự giúp đỡ của Kisaki, cháu sẽ vô cùng biết ơn ạ.」"
2571 = "「Xin lỗi vì thái độ lúc nãy của anh. Chưa hiểu rõ ý nghĩa thực sự trong lời nói của em, chỉ nghe nói tiền quan trọng, anh đã hiểu lầm em là một kẻ hám tiền.」"
2572 = "「Mượn ví dụ lúc nãy của bác, thì đó là 『loại rượu không ngon nhưng rẻ』. Đại đa số người dân Ohito đều coi việc mời gọi nhà máy là như vậy.」"
2573 = "Như muốn chứng minh lời mình nói, Kisaki khéo léo dùng tay trái gập đôi miếng pizza lại――"
2581 = "「Bố――à không, Chủ tịch!?」"
2597 = "Các nhân viên có vẻ đã bắt đầu mỉm cười và thu dọn đồ đạc ra về."
2598 = "Tôi thì chịu chết, nhưng có vẻ như cô ấy có thể đọc được tất cả những điều đó qua cử chỉ và điệu bộ của các nhân viên."
2599 = "Có thể sự mạnh mẽ được rèn giũa qua đó cũng tốt, nhưng tôi không nghĩ đó là điều Ohito cần lúc này."
2613 = "Cộng tất cả các chữ số cấu thành nên con số đó cho đến khi chỉ còn một chữ số. Ví dụ 35468, thì 3+5+4+6+8=26, 2+6=8."
2625 = "（Những thứ không muốn nhìn thì sẽ không thấy…… Nếu không thì con người chỉ nhìn những gì họ muốn nhìn thôi.）"
2627 = "Nói nặng lời quá, dù là chuyện của người khác nhưng tôi vẫn thấy lo."
2628 = "Đơn phương cắt đứt cuộc nói chuyện, bác Mototada đột ngột rời khỏi phòng y như lúc mới đến."
2631 = "Tiếng gõ cửa thô bạo――như thể đang đập cửa. Vai Kisaki giật nảy lên."
2632 = "（Có vẻ hơi méo mó…… Liệu coi đó là chuyện bình thường thì có ổn không?）"
2635 = "820-280 là dư 540 yên. Ra là vậy, chia hết cho 9."

[selections]
