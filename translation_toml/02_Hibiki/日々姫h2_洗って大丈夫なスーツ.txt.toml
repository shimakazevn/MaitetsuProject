1328 = "Vừa nhăn nhúm, lại còn dính đầy mồ hôi và dịch nhờn nhầy nhụa."
1330 = "Là đang thức, hay là đang ngái ngủ. Dù là thế nào đi nữa, cũng chẳng thay đổi gì."
1332 = "Dù có giặt rồi ủi đi chăng nữa——thì liệu có để lại vết ố không đây?"
1334 = "Mà, nói sao nhỉ——rõ ràng là chuyện trong phòng của chính mình mà..."
1335 = "Không biết là để tìm kiếm khoái cảm từ cô bé, hay là muốn phần cương cứng lòi ra nhiều hơn, Hibiki dồn trọng lượng lên mông, ép mạnh xuống."
1341 = "Hoàn thành xong công việc hôm nay——sự an tâm xen lẫn mệt mỏi ập đến, nên em ấy đã bị cơn buồn ngủ đánh gục rồi."
1343 = "Vậy mà lời nói và cơ thể, lại cứ muốn đòi hỏi nhiều hơn, nhiều hơn nữa vẻ mặt xấu hổ của Hibiki."
1346 = "Chính sự ngắn ngủi đó lại tạo nên một vẻ chân thực kỳ lạ, khiến ngay cả trong mắt tôi, cũng thấy như thể Hibiki đang mọc ra một phần cương cứng vậy."
1370 = "Ra vậy. Đúng rồi."
1376 = "Một nửa phần cương cứng——Để em ấy nuốt trọn đến đó, rồi tôi lại dừng chuyển động."
1378 = "Chỉ cần là mong muốn của Hibiki, tôi sẽ biến nó thành hiện thực."
1379 = "Trên những xấp tài liệu xếp chồng trên bàn, không sót một tờ nào, đều đã được đóng dấu thị trưởng cẩn thận."
1387 = "Vì bị kẹp giữa hai đùi, nên cảm giác nó ngắn đi khá nhiều, nhưng——"
1389 = "Chậm hơn vài giây sau khi tôi xuất tinh, cơ thể Hibiki giật nảy lên run rẩy."
1391 = "Chống lại chuyển động rút ra và bám chặt lấy, yêu cầu tôi bằng toàn bộ sức lực hãy quay trở lại sâu bên trong và xuất tinh đi!"
1392 = "Khoảnh khắc chạm đến nơi sâu nhất, Hibiki ngửa ưỡn người ra sau."
1395 = "Có lẽ em ấy đã dùng loại keo vuốt tóc nào đó, nhưng tôi cũng không ghét cảm giác khi chạm vào."
1401 = "Vừa nói, ánh mắt em ấy lại ánh lên sự bất an."
1403 = "Em ấy dùng ngón tay hứng lấy giọt tinh dịch đang chảy dọc xuống cằm rồi liếm——"
1405 = "Trải đều chất dịch nhầy nhụa đã trào ra lên phần nhẵn thín trơn trượt——"
1407 = "Em ấy khéo léo sử dụng khe mông, cọ xát, ép chặt, kích thích phần đang cương cứng của tôi."
1409 = "Thời điểm trả lời quá hoàn hảo, khiến tôi thoáng nghĩ hay là em ấy cũng tiết kiệm luôn cả ngực rồi——"
1411 = "Và rồi, với lồng ngực và bờ vai đẫm mồ hôi đang thở hổn hển——bằng đôi mắt ướt át, em ấy nhìn chằm chằm vào tôi và chính mình trong chiếc gương lớn."
1413 = "Mông vừa cựa quậy, phần cương cứng đang bị kìm nén cũng được cọ xát một cách ngọt ngào."
1414 = "Thật đáng yêu. Thật vui sướng. Thật đáng thương. Muốn trân trọng em ấy, muốn cưng chiều em ấy hết mực."
1416 = "Cởi cả áo sơ mi, vén cả áo lót lên——rồi kéo tuột cả váy, và quần lót xuống."
1418 = "Từ \"gốc đùi\" mà Hibiki vừa nói, mật dịch trào ra và chảy dọc xuống đùi."
1419 = "Dù đang nói chuyện, mông của Hibiki vẫn không dừng lại."
1422 = "Khe hở giữa hai đùi nảy lên tiếng nhóp nhép của mật dịch, với áp lực từ da thịt mềm mại, siết chặt lấy tôi một cách ngọt ngào!"
1428 = "Cô bé đang run lên vì vui sướng. Cửa tử cung cứ mở ra khép lại, hôn lấy tôi đòi hỏi tinh trùng."
1447 = "Da thịt và dịch nhờn nhầy nhụa sủi bọt lên."
1448 = "Tôi không nghĩ phần cương cứng của mình to đến vậy——nhưng so với cô bé của Hibiki, thì nó lại quá đỗi đáng yêu và nhỏ bé."
1453 = "Nhịp thở, hoàn toàn đồng điệu."
1455 = "Chạm lại từ phía dưới vào bầu ngực đã lộ ra, rõ ràng là kích cỡ đã giảm đi so với lúc mặc quần áo."
1457 = "Dịch hông một chút, tôi chèn phần cương cứng đang cong vút lên vào cô bé của Hibiki."
1458 = "Không muốn nhìn thấy ánh mắt ấy, tôi vắt óc suy nghĩ."
1460 = "Nụ hôn với Hibiki. Lưỡi, nước bọt và đôi môi. Từ nửa thân dưới cho đến tận não tủy, chỉ toàn ngập tràn sự ngọt ngào."
1463 = "Vắt kiệt tinh dịch, và cả sức lực, tôi ôm lấy Hibiki ngã lăn ra phía sau."
1465 = "Vui sướng và xao xuyến, tôi vùi mặt vào mái tóc của Hibiki, chỉ cần có thế——Hibiki đã đáp lại tôi."
1466 = "Vừa ngồi xuống, Hibiki đã mở mắt ra, dụi dụi đầu vào người tôi."
1468 = "Vòng tay từ dưới ngực lên, thử nắn bóp, nhưng, lại không mềm mại như tôi nghĩ."
1469 = "Nhìn một cách khách quan qua gương, tôi mới thấy lời nói của Hibiki là chính xác."
1470 = "Chợt cảm nhận được điều mà mùi hương ấy tượng trưng, tôi bắt đầu ý thức được trái tim, và cả cơ thể của Hibiki."
1473 = "Muốn kết nối với Hibiki nhiều hơn nữa, muốn hòa quyện vào nhau sâu hơn nữa, dục vọng đó, khiến cổ họng tôi khô khốc."
1474 = "Trong vòng tay đang bế bổng, Hibiki khẽ cựa quậy. Chỉ một chút nữa thôi là tôi có thể đặt em ấy nằm xuống giường rồi, vậy mà——"
1477 = "Kìm nén khao khát muốn đâm mạnh vào từ tận đáy lòng."
1479 = "Tôi bế thốc cơ thể Hibiki lên, ôm giữ và đỡ lấy em ấy trong tư thế hai chân dang rộng."
1480 = "Tôi đẩy hông lên, đâm xuyên qua đùi, qua cô bé của Hibiki, và cả vòng tay đang siết chặt của em ấy!"
1483 = "Tôi cao giọng hơn lúc nãy một chút. Nhưng, vẫn không nghe thấy tiếng trả lời."
1484 = "Đặt tay lên mái tóc của Hibiki, tôi từ từ, từ từ vuốt ve."
1486 = "Tinh hoàn bị chèn ép mạnh, tinh dịch vốn đã mấp mé chực trào của tôi, lập tức bị đẩy lên sát đến tận đỉnh!"
1489 = "Vừa dính chặt vào tử cung của Hibiki, tôi vừa thỏa sức xuất tinh."
1491 = "Cảm thấy tất cả những phần đang chạm vào nhau, đều mang tính dục——"
1492 = "Thử chọc nhẹ vào má, em ấy chỉ mỉm cười có vẻ dễ chịu. Hoàn toàn không có dấu hiệu gì là sẽ thức dậy."
1500 = "Và rồi Hibiki, áp trán mình vào trán tôi."
1548 = "Vừa sục, Hibiki vừa ép thân gậy vào đũng quần mình, cọ xát vào cô bé, cùng tôi đưa khoái cảm lên cao."
1550 = "Eo Hibiki xoay tròn."
1552 = "Không chỉ là cô em gái nuôi đáng yêu, Hibiki còn là vợ của tôi——Cảm giác chân thực ấy trào dâng mãnh liệt."
1554 = "Cơ thể Hibiki đang dựa vào tôi, dần trở nên ấm áp."
1556 = "Chuyển động của mông dừng bặt. Đôi má và vùng cổ của Hibiki, đỏ bừng lên thấy rõ."
1559 = "Có phải vì hưng phấn với chính lời nói của mình không."
1561 = "Ưực, cổ họng Hibiki khẽ nuốt nước bọt."
1564 = "Khi Hibiki làm nũng và cọ xát vào tôi, một cảm giác khác lạ truyền đến da thịt."
1565 = "Mái tóc của Hibiki khi làm việc công, hơi cứng một chút."
1566 = "Không biết có phải là muốn xác nhận khoảnh khắc xuất tinh hay không."
1569 = "Hibiki bỗng vùng vẫy quẫy đạp, nhưng tôi không buông ra."
1571 = "Hibiki rơm rớm nước mắt cựa quậy hông trông đáng yêu chết đi được, chính vì thế mà tôi, không thể chịu đựng thêm một giây nào nữa."
1573 = "Đến mức chuyển lại thành giọng phổ thông, có lẽ Hibiki, đang xấu hổ và căng thẳng lắm."
1574 = "Có nghĩa là lập gia đình với Hibiki. Xây dựng một ngôi nhà mới, một mái ấm——và một gia đình."
1577 = "Cảm nhận được sự quằn quại và giật giật không tự chủ ấy, khuôn mặt Hibiki lộ vẻ vui sướng."
1580 = "Tìm kiếm phần đỉnh đang cương cứng của tôi, Hibiki cựa quậy hông, cơ thể khẽ run lên ngọt ngào."
1581 = "Eo Hibiki cựa quậy, cọ xát phần đang cương cứng của tôi và cô bé của em ấy vào nhau, đẩy khoái cảm lên cao."
1583 = "Hibiki hơi nhấc mông lên, dẫn dắt phần đang cương cứng của tôi——ra khỏi quần."
1584 = "Ngón tay của Hibiki vươn tới phần đỉnh đang cương cứng."
1588 = "Bị kẹp chặt giữa hai đùi, thân gậy đang cương cứng của tôi chèn vào cô bé ướt đẫm của Hibiki."
1590 = "Em ấy ngước nhìn tôi với ánh mắt tinh nghịch."
1591 = "Giọng nói say đắm."
1592 = "Chiếc lưỡi của Hibiki, khẽ liếm qua khóe môi."
1595 = "Bàn tay Hibiki di chuyển lên xuống, ra sức sục lấy sục để cậu nhỏ rất ngắn của tôi——của Hibiki."
1596 = "Cô bé của Hibiki cũng đang làm nũng, quằn quại và giật giật."
1599 = "Phụt một cái, mặt Hibiki đỏ bừng lên. Và rồi từ từ, từ từ gật đầu."
1600 = "Mùi hương của Hibiki, cùng mùi nước hoa thoang thoảng, hòa quyện với bầu không khí ngọt ngào trong phòng, tạo nên một cảm giác... chạy dọc từ mũi xuống bụng."
1602 = "Cọ má. Lại hôn."
1603 = "Em ấy nở một nụ cười \"ê hê hê\" rạng rỡ."
1606 = "Những ngón tay của Hibiki, cởi từng chiếc cúc áo vest."
1608 = "Làm nũng, Hibiki cọ sát toàn bộ cơ thể vào người tôi."
1610 = "Niềm hạnh phúc khi tôi và Hibiki hòa quyện vào nhau, lấp đầy trong tôi, mang lại một cảm giác thật phong phú."
1611 = "Giọng nói vui vẻ. Hibiki cựa quậy mông——"
1613 = "Dù là phát thứ hai nhưng tinh dịch còn đặc hơn cả lần đầu, bắn bành bạch vào vách âm đạo của Hibiki."
1619 = "Chẳng cần bất kỳ ám hiệu nào, tôi và Hibiki, chuyển động của hông, nhịp điệu của cơ thể, đang hô ứng lẫn nhau."
1628 = "Cảm giác làn da đẫm mồ hôi mút lấy tay tôi thật dễ chịu. Vừa nói chuyện, tay tôi vẫn không ngừng nắn bóp bầu ngực em ấy."
1637 = "Cứ thế từ từ di chuyển, để mật dịch của Hibiki thoa đều và thấm đẫm lên toàn bộ phần cương cứng."
1639 = "Dù vậy, ánh mắt ấy vẫn không hề lảng tránh, mí mắt cũng không hề cụp xuống."
1640 = "Khoảnh khắc tiếp theo, nụ cười của Hibiki lại biến thành một thứ gì đó ướt át, gợi tình và nóng bỏng."
1646 = "Không chỉ hình ảnh phản chiếu trong gương, mà cả bên trong âm đạo cũng đang nồng nhiệt chào đón tôi."
1647 = "Vừa cắm vào cô bé lại vừa được tay sục phần đỉnh, một khoái cảm như thể lần đầu tiên nếm trải, đang xáo trộn não bộ của tôi."
1648 = "Tư thế này, đang cản trở ý định của Hibiki."
1652 = "Không phải vậy, có lẽ chỉ là em ấy đã độn thêm miếng lót vào áo lót hay gì đó thôi."
1655 = "Trở nên đáng yêu. Đến mức không thể chịu đựng nổi."
1659 = "Đánh thức em ấy dậy thì cũng tội nghiệp, mà ở lại phòng thị trưởng thêm nữa thì cũng chẳng có việc gì làm."
1663 = "Hibiki hứng trọn tinh dịch vào mặt——dù bị vấy bẩn nhầy nhụa, nhưng em ấy, lại mỉm cười đầy hạnh phúc."
1669 = "Những nếp gấp thịt đã rục rịch ngay từ đầu, nhiệt tình mời gọi tôi tiến sâu hơn, và xuất tinh đi."
1671 = "Phần tiếp xúc bị mút chặt, chỉ riêng khoái cảm khi cọ xát và tuột ra thôi cũng đã sướng đến mức muốn xuất tinh rồi."
1673 = "Vừa ấn phần đỉnh cương cứng vào đến tận rãnh khấc, cô bé của Hibiki đã co thắt liên hồi bám chặt lấy tôi."
1686 = "Sự nhấp nhô của âm đạo, chuyển thành sự siết chặt!"
1701 = "Khoảnh khắc nghĩ đến điều đó, nhiệt độ cơ thể tôi cũng tăng vọt."
1705 = "Dù chạm được đến cửa âm đạo, nhưng phần đỉnh đang cương cứng lại trơn tuột và trượt ra ngoài."
1755 = "（Sục——Sục——Sột soạt——Sục）"
1757 = "（Chu, chụt——Sột soạt——Cọ xát——）"
1758 = "（Cốc cốc）"
1759 = "（Sột soạt）"
1760 = "（Nhóp nhép! Chụt! Ngoáy! Sục!）"
1761 = "（Phập!）"
1762 = "（Nhóp nhép! Nhóp nhép! ——Ngoáy!!）"
1763 = "（Phập! ——Bạch!）"
1764 = "（Phụt! Phụt! Phụt! Phụt!）"
1766 = "（Phụt! Phụt! Phụt! Phụt!）"
1770 = "（Giật——Phụt! Phụt! Phụt!）"
1771 = "（Phụt! Phụt! Phụt! Phụt!!）"
1772 = "（Phụt!）"
1773 = "（Ép xuống!）"
1775 = "（Kẹp chặt）"
1779 = "（Ép——Cọ）"
1780 = "（Cọ cọ——Trượt——）"
1782 = "（Ngoáy）"
1786 = "（Ôm thốc lên!!!）"
1787 = "（Trượtttttt!!!）"
1788 = "（Trượt!）"
1789 = "（Nắn nắn——Xoa xoa——）"
1790 = "（Phậ——p）"
1792 = "（Sục!）"
1794 = "（Xoa xoa, xoa xoa）"
1795 = "（Nắn nắn——Xoa xoa——Vê vê——Bóp!）"
1796 = "（Chạm nhẹ）"
1797 = "（Siết chặtttt!）"
1798 = "（Co thắt——Siết chặtttt）"
1804 = "（Đến mức chẳng thèm để ý đến cái gương lớn, Hibiki đã——chỉ luôn nhìn đăm đắm vào mỗi mình tôi thôi sao.）"
1805 = "（Cơ thể của Hibiki... chính mình, đã biến em ấy thành phụ nữ sao.）"
1807 = "（Bạch! Phập! Phập! Phập!）"
1808 = "（Bạch!!!）"
1809 = "（Phập! Sột soạt! Sục! Phập!）"
1810 = "（Quệt——Liếm）"
1812 = "（Tách... Tách——）"
1813 = "（Vỗ nhẹ）"
1816 = "（Ranh giới, giữa thiếu nữ và phụ nữ sao.）"

[selections]
