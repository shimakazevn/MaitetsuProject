1259 = "「Anh hai.」"
1260 = "「Anh hai, và——em...」"
1261 = "「Anh hai——Cậu nhỏ, của anh trai... đang muốn, đi vào... cô bé, của em... thế nên, mới giật giật.」"
1263 = "「Cậu nhỏ... của, anh hai... đang chèn... vào——Phù——A, cô, bé——của em... Ưm.」"
