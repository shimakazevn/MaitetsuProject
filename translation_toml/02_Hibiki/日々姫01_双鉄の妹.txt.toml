2383 = "「Anh lại nói lời ngớ ngẩn rồi. Anh thấy thật xấu hổ về bản thân. Đã không hiểu được cảm xúc của Hibiki——」"
2386 = "「Vâng. Nhưng cháu nghĩ mình cũng được thụ hưởng sự chỉ dạy của chị Mayami. Vì cháu cũng là người được nuôi nấng trong ngôi nhà này mà.」"
