2389 = "「Vâng, cháu là \\x%l機関士;#00ffc040;lái tàu%l;#; của Hachiroku, Migita Soutetsu.」"
2392 = "「Là bàn bạc chi tiết về việc huấn luyện nghiệp vụ trên tàu \\x%l8620;#00ffc040;8620%l;#;.」"
2398 = "「Vậy sao. Cô là Nagayama—— vợ của trụ trì chùa Yurei, tên là Noriko.」"
2399 = "「Vậy sao? Thế thì, đóng học phí đi! Nhớ khuyến mãi thêm đó!」"
2403 = "「Cuốn màu xanh, ở trên cùng——cuốn đó sao.」"
2406 = "「Thang xếp, thang xếp đâu rồi.」"
2412 = "「Cô bảo vừa khéo là sao ạ?」"
2422 = "「Không sao đâu. Anh đang nhìn kỹ để em không bị ngã đây.」"
2423 = "「Đúng rồi. Cô bé Paulette.」"
2424 = "「Đúng vậy. Danh thám tử……cũng không phải bí ẩn gì khó đoán lắm nhỉ.」"
2429 = "「Chị Paulette, tìm anh trai có việc gì vậy?」"
2432 = "「Hơn thế nữa thì, kiểu—— Câu chuyện ngày càng trở nên chuyên môn hóa.」"
2434 = "「S-Sau đó thì! Anh hai——ưm, anh trai.」"
2439 = "「Nguyên liệu sẵn có sao—— Cứ như suất ăn cho nhân viên vậy.」"
2440 = "「Tất nhiên rồi.」"
2445 = "「Hôm nay có vẻ là ngày anh được Nagi dạy bảo nhiều điều nhỉ.」"
2446 = "「Có vẻ như không. Không bồn chồn, không rạo rực, cũng không đổ mồ hôi.」"
2448 = "「Con bé khen ngợi hết lời luôn. Nên cô mới nghĩ làm thành cơm hộp ga tàu chắc cũng ổn.」"
2450 = "「Cho anh xem cái đó thì dù không có gì anh cũng muốn khuyến mãi thêm. Học phí thì để anh trả riêng.」"
2454 = "「C, cái đó, nhìn——nhìn chân, các thứ... Anh hai, thì sao.」"
2455 = "「Quả không hổ danh là em trai của Mayami……à, ơ, xin lỗi. Cậu là con nuôi mà nhỉ.」"
2458 = "「Xin lỗi nhé. Anh đến trễ quá.」"
2460 = "「Bất ngờ ghê! Anh hai, không ngờ cũng hiểu chuyện phết nhỉ.」"
2461 = "「Bất cẩn quá. Phải xác nhận lại với Hibiki mới được.」"
2463 = "「Xấu hổ thật.」"
2465 = "「Tiếc thật. Em không cảm nhận được mấy. Vì tim em cũng đang đập thình thịch mà.」"
2467 = "「Thật không? Để em kiểm tra một chút nhé.」"
2469 = "「Nóng quá đi. Này, Mayami có nhà không? Cô muốn bàn bạc chút chuyện về cơm hộp ga tàu.」"
2474 = "「Đúng là có một số khách hàng vui đến phát khóc luôn đấy? Nhưng mà, những vị khách thông thường thì lại……kiểu……hơi tế nhị?」"
2481 = "「Kisaki á? À, hoàn toàn không. Anh nhớ là cô ấy không hề nói một lời nào về chuyện đó.」"
2483 = "「Chị Kisaki 『không nói gì cả』 đúng không ạ?」"
2484 = "「Giả sử một ngày nào đó, anh đi đúng đường và đi đến tận cùng. Phía sau đích đến đó——anh trai có dự định gì không?」"
2486 = "「Một vố……à, ừ. Vừa rồi hoàn toàn là, bị lừa một vố thật.」"
2488 = "「Cứ làm từng việc một, những việc có thể làm lúc này là được. Chúng ta——rốt cuộc cũng chỉ có thể làm thế thôi.」"
2490 = "「Với lại……nói chuyện trước mặt người khác—— Em nghĩ chắc sẽ xấu hổ lắm.」"
2492 = "「Hơn nữa, bản thân nét vẽ cũng rất xuất sắc. Ví dụ như bao bì của cơm hộp ga tàu chẳng hạn.」"
2495 = "「Ch, chân á? Em, chân——ưm, đang cử động——」"
2496 = "「Nói là có thì…… Chắc là nếu tìm kiếm kỹ lưỡng thì sẽ nhiều đến mức đau đầu luôn nhỉ.」"
2500 = "「Cô Nagayama, vậy ra trước đây cô cũng làm việc cho \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;, mà lại còn ở toa ăn sao?」"
2504 = "「Hình vẽ tàu hỏa xình xịch dễ thương lắm, nên em sẽ giữ lại cả cái chai luôn.」"
2505 = "「Nhớ đỡ cho chắc nhé? Em——rơi xuống đây.」"
2507 = "「Nếu quên những điều đau đớn trước, thì con người sẽ chết dễ dàng lắm. Không hiểu được điều đó, là tâm thế không tốt đâu.」"
2509 = "「Chuyện về cơm hộp ga tàu ạ?」"
2512 = "「Này, Hibiki.」"
2513 = "「Cảm ơn——anh hai.」"
2517 = "「Nếu nỗi đau càng lớn càng khó quên…… thì ký ức cũng thật tàn nhẫn.」"
2527 = "「Chỗ này——có thể lướt qua nhanh được. Còn bên này... a, đồng phục học sinh thời đó sao.」"
2528 = "「Khó thật đấy. Trước tiên phải nhìn thấy hộp cơm Hachikuma thực tế, rồi ăn thử đã. Nếu không thì cả suy luận lẫn ý tưởng đều sẽ trở nên sáo rỗng mất.」"
2529 = "「Học phí cũng chỉ đơn giản là, lời cảm ơn vì em đã cho anh nhận ra điều hay thôi.」"
2530 = "「À.」"
2531 = "「Bái phục thật đấy. Dù biết là vậy, nhưng anh cũng vẫn còn tu luyện chưa đủ.」"
2532 = "「Chai nước này thì học phí vẫn còn dư đấy, nên em sẽ dạy thêm cho anh một bài học khuyến mãi nữa.」"
2533 = "「Em nghĩ trong đó có thứ em đang tìm sao?」"
2534 = "「Chuyện đó, không nghĩ thì không biết sao? Anh hai, cứng đầu quá đấy.」"
2545 = "「Chuyện đó——chỉ vì một tờ \\x%l掛け紙;#00ffc040;giấy gói cơm hộp%l;#;, một hộp cơm mà phải làm đến mức này thì anh thấy thật có lỗi——」"
2547 = "「Chuyện là—— …………………………………………」"
2548 = "「Cái đó... bảo là đến bao giờ, hay là hứa hẹn gì đó... Việc hứa hẹn thì, cái đó, hơi khó ạ.」"
2549 = "「Này. Anh hai. Nếu em trượt chân thì phải đỡ lấy em đó, ư... ư——bên trên! Nhớ nhìn kỹ bên trên, nha?」"
2550 = "「Chuyện là——ưm, Chuyện là thế này, anh trai.」"
2551 = "「Lúc nói về chuyện thế chấp ấy—— lúc anh trai suýt trở thành ứng cử viên thừa kế ngân hàng.」"
2552 = "「Nếu vậy thì em muốn có thêm thật nhiều tư liệu hình ảnh nữa.」"
2555 = "「Vậy thì Hibiki thì sao ạ? Con bé là... của Ohimitera.」"
2557 = "「L, là do anh ha——ưm, do anh trai nói to quá đấy. Tự nhiên lại……bảo là, 『Anh có chuyện quan trọng muốn nói』.」"
2559 = "「N-n-nhưng mà có chuyện gì thế ạ. Anh hai——ưm, ý em là chuyện q-quan trọng mà anh trai nói, là gì vậy ạ?」"
2560 = "「Nếu vậy, xin hãy cho em—— vào phòng gian kế tiếp... căn phòng đó.」"
2562 = "「Đã bảo không phải chuyện đó——Hả? Gì cơ!? A-Anh sẽ chở em á? Cùng với anh hai á?」"
2567 = "「Giấy bọc bên ngoài cơm hộp ga tàu gọi là \\x%l掛け紙;#00ffc040;giấy gói cơm hộp%l;#;. Là \\x%l機関士;#00ffc040;lái tàu%l;#; mà không biết thì có vẻ hơi thiếu chuyên nghiệp đấy nhé?」"
2569 = "「Cơm hộp nhà ga!」"
2573 = "「Những thứ liên quan đến chị Hachiroku và \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; nói chung. Sau đó là cảnh phố xá, đồ ăn thức uống thời kỳ hoàng kim của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;.」"
2576 = "「Anh hai——anh trai cũng... ừm—— suýt chút nữa đã trở thành vật thế chấp rồi còn gì.」"
2577 = "「Anh hai. Này, anh hai!」"
2579 = "「Anh hai——thì, không thấy sao sao à? Bồn chồn, hay là... rạo rực... hay là, cái đó.」"
2580 = "「Cậu Soutetsu, cô nghe đồn cậu bình tĩnh và thông minh lắm. Ở khắp nơi luôn. Nên là, cậu có thể suy luận lý do giúp cô được không.」"
2587 = "「!」"
2588 = "「!!」"
2589 = "「!?」"
2590 = "「Chắc cô ấy đã đánh giá tình hình rồi. Nếu Hachiroku gặp chuyện không may, tôi sẽ không còn là người mà Navi công nhận nữa.」"
2593 = "「Navi ạ? Ơ, nhưng mà.」"
2732 = "Của tôi, hay của Hibiki, nhịp tim ngày càng đập nhanh hơn."
2739 = "Nhưng—— Sự thú vị đó cũng chẳng mấy chốc mà cạn kiệt."
2740 = "Chính vì thế, những lời nói ấy mới có thể chạm đến trái tim tôi lúc bấy giờ, và có lẽ đó là lý do đến tận bây giờ tôi vẫn không thể nào quên. Nhưng——"
2741 = "Nhưng, may thay. Ở đây không có Reina, người sẽ hét toáng lên vì ngạc nhiên."
2742 = "Lấy chồng về chùa Yurei, chắc hẳn cô ấy là một người khá mạnh mẽ."
2743 = "Tuy nhiên, thú thực là sự bẽn lẽn của Hibiki đã cứu tôi một bàn thua trông thấy. Việc đứng nói chuyện với Nagi hay phu nhân Nagayama thì, chà, cũng nằm trong phạm vi tiếp khách."
2744 = "Nhưng, nếu dừng việc dọn dẹp lại để nói chuyện với Hibiki, và lỡ kéo dài ——thì tôi sẽ phạm phải lỗi bỏ bê công việc vì việc riêng mất."
2746 = "Không, kể cả bây giờ, chắc chắn nó vẫn sẽ có ích cho việc bảo dưỡng, kiểm tra, sửa chữa các thứ."
2754 = "Quét dọn sạch sẽ. Chỉ có việc đó thôi mà tôi đang làm lại từ đầu."
2757 = "Thấy một thanh niên đang quét dọn, bèn gật đầu chào—— Mà không nhận được lấy một lời đáp lại, thì ấn tượng sẽ là \"tồi tệ nhất\"."
2760 = "Mặc dù vậy mà em vẫn muốn ngồi \\x%lエアクラ;#00ffc040;Aircra%l;#; loại bay được, điều đó có nghĩa là em thích \\x%lエアクラ;#00ffc040;Aircra%l;#;, kết luận là vậy."
2762 = "Một giọng điệu sảng khoái chẳng có vẻ gì là đang xin lỗi. Đã thế này thì tôi cũng có thể trả lời một cách thẳng thắn."
2772 = "Bị đánh úp bất ngờ đến mức này, tôi hầu như chưa từng trải qua."
2790 = "Khoảnh khắc cơ thể rời nhau, mồ hôi tuôn ra đầm đìa, tôi có cảm giác thân nhiệt giảm xuống mấy độ liền."
2792 = "Hachiroku cũng đã đồng ý với lời giải thích của tôi, thậm chí còn chủ động đề nghị \"Nếu vậy thì tôi cũng xin được giúp một tay\"."
2807 = "Thứ Nagi đang cầm là một chiếc bình đựng rượu lâu năm, có in sáu chữ \"Xưởng rượu Migita Ichishuzou\" màu xanh đen trên nền trắng."
2809 = "Nagi lắc đầu một cách cường điệu, rồi nhẹ nhàng cất bước rời khỏi tôi."
2811 = "Vì là Nagi, nên em ấy mới trêu chọc tôi theo một cách kỳ quặc như vậy, nhưng nếu đó chỉ là một người qua đường thì sao."
2813 = "Nụ cười toe toét đã biến mất trên khuôn mặt Nagi."
2819 = "Mới vừa nói những lời chín chắn khiến tôi nể phục, giờ lại quay ngoắt sang giọng điệu trẻ con."
2820 = "Bị nghe thấy rồi sao. Không, trước đó——tôi đã nói thành lời rồi à."
2821 = "Cảm giác như bị sốt ruột lúc nãy có vẻ như đã tan biến mất rồi."
2825 = "Ra là vậy, còn có lý do đó nữa sao."
2839 = "Trong xưởng rượu, chỉ cần mỗi người cố gắng hoàn thành tốt công việc của mình là được——chỉ vậy thôi."
2842 = "Chỉ cần tôi không nói hớ điều gì, thì Hibiki cũng sẽ không hoảng loạn."
2844 = "Lại có tiếng bước chân. Nếu giờ quay lưng đi vào cửa hàng thì ấn tượng sẽ xấu lắm đây."
2854 = "Trục tung là sự vật, trục hoành là thời đại."
2858 = "Dù là người hoàn toàn không quen biết, tôi cũng không ngần ngại bắt chuyện."
2861 = "A——giống như hồi Paulette, gần như có thể nhìn thấy cả đồ lót."
2863 = "À, đúng rồi. Tôi chỉ vắng mặt lâu nhất cũng tầm 30 phút thôi."
2870 = "Ý định đánh úp gần như tương đương với ác ý. Giữ ý định đó trong lòng mà vẫn che giấu được, quả thực là vô cùng khó khăn."
2873 = "Kết quả của việc cứ mải miết lặp đi lặp lại việc dọn dẹp và chào hỏi, là chẳng còn gì để quét nữa."
2874 = "Bức tranh nào mới là chiếc chìa khóa, bức tranh nào sẽ mở ra cánh cửa dẫn đến đó—— Vì không biết, nên con bé mới dốc toàn lực vào mọi bức tranh."
2876 = "Phía sau một bức tranh, một nét vẽ chứa đựng biết bao cảnh sắc—— Lần đầu tiên trong đời tôi tưởng tượng ra điều đó, và thậm chí còn muốn cúi rạp mình thán phục."
2879 = "Nếu là chuyện liên quan đến cơm hộp ga tàu, thì chắc chắn cô ấy sẽ không để những lời bàn tán làm lu mờ phán đoán của mình……"
2884 = "Con người và cảnh vật trước \\x%l大戦;#00ffc040;Đại chiến%l;#;, tuy khác xa bây giờ, nhưng vẫn có nét gì đó tương đồng."
2886 = "Vừa nói, Hibiki vừa lấy giấy bút ra và bắt đầu ghi chép."
2887 = "Trước đây tôi có nghe nói vì là anh em đang tuổi lớn nên sẽ thấy ngại ngùng—— Nhưng dạo gần đây, tôi cứ tưởng em ấy đã quen rồi chứ."
2890 = "Hibiki hôm nay cũng bộc lộ vô vàn biểu cảm xuất sắc."
2891 = "Con bé dễ dàng rút cuốn sách gáy xanh ra, ôm vào ngực, và rồi——nhìn thẳng xuống tôi."
2895 = "Xách bình rượu, ôm chai nước ngọt, Nagi rời đi."
2896 = "Vẫy tay gọi lại."
2897 = "Nói tiếng phổ thông trôi chảy đến mức này, có lẽ cô ấy lớn lên ở vùng ngoại ô Đế đô."
2901 = "Ngón tay dài và thon thả đến bất ngờ, tôi chợt cảm thán quả không hổ danh là ngón tay của họa sĩ."
2902 = "Lời nói của Nagi không giống em ấy chút nào, rất điềm tĩnh. Sự ngạc nhiên thoáng qua ngay lập tức chuyển thành sự thấu hiểu tĩnh lặng."
2904 = "Khuôn mặt đỏ bừng như con bạch tuộc luộc, toàn thân ướt đẫm mồ hôi, trơn tuột như bạch tuộc vậy."
2905 = "Giọng điệu oán trách——nghe như đang gọi hồn ma vất vưởng ấy. Ra là vậy, Hibiki cũng biết cách tạo bầu không khí gớm nhỉ."
2907 = "Lời nói đã chuyển sang giọng phổ thông. Có vẻ như con bé đã bình tĩnh lại rồi."
2909 = "Nói xong, cô ấy bỏ đi mà không thèm ngoảnh lại."
2910 = "Con bé nói ba lần \"Em biết ngay mà, em biết ngay mà, em biết ngay mà\", rồi từ từ ngồi dậy."
2914 = "Trông giống như điệu bộ nhịn tiểu, nhưng tôi có cảm giác gì đó khác biệt. Nhưng, dù sao đi nữa——"
2917 = "Nếu tìm thấy cuốn này trước khi cải tạo \\x%l8620;#00ffc040;8620%l;#; thì tốt biết mấy——"
2920 = "Dù chỉ là giấy gói cơm hộp, nhưng nếu nó thể hiện mức độ am hiểu về đường sắt thì không thể coi thường được."
2928 = "Chính vì chú ý đến cả hai điều đó, nên tranh của Hibiki mới không bị đơn điệu."
2940 = "Nỗi đau tột cùng luôn song hành với nguy hiểm."
2944 = "Nghe nhận xét về chị Mayami gần giống hệt mình, tôi bỗng thấy có chút thân thiết với phu nhân Nagayama. À mà, đúng rồi."
2945 = "Tôi tự trách mình, và nhận ra từ câu trả lời dội lại."
2959 = "Tôi không hề kém cỏi trong việc dứt khoát như vậy. Chỉ cần chăm chỉ vận động tay chân, đầu óc sẽ nhanh chóng bắt kịp thôi."
2960 = "Tôi chẳng thể nói được lời nào tinh tế cả. Tôi cũng chẳng thể nào biết được nói gì mới là đúng."
2963 = "Tuy là một người trông quen quen mà lại không nhớ rõ—— nhưng chúng tôi đã chào hỏi và trò chuyện vô cùng tự nhiên."
2964 = "Tôi không định giải thích thêm bằng lời. Nhưng Hibiki vẫn không chịu rời mắt khỏi tôi."
2966 = "Quét chổi phải thật tỉ mỉ, cẩn thận. Nếu quét cẩu thả, thì chỉ làm bụi bẩn bay tứ tung thôi——"
2969 = "Tưởng em ấy sẽ uống ngay, nhưng Nagi lại dùng vạt áo lau chai, rồi ôm chặt vào lòng."
2971 = "Đến mức phải dùng đầu suy nghĩ mới hiểu được, tôi vẫn còn coi nhẹ mạng sống đến thế sao."
2973 = "Tại sao Nagi lại ở Xưởng rượu Migita Ichishuzou…… Còn chưa kịp thắc mắc, tay phải của Nagi đã đưa ra câu trả lời."
2974 = "Vừa trả lời là có ở nhà, sẵn tiện việc dọn dẹp cũng đã xong, tôi buột miệng hỏi."
2978 = "Tôi dúi mấy cuốn sách vừa rút ra vào tay Hibiki, khi con bé định chạy đi nhưng chợt khựng lại."
2979 = "Từ vại đựng rượu rót lẻ, tôi rót shochu Kuma vào bình của Nagi, tràn trề lên tận miệng bình."
2981 = "Từ những lời chào hỏi với người quen, tôi cũng nhận lại được nụ cười, lời động viên và nhiều thứ khác."
2982 = "Tôi thành thật nói ra suy nghĩ của mình, Phu nhân Nagayama gật đầu như thán phục, rồi cười."
2984 = "Đưa mắt nhìn về phía vừa nhảy ra, Nagi đang tủm tỉm——không, là cười toe toét."
2987 = "Một chai nhỏ. Tiền thì tất nhiên tôi tự bỏ tiền túi ra."
2988 = "Tôi đặt Hibiki xuống theo lời yêu cầu."
2990 = "Tôi là anh trai nuôi, Hibiki là em gái nuôi. Nếu bàn tay ấy cầu cứu, tôi không có lý do gì để từ chối cả."
2992 = "Tôi sắp xếp logic một cách rành mạch—— Thế nhưng lần này, Hibiki lại tỏ vẻ chán nản."
2993 = "Nhanh hơn cả lúc tôi định hỏi lại, Hibiki đã nhẹ nhàng bồi thêm câu hỏi."
2995 = "Nguy hiểm lắm để anh lấy cho, tôi chưa kịp nói xong thì Hibiki đã trèo lên thang mất rồi."
2997 = "Tôi nhìn lên trên."
2998 = "Tôi, không thể trả lời."
3001 = "Lấy vết thương quá khứ làm cái cớ để mãi dựa dẫm—— Tâm tính đó, chắc chắn tôi vẫn chưa gột rửa được."
3003 = "Cả hai tay tôi cũng ôm đầy sách."
3008 = "Khi tôi hỏi vậy, khuôn mặt phu nhân Nagayama méo xệch thành một nụ cười khổ."
3009 = "Gật gật gật, tôi chỉ biết gật đầu trả lời thay vì nói ra lời vì quá luống cuống."
3010 = "Lần đầu tiên tôi nghe nói đấy. Thấy vẻ mặt ngạc nhiên của tôi, phu nhân Nagayama cũng tỏ ra ngạc nhiên."
3011 = "Dù chưa nghe nội dung là gì, tôi đã đáp ứng ngay lập tức."
3012 = "\"Gian kế tiếp\" trong phòng riêng của tôi, là nơi nhồi nhét di vật của ông Taito——thực chất là một cái nhà kho."
3014 = "Tôi chiều ý ghé sát tai vào, vậy mà Nagi vẫn nói lớn tiếng như mọi khi."
3017 = "Thế nên, tôi chỉ đơn giản là. Nói những lời không khác gì mọi khi."
3032 = "Nếu có suy nghĩ mãi cũng không tìm ra câu trả lời, thì nên làm những việc có thể làm lúc này."
3034 = "Biết rồi thì dễ nói chuyện thôi. Kiến thức và tình yêu dành cho Ohimitera được truyền tải qua tấm bản đồ minh họa đó."
3036 = "Nếu muốn làm ra một \"hộp cơm ga tàu đắt khách\", thì có vẻ nó sẽ giúp ích được phần nào đó."
3038 = "Nếu vậy thì có lẽ ở điểm này, tôi không thể nào \"hiểu\" được Hibiki."
3040 = "Đã bị hỏi như vậy, tôi liền điều hòa nhịp thở, tập trung ý thức vào cơ thể mình."
3042 = "Đã vậy thì tôi chỉ còn cách đỡ từ bên dưới."
3072 = "Hibiki gục mặt xuống. Ngã cái rầm xuống chiếu tatami."
3074 = "Không hiểu sao mặt Hibiki lại đỏ bừng, mồ hôi nhễ nhại, và thở dốc rất mạnh."
3075 = "『Công việc với tư cách là \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;, em sẽ hoàn toàn tuân theo chỉ thị của anh trai』 Hibiki đã nói vậy, và hoàn toàn giao phó mọi chi tiết cho tôi."
3080 = "Hibiki cũng giống tôi sao? Con bé thở dốc, dùng hai tay lau mồ hôi trên mặt——"
3082 = "Hibiki cũng có một nơi mà con bé muốn đến vào một ngày nào đó. Và để đến được đó, con bé đang vẽ tranh."
3083 = "Hibiki đang hỏi điều gì cơ chứ."
3091 = "Lại là Hibiki thường ngày, và tôi thường ngày. Tôi sẽ cố gắng làm một người anh trai nuôi của Hibiki như mọi khi."
3092 = "Hibiki và cuốn sách."
3094 = "Cứ thế trong vòng tay tôi, Hibiki ép bầu ngực vào ngực tôi."
3096 = "Chắc Hibiki cũng đang cố nhớ lại điều đó, con bé cứ liên tục xoa xoa ngón út một cách đầy trân trọng."
3097 = "Đến đó, Hibiki dường như không biết phải nói gì tiếp theo. Đợi mãi mà con bé vẫn không nói tiếp, vậy nên tôi đành nói đỡ."
3100 = "Trước tiếng \"À\" của Hibiki, hai anh em cùng gật đầu với nhau. Chỉ cần vậy thôi, cũng đã quá đủ để giải thích rồi."
3102 = "Nói đến đó, Hibiki nuốt lời vào trong, mặt đỏ bừng lên."
3104 = "Lắc mạnh khuôn mặt đang đỏ bừng rồi hít một hơi thật sâu, Hibiki cuối cùng——nhìn thẳng, nhìn chằm chằm vào tôi."
3106 = "Hibiki thẳng lưng lên cái rụp."
3107 = "Hibiki đặt ngón tay lên môi."
3108 = "Fufufu, tiếng cười phát ra từ tận đáy lòng của Hibiki vang lên."
3109 = "Cựa quậy, đùi trong của Hibiki cử động một cách tinh tế."
3111 = "Những lời của Hibiki đã đi thẳng vào tim tôi."
3113 = "Như thể trạng thái cứng đờ lúc nãy chỉ là ảo giác, Hibiki thoăn thoắt vươn người lên."
3115 = "Khác với sự tuôn trào trôi chảy như mọi khi, Hibiki nói tiếng Kumamoto có phần gượng gạo."
3117 = "Một cách dứt khoát. Hibiki đón nhận lời nói của tôi, rồi bất ngờ thay đổi sắc mặt nghiêm túc."
3118 = "Hibiki ngoan ngoãn lắng nghe toàn bộ câu chuyện về cơm hộp nhà ga, bao gồm cả chuyện bao bì, à không, \\x%l掛け紙;#00ffc040;giấy gói cơm hộp%l;#;."
3120 = "Cười nhẹ một cái như thể nói \"Vâng, đúng vậy\", Hibiki hơi ngước mắt lên——nhìn tôi với vẻ hờn dỗi."
3123 = "Khuôn mặt con bé lộ vẻ nhẹ nhõm. Nhưng ngay sau đó lại lườm tôi với ánh mắt như đang trách móc."
3124 = "Hibiki gật đầu, và nói thêm mà không quay lại."
3125 = "Chắc chắn là cố tình rồi."
3126 = "Là Hibiki."
3128 = "Huống hồ, nếu do chính tay cựu nhân viên toa ăn làm, thì chắc chắn độ ngon sẽ còn tăng lên gấp bội."
3131 = "Trái ngược với người quét dọn chỉ việc cắm cúi quét dọn, công việc của người trông \\x%lもろみ;#00ffc040;cơm rượu%l;#; lại là một công việc phức tạp và tinh tế mang tên quản lý nhiệt độ."
3138 = "Paulette quả thực rất yêu đường sắt. Nhưng, những phán đoán liên quan đến chính quyền thành phố hay kinh doanh của cô ấy còn khắt khe và chính xác hơn cả tôi."
3140 = "Nóng hổi, mềm mại, nhưng chắc chắn đang đẩy ngược lại. Thình thịch, thình thịch, thình thịch, nhịp đập dữ dội truyền đến."
3141 = "Để không phụ sự tin tưởng đó, tôi tuyệt đối không muốn làm việc cẩu thả——tuy nhiên."
3146 = "Hơn nữa, tùy từng lúc, sẽ có thêm các nguyên liệu sẵn có kèm theo."
3147 = "Rồi ưỡn thẳng lưng lên, nhìn chằm chằm vào tôi với khuôn mặt vẫn còn ửng đỏ."
3153 = "Tất nhiên, bây giờ không còn cho thuê hay bán thanh lý nữa, thậm chí số lượng còn tồn tại e là cũng chẳng được bao nhiêu."
3156 = "Chắc hẳn cô ấy rất quý Paulette. Nụ cười dịu dàng ấy khiến tôi nghĩ vậy."
3160 = "Một người thật mạnh mẽ và quyết đoán—— Nhưng lại mang đến cảm giác khá dễ chịu."
3161 = "Đáng tin cậy không cần bàn cãi. Nhưng chính vì đáng tin cậy, nên không muốn dễ dàng dựa dẫm."
3171 = "Quả thực, chỉ khi đứng vững trên mặt đất và bình tâm lại, ta mới có thể lần đầu tiên nhìn thấy con người và cuộc sống của vùng đất đó."
3172 = "Nghe thực đơn thôi, tôi đã thấy món này dù có làm sai cách nào cũng không thể dở được."
3174 = "Tí tách, có thứ gì đó rơi xuống trán tôi. Là mồ hôi sao——vừa nghĩ vậy tôi đã nhận ra sự bất thường."
3182 = "Những dòng chữ nhỏ và chữ lớn nằm san sát nhau."
3186 = "Dù sao thì, cũng không được nóng vội mà phải giải quyết từng việc một. Hơn nữa, tôi đã kéo cả Hachiroku vào chuyện này rồi."
3191 = "Hơn nữa, với chuyện ủng hộ hay phản đối việc mời nhà máy về, có vẻ con bé cũng đang mang trong mình nhiều tâm tư phức tạp và nhạy cảm."
3193 = "Và, nếu để sót lại dù chỉ một chút chỗ bẩn, thì sẽ bị coi là toàn bộ xưởng rượu đang lơ là quản lý."
3196 = "Bị hỏi như vậy, điều duy nhất tôi nhận ra rõ ràng là đối với Hibiki, đích đến không phải là sự kết thúc."
3197 = "Trước giọng nói bất ngờ phát ra ngay sát bên, cơ thể tôi phản xạ tự nhiên, nhảy lùi lại."
3199 = "Đóng nắp bần lại thì rượu bên trong sẽ trào ra, nên trước khi nó rớt xuống sàn, tôi nhanh tay dùng khăn lau sạch."
3208 = "Khi được giao nhiệm vụ quét dọn——tôi chỉ biết di chuyển cây chổi tre một cách máy móc, và Hibiki hồi nhỏ đã nhắc nhở tôi bằng giọng run rẩy."
3210 = "Ứng cử viên thừa kế, chưa ai nói đến mức đó cả."
3212 = "Nếu lũ mèo nhanh chóng quên đi ký ức bị cháy đuôi ở lò sưởi, thì tất cả mèo trên đời này đều sẽ lủng lẳng cái đuôi cháy đen thui."
3223 = "Đang nói dở, Hibiki chợt hướng ánh mắt ra ngoài cửa sổ."
3238 = "Đó cũng là cái gọi là thuật ngữ đường sắt sao."
3239 = "Thế thì không được. Hibiki khác với Hachiroku, con bé không phải là sở hữu của tôi."
3240 = "Thật đáng nể. Tôi đành phải đánh giá lại năng lực của Nagi lên một mức cao hơn nữa."
3241 = "Cái này, ừm. Khá là tốt đấy. Cứ tiếp tục thử xem sao."
3242 = "Lần này, ánh mắt con bé có chút nũng nịu."
3243 = "Đó là lời của tôi. Không thể lẫn vào đâu được."
3244 = "Dù là anh trai nuôi, nhưng đây là lần đầu tiên tôi nghe thấy tiếng cười như vậy."
3245 = "Nghe được một điều thật đáng mừng. Kể lại cho Hibiki chắc em ấy sẽ vui lắm đây."
3246 = "Chẳng thể nghĩ ra được một cái ví von nào tử tế hơn. Tôi cũng... hoàn toàn không hề bình tĩnh."
3249 = "Có vẻ không có việc gì ở cửa hàng, họ chỉ đi ngang qua thôi—— Nhưng khi đi lướt qua, họ vẫn khẽ gật đầu đáp lễ."
3251 = "Bằng những bước chạy vội vã, đến mức khiến tôi lo lắng không biết chai nước ngọt bị lắc cỡ đó liệu có trào bọt ra không."
3254 = "Vậy thì cũng chẳng có gì phải lo lắng. Việc ai nấy làm, tôi là tôi."
3255 = "Vậy thì đành chịu. Để tránh gây hiểu lầm, tôi sẽ cẩn thận chọn lọc từ ngữ để truyền đạt."
3258 = "Lẽ ra chỉ là chuyện vào ngân hàng làm việc, và học hỏi về quản lý kinh doanh thôi chứ."
3265 = "Cộng lại cũng chẳng nặng bao nhiêu, nhưng tôi vẫn toát mồ hôi lạnh."
3266 = "Đôi mắt tuyệt vọng kìm nén những giọt nước mắt ấy, dù chẳng giống chút nào, nhưng không hiểu sao, lại khiến tôi nhớ đến đôi mắt của Michiko……Cảm giác tội lỗi, thật đau đớn."
3267 = "Không biết là đối với chuyện gì, nhưng Hibiki đang tràn đầy khí thế."
3268 = "Tôi hoàn toàn không nhớ đã nói với Hibiki vào lúc nào, ở đâu và như thế nào——"
3269 = "Dù thừa nhận là không thể đo lường được, nhưng Hibiki vẫn ép ngực——vào ngực tôi không chịu rời."
3270 = "Mặc dù đã lục lọi vài lần, nhưng tôi vẫn chưa dọn dẹp lại."
3271 = "Chữ nhỏ thì hơi khó nhìn, nhưng nếu nheo mắt lại——a, ừm, đọc được."
3287 = "（Đến... ga cuối. ——Rồi sao nữa）"
3290 = "（……Đây cũng là để hiểu sâu hơn về Ohimitera mà.）"
3310 = "（Vừa dọn dẹp, vừa để tâm một chút đến xung quanh. Chỉ vậy thôi mà thế giới dường như rộng mở hơn phần nào.）"
3312 = "（Không... đây là, nhịp tim của tôi sao?）"
3314 = "（Tuy nói vậy, nhưng việc dọn dẹp này, cũng đâu mang lại thành quả trực tiếp nào đâu chứ.）"
3315 = "（Không, tôi mới là bạch tuộc! Không nghĩ ra được cái ví von nào tử tế hơn sao）"
3319 = "（Nhưng mà……tôi, người ít nhiều lớn lên ở xưởng rượu, lại làm người quét dọn, còn Hachiroku, dù là học việc nhưng lại làm người trông \\x%lもろみ;#00ffc040;cơm rượu%l;#; ngay từ đầu sao.）"
3323 = "（A, người đã dạy tôi điều này—— là Hibiki nhỉ.）"
3325 = "（Thình thịch, thình thịch, thình thịch, thình thịch）"
3326 = "（Phịch）"
3328 = "（Mà, vì đó là chỉ thị của chị Mayami mà. Năng lực và sự phù hợp của Hachiroku, có lẽ đã ở mức độ gần với một người thợ lành nghề rồi.）"
3331 = "（Rõ ràng là đang sợ hãi đến mức như sắp khóc…… Vậy mà Hibiki vẫn ngước nhìn tôi, một người gần như mới gặp lần đầu——）"
3333 = "（Xột）"
3334 = "（Xoẹt, xoẹt, xoẹt）"
3337 = "（Mềm xèo）"
3340 = "（Vậy ra tất cả các bức tranh... Hibiki đều vẽ theo cách đó sao——）"

[selections]
