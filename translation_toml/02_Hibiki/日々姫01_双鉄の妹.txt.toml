2195 = "「Chuyện là, thế này. Anh trai.」"
2197 = "「A, vậy thì đỡ quá. Sẽ không ảnh hưởng đến việc của xưởng rượu, mà huấn luyện từ tối thì tắm rửa cũng tiện hơn——」"
2198 = "「A, cậu Soutetsu. Chào buổi sáng. Chăm chỉ dọn dẹp đáng khen thật. Cẩn thận trời nóng nhé, cố gắng lên.」"
2200 = "「E-Em! Hibiki——làm trò gì vậy!?」"
2201 = "「Nya!? S-Sao anh lại rút ra kết luận như thế chứ!?」"
2203 = "「A……không, không phải chuyện đó——」"
2208 = "「Ừ. Bán thì bán hết đấy. Hết sạch sành sanh trong chớp mắt. Hiệu ứng SL, nhờ ơn \\x%l8620;#00ffc040;8620%l;#; cả đấy——nhưng mà nhé.」"
2212 = "「Vâng. Tất nhiên là vậy rồi. Với lại——」"
2213 = "「Ừm. Dù có thể sẽ hơi chật chội một chút.」"
2214 = "「Ừm.」"
2216 = "「Vâng, nếu bọn cháu giúp được thì rất sẵn lòng. Mà, chị Mayami thì sao ạ?」"
2217 = "「Vâng, hoàn toàn chưa ạ.」"
2220 = "「Ừm. Ngay lúc này đây. Đang cử động với vẻ vô cùng bồn chồn... rạo rực.」"
2222 = "「Vâng, nóng lắm ạ. Ơ, oa! Anh Soutetsu. Anh đang dọn dẹp ạ? Reina cũng thích dọn dẹp lắm đó nha~」"
2223 = "「Ừ, cơm hộp ga tàu——mà, ơ, cậu! Cậu là người làm \\x%l機関士;#00ffc040;lái tàu%l;#; cho Hachiroku đúng không?」"
2227 = "「Hửm?」"
2229 = "「Hửm? Khoan đã——bình tĩnh nghĩ lại thì, có phải mình đã tự ý kéo Hibiki vào chuyện này không?」"
2230 = "「Hứ hừm, ngon lành cành đào! Cuối cùng cũng lừa được anh hai một vố rồi nhé!」"
2232 = "「À.」"
2234 = "「Oaaa, đầy ắp luôn kìa. Đúng là khuyến mãi sộp quá nha!」"
2236 = "「Ô, cậu ấm nhà Migita. Chào buổi sáng. Cô Mayami có nhà không?」"
2237 = "「Trước khi tu luyện, phải có tâm thế đã.」"
2243 = "「Tuyệt quá, nước ngọt có ga hơi nước này!」"
2244 = "「Cô ấy nhớ lúc trong xưởng rượu, anh đã bắt chuyện với Hibiki. Cô ấy còn bảo 『Để Hibiki phải đợi thì tội nghiệp lắm』.」"
2246 = "「V, vâng!」"
2247 = "「Gớm quá đi! Bị gọi là cô giáo này nọ, em không thích đâu.」"
2249 = "「Hoan nghênh! Chật chội cũng hoan nghênh luôn! Mà phải hứa nhé! Ngoắc tay đi!!」"
2252 = "「Để dành khi nào ý tưởng của mấy đứa không xài được. Con bé đó ấy à, cứ để làm bảo bối giấu kín thì yên tâm hơn.」"
2254 = "「Có lỗi thì không được ngần ngại sửa chữa. Vậy thì, thà rằng mình chủ động chào hỏi trước xem sao.」"
2259 = "「Tập trung quét dọn thì tốt đấy, nhưng không thèm chào hỏi ai thì không được đâu!」"
2260 = "「Xin lỗi anh hai. Em lỡ nói mấy lời hơi xấu tính mất rồi.」"
2261 = "「Đúng rồi. Trước tiên phải bắt đầu từ chuyện quan trọng đó đã.」"
2262 = "「Lúc anh đang rảnh rỗi không biết làm gì, thì Hachiroku đã nói. 『Chuyện này sẽ còn kéo dài lắm. Ngài hãy về trước đi ạ』.」"
2265 = "「Thế này nhé? Cơm hộp ga tàu ở buổi triển lãm hôm nọ, đánh giá không được tốt cho lắm.」"
2267 = "「Chỉ vậy thôi! Vậy thì——á!」"
2269 = "「Triển lãm——? Ở triển lãm có bán cơm hộp ga tàu sao?」"
2275 = "「Chùa Yurei ạ.」"
2276 = "「Hầu như chẳng ai đánh giá anh là người hiểu chuyện đâu. Khuyến mãi chỉ đơn thuần là tấm lòng biết ơn dành cho khách quen lâu năm thôi——」"
2287 = "「Gì chứ, trông em có vẻ bất mãn quá nhỉ. A, đúng rồi. Vậy thì để anh chở em nhé.」"
2288 = "「Sao vậy? Em vẫn còn lo lắng chuyện gì à?」"
2289 = "「Thế nào? Lần này anh đã thấy tim đập thình thịch chưa?」"
2290 = "「Sao thế, tự dưng lại.」"
2294 = "「Giám đốc là của Đường sắt Ohimitera ạ? Hinai——」"
2296 = "「Cảm ơn cô đã chỉ giáo.」"
2298 = "「Em——tới giới hạn rồi. Cho em xuống đi.」"
2303 = "「Anh sẽ giúp. Thứ cần tìm là những món liên quan đến 8620 và Hachiroku. Không sai chứ?」"
2304 = "「Tìm sách thôi nào? Không nhanh lên là chị Hachiroku về tới bây giờ.」"
2305 = "「Điều đã quyết định là, thời gian huấn luyện sẽ vào buổi tối. Chỉ là vào khoảng thời gian sau khi xưởng rượu đóng cửa thôi.」"
2307 = "「Anh á?」"
2308 = "「Cô sẽ theo lịch của bên cậu. Vậy nhé. Gặp lại sau nha~」"
2312 = "「Là suất cơm Hachikuma đặc chế của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;. Cô đã thử làm thành cơm hộp ga tàu đấy.」"
2315 = "「Em hiểu rồi. Em làm được rồi. Em chẳng hề——chiếm ưu thế chút nào cả.」"
2316 = "「Cháu nghĩ là không có chuyện đó đâu. Vì cháu cũng có mặt ở đó gần như toàn bộ thời gian mà——」"
2318 = "「Này? Anh đọc được chữ kia không? Cái gáy sách màu xanh, ở trên cùng ấy.」"
2321 = "「Hoặc là đưa ra ý tưởng. Cũng không nhất thiết phải bám vào món Hachikuma. Tóm lại là cô muốn có gợi ý để làm ra một hộp cơm ga tàu đắt khách.」"
2323 = "「Vì vậy anh trai này. Em muốn anh giúp một chút.」"
2325 = "「Em cũng chỉ đang làm điều tương tự thôi. Vì em là em gái của anh trai mà.」"
2327 = "「Do đó, vật thế chấp sẽ không bị xử lý trước thời hạn trả nợ. Navi lúc nào cũng có thể chở anh và em mà?」"
2333 = "「Làm gì có chuyện đó.」"
2347 = "「Thế chấp là vật phẩm sẽ bị mang đi xử lý để bù đắp thay thế khi không thể trả được nợ.」"
2357 = "「Hibiki cũng thích bản thân \\x%lエアクラ;#00ffc040;Aircra%l;#; nhỉ.」"
2359 = "「Hibiki, đừng có cử động chân lung tung. Không giữ chắc ba điểm là nguy hiểm lắm đấy.」"
2362 = "「Hibiki? Em sao vậy?」"
2366 = "「Chào buổi sáng. Trời vẫn còn nóng nhỉ.」"
2368 = "「V... Vậy, sao. Anh hai——đang nhìn... rất kỹ.」"
2375 = "「Đúng vậy. Dù cô ấy cũng không tỏ ý tán thành.」"
