2067 = "「Tóm lại, những thứ liên quan đến \\x%l8620;#00ffc040;8620%l;#; và Hachiroku thì không giới hạn thời gian. Còn những thứ thuộc thời đại của Hachiroku thì cứ tìm kiếm không giới hạn phạm vi là được chứ gì.」"
2069 = "「Nói cách khác, cơm hộp ga tàu đã bán hết với tốc độ chóng mặt đúng không ạ?」"
2070 = "「Nói cách khác, chị ấy không phản đối cũng không từ chối.」"
2074 = "「Em cũng muốn có tư liệu về phòng ốc, trang phục của người thời đó, nếu có toàn bộ những thứ liên quan đến nhà ga hay đường sắt thì tốt quá.」"
2075 = "「Cứ giao cho anh.」"
2079 = "「Sao với trăng gì, trước đây em từng nói mà, 『Em không thích Navi cho lắm』.」"
2080 = "「Cái gì!? Oa——oáaa!!!?」"
2084 = "「Nhưng mà, em nhất định sẽ làm cho anh trai hiểu. Thế nào là bồn chồn, thế nào là rạo rực, chắc chắn luôn.」"
2088 = "「Em quen phu nhân ấy à? Vậy thì nói chuyện nhanh thôi.」"
2089 = "「Anh nói gì vậy, anh trai. Người nhờ anh ưu tiên công việc là em mà?」"
2092 = "「Ngay sau khi dọn dẹp xong, anh đi cùng Hachiroku—— là đến cửa hàng đường sắt sao?」"
2094 = "「Toàn được chỉ dạy những điều hay lẽ phải thôi. Thật không biết dùng lời nào để cảm ơn cô giáo Nagi đây.」"
2096 = "「Định đánh úp và đã đánh úp thành công sao——」"
2097 = "「Trực giác tốt đấy. Hoàn toàn chính xác. Cơm Hachikuma, vốn có nguồn gốc từ suất ăn cho nhân viên trong nhà bếp toa ăn của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; cũ mà.」"
2102 = "「Anh có, hiểu được không? Cảm xúc của em.」"
2104 = "「Em mang về à?」"
2109 = "「Hachiroku lúc về thì sao ạ? Anh không đi đón sao?」"
2115 = "「Suy luận ạ?」"
2119 = "「Toa ăn của \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; cũ ạ.」"
2122 = "「Ra là vậy. Nếu chia cắt từng thời đại, sẽ thấy được rất nhiều thứ.」"
2123 = "「À.」"
2124 = "「Mua rượu rót lẻ à.」"
