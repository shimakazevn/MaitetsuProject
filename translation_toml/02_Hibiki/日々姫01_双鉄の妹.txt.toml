[script]
77 = "Thời gian hoạt động của dòng \\x%l8620;#00ffc040;8620%l;#; dài đến kinh ngạc, nhưng thời kỳ hoàng kim của nó, quả nhiên là ngay trước \\x%l大戦;#00ffc040;Đại chiến%l;#;."
1719 = "——Ừm, bình thường. Hô hấp, nhịp tim, thân nhiệt, tuyến mồ hôi, không có gì bất thường cả."
1726 = "Về chuyện \"rồi sao nữa\", tôi chưa từng, cho đến tận bây giờ, dù chỉ một lần, nghĩ đến."
1730 = "Nếu vậy thì không lẽ nào, tôi bắt đầu tò mò."
1733 = "……Đã bao nhiêu năm rồi tôi mới lại ngoắc tay thề ước với Hibiki thế này nhỉ."
1736 = "……Chuyện hồi mới được nhận nuôi, thú thực, tôi không nhớ rõ lắm."
1740 = "……Lẫn trong tiếng chổi tre quét trên mặt đất, chẳng mấy chốc, một tiếng bước chân thong thả tiến lại gần."
1742 = "……Tôi nhận ra. Hibiki hoàn toàn, không hề bình tĩnh chút nào."
1749 = "……Cơm Hachikuma là món, cơm trắng phủ bắp cải thái sợi, bên trên là trứng ốp la thịt xông khói."
1756 = "「\\x%l掛け紙;#00ffc040;Giấy gói cơm hộp%l;#;」"
1760 = "「——Không chỉ thiết kế \\x%l掛け紙;#00ffc040;giấy gói cơm hộp%l;#;, mà còn cả phần nhân bên trong cơm hộp nữa đúng không? Chuyện anh được nhờ ấy.」"
1765 = "「『Anh không biết con đường nào mới là chính xác』」"
1766 = "「『Thế nên, cho đến khi con đường đó được chứng minh là sai lầm. 　Anh không còn cách nào khác ngoài việc tin rằng con đường mình đang đi là đúng và dốc sức bước tiếp』」"
1768 = "「…………」"
1769 = "「……」"
1778 = "「……Là chuyện của phu nhân chùa Yuurei đúng không ạ~」"
1780 = "「……Vâng.」"
1782 = "「……Em chỉ nghĩ là, em cũng muốn được như thế thôi. Muốn trở thành người——được Navi đưa về.」"
1784 = "「……Nếu là chuyện đó thì em thấy cũng hợp lý đấy ạ. Em cũng đối với chị Hachiroku và mọi người——」"
1785 = "「……Bán hết ngay lập tức mà giọng điệu của cô có vẻ không vui lắm nhỉ.」"
1787 = "「……Anh hai rốt cuộc đến mức nào——」"
1789 = "「『Đường sắt Hoàng gia Hinomoto, Tập bản vẽ thiết kế đầu máy hơi nước』」"
2043 = "「『Ai nói dối sẽ phải nuốt một nghìn cây kim』」"
2046 = "「Không quên những điều đau đớn, là để sống sót đó.」"
2049 = "「Vì cần nên mới tìm đúng không? Trước tiên cứ mang đống tư liệu này ra ngoài đã.」"
2051 = "「Không cần đâu. Navi sẽ đưa cô ấy về.」"
2053 = "「『Đã ngoắc tay』」"
2056 = "「Không. Người giỏi là em mới đúng.」"
2057 = "「Không có gì đâu——à, cô làm phiền cậu dọn dẹp rồi nhỉ. Xin lỗi nhé. Về thời gian, lần tới cậu bàn bạc với giám đốc nhé?」"
2060 = "「Không, chỉ vậy là đủ rồi.」"
