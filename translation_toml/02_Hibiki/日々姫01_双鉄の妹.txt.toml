2131 = "「Lại đoán đúng rồi. Kể chuyện hồi làm ở toa ăn xong ấy mà? Giám đốc cứ hào hứng bảo muốn ăn thử cơm Hachikuma.」"
2135 = "「Được thôi. Nào, 『Ngoắc tay thề ước』」"
2140 = "「Ưm. Em nghĩ đây là cơ hội tốt, em hỏi được không ạ? Một lần nữa, về chuyện thế chấp.」"
2142 = "「Phù.」"
2144 = "「Với Paulette ạ? Cháu hiểu rồi.」"
