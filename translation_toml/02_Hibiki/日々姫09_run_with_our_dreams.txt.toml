1364 = "……Sau tiếng cạn ly, mọi người lần lượt uống cạn ly của mình. Tiếng xôn xao, náo nhiệt. Tôi nghĩ đó chính là “Con người”."
1367 = "……Tôi không biết phép tắc sử dụng khăn cài túi ngực là thế nào, nhưng nếu làm thế này là sai, thì tôi cũng sẵn lòng vi phạm."
1369 = "……Trông em ấy như muốn nói điều gì đó, nhưng dù cố gắng thế nào, lời nói vẫn không thể thốt ra khỏi cổ họng."
1380 = "「『Đối tác làm ăn không thể dứt bỏ』……sao.」"
1391 = "「……Nếu có thể xây dựng mối quan hệ tốt đẹp với họ, thì có thể giảm thiểu những rủi ro trong tương lai, cũng như gánh nặng cho Hibiki sao.」"
1393 = "「……Vậy thì, đúng là không ai có thể bước vào được rồi.」"
1394 = "「……Tuy là bộ tuxedo anh hoàn toàn không quen mặc. Nhưng nếu Hibiki thích thì anh cũng vui.」"
1631 = "「Gia đình.」"
1633 = "「Không――Tạm gác lại chuyện tất cả cùng vào, chị cũng tán thành ý kiến của Nagi.」"
1635 = "「A không. Đi thì anh sẽ đi, nhưng vẫn còn sớm. Anh đứng đây thế này, là vì còn một lý do nữa.」"
1637 = "「Không đâu, rất phù hợp với lễ cưới trước mặt mọi người đấy chứ. Đó là một khoảnh khắc rất ấm áp mà.」"
1638 = "「Không phải là trông như thể đâu nhé? Mikuro.」"
1640 = "「Nhưng mà anh hai, sao phải đi Navi vòng vèo thế để đến Yui làm gì? Đằng nào cũng phải nghỉ lại một đêm rồi mới lên tàu mà.」"
1644 = "「Mở ra và mở rộng thế giới cho em. Khỏi nỗi sợ hãi khi thế giới mở rộng, anh hai quả nhiên, lúc nào cũng bảo vệ em.」"
1645 = "「Cạn ly.」"
1660 = "「Họ coi trọng và muốn bảo vệ Hibiki cùng chị Mayami. Có lẽ ban đầu suy nghĩ đó đã đi quá giới hạn, nên mới dẫn đến hành động loại bỏ ngài.」"
1664 = "「Nhưng Hibiki đã cho anh thấy. Thế giới này tươi đẹp biết bao, ngập tràn những nụ cười biết bao.」"
1669 = "「Tại sao, mọi người lại ở đây.」"
1671 = "「Có gì mà ngạc nhiên. Chẳng phải đó là điều em mong muốn sao.」"
1672 = "「Anh nói gì vậy, anh Soutetsu. Chuyện đó, là chúng ta giúp đỡ lẫn nhau mà.」"
1674 = "「Em――chính là Mikuro nhỉ.」"
1676 = "「Mà phải nói là, anh Soutetsu mới đúng ấy…… Sao anh cứ đứng mãi ở chỗ này vậy?」"
1678 = "「38696 của Mikuro――đứa trẻ đó cũng sắp sửa, bắt đầu 『bảo tồn bằng hình thức trải nghiệm bảo dưỡng』 rồi đúng không?」"
1679 = "「Cảm ơn em đã đến. Anh rất vui.」"
1681 = "「Đúng là vậy nhưng―― Người mà anh muốn bảo vệ, không chỉ có một mình Hibiki.」"
1683 = "「Đây. Của Hi-chan và Sou-chan đây.」"
1685 = "「Bảo vệ Hibiki cũng chính là bảo vệ bản thân anh. Bởi vì từ nay về sau, chúng ta sẽ có một gia đình.」"
1687 = "「Một sân ga trống trơn giống hệt như thời kỳ cuối của Đường sắt Hoàng gia, kết hợp với một khách sạn được cố tình làm cho cũ kỹ, thật sự rất ăn khớp với nhau.」"
1691 = "「Hachiroku.」"
1692 = "「Chị Hachiroku, cảm ơn Mikuro――sao ạ?」"
1695 = "「Cô dâu tháng Sáu. Something Four. Ư fufu, Gói gọn những điềm lành tuyệt vời nhất. Hôm nay quả thực là một ngày tốt lành ạ.」"
1697 = "「Thực ra bọn em cũng muốn đến chỗ Hibiki lắm chứ ạ.」"
1700 = "「Đừng khóc đừng khóc. Em khóc cũng đẹp lắm, nhưng nụ cười của em vẫn đẹp hơn gấp trăm lần.」"
1723 = "「Hai người xong chưa ạ?」"
1725 = "「――Có lẽ vậy. Anh cũng mong là như thế.」"
1727 = "「Người lái tàu Migita! Lâu rồi không gặp ạ. Cảm ơn anh hôm nay đã mời Mikuro đến dự lễ cưới.」"
1731 = "「Cô Migita Mayami. Xin cô giải thích đôi chút về món quà này được không ạ?」"
1735 = "「Á」"
1736 = "「Ư fufu, Mikuro thấy thế nào?」"
1738 = "「Ư fufu, hạnh phúc quá nhỉ~」"
1739 = "「Oa.」"
1741 = "「Oa. Anh Soutetsu, ngầu quá đi ạ~」"
1742 = "「Haha.」"
1743 = "「Ây da.」"
1744 = "「Ây chà. Tân nương tử cũng uống được phết nhỉ.」"
1746 = "「Ây da, đúng vậy nhỉ. Vậy thì anh sẽ đến phòng chờ―― để chào hỏi họ hàng của vợ đây.」"
1748 = "「Chà, ra là vậy sao ạ.」"
1749 = "「Hảảả? Nagi, cậu bảo là chơi nhưng mà.」"
1752 = "「Hảảả!? Đợi đã, Kisaki. Làm vậy thì, anh Soutetsu――Đã cất công tổ chức lễ cưới mà.」"
1753 = "「Hả? Ơ!? Rõ ràng bảo ngày mai sẽ đi nhà ăn trên tàu mà.」"
1756 = "「Hả!? Nagi có đối tượng rồi sao!?」"
1757 = "「Dạ――Mikuro, đâu có.」"
1758 = "「Làm gì có chuyện đó. Vị trí của Nagi rất quan trọng. Chẳng phải em là người lái tàu chính khi ngài Soutetsu vắng mặt sao.」"
1761 = "「A……」"
1763 = "「A――Chị Hachiroku cũng đã ở đó rồi sao! Mikuro cũng lần đầu tiên! Tối qua em vừa mới ở đó xong!!」"
1764 = "「A.」"
1766 = "「A wa wa, vâng ạ~」"
1767 = "「Hauu」"
1768 = "「A!」"
1770 = "「A! Vẫn còn ở chỗ này nữa!! Anh Soutetsu! Mọi người ở hội trường đang đợi kìa!!」"
1771 = "「A! Đúng rồi nhỉ!!」"
1773 = "「A, nếu được―― Những ai uống được, xin hãy cùng chung vui với chúng tôi ạ.」"
1775 = "「A, đúng rồi. Trước khi đi còn một chuyện nữa.」"
1777 = "「A, không. Ừm――Anh rất vinh hạnh. Nhưng mà……」"
1778 = "「!!?」"
1780 = "「!!? Anh vẫn còn nhớ sao!?」"
1781 = "「Này! Nagi!!」"
1783 = "「Này!? Vậy Nagi-sama để đâu cho vừa đây!!」"
1785 = "「Ưm——」"
1786 = "「A……Này, các em.」"
1789 = "「Ừm. Hạnh phúc lắm. Nhưng――cũng chính vì thế mà anh đang cực kỳ lo lắng đây. Rốt cuộc có chuyện gì――trong phòng chờ của cô dâu――của Hibiki vậy.」"
1790 = "「Ừ. Anh cảm thấy nếu xem trước khi cử hành hôn lễ thì hơi phí.」"
1793 = "「Vâng ạ. Vì đây là ngày trọng đại của ngài Soutetsu và Hibiki mà. Nên em đã học hỏi rất nhiều ạ.」"
1794 = "「Ừm. Cảm ơn em. Lúc nào em cũng giúp đỡ anh rất nhiều.」"
1796 = "「Ừm.」"
1797 = "「Ừm!」"
1799 = "「Ừm! Đi thôi, Hibiki.」"
1800 = "「Vâng! Anh hai!!」"
1801 = "「Ưm!!!」"
1804 = "「A, chuyện đó thì được. Tàu GAMADUS có thể chạy được đấy. Cách điều khiển thì Paulette đã nắm rõ rồi.」"
1806 = "「Ừm. Uống sảng khoái lắm. Vậy thì mọi người. Cùng nâng ly chúc mừng đám cưới của Sou-chan và Hi-chan nào.」"
1808 = "「A, xin lỗi.」"
1810 = "「Vâng, đúng vậy ạ! Vì đã thành công ở Bungomori và Taragi. Nên cuối cùng cũng chuẩn bị xong xuôi rồi ạ!」"
1811 = "「A, là ông Hayase và mọi người đã vận chuyển đến giúp sao.」"
1813 = "「Vâng――tất nhiên rồi ạ.」"
1814 = "「Vâng. Em là vợ của anh.」"
1815 = "「A, nghe anh nói mới để ý……Nơi này đâu phải được xây dựng để làm nơi tổ chức lễ cưới đâu nhỉ. Ạ.」"
1817 = "「!? Reina, đi đi.」"
1818 = "「Ồ, Mikuro.」"
1820 = "「Ra vậy, mọi người đến phòng chờ của Hibiki à. ――Không, nếu vậy thì tại sao em lại ở đây?」"
1823 = "「Thì tại mọi người đều ở đây mà nè.」"
1824 = "「Chính vì có mọi người. Anh mới được là chính mình. Mới có thể cùng Hibiki bước đi đến tận đây.」"
1825 = "「Vì thề trước mặt con người, nên gọi là lễ cưới [nhân tiền,2]trước mặt mọi người. Lễ cưới thề trước thần linh, có vẻ được gọi là lễ cưới [thần tiền,2]trước mặt thần linh ạ.」"
1827 = "「Trong ngày lành hôm nay, tân lang Migita Soutetsu, và tân nương Migita Hibiki sẽ chính thức nên duyên vợ chồng.」"
1829 = "「Ở trung tâm của thế giới tươi đẹp đó, ở trung tâm của nụ cười rạng rỡ đó, lúc nào cũng có Hibiki. Vì thế, anh」"
1831 = "「Tổ chức lễ cưới ở GAMADUS nghe có vẻ thú vị đó nha! Nagi-sama đây có lẽ cũng nên bắt chước thử xem sao!」"
1833 = "「Nhờ có anh Soutetsu và chị Hibiki, mà cửa hàng đường sắt đã trở nên vô cùng nhộn nhịp đó ạ~」"
1836 = "「Như mọi người đã biết, anh là con nuôi của nhà Migita. Việc ông Taito nhận nuôi anh, đã bị họ hàng phản đối kịch liệt.」"
1838 = "「Tuyệt vời quá! Thực sự chúc mừng hai người ạ!」"
1839 = "「Vậy thì.」"
1840 = "「Vậy thì, tiếp theo đây là món quà chúc mừng từ Xưởng rượu Migita. Trưởng hầm rượu Migita Mayami và Thợ ủ rượu chính Saito Honoka.」"
1842 = "「――Ngon quá.」"
1844 = "「Vâng――Vâng! Em rất sẵn lòng!!!!」"
1845 = "「Vâng, Mikuro sẽ đợi ạ!!!」"
1847 = "「――Đẹp quá.」"
1853 = "「Đúng vậy. Cho dù không thể làm đến mức đó, nhưng việc Soutetsu cư xử đúng mực cũng mang ý nghĩa không hề nhỏ đâu.」"
1854 = "「Ra vậy, họ hàng của anh hai và họ hàng của chị Hibiki, đều là cùng một nhóm người nhỉ~」"
1858 = "「Chuyện vừa rồi cũng vậy, ngẫm lại thì, lúc nào cũng vậy. Mọi người đã dạy cho anh hết điều quan trọng này đến điều quan trọng khác.」"
1860 = "「Là bức tường để bảo vệ ấy. Anh Soutetsu. Đang bàn cách để bảo vệ chị Hibiki đó.」"
1862 = "「Đó là lý do chọn lễ cưới trước mặt mọi người. Hibiki có hai nguyện vọng tha thiết. Một là được mặc váy cưới, và hai là.」"
1864 = "「Dù không phải vậy, dù không thể làm vậy. Dù có đánh mất tất cả những thứ khác. Em vẫn muốn ở bên anh hai, mãi mãi trọn đời.」"
1869 = "「Soda sẽ được rót ở bên này ạ.」"
1874 = "「Sao vậy, có chuyện gì à? Lý do không thể đến chỗ Hibiki ấy.」"
1875 = "「Sao vậy? Hachiroku.」"
1877 = "「Chúc mừng nha!!!」"
1879 = "「Cảm ơn ngài ạ.」"
1881 = "「Có vẻ là vậy đấy ạ? Ngài Soutetsu.」"
1885 = "「Việc vẽ ra, truyền đạt điều đó, em đã luôn rất sợ hãi. Nhưng, anh hai đã――công nhận và cho phép em làm vậy.」"
1888 = "「Anh cũng vậy, anh yêu Hibiki nhất.」"
1892 = "「Nếu là hai chúng ta, chắc chắn có thể mở rộng đến bất cứ đâu. Có thể cùng nhau, nhìn ngắm trọn vẹn vẻ đẹp của thế giới này.」"
1893 = "「Chúng tôi cũng có chuẩn bị cả soda hơi nước nữa. Ai không uống được rượu shochu thì xin hãy cạn ly bằng soda nhé.」"
1895 = "「Đơn giản là vì anh không có chỗ nào giống như phòng chờ để ở――thôi. Bởi vì cấu trúc của GAMADUS có cực kỳ ít không gian khép kín.」"
1897 = "「Người lái tàu chính và phụ lái tàu chính của em và 8620, lúc nào cũng là ngài Soutetsu và Hibiki ạ.」"
1899 = "「Anh yêu Hibiki. Anh muốn được ở bên cạnh nụ cười của Hibiki. Vì thế, Hibiki――」"
1900 = "「Chị đã nghe chuyện của Mikuro từ ngài Soutetsu và Hibiki rồi. Chị vẫn luôn muốn nói lời cảm ơn khi gặp em.」"
1902 = "「Đúng vậy nhỉ, may quá.」"
1903 = "「Tôi đã tiếp nhận giấy đăng ký kết hôn.」"
1906 = "「Railord của đầu máy hơi nước số 1 thuộc dòng 8620 Đường sắt Hoàng gia cũ. Hiện tại thuộc Đường sắt Ohimitera, Hachiroku ạ.」"
1908 = "「Vì em sợ khi ngài Soutetsu quay lại đây, sẽ cảm thấy bất an không biết mọi người đã đi đâu mất ạ.」"
1909 = "「Anh rất sẵn lòng. Dù có phải đánh đổi bất cứ thứ gì, anh cũng sẽ lấy Hibiki.」"
1911 = "「Tôi đã lắng nghe rõ lời thề nguyện của hai người. Vậy thì, xin mời trao nhẫn.」"
1912 = "「Trước đây, em từng nói rồi đúng không? 『Muốn được Navi đưa đi』 ấy.」"
1913 = "「Chắc chắn không chỉ đơn thuần là chuyện làm ăn đâu ạ―― Em nghĩ là vậy.」"
1914 = "「Mà này Hachiroku. Chỉ có một mình em thôi à? Mọi người đi đâu hết rồi?」"
1920 = "「Anh đến ngay đây!」"
1921 = "「Hơi bất ngờ đấy. Hachiroku lại rành về lễ cưới đến vậy sao?」"
1922 = "「Khi nào gặp được em, chị nhất định phải nói lời cảm ơn về chuyện đó.」"
1924 = "「Anh――yêu Hibiki.」"
1927 = "「Vì vậy, xin anh hãy ưỡn cao ngực mà bước tiếp nhé. Cả ngày hôm nay, và cả chặng đường phía trước nữa!」"
1930 = "「Thế nên. Nghi thức uống rượu giao bôi của Hi-chan. Nếu Hi-chan đồng ý――hãy dùng loại rượu shochu này nhé.」"
1931 = "「Vì thế, lời thề của anh hai khiến em rất vui―― Em nhận ra rằng, thế giới của anh hai và em, đang cộng hưởng với nhau.」"
1933 = "「Vì thế anh hai――Anh Migita Soutetsu. Xin anh――hãy lấy em, lấy Hibiki nhé!」"
1934 = "「Vì vậy, Mikuro. Trong suốt thời gian ở khách sạn tàu hỏa, D51 1031 trông như thể vẫn còn sống cho đến tận bây giờ vậy.」"
1937 = "「Vậy thì, tiếp nhé. Sou-chan, chén lớn này.」"
1942 = "「Khi nào trải nghiệm bảo dưỡng bắt đầu, chắc chắn chị cũng sẽ đến. Mikuro――Để gặp gỡ một nửa của em, 38696.」"
1956 = "「Hibiki.」"
1957 = "「Trong phòng chờ của Hibiki có――」"
1960 = "「Có Hibiki và chị Mayami ạ. Ngoài ra, chỉ có con thú bông――Gấu Kuma thôi ạ.」"
1961 = "「Hibiki!」"
1966 = "「Ra là vậy……Thì ra, là đối tác làm ăn sao.」"
1969 = "「Ra là vậy. Nếu tạo được ấn tượng 『Cậu thanh niên đó rất lễ phép』 với những người xung quanh, thì đó cũng sẽ trở thành một tấm khiên bảo vệ nhỉ.」"
1970 = "「Vâng.」"
1971 = "「Đúng vậy. Thực sự là giúp đỡ lẫn nhau đấy. Nếu không có các cậu, thì vốn dĩ tôi đã chẳng có mặt ở đây rồi.」"
1974 = "「Là vậy đó. Chỉ có hai chỗ có thể dùng làm phòng chờ. Một chỗ là phòng chờ của Hibiki, chỗ còn lại thì dùng làm phòng chờ cho người nhà rồi.」"
1975 = "「Ừ.」"
1976 = "「Đúng vậy, anh đã trở thành chồng của em rồi.」"
1978 = "「Đúng vậy nhỉ, thế mới là bình thường――」"
1980 = "「Mẹ, sao.」"
1981 = "「Đúng vậy. 『Khách sạn tàu hỏa Taragi』. Là một khách sạn vô cùng tuyệt vời. Đặc biệt là chiếc D51 đó.」"
1983 = "「Vâng, lần đầu gặp mặt ạ. Chị Hachiroku. Em xin lỗi vì đã chào hỏi chậm trễ.」"
1986 = "「A――」"
1988 = "「Vâng, ngài Soutetsu. Lên sân thượng thôi ạ.」"
1989 = "「Nagi-sama đây cũng vậy, chuyện lái tàu hỏa xình xịch, hay làm việc trên tàu nhà hàng, có nằm mơ cũng không nghĩ tới đâu nha!」"
1993 = "「Chính vì là lễ cưới đấy. Những họ hàng đến dự hôm nay, nói cách khác, cậu nên xác định rõ họ là những đối tác làm ăn không thể dứt bỏ.」"
1995 = "「Chính xác là vậy. Trong tim chị, trong tim Mikuro――và chắc chắn là. Trong tim tất cả những người đã nghỉ lại đó, nó đang chạy rất khỏe mạnh.」"
1996 = "「Đúng vậy. Để làm được điều đó, chúng tôi phải đi ngay bây giờ. Navi!」"
1999 = "「Chị Paulette ơi. Jinzen-shiki, là gì vậy ạ~?」"
2010 = "「Xe tải của ông nội!?」"
2013 = "「Cái đó hả? Reina. Không phải thề trước thần linh, mà là lễ cưới thề trước những người chứng kiến.」"
2016 = "「Reina, hiểu rồi ạ~! Vì thế nên mới tổ chức lễ cưới ở GAMADUS nhỉ~」"
2017 = "「Bây giờ không phải lúc để bận tâm chuyện bị tránh mặt hay gì nữa. Vì đã tin chắc đó là việc cần làm, nên anh sẽ đi làm ngay.」"
2018 = "「Thì từ giờ sẽ đi tìm chứ sao nè~」"
2022 = "「Có hai lý do. Lý do thứ nhất cực kỳ đơn giản. Hiếm hoi mới có đêm tân hôn. Anh muốn chỉ có hai người chúng ta bên nhau.」"
2023 = "「Tất nhiên――Tất nhiên rồi ạ! Em rất sẵn lòng!!!」"
2024 = "「Tất nhiên rồi. Vì thế, anh đã biến nó thành hiện thực. Dù đã để em phải chờ khá lâu——」"
2028 = "「Chị Mayami đã đến gọi mọi người đi rồi ạ. Bảo là 『Hi-chan đang chán kìa』.」"
2036 = "「Chẳng việc gì phải nể nang mấy người đó đâu nha! Tất cả chúng ta cứ kéo nhau vào phòng chờ là xong chứ gì!!」"
2040 = "「――Ây, da. Đây này.」"
2044 = "「Mikuro――」"
2046 = "「Railord của đầu máy hơi nước 38696 thuộc dòng 8620 Đường sắt Hoàng gia cũ, Mikuro ạ.」"
2048 = "「Cảm động lắm ạ! D51 1031, tuy vẫn đang trong quá trình bảo dưỡng, nhưng những lỗ hổng đã được lấp đầy bằng bột trét rồi――còn cả sân ga và khách sạn nữa.」"
2049 = "「Mikuro. Cảm ơn em đã mang đến cho đứa trẻ đó――D51 1031. Sức mạnh để chạy thêm một lần nữa.」"
2051 = "「Với lại.」"
2053 = "「『Với lại』――là sao?」"
2054 = "「Với lại, em――」"
2056 = "「Em là Railord của ngài Soutetsu và Hibiki mà!」"
2058 = "「Với lại, em――là của ngài Soutetsu――」"
2059 = "「Với lại?」"
2061 = "「Mọi người ở đây, là vì có anh Soutetsu ở đây đó ạ~」"
2063 = "「Mikuro, được chị Hachiroku khen ngợi, em thực sự, thực sự rất vui ạ!」"
2065 = "「Anh từng nghĩ mình sẽ chẳng bao giờ có thể yêu một ai nữa―― Kể từ khi mất đi đứa em gái sinh đôi hồi còn nhỏ, anh vẫn luôn nghĩ vậy.」"
2067 = "「Công nhận là vô cùng quan trọng luôn! Nagi-sama, đồng ý! Hoàn toàn đồng ý nha!!」"
2070 = "「Dịch vụ chèo thuyền trên sông Kuma, và cả em nữa. Không biết giờ đã ra sao rồi.」"
2072 = "「Xin em――hãy lấy anh.」"
2073 = "「Ai dùng ly rượu shochu thì xin mời qua bên này.」"
2074 = "「Xin hai người hãy hướng về phía nhau, và hướng về những người làm chứng chúng tôi, đọc lời thề nguyện kết thành phu thê.」"
2075 = "「Cảm ơn em nhé. Vì đã công nhận rượu của xưởng nhà mình.」"
2076 = "「Cảm ơn mọi người! Xin lỗi nhé, chúng tôi sẽ cứ thế này, lên đường đi tuần trăng mật luôn đây.」"
2077 = "「Xin lỗi vì đã để mọi người phải đợi.」"
2085 = "「Suối nước nóng nằm cách đó một chút cũng rất tuyệt. Vừa ngâm mình trong suối nước nóng vừa ngắm D51 là tuyệt nhất, với lại, hơi nước nữa.」"
2095 = "「D51 nhìn qua làn hơi nước của suối nước nóng, trông cứ như đang nhả hơi nước vậy. Cứ như thể nó vẫn luôn chạy không ngừng nghỉ từ thời Đường sắt Hoàng gia đến giờ.」"
2096 = "「Trong số những người đó, đến giờ vẫn có người tránh mặt anh. Vì vậy, việc anh ở trong phòng chờ……cũng khiến anh cảm thấy áy náy với họ.」"
2097 = "「Rượu shochu trong vại này, được ủ bởi Trưởng hầm rượu đời trước của nhà Migita, vào chính năm Hibiki chào đời.」"
2098 = "「Với chiếc nhẫn này, em đã là vợ của anh.」"
2099 = "「Vậy là, hôn lễ của hai người đã hoàn tất. Để kết thúc buổi lễ, xin mời trao nhau nụ hôn thề nguyện.」"
2100 = "「Với chiếc nhẫn này, anh hai―― anh hai đã là chồng của em.」"
2101 = "「――Nói chuyện xong mới thấy, cũng chẳng có gì to tát nhỉ.」"
2103 = "「Vận chuyển……thứ gì vậy ạ?」"
2105 = "「Vâng, ngài Soutetsu.」"
2108 = "「Và, lý do thứ hai.」"
2111 = "「Vậy thì Fukami, chúng ta vào trong chơi đi nha!」"
2113 = "「Vậy thì.」"
2115 = "「Được vậy thì còn gì bằng ạ――Ây da!?」"
2116 = "「Vậy thì, xin mời cô dâu chú rể ký tên vào giấy đăng ký kết hôn.」"
2118 = "「Tấm khiên bảo vệ, là sao vậy nè?」"
2120 = "「Anh hai」"
2121 = "「Anh hai cũng――anh hai cũng――」"
2122 = "「Anh hai!」"
2124 = "「Anh hai, em yêu anh nhất.」"
2125 = "「Từ chị Mayami sao!?」"
2126 = "「Soutetsu……」"
2127 = "「Anh Soutetsu!? Chuyện đó, đáng lẽ phải giữ bí mật chứ.」"
2128 = "「Ngài Soutetsu. Phần còn lại, xin hãy để mọi người tận mắt chứng kiến tại hội trường ạ.」"
2129 = "「Ngài Soutetsu, Hibiki. Chúc mừng hai người đã kết hôn.」"
2130 = "「Ngài Soutetsu. Chúc ngài may mắn ạ.」"
2131 = "「Xin lỗi vì đã để ngài phải đợi lâu, ngài Soutetsu.」"
2132 = "「Ngài Soutetsu!?」"
2133 = "「Soutetsu chưa xem qua phòng chờ của cô dâu sao?」"
2135 = "「Bay thôi, Navi.」"
2137 = "「Phu nhân Saito đã cẩn thận ủ nó suốt thời gian qua. Để dành cho ngày Hibiki đi lấy chồng.」"
2142 = "「D51 1031――đã bắt đầu chạy lại từ đây!」"
2143 = "「GAMADUS, vui quá đi! Cuối cùng Mikuro cũng được vào bên trong rồi.」"
2145 = "「Navi.」"
2294 = "Phương án dọn dẹp tưởng chừng như liều lĩnh của một người duy nhất, đã kết nối những đoạn đường ray đến tận đây một cách ngoạn mục."
2297 = "Nhớ lại chuyện đó, khuôn mặt tôi tự nhiên cũng giãn ra."
2302 = "Khoảnh khắc nghĩ vậy, tôi chợt nhận ra. Thành công là điều hiển nhiên."
2303 = "Khoảnh khắc nghe những lời đó, tôi gật gù đồng tình."
2314 = "Thế nhưng khi đứng ở đây, những lời nói cứ thế tự nhiên tuôn trào."
2315 = "Nhưng, sự thật là vậy. Kết hôn có nghĩa là――"
2316 = "Nhưng, khi tôi đến chào hỏi trong ngày trọng đại này, chẳng có lấy một ai tỏ thái độ thù địch cả."
2317 = "Nhưng mà, sắp tới là lễ cưới rồi. Nhân vật chính của buổi lễ, đâu phải là tôi."
2318 = "Chỉ là lặp đi lặp lại không biết bao nhiêu lần nữa, những điều chúng tôi đã tích lũy từ trước đến nay mà thôi."
2319 = "Nhờ câu nói của Kisaki, tôi đã sắp xếp lại được suy nghĩ. Từ nay về sau, họ sẽ trở thành 『họ hàng của vợ』."
2340 = "Họ cũng là người lớn, là những người làm ăn. Đúng như Kisaki đã chỉ ra, đặt lợi ích lên hàng đầu――"
2342 = "Chắc là để tránh làm phiền cuộc trò chuyện giữa Mikuro và Hachiroku, anh ấy đã tinh ý làm vậy."
2343 = "Chỉ với một lời nói đó, cùng sự thay đổi biểu cảm tinh tế, bầu không khí lập tức trở nên trang nghiêm."
2345 = "Nhưng đôi mắt ngấn lệ đang nhìn tôi, đã nói lên tất cả những gì em ấy muốn nói."
2347 = "……Nhưng, mà. Tuy nhiên, là."
2354 = "Như thu hút lẫn nhau, như hòa làm một. Tôi và Hibiki——trao nhau nụ hôn."
2356 = "Trước câu nói nhẹ nhàng của Hachiroku, Mikuro gật đầu lia lịa."
2359 = "Đáp lại Mikuro, Hachiroku cũng thực hiện một nghi thức chào lại vô cùng tao nhã."
2362 = "Khi Hachiroku bỏ tay xuống trước, Mikuro cũng làm theo với vẻ nhẹ nhõm."
2364 = "Fufu, em ấy khẽ mỉm cười. Tôi cảm nhận được sự ấm áp từ nụ cười ấy, như thể đang nâng đỡ bóng lưng tôi."
2366 = "Hachiroku cười. Mikuro vẫy tay. Anh Kimoto cúi chào, còn anh Tochigi thì giơ ngón tay cái lên."
2368 = "Bặm lại. Đôi môi mím chặt. Đôi mắt cũng đồng thời nhắm lại."
2370 = "Với một cử chỉ hơi kịch một chút, Hachiroku khẽ ưỡn ngực."
2371 = "Giọng nói của Hachiroku khiến tôi nhớ lại. Đúng vậy, nếu truy tìm nguồn gốc của thành công này, thì khởi điểm chính là Mikuro."
2373 = "Hachiroku lặng lẽ ngước nhìn tôi. Với một nụ cười vô cùng xinh đẹp――và trong trẻo."
2376 = "Hachiroku chớp chớp mắt. Đảo mắt nhìn quanh như đang tìm kiếm thứ gì đó――"
2377 = "Ánh mắt Hachiroku dịu dàng hướng về phía Mikuro. Giọng nói cũng trở nên mềm mỏng hơn hẳn."
2378 = "Đôi môi Hachiroku khẽ khép lại, rồi mở ra. Một lần, hai lần――rồi lại một lần nữa."
2381 = "Hachiroku nở một nụ cười nhẹ nhàng. Như muốn nói với tôi rằng hãy yên tâm đi."
2383 = "Hachiroku khẽ thì thầm, mỉm cười."
2385 = "Chắc chắn là, đang cộng hưởng."
2390 = "Đừng nói là yêu, ngay cả việc rung động anh cũng không thể. Anh thậm chí còn cảm thấy đó là sự chuộc tội dành cho Michiko."
2396 = "Bản thảo đã được viết đi viết lại không biết bao nhiêu lần."
2400 = "Vậy mà trong số đó, dù ở cách xa Ohimitera, nhưng nhiều người đã cất công chọn khách sạn tàu hỏa làm nơi lưu trú."
2407 = "Dù đã trưởng thành xinh đẹp đến nhường này, nhưng Hibiki quả nhiên vẫn là một cô bé Hibiki hay khóc nhè."
2409 = "A, sai kịch bản mất rồi. Nhưng mà, cảm xúc không thể dừng lại được."
2412 = "Với mối quan hệ rắc rối 『Tôi là con nuôi, còn họ là họ hàng của gia đình nhận nuôi tôi』, tôi đã từng phân vân không biết nên cư xử thế nào. Nhưng――"
2413 = "Ngay bên dưới nó là――"
2416 = "Họ đang cố làm tôi cười. Rõ ràng là rất thú vị, rõ ràng là rất muốn cười――nhưng tôi lại sắp khóc đến nơi rồi."
2418 = "Lực truyền từ những cái bắt tay, tôi cũng cảm nhận được sự dặn dò “Nhờ cậu chăm sóc Hibiki”."
2420 = "Chén lớn. Tôi, Hibiki――tôi."
2422 = "Em ấy chụm khít các đầu ngón tay lại và giơ lên chào theo kiểu quân đội. Đường hoàng đến mức khó mà tin được trước đây em ấy từng bối rối chỉ vì nghe đến tên Hachiroku."
2425 = "――Như thể dùng bàn tay ấy để bảo chứng rằng, đôi cánh của Hibiki đã cứng cáp, đã có thể bay đến bất cứ nơi đâu."
2426 = "Giọng nói của người chị cả――Hachiroku, người mà em ấy kính trọng đến mức cho rằng “Chưa có kết quả thì chưa thể gặp mặt”, em ấy đã không trốn tránh mà đón nhận nó một cách đàng hoàng."
2429 = "Em ấy gật đầu lia lịa. Nước mắt cứ thế mà tuôn rơi."
2431 = "Bàn tay phải vẫn đang nắm chặt một chiếc nhẫn, em ấy nhẹ nhàng đưa bàn tay trái đang xòe ra như một đóa hoa về phía tôi."
2432 = "Đó cũng là điểm mà Hibiki đã rất ngạc nhiên vì không phải là thiết kế có chủ đích, và em ấy đã vô cùng vui sướng."
2434 = "Đầy vẻ vui sướng. Em ấy khẽ nắm bàn tay trái lại, rồi lại xòe ra."
2437 = "Chỉ một lời thấu hiểu tâm trạng của tôi, nhưng lại khiến tôi cảm thấy bất an."
2439 = "Hachiroku bưng cả chiếc khay bạc đựng giấy đăng ký kết hôn đến cho Phó thị trưởng―― Bà Houshou Kisaki."
2445 = "Có thể họ chỉ đang cố gắng cải thiện mối quan hệ với tôi, người giờ đây đã hoàn toàn trở thành một thành viên, một người nhà của gia đình Migita……"
2450 = "Chén nhỏ, tôi, Hibiki, tôi. Chén vừa, Hibiki, tôi, Hibiki."
2454 = "Chiếc khăn tay lúc nào cũng nằm trong túi quần sau, hôm nay mặc tuxedo lại không có."
2458 = "Những người kiên quyết chọn Taragi là Hibiki và chị Mayami―― Mỗi người đều đưa ra lập luận dựa trên những lý do hoàn toàn khác nhau."
2471 = "Tình cảm dâng trào trong lồng ngực. Tôi muốn ôm em ấy, muốn hôn em ấy."
2473 = "Tâm trạng tôi nhẹ nhõm hẳn. Sự căng thẳng tan biến. Đến lúc đó tôi mới nhận ra, bản thân mình đã căng thẳng đến nhường nào."
2475 = "Tôi gật gù."
2478 = "Tôi gật đầu. Tôi cũng vậy. Cả anh Tochigi, cả anh Kimoto cũng vậy――!!"
2483 = "Chúng tôi chạy lên sân thượng Gamadas. Sánh bước cùng Hibiki, cả hai cùng nhau, trên chính đôi chân của mình."
2484 = "Gọi tên nhau. Chỉ cần vậy là đủ."
2485 = "Chúng tôi cầm lấy chiếc bút bạc, lần lượt ký tên. Migita Soutetsu. Migita Hibiki."
2486 = "Tất cả những người được mời đều đã đến dự. Chỉ riêng điều đó thôi đã là một điều vô cùng đáng quý rồi――"
2487 = "Tôi nửa cưỡng ép, biến những xung động đang trào dâng thành lời nói."
2489 = "Chỉ mới tưởng tượng qua khung cảnh trong phòng thôi, một cảm giác thiêng liêng nào đó đã dâng trào trong tim tôi."
2491 = "Nghe những lời không ngờ tới đó, tôi ngẩng mặt lên, và thấy những nụ cười đang vây quanh mình."
2494 = "Tôi bật cười. Vì quá đỗi hạnh phúc. Cả Hibiki và tôi, đều đang cười không khép được miệng."
2496 = "Sự quan tâm đó cũng khiến tôi rất vui, nhưng đây là ngày trọng đại, thôi thì cứ tiếp tục câu chuyện mà không đả động đến chuyện đó vậy."
2497 = "Hạnh phúc, chỉ toàn là hạnh phúc, trái tim tôi ngập tràn cảm giác yêu thương."
2500 = "Tôi cúi đầu. Bằng cả tấm lòng. Bằng tất cả sự biết ơn của tôi."
2501 = "Tôi thầm nghĩ từ tận đáy lòng, thật may vì đã chọn lễ cưới trước mặt mọi người."
2504 = "Tôi bế bổng Hibiki lên khoang lái. Ngay lập tức, ra lệnh cho Navi."
2506 = "Cùng lúc tôi lấy chiếc nhẫn, Hibiki cũng nắm chặt lấy chiếc nhẫn còn lại."
2507 = "Tôi ngước nhìn lên để che giấu cảm xúc, như thường lệ, Navi vẫn đang dõi theo chúng tôi."
2509 = "Tôi chỉ thốt lên được mỗi câu đó."
2511 = "Chỉ một tiếng gọi, ánh mắt của tất cả mọi người lập tức đổ dồn về phía tôi. Tôi cảm thấy hơi có chút gì đó áp lực."
2512 = "Tôi nhìn lên bầu trời. Navi đang thong thả bay lượn."
2514 = "Cuối cùng, tôi cũng được ôm Hibiki vào lòng. Thật ấm áp, ngọt ngào và mềm mại."
2516 = "Tôi nhẹ nhàng lau nước mắt cho em ấy. Chỉ vậy thôi, Hibiki đã lấy lại được bình tĩnh."
2519 = "Lời nói của Hibiki, chính là lời thề chân thành nhất của em ấy, truyền đến tôi mạnh mẽ như xuyên thấu tâm can."
2520 = "Ngón áp út thon thả của Hibiki. Tôi đeo chiếc nhẫn vừa vặn vào đó."
2522 = "Nếu vậy thì địa điểm tổ chức, là công trình kiến trúc đầu tiên do Hibiki thiết kế ――Không thể là nơi nào khác ngoài GAMADUS này được."
2532 = "Và rồi chúng tôi, trên bầu trời cao không một ai nhìn thấy."
2533 = "Và lần này, Hibiki nắm lấy bàn tay trái của tôi, đeo nhẫn vào."
2543 = "Ngay khoảnh khắc cô dâu chú rể bước vào và đối mặt với Hibiki, tôi đã hoàn toàn quên mất rằng mình đang trong lễ cưới."
2546 = "Thế nên thay vào đó, tôi đưa cho em ấy chiếc khăn cài túi ngực."
2548 = "Nếu đã vậy, thì chẳng có gì phải sợ hãi cả."
2550 = "Nếu là công việc, thì đó là điều đương nhiên. Huống hồ là chuyện gia đình, thì lại càng quan trọng hơn cả công việc."
2587 = "Hibiki quả nhiên cũng không thốt nên lời."
2589 = "Hai điều mà Hibiki nhất quyết mong muốn. Váy cưới và nghi thức uống rượu giao bôi San-san-kudo."
2592 = "Đôi mắt Hibiki rung động mạnh mẽ. Chị Mayami nhẹ nhàng đặt tay lên má em ấy."
2594 = "Trong đôi mắt Hibiki, phản chiếu nụ cười của tôi."
2595 = "Lời nói của Hibiki khiến mọi thứ trong tôi rung động, gióng lên hồi chuông của niềm vui sướng."
2600 = "Có thể chỉ là một chuyện nhỏ thôi, nhưng tôi cứ thấy bận tâm thế nào ấy."
2605 = "Đây là ngày trọng đại, tôi muốn nghiêm túc một chút nhưng―― thật sự, không thể làm được."
2606 = "Dừng lại hành động định lao vào ôm chầm lấy tôi, Hibiki từ từ mở tay ra."
2614 = "Là anh Tochigi và anh Kimoto. Anh Kimoto vội vàng giữ chặt lấy cánh tay phải đang giơ lên của anh Tochigi."
2622 = "Điều mà Paulette nhớ lại có lẽ là, vụ tai nạn đó―― Về phía tôi, hầu như không có người thân nào có thể mời đến dự lễ cưới."
2623 = "Paulette vẫy tay gọi tôi. Tôi nhìn đồng hồ――Chết thật, mải nói chuyện quá rồi."
2628 = "Một phát ngôn khiến Fukami thậm chí không kịp thốt lên 『Này, Nagi』. Nhưng, sự thẳng thắn đó lại khiến tôi cảm thấy biết ơn."
2634 = "Thị trưởng Yufuin, các đầu bếp, mỗi người đều nở một nụ cười tiễn tôi chạy vội đi――"
2636 = "Để dung hòa cả hai điều đó, sau khi bàn bạc với cha xứ Akai, chúng tôi đã chọn tổ chức lễ cưới trước mặt mọi người."
2638 = "Và rồi, Hachiroku bừng sáng, trao cho tôi một nụ cười rạng rỡ như hoa nở."
2645 = "Cách giải thích của Reina hoàn toàn chính xác. Lễ cưới trước mặt mọi người là theo nguyện vọng tha thiết của Hibiki."
2647 = "Reina cuống cuồng, chạy chậm về phía chúng tôi. Trên chiếc khay dâng bằng hai tay, là hai chiếc nhẫn lấp lánh ánh vàng."
2648 = "Chị Mayami khẽ bật cười khúc khích. Rồi chị ghé sát môi vào tai Hibiki."
2652 = "Nắp vại được mở ra. Hương thơm thanh khiết của rượu shochu gạo thoang thoảng lan tỏa."
2653 = "Những bức tranh được vẽ từ những góc nhìn khác nhau đã hòa quyện vào nhau một cách hoàn hảo, nhờ đó, D51 1031 đã trở thành một sự tồn tại đang chạy trong tim chúng tôi."
2656 = "Bằng cả hai tay, nâng niu, trân trọng."
2657 = "Ra là vậy. Giờ đến của họ sát nhau như thế, chắc là do hai người họ cũng nghỉ qua đêm ở khách sạn tàu hỏa sao."
2659 = "Thấy bộ dạng đó của em ấy, Hachiroku lại nở một nụ cười hạnh phúc."
2671 = "Chị Mayami nâng ly. Tất cả những người có mặt cũng đồng loạt làm theo."
2673 = "Nếu phải ví von, thì đó là sự vô sắc trong suốt. Không có loại rượu nào thích hợp hơn để chúc mừng đám cưới của Hibiki."
2682 = "Với vẻ mặt nghiêm nghị, Kisaki lướt nhìn qua tờ giấy―― Rồi mỉm cười và gật đầu thật mạnh."
2684 = "Lại gọi là anh hai rồi. Em ấy vẫn luôn là Hibiki của ngày thường. Điều đó khiến tôi vui lắm. Rất, rất vui."
2692 = "Lần thứ chín của nghi thức San-san-kudo, tôi uống cạn một ngụm lớn, để hương vị đậm đà của rượu shochu lan tỏa trong miệng một lúc."
2697 = "Đôi má đỏ bừng――đỏ lan tới tận mang tai. Nhưng Mikuro vẫn gật đầu mạnh."
2699 = "Giọng nói điềm tĩnh của cha xứ Akai. Nhờ vậy, tôi mới dễ dàng bừng tỉnh."
2701 = "Ánh đèn sân khấu chiếu thẳng vào chị Mayami. Bên cạnh chị ấy là một vại rượu lớn."
2702 = "Nghe giọng nói đầy nhiệt huyết của Mikuro, Hachiroku gật đầu mạnh. Trong sự im lặng, cả anh Tochigi và anh Kimoto cũng gật gù đồng tình."
2703 = "Không chỉ có những người bạn thân thiết, mà cả khách mời, họ hàng, và toàn thể nhân viên GAMADUS."
2708 = "Yui hay Taragi――Về địa điểm đặt khách sạn tàu hỏa, đã có một cuộc tranh luận nảy lửa chia rẽ cả Đường sắt Ohimitera."
2710 = "Những lời chúc phúc dành cho Hibiki mà họ hàng đã nói ra. Tôi cảm nhận được sự chân thành trong đó."
2719 = "Vì quá gần gũi. Vì ở bên nhau quá lâu, nên ranh giới ở đâu đó đã trở nên mờ nhạt."
2721 = "Chị Mayami với tư cách là người kinh doanh, Hibiki với tư cách là nhà thiết kế."
2723 = "Hibiki trong bộ váy cưới, trông hệt như một nàng công chúa bước ra từ truyện cổ tích vậy."
2734 = "Những người họ hàng đã từng cố gắng loại bỏ tôi khỏi nhà Migita, thậm chí không tiếc tranh cãi với chị Mayami."
2735 = "Sự lặp lại đó, cũng đã mang đến cho anh nụ cười. Hibiki đã dùng nụ cười của mình, tô điểm cho thế giới của anh."
2736 = "Lần này chiếc khay do Hachiroku bưng tới. Một tờ giấy đăng ký kết hôn đã được điền và đóng dấu đầy đủ, chỉ trừ phần chữ ký."
2737 = "Từ tận đáy lòng. Từ nơi sâu thẳm nhất, từng bị tổn thương nhất."
2739 = "Vẽ nên những bức tranh để tạo ra nụ cười, rồi lại vẽ nên nụ cười ấy một cách sống động."
2740 = "Một nụ cười trong suốt đến nhường ấy…… Nhưng không hiểu sao, đôi mắt ấy lại có vẻ như sắp khóc đến nơi."
2743 = "Một chén rượu sơn son. Rất nhỏ. Chị Mayami rót rượu shochu đầy ắp vào đó."
2748 = "Trao nhau nụ hôn mang hương vị rượu shochu, nụ hôn đầu tiên kể từ khi trở thành vợ chồng."
2751 = "Dù nghe nói đây là lần đầu tiên ngài ấy chủ trì một lễ cưới trước mặt mọi người, nhưng quả không hổ danh là cha xứ của đền Akai Aso."
2764 = "Dưới bàn tay của phu nhân Saito và anh Yamazaki, các ly rượu lần lượt được rót đầy."
2775 = "（Ây da）"
2776 = "（A―― Thực sự, rất thanh khiết, rất ngon.）"
2778 = "（A――Đúng vậy. Dù có rời khỏi nhà Migita, và lập một gia đình mới, thì tôi cũng chẳng đánh mất thứ gì cả.）"
2779 = "（!）"
2781 = "（Chúng tôi đơn giản chỉ là đang xây dựng một nhà ga mới―― và tiếp tục kéo dài đoạn đường ray từ trước đến nay mà thôi.）"
2783 = "（Giỏi thật đấy, Hibiki――và cả chị Mayami nữa.）"
2784 = "（A――）"
2789 = "（Thị trưởng Yufuin…… Và cả những người chủ nhà hàng ở các nơi nữa.）"
2790 = "（Khách sạn tàu hỏa là tác phẩm hợp tác đầu tiên của hai người họ mà.）"
2794 = "Vút bay lên bầu trời cao, mượt mà như đang lướt đi."

[selections]
