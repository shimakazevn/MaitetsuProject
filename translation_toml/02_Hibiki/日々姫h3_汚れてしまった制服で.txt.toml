1145 = "「Sướng……quá――ưm――Em thích……liếm liếm…… Được anh hai, liếm liếm……thế này――Em thích, lắm」"
1147 = "「Nhiều quá――đang vào――Mang thai mất――Tinh, dịch―― Vào sâu――trong tử cung――bắn thẳng vào――trứng của em」"
1149 = "「Khác với mùi cơ thể của Hibiki, mùi âm đạo thì……」"
1150 = "「Mông……Em muốn, được làm nhiều hơn nữa――ạ」"
