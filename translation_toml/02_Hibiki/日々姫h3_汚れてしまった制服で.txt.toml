1242 = "「Thế này thì, dù có tè dầm ra cũng không thấm xuống sàn đâu」"
1243 = "「Bị dính bẩn rồi này. Màu xanh lá... cái này, là màu vẽ à?」"
1244 = "「Chỗ này! Đây này, phần dưới cùng phía trước của váy.」"
1246 = "「Này, anh hai――đã――xong rồi sao?」"
1247 = "「Nếu vậy, thì hãy cho anh xem kỹ hơn đi」"
1250 = "「Nếu vậy, thì để anh làm cho nó thấm nhiều hơn nữa nhé」"
1251 = "「Tại vì……tại vì anh hai cứ mải mê, ngửi ngửi rồi liếm láp mãi thôi――nên là」"
1254 = "「Anh hai――to quá――giật giật――rồi――ưm Anh ra sao? Anh hai! Cùng nhau! Ra cùng nhau nhé!」"
1255 = "「Anh hai, dùng mũi……ngửi ngửi, thế là, cứ nghĩ đến việc, mùi của em……đang bị anh hai ngửi thấy」"
1258 = "「Anh hai, này? Nhìn này nhìn này!」"
1259 = "「Anh hai, chụt chụt, hôn em đã, nhé?」"
1260 = "「Sẽ nóng bừng lên ngay thôi」"
1262 = "「っ!」"
1263 = "「!!?」"
1264 = "「!?」"
1328 = "Và rồi, tôi dứt nụ hôn――"
1335 = "Áo sơ mi thì không phải. Vừa có mùi lại còn ẩm mồ hôi, hơi lộ ra làn da bên trong nữa."
1338 = "Không biết là do căng thẳng, do quần lót cản lại, hay vốn dĩ đã như vậy."
1339 = "Đó, nói cách khác là――"
1358 = "Tất cả những vùng da từng bị quần lót che phủ, đều đọng lại hương vị mằn mặn không sót chỗ nào."
1368 = "Chuyển động chậm thì kết nối sâu sắc. Chuyển động nhanh thì khoái cảm mãnh liệt."
1374 = "Mặc dù mặt đỏ bừng, Hibiki vẫn ngoan ngoãn trả lời tôi."
1375 = "Hibiki chằm chằm, nhìn tôi bằng ánh mắt thẳng thắn."
1376 = "Ngay lập tức, đôi mắt Hibiki ngấn lệ, phả ra một hơi thở nóng bỏng."
1383 = "À, ra là vậy. Vì quá hưng phấn nên tầm nhìn của tôi đã bị thu hẹp đến mức cực hạn."
1389 = "Chuyển động. Tôi có thể chuyển động rồi. Hibiki cũng đang cảm nhận được nó."
1391 = "Dòng chất lỏng trắng đục sền sệt như kem, chảy dọc theo rãnh âm đạo của Hibiki――"
1393 = "Gọi tôi đến phòng, rồi lại bảo \"Để em thay đồ đã\", bắt tôi đứng đợi ngoài hành lang——"
1395 = "Cơ thể ướt đẫm mồ hôi vì phát tình."
1397 = "Một giọng nói ngọt ngào vang lên. Sự siết chặt mạnh mẽ của hậu môn cũng dần nới lỏng ra một chút."
1398 = "Thử đoán xem em thay chỗ nào đi, em ấy đang thách thức tôi trong im lặng."
1400 = "Hậu môn bỗng co thắt lại, siết chặt đến mức khiến lưỡi tôi phát đau."
1401 = "Hậu môn lại co thắt mạnh một cái, nhưng vì đã đoán trước được nên lần này tôi không mấy ngạc nhiên."
1405 = "Mang trọn vẹn khuôn mặt của một người phụ nữ, nhưng lại nở một nụ cười thuần khiết đến ngây thơ."
1407 = "Nếu nó đang co giật và khao khát tôi―― thì cũng chẳng khác gì âm đạo cả."
1413 = "Mùi âm đạo trở nên nồng hơn một chút, và gấp nhiều lần như thế, mùi hương của Hibiki lại càng trở nên ngọt ngào và sền sệt hơn."
1421 = "Nước tiểu đã chảy xuống tận mông. Nếu vậy, chừng nào Hibiki chưa bảo dừng lại, tôi sẽ tiếp tục liếm sạch sành sanh."
1423 = "Tôi trượt lưỡi không ngừng theo dòng nước tiểu."
1425 = "Nước tiểu bỗng phun ra mạnh mẽ. Sau đó lại tiếp tục rỏ xuống từng giọt tí tách."
1434 = "Bộ não vốn đang trống rỗng vì bị lấp đầy bởi luồng thông tin khoái cảm áp đảo, cuối cùng cũng được cung cấp lại oxy, và ngôn từ cũng dần phục hồi."
1436 = "Từ cằm xuống gáy, xương quai xanh, bầu ngực―― Tôi khẽ mút lấy núm vú, rồi trượt xuống mạn sườn――bắp đùi――"
1437 = "Em ấy đã hiểu được tâm ý của tôi qua lời nói, nhưng cơ thể em ấy lại càng hút chặt lấy, khao khát tinh trùng của tôi hơn bao giờ hết!"
1438 = "Làm cho trung tâm của tôi nóng bừng lên, mùi hương rỉ ra từ sâu bên trong Hibiki cũng ngày càng trở nên nồng đậm."
1445 = "Khi tôi đổ gục xuống đè lên người Hibiki――"
1447 = "Tôi cũng, muốn ra. Nghĩ vậy――tôi liền rời môi khỏi đũng quần của Hibiki."
1449 = "Chồng lên nhau, dính sát vào nhau, trao đổi mồ hôi và nước bọt trong một nụ hôn ngọt ngào."
1450 = "Bằng một giọng nói bình tĩnh nhất có thể. Tôi chậm rãi dùng những ngón tay vuốt ve mái tóc em ấy."
1452 = "Tôi kéo hông lùi lại một nhịp thật sâu, rồi nhắm thẳng vào điểm yếu nhất của Hibiki mà kinh nghiệm đã chỉ cho tôi――"
1454 = "Trong lúc tôi còn đang nghẹn lời định cản lại, vết ố đã đọng thành giọt, rỏ từng giọt tí tách xuống."
1455 = "Vừa khít khao. Lại vừa trơn tuột."
1458 = "Tôi nuốt nước bọt."
1460 = "Tôi trải khăn tắm xuống sàn giữa hai chân đang mở rộng của em ấy, căn đúng vị trí đũng quần của Hibiki rồi đặt chậu rửa mặt xuống."
1461 = "Tôi muốn làm em ấy mang thai."
1465 = "Tôi vội vàng chuẩn bị vài thứ rồi quay trở lại phòng của Hibiki."
1466 = "Cảm giác như sẽ bị vắt kiệt không giới hạn, nếu không thì cũng bị tụ máu mất, tôi hơi sợ nên đã rút ra khi tinh dịch vẫn chưa bắn hết."
1467 = "Cảm thấy nói ra thành lời thì quá đỗi tội lỗi, tôi chỉ biết áp đầu dương vật đang cương cứng vào lỗ hậu môn đang co giật ấy."
1468 = "Cảm giác như có thể xuất tinh bất cứ lúc nào, muốn làm dịu đi nên tôi véo núm vú em ấy, nhưng Hibiki lại càng giật giật siết chặt lấy tôi hơn."
1473 = "Tôi liếm sạch sẽ lỗ niệu đạo và cửa mình, sau đó chuyển sang liếm láp quanh gốc đùi em ấy."
1475 = "Tôi rút ngón tay ra, thay vào đó, áp chóp mũi vào rãnh âm đạo của em ấy rồi cọ xát."
1476 = "Tôi cẩn thận lau sạch dương vật đang cương cứng, rồi lần này, áp sát nó vào cửa mình của Hibiki."
1479 = "Tôi bóp lấy hai bầu mông thịt rồi vạch rộng ra――"
1481 = "Cái vỗ mông định làm ám hiệu của tôi, chẳng biết là do phản xạ phòng vệ hay gì mà lại khiến lỗ hậu môn co thắt lại dữ dội!"
1483 = "Tôi thỏa thích hút lấy dòng mật dịch của Hibiki thấm trên quần lót, và thay vào đó là chà xát để nước bọt của tôi thấm đẫm vào."
1485 = "Dọc theo đường rãnh ướt át hằn rõ qua lớp vải, chỉ cần hơi ấn nhẹ đầu ngón tay vào là đã phát ra âm thanh ẩm ướt nặng nề."
1488 = "Tôi dùng lưỡi đẩy nước bọt ra, rồi truyền thẳng vào hậu môn của Hibiki."
1489 = "Tôi dùng môi mút chặt lấy chiếc quần lót đẫm nước tiểu, như thể đang vắt kiệt nó."
1491 = "Khi tôi lùi lại một chút và chăm chú nhìn, Hibiki nhận ra ánh mắt của tôi, hai vai khẽ run lên."
1492 = "Một mùi amoniac xộc thẳng vào mũi, mùi hương mà từ nãy đến giờ chưa hề có."
1494 = "Khi tôi tách khe thịt âm đạo ra, lượng nước tiểu đọng lại bên trong liền bắn ra và lọt vào miệng tôi."
1496 = "Càng thoa nhiều nước bọt lên, âm đạo của Hibiki càng trở nên nóng rực và co giật dữ dội hơn."
1498 = "Tôi vội vàng rút miệng khỏi người Hibiki, thấy hai đầu gối của em ấy đang run rẩy lập cập."
1500 = "Chỉ cần dùng sức một chút là nước tiểu lại trào ra, mùi vị cũng lập tức lan tỏa trong khoang miệng."
1503 = "Thế nên em ấy mới cất nó vào trong tủ. Vậy mà em ấy lại cất công thay bộ đồ này."
1514 = "Đón nhận rồi thì tuyệt đối không buông ra, em ấy ôm chặt lấy tôi, liên tục siết chặt lại, chống cự lại từng nhịp rút ra của tôi!"
1517 = "Đúng như mong muốn, tôi đẩy hông tới tấp, ấn ngập phần đầu dương vật cương cứng vào miệng tử cung của Hibiki!"
1558 = "Hibiki ngả nửa thân trên xuống giường, rồi chổng mông về phía tôi."
1562 = "Hibiki vẫn ngoan ngoãn vén vạt váy lên, chờ đợi tôi quay lại."
1563 = "Em ấy ngay lập tức tha thứ cho sự bất cẩn của tôi, và khẽ gật đầu――!!?"
1566 = "Ánh mắt tinh nghịch của Hibiki."
1568 = "Có vẻ như Hibiki đã hiểu lầm lời \"xin lỗi\" của tôi."
1571 = "Đôi má em ấy ửng đỏ, miệng cứ mở ra rồi lại khép vào."
1572 = "Hibiki đi học về."
1573 = "Hibiki giật lại chiếc quần lót từ tay tôi, và đưa cho tôi tờ khăn giấy ướt để thay thế."
1574 = "Để tôi dễ nhìn hơn, Hibiki vén váy lên. Phía trước, bên dưới——à, cái này sao?"
1577 = "Có phải Hibiki vừa mới đạt cực khoái nhẹ không? Thứ bắn vào trong miệng tôi, tuy có lẫn cả nước tiểu――nhưng đó là mật dịch từ âm đạo của em ấy."
1578 = "Một tiếng rên rỉ. Mùi amoniac trở nên nồng nặc hơn. Hai đùi trong của Hibiki run rẩy bần bật."
1580 = "Tinh dịch của tôi vương vãi, trang trí cho cặp mông tròn trịa trắng muốt của Hibiki."
1582 = "Hai núm vú của Hibiki, cương cứng và khẽ run lên như thể đang mời gọi tôi liếm láp."
1584 = "Hibiki thở hổn hển, nhịp thở trở nên gấp gáp. Mồ hôi rịn trên trán và cổ, đôi mắt ướt át đầy đê mê."
1587 = "Dòng nước tiểu của Hibiki không có lực, như đang e thẹn, thấm vào quần lót, đọng thành giọt màu vàng rồi nhỏ xuống."
1589 = "Hibiki thở dốc, tấm lưng nhấp nhô theo từng nhịp thở lớn."
1591 = "Một giọng nói đan xen giữa kỳ vọng và bất an."
1592 = "Bên trong lỗ hậu môn của Hibiki có vị đắng và chát."
1594 = "Âm đạo của Hibiki giờ đây đã hoàn toàn ướt sũng và mềm nhũn, uốn lượn bám chặt lấy, đón nhận dương vật cương cứng của tôi."
1597 = "Âm đạo và tử cung của Hibiki, hơn bao giờ hết, đã khao khát tinh dịch của tôi một cách mãnh liệt nhất, và vắt kiệt không còn sót lại một giọt nào."
1599 = "Cơ thể Hibiki run lên bần bật, và âm đạo siết chặt lại hết cỡ!"
1600 = "Em ấy phát ra một âm thanh như thể pha trộn giữa tiếng \"Hyaa\" và \"Iyaan\"."
1601 = "Một âm thanh khịt mũi nhỏ vang lên. Có lẽ bản thân Hibiki cũng đang ngửi mùi của chính mình."
1604 = "Cuối cùng, Hibiki cũng giống như tôi lúc nãy, im lặng――và khẽ gật đầu."
1608 = "Ban đầu tôi chỉ định cho phần đầu vào."
1613 = "Mùi hương cũng ngày càng nồng hơn―― Hửm?"
1614 = "Những giọt nước chảy dọc theo đùi của Hibiki, có vẻ như sắp thấm cả vào đôi tất――"
1619 = "Muốn xoa dịu em ấy dù chỉ một chút, tôi vừa giữ nguyên tư thế áp sát vừa vươn tay ra――"
1620 = "Dù là khoét sâu, vặn xoắn hay cọ xát, dù chuyển động thế nào đi chăng nữa, âm đạo đáng yêu của Hibiki vẫn mang đến cho tôi khoái cảm tột đỉnh."
1622 = "Em ấy chỉ ngoảnh nửa người lại, và dùng đôi mắt ướt át――như đang nài nỉ tôi."
1625 = "Lượng mật dịch của Hibiki tiết ra nhiều hơn hẳn so với lúc tôi chạm tay vào."
1626 = "Phần đầu dương vật bị kéo căng ra―― Cảm giác như miệng tử cung đang hút lấy tôi vậy――"
1632 = "Chịu thôi. Đồng phục thì vẫn là đồng phục... Nếu có thay thì chắc là tất chăng? À, ra vậy."
1639 = "Tinh dịch đã dồn lên đến tận đỉnh quy đầu. Nếu vậy, để Hibiki có thể cùng lên đỉnh――"
1641 = "Tuy nhiên, dương vật đang cương cứng của tôi, sau khi xuyên qua đường hầm chật hẹp của hậu môn, đã đâm tọt vào tận sâu bên trong!"
1649 = "Cứ giữ nguyên thế này, không rút ra―― Tôi lại khao khát Hibiki thêm một lần nữa."
1650 = "Kích thích thể xác luôn là con dao hai lưỡi. Nếu vậy――nếu vậy, hãy bắt đầu từ tâm hồn――"
1658 = "Hậu môn vẫn không ngừng siết chặt lại."
1659 = "Chỉ có phần hậu môn là siết lại cực kỳ chặt, còn bên trong thì không siết mà lại dính chặt lấy."
1667 = "Đầu lưỡi tôi hơi tê rát, nhưng nước bọt vẫn không ngừng ứa ra đầy trong khoang miệng."
1675 = "Âm đạo siết chặt lại một cách dữ dội, khiến tôi vội vàng ngồi thẳng dậy."
1678 = "Ngay khi vừa dứt nụ hôn, tôi dùng chính chiếc lưỡi ấy, liếm láp trượt dọc theo cơ thể của Hibiki."
1685 = "Chỉ một suy nghĩ đó thôi cũng đủ lấp đầy cơ thể, nhưng trong đầu tôi lại cảm thấy có chút bất an."
1686 = "Cơ thể đáp lại tiếng gọi của con tim."
1696 = "Tôi cũng rất muốn làm vậy. Nhưng mà, bây giờ thì――"
1697 = "Nếu là thế này, nếu là thế này thì có thể cùng với Hibiki!!"
1698 = "Hơi bất an thật――phải khử trùng thôi. Vừa nghĩ vậy, tôi liền để mắt tới thứ đang rơi trên sàn."
1699 = "Cảm giác đó đã tháo tung chốt chặn cuối cùng trong tôi. Tôi tóm lấy eo Hibiki, và cứ thế đâm rút liên tục chỉ để được xuất tinh!"
1700 = "Suy nghĩ ấy liền truyền thẳng đến chuyển động của hông!"
1708 = "Dù qua lớp vải mỏng cũng có thể nhận ra, âm đạo của Hibiki đang co giật, hút chặt lấy lưỡi tôi như thể đang cầu xin được đưa vào."
1711 = "Tôi không thể phân biệt được đây là mùi cơ thể hay là mùi pheromone như người ta vẫn thường nói, nhưng――"
1713 = "Khăn quàng cổ thì chắc được tính là phụ kiện rồi, vậy thì, váy thì sao nhỉ?"
1791 = "（Cọ cọ——Cọ cọ——Giật mạnh）"
1793 = "（Liếm——Liếm——Chụt——Chụt）"
1794 = "（Chùn chụt!）"
1795 = "（Nhóp——nhép——nhép——phụt!）"
1796 = "（Chùn chụt!）"
1797 = "（Bạch! Bạch! Bạch! Bạch!!）"
1798 = "（Bốp!）"
1799 = "（Bốp——）"
1800 = "（Phập!）"
1802 = "（Chùn chụt!）"
1803 = "（Chụt）"
1804 = "（Phập!）"
1805 = "（Phập! Phập! Phập! Phập!）"
1806 = "（Phụt!）"
1811 = "（Phụt——Phụt——Phụt! Phụt!）"
1812 = "（Phụt! Phụt! Phụt! Phụt!）"
1813 = "（Phụt! Phụt! Phụt! Phụt!）"
1814 = "（Phụt! Phụt! Phụt! Phụt!）"
1816 = "（Phập——Phụt!）"
1817 = "（Phập! Phập! Phập! Phụt!!）"
1819 = "（Phụt! Phụt! Phụt! Phụt!!）"
1820 = "（Nếu làm tình để mang thai――vừa mới đút vào mông xong, mà lại cho ngay vào trong âm đạo thì, có an toàn không nhỉ?）"
1825 = "（Thế này thì――không kìm được mất. Ít nhất thì――cùng với Hibiki――cùng với Hibiki――）"
1828 = "（Tách ra）"
1831 = "（Áp sát——Ngửi ngửi——Hít——Hít）"
1832 = "（Trượt ra!）"
1833 = "（Vê nhẹ!）"
1835 = "（Chỉ chỉ）"
1837 = "（Nắn bóp——Xoa nắn——）"
1838 = "（Xuyên vào）"
1840 = "（Áp sát——Hự——Ngửi ngửi）"
1841 = "（Vuốt ve）"
1842 = "（Đổ sập）"
1843 = "（Nhặt lên）"
1844 = "（Thắt chặt!!!）"
1847 = "（Hơi mặn――ấm ấm――và chát chát. Đúng là, nước tiểu thì phải có vị như thế này nhỉ）"
1850 = "（Nóng hổi）"
1851 = "（Phập! Phập! Phập! Phụt!）"
1852 = "（Chảy xuống）"
1853 = "（Tí……tách——Tí……tách……tách）"
1854 = "（Phập!!!）"
1855 = "（Khịt khịt——Khịt khịt!）"
1856 = "（Khịt khịt）"
1857 = "（Liếm láp）"
1860 = "（Nhóp——nhép——nhóp nhép——）"
1862 = "（Ngửi ngửi）"
1863 = "（Liếm nhẹ）"
1864 = "（Chụt）"
1865 = "（Áp sát）"
1867 = "（Nằm sấp）"
1868 = "（Nhóp nhép）"
1869 = "（Vén lên）"
1873 = "（Cái này――tuyệt thật. Không ngờ lại khác biệt với âm đạo đến mức này――）"

[selections]
