37 = "(……Không phải là gặp tai nạn gì đâu nhỉ.）"
76 = "Bởi vì \\x%lエアクラ;#00ffc040;Aircra%l;#; cung cấp một phương thức di chuyển đơn giản và hiệu quả cao,\\nđến mức buộc người ta phải ngừng suy nghĩ về giao thông."
1877 = "\"Không thừa không thiếu\" thì lúc nào cũng là không đủ.\\nBất cứ ai cũng mong muốn một dịch vụ đặc biệt dành riêng cho \"chỉ mình mình\"."
1878 = "Nụ cười xã giao đã dính chặt trên khuôn mặt tôi rồi.\\nĐến mức nếu không có ý thức \"gỡ nó xuống\" thì không thể nào gỡ ra được."
1889 = "……Tờ báo mà chị Mayami đưa cho,\\\\nđối với chúng tôi lúc này thực sự quá đỗi nặng nề."
1893 = "……Nghe ngóng được cả những chuyện chưa công bố,\\nquả không hổ danh là nhà báo."
1895 = "……Một câu hỏi quá đỗi trẻ con,\\nmà câu trả lời đã quá rõ ràng."
1900 = "「Việc tự chế tạo hay cải tạo toa xe và sa bàn \\\\x%lNゲージ;#00ffc040;N-gauge%l;#;,\\\\nthì sao? Có khó lắm không?」"
1906 = "「――Chuyện là như vậy đấy. Tôi thấy đó là một kế hoạch khá tốt,\\nnên cứ nghĩ là do Ngân hàng Kumamoto đề xuất cơ……」"
1908 = "「――Là ứng cử viên Migita Hibiki sao?」"
1913 = "「Người xưa có câu \"Miệng đời không thể che đậy\",\\\\nhơn nữa việc công bố ở giai đoạn chưa thấy khả năng thực hiện sẽ là một con dao hai lưỡi.」"
1916 = "「\\\"Muốn giữ lại những khung cảnh đường sắt đã mất trong tầm tay\\\",\\\\nđó hiện là thú vui đường sắt phổ biến nhất――――――A.」"
1919 = "「…………Em không muốn trả lời đâu.」"
1921 = "「…………」"
1924 = "「……Ra là vậy, cơ chế hoạt động là thế này sao.\\\\nKiHa 07 trong mô hình này, thực chất là \\\\x%l電車;#00ffc040;tàu điện%l;#; nhỉ.」"
1926 = "「Vâng……」"
1928 = "「Là vì Hibiki nói……\\\\nmuốn suy nghĩ lại từ con số không. Đúng không ạ?」"
1931 = "「……Ít nhất thì không có sự can dự của tôi.\\nĐó là một dự án như thế nào vậy?」"
2239 = "「Chỉ một người.」"
2241 = "「Trắng xóa――Em không nhìn thấy gì nữa, em sợ lắm――\\nRồi mọi thứ, kiểu như, lại càng lộn xộn hơn.」"
2245 = "「Nhu cầu đi làm và đi học nhỉ.」"
2246 = "「Không……」"
2248 = "「Về phần toa xe, \\\\x%l台車;#00ffc040;giá chuyển hướng%l;#; và động cơ có thể dùng lại được, còn thân xe,\\\\nchỉ cần vẽ bản thiết kế theo tỷ lệ thu nhỏ, cắt tấm nhựa rồi sơn lên là xong.」"
2253 = "「Không phải tệ hại gì hết!\\nChỉ có cách đó, em mới truyền đạt được cảm giác có lỗi của mình thôi!!」"
2254 = "「Tôi đâu có làm đến mức đó.\\nNgoài cô ra, tôi chỉ dự định phỏng vấn thêm một ứng cử viên nữa thôi.」"
2256 = "「Không cần lo đâu. Anh sẽ làm tốt thôi.」"
2258 = "「Dù là giao thông, hay sự phát triển của Ohimitera,\\nbất cứ việc gì cũng nên có nhiều con đường.」"
2260 = "「Lúc tuyên bố tranh cử, và cả trước đó nữa,\\nem đã từng nói rồi mà, 『Em muốn thử suy nghĩ lại từ con số không』.」"
2263 = "「Nhưng mà này, Sou-chan」"
2264 = "「Nhưng, họ đã hiểu rằng điều Hibiki đang suy nghĩ từ con số không,\\\\nchính là phương pháp kết hợp giữa bảo vệ môi trường và phát triển kinh tế.」"
2266 = "「Không, xin cứ ở lại.」"
2270 = "「Giống như tờ giấy trắng ạ? Nhưng là 3D.」"
2271 = "「Tóm lại, sự an toàn của nước thải từ nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\ncó thể coi là đã được quốc gia bảo đảm đúng không?」"
2272 = "「Vậy là một nhà máy to tướng sẽ được dựng lên ở phía đông bến thuyền sao?」"
2278 = "「Nói cách khác, hướng tới \"sự tồn tại song song\" chứ không phải là loại trừ.\\nHôm nay tại đây, anh đã giúp tôi nhận ra góc nhìn đó.」"
2279 = "「Đã rõ thưa cô.」"
2280 = "「Xin cứ giao cho tôi. Cả hai việc tôi đều sẽ hoàn thành một cách hoàn hảo.」"
2288 = "「Gì đây, \\\\x%l運転台;#00ffc040;buồng lái%l;#; à?」"
2293 = "「Hôm nay anh Ichikawa được độc chiếm nó đấy.\\nCứ từ từ mà ngắm nghía từng chi tiết cho thỏa thích nhé.」"
2297 = "「Phát triển kinh tế có thể thực hiện xoay quanh dự án phục hồi toa xe.\\\\nNếu làm được như vậy, sự cần thiết của việc thu hút nhà máy \\\\x%lエアクラ;#00ffc040;Aircra%l;#; cũng sẽ biến mất.」"
2303 = "「Có vẻ, không phải vậy. Migita Hibiki……\\nNghe nói đó là đề xuất của cô bé ứng cử viên đó.」"
2304 = "「Nhưng――」"
2308 = "「Em bảo không vẽ được――là tấm áp phích……\\ncái mà em gọi là, hình ảnh chủ đạo đó sao?」"
2309 = "「Cái này——là cái này sao?\\\\nÝ anh là sa bàn N-gauge á?」"
2311 = "「Em không sao chứ!? Thuốc――\\nỞ đây có đủ các loại thuốc đấy.」"
2314 = "「Sao vậy, em――sắc mặt em sao thế kia.」"
2315 = "「Lúc đó, nhớ gọi tôi nhé.」"
2316 = "「Này, uống đi.」"
2322 = "「Thay vì thế, cô có thể cho chúng tôi,\\nmột chút đồ uống ấm được không?」"
2323 = "「Hệ thống sông ngòi cấp một――chỉ tính riêng những hệ thống sông ngòi được quốc gia công nhận là quan trọng,\\nđã có chừng này con sông đang cùng tồn tại với nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;.」"
2328 = "「Hachiroku-chan thì phụ giúp việc lên bản vẽ cho N-gauge,\\\\nvà chuẩn bị toàn bộ những việc cần thiết để hồi sinh \\\\x%l8620;#00ffc040;8620%l;#; nhé.」"
2336 = "「Nagi. Đừng hậm hực như vậy.\\nViệc thể hiện 『sức hấp dẫn có thể thấy ngay từ cái nhìn đầu tiên』 là lĩnh vực chuyên môn của Hibiki mà.」"
2338 = "「Dừng lại đi, Hibiki!\\nAnh không cho phép em làm trò đó!」"
2339 = "「Thôi từ từ nào, xếp hàng đi.」"
2343 = "「Chắc sẽ nhộn nhịp lắm đây. Mô hình này thực sự rất tuyệt vời mà.\\nTôi cũng sẽ đến sảnh để xem lại.」"
2346 = "「Lúc phanh nhớ trả \\\\x%lマスコン;#00ffc040;điều khiển trung tâm%l;#; về nhé!\\\\nNếu không sẽ làm hỏng động cơ mất.」"
2352 = "「Động thái?」"
2353 = "「Chạy rồi kìa!」"
2354 = "「Ra là vậy.」"
2366 = "「Hibiki dưới sự ảnh hưởng của Soutetsu,\\nđã có thể vắt óc nghĩ ra được một kế hoạch đến mức đó rồi sao.」"
2367 = "「Nếu vận hành tốt——\\\\nNếu làm cho nó hoạt động trơn tru, chúng ta sẽ thắng.」"
2369 = "「Làm được. Nói đúng hơn là——không được cũng phải làm.\\\\nEm sẽ học cách làm, và em muốn làm việc này.」"
2372 = "「Tuy nhiên――\\nHoushou Kisaki, dù là kẻ thù nhưng toàn đi những nước cờ xuất sắc nhỉ.」"
2374 = "「Nhưng mà, anh biết rõ đấy nhé? ――Hibiki,\\nsẽ không thể nào vẽ được những thứ không phải là sự thật của chính em.」"
2380 = "「Chào anh, rất hân hạnh được đón tiếp,\\nanh Ichikawa của tờ Kumamoto Shimpo.」"
2385 = "「Điều chị muốn giao phó cho em, là tương lai của Ohimitera.」"
2387 = "「Chị muốn hai đứa\\\\nlan truyền chuyện này cho các học sinh trong trường biết.」"
2389 = "「Tất nhiên là tán thành, cực kỳ tán thành, siêu tán thành luôn!」"
2390 = "「Em biết rồi.」"
2391 = "「Oa――Hôn gián tiếp kìa.」"
2394 = "「Oa! Xong rồi! Cửa hàng của mọi người,\\\\ncủa chị Paulette và Reina xong rồi nha!」"
2395 = "「Vâng.」"
2397 = "「Haha. Nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; và dự án tái sinh toa xe.\\nĐây cũng là hướng tới sự tồn tại song song sao.」"
2401 = "「Ây da, tôi có hơi cầm đèn chạy trước ô tô quá không nhỉ.」"
2402 = "「Ehehe, là KiHa 07 của Reina đó nha!」"
2403 = "「Hả!?」"
2404 = "「Hả?」\\\\n「Hả?」"
2406 = "「Ồ! Quả là một tin tốt lành.」"
2408 = "「Ồ? Một câu chuyện có vẻ thú vị đây.」"
2410 = "「Ừm.」"
2411 = "「Ư ư!」"
2413 = "「Ừm. Bởi vì các nghệ nhân mới là những người hào hứng nhất\\\\nvới dự án phục hồi toa xe mà. Phải không ạ?」"
2415 = "「Ừm, tốt lắm.\\nMột cuộc phỏng vấn hiệu quả hơn cả mong đợi đấy chứ.」"
2417 = "「Chà, có thể họ chỉ đang tâng bốc ứng cử viên thôi.\\nNhưng mà sao nhỉ? Cảm giác lại không giống như vậy.」"
2418 = "「A——Đúng là vậy nhỉ.」"
2420 = "「À…… ra vậy.」"
2422 = "「À…… ơ, chuyện đó vẫn chưa được công bố sao?\\nDự án 『Tái sinh toa xe đường sắt』 ấy.」"
2424 = "「À. Về điểm đó, để chắc chắn, xin cho phép tôi bổ sung thêm.」"
2425 = "「A.」"
2427 = "「Chà, nếu vẫn chưa công bố,\\nthì có lẽ đó là một câu chuyện có khả năng thực hiện thấp chăng――」"
2429 = "「Oa, chị vẽ đẹp quá nha.」"
2431 = "「Ahaha, anh khéo đùa thật.」"
2432 = "「A!」"
2434 = "「A! Dạ, em cũng vậy ạ.\\nDù đó là bức tranh tương lai tồi tệ nhất với chúng ta…… nhưng em lại bị cuốn hút mất rồi.」"
2435 = "「À, không.」"
2437 = "「Chắc chắn rồi, cảm ơn cô rất nhiều.」"
2439 = "「A, xin lỗi anh. N là N-gauge.\\\\nNine-gauge——tức là mô hình đường sắt có khổ ray 9mm.」"
2440 = "「À, tôi đã nhận được danh thiếp của cậu ấy rồi.\\nLà nhân viên biệt phái từ công ty \\x%lエアクラ;#00ffc040;Aircra%l;#; đúng không?」"
2444 = "「À, ra vậy, nên anh mới nghĩ đó là đề xuất của Ngân hàng Kumamoto……\\nnói thẳng ra là của tôi, đàn chị của Hibiki đúng không.」"
2446 = "「A, đúng rồi.」"
2448 = "「Ô kìa. Là lúc đó.」"
2450 = "「À, cái đó thì anh hiểu.\\\\nCòn sa bàn——là mô hình này sao?」"
2451 = "「Ưm——khụ khụ」"
2452 = "「Hawawa, chị Hibiki?」"
2453 = "「Ưư…… ư…… hức――sụt sịt.」"
2454 = "「Ưm――」"
2456 = "「Vâng.\\nVì chúng tôi là tiền bối và hậu bối cùng câu lạc bộ ở trường mà.」"
2458 = "「Vâng. Để tinh chế Circuithium, trái tim của động cơ Aero-Craftech,\\nthì cần một lượng lớn nước ngọt.」"
2460 = "「Ừm. Việc đó giao cho Rei-chan nhé.」"
2461 = "「Vâng.」"
2463 = "「Làm thôi! Sở trường của em mà! Cứ giao cho em!!」"
2464 = "「Vâng!」\\\\n「Vâng!」"
2466 = "「Vâng, cứ giao cho em.」"
2469 = "「Chính xác, họ muốn hiện thực hóa kế hoạch này bằng mọi giá.\\\\nTất nhiên cũng có những người ưu tiên bảo vệ môi trường, nhưng——」"
2471 = "「Vâng, được chứ ạ.\\\\n\\\\x%lNゲージ;#00ffc040;N-gauge%l;#; là thế giới mà đến giờ vẫn liên tục ra mắt các mẫu mới mà.」"
2475 = "「Vâng, em sẽ làm. Không chỉ làm mà em sẽ mang lại kết quả.」"
2476 = "「Vâng, đúng vậy. Trong thế giới N-gauge, người ta thường gọi là sa bàn\\\\nthay vì mô hình ạ.」"
2478 = "「Được rồi. Cho vào đi.」"
2480 = "「Vâng?」"
2481 = "「Ồ!」"
2482 = "「Ồ, thì ra là làm nó chuyển động như vậy á!?」"
2484 = "「Ấy, xin hãy đợi một chút trước khi nói về chuyện đó.\\nTôi bật máy ghi âm được chứ?」"
2486 = "「Ây da, đúng vậy nhỉ. Tôi hiểu rồi.」"
2489 = "「À, cái này…… chà,\\nlúc họp báo tranh cử tôi cũng có nhìn thấy từ xa rồi.」"
2490 = "「Ồ.」"
2491 = "「Cậu nói cái gì vậy! Cả Fukami-chan nữa!!」"
2495 = "「Bên trong mô hình này,\\\\ntương lai lý tưởng mà \\\\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; vẽ ra đã trở thành hiện thực nhỉ.」"
2502 = "「Được mọi người kỳ vọng, em rất vui,\\nvà rồi em cứ nghĩ, muốn vẽ cái này, muốn vẽ cả cái kia nữa.」"
2505 = "「Xin thất lễ.」"
2506 = "「Dạ có em đây nha~」"
2507 = "「Nhanh quá! Nagi, KiHa 07 chạy nhanh quá!」"
2509 = "「Có vẻ thú vị. Nhỉ.\\\\nEm cũng muốn thử điều khiển một chút.」"
2510 = "「Ngọt thật. Ngon lắm.」"
2512 = "「Có vẻ khó quá. Không biết mình làm được không.」"
2513 = "「Được thôi!」"
2515 = "「Nếu mà xây nhà máy ở cái chỗ đó,\\nthì sẽ chẳng còn ai đi thuyền xuôi dòng nữa đâu!!」"
2517 = "「Nếu mục đích chỉ là hiện thực hóa, còn sông Kuma ra sao cũng được.\\\\n……Thì để phía ngân hàng làm sẽ yên tâm hơn nhiều.」"
2519 = "「Cùng với việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\ntôi cảm thấy nếu nó trở thành hai bánh xe thúc đẩy sự phát triển của Ohimitera thì thật tốt.」"
2523 = "「Nếu được thêm một nơi mà em yêu thích nhất ở Ohimitera\\\\nvào bản đồ này, em sẽ chọn gì?」"
2525 = "「Nếu vậy thì!\\\\nThứ bị vứt bỏ không phải là du lịch, mà là môi trường đấy!」"
2536 = "「Xin lỗ——ưm!?」"
2537 = "「Em xin lỗi!!」"
2538 = "「À phải rồi, về mô hình đô thị này,\\ntôi cũng muốn mọi người được chiêm ngưỡng nó ở khoảng cách gần.」"
2539 = "「Đối thủ không phải là người tốt bụng đến mức\\\\ncho phép chúng ta 『chờ đến khi vẽ được』 đâu nha.」"
2540 = "「Đòn kết hợp này hiểm lắm đó nha?\\\\nNếu không phản đòn được thì sẽ bị hạ gục ngay đấy.」"
2541 = "「Bên kia thì 『trưng bày sản phẩm hoàn thiện』.\\\\nCòn chúng ta thì 『mời mọi người cùng tham gia chế tạo』.」"
2542 = "「Bên kia thì 『giải thích và truyền đạt』.\\\\nCòn chúng ta thì 『gợi nhớ lại những điều đã bị lãng quên』.」"
2544 = "「Hi-chan!?」"
2545 = "「Fukami-chan, đừng nói mấy lời thừa thãi chứ!」"
2547 = "「Fukami, mình sẽ cho chạy hết tốc lực,\\\\ncậu nhớ dừng đúng ngay nhà ga nha!」"
2549 = "「Sou-chan. Cái này...」"
2555 = "「Anh Ichikawa, cảm ơn anh vì buổi phỏng vấn.\\nNhờ anh mà tôi đã nhận ra được rất nhiều điều.」"
2560 = "「Ngoài các tòa nhà ra, còn cảnh quan thiên nhiên thì sao?」"
2561 = "「Em đã chờ cái đó từ nãy đến giờ rồi đây này!」"
2568 = "「Chắc anh cũng nói y hệt như vậy\\nvới các ứng cử viên khác chứ gì?」"
2569 = "「Cô đoán đúng rồi. Quả nhiên, đó là một sự tồn tại khiến cô phải bận tâm sao?」"
2571 = "「Về câu hỏi của anh, xin phép để tôi trả lời.\\nNước thải từ nhà máy Aero-Craftech, tất cả đều……」"
2575 = "「Tôi đã bị thuyết phục bởi lời giải thích rất dễ hiểu của cậu.\\nVậy, tôi xin phép quay lại với mô hình đô thị――」"
2577 = "「Tôi mới là người phải cảm ơn,\\nvì cô đã dành chút thời gian quý báu trước khi nhậm chức thị trưởng.」"
2579 = "「Em không biết, mình muốn vẽ cái gì nữa.」"
2581 = "「Em cũng vậy. Ừm……tán thành tuyệt đối. Ạ.」"
2585 = "「Tôi tin rằng một chính quyền như vậy, rồi sẽ đưa Ohimitera――\\nphát triển thành một thị trấn nơi mọi người đều có thể sống với nụ cười trên môi.」"
2587 = "「Anh nghĩ vậy——\\\\nvà anh cũng tin rằng thực ra ai cũng hiểu điều đó.」"
2588 = "「Chị sẽ dốc toàn lực đấy nhé? Hibiki.」"
2589 = "「Em không sao. Sắc mặt không tốt là vì……\\nchỉ đơn giản là do thiếu ngủ và――với lại――」"
2592 = "「Em, không vẽ được! Mọi người đã kỳ vọng, đã giao phó cho em――\\nVậy mà, bức tranh tương lai của Ohimitera, em không vẽ được!!!」"
2593 = "「Anh tất nhiên là ủng hộ Hibiki rồi.\\\\nCòn mọi người thì sao?」"
2595 = "「Họa cụ của chị——cái loại được cất trong hộp gỗ ấy.」"
2597 = "「Mình hiểu rồi Nagi! \\\\nNếu việc hiện thực hóa dự án phục hồi toa xe là ưu tiên hàng đầu...」"
2598 = "「Em tán thành.\\\\nEm thấy việc này có vẻ rất vui và ý nghĩa.」"
2600 = "「Em chuẩn bị ngay đây! Dù nói vậy nhưng đây là di vật của bố em,\\\\nnên em cũng không rành lắm đâu——」"
2602 = "「A, em sẽ phụ một tay. Ạ!」"
2606 = "「Bức tranh tương lai của Hibiki hiện tại, vì thế, đương nhiên phải là một tờ giấy trắng.\\nThật ngu ngốc khi anh lại quên mất điều đó.」"
2607 = "「Không có chuyện đó đâu!」"
2613 = "「Thêm thắt vào sa bàn này để tạo thành một thành phố Ohimitera khổng lồ——\\\\nKhông, thà làm luôn mô hình quy mô lớn dọc tuyến Yui đi.」"
2614 = "「Đặt cái này, bên cạnh nhà ga này……nhẹ nhàng thôi.」"
2616 = "「Việc bỏ phiếu còn chưa xong mà.\\nDù biết là lời nịnh nọt nhưng tôi vẫn cảm thấy áp lực đấy.」"
2620 = "「Dễ lắm, em muốn thử không?」"
2623 = "「Từ bỏ du lịch, tái thiết Ohimitera thành một thành phố công nghiệp.\\\\nĐối với các kỹ sư và nghệ nhân, đây quả là một kế hoạch hấp dẫn.」"
2624 = "「Buông em ra! Anh hai! Em, em phải,\\nphải xin lỗi mọi người!」"
2630 = "「Hibiki á?」"
2631 = "「Hibiki!」"
2633 = "「Hibiki!?」\\n「Làm gì vậy!?」"
2641 = "「Từ ngày mai, nó sẽ được trưng bày tại sảnh chi nhánh Ohimitera của Ngân hàng Kumamoto.\\nRất mong mọi người sẽ đến xem 『Thành phố \\x%lエアクラ;#00ffc040;Aircra%l;#; Ohimitera』.」"
2645 = "「Đúng vậy. Hay nói đúng hơn... nếu không làm được thì chúng ta thua chắc.\\\\nPhải cho họ thấy sự to lớn của những thứ sắp mất đi bằng cách nào đó để ai cũng hiểu được.」"
2647 = "「Chắc…… vậy thôi.」"
2649 = "「Đúng đó! Ai nấy đều hừng hực khí thế luôn mà!」"
2651 = "「Đúng vậy. Anh cũng nghĩ thế.」"
2652 = "「Vậy sao.\\nNếu thế thì, xin mời anh xem qua cái này.」"
2653 = "「Là do anh thiếu chu đáo.\\nAnh xin lỗi.」"
2656 = "「Đúng vậy. Do đó, sự cộng sinh giữa \\x%lエアクラ;#00ffc040;Aircra%l;#; và đường sắt,\\nsự tồn tại song song――đó là điều bắt buộc.」"
2660 = "「Đúng vậy. Việc Hibiki có mối quan hệ tiền bối - hậu bối với Kisaki\\\\ncũng là một nguyên nhân gây ra những nghi ngờ không đáng có.」"
2662 = "「Đúng vậy, \\\\x%lNゲージ;#00ffc040;N-gauge%l;#; đều chạy bằng điện hết.」"
2664 = "「Đúng vậy, là sự tồn tại song song.」"
2668 = "「Là cô Mayami――\\nHay là của cựu thị trưởng Paulette?」"
2669 = "「Chính Soutetsu đã đề xuất, hay để Hachiroku đề xuất――\\nHay là, anh ta đã “khơi gợi” ý tưởng đó từ Hibiki?」"
2670 = "「Là bộ cấp nguồn có hình dáng như vậy ạ. Cắm cái này vào ổ điện.\\\\nRồi cắm dây này vào đầu nối của đường ray——」"
2674 = "「Nếu không bị sao chép trắng trợn thế này,\\\\nthì dù có bị biết cũng chẳng ngứa ngáy gì đâu.」"
2681 = "「Còn đẹp hơn thế này nữa sao?」"
2682 = "「Không cần đâu ạ.\\nAnh ơi, mọi người. Xin lỗi vì đã để mọi người phải đợi.」"
2683 = "「Đúng vậy. Nếu do ngân hàng chủ trì,\\\\nđộ uy tín và ổn định của dự án sẽ tăng vọt lên một bậc.」"
2686 = "「Sông thì chắc là đổ nhựa pha màu vào phần xốp đã khoét.\\\\nCòn núi thì đắp lên rồi tô màu và rắc……cát màu.」"
2690 = "「Paulette」"
2691 = "「Paulette, xin lỗi nhé, tôi mượn điện thoại được không?」"
2692 = "「Bị sao chép thì có gì mà rắc rối đến vậy chứ?」"
2695 = "「Rồi để mọi người thêm 『khung cảnh Ohimitera yêu thích của mình』 vào đó.\\\\nPhải làm sao cho ai cũng có thể dễ dàng tham gia. Cụ thể là——」"
2696 = "「Càng nghĩ muốn vẽ thêm nhiều thứ, mọi thứ lại càng trở nên lộn xộn,\\nthế là em, quyết định quay lại với bức tranh tương lai mà em thực sự muốn vẽ.」"
2699 = "「Reina?」"
2701 = "「Reina sẽ giúp chị Paulette một tay nha!」"
2703 = "「Reina cũng muốn thấy KiHa 07\\\\nchạy trong một Ohimitera rộng lớn hơn nha!」"
2704 = "「Reina cũng vậy đó ạ~ Reina cũng muốn cho \\x%lキハ07;#00ffc040;KiHa 07%l;#;\\nchạy trong mô hình thành phố Ohimitera thu nhỏ đó nha~」"
2710 = "「Cái này, bây giờ chỉ tạm thời dùng bút chì màu và giấy vẽ thôi.\\\\nNếu chọn giấy tốt và tô bằng màu bột, chất lượng sẽ còn cao hơn nữa.」"
2711 = "「Chủ lực hiện tại của phe Hibiki bao gồm hai nhóm: phe Paulette cũ,\\\\nvà nhóm tình nguyện viên đường sắt.」"
2715 = "「Khi phác thảo xong,\\\\nchị sẽ đơn giản hóa nó, rồi dựng thành bản vẽ——thành mô hình giấy.」"
2720 = "「Này nhé? Đây là cần phanh,\\\\ncòn đây là bộ điều khiển trung tâm.」"
2724 = "「Thú vị thật đấy. Đối thủ của tôi giờ đây,\\nđã không còn là Migita Hibiki mà tôi từng biết nữa rồi.」"
2725 = "「Cái này thú vị lắm luôn. Chắc chắn sẽ có nhiều người\\\\nđến xem hơn cả hồi triển lãm nữa.」"
2730 = "「Chị Mayami thấy sao?」"
2733 = "「Sông Ishikari, sông Kitakami, sông Mogami, sông Shinano, sông Jintsu, sông Kiso,\\nsông Kuzuryu, sông Kako, sông Kino, sông Ibi, sông Shimanto, sông Chikugo.」"
2737 = "「Quả thực, anh cũng bị choáng ngợp.\\nNó――đẹp đẽ bởi sự tỉ mỉ và khối lượng công việc khổng lồ.」"
2743 = "「Thưa cô Kisaki. Mọi thứ đã chuẩn bị xong xuôi rồi ạ.」"
2746 = "「Thưa cô Kisaki, sắp đến giờ của cuộc hẹn tiếp theo rồi ạ.」"
2748 = "「Thưa cô Kisaki, sắp đến giờ rồi ạ.」"
2753 = "「Công ty Aero-Craftech luôn hướng tới sự cộng sinh với các phương tiện giao thông truyền thống.\\nĐây không phải là câu chuyện chỉ giới hạn ở Ohimitera.」"
2761 = "「Nói đơn giản là sao chép toàn bộ. Kisaki đã nghe được kế hoạch phục hồi toa xe,\\\\nrồi bê nguyên xi. Cô ta tuyên bố sẽ thực hiện song song với việc thu hút nhà máy \\\\x%lエアクラ;#00ffc040;Aircra%l;#;.」"
2767 = "「Không chỉ vậy, còn có rất nhiều người đam mê tự chế, cải tạo toa xe và sa bàn,\\\\nhay còn gọi là những người đam mê mô hình đường sắt nữa.」"
2768 = "「Không chỉ vậy, cái này——còn có thể dễ dàng và hiệu quả\\\\nkết hợp với 『Dự án phục hồi toa hành khách』 nữa.」"
2770 = "「Đã vậy, lại còn có mô hình đô thị\\\\n『Thành phố \\\\x%lエアクラ;#00ffc040;Aircra%l;#; Ohimitera』 hậu thuẫn nữa chứ.」"
2773 = "「Phe Paulette cũ rất đoàn kết trong việc bảo vệ hệ thống sông Kuma và phản đối thu hút nhà máy. Trước đây họ chưa hoàn toàn ủng hộ Hibiki——」"
2779 = "「Giá như tôi bịt miệng họ kỹ hơn——\\\\nHoặc là công bố sớm hơn.」"
2781 = "「Để việc phục hồi \\\\x%l客車;#00ffc040;toa hành khách%l;#; đi vào quỹ đạo, chỉ có thể trông cậy vào mạng lưới quan hệ \\\\x%lまいてつ;#00ffc040;chủ tàu%l;\\\\n#; của Pau-chan thôi. Trăm sự nhờ em đấy.」"
2785 = "「Nếu muốn xin lỗi thì cứ xin lỗi bình thường đi!\\nQuỳ rạp xuống như thế, chỉ là một màn trình diễn tệ hại thôi!」"
2791 = "「Làm thì làm, nhưng không làm thành hình dạng hoàn chỉnh.\\\\nPhần thêm vào, cứ cố tình để trống trơn như vậy.」"
2792 = "「Nhắc mới để ý, em ấy chậm thật đấy.」"
2793 = "「Cứ tự nhiên.」"
2794 = "「Xin hãy giao việc này cho em.\\\\nHãy để em giúp mọi người vẽ nên bản đồ tương lai.」"
2795 = "「X-xin chị dừng lại đi――sao lại, thế này.」"
2807 = "「Càng nhìn càng thấy…… chà, quả thực là một tác phẩm tuyệt vời.」"
2814 = "「Vụ dự án tái sinh toa xe――\\nNhững nhận thức về vấn đề đó đối với tôi là rất lớn.」"
2817 = "「Quay lại――rồi sao nữa?」"
2841 = "「Cái này——là」"
2842 = "「Về chuyện đó, để Uragami giải thích.\\nUragami là」"
2843 = "「Thế nào đây? Em sẽ cho chị thấy chứ?\\nHibiki――toàn bộ sức mạnh của em.」"
2844 = "「Cái này――là quỳ rạp xin lỗi đấy, lần đầu tiên em thấy luôn.」"
2845 = "「Cái này——có dùng được không?」"
2846 = "「Dạ, sa bàn thì chỉ cần gọt xốp,\\\\ntô màu, rồi đặt mô hình thu nhỏ lên là được mà……」"
2847 = "「Chuyện đó tất nhiên là chị biết rồi? Nhưng mà……\\nNày, Nagi-chan không thấy nó đẹp sao?」"
2848 = "「Tôi hiểu rồi.\\nThực tế thì, tất cả các nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; hiện có đều――」"
2850 = "「Tuyến đường sắt và \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; cũng có trong mô hình này nhỉ?」"
2852 = "「Đó là hình ảnh mô phỏng \\x%l8620;#00ffc040;8620%l;#; của Công ty Cổ phần Đường sắt Ohimitera.\\nNếu khu dân cư được mở rộng nhờ việc thu hút nhà máy, tầm quan trọng của đường sắt cũng sẽ tăng lên.」"
2854 = "「Tầm quan trọng đó,\\nchỉ có ở một nơi có khu vực \\x%lエアクラ;#00ffc040;Aircra%l;#; không thể hoạt động như Ohimitera thôi sao?」"
2856 = "「Vậy thì, những động thái của Đường sắt Ohimitera,\\ncũng có sự can thiệp của Ngân hàng Kumamoto sao?」"
2857 = "「Tôi rất vui vì cô đã sắp xếp thời gian\\nđể tôi có cơ hội phỏng vấn.」"
2858 = "「Thông tin chưa công bố cũng được thu thập theo cách đó sao?\\nLẻn vào văn phòng chiến dịch tranh cử――chẳng hạn.」"
2859 = "「Cái đó thì em cũng biết.」"
2860 = "「Thế là sao!!?」"
2863 = "「Nhờ lời thuyết phục đó, những người ủng hộ Paulette đã kiên định ủng hộ Hibiki.\\\\nPhương án sao chép kia chắc cũng không ảnh hưởng đến nhóm này đâu.」"
2865 = "「Đảm nhận toàn bộ hậu phương của cuộc bầu cử,\\\\nvà tiếp tục huấn luyện chuẩn bị cho sự hồi sinh của \\\\x%l8620;#00ffc040;8620%l;#; đúng không.」"
2869 = "「Bến thuyền! Cả bến thuyền và thuyền xuôi dòng nữa!」"
2871 = "「Nói vậy là――cụ thể cô đã nhận ra điều gì?」"
2879 = "「Vậy thì có gì mà tệ đến thế?」"
2881 = "「Thế thì, đạp phanh là được chứ gì.」"
2882 = "「Nếu vậy, em cũng muốn có lò rèn nhà em nữa!」"
2884 = "「Vậy thì chị yên tâm rồi.」"
2885 = "「Vậy thì tốt quá.」"
2887 = "「Vậy thì, trà sữa nhé.\\nTất nhiên, tôi sẽ chuẩn bị cho tất cả mọi người.」"
2888 = "「Vậy thì, thử cách đó xem sao.\\\\nReina, lại đây nào.」"
2891 = "「Mô hình đô thị đó……\\nThật đáng tiếc, nhưng tôi đã bị nó hớp hồn mất rồi.」"
2892 = "「Tại sao em lại không vẽ được……\\nLý do, em có biết rõ không?」"
2893 = "「Vậy――trong buổi phỏng vấn hôm nay,\\ntôi nên nói về những vấn đề gì đây?」"
2894 = "「Vậy thì, chúng ta cùng hướng về phía trước nào.\\nHãy ngước nhìn lên, để Hibiki có thể tìm ra sự thật của chính mình.」"
2895 = "「Vậy thì, anh muốn tận mắt nhìn thấy\\\\nhình ảnh sống động của sa bàn này ở cự ly gần.」"
2896 = "「Vậy thì! Phải làm cho họ hiểu rõ hơn nữa mới được!」"
2897 = "「Nếu vậy, thế này thì sao?」"
2899 = "「Vậy thì, ừm……\\\\nA, chị Mayami, xin lỗi nhé.」"
2901 = "「Vậy, Hi-chan.」"
2902 = "「Còn Sou-chan thì vẫn như trước giờ.」"
2907 = "「Rail Shop!\\\\nChắc chắn là Rail Shop rồi ạ.」"
2908 = "「Nhóm tình nguyện viên đường sắt——\\\\ntức là nhóm kỹ thuật viên gần gũi với chúng ta hơn.」"
2912 = "「Có KiHa 07, và cả 8620 nữa nhỉ.\\\\nNgoài ra, có thể chuẩn bị thêm \\\\x%l客車;#00ffc040;toa hành khách%l;#; không?」"
2918 = "「Dù chạy bằng điện thì có chút đáng tiếc,\\\\nnhưng xin hãy cho cả \\\\x%l8620;#00ffc040;8620%l;#; chạy cùng nhé.」"
2920 = "「Mô hình đô thị này cũng đẹp. Thật ạ. Nhưng!\\\\nThiên nhiên Ohimitera và nước sông Kuma còn đẹp hơn nhiều. Lắm ạ!」"
2921 = "「Soutetsu…… Migita, Soutetsu.」"
2922 = "「Ngài Soutetsu? Trên tờ báo đó viết gì vậy ạ?」"
2925 = "「Chưa ra khỏi nhà sao ạ?\\nAnh thử gọi điện xem sao?」"
2928 = "「Cảm ơn cô vì một cuộc trò chuyện thú vị.\\nNhờ cô mà tôi có thể viết được một bài báo chất lượng rồi.」"
2934 = "「Trước tiên, Pau-chan phải chuẩn bị cho kế hoạch phục hồi \\\\x%l客車;#00ffc040;toa hành khách%l;#; và duy trì vận hành bình thường.\\\\nEm phải hoàn thành tốt cả hai việc đó đấy.」"
2937 = "「Đầu tiên là phác thảo. Lắng nghe những người muốn thêm cảnh vật,\\\\nrồi vẽ phác thảo ý tưởng thì sao ạ?」"
2938 = "「Đầu tiên, tôi muốn hỏi về dự án quy hoạch đô thị\\n『Thành phố Aircra Ohimitera』 mà cô đã đưa ra trong buổi họp báo tranh cử.」"
2940 = "「!」"
2941 = "「Hử?」"
2943 = "「Sa bàn En-nu?」"
2946 = "「Ok. Rail Shop.」"
3112 = "Khung cảnh Ohimitera mà mình yêu thích nhất,\\\\ngần như đồng nghĩa với kỷ niệm quý giá nhất của người đó sao."
3116 = "Hibiki bận rộn vật lộn với việc vẽ áp phích,\\\\ncon bé không hề tiếp xúc với ai khác ngoài tôi và chị Mayami."
3118 = "Vì nó luôn ở trong cửa hàng này, nên tôi cứ ngỡ nó như một phần của phông nền."
3120 = "Không………… mười phần thì tôi đã hiểu và chấp nhận đến chín phần chín.\\nNhưng――"
3124 = "Sự bất an râm ran bò lên từ dưới chân,\\nnhưng cũng không phải là loại bất an hiếm gặp đến mức khiến tôi phải dao động lúc này."
3125 = "Không phải tôi. Cũng không phải Uragami."
3126 = "Không một ai――ngay cả Nagi――nói lời nào.\\nTôi chỉ biết liên tục vuốt ve tấm lưng của Hibiki."
3128 = "Nếu không thể làm cho họ cảm thấy \"tôi hiểu\",\\nthì việc giành được sự đồng cảm cũng là bất khả thi."
3130 = "Cả hai đều mang vẻ đẹp và giá trị riêng——\\\\nVậy thì thứ cần được bảo tồn là cái sau, thứ không thể tái tạo bằng sức người."
3134 = "Nhưng chị Mayami vẫn không hề thả lỏng.\\\\nChị đứng bật dậy, nghiêm giọng tuyên bố với chúng tôi."
3135 = "Nhưng, nhìn kỹ lại thì, mô hình sa bàn này\\\\nthật hoài niệm... khiến tôi không thể không nghĩ đến khung cảnh Ohimitera ngày xưa."
3137 = "Không, có lẽ, chính Hibiki cũng,\\nđã cố gắng tự thuyết phục bản thân rằng chúng là một."
3140 = "Ngay cả chị Mayami và Paulette đang làm việc riêng ở bên trong\\ncũng mang vẻ mặt hốt hoảng lao ra."
3143 = "Chỉ coi ông ta như một kẻ bợ đỡ, trong thâm tâm tôi đã coi thường ông ta,\\ntôi phải tự kiểm điểm lại sự nông cạn của bản thân một chút."
3144 = "Nói cách khác, người đàn ông này――chính là kiểu chuyên gia cố tỏ ra vô năng,\\nđể luồn lách và moi móc thông tin."
3151 = "Tai nạn luôn ập đến bất ngờ.\\nĐiều đó thì tôi hiểu rõ hơn bất cứ ai."
3159 = "Những thứ do bàn tay con người tạo ra.\\\\nVà những thứ được hình thành từ tự nhiên."
3160 = "Ngã cũng không chịu đứng lên tay không,\\nông ta cố moi móc thêm dù chỉ là một chút thông tin."
3163 = "Có vẻ như ông ta định liên kết với câu chuyện lúc nãy,\\nvà biến nó thành từ khóa cho buổi phỏng vấn này."
3165 = "Nở một nụ cười khó đoán, nhà báo gãi gãi đầu.\\nMột hành động trông có vẻ rất đỗi tầm thường."
3169 = "Điều tra kỹ đấy.\\nTất cả những nơi này đều là nguồn lấy nước của nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;, hơn nữa――"
3171 = "Miệng nói là máy ghi âm băng từ, nhưng thứ lấy ra lại là máy ghi âm IC.\\nKhiến tôi cảm thấy ông ta đúng là một người vừa cẩu thả vừa cổ hủ."
3172 = "Một sự xác nhận sự thật dưới vỏ bọc câu hỏi――không, là định hướng dư luận."
3175 = "Trong số đó, chỉ có nhân vật quan trọng nhất,\\\\nlà vẫn giữ im lặng."
3176 = "Nhưng――"
3178 = "Nhưng Paulette không hề trách móc chuyện đó.\\\\nTất cả những người ở đây đều biết Hibiki đã giam mình trong phòng suốt thời gian qua."
3180 = "Nhưng bầu không khí bỗng trở nên căng thẳng.\\\\nTôi cảm nhận mạnh mẽ rằng, Hibiki đã thực sự trở thành trụ cột của chúng tôi cả về danh nghĩa lẫn thực tế."
3198 = "Giọng Hachiroku đầy vẻ thán phục.\\\\nPaulette vui vẻ gật đầu đáp lại."
3203 = "Cú \\\\x%l制動;#00ffc040;hãm phanh%l;#; gấp y như trong tranh."
3218 = "Nagi và Fukami đồng thanh thốt lên thắc mắc,\\\\nrồi nhìn nhau như nhường lời cho đối phương."
3219 = "Nagi nắm lấy \\\\x%lマスコン;#00ffc040;điều khiển trung tâm%l;#;,\\\\ncòn Fukami thì giữ phanh."
3223 = "Lời nói của Nagi đã mang lại ý nghĩa cho khung cảnh không thể hiểu nổi này.\\nĐồng thời, cơ thể tôi cũng đã tự động di chuyển!"
3229 = "Lúc tôi rủ đi cùng, Hibiki đã nói:\\n『Em sắp xong rồi, anh cứ đi trước đi』."
3236 = "Dù số người tham gia cuộc họp đó không nhiều,\\\\nnhưng cũng có vài người lạ mặt ở đó."
3238 = "Lại lục lọi sột soạt.\\\\nLần này cô ấy lôi ra một thứ còn to hơn."
3246 = "Chỉ có vậy thôi.\\\\nMột cuộc trò chuyện chưa đầy 30 giây."
3249 = "KiHa 07 trong sa bàn,\\\\nthế mà lại dừng lại một cách hoàn hảo."
3253 = "Kể từ khi Migita Soutetsu trở về,\\nHibiki đã trưởng thành rõ rệt――từng ngày một."
3255 = "Bị đánh bại bằng đòn kết hợp——quả là một sự so sánh tuyệt diệu.\\\\nNhưng tôi thậm chí còn chẳng có tâm trí đâu mà tán thưởng nó."
3262 = "Hành động của Hibiki khi khóc,\\nhoàn toàn không khác gì hồi còn bé."
3263 = "Ừm, nói đến mức này thì không phải là nói dối,\\nvà cũng vừa vặn làm tư liệu cho bài báo nhỉ?"
3266 = "À, ra vậy."
3267 = "À, đúng rồi.\\\\nChính là nó——\\\"Bản đồ tương lai\\\"."
3274 = "Đúng lúc này――\\nTôi nói thêm một câu như thể vừa chợt nhớ ra."
3276 = "Địa từ và những thứ tương tự, không ai có thể kiểm soát được.\\nÁnh sáng mặt trời cũng vậy."
3282 = "Những tiếng tán thành áp đảo——đạt đến mức độ tuyệt đối."
3287 = "Khung cảnh đường sắt đã mất——chỉ một câu nói đó thôi đã đủ để tôi tin chắc.\\\\nSa bàn này, quả nhiên là khung cảnh Ohimitera ngày xưa."
3294 = "Hai người họ——hay bất cứ ai khác đều hiểu rõ.\\\\nHiểu rõ nhưng không thể nói ra, đành chôn giấu trong lòng."
3295 = "Làm theo hướng dẫn của Paulette,\\\\nhọ chuyển phanh sang \\\\x%l運転位置;#00ffc040;vị trí chạy tàu%l;#;, và đẩy \\\\x%lマスコン;#00ffc040;điều khiển trung tâm%l;#; về phía trước——"
3298 = "Ngay cả lúc này, em ấy vẫn mang theo bên mình,\\\\ncuốn sổ phác thảo và hộp bút."
3300 = "Như một đứa trẻ đang bú sữa mẹ,\\nem ấy tuyệt vọng dùng hồng trà để bù đắp cho những giọt nước mắt đã rơi."
3303 = "Sau khi cắm vài sợi dây,\\\\nPaulette nhỏ giọng thực hiện chỉ tay \\\\x%l喚呼;#00ffc040;hô xác nhận%l;#;."
3305 = "Từ chối trả lời vì không muốn nói dối,\\ncũng như không muốn khen ngợi kẻ thù."
3308 = "Nói một cách dịu dàng, ánh mắt chị Mayami chuyển sang Nagi và Fukami."
3310 = "Vài đường thẳng được kẻ ra, sau đó,\\\\nmái nhà, bức tường được tô bằng bút chì màu."
3312 = "Ực, một tiếng nuốt lớn vang lên từ cổ họng.\\nHơi thở ấm áp phả ra làm nhột làn da tôi."
3314 = "Đưa tách trà chạm vào đôi môi ấy,\\nvà từ từ, từ từ nghiêng nó."
3315 = "Đôi mắt em ấy đỏ hoe, khóe mắt vẫn còn ươn ướt.\\\\nNhưng đã lấy lại được ánh sáng của ý chí kiên định."
3317 = "Câu trả lời được đưa ra ngay lập tức."
3319 = "Nụ cười rạng rỡ đã biến mất.\\\\nÁnh mắt nghiêm túc nhìn chằm chằm vào tôi."
3321 = "Vừa nói,\\\\nPaulette vừa chui đầu xuống dưới quầy."
3323 = "Đã mấy năm rồi mới lại được nghe――\\nTiếng khóc nức nở thật sự của Hibiki."
3325 = "Nếu con người chỉ theo đuổi sự tiện lợi và tính kinh tế đơn thuần,\\nthì các phương tiện giao thông truyền thống sẽ bị đào thải tự nhiên."
3327 = "Sau khi làm vậy mà ông ta vẫn thấy \"cảm giác không giống như vậy\",\\nthì khả năng đó là ý tưởng của Migita Mayami hay cựu thị trưởng là rất thấp."
3328 = "Nếu cứ cố chấp nhìn thẳng vào nó,\\ntôi sẽ chỉ có thể tự bao biện cho chính mình."
3331 = "Nếu vẫn giữ mối quan hệ tiền bối - hậu bối, Hibiki sẽ ỷ lại vào tôi,\\nvà sẽ không cho tôi thấy dáng vẻ liều mạng của em ấy."
3335 = "Chị gái và em gái. Cảnh hai người họ đối diện nhau một cách bình đẳng thế này……\\\\nĐây là lần đầu tiên tôi được chứng kiến."
3343 = "Dù được an ủi, sắc mặt Paulette vẫn không khá hơn.\\\\nNagi lên tiếng với vẻ bối rối."
3345 = "Ngay cả lúc Hachiroku và Reina biểu diễn mô hình,\\\\ntôi cũng chỉ nghĩ đó là 『đường ray mô hình』."
3351 = "Giọng nói điềm tĩnh.\\\\nHibiki xen vào câu chuyện."
3352 = "Củng cố tổ chức, đối phó truyền thông, hoạt động quan hệ công chúng, huy động vốn, v.v.\\\\nCó vô số việc phải làm trong một cuộc bầu cử."
3357 = "Chẳng mấy chốc, tách hồng trà đã được đặt xuống.\\nSữa và đường có vẻ đã được khuấy tan."
3370 = "Tiếng hét――\\nKhông, đây là, tiếng khóc."
3373 = "Quay lại một lần――nếu đã cố gắng trở về điểm xuất phát,\\nthì việc không nhìn thấy gì là điều đương nhiên."
3376 = "Tự đáy lòng, tôi cảm nhận được một thứ gì đó ấm áp."
3379 = "Tức giận đến mức không kìm nén được,\\nNagi đứng phắt dậy và lớn tiếng."
3382 = "Không muốn em ấy nói 『Xin lỗi』,\\\\nmuốn nói rằng em không cần phải làm thế, tôi kéo Hibiki ôm chặt vào lòng."
3384 = "Tôi ôm chầm lấy em ấy, không cho phép em nói thêm lời nào.\\nBao bọc lấy em bằng cả cơ thể mình, giấu đi khuôn mặt đang giàn giụa nước mắt của Hibiki."
3386 = "Tôi chẳng thích mấy vụ phỏng vấn chút nào."
3388 = "Tôi đã lầm tưởng rằng bức tranh tương lai mà Hibiki mơ ước,\\ncũng giống như bức tranh tương lai của tôi."
3390 = "Vẫn giữ nguyên tư thế đó——\\\\nTôi cố gắng suy nghĩ, tìm kiếm xem có cách nào không——!!?"
3392 = "Tôi thở phào nhẹ nhõm quay lại,\\nnhưng ngay lập tức, một nỗi bất an khác lại bám chặt lấy tôi."
3393 = "Tôi không muốn một gã như thế này bình luận về Hibiki.\\nPhải cắt ngang mạch chuyện này một lần thôi."
3395 = "Tôi khẽ cúi đầu xin lỗi Hibiki, và mọi người.\\nNếu tỏ ra quá nghiêm trọng, ngược lại sẽ càng tạo thêm áp lực cho Hibiki."
3398 = "Tôi và Hibiki như vậy là được rồi.\\\\nNhưng mà——"
3400 = "Tay trái vẫn ôm lấy Hibiki,\\ntay phải nâng tách trà lên, và uống."
3403 = "Mỉm cười đứng dậy. Gọi tên. Chủ động bắt tay.\\n――Hiệu quả của những hành động nhỏ nhặt này tuyệt đối không thể xem thường."
3405 = "Những điều cần nói tôi đã gom gọn trong buổi phát sóng chính cương,\\nvà trong buổi họp báo ngay sau khi công bố cũng đã truyền đạt đầy đủ rồi. Nhưng――"
3407 = "Tôi cảm nhận được sự thành công rõ rệt.\\\\nChính vì thế, tôi không vội vàng mà cẩn thận xác nhận từng bước đi."
3409 = "Hibiki trong ngực tôi khẽ cựa quậy.\\\\nBây giờ cứ vờ như không để ý vậy."
3411 = "Tôi đưa tay chạm vào mái tóc của Hibiki.\\nChậm rãi vuốt ve, và gửi gắm những lời nói qua từng cử chỉ."
3412 = "Tiễn nhà báo ra khỏi ngân hàng――à không, tiễn ông ta về,\\nkhi quay lại phòng giám đốc chi nhánh, tôi thở phào nhẹ nhõm."
3414 = "Bằng lý trí, tôi đã tìm ra câu trả lời."
3416 = "Rõ ràng là định dỗ dành,\\nnhưng lại làm Nagi hậm hực thêm."
3419 = "Cổ họng tôi khô khốc đến mức đau rát."
3421 = "Trong vòng tay tôi, phư phư――tiếng khịt mũi tìm kiếm mùi hương.\\nTôi cảm thấy an lòng."
3423 = "Cựa quậy trong vòng tay tôi,\\nHibiki ngẩng mặt lên."
3424 = "Tôi nhìn Uragami.\\nKhẩu hình miệng cậu ta mấp máy chữ \"Không hề\" mà không phát ra tiếng."
3427 = "\"Em xin lỗi\" và \"Cảm ơn anh\",\\ntôi như nghe thấy những lời nói không thành tiếng ấy."
3429 = "Khoảnh khắc khuôn mặt và cái tên đó hiện lên, tôi đã hiểu ra."
3431 = "Chỉ cần đưa mắt nhìn Uragami một thoáng là xong."
3432 = "Ngay khi tôi quay mặt lại,\\\\nđừng nói là Fukami, ngay cả Nagi cũng vội vàng tránh ánh mắt của tôi."
3436 = "Tôi vẫn chưa đủ trưởng thành,\\nđể có thể điềm nhiên hùa theo điều đó."
3437 = "Dù khá ấn tượng với ý thức nghề nghiệp tuyệt vời đó,\\nnhưng tất nhiên, điều quan trọng nhất thì tôi không muốn nói và cũng sẽ không nói."
3439 = "Do đó, tôi chọn những từ ngữ không quá bóng gió."
3441 = "Vì thế, chị Mayami đã lên tiếng mở lời."
3446 = "Phỏng vấn cũng vậy. Suy cho cùng, nó là việc cung cấp\\n\"dịch vụ đặc biệt\" cho vô số người không xác định."
3447 = "Giờ đây khi đã nhận thức được một sự thật quan trọng,\\ntôi không muốn lãng phí thêm thời gian ở đây nữa."
3450 = "Vì phải lắng nghe ý kiến rồi mới làm,\\\\nnên tự nhiên nó sẽ trở thành hình thức đối thoại - tham gia."
3489 = "Trong vòng tay tôi, Hibiki gật đầu."
3490 = "Hibiki đang trưởng thành vượt bậc.\\nNắm bắt được điều đó ở giai đoạn này là một lợi thế lớn."
3492 = "Hibiki đang muốn xin lỗi tất cả mọi người.\\nVì tôi muốn tôn trọng tâm trạng đó của em ấy lên hàng đầu."
3494 = "Liệu Hibiki có ngả theo phe thu hút nhà máy không——"
3496 = "Một Ohimitera mà chúng tôi đang nỗ lực tạo ra,\\nđáng lẽ Hibiki đã phải thể hiện nó qua bức tranh."
3497 = "Hibiki bật dậy."
3500 = "Dáng vẻ của Hibiki lúc này, phải nói sao đây……\\nnhư thể――đã hoàn toàn mất đi sức sống."
3501 = "Bút chì của Hibiki lướt nhanh,\\\\nvẽ ra Rail Shop trên tờ giấy trắng."
3503 = "Nếu là toa xe do Hibiki thiết kế,\\\\nchắc chắn sẽ khơi gợi sự tò mò \"Đây là gì?\"."
3506 = "Chắc hẳn Hibiki đã phải đối mặt với chính mình rất nhiều,\\nvà càng đối mặt, em ấy càng bị dồn vào chân tường."
3508 = "Hibiki ngồi lại ngay ngắn trên ghế,\\\\nđể Nagi và Fukami ngồi đối diện, rồi cất giọng áy náy."
3509 = "Hibiki quỳ cả hai gối xuống sàn,\\nđổ gục người về phía trước, hai lòng bàn tay úp chặt xuống sàn."
3511 = "Hibiki im lặng gật đầu.\\nVậy thì sau đó, chỉ cần chờ đợi đôi mắt của Hibiki tìm thấy điều gì đó là được."
3512 = "Đúng vậy.\\\\nTôi cũng đang nghĩ đến khả năng đó."
3519 = "Rừng, cây, bãi cát, cây cầu.\\\\nHibiki kiểm tra cấu trúc của chúng, rồi dùng mắt phân tích từng chi tiết."
3521 = "Đang nô đùa cùng Nagi và Fukami,\\\\nReina lạch bạch chạy tới."
3523 = "Cũng là để tự trấn an bản thân,\\\\ntôi quyết định sắp xếp lại mọi thứ và giải thích cho họ hiểu."
3526 = "Đúng vậy.\\\\nCho Hachiroku, cho KiHa 07 kéo mô hình \\\\x%l客車;#00ffc040;toa hành khách%l;#; đã được phục hồi."
3529 = "Trước cả sự phân biệt giữa con người và sự vật,\\nđó là vì cô ấy là “kẻ thù”."
3533 = "Chính xác.\\nVậy thì tiếp theo――sẽ là câu hỏi mà tôi không muốn trả lời."
3534 = "Đúng vậy, đó là một điều vô cùng đơn giản."
3545 = "Không biết Paulette không nhận ra,\\\\nhay là nhận ra rồi nhưng vẫn vờ như không biết mà tiếp tục nói."
3546 = "Chắc hẳn em ấy muốn rời khỏi đây dù chỉ một chút.\\nFukami cùng Paulette đi vào bên trong."
3547 = "Giọng Paulette lớn tiếng hiếm thấy.\\\\nHibiki giật bắn mình co rúm người lại, yếu ớt lắc đầu."
3548 = "Miệng Paulette há hốc thành hình tròn.\\\\nĐôi mắt xanh biếc hướng về phía tôi."
3549 = "Chắc hẳn là cô ấy muốn giữ ý.\\nTôi gọi Paulette lại khi cô ấy đang định dẫn Reina ra ngoài."
3550 = "Dù đang nhắc nhở, nhưng ánh mắt Paulette\\\\nvẫn dõi theo Nagi và Fukami với vẻ vui mừng."
3563 = "Uragami thao thao bất tuyệt giải thích về sự an toàn của nước thải.\\nCâu nào câu nấy đều rất có lý. Ngay cả tôi cũng hoàn toàn hiểu rõ."
3565 = "Ánh mắt của Uragami không hướng về phía nhà báo mà là tôi.\\nKhi tôi gật đầu đáp lại, những lời nói lập tức tuôn ra."
3567 = "Lời giải thích của Uragami đã kết thúc từ lúc nào không hay.\\nNhưng tôi cũng chẳng cần phải vội vàng che giấu biểu cảm của mình."
3571 = "Fukami và Reina cũng gật đầu trước câu hỏi của Nagi."
3574 = "Tôi hắng giọng để lấy lại giọng nói đang khàn đặc.\\\\nPaulette tinh ý nhận ra và pha ngay cho tôi một tách hồng trà mới."
3575 = "Tạo nền tảng vững chắc để Hibiki yên tâm đứng ở vị trí lãnh đạo,\\\\nkhông cần nói cũng biết đó là ưu tiên hàng đầu của tôi lúc này."
3580 = "Từ lúc đó đến giờ, cũng phải hơn một tiếng đồng hồ rồi."
3581 = "Phịch, trán của Hibiki ấn chặt vào ngực tôi."
3582 = "Rồi cúi gập người——\\\\nmột cách vô cùng tự nhiên, trang nghiêm và tuyệt đẹp."
3583 = "Rồi nhẹ nhàng,\\\\nđiều khiển cần gạt của cái gọi là bộ cấp nguồn đó——"
3587 = "Cha tôi cũng không đời nào lại đi tiếp tay cho địch,\\nlàm giảm xác suất thành công của việc thu hút nhà máy."
3589 = "Mô hình đô thị trong bức ảnh chụp cận cảnh,\\\\ndù chỉ là mặt phẳng nhưng vẫn toát lên sức hút mãnh liệt."
3593 = "Reina phấn khích.\\\\nHibiki tự nhiên nhìn tôi."
3596 = "Giờ không phải lúc để tâm trí bị cuốn vào niềm vui chơi đồ chơi."
3598 = "Bởi vì con người ta chỉ nhận ra giá trị của không khí,\\\\ncho đến giây phút họ cảm thấy nghẹt thở."
3599 = "Đáng lẽ ra nó đã phải hoàn thành kịp lúc tuyên bố tranh cử.\\nThị trấn có \\x%l8620;#00ffc040;8620%l;#; chạy qua, thị trấn được tô điểm bởi đường sắt và sông Kuma."
3606 = "Dễ hiểu thật.\\nNhà báo này quả nhiên có thực lực."
3615 = "Chị ấy vẫn mỉm cười rạng rỡ như mọi khi,\\\\nchủ động rút lấy lá thăm xui xẻo mà ai cũng ghét bỏ."
3617 = "Chị Mayami loạt soạt mở tờ báo ra cho chúng tôi xem."
3619 = "Chị Mayami tắt hẳn nụ cười, nhìn sang Hibiki.\\\\nHibiki thẳng lưng, đón nhận ánh mắt của chị Mayami."
3620 = "Chị Mayami phá lên cười."
3622 = "Chị Mayami từ tốn gật đầu đồng tình với lời tôi nói."
3624 = "Đã được chị Mayami đảm bảo.\\\\nKhông có lý do gì mà không hào hứng cả."
3626 = "Nở một nụ cười rạng rỡ chưa từng thấy,\\\\nchị Mayami nhẹ nhàng chạy vụt ra khỏi Rail Shop."
3631 = "Một cái bắt tay ngắn ngủi.\\nKhi buông tay ra, nhà báo định cất sổ ghi chép đi."
3648 = "Cây bút tự nhiên đưa về phía cuốn sổ tay đang cất dở."
3654 = "Những lời thừa thãi chồng chéo lên nhau lọt vào tai tôi,\\nnhưng lại không đến được tai Hibiki."
3662 = "Dao rọc giấy, thảm cắt, thước kẻ, hồ dán và tăm xỉa răng.\\\\nChỉ với ngần ấy thứ——Rail Shop đã thành hình."
3664 = "Cứ mở miệng ra là \"Anh trai em, anh trai em thế này thế nọ\",\\nnên ở cạnh Hibiki, dù không muốn thì thông tin về Soutetsu vẫn cứ lọt vào tai."
3666 = "Hachiroku thậm chí đã từ bỏ việc dùng kính ngữ \"cô\",\\nnhưng vẫn dành lời khen ngợi cho Kisaki."
3669 = "Khả năng xảy ra một biến cố nào đó khiến \\x%lエアクラ;#00ffc040;Aircra%l;#; không thể hoạt động\\ntrên diện rộng cũng không phải là con số không."
3671 = "Khoảnh khắc nghe thấy câu đó, Hibiki giật nảy mình ngẩng đầu lên."
3672 = "Lách cách, lách cách, tiếng tách trà vang lên.\\nMột lúc sau, là tiếng rít của ấm nước sôi."
3680 = "Mô hình được chế tác vô cùng tinh xảo và lộng lẫy,\\nto đến mức gần như chiếm trọn cả căn phòng giám đốc chi nhánh mà tôi đang tạm trú."
3684 = "Nếu không tuyệt vời thì chẳng có ý nghĩa gì cả.\\nKhông chỉ tuyệt vời, mà còn phải đầy sức quyến rũ."
3695 = "Nhà báo rút cuốn sổ tay từ trong túi ra."
3696 = "Nhà báo gật đầu với vẻ mặt thấu hiểu."
3703 = "Mà nói mới nhớ, đúng là……"
3704 = "Đó có thể là ý chí chiến đấu, cũng có thể là niềm vui\\n――hoặc có thể là sức nóng hòa quyện của cả hai."
3722 = "Thế này là được rồi.\\nThế này thì chắc chắn ông ta sẽ quảng bá giúp mình."
3723 = "Thế này là được rồi."
3724 = "Những lời xã giao và tâng bốc qua lại để tạo cảm giác \"đặc biệt\".\\nNhững nụ cười chỉ nhằm mục đích tạo ra một bầu không khí thân thiện, hòa nhã."
3725 = "Là sản phẩm do bộ phận chuyên môn của công ty Aero-Craftech chế tạo.\\nChỉ nhằm một mục đích duy nhất――đó là thúc đẩy việc thu hút nhà máy."
3726 = "Sức hấp dẫn mà ngay cả Nagi cũng phải công nhận, nói cách khác,\\nchính là \"sự rõ ràng mà ai cũng có thể tiếp nhận\". Nhưng――"
3727 = "Một lúc sau,\\\\nFukami rụt rè giơ tay lên rồi cất tiếng."
3729 = "Vậy thì――là Hibiki chăng?\\nNếu không phải thì……"
3730 = "Cũng đúng."
3732 = "Vậy thì cục diện đối lập sẽ trở thành bức tranh mà giới truyền thông cực kỳ yêu thích……\\nKẻ duy nhất có thể làm tăng sức nóng khi bị khiêu khích."
3736 = "Tiếng của Uragami vọng vào từ ngoài cửa.\\nSự chuẩn bị của tôi cũng đã hoàn tất."
3737 = "Nỗi lo ngại đó, chính tôi cũng từng bị\\\\ncán bộ ban bầu cử của phe Paulette cũ trực tiếp chất vấn."
3740 = "Dù hiểu, nhưng họ vẫn đánh mất phương hướng.\\\\nNhững sự thật càng đơn giản, hiển nhiên thì càng dễ bị lãng quên."
3743 = "Nếu là Soutetsu, nếu là người đàn ông đó,\\nthì có thể tạo ra ba khả năng."
3756 = "（Nói tóm lại, rủi ro là có. Nhưng――\\nNếu không chịu bất kỳ rủi ro nào, thì làm sao có thể vực dậy nền kinh tế của một thành phố địa phương được chứ.）"
3758 = "（Vùuu）"
3759 = "（Bịch!）"
3762 = "（Các phương tiện giao thông thường dùng phải có nhiều hệ thống khác nhau.\\nĐó là điều hiển nhiên chỉ cần suy nghĩ một chút là nhận ra――）"
3764 = "（Cốc cốc）"
3767 = "（Nếu an toàn đến vậy, tại sao lại không đặt ở sông Tama, sông Arakawa, sông Tone,\\nsông Yodo――những hệ thống sông ngòi thuộc khu vực đại đô thị cơ chứ.）"
3771 = "（Kisaki đã lợi dụng Hibiki làm nguồn cung cấp thông tin——\\\\nNỗi lo đó không ngờ lại được xóa bỏ theo cách này sao.）"
3774 = "Mô hình đô thị tỷ lệ 1/1000――\\nKhông phải là Ohimitera hiện tại, mà là sau khi thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;."

[selections]
