2303 = "「Trời ạ. Trông chẳng giống dáng vẻ của một ứng cử viên thị trưởng chút nào.」"
2307 = "「Thật kìa. Không chỉ có những ngôi nhà đẹp đẽ vuông vức,\\ mà còn có đủ loại nhà khác nhau nhỉ.」"
2309 = "「Thật sự rất phong cách nhỉ.\\ Hoài cổ, nhưng không hề lỗi thời mà lại rất đáng yêu.」"
2310 = "「Thực sự là, chớp mắt cái đã đến nơi rồi nhỉ.」"
2312 = "「Chị Mayami, có rảnh một chút không?」"
2315 = "「Ở, \\\\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#;, các bạn có thể tận mắt chứng kiến quá trình lắp ráp\\ \\\\x%l客車;#00ffc040;toa hành khách%l;#; thật đang hoạt động hiện nay. Ạ.」"
2320 = "「Cũng đúng nhỉ.」"
2324 = "「Vậy thì. Cửa sổ tròn cứ để lần sau, hoặc lần sau nữa\\ thử nghiệm cũng được mà.」"
2327 = "「Nói chung, vừa đi vừa suy nghĩ nguy hiểm lắm đấy.\\ Sẽ bị vấp ngã mất——giống như em hồi nhỏ ấy.」"
2333 = "「Trên thuyền cũng nên lót đệm,\\ theo thiết kế của Hibiki. Nếu làm vậy, chắc chắn lượng khách sẽ tăng lên. Nhỉ.」"
2345 = "「Có muốn nắm tay không?\\ Giống hệt như hồi nhỏ ấy.」"
2350 = "「Cảm ơn cô.」"
2352 = "「Này nhé, anh Soutetsu.」"
2356 = "「Tranh luận?」"
2369 = "「Thì……đúng là vậy.」"
2370 = "「Chuyện đó.」"
2371 = "「Đó là.」"
2372 = "「Thiết kế đẹp thật đấy.」"
2373 = "「Hôm nay náo nhiệt hơn hẳn mọi khi nhỉ.\\ Cho chạy \\\\x%lNゲージ;#00ffc040;N-gauge%l;#; lại tạo ra sự khác biệt lớn đến thế sao.」"
2375 = "「Cảnh này……thật choáng ngợp.」"
2376 = "「Toa xe tốt nhỉ.\\ Nghe nói nó từng hoạt động trên tuyến Đường sắt Chichibu đấy.」"
2378 = "「Thiếu vận động cũng là nguyên nhân gây bệnh đó nha.」"
2379 = "「Không chỉ là sơn đâu anh trai.\\ Phần đường viền còn được đắp nổi lên nữa kìa.」"
2380 = "「Chị vẽ sắp xong rồi.\\ Xong rồi thì――――a.」"
2381 = "「Bàn của ghế hộp cũng đổi thành gỗ nhỉ.\\ Chị nghĩ sẽ rất tuyệt đấy.」"
2386 = "「Thế cũng tốt.」"
2387 = "「Đúng vậy nhỉ.」"
2388 = "「Cô bé đó đã cố gắng tự mình lắp ráp đấy nha.\\ Bé bảo vì đó là nhà của bé mà.」"
2389 = "「Dạ! Cùng——\\ Em cũng muốn, ừm……đến lò rèn cùng anh.」"
2390 = "「À, anh trai! Em ra góc khác xem đây!」"
2391 = "「Ừm, mình cũng vậy. Bỏ một phiếu cho A. Ạ.」"
2394 = "「Vậy thì, cùng đi nhé?」"
2396 = "「Vậy, anh đổi câu hỏi nhé.\\ Ohimitera lý tưởng của Hibiki là một thị trấn như thế nào?」"
2398 = "「Vậy thì, anh sẽ đến gặp ông Minokasa để bàn bạc ngay đây.」"
2399 = "「Vậy thì, việc còn lại là bàn bạc với các nghệ nhân,\\ xem xét khả năng thực hiện và xin báo giá sơ bộ thôi.」"
2401 = "「Vậy, ứng cử viên Houshou.\\ Cô tìm tôi có việc gì không?」"
2402 = "「Vậy, nội thất thì……\\ Ừm——gọi là gì nhỉ, lớp vải bọc ghế ấy.」"
2405 = "「Vậy, ừm——còn anh trai thì sao?」"
2408 = "「Về ngoại thất thân xe, chỉ cần thay đổi màu sơn thôi đúng không?」"
2412 = "「Dù đã thấy trên bản vẽ thiết kế hay \\\\x%lNゲージ;#00ffc040;N-gauge%l;#;.\\ Nhưng khi nhìn toa xe thật……sức hút quả là khác biệt hoàn toàn.」"
2414 = "「Thì đúng là vậy nhưng mà.」"
2415 = "「Nếu là Sou-chan thì sẽ ở trên 8620 đúng không?\\ Thứ anh nhìn thấy sẽ không phải là khung cảnh ngoài cửa sổ toa tàu, mà là khung cảnh từ buồng lái cơ.」"
2418 = "「Sẵn dịp này, anh cũng sẽ ra ngoài dạo chơi một chút.\\ Không biết bao giờ mới về. Mọi người cứ giải tán trước, đừng đợi anh nhé.」"
2419 = "「Chuyến hẹn hò hiếm có, anh cứ tận hưởng cho đã đi nhé!」"
2420 = "「Chẳng phải vậy sao? \\ Trong khi trước đây chẳng ai thèm đoái hoài đến đường sắt cả.」"
2553 = "Một chủ đề hoàn toàn trùng khớp với chuyên môn của Kisaki.\\ Trong khi tình hình bầu cử hiện tại đang nghiêng phần thắng về phía Hibiki."
2558 = "Nghĩ đến khung cảnh nhìn thấy với tốc độ chậm rì rì của \\\\x%l8620;#00ffc040;8620%l;#; khi kéo \\\\x%l客車;#00ffc040;toa hành khách%l;#; mới,\\ đột nhiên tôi cảm thấy thật dịu dàng và dễ chịu."
2561 = "Ngay khoảnh khắc nhìn thấy bản vẽ thiết kế,\\ tôi cũng đã nhớ lại với một cảm giác hoài niệm."
2563 = "Một giọng nói dõng dạc và quyết đoán không cho phép từ chối,\\ điều không thể tưởng tượng được ở Paulette trước đây."
2564 = "Tiêu rồi. Va phải ai đó mất rồi."
2574 = "Nhưng——nếu tôi nói ra chuyện hẹn hò này nọ,\\ chắc chắn sẽ kéo cả Hibiki vào sự bối rối của tôi mất."
2575 = "Nhưng khuôn mặt vừa giãn ra ấy ngay lập tức nghiêm nghị lại,\\ đôi mắt và cơ thể em ấy xoay hẳn sang, nhìn thẳng vào tôi."
2576 = "Nhưng, tôi không hề cảm thấy cô đơn vì bị bỏ lại.\\ Hơn hết thảy, lúc này điều quan trọng nhất là việc thay mới \\\\x%l台車;#00ffc040;giá chuyển hướng%l;#;——ơ!?"
2578 = "Nhưng những vị khách bị mời ra ngoài,\\ ai nấy đều mang vẻ mặt háo hức, chờ đợi những lời tiếp theo."
2579 = "Nhưng, nếu có người làm được trò trống đó,\\ thì thế giới này đã hòa bình và bình đẳng hơn rất nhiều rồi."
2580 = "Nhưng, nếu nhìn những khuyết điểm đó trong tổng thể sa bàn,\\ lại thấy hài hòa đến kỳ lạ……thậm chí còn tạo nên điểm nhấn thú vị."
2581 = "Không, sao nhỉ?\\ Tôi có cảm giác đó là nhịp đập và thân nhiệt của chính mình."
2584 = "Theo sự hướng dẫn của Fukami,\\ dòng người ồ ạt di chuyển."
2586 = "Tiếng reo hò ồ lên.\\ Khách hàng lũ lượt kéo nhau ra khỏi Rail Shop."
2593 = "Dù vậy, tôi vẫn không muốn——chúng tôi bị lạc mất nhau."
2603 = "Hachiroku cất giọng thán phục."
2604 = "Những chiếc kích thủy lực to hơn cả Hachiroku, thậm chí còn cao hơn cả tôi,\\ được lắp đặt nhanh chóng vào hai bên hông của \\\\x%l客車;#00ffc040;toa hành khách%l;#; cũ, mỗi bên hai chiếc."
2609 = "Hachiroku tiến lại gần \\\\x%l客車;#00ffc040;toa hành khách%l;#;."
2613 = "Một toa là toa bị lọt khói vào.\\ Toa còn lại là——"
2616 = "Không phải xác nhận, mà là thuyết phục.\\ Tôi đã chuẩn bị tinh thần hơn một nửa rằng chị Mayami sẽ phản đối."
2626 = "Cười nhếch mép với đôi mắt như một con mèo ranh mãnh,\\ Nagi vỗ bốp một cái khá mạnh vào lưng tôi."
2635 = "Kéo theo thứ này và lái đi.\\ Vị trí phanh hay bất cứ thứ gì khác chắc chắn cũng sẽ thay đổi."
2636 = "Cô bé lúc nãy……à, đi cùng gia đình sao.\\ Cô bé tươi cười vẫy tay với Hibiki rồi hướng ra ngoài."
2637 = "Bàn tay và giọng nói non nớt ban đầu còn rụt rè sợ sệt,\\ dần trở nên nhịp nhàng theo nhịp điệu mà Hibiki tạo ra."
2638 = "Tôi bất chợt thốt lên một âm thanh kỳ quặc."
2641 = "Những chiếc kích từ từ nâng lên,\\ và dĩ nhiên, thân xe cũng được nâng lên theo."
2645 = "Ra là vậy, đúng như Nagi nói,\\ cái này quả thực \"rất khủng\"."
2648 = "Về mặt lý thuyết thì đúng là hiển nhiên và đơn giản nhưng——"
2652 = "Đợi mãi, đợi mãi vẫn không thấy em ấy nói tiếp,\\ tôi cất giọng điềm tĩnh nhất có thể, hỏi lại."
2655 = "Mỗi người, trải qua những con đường suy nghĩ khác nhau.\\ Nhưng cuối cùng, đều đi đến cùng một đích."
2660 = "Nếu so với một tháng trước, thì quả thực đây là một sự kiện hoành tráng như mơ.\\ Tất nhiên, đó không chỉ là công sức của một mình Hibiki——"
2661 = "Sau khi suy xét kỹ lưỡng và so sánh với các phương án khác."
2664 = "Chợt nhận ra, chúng tôi đã đứng trước lò rèn Minokasa.\\ Tôi không có cảm giác mình đã đi bộ lâu đến thế nhưng——"
2668 = "Do ảnh hưởng của hồ dán nên lớp sơn cũng bị bong ra, để lại những vệt trắng xóa."
2669 = "Bởi vì hình ảnh tương lai mà Hibiki mong muốn, cũng đã hiện ra trước mắt tôi rồi."
2670 = "Phương án A là thiết kế thể hiện rõ nhất,\\ trực tiếp nhất \"sở thích\" của chính Hibiki mà."
2680 = "Dùng đầu cọ gõ nhẹ để sửa lại lớp sơn,\\ chỉnh lại hình dáng, rồi lại bôi hồ——"
2681 = "Những gì họ nói đều rất có lý,\\ và bản thân tôi cũng chẳng có ý định phản đối."
2683 = "Hibiki nhảy cẫng lên, rồi chạy lạch bạch——\\ cứ thế chạy tót ra khỏi Rail Shop."
2685 = "Nói lời xin lỗi với những người đang xếp hàng chờ,\\ Hibiki vội vàng chạy đến chỗ cô bé."
2687 = "Giọng điệu vừa như làm nũng, vừa như pha chút mỉa mai."
2689 = "Vẫn theo nhịp độ của riêng mình, và làm theo trực giác."
2690 = "Cả ánh mắt và giọng nói đều không hướng về phía chúng tôi.\\ Như thể đang dẫn đường cho thứ gì đó——"
2692 = "Tại sao cô ta lại ở đây——"
2694 = "Nói với vẻ hơi bất mãn,\\ em ấy ngước mắt lên nhìn tôi, cất giọng mỏng như hơi thở."
2696 = "Em ấy ngượng ngùng và vui sướng một cách thật thà."
2698 = "Cười khổ.\\ Kisaki xoay người, quay hẳn về phía tôi."
2700 = "Nơi ánh mắt xanh biếc hướng đến là thân xe mang màu gỗ và màu vàng kim."
2701 = "Lấy một chút màu nước lên cọ, Hibiki cho cô bé cầm lấy,\\ rồi bao bọc trọn vẹn bàn tay nhỏ xíu cỡ như \\\\x%l運転体;#00ffc040;thân chính%l;#; của Hachiroku."
2706 = "Chỉ một câu nói đó, lòng tôi bỗng nhẹ nhõm hẳn."
2708 = "Vẫn có lợi ích.\\ Tôi có thể nhìn thấy rất rõ ràng."
2709 = "Nếu được, tôi rất muốn tiến lại gần để xem thử——"
2720 = "Như hòa quyện vào thân xe màu nâu,\\ truyền tải một cảm giác hoài niệm, điềm tĩnh và sang trọng một cách vô cùng nhẹ nhàng."
2723 = "Khi đã hoàn toàn tự do,\\ rốt cuộc tôi sẽ mong muốn một cuộc sống như thế nào sau này?"
2732 = "Bị Nagi nói mấy lời kỳ quặc,\\ khiến tôi cứ bận tâm mãi không thôi."
2735 = "Đôi má phúng phính phồng lên,\\ ửng hồng rực rỡ hơn cả lúc nãy."
2738 = "Cô bé giật mình co rúm người lại,\\ cố giấu thứ trong tay ra sau lưng."
2739 = "Tiếng hét của cô bé."
2741 = "Đôi má ửng hồng vì vui sướng khi hoàn thành của cô bé,\\ bỗng chốc lại xịu xuống đầy buồn bã."
2758 = "Còn lại khoảng hai mươi người.\\ Dù vẫn là một số lượng lớn, nhưng tôi có cảm giác luồng không khí đã lưu thông trở lại."
2759 = "Được chị Mayami công nhận,\\ chắc chắn là một niềm vui sướng tột độ đối với em ấy."
2761 = "Buổi tranh luận này, nếu xét từ góc độ tỷ lệ trúng cử,\\ thì bất lợi chắc chắn sẽ áp đảo."
2762 = "Từ xa, tiếng nước sông róc rách chảy,\\ lặng lẽ và âm thầm kết nối quá khứ với hiện tại."
2768 = "Bất chợt Hibiki quay lại, lạch bạch——\\ vừa nhìn mặt tôi, vừa đi lùi cho bắt nhịp với bước chân của tôi."
2775 = "Tôi cùng Hibiki bước ra ngoài."
2776 = "Tôi nhớ lại. Có lẽ từ hồi đó Hibiki\\ đã mang \"đôi mắt của họa sĩ\" rồi."
2778 = "Tôi như bừng tỉnh ngộ."
2779 = "Tưởng tượng bản thân đang ngồi trên \\\\x%l列車;#00ffc040;đoàn tàu%l;#;.\\ Thì, cảnh sắc của sa bàn, những tòa nhà như vươn cao lên."
2783 = "Khi tôi thốt ra những gì mình cảm nhận được, khuôn mặt Hibiki bừng sáng nụ cười.\\ Quả nhiên là vậy sao."
2786 = "Đây mới là điều tự nhiên nhất,\\ thể xác và tâm hồn tôi hòa làm một và thấu hiểu điều đó."
2787 = "Tất nhiên, để có thể xử lý ngay lập tức trong trường hợp đó,\\ tôi bước một bước dài, tiến sát lại gần Hibiki."
2789 = "Tôi đặt tay lên trán em ấy khi em ấy định cúi gằm mặt xuống,\\ nâng nhẹ lên để hai ánh mắt giao nhau."
2791 = "Tiến lại gần Hibiki, nhìn sang Kisaki,\\ cô ấy mỉm cười và gật đầu như muốn nói \"Không sao đâu\"."
2794 = "Tôi chưa hề nghĩ xa đến mức đó.\\ Đến lúc kế hoạch thu hút nhà máy \\\\x%lエアクラ;#00ffc040;Aircra%l;#; bị hủy bỏ."
2796 = "Chắc là máu họa sĩ đang sục sôi,\\ chẳng đợi tôi trả lời, Hibiki đã chạy vọt đi."
2798 = "Chính vì vậy."
2801 = "Thế nên, tôi tự nhiên nắm lấy tay em ấy.\\ Dù có lạc nhau thì cũng sẽ sớm gặp lại ở \\\\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#; thôi."
2803 = "Có lẽ chính vì vậy."
2805 = "Vì vậy, tôi chầm chậm.\\ Buông bàn tay đang nắm ra."
2808 = "Thình thịch, nhịp đập.\\ Bàn tay đang nắm lấy tay tôi của Hibiki, dần dần nóng lên một chút."
2810 = "Tới một nơi không có ai nghe thấy―― Nếu vậy thì quả nhiên, chị ấy phản đối cuộc tranh luận này rồi."
2811 = "Khoảnh khắc hai bàn tay đan vào nhau, tôi cảm thấy nhẹ nhõm."
2815 = "Một đám đông còn đông hơn cả những người vừa rời khỏi Rail Shop,\\ đang di chuyển một cách trật tự hướng về \\\\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#;."
2850 = "Cả tôi và Hibiki đều là lần đầu tiên\\ được tận mắt chiêm ngưỡng toàn bộ diện mạo của nó."
2852 = "Hibiki giơ tay phải lên mạnh mẽ đến mức như phát ra tiếng \"vút\"."
2853 = "Khóe miệng Hibiki khẽ cong lên."
2854 = "Đường viền vàng kim mà Hibiki đã dày công chăm chút.\\ Cả phần đường thẳng lẫn đường cong đều mềm mại như đang sống."
2857 = "Hibiki bế bổng cô bé lên.\\ Được bế lên cao, đôi mắt to tròn của cô bé sáng long lanh."
2859 = "Từng tòa nhà mà Hibiki chỉ vào,\\ đều có những khuyết điểm như màu sơn không đều, hay bị méo mó."
2861 = "Kích thủy lực đang nâng thân xe lên——\\ Em ấy đang vẽ phác thảo từ góc nhìn hất lên từ dưới gầm xe."
2862 = "Những ngón tay thon dài, khéo léo của Hibiki,\\ đang cẩn thận, tỉ mỉ gỡ từng mảnh giấy dán lệch ra."
2864 = "Em ấy hiểu rõ Kisaki hơn tôi nhiều.\\ Hibiki không thể nào không nhận ra điều đó."
2866 = "Không chút do dự, Hibiki gật đầu."
2868 = "Xung quanh Hibiki là một đám đông các cô cậu bé."
2869 = "Tay Hibiki không hề đổ mồ hôi, cũng không nóng rực bất thường,\\ mà khô ráo, đan vào tay tôi một cách dễ chịu."
2872 = "Hibiki gần như áp sát má xuống sàn nhà."
2873 = "Theo ánh mắt của Hibiki, một bé gái đang rơm rớm nước mắt.\\ Trong tay cô bé là một tờ giấy nhàu nhĩ——không, đó là?"
2876 = "Bàn tay Hibiki khẽ siết chặt."
2877 = "Câu trả lời và nụ cười rạng rỡ."
2878 = "Được kéo bởi \\\\x%l8620;#00ffc040;8620%l;#; phiên bản \\\\x%lNゲージ;#00ffc040;N-gauge%l;#;, sớm hơn một bước so với hiện thực,\\ \\\\x%l客車;#00ffc040;toa hành khách%l;#; mới do Hibiki thiết kế đã chính thức ra mắt."
2883 = "Nhanh chóng kìm nén sự bối rối,\\ Hibiki bình tĩnh đứng dậy."
2885 = "Khuôn mặt căng cứng của Hibiki,\\ giãn ra rõ rệt với tiếng thở phào \"Phù\"."
2886 = "Haa, Hibiki thở dài thườn thượt."
2889 = "Houshou Kisaki."
2890 = "Là vì đang là ban đêm sao?\\ Hay là do Hibiki cũng đang có chung cảm xúc này."
2894 = "Thay \\\\x%l台車;#00ffc040;giá chuyển hướng%l;#; đúng như tên gọi của nó,\\ là tháo \\\\x%l台車;#00ffc040;giá chuyển hướng%l;#; cũ ra khỏi thân xe và lắp \\\\x%l台車;#00ffc040;giá chuyển hướng%l;#; mới vào."
2897 = "\\\\x%l客車;#00ffc040;Toa hành khách%l;#; được chuyển nhượng từ Đường sắt Chichibu,\\ vừa mới được sơn phết lại vài ngày trước."
2903 = "Hơn cả sa bàn, hơn cả \\\\x%lNゲージ;#00ffc040;N-gauge%l;#;, hơn cả toa xe thật,\\ chúng đang say sưa ngắm nhìn thế giới mà Hibiki vẽ trên giấy."
2908 = "Tiền ứng trước từ Denshahime của Mouri,\\ và mạng lưới quan hệ của Đền chủ Akai cùng Paulette."
2919 = "Paulette khẽ mỉm cười."
2920 = "Đưa mắt lướt qua thông tin trên mạng mà Paulette vừa tìm được,\\ chị Mayami cuối cùng cũng gật đầu thật sâu với vẻ mặt hài lòng."
2921 = "Nơi ánh mắt dịu dàng của Paulette hướng đến,\\ Hibiki vẫn đang miệt mài múa cọ."
2922 = "Không hề tỏ ra ngạc nhiên trước việc Nagi đột ngột xông vào,\\ Paulette đứng bật dậy."
2923 = "Từ hàng ghế phía trong, Paulette hơi nhón chân lên,\\ đưa mắt nhìn bao quát toàn bộ sa bàn."
2926 = "Giọng nói ôn tồn, ánh mắt ấm áp như bao bọc lấy vạn vật.\\ Hibiki trông thật chững chạc."
2930 = "Cứ thế, tôi vò rối, xoa đầu mái tóc mềm mại của em ấy."
2933 = "Reina lạch bạch\\ chạy đến gần tôi rồi thì thầm vào tai."
2936 = "Nếu tính theo nhà ga,\\ thì nằm dọc theo tuyến đường sắt gần ga phế tích Okaue Koufuku——"
2939 = "Dùng kim loại hay thứ gì đó kẻ viền, rồi sơn đè lên sao……\\ Hay là dùng kim loại mạ để trang trí đường viền nhỉ?"
2944 = "Nhìn thấy bộ dạng đó, bầu không khí nhẹ nhõm lan tỏa.\\ \"Nơi này\" rõ ràng đang đứng về phía Hibiki."
2945 = "Quyết định ngay tắp lự, chỉ trong khoảnh khắc vừa nhìn thấy."
2952 = "Mỉm cười, một cách hết sức tự nhiên, chị Mayami đứng dậy và bước đi dẫn đường cho tôi."
2953 = "Không hề căng thẳng. Vô cùng bình đẳng.\\ Hibiki trao đổi ý kiến, trò chuyện cùng chị Mayami."
2955 = "Nói rồi, ánh mắt chị Mayami hướng về phía Paulette."
2981 = "Ngay cả Kisaki cũng có lúc hối hận——\\ thậm chí còn để người khác nhìn thấu điều đó."
2983 = "Kisaki dang rộng tay phải.\\ Phía bên kia là người, người, người. Những nụ cười và tiếng reo hò."
2984 = "Kéo đối thủ vào sân nhà của mình để lật ngược thế cờ,\\ Kisaki đang toan tính và giăng bẫy mà chẳng thèm che giấu ý đồ đó."
2987 = "Ánh mắt Kisaki.\\ Đôi mắt mỉm cười nhưng đầy sắc sảo dừng lại trên người tôi vài giây."
2989 = "Ứng cử viên đối lập là Kisaki đã công nhận điều đó là sức mạnh của Hibiki.\\ Điều đó khiến tôi thực sự tự hào, và tự nhiên cúi đầu cảm ơn."
2992 = "Không biết từ lúc nào,\\ phần khoảng trống cũng đã gần như được lấp đầy."
3003 = "Hẹn hò,\\ rốt cuộc là hành động như thế nào."
3008 = "Cứ mải mê nhìn ngó xung quanh,\\ mà chẳng thèm để ý bước chân, nguy hiểm hết sức."
3013 = "Dù vậy——Hibiki vẫn trả lời ngay lập tức mà không hề sợ hãi.\\ Nếu đã thế, tôi chỉ việc ủng hộ quyết định của Hibiki."
3014 = "Nghe Nagi nói vậy, tôi đưa tay lên sờ mặt nhưng không tự nhận thức được.\\ Tuy nhiên, biểu cảm của mọi người đã chứng minh lời Nagi nói là thật."
3015 = "Giọng nói của Kisaki thu hút ánh nhìn của mọi người xung quanh,\\ và ngay lập tức, tiếng xì xào bàn tán lan rộng."
3016 = "Những ngón tay tròn trịa, non nớt và có vẻ vụng về ấy,\\ chắc hẳn đã làm hỏng bét phần dán hồ rồi."
3022 = "Nếu thiếu đi bất kỳ yếu tố nào,\\ thì quá trình chuẩn bị và thi công chắc chắn sẽ không thể diễn ra suôn sẻ đến thế."
3040 = "Mở rộng phạm vi, tiếp nhận nhiều ý kiến,\\ và làm hài lòng tất cả mọi người, đó là điều lý tưởng."
3045 = "Người nhà như chúng tôi,\\ mà lại phá vỡ quy tắc đó thì còn ra thể thống gì nữa."
3050 = "Điều đó thật bất ngờ. Cảm thấy bất ngờ dường như cũng là một sự thất lễ,\\ khiến tôi thoáng chốc không nói nên lời."
3051 = "Chẳng hiểu vì sao. Mọi người lại nhiệt tình,\\ đồng thanh giục Hibiki ra ngoài."
3054 = "Nếu vậy……có lẽ không cần thiết.\\ Nhưng——dù không cần thiết tôi vẫn muốn làm thế, nên tôi thử hỏi."
3056 = "Điều đó, có nghĩa là——"
3058 = "Hẹn hò hay gì đó, mấy thứ nhàm chán ấy,\\ đang dần tan biến vào bầu không khí đêm khuya."
3061 = "Thế nên, tôi đợi.\\ Cho đến khi nét bút của Hibiki dừng lại và em ấy thở ra một hơi mãn nguyện."
3062 = "Vì vậy, tôi sẽ phản bác lần đầu tiên. Dù có phải chống lại chị Mayami, tôi cũng sẽ để mong muốn của Hibiki được thông qua."
3064 = "Nằm cách xa trung tâm thành phố Ohimitera."
3067 = "\"Hàng khủng\" mà Nagi nói đã đến,\\ chắc là bị thu hút bởi cái đó sao."
3072 = "Toa xe đường sắt khổng lồ đến nhường nào,\\ nhìn thế này mới cảm nhận được rõ ràng."
3074 = "Việc về muộn đến mức đó là chuyện hiển nhiên không thể xảy ra,\\ nhưng không hiểu sao Fukami lại đỏ bừng mặt và luống cuống."
3075 = "Dù là ứng cử viên đối lập……\\ Không, chính vì vậy nên tôi mới càng vui chăng."
3092 = "（Nhưng mà——）"
3093 = "（Nhưng mà, cũng giống nhau thôi.\\ Nhịp đập này, hơi nóng này——dù là của Hibiki, hay của tôi）"
3095 = "（À, đúng vậy. Thế này là được rồi.）"
3099 = "（Hibiki, đợi anh nhé. Anh cũng sẽ đuổi kịp em thôi）"
3100 = "（Rầm!）"

[selections]
