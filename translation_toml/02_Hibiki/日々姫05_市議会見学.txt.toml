2121 = "「Chị Paulette!!?」"
2122 = "「Hồi Tiểu học, tôi chuyển trường khá nhiều. Vì lý do công việc của bố.」"
2123 = "「Lý do tiền bối Kisaki không biết về bài tập viết thư pháp này ạ.」"
2125 = "「Hamburger! Em sẽ để dành niềm vui đó cho lần sau nhé!」"
2129 = "「Ừ, tất nhiên rồi.」"
2130 = "「Tất nhiên nếu ở lập trường ngược lại, phụ nữ cũng sẽ bắt nạt đàn ông. Tâm lý đó, có thể xảy ra ở bất cứ đâu và với bất kỳ ai.」"
2132 = "「Bà lão ở Tororyu-yu á. Hể, vậy thì đúng là truyền thống thật rồi nhỉ.」"
2136 = "「Quả thực. Có lẽ là vậy ạ.」"
2137 = "「Có vẻ hỗn loạn nhỉ. Chính những lúc thế này, việc tham quan hội đồng mới thú vị.」"
2138 = "「Có vẻ, là vậy.」"
2141 = "「Bất ngờ thật đấy. Không ngờ thị trưởng Paulette lại là người táo bạo như vậy ——à không, nếu từ thời Hibiki thì là người tiền nhiệm sao?」"
2144 = "「Vậy sao ạ?」"
2150 = "「Hoạt động kinh doanh của doanh nghiệp tư nhân dẫn đến sự phát triển của thành phố, có vấn đề gì ở đây, tôi không hiểu được.」"
2158 = "「Vì vậy nên tiền bối Kisaki mới tán thành việc thu hút nhà máy sao? Thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;, là cách tốt nhất để nâng cao chất lượng của tương lai.」"
2160 = "「Tiền bối Kisaki! Đồng hồ! Mà đúng hơn là, giờ tập trung!」"
2162 = "「Đồ ngu! Người đó là của ngân hàng! Là tiểu thư nhà Houshou đó!!」"
2164 = "「Đúng là bản năng động vật nhỉ. Chào đón dòng máu mới để giải quyết sự trì trệ của bầy đàn, nhưng khi bầy đàn có nguy cơ bị biến chất thì lại tìm cách loại bỏ.」"
2166 = "「Hiếm khi được chứng kiến một buổi họp hội đồng tệ hại đến mức này đấy. Ở một khía cạnh nào đó, đây cũng là một trải nghiệm vô cùng quý giá.」"
2169 = "「Kết quả là. Nghị sĩ đó đã từ chức ngay trong ngày.」"
2170 = "「Này, Hibiki.」"
2173 = "「Thử thách ạ?」"
2177 = "「Cũng không hẳn là nổi tiếng——」"
2183 = "「Nếu cô nói chỉ cần dẫn đến sự phát triển của thành phố thì làm gì cũng được, thì việc phản đối thu hút nhà máy của công ty \\x%lエアクラ;#00ffc040;Aircra%l;#; chẳng phải là vô lý sao.」"
2186 = "「Nếu được như vậy thì thật may mắn. Sẽ không bao giờ có chuyện ngân hàng bị phá sản nữa.」"
2196 = "「Là giờ học tham quan tòa thị chính. Hoàn toàn không có vấn đề gì đâu. Phòng họp chính là trung tâm của cơ quan hành chính quản lý thành phố mà.」"
2197 = "「Xin ngài cứ đọc báo và bình tĩnh đợi cơm đi ạ. Như thế mới là phong thái xứng đáng với chủ nhân của em chứ.」"
2198 = "「Cô có thể giải thích cho dễ hiểu được không. Mối quan hệ lợi ích, phải rõ ràng!」"
2199 = "「Cảm ơn em. Câu chuyện rất hữu ích. Quả nhiên, nghe từ người trong cuộc vẫn khác biệt.」"
2201 = "「Ông đang làm gì vậy hả chủ tọa. Sao không chỉ đạo người chăm sóc cho thị trưởng đi.」"
2202 = "「Thưa chủ tọa. Xin hãy lưu ý đến những phát ngôn không đúng quy định————!?」"
2209 = "「Giá trị của tiền tệ chính là sự tín nhiệm. Nếu quốc gia phá sản, sự tín nhiệm sụt giảm thì tiền tệ của quốc gia đó cũng chỉ là tờ giấy vụn.」"
2210 = "「Là trao đổi có điều kiện đấy, trao đổi có điều kiện! Vì lợi ích của một doanh nghiệp tư nhân, mà lấy việc kết nghĩa thành phố làm cái cớ!」"
2213 = "「Tên nghị sĩ buông lời quấy rối vẫn ở lại hội trường. Có vẻ Kisaki đã từ hàng ghế dự thính quát hắn ta.」"
2216 = "「Từ chức sao……chuyện này, sao lại đột ngột thế.」"
2234 = "「Về điểm đó, như tôi đã giải thích lúc nãy, phía đối tác」"
2235 = "「Tôi cũng nghe nhiều chuyện. Nhưng không biết là tốt hay xấu. Bởi vì suy cho cùng, tôi cũng không nắm được thông tin từ nguồn trực tiếp.」"
2236 = "「Vụ này tôi sẽ liên lạc với các bên liên quan. Nếu bản thân không có gì phải xấu hổ, thì cứ đường hoàng mà đứng đó đi.」"
2237 = "「Vì nghe nói đó là một tân nghị sĩ thuộc phe thúc đẩy \\x%lエアクラ;#00ffc040;Aircra%l;#; mà.」"
2239 = "「Hai chuyện hoàn toàn khác nhau. Hoạt động của công ty Aero-Craftech và sự phát triển của thành phố Ohimitera không thể xây dựng được mối quan hệ đôi bên cùng có lợi.」"
2240 = "「Nó nổi tiếng đến vậy sao?」"
2241 = "「Không được đâu anh trai, đàn ông con trai sao lại vào bếp chứ.」"
2242 = "「Việc định nghĩa từ trao đổi có điều kiện như thế nào, tôi nghĩ cũng còn tùy thuộc vào cách hiểu của mỗi người, nhưng——」"
2243 = "「Đó là phát ngôn của một nghị viên sao! Là đại diện cho người dân Ohimitera, ông không thấy xấu hổ à!」"
2244 = "「Nếu vậy thì……A! Thử dùng đậu hũ chiên xem sao. Ừm, chắc là được đấy. Cũng có món gọi là hamburger đậu hũ mà.」"
2245 = "「Những lúc thế này thì dùng chất kết dính là được——đúng rồi…… Đằng nào cũng kẹp vào bánh mì, hay là dùng mứt trái cây làm chất kết dính đi.」"
2246 = "「Thời đại nào rồi mà còn nghĩ thế.」"
2247 = "「Bài báo này cũng được viết theo giọng điệu đó.」"
2248 = "「Đương nhiên là——」"
2251 = "「Tóm lại, hãy đi gặp Paulette đã.」"
2252 = "「Hóa ra những chuyện như vậy là có thật nhỉ…… Cái đó gọi là gì ta——quấy rối tình dục? Đại loại thế.」"
2253 = "「Vậy thì, cả em nữa! Anh hai, cho em, đi cùng với.」"
2256 = "「Tại sao các em lại ở đây? Cơ hội học tập là giờ học tự chọn thì sao」"
2257 = "「Ừm——các bên liên quan là sao, khoan đã, này!」"
2259 = "「Bắt buộc phải viết á——không lẽ nào.」"
2261 = "「Vấn đề không phải là chỗ đó!」"
2262 = "「Tiền bạc……」"
2263 = "「Thông tin không tốt, người không tốt, và cả tiền bạc không tốt, tiền bạc, quả nhiên sẽ thu hút tất cả những thứ đó.」"
2271 = "「Khóa cửa lại, đừng gặp ai cả. Đừng nói gì hết. Chúng tôi sẽ đến ngay, cứ yên tâm mà đợi.」"
2272 = "「Anh hai——nguồn tin đó, có khi, là em.」"
2275 = "「Anh Soutetsu. T-Tôi——phải làm sao đây.」"
2276 = "「Ngài Soutetsu thật là tràn đầy năng lượng nhỉ.」"
2277 = "「Ngài Soutetsu! Điện thoại kết nối được rồi ạ.」"
2280 = "「Hừ!」"
2281 = "「!」\\n「!!?」"
2284 = "「~~~~!!!」"
2427 = "Tôi cười khổ trước chữ \"cũng\" được thêm vào trong câu."
2432 = "Một vệt máu đỏ tươi chảy ra từ mũi chị Paulette. Trong chốc lát, cả phòng họp như ngừng đọng lại."
2434 = "Nếu cứ ở Kumamoto hay Ohimitera mãi, thì chắc chắn, sẽ không thể nói hay đến thế."
2435 = "Ở khóe mắt tôi, có thứ gì đó khẽ chuyển động."
2441 = "Khuôn mặt thô bỉ của gã đàn ông thô bỉ, từ màu đỏ thô bỉ, chuyển sang tái mét."
2444 = "Trông người lớn thế mà lại siêu dễ thương! Lần tới mình phải bắt chước làm thử trước mặt anh hai mới được."
2446 = "Chết thật. Lỡ nói ra lời nghe như biện minh mất rồi."
2447 = "Nếu là đánh nhau hay gì đó thì đáng sợ lắm……"
2449 = "Không biết từ lúc nào, Hibiki đã đứng ngay đó với chai nước tương trên tay."
2452 = "Nói đúng hơn thì…… Bài báo này mang lại cảm giác quá chủ quan đối với một bản tin."
2453 = "Nhưng đành chịu thôi. Tiền bối Kisaki cũng bận rộn chẳng kém gì chị Paulette."
2455 = "À không, không phải. Mình nghĩ bây giờ bắt buộc phải hỏi chuyện này."
2459 = "Hẹn gặp, nói chuyện trực tiếp và xác nhận chi tiết sự việc."
2467 = "Với tính cách của Hibiki và Kisaki, gần như chắc chắn họ đã chọn cùng một khóa học."
2470 = "Nhưng tôi cũng không ghét việc nấu ăn. Hồi còn sống một mình trên thủ đô, tôi cũng từng mày mò đủ món."
2472 = "Thế nhưng, chị Paulette, quả nhiên vẫn không hề nao núng."
2476 = "Ngân hàng, hay công ty chứng khoán. Nơi tập trung rất nhiều tiền, thế mà lại bị phá sản."
2492 = "Giọng nói của Hachiroku như thể đã hiểu ra điều gì đó."
2493 = "Hơn nữa lại còn bị Hachiroku nhìn bằng ánh mắt hệt như một người mẹ."
2496 = "Hachiroku quan sát Hibiki khá kỹ. Cô ấy hiểu con bé."
2497 = "Thấy Hachiroku có vẻ hứng thú, tôi tiếp tục đọc bài báo."
2499 = "Đang nói dở, miệng Hachiroku bỗng há hốc ra."
2504 = "Lời định nói, thứ gì đó vừa hiện lên trong tâm trí tôi."
2505 = "Gã đàn ông vừa la ó lúc nãy, lần này, lại văng nước bọt về phía chúng tôi."
2513 = "Ví dụ như tôi phát hành 『Tiền giấy Hibiki』, thì cũng chẳng ai công nhận giá trị của nó như một loại tiền tệ."
2520 = "『Thị trưởng Hinai (Paulette) sắp từ chức』 Tiêu đề được in đậm đen rõ ràng."
2528 = "Thế nhưng, không hiểu sao chị Paulette, trông lại bình tĩnh hơn ngày thường rất nhiều."
2530 = "Ngay cả với một lời chỉ trích mà tôi cho là khá sắc bén, chị Paulette vẫn có thể dễ dàng bỏ qua với khuôn mặt tỉnh bơ."
2533 = "Nhưng……nếu không tìm thấy thứ tốt hơn, thì đành phải chọn thứ khả dĩ nhất trong hoàn cảnh hiện tại thôi."
2534 = "Nhưng, nhưng mà——"
2535 = "Nhưng, nhưng——nhưng mà."
2544 = "Ủa? Tình hình này, có vẻ hơi gay go rồi. Xung quanh……chẳng còn ai từ lúc nào không hay."
2547 = "Thật đáng ghét—— Tiền bối Kisaki lẩm bẩm rồi dốc ngược lon nước."
2550 = "A, không được——không được rồi. Tiếng phổ thông. Cả lúc suy nghĩ cũng phải dùng tiếng phổ thông chứ."
2552 = "A, người này, dù sao thì vẫn là một nghị viên nhỉ."
2554 = "Hừm……Con bé khách sáo quá rồi đấy. Nhưng mà, nếu con bé có thể hoạt bát được như vậy thì——"
2555 = "Nói một cách chính xác thì, tên nghị sĩ buông lời quấy rối tình dục đã chuyển nghề thành cựu nghị sĩ, nhưng chuyện đó chẳng quan trọng."
2557 = "Cảm giác như đang bị hối thúc, tôi uống một ngụm nước ép. Ngay lập tức, cái đầu đang nóng bừng của tôi dịu lại."
2559 = "Hắn ta bỏ trốn trước khi sự chỉ trích của dư luận đổ dồn vào và khiến vết thương thêm sâu chăng."
2564 = "Thế nhưng, chỉ cần nuốt ực một cái, tiền bối Kisaki lại trở nên điềm nhiên như không."
2571 = "Sắc mặt—— Bình thường đã trắng rồi, giờ lại trắng bệch như sáp."
2573 = "Chị ấy nhặt nó lên, và lần này bỏ vào thùng rác một cách bình thường."
2574 = "Con bé nhìn chằm chằm vào tờ báo trên tay tôi, rồi cứ thế run rẩy nhè nhẹ."
2576 = "Khuôn mặt đỏ bừng. Nhưng không phải vì xấu hổ. Lần đầu tiên tôi thấy. Chị Paulette đang tức giận."
2578 = "Thấu hiểu, và vượt qua—— trông chị ấy như đã rũ bỏ được điều gì đó."
2579 = "Ánh mắt ấy khiến tôi thấy ngượng, liền mở rộng tờ báo vừa nhận ra."
2582 = "Đôi mắt ấy đang chăm chú nhìn tôi."
2584 = "Chị ấy trừng mắt nhìn tên nghị viên vừa la ó, rồi sải bước dài——oái!!?"
2585 = "Đã nói chuyện được nhiều thế này rồi, mà còn mong muốn hơn nữa thì đúng là tham lam quá."
2587 = "Nhanh quá, nhanh quá—— Bóng lưng chị ấy, ngày càng xa dần."
2589 = "Nếu sức thuyết phục đó chạm đến nhiều người, và khiến họ nghĩ rằng 'Thị trưởng Paulette có thể sẽ từ chức' thì——"
2596 = "Tiền bối lại dốc ngược lon nước, nuốt ực một ngụm qua chiếc cổ trắng ngần."
2597 = "Tiền bối khẽ cười rồi lắc đầu, lần này chị ấy giơ thẳng ngón tay lên, và gõ nhẹ vào đầu mũi tôi."
2598 = "Tiền bối cười khổ rồi quay lại nhìn tôi."
2600 = "Dọn dẹp xong xuôi, tôi ngồi vào bàn ăn đợi bữa sáng. Nhưng chẳng thấy bóng dáng ai cả."
2608 = "Đúng rồi. Tôi từng xem trên tin tức."
2610 = "Sợ 'rút dây động rừng'…… Tôi chỉ biết thở dài một tiếng 'hà'."
2611 = "Dù sự thật là như vậy, nhưng tôi vẫn nghĩ, giá như mình có thể làm thêm được điều gì đó."
2618 = "Nhà bếp là lâu đài của phụ nữ, ở nhà Migita, người ta vẫn hay nói những câu cổ hủ như vậy."
2622 = "Nếu không nhanh chóng làm điều đó, thì bất cứ lời nói hay hành động nào cũng sẽ trở nên vô cùng nguy hiểm."
2623 = "Nhìn biểu cảm như đang uống thuốc đắng của chị ấy, tôi bỗng cảm thấy \"Ra là vậy\"."
2625 = "Cảm thấy bứt rứt quá. Muốn hỏi, nhưng lại không thể hỏi được."
2630 = "Vậy thì tôi không thể chần chừ. Dù có sai đi chăng nữa, tóm lại vẫn phải đưa ra quyết định ngay lập tức."
2632 = "Không thích đâu. Đáng sợ lắm. Tôi muốn rời khỏi nơi này ngay lập tức……A, đúng rồi!"
2634 = "Ngay lúc tôi vừa nhổm người lên, Hibiki lạch cạch chạy xuống lầu."
2636 = "Tôi và Hachiroku nhìn nhau, rồi cùng nhìn vào trang 3."
2638 = "Ra là vậy, tôi thầm nghĩ. Chị Paulette không phải là người mạnh mẽ, mà là chị ấy đang cố gắng."
2640 = "Muốn hỏi quá. Chắc chắn, bây giờ thì có thể hỏi được."
2641 = "Vì mình cũng muốn trở nên giống như anh hai. Muốn đuổi kịp anh ấy dù chỉ một chút——muốn được đứng ngang hàng với anh ấy."
2642 = "Tôi muốn chị ấy hiểu được sự cố gắng của chị Paulette. Muốn chị ấy hiểu rằng việc kiệt sức cũng là điều không thể tránh khỏi."
2643 = "Nếu tiền bối đã bỏ lỡ trải nghiệm đó, thì tôi muốn kể cho chị ấy nghe."
2647 = "Chuyện về những bức tranh, hay những tấm biển quảng cáo."
2650 = "Không thể cãi lại được. Những lời tiền bối Kisaki nói, đều là lý lẽ chính đáng."
2652 = "Dù tôi có xoa đầu vò rối tóc con bé, Hibiki vẫn không ngừng run rẩy."
2654 = "Nghe những lời của tiền bối Kisaki, tôi gật đầu đồng tình."
2655 = "Nếu không thì, đơn giản là hắn đã chạm đến vảy ngược của cha con Houshou, những nhân vật trung tâm của phe thúc đẩy, và bị cách chức trên thực tế."
2658 = "Thế nên, lần này chị ấy muốn tạo ra kết quả, muốn được anh hai khen ngợi——"
2659 = "Vì vậy, tôi biết. Hibiki cũng đã hiểu ra vấn đề."
2660 = "Vì vậy, tôi kể lại mọi chuyện từ đầu. Tất cả những gì tôi đã trải qua vào ngày hôm đó, không sót một chi tiết nào."
2665 = "Giới chính trị sẽ bắt đầu rục rịch với giả định Paulette từ chức. Ngược lại, sức ảnh hưởng và uy tín của Paulette chắc chắn sẽ bị suy giảm."
2666 = "Thế nên, tôi lại tiếp tục giải thích."
2667 = "Nếu trong mắt Hachiroku cũng thấy vậy, thì chắc chắn là không sai rồi."
2670 = "Khi bản tin này đã lan truyền, điện thoại của Paulette chắc chắn sẽ bị gọi dồn dập đến mức nghẽn mạng ngay lập tức."
2692 = "Dù đã nói vậy, nhưng Hibiki vẫn có vẻ e ngại. Chỗ này đành phải dùng lòng ham muốn để thúc đẩy em ấy vậy."
2694 = "Vù một cái. Hibiki lao vào bếp với khí thế như tạo ra cả một cơn gió."
2696 = "Khuôn mặt Hibiki tái mét. Có lẽ là do huyết áp thấp chăng."
2698 = "Là cô giáo. Sao lại đúng lúc này chứ——ơ!?"
2700 = "Ra là vậy, đúng là thế nhỉ. Tôi cứ tưởng bản thân tiền bạc đã có giá trị rồi cơ——"
2701 = "Tiếng phổ thông, hay thủ đô. Những thứ đó quả thực rất đáng ngưỡng mộ, nhưng Ohimitera cũng có những điều thú vị riêng của Ohimitera."
2703 = "Nền hành chính thành phố được duy trì bằng nguồn thu thuế, nên hoạt động kinh doanh của doanh nghiệp không phải là thứ đáng bị chỉ trích!"
2706 = "Đột nhiên có thứ gì đó lạnh buốt áp vào gáy."
2712 = "So với việc được người của tòa thị chính giảng giải về ngân sách năm ngoái—— thì có lẽ, chúng tôi đã học được những điều cốt lõi hơn rất nhiều."
2713 = "Không có thời gian để do dự nữa."
2724 = "Lại bị quát tháo. Nhưng chị Paulette không hề biến sắc."
2725 = "Cũng giống như tôi, chị Paulette, chắc chắn đang cố gắng hết sức mình."
2726 = "Máu cam. Nhưng chị ấy không hề hoảng hốt. Bịt mũi lại với vẻ rất quen thuộc."
2727 = "Chị Paulette nói đúng quá đi!"
2728 = "Có những việc khác cần phải làm. Chỉ làm những việc đó thôi cũng đã dốc hết sức rồi."
2729 = "Paulette rõ ràng đang dao động. Nếu vậy, phải hành động nhanh chóng."
2730 = "Sự hoảng loạn đã quay trở lại. Một Paulette sợ hãi và bối rối, chẳng khác gì lúc mới quen."
2732 = "Ngay khi nhận ra đó là lon nước ép, tôi mới cảm thấy rõ ràng. Cổ họng mình đang cực kỳ khát."
2736 = "Sau đó, vút! Lon nước được ném về phía thùng rác, nhưng lại va vào mép và nảy ra ngoài."
2740 = "Giọng nói lớn của một người đàn ông."
2744 = "Có lẽ tốt nhất là cứ làm theo lời Hachiroku, bình tĩnh đợi cơm——っ!!?"
2747 = "Nếu vậy thì có lẽ, sự đồng tình vừa rồi của Hachiroku là dành cho câu \"tôi cũng chưa trưởng thành\" cũng nên."
2751 = "Những bọt ga xèo xèo nổ tung trong cổ họng, như cuốn trôi đi hết mọi cảm giác tồi tệ."
2801 = "Tiền bối Kisaki đặt ngón tay bên cạnh môi, rồi khẽ nghiêng đầu."
2802 = "Tiền bối Kisaki vươn tay ra, và rủ tôi bằng một giọng nói điềm tĩnh."
2803 = "Tiền bối Kisaki lấy điện thoại ra, và tách, chụp lại khuôn mặt đó."
2804 = "Tiền bối Kisaki cứ thế tiến về phía có tiếng nói——ơ, hả!? Chỗ này là——"
2805 = "Tiền bối Kisaki uống nước tăng lực. Lon nước màu xanh và trắng cực kỳ hợp với chị ấy, trông đẹp như một bức tranh."
2806 = "Tiền bối Kisaki thành khẩn cúi gập đầu trước cô giáo đang tiến lại gần."
2807 = "Tiền bối Kisaki đã bắt đầu chạy đi."
2808 = "Tiền bối Kisaki kéo tôi đi, với những cử chỉ và bước chân vô cùng quen thuộc, bước vào hàng ghế dự thính của phòng họp hội đồng thành phố, rồi lập tức đóng cửa lại."
2809 = "Tiền bối Kisaki lắc ngược lon nước đã cạn sạch."
2810 = "Tiền bối Kisaki lại đưa lon nước lên miệng, dốc ngược lên thật cao."
2811 = "Bị tiền bối Kisaki kéo tay, tôi vội vàng chạy vào bên trong tòa thị chính————oái!?"
2812 = "Tiền bối Kisaki cúp máy. Dù không biết người bên kia là ai, nhưng tôi hiểu nội dung cuộc gọi."
2813 = "Chị ấy đã không giấu giếm mà cho tôi biết. Rằng tiền bối Kisaki cũng không nghĩ đó là \"tốt nhất\"."
2814 = "Tiền bối Kisaki khẽ hừ mũi, đôi mắt nheo lại."
2815 = "Một tiếng quát lớn. Tiền bối Kisaki đứng bật dậy."
2816 = "Bảng thông báo cạnh lối vào. Vừa đưa mắt nhìn, tiền bối Kisaki liền bật cười."
2817 = "Tiền bối Kisaki hiểu được điều đó. Bởi vì chị ấy đã luôn dõi theo tôi."
2818 = "Tôi không hề ngạc nhiên. Bởi vì, đó là tiền bối Kisaki mà."
2821 = "Khóe môi hơi cong lên một chút, đặt ngón tay vào—— Thế nào nhỉ? Trông như thế này chăng?"
2827 = "Giọng nói đó, như cắt đứt thứ gì đó đang căng như dây đàn."
2830 = "Nghe chị ấy nói vậy, tôi mới hiểu ra. Tiếng phổ thông của tiền bối Kisaki——hình mẫu của tôi."
2840 = "Nước ép cam có ga, chứa chưa đến 1% nước cốt trái cây."
2856 = "Búa gỗ. Giống như cái thường thấy trên phim ảnh."
2857 = "Thậm chí đọc vào còn thấy như thể đang cố tâng bốc Kisaki vậy."
2861 = "Lục đục nội bộ. Hay nói đúng hơn là trở mặt như lật bàn tay. Thật chướng mắt——ngay khoảnh khắc tôi nghĩ vậy, có thứ gì đó xẹt qua che khuất tầm nhìn."
2866 = "Đôi chân đang bước đi mạnh mẽ bỗng nhiên khuỵu xuống. Chị Paulette mềm nhũn người rồi ngã gục xuống."
2877 = "Lời nói của tiền bối Kisaki đã cắt đứt hoàn toàn điều đó."
2878 = "Điều đó ngược lại, càng khiến tôi cảm thấy đáng sợ hơn."
2879 = "Lần này là Hachiroku. Cô ấy vừa nói lời trêu chọc, vừa đưa tờ báo cho tôi."
2880 = "Nghe gần như là đang quát tháo, ngay cả một người không liên quan như tôi, cơ thể cũng hơi giật mình."
2881 = "Những thông tin cỡ đó, nếu ngân hàng không biết mới là lạ—— nhưng sự bất an, quả nhiên vẫn đang từ từ dâng lên trong tôi."
2882 = "Dưới bài báo có tiêu đề như vậy, trong bức ảnh là hình dáng của Hibiki và Kisaki."
2883 = "Nghe vậy, tôi chợt nhớ ra. Vì không có tiền, nên muốn vay mượn."
2884 = "Tôi liền bắt chước ngay cử chỉ của tiền bối Kisaki."
2887 = "Thực hành tự chọn, nơi nội dung học tập không được quyết định bởi khối lớp, mà chỉ dựa vào việc \"chọn khóa học nào\"."
2889 = "Đoạn bài viết ghi rằng 'Cảm nhận sâu sắc trách nhiệm về việc chạy thử đầu máy 8620 liên tục gặp sự cố', khiến tôi không khỏi bận tâm."
2891 = "Bị một ông chú trông dữ tợn và xấu tính quát tháo ầm ĩ."
2893 = "Ông chú bị vặn lại đến cứng họng, vẫn chưa chừa mà lại tiếp tục chu mỏ lên."
2895 = "Hành động của gã đàn ông thô bỉ đó, sẽ được công khai. Sẽ không thể lén lút chôn vùi trong bóng tối được nữa."
2897 = "Mái tóc màu vàng kim—— Hoàn toàn khác với loại tóc nhuộm, trông rất tự nhiên."
2901 = "Quan trọng hơn chuyện đó là Paulette."
2910 = "Quan trọng là Paulette. Không thể ngờ những gì viết trên báo lại là sự thật——"
2912 = "Trong lúc nguy cấp, anh hai, suýt chút nữa đã bị mang ra làm tài sản thế chấp cho tiền bối Kisaki."
2914 = "Là người đã trao cây cọ vẽ cho tôi, khi tôi đang sợ hãi và không thể tiến bước vì không có anh hai bên cạnh."
2917 = "Tôi cũng……dù không quá lộ liễu, nhưng cũng từng bị chủ tiệm làm biển quảng cáo ở địa phương nói xỉa xói vài câu."
2918 = "Dù đây là một bài báo tồi tệ, cố tình diễn giải phóng đại với ác ý, nhưng những sự thật làm nền tảng cho sự diễn giải đó lại hoàn toàn chính xác."
2921 = "Lời nói chính nghĩa bằng một giọng điệu đanh thép, khiến cả phòng họp im phăng phắc."
2939 = "(『Cái này có thể trao đổi lấy hàng hóa và dịch vụ』, chính sự tin tưởng của mọi người vào giá trị đó, mới khiến tiền bạc thực sự trở thành tiền bạc.)"
2941 = "（Cộc, cộc!）"
2944 = "(Tại vì, sự cố của \\x%l客車;#00ffc040;toa hành khách%l;#;—— chị Paulette vẫn nghĩ đó là trách nhiệm của mình mà.)"
2952 = "(Tiền bối Kisaki, ở ngân hàng…… chắc chắn cũng đã trải qua những khó khăn như thế.)"
2953 = "(Quen với việc chảy máu cam……chuyện đó khá là tồi tệ đấy chứ? Làm việc quá sức sao. Tình trạng sức khỏe của chị ấy chắc đang ở mức báo động rồi.)"
2954 = "(Tiền bối Kisaki……không hề phản đối chuyện đó……)"
2956 = "(Thật đáng ghét, nhưng bài báo này—— quả thực có sức thuyết phục nhờ vào tính chính xác của các dữ kiện thực tế.)"

[selections]
