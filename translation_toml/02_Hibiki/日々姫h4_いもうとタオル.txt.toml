1163 = "「Nè? Anh hai――ưm……Cho em nghe, đi? Bằng giọng――\\ncủa anh hai――a――sướng, như thế, nào――」"
1164 = "「Nè? Anh hai」"
1166 = "「Có thể vào――sâu, đến mức――này――sao――」"
1169 = "「Anh hai……sao vậy?」"
1170 = "「Anh hai」"
