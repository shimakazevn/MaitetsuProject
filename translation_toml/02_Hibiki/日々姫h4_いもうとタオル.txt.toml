1135 = "「Bọt xà phòng và……làn da, trượt đi và cọ xát vào nhau một cách tuyệt diệu, ưm……\\nPhần xương giữa khe ngực――của Hibiki……cưng cứng, chạm vào」"
1140 = "「Cũng có phần là do lâu không làm.\\nVới lại……có lẽ do em muốn thể hiện cho anh thấy nên đã hơi quá sức」"
