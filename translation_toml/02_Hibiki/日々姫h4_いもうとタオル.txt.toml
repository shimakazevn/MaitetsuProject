1181 = "「Xương á!?」"
1182 = "「!」"
1183 = "「!!?」"
1272 = "Không biết là do hơi nóng trong phòng tắm hay do phát tình,\\nchiếc cổ họng nhuốm màu hồng phấn của em ấy từ từ nuốt nước bọt."
1274 = "Sự khiêm tốn về kích cỡ vòng một quả nhiên là một bất lợi,\\nnó không mang lại kích thích mãnh liệt như khi bị ngậm trọn trong khoang miệng."
1276 = "Không, em ấy đang gồng cả cơ thể,\\ntoàn thân khẽ run lên bần bật."
1285 = "Nhưng, nó không dừng lại.\\nHibiki vẫn tiếp tục tuôn ra cơn mưa màu vàng từ lỗ niệu đạo."
1287 = "Nhưng đôi mắt Hibiki lại ướt đẫm, phát ra những âm thanh ngấm sâu vào tận não tủy."
1289 = "Nhưng Hibiki không hề tỏ ra ghét bỏ.\\nCũng không hề tỏ ra đau đớn một chút nào."
1291 = "Nhưng mà, bảo là ngực thì……\\nNgực của Hibiki làm gì có đủ kích cỡ để mà kẹp chứ."
1294 = "Nhưng, chính vì vậy, phải làm giống như lúc nãy――\\nKhoái cảm khi khoét sâu và nhấn mạnh vào tận cùng đó!!!!"
1295 = "Vừa hòa quyện dính chặt lấy nhau, lại vừa kích thích lẫn nhau,\\ndẫn dắt nhau đến khoảnh khắc xuất tinh, đến tột đỉnh thăng hoa."
1309 = "Chuyển động lưỡi vô cùng tinh tế và ngập tràn tình yêu,\\ntừ từ, từ từ đưa tôi đến gần hơn với khoảnh khắc xuất tinh."
1315 = "Cậu nhóc vốn đã ỉu xìu vì xuất tinh quá nhiều,\\nnay lại lấy lại phong độ một lần nữa."
1316 = "Lúc nãy, Hibiki đã cho tôi biết."
1327 = "Từ cửa âm đạo vẫn còn mở toang của Hibiki,\\ntinh dịch của tôi trào ra ngoài――một cảnh tượng thật dâm đãng."
1334 = "Đồng thời từ hai bên thân dương vật,\\náp lực từ những phần thịt mềm mại của bầu ngực ép chặt lấy."
1339 = "Không chỉ đôi môi, mà cả mũi, cả má đều dán chặt vào nhau,\\ntôi và Hibiki xích lại gần nhau hơn cả khoảng cách số không."
1341 = "Chà, nếu thế này thì với mức độ bám sát này,\\ncũng không thể không gọi là \"đang kẹp\" được, em ấy đang ép chặt và kích thích từ hai bên."
1349 = "Trên lớp sữa tắm đó, em ấy nhỏ thêm thật nhiều nước bọt lên――"
1350 = "Qua tấm gương, ánh mắt chúng tôi cũng giao nhau làm một.\\nHibiki cũng hiểu, và khao khát điều đó."
1354 = "Em ấy định làm gì, sẽ làm gì cho tôi.\\nDù không nói thành lời, tôi vẫn có thể cảm nhận được."
1357 = "Chuyển động nhịp nhàng của đôi môi em ấy, vừa làm tăng thêm khoái cảm cho tôi,\\nvừa giúp xoa dịu đi cảm giác nôn nóng."
1359 = "Sức hút mạnh mẽ đến mức hai má em ấy lõm cả vào――"
1361 = "Em ấy há to miệng,\\ncho tôi thấy em ấy đã nuốt hết toàn bộ."
1363 = "Lực mút ở miệng yếu đi như thể em ấy đã mút đến mỏi cả miệng,\\nnhưng chiếc lưỡi thì vẫn uốn lượn, một lòng một dạ liếm láp phần đầu dương vật."
1364 = "Được em ấy nghĩ đến mức đó,\\nlà một thằng đàn ông, tôi cảm thấy rất vui nhưng――"
1366 = "――Em ấy vạch rộng ra một cách sống động,\\nvà truyền đạt cho tôi từng lời, từng lời như vắt kiệt từ tận đáy lòng."
1368 = "Toàn thân giật nảy lên bần bật,\\ndòng nước tiểu cũng chuyển sang ngắt quãng nhỏ giọt――――rồi dừng hẳn."
1370 = "Sợi chỉ trắng đục mỏng manh nối liền môi trên và môi dưới,\\nđứt phựt khi em ấy phả ra một hơi thở \"hà\"."
1372 = "Tử cung co thắt dữ dội!\\nVắt kiệt một cách mãnh liệt hơn nữa lượng tinh dịch đang tuôn trào!"
1373 = "Thịt âm đạo giờ đây đã ấm nóng và tan chảy,\\nchỉ cần cọ xát nhẹ thôi là nó đã bám chặt lấy, như đang làm nũng và muốn tóm lấy tôi."
1376 = "Chiếc lưỡi vốn đang trườn bò đầy dịu dàng và gợi tình ở mặt trong răng tôi,\\nbỗng móc ra một thứ gì đó――cưng cứng từ chỗ ấy."
1377 = "Đáng yêu quá. Và rồi,\\nnghĩ một cách tự nhiên, cánh tay tôi bắt đầu cử động."
1380 = "Chậm rãi, và ướt át."
1382 = "Hibiki mỉm cười rạng rỡ,\\nrồi lặng lẽ nhắm đôi mắt lại."
1391 = "Vì quá sướng nên mồ hôi tuôn như thác trên lưng tôi,\\nchảy ròng ròng rồi đọng lại ở hõm lưng."
1394 = "Dù chỉ một giây thôi――\\ncũng mong được mãi bên nhau không rời."
1397 = "Chức thị trưởng, phụ lái tàu, và tất nhiên là cả việc vẽ tranh nữa."
1400 = "Cảm giác nhục dục mãnh liệt phản hồi lại một cách mạnh mẽ,\\nxuyên thấu qua dương vật tôi bằng một khoái cảm chưa từng có."
1403 = "Những giọt mồ hôi rỏ xuống từ trán em ấy,\\ncũng trở thành chất bôi trơn và kích thích, làm tăng thêm khoái cảm cho tôi."
1405 = "Khoái cảm chạy dọc sống lưng khiến tôi rùng mình."
1412 = "Quả thực, lần này khác với mọi khi.\\nSâu quá――Tôi có thể tận hưởng trọn vẹn bên trong Hibiki theo ý muốn."
1415 = "Tôi bất giác thốt lên.\\nDòng nước tiểu của Hibiki vẽ nên một đường cung hoàn mỹ đến nhường nào."
1421 = "Chúng tôi nhấm nháp đôi môi của nhau,\\nđến khi hơi thở dần trở nên nóng bỏng, chiếc lưỡi của Hibiki liền len lỏi vào."
1422 = "Hôn. Hôn. Hôn."
1423 = "Chỗ giao hợp nổi đầy bọt trắng chỉ từ ma sát và mật dịch.\\nMùi hương của Hibiki và tôi lấn át cả mùi xà phòng."
1424 = "Một điều giản đơn mà cả hai đều hiểu rõ.\\nChúng tôi trao nó cho nhau qua đôi môi――"
1425 = "Dọn dẹp, khóa cửa rồi sáng hôm sau trả chìa khóa――\\nKhi đã quen thì đây quả là một cách tắm bao trọn gói cực kỳ thoải mái."
1427 = "Tôi đẩy hông lên, đồng thời kéo cơ thể Hibiki xuống!"
1429 = "Tôi kéo hông ra thật xa rồi thúc mạnh."
1431 = "Tôi hôn lên mái tóc em ấy,\\náp nhẹ môi vào vành tai đang run rẩy, thì thầm."
1433 = "Trao nhau nụ hôn và quấn lấy đầu lưỡi,\\nmột hương vị ngai ngái nồng nặc cũng truyền sang khoang miệng tôi."
1434 = "Tôi ngồi dậy, nhẹ nhàng ôm Hibiki vào lòng."
1437 = "Tôi chuyển động hông thật nhanh với biên độ nhỏ,\\nliên tục nhấm nháp cùng một điểm bên trong âm đạo của Hibiki."
1438 = "Khoái cảm từ từ dâng trào,\\nlà một niềm hạnh phúc vượt lên trên cả sự kích thích――tôi cảm nhận được sự râm ran ở phía sau đầu."
1439 = "Tôi cảm thấy lời lẩm bẩm vừa thốt ra của mình,\\nnghe cứ như một từ khóa tìm kiếm vậy."
1443 = "Chỉ cần cố kìm nén sự cám dỗ đó và giữ nguyên không cử động――\\nSự rung động của vô số nếp gấp đã không ngừng kích thích tôi."
1445 = "Tôi bế thốc Hibiki lên, để hai chân em ấy mở rộng ra."
1447 = "Vừa véo tôi vừa kéo nhẹ ra một chút,\\nthử tạo thêm chút kích cỡ giả tạo cho bộ ngực quá đỗi khiêm tốn này."
1449 = "Cường độ kích thích lên cơ quan sinh dục.\\nTôi đã nhận ra rằng đó không phải là nguồn gốc duy nhất của khoái cảm."
1450 = "Thay cho câu trả lời, tôi đặt một nụ hôn lên đôi môi đáng yêu đang phả ra hơi thở ngọt ngào."
1453 = "Tôi dùng mông Hibiki chặn lại dương vật đang giật giật râm ran của mình,\\ntách nó ra khỏi âm đạo của em ấy."
1455 = "Khi tôi dùng phần sống của dương vật cương cứng lướt qua âm đạo của Hibiki,\\nem ấy liền phát ra một tiếng rên ngọt ngào."
1456 = "Ấn đầu dương vật vào chỗ thô ráp rồi lại rút ra,\\ncùng với Hibiki, đẩy những khoái cảm quen thuộc này lên đến tột đỉnh."
1459 = "Cùng với nhịp giật giật của dương vật,\\nmột luồng khoái cảm râm ran chạy dọc từ lưng lên đến tận não."
1460 = "Bằng lời nói, tôi thúc đẩy Hibiki.\\nVà tất nhiên, bằng cả dương vật đang cương cứng nữa――"
1462 = "Bạch! Cảm giác tinh dịch bắn đập vào sâu bên trong cánh cửa tử cung\\ntruyền thẳng đến quy đầu."
1465 = "Nó khao khát tôi, ôm trọn, uốn lượn và mời gọi tôi.\\nLớp thịt của Hibiki như muốn kéo dương vật của tôi vào sâu, sâu hơn nữa."
1467 = "Tôi có thể cảm nhận rõ lực ép. Có thể đẩy mạnh vào tử cung em ấy."
1468 = "Sướng đến mức muốn xuất tinh ngay lập tức,\\ncơ lưng tôi căng cứng, và lỗ hậu môn cũng tự động siết lại."
1470 = "Khi tôi xoay hông ngoáy sâu vào trong âm đạo, hông của Hibiki tất nhiên cũng xoay theo,\\nkhiến dòng nước tiểu cũng đung đưa dữ dội."
1473 = "Theo đà đỡ lấy cơ thể Hibiki sắp đổ gục xuống,\\ndương vật của tôi vô tình tuột ra khỏi âm đạo."
1478 = "Đúng như mong muốn, tôi đẩy hông tới,\\nđưa dương vật vào sâu trong âm đạo của Hibiki cho đến tận phần rãnh quy đầu."
1510 = "Toàn thân căng cứng,\\nHibiki lại một lần nữa đạt cực khoái!"
1512 = "Hibiki run rẩy."
1513 = "Hibiki lại thoa nước bọt lên,\\nrồi lướt đôi môi dọc theo đường nước bọt vừa rỏ xuống――"
1516 = "Có lẽ những lời nói đó càng làm em ấy hưng phấn hơn,\\nâm đạo của Hibiki lại càng co giật mạnh."
1519 = "Giống như một đứa trẻ thèm khát bầu sữa mẹ, chuyển động của Hibiki vô cùng say sưa và tập trung.\\nTuy nhiên, nếu so với âm đạo hay hậu môn, thì sự kích thích này vẫn có phần yếu hơn."
1521 = "Sức nóng từ khoang miệng và chuyển động lưỡi của Hibiki,\\ntừ từ bù đắp cho sự thiếu hụt kích thích từ bộ ngực."
1524 = "Chắc hẳn những cảm xúc chân thành của tôi đã được truyền đạt trọn vẹn."
1525 = "Hơi ấm tỏa ra từ chiếc khăn tắm em gái,\\nđúng như lời Hibiki nói, ngày càng ấm dần lên."
1528 = "Miệng Hibiki đón trọn toàn bộ phần quy đầu.\\nLưỡi em ấy dán chặt lấy, uốn lượn mơn trớn và liếm sạch những giọt mật dịch."
1530 = "Hibiki rũ rượi, ánh mắt buồn bã nhìn xuống.\\nỞ đó, tức là dưới đáy bồn tắm, đọng lại một lớp nhọ nồi đen sì."
1532 = "Cùng với giọng nói vui vẻ của Hibiki,\\ntôi dùng gáo múc nước nóng dội sạch lớp sữa tắm."
1533 = "Ánh mắt của Hibiki không hướng về phía tôi,\\nmà đang dán chặt vào phía dưới chân tôi――chiếc gương lớn ở khu vực tắm rửa."
1536 = "Những ngón tay của Hibiki dẫn lối cho tôi."
1539 = "Tôi nhẹ nhàng véo lấy núm vú đang cương cứng và run rẩy,\\nnhư thể đang đòi hỏi được chạm vào của Hibiki."
1540 = "Chuyển động của Hibiki càng lúc càng nhanh và cuồng nhiệt hơn."
1542 = "Khuôn mặt Hibiki đỏ bừng lên chỉ trong tích tắc."
1544 = "Đồng điệu với chuyển động của lưỡi là bộ ngực của Hibiki đang ép chặt lấy.\\nNhịp tim truyền đến khe khẽ từ nơi đó, khiến mức tinh dịch trong tôi dần dần dâng cao."
1545 = "Âm đạo của Hibiki cứ run rẩy không ngừng.\\nTôi cũng đã bị dồn đến giới hạn cuối cùng rồi."
1548 = "Cơ thể Hibiki trượt đi trên lớp bọt xà phòng,\\nvừa trượt vừa dính chặt và cọ xát vào người tôi."
1550 = "Nhìn vào hình bóng của chính mình phản chiếu trong gương,\\nmột hình bóng đang bị người đàn ông xuyên thấu, trông đến là thê thảm――"
1551 = "Sau khi bắt tôi nằm ngửa ra,\\nHibiki liền cưỡi hẳn lên người tôi."
1553 = "Cười khúc khích, em ấy đưa phần đầu dương vật đang rỉ dịch của tôi――"
1556 = "Hibiki, người phụ nữ trưởng thành đang ngậm lấy dương vật cương cứng của tôi,\\ntôi chậm rãi, chậm rãi vuốt ve em ấy, hệt như cái thuở chúng tôi mới gặp nhau."
1557 = "Đôi mắt em ấy nheo lại đầy vẻ sung sướng và hạnh phúc,\\nnhưng dù vậy, Hibiki vẫn không hề dừng lại chuyển động dù chỉ một chút."
1558 = "Hibiki dồn sức vào hai cánh tay, cố tình\\ndùng ngực kẹp lấy dương vật cương cứng của tôi……"
1559 = "Hibiki khựng lại ngay lập tức.\\nHai má phồng lên, trông hờn dỗi thật đáng yêu."
1564 = "Từ nơi âm đạo vốn đã ướt đẫm từ lâu,\\nmột dòng mật dịch mới lại trào ra, sền sệt chảy dọc theo đùi em ấy."
1566 = "Quả nhiên là vậy, nghĩ đến đó tôi lại thấy vui vui,\\nvà cảm xúc ấy cứ thế bật ra thành lời."
1585 = "Và rồi, chúng tôi lại kết nối sâu thẳm.\\nTôi và Hibiki ôm chặt lấy nhau."
1586 = "Và rồi, em ấy bắt đầu di chuyển."
1587 = "Và rồi, em ấy đổ sữa tắm lên dương vật đang cương cứng của tôi."
1588 = "Và rồi, Hibiki đưa những ngón tay xuống đũng quần của mình――"
1589 = "Và rồi ôm chặt lấy Hibiki,\\ndùng cơ thể mình bao bọc lấy em ấy!"
1591 = "Tuy nhiên thực tế, lớp nhọ nồi đen sì chìm dưới đáy bồn tắm\\nđã chứng minh cho sự thiếu sót của cái gọi là \"cứ nghĩ là\" đó."
1592 = "Dẫu vậy, không ngờ nhọ nồi lại xâm nhập\\nvào tận trong miệng thế này――"
1595 = "Dù biết vậy nhưng tôi vẫn gần như gục ngã trước xung động xuất tinh, chiếc khăn tắm Hibiki,\\nchiếc khăn tắm em gái này đang cọ xát và bao bọc lấy tôi một cách quá đỗi tuyệt vời."
1598 = "Chỉ là trong một khoảnh khắc ngắn ngủi――nhưng tôi không thể không cảm thấy như vậy,\\nhành động và lời nói không hề ăn nhập với nhau."
1599 = "Nếu xuất tinh trong tư thế này,\\nrất có thể tinh dịch sẽ bắn thẳng vào mặt tôi mất."
1602 = "Chủ nhân của nhà tắm Tororyu-yu dạo này nghỉ sớm,\\nnên không còn đợi chúng tôi tắm xong sau ca trực để đóng cửa nữa."
1607 = "Chiếc lưỡi đỏ chót lấp ló qua khuôn miệng đang hé mở đầy sung sướng,\\nđã mang đến cho tôi câu trả lời."
1609 = "Tôi ôm đầu Hibiki đang ủ rũ sát vào người.\\nNâng cằm em ấy lên, nhìn thẳng vào mắt nhau ở khoảng cách gần."
1610 = "Tôi nuốt nước bọt."
1616 = "Lần xuất tinh thứ hai còn đặc và mạnh hơn cả lần đầu,\\nnhư một chiếc roi quất vào và lấp đầy tử cung của Hibiki."
1621 = "Nhắc mới nhớ, hai núm vú cứng cáp của Hibiki\\nvẫn đang cọ xát nhè nhẹ vào vòm ngực tôi."
1623 = "Không có điểm chạm đến cuối cùng.\\nCàng hưng phấn, điều đó lại càng khiến tôi cảm thấy bức bối khó chịu."
1637 = "Thay vì gọi là lòng ganh đua――\\nthì có lẽ đúng hơn là sự ghen tị và tính chiếm hữu đơn thuần."
1641 = "Âm đạo và dương vật, đang hòa quyện vào nhau."
1648 = "Dịch nhờn tiết ra trong nháy mắt,\\nbị kẹp giữa khe ngực nông của em ấy, hòa quyện cùng bọt xà phòng và nước bọt."
1650 = "Cứ tiếp tục bị mút thế này thì――\\nNgay khi tôi vừa nghĩ vậy, lực hút từ đôi môi em ấy liền nới lỏng ra."
1663 = "Đưa dương vật đang cương cứng trở lại cửa mình đang run rẩy,\\nvà cọ xát mơn trớn."
1664 = "Bắt đối phương nói ra, bị bắt phải nói ra――\\nNhững lời nói ấy có thể làm tăng sự hưng phấn lên đến nhường nào."
1670 = "Không chỉ là những chuyển động tới lui đơn điệu như lúc nãy,\\nmà em ấy còn tinh tế thay đổi lực kẹp và góc độ cọ xát."
1671 = "Không phải là bắn ra mãnh liệt, mà là một lần xuất tinh chậm rãi, như thể rỉ ra từng chút một."
1675 = "Bắt tôi phải nói ra sao――Tuy có chút bối rối,\\nnhưng nếu đó là điều Hibiki muốn, tất nhiên tôi sẽ chiều theo ý em ấy."
1682 = "Hình ảnh âm đạo ngậm chặt lấy tôi phản chiếu trong gương,\\nđang rỏ dãi ròng ròng trong niềm vui sướng hệt như một kẻ săn mồi."
1686 = "Nhờ sự giúp đỡ to lớn từ mọi người xung quanh, Hibiki đã tạo được nhịp độ cho riêng mình,\\nvà xử lý mọi việc rất tốt, nhưng mà……"
1694 = "（……Nhưng mà）"
1742 = "（Nhưng……mà――Thế này――cũng có cái hay của nó）"
1743 = "（Ngoáy——Thúc——Phập! Phập!!）"
1746 = "（Bịch!）"
1747 = "（Nhớt nháp）"
1750 = "（Liếm láp）"
1751 = "（A……nhịp đập）"
1752 = "（A……Quả nhiên, bên trong âm đạo vẫn là tuyệt nhất――）"
1754 = "（Phập! Phập! Phập! Phập!）"
1755 = "（Rào!）"
1756 = "（Chảy xuống——）"
1757 = "（Phập!!!）"
1758 = "（Phụt——Tí tách——Phụt!!）"
1759 = "（Bạch! Phập! Phập! Bạch!!）"
1760 = "（Bạch! Bạch! Phập! Phập!）"
1762 = "（Phụt! Phụt! Phụt! Phụt!!）"
1765 = "（Phụt!!!）"
1766 = "（Run rẩy）"
1768 = "（Trơn tuột——Trượt dài——Trơn láng——）"
1770 = "（Phụt! Phụt! Phụt——Phụt——）"
1773 = "（Kẹp chặt）"
1774 = "（Kẹp chặt）"
1775 = "（Chạm vào）"
1778 = "（Vạch ra）"
1779 = "（Nhấc bổng!）"
1780 = "（Ôm lấy）"
1781 = "（Bóp nhẹ）"
1782 = "（Thúc mạnh!!!）"
1783 = "（Phập!!）"
1784 = "（Đâm mạnh!）"
1785 = "（Đâm vào）"
1787 = "（Trơn láng——Trượt——Mềm mại——Khít khao）"
1788 = "（Trượt dài!）"
1789 = "（Thịch——Thịch——）"
1790 = "（Siết——Siết chặt）"
