1953 = "「Đến lúc đó chắc chắn sẽ có chuyến tàu kỷ niệm chạy. Mikuro và 38696, nếu được, cũng sẽ chạy đoạn đường bao gồm cả Toyokawa.」"
1955 = "「Khoái cảm nhục dục tăng lên thì nước sẽ trở nên dính dính ạ?」"
1960 = "「Sao vậy, bị chóng mặt à?」"
1961 = "「Sao thế, Hibi──っ!!!」"
1962 = "「Không bẩn chút nào đâu ạ. Mikuro── đang rất vui── và rất sướng──」"
1963 = "「Không bẩn chút nào đâu ạ!」"
1966 = "「Chú ấy không chỉ đổi khung gầm với 8620 của chị Hachiroku. Mà còn đổi rất nhiều linh kiện cho chiếc 38696 của Mikuro nữa.」"
1967 = "「Muốn nhìn── ạ── ưm hưu── fua── a, Muốn nhìn, nhưng mà── Mikuro── sao thế này, Mikuro」"
1970 = "「Anh── cũng, vậy── đúng hơn là── chuyện này── Ba người. Cùng làm── làm tình── thì──」"
1971 = "「Chị cũng giống vậy đấy. Được anh hai ấy nhé? Cọ xát sâu bên trong bụng, vì hạnh phúc và khoái cảm mà đầu óc như lóe sáng lên vậy.」"
1975 = "「Hãy cùng làm tình nào. Cả ba người.」"
1978 = "「Để xem nào. ……Ừm. Ví dụ như thế này.」"
1980 = "「Em sẽ cố gắng hết sức! Vì vậy, lúc đó Mikuro, cũng muốn nhờ chị Hibiki và anh Soutetsu lái tàu!」"
1981 = "「Lúc đó chị đã làm gì nhỉ? Với dương vật cương cứng của anh hai, chị đã làm thế này──」"
1982 = "「Anh hiểu. Anh cũng vậy.」"
1984 = "「Anh hiểu rồi. Không cần cố nói chuyện đâu.」"
1986 = "「Từ từ, từ từ. Vào nhé.」"
1987 = "「Em muốn chạy! Chạy rồi chắc chắn sẽ báo với chị Koharu── Không, lúc đó, em muốn chạy cùng với chị Koharu.」"
1988 = "「Găng tay…… tinh dịch sẽ làm bẩn găng tay của Mikuro mất.」"
1992 = "「Làm gì có chuyện đó chứ. Cả anh hai và chị bình thường vẫn luôn luôn dựa dẫm vào bé Mikuro mà.」"
1994 = "「Vì anh Soutetsu đã giới thiệu chú Fuchi cho em. Vì anh đã kết nối đường ray đến tận chiếc 58623 của Koharu-chan.」"
1997 = "「Thư giãn đi nàooo── hít vàooo── thở raaa──」"
1999 = "「Ch-Chị Hibiki.」"
2010 = "「Hibi……ki.」"
2012 = "「Hibiki. Tiến vào nhé.」"
2016 = "「Đúng vậy nhỉ──vâng. Em làm được rồi nhỉ. Mikuro, cùng với 38696──thực sự đã một lần nữa, chở hành khách.」"
2019 = "「Đúng vậy. Háo hức, phấn khích, cười rạng rỡ.」"
2020 = "「Đúng vậy nhỉ, Mikuro. Tinh dịch của anh hai. Lãng phí thì uổng lắm đấy.」"
2023 = "「Đúng vậy. Thế này thì chắc chắn hành khách cũng sẽ rất hài lòng.」"
2024 = "「Vậy à. Thế thì, chúng ta làm thế này nhé.」"
2025 = "「Vậy sao?」"
2027 = "「Niêm phong? ……ạ?」"
2028 = "「Chức năng để kết nối sâu sắc hơn. Bé Mikuro, với Master mà em yêu quý.」"
2029 = "「Vâng ạ…… Nếu Mikuro làm vướng chân chị Hibiki, thì cũng sẽ gây phiền phức cho cả anh Soutetsu nữa ạ.」"
2032 = "「Tất nhiên rồi ạ. Em cũng rất thích anh Soutetsu…… nhưng, ưm…… Mikuro…… ừm, cũng rất thích chị Hibiki.」"
2034 = "「Vâng ạ. Dạ, Mikuro đã lỡ nhìn thấy── cái đó, lúc Mikuro để quên đồ, chị Hibiki và anh Soutetsu đã…… dạ」"
2036 = "「Đúng rồi ạ! Nếu mọi người dành thời gian chăm sóc cho Mikuro thì thời gian chị Hibiki ở bên anh Soutetsu sẽ bị giảm đi」"
2038 = "「Đúng rồi ạ! Là cái đó! Mikuro cũng, lóe sáng lên! Ở một nơi── sâu hơn, cả mạch điện, lóe sáng lên」"
2040 = "「Vâng ạ. Là chị Hibiki ạ. Vì thế Mikuro đã luôn nghĩ rằng, nhờ chị Hibiki trở thành Master của Mikuro thì Mikuro sẽ rất vui ạ.」"
2042 = "「Thế này sao?」"
2043 = "「Vâng!」"
2045 = "「Vâng ạ! Thích! Thích lắm ạ! Mikuro, làm tình. Với chị Hibiki, và anh Soutetsu── làm tình, thích, lắm ạ.」"
2047 = "「Vâng ạ! Vâng ạ! Mikuro, vui lắm── ưm. Sướng quá── ấm áp quá── hạnh phúc quá, ạ」"
2048 = "「Dẫn đến cả phong trào 'Đưa 38696 trở lại đường chính một lần nữa'. Động lực lớn nhất thúc đẩy điều đó, quả nhiên là Mikuro.」"
2053 = "「Không sao đâu. Không sao đâu. Bởi vì Mikuro là Mikuro của chị và anh hai mà.」"
2054 = "「Không sao đâu.」"
2055 = "「Không sao đâu. Không sao đâu. Anh hai, dịu dàng và giỏi lắm. Ngay cả lần đầu tiên của chị, anh ấy cũng làm chị lên đỉnh tuyệt vời lắm.」"
2056 = "「Không sao đâu. Mikuro. Anh sẽ nhờ ông chủ nhà tắm Tororyu-yu xem cho em ngay. Hibiki. Gọi điện thoại đi.」"
2057 = "「Đúng rồi ạ. Mà khoan đã── nước. Lúc nãy trông còn trong suốt và loãng mà──」"
2058 = "「Không sao đâu. Không sao đâu mà. Nào, bình tĩnh lại đi. Hít vàooo, thở raaa, hít vàooo, thở raaa.」"
2067 = "「Hãm phanh. Tốt. Cứ thế này, cứ thế này── Còn 10 mét…… 5 mét……」"
2069 = "「Nhóp nhép──liếm──liếm──liếmmm── Chụt──chụttttttt! Chụt, chụt」"
2073 = "「Cảm ơn gì chứ, vẫn còn sớm lắm.」"
2074 = "「Bây giờ ạ! Hơn rấttt nhiều! Hơn lúc nãy nhiều ạ! Mikuro, sướng quá── sắp phát điên lên mất」"
2078 = "「Đương nhiên rồi. Anh cũng rất vui. Anh thấy đó là một điều vô cùng vinh hạnh và hạnh phúc.」"
2080 = "「Màu trắng…… dính dính── có vẻ nặng nề── Ưm── từ, chị Hibiki── đang trào, ra」"
2082 = "「Em nhìn thấy chứ, Mikuro.」"
2090 = "「Cố chịu đựng một chút thôi nhé. Giao cho ông chủ nhà tắm Tororyu-yu, chắc chắn sẽ chữa khỏi ngay thôi.」"
2092 = "「Nụ cười…… bao nhiêu là hành khách. Mikuro và 38696──thực sự đã lại một lần nữa, mang đến nụ cười──!」"
2096 = "「Nếu muốn cảm ơn, thì đợi đến khi tất cả ước nguyện của bé Mikuro thành hiện thực đã. Cho đến lúc đó, chúng ta phải cùng nhau cố gắng nhiều hơn nữa.」"
2098 = "「Nữa đi, hãy làm thế nữa đi ạ! Giống hệt như vậy, giống hệt như lúc nãy── cho Mikuro, nhiều hơn nữa──」"
2100 = "「Mi……kuro──っ」"
2101 = "「Mikuro cũng── sẽ sớm. Cùng nhau, thôi── nhé ──Anh hai, chị, và──っ──ba người, cùng nhau──」"
2103 = "「Mikuro── này── nhìn đi, chị── chị và── Anh hai── lên đỉnh── nhìn đi!!」"
2104 = "「Miku, ro──っ──hự──a──」"
2107 = "「Miku, ro── nhìn đi── a── fua── Cái này── làm tình── của chị, và, anh hai」"
2108 = "「Mikuro…… Mikuro cũng, ướt rồi sao?」"
2110 = "「Mikuro…… ──Mikuro…… bụng, đau」"
2111 = "「Mikuro…… Mikuro cũng. Chuẩn bị, làm tình.」"
2113 = "「Mikuro cũng muốn, cương cứng. Cương cứng của anh Soutetsu. Cùng với chị Hibiki, Mikuro muốn thử chạm vào và ghi nhớ nó ạ.」"
2115 = "「Mikuro cũng── muốn được như vậy ạ. Giống như lúc nãy, làm tình. Giống như cuộc làm tình mà Mikuro đã được xem──」"
2116 = "「Mikuro cũng muốn được nếm thử ạ! Ưm!!!」"
2121 = "「Mikuro cũng giống chị thôi mà. Được đâm vào tận sâu nhất, được anh hai── biến thành một người phụ nữ.」"
2123 = "「Bé Mikuro muốn cùng chị và anh hai. Làm gì nào?」"
2125 = "「Mikuro cũng, giống như Hibiki── hự── Thích, kiểu kích thích── này, nhỉ──っ!!!」"
2127 = "「Mikuro, từ lúc hôn chị Hibiki đã ướt sũng rồi. Mikuro cứ nghĩ, lạ thật đấy.」"
2129 = "「Giấc mơ, ước nguyện của chú Fuchi và Koharu-chan. Bé Mikuro và 38696! Đã thực hiện trọn vẹn rồi nhỉ!」"
2131 = "「Mikuro, thích, chuyện này. Làm tình. Rất thích. Ngón tay, của chị Hibiki, ngón tay cũng── dương vật cương cứng, của anh Soutetsu, cũng」"
2133 = "「Mikuro, muốn cả ba người mãi mãi bên nhau── Muốn ở bên nhau…… rất muốn ạ.」"
2135 = "「Mikuro, rất vui vì có chức năng mới! Vậy, niêm phong là chức năng gì thế ạ?」"
2136 = "「Mikuro muốn hiểu ạ. Làm tình. Mikuro muốn làm tình. Cùng với anh Soutetsu, và chị Hibiki──」"
2139 = "「Mikuro muốn làm tình với Master của mình ạ.」"
2141 = "「Mikuro, muốn làm giống hệt chị Hibiki ạ. Vì thế, Mikuro── dạ, cái đó, nụ hôn đầu, hãy」"
2143 = "「Vì đây là chiếc găng tay đầu tiên Mikuro được cùng chị Hibiki chạm vào dương vật cương cứng của anh Soutetsu mà.」"
2144 = "「Mikuro là \\x%lレイルロオド;#00ffc040;Railord%l;#; của chị mà. Chỉ với chị và anh hai thôi. Ngoài ra không được làm chuyện này với ai khác đâu nhé.」"
2146 = "「Mikuro sẽ giữ gìn cẩn thận ạ. Mikuro sẽ coi nó là báu vật.」"
2148 = "「Mikuro đang, nhìn ạ── Mikuro──っ──a── chị Hibiki, ──anh Soutetsu, cũng── rất, đẹp── ạ, ưm!」"
2150 = "「Mikuro, đã lỡ nhìn thấy. Lúc quay lại lấy đồ bỏ quên…… Cái đó…… chị Hibiki đã làm với anh Soutetsu…… dạ…………」"
2152 = "「Nếu bé Mikuro chịu làm \\x%lレイルロオド;#00ffc040;Railord%l;#; của chị, chị sẽ vui lắm. Và, em biết không? Nếu chị vui thì chắc chắn anh hai cũng sẽ」"
2153 = "「Chắc chắn sẽ chạy được. Nếu là bé Mikuro!」"
2154 = "「Mikuro cũng vậy nhé? Vừa tiếp tục, vừa nhìn nhé. Cái này…… Là làm tình của cả ba người, anh hai, chị và Mikuro mà.」"
2157 = "「Bé Mikuro cũng tuyệt lắm! Đẹp đẽ, cẩn thận và mượt mà! Thực sự là một chuyến đi tuyệt vời!」"
2159 = "「Mikuro. Nhìn này. Cái lỗ đang mở ra mà lúc nãy Mikuro nói…… vào trong âm đạo của Hibiki──」"
2160 = "「Mikuro. Nếu em muốn nhìn rõ thì hãy nhìn vùng hông nhé. Bởi vì dương vật cương cứng của anh chuẩn bị tiến vào bên trong âm đạo của Hibiki.」"
2162 = "「Mikuro làm giỏi lắm. Trông anh hai có vẻ sướng lắm kìa.」"
2165 = "「Bên trong âm đạo của Mikuro, có lẽ sẽ không thể chứa hết được đâu,」"
2166 = "「Mikuro── nhìn đi! Nhìn đi! Chị, chị── đang làm tình, với anh hai── đang được anh hai── yêu thương, thật sâu đậm」"
2168 = "「Mikuro thấy chỗ nào đặc biệt đẹp nhất?」"
2171 = "「Bé Mikuro. Vẫn còn chuyện gì khác nữa sao?」"
2173 = "「Miku, ro── anh cử động, đây」"
2175 = "「Mikuro── Mikuro cũng── muốn được làm, ạ. Bằng dương vật cương cứng của anh Soutetsu── làm tình!」"
2176 = "「Bé Mikuro!?」"
2178 = "「Hoạt động bảo dưỡng trải nghiệm đó lại dẫn đến phong trào muốn trân trọng những cỗ máy được bảo tồn ở địa phương.」"
2180 = "「Nhưng nếu là Hibiki, người vợ của anh thì──っ!」"
2181 = "「Tiếng rên. Anh Soutetsu đang rất sướng phải không ạ. Găng tay của Mikuro…… ngày càng ướt đẫm và nặng hơn rồi.」"
2183 = "「Cương cứng…… cương cứng. ……Cơ quan, để kết nối sâu sắc. Cương cứng…… Mikuro, không sao ạ. Cương cứng, Mikuro nhớ rồi ạ.」"
2185 = "「Cương cứng. Cơ quan của con trai, để con trai và con gái kết nối sâu, thậttttt sâu với nhau.」"
2187 = "「Bụng đau quá…… quặn thắt lại── Mikuro, lần đầu tiên bị thế này.」"
2189 = "「Bụng làm sao…… bị đau à?」"
2190 = "「Không cần── em nói── anh cũng sẽ làm thế!」"
2194 = "「──. Van hãm tự động. Vị trí chạy tàu.」"
2195 = "「Van hãm tự động, phanh thường.」"
2198 = "「Sướng! Lắm ạ── rất── hự── fua! Miku, ro── cái này── thích lắmmm」"
2200 = "「Hà── phu── hà── phu」"
2201 = "「Hà── ưm, phu── ha hyu── kufu」"
2202 = "「Hà── hà── hà── hà──」"
2203 = "「Vẫn còn hơi tối…… a. Đúng rồi.」"
2205 = "「Nếu chỉ có mình Mikuro thì đã chẳng có chuyện gì xảy ra. Vì có chị Hibiki…… và anh Soutetsu ở bên.」"
2213 = "「Cảm ơn hai người!!」"
2218 = "「Cùng với anh hai. Cùng với chị. Cùng làm tình, thì sẽ sướng hơn nhiều đấy? Không chỉ tự di chuyển theo ý mình đâu.」"
2220 = "「So với bây giờ, khi được Hibiki và anh chạm vào. Thế nào, bên nào sướng hơn.」"
2222 = "「Vất vả cho hai người rồi, anh Soutetsu, chị Hibiki. Một chuyến đi an toàn, không chút sai sót, thực sự rất tuyệt vời.」"
2238 = "「Bây giờ Mikuro chỉ cần nhìn thôi là được rồi. Chị nghĩ nụ hôn đầu mà lại dành cho dương vật thì không hay đâu.」"
2239 = "「Chỉ có sâu bên trong vùng kín đã được khai phá── phần cơ thể của con gái, mới có thể thực sự học được về xuất tinh thôi.」"
2240 = "「Đó là, tinh dịch. Tinh trùng của anh hai. Là bằng chứng cho thấy Mikuro đã làm cho anh hai sướng nhấttt đấy.」"
2241 = "「Điều đó chắc chắn. Sẽ là một bài học tốt về làm tình cho cả Mikuro nữa.」"
2242 = "「Đây là…… thứ được gọi là squirting trong truyền thuyết sao.」"
2243 = "「Đây là bộ phận sinh dục nữ── mượn lời của Hibiki thì, đây là phần cơ thể con gái của Hibiki.」"
2244 = "「Thế này thì có lẽ…… dù anh có cử động theo ý muốn thì cũng」"
2245 = "「Nếu vậy thì, Mikuro…… Mikuro cũng.」"
2246 = "「Thế thì. 『A nào』.」"
2247 = "「Chỗ này, sao?」"
2248 = "「Nhờ có chị Hibiki và anh Soutetsu cả đấy ạ! Buổi dọn dẹp cùng nhau đã dẫn đến hoạt động bảo dưỡng trải nghiệm.」"
2250 = "「っ──. Nhanh quá, cái đó, trông có vẻ mạnh bạo nhưng…… Anh Soutetsu, có bị đau, hay gì không ạ?」"
2251 = "「Sớm muộn gì cũng sẽ nối đường ray đến Toyokawa──và cả những nơi xa hơn nữa. Một lần nữa, lấy lại thời đại mà có thể đi bất cứ đâu trên toàn quốc bằng đường sắt.」"
2252 = "「Vẫn chưa đâu. Em hoàn toàn chưa nhớ được đâu? Chỉ biết tên thôi thì em chẳng hiểu được chút xíu nào về cương cứng cả.」"
2253 = "「Phải nhìn gần hơơơn nữa thì mới hiểu được chứ?」"
2254 = "「Không đúng.」"
2258 = "「Vậy thì, lên đây── lên giường đi.」"
2260 = "「Vì thế…… Mikuro── Mikuro cũng muốn, làm tình── với chị Hibiki, và anh Soutetsu」"
2261 = "「Ưm, nhưng mà──để xem…… Chị Hibiki──là vợ của anh Soutetsu mà.」"
2262 = "「Vậy thì, xin hãy để Mikuro làm \\x%lレイルロオド;#00ffc040;Railord%l;#; của chị Hibiki đi ạ! Rồi sau đó, cả ba người chị Hibiki, anh Soutetsu và Mikuro」"
2265 = "「Vậy thì. Cùng làm nhé? Lần này cả ba người chúng ta sẽ ôm chặt lấy nhau hơn nữa.」"
2266 = "「Vậy thì chị cũng phải, làm mẫu hơơơn nữa cho em xem mới được.」"
2269 = "「Không cần em nói── anh cũng sẽ làm thế.」"
2270 = "「Tất nhiên rồi ạ, chị Hibiki. Mikuro…… Mikuro……. Mikuro, với chị Hibiki──. Mikuro! Của chị Hibiki」"
2271 = "「Vậy thì Mikuro muốn anh Soutetsu xuất tinh ạ. Mikuro cũng muốn được tận mắt chứng kiến và học hỏi về xuất tinh ạ.」"
2273 = "「Chuyện đó. Đơn giản lắm. Giải quyết được ngay.」"
2274 = "「Là nhờ chị Hibiki cả đấy ạ. Vì chị Hibiki đã làm mẫu cho Mikuro xem, nên Mikuro chỉ cố gắng bắt chước theo thôi ạ.」"
2282 = "「Anh hai. Thật dịu dàng nhé. Chậm rãi, thật chậm rãi, thật nâng niu, thật trân trọng.」"
2284 = "「Anh hai, có ông chủ nhà tắm Tororyu-yu ở đây!」"
2286 = "「Anh hai. Bé Mikuro, đang run kìa.」"
2287 = "「Âm vật…… Mikuro. Nhớ rồi ạ. Khoái cảm nhục dục, là cảm thấy sướng phải không ạ?」"
2288 = "「Âm đạo…… âm đạo── sâu bên trong vùng kín, của…… ưm── a── Chỗ này── cái này── đang mở ra── chỗ này là── âm đạo.」"
2289 = "「Em muốn Hibiki trở thành Master, nhưng vì anh là chồng của Hibiki nên…… em đã bận tâm về điều đó sao?」"
2290 = "「Mỗi khi anh Soutetsu di chuyển ngón tay mềm mại, cọ cọ, xoa xoa, thì từ cái lỗ đang mở ra đó, nước lại chảy ra」"
2291 = "「!」"
2292 = "「っ!!」"
2293 = "「っ!!!」"
2294 = "「っ!!!!」"
2295 = "「っ!!!!!」"
2306 = "「////!?」"
2308 = "（Ngoạm!）"
2309 = "（Ngoạm!）"
2311 = "「（Amu）──Ưm──ưm~~. Thế nào? Mikuro. Dù không phải là thứ ngon lành gì.」"
2313 = "「（Chụt──chụt!） Ưm fufu. Vậy sao. Làm tình sướng hơơơn hẳn tự làm một mình nhỉ.」"
2315 = "（Chụtttttttttttttttttttttttttttttttttttttttttttttt!）"
2316 = "「///」"
2317 = "（Chụtttttttttttttttttttttttttttttttttttttttttttttt!）"
2318 = "「Hai. Một. ──.」"
2319 = "「Railord của 58623. Giấc mơ cuối cùng của chị Koharu. 'Muốn chạy một lần nữa thôi cũng được', điều đó đã được chú Fuchi……」"
2321 = "「っ!?」"
2322 = "「っ!? Ưm……phu──phu──a──」"
2323 = "「っ!? Anh hai.」"
2324 = "「!!?」"
2325 = "「っ!!!?」"
2327 = "「Quả nhiên đèn LED sáng thật đấy ạ. Nhìn rõ hơơơn hẳn so với đèn pha ngày xưa của Mikuro.」"
2328 = "「~~~~~~~っ」"
2330 = "「~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~!」"
2462 = "Tôi đang tăng tốc. Đang nóng rực lên. Toàn bộ vùng hông, toàn bộ dương vật cương cứng, vừa tạo ra tiếng va chạm của da thịt, tôi vừa đập cả hai hòn dái vào người Mikuro."
2468 = "Thật nhẹ nhàng, xuyên qua làn da của Mikuro, hơi ấm mềm mại truyền đến tận người tôi."
2470 = "Bị mút! Thật mạnh! Đột nhiên bị mút mãnh liệt từ cả hai bên! Quá đỗi bất ngờ trước khoái cảm không lường trước được, tôi vội vã kìm lại dòng tinh trùng chực trào ra."
2471 = "Có lẽ do bản thân âm đạo quá nông, hay đúng như tôi tưởng tượng, quả nhiên là vì không có tử cung, nên tinh trùng lập tức bắt đầu trào ra."
2477 = "Ngay sau khi Nine Stars bắt đầu chạy, khung gầm của 8620 đã bị phát hiện hư hỏng. Chú Fuchi chính là người tôi có duyên gặp gỡ lúc đó."
2486 = "Có lẽ cảm nhận được điềm báo xuất tinh, bên trong âm đạo của Hibiki càng thêm rộn rạo. Những điểm gợn hằn lên rõ rệt, cắn chặt lấy toàn bộ dương vật cương cứng."
2488 = "Thế nhưng hôm nay, là 'lần đầu tiên'. Do đó, tôi phải thận trọng hơn bao giờ hết, đánh giá kỹ mức độ giảm tốc."
2490 = "Có lẽ hương vị này chính là. Của cuộc làm tình ba người. ──Thứ nằm ẩn sâu bên dưới sự ngọt ngào, tôi nghĩ vậy."
2492 = "Thay cho cái gật đầu, tôi càng ấn mạnh phần quy đầu đang chạm vào tận sâu nhất!!!"
2493 = "Nghĩ đến tính cách của Mikuro, tôi nhanh chóng xâu chuỗi lại được mọi chuyện. Vì Mikuro quá khiêm tốn và tự đánh giá bản thân quá thấp."
2497 = "Dừng tàu. Hoàn toàn không có chấn động."
2507 = "Không chịu thua kém chuyển động đó, hai chiếc lưỡi nóng bỏng bám dính lấy. Điều đó càng làm tôi thêm bức bối, vùng hông càng tăng tốc."
2518 = "Tinh dịch do chính mình vừa mới xuất ra, dù là thông qua những nụ hôn, tôi cũng chẳng muốn nếm thử chút nào."
2524 = "Được ánh mắt của Hibiki mời gọi, được ánh mắt của Mikuro dõi theo, tôi từ từ đưa dương vật cương cứng lại gần."
2532 = "Tiếng nước nhóp nhép vang lên không ngớt. Có lẽ ngón tay của Hibiki vẫn đang tiếp tục mát-xa cho Mikuro──"
2536 = "Chiếc gương toàn thân của Hibiki mà chúng tôi vẫn thường xuyên sử dụng trong lúc mây mưa. Lần đầu tiên, nó phản chiếu bộ phận sinh dục của một người phụ nữ khác ngoài Hibiki."
2538 = "Nhờ sự dẫn dắt từ những ngón tay của Hibiki và nhịp điệu của vợ chồng tôi, tôi có thể tận hưởng trọn vẹn âm đạo vừa mới được khai phá của Mikuro."
2539 = "Đứng trước chiếc 58623 đã mất đi hình dáng ban đầu, chú Fuchi đã nói cho tôi nghe. 'Thể hiện linh hồn của Koharu', đó mới là điều cần ưu tiên nhất."
2542 = "Có vẻ như em ấy không thốt nên lời. Chính vì thế, tiếng ồn ào bên ngoài cửa sổ xe nghe càng rõ rệt."
2544 = "Vì thế, tôi xuất tinh. Vào tận sâu nhất trong âm đạo của Mikuro. Nơi có lẽ không tồn tại tử cung──"
2546 = "Tôi đang xuất tinh một lượng lớn. Dòng tinh dịch nóng hổi, độ nhớt cực cao, đặc sệt như thạch, cứ thế cuồn cuộn tuôn trào không dứt."
2552 = "Đúng hơn là, tôi không thể cử động theo cách nào khác được. Mikuro rất nông, nếu cử động mạnh thì có vẻ sẽ tuột ra mất. Hơn nữa──"
2557 = "Nụ cười thiên thần như đánh úp bất ngờ trong lúc đang cắm sâu và xuất tinh, khiến dương vật cương cứng của tôi càng thêm sung sướng, xuất tinh càng mạnh bạo hơn. Nhưng──"
2559 = "Có vẻ hoàn toàn trái ngược với ấn tượng về cụm từ nụ hôn đầu. Nụ hôn này quá đỗi nồng nhiệt…… A."
2560 = "Với Koharu-san đã bị tháo dỡ từ lâu, đó là cách duy nhất để bày tỏ và truyền đạt lòng biết ơn."
2562 = "Bàn tay của Mikuro và Hibiki chuyển động đầy âu yếm. Sự đồng điệu nhịp nhàng đến hoàn hảo hòa lẫn sự xúc động vào khoái cảm."
2592 = "Đáng yêu quá, tôi muốn đâm vào nên dồn lực── Nhưng tôi đã dừng lại ngay sát nút. Dù đã có sự đồng thuận ngầm"
2593 = "Làm theo lời Hibiki, tôi nhanh chóng cởi bỏ quần áo. Trần truồng hoàn toàn, tôi một lần nữa phơi bày vùng kín trước mặt Mikuro."
2595 = "Hàng trăm──đơn vị đó không còn đủ để đếm số lần lặp lại nữa. Tiến vào sân ga suối nước nóng Ohimitera trên đầu máy 8620."
2598 = "Nhìn về phía sân ga từ cửa sổ bên hông buồng lái."
2600 = "Tôi ôm lấy hai chân Mikuro, tạo thành tư thế như đang xi tè cho em bé. Đó là thành quả hợp tác của tôi và Hibiki."
2602 = "Chuyện tôi và Hibiki là vợ chồng, thì có liên quan gì đến cuộc trò chuyện này chứ."
2606 = "Để chứng minh, tôi rút ngón tay ra và xòe thành hình chữ V. Nhìn những sợi tơ dính nhớp nháp, Hibiki nuốt ực một cái──"
2607 = "Tôi áp dương vật cương cứng vào khe mông nhỏ bé của Mikuro và cọ xát. Vì phần bộ phận sinh dục đã có Hibiki nhiệt tình âu yếm rồi."
2608 = "Chỉ mới cắm hờ phần đỉnh quy đầu vào, không biết em ấy đã cảm nhận được điều gì chưa."
2610 = "Tôi định nói nếu không được thì dừng lại, nhưng suýt nữa thì nuốt lời vào trong. Quá hẹp, quá chật, thành thật mà nói thì dương vật cương cứng có hơi đau, nhưng──"
2611 = "Mặc kệ điều đó, tôi hôn thật sâu. Quấn lấy lưỡi của cả hai, tôi đón nhận hương vị tinh trùng của chính mình, một hương vị không thể gọi tên, vào trong miệng."
2614 = "Tôi từ từ, từ từ rút ra cho đến khi chỉ còn lại phần đỉnh quy đầu, phơi bày cảnh tượng đó trước mắt Mikuro."
2616 = "Tôi bế thốc cơ thể Hibiki lên và đặt xuống giường. Ngay lập tức, tôi cũng đè lên người cô ấy──"
2618 = "Tôi bế bổng cô bé Mikuro nhỏ nhắn lên và đứng dậy."
2620 = "Nới lỏng ra, một chút. Còn chật hơn cả Hibiki hôm nay. Cửa âm đạo hoàn toàn mới của Mikuro, đơn thuần chỉ là nhỏ bé và chật hẹp."
2622 = "Tôi đã từng nghĩ mình chỉ nên nhìn, cảm nhận và làm tình với mỗi Hibiki. Nhưng nếu đó là mong muốn của Hibiki, của Mikuro."
2624 = "Tôi đưa ra lý do hợp lý cho Hibiki. Nhờ đó, cô ấy thôi giả vờ phản đối."
2627 = "Tôi vạch rộng ra đến mức đầu ngón tay cảm nhận được sự căng cứng. Hibiki đỏ bừng mặt, nhưng không nói lời nào."
2629 = "Tôi cử động tạo ra tiếng nhóp nhép. Nhưng cực kỳ chậm rãi. Vừa cử động, tôi vừa mở rộng các ngón tay để đón ánh sáng từ đèn của Mikuro."
2630 = "Dù đang bị tôi ôm lấy hai chân, Mikuro vẫn tự mình di chuyển vùng hông."
2632 = "Ngón tay tôi bị siết chặt lại. Sự xấu hổ có lẽ đã kết nối với khoái cảm nhục dục."
2634 = "Dương vật cương cứng đang cọ xát vào mông em ấy bỗng nóng bừng lên. Chiếc cổ vốn dĩ trắng ngần của Mikuro lại càng thêm đỏ ửng."
2636 = "Mikuro, Hibiki và những đôi môi đang tuyệt vọng tạo ra khoảng hẹp để kết nối, đang bị tôi chà đạp một cách ích kỷ và bạo lực. Sự đảo lộn đó càng làm tôi tăng tốc."
2637 = "Bất ngờ bị liếm lỗ hậu, vùng hông tôi tự động giật nảy lên!!!"
2640 = "Tôi cảm nhận được hơi nóng từ lòng bàn tay của Hibiki. Đúng hơn là, với lòng bàn tay có nhiệt độ thấp của Mikuro thì──"
2641 = "Cúc quần của tôi bị mở ra nhanh chóng, và khóa kéo bị kéo tuột xuống."
2643 = "Ngay khoảnh khắc ánh mắt giao nhau, tôi đã gật đầu. Bởi vì tôi cũng hiểu ra rằng đây chính là câu trả lời chính xác."
2644 = "Tôi nhẹ nhàng chạm vào âm vật. Tôi di chuyển ngón tay thật mềm mại, xoay tròn, với lực lướt nhẹ như lông hồng."
2646 = "Tôi đâm vào tận sâu nhất. Tôi liên tục ấn mạnh rồi nhả phần quy đầu chắc hẳn đang rỉ đầy tinh dịch vào cửa tử cung của Hibiki."
2648 = "Có lẽ trong vốn từ vựng của em ấy không có từ nào để diễn tả hành động đó. Ngay khi tôi vừa nghĩ vậy, Hibiki đã vẫy tay gọi tôi lại."
2649 = "Phối hợp với tôi, Hibiki cũng âu yếm thêm gì đó khiến Mikuro lên đỉnh. Vì thế âm đạo chật hẹp của Mikuro bỗng lỏng ra, ướt át và tăng thêm phần ngọt ngào!"
2655 = "Tôi đang tăng tốc. Tôi cảm thấy không ổn rồi. Cứ thế này thì tôi sẽ xuất tinh mất──っ!!?"
2710 = "Hibiki mỉm cười hạnh phúc như mọi khi. Và rồi cô ấy hướng ánh mắt về một phía không giống như mọi khi."
2715 = "Cả Hibiki cũng vậy. Bị Mikuro nhìn, bị những lời khiêu khích ngây ngô kích thích. Dù đã thả lỏng hơn mọi khi rất nhiều, nhưng cô ấy vẫn siết chặt lấy tôi."
2717 = "Hibiki dùng hai tay áp chặt vào hai má đang tràn ngập nụ cười của Mikuro, như đang đùa giỡn."
2718 = "Hibiki đang run lên vì xấu hổ, nhưng cô ấy không ngăn Mikuro lại. Bởi vì Mikuro quá đỗi thật thà, nếu ngăn lại, có lẽ em ấy sẽ sợ hãi."
2721 = "Bên trên khuôn mặt thanh tú của Hibiki, người đang nằm ngửa mệt lả đi vì vừa đạt cực khoái──"
2723 = "Hibiki mỉm cười dừng tay lại, Mikuro cũng lập tức bắt chước theo. Sự đáng yêu biến thành sự bứt rứt, dương vật cương cứng giật nảy lên đầy bất mãn."
2728 = "Hibiki liếm lấy đầu ngón tay vừa vuốt ve vùng kín của Mikuro── không chỉ liếm, cô còn ngậm lấy và mút mát nó."
2729 = "Hibiki quấn những giọt tinh dịch trào ra quanh ngón tay rồi hứng lấy."
2730 = "Hibiki kéo Mikuro vào lòng. Thật nhẹ nhàng, thật dịu dàng. Cô ôm lấy em ấy, gọi tên trống không và thì thầm những lời ngọt ngào bên tai."
2731 = "Hibiki nhắm chuẩn xác và vuốt ngược phần quy đầu. Đã phát ra âm thanh khó coi thế này thì chẳng còn cách nào che giấu được nữa."
2733 = "Hibiki đang giải thích lại cho Mikuro y như những gì ông chủ nhà tắm Tororyu-yu đã chỉ bảo."
2735 = "Phần gốc không thể nhét vừa vào âm đạo nông và hẹp của Mikuro, được Hibiki dùng ngón tay tạo thành vòng tròn, vừa siết chặt vừa nâng đỡ."
2737 = "Hibiki ôm chặt lấy Mikuro. Cô ôm lấy, cọ má vào Mikuro và chậm rãi, từ tốn cất lời."
2739 = "Thật mềm mại, thật gợi tình. Hibiki mỉm cười trong khi những ngón tay vẫn không ngừng chuyển động."
2740 = "Chắc là để cho Mikuro nhìn rõ hơn. Hibiki chỉ dùng vòng tròn tạo bởi ngón cái và ngón trỏ để kích thích tôi."
2742 = "Hibiki nắm lấy tay Mikuro, đan mười ngón tay vào nhau như những người yêu nhau. Rồi cứ thế đan chặt những ngón tay──"
2744 = "Với điệu bộ như chợt nhớ ra điều gì đó, Hibiki khẽ chạm vào môi Mikuro."
2746 = "Bàn tay còn lại không làm nhiệm vụ nâng đỡ và siết chặt, từ bên ngoài lớp da bụng của Mikuro, ngọt ngào xoa xoa kích thích cả tôi và em ấy."
2747 = "Hibiki dùng ngón tay vuốt dọc theo dương vật cương cứng, rồi xòe tay ra làm động tác phác họa."
2752 = "Cửa tử cung của Hibiki co bóp, thở hổn hển và mút chặt lấy tôi. Tinh dịch nặng trĩu, vùng hông nặng trĩu, việc rút ra cũng đã trở nên khó nhọc"
2754 = "Ngón tay của Hibiki đồng thời với Mikuro, cũng đang âu yếm dương vật cương cứng của tôi nằm gọn bên trong âm đạo của em ấy."
2756 = "Ngón tay của Hibiki khẽ gõ nhẹ vào bụng Mikuro── nếu là con người thì đó là vùng tử cung."
2758 = "Ngón tay của Hibiki chạm vào vùng kín vừa mới được khai phá của Mikuro. Cô vuốt dọc lên trên một đường thẳng."
2760 = "Vòng ngón tay của Hibiki siết hẹp lại, chuyển động ngày càng nhanh và mượt mà hơn. Bằng những động tác hiểu rõ điểm yếu của tôi, cô ấy khiến dòng tinh dịch trào ra."
2762 = "Ánh mắt Hibiki nhìn tôi như muốn hỏi ý kiến. Tôi không thể phản ứng lại. Chỉ thầm mong mọi chuyện sẽ diễn ra đúng như ý muốn của Hibiki."
2764 = "Ánh mắt Hibiki nhìn tôi như muốn hỏi── không, là đang xác nhận lại. Nếu em ấy đã hỏi \"Được chứ?\" thì làm sao tôi có thể từ chối được."
2765 = "Tông giọng của Hibiki thay đổi. Chuyển sang giọng nói của một người phụ nữ đã đánh thức bản năng tình dục trong tôi."
2766 = "Giọng nói của Hibiki cũng đang dẫn dắt cả tôi. Nhờ vậy mà tôi mới có thể miễn cưỡng giữ được lý trí, nhưng──"
2767 = "Lưỡi của Hibiki và lưỡi của Mikuro cùng kẹp lấy dương vật của tôi, và cứ thế, như muốn hòa quyện vào nhau lần nữa, chúng vặn vẹo quằn quại đầy ngọt ngào và da diết."
2769 = "Dù đã lặp đi lặp lại hàng trăm lần, nhưng hôm nay lại hoàn toàn khác biệt. Cứ như thể Hibiki đã trở lại làm một cô gái trinh nguyên."
2775 = "Kết quả là, hầu hết các linh kiện gốc của 58623 đã bị tháo dỡ. Mặc dù đó là toa xe bảo tồn đáng kỷ niệm của xưởng Toyokawa."
2776 = "Rồi em ấy khẽ gật đầu."
2788 = "Nhưng dù sao thì chúng tôi cũng đã quá quen thuộc với da thịt của nhau, hiểu rõ từng ngóc ngách của nhau. Chỉ cần nhịp thở hòa quyện, dù không cố ý, chúng tôi vẫn dần dần tiến sâu vào nhau."
2800 = "Một khi đã nhận thức được và chạm vào, có lẽ ngón tay em ấy không thể dừng lại được nữa. Tiếng quần áo cọ xát lẫn với tiếng nước lép nhép vang lên không ngừng."
2804 = "Ngay trước mắt em ấy là bộ phận sinh dục nam và nữ đang ở trạng thái sẵn sàng chiến đấu tột độ. Có lẽ bị choáng ngợp trước sức ép của da thịt, Mikuro chỉ biết gật đầu trong im lặng."
2806 = "Bị nhìn thấy── là nhìn thấy cái gì cơ chứ. Tôi dốc toàn lực lục lọi lại trong ký ức xem có chuyện gì."
2807 = "Tiếng nước róc rách phát ra từ bên dưới lớp váy khuất tầm nhìn, làm tăng nhiệt độ và độ ẩm của căn phòng. Bị kích thích── tôi thuận theo bản năng hôn Hibiki."
2815 = "Tinh dịch phình to cuồn cuộn, lấp đầy dương vật cương cứng đến mức căng tức. Dù lúc nãy tôi đã phóng ra thỏa thích một lượng tinh dịch đặc sệt như thế, nhưng vẫn."
2822 = "Chạm rồi. Tận sâu nhất của Mikuro. Dù không thể chứa hết toàn bộ dương vật cương cứng của tôi nhưng──っ!!?"
2827 = "Tôi đã hiểu ra. Thì ra Mikuro──"
2833 = "Có lẽ là do thói quen. Mikuro định đưa tay lên đèn pha đã bị khuyết ở cổ── nhưng ngay lập tức em ấy đút tay lại vào túi."
2835 = "Chắc hẳn em ấy đã nhận ra điều gì đó. Mikuro bắt đầu luống cuống."
2837 = "Đôi mắt hai màu có phần lơ đãng như đang mơ màng, nhanh chóng nhuốm màu vui sướng."
2839 = "Mikuro đang ngồi xổm, đôi chân cựa quậy có vẻ không yên. Đúng hơn là, ra vậy──"
2840 = "Cổ họng em ấy khẽ nuốt ực một cái."
2842 = "Mikuro có thể nói là biểu tượng của 'trào lưu phục dựng SL'. Điều đó đã thắp lửa cho người dân Omuta. Nếu không có nó──"
2844 = "Ánh mắt mạnh mẽ hướng thẳng về phía tôi khiến tôi giật mình. Đôi mắt hai màu khác biệt…… thật đẹp làm sao."
2846 = "Mikuro đặt nụ hôn lên môi Hibiki. Hibiki nhìn tôi với ánh mắt đầy bối rối──"
2848 = "Mikuro và Hibiki ngồi xổm xuống. Hai nhan sắc tuyệt trần sánh ngang với dương vật cương cứng xấu xí của tôi."
2849 = "Giọng nói của Mikuro, và cả khuôn mặt em ấy bừng sáng lên."
2851 = "Miệng nói \"cái này\", nhưng chắc hẳn ngón tay Mikuro bên dưới lớp váy đang tự mình kiểm tra cửa âm đạo của chính em ấy."
2854 = "Mỗi khi Mikuro nảy lên vì sung sướng, tinh dịch lại bị vắt kiệt không thương tiếc. Dù bên trong âm đạo chật chội và chưa trưởng thành đến thế này──"
2855 = "Cổ họng Mikuro chuyển động mạnh──"
2856 = "Có lẽ bản thân Mikuro cũng đã đạt cực khoái nhờ tự sướng. Đầu ngón tay ướt sũng của em ấy hướng về phía nơi giao hợp của tôi và Hibiki──"
2858 = "Những lời khiêu khích ngây ngô tự nhiên. Cùng với sự xấu hổ, khoái cảm nhục dục phình to cuồn cuộn."
2859 = "Lòng bác ái độc nhất vô nhị của Mikuro là thứ tình yêu không cướp đoạt, không phá hủy điều gì. Kết tinh của nó quả thực méo mó. Nhưng chính vì méo mó nên nó mới đẹp đẽ."
2861 = "Mikuro đột nhiên đổ gục xuống như bị sập cầu dao, trong tình huống nguy hiểm đó, tôi đã ôm đỡ lấy cả Hibiki lẫn em ấy."
2863 = "Mikuro cựa quậy hông, luồn ngón tay vào vùng kín dưới lớp váy──"
2865 = "Có lẽ em ấy đã vô thức đung đưa hông. Mikuro đột ngột dừng chuyển động, phát ra giọng điệu có vẻ xấu hổ."
2868 = "Mikuro ôm chầm lấy. Ôm chặt lấy Hibiki như làm nũng. Nở một nụ cười rạng rỡ hết cỡ, thật mạnh, thật chặt."
2869 = "Mikuro vẫn ôm chặt và gật đầu. Nhưng chợt ngẩng mặt lên, em ấy khẽ lắc đầu."
2871 = "Mikuro nhìn tôi, rồi nhìn chằm chằm vào Hibiki."
2873 = "Mikuro đang nhìn chằm chằm. Em ấy đang chấp nhận. ──Đang khẳng định. Và cuộc làm tình của chúng tôi đang dần dần nhuốm màu Mikuro."
2875 = "Em ấy khẽ gật đầu yếu ớt."
2877 = "Như thể đó là điều hiển nhiên, Mikuro bắt đầu nới lỏng đồng phục. Em ấy luồn tay dưới váy, cởi chiếc quần lót ướt nhẹp ném sang một bên."
2879 = "Dù phủ nhận bằng giọng nói yếu ớt, nhưng ánh mắt Mikuro lại dán chặt vào dương vật cương cứng của tôi và màn sục cặc của Hibiki."
2880 = "Miệng Mikuro há ra thở hổn hển, nhưng tôi không thể dừng lại được nữa. Những ngón tay tạo thành vòng tròn và vuốt ve của Hibiki cũng đang kích động tôi tăng tốc."
2881 = "Quá đỗi ngoan ngoãn, nhưng lại lệch lạc một cách trầm trọng. Thật đáng yêu và đậm chất Mikuro. Suy nghĩ đó càng làm tăng thêm cảm giác kích thích."
2884 = "Lòng bàn tay Mikuro dồn lực, ngay lập tức Hibiki cũng hưởng ứng. Bị kẹp giữa hai lòng bàn tay, khoái cảm không ngừng dâng trào."
2886 = "Có vẻ như Mikuro cũng sắp lên đỉnh vì tự sướng── Nghĩ vậy, vùng hông tôi lại tự động tăng tốc!"
2889 = "Rộn rạo. Ngọ nguậy. Bên trong âm đạo của Mikuro như được tiếp thêm sức sống. Dù trước đó nó đã rất chật hẹp, cứng nhắc và khít khao──"
2890 = "Âm đạo của Mikuro run rẩy ngọt ngào và siết chặt lấy tôi, đồng thời Hibiki cũng siết chặt rồi nới lỏng vòng tròn ngón tay!!!!"
2891 = "Khuôn mặt em ấy giãn ra như thể vừa trút được gánh nặng, nhưng không hiểu sao lại dần dần đỏ bừng lên."
2893 = "Những lời khiêu khích ngây ngô tự nhiên của Mikuro bắt nguồn từ sự thuần khiết và thiếu hiểu biết. Vì đó là thứ sẽ nhanh chóng biến mất trong chớp mắt……"
2896 = "Mikuro ngày càng mềm mại và nóng bỏng đến mức tôi không thốt nên lời. Mùi hương của Hibiki cũng đậm đặc hơn, thấm từ mũi vào tận não."
2899 = "Sự siết chặt từ âm đạo của Mikuro, có vẻ như em ấy đã học được cách làm nũng, suýt chút nữa khiến tôi xuất tinh."
2900 = "Âm đạo của Mikuro nói chung là rất nhỏ. Không chỉ vô cùng chật chội, mà lực siết cũng mãnh liệt hơn cả Hibiki──"
2902 = "Mikuro bất chợt nhìn Hibiki, ngay khoảnh khắc đó mặt đỏ bừng. Rồi đôi mắt hướng về phía tôi như đang bối rối."
2904 = "Vẫn đang hôn, ánh mắt Mikuro mỉm cười rạng rỡ. Ánh mắt Hibiki thì có chút ngạc nhiên, và cạn lời."
2906 = "Chắc vòng tay ôm Mikuro cũng siết chặt hơn, khiến em ấy khẽ kêu lên một tiếng khó nhọc. Nhưng Mikuro lại càng dựa dẫm và làm nũng với Hibiki hơn."
2908 = "Đôi gò má trắng như sứ của Mikuro dần ửng đỏ. Hibiki áp sát má mình vào má em ấy và thì thầm."
2910 = "Tiếng nước chóp chép, vô cùng ngọt ngào. Trên những chiếc lưỡi đan vào nhau của Mikuro và Hibiki, tinh dịch đặc sệt của tôi"
2911 = "Nghe nói mới để ý. Cơ thể Mikuro đang bắt đầu run rẩy từng cơn."
2912 = "Từ bên trong đôi môi đang cắn yêu, những chiếc lưỡi trơn trượt bò dọc theo hai bên sườn dương vật của tôi."
2923 = "Trái ngược với tư thế như đang đùa giỡn, ánh mắt Hibiki lại rất kiên định. Có lẽ bị kích động, mặt Mikuro nhanh chóng đỏ bừng."
2924 = "Trong lúc trò chuyện, ngón tay tôi vẫn không dừng lại, và Mikuro cũng tiếp tục chiếu đèn."
2929 = "Ngay khoảnh khắc bị Mikuro chạm vào, Hibiki lại rùng mình một cái thật mạnh, phun những giọt nước trong suốt lên người Mikuro như một cơn mưa."
2936 = "Thấy bộ dạng của tôi, Mikuro và Hibiki cũng dừng lại. Bốn con mắt với ba màu sắc ngước lên nhìn tôi đầy vẻ hờn dỗi."
2944 = "Nói ra được, lòng tôi nhẹ nhõm hẳn. Dương vật cương cứng cũng khẽ rùng mình một cái thật mạnh."
2949 = "Ngay khoảnh khắc đó, tôi chắc chắn rằng hành động của chúng tôi đã bị nhìn thấy. Bởi vì Mikuro đang ngượng ngùng cọ sát hai đôi chân thon thả vào nhau."
2950 = "Lần này đổi hướng, tôi đâm một nhát vào tận sâu nhất!!"
2952 = "Vì quá đỗi ngọt ngào nên khoái cảm đến với tôi thật chậm rãi và bức bối, khiến vùng hông đang khao khát tự động bắt đầu di chuyển."
2956 = "Hibiki đã cho phép── Cô ấy cho phép tôi tiến xa hơn một bước so với điểm tôi vừa dừng lại."
2958 = "Lực siết quá mạnh khiến tôi cảm thấy bên trong âm đạo vô cùng chật hẹp. Cảm giác khoái lạc sinh ra từ việc chẻ đường mà vào khiến tôi toát mồ hôi hột."
2959 = "Dù là chuyện thường ngày, nhưng quả thật vẫn thấy lâng lâng. Chính vì thế, tôi phải làm như mọi khi. Hô xác nhận để kiểm chứng thao tác."
2962 = "Trong nháy mắt, dương vật cương cứng của tôi bị phơi bày. ……Tôi đã cương cứng đến tột độ từ lúc nào không hay."
