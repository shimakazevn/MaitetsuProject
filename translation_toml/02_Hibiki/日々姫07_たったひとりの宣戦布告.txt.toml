1974 = "「Hibiki! Hibiki! Sáng rồi, Hibiki!」"
1981 = "「Đúng không. Vậy mà, tại sao chỉ có mỗi Kuma Kuma là nói với tớ như vậy, tớ chả hiểu gì sất.」"
1982 = "「Đúng vậy. Vừa mới đến luôn. Có lẽ là do anh thiếu sự thân thiện chăng.」"
1984 = "「Vậy sao. Vậy anh không khách sáo nhé.」"
1985 = "「Vậy ạ.」"
1986 = "「Vậy sao. Vậy thì quyết định thế đi.」"
1987 = "「Vậy sao ạ?」"
1988 = "「Vậy sao? Chà, trường mình cũng ít học sinh mà.」"
1989 = "「Là gấu của Hibiki. Thú nhồi bông ấy mà.」"
1991 = "「Đúng vậy. Bởi vì——đó là giấc mơ đã dạy cho chị biết. Rằng chị là một đứa trẻ thích làm nũng, và đã được nuông chiều đến mức nào.」"
1994 = "「Ra là vậy.」"
1995 = "「Vậy sao ạ」"
1997 = "「Đúng, đúng vậy ha! Em cũng nghĩ vậy đó, thế mà mọi người cứ bảo là trẻ con, rồi bảo em bỏ đi á.」"
1998 = "「Những người thích tranh của em……chắc chắn là những người có cùng suy nghĩ với em về việc thế nào là đẹp, thế nào là vui.」"
2000 = "「Dù chỉ thỉnh thoảng thôi, nhưng chắc là chị cũng có những giấc mơ quan trọng như vậy. Những giấc mơ chỉ cho chị biết những điều chị đã bỏ sót, hay những điều chị đang cố tình lảng tránh.」"
2002 = "「Quả nhiên là vậy.」"
2004 = "「Họ thích \"bản thân mình đang vẽ tranh\" hơn là việc vẽ tranh. Những kẻ như vậy, khi gặp phải một họa sĩ thực thụ, thì sẽ sợ hãi thôi.」"
2005 = "「Việc so kè xem hạt cườm nào đẹp hơn thì rất vui. Nhưng nếu có một viên kim cương lọt vào giữa, thì niềm vui đó sẽ phai nhạt mất.」"
2007 = "「Em đâu có dọa chị. Em đang lo lắng cho Hibiki mà.」"
2008 = "「Không có gì phải vội vàng cả. Thời gian của Hibiki là của Hibiki. Hibiki cứ sử dụng theo cách mình thích, đó là điều tuyệt vời nhất.」"
2009 = "「Không phải là hâm lại đâu ạ. Là đồ làm dở mà chị Mayami đã chuẩn bị sẵn, rồi cho vào lò vi sóng.」"
2015 = "「Tại sao……ờm……lại như vậy.」"
2016 = "「Tại sao?」"
2023 = "「Kuma Kuma sao. Hoài niệm thật đấy. Dạo này chẳng thấy bóng dáng đâu cả.」"
2025 = "「Bức tranh Kuma Kuma chỉ là em vẽ bậy trong lúc nói chuyện thôi mà? Những bức tranh khác em vẽ cẩn thận hơn nhiều đó.」"
2026 = "「Tranh Kuma Kuma ạ?」"
2027 = "「Ai vậy ạ? Ngài Kuma Kuma là ai thế?」"
2031 = "「Hiểu được những kẻ cười nhạo mình là loại người như vậy rồi. Thì Hibiki có còn sợ bị cười nhạo nữa không?」"
2032 = "「Tất nhiên rồi. Đúng hơn là, anh rất hoan nghênh. Em cứ gọi theo cách em thích, như vậy là thoải mái nhất.」"
2033 = "「Tất nhiên rồi. Vì anh đã trở thành anh trai nuôi của Hibiki mà.」"
2034 = "「Tất nhiên rồi.」"
2035 = "「Tất nhiên là có rồi? Một thứ đơn giản hơn——và chính vì đơn giản nên nó rất mạnh mẽ.」"
2036 = "「Vậy là câu chuyện đã được quyết định rồi nhỉ」"
2039 = "「Đúng là một đám vô bổ. Không——Nếu nhìn từ góc độ khác, thì tài năng của Hibiki đã vô cùng xuất chúng từ khi còn nhỏ rồi nhỉ.」"
2041 = "「Thật là một câu chuyện kỳ lạ và thú vị. Dịu dàng mà lại nghiêm khắc sao ạ?」"
2044 = "「Chị Mayami?」"
2046 = "「Ngủ nướng không phải vì lý do gì to tát đâu. Giấc mơ……À, đúng rồi. Chị đã mơ thấy.」"
2059 = "「Chị Kisaki là một trong những người đã tạo nên em của hiện tại. Thế nên, quyết tâm này. Em muốn truyền đạt và nói lời cảm ơn đến chị ấy.」"
2065 = "「Cười? Tại sao chứ?」"
2067 = "「Bảo là đặt tên thì trẻ con quá này—— hay nói chuyện với thú bông thì thật kỳ quặc này.」"
2074 = "「Rồi sẽ đến lúc như vậy thôi. Hibiki sẽ trở thành một người lớn khỏe mạnh. Cho dù có anh ở bên hay không, nhất định là vậy.」"
2075 = "「Nghe nói em đã có một giấc mơ đẹp à?」"
2081 = "「Việc bị đám người đó làm phiền đúng là phiền phức thật. Nhưng mà……Hibiki nên công bố tranh của mình nhiều hơn nữa đi.」"
2083 = "「Nếu là bạn trai thì có vấn đề đấy.」"
2087 = "「Được vậy thì tốt quá.」"
2088 = "「Nếu em vẫn còn sợ hãi thì—— Đúng rồi, cứ gọi anh bất cứ lúc nào cũng được.」"
2089 = "「Nhớ kỹ điều này nhé, Hibiki. Khi con người tấn công một ai đó, một là vì họ muốn cướp đoạt thứ gì đó, hai là vì họ đang sợ hãi đối phương.」"
2097 = "「Rất vui được gặp em. Bé Migita Kuma Kuma. Anh là Soutetsu. Từ hôm nay, anh sẽ là một thành viên của nhà Migita.」"
2098 = "「Chị xem đi ạ. Những bức tranh đó, tất cả——đều là những thứ mà em muốn vẽ.」"
2109 = "「Cái này……tuyệt thật đấy. Ở độ tuổi này mà đã vẽ được đến mức này——」"
2110 = "「Là người có thể phơi bày khuôn mặt mộc mạc đến nhường này cơ mà? Nếu là người yêu thì chị nghĩ hai người phải có mối quan hệ vô cùng sâu sắc đấy.」"
2111 = "「Người này là——người nhà của Hibiki sao? Anh trai à?」"
2112 = "「Cái này, Hachiroku làm sao? Cảm ơn em nhé.」"
2113 = "「Đó là chiến lược của chị Mayami. Và chiến lược đó có lẽ cũng sẽ giúp nâng cao tỷ lệ chiến thắng của Hibiki lên nhiều đấy」"
2114 = "「Kể nghe nè, Kuma Kuma. Rượu nhà mình lại đạt giải nhất trong buổi bình chọn rồi đó nha.」"
2125 = "「Đám người đó đã sợ hãi tài năng của Hibiki. Thế nên, họ mới tấn công để xua đuổi em, nhằm bảo vệ chốn dung thân của chính mình.」"
2127 = "「Dạ……anh xem đi.」"
2128 = "「Nè! Dạ? Anh Soutetsu.」"
2129 = "「À, chị nói \"từ quan điểm đó\"——nghĩa là, ờm, nếu như, vẫn còn quan điểm nào khác nữa thì sao ạ.」"
2130 = "「À, anh trai. Em có chuyện muốn nói.」"
2131 = "「Dạ, em!」"
2132 = "「N-Nếu anh trở thành gia đình với chị Mayami, thì……với em gái của chị ấy là em đây——cũng là gia đình chứ?」"
2133 = "「Vậy thì tốt quá. Thật đáng tin cậy. Đối với Kuma Kuma, đó cũng là một công việc đáng để làm đấy.」"
2136 = "「Vậy thì? Việc được khen ngợi thì sao? Nếu có người nói tranh của Hibiki 『đẹp』 thì em thấy thế nào?」"
2138 = "「Nếu vậy thì, em xin phép nói thẳng nhé. Hibiki định mặc đồ ngủ đến bao giờ đây ạ?」"
2140 = "「Vậy thì, thử suy nghĩ sâu hơn một bước nữa xem sao? Rằng 『Kẻ nhìn tranh của Hibiki rồi cười nhạo là loại người như thế nào』.」"
2142 = "「Nếu vậy thì——nếu vậy thì——nhé?」"
2144 = "「Vậy là——mãi mãi sao? Kể cả khi em trở thành người lớn cũng mãi mãi sao?」"
2145 = "「Nếu vậy thì tại sao——à không, hay là em mới chuyển trường đến?」"
2146 = "「Nếu vậy thì, ừm. Thấy sao hả Hibiki. Em có muốn cùng chị lập một hội đồng hào không?」"
2147 = "「Vậy thì Hibiki. Cái đó……chị cũng có hứng thú với những trang khác nữa. Chị xem cuốn sổ phác thảo này được không?」"
2148 = "「Nếu vậy thì, những kẻ nhìn tranh của Hibiki rồi cười nhạo. Là những kẻ có suy nghĩ khác với Hibiki về việc thế nào là đẹp, thế nào là vui thôi.」"
2149 = "「Anh hai, anh không sao chứ?」"
2155 = "「Em thì——không bao giờ nằm mơ cả.」"
2156 = "「Ngài Soutetsu cũng đang rất lo lắng, ngài ấy còn chưa ăn sáng, mà vẫn đang đợi chị ở dưới nhà đấy ạ?」"
2157 = "「Ngài Soutetsu. Việc dọn dẹp cứ để em lo.」"
2158 = "「Đứng thứ hai ở trường thì không được sao ta? Mình——cũng đã cố gắng học lắm rồi mà.」"
2159 = "「Không lẽ không khí bị khô sao ta? Cả căn phòng này nữa.」"
2162 = "「Tranh phong cảnh và tranh tĩnh vật đều rất giỏi, nhưng đến mức làm lu mờ cả những bức đó, thì bức tranh vẽ Kuma Kuma này thật sự quá xuất sắc.」"
2166 = "「っ」\\n「っ!」"
2168 = "「っ!!」"
2169 = "「っ!!?」"
2173 = "「Từ 14:00 sẽ tiến hành huấn luyện công tác trên tàu. Cho đến lúc đó, xin hãy giải quyết hết mọi vướng bận trong lòng đi nhé」"
2344 = "Nhưng vừa mới nhẹ nhõm xong, thì đột nhiên, mình lại cảm thấy sợ hãi."
2349 = "Nếu không có chị Kisaki—— Nếu lúc đó chị ấy không bắt chuyện với mình——"
2351 = "Dù vậy thì quả nhiên, những gì anh hai đã dạy vẫn luôn ở lại trong tôi."
2355 = "Cảm giác mơ hồ từ trước đến nay, cảm giác lợn cợn như một sự không tự nhiên đó……thì ra là vì vậy."
2362 = "Anh ấy không hề cười cợt, hay ngắt lời giữa chừng, mà luôn lắng nghe toàn bộ những gì mình nói. Thế nên!"
2365 = "Bảo là tranh vẽ đơn giản quá. Dù lúc đó mình còn rất nhỏ."
2366 = "Bởi vì anh ấy luôn lắng nghe những gì mình nói."
2367 = "Cách nói đó. Không phải là kiểu người lớn đang cố hùa theo đâu!"
2368 = "Giọng nói của anh ấy cực kỳ nghiêm túc, khiến mình cũng bị cuốn theo mà trở nên nghiêm túc."
2372 = "Vẻ mặt này, gọi là cười khổ phải không ta. Trông rất người lớn, và ngầu nữa."
2373 = "Anh ấy nói \"Hô\" kìa! Bây giờ là trang nào rồi? Anh ấy đang xem chỗ nào, tò mò quá đi mất!"
2375 = "Đôi mắt nghiêm túc ban nãy đã dịu lại một chút, và mình lại được xoa đầu thêm một lần nữa."
2378 = "Đây là lần thứ ba mình được xoa đầu rồi. Lần này là ấm áp nhất, và cũng là lần mình thấy vui nhất từ trước đến nay."
2381 = "Nhưng ngay lập tức, một nụ cười nở rộ, xóa tan đi vẻ mặt đau khổ ấy."
2384 = "Nhưng mà, không hiểu sao, mình lại có cảm giác như hơi hiểu ra vấn đề, nên đành im lặng."
2385 = "Anh Soutetsu, rất dịu dàng và ngầu nữa."
2387 = "Nhưng mà, nếu là với anh Soutetsu thì mình có thể nói được. Người này, tuyệt đối sẽ không cười nhạo những gì mình nói đâu."
2392 = "Hachiroku nhìn ngó xung quanh. Đâu có khô hanh gì đâu. Cả phòng này, và chắc là cả phòng anh hai nữa."
2396 = "Ánh mắt của Hachiroku, thực sự trông rất lo lắng. Nhìn chằm chằm vào mình, như muốn bao bọc lấy mình vậy."
2398 = "Giọng nói của Hachiroku nghe có vẻ rất hứng thú."
2400 = "Hachiroku mỉm cười. Một nụ cười nhẹ nhõm, như thể đã rất an tâm."
2401 = "Hachiroku từ từ bước vào. Trên tay bưng khay đồ ăn sáng——Á, mình tệ quá!"
2404 = "Nói rồi Hachiroku rụt tay lại."
2405 = "Hachiroku làm vẻ mặt hơi bối rối, nhưng vẫn ngoan ngoãn đưa khay cho tôi."
2407 = "Lúc bình tĩnh mới cần luống cuống——Không phải! Lúc luống cuống mới cần bình tĩnh——Đúng rồi!"
2409 = "Khuôn mặt đau khổ như chực khóc lúc nãy, chắc chắn là do mình nhìn nhầm rồi."
2417 = "Sao chị Mayami lại ăn gian thế! Mình cũng——Mình cũng……"
2420 = "Tay phải——chị Kisaki đưa ra."
2424 = "Bánh mì nướng vừa ra lò giòn rụm, và một cốc ca cao pha sữa nóng."
2428 = "Vẫn là tôi tự nhiên như mọi khi. Không quá cảm xúc, cũng không phải trạng thái kìm nén cảm xúc."
2430 = "Hya! Thế này, không được đâu! Cứ bồn chồn râm ran, xấu hổ đến mức ngứa ngáy hết cả người rồi!"
2431 = "Oa! Oa! Oa!! Bị lật ra rồi! Bên trong, đang bị nhìn chằm chằm kìa!!"
2434 = "Anh trai định đứng dậy."
2435 = "A…… Anh hai lại làm ra vẻ mặt đau khổ——cô đơn đó nữa rồi."
2438 = "Awa wa, không được! Càng luống cuống thì càng làm lãng phí thời gian thôi!!"
2440 = "Aaa, đúng rồi. Cuốn sổ phác thảo này, cũng có lác đác vài bức mình vẽ anh hai nữa."
2442 = "A! Nếu là hướng đó thì đơn giản thôi!"
2444 = "À, đúng rồi. Đêm qua mình——"
2446 = "À, ra là vậy. Thì ra là thế. Bây giờ thì mình, có lẽ——đã hiểu rồi."
2447 = "Ư ư……Khó nói quá đi. Nhưng mà, chị Kisaki——"
2452 = "Bởi vì, mình hoàn toàn không nghĩ tới việc sẽ được khen ngợi về bức tranh vẽ Kuma Kuma."
2453 = "Bởi vì, mình biết chứ. Chị Kisaki đã đi làm ở ngân hàng rồi, là một người vô cùng bận rộn."
2454 = "Anh hai—— Tại vì, anh ấy đã đi đến Đế đô một mình mất rồi."
2455 = "Bởi vì, nếu không làm vậy thì thất lễ quá."
2463 = "Dừng tay xếp bát đĩa lên khay, Hachiroku ngoan ngoãn ngồi xuống."
2465 = "Có lẽ là đi chào hỏi đối phương rằng từ giờ sẽ bắt đầu chiến tranh……"
2466 = "Tiếp tục động tác tay đang dang dở, Hachiroku lại đặt bát đĩa lên khay."
2468 = "Chuyển chủ đề đột ngột quá, khiến mình giật mình không hiểu chị ấy đang nói về chuyện gì."
2470 = "Bàn tay to lớn. Bàn tay của anh hai."
2471 = "Đau quá……hay đúng hơn là? Bị đụng trúng rồi? Mình lại——mải nghĩ về anh hai nên ngẩn người ra mất rồi——"
2473 = "Vui quá! Thật sự, được khen như thế này—— Ủa, ơ? Anh hai——sao trông như sắp khóc vậy?"
2475 = "Yên tâm rồi! Vì anh hai đã trở lại với khuôn mặt dịu dàng thường ngày."
2478 = "Quá chuẩn xác. Nhưng mà bị đoán trúng ngay tắp lự thế này thì có hơi ấm ức chút xíu."
2481 = "Tuyên chiến."
2484 = "Như thể phát ra âm thanh từ sâu trong cổ họng, một cảm giác thật kỳ lạ——nhưng lại là một nụ cười vô cùng tự nhiên."
2487 = "Chị Mayami đứng nhất, thì cớ sao mình cũng phải đứng nhất theo chứ, chỗ đó là không hiểu nổi luôn á."
2492 = "Cảm thấy ấm áp, dịu dàng, và hoài niệm—— Không lẽ anh ấy, đang nhớ lại chuyện gì đó sao?"
2494 = "Vừa tự hào vừa vui sướng—— Vui quá đỗi khiến dũng khí trong mình cũng bắt đầu trỗi dậy."
2496 = "Làm sao đây. Những gì anh Soutetsu bị nói, nghe giống hệt mình luôn."
2504 = "Nếu chị Kisaki thích những bức tranh của mình…… Nghĩ vậy, dũng khí trong tôi bắt đầu dâng lên từng chút một."
2510 = "Vừa nói ra, một chút——từng chút một. Những mảnh vỡ giấc mơ tưởng chừng đã tan biến dần lấy lại được màu sắc và hình dáng."
2511 = "Chuyện đó, mình hoàn toàn chưa từng nghĩ tới luôn á, mà dù có nghĩ tới thì cũng tuyệt đối không thể nói ra nhẹ bẫng như vậy được đâu!!"
2512 = "Những lời vô thức nói ra đã giúp tôi nhận ra."
2515 = "Mình ghét cái giọng điệu như đang cầu nguyện đó, nó cứ như thể anh hai sắp đi đến một nơi thật xa vậy!"
2517 = "Nếu là anh hai thì mình không muốn giấu. Bởi vì——anh hai chắc chắn sẽ không cười nhạo mình đâu."
2518 = "Mình không nghĩ chị Kisaki lại nói mỉa mai đâu. Nhưng mà, mình thì lùn tịt thế này……"
2520 = "Mình cũng sẽ bắt chước. Mình đã luyện tập suốt rồi mà——chắc chắn sẽ làm được."
2523 = "Thấm thía sâu sắc ý nghĩa của câu \"Itadakimasu\", và rồi lòng biết ơn, tự nhiên chuyển hóa thành một câu nói quen thuộc."
2526 = "Khoảnh khắc tôi trả lời, ngón tay của chị Kisaki lướt dọc theo chiếc cằm thanh tú, kiểu \"Hừm\"."
2527 = "Vừa mới thấy ghen tị thì ngay lập tức mình cũng được xoa đầu. ……Tay anh hai, to thật đấy."
2528 = "Mình. Do mải mê nói chuyện với Kuma Kuma quá. À mà, đúng rồi ha……"
2531 = "Ý thức quá mức khiến mình khó thở, cơ thể cũng dần dần nóng bừng lên rồi!!"
2532 = "Gật gật đầu. Bởi vì, đêm qua chị Mayami đã——"
2535 = "Sợ làm dính bụi chì lên tay chị ấy thì không hay, nên mình phủi tay vào vạt váy mấy cái rồi mới nắm lấy."
2537 = "Tôi muốn gật đầu, nhưng quả nhiên vẫn thấy sợ."
2538 = "Tôi đặt tay lên tay Hachiroku."
2539 = "Giọng nói cất cao với sống lưng vươn thẳng của tôi, vang lên cùng lúc với giọng của anh hai."
2541 = "Hôm qua mình—— Bởi vì, cảm xúc lúc đó cứ như bùng nổ đến nơi ấy!!"
2542 = "Mình là mình. Chị Mayami là chị Mayami."
2544 = "Mình có hơi đắc ý quá đà rồi."
2546 = "Tim tôi đập thình thịch. Nhưng tôi lại cảm thấy an tâm và ấm áp hơn gấp bội."
2547 = "Mình, lỡ nói ra khỏi miệng rồi sao!?"
2549 = "Cảm thấy nếu bây giờ không nói thì sẽ không còn cơ hội nào nữa, tôi hơi hoảng hốt gọi giật lại."
2552 = "Gấp chăn nệm, thay quần áo, chỉnh đốn lại trang phục."
2554 = "Răng lại rứa——à không, tại sao lại vậy ạ, chưa kịp hỏi thì chị Kisaki đã cười và cho tôi câu trả lời."
2555 = "Vì vậy. Mình sẽ ăn thật ngon miệng, không để thừa một chút nào."
2557 = "Thế nên, mình có thể nói ra. Có thể ưỡn thẳng lưng và mở lời nhờ vả."
2560 = "Vì vậy, tôi có thể dọn dẹp một cách nhanh nhẹn."
2562 = "Đâu có chuyện đó! Mình nghĩ vậy, và cũng muốn nói ra như vậy, nhưng mà……"
2566 = "Tài năng……Rồi thì, hạt cườm, và kim cương. Mình thấy câu chuyện ví von của chị Kisaki hơi quá đà thì phải——"
2568 = "Dọn dẹp xong, đánh răng xong, tôi có thể quyết định quần áo và kiểu tóc mà không hề do dự."
2591 = "Đã làm em ấy lo lắng vì ngủ nướng rồi, mà mình còn phát ra âm thanh kỳ quái rồi lăn lộn trên giường nữa chứ."
2592 = "Người mà chị Mayami bảo sẽ trở thành anh hai của mình."
2596 = "Là những người đã nói với mình rằng, \"Hãy cho mọi người xem tranh của em nhiều hơn nữa đi\"."
2604 = "Sau đó, anh ấy mỉm cười thật chậm, thật chậm. Rồi anh hai trả lại cuốn sổ phác thảo cho mình——Á!!?"
2605 = "Sau đó anh ấy ngồi xổm xuống, và đưa khuôn mặt ấy đến sát ngay trước mắt mình."
2606 = "Sau đó cô ấy chống tay lên hông, 'e hèm' một tiếng và ưỡn ngực lên có vẻ hơi cố ý."
2607 = "Sau đó anh ấy mỉm cười dịu dàng…… nhưng lại mang một vẻ mặt có chút áy náy."
2612 = "Trứng cuộn phô mai nóng hổi, thịt xông khói, và salad."
2620 = "Xấu hổ quá đi!"
2622 = "Mình đã nghĩ là \"Đúng thật!\". Chắc hẳn suy nghĩ đó cũng đã truyền đến anh hai rồi."
2643 = "Nhẹ nhàng, đầy dịu dàng. Bàn tay của chị Kisaki chạm vào cuốn sổ phác thảo của mình."
2644 = "Vừa nói, ánh mắt của chị Kisaki vẫn luôn dán chặt vào cuốn sổ phác thảo."
2649 = "Tiêu rồi! Lại sắp bị coi là con nít, rồi bị quở trách cho xem——"
2651 = "Cuốn sổ phác thảo bị rơi xuống và mở bung ra, đang bị nhìn chằm chằm——Khoan đã, người này!"
2653 = "Xoạt, xoạt, cuốn sổ phác thảo được lật qua từng trang."
2655 = "Cuốn sổ phác thảo! Mình vẫn đang cầm trên tay!! Do bất ngờ quá nên mình quên khuấy đi mất!"
2656 = "Cảm thấy hơi tiếc một chút, nhưng cũng cảm thấy rất an tâm."
2657 = "Mình có cảm giác là không được nói ra. Cảm giác đó rất mãnh liệt."
2658 = "Ngon quá. Rất ngon."
2659 = "Ngon đến mức đáng ghét—— Thế nên……thật sự, dù giờ mới nhận ra, nhưng mình lại nghĩ."
2662 = "Xấu hổ quá đi mất! Nhưng mà, cũng vui lắm!"
2664 = "Một cách nói rất đỗi bình thường, tự nhiên, và nghĩ sao nói vậy, đã truyền thẳng đến mình một cách rõ ràng!"
2666 = "Từ khi anh hai rời đi, mình cứ ủ rũ suốt thôi——"
2667 = "Nghe anh ấy nói vậy, cảm giác ngứa ngáy kỳ lạ bỗng chốc tan biến."
2669 = "Chắc chắn là vì chị ấy có điểm gì đó giống với mình—— Nên chị ấy mới thích tranh của mình……"
2681 = "Sâu, sâu, sâu, mối quan hệ sâu sắc á!"
2696 = "Ngôn từ. Chị Kisaki cũng giống như anh hai, nói tiếng phổ thông rất hay."
2699 = "Ai!? Ai vậy!!? Tự nhiên—— Á, a——Là anh Soutetsu."
2708 = "Người này……đang chào hỏi Kuma Kuma kìa. Không chỉ vậy, còn bắt tay nữa chứ."
2709 = "Giấc mơ đó, chắc chắn là do một bản ngã với tiếng nói vô cùng nhỏ bé bên trong tôi, đã cất tiếng gọi và cho tôi thấy."
2710 = "Nếu là vậy thì mình hiểu rồi. Đúng hơn là, mình…… đây là lần đầu tiên từ lúc sinh ra được người khác bảo là có giá trị kinh tế."
2711 = "Người thứ ba. Anh hai, chị Mayami……và rồi, chị Kisaki."
2712 = "Một điều nhỏ nhặt như vậy cũng khiến tôi cảm thấy hạnh phúc lâng lâng, bởi vì bản thân quá đỗi đơn giản nên tôi bật cười khúc khích."
2713 = "Nào là không có chiều sâu, nào là thấy sao vẽ vậy…… Đủ thứ chuyện, bị nói này nói nọ rất nhiều."
2714 = "Tự nhiên thấy vui ghê. Nhẹ nhõm cả người."
2718 = "Vừa nói, anh hai――anh Soutetsu nhìn thẳng vào mắt tôi."
2720 = "Anh hai—— Anh hai cũng, bận tâm đến môi……đến môi sao!"
2722 = "Anh hai cũng—— Bởi vì, đúng vậy mà. Ừm. ……Dù sao thì cũng đã hôn rồi mà."
2723 = "Dù mình chưa nói ra nhưng anh hai đã hiểu rồi. Nên mình có thể kể được."
2726 = "Ưm……anh hai im lặng một chút."
2729 = "Giật nảy mình, với một cảm giác như thế, anh hai mở mắt ra và nhìn mình."
2730 = "Vẻ mặt ngơ ngác. Sau đó anh hai cười khúc khích."
2731 = "Tay anh hai xoa xoa đầu Kuma Kuma."
2734 = "Lông mày của anh hai nhíu lại, kiểu \"Ừm~\"."
2735 = "Khuôn mặt không đổi sắc. Nhưng mà gáy của anh hai lại hơi đỏ lên. Ra là vậy……Gì chứ, thì ra là thế."
2738 = "Anh hai mỉm cười. Dịu dàng, và có vẻ như mọi khi. ……Anh ấy chẳng sờ môi gì cả."
2740 = "Anh hai không còn ở đây nữa, và giờ mình đã gặp được chị Kisaki. Bây giờ mình mới nhận ra, những gì anh hai dạy đều là sự thật."
2741 = "Anh hai nhắm chặt mắt lại. Vẫn nhắm mắt và ngước nhìn lên trên."
2744 = "Chị Mayami làm bữa sáng bằng bánh mì, hiếm thấy thật đấy. Tuy là hiếm thấy, nhưng mà."
2745 = "Không phải tất cả mọi người đều như vậy. Tất nhiên cũng có những người thực sự thích vẽ tranh——"
2746 = "Tuy có hơi ngại, nhưng mình rất vui. Bởi vì bản thân mình cũng thấy những bức vẽ anh hai rất sống động."
2747 = "Hình dáng rất đẹp, dù chỉ nhíu lại một chút xíu thôi, nhưng lại mang đến cảm giác như đang rất phiền não vậy."
2748 = "Dù hiểu những gì anh hai dạy, nhưng mình không cảm thấy có dũng khí để làm theo, nên giọng nói cứ nhỏ dần."
2763 = "（Khi có đồng minh……chỉ cần có một đồng minh xuất hiện…… thì dũng khí sẽ không ngừng tuôn trào）"
2767 = "（Phịch!）"
2768 = "（Lật）"
2770 = "（Bởi vì mình…… thỉnh thoảng vẫn hay liếc nhìn về phía Câu lạc bộ Mỹ thuật mà）"
2772 = "（Thế này thì ổn rồi. Mình có thể nói chuyện với chị Kisaki bằng con người thật của mình!）"
2773 = "（Cả chị Mayami nữa……mình, từ trước đến giờ vẫn luôn được nuông chiều hết mực——）"

[selections]
