2026 = "「A——」"
2028 = "「Đúng là vậy nè! Nhưng mà, theo như câu chuyện vừa rồi——\\nthì có vẻ ít chỗ có thể cắt giảm chi phí lắm á」"
2030 = "「Đúng vậy ạ! Vì thế, cách làm này——\\ncháu muốn nhân rộng ra toàn Kyushu, ra toàn quốc!!」"
2031 = "「Họ có nói! Vì vậy, toa ăn du lịch nghỉ dưỡng cũng vậy.\\nNếu trở thành biểu tượng, chắc chắn sẽ thành công」"
2034 = "「Đúng vậy, Reina. Thật sự là thế」"
2036 = "「A——là chuyện đó nhỉ.\\nNhưng mà, những gì tôi có thể nói, thì đã nói hết rồi」"
2037 = "「Hê」"
2038 = "「Vậy sao. Chà, đúng là cứ thử nói ra xem sao nhỉ.\\nChỉ cần được mọi người thấy thú vị như vậy là tôi vui rồi」"
2040 = "「Là màu xanh của bầu trời vào khoảnh khắc 'Blue Moment',\\nngay trước lúc mặt trời mọc nhỉ」"
2042 = "「Vâng. Cháu muốn hỏi lại câu chuyện của bác ạ」"
2044 = "「Đúng vậy. Và vì có thể giới hạn phương pháp chế biến,\\nnên em cũng có thể bớt đi một cái bếp ga trong thiết bị nhà bếp」"
2045 = "「Vâng」"
2047 = "「Đúng vậy đó! Chị Kisaki!」"
2048 = "「Vâng. Của mọi người dọc theo tuyến đường.\\n——Và, một ngày nào đó là của mọi người ở Kyushu」"
2053 = "「Ra là vậy」"
2054 = "「Vậy sao ạ」"
2055 = "「Chuyện đó thì, đúng vậy!」"
2056 = "「Chị ấy——hiểu, sao?」"
2058 = "「Thật sự rất vững tâm, và giúp ích được rất nhiều.\\nDù là chuyện thường ngày nhưng——cảm ơn cô」"
2059 = "「Tài trợ thì em đã đoán trước được rồi——\\nnhưng 'cũng có chuyện đó' nghĩa là còn cách nào khác sao?」"
2061 = "「Nagi đại nhân vừa nghĩ ra một ý tưởng hay lắm nè!」"
2065 = "「Từ câu chuyện của thị trưởng Yufuin và kinh nghiệm ở quán cà phê ga,\\nem đã suy nghĩ rất nhiều」"
2068 = "「So với nhà hàng cố định, toa ăn trên tàu sẽ tốn kém chi phí nhân sự\\nvà chi phí vận hành đúng nghĩa đen hơn nhiều đấy」"
2075 = "「Nước giếng chưa qua lọc được bơm ầm ầm vào bồn chứa nước.\\nHoàn toàn chưa được kiểm tra chất lượng nước cần thiết để uống」"
2080 = "「Nếu không ai, nhờ vả nữa……\\nThì em, sẽ không thể làm việc được」"
2081 = "「Đúng vậy——thiếu sót.\\nCòn thiếu sót. Bởi vì chúng ta, thật vô lực」"
2087 = "「Vụ D51 ở Yufuin,\\nthành ra lỡ dở thế này thật xin lỗi」"
2088 = "「Nằm ở đâu chứ? Để không trở thành như vậy,\\nem đã cố gắng hết sức, học tập và chuẩn bị rồi mà」"
2090 = "「Để mở rộng, để kết nối——\\nThực tế, phải đi gặp mặt thì mới bắt đầu được!」"
2091 = "「Tại sao chứ!」"
2092 = "「Tại sao vậy?」"
2098 = "「Chỉ cần nắm tay Hibiki,\\nanh đã có thể đón nhận được một không gian rộng lớn đến thế này」"
2100 = "「Toa ăn, để kết nối.\\nNgắn gọn và rõ ràng. Tôi nghĩ đó là một cái tên hay ạ」"
2101 = "「Nơi những đường ray nối tiếp nhau——\\ncác nhà ga có thể trở thành hàng xóm của nhau」"
2103 = "「——Chà, già đến chừng này rồi.\\nSự quan tâm đến bên ngoài cũng phai nhạt đi nhiều rồi」"
2104 = "「Chị gái mà. Là chị gái của em mà!」"
2107 = "「Dĩ nhiên là phương án cho toa ăn của chúng ta rồi. Nếu làm thế này——\\nnó sẽ trở thành 'toa ăn ai cũng muốn lên'. Đối với bất kỳ ai」"
2108 = "「Dĩ nhiên rồi! Việc gì cũng được hết!\\nAnh nói đi——có chuyện gì cứ nói thử xem」"
2109 = "「Dĩ nhiên rồi, nếu mọi người tin tưởng giao cho chị」"
2110 = "「Tất nhiên, một kế hoạch được tất cả mọi người chấp nhận,\\nrốt cuộc có lẽ là thứ không thể tạo ra được」"
2111 = "「Trông ngon quá nè!\\nSet nào em cũng muốn ăn thử hết!!」"
2113 = "「Quả là một giấc mơ đẹp của người trẻ.\\nNhưng mà, chuyện đó——chắc sẽ khó khăn lắm đây」"
2122 = "「Thứ chị Mayami nhìn thấy là gì.\\nThứ chúng ta đã bỏ sót, là gì」"
2126 = "「Đúng vậy. Hơn nữa, chị ấy cũng sẽ kiểm tra dưới góc nhìn\\ncủa một nhà quản lý hiện trường, khác với tôi」"
2135 = "「Khoan đã, anh hai. Gì cơ? Gì vậy?\\nCái gì mà nhờ có em chứ?」"
2137 = "「Khoan bàn đến tên viết tắt thì cái tên này cũng hay mà.\\nSo với mấy từ ngoại lai làm điệu kỳ quặc thì nó hợp với chúng ta hơn nhiều」"
2138 = "「Toa ăn Kết nối」"
2143 = "「Việc vẽ tranh. Việc thiết kế.\\n——Việc làm việc, bằng hội họa, bằng thiết kế」"
2147 = "「Thành thật mà nói, đúng là vậy ạ.\\nĐược lòng người này thì mất lòng người kia」"
2149 = "「Hơn nữa thực đơn này……tỷ lệ giá vốn có vẻ rất cao——ạ.\\nThịt ngựa này, cá hương này——A! Nhà tài trợ!!?」"
2154 = "「Kết nối là mở rộng.\\nLà có thể đón nhận được nhiều thứ hơn」"
2159 = "「Thực đơn cũng hoàn hảo luôn nè!」"
2166 = "「Để trở thành biểu tượng, để được yêu mến——\\nChỉ với bàn tay của Ohimitera, của Yufuin là chưa đủ」"
2167 = "「Để giảm tỷ lệ giá vốn, phải hạn chế tối đa thực phẩm bỏ đi.\\nĐể làm được điều đó, phải sử dụng một nguyên liệu dưới nhiều hình thức khác nhau」"
2169 = "「Nếu chị Mayami đã đảm bảo, thì số người quan tâm\\nđến Toa ăn Kết nối chắc chắn sẽ tăng lên nhiều hơn. Ạ」"
2180 = "「Xin hãy cho cháu biết. Bác là người rất hiểu Bungomori,\\nbác mong muốn điều gì ở toa ăn du lịch nghỉ dưỡng này」"
2181 = "「Nhất định hãy thực hiện nhé. Cháu tin rằng cách làm đó chắc chắn\\nsẽ biến đầu máy xe lửa thành 'của mọi người' ạ」"
2182 = "「Cảm ơn mọi người. Vì thế nên em mới chọn màu xanh.\\nVì nó là màu của núi, của nước, của bầu trời, của tất cả mọi thứ」"
2191 = "「Đi thôi. Hibiki. Về phòng anh nào」"
2194 = "「——Hỏi một ông già như tôi chuyện đó thì cũng」"
2207 = "「Cũng có chuyện đó. Ghi tên quán và thông tin đặt hàng\\nlên thực đơn để lấy chi phí quảng cáo bù đắp chi phí」"
2208 = "「Chuyện đó! Thú vị lắm ạ!!!」"
2209 = "「Điều đó, chị Mayami là người hiểu rõ hơn ai hết」"
2210 = "「Chuyện đó bị từ chối rồi. Cái nhận được là sự đồng ý nội bộ về việc chuyển nhượng miễn phí.\\nÔng ấy bảo nếu bên nhận chịu chi phí vận chuyển thì muốn mang đi đâu cũng được」"
2211 = "「Anh sẽ giải thích kỹ càng sau——\\nNhưng trước mắt, bây giờ anh làm một việc được không?」"
2212 = "「Anh không biết. Anh chỉ cảm thấy yêu em.\\nVà nhớ lại những lời em đã nói thôi」"
2213 = "「Chắc là để bảo vệ Hibiki khỏi vết thương chí mạng đấy」"
2214 = "「Chị Mayami bảo bọc em quá mức.\\nNên chị ấy cực kỳ sợ việc Hibiki bị tổn thương」"
2215 = "「Một trải nghiệm quý giá không nơi nào có……Trên thế giới, có lẽ\\nđây sẽ là việc cung cấp một trải nghiệm quý giá hiếm có」"
2216 = "「Đoàn tàu này là toa xe đầu tiên để kết nối toàn bộ Kyushu.\\nVì vậy, tên của nó là——」"
2217 = "「Tất cả là nhờ Hibiki đã mong muốn đến đây.\\nNhờ em đã tha thiết muốn gặp và lắng nghe mọi người nói」"
2218 = "「Nếu hai người hứng thú đến vậy thì để tôi nhờ thử nhé.\\nNhờ quản lý quán 'Unzen' thì cậu ấy sẽ mang đến cho」"
2225 = "「Cái đó——nhân tiện ỷ lại thì nói ra hơi kỳ.\\nNhưng em muốn xin xác nhận, thêm một điều nữa, từ một người duy nhất——」"
2226 = "「Cái đó!」"
2229 = "「Nếu vậy, hãy bình tĩnh suy nghĩ xem nào」"
2230 = "「Quyết định vậy đi. Vậy thì, chuyện này coi như xong——\\nVề chuyện đầu máy D51 ở Yufuin, tôi đã nhận được sự đồng ý nội bộ từ thị trưởng Yufuin rồi」"
2231 = "「Vậy thì chị sẽ nhận lấy trách nhiệm này nhé」"
2234 = "「Lúc đó cháu chỉ hỏi được về lịch sử thôi.\\nNên hôm nay, cháu muốn nghe cảm nhận của bác ạ」"
2236 = "「Đôi mắt của, chị Mayami——\\nnhìn xa hơn——rộng hơn, em, rất nhiều——」"
2238 = "「Vậy thì chỗ đó phải chi tiền đàng hoàng rồi ha」"
2239 = "「Vậy thì, hiểu ý chị chứ?」"
2240 = "「Vậy, về cái tên của toàn bộ đoàn tàu đang bị trì hoãn,\\ncũng như ý tưởng và thiết kế ngoại thất thì sao」"
2242 = "「Hàng xóm của nhau……Quả đúng là vậy nhỉ.\\nCho dù khoảng cách giữa các nhà ga có xa đến đâu đi chăng nữa」"
2245 = "「Tính toán cường độ trọng lượng xong rồi ạ.\\nThiết kế này thì đáp ứng được tiêu chuẩn an toàn nha」"
2247 = "「Về thực đơn, em cũng đã làm khảo sát và điều tra thử nghiệm\\ntại quán cà phê ga Ohimitera」"
2248 = "「Chuyện đó, dù chỉ mới có một thôi,\\nnhưng em đã có ý tưởng rồi」"
2250 = "「Là khi. Anh hai không còn nữa.\\nLà khi. Chị Mayami, không còn nữa」"
2252 = "「Anh hai——anh nghĩ ra gì rồi sao?」"
2253 = "「Nói cho em nghe đi? Anh hai」"
2255 = "「Anh hai?」"
2256 = "「Anh hai!?」"
2257 = "「Chị ấy, đã——nói.\\n'Chị, không thể lên đoàn tàu này được'」"
2259 = "「……Chị Mayami. Chị ấy nói 'Chị, không thể lên đoàn tàu này được'」"
2261 = "「Ý thức lãnh thổ, nói ra thì nghe có vẻ xấu,\\nnhưng cháu nghĩ đó cũng là biểu hiện của tình yêu quê hương mạnh mẽ」"
2262 = "「Và, dù là đôi bàn tay chỉ có thể lau nước mắt——」"
2263 = "「Nếu phải nói thì——trong chuyến du lịch, tôi muốn toa ăn du lịch nghỉ dưỡng\\nđược đưa vào \\x%l扇形機関庫;#00ffc040;gara đầu máy hình ngành%l;#;」"
2273 = "「Ẩm thực là nước. Nếu để người ta nghĩ rằng chúng ta dùng nước tạm bợ,\\nthì nền tảng của một toa ăn du lịch nghỉ dưỡng sẽ không thể tồn tại được」"
2274 = "「Sự phục sinh, của toa ăn——」"
2275 = "「Chúng cháu muốn lắng nghe ý kiến của mọi người ở tất cả các khu vực dọc theo tuyến đường toa ăn chạy——\\nnhững người sử dụng tất cả các nhà ga」"
2280 = "「40 là 40%.\\nFukami, em có biết từ 'chi phí FL' không?」"
2281 = "「Và tổng của F và L chính là chi phí FL.\\nNếu nó nằm trong mức 60% doanh thu thì về mặt kinh doanh được coi là vùng an toàn」"
2392 = "Vừa viết xong, nét mặt Hibiki bừng sáng!"
2395 = "Những nụ cười lan tỏa,\\ntô điểm thêm màu sắc cho Cửa hàng đường sắt."
2396 = "Vừa được hỏi, kỹ sư lão thành Kimoto cau mày vẻ bối rối."
2398 = "Không thể lên tàu, có lẽ không chỉ có một mình chị Mayami."
2402 = "Lỡ mất cơ hội nếm thử hương vị địa phương.\\nVì bị bó hẹp trong Ohimitera, chúng tôi suýt nữa đã phạm phải sai lầm đó."
2409 = "Thay vì chiếc D51 ở Yufuin, chiếc máy đó lại được chào đón ở Bungomori,\\nngay khoảnh khắc nghe được điều đó, khuôn mặt Hibiki trở nên phức tạp."
2413 = "Chính vì vậy, Paulette đang cố gắng giảm bớt gánh nặng\\ncho người kiêm nhiệm cả vai trò nhà thiết kế và thị trưởng."
2417 = "Thực tế là Paulette và mọi người đều đã công nhận.\\nKết quả khảo sát người dân cũng rất tốt."
2423 = "Tuy nhiên, dù có thảm hại hay không đáng tin cậy,\\ntôi vẫn có những việc có thể làm."
2425 = "Nhưng——"
2426 = "Nhưng ngay khoảnh khắc tiếp theo, Hibiki đã nở một nụ cười gượng gạo\\ntuyệt đẹp……đến mức đáng thương."
2429 = "Nhưng, vẫn chưa đủ.\\nTôi cảm thấy có một thứ gì đó khác đang trói buộc chúng tôi."
2431 = "Nhưng hiện tại, em ấy không hề để lộ ra một chút biểu hiện nào như thế.\\nCó vẻ như đã an tâm vì điều đó, khuôn mặt kỹ sư lão thành Kimoto cũng giãn ra."
2433 = "Nhưng giờ đây, chúng tôi có thể đáp ứng tất cả.\\nThậm chí có thể biến thiết bị nhà bếp hiện tại thành những thứ dư thừa."
2451 = "Mối liên kết nhỏ bé nhưng không thể thay thế,\\nsẽ hồi sinh nếu hai người đồng lòng."
2457 = "Vẻ mặt Nagi bừng sáng."
2466 = "Nỗ lực đã đơm hoa kết trái. Đã được công nhận.\\nGương mặt Hibiki dần ửng đỏ lên."
2475 = "Dù Hibiki không đòi hỏi gì,\\nchị Mayami có lẽ cũng sẽ không nói ra lý do."
2484 = "Nếu cử động, nước mắt sẽ lập tức trào ra.\\nVì vậy, em ấy không thể nhúc nhích dù chỉ một chút."
2486 = "Nếu nhớ lại bản thân mình đã từng đơn độc,\\ngiá trị của điều đó sẽ hiện lên rõ nét."
2497 = "Đồng thời, chuẩn bị sẵn chả cá hương,\\ntrưa nấu canh trong, tối làm món chiên. Xương cũng đem chiên hoặc ngâm rượu."
2506 = "Bởi vì Hibiki luôn ở bên cạnh,\\nluôn mỉm cười bên cạnh, nên tôi đã quên mất điều đó từ lâu."
2510 = "Bởi vì em ấy hiểu chị Mayami sâu sắc hơn bất kỳ ai.\\nBởi vì đó là điều duy nhất em ấy vẫn luôn ao ước."
2511 = "Vì nếu để lọt ra tiếng khóc, chắc chắn sẽ làm chị Mayami tổn thương.\\nNên Hibiki tuyệt vọng kìm nén, tiếp tục rơi những giọt nước mắt câm lặng."
2512 = "Bởi vì chúng tôi đã định cố định thực đơn\\nbằng những đặc sản, danh sản của Ohimitera."
2513 = "Để dõi theo thử thách quan trọng nhất đối với Hibiki,\\nvà để hỗ trợ em ấy khi cần thiết."
2522 = "Có lẽ là vậy.\\nCâu trả lời đơn giản đó, có lẽ chính là sự thiếu sót mà chị Mayami đã nhìn thấy."
2526 = "Họ đưa ra những lý do xác đáng, rằng 'đây không chỉ đơn thuần là tình cảm cá nhân'."
2528 = "Có thể sẽ bị coi là lời nói thiếu suy nghĩ.\\nNhưng đó là cảm nhận thực sự của tôi."
2530 = "Cổ họng em ấy phát ra tiếng hít vào nghẹn ngào,\\nnhững giọt nước mắt bị kìm nén bắt đầu tuôn rơi lã chã."
2532 = "Được trả lời ngay lập tức, tôi cảm thấy vui sướng.\\nNhưng, trong trường hợp này……có lẽ không phải là lo lắng về điều đó."
2533 = "Dù gần như chắc chắn đó không phải là lời tốt đẹp gì.\\nNhưng em ấy vẫn không trốn tránh, không hối thúc, chỉ một mực chờ đợi."
2536 = "Bằng cách đẩy tôi ra xa,\\nem ấy đã trao lại mạng sống của tôi cho chính tôi."
2538 = "Dù đang khóc, em ấy vẫn lo lắng cho tôi."
2540 = "Sự quyết tâm mạnh mẽ khiến tôi cảm thấy vui sướng.\\nNếu đó là mong muốn của Hibiki, tôi chỉ việc hành động vì điều đó."
2543 = "Nước mắt thấm ướt áo sơ mi,\\nnhưng tôi vẫn không nghe thấy tiếng khóc."
2546 = "Ngay lập tức, sự run rẩy trở nên mạnh hơn.\\nTừ cổ họng Hibiki——những âm thanh yếu ớt bắt đầu tuôn trào."
2547 = "Sự run rẩy trên đôi vai dần dần nhỏ lại.\\nNhịp thở bắt đầu trở lại bình thường."
2548 = "Đôi mắt đẫm lệ nhòe nhoẹt——\\nnhưng em ấy vẫn nhìn thẳng lên tôi."
2550 = "Cuốn sổ phác thảo được mở ra.\\nHai đường gạch chéo gạch ngang dòng chữ 'Toa ăn Kết nối'——"
2552 = "Hít thở thật sâu, hai lần, ba lần.\\nDù vậy, giọng nói vẫn còn run rẩy và khàn đặc."
2553 = "Một tiếng thở dài pha trộn đồng đều giữa thất vọng và nhẹ nhõm.\\nChi phí vận chuyển dĩ nhiên sẽ rất khổng lồ, nên đây không phải là chuyện đơn giản."
2556 = "Nếu có thể kết nối với mọi ánh mắt dọc theo tuyến đường,\\nthì chắc chắn sẽ nhìn xa trông rộng hơn cả chị Mayami."
2561 = "Giảm từ hai bếp ga xuống còn một cái. Chỉ với sự cắt giảm đó,\\nđã có thể lắp ráp tất cả các mảnh ghép lại với nhau một cách vừa vặn."
2562 = "Trước câu hỏi đi thẳng vào vấn đề của Fukami, Kisaki mỉm cười——\\nvà đưa ánh mắt dò xét về phía Hibiki."
2564 = "Dù không phải vậy thì bản thân bồn chứa nước cũng chẳng sạch sẽ gì,\\nquan trọng nhất là ấn tượng không tốt."
2572 = "Hãy nhờ bác ấy trở thành thanh ray đầu tiên,\\nkết nối với 'Toa ăn Train' của chúng tôi."
2575 = "Ngắm nhìn \\x%l扇形機関庫;#00ffc040;gara đầu máy hình ngành%l;#; từ bên trong, lùi lại,\\nqua \\x%l転車台;#00ffc040;bàn quay đầu máy%l;#;, rồi lại quay về tuyến chính——"
2596 = "Cảm giác 'tại sao' cũng trỗi dậy mạnh mẽ trong tôi.\\nNên tôi không thể không suy nghĩ về điều đó."
2604 = "Chúng tôi đã nghĩ đến việc chỉ lấy đặc sản của Ohimitera làm nhân vật chính.\\nThậm chí khảo sát cũng chỉ được thực hiện ở Ohimitera."
2605 = "Chúng tôi đã không nhìn thấy. Chỉ Ohimitera. Chỉ những thứ xung quanh.\\nHơn nữa, chỉ những phần nổi bật."
2606 = "Trong tình trạng đã nhận được sự đồng ý nội bộ từ người ra quyết định là Paulette,\\nviệc coi trọng ý kiến của một người thân, một người chị gái đến mức nào."
2607 = "Tất cả những người mà chúng tôi đã bỏ sót——\\nCảm nghĩ của họ có lẽ cũng sẽ giống như vậy."
2608 = "Định kiến về 'toa ăn',\\nvà chính những kiến thức đã tìm hiểu, tích lũy được đã cản trở chúng tôi."
2609 = "Khi chúng tôi ghé thăm \\x%l扇形機関庫;#00ffc040;gara đầu máy hình ngành%l;#; ở Bungomori,\\nkỹ sư lão thành Kimoto lại nồng nhiệt chào đón chúng tôi một lần nữa."
2612 = "Tôi chỉ có thể cười trừ.\\nBản thân chúng tôi cũng đã vô thức làm như vậy——"
2615 = "Tôi gọi tên em ấy, rồi ôm vào lòng.\\nNgay lập tức, ngực tôi nóng ran."
2617 = "Tôi có thể khẳng định.\\nBởi vì Michiko đã làm điều đó cho tôi."
2618 = "Đang vang vọng.\\nTôi và Hibiki, đang hòa làm một bằng ngôn từ, bằng cảm xúc."
2621 = "Bằng đôi bàn tay đang đan vào nhau của tôi và Hibiki,\\nvẽ nên một vòng tròn lớn duy nhất."
2623 = "Tôi gọi tên, chỉ vuốt ve mái tóc em ấy và chờ đợi em ấy bình tĩnh lại."
2625 = "Nhớ về Michiko,\\ntôi cảm thấy đau đớn……và hoài niệm."
2626 = "Tôi bế em ấy lên quá nửa người,\\nđể có thể sưởi ấm cơ thể đang lạnh ngắt kia dù chỉ một chút."
2627 = "Tôi khao khát muốn biến điều đó thành hiện thực cho em ấy,\\nvà cũng cảm thấy vô cùng thảm hại trước sự bất lực của chính mình."
2630 = "Những lời lẽ quan trọng đã bị vùi lấp do vô thức cho rằng chúng có giá trị thấp——\\nnay lại ùa về trong tâm trí."
2632 = "Tôi đã thảo luận với cô Yamazaki và chuyên gia thiết bị nhà bếp\\nmà cô ấy giới thiệu, và đã xem xét một cách triệt để."
2634 = "Tôi không lấy cây bút khỏi tay Hibiki,\\nmà cứ thế đan những ngón tay của mình lên tay em ấy."
2637 = "——Tôi thực sự cảm thấy, họ đúng là chị em.\\nVui sướng, yêu thương. Và cũng cảm thấy một chút cô đơn."
2639 = "Tôi nắm lấy tay Hibiki bằng cả hai tay.\\nĐối diện nhau, đan mười ngón tay vào nhau như những người yêu nhau——"
2640 = "Tôi chạm trán mình vào trán Hibiki.\\nTruyền tải cảm xúc của mình vào giọng nói, cùng với hơi ấm cơ thể."
2643 = "So với những giây phút da thịt kề nhau,\\ntôi cảm nhận được một sự đồng nhất mãnh liệt hơn nhiều——từ tận đáy lòng."
2644 = "Tôi dĩ nhiên là đồng minh của Hibiki.\\nTâm tư của Hibiki. Tâm tư của chị Mayami. Từ đó sinh ra khoảng cách."
2646 = "Khi tôi hướng ánh mắt về phía Paulette, cô ấy lập tức gật đầu đáp lại."
2648 = "Tôi tin chắc rằng nếu là Hibiki thì em ấy sẽ hiểu——\\nvà tôi chỉ tiếp tục nói những lời chân thật."
2650 = "Quãng đường ngắn từ phòng khách về phòng,\\ntôi ôm chặt lấy Hibiki, chầm chậm bước đi."
2651 = "Vì tôi có thể trở thành đôi mắt của Hibiki.\\nCó thể nhận ra trước những điều mà Hibiki suýt bỏ sót."
2654 = "Tôi có thể giúp em ấy mở lại đôi mắt\\nđã nhắm nghiền vì khóc, dù chỉ là hé mở."
2655 = "Sự từ chối đó xuất phát từ sự lo lắng——\\nTôi cảm thấy Hibiki cũng đã hiểu được điều đó."
2656 = "Tôi cảm giác từ đó chính là chìa khóa.\\nCạch một tiếng, suy nghĩ bắt đầu xoay chuyển, xiềng xích trói buộc tôi đã được tháo bỏ."
2661 = "Không chịu nổi sự căng thẳng, Hachiroku đã lấy lý do bảo dưỡng để ra ngoài.\\n——Từ lúc đó đến giờ cũng đã hơn mười phút trôi qua."
2663 = "Là lời nói đã thực sự kết nối——tôi và Hibiki."
2675 = "Nếu đã nhận được sự phê duyệt của giám đốc Paulette,\\nthì thiết bị nhà bếp coi như đã được chốt."
2734 = "Hibiki ngồi im bất động.\\nChỉ biết kiên nhẫn chờ đợi lời nói của chị Mayami."
2736 = "Vừa nấc lên,\\nHibiki cuối cùng cũng ngẩng mặt lên."
2738 = "Có vẻ như Hibiki đã đạt điểm chuẩn\\ntrong bài kiểm tra đột xuất này."
2741 = "Hibiki hăng hái trả lời."
2743 = "Hít mũi sụt sịt,\\nHibiki ho nhẹ một tiếng."
2745 = "Hibiki ngoảnh lại nhìn tôi.\\nTôi mỉm cười và gật đầu mạnh mẽ đáp lại."
2747 = "Hibiki viết lên bản phác thảo.\\nTrông có vẻ ngượng ngùng, nhưng vẫn không hề giấu giếm."
2749 = "Những điều học được từ cô Yamazaki trong bếp.\\nHibiki đã đưa nó ra như một mảnh ghép."
2751 = "Giọng nói như thể bị dồn vào đường cùng.\\nGiọng Paulette giật mình im bặt."
2752 = "Tôi yêu Hibiki.\\nChỉ với suy nghĩ đó thôi, lòng tôi đã tràn ngập."
2755 = "Nhịp thở của Hibiki cũng bắt đầu bình tĩnh lại.\\nNước mắt cũng đã ngừng rơi từ lúc nào."
2758 = "Hibiki thả lỏng cánh tay, giao phó mọi thứ cho tôi.\\nCùng với cảm xúc đó——chúng tôi cùng nhau đưa bút."
2761 = "Sức sống trở lại trong đôi mắt Hibiki.\\nSự lấp lánh mang tên tò mò khiến Hibiki tỏa sáng một lần nữa."
2762 = "Giọng Hibiki đang run rẩy."
2763 = "Giọng Hibiki vang lên rạng rỡ.\\nVới sự rạng rỡ không hề gượng gạo."
2765 = "Gương mặt Hibiki cuối cùng cũng giãn ra."
2766 = "Trước lời của Hibiki, kỹ sư lão thành Kimoto gật đầu sâu sắc đáp lại.\\nVới tư cách là một chính trị gia, quả nhiên Hibiki đang trưởng thành."
2769 = "Hibiki nhìn tôi trong chốc lát.\\nNếu em ấy khó nói, thì để tôi nói thay vậy."
2771 = "Sự kết nối. Việc kết nối. Việc đang kết nối.\\nViệc Hibiki ở bên cạnh tôi."
2772 = "Hibiki khẽ lắc đầu.\\nNgượng ngùng nhìn tôi, em ấy hỏi."
2773 = "Nhưng Hibiki lại mỉm cười nhẹ nhàng và rạng rỡ."
2778 = "Hibiki vẫn đang lặng lẽ khóc.\\nKìm nén tiếng nức nở, em ấy đang chờ đợi lời nói của tôi."
2779 = "Vừa nói, ngón tay Hibiki vừa chuyển động."
2780 = "Đã truyền đạt được rồi. Hibiki cũng tán thành!\\nVậy thì, 'Unzen'. Trước tiên hãy đi nhờ bác Tochigi thôi."
2782 = "Hibiki ngay lập tức lấy tài liệu ra.\\nGọi là tài liệu, nhưng thực chất là cuốn sổ phác thảo như mọi khi."
2784 = "Mình vội vàng quá chăng——\\nTrước khi kịp suy nghĩ, màng nhĩ tôi đã bị chấn động bởi giọng nói bi thương."
2786 = "Và chắc chắn, cả chị Mayami nữa.\\nHãy để chị ấy cùng chúng tôi trải nghiệm chuyến đi tuyệt vời nhất."
2791 = "Giọng kỹ sư lão thành Kimoto xen lẫn sự nhẹ nhõm.\\nKhóe miệng hằn sâu những nếp nhăn từ từ mỉm cười."
2792 = "Kỹ sư lão thành Kimoto chậm rãi——\\nnhìn quanh với ánh mắt có phần hoài niệm."
2800 = "Mỗi người dùng những lời lẽ khác nhau,\\nđể ca ngợi vẻ đẹp của màu xanh mà Hibiki đã tô điểm cho toa xe."
2801 = "Những yêu cầu mạnh mẽ của từng địa phương.\\nNhững điều chúng tôi đã từ bỏ vì nghĩ rằng được lòng người này thì mất lòng người kia."
2802 = "Ví dụ như cá hương.\\nMón nướng muối chỉ phục vụ trong suất ăn kiểu Nhật buổi sáng."
2813 = "Paulette, Kisaki, Fukami——\\ntừ lập trường của mỗi người, họ đều ủng hộ nguyện vọng của Hibiki."
2814 = "Thị trưởng và giám đốc. Vì đã một lòng gánh vác cả hai trọng trách đó,\\nnên đến tận bây giờ vẫn có rất nhiều việc chỉ Paulette mới có thể làm được."
2824 = "Gật đầu mạnh mẽ, Fukami bắt đầu thao tác trên điện thoại.\\nCó lẽ em ấy đang ghi chú lại thứ gì đó."
2828 = "Ngay cả trong cuộc điều tra thử nghiệm có thu phí để đo lường mức độ hài lòng chính xác hơn,\\ncũng phải tổ chức bốc thăm vì có quá nhiều người muốn dùng thử."
2832 = "Mở rộng ra hết cỡ."
2835 = "Nghĩ lại thì.\\nSự nông cạn của chúng tôi đã thể hiện rõ trên thực đơn."
2837 = "Để một ngày nào đó kết nối toàn bộ Kyushu——\\nĐể hòa làm một, và đối mặt với thế giới——"
2839 = "Chiếc 29611 suýt bị tháo dỡ ở thị trấn Shime, vì từng hoạt động tích cực ở Bungomori,\\nnên việc chuyển nhượng miễn phí đã được quyết định một cách suôn sẻ."
2840 = "Bởi vì em ấy muốn lấy ý kiến của một người ngoài Đường sắt Ohito\\nlàm tiêu chuẩn phán đoán cho 'dự án của Đường sắt Ohito'."
2842 = "Nhìn thấy dáng vẻ yếu ớt đó, đến cả tôi cũng cảm thấy bất an khi thúc đẩy em ấy.\\nNếu chị Mayami đã đẩy, chẳng phải tôi nên là người nâng đỡ sao."
2849 = "Hãy cố gắng lên, đúng vậy, bằng phương ngữ Kumamoto——\\nbằng ngôn ngữ của Hibiki và chị Mayami, truyền đạt bằng những lời chân thật nhất."
2851 = "Bàn tay chị Mayami lướt qua ngay phía trên vai Hibiki,\\nvuốt ve mà không hề chạm vào."
2853 = "Chị Mayami đứng dậy.\\nĐôi mắt Hibiki vẫn nhìn chằm chằm vào một điểm không rời."
2856 = "Nước mắt lại rơm rớm\\ntrên đôi mắt Hibiki."
2858 = "Chỉ với hai toa tàu ghép lại,\\nlà toa ăn tự hành chứa đựng tất cả tâm huyết của chúng tôi lúc này."
2870 = "Như đồng điệu với Fukami,\\nngay cả Kisaki cũng gật đầu."
2871 = "Kisaki thốt lên tiếng cảm thán."
2880 = "Dưới hình minh họa đoàn tàu,\\nnhững đường nét được kéo dài ra, xoẹt, xoẹt."
2887 = "Ông lão ngượng ngùng cười bẽn lẽn,\\nrồi mở hộp cơm ra mời chúng tôi ăn thử một miếng nếu thích."
2888 = "Ông lão tươi cười quay lại.\\nTrên tay là hộp cơm và một bình nước giữ nhiệt."
2891 = "Ông lão thoăn thoắt bước đi——a."
2893 = "Nhìn Hibiki có vẻ tự hào một cách hiền hòa,\\nngười kỹ sư già cất giọng vô cùng thán phục."
2895 = "Người kỹ sư lão thành trông có vẻ đang vui vẻ,\\nđột nhiên cúi đầu trước Hibiki."
2897 = "Hơn nữa, chị Mayami đã nói rõ ràng là 'Cố lên'.\\nMột người bảo bọc quá mức và thận trọng như vậy mà lại nói thế."
2899 = "Hiểu được điều đó——\\nchị Mayami dứt khoát đứng dậy và bước ra khỏi phòng."
2900 = "Nghe nói việc sắp xếp di dời, phục chế cũng đã xong,\\ngiờ chỉ còn chờ đưa vào thực tế thôi."
2911 = "Không thể chạm vào cánh bướm.\\nVì vậy, tôi cảm nhận được."
2915 = "Mọi biểu cảm biến mất khỏi gương mặt Hibiki. Khuôn mặt em ấy trở nên trắng bệch."
2920 = "Để lấp đầy khoảng cách đó,\\ntôi nghĩ đây chắc chắn là cơ hội tốt nhất."
2931 = "Vừa nói, một ý nghĩ lóe lên trong đầu tôi.\\nNó lóe lên quá mạnh mẽ khiến tôi không thể sắp xếp lại được."
2932 = "Vừa nói xong, Hibiki đã gật đầu lia lịa."
2935 = "Đọc lên nghe cũng không tệ.\\nTôi tự nhiên gật đầu thật mạnh."
2938 = "Làm em ấy khóc, tôi cảm thấy thảm hại và chợt nhớ ra.\\nRằng bản thân mình thật vô lực——"
2943 = "Gara đầu máy Bungomori vẫn đang hoạt động. Dĩ nhiên là được kết nối với tuyến chính.\\nChuyển ghi từ tuyến chính sang phía gara đầu máy, và cứ thế đi vào trong."
2957 = "Điều đó……có lẽ là vậy.\\nTôi cẩn trọng, hướng lời nói về phía Hibiki."
2958 = "Điều đó cũng khiến tôi vui."
2959 = "Khả năng đó không phải là con số không.\\nVì vậy, cần phải suy nghĩ trước."
2960 = "Ý tưởng đã được tiếp nhận.\\nKỹ sư lão thành Kimoto đã hiểu dù không cần giải thích."
2961 = "Đây là một tiếng thét.\\nMột tiếng thét với giọng điệu rất bình tĩnh, nhưng——đó là tiếng thét của Hibiki."
2962 = "Nghĩ về sự gắn kết.\\nVề mối liên hệ."
2963 = "Đó là lời Hibiki nói trong buổi thảo luận với Kisaki.\\nKisaki và chúng tôi, chúng tôi và thành phố. Tất cả chúng tôi."
2964 = "Như vậy thì không thể trở thành biểu tượng được.\\nViệc kết nối toàn bộ Kyushu cũng chẳng thể nào thực hiện được."
2965 = "Đó quả thực là sự ỷ lại, và là sự ích kỷ."
2967 = "Đó là một điều rất đơn giản."
2969 = "Vậy thì vấn đề dù có lớn đến đâu đi chăng nữa,\\nchắc chắn vẫn nằm trong phạm vi có thể giải quyết được——nhưng."
2971 = "Ở bên cạnh Hibiki gần nhất.\\nDù có chuyện gì xảy ra, dù có thay đổi thế nào đi nữa."
2972 = "Với tư cách là người bên phía kinh doanh du thuyền trên sông Kuma,\\nchắc hẳn em ấy sẽ để tâm đến điều này."
2974 = "Đây——nói một cách khiêm tốn thì là một lời khen ngợi tuyệt vời.\\nMột lời khen ngợi rất đơn giản, hoàn toàn không dính dáng đến lợi ích."
2981 = "Mức độ hài lòng trong khảo sát sau bữa ăn cũng đạt 92% đánh giá 5 sao.\\nPhần còn lại cũng đạt điểm trung bình cao là 4 sao."
2982 = "Cơm nắm là——a, cơm trộn mù tạt.\\nTrong bình nước không phải là trà mà là——"
