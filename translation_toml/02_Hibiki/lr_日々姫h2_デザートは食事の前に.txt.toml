1280 = "Làm việc hết công suất suốt ba ngày trời, cuối cùng cũng được về nhà, cả tôi và Hibiki đều đã lên đỉnh mãnh liệt, tiêu hao hết sức lực——"
1286 = "Phần hạt sần sùi ở phía trần, nơi nhạy cảm của Hibiki, lưỡi tôi không thể chạm tới. Biết vậy nhưng tôi vẫn cứ liếm——"
1288 = "Không phải. Không chỉ là tiếng nước của tôi, Hibiki vừa ngấu nghiến tôi ——vừa tự an ủi bản thân, để cùng nhau lên đỉnh."
1289 = "Nói cách khác, tôi đã bỏ mặc Hibiki trong tình trạng đói khát, và chỉ một mình tôi, ngấu nghiến khoái cảm mà Hibiki mang lại."
1291 = "Không biết có phải do áp lực công việc quá lớn hay không, mà \"Hi-chan\", đôi khi lại bộc lộ khuôn mặt trẻ con đến mức nguy hiểm thế này."
1302 = "Một âm thanh vô cùng thô tục vang lên, phần đầu được giải phóng. Sau đó Hibiki mở to miệng \"A\" một tiếng——"
1304 = "Nhưng không rút ra được. Tôi không còn sức nữa. Vẫn cắm sâu trong Hibiki——tôi ngã xuống người em ấy——"
1317 = "Cùng với sự tăng tốc, tiếng nước mà một mình Hibiki tạo ra cũng trở nên nhầy nhụa hơn. Hơi thở cù vào mũi trở nên gấp gáp, mạnh mẽ, và mùi hương ngọt ngào khiến tôi như nghẹt thở."
1323 = "Hibiki hoàn toàn đang tăng tốc để thúc đẩy tôi xuất tinh."
1337 = "Ý đồ lặp đi lặp lại một việc dai dẳng như vậy đã quá rõ ràng. Nếu đó là điều Hibiki mong muốn, thì tôi cũng chẳng có lý do gì để từ chối."
1339 = "Một nữ thị trưởng chân thành luôn hoàn thành tốt nhiệm vụ, một nhà thiết kế đẳng cấp nhất về các phương tiện đường sắt."
1341 = "Và bàn tay phải vẫn cử động lỏng lẻo——nhẹ nhàng, thật nhẹ nhàng. Như thể đang dỗ dành tinh dịch đang ồ ạt dồn về phía phần đầu."
1342 = "Đây là nếm thử. Hibiki đang triệt để nếm thử tôi. Thi thoảng hơi thở mạnh hơn lại càng làm tăng thêm sự bức bối."
1345 = "Chỉ riêng phần đầu bị mút mát mạnh mẽ và dai dẳng. Đầu lưỡi rửa sạch đến tận rãnh, rồi lại hút mạnh phần đầu lần nữa."
1346 = "Đã trưởng thành xinh đẹp như một \"người phụ nữ trưởng thành tháo vát\"—— Nhưng chỉ trước mặt tôi, em ấy mãi mãi là một thiếu nữ, là cô em gái bé bỏng."
1349 = "Nuốt trọn cho đến khi chạm tới sâu trong cổ họng. Cả lưỡi và môi không hề ngơi nghỉ, vẫn ngoan ngoãn cử động liên tục chỉ để âu yếm tôi."
1351 = "Bị ngửi nhiều đến mức khuôn mặt tôi nóng bừng vì xấu hổ. Mùi cơ thể của Hibiki rất ngọt ngào, dù có nồng hơn cũng chỉ khiến tôi thêm hưng phấn, nhưng mà"
1352 = "Muốn xuất tinh. Sắp xuất tinh. Bị vắt kiệt. Những suy nghĩ mãnh liệt đang rung lên trong cổ họng——nếu thiếu đi khao khát cháy bỏng này."
1357 = "Lực mút mạnh mẽ như thể phần đầu bị cánh cửa tử cung tóm chặt lấy. Tôi cố sức rút ra, nhưng lại bị kéo mạnh vào trong."
1358 = "Ngay khoảnh khắc nhận ra, hông tôi bất giác đẩy tới, Hibiki thoáng bối rối trong giây lát, nhưng ngay lập tức phối hợp theo."
1361 = "Đúng rồi nhỉ. Ngay từ đầu Hibiki đã yêu cầu như vậy. Muốn tôi làm em ấy no bụng bằng thanh năng lượng của tôi."
1363 = "Sự siết chặt và mút mát quá mãnh liệt, không hề cho tôi một giây nghỉ ngơi. Dù Hibiki chắc chắn cũng đã kiệt sức——không."
1365 = "Tôi ngấu nghiến Hibiki, Hibiki ngấu nghiến tôi, và cứ thế, cả hai cùng lúc lao vào nhau."
1379 = "Có vẻ cơn sóng lớn cuối cùng cũng qua đi, không còn nghe thấy tiếng Hibiki nữa. Theo nhịp thở gấp gáp, bụng dưới và chỗ đó cũng nhấp nhô lên xuống."
1388 = "Suy nghĩ của tôi bị xáo trộn bởi sự âu yếm mãnh liệt bằng môi và tiếng nước. Mồ hôi túa ra vì khoái cảm đến nghẹt thở——không, khoan đã——?"
1389 = "Nước bọt nhanh chóng hòa lẫn với dịch nhờn, dịch nhờn bắt đầu tràn ngập trong miệng tôi. Muốn khiến em ấy cảm nhận nhiều hơn, tôi dồn sức làm cứng đầu lưỡi lại"
1394 = "Cùng một cảm xúc, cùng một sự thấu hiểu, cùng một niềm tin. Vì vậy tôi ôm chặt Hibiki. Ôm lấy cả tương lai bên trong em ấy."
1395 = "Sự thấu hiểu cũng hoàn toàn hòa quyện. Tôi cũng muốn xuất tinh ngay bây giờ. Tử cung của Hibiki cũng lập tức cảm nhận được mong muốn của tôi!!"
1396 = "Không chỉ tâm hồn, làn da, suy nghĩ, mà cả sự thấu hiểu—— Nếu có thể hòa quyện tất cả, chắc chắn lần này sẽ thành công!"
1397 = "Tôi chạm mắt với Hibiki. Cả hai cùng mỉm cười. Dù là những chuyện ngớ ngẩn thế này, nhưng có thể thấu hiểu nhau là một niềm hạnh phúc."
1399 = "Khi tôi há miệng, thè lưỡi ra hết cỡ, đôi mắt Hibiki sáng lên vẻ mong đợi."
1400 = "Lời nói \"Xin mời thưởng thức\", được truyền đi khi tôi vẫn đang hôn lên cái miệng bên dưới của em ấy, khiến Hibiki run rẩy trong sung sướng."
1403 = "Nhưng tôi cố chịu đựng——chống lại dục vọng của phần dưới, của cơ thể và linh hồn, không vắt ra tinh dịch, mà vắt ra lời nói."
1404 = "Bị trêu chọc, tinh hoàn căng phồng quá mức, cảm giác cương cứng trở nên tê dại. Phần đầu cứ há ra ngậm lại, thở hổn hển như con cá vàng thiếu oxy."
1407 = "Ngay khi nghĩ vậy, tôi đã ngửi theo phản xạ. Mùi hương nồng nàn và ngọt ngào của Hibiki khiến tôi choáng váng."
1409 = "Hông Hibiki cựa quậy như một đứa trẻ vòi vĩnh, cố nâng người lên. Nâng cao phần kết nối giữa chúng tôi——"
1410 = "Tôi muốn trả lời rằng không sao cả. Nhưng tôi không muốn để miệng ngơi nghỉ. Vậy thì chỉ có một câu trả lời duy nhất."
1413 = "Muốn nới lỏng ra để nói chuyện, nhưng hông và cơ thể không chịu dừng lại. Điều đó chứng minh rằng giả thuyết của tôi là đúng——"
1415 = "Nỗi sợ bị trêu chọc dồn nén lời muốn nói xin em hãy nới lỏng ra. Thà cứ thế này mà xuất tinh, dù có khó coi, còn hơn là bị quay lại trạng thái đó——"
1417 = "Tôi móc môi trên vào âm vật, rồi búng nhẹ. Ngay lập tức, một tiếng rên rỉ lớn phát ra từ cổ họng Hibiki."
1418 = "Tôi vươn lưỡi ra hết cỡ, liếm láp khắp lối đi ẩm ướt nhầy nhụa bên trong."
1420 = "Tôi ngã xuống theo sự dẫn dắt của Hibiki. Áp cơ thể mình lên cơ thể em ấy."
1423 = "Vì vậy, tôi vòi vĩnh. Vứt bỏ lòng tự trọng của một người anh, một người chồng, chỉ như một con đực đang bị bỏ đói tình dục."
1425 = "Vì vậy, hông, cơ thể, tâm hồn tôi tự động tăng tốc, chẳng liên quan gì đến ý chí."
1426 = "Khi tôi áp phần đầu vào, cửa mình của em ấy cũng phát ra những lời tương tự. 『Nhanh lên nhanh lên』, 『Đâm vào đi đâm vào đi』, chỉ toàn là những lời đó."
1430 = "Tinh dịch bị trêu chọc, thiêu đốt đến sôi sục, bị lắc lư dữ dội bên trong, càng làm tăng thêm mật độ."
1432 = "Vì vậy tôi đáp lại. Dồn sức vào đôi tay đang nắm chặt đùi em ấy, cố gắng không rời khỏi tử cung, tôi nhấp từng nhịp, từng nhịp nhỏ."
1433 = "Và rồi lần này, chúng tôi mới thực sự, thưởng thức bữa ăn đầu tiên trong ngày."
1434 = "Đằng nào cũng vậy, tôi muốn em ấy lên đỉnh với khoái cảm tột độ. Nên tôi rút lưỡi ra, dùng cả hai môi ngậm lấy âm vật——"
1436 = "Dù bốc mùi nhưng lại có vẻ ngon. Hibiki đã đánh giá như vậy. Thế thì chẳng có gì phải xấu hổ hay e ngại cả."
1472 = "Kiệt sức vì làm việc liên tục. Hibiki đã ngủ thiếp đi trước khi về đến nhà. Nếu được, tôi muốn để em ấy nghỉ ngơi luôn——!?"
1474 = "Hibiki, người hiểu rõ tôi đến từng chân tơ kẽ tóc, dùng một lực không thể nào xuất tinh được, liên tục truyền khoái cảm vô tận vào phần dưới và tinh hoàn của tôi."
1475 = "Không còn thốt nên lời, chỉ biết giật nảy người và đầu rung lên bần bật, chỗ đó của Hibiki đầm đìa, ướt sũng dịch nhờn như đang tan chảy."
1478 = "Em ấy há miệng ra báo cáo rằng đã uống hết sạch, và nở một nụ cười vô cùng rạng rỡ, hạnh phúc."
1480 = "Đôi môi có lẽ còn nắm rõ chiều dài của tôi hơn cả chính tôi, rút ra cho đến khi hôn lên lỗ sáo, nhưng ngay lập tức,"
1481 = "Đầu của tôi được hôn lên, và chỉ chỗ đó bị hút mạnh. Giống như hút phần kem từ chiếc bánh su kem——!?"
1483 = "Đầu lưỡi luồn lách vào lỗ sáo đã thở hổn hển từ nãy đến giờ, trong khi vẫn luồn vào đó, đôi môi tiếp tục siết chặt và trượt dọc."
1486 = "Hibiki nhẹ nhàng vuốt ve lưng tôi đang đè lên em ấy. Vuốt ve phần bụng dưới của em ấy qua tấm lưng của tôi——ngay trên tử cung."
1488 = "Hibiki quấn lấy tôi nũng nịu. Vui thì vui thật, nhưng thêm một hiệp nữa thì——"
1489 = "Không hề chạm ngón tay vào thắt lưng hay cúc quần, Hibiki chậm rãi, cẩn thận kéo khóa quần xuống."
1492 = "Hibiki hít một hơi thật sâu, thật sâu bằng mũi——hít trọn lấy mùi hương."
1493 = "Từ ô cửa nhỏ xíu giữa đũng quần lót bên dưới lớp khóa kéo chật hẹp, Hibiki khéo léo lôi phần dưới đã cứng ngắc của tôi ra."
1495 = "Lấy môi che nhẹ hàm răng, Hibiki cắn nhẹ nhàng, từng chút từng chút một đưa phần dưới của tôi vào trong miệng."
1498 = "Hibiki dùng mũi, dùng đầu mũi để vuốt ve thăm dò phần dưới của tôi. Sự âu yếm bằng sụn mũi khác thường này làm tăng độ cứng của phần đang cương cứng."
1500 = "Phần đầu của tôi bị trói chặt ở cửa tử cung của Hibiki. Bị mút chặt, giữ chặt và cựa quậy trong trạng thái đó."
1502 = "Bên trong Hibiki tự động co thắt và mút chặt lấy. Với sự mãnh liệt chưa từng có, nó liên tục co bóp mời gọi tôi vào sâu hơn."
1503 = "Dịch nhờn của Hibiki bắn lên mặt tôi nhưng tôi không rời ra,"
1506 = "——Để toàn bộ tinh dịch chảy vào tử cung, để làm no căng bụng, hông Hibiki ngoan ngoãn chuyển động."
1508 = "Lưỡi của Hibiki liếm láp toàn bộ phần đầu, men theo gốc xuống tận cùng, cả mặt trên lẫn mặt dưới, không bỏ sót chỗ nào."
1509 = "Hibiki mỉm cười. Một nụ cười mộc mạc trên khuôn mặt nhễ nhại mồ hôi và rối bời."
1511 = "Hibiki nằm ngửa trên giường. Phơi bày bầu ngực đáng yêu, như thể đang phô ra chỗ đó ướt sũng trần trụi."
1513 = "Hibiki run rẩy. Không chỉ cổ họng, mà toàn thân em ấy đều co giật. Niềm vui sướng vì được cùng nhau lên đỉnh càng tiếp thêm lực đẩy cho tinh dịch!!"
1517 = "Bị vắt kiệt đến giọt cuối cùng——phần đầu nhẹ nhàng được giải phóng."
1519 = "Sự mong đợi được em ấy ăn, được ngậm lấy bị dập tắt phũ phàng, nhưng đầu lưỡi của Hibiki lại biến ngay cả sự bất mãn đó thành khoái cảm."
1536 = "Đợi chờ cũng vô ích. Bên trong Hibiki đã hoàn toàn run rẩy, cứ để mặc thì em ấy cũng sẽ lên đỉnh thôi. Vậy thì,"
1542 = "Món tráng miệng là một nụ hôn. Vô cùng ngọt ngào và dính nhớp."
1543 = "Nghĩa là Hibiki cũng sắp sửa lên đỉnh bằng cách tự thủ dâm. Sự an tâm, cảm giác hòa làm một đó càng làm khoái cảm dâng trào tột độ!"
1553 = "Đầu ngón tay, hơi thở, và đầu mũi chạm vào khiến tôi râm ran. Cảm giác dễ chịu tột cùng, vì thế mà dục vọng càng bị thổi bùng lên."
1554 = "Sự kích thích bằng lưỡi mà tôi hằng mong đợi. Nhưng nó nhanh chóng rụt lại trong nụ cười của em ấy."
1556 = "Phần hạt sần sùi nhạy cảm ở mặt nông phía bụng mà lưỡi không chạm tới được. Chỉ mới cọ xát vài cái, Hibiki đã ướt đẫm nhầy nhụa."
1566 = "Máu bắt đầu dồn về phía dưới ngay lập tức, Hibiki cất giọng vui sướng."
1567 = "Tinh dịch với cảm giác trào ra khỏi lỗ sáo hoàn toàn giống như thạch uống. Lượng tinh dịch tích tụ quá nhiều, bị thiêu đốt và cô đặc đến mức tối đa——"
1568 = "Hibiki vừa được đặt xuống giường bỗng trượt xuống và bò lại gần. Khuôn mặt ngái ngủ nhưng không chút do dự, tiến về phía tôi…… hay đúng hơn là giữa hai chân tôi."
1572 = "Vừa dứt lời, ánh mắt Hibiki bỗng trở nên dịu dàng——!?"
1573 = "Nhắc mới nhớ, hai ngày——hay ba ngày rồi nhỉ? Tôi chưa hề tắm rửa gì cả. Bị ngửi thế này thì xấu hổ chết mất. Chắc Hibiki cũng thế thôi nhưng mà"
1579 = "Dù đã ở cạnh Hibiki suốt ba ngày trời, nhưng vì công việc bận rộn và mệt mỏi, tôi chưa từng xuất tinh lần nào."
1580 = "Bàn tay chạm đến. Nhưng lại rất nhẹ nhàng——thực sự rất lỏng lẻo. Khuấy động tinh dịch đang tích tụ bên trong, chứ không phải vắt kiệt."
1583 = "Việc cất lời cũng thật khó khăn, tưởng chừng như giọng nói sắp vỡ vụn, nhưng tôi vẫn cố gắng——trộn lẫn giọng nói vào những tiếng thở dốc vì khoái cảm."
1588 = "Chầm chậm, nhưng chắc chắn, phần dưới của tôi đang bị ăn mất. Khoái cảm rỏ giọt, và cảm giác hạnh phúc thậm chí còn che lấp cả khoái cảm đó."
1590 = "Ngay khoảnh khắc chạm vào, Hibiki đột ngột tăng tốc. Em ấy lắc đầu tới lui thật nhanh, bắt đầu vắt kiệt tinh dịch của tôi!!!"
1594 = "Phần đầu của tôi hôn lên sâu trong cổ họng Hibiki——!!!?"
