2215 = "「Nếu cứ mặc đồ để lộ thân phận Railord, người ta có khi lại tưởng bọn Reina đang ăn đồ thật trong quán cà phê mất ạ.」"
2217 = "「Nếu là chơi trò quán cà phê với anh, Hibiki vừa được trông nom, vừa có thể trưởng thành một cách an toàn.」"
2219 = "「Cánh sẽ bị biến dạng. Cứ thế mà cứng lại. Tệ hơn nữa, nó sẽ vĩnh viễn không thể bay được.」"
2220 = "「Hoàn toàn không có vấn đề gì——nhưng……ra vậy. Vị trí tủ lạnh cũng phải tính đến luồng di chuyển nữa nhỉ.」"
2222 = "「Thật thất lễ. Thưa quý khách.」"
2229 = "「Cháu xin lỗiiii.」"
2230 = "「Ra vậy……là gió. Là ý dân.」"
2231 = "「Với Sou-chan thì vậy thôi. Nhưng với Hii-chan thì…… Hii-chan, vẫn luôn……rất cố gắng mà.」"
2232 = "「Được ở bên cạnh Hibiki, anh rất hạnh phúc. Một lần nữa cảm nhận được điều đó một cách mạnh mẽ——anh thực sự rất vui.」"
2235 = "「Chuyện nhỏ nhặt——rốt cuộc là chuyện gì vậy ạ?」"
2237 = "「Chuyện nhỏ thôi. Bé ngoan, bé ngoan, bé ngoan, bé ngoan. Hibiki là bé ngoan. Bé ngoan vô cùng đáng yêu.」"
2241 = "「Chính là order đó.」"
2246 = "「Chỉ còn thiếu đúng một mảnh ghép nữa thôi. Hạnh phúc——hạnh phúc của chính bản thân em.」"
2252 = "「Từ hồi còn nhỏ xíu! Từ lúc chơi trò quán cà phê với anh hai cơ.」"
2255 = "「Gì vậy Sou-chan? Chuyện vui hả??」"
2259 = "「Có lẽ là vậy đó.」"
2260 = "「……Vương vấn, sao. Chắc là vậy rồi. Dù chưa một lần nào, được ngài ấy nhìn nhận như một người phụ nữ.」"
2262 = "「Đã không biết bao nhiêu lần em nghĩ rằng em yêu anh hai. Cảm giác hạnh phúc khi được ở bên nhau lan tỏa từ tận trong bụng.」"
2264 = "「Em xin phép——(Ngoạm)——Ưm~!!」"
2267 = "「Anh cũng vậy. Anh cảm nhận được từ tận sâu trong cơ thể.」"
2268 = "「Em cũng, giống vậy——(Chụt)」"
2269 = "「Em sẽ giúp một tay ạ.」"
2270 = "「Dù biết rằng được công nhận là một điều gian khổ——」"
2272 = "「Chắc là vậy rồi.」"
2273 = "「Con muốn ăn than đá cơ!」"
2275 = "「Tôi giữ cho. Nếu bỏ vào hộp đựng vé, thì chắc chắn sẽ không làm mất đâu.」"
2276 = "「Đã rõ ạ. Xin ngài hãy cẩn thận.」"
2279 = "「Không phải vẫy tay mà là triển lãm ảnh cơ! Tớ muốn có cả ảnh kỷ niệm xuôi dòng sông Kuma nữa.」"
2280 = "「Em định lấy sữa và trứng……thật sự, xin lỗi anh.」"
2283 = "「Không phải là tên, mà là phương pháp. Cuộc thi——hay là chúng ta kêu gọi đóng góp công khai đi?」"
2284 = "「Trực tiếp thì chưa——nhưng trên phim ảnh thì anh từng thấy vài lần rồi.」"
2288 = "「Hibiki của anh là tuyệt nhất. Lúc nào cũng cố gắng hết mình, vẽ ra những bức tranh tuyệt vời nhất thế giới, là một bé ngoan tuyệt vời nhất.」"
2290 = "「Chị thì, thấy rồi đấy. Rất nhiều lần, khoảnh khắc con bướm lột xác.」"
2291 = "「Đi tàu! Quay lại!」"
2293 = "「……Làm việc trong nhà bếp toa ăn đúng chuẩn, hình như là——」"
2294 = "「Em nghĩ đó là một quyết định sáng suốt ạ.」"
2295 = "「Này? Anh hai, lại đây đi? Ghé sát mặt vào em đi?」"
2299 = "「Thứ em nhìn nhận lại được, chính là những gì em đang thấy bây giờ. Những thứ phản chiếu trong mắt anh hai, và cả trong mắt em nữa.」"
2302 = "「Hoặc là, có thể làm cho hệ thống thông gió mạnh lên được không?」"
2304 = "「Chính vì vậy, để trà trộn vào con người mà không bị chú ý, chúng em đã hóa trang ạ.」"
2305 = "「Vậy nên, hãy kể cho em nghe đi? Cho em thấy đi? Tất cả những hạnh phúc mà hôm nay anh hai đã tìm thấy.」"
2307 = "「Vì thế, tuyệt đối không được chạm vào bướm đang lột xác. Đó cũng là để bản thân mình không phải hối hận.」"
2312 = "「Xin phép ạ. Tôi mang món quý khách đã gọi đến rồi đây.」"
2313 = "「Xin lỗi. Đã để cô phải đợi rồi.」"
2318 = "「Trả lễ đây, Hibiki. Nào, a——」"
2328 = "「Hibiki.」"
2329 = "「Hibiki thì——」"
2331 = "「Hibiki hiện giờ——」"
2332 = "「Hibiki? A——nào.」"
2334 = "「Hibiki, khi nấu nướng xong xuôi, anh nghĩ mình nên chuyển sang khu vực ghế ngồi ngay.」"
2338 = "「Chính vì là Railord nên thời gian buổi sáng mới quý giá chứ. Bắt cô phải đợi chỉ để hỏi một chuyện nhỏ nhặt, thật ngại quá.」"
2339 = "「Chào buổi sáng Hachiroku.」"
2341 = "「Đã rõ ạ. ……Có order! SL, Takana, Sekikara.」"
2343 = "「Hiểu rồi. Vậy thì, một tiếng nữa tập trung lại nhé. Vé chờ thì sao? Ai giữ đây?」"
2345 = "「Đã rõ. Cắt gì nào?」"
2346 = "「Đã rõ ạ.」"
2348 = "「Những thứ phản chiếu trong mắt anh và Hibiki sao?」"
2350 = "「Hai người nè! Nhìn là biết rồi mà!」"
2353 = "「Đúng vậy. Dù không có ác ý……hay có thiện ý đi nữa. Thì đó vẫn là một việc đáng thương, không được phép làm.」"
2356 = "「Đúng vậy. Sáng suốt. Vì sáng suốt nên——」"
2358 = "「Đúng vậy. Vui thật.」"
2361 = "「Đúng vậy. Ở giai đoạn này thì nên thất bại càng nhiều càng tốt. Chỉ cần cẩn thận đừng để bị thương, rồi cứ thế mà làm thôi.」"
2362 = "「Đúng nhỉ. Dù thực tế việc sơ chế sẽ được làm trước khi hành khách lên tàu—— nhưng mùi và hệ thống thông gió……luồng không khí cũng rất quan trọng.」"
2363 = "「Đúng vậy nhỉ.」"
2364 = "「A, ừm! Nếu vậy, anh cũng.」"
2366 = "「Đúng nhỉ, nó sẽ chiếm trọn hơn một nửa toa xe tự hành hạng 18 mét.」"
2369 = "「Đúng vậy nhỉ, trước tiên là 'Mời mọi người xơi cơm' đã.」"
2371 = "「Đúng vậy, bến thuyền xuôi dòng sông Kuma cũng là ga mà~ Triển lãm tranh ảnh, tớ cũng muốn được kêu gọi đóng góp quá~ Liếc.」"
2372 = "「Vậy sao. Nếu thế thì, người đắp chăn cho chúng tôi là」"
2374 = "「Vâng. Nếu là em, khi nhận ra, em sẽ nhẹ nhàng đánh thức hai người dậy ạ.」"
2376 = "「Vâng, hai người ạ.」"
2377 = "「Là cái chăn. Chỉ để xác nhận thôi—— không phải cô đắp cho chúng tôi, đúng không?」"
2378 = "「Vâng!」"
2380 = "「Vâng, tôi đến ngay.」"
2383 = "「Ba nhóm đầu tiên là 30 phút sau. Nhóm tiếp theo là 60 phút sau.」"
2386 = "「Hiện tại quán đã kín chỗ. Thành thật xin lỗi quý khách. Nếu được, tôi sẽ phát vé chờ cho quý khách.」"
2395 = "「Kính chào quý khách. Hai vị phải không ạ?」"
2396 = "「Kính chào quý khách. Đã để quý khách phải đợi lâu——a.」"
2397 = "「Kính chào quý khách.」"
2407 = "「Cái chăn, là chị Mayami đắp cho em đúng không. Cảm ơn chị. Nhờ vậy mà em không bị cảm.」"
2409 = "「Cô Nagayama.」"
2410 = "「Không có gì đâu. Quan trọng hơn, Hibiki này, về biệt danh của quán cà phê.」"
2411 = "「Không sao đâu. Anh đang dùng dao bào mà…… nhưng——à, ra vậy, tủ lạnh à.」"
2412 = "「Vâng ạ——ưm.」"
2413 = "「Đã rõ.」"
2414 = "「Vẫn chưa nghĩ ra được cái tên nào ưng ý nhỉ.」"
2415 = "「Không sao đâu. Sou-chan cứ bình tĩnh ngồi đó, và đợi Hii-chan đi nhé?」"
2423 = "「Chị Paulette không đi cùng đâu nha~」"
2428 = "「Làm theo công thức mà ngon được đến mức này sao—— Quả nhiên……cô Yamazaki cũng là người có thực lực.」"
2434 = "「Chưa hiểu, là hiểu cái gì cơ.」"
2437 = "「Bây giờ hãy trở lại làm em gái——không, người yêu của anh đi. Anh muốn cùng Hibiki thưởng thức bữa ăn này.」"
2438 = "「Bây giờ cũng chưa muộn đâu!」"
2441 = "「Chắc là không thể làm vách ngăn giữa khu vực ghế ngồi và nhà bếp được nên…… có lẽ sẽ không dùng được những nguyên liệu có mùi hoặc gây kích thích đâu.」"
2442 = "「Vì quán chúng tôi có đầy đủ các món ăn mà bất cứ ai từ người lớn đến trẻ em đều có thể thưởng thức ạ.」"
2443 = "「Toa xe lại không mở cửa sổ được nữa…… Đúng nhỉ, cũng phải tính đến chuyện đó.」"
2444 = "「Có chứ.」"
2446 = "「Khách đông thật đấy. Đừng có cố quá nhé?」"
2449 = "「Nhộn nhịp quá nhỉ!」"
2452 = "「Thật sự! Một vẻ ngầu rất khác so với bình thường.」"
2453 = "「Thật ạ? Em cũng muốn ăn~」"
2455 = "「Thật nè. Nagi cười tươi rói luôn! Thích ghê, cái này, tớ cũng muốn làm ở chuyến xuôi dòng sông Kuma nữa.」"
2458 = "「Chị Mayami.」"
2460 = "「Chị Mayami, có lẽ đã bảo bọc em quá mức đấy.」"
2462 = "「Hoàn thành chuyến tàu ăn uống. Để em, có thể thực sự trở thành một người độc lập.」"
2468 = "「Vé chờ nhỉ. Tất nhiên là tôi sẽ lấy rồi. Ô, 60 phút sau sao. Tính sao đây, Paulette?」"
2469 = "「Chỉ đúng một lần. Vì em đã hăng hái quá mức.」"
2470 = "「Này này, sau lần đó…… Rốt cuộc chị ấy chẳng làm khách hàng của em thêm lần nào nữa.」"
2475 = "「Hơn nữa, những gì cô ấy nói cũng rất hợp lý. 'Nhà bếp thì chỉ có bắt tay vào làm mới quen được' sao.」"
2478 = "「Giả sử như, có nguy hiểm xen lẫn vào đó thì——」"
2479 = "「Này nhé? Anh hai?」"
2481 = "「Được quý khách khen ngợi, quả là vinh hạnh.」"
2483 = "「Cà tím, cà chua và đậu bắp. Sau đó là hành tây băm nhỏ. Còn lại là chikuwa~」"
2484 = "「Công thức……ghi rất chi tiết——ngoạm——mà. Ví dụ như 'Làm ráo nước từng loại rau củ một'——ưm——đó.」"
2487 = "「SL, Takana, Sekikara, đã nhận.」"
2489 = "「Cà ri SL! Nagi đại nhân đã mong chờ lắm đó nha!」"
2493 = "「Quá trình bướm lột xác——em đã từng thấy chưa?」"
2495 = "「Cơm Hachikuma kiểu Tây và bánh pancake vẽ tranh. Thêm cả pudding KiHa 07S và bánh macaron nữa.」"
2502 = "「Phải có hai người trong bếp mới có ý nghĩa chứ. Anh hai cắt rau củ giúp em được không?」"
2503 = "「Nước lạnh, đã rõ ạ. Tôi sẽ mang ra ngay.」"
2505 = "「Quý khách muốn thanh toán ạ, xin đợi một lát.」"
2515 = "「30 phút sau mới có chỗ. Tính sao đây? Shou-chan.」"
2516 = "「Hai vị đã chọn xong món chưa ạ?」"
2517 = "「Chúc quý khách ngon miệng.」"
2518 = "「Cảm ơn cô.」"
2519 = "「Đã để quý khách phải đợi. Ba người phải không ạ?」"
2520 = "「Đã để quý khách phải đợi lâu.」"
2529 = "「Trong lúc đó em sẽ chuẩn bị bánh pudding——kya!?」"
2550 = "「V-vậy sao——anh hiểu rồi.」"
2551 = "「Được đó! Đâu phải chỉ có ga đường sắt mới là ga đâu!」"
2552 = "「Tuyệt vời đến mức không nghĩ đây là làm thử luôn đấy. Thực đơn cần phải thành thạo vẫn còn nhiều lắm sao?」"
2553 = "「Thưa quý khách. Bạn đi cùng của ngài.」"
2554 = "「Đã để quý khách phải đợi. Hiện tại, thật xin lỗi nhưng quán đã kín chỗ rồi ạ.」"
2555 = "「Làm sao mà thừa thãi được chứ.」"
2556 = "「Món dầu diesel này cũng……đúng là dầu diesel nhỉ. Giống đến mức em còn phải do dự không biết có nên uống hay không.」"
2557 = "「Thế này……trông hoành tráng quá nhỉ.」"
2558 = "「Vậy à. Thế thì, mình đi tàu Gamadas rồi quay lại nhé?」"
2559 = "「Như thế thì Hibiki sẽ không trưởng thành được. Nếu chị Mayami ở gần——chúng ta sẽ ỷ lại mất.」"
2560 = "「Đây là quán cà phê Gamadas—— à không, là quán cà phê ga Ohimitera sao.」"
2561 = "「Tôi xin phép dọn dĩa này ạ.」"
2562 = "「Mời đi hướng này.」"
2563 = "「Ngon đến thế cơ à? Để xem nào——(Ngoạm)——Ồ!」"
2564 = "「——Từ tận lúc đó sao.」"
2565 = "「Ngay cả một món đồ vật như em mà còn thế này. Chị Mayami……chắc hẳn phải đau lòng đến nhường nào.」"
2567 = "「Vẫn chưa được. Gần hơnnn nữa. Nhé? Xong rồi, xoa đầu khen em là bé ngoan, thật nhiềùu vào nhé?」"
2568 = "「Hơn nữa, là khi Hibiki rời khỏi vị trí nhân viên, và trở thành một vị khách.」"
2569 = "「Chắc vẫn ngủ thêm được một tiếng nữa nhỉ.」"
2570 = "「Thêm cả các nhân viên nữ phụ trách thu ngân và bưng bê nữa nhỉ. Nghe nói các cô gái không được vào bếp, nhưng mà……」"
2572 = "「Mảnh ghép đó chắc chắn đang đợi Hibiki. Vì vậy chúng ta không cần vội vàng, cứ bước đi trên con đường hiện tại là được.」"
2574 = "「Vậy thì, nhân tiện luyện tập luôn, làm 2.5 suất nhé?」"
2577 = "「Hồi đó…… Anh cũng không hiểu được, nhưng mà.」"
2578 = "「Vậy thì, gửi quý khách vé chờ này.」"
2581 = "「Còn anh hai thì sao? Có chuyện gì không? Chuyện hạnh phúc của chính anh hai ấy.」"
2582 = "「Vậy thì, xin mời quý khách ngồi ở đây.」"
2583 = "「Anh——Anh Migita, nhờ anh nhé!」"
2585 = "「Này? Anh thấy chứ? Cả anh hai nữa, thấy được em đang hạnh phúc đến nhường nào.」"
2587 = "「Không sao chứ!!? Anh hai, em xin lỗi!」"
2590 = "「Anh hai là bé ngoan. Rất nỗ lực. Cái gì cũng học được ngay, một bé ngoan rất thông minh.」"
2591 = "「Làm thôi nhỉ? Anh hai.」"
2593 = "「Anh hai, xin lỗi nha! Anh đưa em đi ngủ đấy à?」"
2595 = "「Anh hai? Rau củ kìa.」"
2596 = "「Tất cả đều quan trọng như nhau, là những yếu tố bắt buộc phải thỏa mãn ——nhưng chúng tuyệt đối không phải là mục đích của khách hàng.」"
2597 = "「Tuy đáng tiếc, nhưng nếu chỉ nghĩ đến chuyện chuyến tàu ăn uống, thì không đi cùng nhau lại tốt hơn chứ nhỉ?」"
2598 = "「Anh Soutetsu. Chúng tôi lại đến rồi. Có hơi sớm quá không?」"
2602 = "「Hibiki phụ trách món dầu diesel nhé.」"
2604 = "「!」"
2606 = "「Okay. Đáng tin cậy đấy.」"
2799 = "Chắc chắn sẽ làm được. Tôi muốn như vậy."
2801 = "Vừa nói xong, Hibiki liền hiểu ngay."
2807 = "Thế nhưng, thái độ tự lập của Hibiki hiện tại, không phải là kiểu bướng bỉnh như vậy."
2808 = "Dù vậy, tôi có cảm giác như vô vàn điều——không thể nói thành lời, rất rất nhiều điều, đã được truyền đạt từ Hibiki."
2809 = "Nhưng vòng quay bàn cũng vì thế mà giảm xuống."
2811 = "Không, chuyện này…… có lẽ không phải đang nói về \"bướm\"."
2813 = "Không, cả hai cùng—— mớm cho nhau những lời nói, những thìa cà ri. Và cả những tâm tư tình cảm."
2819 = "Giờ thì, tôi có cảm giác mình đã hiểu ra."
2824 = "Hôm nay quả nhiên người đó vẫn không đến quán. Có lẽ là do sự \"bảo bọc quá mức\" không hề thay đổi."
2830 = "Nghe thì đúng là vậy. Vì là quán cà phê của Gamadas, nên gọi là quán cà phê Gamadas."
2836 = "Ngày xưa thì thường xuyên nghe thấy—— nhưng bây giờ không hiểu sao lại cảm thấy có chút hoài niệm."
2839 = "Và rồi, rất nhiều khách hàng nữa. ——Mỗi khi kể đến, Hibiki lại mỉm cười rạng rỡ."
2841 = "Thế nhưng, tôi đã thay đổi. Tình yêu tràn ngập trong lồng ngực, đến mức khiến tôi nghẹn lời."
2845 = "Chỉ bằng đôi môi chạm nhau. Tôi và Hibiki, truyền đạt cho nhau."
2854 = "Chỉ riêng việc đảm bảo có đủ \\x%lディーゼル気動車;#00ffc040;toa xe diesel tự hành%l;#; làm \\x%l種車;#00ffc040;toa xe nguyên bản%l;#; đã là dốc hết sức rồi. Làm sao tìm được xe cấp điện có thể nối vào chứ."
2859 = "Chỉ cần nhìn thấy khuôn mặt đó là tôi thấy nhẹ nhõm. Đại tiền bối làm việc trên toa ăn——a, không phải!"
2861 = "Vượt qua gian khổ thì niềm vui khi đạt được mới lớn lao. Cảm giác đó, tôi cũng phần nào hiểu được."
2872 = "Quả nhiên là hai người họ, hiểu ngay tình hình."
2873 = "2.5 suất cà ri mỏ quặng, cùng với một phần pudding và một chiếc bánh pancake."
2874 = "Một nhóm vào quán trước, sau đó một nhóm khác mới vào."
2877 = "Hachiroku, Reina. Nagi, Fukami. Paulette và Kisaki. Phu nhân Nagayama."
2879 = "Hachiroku mặc áo blazer. Reina thì mặc đồng phục thủy thủ."
2881 = "Mọi thứ khác đã chuẩn bị xong xuôi, nhưng dù đã qua cuộc họp ở cửa hàng đường sắt, biệt danh để tạo ấn tượng cho việc mở cửa lại vẫn chưa được quyết định."
2903 = "Và rồi, cuối cùng—— con bé cất giọng nghe như vừa ngạc nhiên, vừa trìu mến."
2912 = "Chỉ cần nhìn những chuyển động đó thôi, đã có rất nhiều điều in vào tâm trí tôi."
2914 = "Những người am hiểu sâu sắc về đường sắt, chắc chắn không mong muốn việc tất cả mọi người cùng rời khỏi nhà ga."
2916 = "Dù vậy, tôi vẫn bị đánh bại bởi sự gia tăng nhiệm vụ."
2918 = "Nhưng vì ra về cùng lúc nên thời gian lưu lại quán sẽ dài hơn, gây áp lực cho những khách hàng đang xếp hàng chờ."
2920 = "Thế mà, thời gian cao điểm không những chưa kết thúc——"
2922 = "Chắc hẳn chị ấy đã thốt ra một giọng nói vô cùng bi thương. Khuôn mặt Hachiroku dần trở nên bất an."
2924 = "Có lẽ nhờ vào triển lãm bảng và triển lãm trên bàn. Mà không hề nghe thấy lời phàn nàn nào về việc lên món chậm."
2928 = "Đĩa cà ri đã sạch bách, tiếp theo là——"
2930 = "Ngay cả khoảnh khắc né người, khay vẫn giữ được thăng bằng. Ngay khi trở lại tư thế cũ, cô ấy đã đưa mắt nhìn bao quát xung quanh."
2933 = "A, nếu được nhìn thấy khuôn mặt này, thì chút ngượng ngùng cũng chỉ là cái giá quá rẻ."
2936 = "Ừm, quả nhiên là vậy. Giọng Kumamoto vẫn hơn giọng phổ thông. Khuôn mặt vỡ òa vì vui sướng vẫn đáng yêu hơn là khuôn mặt nghiêm nghị."
2942 = "Do dung tích tủ lạnh có hạn, nguy cơ ôi thiu cao, nên món này được chế biến ngay tại chỗ theo từng đơn đặt hàng."
2943 = "Hibiki quan trọng hơn bất kỳ ai khác. Bởi vì tôi cũng có được suy nghĩ đó từ tận đáy lòng."
2944 = "Bởi vì những mảnh ghép đó, có thể sẽ bù đắp được những gì đôi mắt Hibiki bỏ sót."
2945 = "Vì từ giờ trở đi là giờ ăn trưa—— sẽ bước vào thời gian cao điểm."
2947 = "Những nhận thức có được khi làm phục vụ, chắc chắn sẽ giúp ích cho việc thiết kế của Hibiki."
2955 = "Vừa cưng nựng, con bé vừa xoa nắn má, sau tai, trán và cả mái tóc của tôi."
2957 = "Không phải là cố rướn người lên như hồi dậy thì. Mà là nuôi dưỡng bản thân hiện tại, để dần trở thành người lớn."
2960 = "Cả hai đều không phải là đồng phục được học viện chỉ định."
2961 = "Ánh mắt như đang theo dõi những đứa trẻ chơi trò bán hàng—— hoặc là, một sự ngưỡng mộ thuần túy."
2963 = "Bên mép dính vụn than đá——chỉ có thể nhìn ra như vậy dù đó là vụn bánh Pirozhnoe Kartoshka."
2964 = "Một giọng nói ấm áp. Đến mức khiến tôi cảm thấy đôi chút ghen tị với chị Mayami."
2967 = "Tròn xoe như quả bóng bay, cứ như thể bụng đang to ra vậy——!!?"
2968 = "Con bé lại sửa sang giọng phổ thông rồi."
2971 = "Hai chân vung vẩy. Dù không được lịch sự cho lắm, nhưng lại rất đáng yêu."
2972 = "Tiếng hét quá đột ngột, khiến cổ họng tôi nghẹn lại trong chốc lát."
2975 = "Tình hình đã đến mức phải dùng đến vé chờ, giọng Hibiki cũng trở nên phấn khích."
2976 = "Nếu muốn thưởng thức bữa ăn hơn bất cứ thứ gì, thì người ta đã đến nhà hàng rồi."
2978 = "Nếu chỉ cần sự an toàn nhất, thì chẳng cần phải đi du lịch làm gì."
2987 = "Khi thử làm theo, cơ thể tôi mới hiểu được mọi động tác của cô Nagayama hợp lý đến mức nào."
2994 = "Dù chị Mayami có đến cũng không sao. Sẽ không hề bối rối. Để thể hiện điều đó bằng hành động, Hibiki đang không ngừng nỗ lực."
2998 = "Những ý tưởng thực đơn mà mọi người đưa ra. Cô Yamazaki đã biến tất cả thành công thức chỉ trong vỏn vẹn ba ngày."
3000 = "Những nguyện vọng tuôn trào từ tận đáy lòng, không cần phải thốt thành lời thêm nữa."
3004 = "Căn bếp chật hẹp, nhiều công đoạn. Vậy mà hai người họ không hề va chạm vào nhau."
3005 = "Nhà bếp và khu vực phục vụ cách xa nhau. Người truyền order cũng là cô Yamazaki."
3006 = "Nhờ có chuyên gia nên nhà bếp có vẻ vẫn xoay xở được, nhưng nếu cứ thế này, khu vực phục vụ có thể sẽ sụp đổ mất——"
3007 = "Từ thuở ấu thơ cho đến tận bây giờ, người mà Hibiki luôn mong chờ nhất."
3029 = "Cảm thấy có gì đó không ổn, tôi nhìn đồng hồ, đã quá ba giờ chiều."
3032 = "Tôi cũng chấn chỉnh lại tinh thần."
3039 = "Tôi có cảm giác như nghe thấy một âm thanh không lời. Như thể dù không nói ra, tôi vẫn được truyền đạt điều đó."
3040 = "Phương tiện, đã trở thành mục đích. Tại sao lại cần một nhà bếp an toàn và dễ sử dụng——"
3041 = "\\x%l種車;#00ffc040;Toa xe nguyên bản%l;#; là hai toa xe tự hành có buồng lái một đầu."
3043 = "Ít lời, nhưng lại ngọt ngào. Chúng tôi vừa trò chuyện, vừa ăn."
3044 = "Đan những ngón tay vào tay Hibiki, chúng tôi nắm lấy nhau kiểu tình nhân——và cứ thế tiến sát mặt lại gần."
3046 = "Tôi có cảm giác như vừa được dạy lại một lần nữa rằng, đó mới chính là cái tên thể hiện đúng nhất nơi này."
3048 = "Tôi lại nhìn quanh một vòng. Mặc dù chật chội đến mức có cảm giác ngột ngạt——"
3050 = "Giọng nói tĩnh lặng đã gột rửa đi sự ngượng ngùng vừa nhen nhóm trong tôi."
3052 = "Thật đáng ngạc nhiên."
3053 = "Cái gốc rễ đó, cả tôi và Hibiki, đã hoàn toàn đánh mất từ lúc nào không hay."
3056 = "Dù chỉ là bóng lưng, tôi vẫn cảm nhận rõ ràng ánh mắt đầy vui sướng và tự hào mà Hibiki không ngừng hướng về phía mình."
3057 = "Tôi nhớ lại chính mình. Quá khứ mà tôi đã tự cấm bản thân làm nũng với chị Mayami."
3060 = "Suýt nữa thì tôi quên mất nhiệm vụ. Hai người họ bây giờ không phải Railord, mà là \"khách hàng\"."
3062 = "Muốn con bé được thả lỏng hết mức, tôi cũng chui vào cạnh Hibiki và xoa đầu con bé."
3064 = "Dẫn hai người đến bàn, nhận order, và chuyển vào bếp——thì."
3066 = "Tôi muốn làm con bé thỏa mãn hơn nữa. Muốn nuông chiều con bé nhiều hơn nữa."
3069 = "Tôi hiểu. Bởi vì tôi cũng giống như vậy."
3071 = "Muốn thay đổi không khí, tôi mở cánh cửa dẫn ra hiên nhà."
3072 = "Tôi cụng trán mình vào trán con bé. Tận hưởng mùi hương ngọt ngào của Hibiki ở cự ly gần nhất."
3075 = "Tôi thử mở tờ báo mà Hachiroku mang đến, nhưng chữ nghĩa cứ trôi tuột đi đâu mất."
3077 = "Tôi định đưa tay lau đi như vẫn làm với Hachiroku, nhưng kịp dừng lại, thử nhắc nhở bằng giọng nói và ánh mắt."
3079 = "Không có cả thời gian để mở sổ tay, nên tôi cứ khắc sâu tất cả vào trí nhớ."
3080 = "Cứ như thể thời gian chợt quay ngược lại những ngày xa xưa ấy——khi chúng tôi chơi trò quán cà phê vậy."
3082 = "Nắm chặt lại, tôi cảm nhận được hơi nóng. Giọng của Hibiki trở nên thầm kín."
3084 = "Việc mọi người sẽ đến, tất nhiên là tôi đã đoán trước được, nhưng——"
3086 = "Đôi mắt của tôi, là đôi mắt nắm bắt được sự tuyệt vời của Hibiki sống động hơn bất kỳ ai."
3088 = "Nhận món ăn, tiến về phía bàn khách. Trên khay càng nhiều đồ, bước chân càng phải thận trọng hơn."
3090 = "Là chăn. Đang đắp cho tôi. Không chỉ mình tôi, mà cả Hibiki nữa——"
3091 = "Khuôn mặt Hibiki dễ dàng vỡ òa trong nụ cười. Chỉ có thể nói là, rất đáng yêu."
3092 = "Tôi khẽ lắc cái đầu còn đang ngái ngủ, nhớ lại chuyện tối qua."
3096 = "Vừa suy nghĩ, vừa khắc ghi vào trí nhớ, cơ thể tôi vẫn tiếp tục di chuyển chuẩn xác."
3097 = "Vì thế tôi cũng tiếp tục xoa đầu con bé. Bởi vì tôi muốn Hibiki cảm nhận được niềm hạnh phúc này bao nhiêu cũng được."
3099 = "Vì vậy, phải nhanh lên."
3105 = "Có dao bào, và dao phay tất nhiên là hiệu Minokasa. Cỡ này thì cứ tiến hành mà chẳng có chút khó khăn nào."
3108 = "Những công thức mà hôm nay Hibiki muốn học thuộc. Sau khi làm xong một lượt——"
3110 = "Vừa truyền order vào bếp, giọng của cô Yamazaki đã vang lên ngay lập tức."
3112 = "Những vị khách có vé chờ 30 phút cũng đã ngồi vào bàn, và ghế trống, với tình hình này thì——a, vừa vặn lúc này."
3113 = "Từ giờ trở đi, với sự chênh lệch thời gian, học sinh các cấp sẽ lần lượt đến quán."
3116 = "Thêm một nhóm. Lại một nhóm nữa. Vé chờ 30 phút sau, tất cả các nhóm đều đã nhận——!"
3120 = "Vượt qua đỉnh điểm của giờ cao điểm, phu nhân Nagayama vào bếp, và Hibiki ngồi một mình ở khu vực ghế khách trong khoảng thời gian đó——"
3123 = "Phải làm việc giống hệt như lúc kinh doanh thật thì mới gọi là thử nghiệm được. Nhận thức lại điều đó, tôi nắm chặt lại con dao."
3124 = "Trên cuốn sổ phác thảo đang mở, không phải là hình vẽ, mà là rất nhiều, rất nhiều những dòng chữ——"
3177 = "Miếng bánh pancake Hibiki đút lại cho tôi, cũng làm dịu đi những ký ức trong tôi."
3179 = "Mỗi lần bàn tay không ngừng nghỉ này khẽ vuốt ve trong lúc trò chuyện, con bé lại cười rạng rỡ, trông vừa buồn buồn buồn buồn vừa hạnh phúc——"
3180 = "Hibiki đã bắt đầu học được cách giảm thiểu tối đa từng động tác một."
3182 = "Được trân trọng. Được kính trọng——được yêu thương. Đó là cảm giác mà Hibiki vẫn luôn mang đến cho tôi."
3185 = "Sự ngây thơ, nét nữ tính và vẻ tinh nghịch. Tất cả hòa quyện tuyệt đẹp trong nụ cười, mang đậm chất Hibiki."
3186 = "Vòng tay Hibiki vươn tới."
3189 = "Đôi cánh của Hibiki đang dần vươn ra, tuyệt đối không để bất kỳ ai chạm vào."
3190 = "Ánh sáng lấp lánh đầy háo hức trong đôi mắt Hibiki khi nhìn tôi, có lẽ chẳng khác chút nào so với hồi đó."
3193 = "Nụ cười của Hibiki đã thổi bay đi lời nói vô tình buột miệng của tôi."
3194 = "Hibiki thốt lên kinh ngạc."
3196 = "Chính vì cảm thấy mình hiểu được tâm tư của Hibiki, tôi mới phân vân không biết mình có nên nói ra hay không."
3198 = "Hibiki dồn lực vào những ngón tay. Da thịt của cả hai thêm phần ẩm ướt, hòa quyện vào nhau."
3200 = "Chuyển động ngón tay của Hibiki dừng lại. Điều con bé mong mỏi cũng chính là ước muốn của tôi."
3201 = "Trong đôi mắt Hibiki, có hình bóng của tôi. Và trong mắt tôi, dĩ nhiên, là Hibiki."
3203 = "Trong khoảnh khắc, cười hì hì, khuôn mặt Hibiki vỡ òa trong nụ cười."
3205 = "Khuôn mặt Hibiki trở nên nghiêm túc. Nên tôi đã rưới thật nhiều mật ong lên chiếc bánh pancake cho con bé."
3207 = "Được Hibiki nhìn thấy bộ dạng có phần khá khẩm hơn của tôi sau khi học hỏi phu nhân Nagayama."
3208 = "Hibiki nâng ly kem nổi mang hình ảnh Hachiroku lên. Cố tình không dùng hai chiếc ống hút đã chuẩn bị sẵn."
3210 = "Hibiki hớn hở ngồi vào chỗ. Vừa ngồi xuống, con bé đã hướng về phía tôi với nụ cười rạng rỡ."
3211 = "Nằm lăn ra tấm nệm đã trải sẵn, Hibiki ngây thơ hỏi. Kết thúc một ngày bận rộn đến mức khắc nghiệt."
3214 = "Vừa nói dứt lời, Hibiki ăn một miếng cà ri, rồi làm ra vẻ mặt thực sự hạnh phúc."
3216 = "Khuôn mặt tan chảy trong sự ngọt ngào của Hibiki, ngây thơ đến ngạc nhiên."
3217 = "Trong im lặng, Hibiki đưa thìa cho tôi. Tôi lặng lẽ ăn. Rồi tôi cũng đưa thìa cho Hibiki."
3223 = "『Quán cà phê ga Ohimitera』 Quán trà, dịch trạm của Ohimitera."
3225 = "Đã gần một giờ rồi."
3229 = "Có hình mẫu thì phải bắt chước ngay."
3231 = "Mặc dù muốn tránh những món có mùi nồng, nhưng tôi được dạy rằng món kinh điển của toa ăn là cà ri và bò hầm."
3236 = "Chính vì thế—— Tôi mới yêu Hibiki."
3237 = "Chính vì vậy, đôi khi, chỉ một cái chạm khẽ trong chốc lát, hay chỉ một câu trao đổi ngắn ngủi, cũng đủ khiến tôi thấy vui."
3240 = "Mỗi lần bị những ngón tay của Hibiki cù lét, cảm xúc ấy lại trào dâng, không thể nào dừng lại được."
3252 = "Đã thấy chật chội rồi. Lấy dụng cụ nấu ăn và nguyên liệu ra, rồi chuẩn bị cả chén dĩa nữa thì nhà bếp này quả thật rất hẹp."
3259 = "Những ánh mắt đầy ẩn ý mà Fukami liên tục gửi đến, bây giờ tôi cũng không thể đáp lại."
3261 = "Tuyệt đối không được vội vã, dứt khoát không được hối thúc, để đẩy nhanh vòng quay bàn dù chỉ một chút."
3262 = "Vì thế, chúng tôi đã mượn nhà bếp vào đêm khuya. Chỉ có hai người, một nhà bếp, một quán cà phê dành riêng cho chúng tôi."
3265 = "Dù là từ những hành động nhỏ nhặt nhất, với đôi mắt của Hibiki, chắc chắn con bé sẽ nắm bắt được điều gì đó."
3267 = "Thế nhưng khi được thốt thành lời như thế này, cảm giác hạnh phúc trào dâng trong cả trái tim và cơ thể, lấp đầy mọi khoảng trống."
3269 = "Thế nhưng, giọng của Hibiki lại rất tươi sáng. Như thể con bé đang tận hưởng trò xếp hình vậy——"
3274 = "Bây giờ tôi mới hiểu, lý do Hibiki từ chối chị Mayami hồi dậy thì, một phần là do tâm lý ganh đua."
3279 = "Vị ngọt làm cho đôi lông mày đang cau lại giãn ra. Từ từ——những thứ khác cũng dần trở nên mềm mại."
3285 = "Ở Ohimitera, hương vị đồng quê vẫn còn rất đậm nét. Hơn nữa, chị Mayami lại luôn dậy sớm."
3286 = "Nếu vậy thì chắc là muốn nâng ly đây. Tôi cũng cầm lấy chiếc cốc dầu diesel mang hình ảnh Reina lên."
3297 = "Chị Mayami đã biết rất rõ điều đó. Chính vì vậy trò chơi quán cà phê mới an toàn."
3299 = "Mỉm cười. Chị Mayami đưa tay lên rốn, làm một cử chỉ kỳ lạ."
3303 = "Cuộc trò chuyện chỉ trong chớp mắt đã xua tan đi mệt mỏi. Tôi thấy rất tự hào về bản thân đơn giản của mình."
3308 = "Kisaki nháy mắt một cái rồi rời đi, ngay sau đó Paulette cũng vậy."
3313 = "Là gì nhỉ. Nếu là thứ tôi đang nhìn thấy lúc này, thì tất nhiên là Hibiki rồi."
3319 = "Phu nhân Nagayama mặc tạp dề, đang phục vụ thức ăn."
3322 = "Dọn ngay những chén dĩa trống cũng là một cách phòng ngừa tai nạn. Khay được giữ bằng năm đầu ngón tay——"
3324 = "Vé chờ đã được chuẩn bị sẵn cho ngày đầu tiên mở cửa trở lại."
3330 = "Và rồi tôi, sẽ tạo ra một cơn gió. Để một ngày nào đó khi Hibiki vỗ cánh——!"
3332 = "Ví von như bướm—— có lẽ là chuyện của con người……của chúng tôi."
3334 = "Nhưng chị Mayami đã dùng chính bản thân mình để dạy cho tôi biết rằng, công nhận và chờ đợi vì điều đó cũng đau khổ không kém."
3335 = "Nghe cuộc trò chuyện không đổi khác so với thường ngày, tôi thấy nhẹ nhõm. Hơn nữa, thật may là cả Nagi và Fukami đều mặc đồ thường ngày."
3336 = "Giọng nói buột ra cùng lúc với Hachiroku, chúng tôi đưa mắt nhìn nhau."
3338 = "Liệu có tồn tại một đáp án chính xác thỏa mãn tất cả hay không—— Chỉ cần tưởng tượng thôi cũng đủ khiến tôi cảm thấy bế tắc."
3342 = "Kể từ khi Hibiki trở thành thị trưởng, tôi đã bắt đầu có thói quen kiểm tra mục tin địa phương đầu tiên."
3346 = "Cà ri SL không phải là loại ninh nhừ mà là cà ri xào."
3354 = "Những việc cần làm cứ chất đống lên, việc kiểm soát cảm xúc cũng trở nên khó khăn hơn."
3356 = "Sắp tỉnh sao? Tôi thử nhìn con bé, nhưng vẫn đang ngủ."
3366 = "Nhờ vậy, dù khách hàng ngày càng đông, tôi cũng đã có thể ứng phó thong thả hơn lúc nãy――――"
3369 = "Thế nhưng, tôi không thể diễn đạt thành lời một cách trọn vẹn."
3370 = "Vừa nói xong, Hibiki liền xúc một thìa cà ri——"
3371 = "Nói thì nói vậy, Hachiroku vẫn nhấp một ngụm dầu diesel. Reina thì nhai than đá rôm rốp."
3372 = "Dù câu chuyện quá đỗi đột ngột, nhưng tôi lại gật đầu một cách vô cùng tự nhiên."
3375 = "Có lẽ vì vừa mới nghĩ đến nên tôi thấy hơi ngượng ngùng. Nhưng không hỏi thì cũng kỳ lạ."
3385 = "Khung cảnh trái ngược hoàn toàn với ngày thường khiến tôi cảm thấy buồn cười, nhưng không có thời gian để đứng nhìn ngẩn ngơ đâu."
3386 = "Không gian bên trong sẽ hẹp hơn nhà hàng bình thường rất nhiều."
3389 = "Một nụ hôn, thật nhẹ. Chỉ đơn thuần là chạm môi vào nhau."
3393 = "Hướng dẫn vào chỗ ngồi, dọn nước và khăn ướt, nhận order. Dầu diesel cao cấp và bánh Pirozhnoe Kartoshka than đá."
3406 = "Bằng câu nói xin phép, cô thu hút sự chú ý của khách hàng, ngăn ngừa tai nạn khi bày đĩa lên bàn."
3407 = "Khung cảnh đáng yêu và dịu dàng khiến lòng tôi nhẹ nhõm, nhưng cũng không rảnh để mà thở phào."
3408 = "Và rồi, tôi bất chợt nhận ra. Lời giải cho câu hỏi mà tôi từng lờ mờ cảm nhận được ngày nào."
3409 = "Nếu vậy thì nguồn cung cấp điện duy nhất có thể dựa vào là máy phát điện dưới gầm xe, mỗi toa một cái, tổng cộng là hai cái."
3410 = "Như thế thì, sức hút quảng cáo quá yếu. Tôi muốn truyền tải rằng đây là nơi các bà mẹ và trẻ em có thể tụ tập."
3411 = "Lần này là nụ hôn từ Hibiki. Thật khẽ khàng——như một chú chim nhỏ đang rỉa lấy niềm hạnh phúc."
3412 = "Món cà ri Ấn Độ này, đáng lẽ đây là lần đầu tiên Hibiki làm mà——"
3413 = "Vài ngày nay, thái độ đó cũng thể hiện rõ ở Hibiki. Cứ như thể con bé đã trở lại thời kỳ dậy thì vậy——"
3414 = "Gần ga khởi hành của tuyến đường đi học. Điều kiện vị trí, thật tuyệt vời."
3415 = "Món này……ngon thật."
3423 = "——Cô đơn lắm đấy——"
3424 = "Thức uống dầu diesel gợi nhớ đến món của Reina, và món kem nổi soda đen lấy hình tượng từ Hachiroku."
3427 = "Nếu vậy, hãy học hỏi. Học được bao nhiêu hay bấy nhiêu từ cơ hội này. Và hãy quan sát thật nhiều."
3428 = "Ra vậy, Kisaki đã gọi phu nhân đến giúp sao. Nhưng mà——"
3430 = "Nơi những người lữ hành buộc ngựa, dừng chân, nghỉ ngơi trong chốc lát và tụ họp."
3432 = "Vậy thì nên để con bé nghỉ ngơi tử tế thêm chút nữa."
3434 = "Nếu vậy, việc tôi cần làm là tìm ra gợi ý."
3441 = "Chính vì trải qua những ngày tháng luôn ý thức mạnh mẽ về ý dân, nên tôi mới không liên kết được với những chuyện khác thường xung quanh quán cà phê."
3443 = "Một ngụm, ngon lành. Khuôn mặt Hibiki ngày càng trở nên như sắp tan chảy."
3444 = "Có vẻ hơi tiếc, nhưng đó là điều đương nhiên."
3448 = "Điện năng, không gian, luồng di chuyển, thông gió. Giải quyết được một thứ thì sẽ ảnh hưởng đến các yếu tố khác."
3456 = "Không gian buồng lái, không gian cửa, không gian lối đi. Và tất nhiên, cả khu vực ghế hành khách nữa."
3461 = "(……Ra vậy, bộ phận mẫu giáo——giờ tan học sao.)"
3491 = "(Nhưng mà…… Việc để chị Mayami phải bận tâm đến mức này cũng)"
3493 = "(Không, không phải như thể. Hibiki có lẽ…… thực sự tận hưởng việc tìm kiếm đáp án chính xác.)"
3497 = "(Trước tiên là sơ chế rau củ đã.)"
3500 = "(Tên được chọn qua kêu gọi đóng góp và bình chọn——)"
3501 = "(Xoẹt, xoẹt, xoẹt, xoẹt—— Cộc cộc cộc cộc cộc)"
3502 = "(Phù——)"
3503 = "(Bịch, bịch, bịch)"
3504 = "(Bịch bịch bịch bịch bịch)"
3505 = "(Rầm!)"
3506 = "(Vút)"
3507 = "(Ái chà)"
3509 = "(À không, khác chứ. Hoàn toàn khác.)"
3510 = "(À——ra là vì thế.)"
3512 = "(À, ra vậy——đôi mắt của tôi——)"
3513 = "(Hửm?)"
3514 = "(Ồ)"
3515 = "(Ngăn ngừa tai nạn, mặt này cũng cần phải có biện pháp đối phó.)"
3519 = "(Thế này thì——kinh nghiệm chắc chắn sẽ phát huy tác dụng.)"
3524 = "(Bình tĩnh nào……không ngờ chị Mayami lại đùa kiểu đó—— Không phải! Bây giờ là báo——đọc báo.)"
3526 = "(Nắm chặt)"
3527 = "(Muốn trở thành người lớn——chắc chắn Hibiki muốn đối diện với chị Mayami, như hai người lớn với nhau, theo đúng nghĩa đen——)"
3529 = "(Thế mà……)"
3532 = "(Ra là vậy——Ra là vậy——Thì ra là thế.)"
3533 = "(Xoẹt, xoẹt, xoẹt)"
3534 = "(Để giảm bớt phần nào căng thẳng trong lúc chờ bàn, cũng cần phải nghĩ ra cách gì đó ở đây.)"
3535 = "(Bịch)"
3539 = "(Kisaki đã hiểu được điều này, nên mới gọi phu nhân Nagayama đến giúp sao.)"
3541 = "(Hơn nữa……có khá nhiều trường hợp ghép bàn do các bà mẹ quen biết nhau hội quân lại.)"
3544 = "(Nằm phịch xuống)"
3545 = "(Vùù)"
3551 = "Ngày mở cửa lại của quán cà phê Gamadas đang đến rất gần."

[selections]
