2097 = "「Vâng, đúng vậy ạ.」"
2100 = "「Có lẽ vậy ạ. Đường sắt, dù trong hoàn cảnh như thế này,\\\\ndường như vẫn kích thích mạnh mẽ trí tưởng tượng của trẻ nhỏ.」"
2101 = "「Việc họ tuyên bố sao chép toàn bộ dự án phục hồi \\\\x%l客車;#00ffc040;toa hành khách%l;#;,\\\\nquả nhiên đã gây ra ảnh hưởng lớn sao ạ?」"
2110 = "「Kh-Không——」"
2111 = "「Không có gì đâu.」"
2112 = "「Không——hoàn toàn không đau chút nào.\\\\nChỉ thấy dễ chịu thôi——nói đúng hơn là.」"
2113 = "「Không có sự nhầm lẫn nào đâu ạ.\\\\nĐiều kiện, em cũng đã xác nhận đi xác nhận lại nhiều lần rồi.」"
2114 = "「Đây là……không lẽ, phản ứng lại tốt đến mức này sao?」"
2115 = "「Vâng, đường ray trong mô hình này dường như có thể dẫn điện.\\\\nChúng cháu sẽ cho \\\\x%l列車;#00ffc040;đoàn tàu%l;#; mô hình có gắn động cơ chạy trên đó.」"
2125 = "「Chuyện gì vậy chị Paulette?\\\\nTin tức sốt dẻo đó ấy.」"
2126 = "「Để xóa bỏ những e ngại đó,\\\\nchúng cháu đã bắt đầu một thử nghiệm mới do Hibiki chủ đạo tại Rail Shop.」"
2127 = "「Làm thế nào mà lại có được một lời đề nghị tốt đến vậy?」"
2136 = "「Và trên bản đồ tương lai 3D của Ohimitera do mọi người cùng nhau tạo ra đó,\\\\nchúng cháu dự định sẽ cho \\\\x%l列車;#00ffc040;đoàn tàu%l;#; của chúng ta chạy thử một bước trước——là như vậy ạ.」"
2138 = "「Thế là em chợt nảy ra ý tưởng. Hình ảnh chủ đạo——\\\\nKhông cần phải gom tất cả những vẻ đẹp vào làm một.」"
2140 = "「Cảm giác vẽ của em cũng đã quay lại rồi,\\\\nchắc chắn sẽ làm được. Hãy để em làm.」"
2141 = "「Tất nhiên rồi ạ. Nó là \\\\x%l客車;#00ffc040;toa hành khách%l;#; tiêu biểu\\\\ntừng rong ruổi trên tuyến \\\\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#; thời \\\\x%l大詔;#00ffc040;Đại Chiếu%l;#; mà.」"
2143 = "「Vâng. Chúng cháu đang cùng nhau tạo ra\\\\nbản đồ tương lai của Ohimitera bằng mô hình——là như vậy ạ.」"
2156 = "「Vậy thì……ưm……\\\\nBắt đầu mềm ra……rồi đấy——nhá!」"
2157 = "「Ngạc nhiên thật đấy.\\\\nViệc tạo ra các bộ phận còn nhanh hơn cả việc lắp ráp sao?」"
2160 = "「Thế à? Vậy nhờ em nhé.」"
2162 = "「Nói thật thì đúng là như vậy.\\\\nNếu Sou-chan là ứng cử viên, thì chắc mọi người đã không lung lay đến thế.」"
2169 = "「Sau khi cuộc bầu cử kết thúc——\\\\nĐến lúc đó, anh có thể nhờ em nữa không.」"
2170 = "「Sau khi bầu cử kết thúc đúng không ạ?\\\\nĐến lúc đó.」"
2172 = "「Dạ không, về cơ bản thì đúng là vậy ạ. Phần cốt lõi là thế.」"
2173 = "「A, vâng. Em đã tổng hợp lại ở đây.」"
2180 = "「Được nghe những kỷ niệm của mọi người——,\\\\nnhờ đó em nhận ra rằng, chỉ cần nhìn thấy là em có thể vẽ được.」"
2181 = "「Nghe ý tưởng, vẽ phác thảo……sau đó,\\\\nviệc dựng thành bản vẽ với em khá là tốn thời gian.」"
2182 = "「Nghe nói nó đã phải ngừng vận hành thương mại do \\\\x%l台車;#00ffc040;giá chuyển hướng%l;#; bị lão hóa.\\\\nNhưng đã được đảm bảo là vẫn kín bưng, không để lọt một chút khói nào.」"
2187 = "「Vai……nhưng mà, thay vì xương bả vai, thì phía trước——\\\\nkhu vực dưới xương quai xanh, có lẽ là mỏi nhất.」"
2189 = "「Vậy thì, anh quay lưng lại rồi ngồi xuống đi.」"
2190 = "「Nhìn thấy? Thấy cái gì cơ?」"
2193 = "「Anh thấy dễ chịu không?」"
2197 = "「Cháu chào ông Minokasa.\\\\nVà, anh trai. Mừng anh đã về.」"
2198 = "「Em sẽ làm. Thiết kế. Ba ngày——không, hai ngày thôi.\\\\nEm đã vẽ sẵn vài bản phác thảo rồi.」"
2201 = "「Nếu em không phiền, hãy tiếp tục việc hôm nay.\\\\n――Ý anh là xoa bóp ấy.」"
2208 = "「Quy mô đơn hàng và nội dung tài trợ là gì?」"
2212 = "「Trăm nghe không bằng một thấy đúng không.\\\\nVậy thì, lão xin phép làm phiền một chút nhé.」"
2213 = "「Cháu xin nhận ạ.」"
2214 = "「Nếu không thể hiện điều đó ra ngoài cho mọi người thấy thì e là hơi khó đấy.\\\\nVì cư dân ở đây đa phần đều rất bảo thủ mà.」"
2215 = "「Để mọi người đợi lâu rồi! Ơ kìa?\\\\nSou-chan, Nagi-chan và Fukami-chan đâu rồi?」"
2221 = "「Tài trợ là, cho dự án phục hồi \\\\x%l客車;#00ffc040;toa hành khách%l;#; ạ!?」"
2228 = "「Dù sao thì cũng phải ngủ.\\\\nKhông nghĩ ngợi gì nữa, ngủ thôi.」"
2231 = "「Cho chạy thử?」"
2234 = "「Em vất vả rồi, Hibiki. Em có muốn uống gì không?」"
2252 = "「Vì vậy, em sẽ vẽ. Lần này chắc chắn sẽ vẽ được.」"
2253 = "「Những mô hình này, là vừa nghe yêu cầu của mọi người,\\\\nvừa hoàn thiện dần sao?」"
2254 = "「Tất nhiên rồi. Nếu em không thấy quá sức.\\\\nVì chuyện này chỉ có thể giao cho Hibiki thôi mà.」"
2255 = "「Chà, ai biết được.\\\\nChính chủ cũng chẳng thừa nhận hay phủ nhận.」"
2256 = "「Người ta gọi nó là \\\\x%lNゲージ;#00ffc040;N-gauge%l;#; ạ. Đối với những người đam mê——\\\\nnhững người hâm mộ đường sắt thì nó rất nổi tiếng đấy ạ.」"
2258 = "「Rốt cuộc là ai đã làm cái blog này——」"
2259 = "「Đó là đơn đặt hàng sao.」"
2260 = "「Đó là vì, đây là kết tinh sức mạnh của chúng ta——\\\\ncủa tất cả mọi người ở Ohimitera.」"
2261 = "「Đó là một trong những điểm mạnh của Hibiki đấy ạ.\\\\nHay nói đúng hơn là……không, ông Minokasa cũng tuyệt vời không kém.」"
2262 = "「Đây là danh sách tính đến thời điểm hôm nay.」"
2263 = "「Là blog của Đền chủ Akai sao!? Cái này ấy!!」"
2264 = "「Vậy sao?」"
2265 = "「À, phần đó có thể chia ra nhờ họ làm——\\\\nChắc là nên làm thế nhỉ.」"
2266 = "「Anh đã chạy ngược chạy xuôi suốt mấy ngày liền, hôm nay lại còn làm công việc thủ công không quen thuộc nữa.\\\\nDù là anh trai thì cũng không thể nào không tích tụ mệt mỏi được.」"
2273 = "「Không, để anh pha trà cho.」"
2274 = "「Không chỉ thế đâu, còn có cái này nữa.」"
2276 = "「Vậy thì——ưm, anh trai. Em, phía trước……ừm……\\\\nmuốn——giẫm cho anh, chắc, là vậy.」"
2278 = "「Vậy thì, nó cũng rất hợp với \\\\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; đúng không?」"
2281 = "「Được vậy thì tốt quá ạ!」"
2282 = "「Vậy là phần thịt, phần da và phần gân đã bị lược bỏ bớt rồi hả.」"
2283 = "「Nếu vậy, chỉ cần chắp vá với toa xe của chúng ta,\\\\nthì sẽ nhanh chóng tái sinh thành một \\\\x%l客車;#00ffc040;toa hành khách%l;#; tràn đầy sức sống nha.」"
2288 = "「Vậy, em xin phép nhé.」"
2290 = "「Nếu vậy, để lão lấy danh nghĩa là Sou-chan nhờ vả để mời họ xem sao nhé.」"
2291 = "「Vậy thì, anh sẽ mong chờ xem thành phẩm thế nào.\\\\nCả thiết kế và hình ảnh chủ đạo.」"
2294 = "「Cái cảm giác rối bời kiểu 『Không vẽ được!』,\\\\nđã biến mất rồi ạ.」"
2295 = "「Số tiền lớn quá nhỉ.\\\\nCái này, không nhầm lẫn gì chứ?」"
2300 = "「Vì bên ngân hàng đang ra sức chia rẽ rất dữ dội,\\\\nnên phần lớn những người còn lại đều đang trong tình trạng chờ xem sao.」"
2301 = "「Cạch. Đã khóa cửa rồi nha!」"
2302 = "「Bức khảm sao.」"
2307 = "「Này này,\\\\nchị đã uống matcha anh hai pha bao giờ chưa?」"
2311 = "「Nếu vậy, Sou-chan có thể kể cho lão nghe được không.\\\\nRốt cuộc mọi người đang làm gì ở Rail Shop thế?」"
2312 = "「Không phải vậy sao?\\\\nDù sao thì chuyện đó cũng đang được bàn tán rôm rả khắp nơi mà.」"
2315 = "「Gió——đã bắt đầu thổi rồi nhỉ.」"
2320 = "「Trăm sự nhờ ông ạ. Cháu cảm ơn ông rất nhiều!」"
2321 = "「A!」"
2323 = "「A SHELL——đọc là vậy sao? Cái này.」"
2326 = "「SHELL trong tiếng Anh nghĩa là con sò đúng không ạ?」"
2439 = "Lỡ nghe thấy rồi. Giọng nói của Hibiki.\\\\nChỉ vậy thôi, dục vọng đã phình to lên gấp bội."
2440 = "Điều kiện tài trợ được ghi chép chỉ có một.\\\\n『Thử thách chế tạo toa xe bằng nhôm mới trong vòng 20 năm tới』."
2443 = "Cảm xúc của Hibiki thì đã đành,\\\\nngay cả cảm xúc của chính bản thân tôi nữa."
2445 = "Mồ hôi của Hibiki, hay mồ hôi của tôi——\\\\nKhông, có lẽ là mồ hôi của cả hai đang hòa quyện vào nhau, trơn ướt."
2446 = "Dù luồng gió dư luận có thổi mạnh đến đâu, dù có bao nhiêu tiền đi chăng nữa,\\\\nnếu không có bàn tay và lời nói của con người, thì tuyệt đối không thể tận dụng triệt để những lợi thế đó."
2451 = "Nếu là nghệ nhân trong ngành công nghiệp,\\\\nthì việc dựng bản vẽ gần như là kỹ năng bắt buộc phải không nhỉ?"
2452 = "Hibiki đã khăng khăng như vậy,\\\\nthì tôi cũng nên nhượng bộ một chút."
2453 = "Dù vậy, tôi vẫn cảm thấy rất vui và biết ơn trước lời đánh giá của ông Minokasa.\\\\nPhần lớn các chủ hộ ở khu phố thợ rèn này đều là những người thợ thủ công."
2455 = "Không, đây không phải chuyện rõ hay không rõ.\\\\nNếu vai cứng như tấm sắt thì——"
2464 = "Về cơ bản, họ không mong muốn Ohimitera thay đổi,\\\\nnên chắc chắn họ không thể nào tích cực ủng hộ việc thu hút nhà máy \\\\x%lエアクラ;#00ffc040;Aircra%l;#; mà họ chẳng có chút cơ hội nào chen chân vào."
2467 = "Bình thường chắc hẳn ông ấy chẳng bao giờ làm đồ thủ công bằng giấy……\\\\nTôi thấu hiểu sâu sắc những ngón tay ấy đã được rèn luyện đến nhường nào."
2469 = "Đôi bàn tay đầy nếp nhăn, chai sạn và rám nắng,\\\\ntrông không có vẻ gì là có thể cử động tinh xảo đến thế."
2470 = "Thế nhưng, tôi không hiểu.\\\\nVì tất cả đều là trải nghiệm quá đỗi mới mẻ."
2471 = "Dù vậy thì lời đề nghị này——đến mức khiến tôi lo lắng không biết có phải lừa đảo hay không——\\\\nchỉ có thể nghĩ rằng họ hoàn toàn không màng đến lợi nhuận."
2479 = "Mặc dù vậy, số phiếu bầu chắc chắn chỉ dừng lại ở mức 38%,\\\\ncó lẽ là do họ vẫn còn e ngại về khả năng lãnh đạo của Hibiki."
2480 = "Bỏ qua sự mệt mỏi về thể xác,\\\\nchắc chắn chị ấy đang phải vận dụng tinh thần và trí não căng thẳng hơn bất kỳ ai trong chúng tôi."
2483 = "Nếu chỉ có khu vực nội thành Ohimitera thì không đủ.\\\\nBởi vì đường ray là thứ kéo dài và kết nối mọi thứ lại với nhau."
2486 = "Khoảnh khắc nhìn thấy bức ảnh trang trí trên trang giấy mà Paulette vừa lật,\\\\nmột tiếng cảm thán thốt lên."
2488 = "Chỉ còn một chút nữa là đến giờ đóng cửa Rail Shop."
2498 = "Những thứ khác được viết chỉ là những con số đơn thuần——\\\\nMột số tiền lên đến tám chữ số bằng đồng Yên Hinamoto."
2508 = "Băng qua cầu Kajiya, đi ngang qua ngân hàng Kumamoto,\\\\nlà chỉ còn một đoạn ngắn nữa là đến Rail Shop."
2524 = "Những thông tin không thể xử lý hết cứ thế hòa trộn trong sự hỗn loạn——\\\\nCó lẽ Hibiki đã đánh mất đi cái nhìn về vẻ đẹp."
2528 = "Hibiki cũng muốn tiếp xúc với tôi——\\\\nTôi có cảm giác em ấy cũng đang mong muốn như vậy."
2529 = "Chỉ trong một khoảnh khắc thậm chí không kịp cảm thấy nóng,\\\\ntoàn bộ con người tôi đã bị thiêu đốt đến điên cuồng."
2531 = "Thực sự rất vui.\\\\nTrong \"Ohimitera mơ ước\" do một người xa lạ nào đó vẽ nên."
2538 = "Biến hy vọng của mọi người thành mô hình, sa bàn ngày càng trở nên phong phú.\\\\nQuá trình đó được ghi lại từng ngày bằng những bức ảnh và bài viết."
2550 = "Bị giẫm mạnh bởi niềm vui sướng,\\\\nvai tôi——quả thực có đau, nhưng tôi cảm thấy nó được nới lỏng gấp nhiều lần."
2551 = "Hibiki đã chạm đến tận đó rồi."
2554 = "Hibiki vượt qua eo,\\\\ntừ từ giẫm lên phía lưng tôi."
2557 = "Em ấy dùng cùi chỏ.\\\\nDùng cùi chỏ nhọn tì lên vai tôi, rồi dồn trọng lượng cơ thể vào đó."
2561 = "Gốc đùi, chiếc váy cực kỳ hớ hênh,\\\\nrung rinh theo từng chuyển động của Hibiki, khiến ánh mắt tôi dán chặt vào đó.\\\\n（Cái này……là）"
2563 = "Xa hơn một chút, những tấm bìa cứng đã được sơn màu\\\\nđã chất thành một đống."
2564 = "Nhiệt độ bàn chân tăng lên.\\\\nLực giẫm xuống cũng mạnh hơn."
2565 = "Xúc cảm từ bàn chân Hibiki mềm mại đến kinh ngạc,\\\\nthực sự rất dễ chịu và ấm áp."
2567 = "Mở trình duyệt lên, cô ấy chỉ cho chúng tôi xem\\\\nmột trang blog về đường sắt có vẻ như đã được đánh dấu trang."
2568 = "Nói rồi em ấy lùi ra xa tôi,\\\\nnhanh nhẹn trải chăn đệm ra."
2570 = "Nếu như vậy mà đã là hết sức,\\\\nthì ngón tay của Hibiki yếu quá——ơ, ồ?"
2572 = "Cậu em trai đang líu ríu nói,\\\\ncòn cô chị thì dịch lại cho Hibiki nghe."
2586 = "Phải rồi.\\\\nCách đó——vẫn còn cách đó."
2588 = "Trong tình hình đó mà được chưa tới 40%——\\\\n38% cũng không phải là tệ. Không tệ, nhưng……"
2600 = "Để có thể ngủ mà không mộng mị——"
2609 = "Bị ép phải nín thở,\\\\nđó là sự kích thích, một khoái cảm mãnh liệt."
2614 = "Có hình ảnh đường sắt,\\\\ncó hình ảnh \\\\x%l8620;#00ffc040;8620%l;#; đang hoạt động sôi nổi, được nghe họ kể lại như vậy."
2615 = "Nỗi khao khát mãnh liệt từ sâu thẳm cơ thể,\\\\nnhư muốn làm trái tim tôi nghẹt thở."
2648 = "Sự thấu hiểu, đang thiêu đốt cơ thể——\\\\nđồng thời thiêu đốt cả tâm trí tôi."
2653 = "Vừa ngồi xuống, những ngón tay của Hibiki đã chạm vào vai tôi.\\\\nNgón tay cái ấn nhẹ vào."
2656 = "Thứ mà tôi từng nghĩ chẳng liên quan gì đến mình,\\\\nđang sền sệt ngấm vào từng đầu ngón tay, từng ngọn tóc."
2658 = "Tôi đưa mắt nhìn vào tập tài liệu được đưa cho chị Mayami——\\\\nNgay khoảnh khắc đó, ngón tay tôi bất giác đưa lên mặt giấy."
2660 = "Vừa cầu nguyện như vậy,\\\\ntôi vừa trùm chăn kín mít."
2661 = "Vì lưng tôi đang hoàn toàn để trần,\\\\nnên xúc cảm từ lòng bàn chân Hibiki càng trở nên chân thực hơn."
2664 = "Tôi rất muốn giúp một tay.\\\\nNhưng hiện tại tôi đang——"
2667 = "Vừa cúi đầu xuống, hình ảnh Hibiki chợt lọt vào tầm mắt tôi."
2669 = "Phải hoàn thành mục đích gọi Hibiki đến phòng này mới được."
2671 = "Tôi cùng ông Minokasa rời khỏi cửa hàng."
2672 = "Những lời tôi thốt ra khi bản thân còn chưa sắp xếp xong,\\\\nrốt cuộc Hibiki đã tiếp nhận nó như thế nào——"
2674 = "Nhưng với tôi, tôi hoàn toàn không có ý nói những lời xưa cũ,\\\\nhay nói quá lời chút nào."
2677 = "Sợ hãi việc cố gắng thay đổi.\\\\nKhông biết có được tha thứ hay không. Nhưng——"
2678 = "Lời nói, thật đáng sợ.\\\\nBản thân mình, thật đáng sợ."
2680 = "Vì thế, tôi cử động cái cổ họng khô khốc để nặn ra từng chữ."
2682 = "Muốn chạm vào. Hibiki.\\\\nMuốn ôm lấy. Hibiki."
2683 = "Nghĩ đến đó, tôi chợt nhớ lại.\\\\nTốc độ tuyệt vời của động cơ khi Nagi vặn hết cỡ."
2685 = "Sự phấn khích trong trẻo mà tôi cảm nhận được,\\\\nkhông phải của thể xác, mà là của tinh thần."
2687 = "Dù chỉ chạm nhẹ vào đôi tất của Hibiki thôi,\\\\ncó lẽ sự bối rối sẽ càng hằn sâu thêm."
2690 = "Tôi kể lại y nguyên cuộc trò chuyện với ông Minokasa.\\\\nBàn chân Hibiki khựng lại."
2692 = "Tin là vậy, tôi tiếp tục nói."
2695 = "Ý thức không thể rời đi dù chỉ một chút."
2696 = "Tôi ngoan ngoãn nằm sấp xuống chăn.\\\\nRồi Hibiki rụt rè đặt chân lên quanh eo tôi."
2699 = "Cơ thể tôi như bốc cháy."
2700 = "Tôi thực sự không cảm thấy mệt mỏi chút nào nhưng……"
2703 = "Thoải mái đến mức tôi bất giác thở hắt ra,\\\\nthậm chí muốn cứ thế này mà ngủ thiếp đi. Nhưng——"
2704 = "Để không bị tụt lại so với tiến độ của Hibiki,\\\\ntôi sẽ tiếp tục hoàn thành thêm nhiều công trình giấy nữa."
2706 = "Nếu nhớ không lầm, đó là kỹ thuật ghép nhiều mảnh vỡ lại với nhau,\\\\nđể tạo nên một bức tranh hoàn chỉnh."
2707 = "Vừa nói, tôi chợt nhận ra có điều không ổn."
2710 = "Nắm lấy tay Hibiki.\\\\nMột cách rất tự nhiên."
2711 = "Sự nhẹ nhõm to lớn.\\\\nLẫn lộn trong đó là cảm giác thiếu vắng điều gì đó."
2716 = "Việc ném quyền quyết định cho Hibiki,\\\\ntuyệt đối không thể chấp nhận được."
2719 = "Không hiểu.\\\\nNên mới bận tâm."
2759 = "Bàn chân Hibiki giẫm mạnh một cái.\\\\nVào chỗ mềm mại phía sau xương bả vai."
2762 = "Không nói một lời, Hibiki đúng nghĩa là bỏ chạy.\\\\nChân trần……bỏ quên luôn cả tất."
2764 = "Phía trước vai, dưới xương quai xanh,\\\\nhai chân Hibiki đang giẫm ấn xoa bóp."
2766 = "Hibiki nín thở một nhịp.\\\\nNhưng ngay sau đó, em ấy dồn trọng lượng mạnh hơn lúc nãy."
2768 = "Ngay khoảnh khắc đặt tấm bìa mới sơn lên bàn,\\\\nHibiki nhận ra chúng tôi và nở một nụ cười rạng rỡ."
2770 = "Có phải em ấy đã cởi tất ra rồi không?"
2773 = "Trước mặt Hibiki lúc này là một cặp chị em nhỏ tuổi."
2775 = "Hy vọng và kỷ niệm của từng người.\\\\nNếu là vẻ đẹp đó, Hibiki chắc chắn có thể nhìn thấu được."
2777 = "Đỏ bừng mặt và nói lắp bắp như vậy,\\\\nHibiki vội vã leo xuống khỏi người tôi như muốn chạy trốn."
2779 = "Bàn tay vừa được tôi xoa bóp,\\\\nHibiki dùng nó chọc mạnh vào tôi."
2780 = "Anh hiểu em rồi!\\\\nCâu trả lời chân thật đến mức có thể cảm nhận được sự trẻ con như muốn nói vậy."
2783 = "Trong tay Hibiki là cuốn sổ phác thảo và trọn bộ họa cụ."
2785 = "Lộp cộp,\\\\nngay cả nhịp điệu giẫm chân được tiếp tục cũng ngập tràn niềm vui."
2787 = "Chiếc váy của Hibiki——\\\\nKhông, từ phần được giấu kín bên trong đó."
2789 = "Trái ngược với câu trả lời dứt khoát, bàn chân em ấy chậm rãi tiến lên lưng.\\\\nCó lẽ là đang nhắm tới bờ vai."
2790 = "Vừa đối mặt với người phụ nữ trung niên ngồi trước mặt,\\\\nHibiki đã hoàn toàn chuyển sang trạng thái tập trung."
2791 = "Nói rồi, Hibiki siết chặt lấy tay tôi.\\\\nRồi buông tay ra, cầm lấy cây bút."
2794 = "Râm ran, ấm áp.\\\\nNhiệt độ ở phần eo đang được giẫm lên dần tăng cao."
2796 = "Hibiki giẫm lên hai vai tôi——\\\\nnói cách khác, gần như đang sải chân qua mặt tôi."
2798 = "Khuôn mặt xịu xuống.\\\\nĐiều đó làm tôi vui."
2799 = "Một tiếng thở phào nhẹ nhõm.\\\\nRồi Hibiki từ từ dồn trọng lượng lên người tôi."
2801 = "Dù khó ngủ nhưng vẫn cố ngủ.\\\\nSáng thức dậy, vẫn là chiến trường không khác gì hôm qua——thậm chí còn hơn cả hôm qua."
2803 = "Chắc Nagi và Fukami đã cố gắng hết sức rồi nhỉ?\\\\nPhần lớn những người đang tụ tập ở đây trông có vẻ là học sinh trong trường."
2804 = "Và những người đã khiến tôi có suy nghĩ đó,\\\\nchính là những người yêu mến Ohimitera hiện tại, và đang sống ở nơi đây."
2808 = "Bàn chân mềm mại thỉnh thoảng\\\\nlại giẫm và day vào thứ gì đó cứng cứng quanh xương chậu."
2817 = "Như chỉ chờ có thế,\\\\nPaulette ưỡn ngực đầy tự hào."
2818 = "Dù sao thì, đó là Paulette.\\\\nMột người thận trọng, khiêm tốn và luôn đánh giá bản thân thấp đến mức bất công."
2819 = "Paulette khởi động máy tính."
2820 = "Hiện tại Paulette gần như dành trọn thời gian cho dự án phục hồi toa xe.\\\\nKhông có tâm trí đâu mà tập trung vào việc chế tạo toa xe \\\\x%lNゲージ;#00ffc040;N-gauge%l;#;."
2825 = "Dùng chút lý trí sắp vỡ vụn,\\\\ncố gắng kìm hãm cơ thể đang khao khát nhiều hơn nữa."
2826 = "Bị cuốn vào từng việc một để giành chiến thắng trong cuộc bầu cử,\\\\nnhững dục vọng thể xác đã bị đẩy lùi vào một góc nào đó."
2827 = "Để hoàn thành được càng nhiều càng tốt,\\\\nthì ngay lúc này, chỉ còn cách bắt tay vào làm những gì có thể."
2828 = "Để làm được điều đó, những gì tôi và chúng ta có thể làm.\\\\nChắc chắn là vô số."
2835 = "Tám giờ tối."
2841 = "\"Không lẽ\" dường như đã trở thành hiện thực.\\\\nNhưng——với cái hàng người này thì——"
2852 = "Chị Mayami là Trưởng ban Bầu cử."
2853 = "Chị Mayami đã nói lên thắc mắc trong góc khuất trái tim tôi.\\\\nCó thể là do sự tương trợ giữa những người \\\\x%lまいてつ;#00ffc040;chủ tàu%l;#; với nhau, nhưng mà……"
2855 = "Lời nói của chị Mayami đã cho tôi biết.\\\\nGió, có nghĩa là——"
2856 = "Con người, tiền bạc và luồng gió dư luận.\\\\nTôi thấm thía rằng những lời chị Mayami nói chính là thứ tự ưu tiên trong bầu cử."
2862 = "Trăm nghe không bằng một thấy, tôi cởi áo ra."
2865 = "Không thể chạm vào."
2870 = "Quả thực rất tuyệt vời.\\\\nNếu chuyện này trở thành hiện thực, tình hình sẽ thay đổi một cách chóng mặt."
2872 = "Tất cả những mảnh giấy còn dang dở đã biến thành những tòa nhà tuyệt đẹp.\\\\nSự hoàn thiện khó tin đối với đồ thủ công bằng giấy khiến tôi nín thở."
2874 = "Nó là gì, hay tại sao lại như vậy,\\\\nđể về nhà, khi chỉ còn một mình rồi hẵng tìm hiểu."
2877 = "Không, không đúng.\\\\nGiờ không phải lúc để tận hưởng cảm giác sảng khoái khi được xoa bóp."
2878 = "Thời gian ông ấy dành cho tôi vẫn còn khá nhiều.\\\\nCửa hàng thì có vẻ như phu nhân đang trông coi——"
2883 = "Mặc dù vậy, cũng có giới hạn thời gian là ngày bỏ phiếu."
2885 = "Trong khi tôi vẫn đang loay hoay bôi hồ dán cho cái đầu tiên——"
2893 = "Cảm giác nhóp nhép.\\\\nLòng bàn chân Hibiki rõ ràng đang rịn thêm mồ hôi mới."
2901 = "\"Con cháu đời sau\", trước giờ tôi chưa từng nghĩ đến."
2903 = "Nếu không chỉ tay xác nhận thì thật khó mà tin được.\\\\nSố lượng số 0 này, đây là……"
2907 = "Vừa nói chuyện bình thường với tôi,\\\\nnhững ngón tay của ông Minokasa đã nhanh nhẹn và chuẩn xác cắt rời những mảnh giấy."
2913 = "Đôi mắt hiền từ của ông Minokasa\\\\nchậm rãi đưa mắt nhìn quanh sự náo nhiệt của Rail Shop."
2914 = "Ông Minokasa cười khổ đầy trìu mến."
2915 = "Cười ha hả, ông Minokasa rời khỏi Rail Shop."
2916 = "Ông Minokasa khẽ vẫy tay."
2917 = "Đôi bàn tay nhăn nheo của ông Minokasa\\\\nđã hoàn thành xong ba mô hình kiến trúc bằng giấy."
2952 = "Nói xong. Paulette hít một hơi thật sâu.\\\\nKết quả là, lại thành một màn 『úp mở』 cực kỳ hiệu quả."
2967 = "Cái này——\\\\nHibiki, đúng rồi, đang mặc váy mà."
2968 = "Cái này——\\\\nthật là……biết nói sao đây."
2969 = "Nếu là tin tức này, chắc chắn,\\\\nsẽ được truyền từ người này sang người khác, không ngừng nghỉ."
2970 = "Cuộc bầu cử này,\\\\nthực chất là trận quyết đấu một mất một còn giữa Hibiki và Kisaki."
2971 = "Tôi thì không rành lắm nhưng……"
2972 = "Vừa nghĩ đến đó, tác phẩm của người họa sĩ lang thang cầm nắm cơm nắm trên tay.\\\\nKhung cảnh pháo hoa Nagaoka chợt lóe lên trong đầu tôi."
2973 = "Một Paulette như vậy lại gọi điện bảo 『Có tin tức sốt dẻo nên hãy đợi em nhé』,\\\\nthì làm sao mà không kỳ vọng cho được."
2974 = "Nếu vậy thì, nó sẽ không bao giờ dừng lại nữa."
2975 = "Hoàn thành công việc này trong thời gian ngắn như vậy……\\\\nQuả thực, đây chính là kỹ năng của một nghệ nhân."
2981 = "Qua quá trình giao lưu lúc phục hồi \\\\x%l8620;#00ffc040;8620%l;#;, họ đã công nhận sự nỗ lực của tôi——\\\\nLời của ông Minokasa chẳng khác nào đang truyền đạt lại điều đó."
2982 = "Thân nhiệt của Hibiki tăng cao đến mức có thể truyền qua cả lòng bàn chân.\\\\nĐiều đó cho thấy em ấy đang vui mừng đến nhường nào."
2984 = "Trong khi còn chưa rõ điều đó,\\\\nmà lại trút dục vọng lên Hibiki thì——"
2988 = "Là phụ huynh của học sinh sao?\\\\nHay là người bị thu hút bởi sự náo nhiệt này mà đến?"
2989 = "Ở phần hồ sơ cá nhân bên góc phải blog,\\\\ncó ghi \"Tên: A SHELL\"."
2994 = "Thời gian hoạt động của Rail Shop, vốn được kéo dài thêm hai tiếng so với thường lệ,\\\\ncuối cùng cũng kết thúc."
2996 = "Mức giá được đưa ra còn cao hơn cả số tiền tài trợ.\\\\nSự hào phóng quá đỗi khiến tôi không thốt nên lời."
2997 = "Dù không nhìn thấy, nhưng tôi có thể mường tượng qua giọng nói.\\\\nNụ cười rạng rỡ đang hiện trên khuôn mặt Hibiki."
3000 = "Trước những câu hỏi dồn dập từ cả hai phía,\\\\nPaulette gật đầu đáp lại với nụ cười rạng rỡ."
3006 = "（……Hibiki có vẻ cũng không thay đổi gì.）"
3032 = "（Bảo vệ Ohimitera hiện tại, bảo vệ sông Kuma,\\\\nkhông chỉ là bảo vệ lịch sử, mà còn là kiến tạo tương lai.）"
3035 = "（Nhưng mà……ra là vậy, lúc vẽ hình ảnh chủ đạo thì——\\\\nHy vọng của chúng tôi quá chi tiết, quá gần gũi……）"
3036 = "（Bịch!）"
3037 = "（Chỉ sắp nhìn thấy đồ lót thôi mà sao lại thế này chứ——\\\\nThứ ghim chặt ánh nhìn của tôi, không phải đồ lót mà là……）"
3040 = "（Chính xác là vậy. Nếu chúng ta thua cuộc,\\\\nảnh hưởng của nó sẽ lan đến tận con cháu đời sau.）"
3041 = "（Mình……đang muốn kết hợp với Hibiki sao.）"
3044 = "（A……\\\\nRa là vậy, thì ra là thế.）"
3045 = "（Nhấn, nhấn）"
3046 = "（Nhấn——mạnh——）"
3047 = "（Nhấn mạnh!）"
3048 = "（Nhấn）"
3049 = "（Dẫm, xoa——nhấn——nắn）"
3050 = "（Dẫm）"
3052 = "（Đây là……dục vọng của thể xác sao.\\\\nHay là, con tim cũng đang khao khát)"

[selections]
