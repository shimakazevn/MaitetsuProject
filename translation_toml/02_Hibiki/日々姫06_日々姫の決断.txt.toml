2556 = "「Trong cuộc bầu cử đó, nếu ứng cử viên thuộc phe phản đối thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; giành chiến thắng,\\nthì chúng ta có thể một lần nữa chứng minh được ý nguyện của người dân.」"
