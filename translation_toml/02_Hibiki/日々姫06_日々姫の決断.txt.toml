2345 = "「Những khung cảnh chỉ khi làm Thị trưởng mới có thể nhìn thấy, những điều chỉ khi làm Thị trưởng mới có thể biết——Chắc chắn là có mà.」"
2347 = "「Không được đâu, làm thế thì gió vẫn sẽ thổi về phía bên kia thôi. Sẽ bị biến thành cuộc cãi vã giữa một người đàn ông trưởng thành và một cô bé mất.」"
