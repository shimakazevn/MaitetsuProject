2354 = "「Tuy nhiên chị Kisaki lại thích học, và cũng thích trường học,\\nnên có vẻ chị ấy vẫn cố gắng đến trường nhiều nhất có thể.」"
2355 = "「Nhưng mà, các cuộc bầu cử thời nay lại thường được cho là\\n“quyết định bởi con người, tiền bạc và ngọn gió”.」"
