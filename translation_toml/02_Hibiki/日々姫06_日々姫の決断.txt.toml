2367 = "「Nghĩa là, nếu làm một công việc được công nhận là phù hợp, thì thông qua công việc đó, sẽ nhận được bằng tốt nghiệp sao?」"
2374 = "「Mọi chuyện vốn đã được định sẵn rồi. Cho dù Hibiki có nói gì, hay có giữ im lặng thì cũng chẳng liên quan đâu.」"
2378 = "「Con người, tiền bạc, ngọn gió——Trong cuộc bầu cử Thị trưởng lần trước, cái nào đã đứng về phía Pou-chan nhỉ.」"
2383 = "「Trúng đúng ý đồ là sao chứ! Nếu là ngài Soutetsu, ngài ấy sẽ đập nát cái ý đồ đó cho xem!」"
2384 = "「Gì vậy chứ. Đúng là đồ trẻ con thích làm nũng mà.」"
2385 = "「Cái gì!?」"
2387 = "「Nhưng hôm nay, em vẫn là một Hibiki thích làm nũng. Thế nên, em muốn xin một câu thần chú——một câu thần chú tiếp thêm dũng khí.」"
