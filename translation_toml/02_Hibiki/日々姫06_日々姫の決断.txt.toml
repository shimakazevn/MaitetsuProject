2580 = "「Ra vậy. Thời Hachiroku còn đang hoạt động,\\nvẫn chưa có chế độ vừa học vừa làm nhỉ.」"
2581 = "「Ra là vậy……\\nĐó cũng là con đường để có thể bình đẳng với anh trai nhỉ.」"
2582 = "「Là tốt nhất cho thành phố Ohimitera và Đường sắt Ohimitera.\\nVà cũng là tốt nhất cho tất cả chúng ta.」"
2585 = "「Để trở thành Thị trưởng, liệu Hii-chan bây giờ\\ncó đủ quyết tâm để đặt bút vẽ xuống không?」"
2586 = "「Sou-chan thì không thắng nổi đâu.」"
2589 = "「Một kẻ thực chất là người ngoài như anh mà trở thành ứng cử viên,\\nthì liệu có thể chiến thắng trong cuộc bầu cử ở Ohimitera không?」"
2591 = "「Dù là vậy——\\nEm cũng không muốn những bước đi thiếu vững chắc như thế này.」"
2598 = "「Đủ để bù đắp toàn bộ số tiền đã chi cho \\x%l8620;#00ffc040;8620%l;#;,\\nvà còn dư ra một chút——kiểu như vậy nhỉ.」"
2613 = "「Sao vậy Hachiroku. Nếu em có điều gì bận tâm,\\nthì cứ nói ra sẽ giúp ích nhiều hơn đấy.」"
2621 = "「Về chuyện ứng cử các thứ ấy mà.」"
2623 = "「Em——\\nNếu em ra ứng cử thì sao.」"
2626 = "「Tại vì……em……chỉ muốn chị ấy hiểu.\\nRằng chị Paulette đang phải gánh vác rất nhiều thứ, rất vất vả, và đang cố gắng đến nhường nào.」"
2627 = "「Em.」"
2628 = "「Em không rõ ở các quốc gia khác thì thế nào, nhưng nền giáo dục ở Hinamoto\\nquả thực được nhận thức như vậy ạ.」"
2630 = "「Em không biết. Chỉ là em đang đợi thôi.」"
2631 = "「Em không biết ạ.」"
2634 = "「Em đã từng nghĩ như vậy.\\nNhưng chị Kisaki cũng là ân nhân, người đã tạo ra chốn dung thân cho em.」"
2635 = "「Anh đã nói trước đó rồi, vụ việc lần này...」"
2637 = "「Anh cũng vậy.」"
2640 = "「Chúng ta không thể phủ nhận bản tin dự đoán từ chức này,\\ncũng không thể bắt họ rút lại được.」"
2643 = "「Vốn dĩ, để hủy bỏ việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nanh mới quay lại thành phố này. Trở thành ứng cử viên cũng không sao. Nhưng mà.」"
2645 = "「Cũng không phải là em lại định chạy theo\\ncái mông của anh hai đâu nhé?」"
2648 = "「Em không định nhận trách nhiệm đâu nhé?」"
2650 = "「Vì em là một cô em gái ngoan mà.\\nNên việc trở thành sức mạnh để giúp anh trai đạt được mục đích là chuyện đương nhiên.」"
2653 = "「Tại em muốn nói chuyện với anh hai mà.」"
2656 = "「Bằng chính đôi chân của mình.\\nEm muốn có thể tự đứng lên và bước đi càng sớm càng tốt.」"
2658 = "「Em muốn trở thành một người có thể bước đi với cùng một sải bước như anh trai.\\nVà đôi khi, còn có thể nắm lấy tay anh trai——một người phụ nữ trưởng thành.」"
2660 = "「Em đã suy nghĩ rồi. Việc em dao động,\\nnói ngược lại, là vì em có đủ sự dư dả để dao động.」"
2662 = "「Em hiểu ạ.\\nViệc phủ nhận luôn mang lại tác dụng ngược, chỉ còn cách phớt lờ nó đi thôi.」"
2663 = "「Em, sẽ tự mình bước đi.\\nSẽ trở thành một người lớn đàng hoàng.」"
2664 = "「Vì muốn ngồi lên chiếc ghế Thị trưởng, anh đã trở thành người yêu của Paulette,\\nrồi ép buộc cô ấy từ chức……Họ có thể dựng lên một kịch bản như vậy sao.」"
2665 = "「Tất nhiên anh cũng ủng hộ Hibiki.\\nNếu đề cử Hibiki, chúng ta nhất định sẽ trở thành một khối thống nhất.」"
2666 = "「Trà này,\\nanh cảm thấy hình như em pha hỏng mất rồi thì phải.」"
2668 = "「Anh có thể hỏi chuyện Reina một chút được không?」"
2669 = "「Em nghĩ hỏi chị Mayami là tốt nhất.\\nChuyện bầu cử ở Ohimitera……có lẽ chị ấy là người rành hơn bất cứ ai.」"
2670 = "「Đang dụ dỗ,\\nđể anh trở thành ứng cử viên đấy.」"
2673 = "「Với năng lực của em, việc tiếp tục kiêm nhiệm cả chức Thị trưởng Ohimitera và Giám đốc Đường sắt Ohimitera,\\nem cảm thấy là vô cùng khó khăn.」"
2675 = "「Em, em! Em đi ngủ đây!\\nChúc, chúc! Chúc anh hai ngủ ngon!」"
2676 = "「Thế nên……mới trúng đúng ý đồ của bên kia.」"
2679 = "「Vì vậy, em sẽ không giấu giếm mà truyền đạt cho mọi người.\\nNhững băn khoăn, trăn trở và cả những điều em đã học được. Tất cả, y như những gì em nghĩ.」"
2681 = "「Chính vì vậy——Em muốn tạo ra một hình thức tốt nhất.\\nRồi sau đó từ chức Thị trưởng, em đã quyết định như vậy.」"
2683 = "「Vì thế, em sẽ đưa mọi thứ về con số không.\\nKhông tán thành cũng không phản đối——Em sẽ tự mình suy nghĩ.」"
2684 = "「Thế nên, anh hai——anh trai tuyệt đối sẽ không thể thắng được đâu.\\nĐúng hơn là……phe của chị Kisaki」"
2687 = "「Hay là……rút lại quyết định từ chức.」"
2690 = "「Nếu đối phương lơ là, thì tấn công vào điểm đó là sách lược cơ bản.\\nNếu họ nghĩ rằng 『Môi trường để chiến thắng đã được chuẩn bị xong』, thì đó chính là sự lơ là đấy.」"
2694 = "「Nếu không tốt thì,\\nchị Paulette không được trở thành vịt què đâu nha.」"
2696 = "「Nếu vậy thì em cũng tán thành ạ. Nếu là Hibiki,\\nem tin chắc rằng cô ấy sẽ vẽ nên một Ohimitera tốt đẹp hơn.」"
2699 = "「Nếu là trao đổi lợi ích,\\nthì chắc chắn phải có yêu cầu nào khác ngoài quảng cáo đúng không?」"
2705 = "「Hibiki đã rất quan tâm đến Paulette.」"
2706 = "「Hibiki, em thấy thế——」"
2709 = "「Trường học ở Hinamoto vốn dĩ chuyên về việc tìm ra năng lực nghề nghiệp,\\nvà những bài học, huấn luyện để tìm ra điều đó đúng không?」"
2710 = "「Hôm qua có khách đến đúng không nào?\\nChị muốn Reina kể lại y như những gì em thấy lúc đó nhé.」"
2712 = "「Hôm qua là giám đốc ngân hàng.\\nChú Houshou đã đến gặp chị Paulette đó ạ.」"
2719 = "「Là trao đổi lợi ích sao?」"
2721 = "「Đúng vậy. Kế thừa trọn vẹn địa bàn của cựu Thị trưởng,\\nhơn nữa lại còn có luồng gió thuận mạnh mẽ mang tên cuộc bầu cử tang tóc thổi tới nữa chứ.」"
2724 = "「Đúng……vậy nhỉ. Những người ủng hộ chị Paulette,\\ntất cả đều đang đoàn kết lại vì phản đối việc thu hút nhà máy mà.」"
2726 = "「Đúng……nhỉ, thật sự.\\nĐến chuyện của bản thân mình mà cũng không biết, kỳ lạ quá nhỉ.」"
2727 = "「Đúng vậy nhỉ. Hachiroku.」"
2729 = "「Đúng vậy. Chị cũng nghĩ thế.\\nĐúng hơn là, nếu để Sou-chan ra tranh cử, thì sẽ trúng đúng ý đồ của bên kia.」"
2730 = "「Ừ.」"
2731 = "「Đúng vậy nhỉ, Reina.」"
2732 = "「Vậy sao.」"
2734 = "「Là những chính trị gia dù đã mất đi sức ảnh hưởng chính trị nhưng vẫn tại vị.\\nĐiều đó sẽ trở thành nguyên nhân gây ra sự hỗn loạn trong hội đồng, không tốt chút nào đâu.」"
2735 = "「Đúng, vậy.\\n……Thành thật mà nói, em đã dao động.」"
2738 = "「Đúng vậy. Lời đề nghị đó thực chất là cung cấp lợi ích.\\nMột hợp đồng dài hạn 20 năm, với phí quảng cáo 10 triệu yên mỗi năm.」"
2739 = "「Đúng vậy. Chỉ cần nộp đơn và được chấp thuận thì sẽ nhận được tín chỉ từ công việc.\\nChị Kisaki cũng đang tận dụng triệt để chế độ đó đấy.」"
2741 = "「Vâng.」"
2742 = "「Đúng vậy. Đúng là thế đó, Hibiki.」"
2746 = "「Thì ra là vậy ạ.」"
2747 = "「Vậy sao ạ?」"
2749 = "「Huống hồ lại là trên Đường sắt Ohimitera——À, không,\\nnếu nhìn nhận một cách tích cực thì có lẽ họ đang kỳ vọng vào việc chấn hưng du lịch... chăng?」"
2753 = "「Hình thức tốt nhất, ý cô là tốt nhất cho ai,\\nhay tốt nhất cho cái gì ạ?」"
2754 = "「Tiền bạc thế nào thì em không biết, nhưng——\\ncon người và ngọn gió thì chắc chắn là có.」"
2757 = "「Thú vị đấy. Mặc dù ông ấy có vẻ là người không thích sử dụng sức ảnh hưởng của mình……\\nnhưng nếu ông ấy chịu ra tranh cử thì.」"
2760 = "「Quả nhiên——là vậy nhỉ. Thế nên, anh hai.\\n——Anh trai sẽ không thể thắng trong cuộc bầu cử lần này đâu.」"
2764 = "「Thử so sánh xem nào. Đầu tiên là tiền bạc.\\nGiữa anh và Kisaki thì cái này thế nào?」"
2766 = "「Không cần phải sợ hãi. Cũng chẳng có gì phải run rẩy cả.\\nHibiki không làm sai bất cứ điều gì hết.」"
2767 = "「Đúng vậy, anh trai. Em sẽ tự mình làm điều đó.\\nKhông phải là câu trả lời do ai đó tìm ra, mà chắc chắn sẽ là câu trả lời của chính em.」"
2768 = "「Đúng vậy. Hibiki chỉ nói chuyện với đàn chị ở trường thôi.」"
2775 = "「Về mặt pháp lý thì không sao đâu. Quyền ứng cử cũng giống như quyền bầu cử,\\nsẽ được công nhận khi đủ 15 tuổi.」"
2779 = "「Paulette.」"
2781 = "「Lá phiếu chưa quyết định?」"
2782 = "「Tại sao chứ ạ!?」"
2789 = "「Thế là em bị kẹp giữa anh trai và chị Kisaki.\\nVị trí đứng của em rất khó khăn, vì vậy em mới trở nên do dự.」"
2790 = "「Vì thế, sau bốn năm và một ngày.\\nEm của ngày hôm đó, nhất định sẽ vẽ được bức tranh mà em của hiện tại không thể nào vẽ được.」"
2791 = "「Reina thấy ý kiến đó rất tuyệt nha!\\nNếu chị Hibiki làm Thị trưởng thì yên tâm lắm luôn á.」"
2794 = "「Chỉ là cứ nhìn chằm chằm vào cái mông của chị Kisaki,\\nrồi lạch bạch bám theo thôi mà.」"
2799 = "「Đôi mắt và trái tim?」"
2801 = "「Dạ vâng ạ!\\nReina sẽ kể cho anh Soutetsu nghe về người khách đó nha~」"
2814 = "「Cân nhắc, sao——」"
2817 = "「Một ứng cử viên có năng lực vượt trội hơn ngài Soutetsu,\\ndù có tìm khắp Ohimitera cũng không thấy đâu.」"
2819 = "「Bởi vì người có thể chiến thắng trong bầu cử, là người có thể tạo ra gió.\\nDù là gió thuận cho bản thân, hay gió ngược cho đối thủ.」"
2820 = "「Những tầng lớp sẵn sàng bỏ tiền ra cho Sou-chan hay Pou-chan,\\nthì trong vụ việc liên quan đến đường sắt lần này, hầu bao cũng đã vơi đi kha khá rồi.」"
2827 = "「Giỏi đấy. Sao em biết là anh?」"
2828 = "「Nếu lúc đó em dứt khoát từ chối ngay lập tức,\\nthì tuyệt đối đã không có bài báo nào như vậy xuất hiện.」"
2830 = "「Anh cứ tự nhiên. Như vậy thì, em cũng……\\nChắc chắn con bé sẽ truyền đạt chính xác hơn là em kể lại.」"
2831 = "「Cảm ơn anh hai.」"
2832 = "「Cảm ơn anh. Nhưng mà, em sẽ tự mình nói ra.\\nEm phải tự mình nói ra——Chắc chắn là vậy.」"
2833 = "「Khiến họ nghĩ vậy?」"
2834 = "「Để mọi người phải đợi rồi.」"
2835 = "「Là Houshou Kisaki sao.」"
2836 = "「Để ngài Soutetsu làm ứng cử viên kế nhiệm——\\nĐó là chiến lược của Thị trưởng Paulette sao?」"
2846 = "「Vịt què là gì vậy ạ?」"
2866 = "「Điều đó thì đúng là……như vậy thật, nhưng mà.」"
2867 = "「Điểm đó thì em cũng có biết ạ.\\nNhưng mà——em e là sẽ khó mà cân bằng được với việc học.」"
2868 = "「Chuyện như vậy! Hoàn toàn vô căn cứ——」"
2869 = "「Nghĩa là, đây sẽ là một cuộc bầu cử giằng co quyết liệt đấy——\\nSự quyết tâm mạnh mẽ đến đâu sẽ là yếu tố quyết định thắng bại nhỉ.」"
2870 = "「『Sẽ cân nhắc việc từ chức Thị trưởng』——\\nNếu bị hiểu như vậy thì cũng hết cách, phát ngôn đó quả thật là vậy.」"
2871 = "「Đó chắc chắn là một việc tốt.\\nVậy mà em ngốc thật đấy, Hibiki. Tự nhiên lại run lẩy bẩy thế kia.」"
2872 = "「Sự dư dả đó, là do anh Soutetsu đã mang đến cho em.\\nVì nghĩ rằng có anh Soutetsu ở bên, nên em——」"
2873 = "「Nghĩ theo hướng đó thì, dù là chất hay lượng của những quân cờ còn lại,\\nphe ta vẫn nhỉnh hơn đấy.」"
2883 = "「Bầu cử là chiến tranh. Chị Paulette cũng đã nói vậy mà.\\nChuyện đó, em nghĩ nếu không cố gắng thì sẽ không thể thắng được đâu.」"
2884 = "「Cuộc chiến bầu cử.\\nBầu cử——nói cách khác, chính là chiến tranh.」"
2885 = "「Cuộc chiến bầu cử sẽ khắc nghiệt lắm đấy.」"
2886 = "「Toàn là chữ \"bản\" không thôi nha~」"
2888 = "「Cái đó thì……quả nhiên là bên kia rồi ạ.」"
2890 = "「Chuyện đó……\\nChuyện đó giống hệt như một chú vịt con vậy.」"
2892 = "「Đúng là……vậy, nhưng mà.\\nNhưng chị Kisaki là người của Ngân hàng Kumamoto cơ mà.」"
2897 = "「Cái đó thì cũng phải xem đã. Cho là bé Kisaki và Sou-chan ngang tài ngang sức đi,\\nthì Giám đốc Houshou và chị cũng ngang ngửa nhau.」"
2900 = "「Vậy thì, nếu lỡ làm anh trai khóc,\\nthì em sẽ an ủi anh nhé?」"
2902 = "「Chuyện đó thì, thắng bại là do vận may thôi ạ.」"
2904 = "「Nếu vậy thì, anh xin phép nhé.\\nReina cũng không phiền chứ?」"
2905 = "「Vậy thì đến hiệp thứ ba.\\n“Ngọn gió” sẽ thổi về phía bên nào đây nhỉ?」"
2907 = "「Vậy thì đợi anh một chút nhé.」"
2911 = "「Nếu vậy! Thế này là hòa một đều rồi.」"
2912 = "「Vậy thì. Lần này đến lượt câu hỏi cho Hii-chan nhé.」"
2913 = "「Chỉ tổ rơi vào tình trạng vịt què điển hình thôi.」"
2914 = "「Vậy thì, ngài Đền chủ Akai thì sao ạ?\\nNgười đó là đồng minh của đường sắt mà?」"
2915 = "「Nếu vậy thì, Hachiroku.」"
2916 = "「Nếu vậy, chiến lược tốt nhất——chiến lược để giành chiến thắng,\\nThị trưởng Paulette đã suy nghĩ xong rồi sao?」"
2919 = "「Tiền bạc thuộc về bên kia, con người thuộc về bên này, tỷ số là một đều.\\nĐã vậy rồi mà……」"
2921 = "「Anh hai……」"
2922 = "「Anh hai?」"
2923 = "「Anh hai——」"
2926 = "「Ngân hàng Kumamoto mà lại quảng cáo ở Ohimitera sao? Bọn họ định quảng cáo cái gì cơ chứ?」"
2929 = "「……Ngài……Soutetsu…………\\nPhanh……vẫn chưa…………vẫn chưa……」"
2930 = "「Anh Soutetsu, em cảm ơn anh nha~」"
2931 = "「Anh Soutetsu.」"
2932 = "「Ngài Soutetsu——」"
2933 = "「Ngài Soutetsu.」"
2938 = "「Gió là cái thổi vù vù đó hả chị?」"
2939 = "「Gió đang cân bằng.」"
2942 = "「っ!」"
2946 = "「??? Chị không biết sao ạ?\\nChuyện của chị Paulette cơ mà.」"
3117 = "Mọi thứ trở nên sảng khoái, nhẹ nhõm đến mức\\ntôi tự hỏi tại sao nãy giờ mình lại cứ chần chừ mãi như vậy."
3120 = "Khi nói ra thành lời, sự căng thẳng cũng tan biến."
3125 = "Ngay khoảnh khắc tiếp theo, cô ấy ngẩng mặt lên như thể ngạc nhiên với chính bản thân mình,\\nvà nhìn tôi bằng đôi mắt như chực trào nước mắt."
3129 = "Là do cho quá nhiều trà, hay là ngâm quá lâu nhỉ.\\nKhông, có lẽ là do cả hai nguyên nhân kết hợp lại."
3131 = "Dù sao đi nữa, những gì Hibiki đã kể,\\nđối với Kisaki có lẽ cũng chỉ là một trong những tư liệu mà thôi."
3132 = "Mức độ nhận diện và tầm ảnh hưởng đều cực kỳ lớn,\\nthật khó mà tin được là họ lại cần phải quảng cáo."
3135 = "Dù rằng tình trạng này đã diễn ra\\ntừ trước khi Paulette pha trà cho chúng tôi."
3137 = "Không, tôi không ngủ——\\nmà đang lãng phí thời gian một cách vô ích."
3138 = "Không, biết đâu chừng——\\nKisaki đã cân nhắc theo hướng đó từ trước rồi cũng nên."
3140 = "Giống như ngày xưa……\\nHoàn toàn không phải."
3141 = "Không phải là một mùi hương đau đáu, cuồng dại đến thế này."
3142 = "Không phải là một mùi hương nồng nàn, nóng bỏng,\\nngột ngạt đến mức khiến lồng ngực tôi xốn xang thế này."
3146 = "Giọng nói vốn yếu ớt của Paulette, dù đã được Reina thúc đẩy để cất lên,\\nnay bỗng trở nên đầy nội lực."
3153 = "Nghỉ một ngày là chậm mất ba ngày——\\nLuôn miệng nói vậy, Hibiki đã liên tục vẽ tranh mỗi ngày."
3155 = "Chắc là vì lo lắng cho những lời nói yếu ớt đó,\\nReina lạch bạch chạy đến chỗ Paulette."
3156 = "Thấy em ấy cứ thế im lặng,\\ntôi bèn thử giục em ấy nói tiếp."
3159 = "Nhưng hôm nay,\\ntôi cảm thấy Hibiki có chút gì đó——to lớn hơn, trưởng thành hơn mọi khi."
3161 = "Nhưng nếu cứ sợ hãi mà dừng lại,\\nthì sẽ làm lãng phí hơi nước mất."
3167 = "Thúc đẩy sự phán đoán của những người không thuộc đảng phái nào, những người không tán thành cũng không phản đối——\\nđiều đó sẽ kết nối với tương lai của Ohimitera."
3177 = "Trong sự im lặng, tất cả đều đã chia sẻ cùng một suy nghĩ——\\nDù là nhận thức bắt buộc phải có, nhưng nếu không nói ra thì sẽ không thể tiến lên được."
3182 = "Hachiroku không để Paulette ngoảnh lại.\\nLúc này, cô ấy thậm chí không cho phép Paulette dừng bước."
3183 = "Lời nói buột miệng.\\nGiọng của Hachiroku mang theo điệu bộ như vậy."
3185 = "Hachiroku hé môi định nói điều gì đó, nhưng rồi lại mím chặt.\\nSau đó em ấy lắc đầu thật mạnh, rồi ngẩng mặt lên nhìn thẳng."
3188 = "Hachiroku chỉ nói vậy rồi nhìn tôi.\\nÁnh mắt như đang hối thúc tôi."
3190 = "Hachiroku gật đầu thật mạnh như đã hiểu ra vấn đề."
3191 = "Hachiroku đã ngủ say.\\nCòn tôi thì hoàn toàn không ngủ được."
3194 = "Trong giọng điệu kinh ngạc của Hachiroku,\\ncó xen lẫn cả sự thán phục."
3195 = "Ngay cả ánh mắt của Hachiroku,\\ncũng rời khỏi Paulette và hướng về phía tôi."
3199 = "Câu hỏi của Hachiroku,\\nkhông dành cho Paulette, cũng chẳng dành cho tôi."
3200 = "Thắc mắc hết sức đương nhiên của Hachiroku,\\nngược lại, lại khiến tôi nhận ra khoảng thời gian em ấy chìm trong giấc ngủ dài đến nhường nào."
3201 = "Hachiroku có vẻ hơi bất mãn, nhưng vẫn im lặng lắng nghe."
3204 = "Đưa ra gợi ý để con bé tự nhận ra\\ncâu trả lời mà đáng lẽ ra con bé đã biết——Vì mục đích đó."
3206 = "Làm thế nào để tạo ra gió, tôi hoàn toàn không tìm ra câu trả lời."
3208 = "Hibiki nãy giờ vẫn cúi gầm mặt, giờ cũng đã ngẩng lên,\\nvà nhìn Paulette một cách kiên định."
3214 = "Hoặc có lẽ là do thân nhiệt của Hibiki,\\ntừ khoảng cách sát rạt này, đang truyền sang tôi."
3216 = "Lời nói của chị Mayami đã chỉ cho tôi thấy."
3227 = "Nhưng chỉ cần nói chuyện với Kisaki một lần thôi,\\ncó lẽ bất cứ ai cũng sẽ tin chắc rằng cô ta là \"loại người như vậy\"."
3229 = "Nhưng——bản thân tôi cũng cảm nhận rõ ràng rằng\\nnhận định của Hibiki là chính xác."
3242 = "Đồng ý, hoặc phản đối. Câu trả lời chỉ nên là một trong hai,\\nvà nếu đã vậy, thì câu trả lời của tôi chỉ có một."
3244 = "À, ra là vậy——\\nNhờ thế mà tôi cũng đã hiểu được vấn đề."
3246 = "À, điều đó có nghĩa là——"
3256 = "Bốn năm là một khoảng thời gian dài đến nhường nào,\\nkhông có lý do gì mà con bé lại không biết."
3259 = "Cảm thấy bất ngờ, và ngay khoảnh khắc đó, tôi chợt nhớ ra.\\nNhắc mới nhớ, \\x%l機関士;#00ffc040;người lái tàu%l;#; trước đây của Hachiroku là phụ nữ."
3264 = "Địa bàn là tổ chức, bảng hiệu là độ nổi tiếng, cặp táp là tiền bạc,\\nPaulette đã khéo léo giải thích cho mọi người hiểu."
3266 = "Chiếc gối tựa.\\nThứ mà tôi đã từng ngồi từ rất lâu rồi."
3269 = "Làm nũng, và theo một ý nghĩa nào đó, là phụ thuộc.\\nGiống như cách mà Hibiki ngày xưa đã từng làm với tôi."
3271 = "Nụ cười dịu dàng thường ngày đã biến mất,\\nthay vào đó là một vẻ mặt nghiêm túc đến đáng sợ."
3272 = "Đôi mắt con bé lại ngập nước, và để ngăn không cho những giọt nước mắt ấy tuôn rơi,\\ncon bé đang tuyệt vọng kìm nén."
3274 = "Chắc em ấy đang mơ thấy cảnh huấn luyện."
3276 = "Thắc mắc của Reina không bị phủ nhận.\\nKhuôn mặt con bé ngày càng lộ rõ vẻ khó hiểu."
3279 = "Chị Mayami nhìn Hibiki một cách hài lòng, rồi nhìn Paulette như để xác nhận.\\nSau đó, ánh mắt chị ấy hướng về phía tôi."
3280 = "Để kết nối quyết định đó với tương lai——\\ncô ấy đã đặt câu hỏi."
3281 = "Đôi mắt con bé đỏ hoe.\\nĐôi mắt đã khóc cạn nước mắt, đến mức nước mắt cũng đã khô đi."
3283 = "Ánh mắt con bé dán chặt xuống sàn nhà,\\nkhông hề nhúc nhích như thể bị đóng đinh ở đó."
3284 = "Nơi ánh mắt em ấy hướng đến, là tờ báo sáng nay.\\nTóm lại, mọi chuyện là như vậy đó."
3287 = "Lời nói của cô ấy không còn rụt rè nữa.\\nÁnh mắt cũng đã lấy lại được sức mạnh."
3290 = "Sự rõ ràng đó đã khai sáng điểm mù của chúng tôi."
3291 = "Cô ấy chớp mắt, rồi nuốt nước bọt."
3292 = "Ghét bị đem ra so sánh với chị Mayami——\\nGhét bị gọi là \"Em gái của Mayami\" hơn bất cứ điều gì."
3293 = "Vừa nói đến đó, Hachiroku liền nuốt lại lời,\\nvà nhăn nhó mặt mày như thể vừa nhai phải con bọ đắng."
3296 = "Paulette nuốt nước bọt một cái,\\nrồi hạ giọng xuống một chút và nói."
3297 = "Hướng về phía Reina đang tỏ ra thích thú——\\nKhông, là giả vờ hướng về phía Reina."
3302 = "Nói đến đó, Paulette nhìn chằm chằm vào Hibiki."
3303 = "Nói rồi, Hibiki đứng dậy."
3304 = "Con bé nhắm mắt lại, rồi mở ra.\\nNuốt nước bọt một cái thật mạnh."
3307 = "Ánh mắt đảo quanh một vòng lớn,\\nrồi hướng thẳng——nhìn chằm chằm vào chị Mayami."
3314 = "Giả sử bài báo đó có được tung ra đi nữa, nếu hoàn toàn không có căn cứ,\\nthì chỉ cần dùng đến các biện pháp pháp lý là được."
3315 = "Thị trưởng rời khỏi hội trường vì phát ngôn quấy rối tình dục——\\nBài báo và những lời của Hibiki dường như đã được kết nối với nhau."
3326 = "Đứng từ góc độ của Công ty Cổ phần Đường sắt Ohimitera,\\nđây là một con số hấp dẫn có thể đưa rủi ro đầu tư về mức 0."
3340 = "Đột nhiên, tôi cảm nhận được một cách mãnh liệt đến chóng mặt.\\nMùi hương của Hibiki, trong căn phòng của Hibiki."
3346 = "Có lẽ Kisaki đã xem thường Paulette.\\nNên Hibiki mới tuyệt vọng bênh vực cô ấy."
3348 = "Hibiki nãy giờ vẫn cúi gầm mặt bỗng ngẩng lên."
3350 = "Rằng Hibiki đã nói \"Mài giũa đôi mắt và trái tim\"\\nvới một quyết tâm lớn đến nhường nào."
3354 = "Có cảm giác như bị đọc thấu tâm can, tôi giật mình ngạc nhiên.\\nNhưng Hibiki lại không nhìn tôi."
3358 = "Vừa định nói, tôi lập tức nuốt lại lời."
3360 = "Tôi có thể khẳng định điều đó.\\nDù số lần tiếp xúc trực tiếp với Kisaki chỉ đếm trên đầu ngón tay."
3364 = "Tôi biết.\\nKhông, tất cả mọi người ở đây chắc chắn đều biết."
3367 = "Để con bé vùi mặt vào áo tôi,\\nvà không cần phải kìm nén những giọt nước mắt thêm nữa."
3368 = "Nắm lấy tay Hibiki. Đứng dậy.\\nGiữa chúng tôi có sự chênh lệch chiều cao. Tôi đang ở tư thế nhìn xuống Hibiki."
3371 = "Tôi chỉ có thể gật đầu."
3372 = "Việc trở thành ứng cử viên kế nhiệm,\\nrốt cuộc sẽ mang lại bao nhiêu lợi thế, tôi hoàn toàn không thể đoán trước được."
3373 = "Tất nhiên, tôi cảm thấy rất biết ơn và trân trọng điều đó.\\nChính vì thế——những thắc mắc cũng liên tiếp nảy sinh."
3375 = "Tôi bước lên cầu thang và gõ cửa.\\n——Đã bao nhiêu năm rồi nhỉ."
3377 = "Tôi nhìn.\\nKhông phải Paulette, cũng không phải Hachiroku, mà là người đó."
3378 = "Cuối cùng, tôi cũng đã hiểu."
3379 = "Cuối cùng tôi cũng hiểu.\\nÝ nghĩa của câu \"Đứng lên và bước đi\" mà Hibiki đã nói."
3381 = "Nếu bị phán xét là ngây thơ thì chắc khó mà phản bác được,\\nnhưng tôi cảm thấy đó cũng chính là một nét đẹp trong phẩm chất của Hibiki."
3383 = "Giọng nói của Hibiki đã cứu rỗi tôi.\\nGiống như một làn gió mát xua tan đi bầu không khí nóng bức."
3386 = "Nếu nói ra những lời như \"Xin lỗi\" các thứ,\\nthì sẽ là một sự thất lễ đối với chị Mayami và tất cả những người đã góp vốn."
3387 = "Vừa định đưa tay ra xoa rối mái tóc con bé thì——\\nHibiki đã dùng cả hai tay bắt lấy tay tôi."
3390 = "Đang nghĩ không biết con bé sẽ nói gì,\\nnhưng xin \"câu thần chú\" thì đáng yêu thật đấy."
3391 = "Tôi bước đến gần, giữ lấy vai Hibiki.\\nNhưng con bé vẫn không ngừng run rẩy, nên tôi vòng tay ôm nhẹ lấy con bé."
3393 = "Nỗi băn khoăn của tôi đã hiện rõ trên khuôn mặt rồi sao."
3394 = "Hoặc cũng có thể \\x%l機関士;#00ffc040;nữ lái tàu%l;#; đó,\\nđã từng bị những tin đồn như vậy làm cho khốn đốn cũng nên."
3399 = "Chính vì vậy——\\nDù đã biết rõ quyết tâm của em ấy, tôi vẫn không thể không hỏi."
3401 = "Thế nên, tôi cũng chỉ nói vậy."
3403 = "Chính vì vậy mà tôi mới có thể nói ra.\\nKhông căng thẳng, không gượng gạo——giống như cách tôi từng đối xử với Hibiki hồi còn nhỏ."
3406 = "Chính vì vậy. Hibiki, cô em gái nuôi của tôi——\\nđã nhẹ nhàng rời khỏi vòng tay tôi như muốn nói rằng mình không sao."
3408 = "Vì vậy, Hibiki đã vẽ tranh.\\nNhờ vẽ tranh, Hibiki đã có thể thoát khỏi điều đó."
3409 = "Tôi lập tức xâu chuỗi lại mọi thứ.\\nThế nên, không cần phải hỏi, tôi đã có thể khẳng định."
3412 = "Nếu là tôi bình thường thì đã hành động từ lâu,\\nđưa ra câu trả lời, và giờ này đáng lẽ đã ngủ say sưa rồi."
3415 = "Em ấy đã thừa nhận điều đó.\\nVậy thì Hibiki——"
3418 = "Nếu đó là mong muốn của Hibiki, tôi sẽ cư xử như thể con bé vẫn ổn.\\nTôi quay lại nhìn Paulette, và lặp lại những lời vừa nghe."
3456 = "Hibiki thì……quả nhiên vẫn đang tuyệt vọng cố gắng\\nđiều chỉnh khuôn mặt chực khóc của mình trở về trạng thái vô cảm."
3457 = "Nếu là Hibiki thì con bé có thể làm được——\\nNếu là cùng với Hibiki, tôi tin chắc rằng chúng tôi có thể làm được."
3459 = "Đứng trước mặt tôi, người đang ngồi trên chiếc gối tựa,\\nHibiki đưa tay về phía tôi."
3462 = "Hibiki lại nép sát vào tôi hơn nữa.\\nTôi cảm thấy cơ thể mình nóng ran lên."
3464 = "Hibiki ngẩng mặt lên.\\nNhìn thẳng vào chị Mayami."
3465 = "Hibiki sụt sịt mũi."
3468 = "Hibiki đưa nó cho tôi như một lẽ đương nhiên."
3470 = "Hibiki dùng giọng điệu có chút đùa giỡn,\\nnhưng lại truyền đạt một cách vô cùng dứt khoát."
3472 = "Bằng thì quá khứ.\\nHibiki đang kể về chính bản thân mình."
3474 = "Hibiki lẩm bẩm như trút được gánh nặng.\\nNhưng ánh mắt con bé không hề lơ là."
3479 = "Mùi hương của Hibiki ngày càng nồng đậm hơn.\\nTiếng tim đập thình thịch, thình thịch vang vọng bên tai tôi."
3481 = "Giọng nói của Hibiki nghe có chút gì đó buồn bã."
3482 = "Giọng nói của Hibiki nhỏ như sắp tan biến.\\nPaulette gật đầu một cách yếu ớt để đáp lại."
3484 = "Khuôn mặt của Hibiki phóng to ngay trước mắt,\\ncùng với cảm giác lướt nhẹ qua môi."
3485 = "Nghe những lời bộc bạch của Paulette, Hibiki giật bắn mình ngẩng mặt lên."
3486 = "Hibiki đang nói rằng điều này sẽ là một bước đệm.\\nCon bé đang thể hiện quyết tâm sẽ dành bốn năm của mình cho việc đó."
3488 = "Mỉm cười nhẹ nhàng.\\nSau đó, Hibiki hít một hơi thật sâu."
3491 = "Nói rồi, Hibiki cười khúc khích,\\nrồi thốt lên \"A\", hai má dần ửng đỏ."
3493 = "Rõ ràng là do Hibiki đề xuất,\\nvậy mà tôi lại đi xác nhận xem \"thế có được không\", chẳng khác nào đang chế nhạo con bé."
3504 = "Trong lúc tôi đang mải mê tìm từ ngữ để nói,\\nHachiroku đã nhẹ nhàng bước tới."
3506 = "Không cần phải nói, Kumagin là ngân hàng duy nhất ở Ohimitera."
3523 = "Paulette vươn đôi tay trắng ngần ra,\\nôm lấy cơ thể bé nhỏ của Reina vào lòng."
3524 = "Paulette và những người khác đều tỏ ra ngạc nhiên.\\nNgược lại, Hibiki chỉ gật đầu mà không hề biến sắc."
3525 = "Đến mức đó cơ à——\\nPaulette đã mệt mỏi và kiệt sức hoàn toàn rồi."
3526 = "Ánh mắt của Paulette hướng về phía tôi."
3527 = "Paulette cúi xuống ngang tầm mắt với Reina,\\nghé sát đến mức mũi chạm mũi để trò chuyện với con bé."
3528 = "Paulette ngẩng mặt lên,\\nvà đây là lần đầu tiên trong ngày hôm nay, ánh mắt chúng tôi thực sự chạm nhau."
3529 = "Rằng tinh thần trách nhiệm của Paulette,\\nmạnh mẽ đến mức vượt xa cả mức cần thiết."
3530 = "Nhìn vào mặt tôi, Paulette bỗng nhiên đỏ bừng mặt."
3531 = "Có lẽ cô ấy đã rất ngạc nhiên."
3532 = "Paulette khẽ gật đầu.\\nĐôi mắt vừa ngước lên vẫn không hề rời khỏi tôi."
3533 = "Paulette với vẻ mặt ngạc nhiên đưa tách trà lên miệng.\\nHibiki thì hoàn toàn bất động."
3541 = "Hơi ấm mềm mại——một lúc sau, là một chút ẩm ướt."
3542 = "Để động viên Hibiki,\\ncô ấy đang vắt kiệt chút sức lực cuối cùng từ trái tim và giọng nói đã mệt nhoài của mình."
3543 = "Sức lực mà cô ấy vừa vắt kiệt vì Hibiki,\\nđang xẹp đi trông thấy, ai nhìn từ bên ngoài cũng nhận ra."
3555 = "Sau đó, chị ấy đặt câu hỏi.\\nVẫn giống như mọi khi, hướng về phía Hibiki."
3556 = "Reina lấy bình tông của mình ra,\\nđặt lên bàn rồi từ tốn bắt đầu kể."
3557 = "Sau đó hít một hơi thật sâu,\\nPaulette từ từ đứng dậy."
3558 = "Sau đó liếm ướt môi,\\ncuối cùng Hibiki cũng——có thể thốt ra những lời tiếp theo."
3559 = "Rồi chầm chậm……\\ncon bé nhìn tôi với khuôn mặt đang cố gắng xóa đi mọi biểu cảm."
3561 = "Đứng một mình ngoài hành lang.\\nNhưng mà——trên môi vẫn còn lưu lại cảm giác ấy."
3564 = "Con bé uống cạn một hơi phần trà còn lại trong tách."
3565 = "Reina hiểu vấn đề một cách vô cùng đơn giản."
3567 = "Lời kể của Reina có lẽ đã trở thành mồi nhử.\\nGiọng nói điềm tĩnh của Paulette bắt đầu cất lên."
3594 = "Là chị Mayami mà.\\nChị ấy sẽ không nói những lời chỉ mang tính chất gợi ý suông đâu."
3596 = "Chị Mayami cũng nhìn thẳng vào Hibiki."
3597 = "Rất dứt khoát,\\nchị Mayami chỉ nói ra kết luận."
3599 = "Đáp lại câu hỏi đó,\\nchị Mayami lại đặt ngược lại một câu hỏi."
3602 = "Chị Mayami hài lòng nhìn Hibiki như vậy,\\nrồi từ tốn đặt câu hỏi."
3606 = "Ngủ một giấc rồi tỉnh dậy, phía trước sẽ là——\\nChiến trường mang tên bầu cử, nơi mà chúng tôi đã tự nguyện bước vào."
3610 = "Đúng là vậy.\\nNếu nhận lời đề nghị quảng cáo đó thì——"
3614 = "Bị chặn họng.\\nTôi chợt nhớ ra, à, ra là vậy."
3620 = "Dù xét đến việc tuyến đường này có hiệu quả quảng cáo kém,\\nnhưng với hợp đồng trọn gói 10 triệu yên thì con số này cũng không có vẻ gì là bất thường."
3623 = "Hơn nữa, tổng số tiền lên đến 200 triệu yên thì……"
3625 = "Nhóm con người thì……\\nDù tách trà đã ở ngay trước mặt nhưng vẫn không hề có ý định vươn tay ra."
3627 = "Bản thân việc thể hiện thái độ đó\\ncũng sẽ trở thành một sức mạnh to lớn để phủ nhận tin đồn từ chức."
3628 = "Sinh ra ở Ohimitera, lớn lên ở Ohimitera,\\nvà là người đã dạy tôi về Ohimitera, em gái nuôi của tôi."
3631 = "Trái lại, Paulette thì sao. Từ chức giữa chừng vì lý do cá nhân.\\nCô ấy không có quan hệ huyết thống với tôi, và tất nhiên, đây cũng không phải là một cuộc chiến tang tóc."
3632 = "Khoảnh khắc nghe thấy cái tên Houshou, cơ thể Hibiki giật nảy lên và cứng đờ."
3635 = "Nếu có thể nhận thức được điều đó,\\nthì ít nhất con bé cũng đã có thể nhìn nhận bản thân một cách khách quan."
3637 = "Tự nhận thức được bản thân vẫn còn non nớt."
3641 = "Đắng chát quá."
3647 = "Người được hỏi vẫn giữ nguyên phong thái thường ngày,\\ntrả lời bằng một giọng điệu vô cùng nhẹ nhàng."
3649 = "Bị hỏi, cơ thể Hibiki run lên bần bật."
3672 = "Lúc bắt đầu hành động là lúc nặng nề nhất. Đáng sợ nhất."
3675 = "Đứng trước tách trà,\\ncả Paulette và Hibiki đều im lặng với vẻ mặt nghiêm trọng."
3676 = "Dù chỉ là anh trai nuôi,\\nnhưng tôi vẫn có thể hiểu được đó là sự đồng tình."
3685 = "Nhóm \\x%lレイルロオド;#00ffc040;Railord%l;#; cứ thế bắt đầu ừng ực uống trà."
3687 = "Vậy là được rồi.\\nHibiki cũng đang nhìn về cùng một hướng với tôi."
3688 = "Thế này thì không thể nói chuyện tử tế được.\\nVậy phải làm sao đây? ——Chỉ còn cách bắt đầu từ những nơi có thể hành động thôi."
3689 = "Giọng nói của cô ấy mềm mỏng đến mức,\\nkhiến tôi tự hỏi sự căng thẳng từ nãy đến giờ rốt cuộc là vì cái gì."
3690 = "Một giọng nói bộc lộ rõ sự nhẹ nhõm."
3698 = "Nếu vậy, hãy mang theo cảm giác này vào giấc ngủ thôi."
3699 = "Nếu đã như vậy thì——"
3700 = "Nếu đã như vậy thì——\\nVấn đề là phải tấn công vào sự lơ là đó như thế nào, nhưng mà……"
3701 = "Nếu vậy——nếu vậy.\\nTại sao tôi lại không thể đưa ra quyết định cơ chứ."
3702 = "Nếu vậy thì, ngọn gió.\\nChỉ cần thổi mạnh hơn nữa là được."
3703 = "Cánh cửa mở ra.\\nPhòng của Hibiki——vẫn có mùi hương giống như ngày xưa."
3712 = "Kumagin không phải là ngân hàng mở rộng quy mô trên toàn quốc,\\nnên việc tăng cường quảng cáo nhắm vào du khách cũng chẳng có mấy ý nghĩa."
3716 = "Việc nhờ vả chị Mayami,\\nchính Hibiki là người đã mở lời."
3717 = "Dù cảm thấy vui vì tấm lòng của em ấy."
3718 = "Những lời nói và sự tin tưởng của Paulette và Hachiroku khiến tôi rất vui.\\nNhưng mà——mọi chuyện không hề đơn giản như vậy."
3719 = "Cô ấy gật đầu. Vô cùng yếu ớt, chẳng chút sức lực.\\nNhưng Paulette thực sự đã gật đầu."
3720 = "Dù bất ngờ bị gọi tên, nhưng Hibiki không hề tỏ ra luống cuống.\\nCon bé chỉ lặng lẽ gật đầu."
3723 = "Trước câu hỏi nhẹ nhàng của Paulette,\\nHachiroku cũng nhẹ nhàng gật đầu đáp lại."
3737 = "（…………Hibiki, không đến sao）"
3748 = "（Hơn nữa, lời nói của Hachiroku chỉ đơn thuần là thiên vị mà thôi.\\nNhững người tài giỏi hơn tôi, ngay cả ở xung quanh tôi cũng có đầy）"
3749 = "（Chụt!）"
3750 = "（Từ ngay lúc đầu……\\nHibiki đã thể hiện sự quyết tâm rồi nhỉ）"
3752 = "（Mình bị ngốc à）"
3756 = "（Paulette đúng là cũng chẳng khác gì người ngoài.\\nNhưng——cô ấy là con gái ruột của cựu Thị trưởng đã qua đời khi đang đương nhiệm.）"
3759 = "（Chuyện này……đã đến mức này rồi sao.\\nPaulette đã bị bào mòn đến mức này rồi sao.）"
3761 = "（Sự ngọt ngào……vẫn không thay đổi so với trước đây, nhưng——）"

