2569 = "「An ủi……anh trai, sao——」"
2575 = "「Houshou Mototada có sức ảnh hưởng đối với giới truyền thông. Hơn nữa,\\nnhững tin đồn tầm phào một khi đã lan truyền ra ngoài thì ngay tại thời điểm đó——」"
