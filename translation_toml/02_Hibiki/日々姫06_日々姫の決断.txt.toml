2473 = "「Nếu em đệ đơn từ chức lên Chủ tịch Hội đồng thành phố, thì trong vòng 5 cộng 50 ngày kể từ ngày đó, cuộc bầu cử Thị trưởng sẽ được tổ chức.」"
2476 = "「Chỉ cần từ chức là được. Chắc là……yêu cầu kiểu như vậy.」"
