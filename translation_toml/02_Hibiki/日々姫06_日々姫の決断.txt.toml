2340 = "「Là những lá phiếu không nằm trong địa bàn……không ủng hộ một ứng cử viên cụ thể nào cả. Cơ mà, Pou-chan quả không hổ danh là Thị trưởng đương nhiệm nhỉ.」"
2341 = "「Không phải là được dạy bảo, mà là muốn tự mình tìm hiểu nhỉ.」"
