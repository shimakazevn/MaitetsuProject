2411 = "「Nhưng tại sao chứ. Tại sao em lại phải làm đến mức đó—— Hibiki, chẳng phải em đã từng ủng hộ việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; sao.」"
