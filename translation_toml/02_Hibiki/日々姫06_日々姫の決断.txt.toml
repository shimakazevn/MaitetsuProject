2551 = "「Bọn họ đã chuẩn bị sẵn một môi trường để giành chiến thắng, rồi ép chúng ta phải khai chiến.\\nVậy thì chúng ta phải ứng chiến như thế nào đây?」"
2552 = "「Bọn họ chuẩn bị đến mức đó,\\nvà giăng bẫy đến mức đó luôn sao.」"
