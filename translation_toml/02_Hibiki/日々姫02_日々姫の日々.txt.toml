2192 = "「Có vẻ cũng có những cơ sở nhận cắt đường cong theo yêu cầu.\\nNgoài ra, nếu là loại gương nhựa thì việc gia công có vẻ khá dễ dàng.」"
2199 = "「Ví dụ như, nếu nhận được yêu cầu từ lò rèn Minokasa thì sao.」"
2203 = "「Không, anh không hề thấy đợi chờ gì đâu.\\nPhong cách làm việc của em, anh đã được chiêm ngưỡng với sự thích thú tột độ đấy.」"
2204 = "「Không, vì là khu tập trung nhiều cửa hàng,\\nnên hầu như không có cây xanh——a.」"
2205 = "「Làm gì có chuyện đó.\\nEm đang làm công việc của một chuyên gia rất đàng hoàng mà.」"
2206 = "「Đúng vậy. Hình minh họa của Hibiki và——\\nCậu xem, rải rác đây đó có những ký hiệu đơn giản đúng không?」"
2207 = "「Không vướng víu gì đâu.\\nĐược mà. Cậu cứ tiếp tục đi.」"
2213 = "「Uragami?」"
2218 = "「Quản lý nhiệt độ, giỏi lắm.\\nHôm trước tôi vừa dạy là \"đừng làm \\x%lもろみ;#00ffc040;cơm rượu%l;#; giật mình\" xong.」"
2224 = "「Nhưng mà, giờ em lại muốn vẽ sao?」"
2226 = "「Khung cảnh này sao? Bây giờ mới vẽ à?」"
2227 = "「Tất nhiên là có. Là bố của chị Kisaki mà.」"
2233 = "「Hai người đã có một cuộc gặp gỡ tốt đẹp nhỉ.\\nGiữa Hibiki và Kisaki ấy.」"
2236 = "「Thật sao ạ!? \\nVậy xin anh hãy chỉ bảo cặn kẽ cho em!」"
2246 = "「Đúng vậy nhỉ. Dù không có gì, thì rượu shochu Kuma cũng đã\\nnổi tiếng khắp cả nước, là biểu tượng của lưu vực sông Kuma mà.」"
2247 = "「Thật sự là, bây giờ mới vẽ nhỉ.\\nDù là con thứ, nhưng em cũng là con gái nhà nấu rượu mà.」"
2252 = "「Chị Kisaki, anh Uragami cũng vất vả rồi ạ.\\nHôm nay em cũng được hai người giúp đỡ rất nhiều.」"
2253 = "「Mệt thì em cũng không mệt lắm.」"
2259 = "「Xưởng ủ tương Kamata là\\nxưởng miso có quan hệ lâu năm với chị hai mà.」"
2266 = "「Thế là công việc hôm nay kết thúc ở đây nhỉ.\\nVất vả cho em rồi, Hibiki. Giờ em định làm gì?」"
2269 = "「Giả vờ ngủ? Sao ạ?」"
2271 = "「Sao? Cà phê nhé.」"
2272 = "「Nếu được, em muốn anh trai cũng đến.\\nChiều nay.」"
2274 = "「Nếu chỉ vì tiếng động lạch cạch trong nhà xưởng mà bị đánh thức,\\nthì con gái nhà nấu rượu đâu có làm ăn gì được.」"
2276 = "「Nếu nói hợp hay không hợp thì, là hợp đấy.」"
2280 = "「Nhưng mà, nhu cầu thay mới biển hiệu,\\nlại nhiều đến thế này sao.」"
2281 = "「Vậy sao. Đúng vậy nhỉ.」"
2284 = "「Cảm ơn chị.\\nChào anh Uragami ạ.」"
2311 = "「V, v-v-v-vậy sao ạ?」"
2312 = "「A, tầm này thì được.\\nVậy là có thể làm được đúng không cô?」"
2313 = "「Rốt cuộc, ý bà là sao ạ——」"
2314 = "「Đúng là biển hiệu mà nhỉ.」"
2315 = "「Bảng giá thì là cái này đây.」"
2316 = "「Bản đồ minh họa thành phố Ohimitera sao.」"
2317 = "「Chỉ là do nó nổi bật thôi, anh trai.\\nVì nó sáng bóng nên vết mờ đục mới dễ thấy thôi ạ.」"
2318 = "「Vậy à. Vậy hẹn gặp lại.\\nSoutetsu? Cậu nhớ có trách nhiệm đưa Hibiki về tận nhà đấy nhé?」"
2319 = "「À.」"
2320 = "「Nếu vậy, chỉ hiểu biết sâu sắc về Ohimitera thôi là chưa đủ.\\nĐể \\x%l8620;#00ffc040;8620%l;#; hồi sinh, chúng ta phải nỗ lực nhiều hơn nữa.」"
2322 = "「Cái chuyện thu hút nhà máy có nguy cơ làm ô nhiễm nước sông Kuma ấy,\\nnếu không bị ảnh hưởng thì đời nào cô chủ lại theo phe tán thành chứ.」"
2323 = "「Những ký hiệu như thế này gọi là biểu tượng tượng hình.\\nTất cả những cái này cũng đều do Hibiki thiết kế đấy.」"
2324 = "「Những hoạt động như vậy chắc chắn sẽ được thành phố trợ cấp.」"
2325 = "「Tất nhiên rồi. Là cô em gái nuôi quan trọng của tôi mà,\\nvới lại đường về của tôi cũng là đường đó.」"
2326 = "「Làm vậy thì sẽ trải nghiệm được nhiều nhất.」"
2327 = "「Chà. Không tệ chút nào nhỉ.」"
2328 = "「Không tệ là, Hachiroku sao ạ?」"
2329 = "「Quả đúng là——thành phố Ohimitera, biển hiệu cũng phải đẹp, nhỉ.」"
2331 = "「V, vậy thì!」"
2336 = "「Vậy, em đến để vẽ à. Rốt cuộc là vẽ gì vậy?」"
2338 = "「Cái đó——anh trai.」"
2339 = "「Chuyện là, em ở chỗ chị Kisaki——」"
2340 = "「Vậy thì tốt quá rồi.」"
2341 = "「Nếu vậy, xin cô hãy làm biển hiệu bằng gương nếu có thể nhé.\\nBên tôi cũng sẽ cố gắng làm những gì có thể.」"
2345 = "「Nếu vậy thì, thiết kế của ký hiệu,\\ncũng phải hoàn thiện sao cho thật nổi bật khi làm bằng gương mới được.」"
2346 = "「Vậy thì bắt đầu thôi. Mục tiêu là ga Suối nước nóng Ohimitera.」"
2348 = "「Có thể cắt đường cong bằng kéo hoặc cưa lọng. Vì vậy,\\nnếu nhờ thợ trong thành phố thì chắc chắn sẽ dễ dàng tạo hình được.」"
2349 = "「Vậy thì, chúng ta hãy cố gắng hết sức trong khả năng của mình.\\nTrước tiên, anh muốn Hibiki nắm vững kiến thức cơ bản của một \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;.」"
2358 = "「Biển hiệu làm bằng gương, sao ạ?」"
2360 = "「Anh hai……」"
2362 = "「Anh hai và chị Kisaki——hai người giám hộ của hai người... cái đó——đã cho hai người làm quen với nhau từ khi còn nhỏ sao?」"
2364 = "「Anh hai, để phục hưng Ohimitera,\\nsự hồi sinh của Hachiroku là không thể thiếu.」"
2365 = "「Dù còn nhiều lý do khác nữa... nhưng có lẽ, chắc chắn là có lý do đó.\\nRượu shochu Kuma, vì thế nên em mới sợ, mới không muốn vẽ.」"
2366 = "「Biểu tượng tượng hình chỉ được gắn cho những cửa hàng có yêu cầu thôi,\\nnhưng lại nhận được đánh giá khá tốt đấy.」"
2367 = "「Rất cừ đúng không?\\nSoutetsu. Em gái cậu ấy.」"
2368 = "「Soutetsu? Cà phê nguội rồi kìa?」"
2373 = "「Bà Saitou, chào buổi sáng ạ.」"
2374 = "「!」"
2376 = "「~~!」"
2505 = "Không biết có phải do quá hào hứng hay không,\\nmà mặt em ấy ửng đỏ, nhịp thở cũng có vẻ nhanh hơn."
2512 = "Nhìn Hibiki văn võ song toàn thế này,\\ncó lẽ \\x%l投炭;#00ffc040;xúc than%l;#; từ 400kg cũng chịu đựng được."
2513 = "Nhưng——cái tên đơn giản đến mức ngớ ngẩn này,\\nchính vì thế mà nghe một lần là khó có thể quên được."
2514 = "Nhưng cũng dễ hiểu thôi. Thực tế mà nói, theo góc nhìn của tôi thì bà Saitou,\\nđặc biệt đối xử quá đỗi lạnh nhạt với Hibiki."
2515 = "Nhưng đã cất công đánh bóng rồi,\\nthì tôi muốn làm cho nó sạch sẽ nhất có thể."
2516 = "A, nhưng mà. Nếu vậy thì,\\nchẳng phải là do nhà nấu rượu Migita System đã không yêu cầu sao."
2517 = "Bỏ đi thì tiếc lắm,\\ncon bé cũng không ít lần phải thuyết phục như vậy——"
2523 = "Nếu vậy thì đó không phải là đánh giá tiêu cực hay tích cực\\n——mà chỉ đơn thuần là kết quả quan sát."
2524 = "Nếu vậy, chắc chắn ở chỗ của Houshou Kisaki,\\ntôi sẽ gặp được điều gì đó giúp hiểu thêm về Ohimitera."
2529 = "Ai cũng nói rượu là một sinh vật sống, nhưng ở giai đoạn trước đó, men kōji, hay \\x%lもろみ;#00ffc040;cơm rượu%l;#;\\n——tức là rượu mẹ——tất nhiên cũng đang sống."
2534 = "Thì quá khứ sao."
2535 = "Và cả điều mà Hibiki đã dạy tôi từ rất lâu về trước,\\nrằng \"Màu đỏ là màu đỏ\"."
2537 = "Nhưng nếu em ấy tự mình nói ra,\\nthì không cần phải e ngại gì nữa."
2542 = "Huống hồ Hibiki hiện tại, đối với việc nấu rượu chỉ là \"người ngoài\"."
2553 = "Diện mạo thành phố có vẻ đang dần thay đổi,\\nnhưng những cửa hàng mang dáng dấp từ ngày xưa cũng không hề ít."
2558 = "Nói xong, Hibiki liền mở sổ phác thảo ra,\\nvà cặm cụi ghi chép gì đó vào mép giấy."
2560 = "Hiệu ứng cộng hưởng."
2563 = "Ra là vậy, con bé dùng nó thay cho sổ tay luôn sao.\\nHèn chi lúc tôi định cầm giúp, con bé lại ngượng ngùng từ chối."
2568 = "Dường như được tiếp thêm sức mạnh từ những điều đó,\\nông chủ tiệm giặt ủi đã hoàn toàn lấy lại sắc mặt tươi tỉnh."
2571 = "Tuy nhiên, tôi thì chẳng có chút ký ức nào cả."
2573 = "Chú ý tìm kiếm như vậy,\\ntôi có thể tìm thấy biểu tượng tượng hình của Hibiki trên các biển hiệu."
2576 = "Chỉ một giọt nước bùn rơi vào bồn chứa mà bị phát hiện,\\nthì toàn bộ nhà xưởng sẽ không thể rửa sạch tiếng nhơ 『Shochu nước bùn』."
2578 = "Nhưng khi Hibiki ngẩng mặt lên, đôi lông mày lại nhíu chặt."
2580 = "Nhưng, nếu tôi giải thích rằng 『lý do là như vậy đấy』,\\nthì sẽ lại mở ra con đường lùi mà Hibiki đã bị cắt đứt."
2596 = "Đồng thời, tôi cũng cảm nhận được sự bao dung của Kisaki khi cho phép Hibiki làm như vậy."
2602 = "Ây dà, chuyện này——\\nCũng không thể tùy tiện hỏi lý do được..."
2605 = "Màu \"cổ kính\", thứ màu sắc chỉ có năm tháng mới tạo ra được."
2608 = "Nếu đối tượng là sinh vật sống thì chuyện gì xảy ra cũng không có gì lạ.\\nCả \\x%l杜氏;#00ffc040;trưởng hầm rượu%l;#; lẫn thợ nấu rượu, khi cần thiết đều phải đối mặt với rượu bất kể ngày đêm."
2611 = "Càng đánh bóng, tôi càng hiểu ra nhiều điều."
2613 = "Trên tờ giấy trắng tinh, vô số nét đen được vạch ra.\\nTừ những đường nét, chúng nhanh chóng biến thành bóng râm, thành mặt phẳng."
2614 = "Trước cửa tiệm gốm sứ, một biểu tượng tượng hình\\nđược vẽ chễm chệ trên chiếc bình lớn."
2617 = "Những ký hiệu trông quen quen, dễ hiểu,\\nnhưng lại mang một nét riêng biệt, nằm rải rác trên bản đồ."
2622 = "Nhìn thật nhiều, gặp gỡ thật nhiều, lắng nghe thật nhiều."
2630 = "Bằng một động tác vô cùng tự nhiên——chỉ có thể nghĩ là vậy,\\ncon bé mở sổ phác thảo ra và bắt đầu đưa bút chì."
2631 = "Chắc trong thâm tâm con bé cũng nghĩ vậy."
2634 = "Chỉ với hai ví dụ. Nhưng bấy nhiêu đó cũng đủ để tôi hiểu ra.\\nTôi không thể tưởng tượng nổi cảnh bà Saitou làm việc gì khác ngoài nấu rượu shochu."
2636 = "Chỉ khẽ cúi chào bà Saitou, rồi sau đó,\\nHibiki đi thẳng ra khỏi nhà xưởng mà không thèm ngoảnh lại."
2638 = "Đóng sập cuốn sổ phác thảo lại,\\nHibiki luống cuống lắc đầu."
2640 = "Về khoản nấu rượu, bà ấy có nhiều kinh nghiệm hơn bất cứ ai trong nhà xưởng, và cũng nghiêm khắc hơn bất cứ ai\\n——Một bà lão tuy nhỏ nhắn nhưng lại tràn đầy uy nghiêm."
2641 = "Em ấy vặn vẹo cơ thể, ngượng ngùng."
2645 = "Đối với người mới bắt đầu.\\nTôi định bắt đầu từ 100kg——"
2647 = "Con bé trải bản đồ khu dân cư khổ B4 ra,\\nchứ không phải bản đồ minh họa, và nhìn chằm chằm vào đó."
2650 = "Giọng điệu thật mềm mỏng và ấm áp.\\nĐến cả tôi cũng cảm thấy nhẹ nhõm."
2651 = "Vượt qua cả vẻ không vui, đó là một biểu cảm hờn dỗi ra mặt,\\nđến mức tưởng chừng như con bé sắp lè lưỡi lêu lêu vậy."
2653 = "Ánh mắt đó, hơi——\\nnói sao nhỉ... có chút đờ đẫn."
2655 = "Câu nói đó khiến tôi yên tâm.\\nVậy là không phải Hibiki ghét shochu Kuma——"
2659 = "Thúc đẩy du lịch, và thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;.\\nCô ấy tin rằng có thể làm được cả hai, và đang hành động vì điều đó."
2662 = "Hibiki mang vẻ mặt mệt mỏi nhưng sảng khoái,\\nkẹp cuốn sổ phác thảo dưới nách đi về phía tôi."
2663 = "Nếu lãng phí những nỗ lực đó,\\nthì việc phục hưng Ohimitera sẽ càng xa vời hơn.」"
2666 = "Nếu đánh giá của Kisaki về \"ô nhiễm nguồn nước\" là chính xác,\\nthì ngay cả tôi cũng nghĩ hành động của cô ấy chính là con đường tốt nhất."
2668 = "Sự an tâm, và niềm vui sướng vượt trên cả điều đó, sục sôi trong lồng ngực tôi."
2671 = "Trước mặt thợ nấu rượu trưởng——nhân vật số 2 ở nhà nấu rượu Migita System là bà Saitou,\\ntôi không có tư cách để đưa ra ý kiến gì cả."
2673 = "Dù biết đó chỉ là lời nói lấp liếm sự ngượng ngùng,\\nnhưng tôi vẫn không thể không nói ra."
2684 = "Ohimitera là một thành phố cổ, ít bị tàn phá bởi chiến tranh.\\nTất nhiên cũng có những nơi được xây dựng lại."
2699 = "Có lẽ ông ấy đã tưởng tượng ra quang cảnh xung quanh cửa hàng của mình.\\nVẻ phấn khích dần biến mất khỏi khuôn mặt ông chủ tiệm giặt ủi."
2702 = "Có lẽ là vậy.\\nChính vì ý đó, nên bà Saitou mới đuổi Hibiki ra khỏi nhà xưởng."
2708 = "Tôi không hiểu lý do tại sao.\\nDù cảm nhận được bầu không khí bất ổn, nhưng không biết phải làm sao——"
2710 = "Tôi rời khỏi chiếc bàn nơi hai người họ đang nói chuyện,\\nvà nhận lấy chiếc cốc mà Kisaki đưa cho với giọng nhỏ nhẹ."
2713 = "Bản thân tôi, dù nhìn thế nào cũng chỉ là một \\x%l機関士;#00ffc040;người lái tàu%l;#; tập sự.\\nChỉ bảo người khác thì quá tự cao rồi."
2716 = "Vừa gật đầu, tôi vừa nghĩ \"Nhưng mà\"."
2718 = "Quá đỗi thán phục khiến giọng tôi nghe hơi nghẹn lại.\\nNhưng... đó, đó thực sự là một ý tưởng tuyệt vời."
2720 = "Tôi tự nhủ với bản thân, xốc lại tinh thần,\\nvà đánh bóng xong một lượt bồn chứa."
2722 = "Cảm thấy vô cùng nhẹ nhõm, nhưng lần này để không buột miệng nói hớ,\\ntôi cẩn thận chọn lọc từ ngữ."
2724 = "Tôi lỡ buột miệng xen vào,\\nHibiki mỉm cười trả lời."
2725 = "Tôi chợt nhận ra."
2726 = "Tôi đã hiểu ra.\\nLý do Hibiki lại ngưỡng mộ Kisaki đến vậy, rất rõ ràng."
2727 = "Sự đồng tình sâu sắc hơn, chuyển thành sự thấu hiểu."
2730 = "Tôi nhìn đồng hồ. Vẫn còn khá lâu mới đến giờ làm việc——\\nnhưng những thợ nấu rượu khác cũng bắt đầu lác đác đến rồi."
2731 = "Mải ngắm nhìn bàn tay ấy, tôi trả lời chậm mất một nhịp."
2734 = "Chợt nhớ lại. Điều mà Hibiki đã nói,\\nvà cảm giác về trục tung - trục hoành khi tôi thu thập tư liệu."
2735 = "Mặc dù tôi đang nói một sự thật hiển nhiên,\\nnhưng Hibiki lại lộ vẻ mặt vô cùng thất vọng."
2738 = "Tôi thót tim lo sợ mình đã lỡ lời,\\nnhưng Hibiki có vẻ không bận tâm, chỉ hơi cười khổ một chút."
2741 = "Nếu vẽ như một biểu tượng của Ohimitera thì quá hợp lý rồi.\\nNhưng——ừm, khuôn mặt gật đầu của Hibiki lại có phần cứng nhắc."
2806 = "Hibiki run rẩy, quay mặt về phía tôi."
2809 = "Lý do Hibiki sợ bà Saitou,\\ntất nhiên là vì con bé đã bị đuổi khỏi nhà xưởng theo cách như vậy."
2810 = "Hibiki đã trưởng thành rồi nhỉ,\\nđến tận bây giờ tôi mới——thấm thía điều đó."
2813 = "Hít một hơi thật sâu.\\nRồi Hibiki kề mặt sát lại gần tôi."
2815 = "Hibiki thoáng lộ vẻ ngạc nhiên,\\nnhưng ngay sau đó, con bé cúi xuống nhìn bản thân rồi cười khổ."
2817 = "Toàn thân Hibiki cứng đờ.\\nTiếng nghiến răng kèn kẹt vang lên."
2819 = "Hibiki vừa nói \"Vậy thì\"."
2821 = "Ánh mắt Hibiki,\\nhướng về phía Kisaki đang đứng bên cạnh như để cầu cứu."
2824 = "Hờ, con bé phả ra một hơi thở nóng hổi.\\nHibiki hơi mấp máy môi, nhưng rồi lại ngậm miệng không nói gì."
2826 = "Hibiki và ông chủ tiệm giặt ủi."
2828 = "Giọng nói lớn.\\nBàn tay đang đưa bút chì chợt dừng lại."
2830 = "Cuộc họp có vẻ đã kết thúc từ lúc nào."
2832 = "Dù là với ai, Hibiki vẫn luôn giữ thái độ niềm nở,\\nlắng nghe nguyện vọng của từng người và đề xuất thiết kế ký hiệu phù hợp."
2834 = "Hibiki giống như bị ngộ độc cá nóc, mắt trợn ngược lên trời, toàn thân run rẩy."
2835 = "Hibiki giật mình nín thở."
2837 = "Giọng điệu như nửa cạn lời, nửa đồng tình."
2839 = "Con bé gật đầu thật mạnh."
2841 = "Nghe vậy, Hibiki cười sảng khoái xua tay.\\nHộp bút trong tay phải con bé lắc lư qua lại kêu lạch cạch."
2843 = "Con bé cố tỏ ra điềm tĩnh với giọng điệu hoảng hốt.\\nPhía sau tôi, Kisaki khẽ bật cười khúc khích."
2846 = "Ánh mắt Hibiki rực cháy.\\nTràn đầy nhiệt huyết, tỏa sáng rạng rỡ."
2848 = "Hibiki tròn xoe mắt."
2849 = "Ưm, con bé hơi ngẫm nghĩ một chút."
2851 = "Nghe giọng Kisaki, Hibiki lập tức ngoảnh mặt lại."
2853 = "Cô ấy đã chỉ cho Hibiki, người bị đuổi khỏi nhà xưởng, một chốn dung thân.\\nKhông——không chỉ là một nơi chốn đơn thuần, mà là một nơi để tỏa sáng."
2854 = "Hibiki kể, rồi khẽ thở dài."
2856 = "Tay phải và tay trái, dựng đứng lên,\\nHibiki cho hai ngón tay chạm vào nhau, rồi lại tách ra."
2858 = "Nói lời đồng tình xong, khuôn mặt con bé từ từ——\\ngiãn ra thành một nụ cười tự nhiên."
2861 = "Hoặc có lẽ tiếng phổ thông của Hibiki,\\nnhư một lớp bộ lọc để che giấu sự ngượng ngùng."
2867 = "Mái chèo lại tiếp tục di chuyển.\\nBà Saitou không còn nhìn về phía tôi nữa."
2869 = "Ví dụ như trên cờ phướn dựng trước cửa hàng,\\ncho tên cửa hàng và biểu tượng tượng hình cùng xuất hiện."
2870 = "Ví dụ như, in biểu tượng tượng hình thành dạng decal\\nvà dán lên kính của tủ trưng bày trước cửa hàng."
2877 = "Loẹt xoẹt, Hibiki đưa bút vẽ lên sổ phác thảo."
2878 = "Thay cho câu trả lời, hai má Hibiki ửng đỏ, con bé cúi gằm mặt xuống.\\nNhưng——a, ra là vậy."
2885 = "Ông chủ tiệm giặt ủi không nhận ra điều đó,\\nvẫn tiếp tục nói với giọng điệu đầy phấn khích."
2886 = "Khi ông chủ tiệm giặt ủi lộ vẻ nhẹ nhõm,\\nHibiki lại mỉm cười, mở sổ phác thảo ra đưa cho ông xem."
2896 = "Uragami——lại ngồi trước máy tính,\\ncó vẻ như đang âm thầm lắng nghe cuộc họp trên bàn."
2898 = "Uragami chỉ khẽ cúi đầu đáp lễ,\\nrồi lập tức giữ vẻ mặt nghiêm nghị, quay lại nhìn màn hình máy tính."
2903 = "Một trong những công việc của người quét dọn, vệ sinh bồn chứa.\\nTôi định làm xong ngay từ sáng sớm khi chưa có ai đến, vậy mà——"
2904 = "Vết mờ đục cũng chẳng thể gọi là vết bẩn,\\nvà có lẽ nó cũng chẳng gây ảnh hưởng xấu gì đến rượu shochu đang ngủ yên bên trong."
2905 = "Để giải quyết triệt để tất cả,\\nhiều người vẫn đang làm việc không ngừng nghỉ.」"
2906 = "Để có thể dọn dẹp trước cổng vào khung giờ đó,\\nthì tốt nhất là nên đánh bóng bồn chứa xong từ sáng sớm."
2907 = "Để Hachiroku hồi sinh,\\nđã có rất nhiều người góp công góp sức."
2908 = "Đưa ra phán quyết \"không thể trở thành thợ nấu rượu\",\\nđể con bé bước tiếp trên con đường hội họa, và không bao giờ quay đầu lại."
2910 = "Sau đó Hibiki nhìn tôi,\\nquay sang Kisaki, và cúi gập đầu thật sâu."
2911 = "Tuy nhiên, Hibiki không trả lời ngay."
2914 = "Thử nhìn bà Saitou,\\nnhưng ngay lập tức, một cảm giác đồng tình và an tâm mạnh mẽ trào dâng."
2915 = "Bõ công cất công đi đường vòng."
2921 = "Đến cả tôi cũng đã quá quen thuộc với khung cảnh này,\\nnên lời nói cứ thế buột ra khỏi miệng."
2923 = "Quả thực, nếu không dạy bảo gì,\\nthì việc quản lý nhiệt độ của Hachiroku sẽ trở nên \"máy móc\"."
2927 = "Vậy thì, cuộc trò chuyện với bà Saitou chắc kết thúc ở đây thôi.\\nPhải nhanh chóng đánh bóng xong cái bồn chứa đang làm dở mới được."
2930 = "Nhìn thấy vẻ mặt tràn đầy quyết tâm của Hibiki,\\ntôi thực sự rất khó mở lời."
2940 = "Thú vị thì thú vị thật, nhưng——"
2952 = "Kisaki ngay lập tức trải tờ giấy in mà Uragami mang đến\\nra trước mặt ông chủ tiệm giặt ủi."
2953 = "Quả nhiên Kisaki cũng nói ra những điều chị Mayami đã dạy tôi\\nmột cách vô cùng tự nhiên."
2956 = "Kisaki lập tức gật đầu, rồi chuyển ánh nhìn\\nvề phía người đàn ông đang ngồi trước máy tính ở góc phòng."
2957 = "Góc nhìn rộng mở mà Kisaki đưa ra,\\ncùng sự hỗ trợ tinh tế của Uragami."
2959 = "Cách nói đùa cợt đó khiến nụ cười của Hibiki càng thêm rạng rỡ."
2962 = "Kisaki còn trẻ. Kinh nghiệm tự nhiên cũng có hạn.\\nCó lẽ cô ấy chưa hiểu được sự đáng sợ của cái gọi là danh tiếng."
2964 = "Kisaki khúc khích cười có vẻ rất thích thú,\\nrồi lấy ra một tờ giấy mà tôi cũng đã quen mắt."
2969 = "Chỉ riêng vật thể ba chiều thôi cũng đã có sức hút rồi.\\nNghĩ vậy, dòng suy nghĩ của tôi bỗng trơn tru hẳn."
2971 = "Hộp bút, và sổ phác thảo.\\nVới bộ dạng đó, thật khó để tưởng tượng ra việc gì khác ngoài vẽ tranh."
2973 = "Cuốn sổ phác thảo đã được gấp lại,\\nbút chì cũng đã được cất vào hộp."
2975 = "Tiếp đó, tôi cầm chổi tre đi về phía mặt tiền cửa hàng."
2976 = "Rượu shochu sau khi chưng cất nếu được ủ kỹ trong thùng gỗ,\\nsẽ có thêm hương vị và màu sắc giống như rượu whisky."
2981 = "Và cả nội tình của \"nhiều lý do khác nữa\",\\ntôi cũng dễ dàng đoán được——nên gật đầu."
2982 = "Còn chị Mayami, một người có thể dễ dàng hoàn thành mọi việc——\\nnhưng riêng chuyện nấu rượu shochu thì lúc nào cũng trăn trở, băn khoăn."
2984 = "Cuối cùng cũng đã bước vào mục đích chính,\\nđó là 『thảo luận về ký hiệu của biển hiệu』."
2986 = "Âm thanh, mùi hương, xúc giác,\\nmang đến cho tôi những kiến thức mà chỉ nghe giảng thôi thì không thể học được."
2987 = "Trước lời nói của Hibiki,\\ncả Kisaki và Uragami đều lặng lẽ gật đầu."
2988 = "Lời lẩm bẩm của bà Saitou. Hibiki giật mình cứng đờ người.\\nCó vẻ như đến tận bây giờ, con bé vẫn sợ bà ấy."
2989 = "Nghe vậy, tôi nhìn kỹ lại,\\nnhững sự sáng tạo tỉ mỉ hiện hữu khắp nơi, thật thú vị."
2990 = "Khi tôi nói thêm như vậy, Hibiki thở hắt ra một hơi dài,\\nnhưng rồi lại hít ngược vào một cái \"hức\"."
2993 = "Tiệm trà thì có ký hiệu trà.\\nNhà xưởng làm miso thì có ký hiệu súp miso."
3004 = "Những vấn đề được phát hiện trong quá trình chạy thử."
3007 = "Nghe giải thích như vậy,\\ntôi lại cảm thấy có một mối liên hệ rõ ràng ở đó."
3010 = "Nói thế thì, tên dự án nghe sặc mùi bà thím."
3022 = "Giọng điệu đùa cợt, cùng nụ cười hiền hòa."
3029 = "Vì nó quá lớn lao, quá đỗi quen thuộc nên không dễ gì vẽ được.\\nCảm giác đó tôi cũng có thể dễ dàng tưởng tượng ra."
3037 = "Cảm giác đó càng làm tăng thêm sự gợn gợn trong lòng,\\nthế nên, tôi quyết định hỏi thẳng."
3038 = "Thấy ngượng ngùng quá,\\ntôi cũng bắt đầu đưa tay đánh bóng bồn chứa trở lại."
3039 = "Trong quá trình đó, chắc chắn một ngày nào đó,\\ntôi sẽ nắm bắt được manh mối cho những câu hỏi mà hiện tại tôi chưa hiểu."
3040 = "Tôi cảm thấy điều đó rất giống phong cách của Hibiki."
3041 = "Bồn thép không gỉ là chủ yếu, nhưng cũng có loại tráng men, cả chum vại nữa.\\nThậm chí còn có cả thùng gỗ sồi."
3046 = "Ai đó đã bước vào nhà xưởng.\\nNgay lập tức, giọng nói hào hứng của Hibiki tắt lịm."
3056 = "Tiếng cánh cửa kim loại cọt kẹt."
3057 = "Như thể chỉ đợi tiếng cửa đóng lại,\\nbà Saitou mới lẩm bẩm buông lời."
3075 = "Từ trước đến nay tôi đã thấy Hibiki vẽ tranh ở khắp nơi\\n...nhưng chưa một lần nào thấy con bé vẽ bên trong nhà xưởng ủ rượu."
3076 = "Lời nói rõ ràng và bình tĩnh,\\nnhưng hai má Hibiki lại phồng to lên."
3077 = "Dù được gọi là cậu chủ,\\nnhưng trong nhà xưởng, tôi cũng chỉ là một người quét dọn đơn thuần."
3079 = "Một chủ đề tế nhị. Tôi chỉ biết im lặng.\\nTrong lúc im lặng... tôi chợt nhớ ra."
3080 = "Lẽ nào... mình...\\nđã nói điều gì kinh khủng lắm sao?」"
3087 = "Ngón trỏ, và ngón trỏ."
3090 = "Cao thì hạ xuống, thấp thì tăng lên——\\nChắc chắn cô ấy sẽ vặn van để đưa thẳng về nhiệt độ quy định."
3093 = "Bà Saitou tuyệt đối không hề lạnh nhạt với Hibiki.\\nTrái lại, bà ấy còn nhìn con bé bằng ánh mắt ấm áp."
3094 = "Từ lúc nào, bàn tay cầm mái chèo đã dừng lại.\\nĐôi mắt bà Saitou nhìn thẳng vào tôi."
3095 = "Bà Saitou cắm mạnh mái chèo vào đó,\\nrồi từ từ khuấy đảo, như thể đang làm tơi \\x%lもろみ;#00ffc040;cơm rượu%l;#; ra."
3097 = "Thợ nấu rượu trưởng, bà Saitou."
3098 = "Lời nhận xét dành cho Hachiroku, bà Saitou cũng dùng y hệt cho Hibiki,\\nmột cách hiển nhiên."
3099 = "Mắt vẫn hướng về phía \\x%lもろみ;#00ffc040;cơm rượu%l;#;,\\nbà Saitou từ tốn trả lời tôi."
3102 = "（……Nên làm thế nào đây）"
3111 = "（Nhưng mà... cũng khó nghĩ thật.）"
3112 = "（Nhưng——）"
3114 = "（Két——）"
3115 = "（Két——kéét）"
3116 = "（Phủi đi vết mờ đục, gột rửa vết bẩn,\\nvà dùng đôi mắt trong trẻo để tìm hiểu lại Ohimitera từ con số không.）"
3120 = "（Không có biểu tượng tượng hình của nhà xưởng nấu shochu sao.）"
3122 = "（Hơn nữa... Kisaki thực sự đang nghĩ đến sự phát triển của Ohimitera.）"
3125 = "Thời điểm người đi làm, đi học đông nhất là từ 7 đến 8 giờ."

[selections]
