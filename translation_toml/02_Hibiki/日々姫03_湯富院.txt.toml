2058 = "Nhưng chính vì thế... tôi càng cảm thấy tình trạng hiện tại thật khắc nghiệt."
2060 = "「如果這件事能做成功的話，３８６９６一定會獲得大牟田市政府和市民們的關注的」"
2067 = "Nếu chỉ nghĩ đến việc \"duy trì thương hiệu\" một cách đơn thuần, thì ngược lại có thể sẽ bị đánh giá tiêu cực."
2068 = "「Đã rõ. Tôi sẽ cố gắng hết sức.」"
2069 = "Bản thân Mikuro, có lẽ cũng có những tổn thương nghiêm trọng hơn những gì nhìn thấy bên ngoài."
2070 = "「Hửm?」"
2074 = "「Chà... trên đời này thực sự có tồn tại nhỉ. [Một người như vậy, 1]Thiên tài——đấy.」"
2076 = "「Đây, ngài Soutetsu. Sổ ghi chép đây ạ.」"
2079 = "「...」"
2085 = "「Vì vậy, Mikuro, muốn chúng chạy tiếp. Vì 38696 đã nghỉ hưu do hỏng nồi hơi rồi, nên hãy chạy thay cho cả phần của Mikuro nữa.」"
2088 = "「Ừm. Đúng rồi. Chị là Hibiki. Nhưng mà, \"giọng\" là sao?」"
2093 = "Lần này, chúng tôi sẽ chạy với tốc độ cao hơn so với lúc huấn luyện. Tôi phải tập trung cao độ để đảm bảo an toàn."
2095 = "Sau đó, chúng tôi cũng được hướng dẫn tham quan quanh ga Yufuin. Hibiki cũng đã vẽ được rất nhiều bức phác thảo."
2101 = "Tôi gật đầu, rồi tiếp tục tập trung vào việc điều khiển \\x%l8620;#00ffc040;8620%l;#;. Tôi muốn trở thành một \\x%l機関士;#00ffc040;người lái tàu%l;#; xuất sắc, để có thể điều khiển \\x%l8620;#00ffc040;8620%l;#; chạy trên những tuyến đường xa hơn nữa."
2106 = "「Để khiến họ rút lại kế hoạch đó——mới phải sáp nhập sao ạ?」"
2110 = "「Ngày mai, chúng ta sẽ tiến hành huấn luyện thực tế trên đường ray. Xin ngài hãy chuẩn bị tinh thần nhé.」"
2116 = "「Cháu xin lỗi. Chỉ là——cháu hơi ngạc nhiên một chút thôi ạ.」"
2118 = "「Cảm ơn cô, Hachiroku.」"
2121 = "「Chỗ đó... xây dựng thương hiệu. Tại sao lại thành công ạ. Bởi vì, Yufuin——sáp nhập này nọ... có rất nhiều khủng hoảng——」"
2124 = "「Ngài quá khen rồi ạ. Nhờ ngài mà em ấy mới được tận hưởng hết mình như vậy đấy ạ.」"
2125 = "「Là trận động đất lớn Oita vào năm \\x%l正和;#00ffc040;Showa%l;#; thứ 30 đúng không ạ?」"
2128 = "Từ câu \"vẽ xong rồi\", tôi nhận ra Thị trưởng Yufuin đang hiểu lầm."
2130 = "「Chỗ đó... cháu muốn nghe về chỗ đó.」"
2132 = "「Có thứ tự cả ạ. Mikuro, đã suy nghĩ rồi. Dù có cố gắng thế nào ở sở thú, thì cũng không ai đến xem 38696 đâu ạ.」"
2134 = "「Trong tâm trí, trong những ký ức.」"
2137 = "「Tất nhiên là ta phải xem rồi——hửm?」"
2138 = "「Bởi vì là cơ sở nghỉ dưỡng của nước thắng trận đặt tại nước bại trận mà. Họ chẳng thèm bận tâm đến an ninh trật tự đâu. Du lịch coi như nát bét.」"
2139 = "『Nếu vậy, em muốn tìm hiểu về Yufuin dù chỉ một chút』, mặc dù chúng tôi đã cố tình chọn cách đi bộ để trở về——"
2143 = "「Tốt lắm ạ. Tiếp theo, xin hãy thử thao tác cần đảo chiều.」"
2145 = "Tôi nói vậy, Hachiroku lại mỉm cười."
2146 = "「À——không ạ.」"
2148 = "Cảm nhận được Hachiroku được yêu mến đến nhường nào, ngay cả tôi cũng cảm thấy tự hào và hạnh phúc lây."
2149 = "「Cứ gọi em là Mikuro đi ạ. Nếu anh là Master của chị Hachiroku, thì đối với Mikuro, anh cũng là một người quan trọng và đáng kính trọng ạ.」"
2151 = "「Cháu tưởng Yufuin... đã gặt hái được những thành công vang dội trong ngành du lịch từ rất lâu trước khi khôi phục tuyến đường rồi chứ ạ.」"
2152 = "「Hôm nay, chúng ta sẽ tiến hành huấn luyện \\x%l機関士;#00ffc040;người lái tàu%l;#; ạ. Tôi sẽ hướng dẫn ngài cách điều khiển van tiết lưu và cần đảo chiều.」"
2153 = "「Thủ công... vâng.」"
2158 = "「Thế là, mọi người đã quyết định tự mình quyên góp tiền để mua đất và tặng lại. Nếu làm vậy, công trình sẽ được khởi động lại.」"
2160 = "「Anh hai!」"
2161 = "「Ưm... vẽ, cái gì cơ ạ—— À không!? Cháu nên vẽ cái gì đây ạ?」"
2164 = "「Là để thoát khỏi tình trạng khó khăn kinh tế bao gồm tất cả những điều đó. Bởi vì những khách du lịch rời bỏ nơi này đã đổ dồn về Yunohira.」"
2166 = "Tôi nói vậy, Hachiroku liền gật đầu đồng tình."
2168 = "「A... em hiểu rồi. Nếu sáp nhập, cái tên Yunohira sẽ biến mất sao.」"
2169 = "「所以美玖路就拚命開動腦筋，有了個想法。如果把Ｄ５１變成觀光景點，會不會引起大家的注意呢？」"
2171 = "「所以美玖路想讓那些孩子再行駛下去。３８６９６是由於鍋爐問題而引退的，所以美玖路希望大家能替我們行駛下去」"
2174 = "「Hahaha, được thôi. Cứ hỏi ta bất cứ điều gì cháu muốn.」"
2177 = "「Hai người, biết chị Hachiroku sao ạ?」"
2180 = "\"Đài phát thanh Maitetsu Đường sắt Ohimitera\" do Paulette bắt đầu phát sóng nhằm mục đích quảng bá và thông báo cho Đường sắt Ohimitera."
2181 = "「拆走零件」"
2183 = "「Lúc đó, tên gọi đã trở thành Yufuin (由布院) ạ?」"
2184 = "「效仿？」"
2192 = "「Vâng, đúng vậy ạ.」"
2197 = "「A! Xin lỗi, đã làm hai người giật mình.」"
2198 = "Hachiroku bắt đầu giải thích cách thao tác. Tôi chăm chú lắng nghe, cố gắng ghi nhớ từng chi tiết nhỏ nhất."
2202 = "「Ra vậy~, thế thì, em cũng biết giọng của Hachiroku nhỉ. A! Hay là, hồi còn đương chức hai người từng chạy cùng nhau?」"
2204 = "Railord tự xưng là Mikuro, từ từ nghiêng cái đầu nhỏ nhắn của mình."
2205 = "「A, Mikuro nghe trên internet ạ. Từ trang web của Đường sắt Ohimitera.」"
2207 = "「Cái này...」"
2209 = "「Dừng lại!」"
2210 = "「是嗎」"
2212 = "「Tùy theo đặc sản của từng thời kỳ... chẳng hạn vậy sao ạ?」"
2214 = "「Đúng vậy. Tuy nhiên, làng Yunohira lúc bấy giờ là một khu suối nước nóng sầm uất hơn cả Yufuin (柚富院).」"
2216 = "「Nhân cơ hội khôi phục tuyến đường này, Yufuin đang bắt đầu mơ ước ——\"sự tĩnh lặng mới của Yufuin\". Về hình dáng tương lai đó.」"
2217 = "「Việc đó... tốn rất nhiều tiền đúng không ạ?」"
2219 = "「是的！畢竟照顧動物和打掃園區的工作，哪怕機械臂有點小故障也不礙事的」"
2220 = "「Nhưng mà, dù là trên đài phát thanh hay trong 『Bản tin buồng lái』, những hoạt động của chị ấy, em đều theo dõi rất sát sao ạ.」"
2223 = "「Vậy sao ạ.」"
2226 = "Những thắc mắc từ cái nhìn đầu tiên, tôi quyết định nói ra vào lúc này."
2228 = "「Chuyến tham quan Yufuin... em ấy có vẻ rất hài lòng nhỉ.」"
2230 = "「Hô? Cháu nghĩ thế nào?」"
2231 = "「A, anh hai, chuyện này thú vị thật đấy. Em muốn nghe thêm nữa.」"
2233 = "「有道理」"
2234 = "Tôi nói vậy, Hachiroku lại gật đầu."
2240 = "「Đã rõ.」"
2242 = "（Lộc cộc! Lộc cộc! Lộc cộc! Lộc cộc!）"
2244 = "「Tuy nhiên, vì thế mà đường sắt đã được thông tuyến. Có ga, có \\x%l列車;#00ffc040;tàu%l;#; chạy qua. Lượng khách du lịch đã tăng lên đáng kể.」"
2247 = "Tôi nhận lấy cuốn sổ tay, rồi lập tức viết lại những câu chuyện nghe được từ Thị trưởng Yufuin vào đó."
2252 = "「Ngài Soutetsu, phía trước có một đoạn dốc. Xin hãy tăng công suất.」"
2256 = "「Không không, ồ. Vừa tập trung vừa tò mò sao? Thú vị thật đấy——trên đời này thực sự có người như vậy nhỉ.」"
2257 = "Ví dụ như, chuẩn bị môi trường để em ấy có thể tập trung thiết kế. Hoặc là, giúp em ấy giải tỏa căng thẳng."
2258 = "「Nếu không có việc đó thì cũng chẳng có chuyện khôi phục tuyến đường, và cả Yufuin lẫn Bungomori, cũng không thể chứng kiến sự hồi sinh mạnh mẽ như hiện tại.」"
2259 = "「Thật tốt khi có thể từ từ ngắm nhìn cảnh vật xung quanh ạ. Tốc độ bằng với lúc chạy lên dốc cao của \\x%l8620;#00ffc040;8620%l;#; nhỉ.」"
2264 = "Thị trưởng Yufuin vẫn giữ nụ cười không đổi. Nhưng đến giờ tôi mới nhận ra, ánh sáng trong đôi mắt ấy vô cùng mạnh mẽ."
2271 = "「Phải mất nhiều thế hệ, Yufuin mới được nuôi dưỡng thành như vậy. Nói theo ngôn ngữ hiện đại thì——chắc là xây dựng thương hiệu (branding) nhỉ.」"
2272 = "「Em ấy đang ở trong phòng thiết kế ạ. Từ lúc trở về từ Yufuin, em ấy đã nhốt mình trong phòng, không ngừng vẽ vời.」"
2273 = "「Hửm?」"
2274 = "「Chạy trong tâm trí, sao.」"
2275 = "「Nhưng mà, vẫn không đủ tiền để tự mình vực dậy sao ạ?」"
2276 = "「為什麼」"
2277 = "「Tại sao lại sáp nhập ạ?」"
2279 = "「Việc mọi người ở Ohimitera biến việc đóng mới \\x%l客車;#00ffc040;toa hành khách%l;#; thành một dự án kinh doanh. Dù là tư cách cá nhân hay Thị trưởng, tôi đều rất biết ơn.」"
2280 = "Việc khôi phục tuyến đường, sự hồi sinh của Bungomori, sự gia tăng dân di cư kéo theo đó, thậm chí cả kế hoạch toa ăn nghỉ dưỡng..."
2284 = "Tráo đổi với những bộ phận bị hỏng của cỗ máy đang hoạt động, với sự chuẩn bị tâm lý ——thực chất, là hiến tặng sao."
2285 = "「Gấp đôi ngân sách của thị trấn lúc bấy giờ đấy. Tất nhiên, thị trấn cũng rơi vào tình trạng cạn kiệt ngân sách ngay lập tức.」"
2286 = "「Đúng vậy. Thậm chí còn có tin đồn là Yufuin đã bị hủy diệt. Thứ được cho chạy để bác bỏ tin đồn đó——chính là cái này đây.」"
2287 = "「Thì nó phải đi bộ chứ. Là ngựa mà.」"
2288 = "「Thì nó phải chạy chứ, là ngựa mà. Anh nói này Hibi——à không, thất lễ rồi. Thưa Thị trưởng Migita.」"
2290 = "Tôi đáp lại một cách tự tin. Hachiroku gật đầu hài lòng."
2291 = "Hachiroku mỉm cười dịu dàng. Nụ cười đó, xua tan đi mọi mệt mỏi trong tôi."
2301 = "「Tôi là chủ sở hữu, Master của Hachiroku, và là người lái tàu.」"
2302 = "「Có đấy ạ, ngay tại đây.」"
2303 = "「確實是這樣」"
2304 = "「Ừm, không ngờ trong một công viên giữa lòng thành phố thế này lại có——mà nói đúng hơn là...」"
2307 = "「Chỗ kia——anh hai, là đầu máy xe lửa kìa!」"
2308 = "Nằm lặng lẽ như một điểm mù giữa khu du lịch sầm uất. Không biết đó có phải là một tai họa hay không——"
2311 = "「Ngay sau khi bại trận, Yufuin đã bị biến thành căn cứ và cơ sở nghỉ dưỡng của quân đội Mỹ.」"
2314 = "「美玖路想效仿八六姐姐大人——效仿御一夜鐵路的各位。看到了姐姐大人的努力，美玖路覺得自己也可以試一試」"
2317 = "「美玖路明白這樣下去情況只會越來越窘迫」"
2318 = "「美玖路沒那麼了不起啦，只是想要效仿自己憧憬的對象而已」"
2321 = "Tôi nhìn quanh, thấy mọi người đều đang mỉm cười hạnh phúc. Đây chính là khoảnh khắc mà tôi luôn mong đợi."
2322 = "Paulette cũng bước đến chúc mừng tôi. Tôi gật đầu cảm ơn em ấy."
2324 = "Những gì em ấy thực sự nghĩ trong lòng—— Những gì lọt vào mắt Hibiki, cứ thế được nói ra thành lời——!"
2326 = "「Vâng. Chúng ta hãy cùng nhau cố gắng nhé.」"
2327 = "Bại trận——Nếu là sự thất bại của \\x%l大戦;#00ffc040;Đại chiến%l;#; trước đây, thì đó là năm \\x%l大詔;#00ffc040;Taisho%l;#; thứ 35. Tức là năm đầu tiên của thời kỳ \\x%l正和;#00ffc040;Showa%l;#;."
2330 = "Bị nhắc nhở, Hibiki giật mình ngẩng mặt lên, vươn thẳng lưng, nhìn quanh với điệu bộ hơi kịch cỡm——"
2331 = "「能聽到你這麼說我感到非常榮幸。如果有什麼我們能幫得上忙的事請儘管提出來」"
2333 = "Cả hai đều là những thao tác vô cùng quan trọng đối với \\x%l機関士;#00ffc040;người lái tàu%l;#;. Không được phép có bất kỳ sai sót nào."
2336 = "「要一個一個來才行。美玖路已經考慮過了。３８６９６在動物園裡是無論如何都不可能重獲關注的」"
2340 = "「Xe ngựa du lịch... tuyệt thật đấy. Đây là lần đầu tiên cháu được ngồi——」"
2346 = "「À, đúng vậy. Mặc dù là do bên đó mời, nhưng đây thực sự là một cơ hội học hỏi tuyệt vời.」"
2347 = "「Tốt lắm ạ. Xin hãy duy trì công suất này cho đến khi qua khỏi đoạn dốc.」"
2348 = "「Tốt lắm ạ. Xin hãy duy trì tốc độ này cho đến khi qua khỏi khúc cua.」"
2351 = "「——Lấy phụ tùng.」"
2352 = "「Cảm ơn ngài đã quan tâm. Nhưng mà——」"
2375 = "「Xin mời, nếu ngài không phiền.」"
2383 = "「Dù biết vậy——dù biết vậy mà vẫn」"
2385 = "Thấy tôi nín thở, vẻ mặt Mikuro càng thêm bối rối. Vì vậy, tôi đã nhận ra."
2386 = "Lịch sử, cũng như những sáng kiến đã giúp Yufuin trở thành Yufuin như ngày nay. Tất cả đều vô cùng hữu ích cho tương lai của Ohimitera."
2387 = "「A! Vâng, đúng vậy ạ. Đứa bé này cũng vậy, chắc chắn sẽ thêm một lần nữa. Có thể chạy trong tâm trí, trong những ký ức.」"
2388 = "Tôi và Hachiroku đã có mặt tại buồng lái của \\x%l8620;#00ffc040;8620%l;#;. Hôm nay, chúng tôi sẽ tiến hành huấn luyện thực tế trên đường ray."
2389 = "「這孩子為什麼會被遺棄在這裡？為什麼沒有人照料它？」"
2390 = "「Đó là vinh hạnh của chúng cháu ạ.」"
2391 = "「Xin hỏi... Hachiroku mà hai người nhắc đến, có phải là chị Hachiroku, chiếc xe số 1 của loại [8620, 4]8620 không ạ?」"
2392 = "Tôi từ từ kéo van tiết lưu. \\x%l8620;#00ffc040;8620%l;#; bắt đầu di chuyển một cách chậm rãi."
2393 = "「...Như vậy đó ạ. Ngài Soutetsu, ngài đã hiểu rõ chưa ạ?」"
2394 = "Hachiroku mỉm cười. Nụ cười đó, dường như đang cổ vũ tôi."
2395 = "「Mặc dù lượng khách du lịch tăng lên, nhưng nếu là khách đi về trong ngày thì chẳng thu được bao nhiêu tiền. Vì vậy, sáp nhập là điều không thể tránh khỏi.」"
2396 = "Với tư cách là một người lái tàu, tôi cũng đã tích lũy được chút ít kinh nghiệm. Vì vậy, tôi có thể khẳng định chắc chắn."
2397 = "「過去３８６９６和美玖路一直都是光潔如新的哦！不過，呃……」"
2402 = "「Đã rõ.」"
2404 = "「Nếu vậy! Cháu xin phép không khách sáo nữa ạ!」"
2405 = "「Cứ thế này mà trả lời câu hỏi cũng được chứ?」"
2407 = "Khu phố không chỉ có những công trình cổ kính. Những tòa nhà mới——thậm chí cả tiệm làm móng cũng có, nhưng tất cả đều hòa hợp một cách hoàn hảo."
2409 = "Vài ngày sau."
2410 = "「那麼是不是應該先讓“相當破舊”的３８６９６“馳騁於回憶”之中呢？」"
2411 = "「Không phải ạ, Mikuro là, Railord của đầu máy hơi nước loại 8620, số hiệu 38696 thuộc [Đường sắt Hoàng gia cũ, 4]Đường sắt Hoàng gia cũ ạ.」"
2412 = "「...Nên em đã nhường những phụ tùng khác, cho những đứa trẻ có nồi hơi khỏe mạnh sao?」"
2414 = "Ra vậy, Mikuro không muốn đề cập đến chuyện đó—— Nên em ấy mới cố gắng lựa chọn những \"từ ngữ dễ gây hiểu lầm\" sao."
2415 = "Tôi hít một hơi thật sâu, chuẩn bị tinh thần. Huấn luyện \\x%l機関士;#00ffc040;người lái tàu%l;#; của Hachiroku rất nghiêm ngặt."
2418 = "Và rồi, \"A\", cái miệng nhỏ nhắn há ra vì ngạc nhiên."
2419 = "「Đúng vậy. Dù sáp nhập, nhưng vẫn muốn giữ lại tên gọi của cả hai bên. Nên đã lấy chữ Yu (湯) của Yunohira (湯平), và chữ Fuin (布院) của Yufuin (由布院).」"
2423 = "「Hachiroku.」"
2428 = "Tôi từ từ đẩy van tiết lưu, đồng thời sử dụng phanh để giảm tốc độ. \\x%l8620;#00ffc040;8620%l;#; từ từ đi vào ga cuối."
2432 = "「Chiếc 38696 của Mikuro cũng... là một cỗ máy bảo tồn khá tơi tả ạ. Phụ tùng các thứ, bị thiếu hụt nhiều lắm rồi.」"
2433 = "Vì Hibiki cũng thỉnh thoảng đảm nhận vai trò người dẫn chương trình, nên Mikuro mới biết đến em ấy sao."
2564 = "「Chúc mừng cậu, Soutetsu. Cậu đã làm rất tốt.」"
2565 = "Đèn pha ở cổ bị thiếu mất, màu mắt hai bên cũng khác nhau rõ rệt——A!"
2574 = "Giọng điệu của ông ấy vẫn luôn tươi sáng và nhẹ nhàng."
2575 = "Và rồi, ánh mắt ấy ngước lên. Giọng nói khẽ run rẩy."
2576 = "不過她看起來好像只是有些為難，並沒有露出半點陰鬱的神色。"
2577 = "Về mặt hình ảnh, không phải là tôi không hiểu em ấy muốn nói gì."
2578 = "「Đúng không! Là đầu máy xe lửa đúng không!?」"
2579 = "「Ư...m.」"
2580 = "「Đã rõ.」"
2591 = "「Cỗ xe ngựa này... bởi vì... đẹp đến nhường này... Xe ngựa cũng vậy... tất cả mọi thứ của thị trấn——đều là biểu tượng của... Yufuin——」"
2595 = "「Chuyến tham quan bằng xe ngựa... cũng rất thú vị đấy chứ.」"
2598 = "Sự bao dung của Thị trưởng Yufuin, lúc này chúng tôi nên biết ơn và đón nhận toàn bộ mới phải."
2600 = "來動物園參觀的遊客，應該沒有人會喜歡上目睹那種景象時所產生的罪惡感。"
2607 = "Thực tế, Ohimitera thậm chí còn có cảm giác như đang liên tục bị cướp mất khách hàng tiềm năng bởi hai khu suối nước nóng đang cạnh tranh gay gắt này."
2611 = "Đó là lời hứa của tôi. Và tôi sẽ dùng cả cuộc đời mình để thực hiện lời hứa đó."
2616 = "原來，美玖路並不想提及這件事，所以才會拚命避開本題，用了容易招來誤解的說法。"
2624 = "「So sánh kiểu đó đúng là đậm chất \\x%lレイルロオド;#00ffc040;Railord%l;#; đấy.」"
2628 = "「Nếu vậy chẳng lẽ, chị là——Phụ lái tàu Migita Hibiki ——đúng không ạ. Vì đây không phải là giọng của Phụ lái tàu Minokasa Nagi.」"
2629 = "Bỏ mặc tôi, chủ sở hữu, Master kiêm người lái tàu, ánh mắt của Mikuro hoàn toàn chỉ hướng về phía Hibiki."
2633 = "召集志願者把這裡打掃乾淨，讓機車煥然一新，成為觀光客們的聚集地。"
2634 = "「Chính xác. Ngay cả sau khi cơ sở bị dỡ bỏ, lượng khách vẫn không phục hồi, rơi vào tình trạng khó khăn kinh tế đến mức xuất hiện cả kế hoạch xây dựng đập thủy điện.」"
2646 = "「Chính xác là vậy. Bởi vì mọi thứ của thị trấn, đến từng ngóc ngách đều là \"Yufuin\", nên thị trấn này mới có thể toát lên sự tĩnh lặng đến nhường này.」"
2651 = "「Ngài Soutetsu, ngài làm rất tốt ạ. Ngài đã có thể điều khiển \\x%l8620;#00ffc040;8620%l;#; một cách cơ bản rồi.」"
2653 = "Tôi điều chỉnh van tiết lưu để duy trì tốc độ. \\x%l8620;#00ffc040;8620%l;#; chạy băng băng trên đường ray, mang theo những hy vọng của chúng tôi."
2654 = "「Lúc nãy, em đã——」"
2657 = "Tất cả chỉ mới bắt đầu. Nhưng, tôi tin rằng, chúng tôi sẽ làm được."
2658 = "因為鍋爐問題而引退……這句話我深有體會。因為鍋爐的磨損和老化才是蒸汽機車的致命傷。"
2662 = "「Đúng vậy đấy. Dù là thời thị trấn Yufuin hay khi đã trở thành thành phố Yufuin, tài chính lúc nào cũng trong tình trạng báo động. Đời sống của người dân cũng chẳng khá khẩm hơn.」"
2663 = "「Em là, Railord của đầu máy xe lửa này sao?」"
2666 = "Đó là những bức phác họa nhanh bắt trọn những cảnh vật lướt qua trong lúc lắc lư trên xe ngựa. Cuốn sổ phác thảo tràn ngập những đường nét giản dị."
2668 = "Dù cầm chổi bằng cả hai tay, nhưng bàn tay trái vẫn mở ra và chỉ đặt hờ lên ——bởi vì em ấy không hề nắm lấy cán chổi."
2671 = "「Cứ đi mà cúi gầm mặt xuống như thế, thì sẽ bỏ lỡ những thứ cần xem đấy.」"
2676 = "Giật mình vì giọng nói, chúng tôi quay lại. Và lại thêm một chút ngạc nhiên trước sự hiện diện đang đứng đó."
2678 = "Tôi đáp lại một cách tự tin. Hôm nay, chúng tôi sẽ chạy thử nghiệm trên toàn tuyến đường của Đường sắt Ohimitera."
2681 = "「Ồ, cháu vẽ xong rồi sao?」"
2682 = "Tiếng xình xịch vang lên đều đặn. Cảm giác rung lắc truyền qua cơ thể, khiến tôi cảm thấy vô cùng hưng phấn."
2684 = "Cỗ máy đang hoạt động——là cả Railord và \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; sao. Mikuro đã, lấy phụ tùng của chính mình, cánh tay máy..."
2686 = "「Tốc độ 20km/h. Xin hãy duy trì tốc độ này.」"
2687 = "「Ngài Soutetsu, chúng ta sắp đến ga cuối rồi ạ. Xin hãy chuẩn bị dừng lại.」"
2690 = "「Được. Hôm nay làm gì đây?」"
2692 = "Nếu được phép cư xử như bình thường, Hibiki sẽ vẽ. Bởi vì đây là lần đầu tiên em ấy được tiếp xúc gần gũi với ngựa và xe ngựa đến vậy."
2694 = "「Đúng vậy ạ! Nếu tơi tả đến mức này, thì mọi người sẽ không muốn nhìn nó nữa đâu ạ.」"
2696 = "Ngày hôm sau."
2698 = "「Không ạ, Mikuro ở Omuta. Từ lúc nghỉ hưu đến giờ, em làm việc ở sở thú Omuta ạ.」"
2701 = "「À không, cháu cảm thấy mọi thứ dường như đã kết nối với nhau. Cảnh tượng này, và \"sự sôi động\" mà Thị trưởng vừa nhắc đến lúc nãy.」"
2702 = "Khi tôi nhận ra điều đó và chuyển hướng câu chuyện, vẻ mặt Mikuro nhanh chóng từ bối rối trở lại nụ cười."
2705 = "就算把破舊機車的周圍打掃得再乾淨，也只會突顯出機車本身的殘破和蕭瑟——"
2707 = "「Hả.」"
2708 = "「Vâng, tốt lắm ạ. Tiếp theo, chúng ta sẽ tiến hành thao tác thực tế.」"
2712 = "Cảnh vật hai bên đường lướt qua nhanh chóng. Tôi cảm thấy mình như đang bay trên bầu trời vậy."
2721 = "「Dạ vâng! Vậy thì——」"
2723 = "Một khoảnh khắc, dường như có một bầu không khí khiến người ta muốn nâng ly cạn chén nếu có bia ở đây."
2724 = "「Xuất phát!」"
2727 = "「Vâng. Vậy thì, ngài Soutetsu, chúng ta bắt đầu huấn luyện thôi ạ.」"
2731 = "想要解決鍋爐爆炸的隱患，就必須重造鍋爐，可是這麼做成本太高了。"
2736 = "「Xác nhận xong. Không có gì bất thường.」"
2737 = "「!——」"
2740 = "「Quả nhiên là vậy! Giống hệt nhau luôn mà! Nhỉ! Anh hai!」"
2742 = "「Rồi. Bất cứ lúc nào cũng được.」"
2744 = "「Trước tiên, chúng ta sẽ bắt đầu từ việc kiểm tra các bộ phận. Ngài Soutetsu, xin hãy xác nhận tình trạng của van tiết lưu và cần đảo chiều.」"
2746 = "「Sự tĩnh lặng của Yufuin không phải là sự tĩnh lặng do bị bỏ mặc. Nói cách khác——đó là sự tĩnh lặng hài hòa với sự sôi động, đúng không ạ?」"
2749 = "Đường sắt Kyudai. Tuyến đường sắt kết nối Oita và Kurume. Là tuyến đường sắt chạy qua Yufuin."
2752 = "Công viên Thiếu nhi Trung tâm Yufuin. Một công viên nằm lệch ra khỏi con đường được gọi là trục đường chính."
2754 = "「Hả!?」"
2760 = "「Ưm.」"
2761 = "Tôi đẩy nhẹ van tiết lưu, đồng thời sử dụng phanh để giảm tốc độ. \\x%l8620;#00ffc040;8620%l;#; từ từ đi vào khúc cua."
2769 = "Sau đó, tôi tiếp tục lặp đi lặp lại các thao tác dưới sự hướng dẫn của Hachiroku. Đến khi kết thúc buổi huấn luyện, toàn thân tôi đã đẫm mồ hôi."
2805 = "Tôi nhận lấy cuốn sổ phác thảo mà Hibiki đưa ra, rồi lấy cuốn mới từ trong cặp ra đổi cho em ấy."
2806 = "「Vâng. Chúng ta hãy cùng nhau cố gắng nhé.」"
2807 = "「Ồ?」"
2810 = "「Cùng với đó, phương hướng xây dựng thị trấn cũng được thống nhất.」"
2813 = "Nghỉ hưu do hỏng nồi hơi... một câu nói thật xót xa. Bởi vì sự xuống cấp, lão hóa của nồi hơi chính là vết thương chí mạng của đầu máy hơi nước."
2814 = "Không hẳn là u ám, mà chỉ đơn thuần là có vẻ bối rối."
2816 = "Đây là một bước tiến quan trọng trong việc đưa \\x%l8620;#00ffc040;8620%l;#; vào hoạt động thương mại. Tôi không được phép thất bại."
2819 = "「...Lấy phụ tùng. Ở những cỗ máy đang hoạt động——ưm, có sự thiếu hụt phụ tùng, nếu cứ để vậy, sẽ có những đứa trẻ không thể chạy được nữa.」"
2821 = "Cách duy nhất để đối phó với tình trạng có thể dẫn đến nổ nồi hơi đó, là chế tạo một chiếc nồi hơi mới, và điều đó thì không tương xứng với chi phí bỏ ra."
2824 = "「Nếu vậy, chẳng phải nên ưu tiên cho chiếc 38696 \"khá tơi tả\" kia, để nó có thể \"chạy trong ký ức\" sao?」"
2826 = "Đôi tay đang phác thảo của Hibiki đột ngột dừng lại. Với đôi mắt mở to, em ấy ngước nhìn Thị trưởng Yufuin."
2827 = "Giọng nói đột ngột của Hibiki khiến vị Thị trưởng chưa quen với em ấy phải giật mình."
2828 = "日日姬的聲音還是冷冰冰的。我連忙回身一看，發現她繃著一張臉。"
2829 = "Đó không chỉ là những bức tranh phong cảnh. Mà còn chứa đựng cả những ý tưởng thiết kế được lấy cảm hứng từ phong cảnh đó."
2832 = "Tay Hibiki không hề dừng lại một chút nào. Thậm chí ánh mắt, vẫn cứ di chuyển liên tục giữa cuốn sổ phác thảo và cỗ xe ngựa."
2833 = "「Không phải là sự tĩnh lặng tương đối, giống như một khu nhà phụ của Beppu. Mà hướng tới một 'sự tĩnh lặng thủ công' tận dụng thiên nhiên và môi trường.」"
2835 = "Hibiki đã hoàn toàn chìm đắm vào câu chuyện."
2837 = "「Oa! Chị vui lắm khi biết em có nghe đài đó! Vậy là, bé Mikuro cũng sống ở quanh khu vực Kumamoto sao?」"
2840 = "Mặc dù khí chất bên ngoài khá khác biệt, nhưng khi để ý kỹ, thì chỉ có \"khí chất bên ngoài\" là khác thôi."
2856 = "沒有收入的話，就沒錢給封存機車做維護保養。雖然美玖路還在盡力把機車的周圍打掃乾淨……"
2857 = "Dù chỉ mới phác thảo bằng bút chì, nhưng nhìn vào đó, tôi có thể hiểu được tại sao Thị trưởng Yufuin lại khen ngợi em ấy."
2858 = "「Em là...」"
2884 = "Cảm giác hồi hộp xen lẫn háo hức. Tôi nhất định sẽ điều khiển \\x%l8620;#00ffc040;8620%l;#; thật tốt."
2886 = "「Đúng vậy ạ. Vì thế, chúng ta mới cần phải huấn luyện.」"
2887 = "Tôi nắm lấy van tiết lưu, từ từ kéo về phía mình. Tiếng hơi nước rít lên, \\x%l8620;#00ffc040;8620%l;#; bắt đầu di chuyển."
2888 = "「Đã có một thời kỳ như vậy đấy. Ảnh hưởng của việc bại trận là rất lớn.」"
2889 = "Nhưng mà, Hibiki này. Đừng có nhún nhảy trên xe ngựa như thế chứ."
2890 = "Vừa nói, Thị trưởng Yufuin vừa nới lỏng cà vạt. Tôi cũng làm theo y như vậy."
2891 = "「Không có chi ạ. Đó là nhiệm vụ của tôi mà.」"
2898 = "發覺我領會到她的難處並自己岔開了話題，美玖路馬上重新露出了笑容。"
2900 = "看到我大吃一驚的反應，美玖路的表情顯得越來越為難。我這才發覺……"
2902 = "Vừa nói xong, Hibiki đã lấy cuốn sổ phác thảo ra, khiến Thị trưởng Yufuin khẽ thốt lên kinh ngạc."
2904 = "「Tuyệt vời ạ. Ngài Soutetsu, ngài nắm bắt rất nhanh.」"
2906 = "「Vậy thì, ngài Soutetsu. Xin hãy thử thao tác xem sao.」"
2911 = "「Mọi người đã lập ra một kế hoạch đô thị dài hạn bám sát theo chủ đề. ...Đây không phải là điều có thể dễ dàng thực hiện được nhỉ.」"
2912 = "Dù là lời nói đùa, nhưng tôi không ghét kiểu đó. Nghe thấy tiếng cười của tôi, Hachiroku lại càng vui vẻ hơn."
2914 = "「Còn em là phụ lái tàu. Hôm nay bọn em đến từ thành phố Ohimitera để thị sát đó.」"
2921 = "Beppu phồn hoa, Yufuin tĩnh lặng. Hai khu suối nước nóng lớn của Oita mang những sắc thái hoàn toàn khác biệt."
2923 = "「Tốc độ 40km/h. Xin hãy duy trì tốc độ này.」"
2925 = "美玖路所說的方案，就是我們一直在開展的以八六為案例的廢線恢復與延伸計劃的翻版。"
2928 = "Đó là ước mơ của tôi. Và tôi sẽ làm mọi cách để biến ước mơ đó thành hiện thực."
2930 = "Chúng tôi cùng nhau bước xuống khỏi buồng lái. Mọi người đang đứng đợi chúng tôi ở sân ga, với những nụ cười rạng rỡ trên môi."
2932 = "「Hình ảnh càng tốt... thì khi bị phá vỡ—— Ưm——sẽ không dễ dàng gì——」"
2934 = "美玖路臉上的笑容頭一回消失了。"
2936 = "Sự hồi sinh của \\x%l8620;#00ffc040;8620%l;#;. Và sự phục hưng của Ohimitera."
2937 = "美玖路說出了她的想法。“把Ｄ５１變成觀光景點”就是先讓這輛湯布院的Ｄ５１　１０３１號車去吸引大家的目光。"
2938 = "美玖路說的現役機車，是把鐵路人偶和\\x%l蒸気機関車;#00ffc040;蒸汽機車%l;#;一起算進去了啊。她自願把自己的零件，把機械臂……"
2944 = "Mỗi khi lật qua từng trang, từng trang một, ánh mắt của Thị trưởng Yufuin lại càng trở nên chăm chú hơn."
2946 = "「Em nói là đang làm việc ở sở thú Omuta——đúng không. Vậy thì, chiếc 38696 cũng được bảo tồn ở đó sao?」"
2947 = "Nghe tiếng cười của Thị trưởng Yufuin, Hibiki vội vàng chỉnh lại biểu cảm."
2948 = "「Hả!?」"
2949 = "「Cảm ơn cô, Hachiroku. Nhờ có cô mà tôi đã học được rất nhiều điều.」"
2950 = "Tôi kéo mạnh van tiết lưu, đồng thời điều chỉnh cần đảo chiều. \\x%l8620;#00ffc040;8620%l;#; gầm lên mạnh mẽ, lao lên đoạn dốc."
2951 = "「Hả!? Hachiroku á—— Vậy là, em gái của Hachiroku sao!!?」"
2953 = "「Đã rõ.」"
2954 = "與現役機車的故障品做了交換——實際上就是捐了出去。"
2956 = "「À, là xe ngựa sao ạ?」"
2958 = "「Thành phố Ohimitera——Đường sắt Ohimitera! Phụ lái tàu của chị Hachiroku, chiếc xe số 1!」"
2974 = "「Cảm ơn cô, Hachiroku. Nhờ có cô mà tôi mới có thể làm được như vậy.」"
2983 = "「——Ừm.」"
2984 = "「Vậy sao. Chắc là em ấy đang tràn đầy cảm hứng. Đừng làm phiền em ấy thì hơn.」"
2985 = "「Đứa bé này... tơi tả quá. [Cửa buồng khói, 2]Cửa buồng khói bị thủng lỗ chỗ luôn rồi.」"
2986 = "這種事我們現在也經常做。不過從“受害當事人”的口中聽到這些話，不免感覺……"
2987 = "Thị trưởng Yufuin có vẻ rất vui, ông ấy híp mắt lại, liên tục gật đầu trước những câu hỏi của Hibiki."
2988 = "Một câu nói vô cùng bất ngờ. Chưa bàn đến Bungomori——"
2989 = "「Không thể nào, đến ga vẫn còn hơn mười phút nữa cơ mà——hửm!?」"
2993 = "「Hô hô~」"
2995 = "通過成功案例帶領周邊地區往相同方向發展。這種思路我非常能夠理解，也很合我的胃口。"
2996 = "「Ngài Soutetsu, ngài làm rất tốt ạ. Chuyến chạy thử nghiệm đã thành công mỹ mãn.」"
3000 = "「Ừm, đại khái là hiểu rồi. Nhưng mà, thao tác thực tế chắc chắn sẽ khó hơn nhiều.」"
3006 = "Cứ như vậy, chúng tôi tiếp tục chạy trên đường ray. Dưới sự hướng dẫn của Hachiroku, tôi đã thực hiện các thao tác một cách trơn tru."
3008 = "難怪會合我的胃口。"
3014 = "「Mỗi khi tiếp xúc với những tin tức như vậy, Mikuro cũng cảm thấy như, mình đang được cùng chị ấy chạy trong tâm trí, vui lắm ạ.」"
3024 = "Giọng nói cứng đắn bất ngờ của Hibiki, người nãy giờ vẫn im lặng lắng nghe. Tuy nhiên, Mikuro vẫn mỉm cười đáp lại như không có chuyện gì xảy ra."
3025 = "「Phát triển khu nghỉ dưỡng. Những câu chuyện như thu hút sân golf lúc nào cũng chia rẽ thị trấn, chưa kể còn xảy ra một trận động đất lớn nữa.」"
3026 = "（Lộc cộc——Lộc cộc——）"
3027 = "（Lộc cộc! Lộc cộc! Lộc cộc! Lộc cộc!）"

