2168 = "「Phạm vi rộng hơn là…… từ thành phố Ohitera đến tận thành phố Yatsushiro á,\\ndù nói thế nào thì cũng rộng quá mức rồi.」"
2170 = "「Đơn giản lắm! Đây là nút chụp,\\nanh nhấn nhẹ một nửa. Máy sẽ kêu tít tít tít, lúc đó anh nhấn hết cỡ luôn.」"
2175 = "「Có chuyện gì vậy? Navi.」"
2176 = "「Làm gì có chuyện đó. Anh đâu có ngốc đến mức ấy.」"
2178 = "「Ngài đang phân vân về điều gì của trang phục ạ?」"
2179 = "「Làm sao để lưu lại?」"
2182 = "「Chắc là, nếu muốn làm họa sĩ minh họa thì trong số những người muốn làm...\\nChắc chỉ có một trong một vạn người mới có thể làm nghề này chuyên nghiệp thôi.」"
2187 = "「Em có cảm giác nó khá giống nhau.\\n――Có lẽ là rất gần với cảm giác đó đấy.」"
2189 = "「Em…… vẫn chưa,\\nnhận được công việc nào từ bên ngoài thành phố Ohitera cả.」"
2191 = "「Một mình em thì không làm được đâu. Em vẫn chưa biết gì về tàu hỏa cả.\\nNhưng―― em muốn làm. Vừa làm vừa học hỏi từ mọi người.」"
2193 = "「Anh không biết mình có nói chuyện được với bố mẹ hay không.\\nNhưng―― anh nghĩ dù chỉ là từ một phía, anh cũng đã truyền đạt được nhiều điều.」"
2195 = "「Được em nói vậy, anh cũng rất vui.\\nAnh rất sẵn lòng nhận công việc chào hàng này.」"
2197 = "「Em cũng muốn được nhìn thấy mà.\\nXem đôi mắt của anh hai đang nhìn thấy những cảnh sắc như thế nào.」"
2200 = "「Hãy cùng đi gặp người đã dạy cho chúng ta biết sức hấp dẫn và niềm vui của đường sắt――\\n8620, chỉ có hai chúng ta thôi.」"
2201 = "「Của bọn anh sao?」"
2202 = "「Đúng hơn là, anh nghĩ đây chính là việc mà chúng ta phù hợp nhất để làm.\\nHãy thử nhớ lại chúng ta của một thời gian trước xem.」"
2205 = "「Anh vừa đi viếng mộ về.\\nMộ của bố, và mẹ.」"
2207 = "「Anh, sao?」"
2208 = "「Em về rồi đây!」"
2209 = "「Anh về rồi đây.\\n――Hửm? Hibiki vẫn còn ở học viện sao.」"
2213 = "「Anh thì, hầu như chẳng làm được gì cả.」"
2215 = "「Vui quá! Em đã luôôôn muốn thử phối đồ\\ncho anh hai từ lâu rồi!」"
2218 = "「Em cứ có cảm giác anh mặc nhiều loại đa dạng hơn cơ.」"
2219 = "「Anh muốn đi đến tận ga cuối cùng.\\nĐó là―― mong muốn mãnh liệt nhất của anh về đường sắt.」"
2221 = "「Chắc là vậy rồi.」"
2223 = "「Anh đã nghĩ ra một cái tên.」"
2224 = "「Chuyện đó, em sẽ để dành làm niềm vui khi được dạy bảo đàng hoàng.\\nBây giờ―― em muốn tìm ra những thứ cần phải nhìn thấy ngay lúc này.」"
2226 = "「Anh muốn nhờ Hibiki thiết kế chuyến tàu đó.」"
2229 = "「Là chúng ta, đối với vấn đề của chúng ta.\\nTức là về sự khó khăn trong việc đền bù giải tỏa đất để khôi phục tuyến đường ấy.」"
2230 = "「Thì là―― thì là nhé?」"
2233 = "「Em muốn biến nó thành như vậy nên mới cố gắng!\\nNgười như em thì vẫn còn kém cỏi lắm.」"
2235 = "「Anh đã giúp được gì cơ?」"
2236 = "「Nếu làm được như vậy thì đúng là lý tưởng thật.\\nNhưng quả thực, chuyện đó thì hơi khó.」"
2238 = "「Điều anh mơ ước và khao khát, chỉ là một chuyến du lịch hạnh phúc của gia đình.\\nMột chuyến tàu du lịch an toàn, ấm áp, ôm trọn lấy cả gia đình.」"
2240 = "「Em biết chứ! Rằng anh được đánh giá cao đến mức\\nbố dù có làm cách nào cũng không muốn buông tay!」"
2241 = "「Một ý kiến tuyệt vời.\\nCô có vẻ còn sành sỏi sự đời hơn cả tôi đấy.」"
2243 = "「Này Michiko,\\ncửa sổ của chuyến tàu này, có thể mở ra không.」"
2246 = "「Cũng không hẳn là tủ quần áo đâu.」"
2248 = "「Vì vậy, trước tiên hãy xác nhận trang phục của Hibiki.\\nSau đó, ngài và Hibiki cùng nhau chọn trang phục cho ngài thì sao ạ?」"
2249 = "「Vì thế. Em sẽ thay đồ!\\nEm đi tắm nhanh rồi ra ngay.」"
2252 = "「Vì vậy, anh muốn thể hiện thực lực của Hibiki bằng một thứ gì đó miễn phí.\\nMột thứ gì đó có sức hút với lĩnh vực đường sắt, công cộng và lưu vực sông Kuma.」"
2254 = "「Vì thế. Ngay từ đầu em đã không hướng đến con đường đó rồi.\\nEm chỉ cần cả đời được vẽ là đủ rồi.」"
2256 = "「Thế nên, cứ bình thườờờng thôi!\\nChính xác là một anh hai như thường ngày, xin anh đấy!」"
2258 = "「Vì thế nên anh hai mới về sớm hơn nhỉ.\\nEm cứ nghĩ ít nhất cũng có thời gian đi tắm cơ đấy.」"
2260 = "「Vì thế! Tất nhiên là em cực kỳ hoan nghênh!! Nếu được anh hai\\nđi chào hàng giúp, em sẽ càng, càààng cố gắng hơn nữa!」"
2263 = "「Thời gian cuộc hẹn, liệu có ổn không ạ?」"
2264 = "「Định lên tàu làm việc――」"
2266 = "「Sắp xếp lại những điều muốn truyền tải. Hình ảnh hóa chúng.\\nSuy nghĩ xem chất liệu nào là tốt nhất để truyền tải những điều đó.」"
2268 = "「Nếu vậy, trước hết chúng ta hãy giới thiệu về 8620.\\nTruyền tải nguyên vẹn sức hấp dẫn đã thu hút chúng ta.」"
2270 = "「Nếu nói là \"đối diện\" thì, ngay cả những chuyện của em ở học viện,\\nem cũng muốn được anh hai nhìn thấy nữa cơ.」"
2282 = "「Hibiki bảo tôi cứ mặc như bình thường là được……\\nNhưng tôi e là đến nơi làm việc của Hibiki mà không thắt cà vạt thì hơi thất lễ.」"
2285 = "「Tại sao Hibiki lại\\nứng cử làm \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; vậy?」"
2287 = "「Hibiki thực sự rất cố gắng nhỉ.」"
2289 = "「Chào mừng em về nhà, Hibiki. Và, anh về rồi đây.」"
2290 = "「Hibiki. Cho anh mượn bút và giấy được không?」"
2293 = "「Rõ ràng là còn rất nhiều cách khác,\\ntại sao em lại nghĩ đến việc tự mình lên tàu làm việc?」"
2300 = "「À――」"
2301 = "「À―― ừm.」"
2303 = "「Vậy sao―― anh cũng, đang mong chờ điều đó.」"
2304 = "「Đúng vậy. Đúng hơn là――」"
2306 = "「Đúng vậy. Màu xám, màu xanh dương, màu xanh đen kẻ sọc mờ――\\nMỗi màu một bộ một hàng khuy, và một bộ màu đen hai hàng khuy dùng làm lễ phục.」"
2307 = "「Đúng vậy nhỉ. Một chuyến tàu như thế nào thì mới tốt đây.\\nTừ giờ chúng ta hãy cùng nhau tìm kiếm điều đó nhé.」"
2310 = "「Đúng vậy. Cũng cùng một ý nghĩa cả thôi. Với con người thường ngày của anh,\\nanh phải đối diện với một Hibiki thường ngày―― à, không.」"
2311 = "「Đúng vậy.」"
2312 = "「A!」"
2313 = "「Vậy sao.\\n――Vẫn chưa à.」"
2314 = "「Vậy sao.\\nĐược em nghĩ như vậy, anh rất vinh hạnh.」"
2315 = "「Vậy sao. Nếu vậy, anh nhờ em được không?」"
2316 = "「Vậy sao. Nếu được vậy thì tốt quá. Nhưng――\\nNếu vậy thì khả năng vẽ vời là cần thiết chứ nhỉ?」"
2317 = "「Vậy sao?」"
2318 = "「Vậy sao? Điều đó―― thành thật mà nói, khá bất ngờ đấy.」"
2320 = "「Áo sơ mi của Ohitera sao?」"
2321 = "「Ừ.」"
2327 = "「Đúng hơn là, những người muốn cầm tấm bản đồ đó đi tham quan,\\nthì ngay từ đầu họ đã ủng hộ việc khôi phục tuyến đường rồi mà.」"
2328 = "「Khả năng vẽ vời sẽ trở thành một lợi thế đúng không?\\nBởi vì em có thể tự tạo ra tài nguyên cho mình.」"
2330 = "「Chỉ có một điểm khác với thường ngày. Hachiroku đã bảo,\\n『Không được trễ hẹn đâu ạ』, và cho anh về sớm đấy.」"
2331 = "「Tôi muốn hỏi ý kiến Navi một chút.\\nVề trang phục khi đi cùng Hibiki đến nơi làm việc.」"
2334 = "「Có bánh kẹo ăn kèm không?」"
2337 = "「Báo của học viện, em cũng từng tham gia giúp đỡ rồi――\\nNếu là làm báo, em có tự tin, em nghĩ mình làm được.」"
2342 = "「Chào mừng em về nhà, Hibiki, và, anh về rồi đây.」"
2343 = "「Chào mừng anh về nhà, anh hai!」"
2345 = "「Tất cả mọi người, cùng nhau,\\nvà mỗi người, đều có thể tận hưởng niềm vui của chuyến du lịch bằng đường sắt.」"
2347 = "「Cảm thấy căng thẳng hẳn lên nhỉ.」"
2348 = "「Chỗ ở của Michi á?」"
2349 = "「Làm gì có chuyện đó!\\nAnh đã giúp đỡ em rấttt nhiều mà!」"
2350 = "「Đúng vậy. Chúng ta từng căm ghét nó, và cũng từng chẳng quan tâm đến nó.\\nCảm giác đó, với những người bị yêu cầu chuyển nhà vì việc khôi phục tuyến đường」"
2351 = "「Đúng rồi! Hoàn toàn chính xác!!\\nAnh hai quả nhiên có năng khiếu về mảng này đấy!」"
2352 = "「Đúng vậy, biển hiệu bằng gương.」"
2358 = "「Sự giới thiệu của Fukami sẽ là sức mạnh để mở rộng mạng lưới quan hệ đấy.\\nNếu thế vẫn chưa đủ―― thì, để anh đi chào hàng cho, nếu em thấy ổn.」"
2360 = "「Bất ngờ chỗ nào ạ?」"
2361 = "「Tại sao?」"
2366 = "「Rồi…… nếu thêm hình minh họa tàu hỏa tìm được trên mạng\\nvới từ khóa 『Tài nguyên miễn phí Đường sắt』 vào nữa thì!」"
2367 = "「Rồi, nhấn hết cỡ.」"
2372 = "「Mẹ và bố. Về chuyện của Michi――」"
2373 = "「Có bố, có mẹ, và những đứa trẻ.\\nChắc chắn là có cả ông, cả bà đi cùng nữa.」"
2377 = "「Bây giờ có rất nhiều phần mềm và tài nguyên tiện lợi mà.\\nVí dụ nhé―― Dòng chữ 『Đường sắt Ohitera』.」"
2380 = "「Bình thường thôi là được rồi ạ!?」"
2381 = "「Được chứ ạ? Bây giờ em\\ntoàn chụp ảnh bằng máy tính bảng thôi. Hơn nữa」"
2382 = "「Tất nhiên rồi ạ!」"
2383 = "「Tất nhiên rồi!! Nói một cách đơn giản nhất thì,\\nchỉ cần anh hai ở bên cạnh là em đã thấy yên tâm rồi.」"
2385 = "「Khắt khe thật. Điểm đó cũng rất giống con người đấy.」"
2386 = "「Hiếm thấy thật đấy!\\nAnh hai mà lại ngủ gật cơ.」"
2392 = "「Anh biết rồi.」"
2396 = "「Đúng thật……\\nCó vẻ dễ tiếp cận hơn những vấn đề khác.」"
2400 = "「Trước tiên là chuyện của Michiko.\\nRằng Michiko đang đợi bố mẹ trên chuyến tàu này.」"
2402 = "「Trước tiên, chúng ta nên thực hiện một bước đệm trước bản đồ minh họa nhỉ.\\nĐột nhiên nhảy vào nói chuyện công việc có thù lao thì chỉ tổ bị đuổi khéo thôi.」"
2404 = "「Chuyện vui…… thì anh cũng không chắc nữa, nhưng mà.」"
2415 = "「Hơn nữa, khả năng vẽ vời cần thiết\\ncũng không chỉ giới hạn ở 『Kỹ thuật hội họa cao siêu』 nữa.」"
2416 = "「Hơn nữa?」"
2418 = "「Đó là những việc mà anh hai vẫn luôn làm.\\nEm đã bắt chước theo―― và học được từ đó.」"
2419 = "「Em nghĩ càng có nhiều ý kiến càng tốt. Đường sắt Ohitera――\\nÀ không, không chỉ những người ở Ohitera đâu.」"
2421 = "「Công việc của em, lại được anh hai nhìn thấy――\\nTuy có hơi xấu hổ một chút, nhưng em vui gấp mấy lần luôn đó!」"
2428 = "「Bị kéo đi? ――っ!?」"
2431 = "「Đương nhiên, việc bồi thường thỏa đáng là điều kiện tối thiểu,\\nnhưng dù có như vậy đi chăng nữa……」"
2432 = "「Áo sơ mi thì ở bên này.」"
2434 = "「Nếu anh hai ăn mặc quá chải chuốt,\\nthì ngược lại, em sẽ bị nhìn nhận như một đứa trẻ con mất.」"
2437 = "「Thiết kế là phương tiện để đạt được điều đó sao?」"
2438 = "「Mà này, anh hai――\\nHoàn toàn, không cảm thấy gì sao?」"
2439 = "「Cảm ơn anh…… anh hai.\\nVậy thì, em xin nhận lòng tốt của anh ạ.」"
2440 = "「Nếu là vì anh thì anh rất biết ơn. Nhưng―― nếu chỉ để giúp đỡ,\\nthì chắc chắn còn rất nhiều cách khác mà đúng không?」"
2441 = "「Trên chuyến tàu do đứa trẻ này―― 8620 kéo.\\nChuyến tàu do anh trai, em và Hachiroku cùng nhau vận hành.」"
2447 = "「Đi thôi? Anh hai! Hãy chỉ cho em biết thêm thật nhiều\\nnhững điều tốt đẹp phản chiếu trong đôi mắt của anh hai nhé!」"
2450 = "「Đi thôi? Đến phòng anh hai. Phải xem trong tủ quần áo có gì\\nthì mới phối đồ được chứ!」"
2469 = "「Vì sao à…… Công việc thiết kế là……」"
2470 = "「Cái này―― trông rất được đấy chứ?\\nGương tạo cảm giác rộng rãi, và anh nghĩ nó làm tăng thêm cảm giác sạch sẽ.」"
2471 = "「Đó cũng là sự thật mà chúng ta đã nắm được.\\nVì vậy, chúng ta đã quyết định không còn cách nào khác ngoài việc giao phó cho các chuyên gia.」"
2472 = "「Cứ nhận đi. Bao nhiêu cũng được.」"
2473 = "「Đây là―― máy ảnh sao.」"
2474 = "「Bản phác thảo ý tưởng sao.\\nCủa tiệm giặt ủi lúc nãy nhỉ.」"
2475 = "「Về [ハチロクニイマル,3]8620. Anh――\\nĐây là lần đầu tiên hai anh em mình cùng nhau ngắm nó nhỉ.」"
2476 = "「Nếu làm thế, anh sẽ tự lừa dối chính mình.\\nVới một thân phận giả mạo, anh sẽ không thể thẳng thắn đối diện với Hibiki được.」"
2477 = "「Vậy sao…… Nếu ông ấy đánh giá anh là kẻ vô dụng,\\nthì đã chẳng có cái giao kèo bắt anh về làm ở tiệm rượu khi không ngăn chặn được việc mời gọi nhà máy rồi.」"
2478 = "「Ra vậy. Còn kết hợp với áo sơ mi các kiểu nữa chứ.」"
2479 = "「Vậy ạ.」"
2480 = "「Vậy sao, thế thì nhờ em nhé.」"
2481 = "「Vậy sao, trùng hợp thật.\\nAnh cũng định mặc sao cho hợp với Hibiki đấy.」"
2482 = "「Thế lại càng tiện. Chúng ta có thể thong thả ngắm nhìn.」"
2483 = "「Nếu cứ để thế này thì nó chỉ là thông tin văn bản thôi đúng không.」"
2484 = "「Nghe em nói vậy, anh cũng mới nhận ra điều đó sau khi lên Đế đô.\\nKhông chừng, những chuyện như vậy lại thường xuyên xảy ra cũng nên.」"
2485 = "「Thật sao ạ? Ufufu,\\nĐược anh khen, em vui lắm!」"
2486 = "「Khắc nghiệt đến thế sao.」"
2491 = "「Mà này, chiếc áo sơ mi này cũng là của OHITOYO sao?」"
2492 = "「Dạ…… dạ, để sau đi.\\nSau này khi nào đầy thẻ nhớ, em sẽ làm cho.」"
2493 = "「Vậy thì, hãy củng cố hình ảnh đó nào.\\nChúng ta hãy tự mình tìm ra những điểm cần truyền tải.」"
2494 = "「Nếu vậy thì là báo! Em nghĩ làm báo là hợp lý nhất. Một tờ báo miễn phí.\\nDù là báo giấy hay báo mạng, chúng ta sẽ phát miễn phí.」"
2496 = "「Ý kiến hay đấy. Sử dụng thật nhiều tranh vẽ của Hibiki.\\nMột trang báo thể hiện gu thẩm mỹ của Hibiki qua cả bố cục và logo.」"
2498 = "「Vậy thì, cùng làm thôi.」"
2501 = "「Nếu vậy thì, anh xin nhận mà không khách sáo nhé.\\nXin lỗi, em có thể dạy anh cách sử dụng được không?」"
2503 = "「Vì tất cả đều là vest ba mảnh mà.\\nChỉ cần thay đổi cách phối hợp, ấn tượng cũng sẽ khác đi khá nhiều.」"
2504 = "「Nếu vậy thì―― tấm bản đồ đó thì sao.\\nBản đồ minh họa thành phố Ohitera ấy. Chúng ta làm nó ở một phạm vi rộng hơn.」"
2505 = "「Vậy thì anh hai, đang đợi em thay đồ―― ưm,\\nAnh đã đợi em thay đồ xong sao?」"
2506 = "「Anh Soutetsu đã truyền đạt điều gì vậy?」"
2510 = "「Điều quan trọng không phải là trang phục của bản thân ngài Soutetsu,\\nmà là sự hài hòa với trang phục của Hibiki, chẳng phải vậy sao ạ.」"
2513 = "「Anh hai―― ưm―― Em nghĩ chắc chắn anh trai sẽ mặc vest,\\nnên em đã thử phối đồ cho hợp với anh.」"
2515 = "「Anh hai, đi chào hàng cho em á!?」"
2516 = "「Quả nhiên anh hai\\nhiểu được bản chất của thiết kế!!」"
2519 = "「Anh hai! Nhanh lên!!」"
2520 = "「Anh hai! Anh hai!」"
2521 = "「Anh hai, em về rồi đây! Chào mừng anh về nhà.」"
2523 = "「Anh hai?」"
2524 = "「Sông Kuma!」"
2526 = "「Ngài Soutetsu.」"
2527 = "「Ngài đang gặp khó khăn sao. Ngài Soutetsu.」"
2530 = "「Khó sao ạ? Anh hai mà mặc đồng phục học viện trà trộn vào,\\nthì hoàn toàn có thể qua mặt được mọi người với tư cách học sinh đấy?」"
2535 = "「8620 đã cho anh thấy một thế giới mới.\\nAnh muốn Hibiki hiểu được điều đó, và chắc chắn sẽ nhờ em vẽ lại nó.」"
2537 = "「Navi? Navi! A―― a―― aa!\\nLúc nãy, cô ấy nghe thấy―― đã nghe thấy sao!?」"
2539 = "「Áo sơ mi của OHITOYO cũng được bán ở các trung tâm thương mại trên Đế đô.\\nVì cũng muốn ủng hộ quê nhà nên anh cứ vô tình mua mãi thôi.」"
2644 = "Nếu Hachiroku không gánh vác tất cả những việc đó,\\nthì tôi chẳng thể nào về nhà vào giờ này được."
2646 = "Nhưng tôi có thể cảm nhận được điều đó một cách chân thực.\\nRằng Hibiki và tôi, đang cùng ôm ấp một hình ảnh giống nhau."
2652 = "Chưa đầy năm phút sau,\\nHibiki đã lạch cạch chạy quay lại."
2683 = "Giọng nói điềm tĩnh.\\nChỉ nghe thôi cũng khiến tôi cảm thấy được cứu rỗi phần nào."
2687 = "Khi lợi ích công cộng và cá nhân không thể song hành,\\nrốt cuộc chúng ta nên hành xử như thế nào…… Có lẽ đó là một câu hỏi không có đáp án chính xác."
2698 = "Rốt cuộc điều gì đã khiến tôi thay đổi đến nhường này.\\nRốt cuộc điều gì đã khiến Hibiki tình nguyện trở thành \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;."
2700 = "Vừa lật trang đầu tiên, tôi đã cảm thấy vô cùng hứng thú.\\n――Tôi nhận ra sức nặng của hai chữ \"thực tế\"."
2704 = "Giả sử Michiko chỉ là biểu hiện từ sâu thẳm tâm lý của tôi,\\nhay thậm chí em ấy thực sự là một linh hồn, một bóng ma đi chăng nữa――"
2714 = "Tôi hoàn toàn không biết mình phải làm gì và làm như thế nào.\\nNhưng nếu là với Hibiki, dù có phải dò dẫm, tôi nghĩ mình vẫn có thể học được nhiều điều."
2716 = "Có lẽ là do đang cầm máy ảnh trên tay chăng?\\nNgay cả khu phố quen thuộc này, tôi cũng cảm thấy có chút gì đó mới mẻ."
2718 = "Chắc là trong giọng nói của tôi có chút gì đó quá gắng sức chăng,\\nHibiki cất giọng có vẻ hơi hốt hoảng."
2741 = "Có thể hiểu và đồng cảm được với những điều quan trọng đối với Hibiki, dù chỉ một chút,\\ncũng khiến trái tim tôi trở nên ấm áp, nhẹ nhàng."
2743 = "A, \"đối diện\" chính là như thế này sao.\\nLà suy nghĩ xem đôi mắt của Hibiki đang nhìn thấy điều gì."
2747 = "Ánh mắt Hibiki nhìn tôi khiến lòng tôi dấy lên một sự xáo động khó tả――\\nNhưng trái tim xáo động ấy, cũng lại khiến vết thương lòng hé miệng."
2748 = "Khi có ý định đi du lịch,\\nchẳng ai lại mang theo bản đồ của toàn bộ khu vực Hinomoto cả."
2750 = "OHITOYO là loại áo sơ mi chất lượng cao được bán cả ở Đế đô\\n――Nghe tôi giải thích vậy, Hibiki tròn xoe mắt ngạc nhiên."
2752 = "Khi tìm hiểu về việc khôi phục tuyến đường, tôi cũng đã học được điều này."
2755 = "Tuyến Hisatsu ngày xưa, đoạn giữa Yatsushiro và Ohitera,\\nchạy dọc theo dòng sông Kuma."
2757 = "Vừa nói, em ấy vừa mở cuốn phác thảo vừa gập lại ra."
2759 = "Gót chân vừa định nhón lên lại đặt xuống sàn."
2761 = "Em ấy mở bản đồ trên màn hình,\\nkhoanh vùng khu vực giữa Ohitera và Yatsushiro――"
2762 = "Em ấy trả lời một cách lơ đãng.\\nBiết vậy nên tôi đợi tiếng bút chì dừng lại rồi mới quay lại phòng khách."
2767 = "Vừa là học sinh, vừa là nhà thiết kế.\\nHơn thế nữa, em ấy còn tình nguyện trở thành \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;."
2770 = "Em ấy ngọ nguậy các ngón tay phải,\\nrồi nắm chặt, siết thật chặt lại."
2773 = "Giọng điệu không hẳn là nói đùa.\\nVậy thì tôi cũng phải trả lời một cách nghiêm túc thôi."
2775 = "Nghe như một âm thanh thật phức tạp."
2776 = "Sự phấn khích đến kinh ngạc.\\nBàn tay đang nắm lấy tay tôi cũng ấm áp lạ thường."
2778 = "Nếu biết em ấy vui đến vậy,\\nthì tôi đã nhờ em ấy sớm hơn rồi."
2780 = "Em ấy mỉm cười rạng rỡ.\\nVẫn giữ nguyên nụ cười đó, em ấy đưa chiếc máy ảnh cho tôi và nói \"Đây ạ\"."
2781 = "Em ấy thốt lên một tiếng ngạc nhiên,\\nvà dần dần, dần dần đỏ bừng mặt."
2783 = "Cũng giống như những bức tranh Hibiki vẽ,\\nlà thế giới mà Hibiki đang nhìn thấy――"
2785 = "Nếu có thể thấu hiểu và truyền đạt được điều đó,\\nthì có lẽ nó sẽ trở thành một trong những chất xúc tác tạo nên một làn sóng mới."
2786 = "Nếu có thể khiến họ mang trong mình suy nghĩ đó,\\nthì chắc chắn sự phản đối việc giải tỏa đất sẽ giảm đi đáng kể."
2795 = "Thực tế thì, chỉ với chừng đó cũng đủ dùng rồi,\\nnên tôi hoàn toàn không có ý định mua thêm."
2798 = "Một yêu cầu kỳ quặc là 『Biển hiệu bằng gương』,\\nnhưng Hibiki đã khéo léo biến nó thành một phương án cực kỳ thực tế."
2799 = "Một tấm bản đồ không khoanh vùng đối tượng rõ ràng,\\nthì chẳng giúp ích được cho ai, và cũng chẳng ai thèm xem."
2810 = "Cứ suy nghĩ theo hướng đó,\\ntôi nhận ra thế giới này tràn ngập những sản phẩm thiết kế."
2817 = "Thình thịch, một nhịp đập mạnh mẽ.\\nTrái tim tôi đập mạnh đến nhức nhối."
2820 = "Tôi cảm thấy hơi xấu hổ vì có lẽ mình đã vội vàng về nhà quá,\\nnhưng đồng thời cũng cảm thấy nhẹ nhõm vì không có Hibiki ở nhà."
2822 = "Tôi do dự một thoáng xem có nên kể cho em ấy nghe không,\\nnhưng ngay lập tức nhận ra có do dự cũng chẳng ích gì."
2823 = "Vừa dứt lời, Hibiki liền ôm đầu."
2828 = "Tôi cùng Hibiki đi đến ga Suối nước nóng Ohitera.\\nTrời đã tối mịt."
2829 = "Hai chúng tôi cứ thế nói ra những gì mình nghĩ đến,\\nvà Hibiki lần lượt ghi chú lại rồi phân loại chúng."
2831 = "\"Anh cũng không phải đợi lâu lắm đâu.\"\\nTôi định nói vậy thì chợt nhận ra."
2833 = "Hết cách, tôi đành nhắm mắt lại. Chỉ vậy thôi cũng đủ thấy dễ chịu.\\nA, vậy ra tôi…… mệt mỏi hơn mình tưởng sao………"
2836 = "Từ câu nói đó, tôi có thể cảm nhận được."
2838 = "Nói là ai cũng làm được, nhưng chắc chắn không hề đơn giản như vậy."
2839 = "Tôi nhớ lại \\x%lヘッドマーク;#00ffc040;biểu trưng đầu tàu%l;#; 『Thử nghiệm lái tàu Hachiroku』\\nmà Hibiki đã thiết kế."
2844 = "Biến những cảm xúc hỗn loạn ấy thành lời nói một cách trực tiếp,\\nđể giảm bớt gánh nặng trong lòng."
2847 = "Tôi nắm lấy tay Hibiki và đứng dậy."
2848 = "Mở cửa lùa tủ âm tường ra, bên trong là một chiếc tủ ngăn kéo thấp.\\nÁo sơ mi được cất riêng biệt trong hai ngăn, một cho đầu hè và một cho thu đông."
2850 = "Những bức ảnh tôi chụp, rốt cuộc cũng sẽ\\nthể hiện thế giới mà tôi đang nhìn thấy sao."
2853 = "Tôi không phải bị trói buộc――\\nMà là đang được mong muốn, được cần đến sao."
2854 = "Tôi không thể phủ nhận.\\nBởi vì tôi cũng hiểu rõ đây chỉ là một giấc ngủ gật chốc lát."
2855 = "Những lời nói thốt ra từ tận đáy lòng,\\nđã khiến vô vàn biểu cảm của Hibiki đọng lại thành một nụ cười vô cùng dịu dàng."
2856 = "Những lời nói của tôi đã khơi gợi hình ảnh trong tâm trí Hibiki,\\nhay ngược lại, tôi cũng không rõ nữa."
2859 = "Tôi mở mắt,\\nvà nhận ra mình vừa nằm mơ."
2861 = "Cuốn phác thảo đã trở thành khởi nguồn cho mọi chuyện của chúng tôi,\\ntrang giấy trắng tinh―― vẫn chưa được vẽ lên bất cứ thứ gì."
2862 = "Để lại phía sau giọng nói đầy hạnh phúc, tôi đun nước.\\nTiếng bút chì sột soạt hòa quyện cùng tiếng bếp lò."
2864 = "Sống lưng tôi lạnh toát.\\nĐột nhiên cơ thể bị lay mạnh."
2865 = "Tôi hướng ống kính về phía khuôn mặt Hibiki và thử nhấn nhẹ một nửa."
2866 = "Vừa dứt lời,\\nvẻ mặt kiên quyết của Hibiki liền sụp đổ."
2867 = "Tôi ấn Hibiki đang định đứng dậy ngồi xuống, rồi tự mình đứng lên."
2871 = "Vì thế, tôi chụp.\\nTôi muốn lưu giữ lại những nét đặc trưng của Hibiki vào trong chiếc máy ảnh này."
2874 = "Vì thế, tôi viết.\\nĐể tiếp tục dệt nên lịch sử của chúng tôi từ nơi đây."
2876 = "Vì thế, tôi không thể giấu giếm điều gì.\\nNghĩ vậy, những lời nói chân thật cứ thế tuôn trào."
2878 = "Vì thế, tôi chọn những từ ngữ đơn giản."
2882 = "Quảng bá Hibiki. Gu thẩm mỹ của Hibiki, những thiết kế của Hibiki.\\n――Một khi đã bắt tay vào làm, nếu không liên kết với những thứ khác thì thật lãng phí."
2883 = "Bản tin Buồng lái 8620.\\nMột chuyến tàu du lịch hoàn toàn mới."
2889 = "Gánh nặng về tiền bạc, thời gian và công sức đi kèm với việc chuyển nhà,\\ngánh nặng về mặt tâm lý, gánh nặng do sự thay đổi môi trường sống――"
2890 = "Có vẻ như em ấy đã tổng hợp xong rồi."
2892 = "Và rồi, với cùng một đầu ngón tay đó,\\nem ấy khẽ chạm―― vào ngực mình."
2940 = "Lần này em ấy lấy máy tính bảng ra,\\nvà gõ dòng chữ đó lên màn hình."
2942 = "Hibiki gập cuốn phác thảo lại,\\ncầm tách trà lên và thở phào nhẹ nhõm."
2944 = "Như đang dò dẫm tìm từ ngữ, hoặc tìm kiếm cảm xúc của chính mình.\\nĐôi môi Hibiki mấp máy."
2946 = "Nếu là Hibiki thì em ấy cũng có rất nhiều người quen biết thông qua công việc."
2948 = "Em ấy hơi cúi đầu, gật nhẹ."
2950 = "Hibiki đã chuyển sang nói giọng phổ thông một cách vô cùng tự nhiên――\\nTôi cũng cảm nhận được lý do từ tận sâu trong cơ thể mình."
2953 = "Hibiki đặt máy tính bảng xuống bàn,\\nrồi lại cầm cuốn phác thảo lên―― À――"
2954 = "Hibiki vươn tay ra.\\nTôi nắm lấy, em ấy nở nụ cười rạng rỡ kéo tôi đi."
2957 = "Hibiki bé nhỏ núp sau cuốn phác thảo\\nđang lén lút nhìn tôi."
2959 = "\\x%lサイン・デザイン;#00ffc040;Vẽ biển hiệu%l;#;――\\nHibiki đang đối diện với công việc đó bằng thái độ của một chuyên gia."
2960 = "Chính nhờ gu thẩm mỹ của Hibiki,\\nmới có thể kết hợp các tài nguyên một cách hợp lý―― À, ra vậy."
2963 = "Bước chân nhẹ bẫng.\\nNhư để biến những lời nói đó thành hình dáng, Hibiki nhảy cẫng lên."
2965 = "Hibiki cười rạng rỡ.\\nNiềm vui của em ấy truyền đến tôi một cách vô cùng chân thật."
2967 = "Đôi mắt Hibiki mở to tròn xoe.\\nVì em ấy đang nhìn thẳng vào tôi nên tôi cũng gật đầu đáp lại."
2969 = "Hibiki tung bay vạt váy.\\nTôi có cảm giác hương vị thanh xuân đang nhẹ nhàng lan tỏa khắp phòng khách."
2971 = "Ngón tay của Hibiki vuốt ve chiếc áo sơ mi.\\nCảm giác đó, xuyên qua lớp áo, nhột nhạt trên làn da tôi."
2975 = "Một nụ cười đầy tự tin hiện lên trên khuôn mặt Hibiki.\\nTôi thực sự cảm thấy em ấy rất đẹp, rất tuyệt vời."
2976 = "Khuôn mặt Hibiki nhanh chóng đỏ bừng như con bạch tuộc luộc.\\nNhưng Navi không trả lời câu hỏi của Hibiki."
2977 = "Ngay trước mắt tôi là khuôn mặt của Hibiki――\\nSự rạng rỡ ấy khiến những tàn dư của giấc mơ nhanh chóng tan biến."
2979 = "Nụ cười rạng rỡ.\\nHibiki gật đầu vẻ mãn nguyện."
2981 = "Đột nhiên, Hibiki ỉu xìu hẳn đi."
2983 = "Hibiki nhìn thẳng vào tôi."
2984 = "Hibiki lúc nào cũng phô bày vô vàn biểu cảm khác nhau\\ntrước mặt tôi mà không hề che giấu."
2986 = "Hibiki mở ra."
2987 = "Ý nghĩa của câu 『muốn truyền tải điều gì』 mà Hibiki nói,\\nhình như tôi cũng đã hiểu ra đôi chút."
2989 = "Tôi lẩm bẩm.\\nVà Hibiki gật đầu thật mạnh."
2992 = "Một cách ngượng ngùng, chầm chậm.\\nHibiki ửng hồng đôi má, khẽ gật đầu."
2993 = "Ngay lập tức, Hibiki bắt đầu hành động.\\nEm ấy hốt hoảng nắm lấy tay tôi bằng bàn tay ấm áp của mình."
2996 = "Ngón tay của Hibiki lặng lẽ vươn ra.\\nLướt qua má tôi, chạm vào thân tàu 8620."
3005 = "Giống như niềm vui và nỗi buồn,\\nđang hòa quyện vào nhau một cách hỗn độn."
3012 = "Sau khi rửa tay súc miệng cẩn thận, chúng tôi ngồi nghỉ trong phòng khách.\\nNgay lập tức, một cảm giác thành tựu và khâm phục dâng trào trong tôi."
3016 = "Ngọn lửa để ngày mai tiếp tục lăn bánh,\\nđang lặng lẽ, âm ỉ cháy bên dưới lớp tro tàn."
3017 = "Để diễn đạt chính xác những gì muốn nói, tôi nghĩ đến công việc của Hibiki. Tiếp đó, tôi liên tưởng đến nhãn chai shochu của xưởng rượu Migita."
3018 = "Nếu là vì theo đuổi hạnh phúc lớn lao hơn, cho nhiều người hơn,\\nthì liệu chúng ta có được phép chà đạp lên hạnh phúc đang hiện hữu ở đó không――"
3019 = "Để tuyệt đối không thất bại, tôi chia nhỏ các chỉ thị\\nđến mức bản thân có thể hiểu được, suy nghĩ và lên kế hoạch cho quy trình tốt nhất――!"
3021 = "Sau đó, với vẻ hơi, chỉ một chút xíu thôi, bất mãn.\\nEm ấy ngước mắt lên nhìn tôi."
3025 = "Anh, Hibiki, và tất cả chúng ta.\\nCùng với những người mà chúng ta chưa từng gặp gỡ―― những người sẽ kết nối với chúng ta trong tương lai."
3028 = "Bởi vì, giấy dán cửa lùa mang đậm phong cách Nhật Bản truyền thống.\\nTôi mở ra, lấy những bộ vest đang treo bên trong cho em ấy xem."
3035 = "Hoặc không chỉ giới thiệu trực tiếp,\\nem ấy cũng có thể thiết kế poster để tuyển dụng ứng viên cho vị trí \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;."
3040 = "Phản ứng của Hibiki cứ như thể bây giờ mới sực nhớ ra.\\nVậy là trong đầu Hibiki vẫn chưa kết nối được hai việc đó với nhau."
3043 = "Thực sự chỉ là một chút thôi."
3045 = "Mắt tôi trĩu nặng.\\nDù chớp mắt mấy lần cũng chẳng khá hơn là bao."
3046 = "Đôi mắt sáng rực lên, Hibiki thoăn thoắt!\\nvẽ những đường nét lên cuốn phác thảo."
3049 = "Trao đổi vài câu, tôi cảm thấy nhẹ nhõm hẳn.\\nHibiki quả thực vẫn luôn như mọi khi."
3055 = "Và rồi ngay khoảnh khắc tiếp theo, bừng sáng!\\nHibiki nở một nụ cười rạng rỡ như hoa."
3059 = "Tiếng bước chân nhẹ nhàng.\\nVừa nghĩ vậy, Hibiki đã quay trở lại phòng khách."
3060 = "Giọng nói cực kỳ điềm tĩnh của Navi.\\nTiếng hét giật mình của tôi khiến cả Hibiki cũng giật mình theo."
3061 = "Nghe em ấy nói vậy, tôi mới nhìn kỹ lại,\\nvà cảm thấy chói lóa đến mức lóa cả mắt."
3062 = "Tôi nghe nói hôm nay chỉ là một ngày đến trường bình thường không có lịch trình gì đặc biệt.\\nVì vậy, tôi bắt đầu lo lắng không biết có chuyện gì xảy ra không."
3063 = "Giọng nói đầy vẻ thuyết phục."
3068 = "Đối diện với ai đó. Để thấu hiểu đối phương, hoặc hiểu rõ chính mình.\\nĐó là lời khuyên của Navi. Đương nhiên, tôi sẽ cố gắng hết sức, nhưng――"
3073 = "Bị hỏi tôi mới chợt nhận ra.\\nChính tôi cũng đâu có nắm rõ cơ chứ."
3076 = "Kinh nghiệm đã dạy tôi rằng bồi thường chỉ là biện pháp cầm máu tạm thời."
3097 = "Sau khi huấn luyện, chuyển sang trạng thái \\x%l保火;#00ffc040;giữ lửa%l;#;, rồi bảo dưỡng dọn dẹp."
3099 = "Vừa dứt lời, Michiko nhỏ bé liền nuốt ngược những lời định nói vào trong,\\ny như cách một người lớn thường làm."
3100 = "Chính vì là một kẻ không có hứng thú với đường sắt―― thậm chí từng căm ghét nó,\\nnên biết đâu anh lại có thể truyền tải được sức hấp dẫn của nó đến những người giống mình chăng."
3114 = "Chuyến tàu đang chở―― đang giam giữ Michiko này,\\nrốt cuộc đang chạy ở \"đâu\"."
3122 = "Nếu vậy thì đúng như Hibiki nói.\\nVì tôi luôn cho rằng thất bại là tự chuốc thêm tội lỗi."
3123 = "Lần này đổi thái độ, mặt em ấy đỏ bừng lên.\\nA, đúng là vẫn như mọi khi."
3124 = "Cuộc họp bàn về việc làm biển hiệu mới cho tiệm giặt ủi."
3127 = "Đó là…… quả thực là một điểm mù.\\nTôi chưa bao giờ suy nghĩ sâu xa về lý do của bản hợp đồng ràng buộc hai năm đó, nhưng――"
3128 = "Bàn tay này, không phải bàn tay nhỏ bé của Michiko.\\nNó lớn hơn, ấm áp hơn――"
3133 = "Lĩnh vực đường sắt, lĩnh vực công cộng. Những nơi mà sau này chúng ta sẽ mở rộng tuyến đường,\\nanh muốn kết nối với họ thông qua công việc."
3135 = "Sau khi cầm máu, liệu có thể hồi phục và tìm lại được hạnh phúc hay không――\\nBồi thường tuyệt đối không đảm bảo cho tương lai."
3136 = "Lỗ hổng khuyết thiếu vẫn còn rất lớn.\\nNhưng tôi có cảm giác mình đã tìm thấy một mảnh ghép để lấp đầy nó."
3137 = "Về việc đền bù giải tỏa đất để khôi phục tuyến đường, có lẽ tôi sẽ không tham gia vào công việc thực tế,\\nnhưng để đưa ra ý kiến, đương nhiên tôi cũng cần có những kiến thức cơ bản."
3138 = "Tuy gọi là đầu máy cỡ nhỏ và Hachiroku,\\nnhưng quả thực, nó rất lớn."
3141 = "Chỉ cần có chừng đó là sẽ không bao giờ gặp khó khăn gì,\\nđó là điều bố nuôi đã dạy tôi."
3149 = "（……Nhưng mà―― ừm.\\nLà do nội dung, hay do mình tập trung quá mức――）"
3158 = "（Lạch cạch lạch cạch）"
3160 = "（Cọc cạch, cọc cạch,\\nxình xịch, xình xịch――）"
3162 = "（Tách!）"
3163 = "（Hừm…… Quả nhiên việc đền bù giải tỏa đất ở có rất nhiều khó khăn.\\nĐúng hơn là…… nặng nề thật. Thậm chí có thể khiến người ta cảm thấy tội lỗi.）"
3165 = "（Tít tít tít）"
3167 = "（Lay mạnh!）"
3170 = "8620 đang được \\x%l保火;#00ffc040;giữ lửa%l;#;."
3175 = "Quả thực là đáp ngay tắp lự.\\nTrong lời nói của Navi không hề có lấy một chút do dự nào."
3177 = "OHITOYO là thương hiệu áo sơ mi\\ncủa một nhà sản xuất áo sơ mi tại thành phố Ohitera."

[selections]
