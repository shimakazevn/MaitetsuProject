2126 = "「Ra vậy, nếu anh cứ đợi em ở nhà ga,\\nthì chúng ta đã có nhiều thời gian hơn để đối diện với nhau rồi.」"
2129 = "「Nếu là chuyện đó thì, ngài Soutetsu.」"
2130 = "「Nếu được vậy thì, còn gì bằng―― (Khụ)」"
