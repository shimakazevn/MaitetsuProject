2255 = "「V-Vâng. Em làm được. Em sẽ làm. Ư……phù……a\\nQuy đầu……phần đầu, chim của anh hai」"
2258 = "「Ừm. Có lẽ đó cũng chính là phản ứng của những người\\nlần đầu tiên biết đến Đại hội thao do khu phố thương mại Ohimitera tổ chức đấy」"
2260 = "「Vâng. Sự phối hợp của Nagi và Fukami\\nlà tuyệt hảo luôn, nên cũng hơi đáng gờm đấy」"
2262 = "「Ừm. Cùng với Michiko, một hai lần gì đó,\\nanh cũng từng tham gia rồi」"
2264 = "「Vâng. Thu thập đủ từ ngữ ở tất cả các điểm,\\nthì sẽ ghép thành tên của món đồ cần mượn, luật viết thế này đây」"
2265 = "「Chắc vậy rồi」"
2266 = "「Fukyu!? Ưm――Kuuunnnn!」"
2267 = "「Vâng vâng」"
2268 = "「Vâng vâng!」"
2270 = "「Vâng! A, có ghi từ khóa này! \\nLà 『Na』. Với lại còn ghi là (Giữ lại chìa khóa) nữa」"
2271 = "「Ừm!」"
2272 = "「Vâng! Tới đi anh! Tới đi, tới đi, anh hai!」"
2273 = "「Vâng! Vâng! Vâng! Làm đi, làm đi anh,\\nxuất tinh vào trong em đi! Hãy bắn tinh trùng của anh hai vào đi!」"
2276 = "「Vâng!!」"
2277 = "「Ừm!!!」"
2278 = "「Ừm!?」"
2280 = "「Hả!? Đúng thật.\\nNhưng mà, phía bên kia đường――Ồ ồ ồ! Hibiki, là cái đó!」"
2282 = "「Vâng, chỉ cần lúc về đích hai người ở cùng nhau là được――\\nÁ! Không――không phải! Ưm――ư~~」"
2284 = "「Chà, theo đơn vị công ty, hoặc là hội đồng khu phố chẳng hạn\\n――Dù có đi chăng nữa, thì quy mô cũng nhỏ hơn rất rất nhiều」"
2286 = "「À, không. Ừm――\\nTóm lại là, về cơ bản thì, không có đâu」"
2288 = "「Vâng, đúng vậy! Nè, kiểu như thế này này」"
2290 = "「Ừ, ngay từ đầu anh đã định thế rồi」"
2291 = "「Vâng, để em xem――」"
2292 = "「Ừ, Hibiki――Anh cũng――Anh cũng vậy」"
2294 = "「Ừ, thật đấy. Già trẻ gái trai cùng chung sức,\\nđồng lòng, nỗ lực vì chiến thắng của đội nhà」"
2295 = "「Ừm?」"
2296 = "「Ufufufu, ánh mắt dâm đãng kìa」"
2297 = "「Phù! A! A――phù, a――a――\\nHà――a……phù――a――」"
2298 = "「Phù! Cảm ơn anh! Tiếp nước hoàn tất!」"
2300 = "「Hự!」"
2302 = "「Chà――Lá to thật đấy. Mà này,\\nsao em biết rõ ở đây có cây trầu bà vậy」"
2305 = "「Tại vì……tại vì――\\nƯ ư……Anh đừng có trêu em, nữa mà」"
2306 = "「Nơi làm việc của em mà lị!」"
2309 = "「Ở Đế đô có thể là vậy, nhưng ở Ohimitera\\nngười ta toàn trồng dưới đất thôi――Nhìn kìa!」"
2312 = "「Ký hiệu bản đồ. Anh hai, cho em mượn lưng một lát nhé?」"
2314 = "「Lấp đầy, em đi――tinh dịch――bằng anh hai, tất cả!\\nEm! Tất cả của em, bằng anh hai, đi!」"
2318 = "「Tăng thêm một phần á!?\\nVậy là ngay từ đầu anh hai cũng đã mong chờ hội thao rồi sao!?」"
2322 = "「Rất sít sao luôn, mọi người gần như về đích cùng một lúc……\\nRa vậy, không chỉ đơn thuần là thi thố năng lực thể chất」"
2324 = "「Đang tản ra theo những hướng khác nhau nhỉ.\\nChẳng lẽ đích đến của mỗi đội là khác nhau sao」"
2325 = "「Tuyệt quá!」"
2328 = "「Cả hai người họ đều khỏe và khéo léo hơn vẻ bề ngoài nhiều,\\nnhưng mà――」"
2329 = "「Ngay từ đầu, họ đã không được chế tạo ra với mục đích để chạy.\\nCả Paulette cũng vậy, vốn dĩ cô ấy không giỏi thể thao」"
2334 = "「Tuyệt quá! Sao anh biết vậy!?」"
2335 = "「Ok! Vậy em, mười phút――à không!\\nEm sẽ đi thay đồ cái vèo trong năm phút thôi!」"
2338 = "「Chỉ cần Hibiki thấy ổn, thì trong suốt cuộc thi,\\nanh muốn hai chúng ta hành động cùng nhau mà không rời nửa bước」"
2339 = "「Nếu là mông thì」"
2342 = "「Nếu phân công nhiệm vụ tốt,\\nthì chắc chắn cách đó sẽ có lợi hơn――À, không, có lẽ là có lợi hơn」"
2344 = "「Những việc mà em gái không làm được,\\nthì người làm anh giúp đỡ là chuyện đương nhiên」"
2346 = "「Không rành một chút nào luôn. Nhưng mà,\\nlời giải thích lúc nãy dễ hiểu lắm」"
2348 = "「Đã quyết định rồi đó! Nghe này! \\nChuyến du lịch sang trọng, dành cho hai người! Tới Suối nước nóng Chikoku!」"
2356 = "「Bắn ra đi, anh hai! Bắn thật nhiều, vào đi!\\nTinh dịch, tử cung! Hãy cho em, vào tử cung đi」"
2358 = "「Đúng không! Nên là, em, đi mượn đây!!」"
2359 = "「Đúng không. Chứ không thì chị ấy đã chẳng nhận mấy việc này đâu.\\nNăm nào cũng làm cán sự tổ chức hội thao cơ mà」"
2360 = "「Vì thế nên, có vẻ sẽ có nhiều đối thủ cạnh tranh lắm đây~」"
2361 = "「Đúng không? Em bắt chước anh hai đấy」"
2362 = "「Đúng rồi! Tụi nó bảo là 『Đỉnh thật! Không thể tin được!』」"
2363 = "「Đúng thật, Reina sẽ để ý đến chuyện đó――Không, không phải là để ý,\\nmà có lẽ con bé sẽ đưa ra lựa chọn đó một cách rất tự nhiên」"
2364 = "「Âm đạo――âm, đạo, ở phía, bụng――\\nƯm――phù! A――Ngón tay, của anh hai, ngón tay」"
2367 = "「Nhỉ」"
2368 = "「Dù có đi chăng nữa, nghĩa là――\\nCó những nơi hoàn toàn không có luôn sao!?」"
2371 = "「『Ha』 á, chỉ có một chữ cái thì làm sao mà hiểu được chứ!」"
2377 = "「Lại còn có nhiều gian hàng, tạo cơ hội cho những mối giao lưu mới.\\nThực sự, anh còn mong nó được nhân rộng ra toàn quốc nữa kìa」"
2380 = "「Chà, hình dáng hoàn toàn khác luôn.\\nĐúng là Hibiki có khác, tinh mắt thật đấy」"
2384 = "「Rất nhiều người dân trong thị trấn là đồng minh của Hibiki. Những nụ cười mà Hibiki đã vẽ,\\ngiờ đây mọi người đang thực sự nở nụ cười ấy」"
2385 = "「Về vị trí và khoảng cách, anh chỉ có thể nghĩ đến Kumagin thôi.\\nThậm chí còn vẽ cả ký hiệu bản đồ nữa mà――」"
2386 = "「Thấy chưa, có này!」"
2393 = "「Sao thế!?」"
2394 = "「Bằng cách nào?」"
2395 = "「Dù nói là tìm――\\nNhưng b1, b8, g1, g8――có nghĩa là gì cơ chứ?」"
2396 = "「Sao rồi」"
2399 = "「Sâu――hơn nữa sao?」"
2401 = "「Chắc chắn rồi. Ở đây làm gì có ngựa thần (Shinme) chứ――\\nTìm thôi, Hibiki」"
2403 = "「Em……em――Thế này――ưm――hà――\\nBức bối――quá, rồi……nó cứ, râm ran, ngứa ngáy」"
2405 = "「Hi, a――Một, mình, không chịu, đâu! Bắn tinh,\\nmuốn, bắn vào, bụng, của em――vào tử cung」"
2406 = "「D-Dẫn dắt! Em! Chim của anh hai,\\nem sẽ, đàng hoàng, dẫn dắt nó vào âm đạo」"
2409 = "「S-Sự giúp đỡ của em?」"
2411 = "「Em đã luôn muốn.\\nAnh hai, chỉ một mình anh hai――nhìn em bằng ánh mắt đó」"
2416 = "「Ở cùng nhau là――chỉ trong lúc thi đấu thôi sao?」"
2417 = "「Năng lực thể chất trung bình của cặp đôi chúng ta có lẽ là cao nhất.\\nNếu chỉ đơn thuần là thi chạy, thì chắc chắn chúng ta đã áp đảo rồi」"
2418 = "「Đi thôi! Hibiki!!」"
2419 = "「Quả thực, là một cuộc thi được thiết kế rất tốt」"
2421 = "「Anh mới chỉ chạm vào thôi mà?\\nSao em lại phát ra giọng điệu gợi tình thế」"
2422 = "「Em hỏi được rồi!」"
2424 = "「Anh uống đủ rồi.\\nHibiki, nếu được thì em cứ uống hết đi」"
2426 = "「Anh hưng phấn quá nên cơ thể không cử động linh hoạt được.\\nVì thế anh muốn Hibiki, hãy dẫn dắt anh」"
2428 = "「Anh có để ý. Anh sợ ngực của Hibiki của anh,\\nsẽ vô tình bị hớ hênh mà không hay biết」"
2429 = "「Ơ kìa」"
2431 = "「Được ở cùng với anh hai cơ mà!\\nLàm sao mà em thấy phiền cho được!!」"
2433 = "「Chuyện này thì chẳng cần hỏi cũng biết nhưng mà」"
2434 = "「Anh đâu có định trêu em đâu」"
2437 = "「Của anh sao」"
2439 = "「Đầu em! Nó cứ chớp, chớp, chớp!\\nƯm! Quy đầu, vào tử cung! Hôn nhau, rồi」"
2441 = "「Để chắc chắn thì anh hỏi lại,\\ncặp đôi có thể hành động riêng lẻ được đúng không?」"
2442 = "「Anh thấy đó là một tập quán tuyệt vời mà?\\nĐại hội thao do khu phố thương mại Ohimitera tổ chức ấy」"
2444 = "「Đây không phải là chuyện kích cỡ.\\nĐó là ngực của một cô gái đáng yêu và xinh đẹp như Hibiki cơ mà」"
2448 = "「Ngón tay, ở đây cơ mà?」"
2451 = "「Về mặt vị trí thì đúng là khu vực đó.\\nNhưng mà, ở đền thờ lại là ☆, sao?」"
2453 = "「Với luật chơi này, việc đi đường tắt sẽ trở thành một canh bạc.\\nBởi vì bắt buộc phải đi qua tất cả các điểm kiểm tra cho đến phút cuối」"
2457 = "「Vận động……thả lỏng」"
2459 = "「Nếu Hibiki cử động đáng yêu đến thế này thì」"
2468 = "「Hibiki――anh vào nhé?」"
2469 = "「Hibiki」"
2470 = "「Hibi, ki!」"
2471 = "「Bình tĩnh nào, Hibiki. Trước tiên là quy đầu.\\nHãy đưa quy đầu vào cửa mình thật chuẩn xác, dù chỉ nông thôi cũng được」"
2474 = "「Sao thế Hibiki? Em bị đau răng à?」"
2476 = "「Anh cũng rất yêu Hibiki. Thế nên, anh muốn đút vào,\\nvà thỏa thích xuất tinh trong âm đạo của em」"
2478 = "「Nói cho anh nghe đi, Hibiki.\\nChỗ bị căng cứng nhất của anh, là ở đâu?」"
2480 = "「Hibiki――thử mở rộng hai chân ra xem nào?」"
2482 = "「Sao thế? Hibiki?」"
2486 = "「Thì cờ tướng của Nhật cũng tương tự như vậy mà,\\nvới lại còn có ký hiệu \"or\" nữa. Thế? Đó là quân cờ nào」"
2491 = "「Đúng vậy mà?\\nTừ lúc còn nhỏ xíu, đã luôn luôn. Mãi mảiii là vậy」"
2492 = "「Thật á? Không phải――E hèm. Vậy sao?」"
2494 = "「Anh nhớ không lầm thì là ở Aso nhỉ.\\nKhá gần nên cũng dễ đi――Quả thực rất tuyệt」"
2495 = "「Về mức độ náo nhiệt à?」"
2497 = "「Kumagin à」"
2500 = "「Căng cứng nhất là――ưm, chỗ này, của anh trai」"
2503 = "「Từ khóa cuối cùng là……『O』!」"
2505 = "「Hơi xa nhỉ. Gợi ý là――hửm?\\n『〒=123→132』」"
2508 = "「Quả nhiên là……hành động riêng lẻ thì, tốt hơn ạ?」"
2510 = "「Quả nhiên là nó ạ? Nhưng mà――」"
2511 = "「Quả nhiên! Ký hiệu bản đồ của ngân hàng,\\nkhông phải là ký hiệu ￥!!」"
2513 = "「Mỗi đội đều phát huy thế mạnh của mình để đạt kết quả tốt.\\nNhưng, lý do chúng ta giành được chức vô địch là――」"
2515 = "「Dùng miệng, mút chùn chụt, chẳng hạn……\\nHoặc dùng tay, sục sục, cũng được――」"
2522 = "「K-Không có chuyện đó đâu! K-Không đến mức hớ hênh――ư\\n……đâu……mà――hauu」"
2523 = "「Không có nhỉ, chẳng có chiếc hộp nào, hay chỗ nào có thể đút chìa khóa vào cả\\n――A」"
2524 = "「Đúng vậy」"
2525 = "「Đúng mà! Cây trầu bà! Lối này!!」"
2526 = "「Chuẩn luôn! Em kể chuyện này cho mấy đứa bạn ở thị trấn Nishiki nghe,\\ntụi nó ngạc nhiên lắm luôn」"
2527 = "「Ừm. Chúng ta đã mất khá nhiều thời gian để giải đố mà.\\nKhoản đó thì chắc chắn kém hơn đội Kisaki và Paulette rồi……」"
2528 = "「Đúng vậy. Hãy từ từ xoa bóp cơ thể nào.\\nChạy nhiều thế, chắc hẳn cũng có những chỗ bị căng cứng rồi」"
2536 = "「Để làm được điều đó, anh cần sự giúp đỡ của Hibiki」"
2543 = "「Rồi sau đó……sau đó thì sao?」"
2544 = "「Sau đó, tất nhiên là, a, âm đạo, hay là――\\nHoặc là……mông――anh dùng cũng được」"
2545 = "「Vậy, bản đồ là――A! Đây là――Tòa thị chính!」"
2546 = "「Thế? Môn thi đấu mới là môn gì vậy」"
2548 = "「Mặc dù vậy, khoảng cách thắng thua thực sự rất sít sao」"
2550 = "「Giờ không phải lúc nói chuyện đó đâu! \\nĐèn tín hiệu, sắp chuyển màu rồi kìa!!」"
2552 = "「Lý do là?」"
2557 = "「Độ ăn ý……Tiền bối Kisaki và chị Paulette,\\ndạo gần đây, có vẻ như nói chuyện khá hợp nhau nhỉ?」"
2558 = "「Việc đây là môn thi đấu theo cặp,\\ncó vẻ cũng sẽ là yếu tố quyết định thắng thua đấy」"
2562 = "「Dễ thấy thật đấy!!」"
2564 = "「Đúng là, gắn kết thật đấy nhỉ.\\nCó rất nhiều nhà tài trợ, nên phần thưởng năm nào cũng hoành tráng cả!」"
2566 = "「Chị Mayami thích hội thao thật đấy nhỉ」"
2577 = "「Đúng là vậy. Nếu họ ghép cặp thì sẽ là một mối đe dọa lớn đấy――\\nNhưng mà, chẳng phải Paulette sẽ ghép cặp với Reina sao?」"
2581 = "「Bản thân năng lực thể chất của Kisaki cũng cao mà.\\nChà, dù không biết độ ăn ý của họ thế nào thôi」"
2585 = "「Bác Kuboya ơi! Bác có nhà không ạ?」"
2589 = "「Cũng có thể nói vậy. Anh không ghét việc vận động cơ thể hết mình,\\nvới lại, đây cũng là một sự kiện mang tính lịch sử, gắn kết toàn bộ Ohimitera lại với nhau mà」"
2592 = "「Chà, việc xử lý bưu phẩm diễn ra ở trong nhà……\\nCòn ngoài trời mà có ký hiệu này thì, quả nhiên là――A, thùng thư sao」"
2593 = "「Dù sao thì, cứ mở bản đồ ra xem đã」"
2597 = "「Tính cả thời gian chuẩn bị các thứ, thì vẫn còn dư dả một tiếng đồng hồ.\\nNếu muốn bắt đầu, thì bây giờ là lúc thích hợp đấy」"
2604 = "「Cúp ngực……À, giống như miếng đệm ấy hả?」"
2606 = "「Cái nào cũng được! Lấy cái nào lấy được ấy」"
2614 = "「Làm bảng hiệu, vẽ bản đồ du lịch, và giờ là đảm đương việc hành chính.\\nNhững mối liên kết mà Hibiki đã dày công vun đắp, chắc chắn sẽ giúp ích cho chúng ta」"
2615 = "「Cờ vua à. Anh không rành lắm――\\nCòn Hibiki thì sao?」"
2617 = "「Nếu sắp bị nhìn thấy, thì ai mà chẳng chú ý cơ chứ.\\nThật may là điều đó đã không xảy ra」"
2623 = "「Cảm ơn anh hai! Ực, ực, ực――\\nĐây!」"
2630 = "「Cuộc thi chạy mượn đồ định hướng\\nmở ngoặc cặp đôi đóng ngoặc」"
2633 = "「Lúc chạy em không mặc đâu?\\nBộ đồ này, phần ngực có sẵn cúp ngực mà」"
2635 = "「Được tham gia cùng Hibiki, làm sao anh có thể thấy phiền được chứ」"
2653 = "「C-Chuyện đó!」"
2654 = "「Ký hiệu ☆ này! Đền Akai Aso!!」"
2655 = "「Phần thưởng của môn thi đấu này đã được quyết định chưa?」"
2656 = "「Đúng là vậy nhưng――A!」"
2657 = "「À, ừm, ý anh là!? \\nHibiki, cái, áo, áo lót của em đâu rồi」"
2658 = "「Gì chứ! Nhắc đến ngựa ở đền thờ thì」"
2659 = "「Cứ thế này, nếu Hibiki được xoa bóp thư giãn――\\nThì anh, cũng sẽ tự nhiên được xoa bóp theo thôi」"
2660 = "「Nếu vậy, Fukami sẽ không phải chạy nhiều nữa.\\nMột chiến thuật khá là hay đấy」"
2661 = "「Nếu vậy thì……Nếu có tham gia,\\nNagi và Fukami, chắc chắn sẽ lập thành một cặp rồi」"
2662 = "「May mà lần này cũng khá gần」"
2663 = "「Lần này, có ba điểm kiểm tra được chỉ định.\\nGiả sử, chữ cái đầu tiên là 『O』. Chữ cái thứ hai là 『Ka』 đi」"
2664 = "「Đại hội thao, do khu phố thương mại tổ chức ấy」"
2665 = "「Chỗ này, là chỗ nào anh không biết đâu」"
2666 = "「Đó là, tại vì, nhờ có anh hai mà.\\nAnh hai đã cho em, dũng khí để cho mọi người xem tranh……phải, không?」"
2669 = "「Vận động mạnh liên tục thế này, gánh nặng cho cơ thể lớn lắm đấy」"
2678 = "「Nên là――em――muốn, rồi――\\nCủa anh hai――Của anh hai――vào trong, âm đạo」"
2679 = "「Nè? Anh hai.\\nChân em, giờ run lẩy bẩy rồi」"
2680 = "「――Nè? Anh hai」"
2681 = "「Dạ? Anh hai?」"
2682 = "「Dạ, anh biết môn chạy định hướng chứ?\\nCái môn mà dựa vào gợi ý để tìm các điểm đánh dấu trên bản đồ ấy」"
2684 = "「Vậy thì, tiếp theo nào」"
2686 = "「Vậy thì, quyết định thế nhé」"
2688 = "「Vậy thì, nhé? Nếu anh không phiền,\\nem muốn anh cùng em――tham gia một môn thi đấu mới」"
2690 = "「Vậy thì hôm nay, chúng ta sẽ ở bên nhau suốt cả ngày.\\nNiềm vui của hội thao lại tăng thêm một phần rồi nhỉ」"
2691 = "「Chỗ đó, là chỗ nào cơ?」"
2694 = "「Vậy thì! Anh hai, năm nay anh cũng tham gia chứ?」"
2696 = "「Vậy thì, nó như thế nào?\\nHội thao khu phố thương mại ở quê hương của anh hai, hay ở Đế đô ấy」"
2697 = "「Vậy thì, anh trai?\\nKhi nào chúng ta sẽ bắt đầu đây?」"
2700 = "「Thùng thư (Po-su-to) có ba chữ cái. Tức là, =123」"
2701 = "「Mã bưu điện 123――」"
2703 = "「Là của, anh sao.\\nNếu vậy thì anh phải――càng trân trọng hơn nữa mới được」"
2705 = "「Hình ổ khóa sao. Mặt sau là――」"
2707 = "「Từ ngữ? À――hừm……Hoàn thành một điểm,\\nthì sẽ nhận được bản đồ của điểm tiếp theo, cùng với một từ ngữ đúng không」"
2709 = "「A――Của anh hai――ưm――lún sâu, vào――\\nrồi――phù――a……hự――phù」"
2711 = "「A――anh――Thế, này……ưm――Phù――\\nPhù a――a――ưm hự!」"
2713 = "「Anh, hai――ưm――kuuu~~n――phù, a\\nKhởi……động, thì――cũng tốt, thôi――tốt, thôi nhưng」"
2714 = "「Chim――anh hai, anh không muốn xoa bóp sao?\\nEm, sẽ cố gắng hết sức――để giúp anh――mà」"
2717 = "「Anh hai……ưm――chụt――chùn chụt――chụt」"
2719 = "「Anh hai……nè? Ngực của em――\\nAnh đã lo lắng……đã để ý đến nó sao?」"
2720 = "「Anh hai……anh hai――」"
2721 = "「Anh hai, anh hai」"
2723 = "「Em muốn anh cứ làm theo ý thích.\\nCả cơ thể và trái tim này, tất cả đều là của anh hai mà」"
2724 = "「Anh hai!」"
2725 = "「Anh hai! Xin lỗi đã để anh đợi! Em mượn được dép rơm rồi này\\n――Kya!?」"
2728 = "「Anh hai! Chờ em ở đây một chút!!」"
2729 = "「Anh hai! Nè! Nữa đi! Nữa đi anh」"
2731 = "「Nếu vậy thì, anh hai! \\nCứ đứng ngẩn ra đó là thua mất đấy!」"
2735 = "「Anh hai! Cái này, là chạy định hướng,\\nvà còn là, cuộc thi mượn đồ nữa!!」"
2736 = "「Anh hai! Cái này!!」"
2737 = "「Anh hai! Anh hai! Anh hai! Anh hai!」"
2738 = "「Anh hai, cho em xem lại bản đồ đi」"
2742 = "「Anh hai, chọn cái nào đây!?」"
2743 = "「Anh hai, tìm thôi chứ?」"
2744 = "「Anh……hai. Anh hai?\\nƯm~~…………Hé mở!」"
2745 = "「Anh hai?」"
2746 = "「Năm nay. Chị cả cũng. Đứng ra tổ chức」"
2749 = "「Từ ngày xưa rồi cơ.\\nChị cả rất thích nhìn thấy dáng vẻ cố gắng hết mình của mọi người mà」"
2751 = "「Chim――phù――không được――bị thúc lên,\\nthế này――bụng, bị ép, vào――hà, a」"
2752 = "「Chim! Tinh dịch, em bé, tất cả của anh hai!\\nNhững gì anh hai cho――em muốn, tất cả!」"
2753 = "「Trước tiên là, vận động thả lỏng đã」"
2756 = "「Lên đỉnh rồi sao?」"
2759 = "「!」"
2760 = "「!!!」"
2761 = "「!!?」"
2764 = "「~~~~~!! Kua! Aaaaa! Ưm,\\nChỗ đó, chỗ chỉ dành, cho chim――thích lắm」"
2767 = "「~~~~~~~~~~~~!!!!」"
2768 = "〒=123→132"
2915 = "Nghĩ rằng đó là nơi dành riêng cho tôi,\\ntôi lại càng muốn dùng quy đầu để đánh dấu nó một cách thật dai dẳng, thật dai dẳng."
2916 = "Một giọt nước rơi bộp xuống quy đầu.\\nNgay cả kích thích đó thôi cũng suýt chút nữa khiến tôi xuất tinh."
2922 = "Một cơn gió vụt qua――thì ra là Nagi.\\nBỏ lại Fukami phía sau, con bé lao đi như một mũi tên."
2923 = "Khoái cảm nửa vời này, có lẽ ngược lại càng khiến em ấy thêm bức bối.\\nHông của Hibiki bắt đầu uốn éo."
2926 = "Tuy nhiên, tôi không khát đến thế,\\nvà Hibiki cũng chừa lại khá nhiều cho tôi."
2933 = "Không biết là do vừa mới vận động xong, hay là do sự hưng phấn của việc giành chức vô địch,\\nmà có vẻ như Hibiki đang trở nên cực kỳ nhạy cảm."
2944 = "Những nếp gấp âm đạo vừa mềm mại lại vừa cứng cáp, tất cả như có ý thức riêng,\\nbám chặt lấy, uốn lượn, và mơn trớn như vô số ngón tay đang xoa bóp."
2946 = "Nhưng tôi không hề vội vã.\\nGiữ nguyên tư thế áp sát, tôi liên tục lặp lại động tác gập người rồi lại duỗi ra."
2949 = "Thế nhưng, tay chân tôi lại đánh đập, đá văng đi những lời than vãn yếu ớt của lý trí.\\nNghĩ rằng vẫn còn có thể vắt thêm được nữa, tôi lại nâng hông Hibiki lên――"
2958 = "Chỉ riêng việc được chạy cùng em ấy thôi cũng đủ khiến tôi thấy sảng khoái.\\nCảm giác như hơi thở, những giọt mồ hôi, đang hòa quyện cùng với Hibiki."
2959 = "Chỉ bấy nhiêu thôi, cũng đã là quá đủ."
2978 = "Sự phối hợp, phân công nhiệm vụ.\\nTùy thuộc vào những điều đó mà có thể tiết kiệm được kha khá thời gian đấy.」"
2979 = "Người duy nhất mà Hachiroku có thể ghép cặp cùng,\\ntôi chỉ có thể nghĩ đến Reina mà thôi."
2982 = "Trong lúc đó, những người tham gia khác,\\nđã lần lượt lấy phong bì và mở ra――!!?"
2983 = "Hơn nữa, ở đền Akai Aso,\\nlàm gì có tầng hầm thứ tám hay tầng trên mặt đất thứ tám chứ."
2988 = "Tôi vô ý không nhận ra,\\nnhưng hội thao lại có thêm một niềm vui lớn nữa rồi."
2989 = "Việc đi tắm lúc nãy chẳng còn ý nghĩa gì nữa.\\nCả tôi và Hibiki, giờ còn ướt sũng hơn cả khoảnh khắc vừa chạy xong cuộc đua."
3001 = "Dõi theo sự nỗ lực, và sự trưởng thành,\\nra là vậy, chị Mayami đơn thuần chỉ là \"thích\" điều đó thôi sao."
3002 = "Ra là vậy, nếu là người để \"mượn trí tuệ\",\\nthì không ai thích hợp hơn chủ nhân của ngôi đền này, cha xứ Akai."
3008 = "Dù sao thì, tôi cũng không thể cử động nhanh được.\\nHibiki hôm nay, đang tấn công tôi mạnh bạo hơn mọi khi."
3009 = "Nhưng có lẽ do mệt mỏi, hoặc do khoái cảm quá mạnh mẽ,\\nmà nửa thân dưới của em ấy run rẩy lẩy bẩy."
3010 = "Một tấm bản đồ cực kỳ phác thảo được vẽ trên cuốn sổ,\\nvà được khoanh vùng bằng những đường kẻ ba màu."
3011 = "Em ấy không ngần ngại thả chiếc hông đang run rẩy xuống một mạch,\\nthẳng tắp đến tận gốc dương vật của tôi."
3012 = "Trên tấm biển xoay của tiệm cắt tóc,\\ncó một chiếc hộp in chữ \"￥\" nằm chỏng chơ ở đó."
3024 = "Từ khóe môi đang áp chặt vào nhau, nước dãi rỏ xuống.\\nDù đang rỏ xuống, nhưng khoang miệng tôi cũng đã ngập tràn nước bọt của Hibiki."
3025 = "A, hỏng rồi.\\nTôi vô tình nhắc đến chuyện quê nhà mà không hề suy nghĩ――"
3030 = "Cũng chính vì thế,\\nnhững ai có nguyện vọng sẽ được sắp xếp học bù vào Chủ nhật và nghỉ bù."
3032 = "Tôi đứng dậy. Đồng thời Hibiki cũng đứng lên.\\nViệc hành động của chúng tôi vô tình trùng khớp với nhau khiến tôi cảm thấy vui vui."
3034 = "Mỗi khi tôi thốt ra một lời,\\nđôi vai ngày càng rũ xuống của Hibiki lại cho tôi biết."
3036 = "Cùng lúc với tiếng súng báo hiệu xuất phát,\\nnhững phong bì được xếp ngay ngắn trên bàn――"
3039 = "Sân nhà của Hibiki. Nơi có biết bao nhiêu đồng minh của em ấy,\\ntrong thị trấn của chúng tôi――tại Ohimitera."
3040 = "Chạy xong rồi――Vừa nghĩ vậy, toàn thân tôi liền rã rời."
3045 = "Từ điểm \"Xuất phát\" có vẽ một con đường phác thảo sơ sài.\\nTại \"Điểm kiểm tra thứ nhất\", có ký hiệu ￥."
3049 = "Nói đoạn, tiếng bước chân nhẹ nhàng vang lên từ cầu thang.\\nMà, tôi cũng phải đi thay đồ thôi."
3050 = "Em ấy lại uống ừng ực. Trông thật sự rất ngon miệng.\\nTôi bất giác ngẩn ngơ nhìn vùng cổ trắng ngần ấy trong giây lát."
3053 = "Hơi thở, ngọt ngào.\\nMột hơi thở làm tan chảy thứ gì đó trong tôi."
3054 = "Khao khát thêm những kích thích trực tiếp từ dương vật cương cứng mang lại,\\nem ấy quằn quại như đang làm nũng, như đang van nài."
3056 = "Hibiki hệt như một chú cún con,\\nliếm láp khắp khuôn mặt tôi."
3058 = "Luôn dõi theo, nhưng phải đến phút chót của phút chót,\\nchị ấy mới tự mình dang tay cứu giúp."
3060 = "Em ấy lao thẳng về phía điện thờ."
3062 = "Không giấu nổi niềm vui sướng――\\nEm ấy che miệng cười tủm tủm với vẻ mặt như thế."
3064 = "Dù đang quyến rũ tôi một cách táo bạo đến vậy,\\nmà em ấy vẫn ngại ngùng vì những chuyện cỏn con này."
3066 = "Một giọng nói đầy vẻ bứt rứt.\\nNhưng tôi vẫn lặp lại những chuyển động đơn điệu ấy."
3068 = "Lún sâu vào. Mông, phần thịt mông.\\nCơ bắp co lại do dùng sức, tóm lấy và siết chặt lấy tôi."
3070 = "Thịt mông cũng đồng thời siết lại,\\nsuýt chút nữa thì tôi đã phụt tinh ra rồi."
3072 = "Đột nhiên lại chuyển sang nói giọng chuẩn."
3074 = "Cơ thể đang áp sát vào nhau khẽ cựa quậy.\\nChỉ bấy nhiêu thôi, khoái cảm đã xuyên thấu lên tận não."
3077 = "Nếu Hibiki ngồi thẳng lưng lại――không,\\nchỉ cần em ấy ngồi thẳng lại, thì vùng ngực sẽ được che chắn khá kín đáo."
3097 = "Nhắc đến ký hiệu 〒 ở Tòa thị chính,\\nthì quả nhiên đây là thứ khiến người ta chú ý đầu tiên."
3109 = "Xét về vị trí và phương hướng,\\nthì gần như chắc chắn đó là Kumagin (Ngân hàng Kumamoto)."
3110 = "Từ cửa hàng đường sắt đến Kumagin chỉ khoảng vài trăm mét.\\nChúng tôi chạy một mạch không nghỉ, thậm chí còn chưa kịp đổ mồ hôi."
3115 = "Một khoái cảm mãnh liệt nhưng chưa đủ để lên đỉnh,\\nđược tích tụ, dồn nén――tiếp tục thiêu đốt cả tôi và Hibiki."
3121 = "Thử kiểm tra lại luật lệ xem sao――\\nQuả nhiên, việc cặp đôi hành động riêng lẻ là được phép."
3123 = "Vì thế, tôi từ từ,\\ntừ từ dẫn dắt Hibiki."
3124 = "Sở dĩ vùng ngực trông có vẻ hớ hênh như vậy, là do vị trí tương đối giữa việc tôi đang đứng,\\ncòn Hibiki thì ngồi xổm trên giường và rướn người tới trước."
3127 = "Tôi cũng vậy.\\nChính vì thế, tôi sẽ trêu chọc, sẽ thiêu đốt cả tôi và Hibiki."
3139 = "Chạy. Chạy.\\nMái tóc đuôi ngựa của Hibiki nhảy múa đầy năng lượng."
3140 = "Bên cạnh lối ra vào, là một thùng thư màu đỏ."
3141 = "Cứ thế này, hai đứa cùng đi tắm vòi sen thôi."
3142 = "Chúng tôi gọi tên nhau.\\nNgay lập tức, mọi thứ hòa quyện vào nhau."
3143 = "Chúng tôi tìm kiếm những tấm Ema đang được treo――và rồi!"
3144 = "Trao đổi nước bọt thỏa thích xong,\\nlần này đến lượt Hibiki từ từ xâm nhập vào khoang miệng tôi."
3145 = "Rõ ràng là chúng tôi đã ở bên nhau nhiều đến vậy,\\nnhưng trong ánh mắt ngập tràn tự tin ấy, vẫn pha lẫn một chút bất an."
3146 = "Chìa khóa――vừa vặn mở được ngay."
3147 = "Khi hai cái đầu chụm lại với nhau,\\nmùi hương của Hibiki lại làm mũi tôi ngưa ngứa."
3148 = "Cửa hàng đường sắt đã hiện ra trong tầm mắt.\\nDải băng đích cũng đã được giăng sẵn."
3149 = "Chúng tôi băng qua đường, dùng chiếc chìa khóa được phát để mở chiếc hộp nhỏ.\\nBên trong là một chiếc chìa khóa mới và một tấm bản đồ."
3153 = "Khi trao nhau nụ hôn, mùi hương càng trở nên nồng đậm hơn."
3154 = "Tôi ấn lưng Hibiki xuống, cho đến khi chạm vào chân."
3156 = "Để cho chắc chắn――tôi thử kiểm tra chìa khóa,\\nnhưng kích thước hoàn toàn không khớp."
3158 = "Mở bản đồ ra kiểm tra――"
3159 = "Tôi không thể kiểm soát được bất cứ thứ gì nữa.\\nTừ hông trở xuống đã tê liệt vì bão hòa nhục cảm."
3160 = "Không còn, ra được nữa.\\nTôi đã xuất tinh đến cạn kiệt tận ruột gan."
3164 = "Tôi có thể tin chắc điều đó.\\nVà tôi cảm thấy tự hào."
3166 = "Tôi muốn đút vào. Tôi muốn xuất tinh.\\nTôi dùng lời nói để che đậy đi dục vọng đang cháy bỏng ấy."
3168 = "Không thể kìm nén được nữa, tôi dùng lưỡi tách đôi môi Hibiki ra.\\nNước bọt của Hibiki, thiêu đốt tôi từ tận cổ họng."
3169 = "Tôi muốn chạm vào ngay lập tức. Rất muốn chạm vào nhưng――"
3172 = "Chính vì thế, tôi lại muốn thêm một lần nữa."
3174 = "Tôi muốn giải phóng tất cả.\\nKhoái cảm đã vượt quá giới hạn từ lâu."
3175 = "Tôi muốn làm Hibiki thả lỏng, ướt nhẹp,\\nrồi lấp đầy nơi sâu thẳm nhất của em ấy bằng tinh dịch của mình."
3177 = "Tôi có cảm giác mật độ không khí đột ngột tăng lên.\\nNhịp tim, nhịp thở, ngày càng trở nên nông và nhanh hơn."
3179 = "Tôi đỡ lấy Hibiki đang gục xuống,\\nvà cứ thế, hai chúng tôi ngã xuống giường."
3182 = "Tôi ôm lấy Hibiki rồi nằm vật ra đất.\\nThịch thịch thịch, nhịp tim của Hibiki. Nhịp tim của tôi."
3186 = "Tôi kéo tay Hibiki, chạy, chạy."
3187 = "Mở khóa kéo, tôi chỉ lấy phần dương vật đang cương cứng ra khỏi quần.\\nCứ thế, chen vào và đặt nó nằm gọn trong khe mông của Hibiki."
3188 = "Tôi kéo quần lót em ấy xuống, rồi khẽ vuốt ve một cái.\\nChỉ bấy nhiêu thôi cũng đủ khiến cơ thể Hibiki giật nảy lên."
3189 = "Vén áo lên, phơi bày cơ thể của Hibiki.\\nNgực trần chạm ngực trần, mồ hôi hòa quyện cùng mồ hôi."
3191 = "Tôi đút một ngón tay vào.\\nTừ từ nhào nặn, rồi lại đâm rút."
3193 = "Một cảm giác không phải là của bầu ngực.\\nTuy mềm mại nhưng lại có sự khác biệt. Có vẻ như nó cũng có độ dày nhất định."
3195 = "Khi tôi nới lỏng lực, tư thế của Hibiki lại trở về như cũ.\\nÁp lực từ mông, cũng như lực kẹp cũng nhẹ nhàng yếu đi."
3196 = "Dù tôi hoàn toàn chưa chạm vào nơi đó, nhưng ái dịch\\nđã chảy dọc theo đùi và tràn cả ra ga giường."
3199 = "Dạo gần đây tôi có cảm giác khách khứa đến đông một cách lạ thường――\\nChà chà, tôi hoàn toàn quên khuấy đi mất."
3201 = "Tắm rửa và thay đồ xong xuôi.\\nTôi bước lên cầu thang hướng về phòng Hibiki."
3203 = "Vì thế, tôi cảm thấy chúng tôi đã \"gần gũi hơn\".\\nTôi và Hibiki, giờ đây có thể chia sẻ cả những quá khứ mà đối phương chưa từng biết."
3205 = "Vòng tay đang ôm lấy tôi của Hibiki siết chặt lại."
3206 = "Tôi ấn vào Hibiki.\\nÉp cơ thể em ấy từ từ gập về phía trước."
3209 = "Tăng tốc.\\nCơ thể tôi tự nhiên bị kích động bởi giọng nói của Hibiki."
3211 = "Bắp chân tôi cũng hơi nhức mỏi một chút.\\nNhưng không đến mức không thể đỡ nổi một mình Hibiki."
3212 = "Nhịp tim đập quá nhanh, khiến tôi có chút khó thở.\\nHơi thở từ mũi Hibiki ngày càng mạnh, làm tôi thấy ngưa ngứa."
3214 = "Sự chịu đựng của tôi, đã đến giới hạn rồi.\\nVì thế, tôi dồn thêm lực vào những ngón tay đang đỡ lấy mông em ấy."
3216 = "Lý trí bảo rằng em ấy đã lên đỉnh rồi, phải cho em ấy nghỉ ngơi,\\nnhưng nó đã bị đánh bay bởi sự bốc đồng."
3219 = "Vẫn giữ chặt dương vật của tôi bằng vô số ngón tay ấy,\\nvừa siết chặt trêu đùa, vừa rung lên bần bật."
3220 = "Dù vậy, ánh mắt của tôi vẫn bị dẫn dắt.\\nĐến đôi mắt, đến bờ môi của Hibiki. Và rồi đến ngực……đến đũng quần em ấy."
3223 = "Tâm lý phụ nữ là thế này sao――\\nHay là do Hibiki, là một sinh vật đặc biệt đáng yêu nhỉ……"
3225 = "Điểm nhạy cảm nằm sâu bên trong Hibiki,\\nnơi mà ngón tay tuyệt đối không thể chạm tới được."
3226 = "Chiếc giường, cọt kẹt.\\nTôi vòng ra phía sau lưng Hibiki."
3228 = "Cân nhắc nhịp độ của Hibiki,\\ntôi chạy với tốc độ vừa đủ để tay em ấy không bị kéo căng quá mức."
3231 = "Vô số từ ngữ xẹt qua đầu, nhưng tôi gạt phắt đi.\\nThay vì đoán mò, cứ dùng chính đạo vẫn hơn."
3233 = "Tôi hơi hoảng hốt chộp lấy một chiếc phong bì, rồi mở nó ra.\\nKhoảnh khắc mở bản đồ ra――tôi và Hibiki đưa mắt nhìn nhau."
3234 = "Cùng với Hibiki, chạy, chạy.\\nBước chạy của Hibiki, dù đến đâu cũng thật nhẹ nhàng."
3237 = "Vì thế, chúng tôi sẽ cắt đứt nó.\\nSánh bước bên Hibiki, cùng với Hibiki."
3238 = "Vì thế, không thể nào. Cả tôi và Hibiki đều không thể dừng lại được nữa.\\nChúng tôi đã rơi xuống khỏi vách đá mất rồi."
3240 = "Tôi cùng Hibiki đi một vòng quanh đó để kiểm tra."
3242 = "Một nụ hôn, nhẹ nhàng.\\nLên môi, lên mũi. Và rồi lên trán."
3243 = "Tôi nhẹ nhàng xoa xoa, vỗ về chiếc cúp ngực\\nđã bảo vệ vòng một của Hibiki."
3247 = "Chưa kịp hỏi thì em ấy đã trả lời trúng phóc.\\nQuả thật đúng là chuyện chẳng cần hỏi cũng biết."
3248 = "Tôi cởi phăng quần áo trong một nhịp thở.\\nVác Hibiki lên vai, hai người, mặt đối mặt."
3251 = "Vì thế, rất nhanh. Thở rất mệt. Đôi chân dần trở nên nặng trĩu.\\nTôi chưa từng chạy nhanh và lâu đến thế này bao giờ."
3252 = "Vì thế, tôi nâng Hibiki lên.\\nNâng hông em ấy lên đến mức tưởng chừng như sắp tuột ra ngoài"
3255 = "Gấp lại xong, Hibiki khựng người lại,\\nrồi phát ra một tiếng rên rỉ đầy khổ sở."
3275 = "Nghe nói nguồn gốc của cái tên này là do nước ở đó quá tuyệt,\\nkhiến người ta quên cả thời gian."
3277 = "Vừa lau mồ hôi, tôi vừa uống."
3372 = "Khuôn mặt Hibiki bừng sáng.\\nQuả nhiên là vậy. Nếu thế thì, chẳng còn lựa chọn nào khác cả."
3376 = "Vẫn giữ nguyên nụ hôn, em ấy trực tiếp thì thầm những lời yêu thương.\\nVà rồi, Hibiki dứt nụ hôn."
3377 = "Nói rồi, Hibiki nở một nụ cười gượng gạo."
3379 = "Hôn. Hôn. Hôn."
3380 = "Hibiki đang rất vui vẻ, cứ thế lăn lộn trên giường mà chưa thèm thay đồ.\\nEm ấy giơ chiếc phong bì có chữ 『Vô địch』 lên soi dưới ánh sáng."
3383 = "Hibiki cũng đang cố gắng hết sức chạy theo.\\nEm ấy đang chạy theo tôi."
3386 = "Ra là vậy, Hibiki đã hiểu Đại hội thao do khu phố thương mại tổ chức\\nnhư một 『Phong tục phi thành thị』 sao."
3389 = "Hibiki ngừng lăn lộn.\\nEm ấy tò mò nhìn tôi."
3390 = "Hibiki run rẩy.\\nÂm đạo cũng run rẩy."
3394 = "Hibiki lại mở tờ giấy ra."
3396 = "Tờ giấy ghi luật thi đấu đang mở rộng bỗng bị gấp lại."
3398 = "Tiếng nuốt nước bọt nghe lớn một cách kỳ lạ.\\nHông Hibiki khẽ cựa quậy, xác nhận hình dáng của tôi."
3400 = "Vừa trả lời, đôi chân của Hibiki vẫn nhịp nhàng chạy bước nhỏ."
3402 = "Hibiki với khuôn mặt đỏ bừng đang lắc đầu quầy quậy."
3403 = "Quê hương của tôi.\\nHibiki nói về điều đó một cách thật tự nhiên."
3405 = "Nhanh chóng lấy ra từ chiếc ba lô tôi đang đeo trên lưng,\\nHibiki bắt đầu thao tác trên máy tính bảng."
3406 = "Hibiki lấy ra một tờ giấy được gấp gọn gàng\\ntừ giữa cuốn sổ phác thảo, rồi mở nó ra."
3408 = "Cái nghiêng đầu nhè nhẹ.\\nĐôi mắt nũng nịu."
3409 = "Đầu lưỡi Hibiki khẽ thò ra, liếm ướt đôi môi."
3410 = "Hibiki cuống cuồng ngồi thẳng dậy trên giường."
3412 = "Cố giấu đi sự ngượng ngùng nhưng lại tự hủy.\\nDáng vẻ cúi gằm mặt đỏ bừng của Hibiki, quả thực rất đáng yêu."
3414 = "Hibiki móc ngón tay vào cổ áo, kéo nhẹ xuống một chút.\\nKhe ngực mỏng manh và độ phồng của bầu ngực liền phơi bày ra toàn bộ――!"
3416 = "Hibiki mở rộng hai chân.\\nSự trắng ngần của bắp đùi khiến tôi cảm thấy chói lóa."
3417 = "Hibiki nhấc hông lên."
3419 = "Hibiki nắm lấy tay tôi,\\náp chặt vào ngực em ấy qua lớp áo."
3421 = "Hibiki rướn người tới trước――!!?"
3423 = "Hibiki nhặt một viên sỏi nhỏ lên,\\nvà vẽ một hình vuông trên mặt đất."
3425 = "Hibiki thư giãn, ngồi cạnh tôi,\\ndùng ngón tay vẽ chữ \"No\" (の) lên đùi tôi."
3428 = "Em ấy không làm gì cả. Hibiki chẳng làm gì cả.\\nChỉ đơn thuần là ngồi bệt ở đó mà thôi."
3430 = "Quả nhiên là đôi mắt của Hibiki đã tìm ra.\\nMột chiếc hộp trắng, được đặt khéo léo để không vướng vào lá cây trầu bà."
3433 = "Hibiki chạy đi không chút do dự.\\nHướng thẳng về phía nhà ga――"
3435 = "Hibiki mếu máo phản đối."
3436 = "Đôi mắt không ngừng tìm kiếm những nét đẹp để vẽ ấy,\\nchắc hẳn đã thu vào tầm nhìn nhiều hơn, rộng hơn tôi gấp bội phần."
3438 = "Hibiki gật đầu.\\nMạnh đến mức làm chiếc giường rung lên."
3440 = "Hibiki vẽ hình quân cờ vua.\\nÀ――Hình như tôi từng thấy rồi, quân cờ hình con ngựa――"
3444 = "Mông Hibiki không ngừng uốn éo từng nhịp nhỏ.\\nMột khoái cảm nhẹ nhàng, ngọt ngào, từ từ lắng đọng xuống hông tôi."
3445 = "Cặp mông của Hibiki đang mời gọi tôi.\\nVẽ thành vòng tròn chữ \"No\", ôm ấp và làm nũng dương vật đang cương cứng của tôi."
3448 = "Tính cách là vậy.\\nHibiki vẫn cứ chần chừ."
3449 = "Đôi mắt ướt át.\\nRõ ràng là Hibiki đang phát tình."
3452 = "Bừng! Nụ cười của Hibiki tỏa sáng rạng rỡ."
3453 = "Giọng nói của Hibiki, nhiệt độ cơ thể của em ấy, làm ham muốn tình dục của tôi thêm phần sắc bén.\\nXuất tinh trong âm đạo, giờ đây tôi chỉ có thể nghĩ đến bốn chữ đó."
3454 = "Bầu ngực của Hibiki bị ép phẳng, dính chặt vào tôi.\\nNhịp tim và nhịp tim hòa quyện làm một."
3457 = "Hông của Hibiki trượt đi.\\nEm ấy dùng mông liên tục ấn mạnh vào đũng quần tôi."
3458 = "Đôi chân của Hibiki đang run rẩy lập cập.\\nDù vậy, em ấy vẫn cố gắng phối hợp với chuyển động của tôi."
3461 = "Đúng hơn là, âm đạo của Hibiki rất hẹp.\\nCảm giác bám sát và siết chặt đến mức khiến tôi nghĩ như vậy."
3462 = "Nhiệt độ trong giọng nói của Hibiki đã thay đổi.\\nTôi trêu chọc quá đà rồi sao――em ấy sắp khóc đến nơi rồi."
3466 = "Mỗi khi Hibiki run lên bần bật, dương vật tôi cũng bị kích thích mạnh mẽ.\\nPhần thịt mông vừa ép sát vừa kẹp chặt lấy như muốn vắt kiệt tinh dịch."
3467 = "Hibiki ưỡn cong người.\\nÂm đạo co rút lại một cách dữ dội."
3468 = "Hương thơm của Hibiki, thoang thoảng mùi mồ hôi.\\nChỉ ngửi thôi cũng đủ khiến nhịp tim tôi đập nhanh hơn."
3470 = "Câu trả lời của tôi, có lẽ đã truyền đạt rõ thông điệp \"anh không hiểu gì cả\"."
3471 = "Hibiki có vẻ hơi đuối sức.\\nTôi liền mua nước ở máy bán hàng tự động, rồi ném cho Hibiki."
3474 = "Của Hibiki――cái này gọi là quần đùi thể thao nhỉ?\\nMàu sắc ở đũng quần đã thay đổi từ lúc nào không hay."
3475 = "Hibiki bật cười."
3477 = "Nhận ra điều đó, em ấy ngượng ngùng cúi gằm mặt xuống――\\nMùi hương từ mái tóc Hibiki thoảng qua, làm sống mũi tôi ngưa ngứa."
3478 = "Nhìn vào kết quả tìm kiếm hình ảnh mà Hibiki đang hào hứng chỉ cho tôi xem――"
3480 = "Ướt nhẹp.\\nNgay cả bên trong khoang miệng, Hibiki cũng đã tan chảy hoàn toàn."
3482 = "Một khuôn mặt có chút bối rối."
3483 = "Nụ cười của Hibiki ngày càng rạng rỡ.\\nQuả nhiên là chị em――Tôi cảm nhận được điều đó theo nhiều nghĩa."
3484 = "Khuôn mặt vui sướng.\\nHai má em ấy bừng lên màu đỏ ửng."
3485 = "Là mùi hương. Mùi hương ngọt ngào của Hibiki.\\nHòa quyện cùng mồ hôi, một mùi hương mang tính bản năng……của một người phụ nữ."
3498 = "Paulette và Kisaki. Reina và Hachiroku.\\nVà cả những cặp đôi tham gia khác nữa――"
3503 = "Định xoa dịu sự căng thẳng của Hibiki, tôi chỉ khẽ nắn bóp bắp tay em ấy,\\nmà em ấy lại phát ra âm thanh như thể đang bị kích thích vào cơ quan sinh dục vậy."
3504 = "Chính vì thế, tôi đã chuẩn bị kỹ lưỡng đến tận lúc này.\\nTại đây, tôi tuyệt đối không được vội vàng."
3507 = "Cổ họng em ấy khẽ chuyển động đánh \"ực\" một tiếng,\\nrồi phả ra một hơi thở ẩm ướt."
3509 = "Nhưng――dù đã đi loanh quanh tìm kiếm, chúng tôi vẫn không thấy thứ gì giống như vậy."
3513 = "Lúc này, tôi chẳng thể nghe thấy gì khác――\\nngoài những âm thanh ấy."
3518 = "Dù sao thì, nó còn lôi kéo được cả các trường học lân cận tham gia cơ mà.\\nVì do khu phố thương mại tổ chức, nên nó diễn ra vào ngày thường."
3522 = "Nhìn dáng vẻ ngây thơ ấy, trong tôi trào dâng một niềm vui và sự xúc động sâu sắc."
3525 = "Chị Mayami là cán sự tổ chức nên ngay từ đầu đã không tham gia thi đấu.\\nMột khi tôi đã ghép cặp với Hibiki thì……"
3528 = "Biểu tượng hình đôi dép Setta. Tiệm Kuboya.\\nTiệm giày dép mà Hibiki đã thiết kế bảng hiệu cho."
3544 = "Mỗi lần như vậy, âm đạo của Hibiki lại siết chặt.\\nUốn lượn, nhu động, kẹp chặt lấy như đang liều mạng vắt kiệt tinh dịch của tôi."
3545 = "Một cảm giác sần sùi.\\nĐồng thời Hibiki khẽ rùng mình, thở hắt ra."
3554 = "Lực siết của âm đạo không hề suy giảm một chút nào."
3556 = "Âm đạo co thắt lại.\\nNhư muốn vắt kiệt tinh dịch, mời gọi kéo tuột tôi vào tận nơi sâu nhất."
3558 = "Bị vắt kiệt.\\nĐến mức khiến tôi không kìm được tiếng rên rỉ từ trong cổ họng."
3560 = "Lực siết của âm đạo,\\ngiờ đây đã pha lẫn những cơn run rẩy như co giật."
3562 = "Dù bị siết chặt đến phát đau,\\nnhưng hông tôi vẫn cứ chuyển động, đòi hỏi nhiều hơn, nhiều hơn nữa."
3566 = "Nói vậy thì, đây cũng là nơi làm việc của tôi.\\nTôi lại một lần nữa thầm thán phục Hibiki."
3567 = "Trong luật có hướng dẫn rằng,\\nbản đồ được đặt ở ngoài trời, tại những nơi dễ nhìn thấy."
3579 = "Chính vì là khoảnh khắc đã mong chờ từ lâu nên tôi không hề vội vã.\\nTôi chỉ đưa phần đỉnh quy đầu xâm nhập vào cửa mình vài centimet."
3583 = "Làm tư thế ăn mừng nhỏ xíu.\\nHibiki đang ngồi quỳ, liền xích người lại gần tôi."
3596 = "Rằng Hibiki đang giằng xé điều gì,\\nvà tại sao em ấy lại phân vân không biết có nên giấu đi luật chơi hay không."
3597 = "Thế này thì, không kìm được mất――Tôi cố gắng ổn định lại nhịp thở, nhịp điệu.\\nNhưng ngay cả những chuyển động để làm điều đó, cũng biến thành dốc toàn lực."
3598 = "Nếu vậy, dù cho âm đạo của Hibiki vẫn còn cứng nhắc và non nớt――"
3599 = "Lần này,\\nphải rửa sạch mồ hôi đàng hoàng mới được."
3600 = "Hachiroku và Reina thì không hề bị tiêu hao thể lực với mức độ này,\\nNagi và Fukami thì khỏi phải bàn về độ ăn ý."
3605 = "Suối nước nóng Chikoku.\\nMột địa điểm suối nước nóng mà ngay cả tôi cũng biết."
3606 = "Và――từ khóa đầu tiên\\n『Ha』"
3607 = "Một cảm giác vừa dễ chịu lại vừa ngượng ngùng.\\nĐể đáp lại, tôi xoa xoa, vỗ về đầu Hibiki."
3608 = "Không ngờ lại ngọt ngào đến thế――\\nNgọt ngào theo nhiều nghĩa……"
3622 = "Tinh dịch sền sệt tuôn ra không dứt.\\nTrở thành những khối đặc quánh bám chặt vào thành tử cung."
3625 = "Lông mũi, vòng hoa, máu mũi, câu chuyện, ngắm hoa――"
3628 = "Chỉ cần chạm nhẹ, cửa mình liền tự động hút chặt lấy.\\nNó đã ướt đẫm và trơn trượt."
3693 = "（Nhưng――chính vì vậy, hãy giành chiến thắng nào, Hibiki）"
3694 = "（Trượt! Phập——Ngoáy——Phụt!）"
3695 = "（Cọ xát——Cọ xát——）"
3698 = "（Ra vậy. Không cần phải cất công đi đường vòng,\\ntừ lúc làm bảng hiệu đến giờ, thị trấn Ohimitera luôn――）"
3700 = "（Nhưng mà……ra vậy, nếu chạy thì――）"
3702 = "（Trơn tuột——Phập）"
3703 = "（Phù）"
3704 = "（A――）"
3705 = "（Hự——Phụt）"
3706 = "（Ngoáy! Cọ xát! Trượt dài! Thúc!）"
3707 = "（Nhóp nhép!）"
3708 = "（Phập——Nhóp nhép!）"
3709 = "（Chạm……chụt）"
3710 = "（Ngoáy!）"
3712 = "（Phụt! Phụt! Phụt! Phụt!）"
3714 = "（Phụt!!!!! Phụt!）"
3715 = "（Ép xuống——Nới lỏng——）"
3716 = "（Ép xuống）"
3718 = "（Búng nhẹ）"
3719 = "（Cựa quậy）"
3722 = "（Ôm chặt）"
3723 = "（Kéo khóa）"
3725 = "（Nắn bóp）"
3726 = "（Đâm mạnh——trượt——）"
3727 = "（Cọ xát!）"
3728 = "（Vuốt ve）"
3729 = "（Siết chặt!）"
3733 = "（Đâm——mạnh!!）"
3734 = "（Trơn tuột!）"
3735 = "（Xuyên thấu! Thúc mạnh!!）"
3736 = "（Phập! Thúc mạnh!）"
3737 = "（Dùng sức）"
3738 = "（Đâm——Nhóp——Nhép）"
3740 = "（Đổ sập!）"
3741 = "（Cọ——xát——）"
3744 = "（Thế này――thế này cũng……sướng, thật đấy）"
3745 = "（Thúc——Thúc mạnh）"
3746 = "（Thúc!）"

