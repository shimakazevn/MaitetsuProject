1259 = "「Đầu tiên, anh muốn em xem bọn anh làm tình để làm mẫu.\\nNếu được, trong lúc đó hãy tự chuẩn bị sẵn sàng đi.」"
1261 = "「Không――vẫn chưa――đâu. Vẫn chưa――đâu, anh, trai.」"
1262 = "「Không phải tư cách em gái, mà là một người phụ nữ.\\nLà người tình một đêm――một đối tác ngoại tình chơi xong rồi bỏ của một kẻ đã có vợ.」"
1265 = "「Không…… được! A――ư――anh, ra mất!」"
1267 = "「Để không để lại chút hối tiếc nào. Ngay lúc này đây――\\nAnh sẽ rót tất cả những gì của mình vào Hibiki, vào em.」"
1271 = "「Nhưng, mà.」"
1272 = "「Nhưng anh đã chọn Fukami, chọn Nagi làm vợ rồi.\\nVòng tay của anh, ngoài Nagi và Fukami ra không thể ôm thêm bất cứ ai nữa.」"
1275 = "「Ngủ, thức dậy――rửa mặt. Sau đó, em.\\nSẽ trở lại làm cô em gái đáng yêu của anh hai――sẽ trở lại được mà!」"
1277 = "「Đừng ngắt lời, hãy nghe anh nói. Anh coi Hibiki\\nlà một người rất quan trọng. Hãy tin điều đó――và lắng nghe anh.」"
