1551 = "「Từ lâu rồi! Chuyện đó!\\nEm đã luôn, luôn muốn làm vậy!!!」"
1553 = "「Không phải là người thay thế Nagi. Mà là Hibiki――là em――\\ncô em gái nuôi quan trọng của anh――Anh, chỉ đêm nay thôi――」"
1555 = "「Anh cũng, rất thích Hibiki.」"
1558 = "「Phân công công việc nhé? Em làm việc em giỏi.\\nCòn chị Hibiki thì làm việc chị giỏi.」"
1560 = "「Em là đồng phạm mà? Anh Soutetsu.」"
1562 = "「Anh đã cướp đi trinh tiết của em. Anh đã biến em thành đàn bà.」"
1564 = "「Vui quá! Vui quá! Vui quá! Vui quá!\\nEm! Đang――làm tình――với anh hai!」"
1566 = "「Anh muốn Hibiki luôn cười. Lúc đau khổ thì hãy khóc.\\nAnh muốn trải qua những ngày tháng vui vẻ với tư cách là anh em, cùng với một Hibiki sống đúng với bản thân mình.」"
1567 = "「Anh muốn ôm Hibiki.\\nMuốn ôm em và giải tỏa hết mọi dục vọng đang kìm nén.」"
1569 = "「Anh biết. Vì thế. Nên mới làm.」"
