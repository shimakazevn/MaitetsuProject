1576 = "「Em cũng, có cùng――cảm giác, với anh hai.」"
1578 = "「Đã nói. Là em đã yêu cầu. Cho nên――cho nên――\\nEm sẽ ngửi, sẽ nhìn――không chỉ vậy đâu.」"
1580 = "「Anh sẽ cử động mạnh hơn một chút nhé.」"
1581 = "「Chuyện là…… nhé? Anh hai. Hôm nay em làm ở buổi tiệc.\\nLàm thay cho Nagi-chan. Em đã đưa ra điều kiện.」"
1583 = "「Em! Em đã――đủ――rất……\\nướt rồi――nên em nghĩ, em đã chuẩn bị xong rồi.」"
1585 = "「Có lẽ Nagi là người khỏe nhất, nên đã một mình gánh hết bệnh tật,\\nvà ngăn chặn dịch bệnh bùng phát đấy.」"
1588 = "「Thì là――như thế này đây ạ.」"
1589 = "「Nên thà cứ làm thế này có khi lại tốt hơn――\\nEm và bé Nagi đã nghĩ vậy. Bọn em đã vắt óc suy nghĩ.」"
1591 = "「Cho nên. Em! Chỉ đêm nay thôi, thay cho bé Nagi cũng được.」"
1592 = "「Do đó, Hibiki.」"
1594 = "「Vì thế, nếu mối tình đầu của Hibiki. Nếu việc tiếp tục khao khát anh――\\nlại ép buộc Hibiki phải đeo một chiếc mặt nạ.」"
1596 = "「Anh xin em. Hibiki――\\nĐừng ngửi, đừng nhìn nữa.」"
1598 = "「Người lái đò thì phải biết dùng ngón chân bám chặt đáy thuyền mà.\\nCỡ này thì nhằm nhò gì đâu? Thật đấy.」"
1624 = "「Hibi, ki――」"
1625 = "「Hibiki thì――」"
1627 = "「Cổ tử cung――của Hibiki, cũng vậy――cứ như đang――\\nbám chặt lấy――quy đầu của anh――liên tục――hôn, say đắm」"
1628 = "「Hibiki」"
1630 = "「Thuốc tránh thai――chị Hibiki đang uống thuốc viên liều thấp ạ.\\nEm cũng được chị Kisaki hỏi han tình hình. Em biết chuyện này.」"
1632 = "「Chị Hibiki tắm xong thì đến lượt chúng ta nhé?\\nTắm xong rồi đi ngủ thôi.」"
1634 = "「Biết chắc chắn sẽ thành ra thế này. Biết rõ là vậy.\\nThế mà chị Hibiki vẫn bảo, 'Nếu đến sáng thì chị sẽ nhận'.」"
1635 = "「Chị Hibiki. Đã nói thế đấy ạ. Thay cho bé Nagi――\\nSau khi tiệc chiêu đãi kết thúc…… kéo dài đến tận sáng cũng được.」"
1638 = "「Chị Hibiki nói với bọn em là muốn làm những chuyện như thế này.\\nVì vậy. Em và bé Nagi mới quyết định nhờ vả.」"
1640 = "「Chị Hibiki cũng có thể thử cử động theo ý thích mà?\\nEm sẽ điều chỉnh phía em để anh ấy không bị đau đâu.」"
1641 = "「Chị Hibiki? Sắp ra rồi đấy? Chị thấy không?\\nChim đang giật giật thở dốc thế này cơ mà.」"
1643 = "「Hibiki muốn, với anh――\\nlàm tình với anh.」"
1645 = "「Hibiki! Hibiki! Hibiki!」"
1646 = "「Hibiki! Hibiki!!」"
1647 = "「Hibiki!!!」"
1648 = "「Hibiki!!!!!!」"
1650 = "「Đau lắm đúng không. Hibiki. Vì vậy, từ từ thôi.\\nCho đến khi quen, hãy hít thở thật chậm rãi.」"
1652 = "「Thế, thế――á?」"
1654 = "「Chắc sắp rồi nhỉ~? Phải không ta~?」"
1658 = "「Vâng vâng. Nghe nói bệnh ban đỏ lây nhiễm\\nnên em cũng sợ lắm——nhưng may mà chỉ lây cho mỗi Nagi-chan.」"
1659 = "「Vậy, sao.」"
1660 = "「Vậy sao. Tiếc quá nhỉ. Vậy là kết thúc rồi ha.\\nNè, anh hai. Rút nó ra đi? Chim ấy.」"
1662 = "「Là em đã nhờ chị ấy. Em nhờ chị Hibiki giúp đỡ cả\\nbuổi tiệc chiêu đãi sau chuyến đi thuyền tập thể trên sông Kuma.」"
1663 = "「Đúng rồi. Thân dương vật không nhạy cảm bằng quy đầu,\\nnên có làm mạnh thế này cũng không sao đâu.」"
1665 = "「Đúng rồi, đúng rồi. Thử làm thì thấy đơn giản đúng không?\\nChỉ cần hai người dùng chân kẹp lại rồi di chuyển thế này thôi.」"
1667 = "「Chúc ngủ ngon, ――――」"
1668 = "「Ngủ ngon nhé, Hibiki.」"
1669 = "「Ngủ ngon, anh hai.」"
1674 = "「Sẽ hạnh phúc mà! Chuyện đó――của em…………\\n……Được anh hai làm chuyện ấy…… là ước mơ của em mà.」"
1680 = "「Điều kiện」"
1682 = "「Bình thường, ai cũng, làm chuyện này.」"
1684 = "「Dùng chất bôi trơn dính dớp của anh Soutetsu làm màu vẽ,\\ntô kín toàn bộ quy đầu một cách nhẹ nhàng và cẩn thận chẳng hạn.」"
1685 = "「Không sao. Không sao đâu. Hãy tin anh.」"
1686 = "「Được mà? Những gì chị đã tưởng tượng, hay kiến thức chị biết.\\nCứ thử làm theo ý mình với tâm thế thử nghiệm xem sao.」"
1687 = "「Không sao! Mà phải nói là tuyệt đối! Em muốn anh làm thế!!\\nNếu không――em sẽ hối hận cả đời――mãi mãi.」"
1688 = "「Không ai có thể thay thế Nagi.\\nCũng giống như trên thế giới này không ai có thể thay thế Hibiki vậy.」"
1689 = "「Mà, chuyện cũng đột ngột quá mà. Đoàn quan chức cấp cao từ Nakakuni\\nđến thị sát Ohimitera thông qua sự môi giới của Kisaki.」"
1696 = "「Fukami――Fukami――Fukami! Fukami!!!」"
1697 = "「Fukami――Fukami!!!」"
1698 = "「Fuka, mi――sao, lại――ư――a!!」"
1700 = "「Fukami――một chút nữa thôi――chỉ một chút, nữa thôi――\\n!! Anh cũng――anh cũng――sắp ra, rồi――」"
1701 = "「Fukami……」"
1702 = "「Fukami」"
1704 = "「Fukami, em làm gì――」"
1706 = "「Fukami. Chỉ một lần trong đời thôi. Chỉ đêm nay thôi. Hãy cho phép anh,\\nphản bội em và Nagi. Cho phép anh ngoại tình――」"
1709 = "「Tại, sao――Fukami」"
1714 = "「Thật sự rất hợp đấy. Sườn xám thì\\nhiếm khi có cơ hội được ngắm kỹ thế này——」"
1721 = "「Tinh dịch. Tinh trùng――đây là, của anh hai――（Khịt, khịt）\\nNóng quá――hôi quá――đến cả trong mơ, em cũng muốn thấy――」"
1729 = "「Với lại, chuyện tránh thai nữa! Từ ngày được bé Fukami và bé Nagi đồng ý,\\nem đã đàng hoàng――ưm, bàn bạc với đàn chị Kisaki rồi.」"
1730 = "「Khịt khịt. Ngửi ngửi――Mùi cũng đậm lên rồi.\\nMùi của đàn ông khi cương cứng――khi làm tình.」"
1731 = "「Lúc nghe vậy em bảo 'Nếu là thay thế thì'.\\n……Cái đó――ừm…… ơ, thì……………………」"
1732 = "「Em hiểu không, Hibiki.」"
1736 = "「Nếu không làm cho chị ấy thỏa mãn và chấp nhận――\\nThì sự méo mó này, một ngày nào đó sẽ tái phát――vì thế nên em mới làm vậy.」"
1739 = "「Làm tình với anh như thế này――\\nCho dù có làm――như vậy, em có thể hạnh phúc không?」"
1740 = "「Hà――hà――hà――hà――」"
1741 = "「Hà, hà, hà, hà――sắp, rồi,\\nsắp rồi――anh hai sắp――xuất tinh――」"
1742 = "「Hà! Hà! Hà! Hà!!!!」"
1743 = "「Hà! Hà! Hà! Hà!」"
1756 = "「Chuyện đó――nhưng mà――không, tóm lại là」"
1757 = "「Công việc hướng dẫn viên vừa áp lực lại vừa mang trách nhiệm nặng nề.\\nViệc đàm phán điều kiện hay thù lao là chuyện đương nhiên. Đáng lẽ phải thế.」"
1758 = "「Đây là…… của anh hai――（Ực）――a――ư……\\nKhi muốn làm chuyện đó――chim, chim.」"
1759 = "「Thế này, là sao」"
1762 = "「Hơn nữa――rất dâm đãng.」"
1765 = "「Ưm…… anh hai――」"
1766 = "「Cái đó?」"
1767 = "「Nếu vậy, anh sẽ làm trần. Với dương vật cương cứng không đeo bao, anh sẽ――」"
1769 = "「Vậy thì, em đi tắm trước đây,\\nrồi sẽ về phòng ngủ một mình!!」"
1771 = "「Anh, hai――xuất tinh…… xong rồi, sao?」"
1774 = "「Anh hai――anh biết không? Em――em――\\nThích――anh hai lắm.」"
1776 = "「Đang vào――đang nhuốm đầy――anh hai, anh hai đang――\\nbướm của em――tử cung――tất cả mọi thứ――」"
1777 = "「Quy đầu của, anh hai――phần đầu của, chim――!\\nĐang――hôn vào――tử cung, của em――」"
1779 = "「Anh hai! Anh hai! Anh hai! Anh hai!!!」"
1780 = "「Anh Soutetsu. Ngay bây giờ. Những lúc không dùng sức được thì tốt hơn.」"
1784 = "「っ!!!」"
1785 = "「!?」"
1787 = "「（Ực）」"
1884 = "Đâu chỉ tinh dịch, cả mồ hôi cũng nhớp nháp dính chặt lấy nhau.\\nDù là bộ phận nhỏ nhất cũng khao khát được tiếp xúc gần gũi hơn."
1888 = "Là từ Fukami, hay từ Hibiki――hoặc là cùng lúc.\\nKhông rõ là ai, lòng bàn chân của hai người bắt đầu di chuyển."
1900 = "Thế nhưng, trong nháy mắt nó lại trở nên ngọt ngào.\\nChỉ vì Hibiki nở một nụ cười rạng rỡ――っ!!?"
1911 = "Dù vậy, Hibiki vẫn không ngừng nói.\\nKhông hề rời mắt khỏi tôi dù chỉ một khoảnh khắc."
1920 = "Chỉ cần xuất tinh, chỉ cần xả ra là tôi sẽ bình tĩnh lại được.\\nMột suy nghĩ chẳng khác nào sự trốn chạy hèn nhát, nhưng tôi lại..."
1921 = "Bầu ngực của Fukami đang dễ thương mời gọi tôi, chắc do tôi đã mút\\nvà nghịch ngợm quá nhiều. Đầu vú của em ấy nổi bật hơn hẳn Hibiki."
1929 = "Lúc làm với Nagi, với Fukami, tôi cũng đang trong tình trạng bối rối.\\nKinh nghiệm đó, Fukami, và Nagi, đang nắm tay dẫn dắt tôi."
1931 = "A――Hibiki cũng vậy.\\nVới nụ cười rạng rỡ, em ấy bám lấy những lời của tôi."
1932 = "Đột nhiên nhớ lại buổi tập xúc than, không hiểu sao tôi lại có cảm giác muốn khóc.\\nMột khi đã say mê, Hibiki lúc nào cũng chỉ biết cố gắng hết mình――!?"
1936 = "Như một lời cảnh báo rằng đừng yêu. Đừng ảo tưởng.\\nBằng chính dương vật đang cương cứng ngắc vì nụ hôn với Fukami."
1937 = "Bởi vì tôi biết, sáng mai em ấy sẽ lại cười với tôi.\\nVới nụ cười rạng rỡ thường ngày và câu nói 'Chào buổi sáng, anh hai!'."
1939 = "Sự bối rối, cảm giác tội lỗi và hưng phấn càng làm tăng độ nhớt của tinh dịch.\\nChất lỏng đục ngầu đặc sệt như mayonnaise phụt ra khỏi lỗ niệu đạo."
1943 = "Fukami đã chấp nhận đóng vai ác để sắp xếp mọi chuyện đâu vào đấy.\\nĐưa mọi thứ về đúng vị trí, đúng hình dạng của nó."
1945 = "Cùng với sự run rẩy trong âm đạo của Hibiki, khoái cảm cũng ngày một dâng trào.\\nMột lượng tinh dịch khổng lồ không thể tin được dù là lần thứ ba, đang trào dâng từ tận đáy tinh hoàn."
1947 = "Dưới sự dẫn dắt của chân Fukami, nó phơi bày ngay trước mắt Hibiki."
1948 = "Bị những lời của Fukami kích động, cánh mũi Hibiki cũng phập phồng.\\nKhông ổn rồi. Không được――nghĩ vậy, nhưng tôi không thể phản kháng mạnh mẽ."
1951 = "Hibiki cũng bị kích động, cẩn thận hơn, mải mê tô kín quy đầu,\\nsướng đến mức tinh dịch cuồn cuộn dâng lên và đặc lại."
1953 = "Ngay cả lúc này, Hibiki vẫn rất ngoan ngoãn.\\nLập tức vươn ngón tay chạm vào cái bướm nhỏ xinh của mình."
1957 = "Cái miệng vừa hé ra lại khép lại. Tôi cũng không thể giục em ấy nói tiếp.\\nSự im lặng――nặng nề bao trùm."
1959 = "Cố tỏ ra bình tĩnh, nhưng không được.\\nCơ thể em ấy cứ run rẩy từng cơn."
1961 = "Khao khát về điều gì cơ chứ――Chưa kịp sắp xếp lại suy nghĩ,\\nnhững ngón chân khéo léo của Fukami đã vuốt ve phần cương cứng, cản trở tâm trí tôi."
1962 = "Kính ngữ sao. Đau đến mức đó ư――Ngay cả cảm giác tội lỗi, cũng bị sự co thắt\\nnhư đang tuyệt vọng thở dốc của âm đạo làm tan chảy, biến thành khoái cảm thể xác."
1966 = "Âm đạo co thắt từng cơn, bám chặt lấy như không muốn buông rời.\\nBộ ngực nhỏ nhắn rung lên sau mỗi cú thúc, thu hút hoàn toàn ánh nhìn của tôi."
1967 = "Thực tế, âm đạo của em ấy đang co thắt liên tục. Như thể đang ghi nhớ hình dáng của tôi――không,\\nnhư thể đang cố gắng điều chỉnh để vừa khít với sự cương cứng của tôi."
1968 = "Thật xấu hổ. Trước mặt em gái nuôi. Trước mặt Hibiki.\\nBị ép phải thú nhận rằng mình sắp xuất tinh rồ――っ!?"
1977 = "Thực tế, Hibiki luôn ủng hộ tôi.\\nCả những ngày trong chuyến dã ngoại, và cả con đường tôi đã chọn để đi đến hiện tại."
1983 = "Sau khi xuất tinh, một sự mệt mỏi rã rời, nhớp nháp cùng với\\ncảm giác tội lỗi trào dâng trong tâm trí tôi."
1985 = "Trước lời đề nghị tồi tệ của tôi, Hibiki mạnh mẽ gật đầu.\\nNhờ đó mà tôi có được dũng khí. Rằng dù tồi tệ, nhưng đó là cách tốt nhất."
1988 = "Cảm giác như cắt đứt một sợi chỉ, xé rách thứ gì đó đang dính chặt."
2002 = "Sự sỉ nhục mãnh liệt càng làm toàn thân tôi nóng rực. Nhưng nếu không báo trước,\\ntôi sẽ bắn tinh dịch đặc sệt lên người Hibiki, lên người em gái nuôi của mình mất."
2011 = "Khoái cảm lẫn lộn với cảm giác tội lỗi chạy dọc sống lưng lên tận não.\\nHibiki――em gái nuôi của tôi――Hibiki bé bỏng ngày nào――"
2017 = "Đầu óc tôi hoàn toàn trống rỗng. Chỉ nghe thấy tiếng tim đập thình thịch.\\nPhải bình tĩnh lại――Ngay khoảnh khắc nghĩ vậy. Tôi bị một ý nghĩ tồi tệ ám ảnh."
2029 = "Cảm xúc quá đỗi hỗn độn, khoái cảm thể xác quá mãnh liệt.\\nĐến mức tôi muốn điên cuồng dập hông ngay lập tức――"
2031 = "Biến toàn thân thành lò xo, tôi liên tục dập hông rồi lùi lại.\\nMồ hôi và dâm thủy nhớp nháp hòa quyện, tỏa ra mùi hương ngọt ngào hơn thường lệ."
2033 = "Là gia đình nuôi, cùng ăn một món, sống trong cùng một không gian,\\ncùng nhìn một thứ rồi cười, cùng mắc những sai lầm giống nhau――"
2034 = "Tôi thúc giục, nhưng em ấy không nói tiếp được.\\nĐang tự hỏi không biết phải làm sao thì Fukami liền mở lời."
2038 = "Tôi gọi tên. Tên cô em gái nuôi quan trọng.\\nChỉ có hai người trên thế giới này. Tên cô em gái. Quan trọng. Của tôi."
2039 = "Thử cọ xát phần cương cứng vào rãnh dọc xinh đẹp và đáng yêu ấy,\\ncửa mình chưa từng được sử dụng của Hibiki vẫn kiên cường bám lấy."
2041 = "Tôi suýt khóc. Giống như 'Lấy giùm anh cái đó' và 'Vâng'.\\nĐó là nhiệt độ trong những cuộc trò chuyện bình thường của anh em chúng tôi."
2044 = "Âm đạo co thắt lại vì đạt cực khoái,\\ntôi lùi lại, kéo tuột ra khỏi vách thịt đang bám dính lấy mình――――!!"
2046 = "Tôi ôm chầm lấy em ấy và hôn. Nếu vậy, tôi muốn làm Hibiki phát điên.\\nMuốn làm em ấy thỏa mãn triệt để, không để lại chút nuối tiếc nào."
2048 = "Thật xấu hổ. Vậy mà đầu tôi lại tự động gật lia lịa.\\nMuốn được nếm trải khoái cảm lúc nãy một lần nữa, bao nhiêu lần cũng được."
2051 = "Tôi nhẹ nhàng ôm lấy vai Fukami. Vì đó tất nhiên là khoảng cách\\n――hạnh phúc nhất mà chúng tôi nên có."
2052 = "Tôi sắp nói những lời tàn nhẫn. Sắp làm một hành động tồi tệ nhất.\\nVậy mà Hibiki――đôi mắt em ấy vẫn sáng lên."
2056 = "Tôi biết chữ 'thích' của Hibiki khác với chữ 'thích' của tôi.\\nVì biết――nên tôi chỉ có thể nói được câu này."
2059 = "Tôi không thể né tránh bàn chân rụt rè đưa tới của Hibiki.\\nRất đỗi nhẹ nhàng, tựa như lông vũ chạm vào――nhưng vẫn là bị dẫm lên."
2060 = "Ánh mắt tôi không thể nào ngừng đảo quanh. Tôi cứ so sánh hai người họ."
2061 = "Tăng tốc. Trái tim, cơ thể và tinh dịch,\\nđang tăng tốc để kết thúc khoảnh khắc mà tôi không hề muốn kết thúc này."
2064 = "Sự cương cứng của tôi phá hỏng toàn bộ thời gian mà chúng tôi đã tích lũy.\\nBắt đầu lại từ con số không, qua lần làm tình này, chúng tôi sẽ trở lại làm anh em."
2066 = "Em ấy hướng toàn bộ tinh dịch của tôi về phía Hibiki, bắt tôi bắn lên người em ấy.\\nTôi chỉ muốn tránh điều đó――nên mới nói rõ là mình sắp ra mà."
2068 = "Lời thì thầm tiếp theo sau câu chúc ngủ ngon đó,\\nmàng nhĩ của tôi, trái tim tôi, không thể nghe rõ."
2069 = "Cuối cùng tôi cũng có thể đối diện với Hibiki. Không phải với một người phụ nữ đang phát tình,\\nmà là với cô em gái nuôi quan trọng của tôi――Migita Hibiki. Với chính con người em ấy."
2070 = "Tiếng kêu bị kìm nén. Cùng lúc đó, mùi hương ngọt ngào nồng đậm hơn.\\nTôi vội vàng nhìn sang thì thấy Hibiki――Hibiki――――"
2072 = "Tôi bị mê hoặc bởi sắc hoa violet dập dềnh nơi sâu thẳm nhất trong đôi mắt Fukami.\\nTối tăm, sâu thẳm và đậm đặc vô cùng――một sắc tím gần như đen kịt."
2073 = "Khi tôi đặt Fukami nằm xuống nệm, em ấy trơn tru cởi đồ lót ra,\\nHibiki cũng đỏ mặt ngập ngừng làm theo."
2075 = "Tôi thử nhẹ nhàng đưa quy đầu vào cửa mình của Fukami.\\nÂm đạo ướt đẫm dù chưa dạo đầu đang mời gọi tôi tiến vào trong."
2078 = "Chưa kịp nói hết câu, tôi đã tự hiểu ra.\\nQuả thực, bộ đồ này——một khi đã để ý thì——"
2079 = "Tôi thấy nhẹ nhõm. Tình hình đã tiến triển――không,\\nđúng hơn là vì Fukami có lẽ đã giúp đỡ chúng tôi."
2081 = "Tôi thầm cầu xin em đừng khóc.\\nCó lẽ vì thế chăng――Hibiki, Hibiki. Em ấy mỉm cười với tôi."
2083 = "Vì thế tôi gọi lại tên em ấy thật dịu dàng, với ý muốn truyền đạt rằng không sao đâu.\\nTên của cô em gái nuôi quan trọng, vô cùng đáng yêu và đáng mến của tôi."
2084 = "Vì thế tôi gọi lại một lần nữa.\\nCô em gái quan trọng của tôi."
2086 = "Thế nên, tôi chỉ nhìn chằm chằm vào Fukami. Vào cơ thể Fukami, vào âm đạo của Fukami,\\ntôi dồn hết sức lực và gửi gắm tất cả những gì mình có."
2089 = "Thế nên tôi gọi cả Fukami và Hibiki cùng lúc.\\nVà rồi Fukami――――đã hiểu ý tôi."
2143 = "Hibiki rất nghiêm túc. Hibiki rất quy củ. Hibiki rất đáng yêu.\\nVì tôi biết tất cả những điều hiển nhiên đó――"
2145 = "Hibiki bối rối nhìn Fukami――\\nSau đó chậm rãi, chuyển ánh mắt có vẻ sợ sệt về phía tôi."
2147 = "Hibiki cũng có bộ ngực hẳn hoi.\\nTuy nhỏ nhắn, nhưng lại có hình bát úp rất đẹp."
2150 = "Khóc xen lẫn cười. Một biểu cảm vô cùng đau khổ nhưng lại rất đẹp. Khuôn mặt của một người phụ nữ.\\nBiểu cảm mà tôi không hề mong muốn ở Hibiki――dù nó có quyến rũ đến nhường nào."
2152 = "Tinh dịch mà Hibiki mút lấy mút để vẫn còn hòa lẫn trên lưỡi và trong nước bọt,\\nchảy ngược vào khoang miệng tôi."
2154 = "Hibiki rất mạnh mẽ. Lại thông minh, dũng cảm và luôn trân trọng tôi.\\nVì thế, em ấy sẽ giữ lời hứa. Chắc chắn, Hibiki sẽ giữ lời hứa."
2155 = "Từ mặt, tay đến lòng bàn chân, toàn thân Hibiki đỏ bừng.\\nMùi hương ngọt ngào thi thoảng ngửi thấy trong phòng Hibiki trở nên nồng nặc."
2157 = "Mỉm cười.\\nĐể không làm tôi lo lắng, em ấy vẫn giữ nguyên nụ cười đó."
2159 = "Tôi vội vã quay mặt đi khỏi Hibiki. Em ấy đang bắt đầu tự sướng.\\nNhìn tôi và Fukami làm tình, rồi nhẹ nhàng đưa ngón tay vuốt ve vùng kín."
2161 = "Hibiki vặn vẹo cơ thể, tỏ vẻ muốn giấu đi khỏi tầm nhìn của tôi.\\nCử chỉ khác thường này khiến tôi giật mình."
2163 = "Ngón tay Fukami vươn tới phần kết nối của chúng tôi, rồi lại ngập ngừng.\\nCó lẽ em ấy muốn xoa dịu nỗi đau của Hibiki dù chỉ một chút――"
2165 = "Hibiki dần thả lỏng. Bên trong âm đạo vốn chật chội và cứng đờ,\\nbắt đầu trở nên trơn ướt, nới lỏng ra và ấm dần lên."
2167 = "Em ấy vô thức tấn công tôi bằng sự sỉ nhục. Trong lúc đó,\\nnhững ngón chân trắng nõn của Hibiki vẫn cẩn thận tô kín quy đầu của tôi."
2169 = "Hibiki không dùng thì quá khứ mà là hiện tại.\\nEm ấy ngước đôi mắt đang cụp xuống lên, nhìn thẳng vào mắt tôi."
2172 = "Phản ứng của Hibiki giống hệt một chú mèo con\\nbị gọi bất chợt khi đang say sưa ăn vụng Chururu."
2174 = "Yết hầu của Hibiki chuyển động rõ rệt. Đôi má em ấy đỏ bừng.\\nMặc kệ những giọt mồ hôi rơi, Hibiki vẫn nhìn tôi chằm chằm."
2175 = "Sự căng thẳng của Hibiki thể hiện qua cách nói kính ngữ. So với Fukami nhỏ tuổi hơn,\\nrãnh dọc của em ấy trông quá đỗi ngây thơ, dù đúng là mật ngọt đang tràn ra."
2181 = "Chân Hibiki khựng lại. Em ấy không nói được lời nào.\\nTôi không thể từ chối. Dĩ nhiên, cũng chẳng thể thúc giục."
2182 = "Bàn chân Hibiki lại một lần nữa tiến lại gần dương vật đang cương cứng của tôi.\\nRun rẩy lập cập, có lẽ vì căng thẳng."
2183 = "Hibiki bắt đầu cử động chân táo bạo hơn một chút.\\nFukami thì ngược lại, dùng lòng bàn chân nâng đỡ――làm tấm đệm."
2184 = "Bàn chân Hibiki nhanh chóng trở nên mềm mại và ấm áp.\\nNhững ngón chân mũm mĩm không kém gì ngón tay trẻ sơ sinh chạm vào đầu nấc của tôi."
2186 = "Âm đạo của em ấy đang lên tiếng thay cho những cảm nhận mãnh liệt.\\nĐang khao khát tinh trùng của tôi, đang quấn quýt làm nũng với tôi."
2187 = "Ánh mắt của Hibiki không chạm mắt tôi.\\nEm ấy cứ nhìn chằm chằm như muốn ăn tươi nuốt sống hạ bộ đang bị dẫm của tôi――"
2189 = "Mùi hương của Hibiki, mùi hương ngọt ngào đang hòa tan vào toàn thân tôi.\\nĐang làm tình. Tôi đang làm tình――với Hibiki."
2191 = "Hibiki khẽ bật cười.\\nCười mỉm với khuôn mặt của một người phụ nữ."
2193 = "Đứng dậy. Hibiki vươn vai một cái thật lớn.\\nKhông hề che đậy bộ ngực trần, khóe mắt em ấy ngấn lệ."
2195 = "Cơ thể căng cứng nãy giờ bỗng chốc rã rời.\\nCái bướm nhỏ xinh của Hibiki ướt đẫm nhầy nhụa."
2197 = "Hibiki liếm tinh dịch của tôi. Liếm, mút,\\nrồi nuốt xuống họng. Trông có vẻ rất khó nuốt――nhưng lại rất hạnh phúc."
2201 = "Ngay từ đầu đã ướt đẫm như thế. Lại còn tự sướng nữa.\\nVậy mà cửa mình của Hibiki vẫn chật hơn Nagi rất nhiều."
2206 = "Đó là lý do tôi khao khát Fukami, và chọn Fukami.\\nCũng vì thế mà tôi cần sự tươi sáng, không chút giả tạo của Nagi."
2207 = "Đúng như lời nói, Fukami đang 'hiểu' tôi.\\nThấu hiểu mớ cảm xúc hỗn độn này, có lẽ còn rõ ràng hơn cả chính tôi."
2218 = "Fukami tăng tốc, tăng thêm kích thích như dẫm lên cả tinh hoàn――"
2221 = "Sự ngọt ngào đó, bị nước bọt của Fukami biến thành sự nóng bỏng trong tích tắc.\\nBằng một nụ hôn dâm đãng nắm rõ mọi điểm yếu của tôi――"
2224 = "Fukami dùng ngón cái và bốn ngón còn lại kẹp chặt, bao bọc lấy dương vật đang cương cứng của tôi,\\nhơn nữa còn vừa cử động các ngón chân, vừa vuốt ve mạnh mẽ mà dịu dàng."
2226 = "Fukami chà đạp. Dùng chân chà đạp lên hạ bộ của tôi.\\nNgay trước mắt Hibiki――っ!!?"
2228 = "Chỉ dẫn của Fukami chính xác đến đáng sợ.\\nNhững ngón chân mềm mại của Hibiki, chậm rãi, êm ái, cẩn thận――"
2230 = "Ánh mắt và giọng nói của Fukami rất kiên định. Thậm chí có cảm giác như em ấy đang rất quyết tâm.\\nVậy thì bây giờ, thay vì hỏi lý do, tốt nhất là cứ làm the――っ!!?"
2236 = "Bàn chân Fukami biến thành máy bơm hút tinh dịch lên,\\ncòn những cái vuốt ve dịu dàng của Hibiki khiến tinh dịch càng thêm sục sôi!"
2237 = "Chân Fukami di chuyển như đang đạp chân ga.\\nTạo ra sự chênh lệch với bàn chân chỉ biết lên xuống một cách vụng về của Hibiki."
2238 = "Những ngón chân của Fukami, vốn đã quá quen thuộc với dương vật của tôi,\\nvừa lần theo hình dáng vừa dẫm đạp, khiến nó càng lúc càng cương cứng."
2239 = "Dương vật bị bàn chân, bị ngón chân của Fukami tóm chặt lấy――"
2240 = "Ngón chân của Fukami――những ngón chân khéo léo kéo quần lót của tôi xuống.\\nCứ tưởng vì mất tập trung nên nó đã xìu xuống, ai ngờ dương vật của tôi――"
2242 = "Fukami đưa mắt nhìn Hibiki.\\nHibiki lộ vẻ bối rối, chậm rãi, khẽ gật đầu."
2243 = "Fukami dùng chân ấn nhẹ.\\nÉp dương vật của tôi vào lòng bàn chân đang cứng đờ của Hibiki."
2245 = "Fukami gật đầu. Hibiki càng vặn vẹo lúng túng hơn.\\nCó thể là tôi nghĩ nhiều――nhưng bầu không khí này――"
2251 = "Đến giờ tôi mới xâu chuỗi lại được. Tôi đã coi đó là điều không thể và biến nó thành điểm mù.\\nCảnh Hibiki mặc đồ lót, ăn mặc phong phanh, hay vòng ngực――tất cả những thứ đó――"
2256 = "Kisaki cũng biết chuyện.\\nNghe vậy, một cảm giác an tâm mạnh mẽ trào dâng trong tôi."
2260 = "Bất ngờ trước khoái cảm mãnh liệt ập đến, tôi nhìn xuống――"
2263 = "Bất chợt cử động chân của Fukami lỏng đi, yếu dần.\\nDo đó thần kinh càng tập trung hơn vào quy đầu――"
2272 = "Tinh dịch, bắn lên người Hibiki. Bắn lên người em gái nuôi quan trọng của tôi.\\nDưới sự dẫn dắt của những ngón chân của người vợ Fukami――"
2280 = "Nghe Fukami nói, đôi má em ấy ửng hồng, nhưng vẫn khẽ gật đầu."
2281 = "Khỏe như vâm mà cũng đổ bệnh.\\nViệc Nagi đột nhiên gục ngã khiến tôi khá bất ngờ——"
2282 = "Nghe nói đoàn toàn là nữ, lại toàn những quan chức cấp cao.\\nNếu là tôi, chắc vừa nghe chuyện đã thấy đau dạ dày rồi."
2284 = "Ngực tôi thắt lại.\\nCả thể xác lẫn tâm hồn đều chực trào nước mắt, nhưng tôi cố kìm nén."
2290 = "Một nụ hôn đắng ngắt, mùi tanh xộc thẳng lên mũi. Nụ hôn tồi tệ nhất.\\nNụ hôn đầu tiên, và cũng là nụ hôn cuối cùng với Hibiki."
2293 = "Được vuốt ve âu yếm như trẻ ngoan, tôi bất giác thốt ra tiếng rên.\\nKhuôn mặt Hibiki bỗng chốc sáng bừng lên."
2299 = "Đó không giống những lời Hibiki thường nói.\\nNghĩ vậy, nhưng rồi tôi gạt đi và hùa theo em ấy."
2300 = "Lần này là Hibiki. Chỉ mình Hibiki thôi.\\nBởi vì những lời của Fukami đã tiếp thêm động lực cho tôi."
2301 = "Khoái cảm tột đỉnh đó, một cách bạo lực và trực diện,\\nbị kích thích mạnh mẽ từ những ngón chân của Fukami ghi đè và tô đậm thêm."
2305 = "Hibiki từng ôm gấu bông khóc nhè.\\nHibiki từng vui vẻ nói 'Màu đỏ là màu đỏ'. Hibiki ngày đó――"
2308 = "Tôi muốn đợi em ấy. Nhưng không thể đợi được.\\nBởi vì tôi đang để Fukami――để Nagi――phải chờ đợi!"
2312 = "Giọng nói có phần lạnh lùng của Fukami hô ứng với bộ não vừa bình tĩnh lại sau khi xuất tinh.\\nĐúng rồi――nhắc mới nhớ, câu chuyện vốn là như vậy mà."
2315 = "Từ quy đầu, thân, đến cả bi, bị tấn công cẩn thận mà mãnh liệt,\\nnóng quá nóng quá nóng quá nóng quá, toàn thân tôi như tan chảy!"
2316 = "Dứt quy đầu ra khỏi cổ tử cung đang bám chặt lấy rồi lại\\nđể nó mút vào. Mỗi lần lặp lại, những làn sóng khoái cảm lại càng lớn hơn――!"
2317 = "Đầu quy đầu. Mới chỉ chôn vào được một nửa.\\nThế nhưng cửa mình của Hibiki đã truyền khoái cảm vào người tôi."
2318 = "Tô kín toàn bộ quy đầu bằng chất bôi trơn không chừa chỗ nào.\\nTừ rãnh quy đầu đến mặt dưới, thực sự không chừa một chỗ nà――っ!"
