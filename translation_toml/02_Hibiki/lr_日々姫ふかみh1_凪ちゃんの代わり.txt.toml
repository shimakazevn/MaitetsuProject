1522 = "「Nếu ghen tị thì chị thử cử động chân xem sao?\\nHôm nay chị Hibiki là 'người thay thế bé Nagi' mà?」"
1526 = "「Xuất tinh đi――Tinh, dịch――em muốn, xem――\\nCảnh anh hai xuất tinh――em――từ lâu, đã muốn xem rồi.」"
1529 = "「Em đã chuẩn bị tinh thần cho việc này rồi. Nên là, nhỉ? Cùng nhau.\\nChỉ đêm nay thôi. Chỉ một đêm thôi. Cùng phản bội bé Nagi nào.」"
1530 = "「Chim――nhỉ? Rất dễ dàng――đi vào trong\\n――bất cứ ai, cũng――mọi người――đều như, thế này.」"
1534 = "「Chỉ có thế này thôi mà.\\nChuyện mà ai cũng làm bình thường. Vậy mà…… nhỉ?」"
1536 = "「Anh Soutetsu bình thường ngầu thế, điềm tĩnh và đáng tin cậy như thế,\\nmà giờ lại làm ra vẻ mặt dâm đãng thế này.」"
1541 = "「Giải tỏa dục vọng này――rồi chắc chắn sẽ nghĩ, 'Chỉ thế này thôi sao',\\nthấy thật hụt hẫng, hơi thất vọng một chút, rồi khóc.」"
1545 = "「Đã nói――hay đúng hơn là, em đã tự mình yêu cầu.」"
1546 = "「Việc chị――giỏi á, ừm――」"
