1455 = "Tôi đã thỏa thích rót trào tinh dịch vào âm đạo,\\nvào tận trong tử cung một cách vô cùng sảng khoái, nhưng――"
1475 = "Thế nhưng ngay lập tức, bằng chính ý chí của mình,\\nHibiki bắt đầu cử động lưỡi và đầu."
1477 = "Thế nhưng cơ thể tôi lại tự động phản ứng với giọng nói của Hibiki――\\nCó lẽ bản năng của tôi đã khao khát muốn biết điều gì sẽ xảy ra tiếp theo."
1479 = "Nhưng――còn một chỗ. Nghe em ấy nói mới để ý,\\nquả thực còn một vùng khá lớn tôi chưa tô đến."
1497 = "Chỉ riêng xúc cảm từ đôi môi thôi cũng đủ khiến tôi sung sướng,\\nnhưng một luồng kích thích mới lại ập đến."
1500 = "Tôi hoàn toàn không hề có ý định――cử động.\\nThậm chí còn chẳng mảy may nghĩ đến việc đó."
1516 = "Ra là vậy. Những chuyển động từ nãy đến giờ,\\nkhông chỉ để tìm kiếm khoái cảm, mà còn để làm ướt toàn bộ."
1522 = "Chiếc lưỡi nhọn hoắt như muốn tách đôi đỉnh quy đầu,\\ncố gắng truyền dòng nước bọt đặc sệt vào bên trong."
1523 = "Những giọt mồ hôi tuôn rơi, những giọt nước dâm dật văng cả lên mặt tôi,\\nbất giác liếm thử, một vị mằn mặn khẽ đọng lại trên đầu lưỡi."
1524 = "Nảy lên. Hibiki đang nảy lên.\\nCả cơ thể em ấy, bộ ngực khiêm tốn, và cả mái tóc đuôi ngựa đều đang nhảy múa."
1525 = "Ướt đẫm. Rung động.\\nCửa mình mở ra khép lại co giật, mút chặt lấy."
1541 = "Nước dãi rỏ xuống từ khóe môi, thở dốc từng cơn qua mũi,\\nnhưng Hibiki vẫn không hề ngừng lại chuyển động của khoang miệng."
1545 = "Cùng với lời nói, tôi khẽ kéo nhẹ mái tóc em ấy,\\nHibiki vô cùng thích thú, nheo đôi mắt to tròn tuyệt đẹp lại."
1547 = "Bằng một giọng nói nghẹn ngào vì bị dương vật chèn ép,\\nHibiki vẫn cố gắng truyền đạt tâm tư của mình."
1551 = "Nếu chiếc lưỡi cử động khiến dương vật tôi run rẩy――"
1553 = "Bất chấp ý chí của chúng tôi, khoảnh khắc vượt qua vài milimet cuối cùng,\\nmiệng tử cung và đỉnh quy đầu khao khát lẫn nhau, dính chặt vào nhau."
1554 = "Một khi đã tin chắc, thì ngay cả khoảnh khắc đẩy vào,\\ntôi cũng có thể cảm nhận được ranh giới ấy, như thể có một lực từ trường đang hoạt động."
1557 = "Bị lớp thịt ngọt ngào này liên tục thôi thúc, việc giữ nguyên không cử động, không xuất tinh,\\ndù có ý chí và thể xác mạnh mẽ đến đâu đi chăng nữa thì cũng là điều bất khả thi."
1558 = "Đúng khoảnh khắc đó, một lực hút mạnh mẽ khiến mọi thứ nổ tung thành một màu trắng xóa!!!"
1560 = "Tinh dịch do chính tôi bắn ra, tất nhiên sẽ dính lên da.\\nĐiều đó thì cũng chẳng đáng bận tâm lắm, nhưng trong lòng tôi lại dấy lên một sự nghi ngờ."
1565 = "Không chỉ chuyển động trước sau trái phải.\\nEm ấy còn tăng thêm lực ép, hoặc nâng hông lên cao hơn nữa."
1566 = "Để vắt kiệt tâm tư của tôi, màu vẽ của tôi, tinh dịch của tôi,\\nem ấy dùng cả cơ thể chứ không chỉ riêng chiếc miệng để yêu thương dương vật của tôi."
1568 = "Ngậm trọn dương vật căng cứng trong miệng,\\nem ấy vẫn cố gọi tôi là anh hai."
1571 = "Giọng nói nghẹn ngào nước mắt, ngập tràn sắc dục ấy,\\nsuýt chút nữa đã phá vỡ mọi xung động mà tôi đang cố kìm nén."
1573 = "Em ấy há to miệng, phát ra tiếng \"Aaa\"."
1575 = "Em ấy hóp má lại và mút lấy mút để.\\nTrong lúc bị mút, quy đầu của tôi liên tục bị chiếc lưỡi trêu đùa."
1576 = "Chỉ dùng môi để ngọt ngào tóm lấy quy đầu,\\nnhưng ngay sau đó lại tuột ra."
1578 = "Giọng em ấy, cất lên rộn rã.\\nVì niềm vui, và có lẽ cũng vì khoái cảm chân thực nữa."
1580 = "Toàn bộ quy đầu của tôi,\\nbị liếm láp hệt như quả anh đào trên ly kem soda."
1582 = "Chuyển động hông cũng trở nên mượt mà hơn.\\nĐầy tự tin, và đầy tính khiêu khích."
1584 = "Áp lực từ đùi em ấy bỗng tăng mạnh,\\nkẹp chặt lấy cơ thể tôi――!!?"
1585 = "Đúng là có hôn nhau thật."
1586 = "Tuy nói là đè bẹp, nhưng em ấy không hề dồn toàn bộ trọng lượng lên đó."
1592 = "Bị chỉ ra như vậy, tôi cảm thấy mặt mình nóng bừng lên."
1593 = "Bị đòi hỏi như vậy, tôi cũng muốn đáp lại.\\nNhưng tôi cắn răng chịu đựng, cố kìm nén lại."
1594 = "Sự nghiêm túc ấy thật đáng yêu,\\nkhiến dương vật đang cương cứng của tôi cũng giật nảy lên."
1596 = "Nếu là cái thuở mới bắt đầu ân ái với Hibiki,\\nchắc chắn tôi đã không thể vượt qua nổi và xuất tinh một cách thảm hại rồi――"
1598 = "Lặp đi lặp lại hai, ba lần, ngọn lửa dục vọng vốn chỉ cháy liu riu\\nnay đã dễ dàng sục sôi."
1604 = "Tinh dịch vốn đã yếu đà,\\nnay lại để đáp lại Hibiki, đáp lại tôi, mà bắn thẳng vào tận sâu trong cổ họng em ấy."
1606 = "Và khi cơn sóng xuất tinh đi qua,\\nlý trí của tôi mới từ từ quay trở lại."
1612 = "Âm đạo vẫn tiếp tục tấn công tôi một cách dữ dội,\\nnhưng có vẻ như việc tôi dừng lại đã giúp Hibiki có thêm chút thong thả."
1615 = "Ngay lúc đó, như thể muốn trêu chọc tôi――.\\nKhông, có lẽ là cố ý, em ấy chuyển sang chỉ dùng mỗi lưỡi để cử động."
1617 = "Dù tôi không cử động, nhưng vẫn bị kéo theo.\\nCác nếp gấp âm đạo của Hibiki có lẽ khá sâu――"
1621 = "Lượng tinh dịch còn sót lại ở lỗ niệu đạo bị hút sạch sành sanh,\\ntrôi tuột qua cổ họng Hibiki――rồi nuốt chửng vào tận sâu trong dạ dày."
1628 = "Khoái cảm mãnh liệt ấy suýt chút nữa làm đứt phựt dây thần kinh lý trí của tôi,\\nkhiến cơ thể tôi bất giác khựng lại."
1632 = "Từ dáng vẻ nỗ lực hết mình của Hibiki,\\ntôi cảm giác như mình đã lờ mờ hiểu được ý nghĩa của điều đó."
1636 = "Chính sự tích lũy vô cùng nhỏ bé ấy, đã khiến cho sự tiếp xúc vốn đã cực kỳ mãnh liệt\\ngiữa da thịt và niêm mạc trở nên nhạy bén hơn bao giờ hết."
1644 = "Từ phía tôi cũng bắt đầu đẩy hông,\\nvào cửa mình đáng yêu của Hibiki."
1649 = "Da thịt va chạm vào nhau, ngay cả sức nặng cũng biến thành khoái cảm.\\nMùi hương của Hibiki nhỏ giọt xuống, hòa quyện cùng mùi cơ thể tôi."
1650 = "Ánh mắt ngước lên. Hai ánh mắt chạm nhau.\\nChỉ bấy nhiêu thôi cũng đủ để truyền tải tất cả."
1651 = "Cơ quan sinh dục đực và cái nguyên thủy nhất mà cơ thể chúng tôi sở hữu.\\nSự thật rằng ngay cả nơi đó cũng đang khao khát lẫn nhau đã nâng tầm cả thể xác lẫn tâm hồn."
1652 = "Đỉnh quy đầu. Phần tiếp xúc sát sao.\\nToàn tâm toàn ý của tôi chỉ tập trung duy nhất vào nơi đó."
1655 = "Muốn kiểm chứng lại nên tôi lặp đi lặp lại hành động đó, và tin chắc rằng đó là sự thật."
1657 = "Tôi, đang vẽ tranh."
1659 = "Chỉ cần tôi thì thầm và cử động, âm đạo đáng yêu của Hibiki\\nliền phản ứng lại một cách chân thực, ngọt ngào và mãnh liệt đến thế này."
1660 = "Là chuyển động của Hibiki, hay là của tôi, tôi cũng chẳng còn phân biệt được nữa.\\nChúng tôi chỉ biết cùng nhau lao về phía trước."
1663 = "Không phải do tôi đang cử động.\\nTôi nghĩ vậy, nhưng từng giây trôi qua, sự tự tin đó lại dần tan biến."
1664 = "Đang rót vào. Toàn bộ những dục vọng thấp hèn\\nmà tôi muốn trút lên Hibiki kể từ lúc em ấy làm người mẫu."
1666 = "Hông tôi tự động ngứa ngáy――\\nBàn tay đang vuốt ve mái tóc cũng――vô thức dồn thêm lực!"
1667 = "Đang hút chặt lấy nhau. Đang níu kéo lấy nhau.\\nSự dày dặn của cánh cửa tử cung, và phần đỉnh quy đầu của tôi."
1670 = "Tôi buông lỏng tay, đồng thời đẩy hông lên,\\nHibiki uốn cong người như cánh cung, thở dốc dữ dội."
1672 = "Tôi dồn lực vào bàn tay đang đỡ eo em ấy, chuyển động như thể đâm tới,\\nHibiki giật mình suýt trượt ngã."
1674 = "Tôi dùng Hibiki làm bức tranh sơn dầu.\\nVẽ bức tranh của tôi lên người Hibiki."
1676 = "Tôi kìm nén giọng nói chực chờ cao vút của mình,\\ncố ý thì thầm vào tai Hibiki bằng một chất giọng trầm ấm và ngọt ngào."
1679 = "Tôi nâng đôi chân của Hibiki đang khẽ thét lên vì sung sướng."
1681 = "Tôi nắm lấy tay Hibiki, khẽ kéo,\\nvà để em ấy ngồi vắt vẻo ngay trên người tôi đang nằm trần truồng."
1682 = "Tôi nhẹ nhàng vuốt ve mái tóc em ấy,\\nHibiki nheo mắt lại đầy vẻ say đắm."
1684 = "Trước những chuyển động ích kỷ của tôi, ngay khi vừa rũ bỏ sự bối rối thoáng qua,\\nHibiki liền lập tức đáp lại và hùa theo."
1686 = "Chỉ cần tôi khẽ dồn chút lực vào bàn tay đang vuốt ve mái tóc,\\nbấy nhiêu thôi cũng đủ làm ánh lên sự kỳ vọng trong đôi mắt Hibiki."
1688 = "Tôi có chút do dự khi đút vào.\\nBởi vì dương vật của tôi lúc này đang nhầy nhụa tinh dịch và ái dịch."
1690 = "Từ tiền đình âm đạo, cho đến tận âm vật,\\ncọ xát, đè ép, và kích thích."
1692 = "Đè chiếc lưỡi xuống và trượt dương vật cương cứng lên trên,\\ntôi dẫn dắt đầu Hibiki ấn sát vào đũng quần mình."
1694 = "Để chứng minh bằng hành động thực tế, vào âm đạo nhỏ bé ấy.\\nKhông chút do dự, tôi dùng dương vật cứng ngắc xuyên thẳng qua."
1697 = "Tôi nghe thấy giọng nói của Hibiki,\\nnhưng não bộ lại không chịu phân tích ý nghĩa của nó."
1698 = "Nếu giọng nói của tôi khiến Hibiki phản ứng dâm đãng đến thế,\\nthì việc nhấm nháp từng chút một, dù nghĩ thế nào cũng là quá lãng phí."
1699 = "Nơi sâu thẳm nhất của Hibiki, cánh cửa tử cung dày dặn,\\nvà phần đỉnh quy đầu của tôi, đang hôn nhau không một khe hở."
1702 = "Đáng yêu. Hạnh phúc. Dễ thương.\\nVì thế tôi muốn nhuộm đẫm em ấy bằng chính mình."
1704 = "Quyết không để đối phương rời xa,\\nchúng khao khát nhau một cách tuyệt vọng."
1705 = "Cửa mình khép lại như muốn hút lấy tôi,\\nngay cả xung động muốn xuất tinh cũng bị kéo theo một cách dễ dàng."
1708 = "Tôi kéo hông lùi lại!\\nMột chuyển động hoàn hảo và đồng bộ, nhưng vẫn quá đỗi sít sao!!!"
1710 = "Nếu cử động bất cẩn thì sẽ xuất tinh mất.\\nBiết rõ điều đó, tôi chầm chậm, từ từ kéo hông lùi lại――!?"
1711 = "Nâng Hibiki lên, chạm đầu dương vật vào hậu môn,\\nem ấy liền thốt ra một âm thanh đan xen giữa kỳ vọng và bất an."
1714 = "Chính vì vậy, để đáp lại phản ứng ấy,\\nđể tận hưởng trọn vẹn chiếc âm đạo đang ở trạng thái nghiêm túc nhất này!"
1716 = "Vì vậy, tôi dùng tay đỡ lấy eo em ấy,\\ntừ từ, từ từ nâng cơ thể Hibiki lên."
1722 = "Tôi ngoan ngoãn nghe theo sự dẫn dắt, ngồi xuống mép giường,\\nHibiki quỳ gối trên sàn, áp sát cơ thể vào đũng quần tôi."
1724 = "Dục vọng căng phồng hòa quyện cùng tình yêu,\\ndâng trào lên tận lỗ niệu đạo, tưởng chừng như có thể tuôn trào bất cứ lúc nào."
1765 = "Dự đoán rằng tôi sẽ cử động, Hibiki gồng mình lên\\nvà âm đạo liền ngoan ngoãn siết chặt lại!"
1768 = "Hibiki cũng đổ gục xuống bên cạnh tôi,\\náo sát, cọ cọ làm nũng――――?"
1771 = "Trong một khoảnh khắc, em ấy có vẻ như sắp nôn oẹ vì nghẹn."
1773 = "Có lẽ vì để ý nên em ấy mới cảm nhận được rõ ràng như vậy.\\nHibiki khẽ run người và nuốt nước bọt."
1776 = "Kỹ thuật dùng miệng――Hibiki cũng đã trưởng thành hơn rất nhiều.\\nĐiều đó khiến tôi vừa vui mừng vừa yêu thương, khẽ khàng vuốt ve đầu em ấy."
1777 = "Giọng của Hibiki đã hoàn toàn lạc đi."
1779 = "Khoảnh khắc đó, Hibiki cất lên tiếng reo vui từ sâu trong cổ họng.\\nVà rồi em ấy bắt đầu thoa triệt để lớp sơn nước bọt lên chiếc cọ thịt của tôi."
1781 = "Vừa cười mỉm vừa nói vậy, rồi đột nhiên,\\nHibiki ngước lên nhìn tôi như thể vừa nhận ra điều gì đó."
1782 = "Niềm vui sướng tột độ của Hibiki,\\ncộng hưởng với trái tim tôi, khiến những tâm tư và nguyện vọng hòa làm một."
1785 = "Men theo dương vật đang được đỡ thẳng đứng, em ấy ép sát vào,\\nhông của Hibiki, và cả cơ thể em ấy, đang nhảy múa một cách dâm đãng."
1787 = "Hibiki khẽ nhấc hông lên,\\ngiải phóng cho dương vật của tôi vốn đang bị đè ép và lún sâu bên dưới."
1789 = "Hibiki giờ đây dường như không còn sức lực ở cả chân lẫn hông nữa."
1790 = "Một âm thanh gần như chỉ là tiếng thở hắt ra.\\nNghe vừa có vẻ vui sướng, lại vừa có vẻ ngượng ngùng."
1792 = "Tử cung của Hibiki và phần đỉnh quy đầu của tôi,\\nnhư thể không muốn rời xa nhau, khẽ khàng mút lấy nhau."
1793 = "Âm đạo của Hibiki vốn đã có nhiệt độ cao,\\nnay lại giật mình vì cú đâm bất ngờ, căng cứng và càng trở nên nóng bỏng hơn."
1795 = "Âm đạo của Hibiki cũng gồng cứng những nếp gấp thịt đầy ngọt ngào,\\ntăng thêm sự kích thích và siết chặt dữ dội, tưởng chừng như sắp chuyển thành cơn đau."
1798 = "Với quyết tâm muốn vắt kiệt tinh dịch của tôi,\\nâm đạo của Hibiki siết chặt lấy dương vật đang cương cứng."
1800 = "Dương vật vừa mới xuất tinh lại râm ran nhức nhối, khiến Hibiki khẽ thốt lên một tiếng đầy thích thú."
1801 = "Hibiki điều chỉnh tư thế sao cho nó lún vào như đang tách rãnh âm đạo ra,\\nchỉ cốt để mang lại khoái cảm cho tôi."
1802 = "Hibiki run rẩy hông, để cho dương vật vẫn đang lún sâu dọc theo rãnh thịt.\\nLắc lư nhè nhẹ sang trái rồi sang phải."
1803 = "Hibiki hơi hạ thấp trọng tâm, và trượt hông một khoảng dài\\ndọc theo chiều dài của dương vật đang cương cứng."
1807 = "Chiếc lưỡi mềm mại ướt át của Hibiki,\\nrụt rè vươn ra, đặt một nụ hôn lên quy đầu của tôi."
1809 = "Nhận ra ý đồ của tôi ngay lập tức, Hibiki\\nchỉ mím chặt môi lại, đồng thời hút thật mạnh!"
1814 = "Một cảm giác vẫy gọi nhau vô cùng mỏng manh."
1825 = "Giọng nói dễ thương――Tôi không ngờ cổ họng mình\\nlại thốt ra âm thanh cao vút hệt như tiếng rên rỉ của Hibiki――!!?"
1833 = "――Từng nếp gấp âm đạo sâu và tinh xảo ấy,\\ndang uốn lượn như những chiếc lưỡi mỏng manh và nhạy cảm."
1835 = "――Cảm giác thỏa mãn và thành tựu khiến toàn thân rã rời đổ gục.\\nDù cả cơ thể đã mệt lử, nhưng lại vô cùng sảng khoái."
1839 = "Để vắt kiệt những giọt màu cuối cùng,\\ntôi táo bạo vung cọ vẽ!"
1848 = "Một hơi, nuốt chửng tất cả.\\nĐể tinh dịch của tôi chảy thẳng xuống tận đáy bụng, đến tận bên trên tử cung."
1849 = "Và rồi, em ấy vươn tay về phía tôi――"
1850 = "Và rồi cứ thế, em ấy dùng ngón tay đỡ mạnh lấy phần quy đầu đang dựng đứng――"
1851 = "Rồi em ấy ngửa đầu ra sau,\\nhoàn toàn có ý định vắt kiệt chỉ riêng tinh dịch của tôi!!"
1852 = "Và rồi, nhắm vào chỗ còn chưa tô màu.\\nTận sâu bên trong hậu môn của Hibiki――"
1853 = "Và rồi, một lần nữa, hướng về phía chiếc miệng đang há to kia――"
1854 = "Một lúc sau, em ấy thở hắt ra một hơi dài, rồi tiếp tục,\\nmột cách thật thà và nghiêm túc――đúng chuẩn Hibiki."
1855 = "Và rồi dương vật của tôi được giải phóng khỏi miệng Hibiki――"
1857 = "Dù vậy vẫn không hề tách rời.\\nLà do miệng tử cung, hay đỉnh quy đầu, hay là do cả hai――"
1860 = "Chỉ là một mặt, mặt dưới, đang được Hibiki ôm hờ lấy,\\nvà áp sát vào rãnh âm đạo, vào phần bên trong của nó mà thôi."
1861 = "Chẳng hiểu sao tôi lại nhớ đến điều đó,\\ncảm giác vừa vui sướng, lại vừa có chút tiếc nuối."
1863 = "Trên cơ thể Hibiki, bằng màu vẽ của cả hai chúng tôi.\\nĐể pha trộn những màu sắc ấy――"
1868 = "Cơ địa làn da. Chất lượng của ái dịch và dịch nhờn.\\nCó lẽ tất cả những thứ đó đã kết hợp với nhau một cách gần như hoàn hảo――"
1874 = "Sướng thật đấy. Chính vì sướng,\\nnên lại càng muốn, càng đòi hỏi nhiều hơn nữa."
1877 = "Chuyển động bất ngờ, cùng với sự cọ xát mãnh liệt giữa cơ quan sinh dục và cơ thể,\\nkhiến tôi bất giác thốt lên thành tiếng."
1881 = "Nhớ lại lần đầu tiên đâm vào, đau đớn đến mức,\\nchỉ toàn là sự chật hẹp, khít khao và nhiệt độ cao ngất."
1886 = "Tinh dịch sủi bọt phình to, vùng vẫy chực chờ tuôn trào khỏi lỗ niệu đạo.\\nTôi cắn chặt răng hàm, cố kìm nén nó lại một chút!"
1893 = "Dù vậy, nó vẫn chỉ là một cảm giác vẫy gọi nhau vô cùng mong manh\\ngiữa da thịt với da thịt."
1896 = "――Tôi không hề đút vào."
1899 = "Vừa xuất tinh tôi vừa ấn sâu vào miệng em ấy――!!?"
1905 = "Da, âm đạo, miệng. Màu vẽ tinh dịch của tôi quả thực\\nđã nhuộm đẫm một phần lớn cơ thể Hibiki."
1934 = "Sự mút mát kết hợp với chuyển động của lưỡi. Cùng với những cái cắn yêu từ vành môi."
1935 = "Chuyển động của chiếc lưỡi dần xóa tan đi sự ngần ngại."
1938 = "Quả thật, hậu môn cũng rất tuyệt.\\nNhưng――mục đích của lần làm tình hôm nay là――"
1941 = "Âm đạo co thắt một cách bạo lực.\\nChỉ là một cơn sóng dữ dội thoáng qua."
1944 = "Âm đạo vừa ôm trọn vừa đồng thời uốn lượn."
1945 = "Hướng tới đỉnh điểm, hướng tới lúc xuất tinh,\\nđể rót trào tinh trùng vào tử cung em ấy, vì mục đích đó!"
1946 = "Những nếp thịt mềm mại ấy dán chặt lấy dương vật không một khe hở,\\nvừa bám chặt ôm ấp siết chặt, vừa không ngừng nhu động."
1948 = "Đến mức khiến chính Hibiki cũng ảo tưởng rằng mình \"đang bị cử động\",\\nchuyển động của các nếp gấp, cảm giác ấy quá đỗi rõ ràng khiến tôi nổi cả da gà."
1953 = "Dùng từ \"lực hút\" thì có vẻ hơi khoa trương,\\nnó chỉ là một cảm giác dính nhớp mờ nhạt và mong manh, tựa như nghiền nát một hạt gạo vậy."
1958 = "Sự bối rối, và cảm giác ngạt thở.\\nNhưng trong giọng nói ấy rõ ràng còn pha lẫn cả niềm vui sướng tột độ!"
1960 = "Những chuyển động tham lam tìm kiếm điểm sướng nhất ấy thật đáng yêu,\\nkhiến tôi cũng muốn giúp em ấy một tay."
1961 = "Điều đó, khiến tôi thật sự vui mừng. Vui sướng tột độ.\\nNghĩ đến việc Hibiki là người phụ nữ của mình――tôi lại càng muốn nhuộm đẫm toàn thân em ấy!"
1962 = "Nghĩ vậy, tôi bỗng thấy nhẹ nhõm hơn đôi chút."
1963 = "Đang tăng tốc.\\nTăng tốc theo một đường thẳng, đẩy mọi thứ đến giới hạn cuối cùng――!?"
1966 = "Nếu vậy thì, không cần phải khách sáo nữa.\\nCứ để bản năng của tôi lên tiếng――"
1968 = "――Chỉ bằng một lực rất nhỏ, rất khẽ.\\nNhưng chắc chắn đang níu kéo lẫn nhau."
1969 = "Dù vậy, tôi vẫn cảm nhận được rõ ràng âm đạo của Hibiki đang khao khát tôi."
1976 = "Đầu tiên là đôi môi.\\nLớp son tinh dịch từ từ bôi bẩn đôi môi căng mọng của Hibiki."
