2136 = "「Năm phút——à không, mười phút thì tôi có thể sắp xếp thời gian ngay. Cậu truyền đạt lại như vậy giúp tôi.」"
2138 = "「Về ngày dự kiến, nếu được thì anh cho Mikuro xin vài ngày nhé.」"
2141 = "「Đứa nào đùa giỡn trên bệ bước chân là chú bắt xuống ngay lập tức đấy. Lỡ xảy ra tai nạn gì thì chiếc đầu máy hơi nước này có thể bị tháo dỡ mất.」"
2143 = "「Nếu cô ấy đồng ý đợi, thì sẽ phải chờ hơn hai tiếng đồng hồ, nên trong lúc đó, cậu có thể——」"
2146 = "「Về chuyện sợ bẩn thì chúng ta sẽ cho thuê quần áo. Việc 『Mặc đồng phục màu』 đối với chúng ta đã là chuyện đương nhiên, nhưng mà...」"
2147 = "「Nếu thấy rít thì nhỏ dầu xung quanh cho thấm vào. Tóm lại, hãy tránh việc cố quá làm hỏng nó.」"
2149 = "「Nó chỉ trở thành chuyện xấu khi không mang lại kết quả gì—— và sự méo mó đó cứ mãi là sự méo mó mà thôi.」"
2150 = "「Nếu không có hành động của Mikuro, biết đâu D51 1031 cứ thế mà bị tháo dỡ rồi cũng nên.」"
2152 = "「Nếu chúng ta làm một cuốn sổ tay bảo dưỡng, và xin thông tin liên lạc của những người có nguyện vọng thì càng tốt.」"
2155 = "「Vì thông báo không hiệu quả—— A! Ra vậy, nếu đã thông báo mà vẫn không có ai đến thì.」"
2157 = "「Nếu có thể nhìn lại những ghi chép đó thì chắc chắn sẽ tuyệt hơn nhiều! Giống như Gamadasu, giống như phòng trưng bày của mọi người vậy――――」"
2161 = "「Đúng rồi! Em đã rất vui! Hồi lần đầu tiên được mặc ấy! Em đã rất phấn khích vì cảm thấy 『Giống như mình đã trở thành lái tàu vậy』!」"
2162 = "「Đúng rồi! Có hay không khác nhau một trời một vực luôn đó.」"
2163 = "「Đúng rồi! Còn lại thì photo nguyên bản làm tờ rơi, để dòng chữ 'Xin cứ lấy tự nhiên' cũng được.」"
2164 = "「Giống như lễ hội đường sắt vậy! Quán cà phê tuyệt quá.」"
2167 = "「Ngay lúc này, Mikuro. Đem tờ rơi phát cho hai người kia đi. Đưa cho bạn nữ ấy.」"
2168 = "「Một trong số ít những người em gái của Hachiroku đã đến thăm mà. Với tư cách là Master của Hachiroku, hãy để tôi thể hiện chút phong độ chứ.」"
2174 = "「Thành phố phải bình đẳng với mọi người dân. Và nếu hỗ trợ mọi thông báo, thì có thể sẽ bị kẻ xấu lợi dụng.」"
2177 = "「Mikuro được người của tòa thị chính hướng dẫn ạ. Họ bảo là do anh Soutetsu mời.」"
2182 = "「Thị trưởng giỏi thì đương nhiên rồi, nhưng công việc thư ký của thị trưởng, Mikuro cũng thấy rất tuyệt vời.」"
2185 = "「Bình thường thì không được đâu. Cấm vào đấy. Vì nguy hiểm lắm. Nhưng hôm nay chú đã được cấp phép đặc biệt để dọn dẹp rồi.」"
2192 = "「Có chuyện gì sao?」"
2193 = "「Gì chứ, về trong ngày sao? Nếu đi xe buýt thẳng đến Kumamoto thì…… chà, dư sức về đến Omuta trong hôm nay, nhưng mà——」"
2196 = "「Nghĩ ngợi sao——」"
2198 = "「Không hẳn là đánh giá của anh hai……mà là——cách nhìn nhận sự việc ấy? Bản thân em thấy mình không thay đổi gì nhiều so với trước đây cả.」"
2200 = "「Tôi không biết có nên làm vậy không—— bởi vì người đến tìm ngài, là một Railord.」"
2204 = "「Mikuro cũng mong là có người đến. Xin lỗi nhé, chẳng có ai đến cả.」"
2207 = "「Chúng tôi thì hoàn toàn không có vấn đề gì, nhưng——」"
2210 = "「Em muốn làm thử! Một chiếc đầu máy tồi tàn như vậy, từ trước đến giờ em chưa từng đụng tay vào.」"
2212 = "「Chị hiểu!」"
2213 = "「Cháu! Cháu muốn làm! Cho cháu làm thử với!」"
2216 = "「Tôi hiểu rồi. Nếu cô ấy muốn gặp ngay bây giờ thì sao ạ?」"
2218 = "「Anh chỉ đơn giản là nghĩ vậy, nên mới thành thật khen ngợi em thôi.」"
2219 = "「Trong khả năng của mình, tôi sẽ giúp đỡ. Trên đường về nhớ cẩn thận nhé.」"
2222 = "「Bây giờ chú chuẩn bị \\x%l罐磨;#00ffc040;cọ rửa lò hơi%l;#; đây——mấy đứa có muốn phụ một tay không?」"
2224 = "「Bất ngờ lắm sao? Về đánh giá của anh ấy.」"
2226 = "「Tôi hiểu rồi.」"
2227 = "「Thấy rồi, cuối cùng cũng thấy rồi! Đoàn tàu của em!! Đoàn tàu ăn uống lý tưởng của em!!」"
2228 = "「Đâu để anh xem nào.」"
2229 = "「Anh cũng không thể bình tĩnh mà tự đánh giá xem ý tưởng đó có hay hay không, nhưng—— Phương pháp bảo tồn kiểu 『Cho phép du khách tham gia bảo dưỡng』 thì sao?」"
2231 = "「Tôi đã hẹn ăn trưa cùng Hibiki——thị trưởng. Nếu Mikuro không phiền, chúng ta có thể vừa ăn vừa nói chuyện được không.」"
2232 = "「Em thì, cơm rang dưa cải và canh Dago. Tráng miệng là……pudding \\x%lキハ07s;#00ffc040;KiHa 07S%l;#;.」"
2236 = "「Này anh hai? Người em có bị ám mùi dầu, hay mùi bụi bặm gì không vậy?」"
2238 = "「Mời mọi người!」"
2240 = "「Có lẽ vậy. Nếu cần phải loại bỏ amiăng, thì bắt buộc phải nhờ đến các đơn vị chuyên môn rồi——」"
2242 = "「Bởi vậy mới phải suy nghĩ. Làm thế nào để biến thành quả lần này ——trở thành cơ sở bảo tồn D51 1031, và cả cỗ máy của bé Mikuro nữa.」"
2244 = "「Thế nên, hãy cùng nhau tạo ra thành quả nào. Bảo dưỡng và bảo tồn D51 1031, từ đó dẫn đến việc bảo dưỡng và bảo tồn 38696 của Mikuro.」"
2249 = "「Vì vậy, mọi người đều rất bận tâm chuyện không thể bảo dưỡng cho [đứa bé nhà Mikuro,4]38696. Điều đó lại càng khiến Mikuro cảm thấy áy náy hơn.」"
2252 = "「Chính vì vậy, nên mới có chuyện lúc nãy ạ.」"
2255 = "「Xin lỗi. Thư ký Migita.」"
2258 = "「Hay là mời cô ấy đi chuyến xuôi dòng sông Kuma nhé? Vừa vặn 20 phút nữa có thuyền khởi hành.」"
2261 = "「Mikuro khá thích ạ. Tất nhiên ngon nhất vẫn là than đá—— ơ, a, có than đá này! ……Ủa? 'Gà rán than đá'?」"
2262 = "「Phần còn lại thì mấy đứa cứ dùng tấm vải lau máy này để cọ lò hơi là được. Nếu muốn thêm dầu thì đưa chổi quét cho chị gái ở dưới kia nhé.」"
2266 = "「Vải lau máy còn nhiều lắm, mọi người cứ dùng thoải mái nha.」"
2267 = "「Cọ rửa lò hơi á!? Gì vậy, nghe có vẻ thú vị quá!」"
2274 = "「Nếu không phải mục đích du lịch, thì là chuyện liên quan đến chiếc Degoichi ở Yufuin sao?」"
2282 = "「Lý do Hibiki và tôi yên tâm là vì 'chưa có thông báo nào được đưa ra'. Bởi vì như thế thì tình hình vẫn còn khá hơn nhiều.」"
2284 = "「Chị Hibiki nhờ vả giỏi quá đi mất. Mọi người đều cười tươi và vui vẻ cho dán luôn.」"
2285 = "「Hibiki. Có lẽ em nên tự hào về anh đi là vừa.」"
2287 = "「Vào thứ Bảy hoặc Chủ nhật. Lịch trình mà người bình thường dễ tham gia ạ. Mikuro sẽ điều chỉnh theo lịch trình của hai người.」"
2289 = "「Đã rõ.」"
2291 = "「Ra là vậy. Dùng chúng tôi làm bảng hiệu sao.」"
2297 = "「Đúng chứ. Anh cảm thấy niềm vui đó, cùng với trải nghiệm bảo dưỡng và dọn dẹp, có thể được tận dụng như một nguồn tài nguyên du lịch đấy.」"
2299 = "「Đúng vậy. Thông báo cho người dân địa phương thực sự rất quan trọng. Đặc biệt là ở Yufuin, vì du khách cũng có thể nhìn thấy poster mà.」"
2300 = "「Đúng vậy nhỉ.」"
2302 = "「Ra vậy! Nếu có ai đó muốn tham gia dọn dẹp, thì tấm áp phích này sẽ giúp họ dễ dàng tham gia hơn nhỉ.」"
2304 = "「Ra là vậy, em nói anh mới để ý. Nếu muốn tận dụng, thì họ đã làm từ lâu rồi——」"
2305 = "「Ra là vậy——Mọi người cùng nhau làm từng chút một. Tập hợp sức mạnh lại——Ngược lại, chỗ nào phân tán được thì phân tán.」"
2307 = "「Đúng vậy, nếu là ở đó thì quá lý tưởng.」"
2309 = "「Vậy sao. Thế thì chúng ta di chuyển một chút nhé—— À, trước đó.」"
2310 = "「Ồ.」"
2311 = "「Vậy sao? À, không—— Ra vậy, đúng là thế nhỉ.」"
2312 = "「Vậy sao. Tôi sẽ uống cà phê. Tráng miệng thì chọn từ trang này nhé. Còn Hibiki thì sao.」"
2314 = "「Chắc là đang dọn dẹp đầu máy hơi nước nhỉ. Người dân địa phương đang nỗ lực làm việc kìa.」"
2315 = "「Vâng. Sau những buổi họp, Mikuro hay đi cùng mọi người trong sở thú ạ.」"
2317 = "「Vâng.」"
2318 = "「Được chứ. Nhưng nhớ dùng phần sạch của tấm vải lau máy để cọ nhé.」"
2321 = "「Đúng vậy ạ! Cho nên Mikuro——với Mikuro hiện tại, quả nhiên——bây giờ, vẫn chưa thể gặp được đâu ạ.」"
2323 = "「Đúng vậy nhỉ! Mikuro cũng, rất muốn làm như vậy.」"
2325 = "「Vâng! Họ bảo là 'Nếu chỉ chừng đó thì được'. Sau vài lần trò chuyện, họ đã chấp nhận rồi ạ.」"
2326 = "「Vâng, có người muốn gặp mặt mà không hẹn trước. Đáng lẽ tôi sẽ hướng dẫn họ đặt lịch hẹn lại, nhưng mà.」"
2329 = "「Cái này sẽ được phóng to ra, và dán ở gần chỗ làm việc đúng không?」"
2330 = "「Vâng!」"
2340 = "「Cậu làm vậy thì giúp tôi nhiều lắm. Tốt nhất là hẹn cô ấy quay lại phòng này vào buổi trưa.」"
2341 = "「Chắc hẳn phải có lý do chính đáng nhỉ?」"
2345 = "「Món nào cũng ngon lắm đó nha? À, Mikuro với đồ ăn của con người thì sao nhỉ.」"
2351 = "「Đúng vậy. Có khả năng chiếc D51 1031 này đã hoàn toàn bị người dân địa phương coi là 'thứ không muốn nhìn thấy'. Nhưng mà.」"
2352 = "「Đúng vậy đúng vậy! Nếu không làm thế—— Mikuro, không thể gặp mặt chị Hachiroku được.」"
2361 = "「Khi nào đi dọn dẹp Mikuro sẽ xin nghỉ vào Thứ Bảy hoặc Chủ Nhật, nên bình thường Mikuro muốn làm việc chăm chỉ để bù vào phần đó.」"
2366 = "「Tại sao?」"
2372 = "「Vậy, nhé? Anh hai. Về chuyện của Mikuro lúc nãy——」"
2373 = "「Tập hợp những người đó lại, và tiến hành bảo dưỡng hạng nặng vài tháng một lần. Như là đánh rỉ, trám lỗ bằng matit, hay sơn lại chẳng hạn.」"
2374 = "「Thế là có thể tuyên truyền rằng 'Lái tàu hơi nước đương nhiệm của Đường sắt Ohimitera và Thị trưởng Ohimitera cũng tham gia dọn dẹp D51'! Như vậy thì làm được rồi.」"
2375 = "「Như vậy sẽ tăng số lượng người tham gia ở địa phương, dẫn đến việc bảo dưỡng, và dẫn đến việc bảo tồn.」"
2377 = "「Thoải mái lắm ạ. Mọi người đều rất tốt bụng.」"
2380 = "「Tình trạng của nó tệ hơn dự đoán nhiều. Trong hoàn cảnh đó mà lỡ trở nên nổi tiếng với bọn trẻ con thì——」"
2382 = "「Chú cũng vừa mới quét dọn xong. Dầu——không.」"
2384 = "「Không cần phải tranh giành thứ tự đâu, mọi người có thể làm cùng một lúc mà.」"
2386 = "「Đôi vợ chồng kia cũng tham gia nữa nhỉ! Nhưng mà—— Du khách thì khó mà trở thành đối tượng nhắm đến của thông báo được đúng không?」"
2387 = "「Vẽ xong rồi!!」"
2389 = "「Sống ở đó thoải mái lắm nhỉ.」"
2392 = "「Đỉnh thật đấy, cái này chỉ cần chà xát mạnh thôi mà chỗ cọ xong đã đen bóng lộn lên rồi kìa.」"
2393 = "「Đỉnh quá! Cháu cũng muốn làm thử.」"
2396 = "「Hiểu rồi. Vậy thì tham gia thôi.」"
2398 = "「Đúng là vậy. Nhưng mà……để phục hồi từ tình trạng đó, quả nhiên vẫn cần có sự can thiệp của chính quyền các thứ.」"
2402 = "「Đợi em một chút~」"
2403 = "「Trả lời tốt lắm.」"
2411 = "「Mikuro……hoàn toàn không biết chuyện đó. Nên mới nghĩ, vì đây là việc tốt, chắc sẽ được giúp đỡ thôi.」"
2413 = "「Mikuro đi cùng được sao ạ? Mikuro vui lắm! Vì Mikuro đến đây là để nói chuyện với anh Soutetsu và Hibiki mà.」"
2415 = "「Mikuro cũng nghĩ vậy! Nên cái này——Mikuro sẽ đi photo ngay bây giờ!」"
2417 = "「Mikuro, hoàn toàn không có ý định đi du lịch đâu——a! Nhưng mà, chuyến xuôi dòng sông Kuma vui lắm ạ. Cảm ơn anh.」"
2419 = "「Mikuro đã dán áp phích trong sở thú, cũng có phát tờ rơi nữa. Nhưng mà, với người bình thường thì từ Omuta đến Yufuin có vẻ xa quá.」"
2421 = "「Mikuro nghĩ, được sở thú nhận nuôi cùng với [đứa bé nhà Mikuro,4]38696 thật là tốt quá.」"
2428 = "「Mikuro muốn thử uống loại 'Dầu diesel cao cấp (không phải dầu diesel thật)' này ạ.」"
2429 = "「Mikuro đưa được rồi ạ.」"
2431 = "「Mikuro sẽ cẩn thận ạ! Thật sự cảm ơn hai người đã dành thời gian dù đang rất bận rộn.」"
2435 = "「Mikuro có mua cả khẩu trang nữa ạ.」"
2436 = "「Mikuro xin phép.」"
2438 = "「Lúc nào chị cũng sẵn sàng bôi dầu cho nhé~」"
2439 = "「Mikuro cũng muốn thử tắm suối nước nóng ở Ohimitera lắm, nhưng nếu không về được thì sẽ làm phiền mọi người trong sở thú mất.」"
2441 = "「Mikuro, giữ chổi giúp tôi một lát nhé.」"
2443 = "「Nếu ở đó, bản thân việc này đã có thể trở thành tài nguyên du lịch rồi! Kiểu 『Cỗ máy bảo tồn tồi tàn đang được sửa chữa nhờ bàn tay của mọi người』 ấy.」"
2445 = "「Hơn nữa, gợi ý——một gợi ý nào đó liên quan đến thiết kế. Biết đâu em có thể tìm thấy từ việc đó.」"
2447 = "「Được cô khen vậy, chúng tôi cũng rất vui.」"
2449 = "「Không biết……có mở được không đây——lỡ tay nắm mà gãy cái rắc thì làm sao.」"
2451 = "「Được cô nói vậy tôi thấy rất vinh dự. Nhưng mà này.」"
2458 = "「Nếu tạo ra được một chu trình như vậy, thì không cần phải phụ thuộc vào cá nhân, mà vẫn có thể vừa tận dụng du lịch vừa thực hiện \\x%l静態保存;#00ffc040;lưu tĩnh%l;#; được.」"
2465 = "「Biết đâu lại có những người học được kỹ thuật rồi biến việc bảo dưỡng đường sắt thành công việc thực sự luôn cũng nên!」"
2466 = "「Dạ, Mikuro, vẫn chưa làm được gì cả ——nếu muốn gặp chị Hachiroku, thì phải có thành tích gì đó chứ ạ.」"
2467 = "「Được cấp phép đặc biệt luôn kìa.」"
2468 = "「À ừm, thế nghĩa là sao ạ?」"
2469 = "「Chú ơi, mấy cái chỗ giống như tấm bảng này, cháu dùng cái này cọ luôn có được không ạ?」"
2470 = "「Xin gửi vào điện thoại của Mikuro ạ!」"
2471 = "「Cảm ơn em.」"
2472 = "「Cảm ơn anh, Tomo.」"
2473 = "「Cảm ơn anh. Lái tàu Migita.」"
2474 = "「Cháu cảm ơn ạ!」"
2475 = "「Việc bác thợ cắt tóc cho dán poster nói rằng lần tới nhất định sẽ tiếp tục ủng hộ cũng là một tín hiệu tốt đấy chứ.」"
2476 = "「Những du khách qua đường sẽ được trải nghiệm thực tế việc dọn dẹp và bảo dưỡng nhẹ nhàng trong trang phục của nhân viên đường sắt.」"
2489 = "「Xưởng đầu máy Bunkomori! Nhà máy chế tạo toa xe!!」"
2491 = "「Đến mức đi lại trên này cũng thấy sợ. Phải cẩn thận thôi—— Mikuro, đưa chổi cho tôi.」"
2503 = "「Ý hay đấy. Cậu hỏi thử xem, nếu cô ấy muốn đi thì sắp xếp giúp tôi nhé? Đến bến thuyền thì dùng Navi của tôi đưa đi.」"
2504 = "「Thực đơn này hả? Là do mọi người ở Đường sắt Ohimitera cùng nhau nghĩ ra đấy.」"
2505 = "「Hài quá! Cái gì kia!!」"
2506 = "「Đến lúc đó, ở chỗ chiếc 8620 của Mikuro, chắc chắn cũng có thể bảo dưỡng và phục hồi bằng phương pháp tương tự!」"
2507 = "「Nếu vậy, cô có thể đi gặp Hachiroku cũng được.」"
2508 = "「Nếu tiến hành như vậy, tôi có thể tự quyết định mà không cần báo lại cho ngài chứ?」"
2509 = "「Chuyện đó thì, Mikuro không làm được, nên đã nhờ người ở tòa thị chính là 'Nếu được thì xin hãy giúp tôi'.」"
2514 = "「Việc bôi dầu cũng được tính là dọn dẹp! Đúng là Railord có khác! Cảm giác rất am hiểu luôn á~!」"
2515 = "「Quyết định gọi món trước đã nào.」"
2516 = "「Ngoài những người đã nhắc đến lúc nãy, còn có mấy cậu bé chơi bóng đá nữa. Bọn nhóc đó cũng muốn tham gia lại.」"
2519 = "「Xin lỗi, chúng tôi cũng có thể giúp dọn dẹp được không ạ?」"
2521 = "「Cả cặp đôi kia nữa, nếu chúng ta tổ chức lại, và họ biết được thì em nghĩ họ cũng sẽ đến thôi.」"
2522 = "「Thế thì tốt quá.」"
2524 = "「Nếu cần thành tích. Thì cứ tạo ra và chứng minh nó bằng cách hồi sinh ngoạn mục chiếc Degoichi này, hay chính chiếc 8620 của Mikuro là được.」"
2526 = "「Vậy thì, bắt đầu thôi.」"
2528 = "「Vậy tôi cũng gọi món cà ri SL thêm topping gà rán than đá. Mikuro, cô uống gì?」"
2530 = "「Vậy tôi sẽ bắt đầu bằng việc quét dọn. Hibiki, bên trong cửa buồng khói nhờ em được không?」"
2532 = "「Nếu vậy để em! Em sẽ vẽ một tấm áp phích đơn giản ngay bây giờ!」"
2533 = "「Vậy, Mikuro. Dự định tiếp theo của em là gì?」"
2536 = "「Mikuro, xin phép nhận tấm lòng của anh ạ!」"
2537 = "「Chỗ đó, leo lên có được không ạ?」"
2539 = "「Vậy thì!」"
2540 = "「Vậy, Mikuro sẽ gọi món gà rán than đá. A! Có thể thêm làm topping cho món cà ri SL này không ạ?」"
2543 = "「Vậy thì, lần này chúng ta bắt đầu thật thôi. Mặc dù vậy, đây cũng là lần đầu tiên chúng tôi dọn dẹp một thứ hư hỏng đến mức này.」"
2545 = "「Cô đã tiến hành thông báo ở địa phương như thế nào vậy?」"
2550 = "「Railord.」"
2551 = "「Chỉ có Railord thôi sao? Đi một mình à?」"
2552 = "「Lễ hội đường sắt, ở đâu vậy?」"
2559 = "「Anh hai làm hướng dẫn viên sao?」"
2562 = "「Anh Soutetsu làm việc trong phòng thị trưởng nhỉ. Mikuro thấy, anh giỏi thật đấy.」"
2563 = "「Quá xa các cứ điểm đường sắt. Cần phải có ít nhất một người, dù là thay ca thì cũng phải luôn có mặt. Cần có 『người có khả năng giám sát và hướng dẫn bảo dưỡng, dọn dẹp』 thường trực——」"
2564 = "「Cảm ơn hai người ạ. Vậy thì, hai người cứ leo lên từ chỗ đó ——À mà, hai người có leo lên được không ạ? Có ổn không?」"
2569 = "「Đầu tiên, việc thông báo ở địa phương Yufuin hoàn toàn chưa được thực hiện. Đây là phản ứng hết sức hiển nhiên của thành phố.」"
2571 = "「（Chụt!）」"
2707 = "Vừa nghe câu đó, vẻ mặt Hibiki liền dịu đi."
2708 = "Vừa mới xác nhận, Mikuro liền lộ vẻ mặt vô cùng áy náy."
2710 = "Chiếc D51 1031 được vẽ bằng những nét đơn giản, và những người đang đứng xếp hàng đánh bóng nó."
2711 = "Tôi vô ý quá——hay nói đúng hơn là không được tinh tế. Bây giờ vẫn chưa đến 13 giờ, giờ này thì——"
2714 = "Nhưng trên môi Mikuro, ngay lập tức hiện lên một nụ cười dịu dàng——trông rất hạnh phúc."
2719 = "Hay là do đang được chạm tay vào 『Đầu máy hơi nước』. Chính sự phấn khích đó đã làm tăng khả năng tập trung của bọn trẻ nhỉ."
2721 = "Hôm nay cũng vậy, và lần đầu gặp mặt cũng thế."
2725 = "……Đúng là trẻ con mà. Tôi cứ tưởng bọn nhóc sẽ nhanh chóng chán rồi làm ồn lên cơ, nhưng——"
2727 = "Thế nhưng đột nhiên, đôi lông mày thanh tú của cô ấy cụp xuống đầy vẻ bối rối."
2729 = "Tuy nhiên, nếu con bé cũng kém nhạy bén như tôi, thì chắc chắn Hibiki đã không thể vẽ nên \"bức tranh của Hibiki\" được."
2730 = "Nhưng, tôi càng cố gắng thì gánh nặng của Hibiki càng giảm bớt. Ngược lại, nếu lỡ phạm sai lầm thì——"
2732 = "Nhưng mà——"
2734 = "Nhưng, các loại dụng cụ dọn dẹp đã được chuẩn bị đầy đủ, dựng dựa vào hàng rào bên cạnh D51."
2736 = "Nhưng mà, liên quan đến chiếc D51 1031, tôi có cảm giác thời gian khá là eo hẹp."
2738 = "Quả thực, từng dự án tôi xử lý đều liên quan trực tiếp đến hành chính thành phố, đến tất cả người dân——chắc chắn là một công việc tuyệt vời."
2740 = "Dù vậy mà vẫn có tiếng gõ cửa thì——"
2751 = "Hai người họ đi cùng nhau, cộng thêm tấm áp phích và tờ rơi có độ hoàn thiện cao thế này—— Việc tìm ra lý do để từ chối e là còn khó hơn."
2754 = "Ngay khi mở cửa, đôi mắt với hai màu khác nhau bên trái và phải thích thú nhìn quanh khắp phòng thị trưởng."
2759 = "Lại là tiếng thở dài thườn thượt đó."
2764 = "Trừ khi thành phố Yufuin đứng ra tổ chức hoặc đồng tổ chức, còn không thì dù sự kiện đó có ý nghĩa chung đến đâu, cũng sẽ không nhận được sự hỗ trợ thông báo."
2765 = "Và khi ấn tượng về ngoại quan thay đổi, khả năng mọi người chú ý đến nó một lần nữa——sẽ tăng lên."
2780 = "Ồ, không ngờ mấy đứa nhóc lại đến chỗ mình."
2782 = "Dù không được phép bảo dưỡng lớp sơn, nhưng nếu bôi dầu và đánh bóng, thì ấn tượng về ngoại quan sẽ thay đổi đáng kể."
2790 = "Vì vậy, tôi lui về phía sau hậu trường thì hơn. Nếu là quét dọn, nguyên tắc cơ bản là từ trên xuống, từ trên xuống."
2791 = "Bởi vì thành phố không thể tự mình đánh giá xem nó 'Có ý nghĩa hay vô nghĩa', nên không còn cách nào khác ngoài việc từ chối tất cả mà không có ngoại lệ."
2792 = "Ý đồ hiện ra vô cùng rõ ràng, nên cũng dễ dàng hình dung được con đường phía trước."
2793 = "Vì khoảng thời gian này tôi cần tập trung, nên đã dặn mọi người nếu được thì đừng làm phiền."
2794 = "Vì đây là tình huống có thể dễ dàng phòng tránh nếu chia sẻ kiến thức, nên tôi muốn bổ sung ngay bây giờ trong lúc Hibiki đang vẽ."
2795 = "Thành tích đó sẽ trở thành sự tín nhiệm, nên nếu bị kẻ có ác ý lợi dụng, thì có nguy cơ nó sẽ bị biến thành vật bảo đảm cho hành vi lừa đảo."
2797 = "Dưới chân tôi, bên dưới bệ bước chân. Mikuro đang nở nụ cười đầy hạnh phúc."
2800 = "Với lũ trẻ tuổi này, thay vì dùng từ 『Bôi dầu』 thì——"
2801 = "Việc dán áp phích ở đây chắc cũng chẳng mang lại lợi ích gì nhiều, nhưng nếu là Hibiki và bức tranh của con bé thì——"
2803 = "Từ hoàn cảnh đó mà chúng tôi đã nhận được sự giúp đỡ của rất nhiều người—— Tất cả đều là nhờ có poster và tờ rơi của Hibiki."
2811 = "Chợt lóe lên một tia sáng. Những luồng suy nghĩ cuộn trào mãnh liệt bỗng chốc hội tụ lại thành một."
2815 = "Cô ấy dứt khoát dìm phần gà rán than đá vào toa tiếp than nước, làm cà ri trào ra lóp bóp."
2816 = "Quả nhiên, cô ấy muốn nói chuyện liên quan đến vấn đề đó. Nhưng, Hibiki lại đang hứng thú với chuyện lễ hội đường sắt——à, không."
2820 = "Lấy ra bằng tay phải, đặt tạm lên bàn để mở máy, khởi động ứng dụng máy ảnh, rồi lại cầm lên bằng tay phải——"
2821 = "Bằng giọng nói lớn nhất từ trước đến nay, một sự từ chối mạnh mẽ. Không chỉ tôi, mà cả Hibiki——và cả quán đều ngạc nhiên, cứng đờ người."
2823 = "Nghe cô ấy nói vậy, có lẽ cũng đúng. Dù tôi chỉ thuận theo tự nhiên mà làm thư ký thôi——"
2824 = "Chà——dù là gặp ngay hay đợi đến trưa, thì giải quyết thêm được việc nào hay việc đó."
2827 = "Từ đó về sau, nếu một mình Railord này có thể xin được giấy phép dọn dẹp, thì quả thực rất đáng nể."
2829 = "Nếu con bé cũng kém nhạy bén với người khác như tôi, thì có lẽ Hibiki đã không mang trong mình mặc cảm tự ti đến thế."
2830 = "Nếu là Hachiroku hay Reina thì đương nhiên sẽ nói tên ra, mà vốn dĩ họ cũng có thể ra vào tự do rồi."
2833 = "Đó có thể là một kiểu suy nghĩ méo mó—— nhưng chắc chắn cũng có những lúc sự méo mó đó lại trở thành động lực."
2837 = "Sự tự ti đối với chị Mayami. Sự lý tưởng hóa và lòng ngưỡng mộ dành cho Hachiroku."
2843 = "Khi đã bắt đầu quen tay, bọn trẻ cứ thế lẳng lặng làm, hoàn toàn không nói chuyện phiếm câu nào——"
2845 = "Đúng lúc đó, các món ăn được dọn lên bàn. Mikuro mỉm cười rạng rỡ, lấy điện thoại ra——"
2847 = "Ngay cả khi đánh mất sự tự tin và thu mình lại, Hibiki vẫn luôn——"
2855 = "Trường hợp sau khi nghỉ hưu vẫn ở cùng lái tàu…… có lẽ không nhiều lắm sao."
2857 = "Nhìn tình trạng tay trái của Mikuro, việc cầm chổi leo thang có lẽ là không thể."
2866 = "Tôi khẽ gật đầu tỏ ý \"Xin phép\" rồi gọi điện thoại. Giờ này chắc Hibiki đã kết thúc chuyến thị sát cùng Kisaki rồi——"
2867 = "Lời nói buột miệng của tôi khiến Hibiki phản ứng một cách thái quá. Tôi có chút buồn cười khi nghĩ thầm \"Giờ này còn nói gì nữa\"."
2871 = "Tôi cũng bước lên bệ bước chân hành lang, từ đó leo thang lên nóc lò hơi."
2876 = "Tôi đưa hộp dầu và chổi quét cho Mikuro, rồi đưa vải lau máy cho bọn trẻ."
2877 = "Tôi ghé mũi lại gần Hibiki vừa mới tắm xong."
2878 = "Tôi nhận lấy cây chổi từ tay Hibiki, rồi gọi vọng xuống dưới."
2880 = "Tôi mở hộp dầu ra, nhúng chổi quét cho thấm đẫm dầu. Rồi dùng chiếc chổi đó quét sơ một lớp dầu lên lò hơi——"
2882 = "Tôi đã hiểu lý do Hibiki để tôi lại đây. Cả Hibiki và Mikuro đều có ngoại hình xuất chúng."
2884 = "Tôi gật đầu mạnh mẽ trước lời của Mikuro. 'D51 1031 Hiện đang được tình nguyện viên dọn dẹp.'"
2886 = "Khi tôi trao đổi thông tin liên lạc bằng điện thoại dùng cho công việc thư ký, giọng của Hibiki xen vào như thể đã chờ đợi từ lâu."
2887 = "Nghe tiếng gọi, tôi ngẩng mặt lên thì thấy 3 cậu bé đang ôm quả bóng. Phía xa xa có 5——không, 6 người đang nhìn về phía này."
2889 = "Những ký ức thuở thiếu thời của bản thân, bất chợt ùa về sống động trong tâm trí tôi."
2890 = "Tôi và Hibiki nhìn nhau. Tôi cảm nhận được trái tim và suy nghĩ của chúng tôi đã hoàn toàn hòa làm một."
2891 = "Tôi đã thử hỏi những người đến giúp đỡ, nhưng không một ai có ý định thành lập hội bảo tồn ở địa phương."
2892 = "Tôi cho mấy cậu bé đeo găng tay lao động vào, rồi hỗ trợ đưa từng đứa một lên bệ bước chân."
2896 = "Tôi bước xuống bệ bước chân, quét rác vừa gom xuống mặt đất. Làm vậy thì Mikuro có thể lần lượt thu gom rác lại."
2897 = "Có lẽ, lời nói bất cẩn của tôi, đã gợi nhớ đến Master cũ của Mikuro."
2904 = "Rồi cô ấy đứng nghiêm——và dành cho tôi một cái chào, giống hệt như của Hachiroku."
2940 = "Vừa ăn, chúng tôi vừa quay lại chủ đề mà tôi đã bỏ lỡ lúc nãy."
2941 = "Hibiki vươn dài cánh tay, kéo cuốn sổ phác thảo lại gần trên tấm nệm."
2946 = "Hibiki nhìn tôi gật đầu, rồi nhẹ nhàng gấp cuốn sổ phác thảo lại. Nếu vậy thì chuyện lễ hội đường sắt để sau cũng được."
2948 = "Chắc là con bé ghen tuông chút đỉnh thôi. Đôi má đang phồng lên của Hibiki nhanh chóng xẹp xuống."
2949 = "Có lẽ đã an tâm hơn, Hibiki cũng vui vẻ nói theo. Mikuro lập tức há to miệng đón lấy thìa có nguyên miếng gà rán——"
2952 = "Hibiki đang đồng cảm với tôi—— Cảm nhận được điều đó, ý chí của tôi lại càng dâng cao."
2953 = "Có lẽ Hibiki cũng có cùng suy nghĩ, nên vẻ mặt con bé hơi cứng lại."
2956 = "Hibiki thở dài một hơi thật nhẹ—— nhưng lại chứa đựng rất nhiều cảm xúc."
2958 = "Hibiki gật đầu thật mạnh, nhưng trong chăn, con bé lại cựa quậy với vẻ bất an."
2959 = "Đầy hào hứng, Hibiki định mở cuốn sổ phác thảo ra. Chuyện trò rôm rả thì tất nhiên là rất tốt, nhưng mà——"
2960 = "Giọng nói đầy hứng khởi của Hibiki khiến dòng suy nghĩ của tôi càng thêm tăng tốc. Cách này, khả thi đấy——"
2962 = "Nghe Hibiki nói vậy, tôi chợt nhận ra. Chỉ vì ngôn từ mang tính chính trị nên tôi mới cảm thấy như thế thôi."
2968 = "Khẩu hiệu quảng cáo lớn nhất, không hề che khuất bức tranh mà lại rất nổi bật."
2969 = "Bằng bàn tay trái với những ngón tay có vẻ không cử động được nhiều, cô ấy chạm vào màn hình để chụp ảnh."
2971 = "Cảm giác thành tựu khiến chúng tôi muốn làm như vậy—— Chắc chắn chúng tôi đã nắm bắt được rồi."
2984 = "Để câu chuyện không bị lạc hướng thêm nữa, có vẻ tôi nên chủ động đi sâu vào vấn đề hơn."
2990 = "Nếu tay nắm cửa buồng khói xoay được, thì có lẽ bản thân cửa buồng khói cũng——"
2991 = "Tất nhiên, việc mở rộng phong trào quần chúng, từ đó đưa tiếng nói đến chính quyền——đó mới là con đường đúng đắn và lý tưởng."
2992 = "Có lẽ bản thân con bé cũng nhận ra điều đó."
2996 = "Sự cứng đờ của Hibiki tan biến trong chớp mắt. Đồng thời, con bé nắm chặt lấy hai tay Mikuro."
3005 = "Quả thực, tôi cảm thấy từ trước đến nay, Hibiki vẫn luôn nhìn nhận sự việc theo cách như vậy."
3012 = "Đột nhiên, Hibiki cứng đờ người lại."
3015 = "Nụ cười biến mất khỏi khuôn mặt Mikuro. Tôi giật mình."
3020 = "Mikuro lộ vẻ ngơ ngác, nhìn luân phiên giữa tôi và Hibiki——rồi dừng ánh mắt ở tôi."
3025 = "Mikuro lại đưa mắt nhìn quanh một vòng. Đó là món được yêu thích. Chỉ cần nhìn quanh là sẽ thấy ngay——"
3027 = "Mikuro xách một túi mua sắm lớn bằng tay phải, lảo đảo đi về phía này ——á!"
3029 = "Mikuro chạy lạch bạch tới, đưa tờ rơi cho bạn nữ."
3032 = "Mikuro có tinh thần ham học hỏi và không hề sợ hãi. Dù không có cảm giác là một người tài ba, nhưng con bé luôn biết cách cải thiện và tạo ra thành quả."
3034 = "Bàn tay trái của Mikuro, các ngón tay quả nhiên cứ duỗi thẳng đơ. Cô ấy đặt lòng bàn tay lên đĩa với những ngón tay duỗi thẳng như vậy."
3035 = "Đôi mắt Mikuro đảo liên tục. Mỗi lần như vậy, con mắt nhạt màu hơn lại nheo lại rồi mở ra."
3037 = "Đôi mắt Mikuro háo hức nhìn vào phần gà rán than đá chất thành núi."
3038 = "Nói rồi đứng dậy cúi chào, Mikuro lấy từ trong túi của mình ra——"
3041 = "Nói rồi, Mikuro ăn sạch phần pudding."
3042 = "Trả lời một cách vui vẻ, Mikuro cười rạng rỡ hạnh phúc."
3043 = "Vừa nãy cũng coi như là một khoảng nghỉ ngơi ngắn rồi——"
3046 = "Đặt ngay bên cạnh là toa tiếp than nước của đầu máy làm bằng cơm, tất nhiên, bên trong chứa đầy ắp cà ri."
3051 = "Bản thân nó có tác dụng giữ nước, trở thành nguyên nhân làm lò hơi bị rỉ sét và mục nát."
3059 = "Nếu kết hợp với đầu máy hơi nước, giá trị du lịch của \\x%l扇形機関庫;#00ffc040;gara đầu máy hình ngành%l;#; sẽ càng tăng cao hơn nữa."
3062 = "Trong trường hợp thành phố đứng ra thông báo, sẽ tạo ra một thành tích là 'Thành phố XX đã hỗ trợ'."
3072 = "Trong túi là can dầu 4 lít. Nặng trĩu. Sau khi tôi mang đến chỗ dụng cụ dọn dẹp, Mikuro đưa cho tôi đôi găng tay lao động."
3076 = "Thấy cô ấy chỉ dùng tay phải để lấy ví, tôi liền cầm hóa đơn đứng lên."
3094 = "Nói xong, Hibiki lập tức hùng hục vẽ vô số những đường nét lên cuốn sổ phác thảo."
3095 = "Vừa nói dứt lời, Hibiki đã trèo lên thang bằng những bước chân quen thuộc, từ bệ bước chân hành lang tiến đến trước cửa buồng khói."
3096 = "Nói rồi, Hibiki cầm lấy thực đơn, mở ra trước mặt Mikuro."
3097 = "Nói xong, Mikuro cất giọng có vẻ áy náy."
3098 = "Đáy của đống lá rụng này, gần như đã biến thành đất mùn."
3099 = "Mà nói đúng hơn thì, lần này chúng tôi cũng hoàn toàn không xoay xở kịp, nên đã phó mặc hết cho Railord Mikuro."
3116 = "Lá rụng ướt sũng từ bao nhiêu năm rồi không biết. Nếu bị mục nát, có thể sẽ sinh ra mùi hôi thối."
3117 = "Ngay lập tức, Hibiki hơi phồng má lên."
3118 = "Cảm giác chắc chắn đó khiến những ý tưởng cứ thế tuôn trào."
3120 = "Đáng tiếc là công viên này nằm cách con phố chính một con đường. Khả năng khách du lịch đi ngang qua đây là rất thấp."
3123 = "Bạn nữ thoáng chốc lộ vẻ khó chịu, nhưng ngay sau đó liền mỉm cười——à, nhận rồi!"
3124 = "Nếu vậy, có lẽ đã có thay đổi gì đó liên quan đến chiếc Degoichi ở Yufuin——đầu máy D51 1031."
3125 = "Lại còn biết thêm topping nữa. Nhìn cách gọi món, có vẻ Mikuro khá sành sỏi."
3126 = "Trên lò hơi, trên nóc buồng lái—— Toa tiếp than nước thì……hôm nay thật sự là không thể đụng tay vào được rồi."
3128 = "Tuy vẫn còn chút ngây ngô với sự đời của một Railord kiểu Đường sắt Hoàng gia cũ, nhưng chắc hẳn con bé đã tích lũy được nhiều kinh nghiệm quý báu ở sở thú."
3129 = "Dù có hơi tội nghiệp Hibiki, nhưng phần dọn dẹp nổi bật nhất thì vẫn nên để con bé làm."
3130 = "Dù trong lòng muốn nghe chuyện ngay lập tức, nhưng nếu là việc mất nhiều thời gian thì công việc còn lại sẽ rất gay go."
3131 = "Mặc dù vậy, ngay cả khi dùng bữa, Mikuro cũng không hề tỏ ra khó khăn chút nào."
3136 = "Order xong, tôi quay mặt lại phía Mikuro."
3150 = "(Không, vốn dĩ lái tàu của Mikuro còn sống hay không cơ chứ. Nếu không còn……thì Railord bị bỏ lại sẽ ra sao.)"
3152 = "(Ra vậy……cũng cần phải dự tính đến trường hợp người khuyết tật đi chuyến tàu ăn uống nữa.)"
3155 = "(Cạch——cạch——két——)"
3156 = "(Cốc cốc)"
3157 = "（Xoẹt! Xoẹt! Xoẹt!!）"
3159 = "(Ái chà)"
3160 = "(Cạch)"
3161 = "(Kétttt)"
3164 = "(Phụ nữ thì dễ gần và dễ bắt chuyện hơn—— Còn tôi thì trông có vẻ khó gần.)"
3166 = "(Mà nói đúng hơn thì——Mikuro lúc nào cũng hành động đơn độc nhỉ.)"

[selections]
