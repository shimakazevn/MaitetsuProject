[script]
73 = "Những tiếng hô hào của các \\x%lレイルロオド;#00ffc040;Railord%l;#;, hơi quá khích nếu coi là chim mồi."
1170 = "——Hibiki đã không còn sợ hãi nữa."
1176 = "Dù là một câu nói cũ rích, nhưng tôi sâu sắc cảm nhận được rằng, “Lập trường thay đổi con người”."
1183 = "“Trưởng phòng Toa xe”, cũng giống như chức Trưởng phòng \\x%l保線;#00ffc040;Bảo trì đường ray%l;#; của tôi, chắc hẳn là một chức vụ được gán ghép vội vàng."
1190 = "……Giọng nói, cùng với bàn tay đang lay mạnh. Người gọi tôi là anh hai, trên đời này chỉ có một mà thôi."
1192 = "『Thị trưởng Hinai (Paulette) chắc chắn sẽ từ chức』 『Trái phiếu đường sắt sẽ ra sao? Việc giảm sút độ tin cậy là điều tất yếu』"
1198 = "「Định kiến cho rằng \\x%lレイルロオド;#00ffc040;Railord%l;#; và toa xe là một cặp không thể tách rời. Nó lan sang cả toa khách và toa hàng, khiến tầm nhìn của chúng ta bị thu hẹp.」"
1199 = "「Chúng tôi đã xem toa xe như một sinh vật nguyên khối, và coi tuổi thọ của toa xe là tuổi thọ của toàn bộ cấu trúc.」"
1204 = "「Khói trong \\x%l客車;#00ffc040;toa hành khách%l;#;, hết rồi hả?」"
1205 = "「――Xin, cảm ơn mọi người đã đến dự buổi họp báo.」"
1207 = "「――Trên đây là tuyên bố từ chức của tôi.」"
1210 = "「——Quả là một vở kịch tự biên tự diễn hoàn hảo nhỉ.」"
1213 = "「――Tôi nhận thức rõ rằng đó là một thất bại. Vì vậy, tôi đánh giá việc kiêm nhiệm chức thị trưởng và ngành đường sắt đã đến giới hạn.」"
1214 = "「——Một phương pháp đơn giản và hiệu quả như thế này, nhưng chúng ta lại chưa từng thực hiện.」"
1216 = "「——Cô Hinai Paulette hiện vẫn đang là thị trưởng đương nhiệm, và chưa hề có bất kỳ tuyên bố nào về việc đi hay ở.」"
1230 = "「“Nhỡ có chuyện gì thì chắc chắn thành phố sẽ bù đắp”—— Chắc hẳn không ít người đã nghĩ vậy khi mua trái phiếu đường sắt.」"
1233 = "「Nếu là 『Chuyện đó』 thì, em đã sắp xếp các tài liệu liên quan rồi. Chúng ta hãy mang theo nhé.」"
1235 = "「…………」"
1240 = "「……A.」"
1242 = "「……Này, Hibiki. Tiếp tục câu chuyện lúc nãy nhé.」"
1244 = "「……Khéo léo thật đấy.」"
1246 = "「Tóm lại…… nói một cách thẳng thắn thì.」"
1248 = "「……Ra là vậy——Quả thực là thế.」"
1456 = "「Nếu như nước sông Kuma bị ô nhiễm—— những thứ đã mất đi, cháu nghĩ sẽ không thể nào lấy lại được.」"
1459 = "「Bảo là di chuyển cùng lúc nhiều toa xe, chứ Đường sắt Ohimitera đâu cần nhiều toa xe đến thế——!」"
1460 = "「Tám độ! Ba mươi tám độ lận đó!」"
1461 = "「Không phải đâu.」"
1463 = "「Không phải rơi vào đâu? Mà là “bị đẩy vào”.」"
1464 = "「Đừng cố quá sức. Đừng nghĩ mình phải làm giống Paulette.」"
1467 = "「Cả Paulette, Hachiroku, Reina, chị Mayami và anh, tất cả đều là đồng minh, là quân sư, là nhân viên của em.」"
1468 = "「Không được đâu, sao em lại nói sự thật thế chứ——ơ, a! Xin lỗi ạ.」"
1471 = "「Tuy nhiên, khung gầm vẫn còn rất tốt. Nó có thể chạy thêm hàng vạn km nữa.」"
1481 = "「Chủ yếu là thợ sắt, thợ mộc và thợ sơn. Đối với phần \\x%l艤装;#00ffc040;trang thiết bị nội ngoại thất%l;#;, còn cần vải chống cháy, kính, nhựa, thiết bị chiếu sáng, v.v.」"
1486 = "「Nhân, Tài, Phong——được quyết định bởi ba yếu tố đó.」"
1490 = "「Trình bày giải pháp cho vấn đề đó. Và, chuẩn bị cho cuộc bầu cử thị trưởng sắp tới. Đó là hai lý do mà chúng tôi mời mọi người tập trung ngày hôm nay.」"
1499 = "「Nhưng em lại có những sự tích lũy không thể diễn tả bằng lời. Đôi mắt em đã ngắm nhìn vẻ đẹp của Ohimitera nhiều hơn bất kỳ ai.」"
1504 = "「Ý cô là sẽ chắp vá với các \\x%l客車;#00ffc040;toa hành khách%l;#; phế liệu khác, để tạo ra một \\x%l客車;#00ffc040;toa hành khách%l;#; có tình trạng tốt sao?」"
1506 = "「Để thực hiện kế hoạch ban đầu là lấy \\x%l8620;#00ffc040;8620%l;#; làm trục chấn hưng du lịch—— hiện tại, đang có một bức tường dày cản bước đúng không?」"
1509 = "「Cụ thể thì em định chiến đấu thế nào? Theo lời chị Mayami nói thì, bầu cử là」"
1511 = "「Có khác với sự đường đường chính chính của Hibiki không?」"
1512 = "「Lời nói của em hiện tại vẫn chưa đủ sức nặng tích lũy. Do đó, có lẽ bây giờ nó chỉ có thể vang vọng trong một phạm vi gần và hẹp.」"
1514 = "「Thuốc à, cứ để đó cho anh――Hửm? Bôi thuốc?」"
1517 = "「Cứ là chính em là được. Chúng ta——không, anh. Anh mong em sẽ như vậy.」"
1519 = "「Chuẩn bị xong là chúng ta hành động ngay thôi. Bởi vì chúng ta đã bị ép vào thế bị động rồi.」"
1520 = "「Ngốc à, Hibiki.」"
1525 = "「Chưa bàn đến chi tiết nội dung bài báo, nhưng việc tôi có ý định từ chức là sự thật.」"
1528 = "「Hachiroku và Reina đã có thời gian dài tiếp xúc với khách hàng. Thế nên, chắc họ biết cách làm thế nào để thu hút sự chú ý.」"
1531 = "「Có chuyện gì vậy Hachiroku!」"
1540 = "「Đừng cố quá. Nhỡ để cơ thể nhiễm lạnh rồi bệnh nặng thêm thì sao.」"
1542 = "「Ra là vậy. Quay lại vấn đề đó, nước cờ này của Houshou Kisaki, có vẻ như đang nhắm đến hiệu quả chia rẽ 『Nhân』 nhỉ.」"
1548 = "「Và cháu. Là hậu bối của đàn chị Houshou Kisaki——Giám đốc chi nhánh Ohimitera của Ngân hàng Kumamoto—— cháu cũng là một hậu bối khá thân thiết với chị ấy.」"
1551 = "「Nếu coi khung gầm là sự kết hợp giữa \\x%l台車;#00ffc040;giá chuyển hướng%l;#; và \\x%l台枠;#00ffc040;khung gầm%l;#;, thì cấu trúc này tương tự như cấu trúc của một toa xe đường sắt thực tế.」"
1553 = "「Không, nhưng mà――」"
1555 = "「Nhưng, Paulette đã đến giới hạn rồi. Nếu cứ kéo dài chính quyền bù nhìn này, nó sẽ chỉ mang lại sự trì trệ.」"
1557 = "「Nhưng dù vậy, để giúp đỡ chị Paulette, để bảo vệ Ohimitera mà cháu yêu quý, cháu——」"
1558 = "「Hyaっ」"
1560 = "「Ơ——a——cái đó.」"
1561 = "「Ừ, ừm.」"
1562 = "「Ngứ!」"
1564 = "「Ực, ực, ực――」"
1565 = "「Hà――a――hà――hà.」"
1567 = "「Trời ạ, anh đang làm cái trò gì vậy, anh―― Khụ, khụ.」"
1568 = "「Anh ơi, em, đứng dậy được mà?」"
1570 = "「Hơii……」"
1571 = "「Mưー」"
1572 = "「Ưm!」"
1573 = "「A――」"
1574 = "「A」"
1575 = "「A!」"
1577 = "「À, cái này nhỉ.」"
1579 = "「Phù~, sống lại rồi~~」"
1580 = "「Ư～～a～～」"
1581 = "「Ừm——A!」"
1583 = "「Ưm――ưm――lạnh quá―― Auu――cảm giác――thích quá――」"
1584 = "「Vâng…… nhưng mà, em―― thực sự muốn làm tốt chuyện chính trị.」"
1586 = "「À…… đúng vậy.」"
1587 = "「Ừm.」"
1588 = "「Ừm!」"
1589 = "「Vâng. Khác ạ. Nhưng——em cũng không nghĩ cách của đàn chị Kisaki là sai.」"
1591 = "「Ừm, đúng vậy.」"
1593 = "「Hửm?」"
1594 = "「Ồ.」"
1596 = "「Ái chà, đúng rồi nhỉ.」"
1597 = "「Ồ, lạnh phết nhỉ. Cái này có vẻ tốt để hạ sốt đấy.」"
1600 = "「Về chuyện điều chỉnh lực búng trán thì, anh mới là kẻ ngốc.」"
1602 = "「Chủ đề của buổi họp báo hôm nay là, về việc tôi, Hinai Paulette, từ chức thị trưởng.」"
1603 = "「Cụ thể thì, nguồn cung cấp toa xe phế liệu đã có manh mối gì chưa?」"
1604 = "「Báo à? ——っ」"
1607 = "「Ngực――à không, lưng! Anh bôi lên lưng cho em được không?」"
1610 = "「Vậy thì, tốt quá rồi.」"
1611 = "「Làm quá rồi đấy, Hibiki. Làm gì đến mức sốt chết người đâu.」"
1613 = "「Cô ấy có đủ khả năng―― để bù đắp cho sự thiếu hụt kinh nghiệm của mình.」"
1615 = "「Vâng…… anh giúp em nhé.」"
1616 = "「Vậy sao, vậy sao. Thế thì ngoan ngoãn ngủ đi, ngủ đi.」"
1619 = "「Đau…… đau quá…… Trời ạ, anh ơi, em ngốc đến mức đó sao?」"
1620 = "「Đau!?」"
1622 = "「Vâng ạ! Reina, là Railord chuyên dụng của \\x%lキハ07;#00ffc040;KiHa 07%l;#;S. Xin chào mọi người nha~」"
1626 = "「Giả sử Paulette có vẽ tranh đi nữa, cũng chẳng thể bằng một góc của Hibiki. Ngược lại cũng vậy thôi.」"
1634 = "「Đối với \\x%lレイルロオド;#00ffc040;Railord%l;#;, toa xe giống như một phần cơ thể vậy. Chính vì thế, chúng tôi đã có một cái nhìn rập khuôn về tuổi thọ của chúng.」"
1635 = "「Đúng chứ.」"
1637 = "「Vâng! Nếu vậy thì, ờm…… Em nghĩ nó nằm tít bên trong hộp thuốc――ấy ạ.」"
1638 = "「Khoan đã, Nagi!?」"
1640 = "「Trước đây bé Pau đã nói rồi mà, nếu nhận khoản vay thì sẽ bị trói buộc tay chân trong cuộc bầu cử.」"
1642 = "「Nội dung kìa, Sou-chan. Khéo léo ở đây là cách dẫn dắt câu chuyện ấy.」"
1644 = "「Khéo léo là sao……」"
1648 = "「Chính quyền trì trệ thì kinh tế sẽ suy thoái, kinh tế suy thoái sẽ làm tăng cơ hội chào đón nhà máy——là vậy sao ạ.」"
1653 = "「Thị trưởng, cô thấy sao! Cô có nắm chắc dự án này sẽ hoạt động trơn tru không?」"
1662 = "「Tuy nhiên, từ nay về sau, bằng cách dốc toàn lực vào ngành đường sắt, tôi nhất định sẽ thực hiện được việc chấn hưng du lịch thông qua Đường sắt Ohimitera.」"
1666 = "「Tivi ạ! Houshou Kisaki đang xuất hiện trên đó!!」"
1667 = "「Cái nhìn rập khuôn, là sao?」"
1669 = "「Đúng vậy ạ.」"
1672 = "「Cháu không muốn thấy Ohimitera suy tàn, cháu muốn nơi này phát triển, tất nhiên, bản thân cháu cũng có mong muốn đó rất mãnh liệt.」"
1674 = "「Tôi cũng có cùng suy nghĩ đó. Và tôi tin rằng tất cả những toa xe đã phế liệu cũng vậy.」"
1682 = "「Nếu vậy, anh sẽ sắp xếp. Anh sẽ liên lạc với Paulette.」"
1683 = "「Việc gì bọn anh làm được thì cứ để bọn anh làm. Em không cần phải gom hết mọi điểm mạnh của mọi người vào mình đâu.」"
1684 = "「Do đó, Nhân hay Tài. Nếu không tạo được ưu thế ở một trong hai yếu tố đó, thì dù có tạo được Phong, chúng ta vẫn sẽ thua.」"
1685 = "「Kế hoạch của chúng tôi là di chuyển cùng lúc nhiều toa xe, nhằm giảm thiểu chi phí một cách tối đa.」"
1686 = "「KiHa 07S đã cũ rồi, nên không khí bên ngoài, cứ thế ùa vào trong xe luôn đó ạ~」"
1687 = "「Không, mấy cái mục tiêu phấn đấu đó sao cũng được.」"
1690 = "「Cháu là Migita Hibiki. Là con gái út của xưởng rượu Migita, là Trưởng phòng Toa xe của Công ty Cổ phần Đường sắt Ohimitera, và là \\x%l機関助士;#00ffc040;Phụ lái tàu%l;#; tập sự.」"
1693 = "「Em thì…… đâu biết mấy chuyện đó.」"
1694 = "「Em, muốn tất cả mọi người——những người liên quan đến Đường sắt Ohimitera, càng nhiều người cùng xem xét ý tưởng đó càng tốt.」"
1697 = "「Bình thường thân nhiệt em thấp lắm đó, ba mươi tám độ của em chắc cũng phải ngang ngửa bốn mươi độ của người khác đấy.」"
1701 = "「Chắc là vậy rồi. Đàn chị Kisaki và anh trai, có điểm gì đó khá giống nhau mà.」"
1703 = "「Cháu, muốn ứng cử vào cuộc bầu cử thị trưởng. Vì vậy, xin mọi người——hãy cho cháu mượn sức mạnh.」"
1705 = "「Ra là vậy…… Những người đang lo lắng về tương lai của trái phiếu đường sắt, sẽ cảm thấy bất mãn trước quyết định không nhận khoản vay nhỉ.」"
1706 = "「Em phải làm gì―― Em có thể làm gì vì mọi người đây?」"
1708 = "「Anh thay khăn nhé.」"
1709 = "「Tôi là Ichikawa của tờ Kumamoto Shimpo. Cô nói việc kiêm nhiệm đã đến giới hạn, nhưng tiếp tục làm thị trưởng và từ bỏ những việc khác chẳng phải là nghĩa vụ của người được bầu cử công khai sao?」"
1711 = "「Em sẽ chiến đấu bằng sự đường đường chính chính của riêng em. Và sau đó, em sẽ chiến thắng đàn chị Kisaki cho xem.」"
1713 = "「Em có một cách, này thôi.」"
1714 = "「Tất nhiên là em định học hỏi rồi―― Nhưng ngày bỏ phiếu sắp đến nơi rồi…… Thời gian, chắc chắn không đủ.」"
1715 = "「Với em thì, đó chỉ là một buổi họp báo bình thường thôi mà.」"
1718 = "「Vì thế, cháu——dù hiện tại năng lực vẫn còn yếu kém, dù cháu biết mình học hỏi về chính trị chưa hề đủ.」"
1720 = "「Tôi có thể hỏi một câu được không?」"
1721 = "「Ngân hàng chúng tôi không cảm thấy lo ngại về độ tin cậy của trái phiếu đường sắt Ohimitera. Tuy nhiên, chúng tôi cho rằng cần phải giải tỏa những lo âu mà bài báo này nêu ra.」"
1723 = "「Tôi nhận định rằng, nếu tôi vẫn tiếp tục kiêm nhiệm cả chức thị trưởng và giám đốc Đường sắt Ohimitera, thì việc mở rộng kinh doanh hơn nữa là điều không thể.」"
1726 = "「Vì vậy, với tất cả những người đã tập trung tại đây, trước tiên, tôi xin chân thành xin lỗi vì sự thiếu năng lực của mình.」"
1728 = "「Vì vậy, cháu cũng hiểu những gì đàn chị Kisaki đang làm. Nhưng, hơn cả sự thấu hiểu đó, cháu khao khát muốn bảo vệ nơi này.」"
1729 = "「Cảm ơn cô đã giới thiệu, tôi là Hachiroku. Vấn đề của \\x%l客車;#00ffc040;toa hành khách%l;#;, đương nhiên tôi coi đó như chuyện của chính mình.」"
1736 = "「Bảo là chắp vá, thế mấy toa xe làm nguyên liệu đó lấy từ đâu và bằng cách nào?」"
1745 = "「Hibiki……」"
1746 = "「Hibiki!?」"
1748 = "「Có chuyện gì vậy? Hibiki——」"
1749 = "「Vẽ tranh đi, Hibiki. Hãy vẽ bức tranh tương lai về thị trấn Ohimitera mà em hằng mơ ước.」"
1751 = "「Đúng vậy. Hibiki đã không đầu hàng trước sự căng thẳng, em làm tốt lắm.」"
1753 = "「Là, vậy đấy.」"
1754 = "「Vâng ạ. Đúng là vậy đó nha~」"
1757 = "「Với bài báo và buổi họp báo này, dù có nhận khoản vay hay không, bé Pau cũng đã bị dồn vào thế bí rồi.」"
1760 = "「Không sao đâu, em chỉ bị sặc một chút thôi.」"
1761 = "「Tại vì――em căng thẳng quá mà.」"
1762 = "「Không dễ hạ sốt thế sao. Nhưng mà…… không ngờ lại bị sốt do căng thẳng đấy.」"
1763 = "「Đúng vậy. Nếu không thể ngăn chặn tác hại của khói, thì không thể nào đạt được mục tiêu chấn hưng du lịch bằng \\x%l8620;#00ffc040;8620%l;#; được.」"
1765 = "「Đúng là vậy.」"
1773 = "「Chị Paulette giỏi thật đấy nhỉ. Phải nói sao đây, từ diễn thuyết đến ứng đáp đều vô cùng trôi chảy.」"
1775 = "「Vì vậy, để bảo vệ môi trường. Dù không thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;, cháu vẫn mong kinh tế Ohimitera nhất định sẽ vực dậy.」"
1777 = "「Để giải tỏa mối lo ngại này, Ngân hàng Kumamoto chúng tôi, đang chuẩn bị cung cấp khoản vay với lãi suất đặc biệt cho Đường sắt Ohimitera——」"
1778 = "「Để làm được điều đó, dự án cải tạo và bán lại \\x%l客車;#00ffc040;toa hành khách%l;#;, cháu thực sự rất muốn chị Paulette sẽ thành công.」"
1782 = "「Vậy mà em, đừng nói là chị Paulette, ngay cả so với Hachiroku và bé Reina――」"
1786 = "「Reina nghĩ là. Dù Reina có bị hỏng đi chăng nữa, nếu các bộ phận của Reina có thể giúp ích cho ai đó thì Reina sẽ vui lắm ạ~」"
1788 = "「Reina. Lấy thứ đó ra đây.」"
1789 = "「Bây giờ, em cứ thư giãn như vậy đi. Bởi vì ngoài hai chúng ta ra, không còn ai khác đâu.」"
1790 = "「Tất nhiên rồi ạ. Xin mời thầy cúng Akai.」"
1791 = "「Tất nhiên rồi ạ!」\\n「Reina, sẽ giúp một tay nha~!」"
1796 = "「Không phải sốt do căng thẳng sao? Hay là bị cảm lạnh luôn rồi?」"
1798 = "「Cái này! Cái này nè!!」"
1800 = "「Thật tình, chúng ta đã rơi vào một tình thế rắc rối rồi nhỉ.」"
1823 = "「Mặt khác, khung gầm của chiếc 8620 này đã đến giới hạn. Nhưng, phần thân xe vẫn còn rất chắc chắn. Có vẻ như có thể sử dụng thêm nhiều năm nữa.」"
1830 = "「Được thôi. Quay lưng lại đây.」"
1832 = "「Nghĩa vụ của người được bầu cử công khai làm thị trưởng là cống hiến cho thành phố. Vì vậy, tôi đã cân nhắc sự sắp xếp nhân sự tốt nhất vì mục đích đó.」"
1837 = "「Làm tốt lắm. Những lời rất ra dáng Hibiki đấy.」"
1842 = "「Tái sinh toa xe ấy hả, cần tập hợp những kỹ thuật gì?」"
1843 = "「Việc di chuyển toa xe tốn rất nhiều tiền, chẳng phải vì thế mới phát hành trái phiếu đường sắt sao?」"
1856 = "「Tái sinh toa xe phế liệu bằng cách chắp vá. Chúng tôi nghĩ rằng, có thể biến nó thành một ngành công nghiệp mới.」"
1857 = "「Ý tưởng này, là của chị Mayami sao?」"
1858 = "「À, ừm.」"
1859 = "「Cái này gọi là \\x%lNゲージ;#00ffc040;N-gauge%l;#; đó ạ. Nó được cấu tạo từ một khung gầm có gắn mô-tơ và phần thân xe nha~」"
1861 = "「Đây là……」"
1862 = "「Đây chính là sự “đường đường chính chính” của đàn chị Kisaki.」"
1863 = "「Chuyện đó là đương nhiên rồi. Paulette đã nỗ lực không ngừng nghỉ, cho cả chính trị và đường sắt mà.」"
1864 = "「Như thế này.」"
1865 = "「Quả thực, đó cũng là một hình thức đường đường chính chính. Anh cũng có thể hiểu được điều đó.」"
1866 = "「Vậy thì, tin tức thị trưởng từ chức là sự thật sao?」"
1874 = "「Đối với những người đó, họ luôn mong muốn chính quyền của bé Pau được duy trì lâu dài.」"
1876 = "「Dạ…… cái đó…… ờm――――」"
1877 = "「Dạ…… anh ơi?」"
1878 = "「Dạ, với những người đã từng làm việc cùng cháu qua việc vẽ biển hiệu, và cả những người mới gặp lần đầu, cháu xin phép được tự giới thiệu.」"
1880 = "「Thế thì chị sẽ liên lạc với những người có liên quan, có tên trong danh sách hiệp hội thương mại nhé.」"
1882 = "「Dạ, anh ơi――vậy thì, thuốc. Anh bôi thuốc cho em được không ạ?」"
1883 = "「Nếu vậy thì――anh ơi.」"
1885 = "「V-vậy thì anh ơi――làm phiền anh nhé.」"
1886 = "「Nếu vậy, không có gì phải do dự nữa.」"
1888 = "「Khói mù mịt thế kia thì, chẳng biết là đi du lịch hay đi mỏ than nữa.」"
1889 = "「Vậy, thưa thị trưởng——à không, thưa giám đốc.」"
1891 = "「Tài thì không nói, nhưng về Nhân…… Em có một ý tưởng, có thể sẽ giúp ích cho sự đoàn kết.」"
1892 = "「Sắt với mộc thì Ohimitera dư sức lo được.」"
1899 = "「Về vấn đề đó, xin nhường lời giải thích cho \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của \\x%l8620;#00ffc040;8620%l;#;, Hachiroku.」"
1901 = "「Đó là」"
1902 = "「Về việc đó, chúng tôi đã chuẩn bị sẵn tài liệu rồi.」"
1904 = "「Anh hai――anh Soutetsu. Dạ――ờm, chắc sắp đến giờ họp báo rồi phải không ạ?」"
1906 = "「Anh hai…… bài báo này——」"
1907 = "「Anh hai! Anh hai!! Dậy đi, dậy đi!!」"
1909 = "「Anh hai, nước――cho em xin, ngụm nước.」"
1910 = "「Cảm ơn mọi người. Anh hai, chị hai, Hachiroku.」"
1915 = "「Cả Kumamoto Broadcasting và Kumamoto Shimpo, những kẻ đã khuấy động sự bất an đó, đều có cổ đông lớn là Ngân hàng Kumamoto mà.」"
1917 = "「Ngài Soutetsu! Phòng khách! Xin ngài hãy đến phòng khách ngay lập tức!」"
1918 = "「!」"
1919 = "「!!!」"
1920 = "「!?」\\n「!!」"
2068 = "Chắc chắn sẽ lớn lên thành một sức mạnh to lớn, thành điểm tựa cho một Ohimitera đang lạc lối hiện tại."
2070 = "Hibiki nãy giờ vẫn cúi gầm mặt im lặng, cuối cùng cũng cất tiếng."
2077 = "Chính vì thế, dù đã xóa bỏ được sự do dự và sợ hãi, em ấy vẫn chưa có được sự mạnh mẽ tuyệt đối——của một người mang trong mình niềm tin mãnh liệt."
2091 = "Chính kẻ châm lửa lại dùng vòi rồng để dập lửa. Nếu nhìn thấu được hậu trường, thì đây chỉ là một trò hề tự biên tự diễn."
2093 = "Có vẻ như ngón tay của tôi cũng đã mạnh hơn nhiều so với hồi còn hay búng trán Michiko."
2103 = "Dù vậy, những gì cô ấy tích lũy được sẽ không bao giờ mất đi."
2104 = "Nghĩ vậy, nhưng tôi không nói ra."
2124 = "Kênh đang chiếu là Kumamoto Broadcasting. Hình như…… có quan hệ công ty mẹ con gì đó với Kumamoto Shimpo."
2128 = "Nói xong, cô ấy im lặng. Năm giây, mười giây——trong khoảng lặng đó, ánh mắt của mọi người bắt đầu di chuyển."
2131 = "Hachiroku thở dài hệt như con người, rồi hơi nhíu mày lại."
2134 = "Gần như cùng lúc. Khung gầm của \\x%lキハ07;#00ffc040;KiHa 07%l;#;S và \\x%l8620;#00ffc040;8620%l;#; đều được tháo ra."
2137 = "Màn trình diễn của Hachiroku và Reina, đã tạo ra một tác động mạnh mẽ, buộc chúng tôi phải thấu hiểu."
2139 = "Hachiroku hoảng hốt đến mức quên cả thêm chữ \"ngài\"."
2140 = "Trên tay Hachiroku cũng đã có một chiếc \\x%lNゲージ;#00ffc040;N-gauge%l;#; từ lúc nào. Đó là mô hình của \\x%l8620;#00ffc040;8620%l;#;."
2143 = "Lời chào ngắn gọn. Cái cúi đầu nhẹ."
2145 = "Tôi lập tức đáp lại giọng nói hốt hoảng của Hachiroku. Khi tôi lao ra ngoài, Hibiki cũng chạy theo sau."
2147 = "Câu trả lời không thừa một chữ nào, đã dấy lên vô số câu hỏi."
2152 = "Vượt qua những tiếng xì xào khe khẽ, bất chấp sự can ngăn của Fukami, Nagi buột miệng ném ra một câu hỏi ngây ngô."
2156 = "Những gì còn lại là phần khung gầm của \\x%l8620;#00ffc040;8620%l;#;, và phần thân xe của \\x%lキハ07;#00ffc040;KiHa 07%l;#;S."
2162 = "Không chỉ mình tôi nín thở. Một tiếng xôn xao lớn nổi lên."
2168 = "Vậy ra Hibiki đã cùng Hachiroku và Reina vắt óc suy nghĩ—— và tự mình đi đến kết luận này chỉ bằng chính sức lực của bản thân."
2170 = "Ra là vậy. Là loại thuốc bôi trị cảm lạnh."
2173 = "Chắc chắn là không thể bỏ lỡ được rồi."
2187 = "Chắc hẳn trận ho vừa rồi rất khó chịu, mặt em ấy còn đỏ hơn lúc nãy nhiều."
2192 = "Câu trả lời của Hachiroku làm dấy lên những tiếng trầm trồ \"Ồ\". Phần lớn những người mua trái phiếu đường sắt đều là kỹ thuật viên——"
2196 = "Nhưng, nếu dập tắt được những lời chế nhạo từ trước, thì lời nói của Paulette sẽ trở nên rõ ràng và sắc bén hơn."
2199 = "Có lẽ là nhờ thành quả dạy dỗ của chị Mayami chăng. Sự thấu hiểu của Hachiroku dường như gần ngang ngửa với tôi."
2200 = "Không cất nổi thành lời sao. Bị bao ánh mắt đổ dồn vào, Hibiki trông vô cùng bối rối."
2201 = "Ngay trên trang nhất, họ đăng chễm chệ một bài báo có nguy cơ gây ra khủng hoảng tín dụng."
2207 = "Không hề tỏ ra lúng túng, Hachiroku dừng lại một nhịp dài, rồi thong thả vẫy tay."
2208 = "Paulette cũng đang trưởng thành. Nếu đã chắc chắn điều đó, thì không cần nghe thêm nữa."
2211 = "Hít vào, thở ra. Bàn tay em ấy khẽ nhúc nhích về phía tôi—— Rồi cứ thế nắm chặt lại thành nắm đấm, và dừng lại."
2214 = "Tôi xoa lưng cho Hibiki đang cuộn tròn người ho sặc sụa."
2216 = "Từng chiếc cúc áo ngủ lần lượt được cởi ra."
2218 = "Chẳng biết có phải cố tình không vẩy đi hay không, mà Hibiki lại chìa nó ra với vẻ mặt đầy tự hào."
2220 = "Dù thấy ánh mắt rơm rớm ngước nhìn lên thật đáng yêu, nhưng nói thẳng ra thì, tôi đã làm hơi lố."
2222 = "Bằng ánh mắt chứa chan sức mạnh và quyết tâm, Paulette lặng lẽ…… đưa mắt nhìn quanh."
2224 = "Giọng nói bắt đầu tràn đầy sức mạnh. Sự do dự dần tan biến trong từng lời nói."
2226 = "Đứng cạnh tôi, cơ thể em ấy hơi run rẩy—— Nhưng, giọng nói lại vô cùng dứt khoát."
2228 = "Hibiki say sưa nheo mắt lại, như một chú mèo con cọ đầu vào tay tôi."
2230 = "Chỉ trong một thời gian ngắn, Hibiki đã trưởng thành thêm một bước nữa."
2233 = "Đôi bờ vai trần đang phập phồng. Ở phía bên kia, bầu ngực khiêm tốn lúc ẩn lúc hiện của Hibiki cũng vậy."
2234 = "Rồi, xoẹt——, đôi mắt xanh biếc khẽ liếc sang ngang."
2235 = "Thở hắt ra một hơi dài, chị Mayami tắt tivi đi."
2238 = "Đôi má dần xẹp xuống, em ấy rúc cả hai tay vào trong chăn, rồi cứ thế khẽ nhắm mắt lại."
2240 = "Nếu không thể tự mình vượt qua lúc này, thì chức thị trưởng, em ấy sẽ không bao giờ đảm đương nổi."
2242 = "Giữa sự im lặng đang bao trùm cửa hàng đường sắt, một tiếng \"ồ\" đầy thán phục vang lên."
2246 = "Dù có tự nhủ với bản thân bao nhiêu lần rằng đây là trị liệu, nhưng tôi vẫn không kìm được mà nghĩ như vậy."
2248 = "Dù cho nhu cầu có ít ỏi đi chăng nữa, nhưng nếu có thể độc chiếm thị phần, thì chắc chắn việc kinh doanh sẽ thành lập."
2249 = "Sau khi hoàn thành xong một công việc lớn, cho mượn bờ vai một chút cũng chẳng sao. Đỡ lấy sức nặng của Hibiki, tôi lại đưa mắt nhìn quanh một lần nữa."
2282 = "Lát nữa hỏi lại cũng được――nghĩ vậy, nhưng tôi vẫn thấy băn khoăn một cách kỳ lạ."
2285 = "Vừa tắt radio, liền nghe thấy tiếng thở dài thườn thượt của Hibiki."
2287 = "Không thể dò ra những người vỗ tay lác đác kia là ai. Nhưng, tôi có thể tin chắc."
2288 = "Với bàn tay vẫn còn hơi ươn ướt, tôi mặc kệ, cứ thế vuốt tóc Hibiki."
2293 = "Chúng tôi đã tự mình nếm trải thực trạng thiếu hụt \\x%l客車;#00ffc040;toa hành khách%l;#;."
2296 = "Đến mức phải tự nhủ trị liệu là trị liệu―― Tôi đang sợ mình sẽ hiểu lầm sự tiếp xúc này thành một điều gì đó khác."
2297 = "Bầu ngực của Hibiki mà tôi đã thấy vô số lần trong nhà tắm, thế nhưng hôm nay, tôi lại cảm thấy nó có chút gì đó đặc biệt."
2301 = "Tôi tự nhủ với bản thân như vậy, và ngay lập tức, tôi nhận ra một điều."
2303 = "Những đầu ngón tay lún vào tấm lưng mềm mại của Hibiki. Làn da của em ấy còn nóng hơn cả ngón tay tôi."
2304 = "Nên tôi đành gượng ép, phá vỡ bầu không khí này."
2306 = "Hình bóng của Michiko thoáng hiện lên trong chốc lát, nhưng ngay lập tức, nó đã bị hòa tan bởi ánh sáng, bởi sức mạnh từ ánh mắt ấy."
2308 = "Đặt chiếc khăn đã thấm nước vắt khô lên, tôi cảm nhận rõ được độ nóng trên trán Hibiki."
2310 = "Trong bình nước là dòng nước thượng hạng từ thượng nguồn sông Kuma, được ướp lạnh buốt."
2312 = "Bóc lớp niêm phong của lọ thuốc mới tinh, tôi lấy một ít ra lòng bàn tay rồi thoa đều."
2314 = "Điều tôi nên nói lúc này, không phải là những lời khiến Hibiki nới lỏng cảnh giác. Mà là những lời thể hiện ý chí, “cùng nhau chiến đấu”."
2315 = "Tôi búng nhẹ ngón tay lên trán em ấy. Đó gọi là búng trán."
2318 = "Nhờ vậy mà ngón tay tôi đã rời khỏi lưng Hibiki. Thứ gì đó nhớp nháp――có cảm giác như vừa tan biến mất."
2319 = "Lòng bàn tay tôi nóng rực lên, đến mức tôi lo sợ không biết nó có làm mất đi tác dụng của thuốc hay không."
2322 = "Đầu gối tôi va phải thứ gì đó――"
2324 = "Thấy Hibiki đang định ngoảnh lại, tôi hoảng hốt giật mình, cơ thể tự động phản xạ."
2325 = "Rõ ràng tôi định búng nhẹ thôi, nhưng có vẻ vì lâu quá không làm nên lỡ tay mất rồi."
2328 = "Dù biết vậy, nhưng tôi không thể đưa tay ra."
2331 = "Tôi lập tức nhận ra em ấy đang nói đến màn trình diễn sử dụng \\x%lNゲージ;#00ffc040;N-gauge%l;#; làm ví dụ minh họa kia."
2333 = "Nếu tôi nhớ không lầm, ông ấy là một trong những nghệ nhân của Ohimitera. Đã nhờ họ hợp tác mà lại khiến họ bất an, tôi thực sự thấy có lỗi."
2335 = "Thế nên, tôi khẽ nói. Một sự ủng hộ nhỏ nhoi dành cho Hibiki."
2339 = "Còn chưa kịp hỏi có chuyện gì, em ấy đã thốt ra những lời yếu đuối."
2340 = "Còn chưa kịp nghĩ \"Chẳng lẽ――\", Hibiki đã tuột hẳn tay áo ra, và để bộ đồ ngủ rơi tuột xuống."
2341 = "Cảm thấy cửa hàng đường sắt thật chật chội. Đây là lần đầu tiên tôi trải qua cảm giác này."
2342 = "Không làm như vậy, chẳng khác nào chuẩn bị sẵn lời bào chữa cho thất bại—— Cũng có thể nói đó là hành vi hèn nhát và tạm bợ."
2353 = "Vì ôm đồm tất cả, vì không vứt bỏ thứ gì nên sự yếu đuối của Hibiki rồi sẽ có một ngày——"
2355 = "Vang lên là giọng của Paulette. Có vẻ buổi họp báo vừa mới bắt đầu."
2357 = "Không, nếu đã là trị liệu, thì chỉ bôi lưng thôi chẳng phải là không đủ sao――tôi lại nghĩ vậy."
2410 = "Hibiki đứng bật dậy."
2414 = "Ngay khoảnh khắc ngồi xuống ghế, Hibiki gục người về phía tôi."
2417 = "Hibiki nín thở, chăm chú lắng nghe buổi họp báo từ chức của Paulette."
2419 = "Tiếng nín thở của Hibiki, hòa cùng vô số tiếng bấm máy ảnh từ phía bên kia radio."
2421 = "Tôi đè Hibiki, người đang định nhỏm dậy đi sang phòng có tivi, xuống, rồi cứ thế bật công tắc radio."
2422 = "Hibiki từ từ ngồi dậy."
2425 = "Kim nhiệt kế thủy ngân, thứ hơi hiếm gặp vào thời buổi này."
2427 = "Đón nhận ánh nhìn đó, Hibiki mạnh mẽ gật đầu."
2428 = "Nói một cách dứt khoát, Hibiki mỉm cười. Nhìn nụ cười như đã trút bỏ được gánh nặng ấy, tôi cảm nhận được sự mạnh mẽ."
2431 = "Nghe tôi nói, Hibiki gật đầu. Thật mạnh mẽ. Thật kiên quyết."
2433 = "Ánh mắt của Hibiki. Một ánh mắt tràn đầy niềm tin――nhìn thẳng lên tôi."
2434 = "Một giọng nói nhỏ, như đang căng thẳng."
2438 = "Lập cập, bàn tay Hibiki lại bắt đầu run lên một chút."
2440 = "Nửa thân trên của Hibiki hoàn toàn phơi bày. Qua bờ vai, tôi có thể nhìn xuống đường cong thoai thoải của bầu ngực."
2441 = "Lời của Hibiki, mang đậm chất Hibiki."
2443 = "Hibiki không còn nhìn tôi nữa. Tôi cứ thế ngước nhìn góc nghiêng của em ấy."
2444 = "Mắt Hibiki đã rơm rớm nước mắt."
2446 = "Im lặng. Nhắm chặt mắt lại, rồi mở ra."
2448 = "Vừa dứt lời, hai má Hibiki liền phồng lên."
2449 = "Nghe không giống như đang tự trách mình hay trách ai khác. Cũng chẳng cảm thấy sự oán hận hay tiếc nuối nào."
2452 = "Nhìn mặt tôi và nói vậy, Hibiki liền cụp mắt nhìn xuống chăn."
2453 = "Giọng của Hibiki."
2456 = "Hibiki giật nảy mình. Những ngón tay hoảng loạn như sợ hãi vội vàng ấn tắt công tắc radio."
2457 = "Hibiki ngoảnh lại nhìn tôi."
2460 = "Những bài học em ấy rút ra từ vô số chủ cửa hàng qua công việc vẽ biển hiệu, và đặc biệt là những gì học được từ chính Houshou Kisaki——"
2461 = "Cổ họng ửng đỏ của Hibiki chuyển động lên xuống. Sau đó, em ấy liếm nhẹ đôi môi đã lấy lại được độ ẩm."
2464 = "Giọng nói ngọt ngào, nũng nịu của Hibiki, dần thấm sâu vào trong tâm trí tôi."
2465 = "Thở ra một hơi dài, Hibiki thả người nằm phịch xuống nệm."
2468 = "Giọng nói mang theo hơi nóng. Cơ thể đổ mồ hôi nằm ườn trên nệm."
2469 = "Bốp, Hibiki vỗ tay một cái."
2471 = "Có phải những gì Hibiki đã dày công vun đắp đang kìm hãm họ lại? Tất cả mọi người đều đang chờ đợi câu nói tiếp theo của Hibiki."
2474 = "Sức nóng đang dâng cao trong phòng đã cho thấy, họ chính là những người đã tình nguyện góp sức cải tạo \\x%l8620;#00ffc040;8620%l;#;."
2476 = "Một tiếng xì xào lớn."
2477 = "Những tiếng xì xào lắng xuống như sóng rút, trong cửa hàng đường sắt giờ đây chỉ còn vang lên giọng nói của Hachiroku."
2478 = "Ngay lập tức, vô số tiếng đèn flash và tiếng bấm máy ảnh vang lên. Phần hỏi đáp bắt đầu."
2479 = "Lẫn vào đó là lác đác những tiếng vỗ tay, lách tách, lách tách."
2480 = "Một tràng xì xào ồ lên. Nhưng, nó không biến thành những tiếng la ó tức giận."
2483 = "Nếu Hibiki không bị sốt, thì đương nhiên chúng tôi cũng sẽ có mặt tại buổi họp báo từ chức của Paulette."
2494 = "Sự im lặng bao trùm trong chốc lát. Hibiki cúi gầm mặt, không thốt lên lời nào."
2504 = "Như để dập tắt sự xì xào đó, Paulette cúi đầu thật sâu."
2505 = "Chạm đến ngưỡng mà sự nỗ lực không thể vượt qua, cô ấy đã quyết định từ bỏ con đường chính trị."
2506 = "Paulette vẫn giữ thái độ điềm tĩnh, trôi chảy――nói ra tất cả những gì cần nói."
2507 = "Rồi cô ấy từ từ ngẩng mặt lên——"
2508 = "“Chức danh ảnh hưởng đến con người nhiều hơn ta nghĩ”—— Có vẻ như Paulette đã thấu hiểu sâu sắc điều đó."
2513 = "Hướng về phía Fukami đang luống cuống vì tự vạch áo cho người xem lưng, Paulette bình tĩnh đáp lại bằng một nụ cười dịu dàng."
2518 = "Phía sau xương bả vai, mạn sườn. Tôi bôi thêm thuốc vào những chỗ còn sót lại."
2519 = "Tạo ra nhiều manh mối câu chuyện, để Hibiki có thể với tay tới bất cứ lúc nào."
2523 = "Và rồi tay của Hachiroku cùng Reina, lắp ráp phần khung gầm còn hoạt động được với phần thân xe."
2524 = "Và rồi Hibiki, tiếp nhận lời tôi, và tiếp nối bằng chính ngôn từ của mình."
2525 = "Sau đó Hibiki lắc đầu thật mạnh, rồi hỏi tôi với vẻ hơi vội vàng."
2527 = "Nhưng——chừng nào chưa nắm được bằng chứng cụ thể và vạch trần, thì vở kịch nhỏ đơn giản này vẫn sẽ phát huy tác dụng."
2535 = "Một cái cúi chào thật sâu, thật ngoan ngoãn. Chỉ cần Reina cất tiếng, bầu không khí trong phòng đã dịu đi đôi chút."
2538 = "Trên tay Reina là mô hình đường sắt của \\x%lキハ07;#00ffc040;KiHa 07%l;#;S. Đó là thứ vẫn luôn được trưng bày trong cửa hàng đường sắt."
2541 = "Reina đặt chúng lên tay trái, và âu yếm vuốt ve bằng tay phải."
2542 = "Reina hạ mô hình toa xe màu đỏ xuống, và Hachiroku nâng mô hình \\x%l8620;#00ffc040;8620%l;#; lên."
2546 = "Giờ đây, tất cả đã hội tụ lại trong Hibiki, và chuẩn bị nở rộ thành một bông hoa rực rỡ."
2552 = "Ở góc trên bên phải, dòng chữ 『Họp báo khẩn cấp: Khủng hoảng tín dụng trái phiếu đường sắt sẽ ra sao?』 cũng liên tục hiển thị như được dán chặt vào đó."
2553 = "Hơi nóng bất thường từ làn da Hibiki, từ ngón tay tôi, đã hoàn toàn biến mất."
2554 = "Hội trường có vẻ khá đông đúc."
2566 = "Thứ nước dùng để ủ rượu shochu, được chị Mayami chia cho."
2567 = "Bên cạnh là chị Mayami. Nụ cười tủm tỉm thường ngày đã biến mất, chị ấy đang chằm chằm nhìn vào màn hình."
2569 = "Một lời đính chính sắc bén bằng chất giọng từ tốn. Chị Mayami không hề thở dài, cũng chẳng nhíu mày."
2572 = "Nếu là chị Mayami, chắc chắn chị ấy sẽ không bỏ sót chuyện đó."
2574 = "Câu trả lời ngắn gọn cùng nụ cười đầy tự hào của chị Mayami. Khiến sống lưng tôi bất giác run lên."
2576 = "Một tiếng kêu ngắn ngủi, nhưng chứa đựng cảm xúc mãnh liệt."
2578 = "Những ánh mắt như đang dò xét, đánh giá khiến Hibiki sợ hãi."
2579 = "Từ Paulette, khẽ lướt sang chị Mayami, sang tôi, rồi đến thầy cúng Akai. Và rồi chẳng biết từ lúc nào, tất cả đều dồn về một người duy nhất."
2586 = "Dòng chữ tô điểm cho Kisaki đang phát biểu là 『Giám đốc chi nhánh Ohimitera của Ngân hàng Kumamoto - Houshou Kisaki』."
2589 = "Vì chiến thắng, cô ấy sẽ không khoan nhượng mà tiếp tục dốc hết sức mình. Nếu việc lợi dụng lòng tốt của đối phương là có hiệu quả, cô ấy sẽ làm."
2592 = "Chờ tôi hiểu ra vấn đề, chị Mayami khẽ gật đầu."
2595 = "Bởi vì ngay khoảnh khắc được đặt lên đường ray \\x%lNゲージ;#00ffc040;N-gauge%l;#;, toa xe mới được lắp ráp lại lao đi với tốc độ đáng kinh ngạc."
2601 = "Một tiếng lẩm bẩm nhỏ “À” khẽ lọt vào tai. Ngoảnh lại nhìn, Hachiroku đang làm vẻ mặt nghiêm trọng."
2611 = "Chỉ cần một vài người trong số họ ngã lòng, sự đoàn kết và tin tưởng sẽ bị tổn hại, và ưu thế về “Nhân” của phe ta sẽ dễ dàng bị đánh mất."
2629 = "Hibiki lập tức ngừng run rẩy."
2633 = "Những người mua trái phiếu đường sắt, ở một mức độ nào đó, cũng trùng khớp với tầng lớp ủng hộ Paulette."
2644 = "Trước cái giơ tay điềm tĩnh của thầy cúng Akai, người đàn ông đang lớn tiếng và nhổm dậy liền im bặt và lùi lại."
2645 = "Một giọng nói kinh ngạc từ tận đáy lòng. Thầy cúng Akai mở to hai mắt."
2657 = "Một sự đồng tình quá đỗi nhỏ bé từ một người không rõ mặt ——chỉ vậy thôi cũng đủ để Hibiki vươn thẳng lưng thêm lần nữa."
2658 = "Đó là điều mà từ khi còn rất nhỏ, em ấy vẫn luôn không hề thay đổi."
2659 = "Ra là vậy, đau thật đấy."
2660 = "Thậm chí trong giọng nói của thầy cúng Akai, tôi cũng cảm nhận được sự căng thẳng."
2663 = "Việc mà nếu là Hibiki thì có thể làm được. Việc mà chỉ có Hibiki mới làm được."
2666 = "Người đàn ông trung niên vừa mới chu mỏ phản bác, giờ há hốc mồm, nhìn Hibiki bằng ánh mắt kinh ngạc."
2667 = "Quả thực màn đó rất sống động và hiệu quả."
2668 = "Một Hibiki từng phải có người thúc đẩy mới chịu hành động, giờ đây đang nỗ lực đứng vững như một trụ cột."
2674 = "Kumamoto Shimpo—— Tờ báo đã từng đăng tin dự đoán việc Paulette từ chức dạo trước."
2679 = "Dù phát ra giọng điệu bất mãn, nhưng Hibiki vẫn là Hibiki, tức là rất ngoan ngoãn."
2680 = "Tuy giọng nói có vẻ thiếu tự tin, nhưng em ấy đã truyền đạt rõ ràng cho chúng tôi, và Hibiki lặng lẽ đứng lên."
2683 = "Những lời như thiền ngữ khiến những tiếng xì xào nhỏ lại nổi lên."
2684 = "Trên tivi, Kisaki đang điềm tĩnh tiến hành buổi họp báo."
2685 = "Hibiki nhìn chằm chằm vào màn hình tivi đã tắt—— Có lẽ, em ấy đang nhìn Kisaki ở phía bên kia."
2687 = "Ngay cả với những câu hỏi đầy ác ý, Paulette vẫn tiếp tục đáp lại một cách lưu loát."
2696 = "Mồ hôi nhễ nhại cùng hơi nóng từ làn da, đang dần làm tê liệt những đầu ngón tay tôi."
2714 = "（Chỉ với những gì chị Mayami, Paulette và tôi…… đã truyền đạt, có lẽ em ấy sẽ không thể tiến xa đến thế.）"
2716 = "（Nhưng, cũng có những người đánh giá cao điều đó——）"
2717 = "（Hoặc có lẽ, Houshou Kisaki cũng đã đặt chân đến hội trường chăng――）"
2720 = "（Chạm nhẹ――thoa thoa――miết miết――trơn trượt――）"
2721 = "（Chạm nhẹ）"
2722 = "（Bốp!）"
2723 = "（Cụp）"
2724 = "（Vùuuu!）"
2725 = "（Cộp）"
2726 = "（Chà, cũng tầm cỡ này thôi sao——）"
2727 = "（Muốn…… chạm vào em ấy nhiều hơn nữa.）"
2733 = "（Đúng rồi, Hibiki đang bị sốt. Đây là trị liệu, là để hạ sốt.）"
2734 = "（Hibiki, nhất định sẽ không phụ sự kỳ vọng đó. Em ấy sẽ không bao giờ vứt bỏ bất cứ ai vì mục đích của mình.）"
2736 = "（Tí tách）"
2737 = "（Vậy là, hai người họ cũng đã xem bài báo này rồi sao——）"
2742 = "（Người phải nói lời cảm ơn, là tôi mới đúng.）"
2745 = "（Là trị liệu, là trị liệu, là trị liệu, là trị liệu.）"

[selections]
