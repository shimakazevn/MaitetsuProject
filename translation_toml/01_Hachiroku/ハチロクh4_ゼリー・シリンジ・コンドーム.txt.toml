1400 = "Tôi mạnh bạo ấn hông xuống như muốn xé toạc nơi đó ra——"
1402 = "Điều đó khiến tôi bất an, nhưng lại vô cùng sung sướng, vì vậy tôi muốn kết nối với em đến tận cùng!"
1404 = "Tôi thầm thán phục sự chu đáo, tỉ mỉ đúng chất Suzu. Và đưa ngón tay về phía lỗ nhỏ khép nép, e lệ cũng rất giống em ấy."
1406 = "Lấy gel từ trong hộp ra và thoa đều lên ngón tay, không hề bị rối, cũng không dính nhớp, mà thực sự rất mượt mà và dễ chịu."
1408 = "Lời nói thốt ra theo phản xạ, tôi chợt nhận ra nó đã biến thành một câu chơi chữ ngớ ngẩn (anarunaru hodo)."
1410 = "Tôi muốn chạm vào làn da ấy. Muốn chạm vào lỗ hậu môn ấy. Muốn thấy phản ứng của một Suzu ngoan ngoãn, kiên cường."
1411 = "Nếu vậy, tôi cũng muốn cho Suzu biết niềm vui này. Suy nghĩ đó ngay lập tức biến thành một câu nói rất đơn giản."
1413 = "Tôi nhớ ra thứ mình đang cầm trên tay. Thứ thứ hai——công tắc khoái cảm của Suzu."
1415 = "Đeo bao cao su vào, rồi trên đó, tôi thoa một lớp gel bôi trơn hậu môn thật dày."
1418 = "Nhấc bổng cơ thể Suzu lên, dùng phần khấc quy đầu, tôi càng làm mở rộng thêm lỗ hậu môn đang chực siết lại."
1420 = "Tôi rút ngón tay ra."
1421 = "Vuốt ve trơn trượt quanh hậu môn, tôi nghe thấy giọng nói đầy vẻ sung sướng của em."
1423 = "Đẩy ngón tay vào lỗ hậu môn không báo trước, Suzu thốt lên một tiếng xen lẫn giữa sự kinh ngạc và khoái cảm."
1424 = "Dùng tay phải và toàn thân đỡ chặt cơ thể Suzu, tôi từ từ rút toàn bộ phần cương cứng ra."
1426 = "Đâu đó tôi từng nghe câu thành ngữ \"đào lỗ hậu môn\", ra là vậy, cái này——quả thực, mang lại cảm giác đang đào xới."
1428 = "Trải qua lịch trình quen thuộc trở về phòng, một khung cảnh hơi khác lạ so với mọi khi đang chờ đón tôi."
1432 = "Di chuyển, và ma sát. Chỉ với khoái cảm đơn thuần đó, tôi có thể tập trung đến tận cùng, tận cùng."
1440 = "Uốn cong ngón tay đang cắm trong âm đạo như chiếc móc rồi cử động, Suzu phản ứng lại thật đáng yêu, mật ngọt tuôn trào nhầy nhụa."
1441 = "Vừa siết chặt, Suzu vừa ngoáy tít hông."
1445 = "Đã nới lỏng và làm ướt đến mức này rồi, tôi có cảm giác chỉ cần thế là đủ, nhưng——"
1449 = "Một lực thít chặt không khoan nhượng!"
1450 = "Từ tư thế cực kỳ chông chênh, lần này tôi đột ngột đổi hướng! Dồn toàn lực vào hông!!"
1458 = "Mồ hôi quyện vào mồ hôi, hai cơ thể cũng đang hôn nhau. Dù không thể cắm sâu như hậu môn, nhưng chúng tôi lại đang kết nối sâu sắc hơn bao giờ hết."
1473 = "Chỉ nhìn thôi cũng thấy hạnh phúc vì sự đáng yêu ấy."
1475 = "Có thứ gì đó, chạm nhẹ vào khuỷu tay tôi——"
1480 = "Kết thúc ca trực, ngâm mình trong nước nóng, rồi đón gió đêm trở về nhà."
1485 = "Em khẽ cắn yêu vào dái tai tôi, rồi dùng chiếc lưỡi mềm mại xoa dịu vết cắn ấy."
1488 = "Sâu đến thế này, khít rịt đến tận gốc rễ thế này—— Khoái cảm được bao bọc hoàn toàn càng làm tăng thêm tình yêu thương trong tôi."
1495 = "Hậu môn cũng có cái sướng riêng của nó."
1496 = "Hậu môn siết chặt lại một cách khác thường, báo cho tôi biết Suzu đã đạt đỉnh!"
1499 = "Vùng ngực dần lộ ra, và rồi, những nụ hoa đáng yêu nhô lên e ấp."
1504 = "Tiếng hông và mông va chạm vào nhau. Một nhịp trễ, phần gốc bị siết chặt mạnh mẽ."
1508 = "Đương nhiên tôi sẽ chịu trách nhiệm với những gì mình đã nói."
1510 = "Không có sự phức tạp. Tuy siết chặt, nhưng lại đơn điệu. Nhưng, chính vì thế——"
1520 = "Càng cử động, sự hưng phấn càng tăng lên."
1527 = "Không phải là làm tình với hậu môn của Suzu, mà là cùng với Suzu——làm tình bằng trọn vẹn thể xác và tâm hồn."
1528 = "Điều đó mang lại cảm giác trống trải vô tận, dù đang kết nối, nhưng lại muốn kết nối sâu sắc hơn nữa."
1529 = "Thế này thì gel sẽ nhanh chóng bị cuốn trôi mất thôi. Nhưng, thế cũng tốt. Chỉ lúc này thôi——vì mục tiêu chính nằm ở nơi khác mà."
1530 = "Vừa dùng đầu ngón tay tận hưởng cảm giác như cao su, khác hẳn với cô bé, tôi vừa thoa gel lên vách thịt."
1531 = "Dù ướt át và trơn tru đến vậy, nhưng da thịt cọ xát vào nhau vẫn sinh ra nhiệt."
1532 = "Nếu là thứ mượt mà thế này, thì chắc chắn sẽ tràn ra ngoài."
1536 = "Rồi trên đó……rốt cuộc là để làm gì cơ chứ? Em trải gọn gàng những chiếc khăn tắm còn thừa từ đợt phát dịp cuối năm."
1538 = "Rất thon gọn. Nhìn kỹ thì cũng không có kim tiêm ở đầu."
1540 = "Suzu không thể mang thai nên chắc chẳng liên quan gì đến việc tránh thai…… Có lẽ kiến thức của tôi có chỗ nào đó sai sót chăng."
1541 = "Rồi Suzu ngước nhìn tôi, và giải thích bằng giọng điệu nóng bỏng."
1542 = "Miệng nói vậy, nhưng Suzu lúi húi cởi hẳn chiếc quần lót ra. Gấp lại rồi cất xuống dưới gối——"
1543 = "Bỏ ống tiêm ra, Suzu bôi đẫm gel bôi trơn hậu môn lên ngón tay mình."
1544 = "Không thốt nên lời, khuôn mặt đỏ bừng, toàn thân run rẩy không ngừng, Suzu đang lên đỉnh."
1545 = "Suzu lấy ống tiêm từ tay tôi."
1546 = "Suzu lúi húi, cởi quần ra, gấp gọn gàng rồi đặt sang một bên."
1547 = "Liên tiếp. Suzu rùng mình mạnh mẽ, rồi lả đi."
1548 = "Đón nhận nụ hôn nũng nịu của Suzu, tôi cứ thế nhẹ nhàng đặt em nằm xuống nệm."
1549 = "Suzu dịu dàng ôm lấy tôi, nhẹ nhàng vuốt ve lưng tôi——!!!?"
1550 = "Suzu đỏ bừng mặt. Dù đỏ mặt, nhưng bàn tay đang kéo quần lót xuống vẫn không hề nhúc nhích."
1551 = "Chiếc quần lót trong sáng đến chói mắt, đúng phong cách của Suzu. Em nhẹ nhàng dùng ngón tay ấn lõm phần mông——chỗ cái lỗ."
1552 = "Dù ngón tay đang thoa đẫm gel vẫn có thể cảm nhận rõ ràng, cô bé của Suzu đang ướt đẫm."
1553 = "Lỗ hậu môn nhỏ bé của Suzu, như thể đang hít thở vậy."
1554 = "Bên trong hậu môn của Suzu——tận sâu bên trong, chật hẹp, đơn giản và thẳng tắp."
1555 = "Ánh mắt của Suzu, dẫn dắt ánh nhìn của tôi hướng lên khuôn ngực quá đỗi bằng phẳng của em."
1556 = "Nghe Suzu nói vậy, tôi thở phào——không nổi."
1557 = "Toàn bộ lỗ âm đạo của Suzu dang rộng vòng tay chào đón, ôm chầm lấy tôi."
1558 = "Suzu vẫn mặc nguyên quần lót, cứ thế kéo căng cho nó nhỏ lại, để lộ ra lỗ hậu môn đáng yêu."
1559 = "Vừa nói, Suzu vừa trải đệm ra."
1560 = "Những ngón tay trắng ngần vạch hai cánh mông ra, mở rộng lỗ hậu môn đang khép chặt."
1561 = "Mái tóc Suzu đung đưa chạm vào người tôi. Chỉ một chút vậy thôi cũng đủ khiến khoái cảm râm ran dâng trào."
1587 = "Tôi ép chặt, rồi nhấn sâu thêm chút nữa."
1588 = "Vẫn không có nơi nào chào đón phần đỉnh. Tử cung không trao cho tôi nụ hôn \"chụt\" nào cả."
1592 = "Ban đầu tôi chỉ định ấn nhẹ quy đầu vào—— nhưng nó lại trơn tuột, tiến vào mà không gặp chút trở ngại nào——"
1649 = "（Ra là vậy——được người khác làm cho, hay được làm cho người khác, cũng là một trong những niềm vui của việc làm tình nhỉ）"
1651 = "（Siết chặt!）"
1653 = "（Siết, siết chặt）"
1655 = "（Phập——trượt——）"
1656 = "（Phập——trượt——phập——chu mút）"
1658 = "（Phập!!!）"
1659 = "（Phập!）"
1661 = "（Phập——phập——trượt——phập——）"
