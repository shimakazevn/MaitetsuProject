2330 = "「Không đâu ạ, em thích nhai nguyên cục hơn——à không,\\nờm, trứng cuộn mất công làm sẽ nguội mất đấy ạ?」"
2332 = "「Gọi bằng bé cũng được nha? Chỉ cần em hiểu điều đó,\\nthì Hachiroku muốn gọi sao cũng OK hết.」"
2335 = "「Tại nãy giờ Hachiroku, hơi xấc xược một chút.\\nNên chị mới bực mình nói lời chọc ngoáy thôi. Xin lỗi nha?」"
2336 = "「Phải nộp báo cáo nhỉ! Rõ rồi nha~」"
2337 = "「Là tuyến đường sau này được quốc hữu hóa thành tuyến Minobu của Teitetsu đó ạ.\\nNó được điện khí hóa khá sớm…… chắc là từ thời còn là đường sắt tư nhân.」"
2341 = "「Là kiểu Mỹ ạ.\\nTrong trường hợp này, ý cô ấy là \\x%lレイルロオド;#00ffc040;Railord%l;#; kiểu Mỹ đó ạ.」"
2345 = "「Là vậy đó. Tôi cũng sẽ đi theo với tư cách là \\x%l機関士;#00ffc040;lái tàu%l;#; hướng dẫn.\\nCuối cùng cô sẽ bắt cặp với ai thì còn phải dựa vào đánh giá tổng hợp nữa.」"
2351 = "「Tinh thần muốn bắt đầu từ những việc lặt vặt rất đáng quý,\\nnhưng làm vậy thì phải mất mấy năm nữa mới được vận hành thương mại mất.」"
2356 = "「Sao vậy? Hachiroku.」"
2357 = "「Không phải vậy đâu! Ở Đường sắt Mikan cũng làm đàng hoàng mà!\\nỜm, vừa nãy là——vừa nãy là, ờm, Olivy, ờm.」"
2362 = "「Có lẽ là một cảm xúc không thể diễn tả bằng bất kỳ ngôn từ nào.\\nSâu thẳm, đặc quánh. Đen tối, không đáy——đó là sự tuyệt vọng.」"
2364 = "「Là vậy đó ạ.\\nNgài Soutetsu, pha phanh khẩn cấp của ngài thật tuyệt vời.」"
2366 = "「Mời mọi người ăn cơm!」"
2368 = "「Tôi cũng vậy, Hachiroku.」"
2369 = "「Chắc là…… vậy. Trong ghi chép không nói rõ đến mức đó.\\nBan đầu, cô ấy hoạt động ở Đường sắt Fuji Minobu.」"
2370 = "「Chị cũng rất hoan nghênh cách gọi đó!\\nMột lần nữa mong được giúp đỡ nhé, Olivy!」"
2373 = "「Với tư cách là Giám đốc của Công ty Cổ phần Đường sắt Ohito.\\nTôi xin chấp nhận lời xin lỗi của cô Olivy.」"
2376 = "「Em và ngài Soutetsu cũng\\nphải hoàn thành bản kiểm điểm sự cố nữa ạ.」"
2380 = "「Ừm—— Nói một cách đơn giản nhất thì là sản xuất hàng loạt, tiêu thụ hàng loạt.\\nCấu tạo đơn giản. Vì vậy, họ rất coi trọng tính tương thích.」"
2382 = "「Ừm…… đợi một chút nhé?\\nCó lẽ tôi nên trả lời chính xác thì hơn.」"
2383 = "「Tôi cũng không rành những người khác nên không dám khẳng định——\\nNhưng có lẽ, ở đâu cũng vậy thôi.」"
2386 = "「Tôi hiểu. Lúc cô có thể phát huy tối đa hiệu suất\\nlà khi bắt cặp với tôi. Và ngược lại cũng đúng như vậy.」"
2388 = "「Em cũng nghe nói rằng ở Hokkaido thời kỳ đầu khai phá, do đất đai rộng lớn và mật độ vận chuyển thấp nên họ đã áp dụng kiểu Mỹ làm hình mẫu ạ.」"
2389 = "「Ở Mỹ, như vậy chắc là đủ rồi.\\nLãnh thổ rộng lớn, mật độ vận chuyển chắc chắn cũng khá thưa thớt.」"
2391 = "「Mời mọi người ăn cơm.」「Mời mọi người ăn cơm ạ.」\\n「Mời mọi người ăn cơm nha~!」"
2393 = "「Có lẽ vậy.」"
2396 = "「Nếu vậy, em sẽ rất vui nếu chúng ta có thể làm hòa ạ.\\nChị thấy sao ạ? Chị Olivy.」"
2399 = "「Nên đầu máy hơi nước và \\x%lレイルロオド;#00ffc040;Railord%l;#; kiểu Mỹ,\\nđã không thể trở thành hình mẫu cho kiểu Hinamoto sao.」"
2401 = "「Tính tương thích là bao gồm cả những điểm đó sao.\\nTừ bỏ tính chuyên môn, đổi lại là nâng cao tính đa dụng.」"
2403 = "「Xin lỗi. Em không sao chứ, Hibiki?」"
2406 = "「Cứ giao cho em á!」"
2408 = "「Tất nhiên rồi. Em ngoan ngoãn chờ nhé?」"
2409 = "「Không áp dụng thiết kế chuyên dụng, cơ thể cũng chỉ cần một là đủ.\\n……Về mặt an toàn thì sao nhỉ, chỗ đó hơi đáng lo ngại.」"
2411 = "「Tuyệt quá Hibiki! Đập trứng giỏi ghê!」"
2412 = "「Cái kiểu——phối hợp ăn ý như vậy, ở đâu cũng thế hả?\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; của hệ thống Master——kiểu Hinamoto ấy.」"
2417 = "「Chào buổi sáng! Anh là ngài Soutetsu đúng không?」"
2420 = "「Đã rõ! \\x%l機関士;#00ffc040;Người lái tàu%l;#; Hibiki!!」"
2424 = "「Tối hôm qua thật sự! Xin lỗi mọi người ạ!!!」"
2426 = "「Có sao hay không thì vẫn chưa biết được đâu ạ.\\nNgài Soutetsu hãy kiểm tra bên trong buồng lái. Hibiki, hãy đưa em đi xem thử.」"
2428 = "「Đúng vậy. Thái độ hôm qua của em không tốt đâu.」"
2430 = "「Là chuyện của Olivy sao?」"
2432 = "「Đã có chuyện gì xảy ra?」"
2433 = "「Cô bị ngã rồi va đập vào đâu à?」"
2435 = "「Vâng——」"
2437 = "「Vâng. Quốc gia đã lấy kiểu Anh làm hình mẫu, các tuyến đường sắt tư nhân lớn\\ncũng chủ yếu dùng kiểu Đức và Anh. Kiểu Mỹ vốn dĩ đã là thiểu số rồi.」"
2438 = "「Vâng.」"
2440 = "「Vâng, đúng vậy ạ. Ngài Soutetsu.」"
2442 = "「Bắt cặp với Nagi là đúng rồi, nhưng cũng sẽ luân phiên bắt cặp với em theo từng ngày nữa đó?」"
2445 = "「Vậy sao.\\nThế thì thời gian Olivy hoạt động ở đó khá ngắn nhỉ?」"
2446 = "「Ra là vậy!」"
2449 = "「Không, trong chuyến chạy làm quen Tuyến Yui, Hachiroku cũng sẽ đi cùng.\\nỞ Đường sắt Mikan, không có chuyện \\x%lレイルロオド;#00ffc040;Railord%l;#; tiền nhiệm đi cùng sao?」"
2452 = "「Ể, cỡ này là bình thường thôi á~」"
2454 = "「Đúng vậy. Điều đó cũng phù hợp với cảm nhận chung của người Hinamoto\\n——à, không.」"
2456 = "「Nagi đại nhân đây có hơi bực mình một tẹo,\\nnhưng mà đã xin lỗi rồi thì tha cho á! Cho trôi tuột đi hết luôn á!」"
2458 = "「Thì Nagi! Sẽ bắt cặp với Nagi để làm nhiệm vụ á!」"
2466 = "「Em xem rồi! OK! Tránh được va chạm!\\nVà cũng không có hỏng hóc hay trật bánh gì cả!」"
2468 = "「Chào mừng đến với Ohito. Và, chào mừng đến với Đường sắt Ohito!\\nTừ nay về sau, mong cô giúp đỡ nhiều hơn!」"
2470 = "「Vậy quyết định thế nhé.\\nCòn ở những nơi riêng tư, em muốn gọi sao cũng được.」"
2472 = "「Em không sao! Không đâm phải gì cả!\\nMà nãy là cái gì vậy? Lợn rừng hay gì á!?」"
2473 = "「Không có đâu nha! Đầu máy hơi nước đang hoạt động của Đường sắt Mikan, đầu máy số 9…… thì\\nđã ở Ohito rồi, nên giờ chỉ còn \\x%lC56;#00ffc040;C56%l;#; 99 và chiếc mới đến thôi.」"
2475 = "「Không có không có nha. Olivy chỉ luôn đi với đầu máy số 9 thôi.\\nUổng phí ghê ha? Dù gì cũng cất công mang danh kiểu Mỹ mà.」"
2476 = "「Đúng vậy đó! Olivy, mong được giúp đỡ nhé?」"
2477 = "「Đúng vậy. Vì tiền đề là sản xuất hàng loạt, tiêu thụ hàng loạt,\\nnên cả đầu máy và \\x%lレイルロオド;#00ffc040;Railord%l;#; đều được coi là thứ có thể tiêu thụ và thay thế.」"
2479 = "「Vâng. Là đại lội tắm suối nước nóng thiên nhiên chính hiệu đó ạ.\\nTuyệt vời hơn gấp trăm lần so với nước đun sôi ở các cơ sở nhà ga tiêu chuẩn đấy ạ.」"
2491 = "「Suối nước nóng, suối nước nóng!!」"
2492 = "「Suối nước nóng!!?」"
2499 = "「Và sau đó——cô Olivy.」"
2500 = "「Sau đó, nếu ngày mai trời nắng, chúng ta sẽ cùng đi bộ dọc toàn tuyến để kiểm tra.\\nSẽ mất cả ngày đấy, nhưng lúc về chúng ta sẽ được KiHa 07S đón.」"
2501 = "「Rồi sau đó là đến Đường sắt Mikan.\\nNghe nói ở Đường sắt Mikan, cô ấy luôn làm \\x%l入換機;#00ffc040;đầu máy dồn toa%l;#; ngay từ đầu.」"
2503 = "「Nhưng mà, ưu tiên hàng đầu trong vận tải đường sắt luôn là an toàn.\\nNhìn về lâu dài, ưu điểm của kiểu Hinamoto sẽ nổi bật hơn ạ.」"
2505 = "「Reina cũng, hoàn toàn không để bụng đâu nha~\\nChuyển nhà thì, buồn và cô đơn lắm mà~」"
2507 = "「Từ năm Minh Trị 45 đến nay, đã hơn trăm năm rồi mà.\\nChỉ riêng việc luôn hoạt động trên tuyến đầu cũng đã là một kỳ tích rồi.」"
2510 = "「Em cũng nghe nói vậy. Do em chỉ chủ yếu giao lưu với\\nRailord kiểu Hinamoto nên cũng không rành lắm ạ.」"
2511 = "「Tính tương thích.」"
2516 = "「Vậy luôn á!?」"
2517 = "「Vậy sao? Có cần tôi giúp gì không nha?」"
2518 = "「Mọi người thực sự, thực sự vất vả rồi ạ~」"
2522 = "「Dùi đập đá thì——\\nÀ, anh cứ thế mang về luôn rồi.」"
2529 = "「Đúng vậy.」"
2530 = "「Đúng vậy ạ. Tất nhiên, bọn em cũng có thể bắt cặp với bất kỳ ai\\nvà hoàn thành tốt công việc ở mức tối thiểu, nhưng——」"
2533 = "「Xong việc thì nhớ đến đón Reina nha~」"
2535 = "「Mệt~ quá~ đi~」"
2537 = "「Nói chung, không xảy ra tai nạn là tốt rồi.\\nCảm ơn mọi người vì một chuyến đi an toàn.」"
2540 = "「Những cô bé kiểu Mỹ không được tối ưu hóa theo kiểu như vậy.\\nĐổi lại, họ có thể bắt cặp với bất kỳ ai và lên bất kỳ toa xe nào ngay lập tức.」"
2541 = "「Đầu máy hơi nước Mỹ.」"
2545 = "「Hơn nữa——trong khoảnh khắc suýt va chạm đó.\\nKhoảnh khắc đó, chính Olivy đã truyền \\x%l共感;#00ffc040;cộng cảm%l;#; đến.」"
2548 = "「Hơn nữa, tính cách của Olivy chắc cũng ảnh hưởng rất lớn.\\nTươi sáng, dứt khoát, không để bụng.」"
2550 = "「Ở đó, cô ấy làm việc đến tận năm Chiêu Hòa 49——thực sự rất lâu nhỉ.」"
2551 = "「Và đồng thời——cả cảm xúc nữa ạ.」"
2552 = "「Ye. Yeah.」"
2553 = "「Yeah!」"
2554 = "「Yeah!」\\n「Yeah!」"
2556 = "「Yeah!!」"
2558 = "「Chúng ta nói chuyện hơi lâu rồi đấy. Bắt tay vào chuẩn bị cho chuyến đi thôi.\\nPhụ lái tàu hôm nay là——Hibiki phụ trách đúng không.」"
2560 = "「Ít nhất thì bộ đôi Paulette và Reina là như vậy.\\nSự ăn ý của họ có khi còn hơn cả chúng tôi nữa.」"
2562 = "「Chỉ cần được ở bên ngài Soutetsu.\\nThì dù là nhiệm vụ nào, em chắc chắn cũng sẽ làm được.」"
2563 = "「Bằng tiếng Anh là \"Off the light\".\\nCả ý nghĩa và lý do đều được truyền đến em ạ.」"
2570 = "「Muốn đi muốn đi! Tororyu?\\nDẫn tôi đến đó đi!!」"
2571 = "「Chuyện lúc nãy á? Chắc là do ấn tượng quá nên lỡ phát ra tiếng đó.\\nKiểu, không cần chỉ thị mà vẫn phối hợp ăn ý đến thế cơ á.」"
2577 = "「Bí quyết?」"
2580 = "「Cũng chưa chắc đâu. Nhân vật chính thường xuất hiện sau cùng mà.」"
2581 = "「À ừm……bé Olivy?」"
2582 = "「Vốn dĩ là do em không tốt. Em đã có thái độ thất lễ,\\nvới một tiền bối như chị Olivy.」"
2583 = "「Cũng phải nhỉ. Xin lỗi em, Hibiki. Để em phải đợi rồi.」"
2584 = "「Đúng vậy nhỉ.」"
2585 = "「Đúng vậy. Đó là đặc điểm lớn nhất của \\x%lレイルロオド;#00ffc040;Railord%l;#; kiểu Mỹ.\\nVốn dĩ, tư tưởng thiết kế của họ đã khác với kiểu Hinamoto, kiểu Anh hay kiểu Đức rồi.」"
2587 = "「Mong được giúp đỡ nha, Hibiki!」"
2588 = "「Cảm ơn anh! Em biết rồi!\\nOlivy chắc chắn sẽ làm vậy! Ngài Soutetsu!」"
2589 = "「Cảm ơn anh! Ngài Soutetsu.\\nOlivy là \\x%lレイルロオド;#00ffc040;Railord%l;#;, hiện đang phụ trách Đầu máy số 9. Và!」"
2591 = "「Cảm ơn nha, tôi nhận đây!」"
2605 = "「Lên tàu thôi. Đi nào.」"
2620 = "「Xem nào……\\nBên cạnh ngài Soutetsu là em rồi nên——」"
2621 = "「À ừm, em——không có ý đó đâu ạ.\\nChỉ là, dáng vẻ khóc lóc đêm qua của chị……trông quá đỗi mỏng manh.」"
2622 = "「Không được đâu, Hachiroku.」"
2623 = "「Đó chính là điểm mạnh của đầu máy hơi nước Mỹ đấy.」"
2624 = "「Lúc này, không được bao che đâu á.」"
2625 = "「Vậy sao.」"
2626 = "「Vậy thì tốt quá rồi.」"
2627 = "「Thật đáng ngưỡng mộ ạ. Nếu chỉ đơn thuần là may mắn hay tình cờ,\\nthì chắc chắn không thể nào làm được như vậy.」"
2629 = "「っ!」\\n「Không phải đâu ạ!」"
2631 = "「Cái!?」"
2635 = "「Vậy thì, dù là trong công việc hay đời tư.\\nTừ nay về sau, một lần nữa mong chị giúp đỡ nhé?」"
2636 = "「Nói cách khác, những \\x%lレイルロオド;#00ffc040;Railord%l;#; kiểu Mỹ như Olivy,\\ncó thể bắt cặp với bất kỳ Master——à không, bất kỳ \\x%l機関士;#00ffc040;lái tàu%l;#; nào sao?」"
2641 = "「Vậy thì, hôm nay chúng ta dừng ở đây nhé.\\nTôi sẽ ở lại làm thêm một chút.」"
2645 = "「Nha? Olivy ngồi đâu thì được?」"
2646 = "「Vậy, Olivy nên bắt đầu từ công việc gì đây?\\n\\x%l罐磨;#00ffc040;Cọ rửa lò hơi%l;#;? Dọn dẹp nhà kho?」"
2649 = "「Thì sẽ đi theo tàu cho đến khi trời tạnh. Nói chung khi nào nắng lên thì hãy đi bộ một vòng,\\nrồi lập kế hoạch xem nên vận hành đầu máy số 9 như thế nào nhé.」"
2650 = "「Chà, may quá!」"
2652 = "「Nếu vậy thì, huề nhau!\\nThế nên, nha? Lần này phải làm hòa thật đó!」"
2655 = "「Vậy, cục này nha.\\nVới lại nè, anh biết không? Soutetsu.」"
2656 = "「Vậy, quyết định thế nha!」"
2658 = "「Không được đâu nha! Chiếu ánh sáng mạnh vào là nó sẽ bị đứng hình đó!」"
2660 = "「Vậy nha! Anh hai, Hachiroku, hẹn gặp lại sau!!」"
2661 = "「Còn em thì——\\nờm……cách gọi là gì ạ.」"
2663 = "「Vậy, em nên gọi ngài Soutetsu là gì đây?\\n\\x%l機関士;#00ffc040;Người lái tàu%l;#; Migita? Anh Soutetsu?」"
2668 = "「Một cảm xúc đen tối đeo bám dai dẳng——\\nmà ngay cả em cũng chưa từng biết đến——」"
2670 = "「Tất nhiên rồi! Nếu không thì sao mà chạy được!」"
2671 = "「Rồi, vậy thì.」"
2672 = "「Thế! Nên là?」"
2673 = "「Bơm nước vào lò hơi!」"
2676 = "「Tắt đèn á? Không phải là bật đèn pha chiếu xa sao?」"
2678 = "「Chào buổi sáng anh hai.」"
2679 = "「\\x%l機関士;#00ffc040;Người lái tàu%l;#; Soutetsu. Vậy, Hibiki là \\x%l機関士;#00ffc040;người lái tàu%l;#; Hibiki hả?」"
2680 = "「Soutetsu, cậu không biết hả? Vậy thì Hachiroku cũng\\nđỉnh ghê nha! Không phải chỉ được cái miệng đâu nhỉ!」"
2681 = "「Lúc Soutetsu hô 'Phanh khẩn cấp' rồi đạp \\x%lブレーキ;#00ffc040;phanh%l;#;,\\nđỉnh thật đó nha! Gần như cùng lúc luôn! Cả \\x%l汽笛;#00ffc040;còi hơi nước%l;#; lẫn việc tắt đèn pha nữa.」"
2684 = "「Ngài Soutetsu!」「Phanh khẩn cấpppp!!!!」\\n「っ!!!」"
2686 = "「Ngài Soutetsu. Hãy \\x%l絶気;#00ffc040;cắt hơi%l;#; đi ạ.」"
2688 = "「Ngài Soutetsu! Chào buổi sáng ạ.」"
2689 = "「Ngài Soutetsu?」"
2694 = "「Đồ chuẩn Mỹ?」"
2696 = "「OK, lần này mong được giúp đỡ đàng hoàng nha!\\nHachiroku!」"
2697 = "「OK đã rõ! Bắt cặp với ai cũng được hết á!\\nVì Olivy là đồ chuẩn Mỹ mà!」"
2703 = "「OK! Nhưng lỡ trời mưa thì sao?」"
2705 = "「OK! Hiểu rồi nha!」"
2706 = "「OK! Vậy đi thôi!」"
2709 = "「OK! Vậy, gọi là Soutetsu và Hibiki nha!\\nKhi làm nhiệm vụ thì là \\x%l機関士;#00ffc040;người lái tàu%l;#; Soutetsu và \\x%l機関士;#00ffc040;người lái tàu%l;#; Hibiki!」"
2711 = "「What happened!!?」"
2883 = "Bối rối vì thức dậy ở một nơi khác với mọi khi, mất một lúc tôi mới nhớ ra."
2891 = "Không hét lên mà phải \\x%l喚呼;#00ffc040;hô xác nhận%l;#; là \"Phanh khẩn cấp\",\\nsau đó kéo \\x%l汽笛;#00ffc040;còi hơi nước%l;#;, và bật đèn pha lên chế độ chiếu xa——"
2894 = "Không biết có phải do tôi đột ngột bước vào và cất tiếng gọi hay không,\\nmà Olivy lộ vẻ mặt sợ sệt——ưm?"
2896 = "Cô ấy đã khéo léo nhường công lao của mình cho Hachiroku\\n——sự tinh tế đó, tuy nhỏ nhặt nhưng lại rất dễ chịu."
2898 = "À không, tôi thì coi như chỉ biết mỗi Hachiroku và Reina thôi,\\nnhưng dù vậy…… tôi vẫn cảm thấy chuyện này khá là hiếm hoi."
2907 = "Mà với tư cách là \\x%l機関士;#00ffc040;lái tàu%l;#; và \\x%lレイルロオド;#00ffc040;Railord%l;#;,\\nchúng tôi cũng không ngừng thấu hiểu nhau sâu sắc hơn."
2914 = "Nghĩ kỹ thì cũng đúng."
2916 = "Nhìn bề ngoài thì có vẻ không bị bẩn hay trầy xước gì.\\nMay mà không bị ngã——à, không phải!?"
2919 = "Ngược lại, tôi còn cảm thấy xấu hổ,\\nvì bản thân đã thoáng có suy nghĩ gần như là suy diễn ác ý."
2921 = "Nhưng………… ngoài chấn động do \\x%l制動;#00ffc040;hãm phanh%l;#; ra thì không còn chấn động nào khác.\\nÀ, nếu vậy thì——"
2925 = "Tôi hoàn toàn không có ý định làm em ấy sợ,\\nnên vội vàng nói thêm."
2927 = "Nhưng, có vẻ không phải vậy.\\nTrên khuôn mặt tươi cười của Olivy không hề có chút ác ý nào."
2937 = "Một cú đập tay cực kỳ ăn ý."
2938 = "Cả hai đồng thời phản ứng rất nhạy cảm.\\nNhưng lại hoàn toàn trái ngược nhau."
2941 = "Thứ Hachiroku đưa cho tôi là than đá."
2942 = "Tôi vừa dứt lời, Hachiroku đã lập tức đáp lại.\\nPaulette không nói gì. Chỉ im lặng nhìn chúng tôi."
2944 = "Nhưng, có lẽ em ấy đã nhớ lại cảnh của Hibiki lúc nãy,\\nvà chậm chạp giơ tay phải lên——"
2946 = "Vừa dứt lời, mắt và tay của Hachiroku đã bắt đầu chuyển động."
2949 = "Hachiroku rụt rè gọi Olivy."
2950 = "Giọng nói nặng nề.\\nHachiroku cắn chặt môi."
2953 = "Cơ thể Hachiroku khẽ run lên.\\nTôi liền ôm lấy bờ vai cô ấy."
2955 = "Nở nụ cười nhẹ nhõm,\\nHachiroku nhanh chóng đưa tay phải ra."
2956 = "Hachiroku khẽ thở ra.\\nSau đó, cô ấy tĩnh lặng ngước nhìn tôi và nói tiếp."
2957 = "Hachiroku khẽ chạm vào tôi.\\nÁnh mắt cô ấy như muốn nói \"Đừng đi\"."
2962 = "Giọng nói của Hachiroku khiến tôi giật mình.\\nCảm giác như có một thứ gì đó mãnh liệt——giống như nỗi sợ hãi vậy."
2963 = "Hachiroku nhìn chằm chằm vào tôi.\\nVậy thì, để tôi nói tiếp phần còn lại."
2968 = "Trùng hợp là tôi cũng đang nghĩ vậy.\\nKhả năng căn thời gian chuẩn xác không kém gì Hachiroku của cô ấy khiến tôi phải kinh ngạc."
2983 = "Nagi cuống cuồng vung vẩy tay,\\nlàm cho bầu không khí trong Rail Shop trở nên dịu nhẹ hơn."
2984 = "Nagi thì bộc lộ rõ tâm lý ganh đua,\\ncòn Hibiki thì mang vẻ mặt đầy tự tin."
2987 = "Vừa trải qua sự cố như vậy,\\nkhi thư giãn lại, sự mệt mỏi sẽ ập đến cùng một lúc. Nhưng——"
2991 = "Vừa kết thúc báo cáo công việc,\\nHibiki và Olivy liền gục xuống vì kiệt sức."
2992 = "……Cuộc trò chuyện với Olivy lúc nãy thật tốt.\\nTôi có linh cảm trong cái rủi lại có cái may."
2996 = "Dù lúc đó tôi không có thời gian để nghĩ nhiều……\\nnhưng nghe cô ấy nói vậy, có lẽ tôi nên ra chỉ thị mới đúng."
3002 = "Chỉ cần có Suzu, có Hachiroku ở bên cạnh,\\ntôi sẽ ổn thôi. Tôi chắc chắn sẽ hoàn thành nhiệm vụ với phong độ tốt nhất của mình."
3004 = "Một pha hãm phanh khẩn cấp điển hình.\\nVứt bỏ mọi thứ khác, chỉ mong sao tàu dừng lại được."
3007 = "Nhưng, Hachiroku không hề chùn bước."
3010 = "Nhưng Paulette không hề tỏ ra ngạc nhiên,\\ncô ấy chỉ khẽ nghiêng đầu."
3028 = "Đúng vậy.\\nTôi khẽ gật đầu với Paulette, đưa tâm trí và câu chuyện quay trở lại."
3030 = "Tiêu rồi, chuyện này……đối với Olivy mà nói,\\ncó lẽ nghe như tôi đang coi thường Đường sắt Mikan vậy——"
3032 = "A, ra là vậy, chuyện hôm qua——đến cả Nagi cũng nhận ra——\\nOlivy đang tức giận vì bị \"đối xử như trẻ con\" sao."
3034 = "À, đúng rồi. Cứ như mọi khi——"
3036 = "A, thật là ngây thơ và hồn nhiên làm sao."
3038 = "Đúng rồi, hôm qua……\\nOlivy——\\x%lレイルロオド;#00ffc040;Railord%l;#; mới đã——"
3047 = "Bối rối, lúng túng, buồn bã——rồi tự kiểm điểm.\\nKhuôn mặt Hachiroku biến đổi liên tục trong nháy mắt."
3050 = "\\x%lレイルロオド;#00ffc040;Railord%l;#; mất đi toa xe.\\nToa xe mất đi \\x%lレイルロオド;#00ffc040;Railord%l;#;."
3071 = "Vẻ mặt ngạc nhiên.\\nChớp chớp mắt liên tục."
3072 = "Mỗi lần nhìn qua nhìn lại hai người đang đối mặt nhau,\\nánh mắt của Olivy lại càng thêm sáng rực."
3073 = "Đôi mắt Olivy sáng rực lên."
3074 = "Nói vậy. Nhưng Olivy vẫn chưa chịu nắm lấy,\\nbàn tay mà Hachiroku đang mỉm cười đưa ra."
3075 = "Buông tay ra, Olivy\\nkhẽ gõ nhẹ lên trán Hachiroku."
3076 = "Olivy…… nói sao nhỉ, cô ấy đang đứng sững ra đó.\\nNgẩn ngơ…… miệng há hốc."
3077 = "Vừa nói, Olivy vừa như chợt nhớ ra điều gì đó,\\ncô ấy mở cửa buồng đốt ra và nhìn vào bên trong."
3078 = "Chắc hẳn Olivy cũng đang tập trung cao độ.\\nÁnh mắt cô ấy như xuyên thấu lưng tôi, nhưng nếu cứ giữ vững phong độ này thì——っ!"
3079 = "Cô ấy cầm một mẩu than đã đập vụn,\\nsoi dưới ánh sáng lấp lánh từ trần nhà, rồi vui vẻ đưa vào miệng."
3080 = "Olivy cúi gập đầu thật sâu, Hachiroku định\\nvội vàng ngăn lại, nhưng lại bị Hibiki nhắc nhở."
3081 = "Trông Olivy có vẻ không vui ra mặt.\\nCó lẽ chủ đề này hơi nhạy cảm."
3082 = "Trước câu hỏi đầy thiện ý bất ngờ đó,\\nHachiroku chỉ mỉm cười nhẹ nhàng lắc đầu."
3083 = "Hai má Olivy bỗng chốc ửng hồng."
3084 = "Olivy giơ tay lên định đập tay,\\nnhưng Hachiroku không thể phản ứng ngay lập tức."
3085 = "Olivy giật mình thẳng lưng lên.\\nÁnh mắt lóe lên tia sáng tuyệt vọng."
3087 = "Tôi có thể hiểu được cảm giác đó."
3088 = "Lần này, khuôn mặt em ấy bừng sáng, chuyển sang nụ cười."
3091 = "Cô ấy cúi đầu như vậy vài giây——\\nrồi chậm rãi cất giọng như cố vắt kiệt từng chữ."
3094 = "Một phản ứng và giọng điệu thở phào nhẹ nhõm rõ rệt."
3096 = "Nhanh chóng trở lại với nụ cười, và lần này,\\nchính em ấy là người đưa tay ra để làm hòa với Hachiroku."
3097 = "Nói rồi, cô ấy lấy ra một tập tài liệu từ trên kệ.\\nKhá là dày."
3100 = "Trả lời xong,\\nnhưng Hachiroku lại cúi gầm mặt xuống, có vẻ khó nói."
3101 = "Em ấy hoảng hốt đến đáng thương."
3103 = "Nếu lỡ đâm phải một con vật lớn như vậy,\\nthì sẽ phải kiểm tra toàn diện——và 8620 sẽ không thể chạy được trong một thời gian."
3104 = "Sau khi nói rõ ràng điều mình không thích,\\nem ấy lại dùng nụ cười để thổi bay đi những khúc mắc vừa nảy sinh."
3108 = "Nagi cũng muốn trở thành \\x%l機関士;#00ffc040;người lái tàu%l;#; của Đầu máy số 9,\\nnhưng nếu sự ăn ý này được phát huy trong công việc, thì Hibiki có thể sẽ chiếm ưu thế hơn."
3115 = "Ở kiểu Hinamoto, hầu hết đều buộc phải bỏ đi.\\nNhưng nếu là kiểu Mỹ, thì không cần lo lắng về việc tái sử dụng."
3118 = "Ngay khoảnh khắc tôi ngừng lời,\\nHachiroku và Paulette đồng thời gật đầu."
3121 = "Về mặt vật lý cũng như độ khó, chúng tôi đã vượt qua được đỉnh điểm rồi."
3123 = "Nhìn cô ấy như một đứa trẻ đang ăn kẹo Konpeito,\\nbất giác tôi cũng mỉm cười theo."
3127 = "Một sức nặng bất ngờ đè lên vai trái tôi.\\nNhưng tôi làm gì có thời gian để xem đó là chuyện gì cơ chứ!"
3129 = "Bị đối xử——sao.\\nCách dùng từ của Hachiroku khiến tôi cảm thấy vô cùng bất an."
3133 = "Vừa chọn xong chỗ ngồi, Hachiroku\\nlại hăm hở lấy ra một cục than lớn đen bóng."
3134 = "Tôi giật mình.\\nCâu trả lời của Olivy nghe rõ vẻ miễn cưỡng."
3163 = "Nghĩ vậy, một cảm giác không tự nhiên mãnh liệt trào dâng trong tôi.\\nSự tươi sáng và kiên cường đó, lại xuất phát từ một trái tim đóng kín sao——"
3165 = "Hóa ra trong khoảnh khắc đó,\\nHachiroku đã tắt đèn pha giúp tôi sao."
3166 = "Dùng sức quá đà khéo đâm vào tay mất, khá là đáng sợ."
3171 = "Khi tôi \\x%l喚呼;#00ffc040;hô xác nhận%l;#;,\\nHachiroku cũng lập tức gật đầu đáp lại."
3173 = "Cứ như thể đã đợi sẵn từ lâu,\\nNagi liền xen ngang vào cuộc trò chuyện."
3175 = "Hình bóng tôi phản chiếu trong đôi mắt Hachiroku.\\nHachiroku trong mắt tôi, mới xinh đẹp làm sao."
3177 = "Tôi cảm thấy không ổn, và ngay khoảnh khắc đó, tôi đã chợt hiểu ra."
3178 = "Tôi xốc lại tinh thần.\\nDù vẻ ngoài trông trẻ con, nhưng Olivy lại là một người dày dặn kinh nghiệm hơn cả Hachiroku."
3181 = "Tôi cứ nghĩ hôm qua đã giới thiệu bản thân xong rồi……\\nNhưng có lẽ lúc đó Olivy không còn tâm trí nào để để ý."
3184 = "Tôi vừa làm theo lời cô ấy vừa trả lời."
3185 = "Tôi làm theo cách cô ấy đã dạy sáng nay,\\nbắt đầu đập vụn từ phía mép."
3189 = "Khiến tôi thoáng bất an,\\nkhông biết mình có làm gì khiến Olivy ghét mà không nhận ra không."
3190 = "Nghe kể lại như vậy, tôi chỉ biết gật gù.\\nDù cô ấy nhỏ bé và trông như một đứa trẻ như thế——"
3191 = "Tay phải tôi vẫn ấn chặt van phanh ở vị trí khẩn cấp,\\ncòn tay trái thì vòng qua ôm lấy Hachiroku!"
3192 = "Thành thật mà nói, tôi cứ tưởng là không kịp rồi.\\nGiờ mới thấy mồ hôi túa ra ướt đẫm cả lưng."
3195 = "Nên tự nhiên, em ấy lại có cách cư xử và nói năng như vậy.\\nNghĩ lại thì, ngay cả khi tiếp xúc với Reina hay Navi cũng thế."
3201 = "Nắm được bí quyết rồi còn được khen,\\ntôi cũng thấy vui lây."
3203 = "Đập xong một cục than,\\ntôi lại muốn thử đập thêm chút nữa."
3205 = "Kể cả là tôi, nếu đột nhiên bị chiếu ánh sáng mạnh vào mặt,\\nchắc chắn cũng sẽ bị chói mắt và không thể nhúc nhích được bước nào."
3207 = "Buông tay ra, Olivy khẽ làm động tác quyết tâm.\\nTrông em ấy tràn đầy nhiệt huyết."
3210 = "Vì thế, Hachiroku được kỳ vọng sẽ trở thành \"người chị cả lý tưởng\",\\nbản thân em ấy cũng mong muốn như vậy, và thực tế đã luôn cư xử như thế."
3224 = "Hibiki vội vàng ôm lấy Hachiroku rồi rời khỏi buồng lái."
3227 = "Hibiki và Olivy trao nhau nụ cười tươi rói.\\nBên cạnh đó, Nagi trông có vẻ khá tiếc nuối."
3229 = "Hibiki cũng rất đúng chất Hibiki,\\nlàm cho bầu không khí ấm áp vừa chớm nở càng thêm lan tỏa."
3234 = "Quả nhiên là vậy sao."
3239 = "Đến mức khiến tôi tự hỏi liệu vẻ mặt vừa rồi có phải là ảo giác không,\\nbiểu cảm và giọng nói của Olivy đều rất tươi sáng."
3258 = "Paulette cũng gật đầu đồng tình.\\nVậy thì cứ tiến hành mọi thứ theo đúng kế hoạch thôi."
3259 = "Trước lời khen ngợi chân thành của Hachiroku,\\nPaulette gật đầu mạnh mẽ đáp lại."
3260 = "Olivy như chồm tới,\\nnắm lấy bàn tay Paulette vừa đưa ra."
3261 = "Paulette cúi gầm mặt xuống,\\ncòn ánh mắt Hachiroku thì nhìn thẳng vào tôi một cách mạnh mẽ."
3262 = "Có thể thấy Paulette đã cẩn trọng chuẩn bị\\ncho việc đón nhận toa xe và \\x%lレイルロオド;#00ffc040;Railord%l;#; đến mức nào."
3264 = "Ngón tay Paulette lật qua những trang tài liệu."
3265 = "Nói rồi, Paulette gấp kẹp tài liệu lại.\\nChắc từ đoạn đó trở đi thì không cần xem tài liệu cũng biết rồi."
3266 = "Mỉm cười xác nhận điều đó,\\nPaulette cố tình lấy lại vẻ mặt nghiêm túc."
3270 = "Nhóm người dính đầy dầu mỡ và nhọ nồi\\nồn ào, vui vẻ rời đi."
3271 = "Để nhanh chóng làm thân với Olivy,\\ntôi cũng muốn hỏi thử một lần cho biết, nhưng——"
3272 = "Để được như vậy, trước tiên phải đến Yui đã.\\nSau đó quay trở lại Ohito!"
3274 = "Nhưng, Olivy không phải là em gái hay hậu bối của Hachiroku.\\nLà một người đã chạy lâu hơn cả Hachiroku, một sự tồn tại đáng được tôn trọng."
3278 = "Bởi vì nếu chúng tôi cứ tiếp tục chiếm dụng đường chính,\\nthì KiHa 07S sẽ không thể khởi hành đúng giờ được."
3280 = "Tiếng rên rỉ đau đớn khiến tôi lạnh toát cả người.\\nSự việc xảy ra quá nhanh khiến tôi hoàn toàn quên bẵng đi mất."
3282 = "Quả thực đầu máy số 9 có kích thước nhỏ và công suất có vẻ thấp.\\nCách bố trí trục bánh xe cũng là 0-6-0. Nghĩ thế nào cũng thấy hợp làm đầu máy chở khách hơn."
3284 = "Sau khi chắc chắn bóng dáng…… và tiếng bước chân của họ đã hoàn toàn biến mất.\\nTôi đã quyết định được những lời cần hỏi Hachiroku."
3286 = "Gì chứ, em ấy vui đến thế sao,\\nlàm lòng tôi cũng thấy ấm áp lây."
3293 = "Đời nào Kisaki lại đi dạy mấy cái đó chứ."
3295 = "Không——hoặc có lẽ em ấy đã tin chắc rằng hai người họ sẽ làm hòa,\\ncòn sớm hơn cả tôi."
3298 = "Một cái bắt tay ngắn ngủi, nhưng thật ấm áp."
3307 = "Dù vậy, những gì Hachiroku đang làm lúc này,\\nchính xác là sự \"đối xử như trẻ con\" mà Olivy căm ghét."
3308 = "Nếu chọn lọc những thứ tốt nhất từ đó để thay thế,\\nthì ánh hào quang của Lò hơi trúng thưởng sống sót sẽ càng thêm rực rỡ——"
3311 = "Giọng nói thật tươi sáng. Tôi thở phào nhẹ nhõm.\\nBước chân hướng về phía nhà bếp cũng trở nên thoăn thoắt hơn."
3317 = "Nhỡ may tôi làm hỏng việc, khiến cô ấy nghĩ \"Đường sắt Ohito chỉ đến thế này thôi sao\"\\nthì e rằng cũng chẳng tốt đẹp gì cho Olivy."
3325 = "Tuyến chuyên dụng cho sản xuất thép và đóng tàu——dù là vận chuyển vật liệu hay sản phẩm,\\nthì gánh nặng cũng không hề nhỏ chút nào."
3333 = "Một \\x%lレイルロオド;#00ffc040;Railord%l;#; tự mình nói muốn tận mắt xem tình trạng \\x%l保線;#00ffc040;bảo trì đường ray%l;#;,\\nđúng là hiếm thấy thật——"
3349 = "Khoảnh khắc nghe thấy, tôi chợt nhớ ra.\\nNhắc mới nhớ, lúc nãy Hachiroku đã hỏi——"
3350 = "Nghe vậy, tôi mới nhớ ra.\\nNếu muốn hỏi thì đây chính là cơ hội tốt."
3351 = "Nhắc mới nhớ, lúc nãy cũng có nhắc đến kiểu Mỹ gì đó."
3358 = "Với tư cách là Master của Hachiroku, là chồng của Suzu,\\nđó là nghĩa vụ tối thiểu, cũng như là phép lịch sự của tôi."
3359 = "\\x%lレイルロオド;#00ffc040;Railord%l;#; chiếc đầu tiên, của mẫu 8620 thuộc Đường sắt Hoàng gia đầy vinh quang,\\nchiếc \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; sản xuất hàng loạt trong nước đầu tiên."
3372 = "Trước phản ứng quá đỗi dễ đoán đó,\\ntôi cũng bất giác bật cười theo."
3373 = "Không xong rồi. Lại làm cô ấy giật mình nữa."
3374 = "Quả đúng là người dày dặn kinh nghiệm có khác.\\nVừa thở phào nhẹ nhõm, thì ngay lập tức một câu hỏi khác lại nảy lên trong đầu tôi."
3375 = "Trước điệu bộ quen thuộc của Nagi,\\nOlivy bật cười một cách vô cùng thích thú."
3376 = "Tôi nhớ lại.\\nCái khoảnh khắc một sức nặng mềm mại đè lên vai tôi."
3377 = "Nhắc mới nhớ, Olivy lại tò mò về điều ngược lại."
3378 = "Nếu vậy thì không có vấn đề gì cả.\\nHôm qua có vẻ hơi đột ngột nên làm em ấy giật mình, nhưng mà——"
3380 = "Nếu vậy thì chắc phải hỏi Paulette, hoặc là chủ nhân nhà tắm Tororyu-yu rồi."
3382 = "Vậy thì tôi,\\ndù sao đi nữa, cũng phải chuẩn bị khởi động lại máy——"
3385 = "Chuyện này——có lẽ mỗi lần đập than,\\ntôi nên lên tiếng báo trước một tiếng thì hơn."
3390 = "Đóng kín \\x%l共感;#00ffc040;cộng cảm%l;#;——\\ncó giống như cảm giác đóng kín trái tim không nhỉ?"
3395 = "Cùng nhau làm nhiệm vụ, cùng nhau trải qua thời gian,\\nchúng tôi không chỉ với tư cách là vợ chồng——"
3396 = "Sự thấu hiểu đó lập tức biến thành thiện cảm dành cho Olivy."
3397 = "Cùng với sự tỉnh táo dần dần,\\ncơn ngái ngủ và ký ức đang hoán đổi cho nhau."
3398 = "Với chúng tôi thì đó là chuyện hiển nhiên,\\nnhưng nghĩ kỹ lại thì, được tắm suối nước nóng sau khi làm nhiệm vụ đúng là một sự xa xỉ."
3399 = "Phản ứng kỳ lạ của Paulette cũng khiến tôi bận tâm,\\nnhưng chuyện của Hachiroku vẫn khiến tôi lo lắng hơn."
3400 = "Dù là chạy thử nghiệm, nhưng cũng phải cố gắng rút ngắn thời gian chậm trễ."
3404 = "Có lẽ vì vui mừng khi bàn ăn náo nhiệt hơn mọi khi,\\nHibiki mỉm cười, chắp hai tay lại."
3424 = "（Kịch!!!!）"
3425 = "（Ưm）"
3426 = "（A——ra là vậy, vì em ấy là chiếc đầu tiên sao.）"
3428 = "（Đập tay!!）"
3429 = "（Đập tay!）"
3430 = "（Tuúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúúú!!!）"
3431 = "（Tuuuuu!）"
3432 = "（Cạch! Cạch!!!）"
3433 = "（Cạch! Cạch!）"
3434 = "（Kéééééééééééééééééééééééééééééét!!!!）"
3435 = "（Ồ）"
3436 = "（Bịch）"
3438 = "（Sự chuyển đổi nhanh đến đáng ngạc nhiên. Cứ như bật tắt công tắc vậy——không, với tư cách là một đồ vật thì có lẽ thế mới là bình thường chăng?）"
3441 = "（Bốp!）"
3443 = "（Dẫn dắt, bao bọc các em, và đôi khi trở thành lá chắn cho chúng.\\nĐó có lẽ là bản tính, và cũng là thói quen của Hachiroku.）"
3444 = "（Chuyện này——phải nhắc nhở em ấy lúc không có Olivy mới được.\\nKhông, hay là ngay bây giờ thì tốt hơn——）"

