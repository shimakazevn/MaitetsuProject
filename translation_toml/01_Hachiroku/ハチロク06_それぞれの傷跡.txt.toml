[script]
67 = "\\x%l粘着力;#00ffc040;Lực bám đường%l;#; là lực mà \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; bám vào đường ray.\\nCòn lực xoắn là lực quay do động cơ tạo ra."
1179 = "Tôi nghe thấy một tiếng thở dài thườn thượt."
1196 = "「Dù là \\x%l保火;#00ffc040;giữ lửa%l;#;――\\nNhưng chị chưa nghe ngài Soutetsu nói gì sao?」"
1200 = "「Phía \\x%l客車;#00ffc040;toa hành khách%l;#; sẽ là ghế chỉ định đúng không?」"
1201 = "「――」"
1209 = "「Không nhận ra――bản thân em ấy đã nói như vậy.」"
1211 = "「…………」"
1214 = "「…………Chuyện đó thì…… vâng.」"
1215 = "「…………」"
1221 = "「……Theo lời Hachiroku,\\nthì nó vẫn có thể vận hành thêm 1~2 năm nữa. Nhưng――」"
1452 = "「Không chỉ vậy, cũng có những người sẽ thấy phiền nếu quần áo bị ám mùi nữa,\\nđiều đó cũng rất bình thường thôi.」"
1454 = "「Xin lỗi nhé, tôi rất muốn nói chuyện này trước chuyến tàu đầu tiên trong ngày.」"
1455 = "「Không thể chạy? Tại sao chứ? Chúng ta sẽ sửa nó mà? Đúng không?」"
1458 = "「Đừng cản em! Xin ngài, đừng đuổi theo em!」"
1462 = "「Nhưng mà, Hachiroku không phải đang nhõng nhẽo đâu.\\nChỉ là có quá nhiều chuyện xảy ra, nên em ấy hơi bối rối một chút thôi.」"
1463 = "「Nhưng, thời gian học viện mở cửa lại là mùa du lịch thấp điểm.\\nThời điểm học viện nghỉ lễ mới là lúc kiếm tiền từ du lịch――」"
1464 = "「Nhưng mà, lần này anh ấy lại đang rất phiền muộn.\\nVô cùng bối rối và hoang mang.」"
1466 = "「Không. Không phải vậy đâu.\\nĐúng hơn thì, em mới là người cần phải biết chuyện này đầu tiên.」"
1468 = "「À không, quả thực――có hơi kỳ lạ một chút ạ.」"
1469 = "「Chưa ạ――chưa ạ――」"
1474 = "「Em――đi đây.」"
1484 = "「Lý do mà trước đây anh trai không bao giờ tỏ ra phiền muộn――chắc chắn là vì.\\nAnh ấy đã kìm nén bản thân mình rất nhiều.」"
1486 = "「Trẻ con hư là sẽ bị búng trán đó nha.」"
1491 = "「Nhưng, lý do khiến Hachiroku chậm nhận ra vấn đề lần này,\\nkhông phải nằm ở đó. Mà hoàn toàn là do \"tôi\".」"
1493 = "「Nhưng mà, cách an toàn nhất để giảm \\x%l粘着力;#00ffc040;lực bám đường%l;#; là phải thiết kế lại từ phần trục bánh xe――về cả mặt chi phí lẫn kỹ thuật đều……」"
1501 = "「Đây cũng là một hình thức \\x%l列車;#00ffc040;tàu%l;#; du lịch địa phương……\\nNếu giải quyết được một số vấn đề, tôi nghĩ là sẽ ổn thôi.」"
1504 = "「Giải quyết bằng cách nào vậy?」"
1505 = "「Chị đến để \\x%l保火;#00ffc040;giữ lửa%l;#;――\\nChị đến để \\x%l保火;#00ffc040;giữ lửa%l;#; đó.」"
1513 = "「Bảo vệ…… em.」"
1514 = "「Khỏi tai nạn. Một vụ tai nạn lớn bắt nguồn từ việc \\x%l台枠;#00ffc040;khung gầm%l;#; bị hư hỏng,\\nđiều chắc chắn sẽ xảy ra nếu chúng ta cứ để nguyên tình trạng hiện tại.」"
1517 = "「Sửa thì nói nghe dễ lắm ạ――」"
1519 = "「Không phải là mới hỏng, mà có vẻ như nó đã bị hỏng từ lâu rồi.\\nTrong một thời gian dài――từ từ và âm ỉ. Và cuối cùng nó đã lộ rõ ra ngoài.」"
1521 = "「Giả sử không có vấn đề của tôi, không có cuộc cạnh tranh mời gọi nhà máy,\\nthì Hachiroku có vẫn nhất quyết đòi cho \\x%l8620;#00ffc040;8620%l;#; tiếp tục chạy không?」"
1537 = "「Hiểu lầm nhau thì cũng là chuyện bình thường thôi mà.」"
1538 = "「Hai năm……\\nCó khi em mới là người không trụ được đến lúc đó.」"
1540 = "「Chị Hachiroku cũng hiểu rõ điều đó mà.\\nĐã hiểu rõ rồi mà còn nói ra để làm khó người khác, thì đó chính là hư đó nha.」"
1541 = "「Bé Hachiroku không đi cùng anh sao?」"
1544 = "「Hachiroku――em bị ngã sao?」"
1547 = "「Tôi, Hachiroku à」"
1548 = "「Tôi ấy mà, Hachiroku――rất sợ tai nạn đường sắt.」"
1549 = "「Hachiroku. Tôi tin tưởng em.\\nTôi biết em luôn quan tâm đến tôi.」"
1556 = "「\\x%l8620;#00ffc040;8620%l;#; đã mang lại niềm vui cho rất nhiều người đúng không?\\n\"Bản tin buồng lái \\x%l8620;#00ffc040;8620%l;#;\" cũng đang được rất nhiều người đọc nữa.」"
1559 = "「Chị ấy mà, trước giờ luôn nghĩ. Vì anh trai rất thông minh và mạnh mẽ.\\nNên anh ấy sẽ không bao giờ có phiền muộn hay suy sụp đâu.」"
1560 = "「Chỉ còn lại vấn đề là làm hay không làm thôi.\\nNhưng mà, chuyện này――chúng ta đang ở trong tình thế buộc phải quyết tâm thôi.」"
1566 = "「Dù có \\x%l保火;#00ffc040;giữ lửa%l;#; đi nữa……\\n\\x%l8620;#00ffc040;8620%l;#; cũng không thể chạy được nữa đâu ạ.」"
1572 = "「Ra vậy, như thế thì khá là tàn nhẫn nhỉ.\\nVì hành khách chủ yếu của chuyến \\x%l列車;#00ffc040;tàu%l;#; này là những học sinh đang tuổi ăn tuổi lớn mà.」"
1608 = "「Ba cái trò búng trán này――không hề đau một chút nào cả.」"
1609 = "「――Nhưng mà.」"
1610 = "「Nhưng mà, chị Hachiroku~」"
1613 = "「Ưm」"
1615 = "「Hả!? Chờ, chờ đã――anh hai nói vậy á?\\n'Rất sợ tai nạn đường sắt' á――」"
1617 = "「Ủa? Hachiroku, sao em lại ở đây?」"
1619 = "「Oáp…… a――\\nA, Reina xin lỗi ạ~」"
1620 = "「Không sao」"
1622 = "「Kìm nén cả yêu lẫn ghét. Chắc chắn anh ấy đã biến tất cả thành nghĩa vụ.\\n――Vì thế nên anh trai mới không phiền muộn cũng chẳng suy sụp.」"
1623 = "「Không đâu, chính tôi là người đề xuất giờ này mà……\\nHơn nữa bình thường mọi người đã giúp đỡ tôi rất nhiều, chỉ dậy sớm một chút thì có đáng gì――」"
1625 = "「Dạ…… vâng ạ~」"
1627 = "「Để xem nào…… còn lại thì――\\nCòn lại thì, đúng rồi nhỉ.」"
1628 = "「Ưm」"
1629 = "「A――」"
1630 = "「A――Ra là ý đó ạ.」"
1632 = "「Ừ. Nếu có em ấy ở đây――\\nTôi sợ mình sẽ đưa ra quyết định sai lầm mất.」"
1634 = "「A ha!」"
1635 = "「A ha,\\nHachiroku cũng nói y hệt chị Paulette luôn.」"
1637 = "「A!」"
1638 = "「A!!」"
1639 = "「Hả!? Có chỗ nào bị hỏng sao?」"
1642 = "「A, ra vậy…… Trong thời gian học viện nghỉ,\\nchỉ cần đơn giản là điều chỉnh lại biểu đồ chạy tàu là được nhỉ.」"
1643 = "「Ừm. Đúng là vậy.」"
1645 = "「Ừm. Như vậy là tốt nhất đấy.」"
1646 = "「Ừm. Anh hai――anh trai có vẻ đang suy nghĩ theo hướng đó.\\nDù anh ấy vẫn đang đau đầu vì cho rằng nhiêu đó là chưa đủ.」"
1648 = "「Ưm」"
1650 = "「Ừ, điều đó thì tôi hiểu được.」"
1653 = "「Dựa trên tiền đề đó――\\nCho tôi xác nhận với em một điều duy nhất.」"
1654 = "「Do anh Soutetsu……」"
1655 = "「Kìm nén――bản thân mình sao?」"
1659 = "「……Em ấy vẫn luôn than phiền về tình trạng không ổn định.\\nRằng với tư cách là một \\x%lレイルロオド;#00ffc040;Railord%l;#;, em ấy không thể phát huy toàn bộ hiệu suất.」"
1666 = "「――――Tôi hiểu rồi. Vậy thì, để lúc đó chúng ta nói chuyện tiếp.」"
1667 = "「――Vâng.」"
1669 = "「Vâng, ngài cứ hỏi đi ạ. Ngài Soutetsu.」"
1672 = "「Nếu em không thể trả lời ngay lập tức――thì xin lỗi nhé, Hachiroku.\\nQuyết định ngừng hoạt động \\x%l8620;#00ffc040;8620%l;#; sẽ không thể thay đổi được đâu.」"
1675 = "「……Nếu có thể giải quyết được các vấn đề về kỹ thuật và vốn.\\nTất nhiên, tôi cũng nghĩ…… đó là cách tốt nhất.」"
1680 = "「Ngài Aki chắc chắn cũng rất đáng tin cậy rồi.\\nNhưng mà, chẳng phải chúng ta còn có những người đáng tin cậy hơn sao.」"
1684 = "「Việc sợ tai nạn đường sắt, chẳng phải là chuyện đương nhiên sao ạ.」"
1687 = "「Dù không dễ thì cũng sẽ sửa được thôi, đúng không?\\nBởi vì anh hai――anh trai cơ mà? Là Migita Soutetsu cơ mà?」"
1689 = "「Tôi sẽ làm.」"
1692 = "「Đã khám rồi――\\nKhám thì cũng đã khám rồi nhưng mà.」"
1697 = "「Búng, trán?」"
1698 = "「Búng trán á, người búng mới là người đau hơn đó nha.\\nChị Paulette mỗi lần búng trán Reina, đều làm ra vẻ mặt như sắp khóc ấy.」"
1702 = "「Có lẽ vậy. Ít nhất thì tôi nghĩ là như thế.」"
1710 = "「Những người dân Ohimitera, những vị khách đến tham quan――\\nCó nhiều người yêu mến \\x%l8620;#00ffc040;8620%l;#; hơn em nghĩ đấy.」"
1713 = "「Chúng ta chỉ còn cách suy nghĩ dựa trên tiền đề là \\x%l8620;#00ffc040;8620%l;#; sẽ ngừng hoạt động.\\nTừ đó, phải lập ra phương án tốt nhất càng sớm càng tốt.」"
1718 = "「À ừm――về vấn đề bộ phận chuyển động của Reina,\\nlà chuyện đó.」"
1720 = "「Ngài bảo vệ em, khỏi điều gì cơ ạ?」"
1722 = "「Cùng với thị trưởng Paulette, và Reina……\\nRốt cuộc ngài đang bàn bạc chuyện gì vậy ạ?」"
1723 = "「Nghĩ ngợi quá nhiều……」"
1725 = "「Muốn cái này, ghét cái kia――\\nNếu không có những cảm xúc đó, em không thấy thế giới này sẽ đơn giản hơn rất nhiều sao?」"
1726 = "「Chắc vậy. Chắc chắn là――\\nHai người đều luôn ngoảnh mặt làm ngơ trước những điều quan trọng trong lòng mình.」"
1727 = "「Em…… hư ở chỗ nào cơ chứ.」"
1729 = "「Tôi cũng đã nghĩ đến cách đó.」"
1732 = "「Giống nhau――sao ạ?」"
1733 = "「Tàu BBQ và chuyến tàu định kỳ sáng tối.\\nTôi muốn xem liệu có thể điều chỉnh thời gian của cả hai cho trùng nhau được không.」"
1737 = "「Để xem nào――biện pháp xử lý mùi hương. Tôi nghĩ là cần thiết đấy.\\nNếu mùi thịt nướng bay sang phía \\x%lキハ07;#00ffc040;KiHa 07%l;#;――phía \\x%l列車;#00ffc040;tàu%l;#; chạy thường ngày thì……」"
1739 = "「Về phía tôi.\\nLà vấn đề của \\x%l8620;#00ffc040;8620%l;#;.」"
1744 = "「Đúng là tôi đã nói vậy. Vì thế, vì em――\\nđể bảo vệ em, tôi đã quyết định sẽ tự mình đưa ra quyết định và chịu trách nhiệm về nó.」"
1745 = "「Hai người có hiểu lầm gì nhau à?」"
1746 = "「Có vẻ được đấy. Cũng có thể mang lại sự mát mẻ cho phía \\x%l客車;#00ffc040;toa hành khách%l;#; nữa.\\nNhưng mà…… có lẽ, nếu làm vậy thì――」"
1751 = "「Vậy nên…… mới không nhận ra sự biến dạng của \\x%l台枠;#00ffc040;khung gầm%l;#; sao?」"
1755 = "「Vì vậy…… xin ngài. Bây giờ hãy để em một mình.\\nVài giờ nữa, xin hãy cho phép em được nói chuyện tiếp với ngài.」"
1759 = "「Vì vậy, trong khoảng thời gian đó xin hãy sử dụng em và \\x%l8620;#00ffc040;8620%l;#; đến cùng,\\nchỉ cần ngài đạt được mục đích, dù cho em có……」"
1762 = "「Xin lỗi nhé. Tôi lại nói mấy lời kỳ lạ rồi.」"
1764 = "「Nhờ anh Soutetsu đã tranh thủ thời gian cho chúng tôi……\\nNên chúng tôi đã tìm ra được manh mối để giải quyết vấn đề rồi.」"
1770 = "「Nếu vậy…… giá như ngài ấy nói cho em biết ngay từ đầu.」"
1771 = "「Nếu vậy thì tại sao ngài lại bảo em――\\nnói ra mong muốn của mình…… ngài đã ra lệnh như vậy cơ mà.」"
1772 = "「Nếu vậy thì――tuy hơi đơn giản,\\nnhưng chúng ta thử đặt một chiếc quạt gió sạc điện ở chỗ nối toa xem sao?」"
1773 = "「Nếu vậy thì――tại sao, ngài Soutetsu lại.」"
1776 = "「Chị Hibiki mới đúng――sao chị lại ở đây?」"
1784 = "「Đúng không? Vì là anh hai mà.\\nAnh ấy tuyệt đối sẽ không bao giờ bỏ rơi \\x%l8620;#00ffc040;8620%l;#; đâu.」"
1788 = "「Vâng. Đúng vậy nhỉ……\\nCó vẻ chỉ là một sự hiểu lầm thôi ạ.」"
1789 = "「Rốt cuộc là đã nghĩ ngợi quá nhiều về chuyện gì cơ chứ?」"
1791 = "「Ừ. Sự biến dạng này, theo đúng nghĩa đen là một rủi ro có thể nhìn thấy được.\\nChúng ta không thể nào phớt lờ nó mà tiếp tục vận hành được.」"
1792 = "「Vậy sao.」"
1793 = "「Vâng.」"
1795 = "「Đúng vậy. Nhưng dù mạnh mẽ và thông minh thì cũng có lúc suy sụp chứ.\\nCàng thông minh…… thì có khi lại càng có nhiều phiền muộn hơn ấy chứ?」"
1797 = "「Ừ, suy sụp lắm. \"Cái anh trai đó\" cơ mà.」"
1799 = "「Vâng. Đúng là vậy ạ.」"
1801 = "「Vâng, khác với thời ở đường sắt khai thác mỏ, vì đây là tuyến Yui……\\nNên dù chọn cách nào thì chúng tôi cũng đã tính toán được là sẽ an toàn.」"
1802 = "「Là chuyện có liên quan đến \\x%l8620;#00ffc040;8620%l;#; sao ạ?」"
1806 = "「Thời gian, nói cách khác là sức lao động đúng không? Số lượng nhân công.\\nCàng có nhiều người thì càng rút ngắn được thời gian nhỉ.」"
1807 = "「――Nếu phải dậy sớm vì có chuyện quan trọng,\\nthì bao nhiêu lần tôi cũng làm được, không sao đâu.」"
1814 = "「Em là người đã từng trải qua tai nạn đường sắt và thấu hiểu nỗi đau đó.\\nNên không bao giờ có chuyện em xem nhẹ rủi ro tai nạn đâu ạ.」"
1815 = "「Chính em đã đảm bảo rằng,\\nnếu là hai năm thì sẽ không sao mà――」"
1817 = "「Được chứ ạ.\\nReina rất giỏi kéo đồ nặng đó nha~」"
1818 = "「Kỳ lạ, gì chứ――」"
1819 = "「Ừ. Muốn họ rút lại quyết định mời gọi nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;, muốn bảo vệ Ohimitera.\\nHachiroku đang mong muốn giúp tôi đạt được mục đích đó.」"
1826 = "「Bối rối, sao ạ? Ủa, ơ ơ!?」"
1827 = "「Tại sao lại sợ tai nạn đường sắt――\\nHachiroku, em đã hỏi anh hai cho đàng hoàng chưa?」"
1828 = "「Vô ích? Ý em là sao?」"
1832 = "「Vậy còn vấn đề ở phía chúng tôi thì sao đây.」"
1834 = "「Em đã bắt chị phải nỗ lực vô ích rồi nhỉ.」"
1836 = "「Nếu thấy không khỏe,\\nthì nhờ bà lão ở nhà tắm Tororyu-yu khám cho là được mà nha.」"
1838 = "「Reina? Ngoan nào? Lại đây với chị?」"
1840 = "「Reina. Cảm ơn em đã lo lắng,\\nvà mắng Hachiroku giúp tôi.」"
1842 = "「Hiện tại em đang bị quá nhiệt.\\nChỉ cần vài giờ nữa, chắc chắn em sẽ có thể hạ nhiệt lại được.」"
1845 = "「Vậy sao ạ?\\nEm thì lại không thấy như thế chút nào.」"
1846 = "「Nếu em không nhận ra điều đó, thì Hachiroku và anh trai,\\nhai người khá là giống nhau đấy.」"
1848 = "「Quả thực…… nếu là ngài Soutetsu thì chắc chắn sẽ làm được.\\nChỉ cần có đủ thời gian, kỹ thuật, thiết bị, và cả tiền bạc nữa.」"
1850 = "「Từ ngài Soutetsu…… trực tiếp nghe sao.」"
1853 = "「Thật vậy sao!」"
1861 = "「Vâng.\\nTôi cũng nghĩ đó là cách duy nhất.」"
1863 = "「Đến bản thân mình còn không thể kiểm soát được thế này thì……\\nĐừng nói là giúp ích cho ngài Soutetsu, có khi còn gây thêm rắc rối――」"
1864 = "「Đợi đã, Hachiroku!」"
1868 = "「Bà ấy bảo là 'Về mặt chức năng thì không có gì bất thường'……\\nNếu đã vậy mà vẫn thấy không khỏe, thì nguyên nhân chỉ là do 'nghĩ ngợi quá nhiều' thôi.」"
1874 = "「Chị nghe rồi. Hachiroku thì chạy đi mất――\\nLúc chị đến muộn, thì anh trai đang làm ra vẻ mặt như thế này này.」"
1876 = "「Mệnh lệnh đó, chắc chắn đã khiến em trở nên bất ổn,\\nkhiến em trở nên tham lam, và trở thành một đứa trẻ hư.」"
1877 = "「Xe đạp sao.」"
1883 = "「Nếu là trong thời gian nghỉ lễ, thì chắc chắn có thể điều chỉnh với phía học viện được.\\nTôi nghĩ là sẽ không có vấn đề gì đâu.」"
1884 = "「Nếu nhận ra \\x%l台枠;#00ffc040;khung gầm%l;#; bị biến dạng,\\nthì sẽ rất nguy hiểm và không thể chạy được nữa đúng không ạ.」"
1888 = "「Vạn nhất xảy ra tai nạn, thì hậu quả sẽ không thể lường trước được.\\nViệc chấn hưng du lịch bằng đường sắt cũng sẽ chỉ còn là giấc mộng viển vông.」"
1889 = "「――Thành thật xin lỗi ngài. Bây giờ, em xin phép.」"
1895 = "「Gánh nặng lên bộ phận chuyển động phát sinh từ hai nguyên nhân.\\nĐó là độ lớn của \\x%l粘着力;#00ffc040;lực bám đường%l;#; và lực xoắn của động cơ.」"
1900 = "「Tôi sẽ làm, và tôi có thể làm được.\\nVấn đề đó, phía chúng tôi sẽ giải quyết triệt để.」"
1901 = "「Nếu cứ sợ hiểu lầm,\\nthì em sẽ không bao giờ nói chuyện lại được với anh hai nữa đâu đấy?」"
1903 = "「Chuyện tôi muốn nói là về hư hỏng của \\x%l8620;#00ffc040;8620%l;#;.」"
1907 = "「Ra vậy.」"
1911 = "「Tôi nghĩ là vậy, nhưng có ổn không?\\nVí dụ như các buổi tập sáng của câu lạc bộ ở học viện thì――」"
1912 = "「Đúng…… là vậy nhỉ, quả nhiên là thế.」"
1916 = "「Sửa đổi biểu đồ chạy tàu sao? Sửa như thế nào cơ?」"
1917 = "「Xin chị hãy cho em biết lý do đó.」"
1918 = "「Cảm ơn em. Reina.」"
1919 = "「Cảm ơn chị. Chị Hibiki.\\nNếu vậy thì em――sẽ đi hỏi ngài Soutetsu đây.」"
1920 = "「Cảm ơn chị, chị Hibiki.」"
1928 = "「Tiền bạc, kỹ thuật hay thiết bị, chỉ cần có đủ người và mối quan hệ,\\nthì vấn đề nào cũng giải quyết được hết đúng không?」"
1957 = "「Chuyện đó――」"
1958 = "「Cái này……\\nChị Hachiroku không nhận ra nó đã đến mức này sao ạ?」"
1959 = "「Đó là――nhưng mà――」"
1960 = "「Chuyện đó……\\nNghe chị nói vậy, em cũng thấy có lý.」"
1961 = "「Chuyện đó――ngài Soutetsu.」"
1962 = "「Tôi đã nghe rõ. Và tôi cũng rất vui.\\nNhưng dựa trên điều đó, tôi đã đưa ra quyết định.」"
1963 = "「Nếu là chuyện đó thì, tối hôm qua,\\nchẳng phải ngài đã nói chuyện với em rồi sao ạ.」"
1964 = "「Chuyện đó thì, vâng.\\nVẫn như từ trước đến nay, là ghế chỉ định có thu phí.」"
1965 = "「Tôi không biết.\\nCó vẻ như chính Hachiroku cũng không biết.」"
1966 = "「Từ chính miệng anh hai――\\nEm phải nghe đàng hoàng từ anh ấy mới được.」"
1967 = "「Dạ, chị Hachiroku. Reina định búng nhẹ thôi mà――\\nÀ ừm, chị đau đến thế cơ ạ~」"
1968 = "「Chuyện đó là――Hachiroku.」"
1969 = "「Ngài đang nói về chuyện gì vậy ạ?\\nLà chuyện mà em không nên nghe sao?」"
1970 = "「Ý ngài là không thể tin tưởng vào phán đoán của em sao?\\nChỉ vì em là một \\x%lレイルロオド;#00ffc040;Railord%l;#; bị lỗi sao?」"
1972 = "「Nếu vậy thì, ví dụ như……\\nGắn bộ giới hạn cho động cơ chẳng hạn.」"
1973 = "「Chuyện đó bây giờ không quan trọng ạ.」"
1974 = "「Hỏi han gì chứ――sợ tai nạn là chuyện đương nhiên mà――!」"
1975 = "「Chị đã――thành thạo hơn rồi nhỉ. Chỉ trong một thời gian ngắn.」"
1976 = "「Nếu vậy thì, ra là thế. Chỉ cần giảm \\x%l粘着力;#00ffc040;lực bám đường%l;#; xuống,\\nhoặc giảm lực xoắn xuống là được sao.」"
1978 = "「Chuyện đó……\\nÝ chị là chúng ta sẽ lại nhờ cậy ngài Aki nhà Mori một lần nữa sao?」"
1979 = "「Chuyện đó!」"
1982 = "「Còn hai năm nữa.\\nTrong khoảng thời gian đó, em nhất định có thể chạy an toàn.」"
1983 = "「Nếu vậy thì――chúng ta sẽ quyên góp và kêu gọi tình nguyện viên sao?」"
1986 = "「Những học sinh đó,\\nđã đạp xe đến trường từ sớm hơn rồi.」"
1988 = "「Rồi sau đó Hachiroku đã làm gì với anh hai――ưm――anh trai……」"
1989 = "「Chuyện đó là――」"
1991 = "「Nếu vậy thì, nhờ cô tiến hành theo cách đó được không?」"
1993 = "「Vậy thì tốt rồi. Còn vấn đề gì khác không?」"
1994 = "「Nếu vậy thì tôi cũng――」"
1996 = "「Đương nhiên rồi.\\nBị rèn luyện kiểu Sparta đến mức đó cơ mà.」"
1998 = "「Nếu vậy thì tôi có chuyện muốn bàn đây. Từ một tháng và một ngày sau,\\nkhi mà các lịch đặt trước hiện tại đã được giải quyết xong――chúng ta có thể sửa đổi biểu đồ chạy tàu được không?」"
2002 = "「Vì thế nên, em đã nói rồi mà.」"
2005 = "「Hiện tại tôi chưa nghĩ ra được phương án cụ thể nào,\\nnhưng tôi muốn tiến hành đại tu――dù cho có khó khăn đến mức nào đi chăng nữa.」"
2006 = "「Anh Soutetsu là \\x%l機関士;#00ffc040;Lái tàu%l;#; của chị Hachiroku mà đúng không?\\nNếu không tin tưởng thì làm sao anh ấy có thể cùng chị chạy tàu được chứ.」"
2009 = "「Anh Soutetsu.」"
2010 = "「Ngài Soutetsu――quả nhiên ngài ở đây.」"
2011 = "「Ngài Soutetsu…… đã tính xa đến mức đó ngay từ đầu rồi sao?」"
2012 = "「Ngài Soutetsu.」"
2013 = "「Ngài bảo em có thể tin tưởng ngài――\\nChẳng phải ngài đã nói như vậy sao ạ.」"
2014 = "「Ngài Soutetsu đã nói là. 'Tôi rất sợ tai nạn đường sắt'.\\nNên em cứ tưởng ngài ấy đang trách mắng em.」"
2015 = "「Chắc chắn là――có đúng không ạ?\\nNgài Soutetsu có một lý do đặc biệt nào đó để sợ hãi tai nạn đường sắt.」"
2016 = "「Ngài ấy suy sụp lắm sao ạ? Ngài Soutetsu ấy.」"
2017 = "「Ngài Soutetsu!」"
2018 = "「Ngài Soutetsu…… em――」"
2019 = "「Không phải vậy sao ạ?\\nNgài Soutetsu chẳng phải là một người rất thông minh và mạnh mẽ sao.」"
2020 = "「Những vấn đề đó là gì?」"
2023 = "「Đầu tiên là thời gian.\\nBuổi sáng thì hơi quá sớm đối với một chuyến \\x%l列車;#00ffc040;tàu%l;#; du lịch.」"
2025 = "「!!?」"
2026 = "「!?」"
2028 = "「\\x%l客車;#00ffc040;Toa hành khách%l;#; BBQ và chuyến định kỳ vẫn giữ nguyên.\\nChỉ là, sẽ liên kết cả hai lại và cùng vận hành.」"
2031 = "『「――!」\\n「A」』"
2037 = "『「Bé Hachiroku!」\\n「Chị Hachiroku!」』"
2043 = "『「Anh Soutetsu」\\n「Anh Soutetsu」』"
2226 = "Lý do cho điều đó――không hiểu sao tôi lại nhận ra rằng,\\nđó là điều mà mình không nên hỏi."
2227 = "Một khuôn mặt bối rối."
2230 = "Vì \\x%l客車;#00ffc040;toa hành khách%l;#; nằm ở phía sau theo hướng di chuyển,\\nnên chỉ cần ngăn chặn mùi hương――hay nói cách khác là luồng không khí chảy ngược lại là được."
2232 = "Không, chắc chắn là――chị Hibiki đang cố tình,\\nlàm vậy để giúp tôi bình tĩnh lại."
2238 = "Cùng một câu nói nhưng không hiểu sao chị ấy lại lặp lại hai lần.\\nVì vậy, tôi cũng nhận ra."
2247 = "Vài giây――Mười giây――Một sự im lặng kéo dài."
2253 = "Nếu vậy, điều đó có nghĩa là……\\nViệc đại tu \\x%l台枠;#00ffc040;khung gầm%l;#;, quả nhiên là khó khăn đến mức――"
2261 = "Tôi muốn kiểm soát lại, nhưng sự quá nhiệt vẫn không thể dừng lại."
2265 = "Thị trưởng Paulette đã nhận ra điều đó trước cả tôi.\\nNgài ấy đã thảo luận với thị trưởng Paulette, chứ không phải với tôi."
2268 = "Hai người nhìn nhau trong chốc lát――\\nRồi Paulette hướng ánh mắt nhìn thẳng về phía tôi."
2269 = "Hai năm.\\nLà khoảng thời gian gia hạn mà cha của chị Mayami đã dành cho ngài Soutetsu."
2272 = "Một vụ tai nạn nữa có lẽ,\\nchắc chắn――sẽ phá hủy Hachiroku mất."
2274 = "Giọng của Hachiroku,\\nmột giọng nói hoàn toàn không có vẻ điềm tĩnh như thường ngày."
2279 = "Nếu cứ tiếp tục nói chuyện với ngài Soutetsu,\\ntôi thậm chí không thể đoán được mình sẽ mất kiểm soát đến mức nào nữa."
2284 = "Một động tác đẹp đẽ, không một chút dư thừa,\\ngiống như một bức tranh vậy."
2287 = "Cho dù rủi ro chỉ là rất nhỏ, nhưng những lựa chọn làm tăng khả năng xảy ra tai nạn,\\nHachiroku tuyệt đối sẽ không bao giờ cố ý thực hiện."
2289 = "Rõ ràng tôi tin chắc rằng hai năm tới có thể vận hành mà không xảy ra tai nạn,\\nnhưng đồng thời cũng dự đoán được rằng xác suất xảy ra tai nạn sẽ không thể tránh khỏi tăng lên."
2290 = "Ra là vậy.\\nCó lẽ tôi đã phần nào hiểu được ý chị ấy."
2292 = "Reina, người nãy giờ vẫn ngồi im lặng trên đùi thị trưởng Paulette,\\nbước xuống đất."
2294 = "Đó là niềm hy vọng rằng,\\nbiết đâu thị trưởng Paulette lại biết một công nghệ đột phá nào đó mà tôi không hay biết."
2336 = "Thay vào đó là một sự hoài nghi ngây ngô――\\nMột câu hỏi \"Tại sao?\" vô cùng đơn giản nhưng lại mãnh liệt."
2337 = "Ngài ấy đang cẩn thận lau chùi, phủi bụi và chỉnh lại phần đầu gối,\\nphần vạt váy bị bẩn do tôi vấp ngã."
2340 = "Thế nhưng cơ thể tôi lại tự động di chuyển,\\nvà khẽ né tránh bàn tay ấy."
2346 = "Xoạt, xoạt――\\nChị Hibiki liên tục xúc than ném vào trong."
2350 = "Thật vui. Thật nhẹ nhõm.\\nNhưng mà, tôi cũng cảm thấy hơi――một chút xíu thôi, hơi hối hận."
2356 = "Nếu cứ tiếp tục gượng ép chạy thêm hai năm nữa, sự biến dạng sẽ không thể phục hồi,\\nvà chắc chắn sẽ phá hủy \\x%l8620;#00ffc040;8620%l;#;――phân thân của em mất."
2359 = "Vì còn phải chuẩn bị trước khi làm việc,\\nnên giờ nào cũng được――càng sớm càng tốt."
2361 = "Trước khi tôi kịp tìm ra lời để hỏi,\\ngiọng của Paulette đã phá vỡ sự im lặng."
2370 = "Một câu nói vô cùng bâng quơ,\\nnhưng lại dập tắt một niềm hy vọng trong tôi."
2371 = "Ánh mắt em ấy dao động dữ dội.\\nNhư thể đang pha trộn tất cả sự tức giận, bất an và buồn bã."
2373 = "Cô ấy gật đầu."
2375 = "Một vẻ mặt thật kỳ quặc.\\nNhưng nó cũng phần nào gợi lên hình ảnh của ngài Soutetsu lúc đó."
2391 = "Để có thể trở lại là tôi của ngày thường,\\ntôi cố gắng chọn những từ ngữ giống với bản thân mình nhất, dù cho có cảm thấy áp lực."
2392 = "Bộ quần áo vốn luôn được chỉnh tề nay lại xộc xệch ở vài chỗ……\\nKhông――"
2413 = "Trong lòng. Trái tim.\\nNgài Soutetsu, là như vậy sao?"
2417 = "Có lẽ vị trí buộc phải suy nghĩ đến những điều đó trước tiên,\\nđã khiến Paulette chậm đưa ra quyết định."
2420 = "Còn em――em thì――\\nNhưng mà, em chỉ là một \\x%lレイルロオド;#00ffc040;Railord%l;#; thôi mà――"
2426 = "Tôi đã bị hỏng mất rồi.\\nRõ ràng một \\x%lレイルロオド;#00ffc040;Railord%l;#; không thể nào chống đối lại \\x%l機関士;#00ffc040;Lái tàu%l;#; được cơ mà."
2429 = "Tôi muốn ngắt luôn chức năng dự đoán của mình."
2431 = "Tôi không muốn nhìn thấy khuôn mặt như vậy, không muốn ngài ấy phải làm ra khuôn mặt như vậy,\\nnên tôi không thể lựa chọn từ ngữ cho cẩn thận được nữa."
2433 = "Tôi cảm thấy bản thân mình thật đáng sợ."
2434 = "Dù muốn gặp và muốn hỏi ngài ấy――"
2437 = "Tôi muốn biết ngài ấy đã thở dài với tâm trạng thế nào, muốn nhìn khuôn mặt ngài ấy\\n――Thế nhưng tôi lại sợ hãi, dù thế nào cũng không dám ngoảnh lại."
2438 = "Tôi nhận ra sự tồn tại của một mâu thuẫn không thể cứu vãn trong chính bản thân mình."
2441 = "Dù nhận thức được sự hoài nghi đó,\\nnhưng đồng thời tôi vẫn đặt niềm tin mãnh liệt vào Hachiroku."
2442 = "Dù biết đó là một câu nói có thể hiểu theo nhiều nghĩa, nhưng tôi vẫn cố tình làm nũng……\\nThế mà khi sự thật diễn ra như thế này, tâm trí tôi lại trở nên rối bời."
2444 = "Mỗi một lời nói ra, sắc mặt Paulette lại càng tái nhợt.\\nDù rất đau lòng, nhưng tôi không thể dừng câu chuyện lại được."
2447 = "Tôi cố gắng hết sức để kiểm soát,\\nít nhất là không để giọng nói của mình bị run rẩy."
2450 = "Tôi nhận ra sự mơ hồ trong chính lời nói của mình.\\nCó lẽ, đó cũng là sự hoài nghi tồn tại trong tôi."
2451 = "Chính bản thân tôi cũng không thể hiểu nổi,\\nhành động vô cùng sai trái đó của mình."
2455 = "Nên em cũng muốn đáp lại, em đã cố gắng hết sức.\\nThế mà \\x%l8620;#00ffc040;8620%l;#; của em――lại trở thành gánh nặng cho ngài Soutetsu……"
2457 = "Vì vậy, tôi nói lời cảm ơn một lần nữa, rồi khẽ bước đi."
2460 = "Vì vậy, tôi sẽ đẩy mạnh lưng cô ấy.\\nDù phải trả giá đắt đến đâu, cũng tuyệt đối không để xảy ra tai nạn."
2462 = "Vì thế――tôi đau――tôi――\\nChắc chắn tôi cũng hiểu được rằng――cảm giác này cũng là một nỗi đau."
2463 = "Vì vậy, tôi muốn ngài ấy nhìn tôi.\\nMuốn ngài ấy xoa đầu khen tôi là một cô bé ngoan như mọi khi."
2466 = "Mới có ba giờ.\\nBảo là sáng sớm thì quá sớm――vẫn còn đang là ban đêm."
2469 = "Những lời tiếp theo nghe rất sảng khoái, như thể đã rũ bỏ được mọi gánh nặng."
2474 = "Nếu vậy thì, em……\\nViệc em nên làm, chỉ có một thôi."
2489 = "Một tiếng cười giòn tan――như vừa được nhúng qua chảo dầu sôi."
2492 = "Chị Hibiki dàn đều \\x%lカマ;#00ffc040;lò hơi%l;#; thật rộng và đẹp,\\nrồi rải than lên trên đó."
2496 = "Tảng than mà chị Hibiki ném vào,\\nđã lấp gọn gàng phần trong cùng của \\x%lカマ;#00ffc040;lò hơi%l;#;."
2498 = "Sự tin tưởng tuyệt đối của chị Hibiki dành cho ngài Soutetsu.\\nTôi nhận ra mình đang ghen tị với điều đó."
2501 = "Chị Hibiki thở hắt ra một hơi như thể đang bối rối,\\nrồi lại nhìn chằm chằm vào tôi."
2502 = "Ánh mắt của chị Hibiki.\\nNghiêm túc đến đáng sợ, nhìn thẳng vào tôi."
2505 = "Chị Hibiki mỉm cười.\\nDù đang cười, nhưng trông chị ấy lại có vẻ hơi buồn bã."
2507 = "Nhún vai một cái,\\nchị Hibiki đổi sang cầm xẻng xúc than."
2510 = "Vừa nói \"như thế này này\",\\nchị Hibiki vừa làm ra vẻ mặt giống như xác chết biết đi trong phim vậy."
2511 = "Chị Hibiki cầm \\x%lポーカー;#00ffc040;móc bếp%l;#; lên."
2512 = "Điều mà tôi đã cảm nhận được ngay từ lúc tỉnh dậy."
2515 = "Thật đáng sợ――\\nDù không có lý do rõ ràng, nhưng tôi vẫn nhận thức được điều đó."
2520 = "Tên ngài Soutetsu được gọi lên――\\nKhông hiểu sao tôi lại không muốn nghe thấy giọng nói đó, liền rảo bước nhanh hơn."
2521 = "Có phải trên mặt, trong lời nói của tôi đã để lộ ra điều gì đó không?\\nPaulette khẽ gật đầu và ngồi thẳng lưng lên."
2523 = "……Trong khi vẫn chưa thể đối mặt ngay với vấn đề cốt lõi nhất,\\nthời gian trôi qua một cách nhẹ nhàng đến kỳ lạ."
2526 = "Có lẽ phương pháp tốt nhất vốn dĩ không tồn tại――\\nNếu vậy thì chúng ta phải chọn phương pháp tốt hơn và tiếp tục tiến bước."
2530 = "Đáng lẽ tôi đã quyết định rồi, đáng lẽ tôi chỉ có thể quyết định như vậy,\\nnhưng những lời này cứ thế vô tình thốt ra khỏi miệng."
2548 = "Vì muốn xua tan đi cảm giác đó,\\nvì muốn được ngài Soutetsu xua tan đi bằng lời nói, nên tôi mới hỏi."
2551 = "Đúng như những gì tôi đã mong muốn――\\nThế nhưng, tôi lại cảm thấy điều đó thật đau đớn và cô đơn."
2552 = "……Tiếng bước chân đuổi theo tôi.\\nVì tôi đã mong muốn như vậy, nên không hề vang lên."
2554 = "Cảm giác khao khát. Dục vọng.\\nChính nó đã biến thế giới của tôi thành một nơi đầy đau khổ."
2556 = "Sự ngây ngô đó cũng đã xóa tan sự do dự trong tôi.\\n――Quả nhiên, sự gượng ép này là không thể chấp nhận được."
2557 = "Nghe tôi nói vậy, ngài Soutetsu đã dừng lại."
2560 = "Không hề có chút gì dài dòng,\\nnhững lời nói được thốt ra một cách gãy gọn."
2579 = "Từ miệng Paulette, hàng loạt những vấn đề nhỏ nhặt được nêu ra.\\nVà chúng tôi liên tục lấp đầy chúng bằng những ý tưởng chi tiết."
2580 = "Paulette có vẻ hơi buồn ngủ."
2581 = "Ánh mắt thị trưởng Paulette cụp xuống đầy vẻ bất an――\\nNhìn theo ánh mắt ấy, tôi mới muộn màng nhận ra."
2582 = "Bàn tay Paulette bao bọc lấy Reina."
2583 = "Hít một hơi nhỏ và tĩnh lặng.\\nHơi thở được hít vào, dần dần chậm rãi biến thành lời nói."
2584 = "Bàn tay Paulette khẽ động đậy.\\nVà bàn tay Reina đặt lên trên đó."
2585 = "Trên khuôn mặt ấy đã không còn chút ngái ngủ nào nữa.\\nNếu vậy, tôi cũng không nên lãng phí thời gian."
2586 = "Paulette tròn xoe mắt, nhìn vào mặt Reina.\\nReina ngoan ngoãn gật đầu một cái rụp."
2587 = "Bản thân Paulette cũng hiểu rõ điều đó.\\nHiểu rõ và đang cố gắng chấp nhận nó."
2588 = "Khoảnh khắc tôi cho xem bức ảnh, cả Paulette và Reina đều á khẩu.\\nVì vậy, tôi chỉ truyền đạt lại y nguyên những gì Hachiroku đã nói."
2589 = "Cô ấy gật đầu.\\nVẻ mặt cứng đờ của Paulette giãn ra thành một nụ cười khổ gượng gạo."
2592 = "Một giọng nói dịu dàng.\\nMột cách nói chuyện chậm rãi."
2593 = "Một sự im lặng kéo dài.\\nMột cái gật đầu chậm chạp."
2595 = "Để chuẩn bị cho lần tạo hơi nước tiếp theo――\\nChị ấy đang duy trì mồi lửa――đang \\x%l保火;#00ffc040;giữ lửa%l;#;."
2597 = "Tại sao chị Hibiki lại thấu hiểu được sự bất an của tôi nhỉ.\\nTại sao chị Hibiki lại giúp đỡ tôi nhỉ."
2598 = "Không thèm lau đi vết bẩn trên đầu gối,\\nHachiroku tiến sát lại gần tôi."
2601 = "Không cần thay đổi các thiết kế khác,\\nchỉ đơn thuần là dùng bộ giới hạn để giảm công suất động cơ xuống."
2603 = "Sau đó dang rộng hai tay――\\nvà nhìn quanh một vòng."
2604 = "Nhưng, khi những vấn đề nhỏ nhặt chẳng mấy chốc được giải quyết――\\nThì ở đó chỉ còn lại một sự im lặng nặng nề, ngột ngạt."
2608 = "Thế nhưng, một phần khác lại lạnh buốt――\\nlạnh cóng lại, dường như không thể hoạt động được nữa."
2609 = "Thế mà lại cố tình,\\ncất công nói ra hai chữ \"đương nhiên\" đó thì――"
2612 = "Nhưng chị Hibiki không hề tỏ ra bận tâm.\\nVì thế, không hiểu sao――tôi lại thấy buồn."
2614 = "Thế nhưng, khuôn mặt ngài ấy――\\nlại có chút gì đó căng thẳng."
2615 = "Thế nhưng, ngài Soutetsu lại đột ngột khựng lại.\\nNgài ấy không nói một lời nào, và bàn tay cũng dừng lại giữa chừng."
2619 = "Reina cũng đang làm ra vẻ mặt như sắp khóc.\\nNhững tạp âm khủng khiếp lẫn lộn trong suy nghĩ khiến tôi trở nên hỗn loạn."
2623 = "Lời chỉ trích của Reina tuy ngây ngô nhưng lại như đâm trúng tim đen.\\nSự kích thích gần như là đau đớn ấy đã gợi lại ký ức trong tôi."
2624 = "Reina thốt lên một âm thanh kỳ lạ."
2626 = "Giọng của Reina cũng không còn chút ngái ngủ nào nữa."
2628 = "Là chuyện đương nhiên.\\nNhững chuyện đương nhiên, vì nó là đương nhiên, nên chẳng ai nói ra cả."
2629 = "Nếu bám chặt vào đường ray bằng một lực mạnh, và trục bánh xe bị vặn xoắn mạnh,\\nthì đương nhiên sẽ tạo ra sức mạnh lớn, nhưng tải trọng cũng sẽ lớn theo tương ứng――!"
2633 = "Đối với chẩn đoán vô cùng qua loa của bà chủ nhà tắm Tororyu-yu,\\ntôi thậm chí còn không buồn tức giận nữa."
2646 = "Một bàn tay trắng muốt.\\nNhững ngón tay dài――của một họa sĩ."
2649 = "Tôi gật đầu đồng tình, quả thực là như vậy."
2654 = "Vì vậy, tôi nghĩ. Tự nhiên trong lòng tôi trào dâng suy nghĩ ấy.\\nSự gắn kết bền chặt với Reina――chắc chắn đã làm cho Paulette trở nên mạnh mẽ."
2656 = "Chắc chắn điều đó sẽ gây ra nhiều tổn thất khác nhau,\\nvà khó có thể nói đó là phương pháp tốt nhất. Nhưng――"
2658 = "Và khi nói giọng phổ thông,\\nchị Hibiki đang cố tỏ ra người lớn, hoặc đang khoác lên mình vẻ mặt xã giao."
2660 = "Tôi có cảm giác như những sự việc vốn dĩ độc lập lại đang liên kết với nhau,\\nkhiến hệ thống kiểm soát ngôn từ của tôi càng trở nên hỗn loạn."
2661 = "Là \"sự đồng tình có điều kiện\".\\nNgay cả Paulette cũng chỉ có thể trả lời một cách đau khổ như vậy."
2662 = "Chắc hẳn em ấy đã đến đây rất vội vã."
2666 = "Chỉ cần nhìn lúc chị Hibiki nói chuyện với ngài Soutetsu là tôi hiểu.\\nCon người thật của chị Hibiki là nói giọng Kumamoto."
2668 = "Lại nữa rồi.\\nTầm nhìn của tôi đang bị bóp méo."
2670 = "Ánh mắt thật mạnh mẽ.\\nMạnh mẽ đến mức tôi chưa từng thấy bao giờ."
2675 = "Có lẽ là về vụ tai nạn,\\nnhưng em ấy đang suy nghĩ và trăn trở về nó như thế nào thì tôi không rõ."
2681 = "Vì vậy, tôi phải mở lời.\\nDù có ngột ngạt đến đâu, thì đó cũng chính là trách nhiệm của tôi."
2682 = "Dù không thể nói những lời vô trách nhiệm,\\nnhưng nếu có một điều chắc chắn thì đó là――"
2687 = "Trên đùi cô ấy,\\nReina đang há miệng ngáp thật to――"
2688 = "Và rồi thoăn thoắt,\\nkhông nói không rằng bước tới chỗ tôi――"
2690 = "Và kết quả của cuộc thảo luận là chúng tôi đã chọn giờ này."
2691 = "Ưm…… một giọng nói hơi nghèn nghẹn.\\nGiọng của Paulette pha lẫn chút đượm buồn."
2696 = "Nếu là xe đạp không bị ảnh hưởng bởi việc không thể hoạt động như \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nthì quả thực đó không phải là khoảng cách không thể đi được."
2700 = "Trái ngược với sự hưởng ứng nhiệt tình của tôi,\\ngiọng điệu của Paulette lại càng trở nên ngập ngừng hơn."
2701 = "Nói chuyện với chị Hibiki, sự hỗn loạn trong tôi dần được sắp xếp lại."
2703 = "Nếu tôi không chỉ ra――nếu không có ai chỉ ra,\\nthì có lẽ Hachiroku vẫn sẽ tiếp tục che giấu sự thật này."
2706 = "Trong khoảng thời gian đó, nếu không thể ép họ rút lại quyết định mời gọi nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nthì chắc chắn ngài Soutetsu sẽ phải rời khỏi Ohimitera."
2708 = "Việc suy luận ra lý do đó, có vẻ sẽ dẫn đến một sự cố lớn\\n――Nhưng cũng chính vì vậy, tôi nhận ra mình cần phải biết."
2710 = "Tuy hơi bất ngờ, nhưng nghĩ lại thì\\ntuyến Ohimitera - Yui cũng chỉ dài khoảng hai mươi mấy kilomet."
2716 = "Tôi có cảm giác như mình vừa bị ruồng bỏ."
2720 = "Paulette vừa lên tiếng,\\nReina liền mím chặt môi, chờ đợi câu tiếp theo."
2734 = "Một câu nói không hề có chút do dự nào."
2735 = "Những lời nói, thật nặng nề.\\n……Ảnh hưởng xấu đến mặt kinh doanh và độ tin cậy."
2736 = "Những lời đó vô tình thốt ra――\\nVà khoảnh khắc tiếp theo, tôi chợt nhận ra \"A\"."
2737 = "Nói ra thành lời để sắp xếp lại suy nghĩ,\\nƯm…… Paulette bắt đầu trầm ngâm."
2738 = "Vừa nói xong,\\nmắt Paulette đảo quanh một vòng."
2745 = "Hầu như không có chút lực tác động nào,\\nnhưng――một nơi nào đó trong tôi lại dao động dữ dội."
2748 = "Tiếng bước chân lạch bạch, chậm rãi rời đi.\\nMột hơi ấm to lớn khẽ khàng tiến lại gần tôi――"
2763 = "Bàn tay ấy, trông vừa như đang che chở bảo vệ,\\nlại vừa như đang bám víu dựa dẫm."
2764 = "Trước tin vui quá đỗi bất ngờ này,\\ntôi bất giác nhổm người khỏi ghế."
2765 = "Một kết cục hoàn toàn có thể dự đoán được dựa trên những lý do rõ ràng.\\n――Một tương lai như vậy, tôi tuyệt đối không muốn đón nhận."
2766 = "Giọng nói thường ngày của ngài Soutetsu.\\nMột giọng nói dịu dàng."
2767 = "Đáng lẽ đó phải là những lời nói khiến tôi vui mừng,\\nmột nơi nào đó trong mạch suy nghĩ của tôi bỗng nhiên rực lên sức nóng của niềm hạnh phúc."
2768 = "Chuyện như vậy――\\nChuyện như vậy…… em tuyệt đối sẽ không làm."
2769 = "Đó là điều hiển nhiên.\\nNhư 0 và 1, không hề mơ hồ, là một sự thật không thể chối cãi."
2770 = "Đây, chính là ví dụ thực tế cho việc,\\n\"ngoảnh mặt làm ngơ\" mà chị Hibiki vừa nói sao?"
2771 = "Nếu vậy thì, việc đi lại giữa \\x%lキハ07;#00ffc040;KiHa 07%l;#; và \\x%l客車;#00ffc040;toa hành khách%l;#; thịt nướng\\nchắc sẽ không xảy ra thường xuyên đâu."
2773 = "Ngay cả \\x%l8620;#00ffc040;8620%l;#; cũng――\\nA, đúng vậy. Ngài Soutetsu, chắc chắn sẽ không bỏ rơi bất kỳ ai."
2777 = "Vừa nói, chị Hibiki vừa dùng ngón cái chỉ vào ngực mình."
2779 = "Bàn tay ấy, đang rung lắc dữ dội.\\nToàn bộ hình dáng ngài Soutetsu, cả thế giới này đang rung lắc, nhòe đi và chao đảo."
2780 = "Khi tỉnh dậy, ngài Soutetsu không ở bên cạnh――\\nSự cô đơn, bất an, và cả thứ cảm xúc hòa lẫn trong đó. Sự xa lánh."
2786 = "Mở nắp \\x%lカマ;#00ffc040;lò hơi%l;#; ra,\\nrồi chọc vỡ những tảng than bên trong kêu sột soạt."
2788 = "Tôi muốn ngài ấy phủ nhận rằng \"Không phải vậy\".\\nNhưng tôi cũng lờ mờ đoán được rằng, chắc chắn mọi chuyện sẽ không như ý muốn."
2789 = "Dù hiểu rằng cảm giác đó là vô lý,\\nnhưng những phần ngoài tư duy của tôi vẫn đang vượt tầm kiểm soát."
2791 = "Chắc chắn ngài Soutetsu sẽ cười và nói \"Đúng là vậy nhỉ\".\\nNgài ấy sẽ cười, và chắc chắn sẽ xoa đầu tôi."
2792 = "Bàn tay ngài Soutetsu vươn tới.\\nHướng về phía chiếc mũ của tôi, giống hệt như mỗi khi ngài ấy khen ngợi tôi."
2793 = "Bàn tay ngài Soutetsu xoa đầu Reina.\\nBàn tay ấy――vừa nãy đã không thể xoa đầu tôi."
2794 = "Ngài Soutetsu không nhìn vào mặt tôi."
2795 = "Ngài Soutetsu có lẽ cũng không hiểu được ý nghĩa của nó……\\nNên khuôn mặt ngài ấy lại càng trở nên bối rối hơn."
2796 = "Ngài Soutetsu dùng khăn tay nhẹ nhàng lau mặt cho tôi.\\nThế giới đang chao đảo nhờ vậy mà rõ ràng trở lại."
2797 = "Ngài Soutetsu dù biết rõ em bị lỗi,\\nnhưng vẫn trở thành \\x%l機関士;#00ffc040;Lái tàu%l;#; của em, và đã cố gắng vì em đến nhường nào."
2799 = "Ngài Soutetsu không xoa tóc tôi qua lớp mũ nữa,\\nmà rút bàn tay ấy về chỗ cũ."
2800 = "Bàn tay ngài Soutetsu đang nắm chặt lại.\\nNắm chặt đến mức run lên bần bật."
2801 = "――Khuôn mặt ngài Soutetsu tối sầm lại."
2802 = "Tôi sợ hãi khi ngài Soutetsu không nói gì.\\nĐể lấp đầy khoảng lặng đó, tôi vội vã nói thêm."
