2028 = "「...Tại sao em lại không bỏ lại ngài Soutetsu phía sau ạ?」"
2034 = "「Sữa thì tôi giảm giá đặc biệt ba chai tám mươi yên. \\nTất cả gộp lại, một nghìn yên là được.」"
2038 = "「Reina——ừm thì,\\nđi cho trưởng ga Kon ăn cơm đây ạ.」"
2041 = "「Chào hỏi cẩn thận quá nhỉ.\\nNhưng mà, ừm——nhìn gần thế này thì...」"
2043 = "「Trông mặt cậu có vẻ nên gội rửa cho sảng khoái lại đi.」"
2045 = "「Ra là vậy.」"
2050 = "「Thế nào, là sao——ý em là gì?」"
2051 = "「Ngài thấy thế nào ạ?」"
2052 = "「Đến nhà ga cuối cùng. \\n——Một ngày nào đó, nhất định.」"
2053 = "「Nói tóm lại, là lý do tôi thích em.\\nCó phải đó là do sự sợ hãi hay không——」"
2059 = "「Và rồi, những dấu vết của vụ tai nạn...\\nĐiều đó đã ảnh hưởng đến tôi rất nhiều.」"
2064 = "「Từ sau khi nói chuyện đó, thái độ của cậu ấy với cô, có phần……\\nTôi cảm thấy như cậu ấy đang giữ khoảng cách vậy.」"
2068 = "「Nếu bằng mọi giá muốn giải quyết thì đến chùa đi. \\nLúc đó, nhớ mang theo tiền mặt chứ không phải sữa đâu nhé.」"
2070 = "「Nếu vì một động lực nào đó mà nó nới lỏng ra, thì sẽ tháo gỡ được... \\nChuyện như vậy, có lẽ cũng có thể xảy ra.」"
2072 = "「Nếu ngay cả ý thức cũng không thể chạm tới, thì thứ đang trói buộc tôi chính là vô thức. \\nCó lẽ đó chính là tâm lý sâu thẳm mà em đã nói.」"
2074 = "「Cậu có tự nhận thức được không. \\nNếu có, thì tôi cũng chẳng cần phải nói thêm gì nữa.」"
2076 = "「Nếu thứ 'không còn' mà tiếp cận thì đó gọi là 'ám'. \\nCòn nếu thứ 'mờ ảo' vẫn còn tồn tại thì——」"
2078 = "「Làm thế nào để trở nên ấm áp hơn nhỉ.」"
2079 = "「Nếu không có việc gì đặc biệt,\\nhôm nay hai người cứ thế nghỉ làm cũng được đấy ạ?」"
2081 = "「Nói là u linh (yuurei), cũng nói là vong linh (bourei) đúng không?\\nCậu thanh niên thấy sao? Có biết nó khác nhau ở điểm nào không.」"
2089 = "「Ảo tưởng, ạ——」"
2090 = "「Hiểu lầm——」"
2092 = "「Em nói ngốc nghếch gì——!」"
2093 = "「Việc tôi ngất xỉu...\\nThành thật mà nói, là do nhiều chuyện chồng chéo lên nhau thôi.」"
2094 = "「Sao, nhỉ——」"
2095 = "「Vâng, em đã phân loại xong rồi ạ.」"
2096 = "「Để hai người đợi lâu rồi. Cậu Migita. Cô Hachiroku.」"
2104 = "「Lời rồi lời rồi.\\nThế? Muốn tôi gặp ai——À.」"
2106 = "「Tôi đã mơ thấy Michi... thấy em gái tôi.」"
2109 = "「Michi, mẹ, và cả cha nữa——đều đã đi trước tôi.\\nĐặc biệt là Michi. Con bé cứ chầm chậm, từ từ, rời xa tôi.」"
2114 = "「Em vất vả rồi.」"
2127 = "「Danh sách này, tuyệt vời lắm đấy.\\nTheo đúng nghĩa đen, quả không hổ danh là số hiệu đầu tiên.」"
2128 = "「Chuyện đó thì không sao đâu.\\nCũng sắp đến giờ đóng cửa rồi mà.」"
2129 = "「Đúng vậy. Nhưng mà...」"
2130 = "「Tất nhiên rồi, những thứ tầm đó thì」"
2131 = "「Vậy sao. Nếu vậy, có lẽ tôi sẽ làm theo lời cô.」"
2132 = "「——Vậy sao.」"
2133 = "「Nếu không có vấn đề gì trong đợt kiểm tra này,\\nthì cuối cùng——chúng ta cũng sẽ tiến hành thay thế \\x%l台枠;#00ffc040;khung gầm%l;#; nhỉ.」"
2135 = "「!」"
2136 = "「Cháu cảm ơn ông.\\nCòn phiền ông sắp xếp cả việc kiểm tra nữa——」"
2137 = "「Vẫn còn... một chuyện nữa.\\nLý do khiến tôi tự nghi ngờ bản thân... ngất xỉu là——」"
2138 = "「Xin ông đừng bận tâm, ông Fuchi.」"
2140 = "「Chuyện là vậy đó——\\nNhưng mà, có phải chuyện có thể đứng nói được không?」"
2141 = "「Vào khoảnh khắc đó, những thứ ấy đột ngột ùa về——\\nVì thế, tôi hoàn toàn không thể tin tưởng vào chính bản thân mình nữa.」"
2144 = "「Đó là——'mờ ảo'」"
2146 = "「Vậy, em đi trước nhé——\\nÀ, mà nói đúng hơn thì, cũng đến giờ rồi.」"
2148 = "「Đó là vì, em là——」"
2150 = "「Đương nhiên rồi ạ. Vì em đã rất cố gắng để lập ra nó mà.」"
2152 = "「Chuyện đó——ông đã nói chuyện đó với ngài Soutetsu,\\ntừ lúc nào vậy ạ?」"
2154 = "「Làm thế nào để——nó nới lỏng ra được ạ?」"
2155 = "「Nếu vậy thì, sự nghi ngờ của ngài Soutetsu,\\nchắc chắn là, không có ý nghĩa gì đâu ạ.」"
2157 = "「Thế rồi, ngài Soutetsu——」"
2158 = "「Vậy?」"
2163 = "「Cậu Soutetsu.\\nNếu rảnh tay, cho tôi xin chút thời gian được không?」"
2164 = "「Ngài Soutetsu thì sao ạ——」"
2165 = "「Ngài Soutetsu——」"
2166 = "「Ngài Soutetsu lúc nãy vừa nói rồi mà?\\nRằng giấc mơ, là sự biểu hiện của tâm lý sâu thẳm——」"
2167 = "「Ngài Soutetsu——」"
2168 = "「Ngài Soutetsu——đã trở nên,\\nghét bỏ em rồi sao ạ?」"
2169 = "「Ngài Soutetsu đã tránh mặt em, đúng không ạ?\\nVì thế, em——」"
2170 = "「Ngài Soutetsu có chút……thay đổi,\\ncó lẽ, không phải là do ảnh hưởng của ông đâu ạ.」"
2171 = "「Những chuyện \"nhiều chuyện chồng chéo\" của ngài Soutetsu,\\nđây, đã là tất cả chưa ạ?」"
2172 = "「Ngài Soutetsu!」"
2173 = "「Để tâm, sao ạ? Ngài Soutetsu ư?」"
2174 = "「Ngài Soutetsu? 'Mờ ảo' nghĩa là sao ạ」"
2175 = "「Ngài Soutetsu?」"
2176 = "「Việc bị bỏ lại, phía sau ạ.」"
2177 = "「Có vấn đề gì xảy ra sao?」"
2178 = "「Cảm ơn ông.\\nHachiroku, giao lại cho em một lúc nhé.」"
2180 = "「Số hiệu đầu tiên quả nhiên là khác biệt nhỉ.\\nLại có một mạch suy nghĩ phức tạp đến như vậy.」"
2182 = "「!」"
2183 = "「!!?」"
2184 = "「Là anh \\x%l機関士;#00ffc040;lái tàu%l;#; của \\x%l列車;#00ffc040;chuyến tàu%l;#; BBQ sao.」"
2190 = "『「Hử!?」\\n「Á!?」』"
2343 = "\"Nếu nói ra, có thể mình sẽ bị ghét bỏ\"\\nChỉ cần nghĩ như vậy... cổ họng như tê liệt lại."
2346 = "Cảm giác như đã rất lâu rồi mới lại như thế này. \\nTấm lưng nhỏ bé của Hachiroku, vô cùng ấm áp và mềm mại."
2347 = "Chầm chậm, tự nhiên—— \\nTừ chính bên trong của thứ 'mờ ảo' đó."
2351 = "Có cảm giác như máu đang đông cứng lại.\\nNhưng tôi không thể hiện điều đó ra ngoài."
2352 = "Như bị nói trúng tim đen,\\nBên cạnh tôi đang đứng chôn chân tại chỗ——"
2355 = "Quả đúng là, thời gian trôi qua lúc nào không hay.\\nKhông ngờ chúng tôi lại say sưa trò chuyện với nhau đến vậy."
2357 = "Có phải do ngồi không được thoải mái không? \\nHachiroku hơi nhấc mông lên một chút, điều chỉnh lại tư thế."
2360 = "Nhưng——giờ có hối hận cũng vô ích.\\nNếu em ấy đã cứng đờ, thì hãy bắt đầu lại từ việc giúp em ấy thả lỏng."
2362 = "Có lẽ em ấy đã chạy đến, mái tóc hơi rối, đôi má ửng hồng——\\nnở một nụ cười rạng rỡ đến mức khiến tôi cũng cảm thấy vui lây."
2370 = "Họ đang cho thợ cơ khí——ông Fuchi của công ty Toa xe Hinamoto xem\\nmàn hình hiển thị gắn ở gốc của bộ phận giống như ống nghe."
2372 = "Góc mặt nghiêng trông có vẻ đau khổ đó,\\nkhiến em cảm thấy bất an."
2373 = "Bước chân của ông ấy khá nhẹ nhàng.\\nNhìn nét mặt cũng có thể thấy ông ấy đang thở phào nhẹ nhõm."
2376 = "Ông ấy gãi đầu sột soạt.\\nTrông chẳng sạch sẽ chút nào."
2383 = "Tiếng dép tuyết lạo xạo vang lên, vị trụ trì dần tan vào màn đêm."
2385 = "Như thể nói thay em ấy, những lời chân thật thốt ra từ miệng tôi."
2387 = "Vị trụ trì nhìn chằm chằm vào mặt tôi.\\nRồi ực một hơi cạn sạch chai sữa trái cây."
2389 = "Vị trụ trì mở nắp chai thứ hai,\\nlần này là sữa cà phê, rồi ực một hơi cạn sạch."
2390 = "Đưa mắt nhìn Hachiroku với vẻ thán phục,\\nNgay khoảnh khắc tiếp theo, đôi mắt ấy trợn trừng chuyển sang nhìn tôi."
2408 = "Chỉ thấy nhẹ nhõm.\\nDù tôi hoàn toàn không hiểu ý nghĩa của câu hỏi đó."
2415 = "Giọng cô Paulette vang lên từ phía cửa.\\nNghe thấy vậy, nhiệt độ trên khuôn mặt ngài Soutetsu đã quay trở lại."
2418 = "Hachiroku làm động tác tay như muốn nói \"Hyu~ doro\" (tiếng ma quỷ xuất hiện),\\nrồi cũng hỏi thẳng vị trụ trì."
2419 = "Hăng hái nói như vậy,\\nrồi Hachiroku cứ thế——nhìn chằm chằm."
2421 = "Hachiroku hôm nay, ngây thơ đến lạ lùng."
2425 = "Bàn tay nhỏ bé, nhỏ bé của Hachiroku vươn ra.\\nNắm lấy tôi, ôm trọn tôi vào lòng."
2426 = "Hachiroku uống trà một cách thanh lịch,\\nrồi sau đó \"phù\" một tiếng, khẽ thở ra một hơi nhẹ nhõm."
2428 = "Những gợn sóng do Hachiroku tạo ra ngày càng nhỏ dần, rồi xa dần."
2431 = "Lưng Hachiroku cứng lại. \\nCó lẽ là do em ấy nhận ra mình vừa định làm như vậy."
2432 = "Nhẹ nhàng, nhẹ nhàng, tôi được những ngón tay nhỏ bé của Hachiroku vuốt ve."
2435 = "Đôi má Hachiroku dần ửng đỏ.\\nThật đáng yêu, thật đáng mừng. Vì vậy, những lời chân thật cứ thế tiếp tục."
2436 = "Ánh mắt Hachiroku, không rời khỏi tôi dù chỉ một chút."
2439 = "Hachiroku thả lỏng cơ thể."
2440 = "Đôi mắt Hachiroku dao động mạnh."
2442 = "Biểu cảm tinh tế của Hachiroku,\\ncho tôi biết rằng lời nói của mình vẫn còn thiếu sót."
2443 = "Phù——.\\nMột tiếng thở phào nhẹ nhõm thật dài, thật dài có thể nghe thấy rõ ràng."
2446 = "Hachiroku, mỉm cười.\\nMột nụ cười rất khẽ."
2447 = "Tiếng cửa tủ lạnh mở ra.\\nTiếng chai sữa chạm vào nhau lanh canh."
2459 = "Cái đầu cạo trọc nhẵn thín, khoác trên mình bộ y phục nhuộm mực đen.\\nĐây, có lẽ là——"
2460 = "Lý do lời nói của Hachiroku bị nghẹn lại lúc nãy.\\nCó lẽ, tôi cũng đang tự mình trải nghiệm điều đó ngay lúc này."
2461 = "Nụ cười vô cùng tự nhiên lúc mới gặp đã thay đổi hoàn toàn,\\nhiện tại trông em ấy rất gượng gạo, hoàn toàn cứng đờ."
2462 = "Một giọng nói tươi sáng vang lên ngay khi tôi vừa bước ra khỏi Rail Shop.\\nLà Hachiroku."
2471 = "Ấn tượng, đã phai nhạt rồi. Nhưng...\\nDù phai nhạt vẫn còn đọng lại một cảm giác duy nhất."
2473 = "Cho dù sự hiểu lầm hay ảo tưởng,\\nđã gieo rắc hạt giống \"tình yêu\" dành cho Hachiroku đi chăng nữa."
2476 = "Không phải là sự cứng đờ do căng thẳng……\\nmà giống như cảm xúc đã bị rút cạn đi vậy."
2478 = "Lại thế nữa rồi."
2479 = "Tôi chẳng hề nghĩ đến việc kháng cự.\\nHơi ấm từ cơ thể Hachiroku, đang truyền sang tôi."
2497 = "Chỉ cần em bắt chuyện, ngài ấy sẽ trả lời như thế này."
2499 = "Thế nhưng, ngộ nhỡ.\\nCó thứ gì đó——đã mất đi thì sao."
2505 = "A——Ngài Soutetsu, sắc mặt ngài ấy\\nđã trở nên tái nhợt từ lúc nào vậy."
2509 = "Thấy vui quá. \\nHachiroku cũng cảm nhận giống hệt tôi."
2511 = "Nhớ lại rồi. \\nTại sao, tôi lại quên mất cơ chứ."
2515 = "Không thèm quay lại nhìn khi em trả lời,\\nngài Soutetsu rảo bước nhanh về phía cô Paulette."
2517 = "Ông ấy lại ực một hơi cạn sạch,\\nvị trụ trì rung rinh cái bụng mỡ rồi cất bước."
2519 = "Vì cứ ngỡ rằng trái tim đã trở nên gần gũi hơn,\\nnên chắc chắn, em đã quá ỷ lại."
2520 = "Vì câu hỏi quá đỗi trực diện,\\nnên những lời đáp lại cũng chẳng cần phải đắn đo."
2522 = "Nói rồi, em ấy há miệng thật to rồi lại ngậm lại.\\nNhấp một ngụm trà, rồi lại mở miệng……"
2524 = "Với sự thành thật đến mức khiến tôi cảm thấy không giống em ấy thường ngày,\\nem ấy hỏi tôi một cách thẳng thắn, thẳng thắn đến ngây thơ."
2526 = "Em ấy xấu hổ cúi gầm mặt xuống——\\nnhưng ngay lập tức, lại đưa ánh mắt nhìn thẳng vào mắt tôi."
2528 = "Khuôn mặt Hachiroku nhanh chóng giãn ra,\\nvà sự căng thẳng trong lòng tôi, cũng nhờ thế mà được xoa dịu."
2529 = "Dù chỉ là giọng nói và nụ cười thật nhỏ bé,\\nnhưng tôi lại cảm thấy như mình đang được bao bọc."
2532 = "Thật khó.\\nPhải truyền đạt thế nào đây."
2534 = "Nếu sự thay đổi của tôi bị phát hiện, chắc chắn sẽ ảnh hưởng đến em ấy.\\nBởi vì tôi muốn nghe toàn bộ những lời Hachiroku nói."
2536 = "Nếu vậy... quả nhiên là như thế."
2541 = "Tồn tại, nhưng không thể chạm tới. \\nLời nói của tôi, những gợn sóng của Hachiroku, đang củng cố hình ảnh đó."
2545 = "Ngài ấy vẫn tiếp xúc và trò chuyện với em như bình thường——thế nhưng, ngay cả lúc này.\\nÁnh mắt và cánh tay ngài ấy vừa định cử động, lại khựng lại ở đó."
2559 = "Ảo tưởng rằng giữa chúng em có một sợi dây liên kết giống như \"\\x%l共感;#00ffc040;cộng cảm%l;#;\",\\nvà dường như đã xem nhẹ việc truyền đạt rõ ràng bằng lời nói."
2568 = "Đã kết nối được rồi.\\nGiữa suy luận từ vẻ bề ngoài và thông tin mà tôi đang có."
2569 = "Kể từ ngày hôm đó.\\nNgày hôm đó——ngày mà ngài Soutetsu đột ngột ngất xỉu."
2581 = "Mờ ảo. \\nU."
2593 = "Em thấy sợ. Lòng em bồn chồn.\\nNếu chỉ là……thay đổi thôi thì còn đỡ."
2599 = "Nghĩ đến đó, tôi chợt nhận ra. \\nQuả nhiên, ngay từ đầu, tôi vốn dĩ không hề muốn quên đi."
2601 = "——Muốn dùng giọng nói, dùng ngôn từ, để làm nụ cười của Hachiroku thêm rạng rỡ.\\nSuy nghĩ đó, đã khiến đôi môi tôi trở nên trơn tru hơn."
2604 = "Có lẽ Hachiroku vừa dùng tay múc nước. \\nNhững gợn sóng nhỏ lăn tăn lan tỏa ra xung quanh."
2605 = "Tôi bất giác, nhìn thẳng vào mặt vị trụ trì."
2608 = "Mở tờ giấy ghi chép toàn bộ việc sẽ sử dụng linh kiện lấy từ \\x%l8620;#00ffc040;8620%l;#;\\nhay 58623 ra."
2611 = "Vòng tay ôm tôi siết chặt hơn.\\nTừ giọng nói, tôi cũng có thể nhận được hơi ấm của Hachiroku."
2613 = "Như một thói quen,\\ntôi và Hachiroku ngồi quay lưng vào nhau ngâm mình trong bồn tắm."
2615 = "Tôi muốn gật đầu.\\nMuốn nói đúng là vậy, rồi sảng khoái đứng lên một cách mạnh mẽ."
2616 = "Thứ 'mờ ảo' mà tôi đang trói buộc, \\nthứ 'mờ ảo' đang trói buộc tôi, chính là nỗi sợ hãi về vụ tai nạn."
2619 = "Bởi vì những đầu ngón tay tôi,\\nđang run rẩy liên hồi như thể bị co giật."
2620 = "Khi tôi nâng tay lên,\\nđôi mắt Hachiroku liền mờ đi đầy vẻ bi thương."
2623 = "Dù người kể là tôi đã quên mất, nhưng Hachiroku vẫn nhớ.\\nNên em ấy mới hỏi tôi như vậy."
2625 = "Dù chưa từng được gặp mặt.\\nNhưng lại dạy cho em một điều vô cùng quan trọng, đứa em gái dịu dàng của em."
2634 = "Dáng vẻ bước ra khiến tôi hơi ngạc nhiên."
2635 = "Tôi lấy đồng hồ đường sắt ra xem.\\nĐã gần hai mươi ba giờ rồi."
2637 = "Nếu là ngài Soutetsu của một thời gian trước, chắc chắn ngài ấy sẽ nói \"Làm gì có chuyện đó\",\\n——rồi xoa đầu em."
2638 = "Nỗi trăn trở cứ thế,\\ntrào ra thành những lời nói thật lòng."
2640 = "Nếu vậy, tôi bỗng muốn hỏi thử."
2642 = "Trái tim đang rối bời này,\\nchắc chắn, em ấy đang cố gắng gỡ rối cho nó."
2651 = "Huống hồ hiện tại, đang là lúc vô số xác nhận và chỉ thị bay tứ tung,\\nđể phục vụ cho việc thay thế \\x%l台枠;#00ffc040;khung gầm%l;#; của \\x%l8620;#00ffc040;8620%l;#;."
2664 = "Huống hồ, ngoại trừ tốc độ xử lý và dung lượng……thì về mặt hệ điều hành,\\ngiữa em và các em gái đáng lẽ không có sự khác biệt nào về thông số kỹ thuật mới phải."
2668 = "Paulette lấy chiếc đồng hồ vàng từ trong túi ra."
2675 = "Hít một hơi thật sâu, không vội vã,\\ntôi từ từ thốt ra từng lời, từng lời một."
2678 = "Cúi chào thật sâu.\\nChỉnh lại tư thế và cúi chào một lần nữa. Sâu hơn nữa——dành cho em gái em."
2679 = "Định nói điều gì đó,\\nnhưng rồi ông Fuchi lại ngậm miệng lại."
2680 = "Nói bằng một giọng ngạc nhiên,\\nrồi ông Fuchi bật cười khùng khục trong cổ họng."
2681 = "Nói rồi, ông Fuchi lấy ra một danh sách linh kiện được gấp gọn gàng——"
2682 = "Pặc một cái.\\nNgón tay ông Fuchi búng vào danh sách linh kiện."
2688 = "Vì muốn được ngài Soutetsu khen ngợi.\\nVì muốn được ngài Soutetsu xoa đầu."
2690 = "Nhưng——tôi không thể làm được.\\n...Nỗi sợ hãi bị bỏ lại phía sau, dù đã được bao bọc vẫn không chịu biến mất."
2692 = "Nhưng mà, Hachiroku đang mong muốn tôi nói ra.\\nNếu vậy, tôi muốn đáp lại mong muốn đó."
2694 = "Nhưng mà, Hachiroku đang lắng nghe tôi.\\nNếu vậy, tôi có thể trút hết ra mà không bị nghẹn lại——và tôi muốn trút hết ra."
2697 = "Reina tươi cười đứng dậy.\\nNhanh nhẹn một cách lạ thường."
2699 = "Một biểu cảm nhăn nhó, méo mó,\\ntrông vừa hoài niệm, vừa cô đơn, nhưng đâu đó lại có vẻ vui mừng."
2700 = "Có lẽ ngài ấy đã nhớ lại. Không——\\nChắc chắn ngài ấy chưa từng quên đi, dù chỉ một giây phút nào."
2701 = "Tất nhiên, dù có xa cách đôi chút,\\nnhưng chúng em vẫn là \\x%l機関士;#00ffc040;người lái tàu%l;#; và \\x%lレイルロオド;#00ffc040;Railord%l;#;."
2706 = "Ông chủ Tororyu-yu vén tấm rèm lên,\\ntừ lối vào phòng tắm nam rướn người nhìn vào bên trong."
2720 = "Đáng lẽ lúc đó, khi Hachiroku vẫn còn đang cười,\\nmình nên thành thật hỏi \"Vậy, có chuyện gì thế?\"."
2723 = "Giống hệt như sự 'mờ ảo', \\ntôi tuôn ra những lời nói theo đúng những gì mình cảm nhận."
2726 = "Một nhân viên kiểm tra mặc đồ bảo hộ đang áp một thứ giống như ống nghe,\\nlên chiếc \\x%l台枠;#00ffc040;khung gầm%l;#; vừa được chuyển đến."
2731 = "Chai thứ ba, sữa tươi trắng."
2734 = "Một câu trả lời ngắn gọn đến mức lạnh nhạt.\\nÁnh mắt ngài ấy cũng lảng đi nơi khác."
2735 = "Không chỉ đôi má, mà cả khuôn mặt và cơ thể em ấy đều đỏ bừng."
2739 = "Cuối cùng ngài ấy cũng chịu chạm mắt, em thấy vui,\\nvà lời nói cũng trở nên phấn chấn hơn."
2744 = "Ngay lập tức, tôi có cảm giác như chúng tôi đã hòa làm một. \\nTấm lưng tựa vào tôi, áp sát vừa vặn, như hút chặt lấy."
2750 = "Ngón tay nhăn nheo của bà chủ chỉ vào tấm rèm phòng tắm nữ. \\nNếu vậy thì giống như mọi khi, ý bà là chúng tôi hãy vào tắm chung."
2753 = "Vì nỗi sợ bị bỏ lại một mình, \\nmà nó đã trở nên cứng đờ và căng thẳng tột độ."
2755 = "Và rồi, câu hỏi đó khiến tôi phải đưa mắt nhìn."
2757 = "Ngay cả bây giờ khi đã biết điều đó,\\ntôi cũng chẳng thể có được sự nhẹ nhõm để cười xòa cho sự hiểu lầm của chính mình."
2758 = "Vì cũng muốn truyền đạt điều đó một cách thẳng thắn,\\nbước chân em, ngày một nhanh hơn!"
2761 = "Thì hạt giống đã bén rễ, đâm chồi và lớn lên ấy,\\nđã trở thành một hiện thực vững chắc không thể lay chuyển, ngay lúc này, ở ngay đây."
2762 = "...Việc cứ mãi không quên, \\ncho dù điều đó, có trói buộc lấy Michi đi chăng nữa."
2765 = "Tiếng cười khúc khích vui vẻ vang lên, tôi chợt nhận ra."
2766 = "Bị nói một điều hơi bất ngờ,\\nem bất giác hỏi ngược lại."
2767 = "Một tiếng kêu nhỏ khiến tôi giật mình.\\nA, đúng rồi, còn có Paulette đi cùng nữa."
2768 = "Nghe Hachiroku nói vậy, cơ thể tôi bất giác gồng lên. \\nLưng tôi hiện giờ, chắc hẳn đang rất cứng."
2772 = "Sự dễ chịu khi làn da cọ xát vào nhau—— \\nĐó, chính là câu trả lời cho câu hỏi."
2776 = "Chao đảo, rung rắc.\\nChỉ mới tưởng tượng, chỉ mới giả định thôi, mà tôi đã sợ hãi đến nhường này."
2777 = "Ngài ấy vẫn mỉm cười, nhưng so với lúc nãy thì——\\nsự ấm áp và dịu dàng dường như đã phai nhạt đi nhiều."
2778 = "Khuôn mặt đỏ bừng, ánh mắt hoàn toàn không cố định.\\nThế này thì……có vẻ không thể nói chuyện đàng hoàng được rồi."
2782 = "Nó soi rọi ánh sáng vào những điều \"hiển nhiên\" mà bình thường tôi chẳng bao giờ thèm nghĩ tới, \\nvà bắt tôi phải xác nhận lại hình dạng của chúng."
2784 = "Em ấy liên tục đặt ra cho tôi những câu hỏi ngây ngô, \\nmà bình thường có lẽ em ấy sẽ chẳng bao giờ hỏi."
2785 = "Nếu vậy thì thật kỳ lạ.\\nSuy luận là một trong những chu trình suy nghĩ cơ bản mà……"
2791 = "Lời giải thích, chưa được rõ ràng cho lắm."
2793 = "...Bị hỏi giấc mơ là gì, tôi đã trả lời.\\nTrả lời xong, Hachiroku liền kéo tôi đi."
2797 = "Những thứ chuyên môn như vậy làm sao tôi biết được.\\nNếu vậy, hãy suy nghĩ từ mặt chữ xem sao."
2798 = "Ngày hôm đó.\\nNếu vậy thì, có lẽ là——"
2809 = "Trong chốc lát, tôi mím chặt môi."
2810 = "Đang nói dở, tôi đột nhiên hiểu ra."
2811 = "Là ông chủ Tororyu-yu.\\nTrên tay cầm cây chổi... a, không, chúng tôi đang——"
2820 = "Rằng đó chỉ là ảo giác và ảo tưởng, tôi đã được ông Fuchi làm cho hiểu rõ."
2825 = "Điều Michi mong muốn, điều tôi mong muốn, chỉ có một mà thôi. \\nĐiều đó hoàn toàn không thay đổi."
2826 = "Tiếng nước róc rách."
2827 = "Mỉm cười \"ư fufu\", khẽ vẫy tay,\\nPaulette một mình đi về phía xưởng đầu máy."
2840 = "Đến mức tự mình nói ra, tôi mới nhận ra rằng \"A, ra là vậy\"——\\nMột tiếng lòng chân thật, không chút giả tạo."
2841 = "Thật tuyệt đẹp.\\nĐến cả Hachiroku cũng phải tròn mắt ngạc nhiên."
2842 = "Cảm giác ấm áp lan tỏa.\\nTôi đã hiểu ra."
2843 = "Giọng nói dịu dàng khiến tôi nhớ lại.\\nNhắc mới nhớ, tôi đã kể chuyện này cho Hachiroku nghe rồi."
2844 = "Không thể nào. Làm gì có chuyện đó."
2845 = "Chỉ cần nhìn thấy biểu cảm đó, cõi lòng nặng trĩu của tôi cũng trở nên nhẹ nhõm.\\nLời nói, cũng tự nhiên tuôn trào."
2846 = "……Một Rail Shop đã quá đỗi quen thuộc.\\nTôi lấy tách dành cho khách ra, và pha một ít matcha."
2847 = "Chưa kịp cản lại, em ấy đã chạy tọt ra khỏi Rail Shop.\\nCảm giác như em ấy đang vội vàng một cách kỳ lạ——"
2849 = "Em ấy hướng ánh mắt mạnh mẽ nhìn tôi chằm chằm,\\nđến mức khiến tôi phải nao núng."
2852 = "Ngày mà em dùng đèn khò hơ nóng \\x%l台枠;#00ffc040;khung gầm%l;#;,\\nvà làm tan chảy……tóc của một ai đó bị phong ấn trong lớp dầu."
2855 = "Khuôn mặt đó, và giọng nói đó.\\nChỉ vậy thôi cũng đủ để truyền tải rồi."
2862 = "Nhắm mắt lại, tôi cố gắng nhớ lại."
2865 = "Một nghìn yên trừ đi tám mươi yên rồi chia cho hai,\\nchính là phí tắm."
2867 = "Em hơi muốn tránh xa một chút——\\nnhưng vì tò mò về những gì ông ấy vừa nói nên đành cố nhịn."
2868 = "Dù cảm thấy vậy, nhưng tôi lại sợ nếu cứ chọn lọc từ ngữ thì sẽ đi chệch khỏi cảm xúc thật sự——\\nVì thế tôi cứ thế tiếp tục nói."
2870 = "Dù ngài Soutetsu có một trái tim mạnh mẽ, nhưng ngài ấy vẫn luôn đậy nắp che giấu quá khứ.\\nNgọn lửa từ chiếc đèn khò đó——chắc chắn đã thiêu rụi chiếc nắp đó."
2871 = "——Nụ cười của ngài Soutetsu thoáng trở nên gượng gạo."
2872 = "Nghe tiếng ngài Soutetsu, em ngẩng mặt lên,\\nvừa hay thấy các nhân viên kiểm tra đang rời khỏi \\x%l台枠;#00ffc040;khung gầm%l;#;."
2874 = "Vừa nói, ngài Soutetsu chợt quay sang nhìn em."
2878 = "Có lẽ biểu cảm của em đã lộ rõ trên mặt.\\nÔng Fuchi cười khổ như muốn nói \"Quả nhiên là vậy\"."
2891 = "Sự run rẩy, lan rộng ra toàn bộ cơ thể.\\nVừa sợ hãi, vừa khó chịu, vừa lạnh lẽo."
2895 = "Hơi ấm này đã cho tôi biết."
2913 = "（Thì ra là vậy... Cái này sao——）"
2916 = "（Hử?）"
2917 = "（Cạch）"
2918 = "（Tõm）"
2919 = "（Kể từ ngày hôm đó……ngài Soutetsu, đã có chút thay đổi.\\nChỉ một chút thôi——nhưng có cảm giác như, một điều gì đó đã rời xa……）"
2920 = "（……Liệu có phải em, lại\\nvừa nói điều gì đó không hay rồi chăng?）"
2923 = "（Là do cái này sao——）"
2924 = "（Mình đã chọn sai thời điểm rồi sao?）"
2927 = "（Nếu thật sự là vậy……\\nNgài Soutetsu, sẽ đối với em——）"
2930 = "（Lúc đó……\\nQuả nhiên, ngài Soutetsu——đã nhớ lại vụ tai nạn……）"
2931 = "（Dù vẫn ở gần bên nhau như trước,\\nnhưng lại không cảm thấy gần gũi như trước nữa.）"

[selections]
