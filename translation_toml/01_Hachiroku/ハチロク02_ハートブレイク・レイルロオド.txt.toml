2285 = "「Vâng. Do đó, hãy để chúng ta.」"
2286 = "「Ừm. Về việc đón nhận một đứa trẻ, kiến thức của chúng ta còn rất hạn hẹp.」"
2288 = "「Nagi, lấy hộ mình với được không? Mình chưa ăn món Terrine đó.」"
2289 = "「Fukami! Lại bị bảo là ngược nữa kìa á!」"
2292 = "「Fukami! Phải gọi cả Fukami nữa á!」"
2294 = "「Là Đầu máy số 9 đó ạ~ Đầu máy số 9 của Đường sắt Mikan á!!」"
2295 = "「Đúng vậy nhỉ~」"
2296 = "「Vâng! Không phải chịu cảnh lãng phí như vậy, em nghĩ đó thực sự là một điều tuyệt vời!」"
2298 = "「Phải rồi. Chuyện ký kết vẫn chưa đâu vào đâu mà.」"
2301 = "「Cứ làm vậy đi.」"
2303 = "「Trời đất.」"
2309 = "「Giúp chị lập danh sách nhé? Xem đón tiếp thế nào thì vui. Em cứ thử đặt mình vào vị trí đó rồi nói cho chị nghe nha?」"
2311 = "「Nhờ Paulette đã tìm hiểu trước sở thích của bên đó nên cũng đỡ lắm. À này——cho anh cái này, Soutetsu.」"
2317 = "「Thật đáng tin cậy. Vậy thì, để chuẩn bị cho ngày mai, bây giờ hãy nghỉ ngơi đi. Chỗ ở đã được sắp xếp rồi. Anh sẽ dẫn đường.」"
2327 = "「Mọi người ở Đường sắt Ohito đang chào đón chúng ta đấy. Vậy mà……Olivy. Cô định làm ô uế danh tiếng của Đường sắt Mikan sao.」"
2332 = "「S-Sao vậy? Reina, em đau ở đâu à?」"
2336 = "「Gì vậy, có chỗ nào bị trục trặc sao?」"
2337 = "「Tại sao mọi chuyện lại tiến triển nhanh đến vậy? Tất nhiên—— Được đón \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; hằng mong ước thì về cơ bản là anh rất hoan nghênh.」"
2341 = "「Chúc mừng chúng ta, đã có thêm những người đồng đội mới——」"
2342 = "「Chắc là phải chuẩn bị cho nhiệm vụ tiếp theo ạ. Đường sắt Mikan cũng không hề dư dả thời gian đâu.」"
2344 = "「Em cũng có cảm giác như vậy. Nói một cách tốt đẹp thì, là 『Họ đã gửi gắm bé ấy cho chúng ta』.」"
2351 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#; chúng em chỉ là vật vô tri vô giác mà…… Cảm ơn ngài đã chu đáo đến vậy ạ.」"
2352 = "「Hôm nay tôi đến mà không có phụ lái. Olivy xin nhờ mọi người chăm sóc. Nếu được, tôi muốn nhanh chóng hoàn tất việc ký kết.」"
2353 = "「Bởi vì em nghĩ, có lẽ sẽ mất rất nhiều thời gian, để bé Olivy chịu đồng ý.」"
2354 = "「Chị cũng vậy. Sou-chan, nhờ em nhé?」"
2356 = "「Anh thì sao cũng được——nhưng Hibiki có ổn không?」"
2360 = "「Thế là em hỏi 『Chuyện là sao?』 thì bị ngắt máy. Nhưng em còn phải làm nhiệm vụ nên không gọi lại ngay được.」"
2364 = "「Có lẽ, em cũng——như vậy, ạ. Bị kích thích bản năng làm mẹ……nên đã không thể phán đoán một cách bình tĩnh.」"
2366 = "「Em nghĩ là vậy. Đáng lẽ em không nên phấn khích quá——dù là qua điện thoại, em cũng nên yêu cầu giải thích rõ ràng từ nhiều phía hơn.」"
2368 = "「Quả nhiên em nghĩ nên đợi sau khi kết thúc vận hành thương mại thì hơn, nên đã nhờ họ đến sau 21 giờ——và dự kiến là 21:00.」"
2369 = "「Em không nghĩ là như vậy đâu. Có lẽ. Có lẽ……thực sự, chỉ là có lẽ thôi nhưng mà——」"
2372 = "「Em hiểu! Cảm giác như kích thích bản năng làm mẹ ấy nhỉ. Cứ muốn ôm vào lòng, rồi vuốt ve dỗ dành thôi.」"
2373 = "「Em hiểu rồi ạ.」"
2375 = "「Đã rõ. Còn lại là Hibiki nhưng mà——」"
2376 = "「Trưởng phòng Vận tải Đường sắt Ohito, \\x%l保線部長;#00ffc040;Trưởng bộ phận bảo trì đường ray%l;#;. Kiêm chủ tàu 8620, \\x%l機関士;#00ffc040;người lái tàu%l;#; hơi nước, Migita Soutetsu.」"
2378 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của 8620 Đường sắt Ohito, Hachiroku. Bé Olivy. Từ nay mong được em giúp đỡ nhé?」"
2384 = "「Em sẽ lập danh sách xong trước khi cậu liên lạc xong. Ngay khi xác định được ai có thể đến, chúng ta sẽ phân bổ nhân sự.」"
2385 = "「Em đã chuẩn bị sẵn, loại than bitum hảo hạng nhất rồi ạ.」"
2387 = "「Em nghĩ có lẽ bé ấy đã tự nguyện đó ạ. Bởi vì bé ấy, đã vô cùng cố gắng truyền tải sức hấp dẫn của Đường sắt Mikan mà.」"
2388 = "「Là \\x%l重油並燃装置;#00ffc040;thiết bị đốt bỏ dầu nặng%l;#; trong lời đồn đó. Có lẽ họ đã cố tình tạo ra khói đen bằng cái đó đấy.」"
2390 = "「Dù là vật hay là người. Tôi nghĩ việc mọi người có thể làm việc thoải mái chính là cội nguồn của sự an toàn mà.」"
2392 = "「Nếu có thể mời được, thì chị Mayami cũng nên đến ạ.」"
2395 = "「Em không muốn nghi ngờ Đường sắt Mikan nhưng…… Liệu có khả năng……đã xảy ra một sự cố hỏng hóc chí mạng nào đó không.」"
2397 = "「Vậy? Có danh sách những việc cần làm để chuẩn bị chưa?」"
2399 = "「Là vậy đó, Hibiki.」"
2401 = "「Nên em đã bị định kiến ở đâu đó rằng \"chắc chắn bé ấy rất đơn giản\". Rồi tự mình đưa ra cách giải thích có lợi cho bản thân.」"
2402 = "「Anh đã bảo là ngược rồi mà.」"
2405 = "「Đúng vậy nhỉ. Chị Paulette, cũng là một chuyên gia về hành chính mà.」"
2406 = "「Xin lỗi——cho tôi hỏi, Giám đốc Hinai có ở đây không.」"
2408 = "「Bởi vậy! Chuẩn bị! Vẫn chưa đâu vào đâu hết trơn á!!」"
2409 = "「Thế rồi, bé Olivy nghe được chuyện đó, có lẽ đã tự mình tình nguyện chuyển đến Ohito đấy!」"
2410 = "「Hôm nay, nghĩa là họ sẽ tự chạy đến sao ạ? Hay là dùng \\x%l甲種輸送;#00ffc040;vận chuyển loại Giáp%l;#; bằng đầu máy khác?」"
2415 = "「Hibiki! Hibiki!」"
2416 = "「Đã rõ.」"
2418 = "「Em hiểu rồi ạ. Chúng ta hãy làm như vậy nhé.」"
2420 = "「Là món nướng hấp các nguyên liệu được xay nhuyễn như mousse. Nhưng vốn dĩ, chỉ những món được dọn ra nguyên trong khay Terrine, mới được gọi là Terrine.」"
2422 = "「Đến, là cái gì đến?」"
2423 = "「Vâng.」"
2426 = "「Đúng vậy. Đó là điều kiện ưu tiên hàng đầu của việc cho thuê và thay thế tuyến đường mà. Ngay khi có \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; dư thừa, thì phải nhanh chóng——」"
2429 = "「Trước khi làm nhiệm vụ trên chuyến tàu đầu tiên sao?」"
2431 = "「Là bé Olivy gọi ạ! Bé ấy phấn khích lắm, bảo là 『Em sẽ đến Ohito ngay bây giờ~!』」"
2432 = "「Anh không để ý. Xin lỗi nhé.」"
2435 = "「Vâng. Nếu được như vậy, em cũng sẽ rất vui ạ.」"
2436 = "「Vâng ạ~ Em thấy rất tuyệt nha~ Cứ đối xử bình thường thì chắc chắn sẽ thoải mái nhất đó ạ~」"
2439 = "「Vâng. Quả đúng là như vậy ạ.」"
2440 = "「\"Như những người chuyên nghiệp làm việc cùng nhau\" đúng không. Vâng. Vậy là OK rồi. Em cũng sẽ làm như vậy, và cả cậu Soutetsu nữa nhé.」"
2445 = "「Ra là vậy. Nếu vậy thì anh sẽ giữ nó.」"
2446 = "「Vậy á?」"
2447 = "「Vâng, vẫn chưa ạ. Nên em mới bảo họ đến trong hôm nay, rồi ký kết tại đây luôn! Mọi chuyện là như vậy đó.」"
2449 = "「Có sự đảm bảo của người từng trải thì tốt quá rồi. Paulette thì sao——ưm? Paulette?」"
2452 = "「Vậy sao? Về mặt ngoại hình, thì cũng là tiêu chuẩn của một \\x%lレイルロオド;#00ffc040;Railord%l;#;—— À không, tất nhiên là \\x%lレイルロオド;#00ffc040;Railord%l;#; nào cũng có ngoại hình xuất sắc rồi.」"
2461 = "「Mi——!? A a——」"
2462 = "「Nhân dịp này, gọi cả Kisaki nữa. Dù không biết em ấy có đến hay không.」"
2473 = "「Chào mừng~! Chào mừng đến với Đường sắt Ohito!!!」"
2474 = "「Khâu chuẩn bị cho buổi chào mừng đã hoàn tất đâu vào đấy rồi nha. Việc trao đổi với phía cửa hàng cũng đã xong xuôi trọn vẹn.」"
2475 = "「Bảng chào mừng——Tốt! Trang trí sân ga, tốt!」"
2478 = "「Chưa á! Chia nhau ăn đi á!」"
2479 = "「Đúng vậy. Anh nhớ không lầm thì, khoảng cuối thời \\x%l明智;#00ffc040;Meiji%l;#;, nghe nói đó là đầu máy hơi nước được sản xuất ở Mỹ rồi nhập khẩu về.」"
2481 = "「Ưm.」"
2482 = "「Đúng vậy đó! Họ sẽ đến đấy! Cái đầu máy nhỏ nhắn dễ thương và \\x%lレイルロオド;#00ffc040;Railord%l;#; đó.」"
2484 = "「Không sao đâu. Cô khóc bao nhiêu cũng được mà?」"
2496 = "「Paulette và Reina cũng đồng ý với phương hướng đó chứ?」"
2497 = "「Nếu là Paulette thì chắc sẽ biết nhiều và rộng hơn, nếu không biết thì cô ấy cũng sẽ giới thiệu chuyên gia cho chúng ta.」"
2498 = "「Paulette! Paulette! Xin lỗi, em qua đây chút đi!!」"
2499 = "「Paulette. Chiếc taxi mà chú Munakata đã lên……」"
2500 = "「Xong rồi ạ. Sau đó em sẽ tiến hành ký kết, nên việc tiếp đón bé Olivy, em nhờ nhóm Hibiki nhé.」"
2501 = "「Chúc mừng bé Olivy và Đầu máy số 9, đã đến với Đường sắt Ohito——」"
2504 = "「Sau đó——」"
2505 = "「Rồi sau đó, lúc tụi em quay lại ga Suối nước nóng Ohito, thì vừa nãy lại có điện thoại gọi tới đó ạ~」"
2509 = "「Khói mù mịt! Góc chụp hoàn hảo! Tuyệt vời quá!」"
2513 = "「Điều khoản đặc biệt——như thế nào ạ?」"
2516 = "「Reina thì, ờm~」"
2518 = "「Reina, chỉ là——Reina, nhớ lại—— nỗi buồn lúc chuyển nhà——nên mới vậy nha~」"
2520 = "「Sao vậy? Reina.」"
2522 = "「Cái lúc nãy. Từ cô Kisaki ấy ạ.」"
2523 = "「Chuyện gấp gáp ngay trong ngày. Quả nhiên Kisaki có thể đã có hẹn trước rồi, nhưng mà——」"
2528 = "「Nổi cáu.」"
2531 = "「Đúng vậy nhỉ. Vậy thì ngài Soutetsu, nhờ ngài ạ. Về mặt thời gian, thì đây sẽ là lần kiểm tra cuối cùng đó ạ.」"
2532 = "「Đúng vậy thật. Chắc Olivy cũng sẽ bất an lắm. Vậy, anh sẽ sang phòng bên cạnh hay đâu đó.」"
2534 = "「Vậy sao á? Tại Hachiroku cứ đối xử như trẻ con, nên em hiểu lầm luôn á.」"
2536 = "「Chỗ ngủ.」"
2542 = "「Dùi nhọn à?」"
2544 = "「Cuối cùng cũng đến rồi á! Chào mừng~! Chào mừng đến với Đường sắt Ohito!!」"
2547 = "「Dù sao thì, thử bàn bạc với Paulette xem sao.」"
2549 = "「Chắc chắn là vì họ đang rất có động lực đó! Nên chúng ta cũng phải chuẩn bị đón tiếp chu đáo nhất có thể mới được!」"
2554 = "「Nếu cứ ở lại đó, thì lúc chia tay sẽ càng đau khổ hơn thôi. Sẽ càng làm tổn thương cô Olivy nhiều hơn nữa nha~」"
2556 = "「Chà, đáng tin cậy thật. Chắc hẳn họ không muốn lãng phí một phút một giây nào, và muốn làm việc ở Đường sắt Ohito càng sớm càng tốt đây mà.」"
2563 = "「Quê hương hơi nước Ohito, đã chờ đợi Đầu máy số 9 và cô Olivy từ lâu rồi ạ!」"
2564 = "「Quê hương hơi nước Ohito, nhiệt liệt chào mừng Đầu máy số 9 và cô Olivy! ạ!!」"
2567 = "「Vậy sao. Ta hiểu rồi.」"
2569 = "「Anh hiểu rồi. Vậy thì, nhờ em để mắt tới nhé.」"
2572 = "「Càng đề phòng thì sẽ càng tạo ra khoảng cách á. Theo ý chị thì cứ \"bình thường\" là tốt nhất á.」"
2575 = "「Tuy là vậy nhưng mà——」"
2576 = "「Nghe bảo là do \\x%l車掌;#00ffc040;trưởng tàu%l;#; dự định hướng dẫn cho em bị ốm đột xuất, nên bé ấy được cử làm người thay thế khẩn cấp——」"
2578 = "「Em nghe nói là tự chạy, có gắn thêm \\x%l補機;#00ffc040;đầu máy phụ%l;#; ở đuôi. Qua khỏi Okoba thì sẽ tháo \\x%l補機;#00ffc040;đầu máy phụ%l;#; ra cho quay về.」"
2580 = "「Vừa nghe tin chuyển nhượng đến Đường sắt Ohito là bé ấy đã, 『Mọi người định vứt bỏ Olivy!』 rồi phản ứng gay gắt luôn ạ.」"
2583 = "「Cảm ơn cậu.」"
2584 = "「Em đã phán đoán sai lầm do định kiến sao.」"
2594 = "「Bài phát biểu chúc mừng chuẩn bị xong chưa?」"
2622 = "「Chuyện này——」"
2623 = "「Ờm……」"
2624 = "「Cái này……rốt cuộc, phải bắt đầu bắt chuyện từ đâu đây.」"
2625 = "「Cái này……có vẻ như…… đang cháy không hoàn toàn một cách khá là phô trương nhỉ.」"
2626 = "「Hả?」\\n「Trong hôm nay á!!?」"
2628 = "「Phòng của anh hai. Olivy và Hachiroku đang ngủ ở đó đúng không á? Nhưng mà, anh hai với con bé đã có chút lòng tin nào đâu á.」"
2629 = "「Chà, thế cũng khác thường nhỉ. Đã qua Okoba rồi, thì cứ đến thẳng Ohito nghỉ ngơi luôn cũng được mà.」"
2630 = "「Chuyện đó thì không sao. Gần đây em cũng đã được xác nhận, tình trạng của cả toa xe lẫn \\x%lレイルロオド;#00ffc040;Railord%l;#; rồi.」"
2632 = "「Chuyện đó……có hơi……ờm—— Chưa từng có tiền lệ, phải không ạ.」"
2633 = "「Chuyện là thế này nha! Tự nhiên lại quyết định đến đó ạ~」"
2634 = "「Giờ đó thì tất cả mọi người có thể ra đón được nhỉ. Gọi cả Hibiki nữa. Hôm nay em ấy nghỉ, nhưng chắc sẽ không thích bị cho ra rìa đâu.」"
2635 = "「Dù nghĩ thế nào cũng thấy đây là tình huống bất thường mà. Vào giờ đó, rốt cuộc là ai gọi?」"
2636 = "「Hô. \\x%lレイルロオド;#00ffc040;Railord%l;#; tự mình tình nguyện sao.」"
2637 = "「Vậy sao. Dù là dưới hình thức giấc ngủ hay gì đi nữa, chỉ cần em ấy bình tâm lại được thì tốt quá rồi.」"
2639 = "「Chuyện đó, em thực sự xin lỗi. Nhưng vì phía bên kia cứ khăng khăng yêu cầu như vậy.」"
2640 = "「Cứ thấy, câu chuyện này không vui vẻ gì á. Cứ như Đường sắt Ohito bị coi là thùng rác vậy á.」"
2641 = "「Vậy thì Munakata có gặp rắc rối không? Không đúng chứ? Munakata, dù sao thì chú cũng sẽ về Đường sắt Mikan một mình mà!」"
2642 = "「Vậy thực tế thì——vì không chịu nổi tính khí thất thường, nên bé Olivy, đã bị Đường sắt Mikan tống khứ đi á?」"
2643 = "「Tiến vào đường ray rồi á!!! Đến rồi á!!」"
2645 = "「Cũng không cần phải xin lỗi đâu, nhưng mà có việc cần làm trước đó á! Chưa kiểm tra xong hết mà đúng không.」"
2647 = "「Vừa phải thôi. Từ sáng đến giờ rồi. Sự ích kỷ của cô đang kéo cả Đường sắt Ohito vào đấy.」"
2648 = "「Từ \\x%lレイルロオド;#00ffc040;Railord%l;#; Olivy đó sao?」"
2653 = "「Này, anh hai! Chuyện tình tứ để sau buổi chào mừng cũng được mà á?」"
2654 = "「Đó! Giờ đâu phải lúc nói chuyện thong thả đâu! Cứ vậy rồi lỡ luống cuống thêm thì lại càng nguy hiểm hơn á~!!」"
2656 = "「Tình hình thế nào rồi á——người đó—— chú Munakata ấy, em có nghe ngóng được chút gì không á?」"
2660 = "「Vậy, giải tán nhé. Ngày mai cũng nhờ mọi người.」"
2661 = "「Vậy thì, càng yên tâm hơn rồi. Nhưng mà——」"
2663 = "「Vậy quyết định thế nhé. Bàn bạc thì……chắc để sau giờ làm việc sẽ tốt hơn.」"
2665 = "「Vậy, công việc——công việc, của Olivy là——」"
2668 = "「Vậy thì, chia nhau ra liên lạc đi. Nagi gọi cho Fukami nhé. Hachiroku gọi cho Hibiki được không?」"
2669 = "「Vậy, chúng ta đi thôi.」"
2670 = "「Giúp được anh nhiều lắm, nhờ em nhé.」"
2673 = "「Tiệc chào mừng tạm thời hủy nhé. Không sao chứ?」"
2674 = "「Nếu vậy, tại sao lúc đó ngài lại không ký kết ạ?」"
2675 = "「Còn phía Kisaki và chị Mayami thì sao?」"
2676 = "「Nó được gọi là \"Toa hành khách hộp diêm\" đấy! Cái này cũng là hàng cực kỳ hiếm luôn đó!!」"
2680 = "「Nếu vậy, đây đúng là một tin vui thực sự rồi. Dù hơi đột ngột nên anh có chút bất ngờ.」"
2681 = "「Làm được ngay thôi á! Mấy đứa nhóc á, khóc một đêm xong là lại tươi tỉnh ngay ấy mà!」"
2682 = "「Hay là, đêm nay em sẽ ngủ ở phòng anh hai á. Anh hai qua phòng em ngủ là được á.」"
2684 = "「Vậy, mời chú Munakata đến văn phòng ạ.」"
2685 = "「Vậy, nán lại thêm chút xíu nữa thôi nhé. Anh cũng hiểu qua tình hình rồi——từ ngày mai sẽ tính sao đây?」"
2686 = "「Thế?」"
2688 = "「Chó nướng!? Nagi đại nhân, đã ăn thịt cún con rồi sao á!?」"
2689 = "「Gì vậy, anh hai.」"
2691 = "「Anh Soutetsu! Có chuyện lớn rồi ạ~」\\n「Anh hai! Chuyện lớn rồi á!!」"
2693 = "「Ngài Soutetsu. Tàu đến rồi ạ.」"
2694 = "「Ngài Soutetsu?」"
2699 = "「Bây giờ đây! Em sẽ làm ngay bây giờ. Trong lúc đó, nhờ cậu Soutetsu liên lạc với mọi người được không?」"
2903 = "Khi phương hướng lớn đã được định ra, những việc mỗi người cần làm cũng tự nhiên được xác định."
2908 = "Paulette, Kisaki hay chị Mayami……không biết là ai, nhưng thật tinh ý khi nhận ra và nhờ vả chuyện này."
2911 = "Chà, cũng có thể nói là do hai đứa tin tưởng Paulette và tôi, nên đã giao phó quyền quyết định cho chúng tôi——"
2912 = "Nếu được thì mười phút, không, chỉ năm phút thôi cũng được, thử nhờ em ấy ghé qua xem sao."
2916 = "Có lẽ điều đó đã trở thành một sự kích thích, Olivy dứt khoát lau nước mắt và đứng dậy."
2918 = "Vậy thì, đi thôi. Trước mắt, tôi sẽ là cộng sự tạm thời với tư cách là \\x%l機関士;#00ffc040;lái tàu%l;#; hướng dẫn."
2922 = "Dù vậy, ánh mắt em ấy vẫn không hề xê dịch. Vẫn dán chặt vào cửa sau của Rail Shop——"
2925 = "Nhưng, cho đến khi Nagi hoặc Hibiki——trở thành lái tàu chính thức của Đầu máy số 9, thì tôi sẽ là lái tàu hướng dẫn, đồng thời là người chịu trách nhiệm trên tàu."
2927 = "Nhưng, lại không thấy bóng dáng của Olivy, người đáng lẽ phải được chào đón."
2929 = "Nhưng, có lẽ Paulette đang tìm từ ngữ thích hợp chăng. Ngay cả khi chị Mayami đã nuốt xong miếng sushi, em ấy vẫn chưa thể trả lời."
2931 = "Tính khả thi, độ khó, những chuẩn bị cần thiết và tâm lý. Hoặc là, những lựa chọn khác——"
2940 = "Hachiroku cố gắng ôm trọn lấy tiếng khóc nức nở đó. Em ấy cứ nhẹ nhàng, nhẹ nhàng vuốt ve, và tiếp tục ở bên cạnh Olivy."
2942 = "Hachiroku ngồi xuống bên cạnh Olivy."
2944 = "Giọng của Hachiroku. Vẫn điềm tĩnh như mọi khi."
2947 = "Ừm, mọi người đồng loạt gật đầu. Sự đồng tình mạnh mẽ đó khiến tôi thoáng bối rối."
2960 = "Lặng lẽ lắng nghe những lời của Fukami. Sau đó Nagi, cuối cùng cũng gật đầu."
2963 = "Tiếng reo hò của Nagi. Lời chào mừng của Fukami. Nhưng——"
2967 = "Một giọng nói bất ngờ vang lên khiến tôi dừng bước. Reina——chẳng hiểu sao Reina lại đang mang khuôn mặt mếu máo."
2980 = "Chỉ có một người đàn ông trung niên mang vẻ mặt pha trộn giữa bối rối và áy náy—— có lẽ là chú Munakata, đang đứng đó với vẻ không thoải mái."
2982 = "Nhìn phản ứng do câu nói của Hibiki mang lại——những nụ cười tủm tỉm, thì có lẽ mức độ giao tiếp vừa rồi cũng được tính là tình tứ rồi."
2998 = "A, đúng là chuyên nghiệp. Cô bé này quả nhiên cũng là một \\x%lレイルロオド;#00ffc040;Railord%l;#;. Ngay khoảnh khắc nhận ra điều đó, tôi liền thẳng lưng lên."
3000 = "Chỉ cần vậy thôi, cũng rất dễ để tưởng tượng ra, sự hướng dẫn của \\x%lレイルロオド;#00ffc040;Railord%l;#; tên Olivy đó phong phú đến nhường nào."
3003 = "Dù là đầu máy nhỏ đến đâu, thì việc vận hành mà không có phụ lái, là chuyện vô cùng, vô cùng hiếm thấy."
3006 = "Vừa hỏi xong thì một sự im lặng ngắn ngủi bao trùm. Người phá vỡ nó ngay sau đó, là chị Mayami."
3010 = "Trong tình huống này, mà em ấy vẫn có thể nghĩ chu đáo đến vậy."
3011 = "Vừa nói, em ấy vừa nhắm chặt mắt lại trong thoáng chốc. Như thể đang cố dùng mí mắt——để kìm nén những giọt nước mắt."
3023 = "Tôi đang được chống đỡ. Không chỉ bởi gia đình, mà còn bởi rất nhiều bàn tay của những người đồng đội."
3025 = "Sự kiên trì đáng kinh ngạc của Paulette trong những vấn đề liên quan đến đường sắt. Vì mọi người đều biết điều đó, nên không thể tránh khỏi."
3027 = "Mọi người đều mỉm cười chuẩn bị cho buổi chào mừng. Tôi dần cảm nhận được, đây chính là Đường sắt Ohito."
3031 = "Có lẽ chị Mayami đã dự đoán trước được sự thay đổi đột ngột của tình hình—— và đã chuẩn bị sẵn sàng cho cả diễn biến này rồi."
3032 = "Những giọt nước mắt to tròn lã chã rơi. Dù vậy. Olivy vẫn tiếp tục nói."
3041 = "Chuyện mà Olivy \"nghe được\" đó, có lẽ cũng là chuyện về cách từ chối, hoặc xem xét máy thay thế cũng nên."
3042 = "Olivy đang tuyệt vọng kìm nén những giọt nước mắt. Không còn tâm trí đâu mà trả lời Hachiroku."
3043 = "Đột nhiên, Olivy ngước mắt lên. Ánh mắt đảo quanh một cách tuyệt vọng."
3044 = "Cắn chặt răng, nhìn Hachiroku bằng đôi mắt rực lửa, nhưng Olivy vẫn nắm lấy bàn tay đang đưa ra trong thoáng chốc."
3045 = "Olivy chạy vụt đi."
3046 = "Tôi cũng phải đáp lại thái độ không muốn làm ô uế danh tiếng của Đường sắt Mikan của Olivy, với tư cách là một người chuyên nghiệp."
3048 = "Đôi mắt to tròn ngấn lệ như chực trào ra, nhưng em ấy vẫn đứng lặng im——nhìn đăm đăm về hướng hai người vừa khuất bóng."
3049 = "Bất chấp việc váy bị bẩn, em ấy quỳ gối xuống đất, và từ từ, từ từ vuốt ve lưng Olivy một cách dịu dàng."
3053 = "Kinh nghiệm của một \\x%lレイルロオド;#00ffc040;Railord%l;#; đã hoạt động 100 năm, chắc chắn sẽ mang lại những điều tuyệt vời cho Đường sắt Ohito."
3056 = "Khuôn mặt lại gục chặt vào cơ thể, từ chối mọi thứ ở thế giới bên ngoài."
3057 = "Như muốn nói là đang kiểm điểm, Paulette lấy nắm đấm nhỏ gõ nhẹ lên đầu mình."
3060 = "Không thốt nên lời. Nỗi buồn chỉ trào ra thành những tiếng rên rỉ."
3062 = "Đang khóc nức nở. Đang ngồi xổm xuống."
3064 = "Tiếng rên rỉ không thành lời, cuối cùng cũng bắt đầu trở lại thành tiếng khóc. Tấm lưng vốn cứng đơ như đá khẽ run lên bần bật."
3066 = "Hachiroku nhìn Paulette, rồi nhìn tôi—— Sau đó, em ấy chậm rãi cất giọng đầy thận trọng."
3069 = "Nếu có ý kiến phản đối hay thắc mắc gì, cứ thẳng thắn bày tỏ. Bởi vì được phép làm vậy chính là điểm mạnh của Đường sắt Ohito mà."
3070 = "Cú sốc mạnh đến mức nếu có hành khách đứng, thì chuyện có người bị ngã cũng chẳng có gì lạ."
3072 = "Nếu có thể chuẩn bị tiệc chào mừng như thế này, chắc chắn họ sẽ rất vui, và bên kia cũng sẽ yên tâm hơn."
3074 = "Quả là một sự chu đáo đậm chất Paulette. Thay vì ký kết trước rồi mới ra lệnh——"
3077 = "\\x%l機関士;#00ffc040;Người lái tàu%l;#; Munakata được Paulette dẫn vào Rail Shop, và khuất dạng mà không thèm ngoảnh lại nhìn."
3089 = "Tôi thầm cảm ơn và ngưỡng mộ Hachiroku, rồi dùng chiếc dùi đập đá Kisaki đã giao cho——"
3092 = "Như thể chiếc dùi đập đá đã phá vỡ con đập, những giọt nước mắt của Olivy tuôn rơi lã chã."
3095 = "Giống như một bào thai—— Với tư thế từ chối mọi thứ bên ngoài, chỉ bảo vệ một mình bản thân."
3097 = "Dù đã đến giờ này, nhưng vẫn còn vương vấn chút hơi ấm của ánh nắng. Mùa hè, đã đến rất gần rồi."
3100 = "\"Vì Hachiroku cứ đối xử như trẻ con\", đến mức Nagi còn cảm nhận rõ ràng như vậy mà."
3101 = "Đang bối rối, ngay cả Paulette cũng vậy. Đến mức suýt nữa thì gọi tôi là cậu Soutetsu trước mặt người ngoài."
3129 = "Đường sắt Ohito kết thúc chuyến chạy lúc 19:27 khi đến Suối nước nóng Ohito vào buổi tối, nhưng để chở học sinh đi tập luyện buổi sáng, chuyến đầu tiên xuất phát rất sớm lúc 05:27."
3135 = "Tất nhiên, đây là một đầu máy hơi nước trăm tuổi. Dù có chăm chút đến đâu, thì mối lo ngại đó cũng không bao giờ biến mất."
3147 = "Có lẽ, em ấy đang tìm kiếm hình bóng của \\x%l機関士;#00ffc040;người lái tàu%l;#; Munakata——"
3157 = "Và, cả chúng tôi cũng vậy. Chúng tôi vẫn đang hỗ trợ lẫn nhau như thế này mà."
3158 = "Vừa bước vào Rail Shop, Reina và Nagi đã lao đến."
3159 = "Chúng tôi đồng thanh rồi nhìn nhau. Thấy Hachiroku có vẻ muốn nói, tôi gật đầu một cái."
3160 = "Nếu kiểm tra, thì phải dùng \\x%l指差喚呼;#00ffc040;chỉ tay hô xác nhận%l;#;. Vừa quen thuộc, lại vừa là cách ít sai sót nhất."
3162 = "Buông tay ra, chúng tôi bước qua cánh cửa của Rail Shop."
3163 = "Một góc nhìn mà tôi hoàn toàn không nghĩ tới, nhưng nghe em ấy nói vậy, tôi cũng đành gật gù đồng ý."
3165 = "Tôi có cảm giác như nghe thấy tiếng nghiến răng ken két."
3166 = "Phát huy hết mức có thể \"chất\" riêng của Đường sắt Ohito, để chào đón Đầu máy số 9 và \\x%lレイルロオド;#00ffc040;Railord%l;#; một cách ấm áp và vui vẻ."
3171 = "Còn Nagi và Fukami thì sao——tôi thử nhìn sang"
3173 = "Lời thì thầm gần như không phát ra tiếng và cái vẫy tay của tôi, đã được Hibiki phản hồi lại một cách nhanh chóng."
3174 = "A ra là vậy, tôi nghĩ…… Dù thấy hơi có lỗi với Reina, nhưng tôi cũng thở phào nhẹ nhõm được một chút."
3176 = "Anh rất vui vì tấm lòng của em. Nhưng ngày mai em còn phải làm nhiệm vụ trên chuyến tàu đầu tiên nữa. Không thể giữ em lại lâu được."
3177 = "Chỗ ngủ, rốt cuộc là sao. Không hiểu ý em ấy, tôi buột miệng thốt lên một âm thanh ngớ ngẩn."
3179 = "Điều đó cũng cho thấy công ty Đường sắt Mikan coi trọng sự tin tưởng, và mối liên kết với Đường sắt Ohito đến mức nào."
3182 = "Tôi tự nhiên bước nhanh hơn. Rồi chuyển sang chạy chậm."
3184 = "Vì tôi là chủ tàu của 8620, nên trừ khi có chuyện gì đó rất đặc biệt, còn không thì tôi sẽ cố định làm nhiệm vụ trên 8620."
3187 = "Không biết từ lúc nào, từ trong buồng lái, một \\x%lレイルロオド;#00ffc040;Railord%l;#; rất nhỏ nhắn đã bước ra."
3189 = "Tôi hiểu ngay nỗi lo của Hibiki. Ra là vậy——đúng là chuyện đó đáng lo thật."
3192 = "Vì thế, Paulette đã tha thiết mong muốn được nhượng lại Đầu máy số 9—— Còn Đường sắt Mikan thì kiên quyết từ chối vì 『Dù nói thế nào thì nó cũng quá cũ kỹ rồi』."
3193 = "Bi thương—— ra là, a, giọng nói này sao."
3196 = "Từ giờ trở đi là chế độ làm việc—— Tôi muốn như vậy, nhưng lại không thể chuyển đổi cái rụp được."
3203 = "Một bầu không khí vi diệu bao trùm lấy Rail Shop trong thoáng chốc."
3205 = "Đằng nào cũng chuyển nhượng, thì bắt đầu làm việc sớm vẫn hơn. Tôi hoàn toàn có thể đồng cảm với tâm trạng đó, và thấy thật đáng tin cậy."
3217 = "Hibiki lặng lẽ quay trở lại chỗ mọi người. Mọi người cũng nhanh chóng tụ tập quanh Hibiki."
3218 = "Bước ra. Nhưng, chỉ có mỗi bóng dáng của Paulette."
3221 = "（Khẽ）"
3223 = "Quả nhiên, khi thoát khỏi trạng thái bay bổng, Paulette lại rất đáng tin cậy."
3224 = "Đầu máy số 9 của Đường sắt Mikan là một \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; cực kỳ cũ kỹ đã 100 năm tuổi……hơn nữa đã mấy chục năm nay, nó chỉ hoạt động với tư cách là \\x%l入換機;#00ffc040;đầu máy dồn toa%l;#;."
3232 = "Vì biết rõ tình yêu đường sắt sâu đậm của Paulette, nên tôi cũng nghĩ sự hiểu lầm đó là điều khó tránh khỏi."
3234 = "Trong lúc đó, chỉ có bàn tay nhỏ bé của Hachiroku là vẫn vỗ nhè nhẹ. Tiếp tục vỗ về lưng Olivy một cách êm ái, dịu dàng."
3243 = "Không sao đâu. Tôi không còn cô đơn nữa. Vì vậy——tôi phải giúp đỡ cô bé đang phải chịu cảnh cô đơn kia."
3260 = "Paulette, Hibiki, và tất cả mọi người đều đồng loạt nhìn tôi."
3261 = "Paulette chạy chậm lại chỗ tôi. Nhưng, biểu cảm của em ấy lại tối sầm——!?"
3262 = "Paulette cũng từ trong đi ra. Bước chân của em ấy lâng lâng như đang mơ vậy."
3263 = "Bàn tay Paulette nhẹ nhàng vuốt tóc Reina, như muốn nói lời 『Cảm ơn em』."
3264 = "Paulette lại chìm vào im lặng."
3265 = "Paulette lạc quan một cách đáng sợ. Theo một nghĩa nào đó, em ấy đang hoàn toàn bay bổng."
3266 = "Paulette đang ôm Reina vào lòng. Ôm lấy, và từ từ vuốt ve vỗ về."
3267 = "Nhìn sang Paulette thì thấy em ấy đang mặc vest. Dẫn đầu là Reina, theo sau là Trưởng ga Kon và bầy chim sẻ."
3268 = "Mong họ đến càng sớm càng tốt. Paulette đã mong muốn như vậy. Đúng lúc đó, lại có cuộc điện thoại bảo là 『Muốn đi càng sớm càng tốt』……"
3269 = "Nụ cười của Paulette rạng rỡ."
3270 = "Cười khúc khích, Paulette nở một nụ cười vô cùng vui vẻ."
3271 = "Nghe câu nói của Fukami, chẳng hiểu sao Paulette lại cúi gằm mặt xuống."
3272 = "Paulette nâng ly lên. Hiểu ý, mọi người cũng lần lượt nâng ly của mình lên."
3275 = "Với một cô bé sắp khóc, thì đồ ngọt là tốt nhất."
3278 = "Reina mỉm cười nhẹ nhõm, có vẻ cũng đã hoàn toàn bình tĩnh lại. Nhưng, em ấy vẫn cứ bám dính lấy Paulette."
3280 = "Để đáp lại sự nhiệt tình đó, và cũng để họ sớm hòa nhập, tôi muốn tổ chức một buổi tiệc chào mừng không mang cảm giác làm qua loa."
3281 = "Tiếng khóc đó——tiếng gào khóc khiến tâm can lay động đó, không chỉ có mình tôi——không——"
3282 = "Để phòng hờ, tôi cầm theo bình chữa cháy ở cuối sân ga, rồi chạy chậm về phía buồng lái——!?"
3286 = "Hachiroku trao nó cho tôi một cách hào phóng, và cũng rất thanh lịch."
3288 = "Nhưng——người gật đầu đồng tình với lời nói thẳng thắn của Nagi, chỉ có mình tôi. ……Ra là vậy, đây là trạng thái bị kích thích bản năng làm mẹ sao."
3289 = "Đèn được bật sáng, chiếu rọi tấm bảng chào mừng."
3293 = "Khuôn mặt của Reina và Nagi đồng thời nhăn nhó."
3295 = "Reina có vẻ thực sự ngạc nhiên, còn những người khác thì, đều mang ánh mắt như muốn nói 『Bây giờ đừng nên khắt khe quá』."
3296 = "Reina nhẹ nhàng cất lời, xua tan đi sự im lặng."
3301 = "Nếu bình tĩnh nhìn lại, thì chuyện chuyển nhượng quá đỗi gấp gáp lần này. Việc cho rằng nó bắt nguồn từ một rắc rối nào đó, có vẻ tự nhiên hơn."
3309 = "Nhận ra sự bất thường, cả Hibiki, Nagi, Fukami, chị Mayami, Kisaki—— và ngay cả Reina cũng không biết phải làm sao, chỉ đứng chôn chân tại chỗ."
3310 = "Chắc Hachiroku cũng cảm thấy vậy. Em ấy dừng lại một nhịp, rồi thận trọng đặt ra một câu hỏi thực tế."
3311 = "Cuối cùng cũng sắp xếp xong suy nghĩ rồi nhỉ. Giọng điệu của Paulette tuy nặng nề, nhưng rất rõ ràng."
3313 = "Đưa mắt nhìn về phía cuối sân ga, thấy đền chủ Akai đang cầm một chiếc máy ảnh lớn."
3314 = "Tôi biết Suzu cũng có cùng cảm giác. Như mọi khi, chúng tôi nắm chặt tay nhau một lần."
3322 = "Chị Mayami vừa nói xong liền nhét ngay miếng sushi vào miệng. Quả là một sự tinh ý rất tự nhiên."
3331 = "Đến tận lúc này mà Kisaki vẫn ăn pizza. Em ấy gập đôi miếng bánh lại, rồi khéo léo đưa vào miệng."
3333 = "Kisaki đưa cho tôi một thứ gì đó một cách tự nhiên——ưm?"
3339 = "Đợi một lúc lâu, vẫn không thấy ai từ buồng lái bước xuống. Bởi vậy, sự im lặng bao trùm lấy không gian."
3342 = "Việc chuẩn bị xuất phát bắt đầu từ gần hai tiếng trước đó."
3343 = "Thuyết phục và nhận được sự đồng ý rồi mới ký kết, thì việc xây dựng mối quan hệ sau khi chuyển nhượng chắc chắn sẽ diễn ra suôn sẻ hơn."
3347 = "Trước lời hối thúc của Nagi, nụ cười của Paulette liền biến thành vẻ mặt bối rối."
3348 = "Chỉ nghe thôi cũng thấy đau lòng. Bị bỏ lại——nỗi đau đó, khiến tâm can tôi lay động."
3349 = "Nhắc mới nhớ——đúng là……từ lúc Olivy khóc, tôi có cảm giác Hachiroku đã đối xử với em ấy như một đứa trẻ."
3350 = "Nghe vậy, Hachiroku cười khúc khích, trông có vẻ rất thích thú."
3351 = "Nghe nói họ đã kiên quyết từ chối với lý do, \"Không thể nhượng lại một thứ có thể hỏng bất cứ lúc nào\"——"
3357 = "Ít nhất là với Hachiroku bình thường, chắc chắn sẽ không có thái độ như vậy với một \\x%lレイルロオド;#00ffc040;Railord%l;#; tiền bối."
3360 = "Lòng kiêu hãnh, vậy thì hãy tôn trọng nó. Hãy hành động dựa trên việc tin tưởng vào lời nói đó."
3378 = "Bức ảnh chụp khoảnh khắc Đầu máy số 9 lần đầu tiên tiến vào Ga Suối nước nóng Ohito. Có thể dùng làm quà tặng, hoặc làm tư liệu quảng bá cũng được."
3381 = "Chính vì cảm nhận được điều đó, nên tôi có thể tin chắc rằng. Olivy cũng sẽ sớm trở thành đồng đội của chúng tôi thôi."
3382 = "Suy cho cùng, đó là \"chuyện của người lớn\"."
3389 = "Cú giật mạnh đến mức nhìn bằng mắt thường cũng thấy rõ."
3402 = "Em ấy suýt ngã nhưng vẫn gượng lại được, chạy một mạch thẳng ra khỏi cổng soát vé mà không thèm nhìn ngó xung quanh——"
3403 = "Chuyện này……rốt cuộc nên làm thế nào đây."
3404 = "Đó là quyết định kinh doanh của cấp cao nhất. Hachiroku đang cẩn trọng lựa lời, nhưng tôi thấy không cần thiết."
3405 = "Nếu vậy, rủi ro phía Đường sắt Ohito sẽ được giảm thiểu đáng kể."
3406 = "Thế này là được rồi. Dù sao thì, nếu mọi người hành động và đánh lạc hướng sự chú ý, thì Olivy……có lẽ cũng sẽ dễ bộc lộ cảm xúc hơn."
3407 = "Chuẩn bị……hay nói đúng hơn, có lẽ, đó là món đồ em ấy đã để dành để ăn vặt."
3408 = "Tiếng khóc than đó——đã làm lay động tâm can đến nhường nào. Nó chứa đầy sự sợ hãi và đau đớn khi bị bỏ lại."
3409 = "Nhờ \\x%l客車;#00ffc040;toa hành khách%l;#; trống nên mới dừng lại được—— Nếu đầy khách, chắc chắn sẽ bị chạy quá đà."
3413 = "Vậy thì với một \\x%lレイルロオド;#00ffc040;Railord%l;#; của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; sắp khóc, than có lẽ sẽ là thứ hữu ích nhất."
3416 = "Suzu khẽ nép vào tôi. Một cách rất tự nhiên, em ấy đặt tay lên cánh tay tôi."
3417 = "Suzu mỉm cười gật đầu với tôi. Vậy thì, chuyện riêng tư đến đây là kết thúc."
3425 = "Cùng với tiếng bước chân mạnh bạo như giậm xuống đất, một thân hình to lớn bước xuống từ Đầu máy số 9."
3426 = "Nụ cười của Reina tạo nên bầu không khí. Một bầu không khí ấm áp, náo nhiệt, dịu dàng đậm chất Ohito."
3427 = "Dù chữ \"có lẽ\" hơi khiến tôi bận tâm, nhưng điều đó cũng thật đáng mừng."
3428 = "Dù không hiểu góc chụp hoàn hảo là gì, nhưng ra là vậy, là dịch vụ dành cho chụp ảnh à."
3429 = "Dù không biết có thể làm chỗ dựa cho em ấy không, nhưng không thể để em ấy khóc một mình được."
3430 = "Tôi không hề có ý định tình tứ, nhưng mà……"
3431 = "Dù không hợp tính cách, cũng không phải lập trường của tôi, nhưng thật vinh hạnh. Tôi rất sẵn lòng bắt nhịp."
3432 = "Tuy dừng đúng vị trí, nhưng cách xử lý \\x%lブレーキ;#00ffc040;phanh%l;#; lại như thể đang cuống cuồng cố bù đắp cho sai sót."
3439 = "Đầu tiên là tấm bảng chào mừng của Nagi và Fukami 『Chào mừng! Đến với quê hương hơi nước Ohito』——Không có vấn đề gì."
3449 = "（Nói cách khác, dù có \\x%l補機;#00ffc040;đầu máy phụ%l;#; đi chăng nữa, nhưng có thể vượt qua Yatake với tình trạng đó, thì \\x%l機関士;#00ffc040;người lái tàu%l;#; Munakata và Olivy——chắc hẳn phải có tay nghề rất đáng nể.）"
3452 = "（Pang!!!）"
3453 = "（Bốp!）"
3454 = "（Tách tách tách tách tách tách tách!!）"
3455 = "（Cạch! Cạch!!!）"
3456 = "（Kiên trì, à.）"
3459 = "（Nhưng nhìn từ góc độ ngược lại——điều đó cũng có nghĩa là họ đang lo lắng, việc ngừng hoạt động sau khi chuyển nhượng là một khả năng thực tế.）"

[selections]
