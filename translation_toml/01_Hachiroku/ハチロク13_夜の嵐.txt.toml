2432 = "「Chuẩn bị kỹ càng gớm nhỉ.\\nHachiroku, em có ý kiến gì không?」"
2433 = "「Thế này thì——khó mà biết được nhỉ.」"
2436 = "Khuôn mặt con bé nhăn nhó,\\nnhư thể lỡ nuốt nhầm cục than mà Hachiroku hay ăn vậy."
2438 = "「Xin ngài giúp em một chút thôi ạ.」"
2439 = "Con bé nhanh chóng nương theo\\nlời giải vây khéo léo của Hachiroku."
2442 = "Nếu \\x%lキハ07;#00ffc040;KiHa 07%l;#; hoạt động thì chỉ cần 2 ca, nhưng kế hoạch hơi lệch đi một chút,\\nlà thành 4 ca trong tình trạng thiếu phụ lái."
2444 = "Bắt đầu rơi rồi.\\nChưa kịp nghĩ xong, mưa đã trút xuống xối xả, gió tạt ngang dữ dội."
2446 = "Nếu là Hibiki của trước đây,\\nchắc chắn con bé đã hỏi ý kiến tôi đủ thứ về định hướng tương lai rồi."
2448 = "（Lộp độp lộp độp）"
2454 = "Bị kích thích, ký ức bắt đầu làm nhiễu loạn sự tập trung của tôi.\\nNgày hôm đó đang mờ ảo hiện ra, hòa lẫn vào lúc này, và nơi đây."
2455 = "Tôi cùng Hachiroku bước ra ngoài."
2461 = "Ngăn chặn được tai nạn, kéo dài tuổi thọ cho \\x%lキハ07;#00ffc040;KiHa 07%l;#;,\\nđây quả thực là điều may mắn nhất."
2506 = "Nỗi sợ hãi ập đến trong chốc lát.\\nRõ ràng tôi đã rũ bỏ được, đã dọn dẹp sạch sẽ rồi cơ mà."
2507 = "Hay nói đúng hơn, Hibiki làm gì có đủ mưu mô để bày ra trò đó."
2509 = "Cơ thể tôi vẫn cử động được.\\nNhững bài huấn luyện lặp đi lặp lại đã giúp cơ thể tự động phản xạ mà không cần ý thức."
2514 = "Hachiroku là một đồ vật, là một \\x%lレイルロオド;#00ffc040;Railord%l;#;——\\nNhưng đồng thời, em ấy cũng chắc chắn đang sống."
2516 = "Theo lời yêu cầu, tôi cử động cánh tay nặng trĩu tê rần,\\nđặt tay lên tay cầm \\x%l自弁;#00ffc040;van hãm tự động%l;#;."
2518 = "Vì đó cũng là điều tôi hơi bận tâm."
2520 = "Vì cũng đang để ý chuyện đó nên tôi hiểu ngay."
2524 = "Mọi cách đều đã làm rồi.\\nGiờ chỉ còn biết chờ đợi thôi."
2525 = "Nhắc đến tiền vốn thì đúng là đau đầu thật."
2529 = "「Gió tạt ngang, lại mới bắt đầu mưa.\\nXin ngài hãy thao tác thật nhanh và nhẹ nhàng.」"
2530 = "「Tại anh có cho phép lần nào đâu.」"
2532 = "Hibiki, Kisaki, Nagi và Fukami."
2534 = "Kế hoạch cắm trại do Nagi - một nữ hướng đạo sinh - đưa ra\\nquả thực rất tuyệt vời."
2536 = "Nếu là Hibiki của trước đây,\\nchắc chắn con bé đã hỏi ý kiến tôi đủ thứ về định hướng tương lai rồi."
2539 = "（Không sao đâu. Không sao——Bình tĩnh lại, phải bình tĩnh lại.）"
2541 = "Cơ thể tôi cử động, giống như mọi khi.\\nCứ làm như mọi khi là được——"
2542 = "Không còn gì phải lo lắng ở hậu phương nữa.\\nGiờ chỉ việc hướng thẳng về phía trước thôi!"
2544 = "Bị gài bẫy rồi sao——Tôi gần như phản xạ nghĩ vậy,\\nvà chính suy nghĩ đó khiến tôi nhận ra sự cố chấp của mình."
2547 = "Bóp. Nhả.——Trong tích tắc,\\ntôi xòe các ngón tay ra rồi nắm lại."
2549 = "Bị gài bẫy rồi sao——Tôi gần như phản xạ nghĩ vậy,\\nvà chính suy nghĩ đó khiến tôi nhận ra sự cố chấp của mình."
2551 = "Tôi lao xuống sân ga như lăn,\\nthấy Reina đi cùng Kuu và Kato Suzume đang ướt sũng."
2552 = "Câu hỏi dồn dập của Hachiroku,\\nlàm tôi cảm nhận được cả những ẩn ý bên trong."
2554 = "Có nên tin báo cáo này không.\\nNếu tin thì phải đi tìm ở đâu khác nữa đây——"
2555 = "「……Đã đến ngày mai rồi sao, cái lịch trình 4 vòng khứ hồi ấy.」"
2559 = "Tôi kéo Hachiroku lên buồng lái.\\nNgay lập tức, mở \\x%l乗務鞄;#00ffc040;túi phi hành đoàn%l;#; ra."
2564 = "「Anh hiểu rồi. Những ý tưởng mang tính đột phá\\nsẽ có khả năng cải thiện cả tính sinh lời nữa nhỉ.」"
2567 = "Tôi ném thêm một lớp than dày hơn chút,\\nđiều chỉnh thông gió \\x%l煙室;#00ffc040;buồng khói%l;#; và bơm nước lò hơi xong xuôi, rồi tiến về ghế \\x%l機関士;#00ffc040;lái tàu%l;#;."
2569 = "Tôi vốn định nói lời cổ vũ,\\nnhưng lại làm con bé buồn đi mất rồi."
2571 = "Một nụ cười tươi rói đến không ngờ.\\nKhông chỉ vậy, con bé còn làm động tác quyết tâm nữa."
2573 = "Tôi nuốt cơn buồn nôn xuống, và theo phản xạ, tôi thở hắt ra."
2575 = "Cơ thể tôi vẫn cử động được.\\nNhững bài huấn luyện lặp đi lặp lại đã giúp cơ thể tự động phản xạ mà không cần ý thức."
2576 = "Nếu \\x%lキハ07;#00ffc040;KiHa 07%l;#; hoạt động thì chỉ cần 2 ca, nhưng kế hoạch hơi lệch đi một chút,\\nlà thành 4 ca trong tình trạng thiếu phụ lái."
2578 = "Tiếng của Paulette."
2579 = "Tôi vừa định nói thì nhận ra ngay,\\nvà quả nhiên Hibiki đã bổ sung thêm."
2580 = "Hachiroku nhìn chằm chằm vào tôi.\\nÁnh mắt và cả bàn tay em ấy đều không hề rời đi."
2585 = "Phải làm sao đây——tôi bối rối,\\nchẳng tìm được từ ngữ nào thích hợp."
2588 = "「Không chỉ vậy đâu, chị Kisaki bảo về mặt vốn cũng cần nữa.」"
2589 = "Hay là kêu gọi quyên góp từ người dân và người hâm mộ đường sắt,\\ndù huy động vốn bằng cách nào đi chăng nữa………… Ra là vậy, hiểu rồi."
2591 = "Có lẽ suy nghĩ đã hiện rõ trên mặt tôi.\\nHibiki cầm miếng bánh mì trên tay, cất giọng đầy áy náy."
2592 = "Hoặc có lẽ,\\nđó là lời mà lái tàu Kiyomi đã nói với em ấy ngày xưa?"
2593 = "Có lẽ Hibiki cũng giống như tôi,\\nđều cảm thấy nhẹ nhõm."
2598 = "Nhưng, Hibiki đâu có lỗi gì trong chuyện này."
2607 = "「Thì đúng là hôm đó em nảy ra ý định đột xuất mà chưa chuẩn bị gì\\n……nhưng sau đó lập lại kế hoạch đàng hoàng rồi anh vẫn nói vậy.」"
2608 = "「Ừ.\\nQuả thật Nagi và Kisaki có vẻ sẽ tạo ra phản ứng hóa học đấy.」"
2610 = "Dùng sức nhiều thế này,\\nthì không thể nào hãm phanh êm ái được."
2612 = "Thò đầu ra khỏi cửa sổ buồng lái,\\nđôi mắt xanh thẳm đang nhìn thẳng lên tôi."
2614 = "「Dù sao thì, đó cũng là chuyện của tương lai xa.\\nCả việc thuê người mới, lẫn việc Hibiki tốt nghiệp.」"
2619 = "Hạn mức cho vay ở cấp chi nhánh thì không thể nào đủ được.\\nPhải cần đến khoản vay do Houshou Mototada quyết định, hoặc sự tham gia góp vốn của các công ty đường sắt."
2623 = "「Lỡ bão có tới cũng hổng sao đâu.\\nKhu nội trú mới hơn nhà mình nhiều.」"
2624 = "「Chắc là ở trong nhà ga thôi.\\nHọ bảo sẽ khảo sát chỗ đó mà.」"
2626 = "Vậy thì, tôi——"
2635 = "Hibiki khẽ ngước mắt lên nhìn dò xét."
2637 = "Hibiki phồng má lên.\\nTrông có vẻ như đang làm nũng, nhưng ánh mắt lại rất nghiêm túc."
2640 = "「Đúng thật.\\n……Đến sớm hơn dự báo nhiều nhỉ.」"
2651 = "Giai đoạn đòi hỏi sự chú ý cao độ nhất,\\nkhông phải là lúc mưa ướt sũng, mà là lúc vừa mới bắt đầu mưa."
2669 = "Sự mệt mỏi từ ca trực hôm nay vẫn còn bám rễ sâu,\\ntôi phải chuẩn bị sẵn sàng cho lúc cần xuất phát."
2676 = "Đến ngày tựu trường,\\nthì ngay cả việc luân phiên trực cũng không thể thực hiện được nữa."
2677 = "Thấy vậy, Hachiroku\\ntháo \\x%lタブレット;#00ffc040;thẻ bảng%l;#; ra và chuyển sang \\x%l運転体;#00ffc040;thân điều khiển%l;#;."
2678 = "Phải làm sao đây——tôi bối rối,\\nchẳng tìm được từ ngữ nào thích hợp."
2679 = "「À, dự báo thời tiết sao.」"
2680 = "Việc phản đối chỉ vì muốn phản đối thật là ngu ngốc.\\nChuyện nào ra chuyện đó, phải tách biệt với trước đây để phán đoán."
2684 = "Bị kích thích, ký ức bắt đầu làm nhiễu loạn sự tập trung của tôi.\\nNgày hôm đó đang mờ ảo hiện ra, hòa lẫn vào lúc này, và nơi đây."
2685 = "Tôi ném thêm một lớp than dày hơn chút,\\nđiều chỉnh thông gió \\x%l煙室;#00ffc040;buồng khói%l;#; và bơm nước lò hơi xong xuôi, rồi tiến về ghế \\x%l機関士;#00ffc040;lái tàu%l;#;."
2687 = "Không chỉ riêng Hibiki,\\nmà cả Nagi và Fukami có vẻ cũng rất quấn quýt với cô ấy."
2688 = "Bản thân Nagi cũng là kiểu người không thể đo lường bằng lẽ thường mà."
2689 = "「Chịu thôi.\\nCái mỏ than bỏ hoang Jutsusen đó đâu phải chỗ để ngủ lại.」"
2690 = "「Thiệt tình bé Nagi này,\\nngười ta đâu có hỏi vui hay không đâu.」"
2691 = "Hướng mắt về phía ghế \\x%l機関士;#00ffc040;lái tàu%l;#;,\\nHachiroku dời ánh nhìn đang chằm chằm vào bầu trời sang tôi."
2695 = "Cho đến khi gần tới ga Ohitoyo và ngừng cấp than\\nđể chuẩn bị vào ga——đây là sự phân công tốt nhất rồi."
2697 = "À, lại vòi vĩnh rồi.\\nMà chắc chắn cũng chẳng phải chuyện gì tốt đẹp."
2698 = "Vòng khứ hồi thứ 4, cuối cùng cũng là chuyến về.\\nTừ nãy đến giờ, tôi đã ném vào lò bao nhiêu than rồi không biết——"
2701 = "Tự mình tìm hiểu, tự mình suy nghĩ——\\nNhận ra con bé đã trưởng thành hơn, tôi thấy thật vui."
2702 = "Nhìn biểu cảm đó, tôi hiểu là con bé tưởng mình đang bị thuyết giáo."
2705 = "Thật đáng tin cậy."
2706 = "Chiến thuật huy động lực lượng vượt ngoài sức tưởng tượng——không phải mò kim đáy bể, mà là rải chim sẻ tìm kiếm,\\nchắc tụi nó đã lùng sục khắp trong mỏ than và khu ký túc xá cũ rồi."
2714 = "Với tôi, đó có vẻ là một phương án rất thông minh, nhưng……"
2716 = "「Đúng rồi! Cũng có lý do đó nữa. Với lại bé Nagi hay nói mấy câu\\nđột phá lắm, chị Kisaki cũng thấy thú vị nữa.」"
2717 = "「Vẫn còn ở Tây Nam Okinawa mà nhỉ? Dù có đổ bộ vào Kyushu,\\nthì cũng phải tầm nửa đêm ngày mốt cơ.」"
2719 = "「Ngài…… không sao chứ ạ?\\nSắc mặt ngài——」"
2720 = "Còn chuyện túi ngủ gì đó,\\ncó khi chỉ đơn giản là để quên ở đâu đó thôi——"
2724 = "「Không phải em định thi vào trường Mỹ thuật trên Đế đô sao?」"
2728 = "「!!!」"
2732 = "Đến ngày tựu trường,\\nthì ngay cả việc luân phiên trực cũng không thể thực hiện được nữa."
2733 = "Qua những lần khảo sát trước, cô ấy chắc chắn phải hiểu rõ\\nviệc ngủ lại trong mỏ than hay khu ký túc xá cũ nguy hiểm đến mức nào."
2738 = "Một giọng nói lo lắng."
2739 = "Kế hoạch cắm trại do Nagi - một nữ hướng đạo sinh - đưa ra\\nquả thực rất tuyệt vời."
2740 = "Trước câu nói đó của Hachiroku, tất nhiên tôi chỉ có thể gật đầu đồng tình."
2741 = "Cho đến khi gần tới ga Ohitoyo và ngừng cấp than\\nđể chuẩn bị vào ga——đây là sự phân công tốt nhất rồi."
2742 = "Chỉ một câu đó,\\ntôi đã hiểu lý do em ấy đổi sang \\x%l運転体;#00ffc040;thân điều khiển%l;#; có cảm biến tốt hơn."
2744 = "「Vậy, ở khu nội trú của trường thì được đúng không?\\nCó sóng điện thoại, \\x%lエアクラ;#00ffc040;Aircra%l;#; cũng dùng được nữa.」"
2758 = "Nếu Kisaki ngỏ lời \"Thấy sao?\",\\nchắc sẽ chẳng ai phản đối đâu."
2760 = "「Vâng!」"
2763 = "Tầm nhìn trở nên cực kỳ tồi tệ.\\nTiếng mưa lấn át cả tiếng nói."
2774 = "May mắn thì may mắn thật——nhưng tôi không ngờ thời gian sửa chữa kéo dài\\nlại ảnh hưởng theo cách này."
2775 = "Nhưng chị Mayami xem xong vẫn không cho phép,\\nvà tôi cũng chẳng thể nào bênh vực Hibiki được."
2778 = "Con bé nhanh chóng nương theo\\nlời giải vây khéo léo của Hachiroku."
2790 = "Uống ly cà phê sáng sớm, tôi kiểm tra lại lịch trình làm việc.\\nCái đầu còn ngái ngủ dần tỉnh táo lại, và tôi nhớ ra chuyện đó."
2794 = "「!」"
2801 = "Chỉ là một sự cố nhỏ.\\nMột ảo giác do sự non nớt của tôi tạo ra——"
2802 = "「Chị Kisaki bảo là vẫn còn thiếu một cú hích nữa.」"
2803 = "Thao tác chuẩn bị để dừng tàu.\\nCả \\x%l8620;#00ffc040;8620%l;#; và tôi, đều đã tiến đến bước này rồi."
2805 = "Về khoản chu đáo và chăm sóc người khác,\\nthì không ai thích hợp hơn Paulette cả."
2807 = "Kìm soát vé tuột khỏi tay rơi xuống.\\nNhưng tôi chẳng màng đến việc nhặt nó lên."
2813 = "「\\x%l逆転機;#00ffc040;Cần đảo chiều%l;#;, \\x%lミッドギア;#00ffc040;số trung tính%l;#;.」"
2815 = "Nếu vậy thì không sai vào đâu được.\\nDù sao người đi cùng cũng là Houshou Kisaki cơ mà."
2818 = "Những dị vật nhỏ bám trên đường ray sẽ nổi lên,\\nlàm giảm \\x%l粘着力;#00ffc040;lực bám đường%l;#; một cách đáng kể——!?"
2823 = "Hachiroku dùng khăn ăn,\\nnhẹ nhàng lau vụn than dính trên khóe miệng."
2825 = "「Ngài Soutetsu có thể——\\nchạm vào, và tự mình xác nhận được không ạ?」"
2826 = "「Ừm.」"
2827 = "Trong cơn mưa to gió lớn này, đôi cánh nhỏ bé của chim sẻ\\nliệu có bay nổi không, tôi cũng hơi nghi ngờ——"
2834 = "Không được——Cánh tay, thế này,\\ncăng cứng thế này thì——"
2841 = "Tiếng gió gào thét.\\nMùi than cháy——mùi khét lẹt."
2844 = "Từng cuộn khói cuồn cuộn hòa vào mây.\\nTrôi đi rất nhanh. Đến mức dị thường."
2846 = "Cứ thế để em ấy dẫn dắt, tôi đặt tay lên ngực Hachiroku.\\nThật ấm áp. Thật mềm mại."
2862 = "「!」"
2865 = "Khuôn mặt con bé nhăn nhó,\\nnhư thể lỡ nuốt nhầm cục than mà Hachiroku hay ăn vậy."
2866 = "（Thịch）"
2868 = "（Khục）"
2871 = "（A…… Thật sự không sao mà.）"
2873 = "「Không sao, chỉ hơi căng thẳng chút thôi.」"
2875 = "「Vậy nên, anh hai——à không, anh trai.\\nƯm, bọn em, nếu được thì.」"
2876 = "「Buổi tối……\\nNghe nói là sẽ nảy ra những ý tưởng mà bình thường không nghĩ tới được đấy ạ.」"
