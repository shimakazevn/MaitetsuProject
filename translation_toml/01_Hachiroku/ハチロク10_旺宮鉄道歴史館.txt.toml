2299 = "「Hô! Ra là vậy.」"
2302 = "「À, em bảo anh xem cái đó sao.」"
2304 = "「Ồ. Cậu biết sao Olivy.」"
2306 = "「A, đứa bé này có vẻ được đấy. Để bày tỏ sự kính trọng với cô Olivy.」"
2307 = "「Ồ. Tại sao cô lại nghĩ như vậy? Chẳng lẽ cô Hachiroku, đã từng có kinh nghiệm như thế sao?」"
2309 = "「À, có lẽ sắc thái cũng khá gần với di ngôn đấy. Như là sự kết hợp của cả hai, di ngôn và thừa kế di sản——」"
2311 = "「A, vậy thì tôi xin nhận.」"
2315 = "「Thời kỳ hoàng kim của Đường sắt Hoàng gia. \\x%lレイルロオド;#00ffc040;Railord%l;#; chỉ là linh kiện bảo đảm an toàn tiêu hao. Là luận văn vào cái thời mà chẳng có ai nghĩ đến việc kéo dài tuổi thọ cho các cô cả.」"
2317 = "「Kiểm tra có ý thức, sao ạ?」"
2319 = "「Được ngài Soutetsu khẳng định là có linh hồn. Được ngài cho phép có những mong muốn của riêng mình――thế giới của em đã hoàn toàn thay đổi.」"
2321 = "「Biệt danh, sao ạ? Tôi nhớ là——\"Phượng Hoàng Lửa\".」"
2328 = "「Ể!? Soutetsu, cậu không phải là fan cuồng đường sắt sao!? Thế mà cậu lại làm \\x%l機関士;#00ffc040;Lái tàu%l;#; cho Maitetsu (Đường sắt Ohimitera) á!?」"
2330 = "「Là đầu máy số 1 của Đường sắt Isumi. Đây là phương tiện chúng tôi đang giữ để tiến hành bảo dưỡng lại.」"
2337 = "「Sao vậy? Olivy. Không lẽ sức khỏe lại——」"
2338 = "「Olivy-chan!? Dù có là sự thật đi chăng nữa, thì cũng có những chuyện không được nói ra khỏi miệng đâu đấy!?」"
2339 = "「Trông tình trạng có vẻ tốt hơn trước nên tôi cũng yên tâm rồi. Có vẻ cô đang có một cuộc sống rất tốt nhỉ. Cô Olivy.」"
2340 = "「Bé Olivy…… đã tồi tệ đến mức đó rồi sao ạ?」"
2341 = "「Olivy, đừng chạy. Đang ở trong bảo tàng đấy.」"
2343 = "「Đang ngủ. Hoặc là, đang bị bắt phải ngủ. Đang được bảo quản. Đang ở trong trạng thái chết lâm sàng——đang bị đóng băng.」"
2345 = "「Vâng, nếu điều đó có thể giúp ích được gì—— Đương nhiên là, với điều kiện phải có sự cho phép của ngài Soutetsu ạ.」"
2347 = "「Ừm. Olivy-chan. Lát nữa gặp lại nhé.」"
2350 = "「Nếu cô không phiền thì. Em xin phép—— từ chối yêu cầu của tiến sĩ Fushicho ạ.」"
2351 = "「Nếu chỉ giới hạn ở các Navi của Aircra từ thế hệ thứ nhất trở đi, thì câu trả lời cho câu hỏi đó, sẽ là một lời từ chối rõ ràng.」"
2352 = "「Nếu ý định thực sự của Trevithick đúng như giả thuyết cô nói, thì tôi cảm thấy cơ chế đó ẩn chứa một ý nghĩa vô cùng to lớn.」"
2355 = "「Nói một cách gượng ép, là để thực hiện các loại phán đoán và giao tiếp ……có thể nói là sự phát sinh tự nhiên từ hoạt động của trí tuệ nhân tạo.」"
2356 = "「Nếu Stephenson là cha đẻ của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;, thì Trevithick chính là cha đẻ của \\x%lレイルロオド;#00ffc040;Railord%l;#;.」"
2360 = "「Nếu vậy thì, đó là một cuộc chạy tiếp sức rất hạnh phúc đấy. Luận văn của bà ấy, quả thực có sức ảnh hưởng đến mức đó.」"
2364 = "「Dạ——xin thứ lỗi cho em hỏi một chuyện hơi đường đột.」"
2366 = "「Tuyệt vời——」"
2367 = "「Gặp trực tiếp thì, thật vô cùng đáng tiếc, chỉ mới vài lần thôi. Nhưng mà, luận văn của bà ấy thì tôi đã đọc rất kỹ rồi.」"
2375 = "「Ngày xưa, công cuộc khai thác đã được tiến hành với quyết tâm như vậy nhỉ. Nhuốm màu Hinomoto lên những hình thái hiện có, và tái sinh chúng.」"
2376 = "「Ừm.」"
2377 = "「A! Quả thực, trong mắt những kẻ nghiệp dư như chúng ta, dù là những việc tưởng chừng như không thể——」"
2378 = "「Đúng vậy đó~! Nếu Đầu máy số 9 mà có Cow Catcher, thì cũng có thể hất văng cả trâu rừng (Buffalo) luôn đó nha!」"
2379 = "「Họ đã công bố như vậy. Nhưng, không một ai từng tận mắt nhìn thấy bức di thư đó cả.」"
2381 = "「Là vậy đấy.」"
2382 = "「Đúng đó~!!」"
2385 = "「Cho thấy——những ngày tháng?」"
2412 = "「Điều không tự nhiên……sao ạ?」"
2416 = "「Tốt lắm. Vậy thì, tôi có thể tiến hành phân tích và sao chép \\x%lタブレット;#00ffc040;thẻ bảng%l;#; của cô Hachiroku được chứ?」"
2419 = "「Tốt lắm. Vậy thì——tôi sẽ tiếp tục giải thích, bắt đầu từ sự thật. Mặc dù, đây là một sự thật không mấy ai biết đến.」"
2420 = "「Từ ga Teio đi qua ga Shizuoka, đến ga Fujieda, là vừa đúng 200 km một chút đấy ạ.」"
2423 = "「Chuyện đó……chuyện như vậy, em, hoàn toàn——」"
2424 = "「Chuyện như……vậy——」"
2425 = "「Là kỹ sư Stephenson——phải không ạ?」"
2427 = "「Là để……có thể nhận được di ngôn từ Olivy, nên cô mới bảo chúng tôi phải làm vậy sao.」"
2431 = "「Quả thực, có lẽ là như vậy ạ.」"
2432 = "「Thì ra là vậy——」"
2434 = "「Nếu được vậy thì giúp ích cho tôi nhiều lắm.」"
2436 = "「Tôi cũng sẽ làm như vậy.」"
2439 = "「Em cũng thấy lạ ạ. Một \\x%lレイルロオド;#00ffc040;Railord%l;#; bị suy giảm thị lực, thì không thể nào làm nhiệm vụ được.」"
2441 = "「Tôi cũng không bận tâm. Ngoài ra, nếu có bất cứ điều gì chúng tôi có thể giúp đỡ, xin cứ nói.」"
2444 = "「Hãy hỏi chính Olivy. Đó là điều mà bản thân cô ấy phải quyết định.」"
2446 = "「Navi của ngài Soutetsu, chính là hình ảnh về 『Navi của Aircra』 trong em, nhưng mà——」"
2447 = "「Em có cảm giác, mình cũng phần nào hiểu được điều đó ạ.」"
2450 = "「Tôi cũng vậy.」"
2451 = "「Tôi là \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của 8620 thuộc Đường sắt Ohimitera, Hachiroku. Xin được chiếu cố ạ.」"
2456 = "「Em nghĩ là như vậy ạ. Mặc dù, em cũng chưa từng thử giao tiếp sâu sắc với một chiếc taxi bao giờ……」"
2457 = "「Em cũng vậy. Sinh mệnh này vốn coi như đã từng mất đi một lần rồi. Thế nhưng, nếu lỡ như phải đánh mất ngài Soutetsu——」"
2460 = "「Anh tin vào phán đoán của em. Anh muốn chính em hãy suy nghĩ xem điều gì là tốt nhất cho em và Olivy.」"
2462 = "「Anh nghĩ, chắc chắn là có khả năng đó. Giữa anh và Hachiroku——không, Suzu——giữa anh và em.」"
2464 = "「Một sinh mệnh——kế thừa chúng ta.」"
2465 = "「Hình hài con người, tôi nghĩ là để trong trường hợp khẩn cấp có thể đóng vai trò thay thế cho \\x%l機関士;#00ffc040;người lái tàu%l;#; và \\x%l機関助士;#00ffc040;phụ lái tàu%l;#;.」"
2467 = "「Chắc hẳn cô ấy đã thiếp đi với niềm tin rằng—— mình sẽ tỉnh lại và khỏe mạnh trở lại mà.」"
2468 = "「Điều đó chắc chắn không phải là thứ——có thể đạt được bằng nỗ lực. Hay thuyết phục để dẫn dắt. Em nghĩ là như vậy ạ.」"
2473 = "「!!」"
2474 = "「Em——có thể làm được, phải không ạ. Cho dù, hình thức có khác với con người đi chăng nữa——」"
2477 = "「Vì vậy, cả ngài Migita và cô Hachiroku, đều có thể lựa chọn. Con đường coi như chưa nghe thấy gì cả, và bước ra khỏi đây.」"
2480 = "「Vì vậy——nên mới giới hạn chỉ trong đường sắt sao?」"
2481 = "「Vì vậy, việc \\x%l共感;#00ffc040;cộng cảm%l;#; ở mức độ mở hoàn toàn, hầu như tất cả các \\x%lレイルロオド;#00ffc040;Railord%l;#; đều chưa từng thực hiện dù chỉ một lần cho đến khi ngừng hoạt động.」"
2485 = "「Vì vậy, việc chia sẻ đến mức độ nào có thể được quy định chi tiết. Thông thường, dù có trở nên thân thiết nhất đi chăng nữa, thì cũng chỉ đến mức cảm xúc mà thôi.」"
2487 = "「Đúng vậy đúng vậy. Kiểm tra thông thường thì mới vài tháng trước, chúng tôi đã hoàn thành theo yêu cầu của Đường sắt Mikan rồi.」"
2488 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#; là một sự tồn tại ưu việt. Thực tế là ở Hinamoto hiện tại, các \\x%lレイルロオド;#00ffc040;Railord%l;#; đã nghỉ hưu đang hoạt động sôi nổi ở khắp mọi nơi——!」"
2493 = "「Nói cách khác, \\x%lタブレット;#00ffc040;thẻ bảng%l;#; chỉ có ở một nơi duy nhất—— không, nếu nói một cách chính xác hơn, thì có lẽ là」"
2496 = "「Con đường dẫn đến sự nắm chắc phần thắng đó—— hiện tại, cô đã nhìn thấu được bao nhiêu phần rồi ạ?」"
2498 = "「Tạo ra hình ảnh một \\x%lレイルロオド;#00ffc040;Railord%l;#; không thể tách rời với đường sắt, và để tuyệt đối không vượt ra khỏi khuôn khổ đó, họ đã bị tiêu hủy cùng với phương tiện.」"
2500 = "「Vậy thì, chỉ còn một việc nữa thôi. Tôi muốn ngài Migita đưa ra một quyết định.」"
2501 = "「Chà, đó là một vấn đề mà bản thân tôi cũng khó lòng đưa ra phán đoán. Vì vậy——tôi muốn giao phó việc phán đoán lại cho hai người.」"
2505 = "「Nếu cô nghĩ như vậy, thì cứ làm theo ý muốn của cô Hachiroku. Bởi vì đó có lẽ là phương pháp có xác suất thành công cao nhất.」"
2506 = "「Vì vậy」"
2507 = "「Nếu vậy, hoàn toàn không cần thiết phải loại bỏ \\x%lタブレット;#00ffc040;thẻ bảng%l;#; khỏi Navi Aircra. Vậy mà」"
2513 = "「Khai thác Hokkaido——vậy thì, là \\x%l蒸気機関車;#00ffc040;Đầu máy hơi nước%l;#; thời Minh Trị sao.」"
2516 = "「『Đau khổ trước sự trỗi dậy của Aircra』——nghĩa là—— họ đã để lại di thư hay thứ gì đó sao?」"
2522 = "「Là vậy……sao. A, không, nhưng mà, Navi của Aircra dường như cũng có linh hồn.」"
2525 = "「Vâng ạ. Các cô ấy……hay nói đúng hơn là, các Navi của Aircra thông thường, có lẽ, chỉ có thể xử lý \\x%l共感;#00ffc040;cộng cảm%l;#; ở mức độ thông tin mà thôi.」"
2527 = "「Vâng.」"
2529 = "「Vâng. Với chủ nhà tắm Tororyu-yu ạ.」"
2532 = "「Là \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; của nước Meikoku sao.」"
2535 = "「Vậy sao?」"
2536 = "「Đó là——những rủi ro như thế nào ạ?」"
2539 = "「Một chủng loài mới, mang tên \\x%lレイルロオド;#00ffc040;Railord%l;#;. Ai đó đã sợ hãi trước sự ra đời và phát triển của nó.」"
2542 = "「Đến giờ phút này rồi, tôi không còn sợ việc đánh mất chính mình nữa.」"
2545 = "「Đến mức đó sao?」"
2547 = "「Quả nhiên là vậy sao. Cảm ơn em đã cho anh biết.」"
2548 = "「Vâng, ạ……」"
2551 = "「Như tôi đã nói lúc nãy, Navi Aircra và \\x%lタブレット;#00ffc040;thẻ bảng%l;#;, vốn dĩ nên là những thứ cùng tồn tại với nhau.」"
2553 = "「Đúng vậy. Đúng như tên gọi, là cuộc kiểm tra được tiến hành trong trạng thái có ý thức.」"
2556 = "「Đúng, là vậy ạ. Tất cả những gì cả hai đã trải qua. Từ những điều muốn quên đi, những ký ức hạnh phúc, những khoảng thời gian quý giá, tất cả mọi thứ.」"
2557 = "「Vâng, đúng vậy ạ.」"
2559 = "「Con người thật của cô Hachiroku và ngài Soutetsu. Hình ảnh hai người luôn quan tâm và hỗ trợ lẫn nhau như hiện tại.」"
2561 = "「Đúng vậy đúng vậy, các nhân viên ở đây thường gọi tôi là, \"Tiến sĩ Phượng Hoàng Lửa\" đấy.」"
2564 = "「Là thứ trú ngụ bên trong \\x%lタブレット;#00ffc040;thẻ bảng%l;#; sao ạ?」"
2567 = "「Đúng vậy. \"Bọn chúng\", không hề sở hữu bất kỳ cảm xúc nào.」"
2569 = "「Đúng vậy. Của tôi, của cô Hachiroku, hay của cô Olivy——tất cả đều như vậy.」"
2572 = "「Ừm. Nếu là Hibiki, hoặc những chuyên gia lành nghề hơn, biết đâu họ sẽ tìm ra được một giải pháp nào đó.」"
2574 = "「Vâng. Để khai thác Hokkaido, nó là một trong sáu phương tiện mang tính lịch sử được nhập khẩu từ công ty Porter ạ.」"
2577 = "「Đúng vậy ạ. Chiếc 『Toyo』 này, được chế tạo vào năm Minh Trị thứ 12. Là một trong hai chiếc đầu tiên được nhập khẩu để phục vụ cho công cuộc khai thác.」"
2578 = "「Đúng là vậy ạ. Mặc dù người mà em từng gặp, chỉ có mỗi ngài 『Toyo』 này thôi nhưng——」"
2579 = "「Đúng vậy ạ. Quả thực là một sự sắp xếp, một quyết định vô cùng tuyệt vời.」"
2582 = "「Hai người thấy sao? Nếu được thì mời cả cô Hachiroku nữa. Đây là đặc sản của Hokkaido, rất hợp khẩu vị của \\x%lレイルロオド;#00ffc040;Railord%l;#; đấy.」"
2584 = "「Quyết định đó, không nên do tôi đưa ra.」"
2587 = "「Vậy sao? Thật thất lễ quá. Vậy thì, tôi xin phép làm lại.」"
2592 = "「Đúng vậy——à, không. Trước khi bày tỏ giả thuyết của mình. Tôi có thể hỏi ngài Migita thêm một câu nữa được không?」"
2600 = "「Tại sao những thứ như linh kiện bảo hộ tiêu hao của đường sắt lại được ban cho linh hồn, lại được ban cho hình hài con người——hai người đã từng nghĩ đến chưa?」"
2601 = "「Tại sao lại có sự chuyển giao thế hệ sang Navi Aircra mẫu hiện hành. Thực tế, Navi Aircra hầu như không hề gây ra tai nạn giao thông. Nhưng mà」"
2602 = "「Bị tháo dỡ và tiêu hủy. Cứ như thể, \"đang cố gắng bảo vệ một bí mật nào đó\" vậy.」"
2605 = "「Dù không được yêu cầu——em cũng nhất định sẽ làm như vậy.」"
2606 = "「Thế nhưng, thực tế là \\x%lタブレット;#00ffc040;thẻ bảng%l;#; đã bị loại bỏ. Thậm chí, nguồn cung cấp duy nhất của nó cũng đã bị đóng lại.」"
2611 = "「Loài?」"
2612 = "「Trevithick.」"
2613 = "「Trevithick?」"
2617 = "「Dòng dõi trực hệ của……một thiên tài duy nhất.」"
2625 = "「Ra là vậy. Sau cuộc Đại bãi bỏ tuyến đường sắt……Quả thực những người, tìm kiếm sự ổn định nghề nghiệp ở đường sắt, chắc sẽ ít đi nhỉ.」"
2626 = "「Mà nói đúng hơn, biết đâu đã có ví dụ được hiện thực hóa rồi cũng nên. Đã cất công đến Bảo tàng Lịch sử Đường sắt rồi, thì chúng ta nên xem tài liệu ở đây——」"
2630 = "「Việc tùy tiện chạm vào \\x%lレイルロオド;#00ffc040;Railord%l;#; sẽ gây nguy hiểm giao thông—— bị xử phạt cực kỳ nặng, cũng vì cùng một lý do.」"
2632 = "「Tại vì, ngày xưa ấy? Những nơi như Đường sắt Hoàng gia là doanh nghiệp nhà nước, nên có vẻ cũng có những người tìm đến đường sắt vì muốn sự ổn định.」"
2633 = "「Vì kiểm tra theo luật định là kiểm tra về mặt phần cứng mà. Trong trạng thái có ý thức, nguy cơ gây ra lỗi là rất cao.」"
2634 = "「Vì trước đó Momiji cũng đã nhờ vả rồi mà. Bảo là nếu Olivy đến, thì nhất định phải làm kiểm tra có ý thức.」"
2635 = "「\"Cộng cảm\" của hầu hết các Navi Aircra hiện hành, chỉ có thể thực hiện ở một tầng rất nông——mức độ chia sẻ thông tin mà thôi.」"
2636 = "「Đương nhiên, công ty \\x%lレイルロオド;#00ffc040;Railord%l;#; Tablet cũng bị đóng cửa và giải thể. Bởi vì công nghệ chế tạo \\x%lタブレット;#00ffc040;thẻ bảng%l;#; đã hoàn toàn bị thất truyền.」"
2638 = "「Tất nhiên, đây chỉ là kính không độ thôi—— Nhưng mà, có vẻ như vẻ bề ngoài cũng làm nên nội tâm đấy.」"
2639 = "「Có rất nhiều. Trước tiên, là sự không tự nhiên ở điểm 『Tại sao, chỉ ứng dụng cho đường sắt』.」"
2644 = "「Tororyu-yu——Cựu kỹ quan Toro! À, nhắc mới nhớ, bà ấy đang sống ở Ohimitera nhỉ.」"
2645 = "「Chủ nhà tắm Tororyu-yu——Bà ấy, từ trước cuộc Đại bãi bỏ tuyến đường sắt đã luôn, nghĩ cho \\x%lレイルロオド;#00ffc040;Railord%l;#; chúng em——」"
2649 = "「Với tình trạng hiện tại, chúng tôi không thể tiến hành những thí nghiệm nguy hiểm như vậy. Liệu chúng tôi có thể nắm chắc phần thắng trong việc khởi động lại ở một trạng thái tốt hơn không.」"
2652 = "「Cô có quen biết bà ấy sao?」"
2655 = "「Không ngờ, lại được kiểm tra ngay trong ngày——」"
2656 = "「Thật sao!?」"
2672 = "「Nên cho thấy điều gì mới được ạ?」"
2678 = "「Momiji?」"
2682 = "「Cộng thêm……thì, sẽ đưa ra được giả thuyết như thế nào ạ?」"
2687 = "「Nhắc mới nhớ, khác với Navi——em chưa từng cảm thấy những chiếc Aircra nhan nhản ngoài phố kia giống như em gái mình.」"
2692 = "「Hơn nữa, việc tin vào giả thuyết đó, cũng đi kèm với cả những rủi ro nữa.」"
2693 = "「Chiếc còn lại được nhập khẩu vào lúc đó là, 『Himiko』. Em nghe nói ngài 『Himiko』, hiện đang ở Kyoto ạ.」"
2697 = "「Trước thời kỳ Đại bãi bỏ——trước khi đường sắt suy tàn—— \\x%lレイルロオド;#00ffc040;Railord%l;#; của các phương tiện bị phế thải, không có ngoại lệ nào, đều」"
2701 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#;, trên thực tế, gần như là một \"loài\". Thứ duy nhất còn thiếu, là khả năng sinh sản và nhân giống.」"
2704 = "「Giữa lúc đó, tôi đã bắt gặp luận văn kia. Không——không hề nói quá đâu, thế giới như đảo lộn mòng mòng vậy.」"
2705 = "「Trevithick đã tự nhận thức được điều đó. Nhưng có lẽ, ông ấy đã không thể kìm nén việc thử nghiệm công nghệ của mình.」"
2707 = "「Cô nói vậy là sao——cụ thể thì như thế nào?」"
2710 = "「Tất nhiên rồi——bất kể là câu hỏi gì.」"
2712 = "「Không hề tồn tại bất kỳ trường hợp trí tuệ nhân tạo nào có thể tự phát sinh linh hồn đâu. Trong lịch sử công nghệ của tất cả các lĩnh vực, ngoại trừ \\x%lレイルロオド;#00ffc040;Railord%l;#;.」"
2716 = "「Các nhà nghiên cứu ở khu vực nói tiếng Vịnh (tiếng Anh) thì—— Nfufu! Còn gọi tôi là Doctor Phoenix nữa!」"
2719 = "「Nếu vậy thì……quan điểm về \\x%lレイルロオド;#00ffc040;Railord%l;#; của Thị trưởng Paulette, chủ nhà tắm Tororyu-yu, cũng đã có ảnh hưởng rất lớn sao?」"
2723 = "「Em cũng xin phép được dùng cùng ạ.」"
2728 = "「Quyết định, sao. Chuyện gì vậy?」"
2729 = "「Nhắc mới nhớ, đúng là vậy nhỉ! Thế thì, cậu phải học hỏi thật nhiều ở đây thôi~」"
2730 = "「Quả thực nếu cách nhau 200 km, thì môi trường cũng sẽ thay đổi khá nhiều nhỉ. Nếu ở Hinomoto thì——」"
2731 = "「Một cơ chế không hề có từ thế hệ thứ nhất trở đi. Nói cách khác, là Navi Aircra có chứa \\x%lタブレット;#00ffc040;thẻ bảng%l;#; bên trong.」"
2750 = "「Vì vậy, việc yêu cầu \\x%l共感;#00ffc040;cộng cảm%l;#; ở mức độ mở hoàn toàn, là một điều vô cùng khó khăn và cũng chẳng mấy tốt lành gì, nhưng mà——」"
2752 = "「Không lẽ nào——Tổng tài Ueyama là…… cái đó——nói sao nhỉ.」"
2753 = "「Nhắc mới nhớ——lúc nãy Hachiroku, đã gọi phương tiện này là 『Tàu Toyo』 nhỉ?」"
2754 = "「Ngài Toyo——vị \\x%lレイルロオド;#00ffc040;Railord%l;#; dịu dàng và xinh đẹp đó, hiện giờ có khỏe không ạ?」"
2756 = "「Cặp kính này……là vì tôi ghét cái tên được đặt cho. Nên mới bắt đầu đeo nó để trông có vẻ người lớn hơn một chút thôi.」"
2757 = "「Kể cả lúc đó. Bây giờ thì bản thân việc nghiên cứu \\x%lレイルロオド;#00ffc040;Railord%l;#;, cũng đã trở nên cực kỳ dị giáo rồi.」"
2759 = "「Hư hừ?」"
2760 = "「Dạ, \"giả thuyết\" mà hai người nói đến rốt cuộc là gì ạ. Thật xấu hổ, nhưng em vẫn chưa hiểu một chút nào cả.」"
2761 = "「Đó là chuyện gì vậy ạ?」"
2762 = "「Dạ!」"
2763 = "「Vâng.」"
2764 = "「Luận văn.」"
2812 = "「——Chuyện đó, nói cách khác là」"
2813 = "「Vào thời điểm đó, chắc hẳn đây là một nghiên cứu dị giáo lắm nhỉ.」"
2814 = "「Dù là \\x%lレイルロオド;#00ffc040;Railord%l;#; và con người. Thậm chí là những chủng loài khác nhau vẫn có thể cùng tồn tại, tôi muốn hai người tiếp tục chứng minh điều đó.」"
2816 = "「Là \\x%l排障器;#00ffc040;bộ gạt vật cản%l;#; nhô nhọn ra phía trước, đặc trưng của \\x%l蒸気機関車;#00ffc040;Đầu máy hơi nước%l;#; kiểu cũ của Minh Quốc. Đó chính là Cow Catcher ạ.」"
2818 = "「Là vậy……đó ạ. Ngài Soutetsu.」"
2819 = "「Đó là Katsugen loại cứng, được tôi đặt mua từ Hokkaido qua một kênh đặc biệt đấy.」"
2820 = "「Vậy thì có chút đáng tiếc nhỉ. Nếu Đầu máy số 9 mà được gắn Cow Catcher, thì trông chắc chắn sẽ rất đáng yêu đấy.」"
2821 = "「Khai thác thực sự là như vậy đó~! Là hất văng đi những thứ vốn có từ trước!!」"
2822 = "「Chà, điều đó thì chưa rõ. Đó cũng là điều mà tôi muốn biết nhất.」"
2823 = "「Đương nhiên rồi. Một \\x%lレイルロオド;#00ffc040;Railord%l;#; đã ngừng hoạt động hoàn toàn thì, có lẽ dù làm cách nào cũng không thể khởi động lại được đâu.」"
2825 = "「Ồ.」"
2826 = "「Nếu vậy……nếu vậy thì, em——」"
2827 = "「Vậy sao~」"
2828 = "「À.」"
2829 = "「Quan sát rất nhạy bén. Tỷ lệ xảy ra tai nạn đường sắt trước thời kỳ Đại bãi bỏ, thấp hơn một cách đáng kể so với tỷ lệ do Navi Aircra hiện hành gây ra.」"
2830 = "「Chuyện đó……quả thực không phải là chuyện nhỏ đâu.」"
2831 = "「Chà, quả thực không phải chuyện nhỏ. Như tôi đã nói lúc nãy—— ngay cả cô Toyo đang trong trạng thái đóng băng, cũng đã từ chối mở hoàn toàn mà.」"
2834 = "「Nơi này……là——」"
2835 = "「Bên này! Philadelphia của Aldwin là một đô thị lớn! Bên kia! Pittsburgh của Porter thì không đến mức đó.」"
2836 = "「Là để hạn chế tối đa cơ hội tiếp xúc của Railord…… với những người ngoài ngành đường sắt——với thế giới bên ngoài……」"
2837 = "「Ra vậy, hóa ra là hàng xóm à.」"
2838 = "「!」"
2839 = "「!!!?」"
2840 = "「Cũng không tồi nhỉ! Cow Catcher của Porter ấy!!」"
2842 = "「Anh đã chứng kiến. Công việc của Hibiki. Thiết kế là, biến những cách bố trí tưởng chừng như không thể thành có thể thông qua việc sắp xếp lại.」"
2862 = "「Họ đã sợ hãi điều gì vậy ạ?」"
2864 = "「Vậy thì, Olivy đi kiểm tra đây~」"
2866 = "「Trước khi tháo \\x%lタブレット;#00ffc040;thẻ bảng%l;#; ra, cô ấy vẫn đang hoạt động sao?」"
2870 = "「Là vậy đó? Ngài Migita.」"
2872 = "「Nếu vậy, hãy hợp tác với nghiên cứu của tôi nhé.」"
2874 = "「Để tìm hiểu điều đó, nên cô mới xây dựng viện nghiên cứu này sao?」"
2876 = "「Vậy thì tôi xin hỏi thêm. \"Ý nghĩa to lớn\" đó là gì?」"
2878 = "「Vậy thì, câu hỏi là. Cơ chế giải trừ phong ấn, rốt cuộc là」"
2881 = "「Nói vậy tức là——kiểm tra \\x%lレイルロオド;#00ffc040;Railord%l;#; thông thường, được tiến hành trong trạng thái vô thức sao?」"
2884 = "「Sự nắm chắc phần thắng trong việc khởi động lại ở một trạng thái tốt hơn……sao.」"
2885 = "「Vậy thì……Navi Aircra của chiếc Aircra nhà tôi—— mà tôi đang sở hữu——không nằm trong số hầu hết đó sao.」"
2886 = "「Nếu vậy——」"
2887 = "「Nếu vậy thì, cái gọi là Cow Catcher đó là」"
2888 = "「Nếu vậy thì, còn một việc nữa. Dù đây sẽ là một yêu cầu vô cùng khó khăn, và cũng chẳng mấy tốt lành gì.」"
2889 = "「Chà. Nhìn lại lịch sử và những sự thật từ nãy đến giờ—— hai người có cảm thấy một điều gì đó rất không tự nhiên không?」"
2890 = "「Nếu vậy, cô chính là \\x%lレイルロオド;#00ffc040;Railord%l;#; của C57 145 đúng không? Tôi nhớ, tên cô là——」"
2892 = "「Nếu vậy thì kiểm tra có ý thức là—— Một cuộc kiểm tra mang tính chất, chăm sóc tâm hồn sao ạ?」"
2893 = "「Nếu vậy, 『Linh hồn』 là——」"
2894 = "「Nếu vậy, mức độ mở hoàn toàn là——đúng như nghĩa đen, tất cả những gì bên trong \\x%lタブレット;#00ffc040;thẻ bảng%l;#;——\\x%l共感;#00ffc040;cộng cảm%l;#; toàn bộ lĩnh vực, sao?」"
2896 = "「Thế thì, việc Soutetsu bắt đầu từ một tay mơ, mà giờ lại trở thành một \\x%l機関士;#00ffc040;Lái tàu%l;#; cừ khôi như thế này, là nhờ có Hachiroku nhỉ!」"
2898 = "「Vậy thì, kiểm tra có ý thức, là cuộc kiểm tra được tiến hành đối với những khía cạnh ngoài phần cứng sao.」"
2899 = "「Vậy còn, linh hồn?」"
2902 = "「Không sao đâu. Suzu.」"
2903 = "「Suzu, em sao vậy!? Mức độ mở hoàn toàn rốt cuộc là——」"
2911 = "「Khi đường ray ngày càng vươn xa, những quy định vận hành mà Trevithick đặt ra cũng dần không còn được tuân thủ nữa.」"
2913 = "「Khả năng xảy ra ngay lập tức thì có lẽ là thấp. Nhưng—— cô ấy đang ở trong tình trạng hao mòn mà dù có chuyện gì xảy ra bất cứ lúc nào cũng không có gì lạ.」"
2914 = "「Soutetsu?」"
2915 = "「Ngài Soutetsu——」"
2916 = "「Ngài Soutetsu là vì Ohimitera. Và, một phần nào đó, là vì em——nên mới trở thành \\x%l機関士;#00ffc040;Lái tàu%l;#; hơi nước ạ.」"
2918 = "「Đúng là vậy nhỉ——ngài Soutetsu.」"
2919 = "「Quả thực——cũng có thể rút ra được…… giả thuyết như vậy, nhỉ.」"
2920 = "「Nhìn kìa! Hachiroku! Soutetsu!! Cow Catcher!!」"
2921 = "「Cách xa đến mức đó, mà vẫn ở cùng một bang sao. Minh Quốc, quả thực rất rộng lớn nhỉ.」"
2922 = "「Đã cất công có được tuyệt phẩm này. Hai người thấy sao nếu chúng ta thưởng thức nó ở một nơi đặc biệt?」"
2923 = "「Linh hồn——Đúng vậy. So với việc gọi là tâm lý, gọi là ý thức, hay gọi là bản ngã. Cái tên linh hồn mới là phù hợp nhất.」"
2924 = "「Linh hồn——thì——」"
2925 = "「Linh hồn, là……」"
2929 = "「Trước tiên là sự thật. Với lý do là đau khổ trước sự trỗi dậy của Aircra, thế hệ thứ ba của nhà Trevithick, đã tự sát cùng toàn bộ gia đình.」"
2931 = "「Tuyệt vời! Thật là một sự thông minh tuyệt đỉnh!! Con mắt nhìn người của Momiji không hề sai! Ngài Migita——cậu——」"
2941 = "「Cow Catcher!!」"
2943 = "「Do——Doc, tor……Phoe, nix. Phụt.」"
2946 = "「H.K. Porter! Công ty ở Pittsburgh!!」"
2948 = "「Nếu nói về việc gặp mặt trực tiếp, thì đây là lần đầu tiên, Miss Olivy. Xin hãy chiếu cố cho tôi nhé.」"
3149 = "Chỉ bằng một lời nói, sự mơ hồ đã tan biến. Giả thuyết giờ đây đã mang theo sức nặng của hiện thực."
3153 = "Khoảnh khắc đó, một tia sáng lóe lên trong đầu tôi."
3156 = "Sự kiện Ueyama——một vụ án bí ẩn nổi tiếng mà ngay cả tôi cũng biết."
3158 = "Không——cái này là—— Có lẽ. Cô ta đang tạo dáng."
3176 = "Tiến sĩ Phượng Hoàng Lửa quỳ xuống, cầm lấy tay Olivy và đặt môi lên đó."
3177 = "Một tiếng lầm bầm như một tiếng thở dài thườn thượt."
3178 = "Bị tiến sĩ Fushicho nắm lấy tay——"
3179 = "Vừa bước lên buồng lái, tiến sĩ Fushicho liền móc chiếc đèn làm việc LED lên."
3180 = "Ánh mắt của tiến sĩ Fushicho chợt hạ xuống sàn nhà."
3181 = "Một giọng điệu ngắn gọn đầy vẻ nghi ngờ."
3182 = "Nhiệt độ trong giọng nói của tiến sĩ Fushicho đột ngột giảm xuống."
3183 = "Một giọng điệu quả quyết. Tôi gật đầu đồng ý."
3184 = "Trước câu hỏi của Hachiroku, Tiến sĩ Phượng Hoàng Lửa nhướng mày lên một cách hơi khoa trương."
3185 = "Buông tay Hachiroku ra một cách dứt khoát, Tiến sĩ Phượng Hoàng Lửa tiến lại gần tôi với những tiếng cộc cộc."
3186 = "Tiến sĩ Phượng Hoàng Lửa gõ gõ ngón tay, chỉ vào cặp kính của mình."
3187 = "Nói rồi, tiến sĩ Fushicho rảo bước——"
3188 = "Tiến sĩ Fushicho vừa nói vừa đẩy gọng kính lên."
3189 = "Tiến sĩ Phượng Hoàng Lửa lặng lẽ đứng lên, chìa tay phải về phía Hachiroku."
3190 = "Tiến sĩ Phượng Hoàng Lửa, lặng lẽ gật đầu. Đôi mắt sau lớp kính chợt nheo lại, đầy vẻ hoài niệm."
3208 = "Cho \"ai\" thấy. Hachiroku không hỏi, và tiến sĩ Fushicho cũng không nói."
3209 = "Ngay cả khi vận hành \\x%l運転体;#00ffc040;kíp lái%l;#;, việc bắt buộc phải đặt \\x%l整備体;#00ffc040;thân chính%l;#; bên trong buồng lái, chính là minh chứng rõ ràng nhất cho điều đó."
3214 = "Có lẽ Hachiroku, cũng đã cảm nhận được điều tương tự chăng?"
3217 = "Gần quá. Gần quá rồi. Mũi với mũi sắp chạm vào nhau đến nơi rồi."
3224 = "Giữa con người và \\x%lレイルロオド;#00ffc040;Railord%l;#;, không thể sinh con theo cách mà con người vẫn làm."
3230 = "Đó hẳn là một niềm vui sướng tột độ, và cũng là một nỗi sợ hãi tột cùng."
3233 = "Cùng với lời nói, bộ quần áo tung bay phần phật."
3234 = "Cùng với sự phát triển của đường sắt, cả hai đã hưng thịnh——rồi cùng nhau suy tàn, dưới sự trỗi dậy của Aircra và ảnh hưởng của Đại bãi bỏ."
3236 = "Nhưng, ngay lập tức cô ấy \"À\" một tiếng ngắn gọn. Tiến sĩ Fushicho cất giọng như vừa chợt nhận ra điều gì đó."
3238 = "Nhưng, đây không còn là vấn đề của riêng \"tôi và Suzu\" nữa. Không chỉ Olivy, mà nó còn liên quan đến những vấn đề rộng hơn và sâu sắc hơn."
3241 = "Nhưng, nếu việc giải trừ phong ấn là chìa khóa. Thì việc sao chép, hay sáng tạo ra \\x%lタブレット;#00ffc040;thẻ bảng%l;#; vốn được cho là bất khả thi hiện nay——"
3243 = "Di chuyển đến trước máy bán hàng tự động."
3258 = "Khoảnh khắc nghe thấy điều đó, Hachiroku tròn xoe mắt."
3260 = "Có lẽ Hachiroku cũng lần đầu tiên nhận ra điều đó, cô ấy chớp mắt ngạc nhiên."
3262 = "Nhẹ nhàng né tránh bàn tay mà Tiến sĩ Phượng Hoàng Lửa định nắm lấy, Hachiroku ưu nhã nhón lấy gấu váy của mình."
3264 = "Hachiroku khẽ nuốt nước bọt. Cô cứ thế im lặng một lúc, hé mở đôi môi rồi lại ngậm chặt."
3266 = "Những ngón tay của Hachiroku đưa lên trước ngực—— như đang bấu chặt lấy \\x%lタブレット;#00ffc040;thẻ bảng%l;#; của mình."
3270 = "Hachiroku khẽ rùng mình."
3273 = "Hachiroku ngơ ngác nghiêng đầu."
3275 = "Lẩm bẩm như thể đang gặm nhấm điều gì đó, Hachiroku chợt ngước lên nhìn tôi."
3277 = "Bỏ lại sự cảm thán của Hachiroku khi nhìn quanh bảo tàng, Olivy bay thẳng một mạch về phía trước."
3278 = "Hachiroku vỗ tay bộp một cái rồi nhìn tôi. Khi tôi gật đầu đáp lại, cô ấy cất giọng với một chút khách sáo."
3281 = "Hachiroku gật đầu thật mạnh, nhìn chằm chằm——vào Tiến sĩ Phượng Hoàng Lửa."
3284 = "Giọng điệu sững sờ của Hachiroku."
3288 = "Giọng nói của Hachiroku, vô cùng tĩnh lặng. Rất tĩnh lặng, và không hề run rẩy."
3289 = "Giọng nói của Hachiroku run rẩy. Đôi mắt em run rẩy."
3290 = "Hachiroku cất lên một giọng nói khẩn thiết."
3291 = "Đôi mắt của Hachiroku hơi rơm rớm."
3292 = "Có lẽ đã hiểu được ý định của tôi, Hachiroku chỉ lặng lẽ gật đầu."
3294 = "Ánh mắt của Hachiroku——ánh mắt đang nhìn tôi bỗng dao động. Vì vậy, tôi nhẹ nhàng vỗ vỗ lên đầu em ấy."
3296 = "Hachiroku hơi nghiêng đầu vẻ khó hiểu."
3297 = "Hachiroku khẽ gật đầu một cái."
3298 = "Hachiroku khẽ nhắm mắt lại, với vẻ đầy hoài niệm."
3299 = "Trong chớp mắt, khuôn mặt Hachiroku đỏ bừng lên. Tiến sĩ Phượng Hoàng Lửa nhếch mép cười——biểu cảm đó khiến tôi nhớ lại."
3305 = "Hachiroku khẽ gật đầu một cái."
3306 = "Hachiroku không né tránh mà đón lấy bàn tay đó, và trao đổi một cái bắt tay với nụ cười thanh lịch."
3311 = "Tù chung thân, hoặc tù có thời hạn từ hai năm trở lên."
3313 = "Quả thực khớp nối tự động là quy chuẩn chung. Khi gắn vào một Đầu máy số 9 nhỏ bé, trông nó thực sự rất to."
3319 = "Như đang ca hát——tiến sĩ Fushicho từng bước kể lại câu chuyện, kể lại lịch sử."
3321 = "Dù có thể thực hiện những cuộc hội thoại thường ngày một cách trau chuốt—— nhưng không hề thể hiện bản ngã, giống như Navi."
3323 = "Dù tôi đã ngắt lời để trả lời câu hỏi, nhưng tiến sĩ Fushicho có vẻ không hề phật ý."
3324 = "Dù tôi có ôm chặt lấy bờ vai em hơn, sự run rẩy cũng không hề giảm bớt chút nào."
3334 = "Nếu để \\x%lレイルロオド;#00ffc040;Railord%l;#; hoạt động ở những lĩnh vực ngoài đường sắt, thì có lẽ ông ta đã có được bao nhiêu tùy thích."
3338 = "Đôi mắt như đang bối rối ấy cầu cứu tôi. Nếu vậy, tôi đành phải nói ra suy nghĩ của mình thôi."
3339 = "Hachiroku mang một vẻ mặt sững sờ…… nhưng rồi, vẫn chầm chậm gật đầu đáp lại."
3343 = "Mặc dù vậy, sự linh hoạt trong vận hành của họ lại 『thậm chí có thể cố ý gây hại cho con người』."
3345 = "Có lẽ vì bầu không khí bao quanh tiến sĩ Fushicho đã dịu lại, nhiệt độ trong giọng nói của Hachiroku cũng quay trở lại."
3346 = "Stephenson ở ngoài sáng, còn Trevithick ở trong tối. Bằng cách hỗ trợ lẫn nhau, đường sắt và \\x%lレイルロオド;#00ffc040;Railord%l;#; đã trở thành một thể thống nhất."
3348 = "Stephenson. \"Cha đẻ của ngành đường sắt\" mà ngay cả tôi cũng biết."
3359 = "Đây là một lịch sử ít được biết đến đến mức như vậy. Hoặc nếu không, thì đó là một lịch sử đã bị che giấu."
3365 = "（Vút! Vút!）"
3366 = "Cô ấy bật cười bằng một giọng điệu như đang đùa cợt, nhưng ẩn sau lớp kính kia, là một ánh nhìn sắc bén."
3371 = "Chạm vào linh hồn của Hachiroku. Vì đã chạm vào, vì đã biết——"
3372 = "Bởi vì chỉ cần được ở bên nhau, đã là một niềm hạnh phúc tột cùng rồi."
3378 = "Dù ví von hơi tệ, nhưng có lẽ cũng giống như việc thay thế linh kiện PC trong trạng thái đã tắt nguồn vậy."
3391 = "Đôi mắt Olivy sáng lấp lánh. Giống hệt như lúc cô bé hét lên \"Cow Catcher\" rồi chạy vọt đi vậy."
3392 = "Chữ \"to đùng\" được thốt ra kèm theo một nụ cười gượng."
3393 = "Olivy cúi gằm mặt xuống, cuộn tròn lưng lại và run rẩy."
3394 = "Olivy nhìn thẳng vào chiếc Cow Catcher của tàu Toyo. Rồi cô bé ngồi bệt xuống, lặng lẽ ngước nhìn nó một lúc lâu."
3395 = "Olivy gật gù, nhìn Hachiroku, rồi lại nhìn tôi."
3396 = "Olivy lặp lại như một con vẹt trong vô thức."
3397 = "Olivy tươi cười ngắm nhìn chiếc đầu máy cỡ nhỏ, và gật đầu mạnh vẻ hài lòng."
3398 = "Vừa cười vừa vẫy tay rối rít, Olivy được một người phụ nữ có vẻ là nghiên cứu viên dẫn đi vào trong."
3399 = "Tiến sĩ Phượng Hoàng Lửa từ cự ly cực gần, nhìn chằm chằm vào Olivy đang cứng đờ người."
3400 = "Nói rồi, Olivy dang rộng cả hai tay ra hết cỡ."
3401 = "Gật gật gật. Olivy gật đầu liên tục một cách đầy khoa trương."
3403 = "Lại là một giọng điệu như đang đùa cợt. Nhưng lần này, đằng sau lớp kính kia——là một nụ cười vô cùng dịu dàng."
3405 = "Một tiếng cười như đang đùa cợt. Thế nhưng, đôi mắt sáng lên sau lớp kính kia, lại vô cùng nghiêm túc."
3407 = "Cô ấy đang cố gắng diễn lại một Hachiroku như mọi khi—— ít nhất là ở vẻ bề ngoài."
3408 = "Dừng lại cái rụp."
3412 = "Quả thực nó không hề phù hợp với vẻ ngoài trí thức, đeo một cặp kính cực kỳ hiếm thấy ở các \\x%lレイルロオド;#00ffc040;Railord%l;#; của cô ta."
3415 = "Thứ được ném qua theo một đường parabol, không phải là lon, mà là hộp giấy."
3417 = "Cô ấy gật đầu, như muốn nói là đã đạt điểm đỗ."
3419 = "Sự đùa cợt đã biến mất khỏi giọng điệu của cô ấy. Thay vào đó là một áp lực không thể chối cãi."
3420 = "Nghe vậy, tôi chợt sững sờ."
3423 = "Thật khó để diễn tả đó là một nụ cười, một biểu cảm có phần nhếch mép——hoặc nếu không thì là một biểu cảm gượng gạo."
3424 = "Tôi cảm nhận sâu sắc một niềm vui ấm áp. Đồng thời, tâm trí cũng trở nên vững vàng hơn."
3427 = "Việc thao tác trong trạng thái đang cắm điện, huống hồ là đang chạy hệ điều hành, chỉ mang lại rủi ro lớn cho cả người thao tác lẫn PC mà thôi."
3429 = "Những kiến thức mà tôi, Hachiroku và Olivy đang tìm kiếm, khao khát. Nếu chạy trốn khỏi đây——thì tuyệt đối sẽ không thể nào có được."
3431 = "「Nhưng nếu họ cố tình chọn những cái tên của 『phụ nữ Hinomoto』 để đặt cho việc khai thác, di cư đến Hokkaido, nơi từng là 『vùng đất của người khác』——」"
3432 = "Linh kiện bảo đảm an toàn tiêu hao."
3439 = "Một người phụ nữ đeo kính——không, một \\x%lレイルロオド;#00ffc040;Railord%l;#;, bước tới gần với những tiếng cộc cộc."
3441 = "Tôi không hề ngạc nhiên trước lời chỉ ra đó."
3442 = "Nhìn thấy phản ứng đó, Tiến sĩ Phượng Hoàng Lửa có vẻ hài lòng, nheo đôi mắt sau lớp kính lại."
3443 = "Trong trường hợp hành vi đó dẫn đến chết người, sẽ bị tử hình, hoặc tù chung thân."
3445 = "『Những điều quý giá muốn mang theo xuống mồ』, ngay cả trong tôi, chắc chắn cũng có."
3447 = "Tổng tài đầu tiên của Teitetsu được phát hiện đã tử vong do bị tàu cán vào một đêm mưa giữa khuya. Đó là một vụ án mạng, hay chỉ là một tai nạn, sự thật đó cho đến nay vẫn——!"
3454 = "A, dưới lớp sàn này——ở tầng hầm sâu hơn nữa, có lẽ các \\x%lレイルロオド;#00ffc040;Railord%l;#; đang say giấc, tôi cảm nhận được điều đó."
3456 = "Đôi mắt sau lớp kính bỗng chốc trở nên sắc bén hơn."
3461 = "Sự tươi sáng và kiên cường của Olivy, có lẽ ít nhiều cũng liên quan đến nơi cô bé được sinh ra."
3463 = "Những thông tin về tôi và Hachiroku, cho đến cả những chi tiết khá nhỏ nhặt, có lẽ đã được công chúa Densha truyền đạt lại rồi."
3469 = "Tôi cũng chỉ có thể nghĩ như vậy. Cho dù việc để lại toàn bộ bản thân mình có hữu ích cho nghiên cứu đến đâu đi chăng nữa——"
3472 = "Tôi gật đầu trước những lời của Hachiroku."
3475 = "Một tầng hầm mờ tối và lạnh lẽo. Nhà chứa máy bay……không, gọi là nhà kho thì đúng hơn."
3477 = "Thứ đang lấp đầy tâm trí tôi lúc này, là lý trí, hay là cảm xúc, tôi cũng không rõ nữa."
3480 = "Tôi đã thắc mắc tại sao một \\x%l蒸気機関車;#00ffc040;Đầu máy hơi nước%l;#; mang đậm chất Minh Quốc (Mỹ) như thế này, lại được đặt những cái tên rặt chất Hinomoto đến vậy."
3483 = "Gật đầu. Cả tôi và Hachiroku. Ngoài việc đó ra, chúng tôi chẳng thể làm gì khác."
3485 = "Tôi và Hachiroku đưa mắt nhìn nhau."
3486 = "Quả nhiên, đổi địa điểm là vì lý do đó sao. Dù tôi thấy lúc nãy chúng tôi cũng đã nói những chuyện khá nhạy cảm rồi——."
3489 = "Nếu hình ảnh về Minh Quốc được cụ thể hóa dù chỉ một chút, tôi cảm giác như mình sẽ hiểu ra được điều gì đó."
3491 = "Bất giác quay mặt về phía đó, Hachiroku đang nhìn lại tôi bằng ánh mắt say đắm."
3492 = "Nếu vậy——a, cổ họng tôi bỗng khát khô. Tôi uống cạn một hơi hộp giấy vừa nhận được lúc nãy."
3494 = "Đây chính là——một trong những điều mà Paulette đã nói, 『nét đặc trưng của \\x%l蒸気機関車;#00ffc040;Đầu máy hơi nước%l;#; Minh Quốc』 chẳng phải sao."
3500 = "Tôi ôm lấy bờ vai ấy——để giúp em ngừng run rẩy, tôi đánh bạo dấn tới, tiếp tục đặt câu hỏi."
3501 = "Tôi ôm chặt lấy bờ vai của Hachiroku."
3503 = "Tôi không muốn dập tắt ánh sáng này. Nghĩ vậy, dòng suy nghĩ của tôi lại càng tiếp tục liên kết với nhau."
3504 = "Cùng với Hachiroku——Suzu, trải qua những khoảng thời gian hạnh phúc. Chẳng cần phải được nhờ vả, cũng không cần phải cố ý nỗ lực."
3506 = "Tôi khẽ nuốt nước bọt."
3507 = "Tay cô ấy nóng rực. Cùng lúc với sự kinh ngạc của tôi, bàn tay đó đột ngột buông ra."
3510 = "Tôi nhớ đến \\x%lレイルロオド;#00ffc040;Railord%l;#; của đền trưởng Akai——Niiroku. Nghe nói cô ấy đã đánh mất \\x%l整備体;#00ffc040;thân chính%l;#; của mình——"
3512 = "Hay là giữa hai người họ, đang có sự \\x%l共感;#00ffc040;cộng cảm%l;#; nào đó giao thoa, tôi chợt nghĩ vậy."
3517 = "Tôi cảm thấy sợ hãi khi phải suy nghĩ, khi phải dấn sâu vào nó. Nhưng, hơn thế nữa, tôi có thể tin chắc."
3519 = "Tôi có cảm giác mình hiểu được điều đó. Bởi vì, tôi cũng từng là một người anh sinh đôi."
3520 = "Hoàn toàn không có gì phải do dự cả. Để nói cho em ấy biết điều đó, tôi nhẹ nhàng vuốt ve đôi má đang run rẩy của em."
3523 = "Có lẽ tôi, đã cố tình không suy nghĩ sâu xa về điều đó, tôi nhận ra."
3524 = "Gật đầu đồng tình, tôi chợt nhớ ra."
3525 = "Việc không nhận ra được, có lẽ là do bản thân cô ấy là một \\x%lレイルロオド;#00ffc040;Railord%l;#;. Nếu vậy, để tôi trả lời cho."
3530 = "Từ đó rút ra được, \"cộng cảm ở mức độ mở hoàn toàn\" là gì. Điều đó có lẽ mang ý nghĩa là——"
3540 = "Đôi mắt Olivy sáng lấp lánh, tôi cũng nhìn vào \\x%l蒸気機関車;#00ffc040;Đầu máy hơi nước%l;#; mà Hachiroku đang ngắm nhìn với vẻ hoài niệm."
3543 = "Nếu vậy, chúng tôi không cần bận tâm đến ánh nhìn của bất kỳ ai, chỉ cần cứ là chính mình, tiếp tục những ngày tháng bình dị là được."
3548 = "Từ đầu máy xe lửa chưa được bảo dưỡng, \\x%l気動車;#00ffc040;toa xe tự hành%l;#;——cho đến cả tàu điện. Những phương tiện như vậy được cất giữ chật ních trong này."
3555 = "Mức độ mở hoàn toàn—— Ngay khoảnh khắc nghe thấy cụm từ đó, biểu cảm trên khuôn mặt Suzu bỗng sụp đổ."
3565 = "Vì vậy, tôi cố tình gọi tên em ấy, với tư cách là một \\x%lレイルロオド;#00ffc040;Railord%l;#;."
3568 = "Phơi bày toàn bộ con người mình, không giữ lại bất cứ điều gì. Nếu có thể chấp nhận điều đó, thì đó chính là một mối quan hệ tin tưởng tuyệt đối."
3575 = "Cô ấy chớp mắt như để che giấu điều đó, rồi gật đầu một cái thật mạnh."
3576 = "Đường sắt, du lịch, \\x%lレイルロオド;#00ffc040;Railord%l;#;——Để trả lời cho muôn vàn câu hỏi hóc búa, cô ấy cũng tự mình mong muốn, và không ngừng học hỏi."
3580 = "Rồi sau đó, rùng mình, cô ấy lại khẽ run lên vì sợ hãi."
3581 = "Nhưng đường sắt đã phát triển xo xa so với những gì Trevithick tưởng tượng."
3587 = "Vì có Navi, nên chúng tôi hầu như, chưa từng để tâm đến các Navi của Aircra thông thường."
3588 = "Một sự áp đặt tư tưởng mạnh mẽ đến mức không tự nhiên rằng \\x%lレイルロオド;#00ffc040;Railord%l;#; là 『Vật phẩm』."
3594 = "Tiến sĩ Fushicho có vẻ muốn đóng vai trò người chấm điểm. Nếu vậy, tôi sẽ trình bày câu trả lời theo cách của riêng mình."
3595 = "Có lẽ cô ấy cũng đã đi đến cùng một kết luận với tôi. Hachiroku thốt lên một tiếng sợ hãi."
3596 = "Suzu có lẽ cũng đã cảm nhận được ý định đó."
3598 = "Nhìn bao bì thì có vẻ đây là một loại thức uống chứa vi khuẩn axit lactic."
3615 = "Tôi gật đầu rồi chợt giật mình. Suzu rất coi trọng câu trả lời của tôi. Vì vậy, sự đồng tình vừa rồi thực chất cũng giống như một lời từ chối vậy."
3618 = "Như thể đã lường trước được phản ứng đó, Tiến sĩ Phượng Hoàng Lửa gật đầu vẻ đắc ý, rồi nói tiếp."
3620 = "Từ Hachiroku, cũng là một lời từ chối trên thực tế. Nhưng, tiến sĩ Fushicho lại cất lên một giọng điệu có vẻ vui mừng."
3623 = "Và rồi trên gương mặt của tiến sĩ Fushicho, nụ cười tủm tỉm đặc trưng đó lại quay trở về."
3625 = "Ở bên cạnh, Olivy không biết có hiểu hay không, nhưng vẫn gật đầu lia lịa."
3626 = "Ufufu, một tiếng cười nhỏ vang lên."
3630 = "Lúc nãy cô ta đã đánh giá cuộc đối thoại của chúng tôi là \"phản ứng tốt\", ra là vậy, có lẽ là ý đó."
3631 = "Như một điều hiển nhiên, Suzu gật đầu. Tiến sĩ Fushicho lộ vẻ ngạc nhiên."
3633 = "Tên thật. Chắc hẳn là cái tên mà Densha Hime đã cho chúng tôi biết, cái tên 『Hiyoko』."
3635 = "Ý nghĩa đã được xâu chuỗi lại. Lời mào đầu cho một yêu cầu vô cùng khó khăn, và cũng chẳng mấy tốt lành gì."
3636 = "Nghe đến đó, tôi mới lờ mờ hiểu ra."
3641 = "Tôi đã có thể chia sẻ kiến thức cùng với Hachiroku. Chỉ một điều nhỏ nhặt như vậy thôi, cũng khiến tôi cảm thấy lâng lâng vui sướng."
3648 = "Tiền bạc, danh vọng, và tất cả những thứ khác——"
3661 = "Người đàn ông đầu tiên trên thế giới, đã thành công trong việc đưa \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; vào ứng dụng thực tế cho đường sắt công cộng."
3663 = "Sững sờ——kinh ngạc——không, còn trống rỗng hơn cả những từ ngữ đó—— A, đúng rồi. Một biểu cảm như người mất hồn——!!?"
3664 = "Nói rồi, tôi bất giác nhìn sang Hachiroku."
3665 = "（Vút）"
3667 = "Rồi cô ta mỉm cười. Một nụ cười tự nhiên, khác hẳn với nhiệt độ lúc nãy, khẽ nở trên môi."
3668 = "Nói rồi bộp một cái, tay của Olivy vỗ lên chiếc Cow Catcher——!"
3689 = "Michiko và tôi có sự kết nối với nhau, nhưng không phải là hòa làm một hoàn toàn. Chính vì vậy, vào lúc đó——nhờ Michiko đã đẩy tôi ra xa."
3691 = "Từ phía sau, vang lên những tiếng vỗ tay rất khẽ. Tôi quay lại xem có chuyện gì."
3702 = "Thì ra là vậy. Navi của các loại xe Aircra thông thường, taxi Aircra hay xe buýt Aircra, khác biệt rất lớn so với Navi nhà tôi."
3703 = "Nếu đó là phán đoán của nhà nghiên cứu \\x%lレイルロオド;#00ffc040;Railord%l;#; hàng đầu đất nước này, thì tôi cũng sẽ ngoan ngoãn nghe theo."
3705 = "Chuỗi ký tự đó, chính là cách đối xử với \\x%lレイルロオド;#00ffc040;Railord%l;#; theo kiểu Đường sắt Hoàng gia, trong một thời gian gần đây, tôi cũng đã phần nào hiểu được."
3707 = "Bên phía phụ lái của buồng lái thuận tay phải, không hiểu sao lại có một chiếc hộp lớn bị bỏ lại. Nhưng……ngoài cái đó ra thì——"
3717 = "Nếu vậy thì đáng lẽ ra cô ấy cũng bị tháo dỡ và tiêu hủy cùng với \\x%lクハ26;#00ffc040;Kuha 26%l;#;—— Bằng một cách nào đó, cô ấy đã trốn thoát khỏi số phận đó sao."
3719 = "Mà này, lúc nãy—— chẳng phải là đã vượt quá nhiệt độ an toàn rồi sao?"
3720 = "Thì việc trẻ lại, không gì khác chính là hành vi làm xáo trộn hệ thống đó."
3731 = "Từ đó, cô bé bước đi với tốc độ nhanh đến kinh ngạc, tiến lại gần một chiếc đầu máy cỡ nhỏ."
3732 = "Dù có vẻ chẳng giúp ích gì cho việc duy trì sức khỏe của \\x%lレイルロオド;#00ffc040;Railord%l;#;, nhưng để cô ấy ra rìa thì cũng tội nghiệp. Lát nữa tôi sẽ mua cả phần cho Olivy vậy."
3738 = "Trước câu hỏi có phần vồ vập đó, Olivy lại lắc đầu với vẻ mặt đầy áy náy."
3745 = "Điều đó là đương nhiên. Giả sử đó là một loài, và có một hệ thống dự kiến cả sự chuyển giao thế hệ——"
3757 = "（Lạch cạch lạch cạch）"
3759 = "（A. Nếu vậy thì cái tên 『Momiji』 lúc nãy—— cũng giống như một biệt danh của Densha Hime sao?）"
3760 = "（A——）"
3761 = "（Vút）"
3764 = "（Lộp bộp, lộp bộp, lộp bộp）"
3767 = "Doctor……không, Tiến sĩ Phượng Hoàng Lửa cười một cách điềm nhiên, rồi sải bước tiến lại gần Olivy."

[selections]
