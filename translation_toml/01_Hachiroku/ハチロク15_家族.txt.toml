[script]
71 = "Không chỉ thông qua các cửa hàng, mà còn phổ biến và đẩy mạnh việc bán hàng trực tiếp từ nhà máy đến khách hàng."
74 = "Cuộc đại tu \\x%lキハ07;#00ffc040;Kiha 07%l;#; cuối cùng cũng hoàn tất, hiện tại chỉ có \\x%l列車;#00ffc040;đoàn tàu%l;#; BBQ chạy khứ hồi hai chuyến mỗi ngày."
79 = "Cánh cửa \\x%l客車;#00ffc040;toa hành khách%l;#; đang mở toang. Phía trước, ngập tràn ánh sáng trắng xóa."
80 = "Chắc là em ấy vừa hoàn thành \\x%l仕業検査;#00ffc040;kiểm tra doanh nghiệp%l;#; xong. Reina trong \\x%l整備体;#00ffc040;thân chính%l;#; đang đứng đó với vẻ mặt ngạc nhiên."
1211 = "――Tôi vừa nói vừa đứng dậy."
1220 = "……Họ đã cho tôi biết một cách thật tinh tế. Rằng lời chúc phúc, cũng chính là sự ủng hộ."
1222 = "……Chuyện này, rắc rối rồi đây――À không, cũng chẳng rắc rối lắm nhỉ? Dù sao thì sớm muộn gì cũng phải nói cho mọi người biết mà."
1224 = "『Hinomoto Quốc Lục Pháp Toàn Thư』"
1232 = "「Công ty \\x%lエアクラ;#00ffc040;Aircra%l;#; có thể giảm thiểu đáng kể chi phí vận chuyển, và về phía chúng ta, cũng có thể đảm bảo được nguồn thu nhập ổn định từ việc chở hàng hóa.」"
1235 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#; và con người, làm thế nào để kết hôn với nhau?」"
1238 = "「Điều này được hiểu chung là hai giới tính nam và nữ.」"
1239 = "「Nhỏ nhoi——sao」"
1241 = "「Xấu hổ kiểu đó là kiểu gì vậy chị?」"
1242 = "「…………」"
1252 = "「……Chẳng phải đã có chuyện đó sao ạ. Chuyện lấy chính bản thân Ngài Soutetsu ra làm tài sản thế chấp ấy.」"
1253 = "「……Tôi chỉ nghĩ ra được một người thôi.」"
1256 = "「……Trông anh, có vẻ như đang gặp ác mộng sao?」"
1257 = "「……A.」"
1258 = "「……Michiko, đã ra ngoài trước rồi nhỉ」"
1261 = "「……Nếu đó là mong muốn của ngài Soutetsu. Em sẽ luôn lấp đầy trái tim ngài」"
1264 = "「……Navi đang làm cái quái gì vậy.」"
1524 = "「Chắc chắn sẽ có những \\x%lレイルロオド;#00ffc040;Railord%l;#; mới―― những đứa em gái mà em chưa từng gặp mặt.」"
1526 = "「Trúng ba đích, bốn đích luôn? Ủa? Để xem nào…… Thành phố Ohimitera và thành phố Sendai, Đường sắt Ohito và Đường sắt Mikan――」"
1532 = "「Không phải đâu, bé Nagi. Trong trường hợp này, chắc chắn là, ừm――」"
1534 = "「Không, dù thế nào thì cũng nhanh quá rồi đấy?」"
1535 = "「Chứ còn sao nữa. Ý mọi người là, vẽ ra một bức tranh lớn như vậy, anh hai cực kỳ giỏi luôn ấy.」"
1537 = "「Không biết có phải là đổi ca làm việc không nhỉ?」"
1540 = "「Nhưng mà――em là \\x%lレイルロオド;#00ffc040;Railord%l;#; mà.」"
1544 = "「Không! Chuyện đó không hề đương nhiên chút nào. Bởi vì, em là \\x%lレイルロオド;#00ffc040;Railord%l;#;.」"
1546 = "「Không, tôi không nói chuyện đó―― À, ra vậy. Là chuyện đó à.」"
1549 = "「Không, không phải chuyện kết hôn của Reina đâu. Tôi và――」"
1550 = "「Không đâu, không có gì đáng tiếc cả. Bởi vì sổ hộ khẩu có thể được lập mới. Dựa theo quyết định của người đứng đầu chính quyền địa phương.」"
1554 = "「Không đau buồn. Cũng chẳng bi thương」"
1555 = "「Sinh con đẻ cái, không phải là cách duy nhất để tiếp nối sinh mệnh.」"
1556 = "「Không phải là nhỏ nhoi, mà là rất nhiều. Bởi vì em, chắc chắn sẽ lấp đầy trái tim anh」"
1559 = "「Đúng vậy. Cho dù chúng ta có yêu nhau và lấp đầy nhau đến đâu, Hachiroku, giữa em và tôi――không thể sinh con được.」"
1560 = "「Cũng phải thôi.」"
1562 = "「Cùng chúc nhau một ca làm việc tốt lành nào.」"
1563 = "「Con người và \\x%lレイルロオド;#00ffc040;Railord%l;#; kết hôn á.」"
1579 = "「Sự thật đây là vùng đất lý tưởng nhất để mở rộng vẫn không thay đổi, nhưng việc thành lập nhà máy ở Ohimitera thì không thể thực hiện được nữa rồi.」"
1580 = "「Đâu rồi? Michiko――――」"
1581 = "「Vì vậy, là sao?」"
1582 = "「Họ của em sẽ sớm đổi thành Migita đấy nhé? Chữ Hachiroku quý giá……À không. À, ra vậy.」"
1584 = "「Đến rồi đây nè!」"
1590 = "「Sổ hộ khẩu……sao ạ.」"
1591 = "「Đâu có gì kỳ lạ đâu anh? Không kỳ lạ chút nào, nhưng mà――」"
1599 = "「Hai giới à.」"
1602 = "「Chị Hachiroku, anh Soutetsu, hôm nay cũng hãy cùng nhau cố gắng nha~」"
1603 = "「Nếu được, cho đến khoảnh khắc chức năng của em ngừng hoạt động. Xin hãy lấp đầy em. Mãi mãi, lấp đầy em bằng Ngài Soutetsu.」"
1604 = "「Hachiroku, tôi.」"
1605 = "「Hachiroku. Tôi muốn thề lại trước mặt mọi người.」"
1607 = "「Koushi (công tư) á? Ý anh là koushi (bê con) hả? Ý là phải phân biệt rạch ròi trắng đen như đốm bò sữa ấy hả?」"
1609 = "「Dạ, à ừm……Đến tận bến tàu―― Navi đã đến đón tụi em, ạ.」"
1611 = "「Đúng hơn là, tôi muốn làm như vậy. Vì thế, tôi có một chuyện muốn nhờ Paulette chỉ bảo.」"
1612 = "「Không――」"
1615 = "「Giả sử tôi có tố chất đó đi chăng nữa. Một tố chất không được mài giũa thì rốt cuộc cũng chẳng khác gì không có.」"
1616 = "「Ra vậy. Dù có xây nhà máy ở Sendai, nhưng nếu có thể vận chuyển xe mới bằng đường sắt thì――」"
1635 = "「Tôi sẽ lấp đầy em. Chắc chắn. Chừng nào sinh mệnh tôi còn tiếp diễn.」"
1636 = "「Là 『Suzu』.」"
1638 = "「Đáng tiếc là, em lại không có.」"
1641 = "「Nhưng mà――Nhưng mà, Ngài Soutetsu thì...」"
1642 = "「Dù vậy……Dù ngài đã biết điều đó.」"
1648 = "「Tên, sao?」"
1649 = "「Tên…… Tên của, em.」"
1651 = "「!?」"
1653 = "「Dạ?」"
1654 = "「Hả? Hỏi tôi sao?」"
1657 = "「Hả? Dạ――Tất nhiên là em... không có gì phản đối cả, nhưng mà, công việc thì sao ạ.」"
1658 = "「Oa――」"
1660 = "「Haưư～～」"
1662 = "「Ây da, náo nhiệt quá nhỉ.」"
1663 = "「Hả!? Khoan đã, anh hai! Em cũng đi nữa! Em là phụ lái mà!」"
1665 = "「Hả?」"
1666 = "「Hô.」"
1668 = "「Ối!」"
1669 = "「A——」"
1671 = "「A――Vâng. Vâng! Em rất sẵn lòng!! Là em! Nếu như ngài không chê――em――thì……」"
1672 = "「A……」"
1673 = "「A……Ra là vậy. Chi phí vận chuyển để giao hàng, ngay cả với \\x%lエアクラ;#00ffc040;Aircra%l;#; thì vẫn tốn kém nhỉ.」"
1678 = "「A……Ư――A」"
1679 = "「A……vâng」"
1681 = "「À……Đúng thật này.」"
1682 = "「À.」"
1683 = "「A, mọi người đã tập trung đông đủ rồi à. Tôi bắt mọi người phải đợi sao.」"
1685 = "「A, vâng. Chuyện đó thì đúng là vậy, nhưng mà――」"
1687 = "「A, đúng vậy nhỉ. Chắc chắn mọi người đều muốn biết mà.」"
1691 = "「A, dạ――Em cảm ơn mọi người ạ!」"
1692 = "「A, ra vậy……. Anh đã khóc sao」"
1693 = "「Này!」"
1695 = "「Vâng, a lô. Nhà Migita xin nghe.」"
1696 = "「A lô, tôi đây. Đúng lúc lắm.」"
1698 = "「Oa oa oa, với Reina thì, chuyện kết hôn vẫn còn sớm quá ạ.」"
1699 = "「Ừm——」"
1700 = "「Vâng. Thành ra ồn ào mất rồi.」"
1701 = "「Ừ.」"
1702 = "「Vâng, cùng cố gắng nhé.」"
1703 = "「Ừ. Tôi cũng vậy. Tôi cũng yêu em, và sẽ ở bên em suốt đời. Nếu vậy thì chúng ta đương nhiên――」"
1705 = "「Ừ, tôi đã nói.」"
1707 = "「Ừ, tôi biết. Là vấn đề về mặt pháp luật nhỉ. Thế nên tôi mới định đi hỏi đây.」"
1710 = "「Ừ, có điện thoại à?」"
1712 = "「Ừ. Được đấy. Như vậy sẽ dễ dàng phân biệt rạch ròi giữa công việc và đời tư hơn.」"
1713 = "「Hửm?」"
1714 = "「Hửm? À――」"
1716 = "「Fufu, Soutetsu đi nhanh thật đấy.」"
1717 = "「À.」"
1718 = "「Ồ!」"
1721 = "「Bị buông bỏ——Ngài có thấy cô đơn không ạ?」"
1722 = "「Bởi vì tôi muốn thực hiện mong muốn của em.」"
1724 = "「Khi làm việc, em muốn được sử dụng họ cũ của mình ạ.」"
1725 = "「Trong trường hợp của Ohimitera thì sẽ do Thị trưởng quyết định. Thế nên, vấn đề này cũng hoàn toàn được giải quyết.」"
1728 = "「Dựa trên tiền đề đó, pháp luật cấm kết hôn với người thân trực hệ, trùng hôn, và kết hôn trước độ tuổi luật định.」"
1738 = "「Vợ chồng? Là sao ạ――A――Hả!?」"
1742 = "「Vậy thì.」"
1743 = "「Thật tình cờ, em cũng đang nghĩ đến người đó đấy ạ.」"
1745 = "「Tôi hiểu rồi. Tôi sẽ gọi bé Nagi và bé Fukami nhé.」"
1746 = "「Vâng ạ!」"
1748 = "「Vâng, Ngài Soutetsu!」"
1759 = "「Houshou Mototada…… Quả nhiên là nhân vật xứng tầm Chủ tịch ngân hàng Kumagin nhỉ.」"
1764 = "「Cho cả công ty \\x%lエアクラ;#00ffc040;Aircra%l;#; nữa á? Là sao vậy?」"
1765 = "「Ngược lại, phía đối tác lại rất hứng thú. Họ có vẻ như muốn ký kết ngay lập tức luôn ấy.」"
1767 = "「Đúng rồi! Chị Paulette gọi đấy.」"
1768 = "「Dù em còn nhiều thiếu sót―― Nhưng xin ngài, hãy nhận em làm vợ của ngài.」"
1771 = "「Là một cặp chồng và vợ. Kết hôn, xây dựng gia đình, chính là “vợ chồng” đó.」"
1773 = "「Mọi chuyện là vậy đấy. Cảm ơn mọi người. Đi thôi, Hachiroku!」"
1774 = "「Cho dù em có yêu Ngài Soutetsu. Cho dù chúng ta có yêu nhau đi chăng nữa―― Em……Một người như em thì――không thể làm được.」"
1776 = "「Dù biết vậy, tôi vẫn muốn ở bên em. Tôi không thể nghĩ đến ai khác làm vợ mình ngoài em.」"
1788 = "「Trụ trì chùa Yurei đã nói rồi đó. Chữ \"U\" (U uất) trong U linh, nghĩa là \"nhỏ nhoi\"」"
1793 = "「Từ giờ phút này, tôi là chồng của em. Hachiroku――em là vợ của tôi.」"
1802 = "「Sao vậy? Tôi đã nói gì kỳ lạ à?」"
1803 = "「Sao vậy? Hachiroku. Không phải là nếu không chê em. Mà là tôi muốn người đó là em.」"
1805 = "「Chúc mừng hai người. Được chứng kiến cảnh tượng này thì trốn khỏi cuộc họp Giám đốc chi nhánh cũng đáng.」"
1806 = "「Chúc mừng nha!」"
1807 = "「Chúc mừng hai người ạ!!」"
1809 = "「Khi ngài nghĩ về――em sao?」"
1810 = "「Ngài sẽ gọi em bằng cái tên này vào buổi tối đúng không ạ?」"
1812 = "「Em cũng vậy, Ngài Soutetsu. Nếu ngài chấp nhận em làm vợ ngài.」"
1815 = "「Sức lực của chúng ta tuy nhỏ bé. Nhưng dù nhỏ bé, vẫn có những điều chúng ta có thể làm được.」"
1816 = "「Nếu những gì chúng ta để lại được tạo ra như thế, thì đó chắc chắn là những gen hạnh phúc. Bởi vì nếu được kết hôn với em, tôi sẽ trở nên vô cùng hạnh phúc.」"
1818 = "「À, ừm……Tôi chỉ nghĩ thôi. Rằng 『Có lẽ vì vậy chăng』.」"
1820 = "「Thủ tục để tôi và em trở thành vợ chồng.」"
1822 = "「Tôi á?」"
1824 = "「Tôi biết Hachiroku là phụ nữ―― nhưng điều đó có được pháp luật công nhận không?」"
1825 = "「Em yêu Ngài Soutetsu. Cho đến khi thân xác này tàn lụi, em vẫn sẽ ở bên cạnh Ngài Soutetsu.」"
1826 = "「Em là―― Em là, \\x%lレイルロオド;#00ffc040;Railord%l;#;.」"
1830 = "「Em yêu ngài. Hơn bất kỳ ai, hơn bất cứ điều gì.」"
1834 = "「Trông mặt anh như vậy sao?」"
1835 = "「Này, Hachiroku.」"
1838 = "「Hoặc là, khi ai đó nhớ về Ohimitera. Có hình bóng của chúng ta, của 8620 ở đó cũng được.」"
1839 = "「Căn cứ pháp lý để xác định giới tính nữ là sổ hộ khẩu. Nếu trên hộ khẩu là nữ, thì sẽ được công nhận là nữ.」"
1844 = "「Việc xây dựng nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; ở Ohimitera, là để làm cứ điểm mở rộng ra khu vực trung tâm Kyushu……phải không ạ?」"
1846 = "「Vì vậy, em mong muốn...」"
1849 = "「Vậy nên, chỉ còn một việc duy nhất nữa thôi. Chỉ cần giải quyết xong việc đó, thì mặt pháp lý sẽ hoàn toàn rõ ràng.」"
1852 = "「X-xin làm phiền ạ. Dạ.」"
1853 = "「Trao lại gậy tiếp sức cho ai đó. Những gì chúng ta có thể để lại. Ký ức của em và Ngài Soutetsu――những gen di truyền của ký ức.」"
1857 = "「Nếu đã thề, thì quả nhiên nên hiện thực hóa nó nhỉ.」"
1859 = "「Nếu vậy thì――」"
1861 = "「Đúng rồi nhỉ——」"
1863 = "「Ừ. Lúc nào em cũng rất uy nghi. Lại hay cười khúc khích, và tỏa sáng rạng rỡ như tiếng chuông (suzu) vậy.」"
1865 = "「Đúng vậy. Do đó, công ty \\x%lエアクラ;#00ffc040;Aircra%l;#; muốn bán trực tiếp từ nhà máy ra thị trường càng nhiều càng tốt.」"
1869 = "「Đúng vậy. Sau khi kết thúc ca làm việc――Á!」"
1870 = "「Đúng vậy.」"
1872 = "「Ừ, Kisaki coi ông ấy là đối thủ đến mức đó―― À không, mong muốn vượt qua ông ấy cũng là lẽ đương nhiên thôi.」"
1874 = "「Đúng vậy. Chúng ta có thể để lại. Có thể tiếp nối.」"
1875 = "「Vâng. Hachiroku là tên gọi mẫu xe. Nói cách khác, nó giống như là họ vậy ạ.」"
1878 = "「Vâng. Vì thế em…… Đã nghĩ ngài Soutetsu đang đau buồn chuyện gì」"
1879 = "「Vâng」"
1881 = "「Đúng vậy. Tôi cũng nghĩ thế. Nếu anh Soutetsu mà đứng ra tổng hợp thì có khi còn đưa ra được bản kế hoạch tuyệt vời hơn nữa ấy chứ.」"
1883 = "「Vậy sao!」"
1887 = "「Rất sẵn lòng.」"
1891 = "「Đúng là một mũi tên trúng hai đích――không, bản kế hoạch này còn tuyệt vời hơn thế nữa ạ.」"
1895 = "「Ví dụ như, \\x%l列車;#00ffc040;đoàn tàu%l;#; BBQ. Từ nay về sau, chúng ta vẫn sẽ tiếp tục dốc sức vận hành nó đúng không.」"
1901 = "「Không ạ——trông ngài không giống như đang gặp ác mộng, nhưng」"
1902 = "「Không sao đâu. Hachiroku. Tôi nhất định sẽ biến em thành vợ tôi.」"
1903 = "「Không sao, giải quyết xong trước khi làm việc là được. Hỏi Paulette là hiểu ngay thôi.」"
1904 = "「Không sao đâu mà. Bởi vì, bé Hachiroku là phụ nữ mà.」"
1905 = "「Đúng là vậy ạ.」"
1906 = "「Đúng vậy. Nhưng mà lần này thì――」"
1907 = "「Không đâu, gần như là tập hợp cùng lúc đấy.」"
1916 = "「Paulette, rốt cuộc việc đó là gì?」"
1918 = "「Chỉ cần ai đó, dưới bất kỳ hình thức nào, vẫn còn nhớ đến chúng ta. Nếu những ký ức đó vẫn sống mãi trong lòng người đó――」"
1922 = "「Reina, thấy lâng lâng quá đi mất. Trở thành cô dâu thật là tuyệt vời quá nha~」"
1923 = "「Anh không mài giũa á?」"
1925 = "「Sinh con đẻ cái, tiếp nối sinh mệnh là điều quan trọng.」"
1927 = "「Nhanh mà lị! Tụi em từ trên trời rơi xuống á.」"
1928 = "「Đẹp là đương nhiên rồi. Bởi vì đó là cái tên tự nhiên nảy ra trong đầu khi tôi nghĩ về em mà.」"
1929 = "「Tất nhiên, đó là mong muốn của anh rồi」"
1930 = "「Thật đấy. Cặp vợ chồng đẹp đôi nhất Hinomoto luôn.」"
1933 = "「Chúc một ca làm việc tốt lành.」"
1937 = "「T-Tự dưng thấy anh hai, ngầu quá xá.」"
1939 = "「Nghĩa là khi gác lại công việc, chỉ còn lại hai chúng ta, tôi sẽ gọi tên mới――không, cái tên chỉ dành riêng cho tôi gọi.」"
1943 = "「Khi chúng ta được miễn nhiệm, chắc chắn sẽ có \\x%lレイルロオド;#00ffc040;Railord%l;#; và \\x%l機関士;#00ffc040;lái tàu%l;#; khác thay thế chúng ta.」"
1946 = "「Ví dụ như khi đó, chúng ta sẽ truyền lại cho bộ đôi mới, những bí quyết mà chúng ta đã tích lũy được.」"
1952 = "「Cái \"nhỏ nhoi\" đó, có lẽ, anh đã buông bỏ được rồi」"
1953 = "「Sẽ hỗ trợ thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;, đổi lại, thúc đẩy họ tham gia vào công ty cổ phần.」"
1955 = "「Mọi người nói vậy tôi rất vui…… Nhưng thành thật mà nói, mọi người đang đánh giá quá cao tôi rồi.」"
1959 = "「Nếu đây không phải là thị trấn bán nước thì…… việc thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; quả thực là một chính sách chấn hưng xuất sắc.」"
1961 = "「Nếu Đường sắt Mikan tham gia và khôi phục tuyến đường thành công, khả năng hiện thực hóa Kế hoạch SL Đại Kyushu sẽ tăng lên đáng kể đấy ạ.」"
1963 = "「Trừ khi có nhu cầu phát sinh. Nếu hệ thống hiện tại cứ tiếp tục, thì nhu cầu đó cũng sẽ không xuất hiện đâu.」"
1967 = "「Nếu như ngài lấy một \\x%lレイルロオド;#00ffc040;Railord%l;#; như em, làm vợ thì……」"
1970 = "「Bản nháp?」"
1975 = "「Việc muốn lấy Ngài Soutetsu làm tài sản thế chấp, muốn có được ngài, tức là ông ấy đã công nhận năng lực của Ngài Soutetsu đấy ạ.」"
1977 = "「Nhưng mà――tôi nghĩ thế này.」"
1981 = "「Xin hãy đợi đã, Ngài Soutetsu!」"
1982 = "「Cảm ơn mọi người. Đáp lại những lời chúc phúc này, chúng tôi sẽ trở thành một cặp vợ chồng hạnh phúc gấp vạn lần.」"
1983 = "「Em cảm ơn ngài. Một cái tên thật đẹp.」"
1988 = "「Đi thôi, Hachiroku.」"
1989 = "「Michiko?」"
1991 = "「Khi bước ra khỏi nhà giam…… Có lẽ, người ta cũng có cảm giác như thế này」"
2012 = "「Dạ――Ngài định hỏi... Thị trưởng Paulette chuyện gì vậy ạ?」"
2013 = "「Dạ……Nhưng mà. Em là \\x%lレイルロオド;#00ffc040;Railord%l;#; đấy ạ?」"
2015 = "「Chuyện đó, là……ý ngài là sao ạ?」"
2016 = "「Ra là vậy, có lẽ là thế thật nhưng――」"
2017 = "「Có viết ở đây này. Từ trang 8 của tài liệu bổ sung số 2.」"
2018 = "「Điều đó sẽ làm giảm đáng kể rào cản tham gia đối với các công ty khác, và cũng là một thương vụ mang lại lợi ích cho công ty \\x%lエアクラ;#00ffc040;Aircra%l;#;.」"
2020 = "「Tôi đã nghĩ về điều đó rồi. Từ lúc tôi nhận ra―― mình thích em, một tình cảm khác hẳn với mọi người.」"
2021 = "「À ừm……Chị cũng không rõ lắm, nhưng mà―― kiểu như sau khi khoe khoang tình cảm xong mới nhận ra rồi thấy xấu hổ ấy?」"
2022 = "「A, ừm. Có lẽ là vậy nhỉ.」"
2023 = "「Thì chúng ta... đã có thể tiếp nối sinh mệnh rồi nhỉ.」"
2024 = "「Đây là……」"
2025 = "「Nếu vậy thì, cái tên―― Em mong Ngài Soutetsu sẽ đặt cho em.」"
2026 = "「Chắc là do xấu hổ quá nên mới vội vàng bỏ chạy đó mà.」"
2027 = "「Là sao?」"
2028 = "「Mới sáng sớm thế này, không biết ai gọi điện đến vậy nhỉ?」"
2029 = "「Nếu vậy, Michiko……」"
2030 = "「Trời!」"
2031 = "「Là họ tên. Họ và tên. Chỉ cần hai người quyết định được điều đó là xong.」"
2032 = "「Cô ấy bảo tiếp theo sẽ đi đón chị Mayami đó nha.」"
2034 = "「Một người đó, là ai vậy ạ?」"
2038 = "「Vậy thì, em sẽ đi gọi chị Mayami và chị Kisaki.」"
2040 = "「Tất nhiên rồi ạ. Chừng nào em còn ở bên Ngài Soutetsu. Chừng nào chúng ta chưa được miễn nhiệm khỏi vị trí đó.」"
2041 = "「Vậy thì.」"
2042 = "「Nếu vậy, tôi muốn sống vì điều đó. Tôi muốn cùng em, để lại minh chứng cho sự tồn tại của chúng ta.」"
2044 = "「Suzu――」"
2045 = "「Suzu――Suzu.」"
2051 = "「Khoan đã anh hai! Chuyện quan trọng thế này, sao có thể để mỗi tụi em nghe được chứ!」"
2053 = "「Anh hai! Anh hai! Ngầu quá đi mất!!」"
2054 = "「Anh hai, anh dậy chưa?」"
2058 = "「Dù cô đơn, nhưng sẽ nhanh chóng được lấp đầy thôi」"
2059 = "「Nếu nói về tiền bạc, tất nhiên ngân hàng là chuyên gia rồi…… Nhưng ở tầm Chủ tịch thì đúng là khác biệt. Không ngờ ông ấy có thể vẽ ra một bức tranh lớn đến vậy.」"
2060 = "「Mặc dù mới chỉ là bản nháp thôi. Nhưng phía đối tác cũng đã đồng ý với những điểm cơ bản rồi.」"
2061 = "「Dựa vào bản nháp này, hai bên sẽ thảo luận những chi tiết nhỏ hơn đúng không ạ?」"
2062 = "「Anh Soutetsu, bé Hachiroku. Không sao đâu! Hai người hoàn toàn có thể kết hôn hợp pháp!」"
2063 = "「Ngài Soutetsu……」"
2064 = "「Ngài Soutetsu」"
2065 = "「Nè, Ngài Soutetsu.」"
2066 = "「Ngài Soutetsu, ngài đã từng nói với em rồi đúng không? Rằng em hãy 『nói ra mong muốn của mình』 đi.」"
2067 = "「Ngài Soutetsu?」"
2069 = "「Bắt đầu bằng chữ Hina và kết thúc bằng chữ tte, là người thuê tôi và em đấy.」"
2070 = "「Vậy tức là, anh hai và――」"
2074 = "「Đầu tiên, tiền đề lớn nhất mà Bộ luật Dân sự quy định là, hôn nhân chỉ được thành lập dựa trên sự đồng thuận của cả hai giới.」"
2075 = "「!」"
2076 = "「!!!」"
2077 = "「!!?」"
2078 = "「~」"
2084 = "『「Hả!?」\\n「Cái gì!?」』"
2088 = "『「!!?」\\n「!!?」』"
2248 = "Mới sáng sớm mà——dù khiến tôi có chút bất an, nhưng đó là một nụ hôn dài, cuồng nhiệt, ngọt ngào, làm tan chảy cả tâm trí."
2250 = "Âm thanh quen thuộc. Âm thanh của quá khứ."
2252 = "Có lẽ đây là lần cuối cùng được nhìn thấy nơi này…… Khi nghĩ vậy, một cảm xúc kỳ lạ trào dâng."
2254 = "Lần này, ánh mắt của họ lại chuyển dời như thể đang dò xét lẫn nhau. Rồi không hiểu sao, cả ba người cùng gật đầu với nhau."
2257 = "Không ổn rồi, đến giờ rồi. Nếu không nhóm \\x%lカマ;#00ffc040;lò hơi%l;#; bây giờ thì sẽ không chạy được mất."
2260 = "Dù thế nào đi nữa, cũng giống nhau cả thôi. Những thứ đã buông tay, dù dần dần, chắc chắn sẽ biến thành những kỷ niệm."
2264 = "Nhưng dù mọi chuyện có diễn biến thế nào, điều tôi cần làm vẫn không thay đổi."
2265 = "Nhưng mà, tôi biết rõ."
2266 = "Nhưng, bàn tay đang nhẹ nhàng lay tôi, lại mang một cảm giác vô cùng chân thực."
2271 = "Để hòa quyện quỹ đạo của chúng tôi, vào biết bao nhiêu ký ức của những chuyến đi."
2273 = "Bây giờ thì tôi đã hiểu. Tại sao tôi lại mong muốn điều đó."
2279 = "Hôm nay, từ giờ phút này sẽ là bước đi đầu tiên. Để vợ chồng chúng tôi trao gửi những gen di truyền của ký ức."
2286 = "Sinh mệnh mà họ đã gửi gắm cho tôi, đương nhiên tôi cũng nên tiếp nối nó cho những đứa trẻ của mình."
2287 = "Việc xưng tên bằng tên gọi mẫu xe, chính là niềm tự hào của đầu máy số hiệu đầu tiên."
2294 = "Từ kiến thức và thông tin nền tảng, cho đến khả năng thu thập chúng, giữa ông Houshou và tôi có một khoảng cách lớn đến mức không thể so sánh được."
2316 = "Dù vậy―― Cơn tuyết của niềm vui sướng vẫn không ngừng rơi."
2318 = "Bến tàu xuôi dòng Kumagawa là nơi xa nhất tính từ đây. Cô ấy đến đó đón trước, tiếp theo là xưởng ủ rượu."
2321 = "Mặc dù được viết như vậy, nhưng――"
2322 = "Những giọng nói đầy kinh ngạc."
2325 = "Ánh mắt của Hachiroku, Hibiki và Paulette, đều hướng về phía khuôn mặt tôi."
2327 = "Và cái gật đầu của Hachiroku, đã mang lại màu sắc và sự ấm áp cho tương lai mà tôi đang tưởng tượng."
2329 = "Giống như tôi, Hachiroku chắc cũng đã quên mất sự hiện diện của mọi người."
2330 = "Hachiroku, ngoan ngoãn tựa vào người tôi."
2333 = "Toàn thân Hachiroku run rẩy. Không thể thốt nên lời nào nữa."
2335 = "Đôi tay vừa buông ra, lại đưa về phía trước. Hachiroku vươn tay về phía tôi."
2339 = "Trong vòng tay ôm chặt của tôi, Hachiroku ngước lên với đôi mắt kinh ngạc."
2341 = "Nếu là Hachiroku thì chắc chắn em ấy sẽ hiểu. Tôi biết rõ điều đó."
2343 = "Bàn tay Hachiroku tràn đầy sức lực."
2345 = "Cô ấy gật đầu lia lịa như một cỗ máy hỏng, nhưng rồi đột nhiên dừng bặt."
2347 = "Em nhẩm đi nhẩm lại. Hachiroku gọi cái tên mới mà tôi đặt cho em với vẻ đầy hạnh phúc."
2349 = "Cắt ngang lời tôi, Hachiroku lắc đầu nguầy nguậy."
2354 = "Bàn tay Hachiroku nắm lấy vạt áo sơ mi của tôi."
2356 = "Chớp chớp mắt."
2357 = "Hachiroku suy nghĩ sâu sắc hơn tôi nhiều. Em ấy biết rõ."
2359 = "Một giọng nói đầy đau khổ."
2360 = "Giọng nói của Hachiroku chùng xuống."
2362 = "Hachiroku không còn run rẩy nữa."
2363 = "Sự bướng bỉnh trong ánh mắt Hachiroku bắt đầu nhạt dần."
2365 = "Đôi mắt em ánh lên nét tinh nghịch."
2368 = "Hachiroku mở to hai mắt――!?"
2369 = "Hachiroku ngơ ngác, cứng đờ người lại."
2372 = "Không phải bằng lời nói, mà bằng một nụ hôn. Hachiroku, đã đáp lại tôi."
2373 = "Hachiroku mím chặt môi."
2375 = "Nghe tôi trả lời, cô ấy bật cười khúc khích tinh nghịch."
2378 = "Quả nhiên là vậy, Hachiroku nở nụ cười vui vẻ."
2379 = "Hachiroku nở nụ cười như để xoa dịu."
2381 = "Hachiroku giật thót mình, khuôn mặt lộ vẻ căng thẳng."
2382 = "Bàn tay Hachiroku khẽ níu lấy tôi, nhưng rồi ngay lập tức nhẹ nhàng buông ra."
2383 = "Em mỉm cười nhẹ nhàng."
2384 = "Một cái gật đầu khe khẽ. Trông thật hạnh phúc."
2388 = "Bàn tay Hachiroku, lặng lẽ lướt đi."
2389 = "Hachiroku gật đầu, rồi kiểm tra lại xấp giấy trên tay."
2396 = "Bình tĩnh lại thì tôi vẫn chưa, nhận được câu trả lời từ Hachiroku."
2406 = "Ngay cả trong lúc này mà cô ấy vẫn không bị cuốn theo không khí, vẫn cẩn thận tìm hiểu những gì tôi đã hỏi sao."
2416 = "Khi tôi hỏi lại, ánh mắt họ lại đảo quanh."
2419 = "Chỉ để lưu lại gen di truyền của bản thân―― Nếu sinh con chỉ vì mục đích sinh con, thì đó là một điều bất hạnh."
2420 = "Chỉ cần tôi không bị phân tâm, kiên định, và tiếp tục nhìn về phía Hachiroku là được."
2425 = "À, nếu vậy thì――Cũng không cần phải vội vàng. Chính vì là chuyện quan trọng nên mới cần bình tâm lại để giải quyết."
2428 = "Khi giao xe \\x%lエアクラ;#00ffc040;Aircra%l;#; mới cho khách hàng, tất nhiên là không thể để xe tự chạy đến được."
2432 = "Cảm nhận được điều đó, tôi mở mắt ra, lại thấy mình đang ở trong giấc mơ quen thuộc."
2434 = "Một khi có thể cùng tồn tại với \\x%lエアクラ;#00ffc040;Aircra%l;#;, đường sắt chắc chắn sẽ phục hưng, và chúng ta sẽ làm cho điều đó xảy ra."
2440 = "Em ấy ôm chặt lấy tôi, truyền cho tôi hơi ấm từ cơ thể em."
2442 = "Giống như một đứa trẻ nhỏ, dựa dẫm và bám víu lấy tôi."
2444 = "Em buông tay ra, hơi lùi lại một chút―― và nhìn tôi bằng một ánh mắt kiên định."
2446 = "Ngày “được miễn nhiệm” đó chắc chắn, sớm muộn gì cũng sẽ đến."
2448 = "Đôi má Hachiroku ửng hồng, miệng há hốc ra, rồi lại vội vàng ngậm chặt lại."
2450 = "Tôi có cảm giác mình đã hiểu được điều gì đang làm Hachiroku đau khổ ――Dù có hiểu lầm cũng không sao, tôi vòng tay ôm trọn lấy cô ấy."
2452 = "Chuyện đó, tôi biết rõ rồi mà."
2454 = "Tựa như tuyết trắng không ngừng rơi xuống―― Thấm đẫm vào trái tim tôi bằng một âm thanh tĩnh lặng."
2456 = "Giọng nói đầy nhẹ nhõm."
2458 = "Không thèm để ý đến tiếng gọi của tôi, Hibiki và Paulette mỗi người bắt đầu lấy điện thoại ra gọi."
2459 = "Giống như đang ép bản thân phải thốt ra, những lời mà chính mình cũng không muốn nói."
2470 = "Thật đáng tin cậy. Paulette trông như đang tỏa sáng lấp lánh vậy."
2471 = "Quả thực là lịch trình làm việc rất ổn định, nhưng mà――"
2474 = "Người ta thường nói việc gì ra việc nấy…… Không, đây chính xác là công việc của những người chuyên nghiệp."
2476 = "Nên làm thế, tôi muốn làm thế. Suy nghĩ ấy lập tức hóa thành lời nói trào ra."
2480 = "Hơn nữa――"
2500 = "Có gập hết mười ngón tay lại chắc cũng không đếm xuể. Houshou Mototada đã lập ra một bản kế hoạch như vậy đấy."
2502 = "Đối với đứa trẻ đó, hay đối với bất kỳ ai, có lẽ đều là như vậy. Nhưng……"
2504 = "Giọng nói dịu dàng. Không thấy bóng dáng đâu."
2507 = "Tôi phải nuốt hơi thở, nuốt những lời định nói vào trong."
2509 = "Vì thế, tôi tỉnh giấc. Một lần nữa."
2511 = "Cây cầu đó—— Chúng tôi đã, vượt qua rồi."
2512 = "Dù tôi muốn bình tĩnh hỏi chuyện hơn một chút, nhưng mà thôi, đã đến nước này rồi thì cứ quyết tâm vậy."
2516 = "Tôi biết chứ. Bởi vì chúng tôi đã trao lời thề cho nhau rồi mà."
2518 = "Cảnh tượng mà tôi hằng mơ ước, chắc chắn Hachiroku cũng đã nhìn thấy."
2521 = "Mong muốn của tôi, chỉ là được sát cánh cùng Hachiroku chạy trên đường ray với tư cách là \\x%l機関士;#00ffc040;lái tàu%l;#; thêm một ngày nào hay ngày đó."
2524 = "Tôi nắm lấy bàn tay ấy. Và tự nhiên đặt lên đó một nụ hôn."
2525 = "Tôi chủ động đưa ra câu trả lời, để dập tắt những tiếng xì xào xung quanh."
2528 = "Vừa nghĩ sao thiếu mất một người――thì ngay lập tức, tôi đã nhận được lời chúc phúc đậm chất Paulette."
2531 = "Tôi nhìn quanh một vòng trong \\x%l客車;#00ffc040;toa hành khách%l;#;. Dù vậy, tôi không còn cảm thấy đau đớn nữa."
2533 = "Khoảnh khắc tôi thốt lên lời cảm thán chân thành, mọi ánh nhìn đều đổ dồn về phía tôi."
2535 = "Trái tim tôi trở nên tươi sáng và ấm áp. Bàn tay nhận lấy ống nghe cũng tự nhiên tràn đầy sức lực."
2536 = "Tôi hoàn toàn quên mất. Đã hoàn toàn chìm đắm vào thế giới của hai người, nhưng mà――"
2539 = "Nhổm người dậy trên tấm nệm, tôi ôm trọn Hachiroku vào lòng."
2540 = "Hoặc là lấy Hachiroku làm nhân tình, rồi cưới một người vợ chính thức. Liệu điều đó có thực sự là tiếp nối sinh mệnh của tôi một cách đúng đắn không?"
2548 = "Từ khóe mắt đến gò má một cách chậm rãi, như đang vẽ lại đường nét khuôn mặt."
2550 = "Đã buông bỏ được rồi sao—— Hay là, đã bị buông bỏ."
2554 = "Thật đáng yêu, thật dũng cảm, thật đáng mến. Tiếng xì xào phía sau lưng biến mất trong nháy mắt."
2556 = "Đến nhà ga cuối cùng, và sau đó. Michiko chắc chắn. ——Chắc chắn sẽ cùng với bố, và mẹ——"
2565 = "Hibiki và Paulette, cả hai cùng nhìn về phía Hachiroku."
2567 = "Đúng vậy, trên con đường chúng ta bước đi――"
2568 = "Tôi và Hachiroku đã đưa nó đến đích."
2570 = "Đó có vẻ cũng là một trong những chiến lược kinh doanh cơ bản của công ty \\x%lエアクラ;#00ffc040;Aircra%l;#;."
2575 = "Khoảnh khắc nhổm người dậy, tôi đã hiểu ra."
2579 = "Những tiếng trêu chọc chính là lời chúc phúc, khi đắm mình trong đó, niềm hạnh phúc lại dâng trào lên gấp bội――"
2580 = "Quả thực ở đây cũng có một người chuyên nghiệp, tôi có cảm giác như muốn phủ phục xuống bái lạy cô ấy luôn."
2581 = "Câu trả lời được đưa ra không chút do dự. Niềm vui sướng, tuy nhiên, lại vô cùng tĩnh lặng."
2592 = "Tôi giải thích cho con bé rằng đó là bản thảo hợp đồng――giống như một bản thiết kế sơ bộ vậy."
2593 = "Paulette và Hibiki tròn xoe mắt, nhìn nhau, rồi lại nhìn tôi chằm chằm."
2594 = "Paulette chỉ vào những dòng chữ nhỏ li ti, trên cuốn sách dày cộp."
2595 = "Trong giọng nói của Paulette hiện rõ sự thán phục."
2596 = "Cho đến gần đây cô ấy vẫn là thị trưởng, tức là một chính trị gia. Chắc chắn cô ấy am hiểu về luật pháp hơn chúng tôi rất nhiều."
2600 = "Hachiroku đứng chết trân với vẻ mặt bối rối."
2603 = "Thế nhưng Hachiroku lại truyền đạt sự thật hiển nhiên ấy cho tôi, với một sự nặng nề nghiêm trọng như thể đang thú tội."
2604 = "Nhưng, chẳng thấy đâu cả. Hình bóng Michiko, người đáng lẽ phải ngồi ở ghế đối diện."
2606 = "Nhưng nếu không bị cách ly, không được bảo vệ—— Chắc chắn tôi đã không thể sống một cách bình thường ở thế giới bên ngoài."
2609 = "Cha, mẹ, và cả Michiko nữa――"
2612 = "Dù không hề trao đổi ánh mắt, nhưng tôi và Hachiroku lại cúi đầu cảm ơn cùng một lúc."
2632 = "Nhận được những lời chúc phúc dồn dập và nồng nhiệt, mặt em ấy đỏ bừng lên như con bạch tuộc luộc vậy."
2636 = "Tóm lại là, để tiết kiệm thời gian."
2643 = "Vì có nguy cơ sụp đổ do cộng hưởng, nên cũng không thể dùng \\x%lエアクラ;#00ffc040;Aircra%l;#; để vận chuyển \\x%lエアクラ;#00ffc040;Aircra%l;#;."
2647 = "Ngay cả công nghệ chế tạo \\x%lレイルロオド;#00ffc040;Railord%l;#; hiện đang trên bờ vực thất truyền, chắc chắn sẽ lại có nhu cầu, được kế thừa và phát triển."
2651 = "Và trong sự im lặng vừa chớm nở, tôi suy nghĩ――ngay lập tức, một cái tên vang lên lanh lảnh."
2652 = "Và rồi Hachiroku, ngước nhìn tôi với đôi mắt ướt đẫm."
2654 = "Bản kế hoạch này được lập ra xuất sắc đến mức đó đấy."
2655 = "Nghe những lời của Paulette, Hibiki ngẩng mặt lên, nhìn lại tài liệu trên tay một lần nữa, rồi từ từ gật đầu mạnh một cái."
2658 = "Một giọng nói thong thả bất ngờ vang lên từ phía sau."
2665 = "Và nếu là ngân hàng gần nhất, thì dù không cần đi đón――"
2668 = "Nếu chị Mayami không đưa tay ra giúp đỡ, thì có lẽ tôi đã chấp nhận điều kiện đó rồi."
2671 = "Nếu vì lý do đó mà tôi từ bỏ Hachiroku, và sinh con với một người phụ nữ mà tôi không yêu."
2673 = "Nếu có thể khôi phục tuyến đường, khu vực ngoại ô ga Sendai ở tỉnh Kagoshima, nơi sẽ trở thành ga trung chuyển giữa Đường sắt Mikan và tuyến Yui――"
2675 = "Quả thực là thấy bị làm phiền――"
2681 = "Cảm giác bực bội vì bị điện thoại làm phiền, đã bị cuốn trôi sạch sẽ."
2688 = "Khoảnh khắc tôi nói ra, mặt Hachiroku đỏ bừng lên."
2689 = "Nhận được cái gật đầu, cuối cùng tôi cũng có ý định thừa nhận."
2692 = "Có lẽ chúng tôi sẽ bị trêu chọc, và biết đâu còn có những chuyện rắc rối hơn nữa."
2693 = "Có chuyện đó. Nhắc mới nhớ, đúng là có."
2698 = "Thậm chí, ngược lại……"
2709 = "Đó là lời thề―― Khoảnh khắc nghĩ vậy, tôi chợt nảy ra một ý."
2710 = "Cảm giác này, quả nhiên là sự cô đơn. Nhưng không hề u ám, mà là một sự cô đơn trong trẻo, quang đãng."
2711 = "Nên làm gì đây. Tôi nhận ra mình đã nhầm lẫn thứ tự."
2712 = "Vì môi trường đó gần như đã được chuẩn bị sẵn sàng, nên tôi chỉ muốn tập trung làm hết sức mình trong môi trường đó thôi."
2713 = "Khi sự bướng bỉnh ấy nhạt đi, tôi nhận ra có lẽ đó chính là nỗi sợ hãi."
2714 = "Lần này, tôi đã thực sự tỉnh lại từ giấc mơ mà dù đã mở mắt vẫn còn nhìn thấy."
2715 = "Nơi này, đã từng giam cầm tôi. Là nơi cách ly tôi với thế giới bên ngoài."
2716 = "Đây là lần đầu tiên tôi đọc Bộ luật Dân sự―― Nhưng quả thực, nó được viết chính xác như những gì Paulette đã nói."
2717 = "Đang tiến vào sân ga. \\x%l列車;#00ffc040;Chuyến tàu%l;#; này, đã đến nhà ga cuối cùng."
2720 = "Bàn tay đang lay tôi dừng lại, và dịu dàng vuốt ve mái tóc tôi."
2724 = "Tiếng bước chân lạch cạch. Cách một lớp cửa kéo, tôi nghe thấy tiếng thở vui vẻ của Hibiki."
2725 = "Dù biết đó là những lời chúc phúc mang tính trêu chọc, nhưng bị chỉ ra là đang xấu hổ thì vẫn thấy ngượng ngùng."
2726 = "Tôi hơi bối rối vì sợ bị hiểu nhầm sang ý khác, nhưng Paulette thì hoàn toàn không bận tâm."
2733 = "Là tiếng điện thoại. Sao lại đúng vào lúc này cơ chứ."
2739 = "Những lời nói khẽ run rẩy, dường như cũng ướt đẫm."
2745 = "（……Mình làm em ấy bất an rồi sao.）"
2754 = "（Xoạch!）"
2755 = "（Cạch, cộc, xình, xịch——）"
2756 = "（Reng reng reng reng　Reng reng reng reng）"
2757 = "（Chọc chọc）"
2760 = "（Nước mắt!? Tại sao, em ấy lại khóc chứ?）"
2761 = "（Khoan đã――ủa?）"

[selections]
