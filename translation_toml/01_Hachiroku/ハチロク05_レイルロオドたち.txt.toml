[script]
1667 = "（——Dù vậy, tôi cũng không thể im lặng.）"
1669 = "――Tôi không thốt nên lời ngay được.\\nNhững gì Olivy nói, là sự thật."
1671 = "（——Đưa cô ấy đến nhà tắm Tororyu-yu càng sớm càng tốt.\\nChỉ có cách đó thôi.）"
1672 = "――Tôi không còn nghĩ đó chỉ là vấn đề thứ tự đơn thuần nữa."
1682 = "\"Nếu không quyết định được thì để anh quyết định\"――\\nBởi tôi chợt nhận ra câu nói lúc nãy của mình cũng thật ngạo mạn."
1684 = "\"Tôi không nghĩ nó sẽ thay đổi vì chuyện như vậy\"――những lời\\nđã đến tận cổ họng đành phải nuốt ngược vào trong."
1687 = "Vế sau của từ \"Nên\" khá là bất ngờ.\\nĐến mức tôi không kìm được phải hỏi lại."
1694 = "……Ra vậy, có lẽ Olivy,\\nđang đặt bản thân mình vào vị trí của Fukami."
1702 = "……Thông qua Reina, tôi tưởng chúng tôi đã quen với việc\\nngoại hình và nội tâm không đồng nhất rồi chứ."
1705 = "……Quả thực, trên đường về tôi cũng mải mê nói chuyện với Hachiroku suốt."
1711 = "「Phía \\x%l客車;#00ffc040;toa hành khách%l;#; đại khái là như vậy, không có vấn đề gì――\\nCòn phía đầu máy thì sao?」"
1712 = "「Bên \\x%l客車;#00ffc040;toa hành khách%l;#; có chuyện gì không?」"
1714 = "「\\x%l車掌;#00ffc040;Trưởng tàu%l;#;」"
1718 = "「——Cả Hachiroku cũng vậy sao?」"
1720 = "「――Giả sử môi trường có thay đổi, thì trong môi trường mới đó,\\nchỉ cần cố gắng hết sức để tạo ra một không gian thoải mái là được.」"
1728 = "「'Cần kiểm tra vật liệu nối tà vẹt', 'Có dấu hiệu hụt đất nhỏ',\\n'Khuyến nghị dùng tấm đệm lót thay đổi'……Đây là thuật ngữ chuyên ngành của \\x%l保線;#00ffc040;bảo trì đường ray%l;#; nhỉ.」"
1733 = "「…………Olivy」"
1734 = "「…………」"
1743 = "「……Từng bước một, từ từ,\\nxác định xem mình có tố chất không, có làm được hay không sao.」"
1746 = "「……Chỉ vì bản thân mình làm được,\\nmà lại quy chụp những người không làm thế là đi đường vòng thì――」"
1749 = "「……Vì không thích như vậy,\\nnên Fukami mới giữ bí mật đó.」"
1750 = "「……Thì sao?」"
1753 = "「……Là chuyện khó nói sao?」"
1758 = "「……Thích thật đấy, anh Soutetsu vừa giàu có, vừa là chủ tàu.\\n\\x%l機関士;#00ffc040;Lái tàu%l;#; bình thường, làm sao mà trở thành chủ tàu được chứ.」"
1762 = "「……Nếu Nagi không làm quen được,\\nthì vẫn có thể để \\x%l機関士;#00ffc040;lái tàu%l;#; Migita Hibiki chạy thương mại chứ?」"
2225 = "「Tinh tế. Em chỉ có thể nghĩ đến từ đó.\\nTỉ mỉ, chu đáo và không bỏ sót bất cứ điều gì.」"
2227 = "「Phê bình sắc sảo?」"
2229 = "「Không——」"
2230 = "「Tôi là giám đốc kiêm thị trưởng nhiệm kỳ thứ 3 rồi mà!\\nCó lẽ đây chính là vai trò của tôi đấy.」"
2233 = "「Trước tiên, cho anh nghe nhận xét của Hachiroku được không?\\nAnh cũng muốn nghe.」"
2235 = "「Như vậy――rốt cuộc là sao?」"
2236 = "「Biết chứ! Mấy chuyện đó!!\\nMunakata cũng từng nói rồi mà!」"
2239 = "「Đằng nào thì \\x%l機関士;#00ffc040;lái tàu%l;#; nào cũng phải chạy thử,\\nquyết định giao phó nhóm đầu tiên cho Olivy cũng là hợp lý thôi.」"
2240 = "「Đừng làm vậy!」"
2242 = "「Cứ dội đi ạ, em ướt cũng không sao đâu!」"
2244 = "「Không, chuyện đó người ngoài không nên can thiệp vào đâu.\\nHai người cũng vừa đồng thanh nói Olivy là người lớn rồi cơ mà.」"
2245 = "「Môi trường tốt à~」"
2247 = "「Không, cái đó――tôi nghĩ nếu cứ làm việc quần quật,\\nthì dù là \\x%lレイルロオド;#00ffc040;Railord%l;#; cũng sẽ bị hao mòn――」"
2252 = "「Không, cuối cùng Olivy chỉ chọn\\nmột cách duy nhất là 'rút thăm' thôi.」"
2254 = "「Không, chở đi sẽ nhanh hơn. Navi!!」"
2257 = "「Xin lỗi đã để mọi người đợi lâu!」"
2259 = "「Việc kiểm tra Đầu máy số 9\\ntừ phía em đã hoàn tất rồi ạ.」"
2260 = "「Việc Hachiroku và 8620 chạy trên Tuyến Yui,\\nđã được Olivy tái hiện lại y nguyên bằng Đầu máy số 9 sao?」"
2262 = "「Anh nghĩ cũng không đến mức phải xin lỗi đâu.」"
2267 = "「っ!!?」"
2270 = "「Chuyến chạy thử Đầu máy số 9 trên Tuyến Yui hôm nay.\\nĐược thực hiện với đội hình \\x%l機関士;#00ffc040;lái tàu%l;#; Migita Hibiki, \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; Minokasa Nagi ạ.」"
2279 = "「Anh ấy nói 'Mong các cậu hãy để chúng chạy trên tuyến chính'.\\nCả Đầu máy số 9 và Olivy.」"
2286 = "「Nhưng, Fukami thì không nghĩ thế đâu!\\nNên dù có phải đi đường vòng! Cậu ấy vẫn cố gắng bằng cách của mình!」"
2287 = "「Nói đúng hơn là. Hoàn toàn không thay đổi cũng chán lắm đúng không?\\nCứ như……bị bảo là \"không cần thiết\" vậy.」"
2291 = "「Mọi người xem cái này đi.\\nBé Olivy bảo 'Chỉ là những thứ đơn giản thôi'.」"
2293 = "「Thế thì tốt rồi.」"
2294 = "「Quả thực là anh không còn mặt mũi nào. Xin lỗi em.」"
2296 = "「Anh đánh giá là có thể bắt đầu được.\\nNếu là 3 tuần nữa, thì gần như chắc chắn.」"
2299 = "「Anh Soutetsu đã thực sự, thực sự nghiêm túc nghĩ đến chuyện...\\nnếu Hachiroku ngừng hoạt động chưa?」"
2311 = "「Lúc nào cũng vậy! Ở Minobu cũng thế, ở Tsurumi cũng thế!\\n——Cứ tưởng Đường sắt Mikan sẽ khác, vậy mà!」"
2313 = "「Đừng bênh vực, Hachiroku.\\nOlivy người lớn hơn chúng ta nhiều đấy.」"
2315 = "「Sau khi Hachiroku ngừng hoạt động. Chuyện sau đó,\\nanh Soutetsu đã suy nghĩ và chuẩn bị chưa?」"
2316 = "「Hachiroku thích thật đấy. Dù Ohitoyo không cần nữa,\\nthì vẫn có thể cùng Master——cùng anh Soutetsu chuyển đi nơi khác mà.」"
2319 = "「Tôi cũng đã vội tra cứu những cái khác rồi. Vật liệu nối tà vẹt là tấm sắt nối các thanh tà vẹt lại với nhau.」"
2322 = "「\"Đệm lót có thể điều chỉnh\" đúng không? Nó cũng giống vậy thôi.\\nChắc chắn sẽ có những thứ ra đời vì sự hao mòn do Đại bãi bỏ các tuyến đường sắt gây ra.」"
2323 = "「Từ trước đến nay, chúng ta cũng vậy mà.\\nChẳng phải chúng ta đã đi đến tận đây theo cách đó sao.」"
2325 = "「Nagi tuy hấp tấp nhưng có năng khiếu, nên có vẻ học hỏi nhanh lắm!\\nThể lực cũng xuất sắc, nếu chỉ trong khoảnh khắc thì độ tập trung có khi còn hơn cả Hibiki nữa.」"
2330 = "「Thôi thôi thôi đừng có làm thế mà!」"
2333 = "「Tập kiếm thuật? Là gì dạ?\\nOlivy hổng biết mấy cái đó đâu, cũng hổng có đi chơi chung luôn á?」"
2336 = "「Nhìn từ bên ngoài――ra vậy,\\nchúng tôi trông như những tồn tại như thế sao.」"
2337 = "「Ra vậy, quả đúng là kiến thức mới nhất nhỉ. Olivy,\\ndù đã 100 tuổi nhưng vẫn luôn học hỏi những điều mới mẻ sao.」"
2361 = "「Chỉ là, có vẻ khó mà sử dụng nguyên xi \\x%l客車;#00ffc040;toa hành khách%l;#;\\nmà Đầu máy số 9 kéo về cho tuyến Ohito - Hayato được.」"
2363 = "「Vâng. Ngay sau đó tôi đã nhận được yêu cầu dưới dạng báo cáo.\\nNgoài ra, còn có vài báo cáo về những điểm đáng lo ngại trên tuyến đường sắt nữa.」"
2365 = "「Đúng vậy nhỉ.」"
2367 = "「Nhưng mà……ra vậy. Về các loại biển báo,\\nOlivy đã kiểm tra giúp rồi sao.」"
2371 = "「Nhưng mà nhé? Đầu máy số 9 không thể chạy với vận tốc 80km/h.\\nVậy thì, chỉ còn cách chạy với tốc độ tối đa có thể thôi.」"
2372 = "「Nhưng mà, thứ lỗi cho em, thưa ngài Soutetsu.\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; là vật tư tiêu hao, là linh kiện bảo đảm an toàn ạ.」"
2374 = "「Tuy nhiên, nếu coi như đồng nghiệp cùng nơi làm việc thì cũng đâu có gì lạ.\\nNgười hiểu rõ nhất về Đầu máy số 9 là Olivy mà.」"
2377 = "「Chuyện đó……\\nTại sao em ấy lại không nghĩ như vậy?」"
2379 = "「Ngạc nhiên……\\nTrong cuộc nói chuyện vừa rồi có yếu tố nào đáng để ngạc nhiên sao?」"
2382 = "「っ!」"
2384 = "「Hô.」"
2385 = "「!?」"
2387 = "「Hê~, ra là vậy à~」"
2388 = "「Hả?」"
2391 = "「Hả? Thì với tư cách là \\x%l車掌;#00ffc040;trưởng tàu%l;#; tập sự chứ sao?」"
2394 = "「Ủa? Cầu số 4 sông Kuma cũng được đánh dấu này.」"
2396 = "「Ôi! Đã có thứ tiện lợi như vậy rồi sao?」"
2397 = "「Oa! Khoan khoan khoan! Hoạt động 100 năm nay\\nđây là lần đầu tiên được trải nghiệm chuyện này, nên Olivy muốn tự quyết định!」"
2399 = "「Hở!?」"
2401 = "「Ể~? Rõ ràng là Soutetsu bảo làm mà,\\nlại còn quên nữa chứ! Thế có quá đáng lắm không hả?」"
2402 = "「Hừm~?」"
2403 = "「Hòa~」"
2404 = "「!」"
2405 = "「Hả!?」"
2406 = "「Cũng không đến mức đó đâu.」"
2409 = "「Hừm――cái này, là――」"
2410 = "「Hử?」"
2411 = "「A~」"
2413 = "「A~. Hachiroku cũng thấy vậy sao~」"
2414 = "「A――\\nCó lẽ em hiểu rồi ạ.」"
2417 = "「A――Đúng vậy ạ.\\nĐó mới chính là hình bóng đích thực của ngài Soutetsu.」"
2419 = "「À――ra vậy. Nhắc mới nhớ đúng là thế.」"
2420 = "「À……」"
2422 = "「À……nghe cô nói mới nhớ, hình như cũng có thứ đó――\\nthì phải.」"
2423 = "「A.」"
2426 = "「A ha... ha, tuyệt quá. Anh Soutetsu tuyệt quá!\\nTuyệt hơn——những gì Olivy nghĩ rất nhiều!」"
2427 = "「A ha」"
2428 = "「A ư~――Chuyện là vầy nè? Fukami á?\\nNói là ghen tị với bọn Nagi á.」"
2429 = "「À!」"
2431 = "「A!」\\n「A ư, đúng là vậy nhỉ, xin lỗi anh.」"
2435 = "「A! Là gia cố thêm biển báo, biển chỉ dẫn cho buồng lái bên phải đúng không?\\nChuyện đó, bé Olivy cũng đã yêu cầu rồi.」"
2436 = "「À! Ra vậy, là lúc đi bộ khảo sát đường ray sao.」"
2437 = "「Aaa!!!」"
2439 = "「!!!?」\\n「Gì vậy!?」"
2442 = "「!!?」"
2443 = "「!?」"
2444 = "「Hả!?」\\n「Hả!?」"
2446 = "「À, đúng rồi nhỉ.」"
2448 = "「À, đúng rồi.」"
2449 = "「Ừ, vì tôi cảm thấy đây là một chủ đề nhạy cảm,\\nnên vẫn đang canh thời điểm để nói.」"
2451 = "「A, Reina. Chị cũng phụ một tay.」"
2455 = "「A, chuyện đó hả.\\nVề chuyện đó ấy, Đường sắt Ohito lạ thật đấy~」"
2456 = "「À, đúng thật.」"
2458 = "「À, không. Chuyện đó thì cứ từ từ cũng được.\\nVì còn liên quan đến hợp đồng với Đường sắt Mikan nữa.」"
2459 = "「っ! Anh Soutetsu cũng giống Hachiroku thôi!\\nLàm sao mà hiểu được cảm giác của bọn Olivy chứ.」"
2461 = "「Hừm――với khoảng thời gian đó,\\nthì trước tiên Hibiki sẽ làm quen được với buồng lái――nhỉ?」"
2463 = "「Ừm. Cho đến khi mẹ Fukami quay lại làm việc,\\nem ấy vừa là người chèo thuyền vừa là người quản lý thuyền xuôi dòng sông Kuma――nhà mẹ đẻ của em ấy.」"
2464 = "「Ừm.」"
2465 = "「Vâng!」"
2466 = "「Hừm――nghĩa là có sự lồi lõm siêu nhỏ\\ntrên đường ray, \\x%l枕木;#00ffc040;tà vẹt%l;#; hoặc thép bên dưới sao.」"
2471 = "「Ừm, Hachiroku, Olivy.」"
2473 = "「Ừm. Ở Ohito có cả kỹ sư Railord,\\nvà ở Jutsusen cũng có nhà máy chế tạo toa xe nữa nên――」"
2475 = "「À, tôi cũng cảm thấy vậy.」"
2476 = "「Không, không có gì đâu.\\nChỉ là――anh hơi thẫn thờ một chút thôi.」"
2479 = "「Ừm. Bị nói thẳng thừng luôn.\\n'Kẻ chạy được mà bảo kẻ không chạy được chạy đi, thật là ngạo mạn'.」"
2480 = "「Ừm. Đúng vậy, chắc chắn ở đâu đó đã có người bắt đầu nghiên cứu chuyện này rồi\\n——Nếu không thì thật vô lý.」"
2482 = "「Ừ. Cảm ơn em.\\nAnh đã học được một bài học vô cùng to lớn từ cô giáo Olivy đấy.」"
2484 = "「Ừm. Là vấn đề về tầm nhìn quan sát. Các loại biển báo, biển chỉ dẫn trên Tuyến Yui,\\nđều được lắp đặt dựa trên giả định buồng lái nằm bên trái――」"
2486 = "「Hửm?」"
2487 = "「Ufufu, đúng vậy nha~」"
2489 = "「Ufufu, cảm ơn chị. Bé Olivy.」"
2491 = "「Hô hô.」"
2492 = "「Hô.」"
2496 = "「Vẫn là \\x%lストーブ客車;#00ffc040;toa xe sưởi ấm%l;#; như mọi khi nên hoàn toàn không có vấn đề gì.\\nBác Fuchi bảo cảm giác khi ngồi cũng không thấy có gì thay đổi đặc biệt.」"
2498 = "「Vì chúng ta phụ thuộc vào tình nguyện viên mà……\\nQuả nhiên vẫn có sự khác biệt so với góc nhìn của chuyên gia.」"
2499 = "「Ở Đường sắt Mikan cũng được bắt cặp với Munakata suốt, thấy an tâm lắm.\\nNên dù chỉ làm công việc \\x%l入換;#00ffc040;dồn toa%l;#;, Olivy cũng thấy vui mà——」"
2506 = "「Bằng cách riêng của mỗi người, theo tốc độ của mỗi người.\\nNếu có ý muốn theo kịp, họ sẽ đuổi theo thôi.」"
2514 = "「Đại bãi bỏ các tuyến đường sắt đã làm môi trường thay đổi chóng mặt. \\x%lレイルロオド;#00ffc040;Railord%l;#; trở nên khan hiếm.\\nVậy mà vẫn tiếp tục coi họ là vật tư tiêu hao sao?」"
2517 = "「Tà vẹt trên cầu thì khó hỏng mà.\\nCó lẽ chúng ta đã lơ là chú ý.」"
2539 = "「Olivy. Cô——có biết rằng tình trạng của mình hiện tại,\\nđược khuyến cáo là năm nào cũng phải kiểm tra toàn diện không?」"
2540 = "「Olivy.」"
2541 = "「Từ Olivy á?」"
2542 = "「Em không sao chứ!? Olivy」"
2543 = "「Olivy đâu có nói đến mức đó đâu!!? Chỉ là,\\nnhững người không chạy nhanh được, cũng có lý do riêng của họ thôi.」"
2544 = "「Tắm xong, về cùng Hibiki――rồi Olivy, định đi bảo dưỡng, xong thấy đèn sáng, nên」"
2545 = "「Chị Olivy,\\nđã chọn chị Hibiki làm \\x%l機関士;#00ffc040;lái tàu%l;#; nhỉ~」"
2547 = "「Bé Olivy, quả nhiên là người lớn――\\nLà một \\x%lレイルロオド;#00ffc040;Railord%l;#; kỳ cựu nhỉ.」"
2549 = "「Làm được sao? Tuổi thọ——\\nOlivy, thực sự có thể kéo dài được sao?」"
2550 = "「Olivy!」"
2551 = "「Olivy! Olivy! Tỉnh lại đi!\\n\\x%l共感;#00ffc040;Cộng cảm%l;#;! Mở \\x%l共感;#00ffc040;cộng cảm%l;#; ra! Olivy!!」"
2553 = "「Bọn Olivy! Là \\x%lレイルロオド;#00ffc040;Railord%l;#;!\\nBọn Soutetsu, là con người!!」"
2555 = "「Olivy!!!」"
2556 = "「Olivy!?」"
2557 = "「Olivy——cậu——muốn trở thành \\x%lレイルロオド;#00ffc040;Railord%l;#; của vị \\x%l機関士;#00ffc040;lái tàu%l;#; đó……\\ncủa ngài Munakata sao——」"
2559 = "「Olivy?」"
2560 = "「Cũng chưa chỉ ra đến mức đó. Có vẻ như em ấy chỉ kiểm tra sơ qua\\nnhững chỗ muốn khảo sát kỹ lưỡng thôi――hửm?」"
2563 = "「Cách nói không trực tiếp như vậy đâu ạ?\\nÝ thì đúng là vậy, nhưng nhẹ nhàng hơn nhiều.」"
2564 = "「'Vì ai cũng muốn đi cùng nên không chọn được, rút thăm thôi'.\\nUfufu, đúng là cách quan tâm rất ra dáng bé Olivy.」"
2566 = "「V-Vâng! Reina!」"
2568 = "「Vâng ạ!」"
2570 = "「Nóng quá!? Nhiệt độ gì thế này!」"
2571 = "「Vâng. Nói thẳng kết luận thì,\\ncông việc của \\x%lレイルロオド;#00ffc040;Railord%l;#; Olivy đạt 100 điểm ạ.」"
2575 = "「Được rồi!」"
2576 = "「Đã rõ! \\x%lレイルロオド;#00ffc040;Railord%l;#; hướng dẫn Hachiroku!\\n\\x%l機関士;#00ffc040;Lái tàu%l;#; hướng dẫn Migita Soutetsu!」"
2581 = "「Giả sử ngài Soutetsu hợp tác với Olivy.\\nThì em nghĩ vế sau chắc chắn cũng sẽ đạt điểm tối đa thôi ạ.」"
2582 = "「Nếu việc bảo dưỡng thực sự là sở thích,\\nvà cô ấy coi đó như một cách thư giãn thì tốt, nhưng……」"
2584 = "「Nếu Fukami muốn, thì bắt đầu từ hôm nay cũng――\\nÀ, đúng rồi, gọi điện thoại」"
2587 = "「Bắt đầu làm, rồi lại bỏ cuộc. Nếu chuyện đó xảy ra――\\nThì mối quan hệ tốt đẹp ban đầu có thể sẽ bị thay đổi.」"
2589 = "「Tập sự?」"
2590 = "「Munakata……ừm……có――chuyện đó――nói gì về Đầu máy số 9,\\nhay――về Olivy――không?」"
2601 = "「Thực tế thì, việc kiểm tra bảo dưỡng cũng chỉ có thể dùng từ tuyệt vời để hình dung.\\nĐạt đến trình độ chu toàn như vậy, trước giờ em chưa từng thấy.」"
2603 = "「Đúng thế nhỉ.」"
2605 = "「Vì Olivy là kiểu Mỹ——vì không có Master!\\nNên hễ không cần nữa là lập tức bị vứt bỏ không thương tiếc!!」"
2607 = "「Đúng vậy! Cho nên mới không có chuyện kéo dài tuổi thọ đâu!\\nHỏng thì thay mới là chuyện đương nhiên mà.」"
2609 = "「Cho dù có thể nhờ đền chủ Akai giúp đỡ mảng \\x%l機関士;#00ffc040;lái tàu%l;#;,\\nnhưng phía \\x%l車掌;#00ffc040;trưởng tàu%l;#; thì……phu nhân Nagayama cũng chưa có kinh nghiệm.」"
2615 = "「Đâu có giống nhau đúng không? \\x%lレイルロオド;#00ffc040;Railord%l;#; có Master riêng,\\nvà \\x%lレイルロオド;#00ffc040;Railord%l;#; bình thường của công ty.」"
2622 = "「Chắc chắn, đã có ai đó bắt đầu rồi.\\nNghiên cứu... kéo dài tuổi thọ của \\x%lレイルロオド;#00ffc040;Railord%l;#;——」"
2630 = "「Chuyến đi bộ khảo sát đường ray――\\nOlivy đã tận dụng nó một cách triệt để nhỉ.」"
2638 = "「Ở Đường sắt Ohito, \\x%lレイルロオド;#00ffc040;Railord%l;#; cũng được trả lương.\\nNgân hàng Kumagin cũng chấp nhận mở tài khoản cho \\x%lレイルロオド;#00ffc040;Railord%l;#; nữa.」"
2640 = "「Đường sắt Ohito đúng là kỳ lạ mà!\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; thuyết giáo mà không bị mắng gì cả!」"
2649 = "「Thế nà~o Hachiroku!\\nCông tác kiểm tra bảo dưỡng của cô giáo Olivy được chứ」"
2653 = "「Có chuyện gì vậy ạ!?」"
2654 = "「Sao vậy? Cứ hỏi tự nhiên đi, đừng ngại.」"
2655 = "「Ừm――\\nFukami, còn có công việc khác nữa đúng không?」"
2657 = "「Chắc hẳn cô ấy đã tính toán rất kỹ lưỡng,\\ntừ vài lần ngồi cùng và buổi đi bộ khảo sát hôm trước nhỉ.」"
2659 = "「Muốn thì sao chứ? Biết thừa là không thể nào rồi!\\nOlivy tuyệt đối không cần Hachiroku thương hại đâu!」"
2663 = "「Để trở thành chủ tàu thì cần tiền,\\nvà tôi đang nói là cô có cách để kiếm số tiền đó.」"
2665 = "「Tôi……là người có thể đi đường tắt,\\nlà người có thể chạy nhanh sao.」"
2667 = "「Anh cũng thắc mắc điều đó. Hơn nữa,\\nhuấn luyện thực tế thì tiến bộ sẽ nhanh hơn nhiều chứ.」"
2668 = "「Em cũng đã ngộ ra được rất nhiều điều.\\nCảm ơn chị, cô giáo Olivy.」"
2672 = "「Em cũng nghĩ vậy ạ. Còn về việc có thể đổi ca với Nagi hay không,\\nthì phải đợi Nagi chạy thử với tư cách \\x%l機関士;#00ffc040;lái tàu%l;#; mới biết được.」"
2676 = "「Là chuyện giả định thôi. Anh định xác nhận xem nếu trong tương lai Olivy\\nngừng hoạt động thì sẽ định làm thế nào.」"
2677 = "「Không ai nói như vậy cả.」"
2679 = "「Tôi không biết.\\nNhưng chưa thử mà đã bỏ cuộc thì thật ngốc nghếch.」"
2682 = "「Tôi nghĩ là vậy. Giống như những người không thể chạy nhanh,\\ncũng có những vai trò riêng mà người chạy nhanh không thể làm được.」"
2684 = "「Ra vậy……Với người có thể chạy, thì chạy mới chính là vai trò của họ sao.」"
2685 = "「Tôi có định nghĩ đến, nhưng——」"
2688 = "「Tôi tin là vậy. Nếu vẫn chưa có ai nghiên cứu,\\nthì chúng ta cứ việc đề xướng để bắt đầu nghiên cứu đó là được.」"
2689 = "「Nếu tôi chạy――\\nChẳng phải những người không chạy được sẽ bị bỏ lại phía sau sao?」"
2691 = "「Em nghe thấy tiếng động lớn ạ.」"
2692 = "「Em nghĩ đó là một câu chuyện rất tuyệt vời.\\nNhưng……tại sao lại giấu chúng em?」"
2693 = "「Tôi nghĩ đó là một ý hay. Bé Olivy――\\nrất giỏi trong việc truyền đạt kiến thức cho người khác nhỉ?」"
2696 = "「Nói vậy cũng không ngoa đâu ạ.\\n\\x%l共感;#00ffc040;Cộng cảm%l;#; trong phạm vi cần thiết cho công việc cũng không có vấn đề gì.」"
2700 = "「Tôi sẽ gọi điện cho nhà tắm Tororyu-yu ngay!!」"
2702 = "「Đúng là như lời Munakata nói đó!\\nHơn hết là nước ở đây cực kỳ ngon! Than cũng chất lượng nữa!」"
2704 = "「Chuyện đó――\\nanh Munakata bảo là môi trường ở đây rất tốt.」"
2706 = "「Vì vậy, việc huấn luyện thực tế ngay từ đầu,\\nsẽ giúp đánh giá năng lực nhanh hơn,」"
2709 = "「Nên tôi. Từ lập trường của tôi mà nói,\\ntôi muốn cậu Soutetsu cứ mặc kệ mà tiếp tục chạy.」"
2710 = "「Vì vậy, hãy cho tôi biết.\\nGiả sử Olivy ngừng hoạt động――」"
2713 = "「Thế nên, để không gây nhiều rắc rối,\\nchắc chắn em ấy chỉ bàn bạc với những người ít liên quan nhất thôi.」"
2715 = "「Vì vậy, đừng nói những lời như thế.\\nNhưng tôi muốn cậu Soutetsu cứ tiếp tục chạy như vậy.」"
2716 = "「Nếu vậy, có thể em ấy sẽ không làm được lâu.\\nVà bản thân em ấy cũng chưa biết mình có hợp làm \\x%l車掌;#00ffc040;trưởng tàu%l;#; hay không đúng không?」"
2718 = "「Nên mới nói, chuyện đó ngược ngạo quá rồi đó!!\\nHôm nay Soutetsu mới là người hướng dẫn cho bọn Olivy cơ mà!」"
2719 = "「Vậy,\\nsự khác biệt giữa các \\x%l機関士;#00ffc040;lái tàu%l;#; là gì vậy ạ?」"
2727 = "「Nên mới nói, Soutetsu làm được chuyện đó!\\nHachiroku cũng khá là giỏi vụ đó nhỉ?」"
2730 = "「Vì thế, với tư cách là tập sự của tập sự, Fukami đã âm thầm bắt đầu\\nhọc làm \\x%l車掌;#00ffc040;trưởng tàu%l;#; từ Hibiki và Giám đốc á.」"
2732 = "「'Hụt đất' có nghĩa là 'không bằng phẳng' đó nha~」"
2733 = "「Ý là đi đường vòng, hoặc là một phương pháp\\ncó vẻ hơi không thực tế ạ.」"
2736 = "「Không ạ!」"
2738 = "「Xin... thỉnh thoảng, lại bị, thế này——khi, hưng phấn, quá——\\nNước——dội——dội nước, vào——sẽ bình tĩnh, lại」"
2739 = "「Xin lỗi vì để mọi người đợi nha! Vậy thì, chạy thôi!!!」"
2742 = "「Rút thăm.」"
2744 = "「Đường vòng?」"
2747 = "「Tính toán xem nếu là Đầu máy số 9,\\nthì sẽ thao tác cái gì, ở đâu, như thế nào ấy hả?」"
2748 = "「Vì vụ Đại phế tuyến nên đường ray và tà vẹt đều thiếu hụt.\\nNghe nói nó được sinh ra như một ngành công nghiệp ngách――」"
2751 = "「Nếu chuyến chạy thử đạt 100 điểm tuyệt đối,\\nđến mức được Hachiroku khen ngợi như vậy thì」"
2752 = "「Nếu là đồng đội, nếu ở đó thoải mái, thì chắc chắn,\\nsẽ không muốn đánh mất hay thay đổi nó đâu, đúng không?」"
2755 = "「Nếu đã được Paulette đồng ý thì dễ rồi.\\nEm quyết định đi. Tất nhiên, nếu khó chọn quá thì để anh」"
2757 = "「Vậy tại sao, khoảng thời gian có lẽ chẳng còn lại bao nhiêu đó.\\nCô lại lãng phí nó vào việc khóc lóc ỉ ôi chứ.」"
2761 = "「Dù là Hibiki hay Nagi. Hôm nay Olivy\\ncứ chọn người nào mà em cảm thấy có thể chạy cùng một cách thoải mái nhất là được.」"
2762 = "「Hibiki thì cẩn thận và dịu dàng nhỉ. Với lại, mắt cũng tinh nữa!\\nNhìn thấy cả những thứ Olivy không thấy, giỏi ghê á.」"
2765 = "「Đã rõ. Vậy thì, 3 tuần nữa chúng ta cũng phải\\nthành thạo để có thể đảm nhận tuyến Ohito - Hayato thôi.」"
2767 = "「Hiểu thì hiểu nhưng……\\nAnh cứ thấy đi đường vòng thế nào ấy.」"
2770 = "「Đúng rồi đó.」"
2772 = "「Vậy nên, bây giờ việc nhà đang suôn sẻ,\\nnhưng nếu không suôn sẻ thì có thể em ấy sẽ phải quay về――đúng không?」"
2773 = "「Vậy sao. Thế nếu không để nguyên xi thì có cách nào không?」"
2775 = "「Olivy. Em mang đồ tiếp tế đến cho bọn anh à.」"
2776 = "「Vâng. Vì tôi nghĩ đó là việc bắt buộc nên đã sắp xếp rồi.\\nDự kiến toàn Tuyến Yui sẽ được cải thiện trong vòng hơn hai tuần nữa.」"
2779 = "「Đúng vậy. Bác Fuchi bảo,\\nmuốn xin lịch trình trong thời gian sớm nhất.」"
2781 = "「Đúng vậy. Nhờ bé Olivy đến sớm,\\nnên chúng ta có khá nhiều thời gian rảnh rỗi.」"
2782 = "「Vâng, chuyện đó――」"
2784 = "「Vâng. Tôi biết chuyện đó.」"
2785 = "「Fukami sao ạ?」"
2786 = "「Vậy sao. Thế, em chọn ai?」"
2789 = "「Là về tuổi thọ của Olivy.\\nNghe nói tình trạng của cô ấy được khuyến cáo nên kiểm tra toàn diện hàng năm.」"
2791 = "「Tất nhiên lý tưởng nhất là người có kinh nghiệm――nhưng nếu là Fukami,\\nthì có thể bắt đầu làm việc thực tế khá sớm đấy ạ.」"
2793 = "「Có chuyện gì à?」"
2796 = "「Em cũng rất mong chờ chuyến chạy thử trên Tuyến Yui.\\n\\x%lレイルロオド;#00ffc040;Railord%l;#; Olivy.」"
2806 = "「Chuyện bên Đường sắt Mikan sao?\\nVà là chuyện tôi chưa được báo cáo à?」"
2810 = "「Đúng vậy. Và kinh nghiệm của Olivy,\\nđã triệt tiêu sai số giữa tính toán và thực tế đến mức không thể nhận ra.」"
2812 = "「Nước đây! Em mang đến rồi ạ!」"
2814 = "「Dù không nói ra, nhưng trong lòng anh nghĩ vậy đúng không?\\nNếu không nghĩ thế, thì sao lại bận tâm đến chuyện sau khi hỏng hóc chứ.」"
2815 = "「Vâng. Vốn dĩ đây không phải là tuyến đường có mật độ vận chuyển cao,\\nnên mạnh dạn cải tạo thành \\x%l客車;#00ffc040;toa hành khách%l;#; tham quan tận dụng lợi thế kích thước nhỏ gọn.」"
2817 = "「Đúng thế.」"
2818 = "「Đúng đúng!\\nGì chứ, Soutetsu cũng hiểu rõ quá trời nè!」"
2819 = "「Đúng là tôi không thể nói là mình hiểu được.\\nTôi vẫn chưa biết nhiều về Olivy.」"
2832 = "「Paulette.」"
2833 = "「Cô Paulette.」"
2834 = "「Cô Paulette chắc chắn cũng sẽ nói vậy nhỉ.\\nVì cội nguồn văn hóa của Đường sắt Ohito là từ cô Paulette mà.」"
2835 = "「Quả không hổ danh là giám đốc nhỉ, Paulette.」"
2836 = "「Paulette! Nước!\\nLấy cho tôi một xô nước đầy!」"
2837 = "「Paulette và Reina có hiểu ý nghĩa của nó không?」"
2839 = "「Fukami đã đi cùng chuyến khảo sát Tuyến Yui\\nvì lý do gì vậy ạ?」"
2842 = "「Fukami là \\x%l車掌;#00ffc040;trưởng tàu%l;#; tập sự là sao――\\nVà giấu bọn anh nghĩa là thế nào?」"
2849 = "「100 điểm! Lần chạy thử đầu tiên mà được vậy luôn á!?」"
2851 = "「Tại sao.」"
2852 = "「Ơ, Soutetsu cũng không ngạc nhiên luôn!!\\nNgược lại làm Olivy ngạc nhiên luôn đó!」"
2853 = "「Mất đi chỗ đứng.」"
2858 = "「Sau——đó, Muna, kata——」"
2859 = "「Nên là, Olivy――hoàn toàn không định nghe lén đâu,\\nnhưng mà, lại nghe thấy」"
2863 = "「Reina đi pha thêm hồng trà nha~」"
2865 = "「Reina thì chỉ biết 'hụt đất' thôi nha~」"
2866 = "「Reina nghĩ là, mình đã hiểu lầm\\nvề \\x%lレイルロオド;#00ffc040;Railord%l;#; kiểu Mỹ rồi á~」"
2870 = "「Môi trường?」"
2871 = "「Hễ rảnh rỗi là chị ấy lại giam mình trong kho đầu máy mà.\\nReina cũng thấy chị ấy giỏi lắm luôn á~」"
2872 = "「Tất nhiên là sẽ có ý kiến phản đối. Nhưng chúng ta sẽ tiếp thu những ý kiến đó,\\nvà chắc chắn sẽ tiến lên theo hướng tốt đẹp hơn.」"
2874 = "「Chật vật――cụ thể là sao?」"
2879 = "「Đúng là... không hoàn toàn giống nhau.\\nNhưng, không có nghĩa là tôi coi thường Olivy...」"
2880 = "「Vâng. Em thực sự cảm thấy như vậy. Đáng lẽ em nên gọi chị là chị Olivy, tiền bối Olivy, hay cô giáo Olivy mới phải.」"
2881 = "「Tuyệt thật đấy.\\nTôi cũng muốn noi gương――tôi nghĩ mình phải noi gương em ấy mới được.」"
2884 = "「Đáng khâm phục thật. Chính vì là một \\x%lレイルロオド;#00ffc040;Railord%l;#; như vậy,\\nnên mới có thể đưa ra những lời phê bình sắc sảo đến thế nhỉ.」"
2886 = "「Hợp lý luôn á~. Giỏi ghê~\\nNói y chang Giám đốc luôn á~」"
2890 = "「Thật á!? Cậu đã nói chuyện với Munakata rồi sao!?」"
2891 = "「Vậy sao? Thế tại sao, em lại hiểu rõ về Nagi đến mức đó.」"
2894 = "「Tạm thời thì sẽ như vậy.\\nNhưng chắc chắn như vậy sẽ tốt hơn.」"
2906 = "「Đến mức đó đấy! Một chuyện ngốc nghếch nhưng tuyệt vời như vậy!\\nTừ trước đến nay, chưa một ai——kể cả Munakata——nghĩ đến chuyện đó cả.」"
2912 = "「Đợi đến khi hoạt động thương mại trên Tuyến Yui hoàn toàn ổn định đã. Rồi sau đó,\\nsẽ nhờ bé Olivy hỗ trợ trong quá trình chạy làm quen. Vậy nhé.」"
2914 = "「Khoan đã, em có đi tập kiếm thuật với Nagi không đấy?\\nHay là, hai người đi chơi chung với nhau à.」"
2918 = "「Á! Vẫn đang giữ bí mật mà~!!」"
2919 = "「Quyết định kinh doanh!!!」"
2922 = "「Với lại, được đi bộ trên đường ray cũng thích lắm! Vui lắm luôn!\\nCũng biết được là Đường sắt Ohito không có chuyên gia \\x%l保線;#00ffc040;bảo trì đường ray%l;#; nữa.」"
2927 = "「Tất nhiên rồi ạ. Thấy chưa? Olivy, không sao đâu.\\nSắp, sắp đến chỗ thầy kỹ sư rồi.」"
2929 = "「Vậy sao? Nếu thế thì nhờ cả vào cậu Soutetsu nhé.\\nNhưng hãy cố gắng làm trong khả năng thôi.」"
2933 = "「Bản thân việc chạy tàu thì không có vấn đề gì, nhưng vì thuận tay phải――\\nbuồng lái của \\x%l機関士;#00ffc040;lái tàu%l;#; nằm bên phải, nên Hibiki có phần chật vật.」"
2935 = "「Trước mắt, phải nhờ Olivy làm giảng viên cho khóa học bảo trì đường ray thôi.」"
2940 = "「Đó chỉ là,\\nvì Soutetsu đủ giỏi để đi đường tắt thôi.」"
2941 = "「Nhắc mới nhớ, Olivy từng nói.\\n'Ở Ohito không có chuyên gia \\x%l保線;#00ffc040;bảo trì đường ray%l;#;'.」"
2943 = "「Vì Hibiki và Nagi bàn bạc mãi không quyết định được\\nnên bảo Olivy quyết định cũng được!」"
2944 = "「Nhắc mới nhớ, tôi có nghe được chuyện này ở Đường sắt Mikan.」"
2948 = "「Cái đó――Olivy……\\nOlivy――ngừng hoạt động là sao」"
2949 = "「Giúp tôi nhiều lắm. Đi thôi, Olivy.\\nHachiroku cũng đi theo tôi nhé.」"
2960 = "「Với tư cách là một thành viên của Đường sắt Ohito, là chủ tàu của Đường sắt Ohito,\\ntôi không nghĩ chỉ mình Paulette phải chịu trách nhiệm cho quyết định đó.」"
2963 = "「Mọi người vất vả rồi nha~」"
2964 = "「Mọi người vất vả rồi.」"
2998 = "「Chuyện đó——Nhưng mà, bất kể là \\x%lレイルロオド;#00ffc040;Railord%l;#; nào,\\nhay toa xe nào, cũng đều phải chuẩn bị cho chuyện đó mà.」"
3000 = "「Cái đó――cái đó.\\n……Chắc chắn là vì cậu ấy không muốn mất đi chỗ đứng của mình rồi.」"
3001 = "「Là sao vậy ạ~?」"
3002 = "「Chỗ đó, quả nhiên là sẽ thành vấn đề sao?」"
3003 = "「Tôi nghĩ điều đó thật sự rất tuyệt vời.\\nTôi tin chính sức mạnh đó đã bảo vệ Ohito.」"
3004 = "「Đó không phải là thuyết giáo mà là sự hướng dẫn đúng đắn.\\nChỉ là người có chuyên môn đang chỉ dạy cho những người chưa hiểu rõ thôi.」"
3005 = "「Chuyện đó——thì」"
3006 = "「Cái đó, này. Soutetsu.\\nMunakata……chuyện đó――ừm.」"
3007 = "「Chuyện này, cũng giống y chang vậy đó.\\nNgười không đi đường tắt được thì phải đi đường vòng thôi! Chỉ vậy thôi!」"
3008 = "「Vậy sao, cảm ơn em.」"
3009 = "「Đó, là một kiểu ngạo mạn nhỉ.\\nBởi vì hoàn toàn không tôn trọng lựa chọn, động cơ của người khác.」"
3010 = "「Quả thực làm vậy sẽ an toàn hơn. Dù sao thì gần đây Olivy\\ncũng đã vượt qua đèo Kobata, dù là có đầu máy phụ hỗ trợ.」"
3011 = "「Vậy thì, khi hợp đồng với Đường sắt Mikan kết thúc……\\nHừm. Mục tiêu sẽ là bắt đầu hoạt động thương mại từ đầu tháng sau nữa nhỉ.」"
3012 = "「Chuyện đó, có làm được không ạ?」"
3013 = "「Kéo theo mọi người xung quanh để thử nghiệm như vậy――dù có thất bại.\\nSoutetsu chắc cũng chỉ nghĩ là 'tiết kiệm được thời gian' thôi.」"
3014 = "「Cái đó――đúng là vậy.\\nThực tế thì tiết kiệm được rất nhiều thời gian mà.」"
3015 = "「Cái đó! Đi dọc đường ray chung là biết liền chứ gì!\\nMất cả một ngày trời luôn mà~」"
3016 = "「Thật đáng nể. Đúng là một chuyên gia lão luyện.」"
3017 = "「Nói vậy tức là,\\ncó những vấn đề dù tích lũy kinh nghiệm cũng không giải quyết được sao?」"
3018 = "「Vì cảm giác sẽ thay đổi, nên dù thế nào cũng phải cẩn thận.\\nTuy nhiên, vấn đề này có thể giải quyết nhanh chóng bằng kinh nghiệm.」"
3019 = "「Bé Olivy nhìn thấu được điều đó trong thời gian ngắn như vậy\\nđúng là giỏi thật……Nhưng mà, đó chỉ là một khía cạnh thôi mà.」"
3020 = "「Chắc là vậy rồi.」"
3021 = "「Chuyện đó! Chuyện đó——Munakata sẽ không nghe đâu,\\nmà lỡ như, lỡ như có làm được đi nữa, thì thời gian cũng hoàn toàn không kịp.」"
3022 = "「Hả!!?」"
3023 = "「っ!?」"
3024 = "「Paulette mà nhúng tay vào cả việc \\x%l保線;#00ffc040;bảo trì đường ray%l;#; thì quá sức đấy.\\nChuyện đó, hãy giao cho tôi, \\x%l保線部長;#00ffc040;Trưởng bộ phận bảo trì đường ray%l;#;.」"
3026 = "「Ngay cả anh Soutetsu cũng thấy... Olivy sắp hỏng,\\nkhông còn giá trị lợi dụng nữa sao?」"
3029 = "「Những vị trí từng xảy ra sự cố trong quá khứ đều được đánh dấu.\\nQuả nhiên là bản thân nền đường có vấn đề sao?」"
3032 = "「Còn gì nữa à.\\nÀ, anh ấy cũng có nhắc đến môi trường nữa.」"
3033 = "「Còn gì nữa không!? Còn nói gì nữa!」"
3034 = "「Còn nữa, Fukami hả?\\nCô bé đó cũng khá là có tố chất đó nha?」"
3035 = "「Vậy thì――」"
3037 = "「Vậy thì——Olivy, cũng, thử mơ——mơ mộng một chút, xem sao.\\nKéo, dài, tuổi thọ——rồi tiết kiệm——tiền——」"
3039 = "「Thế nào? Đã quyết định ai làm \\x%l機関士;#00ffc040;lái tàu%l;#; hôm nay chưa?」"
3044 = "「Không phải vậy. Bảo người không chạy được chạy đi,\\nquả thật có chút vô tâm.」"
3046 = "「Gọi bé Olivy cũng được mà?\\nChỉ cần cậu hiểu được điều đó là ổn rồi!」"
3047 = "「Vậy sao.」"
3048 = "「Vậy thì tốt quá――」"
3049 = "「Thì kéo dài ra là được.」"
3051 = "「Vậy, chúng ta hãy lấy đó làm ngày mục tiêu bắt đầu hoạt động thương mại nhé.\\nCủa chuyến tàu mới 『Chuyến tàu BBQ, Mokumoku Olivy』.」"
3054 = "「Vậy thì đổi cách khác. Nếu thuyết phục được anh Munakata,\\nvà gộp chung tiền lương lại thì thời gian sẽ rút ngắn đi một nửa.」"
3055 = "「Anh sẽ báo lại. Chắc Hibiki sẽ hào hứng lắm đây.」"
3057 = "「Đó có lẽ là nguyên nhân gây ra hụt đất nhỉ.\\nVà tấm đệm lót thay đổi là vật liệu có thể điều chỉnh được điều đó đấy.」"
3059 = "「Nếu vậy thì, là dự án của Hibiki à.」"
3061 = "「Chuyện đó là đương nhiên rồi!\\nNếu không thì làm sao mà chạy được cả trăm năm chứ!」"
3062 = "「Ý cô là――bảo tôi phớt lờ lời phê bình của Olivy sao?」"
3065 = "「Cô nói vậy, nghĩa là bé Olivy――\\nCó kiến thức ở trình độ chuyên gia sao ạ?」"
3066 = "「Đó không phải là chuyện ngày một ngày hai mà làm được.\\nĐó là vẻ đẹp có được nhờ sự tích lũy không ngừng nghỉ từ ngày thường ạ.」"
3068 = "「Chỗ đó chưa từng xảy ra sự cố nào đặc biệt cả――\\nÀ, em ấy chỉ ra rằng có mối nguy tiềm ẩn.」"
3070 = "「Đến mức đó sao.」"
3072 = "「Trên đường ray! Cứ hạ cánh xuống đó là được!」"
3074 = "「Đùa thôi mà! Chỉ là nói đùa thôi!!\\nNói chuyện với Munakata xong là quên béng mấy chuyện khác cũng dễ hiểu mà.」"
3075 = "「Dù là người ngoài công ty, Fukami vẫn là đồng đội.\\nChúng anh cũng biết hoàn cảnh của em ấy, và tất nhiên là tôn trọng điều đó.」"
3076 = "「Dù đã trải qua những chuyện đó. Cậu vẫn không phản bác lại những gì bị nói,\\nmà ngoan ngoãn chấp nhận lời phê bình.」"
3077 = "「Soutetsu vừa nói rồi mà? Chuyện của Fukami,\\ndù là người ngoài công ty nhưng vẫn là đồng đội gì gì đó.」"
3078 = "「Cậu Soutetsu và Hachiroku đều đã vượt qua vết thương lòng lớn lao――nên bây giờ mới có thể chạy được, không phải sao.」"
3079 = "「Ngài Soutetsu không phải là người phân biệt đối xử như vậy đâu.\\nBan nãy ngài ấy chỉ đang xác nhận lại quyết định kinh doanh của cô Paulette thôi.」"
3080 = "「Đúng vậy ạ. Thực tế thì dù là tập sự,\\nchúng ta cũng rất muốn có một \\x%l車掌;#00ffc040;trưởng tàu%l;#; mà.」"
3082 = "「Ngài Soutetsu!? Sao ngài lại nói như vậy.」"
3083 = "「Ngài Soutetsu, chúng ta đi thôi.」"
3084 = "「Ngài Soutetsu?」"
3085 = "「Ngài Soutetsu? Ngài sao vậy ạ?」"
3086 = "「Soutetsu cũng thấy vậy sao?」"
3087 = "「Không, dù công việc của '\\x%lレイルロオド;#00ffc040;Railord%l;#; Olivy' đạt điểm tối đa,\\nnhưng em không nói là chuyến chạy thử đạt điểm tối đa đâu ạ.」"
3092 = "「Dùng tiền lương của Olivy để mua lại đầu máy số 9 thì mất bao nhiêu năm chứ?\\nPhải hàng trăm năm mất! Làm sao mà kịp được.」"
3097 = "「Đầu tiên, đơn giản là sự khác biệt về hình dáng buồng lái.\\nĐặc biệt là việc \\x%l逆転機;#00ffc040;cần đảo chiều%l;#; là dạng cần gạt khiến con bé lúng túng.」"
3101 = "「!」"
3104 = "「Amazing!!!」"
3106 = "「Don't touch!!!!」"
3313 = "Truyền đạt lại cuộc nói chuyện với anh Munakata――chỉ có vậy thôi,\\nvà việc Đầu máy số 9 chạy thử trên tuyến chính sau hai tháng kiểm tu."
3317 = "Không chỉ hoàn thành xuất sắc công việc chính của một \\x%lレイルロオド;#00ffc040;Railord%l;#;,\\nmà còn thông thạo những kiến thức xung quanh ở trình độ cao như vậy――"
3320 = "（Cả Olivy, Hachiroku, và cả Paulette\\nđều đồng loạt trưng ra vẻ mặt ngơ ngác như chim bồ câu trúng đạn súng đậu.）"
3322 = "（Không đúng. Có gì đó kỳ lạ.\\nĐôi chân cô ấy bắt đầu run rẩy lẩy bẩy.）"
3323 = "Việc giấu Nagi thì cũng có thể hiểu được.\\nNhưng――"
3326 = "Không phải ở nhà bếp――vậy thì――!!?"
3329 = "（Nhưng cả Olivy và tôi đều đang giữ bình tĩnh.\\nÍt nhất là đang cố gắng bình tĩnh để nói chuyện.）"
3330 = "Quả thực dạo gần đây đã có sự cải thiện đáng kể――\\nCho xem công việc. Đó có vẻ là liều thuốc đặc hiệu hơn bất cứ thứ gì."
3335 = "Cả hai điều đó đều mang giá trị \"cao nhất\" đối với Olivy,\\nbiểu cảm của cô ấy đã nói lên điều đó một cách hùng hồn hơn bất cứ thứ gì."
3340 = "Với tính cách của Nagi thì giấu giếm chuyện gì cũng khó,\\nvà giữa Fukami và Nagi dường như cũng có chút ganh đua của những người bạn thân."
3341 = "Hachiroku mà còn khen ngợi hết lời như vậy――\\nCó lẽ vẫn còn một cảnh giới xa xôi mà hiện tại tôi chưa thể nhìn thấu."
3344 = "Nhưng do sự hỗn loạn khi Olivy đến sớm hơn dự kiến,\\nthông báo tuyển dụng đó mới được đăng vài ngày trước."
3346 = "Chỉ nhìn thấy điều đó thôi,\\ntôi đã thấm thía rằng lời phê bình đó quả thực rất đúng."
3364 = "Mặc dù báo cáo là không có vấn đề gì,\\nnhưng giọng Reina lại có vẻ buồn bã."
3365 = "（Nở một nụ cười gượng gạo rõ rệt,\\nrồi khẽ khàng, tự nhiên lau đi giọt nước mắt.）"
3368 = "（Hachiroku lao ra từ phía trong.）"
3369 = "（Bàn tay của Hachiroku, rụt rè,\\nnhưng vẫn cố gắng tiến lại gần Olivy.）"
3372 = "Hachiroku bối rối dừng lời.\\nTâm trạng của tôi cũng vậy."
3374 = "（Bàn tay đang chìa ra khựng lại.\\nHachiroku không nói được lời nào nữa.）"
3376 = "Hachiroku và Reina có vẻ đã hiểu.\\nNhưng tôi thì không."
3378 = "Hachiroku và Reina đã chủ động tránh đi.\\nSự tinh tế đó khiến tôi thở phào nhẹ nhõm."
3380 = "Trước lời giải thích mang tính bắt chước của Hachiroku,\\nPaulette khẽ mỉm cười và gật đầu đáp lại."
3383 = "（Chuyện sau khi Hachiroku ngừng hoạt động——\\ntôi hoàn toàn không thể nào tưởng tượng cặn kẽ được.）"
3385 = "Hachiroku nghiêng đầu vẻ khó hiểu.\\nTất nhiên, tôi cũng bó tay."
3386 = "（Giọng nói của Hachiroku tràn ngập niềm hy vọng tĩnh lặng.）"
3387 = "Giọng nói của Hachiroku kéo tôi về thực tại.\\nCó vẻ như tôi đã bị cuốn vào những ký ức một lúc lâu."
3391 = "Giọng nói bất ngờ của Hachiroku.\\nOlivy gật đầu nhè nhẹ như muốn nói \"Tiếp đi?\"."
3393 = "Mỉm cười như trút được gánh nặng.\\nHachiroku ngay lập tức lấy lại vẻ mặt nghiêm túc."
3394 = "（Sự đồng ý của Hachiroku đã tiếp thêm sức mạnh cho tôi.）"
3396 = "（Hachiroku chịu nhiệt giỏi hơn tôi.\\nCô ấy vẫn ôm chặt và đỡ lấy Olivy đang phát nhiệt bất thường.）"
3399 = "Sau đó là xem đường ray có bị hỏng hay cong vênh không――\\ncùng lắm là vậy thôi."
3410 = "Bình tĩnh mà nghĩ, một cô bé thông minh như Fukami, phương pháp em ấy chọn\\nkhi suy nghĩ cho tương lai của mình, chắc chắn không thể là một cách ngốc nghếch đối với em ấy."
3416 = "（Lắp ráp lại từ các bộ phận của nhiều đoàn tàu khác nhau. Làm mới.）"
3424 = "Dù biết Olivy là người lớn,\\nnhưng thỉnh thoảng họ vẫn vô tình đối xử với cô ấy như trẻ con."
3426 = "Có kiến thức chưa chắc đã truyền đạt giỏi."
3427 = "Nhưng……không chỉ Hachiroku mà cả Paulette cũng vậy sao."
3428 = "Ra là vậy, nghe nói thế mới thấy đúng.\\nHachiroku cũng gật đầu với vẻ hơi áy náy."
3435 = "Một đánh giá con người khá chính xác."
3437 = "Nhưng――"
3442 = "Ái chà, không được, phải tập trung thôi."
3444 = "Nụ cười rạng rỡ trên khuôn mặt――ôi, thật là một nụ cười rạng rỡ."
3446 = "À, không, ra là vậy. Nếu là chuyện liên quan đến khẩn cấp hay an toàn,\\nthì Olivy chắc chắn đã báo cáo ngay lúc đó rồi."
3451 = "Nhưng――không hiểu sao Paulette và Hachiroku,\\nlại nhìn nhau với vẻ mặt khá là khó xử."
3454 = "（Ý tưởng vốn không tồn tại vì hệ thống \\x%lレイルロオド;#00ffc040;Railord%l;#;,\\nnay đã được chúng tôi hiện thực hóa trên thế giới này.）"
3458 = "Trước Hachiroku, tôi cũng đã kiểm tra các bộ phận chính,\\nnhưng cũng chỉ dừng ở mức yên tâm vì 'làm rất chắc chắn' thôi."
3461 = "Trong khoảng thời gian chờ Olivy đến,\\nĐường sắt Ohito cũng đã có kế hoạch tuyển dụng."
3464 = "Cuối cùng bác ấy đã đáp lại lời mời nhiệt tình của chúng tôi,\\ntừ năm ngoái đã đảm nhận chức vụ Giám đốc \\x%l車輌工場;#00ffc040;Nhà máy chế tạo toa xe%l;#; Jutsusen."
3469 = "Giọng điệu mạnh mẽ, ánh mắt nghiêm túc."
3470 = "（Sự mạnh mẽ và lạc quan\\nđang bắt đầu quay trở lại trên khuôn mặt và cử chỉ của Olivy.）"
3475 = "Bác Seki là chuyên gia về đất và nước,\\nchứ không học chuyên sâu về kỹ thuật đường sắt."
3496 = "Olivy chạy lóc cóc.\\nCô bé nhảy lên buồng lái Đầu máy số 9, cất giọng vô cùng vui vẻ."
3497 = "Olivy từ tốn khoanh tay,\\nnhíu mày bắt đầu suy nghĩ."
3498 = "Dù là những lời tôi cố tình tóm tắt lại,\\nnhưng có vẻ Olivy đã đón nhận chúng một cách tích cực."
3499 = "Rằng Olivy, cần phải kiểm tra toàn diện hàng năm――\\nLà một \\x%lレイルロオド;#00ffc040;Railord%l;#; đã xuống cấp nghiêm trọng đến mức đó."
3501 = "（Hãy tin vào một \\x%lレイルロオド;#00ffc040;Railord%l;#; tên Olivy,\\nngười đã vượt qua đặc tính kiểu Mỹ và được Hachiroku khen ngợi, tin vào tinh thần kiềm chế của cô ấy.）"
3502 = "Olivy vẫn giữ nguyên nụ cười rạng rỡ, nhìn quanh một vòng."
3503 = "Giọng điệu mạnh mẽ ngoài sức tưởng tượng khiến tôi quay sang,\\nOlivy đang vô cùng nghiêm túc, đến mức đáng sợ――"
3504 = "Olivy gật đầu thật mạnh."
3505 = "（Sự mạnh mẽ và lạc quan của Olivy,\\nđã hoàn toàn biến mất.）"
3506 = "Ánh mắt Olivy trở nên đầy nghi ngờ.\\nNếu chưa hiểu, thì tất nhiên tôi sẽ giải thích cho đến khi hiểu thì thôi."
3507 = "（Olivy trợn tròn mắt.\\nMiệng há hốc.）"
3508 = "（Olivy cười.）"
3509 = "（Olivy mím chặt môi——\\ntừ khóe mắt, những giọt nước mắt to tướng lã chã tuôn rơi.）"
3510 = "――Nụ cười rạng rỡ, ngập tràn trên khuôn mặt.\\nChói lóa đến mức chỉ có thể diễn tả như vậy."
3511 = "Olivy lùi lại nửa bước.\\nHay nói đúng hơn là loạng choạng ngã khụy xuống."
3512 = "（Cùng với tiếng thét chói tai bằng tiếng Mỹ,\\ncô ấy hất văng bàn tay đang chìa ra của Hachiroku.）"
3513 = "Olivy ôm đầu rên rỉ.\\nNhưng――chuyện này không thể không hỏi cho rõ được."
3514 = "Kiến thức về \\x%l保線;#00ffc040;bảo trì đường ray%l;#;, và mức độ kinh nghiệm hoàn toàn khác biệt."
3519 = "Lúc nào, và bằng cách nào――\\nChỉ cần nghĩ một chút là tôi tìm ra ngay câu trả lời."
3522 = "（Nụ cười gượng gạo đã trở thành nụ cười thật sự.）"
3524 = "Lời đáp dõng dạc như lính mới, cùng với cái chào nghiêm trang.\\nDù là lão tướng trăm năm tuổi nhưng lại toát lên vẻ ngây thơ và đáng yêu."
3525 = "Giọng nói lạnh lùng, như muốn đẩy người ta ra xa.\\nNhưng không hiểu sao, lại nghe rất thân thiết."
3527 = "……Sự bộc lộ cảm xúc vui sướng mãnh liệt đến mức khiến tôi giật mình.\\nNhưng, từ phía nhà bếp nơi Hachiroku đang ở, lại không có phản ứng gì."
3528 = "Nếu vậy thì hiện tại, giữa Olivy và Hachiroku,\\nít nhất là \\x%l共感;#00ffc040;cộng cảm%l;#; về mặt cảm xúc vẫn chưa được kết nối."
3540 = "Trước lời khen ngợi từ tận đáy lòng, dù hơi ngượng ngùng――\\nPaulette vẫn đáp lại một cách rõ ràng."
3541 = "Trước lời khẳng định mang hình thức câu hỏi,\\nHachiroku không đồng ý cũng chẳng phủ nhận."
3543 = "Ngay khi tôi đang nghiêng đầu thắc mắc về sự đãng trí hiếm hoi của mình,\\nthì nguyên nhân của nó đã nhảy bổ vào tầm mắt tôi."
3552 = "Quyết định hay đấy. Nếu mục tiêu được xác định rõ ràng,\\nNagi và Hibiki cũng sẽ càng thêm quyết tâm――"
3553 = "Mặc dù chỉ là lần đầu tiên, và chỉ là chuyến đi khảo sát nhân tiện xác nhận tuyến đường,\\nnhưng phần lớn những điểm Olivy kiểm tra――"
3555 = "……Sự phục hưng du lịch của Ohito, quả thực nếu so với các khu vực xung quanh\\nthì có vẻ hơi chậm. Tuy nhiên, thực tế lại vô cùng vững chắc."
3582 = "（Mặc dù trong vòng tay vẫn còn nóng hổi,\\nnhưng một cảm giác ớn lạnh——lạnh toát chạy dọc sống lưng tôi.）"
3586 = "Vừa trả lời, tôi vừa lật sổ tay ra để kiểm tra."
3599 = "Tôi cúi đầu xin lỗi, cô ấy lại hoảng hốt không hiểu sao."
3600 = "Những gì chúng tôi kiểm tra là\\n\\x%lバラスト;#00ffc040;đá dăm%l;#;, và tình trạng hư hỏng của tà vẹt."
3602 = "（Những kẻ chạy được như chúng tôi, không thể kiêu ngạo thừa nhận rằng\\nOlivy là một \\x%lレイルロオド;#00ffc040;Railord%l;#; \"không may mắn\".）"
3604 = "Khi cả hai chúng tôi cùng cúi đầu,\\nOlivy vung vẩy đôi tay ngắn ngủn của mình."
3605 = "（Vì vậy, tôi chạy. Dù cô ấy có ngủ thiếp đi hay không,\\nđiều duy nhất tôi có thể làm lúc này chỉ có một.）"
3606 = "（Chúng tôi chỉ đơn thuần là may mắn,\\nđược ai đó ban cho môi trường. Chứ không phải là do duyên số.）"
3607 = "（Chúng tôi đã va vấp, nản chí, nhưng vẫn tiếp tục chạy và đến được với nhau.\\nĐể đến được với nhau——chúng tôi đã cùng nhau vượt qua cây cầu đó.）"
3608 = "Lúc không làm việc, tôi cứ tự hỏi cô ấy làm gì――ra là bảo dưỡng sao."
3611 = "（Tôi cùng Hachiroku vội vàng đỡ lấy cô ấy——!!?）"
3612 = "Tôi và Hachiroku đưa mắt nhìn nhau."
3614 = "Tôi và Reina nhìn nhau gật đầu."
3617 = "（Tôi nghĩ, thứ mình đang ôm trong vòng tay này chính là một sinh mệnh.）"
3619 = "Nhặt những chiếc lon lăn lóc dưới chân. Một cái, hai cái."
3620 = "（Tôi chưa từng thấy cô ấy có biểu cảm như vậy.\\nCòn đau đớn hơn cả lần đầu tiên chúng tôi gặp mặt——）"
3621 = "Tôi không ngờ biểu cảm của \\x%lレイルロオド;#00ffc040;Railord%l;#;\\nlại có thể thay đổi xoành xoạch đến mức này."
3625 = "（Định trả lời, nhưng không thốt nên lời.\\nTôi nhận ra——điều đó là không thể, tôi không thể làm được.）"
3628 = "（Bế cô ấy lên, tôi giật mình.\\nCơ thể cô ấy vẫn còn khá nóng——và, rất nhẹ.）"
3630 = "Mở cửa cửa hàng đường sắt ra,\\nOlivy đang đứng chết trân ở đó."
3632 = "Dù tôi đang thán phục, Olivy lại phồng má hờn dỗi."
3633 = "（Giống như có thứ gì đó vỡ tung——tôi nhận ra và xâu chuỗi lại.\\nÀ, ra đây chính là hiện tượng \"đạp mìn\" sao.）"
3635 = "Cuối cùng tôi cũng hiểu ra.\\nMọi người không cần phải chạy cùng một tốc độ trên cùng một đường ray."
3636 = "Tôi chưa nói xong, Hachiroku đã vội vàng xen vào."
3637 = "Báo cáo thử nghiệm sau khi để nhóm Olivy về trước."
3641 = "Lấy đồng hồ đường sắt ra xem.\\nQuả nhiên là tốn quá nhiều thời gian rồi."
3644 = "Vừa hỏi, Hachiroku liền gật đầu đáp lại ngay."
3645 = "Tôi không hề nhận thức được điều đó. Cũng không có lý do gì để nhận thức.\\nBởi vì tôi chỉ đơn giản là không thể sống tiếp nếu không làm vậy."
3646 = "（Muốn cứu cô ấy.\\nChỉ ý nghĩ đó thôi đã choán lấy toàn bộ tâm trí tôi.）"
3647 = "（Không chỉ dừng lại ở khả năng\\nnhận nuôi và nuôi nấng một đứa trẻ.）"
3649 = "（Vì vậy, hãy nói ra.\\nHãy tin rằng cô ấy chắc chắn sẽ hiểu.）"
3658 = "（Nếu đây là cách xử lý do chính Olivy chỉ ra cho sự cố đột ngột đã xảy ra nhiều lần,\\nthì tôi tin đó là cách tốt nhất.）"
3660 = "Nếu đã bị nghe thấy thì không thể giấu giếm được nữa.\\nTôi cẩn thận lựa lời để cố gắng không gây hiểu lầm."
3663 = "Thấy cả Hibiki và Nagi đều không đến hối thúc,\\nchắc hai đứa cũng không thể nhúc nhích vì lý do riêng của mình."
3668 = "（Là tiếng gầm lên, cũng là tiếng hét thảm thiết.）"
3674 = "Tôi đi trước chạy thử, có người sẽ giải quyết những vấn đề phát sinh,\\ncó người sẽ điều khiển chuyến tàu phía sau, cũng có người sẽ \\x%l編成;#00ffc040;lập biểu đồ chạy tàu%l;#;."
3678 = "Chỉ dựa vào kiến thức của những tình nguyện viên như bác Seki,\\nmà đã tưởng mình hiểu về \\x%l保線;#00ffc040;bảo trì đường ray%l;#;, tôi thấy mình thật thảm hại."
3681 = "Tôi nghĩ nếu hỏi thì có thể sẽ làm cô ấy tức giận,\\nnhưng dù vậy, tôi vẫn phải xác nhận cho rõ ràng."
3685 = "（Hơi thở cũng gấp gáp... có vẻ như, gấp gáp hơi quá đà——）"
3697 = "Paulette, với tư cách là giám đốc――\\nMột mối bận tâm liên quan đến quyết định của cô ấy."
3698 = "Paulette và Reina nhìn nhau.\\nQuả nhiên là họ cũng tò mò."
3699 = "Giọng nói khẽ run của Paulette,\\ncho thấy đó là một kỹ năng phi thường đến nhường nào."
3700 = "Biểu cảm của Paulette hơi biến sắc.\\nTôi có cảm giác cô ấy vừa nhẹ nhõm, vừa bối rối."
3701 = "Nghe giọng Paulette, nét mặt Hachiroku như được cứu rỗi.\\nCó lẽ tôi cũng đang mang vẻ mặt giống vậy."
3702 = "Thứ được đưa cho tôi là vài tờ giấy A4."
3703 = "Paulette không hề dao động chút nào."
3706 = "Fukami vẫn còn rất trẻ, lại hoàn toàn gắn bó với Ohito.\\nTất nhiên là sẽ phải kiêm nhiệm cả việc chèo thuyền xuôi dòng sông Kuma……"
3712 = "Bác Fuchi. Kỹ sư cựu trào của nhà máy Toyokawa thuộc Nippon Sharyo,\\nngười đã liên tục giúp đỡ việc cải tạo 8620."
3713 = "Kể từ khi bác Fuchi nhậm chức, những \"ý kiến nghiệp dư\" của Hibiki\\nvốn luôn bị từ chối thẳng thừng, nay đã bắt đầu được hiện thực hóa."
3721 = "（Nhưng——nếu im lặng lúc này, thì chẳng khác nào thừa nhận.）"
3722 = "Trước khi tôi kịp nói hết câu,\\nPaulette đã vui vẻ vỗ tay vào nhau."
3725 = "（Nhưng ngay sau đó, cô ấy nhắm chặt mắt, ngậm chặt miệng,\\nvà lắc đầu nguầy nguậy.）"
3728 = "Rất tự nhiên, Reina đã kéo câu chuyện quay lại.\\nTrông thì có vẻ trẻ con, nhưng lại rất người lớn."
3731 = "Giọng Reina buột miệng thốt lên.\\nLà do vui mừng hay ngạc nhiên, tôi hoàn toàn không thể phân biệt được."
3732 = "（Cắt ngang qua đó,\\nlà lời hỏi han thong thả, mang đúng điệu bộ thường ngày của Reina.）"
3734 = "Reina cũng mỉm cười, gật đầu đồng tình với lời của Paulette.\\nChỉ nhìn thôi cũng thấy lòng nhẹ nhàng, ấm áp."
3735 = "……Về chuyện tuổi thọ, có lẽ không nên đề cập đến một cách khinh suất."
3736 = "Cả ba người họ đều có thừa kiến thức cơ bản và kinh nghiệm."
3740 = "（Quả thực, bất kể là kiểu Mỹ hay gì đi nữa, nếu Master\\ncó thể mua lại cả đầu máy số 9 lẫn Olivy, thì đó chính là chủ tàu.）"
3743 = "Chỉ cần làm vậy, trình độ \\x%l保線;#00ffc040;bảo trì đường ray%l;#; của Đường sắt Ohito\\nchắc chắn sẽ tăng vọt lên một tầm cao mới."
3745 = "（Có lẽ vì quá cảm kích,\\nmà khuôn mặt Olivy đỏ bừng lên.）"
3747 = "Phản ứng vượt ngoài mong đợi của cô ấy khiến tôi khá nhẹ nhõm.\\nCó vẻ đây sẽ là cơ hội tốt để tôi và Olivy trở nên thân thiết hơn."
3758 = "（Ngay khoảnh khắc ý nghĩ đó lóe lên, cơ thể cô ấy bỗng trở nên nặng trĩu.\\nGiống hệt như một đứa trẻ đột nhiên ngủ thiếp đi——）"
3768 = "Và kết quả cũng vậy――\\nVì luôn được yêu cầu, nên tôi cứ liên tục tạo ra nó."
3771 = "（Chính vì vậy, tôi mới nhận ra.\\nTôi thấy bản thân mình thật ngốc nghếch khi không nhận ra điều đó sớm hơn.）"
3774 = "Lần cải tạo \\x%l客車;#00ffc040;toa hành khách%l;#; này sẽ đơm hoa kết trái dưới hình thức nào đây,\\nbản thân tôi cũng đơn thuần cảm thấy mong chờ."
3778 = "Giọng nói chan chứa cảm xúc chân thật.\\nNhững lời nói mang theo hơi ấm sống động."
3779 = "Lời đỡ lời của Hachiroku,\\nnụ cười có vẻ hơi bối rối của Paulette."
3780 = "Tôi định chỉ lướt qua sơ sơ――\\nNhưng rồi lại đọc một cách chăm chú."
3781 = "Đằng sau những lời khen ngợi không ngớt của Hachiroku,\\ntôi thực sự cảm nhận được sự tích lũy không ngừng nghỉ."
3785 = "（Nếu trong tương lai có một cuộc cách mạng công nghệ đột phá,\\nthì biết đâu, \\x%lレイルロオド;#00ffc040;Railord%l;#; và con người có thể——）"
3790 = "Dù vậy, em ấy có vẻ sẽ trưởng thành và trở thành một trong những trụ cột\\ncủa Đường sắt Ohito trong tương lai――hay nói đúng hơn là của Ohito."
3805 = "Báo cáo kết quả chạy thử,\\nlà một vấn đề quan trọng có thể quyết định mọi thứ trong tương lai."
3808 = "Nói đến đó, tôi chợt nhận ra.\\nĐây có lẽ là một chủ đề khá nhạy cảm."
3809 = "Hai người họ cũng là những \\x%lレイルロオド;#00ffc040;Railord%l;#; đời cũ.\\nDo đó, tôi cũng không muốn họ nghe chuyện này lắm."
3811 = "Cái gật đầu đã đánh thức ký ức."
3812 = "Nói rồi, Paulette chỉ vào chính khuôn mặt mình."
3823 = "（Kẻ chạy được, và kẻ không thể chạy.\\nLời chỉ trích của Olivy như đâm xuyên qua ký ức của tôi.）"
3833 = "（Phía sau làn hơi nước mù mịt,\\nOlivy hé mở đôi mắt.）"
3834 = "（Chắc chắn là có nhu cầu.\\nVì tin chắc như vậy, nên tôi mới dám khẳng định.）"
3835 = "Sống lưng tôi cũng vươn thẳng lên khi đáp lễ――\\nnhưng cũng phải vất vả lắm mới kìm được đôi má đang chực chờ nở nụ cười."
3836 = "Đúng là một thành công ngoài mong đợi. Việc Hachiroku đối xử với Olivy như trẻ con\\nrõ ràng đến mức ngay cả Nagi cũng phải bận tâm."
3837 = "Chắc em ấy mua ở máy bán hàng tự động ngay kia.\\nLon nước lạnh buốt, nhặt lên mát rượi cả lòng bàn tay."
3838 = "Hachiroku chắc chắn sẽ rất khó\\nđể thốt ra những lời trách móc chúng tôi, trách móc tôi."
3839 = "Lại một nhận xét trúng phóc khiến tôi kinh ngạc.\\nThời gian tiếp xúc với Nagi có lẽ khá hạn chế mà――"
3840 = "Nếu vậy, ban đầu chắc hẳn em ấy đã bàn bạc với Paulette.\\nCó lẽ Paulette đã vui vẻ nhận lời――"
3843 = "Vậy tức là, những \\x%l共感;#00ffc040;cộng cảm%l;#; mà họ trao đổi với nhau,\\nchỉ dừng lại ở mức \"tối thiểu cần thiết cho việc vận hành đường sắt an toàn\" thôi."
3847 = "Vậy thì trong thâm tâm cô ấy――\\nChắc hẳn đã có \"quyết định kinh doanh\" như anh Munakata tưởng tượng."
3850 = "（Nếu vậy thì không cần phải hoảng hốt.\\nCứ từ từ, chậm rãi giải thích cho cô ấy hiểu là được.）"
3851 = "Vậy thì, bây giờ cứ để thế này, không cần đi sâu thêm――"
3853 = "Nhìn tôi bằng ánh mắt như đang muốn chất vấn."
3859 = "Sự khởi sắc của thuyền xuôi dòng sông Kuma, sự bình phục của mẹ Fukami - cô Midori,\\ncùng với sự trở lại của các lái đò, Fukami đã có nhiều thời gian rảnh rỗi hơn."
3864 = "Tâm trạng của tôi cũng vậy, đã được xốc lại tinh thần nhờ câu nói vừa rồi."
3865 = "Được xoa dịu bởi tách hồng trà Paulette pha,\\nphù, những lời nói cứ thế tuôn ra."
3866 = "Cùng với sự trưởng thành của Fukami, cần phải cho em ấy thực hành trên tàu,\\nnên mới kéo cả Hibiki vào, và dẫn đến hiện tại."
3867 = "Không biết điều gì đã khiến cô ấy ngạc nhiên,\\nkhuôn mặt cứng đờ của Olivy dần dần giãn ra thành một nụ cười."
3868 = "Chuyện \\x%l保線;#00ffc040;bảo trì đường ray%l;#; cũng đáng bận tâm đấy,\\nnhưng nếu Hachiroku lại quan tâm đến chuyện của Fukami hơn thì――"
3870 = "（Tuy là một phương pháp đơn giản đến mức thô bạo,\\nnhưng có vẻ như nó thực sự mang lại hiệu quả.）"
3871 = "Dù chỉ mới khoảng một tuần, nhưng dù ở nhà Migita hay nơi làm việc,\\nchắc hẳn đó là kết quả của việc cùng nhau trải qua những khoảng thời gian gắn bó."
3893 = "（Trĩu xuống）"
3896 = "(À, ra vậy, là nụ cười này đã khiến mình nhớ lại sao)"
3897 = "（Cạch cạch cạch!）"
3898 = "（Cạch cạch!）"
3899 = "（Ào ào!!!）"
3901 = "（Với cơ thể nhỏ bé và nhẹ bẫng này——mà đã sống suốt một trăm năm sao.）"
3902 = "（Lảo đảo!）"
3904 = "（Ra vậy——nếu tuổi thọ của Hachiroku cũng được kéo dài...\\nThì cơ hội cũng sẽ tăng lên bấy nhiêu.）"
3907 = "(Ngoại hình và lời nói đó kích thích cái gọi là tình mẫu tử sao?\\nHay là bên trong Olivy có yếu tố nào đó mà tôi không hiểu được)"
3910 = "(Chuyện đó quan trọng đến thế sao.\\nViệc ai sẽ là người lái thử Đầu máy số 9 đầu tiên ấy)"
3911 = "(Nếu vậy――Nagi có vẻ bất lợi nhỉ)"
3913 = "(Nếu vậy thì tôi phải là người tiên phong học hỏi, tiếp thu,\\nrồi truyền đạt lại cho bác Seki mới đúng)"

[selections]
