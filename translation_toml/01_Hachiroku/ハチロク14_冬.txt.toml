2620 = "「Ừm. Và 8 tiếng do chúng ta phụ trách cũng sẽ chia làm 3 ca,\\nmỗi người lần lượt nghỉ ngơi.」"
2624 = "「Ừm. Đúng vậy nhỉ. Muốn được nhớ đến một cách trọn vẹn——\\nMuốn được ghi nhớ tất cả. Chỉ riêng Munakata thôi.」"
2625 = "「Ừm. Tôi nghe nói vậy.」"
2626 = "「Ừm. Thời gian, bị nhảy cóc——Dù không hề ngủ,\\ndù vẫn đang hoạt động bình thường, nhưng lại không thể nhớ được khoảng thời gian ở giữa.」"
2627 = "「Vâng. Tuyệt đối không ạ.」"
2628 = "「Vâng, không lạnh chút nào ạ.\\nVì em có bờ vai của bé Olivy, và chiếc ô của ngài Soutetsu che chở mà.」"
2631 = "「Vâng. Chắc chắn được ạ. Và đây là điều——\\nchỉ có bé Olivy mới làm được.」"
2632 = "「A, đúng vậy ạ.\\nGiao cho Navi có lẽ là cách tốt nhất.」"
2633 = "「Ừm. Bảo là sức khỏe tốt rồi.」"
2634 = "「Ừ, đúng vậy.」"
2639 = "「Ừm. Làm vậy là chắc chắn nhất.」"
2640 = "「Hửm?」"
2641 = "「Hửm? Tôi có nghe thấy gì đâu.」"
2643 = "「Ưfufu.」"
2645 = "「Ehehe~. Vui quá, cảm ơn cậu.」"
2647 = "「À, hình như cô ấy bảo là thấp quá thì phải.」"
2649 = "「À. Hèn chi lúc nãy anh hai\\nmới nói là làm ngoài giờ nhỉ.」"
2651 = "「À, xin lỗi.\\nĐang ngậm nhiệt kế thì làm sao mà trả lời được.」"
2652 = "「Giật mình——A——vâng——không——\\nKhông——em」"
2654 = "「Giờ này mọi người đang ngủ hết rồi nhỉ~」"
2655 = "「Trước đó, hãy xác nhận xem đó có phải là giếng chung——\\nloại giếng lớn cung cấp nước cho nhiều hộ gia đình hay không nhé.」"
2658 = "「Cảm ơn nhé! Giúp được nhiều lắm!!」"
2682 = "「Olivy」\\n「Bé Olivy!?」"
2684 = "「Chị cũng nghĩ vậy. Nhưng mà, hiện trường sáng nay lúc xem\\nthì hoàn toàn không có gì thay đổi, nên Olivy không biết phải làm sao.」"
2685 = "「Cả Olivy nữa. Ướt bây giờ.」"
2686 = "「Hiểu! Cái đó!!!」"
2687 = "「Olivy, muốn quan sát ở đây.\\nVì tôi nghĩ nếu có chuyện gì xảy ra, thì chắc chắn là ở đây.」"
2688 = "「Trước khi biến mất ấy, chỉ tỏa sáng rực rỡ trong một khoảnh khắc.\\nTôi đã nghĩ như vậy là đủ rồi. Muốn mọi người nhớ đến khoảnh khắc đó.」"
2689 = "「Nỗi buồn đó, Olivy rất ghét.\\nNên là, cậu biết không? Tôi đã nghĩ mình phải cố gắng thêm một chút nữa.」"
2690 = "「Olivy! Sẽ đi đánh thức Soutetsu——!!!?」"
2691 = "「Bé Olivy——\\nCó phải đang vội vàng quá không ạ?」"
2692 = "「Hàng xóm cũng bị lẫn cát,\\nchuyện đó thì tôi hỏi rồi.」"
2693 = "「Bé Olivy!」"
2694 = "「Bé Olivy! Bé Olivy!!\\nTrả lời, trả lời em đi!!」"
2695 = "「Bé Olivy!!?」"
2696 = "「Bé Olivy!?」"
2697 = "「Không được đâu, bé Olivy!\\nBên đó là công việc của mọi người ở thành phố Kirishima ạ.」"
2698 = "「Bé Olivy, em thấy lạnh sao ạ?」"
2699 = "「Chỉ khi bé Olivy được nghỉ ngơi đàng hoàng,\\nthì kiến thức và kỹ thuật đó mới có thể chia sẻ cho cả đội được.」"
2700 = "「Trong tình trạng——trong tình trạng như thế này——\\nBé Olivy——sao vẫn có thể——tỏ ra bình thường được chứ.」"
2701 = "「Olivy, nhờ giới thiệu trưởng khu phố cũng được.\\nHãy xác nhận xem các hộ gia đình khác dùng nước giếng có sao không nhé.」"
2702 = "「Chào buổi sáng, Olivy. Tình hình sức khỏe sao rồi?」"
2703 = "「Điều đó cũng vậy, bé Olivy à.\\nChắc chắn, không có gì kỳ lạ cả đâu ạ.」"
2706 = "「Hạ sốt rồi, nên chạy bay đi \\x%l保線;#00ffc040;bảo trì đường ray%l;#; rồi.」"
2709 = "「Từ hôm qua đã có dấu hiệu hồi phục rồi sao.」"
2710 = "「Hiểu rồi~」"
2711 = "「Anh biết rồi.」"
2713 = "「Em giẫm phải cái gì đó. Kêu cái rột——Cái gì đây?」"
2714 = "「Cảm ơn ý tốt của em, nhưng 『chở hai』 là vi phạm pháp luật đấy.」"
2717 = "「Vâng——.\\nEm hiểu rồi. Bé Olivy.」"
2718 = "「Vâng.」"
2719 = "「Biết rồi!」"
2721 = "「Vâng, ông Nagare. Cháu cảm ơn ông.\\nTrên đường về, ông cũng đi cẩn thận nhé.」"
2724 = "「Tôi hiểu rồi. Tôi sẽ liên lạc ngay với người phụ trách.」"
2725 = "「Vâng, em rõ rồi ạ. Ngài Soutetsu.」"
2727 = "「Hiểu rồi! Vậy, tôi sẽ làm thế!!!」"
2729 = "「Biết rồi, tôi sẽ đợi!\\nNếu về trước thì tôi sẽ liên lạc nha!」"
2730 = "「Vâng ạ, em hiểu rồi ạ~」"
2732 = "「Gì chứ, mới cuối tháng mười một mà đã có tuyết rồi sao.\\nChỉ mong là lúc đang lên Yatake, không gặp phải trận tuyết đầu mùa.」"
2733 = "「Nếu anh hai không ăn thì là chị hai sao?」"
2737 = "「Nếu chỉ thích một mình Munakata thôi ấy, thì Olivy, chắc chắn…… đã nghĩ là mình 『đã hoàn thành trọn vẹn』 từ lâu lắm rồi.」"
2738 = "「Những điều Munakata đã dạy cho tôi. Những điều quan trọng.\\nNếu Olivy——có thể truyền đạt lại cho mọi người.」"
2740 = "「Nếu cần thiết, tôi có thể nhờ các giáo dân giúp đỡ.」"
2742 = "「Nếu vậy thì Olivy, dù có phải nằm im tĩnh dưỡng cũng có thể chịu đựng được.\\nKỳ lạ thật nhỉ. Rõ ràng là đau đớn và khổ sở đến thế này cơ mà.」"
2743 = "「Cô có thể…… tự nhận thức được điều đó sao.」"
2746 = "「Hiểu rồi!\\nVậy thì, tôi sẽ giải thích nguyên văn bao gồm cả chuyện đó!」"
2763 = "「Những điều Olivy biết——chia sẻ, cho cả đội.」"
2764 = "「Ừm.」"
2765 = "「Đúng vậy! Bởi vì Olivy, đã được giao phó mà!」"
2766 = "「Đúng rồi nhỉ.\\nChúng ta, phải làm công việc của chúng ta!」"
2767 = "「Đúng vậy. Nói đúng hơn là, tự tôi biết được.\\nCái này, không thể hạ xuống được nữa.」"
2768 = "「Đúng nhỉ. Phải có ba người thì mới thay phiên nhau nghỉ được chứ.」"
2769 = "「Đúng rồi ạ. Có vẻ chị Paulette không hiểu lắm.」"
2770 = "「Nghe nói ở núi Kirishima——đặc biệt là khu vực quanh miệng núi lửa Shin'endake,\\nđang có dấu hiệu hoạt động núi lửa trở nên mạnh mẽ hơn.」"
2771 = "「Điểm đó tôi cũng đã tiếp nhận không sai sót.\\nCậu Soutetsu và mọi người sẽ đến hiện trường ngay sao?」"
2772 = "「Ừ. Song song đó, cô có thể nghe ngóng xem\\ncó dấu hiệu bất thường nào khác trong phạm vi có thể không?」"
2773 = "「Đúng vậy. Nên tôi đã rất ghét, rất buồn,\\nvà chỉ muốn quay về Đường sắt Mikan thôi.」"
2774 = "「Vâng. Để có thể chia sẻ thông tin một cách chặt chẽ nhất——\\nviệc xây dựng hệ thống đó, tôi sẽ tiến hành cùng với thành phố Ohito.」"
2775 = "「Đúng vậy ạ.\\nTối om——và vô cùng cô đơn, trống trải.」"
2776 = "「Chỉ nói chuyện thôi sao…… Không phải là mệnh lệnh công việc à?」"
2779 = "「Vì Olivy nhỏ nhắn và dễ thương sao!?」"
2780 = "「Đúng vậy nhỉ.」"
2781 = "「Đúng vậy nhỉ! Ehehe~」"
2783 = "「Đúng đấy bé Olivy. Giả sử ở chỗ ngài Tororyu-yu không được,\\nthì đến Omiya——chỗ Tiến sĩ Fushicho thì chắc chắn sẽ được.」"
2785 = "「Đúng vậy nhỉ~.\\nTừ căn cứ bảo trì đường ray nhìn ra, chỗ này hoàn toàn là góc khuất mà~」"
2787 = "「Đúng không? Soutetsu đối với Hachiroku,\\nchắc chắn chắc chắn chắc chắn sẽ không bao giờ quên đúng không?」"
2789 = "「Dù có khám bao nhiêu lần đi nữa,\\nthì cũng chẳng làm được gì cả.」"
2797 = "「Thời gian mà ngài Soutetsu và em, hai người đã cùng nhau tích lũy.\\nMuốn có ít nhất một người, nhớ đến điều đó——kiểu như vậy ạ.」"
2799 = "「Nên là, chuyến thăm mới ngắn ngủi như vậy sao nhỉ?\\nKiểu như để tránh làm sức khỏe lại xấu đi ấy——」"
2804 = "「Olivy hạ sốt được thật sự là tốt quá rồi.\\nDù em nghĩ vẫn chưa thể chủ quan được——nhưng cũng yên tâm phần nào.」"
2806 = "「Phải đi châm thêm dầu thôi!\\nVới cả tìm cái gì đó để chắn gió nữa.」"
2814 = "「Có đó. Nói đúng hơn là……」"
2815 = "「Làm sao em lại thấy phiền được chứ!\\nNgược lại, em lúc nào cũng sẵn lòng ạ.」"
2816 = "「Không có chuyện cố quá sức đâu~.\\nOlivy vẫn còn rấ~t nhiều việc phải làm mà!」"
2817 = "「Làm gì có chuyện đó ạ.」"
2819 = "「Mau đi nghe chuyện đi ạ.」"
2823 = "「Chuyện cấp bách đến mức đó sao?」"
2825 = "「Nhớ ra…… chuyện gì, cơ ạ?」"
2827 = "「Hibiki và Makura. Nếu Olivy cứ thế này mà dừng lại,\\nthì cả hai người họ, và cả Olivy nữa, sẽ rất buồn.」"
2829 = "「Vậy thì——để đường ray không bị hỏng,\\nchỉ cần cảnh giác hay làm mấy việc tương tự là được hả?」"
2831 = "「Đúng như lời bé nói.\\nNhất định, em sẽ——làm.」"
2833 = "「Anh cũng không biết.\\nTrông giống hộp đựng mấy loại bánh kẹo nhỏ ấy.」"
2835 = "「Em cũng vậy ạ. Chỉ riêng ngài Soutetsu thôi——」"
2839 = "「Em đi đây ạ.」"
2840 = "「Công việc của chúng ta là đường sắt. Duy trì tuyến đường sắt.\\nĐiều đó cũng gắn liền với việc đảm bảo an toàn cho khu vực.」"
2841 = "「Chúng ta, đều rất tham lam.\\nChắc chắn là muốn mình trở thành số một trong lòng người ấy.」"
2843 = "「Tôi và Hachiroku sẽ đến hiện trường ngay.\\nTôi sẽ hỏi xem ông Seki và mọi người có thể đến được không.」"
2845 = "「——Tôi xin kính cẩn tuân mệnh.」"
2847 = "「Em không nghĩ là chị Mayami lại\\nđể rơi đồ chứa như thế này đâu ạ——」"
2848 = "「Em đã sắp xếp xong rồi ạ.」"
2851 = "「Tôi muốn nhờ \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; Akai cùng hai ông ấy và Nagi trao đổi thông tin,\\nđể lập danh sách các ứng viên giám sát thường trực.」"
2854 = "「Tôi hiểu rồi.」"
2856 = "「Tôi biết. Niiroku không biết gì cả,\\nchỉ là nhận lời nhờ vả của Olivy thôi.」"
2859 = "「Tôi sẽ mở bản đồ.」"
2860 = "「Chưa ăn sáng mà đã no rồi nha!」"
2861 = "「Chắc là do Niiroku đến thăm\\nnên mới có tác dụng chăng.」"
2863 = "「Vậy thì——kết quả……」"
2866 = "「Thời gian hai người cùng nhau tích lũy, sự gắn kết, chúng ta,\\nthế nên mới khao khát có được bao nhiêu cũng không thấy đủ.」"
2875 = "「Vậy thì, Olivy.」"
2876 = "「Nên là, Olivy cũng vậy, dù không được anh ấy nhận làm Master,\\nnhưng vẫn muốn trở thành \\x%lレイルロオド;#00ffc040;Railord%l;#; số một của Munakata.」"
2878 = "「Thế nên! Phải đi lúc đang khỏe chứ!\\nNhư vậy thì mới có thể nói là 『Dạo này cháu hơi mệt』 được.」"
2879 = "「Thế nên Olivy. Sẽ quan sát từ đây.」"
2880 = "「Nên Olivy. Biết được rằng, cái phần không được phép hỏng\\nbên trong Olivy, đã hỏng mất rồi.」"
2881 = "「Thế nên Olivy, mới luôn ghen tị\\nvới những Master và \\x%lレイルロオド;#00ffc040;Railord%l;#; đó!」"
2883 = "「Vậy, thứ tự thì sao? Ai nghỉ trước??」"
2885 = "「Thế?\\nNhiệt độ cơ thể, cô đã lấp liếm bằng cách nào?」"
2887 = "「Lập đội chính là như vậy đó. Olivy,\\nvì có thể trở thành bộ não của chúng tôi, nên mới được anh Munakata giao phó.」"
2889 = "「Có đòi hỏi những thứ không có cũng vô ích thôi. Tai nạn các thứ,\\nlàm gì có chuyện nó xảy ra theo ý mình chứ!」"
2893 = "「Đến thăm…… Bé Olivy,\\nờm——đã chấp nhận cho vào thăm sao ạ?」"
2894 = "「Là giếng chung.」"
2898 = "「Vì chưa thử nghiệm đủ nên không suôn sẻ,\\nthành ra nhiệt độ đo được lại thấp hơn dự tính sao.」"
2900 = "「Một khi đã xảy ra dấu hiệu bất thường rõ ràng,\\ntôi nghĩ chúng ta nên thiết lập cảnh báo thường trực cho đến khi tình hình có thay đổi.」"
2902 = "「Có chuyện gì vậy Hibiki?」"
2905 = "「Chào buổi sáng. Anh hai, Hachiroku, Oli——\\nỦa? Olivy đâu rồi?」"
2906 = "「Tôi đã tiếp nhận.」"
2908 = "「Đã rõ. Tôi sẽ bảo Navi đưa cô đến tận hiện trường.」"
2916 = "「Về việc quyết định sơ tán các thứ,\\nchúng ta có thể giao cho các chuyên gia đúng không?」"
2918 = "「Đúng vậy đó? Thế nên. Thế nên Olivy, đến Ohito!\\nTôi nghĩ thật tốt vì đã có thể đến Ohito!」"
2920 = "「Đúng vậy? Hôm qua, cùng với \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; Akai đó.」"
2923 = "「Là để chăm sóc bé Olivy sao ạ?」"
2924 = "「Để kịp chuyến tàu đầu tiên hả?」"
2925 = "「Nổ sao!? Ở phía thị trấn!!!」"
2928 = "「Cái này. Tôi đã năn nỉ Niiroku giúp bằng mọi giá.」"
2930 = "「Vâng! Em rõ rồi ạ, ngài Soutetsu.」"
2932 = "「Chúng tôi sẽ đi ngay. Vì đã hứa với Olivy rồi.」"
2934 = "「Vâng ạ. Thế nên khi gặp bé Olivy,\\nem nghĩ mình đã vô lễ mà tỏ ra quá phấn khích.」"
2935 = "「Công việc \\x%l保線;#00ffc040;bảo trì đường ray%l;#;——ở đây sao?」"
2942 = "「Ra là vậy…… Nếu giải thích rõ tình hình,\\nthì ông Seki và mọi người cũng dễ bề nghe ngóng hơn, sao.」"
2943 = "「Vậy, sao ạ?」"
2944 = "「Vậy sao!? Chỉ vì một lý do đơn giản thế thôi sao!?」"
2947 = "「Người ấy.」"
2949 = "「Em nhận ra điều gì sao?」"
2951 = "「Chuyện đó thì các chuyên gia đang xem xét——\\nNhưng chúng ta phải hành động với tình huống xấu nhất trong đầu.」"
2953 = "「Đúng là vậy.」"
2954 = "「Có thể sẽ là một cuộc chiến trường kỳ đấy.\\nSoutetsu, tuyệt đối đừng cố quá sức nhé.」"
2959 = "「Chuyến thăm ngắn đến mức đó sao ạ?」"
2960 = "「Đúng vậy.」"
2961 = "「Ừm. Xoay vòng 3 ca, mỗi ca 8 tiếng.」"
2962 = "「Đúng vậy. Vì đường sắt luôn có 『sứ mệnh đặt an toàn lên hàng đầu』 mà.」"
2963 = "「Đúng vậy. Vốn dĩ, bản thân suối nước nóng đã là biểu hiện của hoạt động núi lửa.\\nCó thể nói toàn bộ khu vực bao gồm cả địa điểm phình lên đều thuộc khối núi Kirishima.」"
2964 = "「Đúng vậy. Địa điểm phình lên là đoạn giữa ga Kirishima Onsen và ga Hayato.\\nNói chính xác hơn là đoạn giữa ga Kirishima Onsen và ga bỏ hoang Nakafukura——」"
2965 = "「Đúng vậy.\\nTôi muốn tiến hành việc đó song song với công việc trên tàu thông thường.」"
2966 = "「Ưm ưm, không có chuyện đó đâu?\\nChỉ là——thỉnh thoảng em có thức dậy thôi.」"
2976 = "「Bây giờ chị Paulette đang gọi điện thoại với chị Olivy,\\nvà đang đợi anh Soutetsu về đó ạ.」"
2979 = "「Ông Nagare cũng đã nói, có thể sẽ là một cuộc chiến trường kỳ.\\nCàng sớm càng tốt, dù sao cũng phải nhờ chuyên gia khám cho cô.」"
2982 = "「Một lát nữa, ông Nagare và ông Osamu sẽ đến đây.」"
2985 = "「Thích quá~! Hachiroku mát lạnh ghê~」"
2986 = "「Để làm được điều đó, xin cô hãy đánh cược vào khả năng kéo dài tuổi thọ.\\nTất cả chúng tôi, sẽ ở đây, giám sát thay cho Olivy.」"
2993 = "「Chỗ này, Reina sẽ giúp một tay ạ.\\nAnh Soutetsu thì」"
2995 = "「Reina có thể chuyển sang hỗ trợ Paulette được không?」"
2996 = "「Thông tin quá thiếu. Vì vậy, tôi muốn thu thập thông tin trên phạm vi rộng hơn. Cả phòng phòng chống thiên tai của thành phố Kirishima nữa——」"
2997 = "「Bỏ cuộc bây giờ là quá sớm. Ví dụ như ngày mai, có thể\\nsẽ phát hiện ra kiến thức mới liên quan đến \\x%lタブレット;#00ffc040;thẻ bảng%l;#; thì sao.」"
3003 = "「Vì đã nhờ họ khẩn cấp chở vật tư đến mà.\\nTuy hơi có lỗi, nhưng thật sự đã giúp ích rất nhiều.」"
3004 = "「Vì chuyện này có thể liên quan đến tính mạng con người và an toàn của khu vực.\\nTôi muốn ngăn chặn những sai lầm ngớ ngẩn do bị ép buộc làm việc.」"
3008 = "「Quả thực, dù ở đây có xảy ra chuyện gì——thì với gió và tuyết thế này,\\nở trong căn cứ bảo trì đường ray có lẽ cũng không thể nhận ra được âm thanh.」"
3009 = "「Chuyện đó thì, ừm.」"
3010 = "「Điều đó——quả thật là đúng như vậy ạ.」"
3015 = "「Theo đường chim bay thì cách khoảng 12km đó ạ.」"
3018 = "「Vậy, sao?」"
3020 = "「Liệu có làm được, không nhỉ. Olivy, trở thành bộ não của mọi người……\\nmọi người, trở thành mắt, thành tay của Olivy.」"
3022 = "「Tuyệt vời. Vậy thì, hãy ghi lại toàn bộ\\nđịa chỉ của những hộ gia đình có nước giếng bị lẫn cát nhé.」"
3024 = "「Giao toàn quyền, có được không?」"
3029 = "「Là ông Ishida! Ishida Kyoji.」"
3040 = "「Chuyện gì đang xảy ra vậy ạ.」"
3042 = "「Gì cơ!? 36.7 độ sao!\\nTất nhiên là vẫn trong phạm vi hoạt động ổn định…… nhưng mà.」"
3044 = "「Ngay khi kết thúc công việc trên tàu,\\nchúng tôi cũng sẽ đến đó, hẹn gặp lại lúc đó nhé.」"
3047 = "「Nói một cách đơn giản thì.」"
3053 = "「Không chỉ vậy đâu——Trong lúc Olivy ngủ,\\nviệc điều tra nghe ngóng, hoàn toàn không tiến triển gì đúng không?」"
3055 = "「Hơn nữa nếu đã hạ sốt rồi,\\nthì có khi sẽ cứ thế mà ổn định lại luôn đó!」"
3057 = "「Nếu là chuẩn bị để đội hoạt động, thì đã xong rồi.\\nNhờ vào khoảng thời gian mà Olivy và chúng tôi đã tích lũy từ trước đến nay.」"
3058 = "「Nghe nói trên núi có thể có tuyết rơi đấy ạ.\\nThật đáng lo ngại nhỉ.」"
3059 = "「Cho tôi xem bên trong được không?」"
3063 = "「Nếu mắc lỗi thì sẽ đón Olivy trễ mất.\\nThế nên, chúng ta hãy hoàn thành tốt công việc của mình nào.」"
3064 = "「Nếu bé Olivy nghĩ được như vậy,\\nthì em cũng thực sự rất hạnh phúc ạ.」"
3066 = "「Chắc là em tưởng tượng rồi ạ.」"
3071 = "「Dùng xe đạp không?」"
3074 = "「Nếu em không chạy được nữa thì anh sẽ cõng hoặc bế em.\\nKhông thành vấn đề.」"
3075 = "「Giá mà em cũng có thể tham gia thay ca thì tốt biết mấy.」"
3077 = "「Nếu để cậu biết, Hachiroku, cậu sẽ ngăn Olivy lại đúng không?\\nNên tôi mới giữ khoảng cách với Hachiroku——xin lỗi nhé?」"
3079 = "「Olivy ấy mà.\\nGiờ đang trong tình trạng không biết lúc nào sẽ dừng hoạt động đúng không?」"
3084 = "「Đúng——vậy ạ. Mong là sẽ như thế——\\nKhông, chắc chắn là sẽ như thế——Kya!?」"
3092 = "「Thì đúng là vậy, nhưng mà——」"
3093 = "「Quả thực…… là như vậy ạ.\\nGiả sử em có gục ngã giữa chừng trên đường ray——」"
3094 = "「Đúng vậy ạ.\\nAi cũng đang chìm trong giấc mộng——」"
3095 = "「Đúng vậy ạ. Chúng ta phải luôn mỉm cười, hướng về phía trước,\\nvà làm những gì chúng ta có thể làm lúc này.」"
3096 = "「Nói rồi! Tororyu-yu hình như cũng đã thảo luận\\nvới Tiến sĩ Fushicho và Công chúa Tàu điện rồi.」"
3099 = "「Cảm ơn. Nhưng mà, tôi muốn làm mát một chút.」"
3115 = "「——Nếu đuổi theo, e là sẽ càng làm cô ấy vội hơn.\\nCó chuyện gì thì Navi sẽ báo cáo lại thôi.」"
3116 = "「So với đêm qua, đã giảm gần năm độ một lúc.」"
3138 = "「Chuyện đó thì……\\nTheo như báo cáo tôi nhận được thì đúng là vậy.」"
3139 = "「Chuyện đó thì…… ừm, đúng là vậy——\\nNhưng mà, nếu nhờ Hibiki hoặc chị Mayami.」"
3140 = "「Lúc nãy, sao ạ?」"
3141 = "「Chắc là vậy rồi ạ.」"
3142 = "「Đừng có nói mấy lời yếu đuối thế.」"
3143 = "「Bên đó thì, cậu Soutetsu——à không,\\nTrưởng bộ phận Vận tải kiêm \\x%l保線部長;#00ffc040;Trưởng bộ phận bảo trì đường ray%l;#;, tôi có thể ủy quyền toàn bộ cho cậu được không?」"
3145 = "「Chà…… sao nhỉ.」"
3146 = "「Núi Shin'endake, là ở đâu vậy?」"
3147 = "「Lần đầu tiên được anh ấy nhờ vả, nếu hoàn thành điều được giao phó,\\nthì chắc chắn, tôi sẽ tiến gần hơn đến điều đó, tôi nghĩ vậy.」"
3148 = "「Và rồi mọi người sẽ trở thành đôi mắt, đôi tay của bé Olivy.\\nBé Olivy hãy trở thành bộ não của mọi người nhé.」"
3149 = "「Vậy sao, thế thì tốt quá~」"
3150 = "「Vậy, sao.」"
3151 = "「Vậy sao! Thế thì, tôi sẽ ôm sát cậu hơn nữa nhé.\\nÁp sát~」"
3152 = "「Vậy sao, nếu thế thì——để Navi đưa cô về ngay bây giờ.」"
3153 = "「Nhà ông lão dùng nước giếng đúng không?\\nLạ lắm! Nước giếng bị lẫn cát đó.」"
3154 = "「!」"
3155 = "「Cả \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; Akai nữa sao.」"
3159 = "「Rơi mất rồi.\\nDù trễ hơn dự báo khá nhiều.」"
3165 = "「Vậy thì, nhờ cô hỏi ông Ishida xem,\\nquanh đó có hộ nào dùng nước giếng nữa không nhé.」"
3167 = "「Trong lúc đó, bé Olivy thì sao ạ?」"
3169 = "「Chuyện đó, cô đã nói với ông Tororyu-yu chưa?」"
3170 = "「Ờ, thì——\\x%l共感;#00ffc040;cộng cảm%l;#;. Cậu có muốn thử tiếp nhận sâu hơn một chút không?\\nNếu Hachiroku không thấy phiền.」"
3173 = "「Vậy thì——\\n0400-1200. 1200-2000. 2000-0400, nhỉ?」"
3175 = "「Như vậy không được! Vì hôm nay,\\nkhông có ai khác rảnh rỗi cả đúng không?」"
3177 = "「Vậy thì! Bổn cô nương phải làm gì đây!?」"
3180 = "「Vậy, Olivy đi đây!!」"
3181 = "「Vậy thì! Mở rộng phạm vi ra một chút nhé——\\nChỉ một khoảnh khắc thôi, tôi sẽ ngừng chịu đựng nhé?」"
3184 = "「Nếu vậy thì, chắc là họ đã trao đổi qua lại bằng \\x%l共感;#00ffc040;cộng cảm%l;#; chăng——」"
3186 = "「Vậy thì, xin cô tuyệt đối đừng cố quá sức.\\nNếu thấy mệt thì liên lạc ngay, tôi sẽ bảo Navi đến đón.」"
3188 = "「Vậy thì!」"
3189 = "「Nhờ cô nhé. Còn kim chỉ nam hành động cụ thể cho phía \\x%l保線;#00ffc040;bảo trì đường ray%l;#; thì sao?」"
3190 = "「Nhờ cậu nhé. Này? Bé Olivy.\\nBây giờ chị đổi máy cho cậu Soutetsu nha.」"
3196 = "「Thế thì tốt quá rồi.\\nVậy bé Olivy thì sao?」"
3197 = "「Thế thì kìa! Đừng có làm vẻ mặt xị ra như thế chứ!\\nĐó là khuôn mặt cậu muốn cho anh hai xem từ sáng sớm sao?」"
3199 = "「Vậy thì, nhờ cả Kaori nữa!\\nCon bé đó cũng khá là có nghị lực đấy.」"
3202 = "「Vậy, tôi giao phó cho cậu. Chia sẻ thông tin định kỳ mỗi ba tiếng một lần.\\nNếu tình hình có thay đổi lớn, xin hãy báo cáo ngay lập tức.」"
3203 = "「Nếu bé đã nói vậy thì.」"
3206 = "「Vậy thì, cứ thế mà làm.\\nTrước mắt, thời gian trực của chúng ta là đến 0400 sáng mai.」"
3208 = "「Vậy. Cái này. Cho Olivy.\\nTuy có thể. Không giúp được gì.」"
3210 = "「Nếu vậy, em cũng sẽ quan sát từ đây ạ.」"
3212 = "「Vậy thì, em cũng xin đáp lễ ạ.\\nÁp sát.」"
3217 = "「Một tiếng nữa, chúng ta sẽ tập hợp ở túp lều bảo trì đường ray——căn cứ bảo trì đường ray.\\nTừ giờ đến lúc đó nếu có chuyện gì thì liên lạc cho cửa hàng đường sắt nhé.」"
3218 = "「Nếu vậy chúng ta cũng,\\nchuẩn bị cho công việc trên tàu mà không cần vội vã thôi ạ.」"
3219 = "「Vậy, anh đi đây.」"
3220 = "「Vậy hẹn gặp lại sau. Nhờ cô nhé.」"
3221 = "「Nếu vậy, để em đi cho ạ.」"
3222 = "「Rồi, giờ thì em đi ăn sáng ăn sáng đây!」"
3224 = "「Vậy thì, chỗ đường ray bị phình lên với\\ncái gì mà hoạt động núi lửa mạnh lên? Không liên quan sao?」"
3226 = "「Tức là——chuyện đó có nghĩa là sao?」"
3227 = "「Thế! Bổn cô nương phải làm gì đây?」"
3230 = "「Nếu vậy thì,\\nnhiệt độ thấp thì sẽ không bị giảm đúng không? Tuổi thọ ấy.」"
3231 = "「Vậy là, có chuyện gì ở địa điểm phình lên sao?」"
3232 = "「Nếu vậy thì sẽ có các khoản chi phí như tiền điện máy bơm.\\nNên tôi nghĩ là hội đồng khu phố sẽ có danh sách đấy.」"
3234 = "「Đồ làm mát! Túi đá! Nhiều thế này,\\nchắc chắn sẽ bị hỏi là 『Tại sao?』 mà.」"
3235 = "「Đã bảo là, dù có khám thì」"
3240 = "「Khả năng cao là có liên quan đấy.」"
3241 = "「Tôi cũng đã chia sẻ vụ nước lẫn cát rồi. Về phía thành phố Kirishima, họ đang xem xét\\nđến cả việc đưa ra khuyến cáo sơ tán cho các khu vực xung quanh.」"
3243 = "「Anh hai, cái gì đây?」"
3248 = "「Giảm rồi sao?」"
3250 = "「Tôi cứ tưởng là hỏng bét rồi! ——Nhưng mà!\\nSoutetsu và Hachiroku vẫn cho tôi đi, tôi vui lắm!」"
3251 = "「Tôi đã chuẩn bị tinh thần là lấp liếm thì sẽ bị lộ ngay,\\nnhưng không ngờ lại bị lộ theo cách này đó~」"
3252 = "「Tôi nghĩ người mới thì công việc trên tàu đã đủ bận rộn rồi——\\nNhưng nếu Nagi đánh giá cao như vậy, thì cứ thử nói chuyện xem sao.」"
3253 = "「Dù đơn giản, nhưng vẫn chiếm một diện tích nhất định nhỉ.\\nNếu có thể tìm được không gian rộng rãi gần đây thì tốt nhất rồi.」"
3254 = "「Anh Soutetsu~!!」"
3255 = "「Anh Soutetsu~! Hình như có chuyện gì đó xảy ra rồi ạ.」"
3256 = "「Cậu Soutetsu, xem cái này đi.」"
3257 = "「Cậu Soutetsu.\\nChuyện này nghiêm trọng đến mức nào vậy?」"
3258 = "「『Đêm nay ít nhất hãy ngủ một giấc thật ngon, để chuẩn bị cho những ngày tới』\\n……Người nói câu đó, chẳng phải là ngài Soutetsu sao ạ.」"
3259 = "「Ngài Soutetsu, bé Olivy sao rồi ạ!?」"
3260 = "「Ngài Soutetsu, chúng ta đi thôi ạ.」"
3261 = "「Ngài Soutetsu?」"
3262 = "「Soutetsu! Nè, bây giờ,\\ntôi đang ở nhà ông lão giống Soutetsu đó!」"
3264 = "「Điện thoại, là từ phòng phòng chống thiên tai của thành phố Kirishima.」"
3266 = "「Cảm ơn mọi người. Tôi cảm thấy rất vững tâm.」"
3269 = "「Dù rất vui, nhưng sao lại thế nhỉ?\\nQuả nhiên, chỉ vậy thôi thì vẫn chưa đủ.」"
3271 = "「38.2 độ sao. Hơi thấp một chút, nhưng rất ổn định.」"
3273 = "「Okay! Tôi sẽ làm vậy.」"
3274 = "「Ho-he-fu-ha-ha.」"
3497 = "Vừa hỏi Olivy, Olivy liền\\ntruyền đạt lại câu trả lời từ ông Ishida cho tôi."
3499 = "Nghĩ vậy, lời nói tự nhiên cũng trở nên ôn hòa."
3500 = "Đưa ra quyết định, tâm trạng tôi bình tĩnh lại.\\nNhững việc cần làm, chỉ cần lần lượt thực hiện là được."
3503 = "Ngay khoảnh khắc nhìn thấy, những cảm giác sai sai nhỏ nhặt từ sáng nay,\\nđã kết nối lại với nhau, bắt đầu hình thành một hình dáng."
3511 = "Rồi từ từ, em ấy khẽ gật đầu."
3513 = "Không được. Điều em nên nhìn lúc này,\\nkhông phải là những tưởng tượng tồi tệ, mà là hiện thực trước mắt."
3515 = "——Việc cô ấy đưa cả chức danh Trưởng bộ phận Vận tải ra, có nghĩa là\\ntùy theo tình hình, tôi có thể thay đổi cách vận hành phương tiện."
3517 = "Vị trí mà chúng tôi đã luôn cố gắng hướng tới đó,\\ncả tôi và Olivy, cuối cùng cũng đã có thể quay trở lại."
3520 = "Lý do em khao khát có một đứa con với ngài Soutetsu,\\ncuối cùng, em cũng đã hiểu được."
3527 = "Thời gian làm việc đã được định sẵn, dù có vội vàng ăn sáng,\\nthì cũng chẳng thay đổi được gì——"
3528 = "Nếu cái \"có vẻ khó ngủ\" mà Hibiki cảm nhận được,\\nthì chắc hẳn nó đã thể hiện rất rõ ra bên ngoài rồi."
3530 = "Chắc là lời nói của Hachiroku đã có tác dụng.\\nOlivy gật đầu một cách vô cùng ngoan ngoãn."
3536 = "Vì phòng chống thiên tai, vì duy trì vận tải đường sắt——\\nKhông chỉ vậy, chắc chắn còn là vì muốn thực hiện mong ước của Olivy."
3542 = "Khác với Hibiki làm việc trên tàu từ buổi chiều,\\nhôm nay chúng tôi phải làm từ sáng."
3547 = "Vậy thì, hãy hướng sự chú ý sang chuyện khác."
3549 = "Dù vậy, một người mới,\\nlại còn là phụ nữ, thì tôi không thể nào sắp xếp vào ca trực đêm được."
3551 = "Nhưng, chúng tôi tin chắc điều đó.\\nNên chúng tôi có thể đảm bảo không chút do dự."
3561 = "Trong khoảng thời gian này, nếu như có thảm họa xảy ra,\\nthì thiệt hại sẽ lớn đến nhường nào chứ."
3565 = "Chỉ cần vậy thôi, cũng đủ để lấp đầy cơn khát trong em.\\nThế nên, em có thể thành thật. Nói ra những suy nghĩ nảy ra trong đầu mình."
3570 = "Cả Hibiki và chị Mayami, dù mức độ khác nhau,\\nnhưng đều đang trong tình trạng làm việc quá sức, và không ngủ đủ giấc."
3573 = "Giọng nói của Hachiroku rất tĩnh lặng."
3574 = "\"Không đuổi theo sao ạ?\", Hachiroku dùng ánh mắt để hỏi."
3577 = "Bốp, Hachiroku dùng hai tay áp chặt vào má mình.\\nRồi nắn nắn, xoa lên xoa xuống."
3579 = "Giọng Hachiroku vô cùng hoảng hốt——như một tiếng hét.\\nNgay lập tức, Olivy cứng đờ người lại."
3580 = "Hachiroku chăm chú nhìn Olivy.\\nOlivy cũng không né tránh ánh mắt, chăm chú nhìn lại."
3582 = "Hachiroku lập tức nối máy điện thoại với ông Nagare."
3585 = "Hachiroku lập tức mở sổ tay ra."
3597 = "Nagi đã hiểu và chấp nhận."
3600 = "Olivy vừa ngậm nhiệt kế vào miệng."
3605 = "Dù em có muốn ngăn cản đến nhường nào……\\nThì chắc chắn em cũng không thể nào ngăn cản được."
3619 = "Chịu đựng nỗi đau đớn khủng khiếp đến nhường này,\\nmà vẫn còn điều muốn hoàn thành cho bằng được——"
3622 = "Nếu bị cuốn vào, bị nuốt chửng thì sẽ được giải thoát——\\nMột lời mời gọi quá đỗi ngọt ngào để từ bỏ tất cả."
3623 = "Nở nụ cười tươi như hoa, Olivy——!?"
3624 = "Chiếc đèn bão đã bị cơn gió mạnh thổi tắt,\\nđược bé Olivy cẩn thận thắp sáng lại một lần nữa."
3627 = "Không phải hỏi ý kiến, mà chỉ cần báo cáo là được.\\nPaulette tin tưởng tôi đến mức đó."
3629 = "Nhưng, dù vậy, chúng ta——\\nchắc chắn đều khao khát một điều giống nhau."
3633 = "Nhưng…… dù nhiệt độ không hạ xuống,\\nthì cũng không hẳn là sẽ dẫn đến việc ngừng hoạt động ngay lập tức."
3635 = "Nhưng…… dù có đuổi theo thì cũng chẳng giúp ích được gì.\\nTôi cũng không muốn làm lãng phí khoảng thời gian quý giá của Olivy như vậy."
3637 = "Nhưng, với mức đó…… nếu quy đổi sang con người thì giảm một mạch\\nxuống còn 34-35 độ, ngược lại tôi cảm thấy có vẻ nguy hiểm."
3639 = "Nhưng, tôi chưa từng nghe thấy Hachiroku hay Olivy\\nphát ra tiếng động từ cổ họng ngoài lúc ăn uống——"
3640 = "Nhưng, dù biết là hơi ích kỷ, trong thâm tâm em,\\nvẫn cảm thấy vui sướng vì được độc chiếm nụ cười ấy——một nụ cười như vậy."
3644 = "Vậy mà bé ấy không hề nhúc nhích.\\nKhông nghe thấy tiếng trả lời, cũng không nhận được chút \\x%l共感;#00ffc040;cộng cảm%l;#; nào."
3647 = "Tôi hỏi nhưng Reina chỉ lắc đầu quầy quậy.\\nCó vẻ em ấy chưa nghe được chi tiết đến mức đó."
3670 = "Vì Olivy đã từ chối khéo chuyện Hachiroku đến thăm với lý do\\n『Không muốn làm cậu lo lắng vì thấy tôi đau đớn hay khổ sở』."
3671 = "Công việc của bé Olivy,\\nem phải giúp bé ấy một tay mới được."
3672 = "Trong bóng tối,\\nem cảm nhận được bé Olivy đang gật đầu."
3680 = "Thật sự mọi người đã chủ động đề nghị hợp tác một cách tích cực đến kinh ngạc.\\nKhông chỉ người dân Ohito, mà cả người dân Yui và Jutsusen nữa."
3707 = "Không chỉ hoạt ngôn và thân thiện,\\nOlivy thực ra còn rất giỏi lắng nghe."
3708 = "Bé Olivy, lại bắt đầu lao đi.\\nHướng về phía căn cứ bảo trì đường ray."
3709 = "Đôi tay bé Olivy nắm chặt lại,\\nnhỏ bé, nhưng đầy kiên định."
3710 = "Bé Olivy, như thể đang làm nũng,\\ntựa hẳn vào người em."
3711 = "Món thạch một miếng mà Olivy lấy ra từ túi.\\nRa là vậy. Chính là cái vỏ hộp rơi trên sàn sáng nay."
3712 = "Ánh mắt bé Olivy rời khỏi em.\\nChăm chú nhìn vào hiện trường phình lên, như thể đang âu yếm nó vậy."
3713 = "Nhiệt kế Olivy đưa ra là——"
3714 = "Đầu ngón tay của bé Olivy,\\nnhẹ nhàng nắm lấy đầu ngón tay em——"
3715 = "Lòng bàn tay Olivy hướng lên trời.\\nBông tuyết rơi trên đó, tan biến ngay trong chớp mắt."
3716 = "Vẫn giữ nguyên nụ cười, Olivy\\nlấy đồ bên trong chiếc hộp giữ nhiệt mà Niiroku gửi gắm ra."
3717 = "Một giọng nói lớn đến kinh ngạc.\\nBé Olivy gật đầu liên tục, ra chiều rất đồng tình."
3718 = "Olivy dùng hai tay đẩy bật cơ thể tôi đang định đỡ lấy cô ấy ra,\\nvà cố gắng trụ vững ở tư thế ban đầu."
3719 = "Bịch, Olivy lao vào ô của chúng tôi.\\nChỉ vậy thôi, không phải nói quá, tôi cảm thấy ấm áp hẳn lên."
3720 = "Bé Olivy, cúi gầm mặt xuống.\\nRồi khẽ khàng, rụt rè, ngước lên nhìn em."
3721 = "Run rẩy, bé Olivy khẽ rùng mình."
3722 = "Nghe vậy, Olivy cười khổ."
3723 = "Nghe vậy, Olivy gật đầu cái rụp."
3724 = "Nói rồi, Olivy ngước nhìn bầu trời đêm."
3725 = "Nói rồi, bé Olivy ngước nhìn lên bầu trời."
3726 = "Olivy cúi gầm mặt xuống,\\nnhưng ngay lập tức ngẩng lên với vẻ hốt hoảng."
3727 = "Lặng lẽ, tĩnh lặng.\\nBé Olivy gật đầu."
3728 = "Nụ cười của bé Olivy thật sự rất dịu dàng."
3729 = "Olivy——với vẻ mặt có chút ngơ ngác.\\nRồi từ từ, từ từ từ từ, cô ấy mấp máy môi."
3730 = "Như trút được gánh nặng, Olivy\\nlấy một túi đá trong vô số túi đá ra, áp lên cổ."
3732 = "Olivy hững hờ như mọi khi,\\nrút nhiệt kế ra khỏi miệng——"
3733 = "Chăm chú nhìn vào biểu đồ đường gấp khúc,\\nghi lại nhiệt độ cơ thể của Olivy."
3736 = "Đầu ngón tay bé Olivy,\\nlại một lần nữa nắm lấy em."
3738 = "Đúng hơn là Olivy đang sợ hãi điều gì đó——\\nnhư thể đang trốn chạy khỏi tôi vậy,"
3739 = "Chỉ là trượt chân ngã thôi.\\nCú ngã vừa rồi, là kiểu ngã như vậy."
3742 = "Một nụ cười nhẹ nhõm từ tận đáy lòng.\\nNgay khoảnh khắc nhìn thấy, trái tim tôi cũng trở nên mềm mại."
3744 = "Như thể đang tìm kiếm manh mối,\\nánh mắt cô ấy cứ đảo quanh——"
3746 = "Một chiếc túi lớn——túi giữ nhiệt."
3747 = "Maruyama Kaori——Người cuối cùng cũng vượt qua được cuộc tuyển chọn gắt gao của Paulette\\nđể gia nhập Đường sắt Ohito, là một nhân viên \\x%l庫内手;#00ffc040;rửa lò%l;#; kiêm \\x%l機関助士;#00ffc040;phụ lái tàu%l;#; tập sự mới."
3752 = "Cô ấy làm những việc chỉ cô ấy mới làm được.\\nTất nhiên chúng tôi cũng vậy."
3753 = "Cảm ơn nhé, Olivy nở nụ cười rạng rỡ không chút muộn phiền."
3755 = "Lý do bé Olivy đã cố gắng hết sức mình đến tận lúc này,\\nđể 『hoàn thành điều được giao phó』, cuối cùng em cũng đã hiểu được."
3757 = "Nếu là \\x%lタブレット;#00ffc040;thẻ bảng%l;#; bị hỏng, thì không thể sửa được.\\nCả ông Tororyu-yu, Tiến sĩ Fushicho, hay bất kỳ ai khác cũng vậy."
3762 = "Làm sao mà không sao được chứ.\\nNhưng mà, nếu không tỏ ra không sao thì——"
3763 = "Nếu vậy thì——hoặc là. Tình trạng của Olivy,\\ncó lẽ còn nghiêm trọng hơn nhiều so với những gì tôi nhận thức được——"
3766 = "Đối với bé Olivy, ngài Munakata\\ncũng giống như ngài Soutetsu đối với em vậy."
3768 = "Thời gian yên tĩnh cứ thế trôi qua——"
3770 = "Đúng vậy, không phải là không có.\\nVậy thì, không cần phải tuyệt vọng."
3774 = "Trong lúc tôi và Hachiroku nói chuyện,\\nOlivy vẫn đứng chôn chân ở đó với vẻ không thoải mái."
3777 = "Nếu là 『điều bé Olivy mong muốn』,\\nthì chị gái và em gái nuôi của em, chắc chắn cũng sẽ lặng lẽ chấp nhận thôi."
3778 = "Ngay cả cách để kéo dài phần đời còn lại,\\nchúng tôi cũng đã được nghe rõ là không còn cách nào khác ngoài những gì hiện có."
3781 = "Việc bé Olivy vẫn nhớ mong ước của em,\\nmong ước của em và ngài Soutetsu——"
3796 = "Từ cuộc trò chuyện vừa rồi cũng có thể cảm nhận được.\\nViệc Olivy liên tục sốt cao cũng khiến Hachiroku trở nên nhạy cảm."
3824 = "Nghĩ lại, em chợt thấy bất an.\\nĐêm ngày thường. Mọi người đều ở nhà và đang say giấc."
3826 = "Ý nghĩa của thông tin này,\\nchắc chắn phòng phòng chống thiên tai của thành phố Kirishima sẽ đánh giá chính xác được."
3828 = "Vì muốn truyền đạt cho bé Olivy hiểu——\\nem cũng chủ động tựa vào bé ấy."
3829 = "Bịch. Lại thêm một luồng hơi ấm."
3830 = "Tôi không có cảm giác bị từ chối."
3834 = "Lập thành một đội. Đứng trên đội đó, hướng tới kết quả của cả tập thể.\\nTrong hơn 100 năm kinh nghiệm, chỉ duy nhất phần đó là hoàn toàn trống rỗng."
3836 = "Vừa nói, tôi vừa liếc nhìn nét mặt của Hachiroku.\\nMột biểu cảm tinh tế, có vẻ bối rối nhưng cũng có vẻ mỉm cười."
3842 = "Đang đo nhiệt độ cho Hachiroku ở tư thế quen thuộc,\\nnên chúng tôi cũng không thể nhúc nhích."
3843 = "——Sau khi bàn bạc kỹ lưỡng chi tiết về ca trực và các thứ khác,\\nông Nagare lên đường trở về Ohito."
3844 = "Sau khi hoàn tất thủ tục đỗ xe, tôi mở cửa ra——"
3845 = "Chấp nhận hiện trạng, không bỏ cuộc.\\nLuôn tìm kiếm điều tốt nhất từ nơi mình đang đứng——"
3847 = "Bảo bé Olivy phải chịu đựng nỗi đau đớn đó——\\nEm không thể nào mở miệng cầu xin bé ấy được nữa."
3849 = "Cùng Hachiroku đang nghiêng đầu bước vào phòng khách——"
3851 = "Em kìm nén những giọt nước mắt chực trào, đỡ bé Olivy dậy."
3854 = "Tôi xác nhận ngắn gọn những điểm chính,\\nrồi cúp máy, quay sang \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; Akai."
3857 = "Gì vậy? Giống như tiếng nuốt nước bọt……"
3860 = "Em đang gật đầu. Cơ thể tự động phản ứng.\\nTrái tim, đang cất lời."
3861 = "Em tuyệt vọng chạy đến,\\nđỡ lấy bé Olivy đang gục ngã——!?"
3864 = "Theo quy trình thường lệ, kiểm tra nhiệt độ trong miệng Hachiroku."
3865 = "Em khẽ nghiêng chiếc ô để không che khuất tầm nhìn của bé ấy,\\nmột bông tuyết rơi xuống chiếc mũi xinh xắn, rồi tan biến trong chớp mắt."
3866 = "Ngay cả việc phủ nhận suy nghĩ đó, em cũng không thể làm được nữa."
3869 = "Phần da thịt lộ ra ngoài trang phục của em, chỉ có một chút xíu."
3870 = "Cảm giác rờn rợn khó tả mà tôi cảm nhận được,\\nkhông biết Hibiki có cảm nhận được không?"
3872 = "Khi em ngoan ngoãn gật đầu thừa nhận,\\nbé Olivy liền bật cười khúc khích như thể bó tay."
3874 = "Sinh mệnh của bé Olivy đang rực cháy——\\nHơi nóng của ngọn lửa đó, đang truyền sang em."
3875 = "Tôi thở ra một hơi dài, chậm rãi.\\nCố ý làm ra vẻ mặt nghiêm túc."
3878 = "Em không thể hít vào——không thể thở ra——được nữa.\\nNước mắt, tuôn rơi lã chã."
3879 = "Để thu thập thông tin và gạt bỏ sự bi quan,\\ntôi nửa ép buộc chuyển chủ đề, khiến Olivy phát ra tiếng kêu kinh ngạc."
3881 = "Thế nên, từ miệng tôi,\\nnhững thông tin vừa nhận được sẽ được truyền đạt lại với độ chính xác được đặt lên hàng đầu."
3884 = "Vì vậy, khi bị từ chối khéo bằng câu 『Cô bé hay đến đâu rồi?』\\n——Báo cáo của ông Seki và mọi người xen lẫn những nụ cười khổ."
3890 = "Đúng rồi. Hoàn toàn không có thời gian để nói chuyện phiếm.\\nTôi nhanh chóng sửa soạn đồ đạc."
3895 = "Một nỗi đau đớn cuộn trào như bão táp."
3896 = "Tôi mở chiếc ô đã chuẩn bị sẵn, Hachiroku nhẹ nhàng bước vào."
3897 = "——Bịch. Hơi ấm tăng lên."
3908 = "Một tiếng cười như phụt ra.\\nDù đang là mùa đông nhưng Hibiki lại phẩy phẩy tay quạt cho khuôn mặt mình."
3910 = "Thứ Hibiki nhặt lên,\\nlà một chiếc cốc nhựa nhỏ."
3911 = "Đột nhiên Hibiki, khẽ chọc vào má Hachiroku."
3913 = "Vùng mắt của Hibiki khi vươn vai thật lớn,\\ntrông có vẻ hơi sưng."
3916 = "Với những bước đi dài hơi mang tính diễn kịch,\\nHibiki hướng bước chân về phía nhà bếp——"
3919 = "Dù tư thế của bé Olivy và em,\\nhoàn toàn không thay đổi."
3920 = "Dù ở trong căn cứ bảo trì đường ray, nhưng ngay cả tiếng thở đều đều của ngài Soutetsu đang ngủ,\\ncũng không thể truyền đến tai em."
3922 = "Nhiệt kế của Olivy kêu trước."
3923 = "Là tuyết."
3929 = "Có nên gọi anh Munakata đến ngay bây giờ không——\\nSuy nghĩ đó thoáng qua trong đầu tôi."
3932 = "Không thể nào để một \\x%lレイルロオド;#00ffc040;Railord%l;#; đầy kiêu hãnh này,\\ncứ gục ngã trên mặt đất mãi được."
3942 = "Cúi chào một cái, ngay lập tức,\\nPaulette bắt đầu gọi điện thoại."
3943 = "Bầu không khí của Paulette đã thay đổi.\\nCô ấy đã bật công tắc chuyển sang trạng thái mạnh mẽ nhất của mình."
3944 = "Chắc là cô ấy đã vội vàng tìm kiếm giúp.\\nPaulette chỉ cho tôi thông tin hiển thị trên màn hình."
3945 = "Paulette vẫn đang gọi điện thoại."
3951 = "Bé Olivy đang định lao đi liền dừng lại.\\nQuay ngoắt lại nhìn em."
3954 = "Để truyền đạt cho cô ấy hiểu——\\ntôi từ từ, thận trọng chọn lọc từng từ."
3960 = "Rồi cô ấy khẽ mỉm cười,\\nmột nụ cười ngượng ngùng và có chút bối rối——"
3975 = "Lúc nãy vì có ông Nagare ở đây nên tôi không thể hỏi được——\\nNhưng vì Olivy, tôi sẽ giải quyết vấn đề này sớm."
3976 = "Vì cô bé còn nhỏ nhắn hơn cả Nagi,\\nnên tôi tự hỏi về mặt thể lực thì liệu có ổn không——"
3978 = "Việc để lại. Việc truyền đạt lại.\\nĐiều đó quả thực, không cần phải truyền cho thế hệ sau, cũng có thể thực hiện được."
3979 = "Tất nhiên là, Hibiki không thể nhận được \\x%l共感;#00ffc040;cộng cảm%l;#;."
3983 = "Đúng là, với \\x%l運転体;#00ffc040;kíp lái%l;#; thì việc mua sắm cũng bất tiện.\\n\\x%l機関士;#00ffc040;Nhân viên cơ vụ%l;#; Akai, dù là chuyện thường ngày nhưng cũng vất vả thật."
3986 = "Sống lưng tôi lạnh toát trong chốc lát,\\nnhưng đã được xoa dịu bởi câu nói tiếp theo."
4001 = "Vừa dừng đúng vị trí,\\nReina đã đập rầm rầm vào cửa \\x%l運転台;#00ffc040;buồng lái%l;#;."
4004 = "Người mà bé Olivy đang nghĩ đến,\\nvà ngài Soutetsu mà em đang nghĩ đến, tất nhiên, hoàn toàn khác nhau."
4006 = "Và rồi, ở một nơi không có ai——\\nhọ sẽ âm thầm rơi những giọt nước mắt cô đơn."
4008 = "Chỉ cần áp phần má nhỏ bé ấy vào má bé Olivy,\\nbé ấy liền bật cười với giọng điệu vô cùng hạnh phúc."
4011 = "Kisaki và Fukami cũng là những nhân lực không thể chuyển sang \\x%l保線;#00ffc040;bảo trì đường ray%l;#;——À,\\nnếu được thì tôi sẽ nhờ cả chị Mayami hỗ trợ phía sau nữa."
4014 = "Em không còn chút suy nghĩ ích kỷ nào muốn độc chiếm nụ cười này nữa.\\nCho ngài Soutetsu, cho Hibiki, cho chị Mayami, cho Nagi, cho Fukami, cho cô Kisaki."
4016 = "Đồng thời, điều đó cũng cho thấy Paulette sẽ phải hoạt động hết công suất——\\nvà có khả năng trong lúc khẩn cấp, chúng tôi sẽ không thể dựa vào năng lực của cô ấy."
4017 = "Nghe vậy, tách.\\nĐiểm tư duy của em được chuyển đổi."
4018 = "Nghe tôi nói, Hachiroku lại tỏ vẻ bất mãn."
4020 = "Kể từ vụ nghi ngờ rò rỉ khí ga, chúng tôi đã chia sẻ thông tin rất chặt chẽ."
4021 = "Làn da chạm vào nhau, nóng đến mức em có thể cảm nhận được rõ ràng."
4023 = "Nếu được ở bên nhau, thì dù có bị đuổi đến tận cùng thế giới,\\ncũng chẳng có gì phải sợ hãi——"
4027 = "Bản đồ được hiển thị trên màn hình.\\nNúi Shin'endake được đánh dấu bằng khung chú thích màu đỏ rất dễ nhìn."
4043 = "Mặc dù vậy, tôi vẫn cảm thấy có chút vội vàng."
4044 = "Nếu là hỗ trợ Paulette thì ngoài Reina ra không ai khác có thể làm được."
4045 = "Cái dáng vẻ chạy vụt đi đó, càng củng cố thêm cảm giác tôi vừa nhận được——\\n\"như thể đang trốn chạy\"."
4046 = "Run rẩy, bé Olivy lại rùng mình một lần nữa."
4047 = "Run rẩy, cơ thể Olivy run lên."
4062 = "Đó là sự thật không thể chối cãi."
4063 = "Tập hợp đầy đủ vật tư và dụng cụ để bảo trì,\\nvới không gian và thiết bị đủ để nghỉ ngơi dù chỉ là tạm bợ."
4064 = "Khi hạ sốt, giảm một mạch hơn 5 độ thì……\\nNgay cả con người, nếu sốt trên 40 độ thì cũng có thể xảy ra, nhưng——"
4065 = "Cho cô Paulette, cho Reina, cho Niiroku, cho \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; Akai.\\nEm chỉ muốn truyền đạt lại những lời vừa rồi, cho tất cả những người có duyên gặp gỡ."
4070 = "Vậy thì, điều cần xây dựng bây giờ là hệ thống giám sát bảo trì đường ray tốt nhất——\\nSự luân phiên của những người có kinh nghiệm, kết hợp với những người chưa có kinh nghiệm."
4071 = "Vậy thì để khả năng hành động áp đảo đó không bị lãng phí,\\ntôi muốn định ra và giao cho em ấy một kim chỉ nam hành động rõ ràng."
4073 = "Vậy thì làm theo lời Hibiki dạy, tôi cũng phải mỉm cười.\\nĐể tiếp thêm can đảm cho vợ mình, tôi sẽ cố gắng cười tươi nhất có thể."
4074 = "Nếu vậy thì nội dung cuộc điện thoại là——"
4081 = "Mặt đất gầm gừ, không khí cũng rung chuyển dữ dội."
4082 = "Lớp tuyết mỏng vừa mới bắt đầu tích tụ, nhanh chóng tan chảy.\\nThành hình dáng bé Olivy đang nằm——và lan ra xung quanh."
4084 = "Đừng vội vàng, đừng hoảng hốt, cứ thong thả——\\nCó vẻ như tôi đã quán triệt điều đó hơi quá đà rồi."
4085 = "Đó là sự thật không thể chối cãi, nhưng không ngờ vào lúc này,\\nHachiroku lại chỉ ra điều đó."
4086 = "Ngài Soutetsu thỉnh thoảng gọi nó là \"túp lều\",\\nnhưng thực ra, nó không hề nhỏ bé chút nào."
4089 = "Bằng một giọng điệu mạnh mẽ hiếm thấy,\\nOlivy cắt ngang lời Hachiroku."
4093 = "Thông tin thì phía thành phố Kirishima cũng sẽ thu thập,\\nnếu chúng ta nhúng tay vào việc thừa thãi, thì chỉ chuốc lấy hỗn loạn mà thôi."
4097 = "Từ bầu trời mà Olivy đang ngước nhìn,\\nnhững bông tuyết lả tả rơi xuống."
4104 = "Âm thanh như thể có thứ gì đó phát nổ——!!?"
4124 = "（Không, bình tĩnh lại đi Soutetsu. Bị sự bi quan lôi kéo thì làm được gì.\\nPhương hướng lớn đã định rồi. Olivy cũng đã đồng ý. Nếu vậy thì——）"
4128 = "（Lúc nãy tôi lỡ lời rồi. Để không kích động Olivy,\\ntốt nhất là cứ giữ yên lặng, đừng nôn nóng.）"
