1658 = "——A, thật là một nụ cười rạng rỡ làm sao.\\nThật tiếc vì không thể cho ngài Soutetsu cùng xem——"
1659 = "——Bé ấy đã nói là không phải vì lạnh.\\nVậy thì càng cần có người ở bên cạnh hơn nữa."
