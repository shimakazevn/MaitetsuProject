1757 = "「……Tuổi thọ của Olivy, nếu hoạt động lúc đang sốt cao,\\nthì tải trọng sẽ tăng quá mức và bị giảm đi đúng không?」"
1759 = "「……Từ đường ray của chúng ta,\\ntrông có vẻ cách khá xa đấy ạ.」"
