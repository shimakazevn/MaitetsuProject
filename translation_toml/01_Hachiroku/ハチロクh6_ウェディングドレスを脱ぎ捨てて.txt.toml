1316 = "Nhưng bây giờ tôi vẫn liều mạng chịu đựng, từ từ——từ từ——đẩy hông——đẩy hông——tiến sâu, hơn nữa!"
1320 = "Chuẩn bị kỹ càng, tôi nhẹ nhàng dời những đầu ngón tay vẫn luôn lặp đi lặp lại sự vuốt ve dai dẳng khỏi núm vú của Suzu——thì——"
1329 = "Tôi chặn lấy đôi môi Suzu, đôi môi đang thốt ra những lời không rõ ràng, không thành câu, nhưng chính vì thế lại truyền đạt một cách hùng hồn nhất."
1330 = "Cô bé đáng yêu của Suzu nhìn thì vô cùng đơn giản, nhưng dù đã nới lỏng thỏa mãn và run rẩy, nó vẫn ôm chặt lấy cậu bé của tôi!"
1335 = "Bị cậu bé cương cứng đến cực đại của tôi đâm xuyên qua——a."
1340 = "Tôi ban nãy, có lẽ đã hóa thành một con thú—— chẳng khác nào một con đực đang khao khát con cái."
1341 = "Khoảnh khắc nhận ra sự khác biệt là điều tốt, nhịp điệu lại ăn khớp hoàn hảo. Tăng tốc. Nóng bỏng."
1345 = "Bằng chính đôi tay mình, tôi bế cô dâu đang khoác trên mình bộ váy cưới, đưa đến chiếc giường tân hôn."
1347 = "Phải chăng em đã tự nhận thức được điều đó."
1348 = "Ra là vậy, khoái cảm khi bị bóc ra sao. Hay là——đúng rồi. Khoái cảm khi bóc vảy vết thương."
1354 = "Tất nhiên, khi tập trung ý thức, độ nhạy cảm của cậu bé cũng tăng lên."
1355 = "Ánh mắt đáng sợ sao. Cũng phải thôi."
1357 = "Bị kích thích bởi chiếc lưỡi đang vùng vẫy vì kinh ngạc của Suzu, nhịp thở và nhịp điệu của tôi lại bị rối loạn, sinh ra khoái cảm."
1366 = "Nước bọt hòa lẫn với dịch nhờn không ngừng trào ra từ khóe miệng, chảy dọc xuống cằm, thấm đẫm cổ áo, nhuộm ướt chiếc váy."
1367 = "Niềm vui sướng ấy khiến cậu bé của tôi giật nảy lên, mỗi lần như vậy lại làm chiếc nhẫn của Suzu run rẩy và biến dạng."
1370 = "Theo tiếng gọi khao khát ấy, tôi tiến sát mặt lại gần Suzu."
1381 = "Những giọt mồ hôi lớn lăn từ trán xuống má, rơi bộp lên phần bụng phẳng lì của Suzu."
1383 = "Quá sung sướng, quá khít khao, kích thích tình dục mạnh mẽ đến mức ngay cả một thằng đàn ông như tôi cũng sắp ngất xỉu."
1387 = "Trở thành vợ chồng, không phải là kéo nhau lại gần, mà chắc chắn là——công nhận giá trị ngang bằng của nhau, dù cho có khác biệt."
1388 = "Không hề phủ nhận sự thèm khát tinh dịch. Sự đáng yêu ấy khiến tôi muốn thành thật đáp lại em."
1391 = "Không biết là đang đáp lại, hay là không, toàn thân Suzu phô bày những chuyển động hết mình."
1393 = "Để thúc giục—— những lời nói bị ngắt quãng bởi tiếng thở dốc, tôi khẽ thì thầm vào tai em."
1394 = "Ngay cả việc thốt ra những lời đó, cũng làm tăng thêm ý thức và đẩy khoái cảm lên cao hơn."
1396 = "Khuôn mặt nhỏ nhắn đáng yêu áp sát, nũng nịu bám lấy tôi, cọ cọ không ngừng."
1399 = "Thở ra một hơi đầy hạnh phúc. Suzu tiếp tục dán chặt ánh mắt vào tôi."
1401 = "Lưỡi rụt lại vào trong miệng, một thoáng chốc, khóe miệng em khẽ cử động nhai nuốt thật đáng yêu."
1403 = "Bị dẫn dắt bởi sự thôi thúc mãnh liệt trỗi dậy từ giọng nói nũng nịu ấy, tôi ôm chặt lấy cơ thể Suzu."
1404 = "Đã truyền đạt được. Đã được chấp nhận."
1406 = "Mỗi lần cảm nhận khoái cảm ở núm vú, chiếc lưỡi dường như lại rụt vào."
1407 = "Không hề mở to mắt ngạc nhiên. Như thể đã biết trước, Suzu chỉ lặng lẽ mỉm cười."
1410 = "Một lời nài nỉ quá đỗi đáng yêu và chân thành khiến lý trí tôi như tan chảy hoàn toàn."
1412 = "Bằng đôi mắt trông vừa chan chứa yêu thương, lại vừa thoáng nét đượm buồn."
1413 = "Cùng với lời đáp, khuôn ngực phẳng lì khẽ nhấp nhô—— sự phẳng lặng có thể gọi là vô ngần ấy, đã ghim chặt lấy ánh nhìn của tôi."
1415 = "Không chỉ là thể xác. Hiểu được điều đó, tôi không hối thúc em."
1416 = "Hãy nghe đi, hãy khen em đi, một vẻ tự hào—— như một chú cún con, một sự ngây thơ vô tội đang tuôn trào."
1417 = "Cô ấy, cất tiếng."
1421 = "Đặt một nụ hôn nhẹ lên môi. Thật nhẹ nhàng——"
1433 = "Cửa tử cung bị ép chặt hết mức, phần đầu quy đầu thậm chí còn lún sâu vào cả khoảng không gian của cánh cửa."
1434 = "Cửa tử cung đột nhiên đẩy mạnh trở lại, toàn bộ âm đạo vắt kiệt lấy cậu bé của tôi như vắt giẻ lau!!!"
1435 = "Cửa tử cung ngọ nguậy mềm mại."
1438 = "Tinh trùng của tôi đang đập dữ dội vào bức tường sâu nhất của Suzu, ngay phía sau cánh cửa tử cung."
1440 = "Khép mở liên tục, hôn và mút chặt lấy quy đầu, ngọt ngào và nóng bỏng hơn bao giờ hết, mời gọi tôi vào sâu, sâu hơn nữa."
1442 = "Đẩy mạnh lên từ bên dưới sự tồn tại vốn dĩ để che giấu nó, như đang dũng cảm đòi hỏi \"hãy chạm vào em nhiều hơn nữa đi\"."
1443 = "Nó khao khát, khao khát tinh dịch của tôi, không thể kìm nén được mà nài nỉ đòi hỏi."
1457 = "Khi cơn xuất tinh cuối cùng cũng lắng xuống, tôi mới có thể miễn cưỡng phục hồi lại nhịp thở."
1458 = "Trong đó, không hề có cảm giác tội lỗi. Cảm giác hạnh phúc và——gì nhỉ, gần giống với cảm giác thành tựu chăng?"
1463 = "Chiếc nhẫn cô bé đang quấn lấy ngón áp út cương cứng, Toàn thân run rẩy bần bật, ngay cả nhịp thở cũng ánh lên niềm hân hoan."
1474 = "Xúc giác tựa như vải vóc ấy, chỉ vì cảm giác mang lại quá tuyệt, mà lại càng làm tăng thêm sự bứt rứt."
1476 = "Chính vì ý thức được điều đó, khoái cảm truyền đến như những mũi kim sắc lẹm, đâm xuyên qua các giác quan và ghim thẳng vào não bộ."
1478 = "Bình thường tôi đã rút hông lại rồi. Một lực đàn hồi và lực đẩy mãnh liệt đến mức không thể không rút hông lại."
1481 = "Cửa tử cung và quy đầu hầu như không hề tách rời, nhưng vẫn kích thích nhau bằng cách cắn nuốt lẫn nhau——"
1486 = "Những thứ mãnh liệt, những thứ nhỏ bé. Tất cả chồng chất lên nhau, nhuộm kín tâm trí tôi."
1490 = "Là những cá thể khác biệt. Là nam và nữ. Là lồi và lõm——chúng tôi khác nhau. Chính vì khác nhau——mới khao khát nhau, mới có thể làm tình."
1499 = "Hòa quyện bộ phận sinh dục vào nhau, đo đạc chính xác hình dáng của đối phương."
1500 = "Nghĩ lại sự đáng yêu của Suzu, ngay cả cái mùi tanh tưởi này, tôi cũng cảm thấy thật đáng yêu và trân quý."
1504 = "Dù không chạm vào, nó vẫn thỉnh thoảng giật giật, run rẩy, khao khát sự kích thích tình dục và những giọt tinh dịch đến mức tham lam."
1506 = "Biến cậu bé cương cứng của mình thành lưỡi dao điêu khắc, vô cùng tinh xảo, tỉ mỉ."
1512 = "Ánh mắt giao nhau. Chỉ cần thế là đủ. Lời của Suzu, và lời của tôi, là một."
1513 = "Chúng tôi trao nhau nụ hôn. Không giống như nụ hôn trong lễ cưới——mà là nụ hôn giữa vợ và chồng."
1514 = "Và rồi, chúng tôi nắm lấy tay nhau."
1515 = "Hôn lên chóp mũi. Hôn lên má."
1516 = "Vừa áp sát vào nhau, vừa đan những ngón tay lại, tôi lột bỏ chiếc váy trắng——như thể đang xé toạc nó ra."
1517 = "Để xác nhận điều đó, tôi khẽ khàng, vô cùng khẽ khàng. Chỉ di chuyển vài milimet——đúng chừng ấy thôi."
1519 = "Phần đầu quy đầu, chỉ cỡ một nửa. Trước tiên, tôi chỉ để ngần ấy xâm nhập vào bên trong Suzu."
1520 = "Bên trong khoang miệng vẫn đang hôn nhau, chiếc lưỡi ngắn của Suzu đang chuyển động dữ dội."
1522 = "Tôi và Suzu đang áp sát vào nhau—— đến mức có thể cảm nhận được cả chấn động khi giọt mồ hôi rơi xuống."
1524 = "Đang, xuất tinh. Phá vỡ và hòa tan chính bản thân mình, đưa vào tử cung của Suzu."
1526 = "Vừa nong rộng bên trong âm đạo quá đỗi chật hẹp của Suzu bằng độ dày của quy đầu, tôi vừa tận hưởng trọn vẹn cảm giác dính dớp, nhớp nháp ấy."
1530 = "Muốn đút vào càng sớm càng tốt——khao khát mãnh liệt ấy, lại bị đóng đinh vào một miếng dán bé tẹo."
1532 = "Tôi thầm cảm ơn Hibiki sâu sắc, vì đã giúp tôi loại bỏ từ trong trứng nước một rủi ro mà tôi không hề nhận ra."
1535 = "Ý định đó được truyền đạt rất rõ ràng, nhưng vì quá khít và chật hẹp, tôi không thể không xác nhận lại."
1536 = "Không thể kiềm chế được nữa, tôi tung vạt váy lên thật cao, và kéo tuột chiếc quần lót xuống tận đùi."
1539 = "Không kìm nén được mà gọi tên em, đôi mắt ướt đẫm dục vọng nhìn thẳng lên tôi."
1541 = "Muốn gọi tên Suzu. Nhưng lại không muốn dứt nụ hôn, tôi dồn hết tình cảm mút lấy chiếc lưỡi của em."
1542 = "Muốn gọi tên em. Muốn nói rằng tôi thích em. Nhưng ngay cả điều đó, lúc này cũng không thể nào làm nổi!"
1544 = "Muốn em nói ra cảm giác đó, muốn làm nó nổi bật hơn nữa, tôi lặp đi lặp lại sự ái ân dai dẳng, cùng những nụ hôn bằng quy đầu."
1547 = "Muốn bóc nó ra ngay lập tức. Nhưng mà, cứ lặp đi lặp lại việc ái ân thế này——"
1549 = "Chỉ một thoáng cô đơn ngắn ngủi, em cũng cảm nhận giống như tôi—— nhận ra điều đó, tình yêu thương trong tôi lại càng thêm đong đầy."
1551 = "Tôi siết chặt vòng tay ôm lấy em."
1553 = "Cảm giác như đã thấu hiểu được, sự vui sướng ấy khiến chuyển động của tôi càng thêm táo bạo."
1555 = "Tôi hoàn toàn đồng tình với lời nói của Suzu, nhưng lại chẳng thể thốt nên lời đáp lại."
1557 = "Chà xát núm vú bằng phần hông của cậu bé đang cương cứng, trượt mạnh qua khe hẹp giữa chiếc váy và bầu ngực——!?"
1559 = "Biến toàn bộ cơ thể tôi thành âm đạo, ôm trọn lấy chiếc dương vật đáng yêu mang tên Suzu."
1560 = "Cậu bé cương cứng của tôi, cùng với dịch nhờn, trong chớp mắt đã làm miếng dán ngực bong lên, ướt sũng, chực chờ rơi xuống."
1562 = "Có lẽ lời nói đã khiến em chú ý đến nó."
1564 = "Tôi dùng hết sức đẩy hông về phía trước, ép chặt quy đầu lên chiếc lưỡi của Suzu!"
1565 = "Giọng nói——đã có thể cất lên. Ngay khoảnh khắc vừa nghĩ đến, cảm xúc đã bật ra thành lời!"
1567 = "Cửa tử cung không phải là một khối thịt dày cộp vô cảm, mà là một cơ quan tối thượng dùng để vắt kiệt và đón nhận tinh dịch, mỗi lần chạm vào tôi lại càng hiểu rõ điều đó."
1569 = "Tôi đang làm Suzu hưng phấn đến mức này. Làm em rối loạn trong niềm vui sướng nhục dục đến mức không thể tự chủ."
1571 = "Ép chặt hơn nữa tất cả những phần đang kết nối, để Suzu lún sâu vào tôi."
1574 = "Vì vậy, em mới cố tình—— không bóc thứ gọi là miếng dán ngực đó ra mà đến đây."
1575 = "Vì vậy, tôi ước nguyện. Và sẽ tiếp tục mong nhớ."
1577 = "Thế nên tôi gọi tên em."
1578 = "Vì thế, tôi cứ vậy mà cọ xát."
1579 = "Vì thế, tôi muốn làm em rối loạn hơn nữa. Muốn khắc sâu vào toàn bộ cơ thể em một cách triệt để rằng, em là người phụ nữ của tôi."
1581 = "Thế nên, tôi mới cảm nhận được. Đón nhận nó một cách vô cùng tự nhiên, như một điều hiển nhiên."
1584 = "Với tất cả sự ngọ nguậy đó, chỉ một lòng một dạ giãy giụa muốn nuốt trọn tinh trùng của tôi."
1587 = "Lần đầu tiên tôi cảm nhận được khi ấn vào cánh cửa thịt tròn trịa nóng hổi ấy, cảm giác bám dính, hút chặt lấy mà chính cửa tử cung đang giấu kín."
1588 = "Khoảnh khắc tôi đặt Suzu xuống giường, một giọng nói đầy tiếc nuối rung lên bên màng nhĩ."
1595 = "Vào rồi. Chạm đến tận gốc rễ của tôi."
1596 = "Khoét sâu vào da thịt, tôi đâm sầm vào em. Từ nơi va chạm, chúng tôi hòa tan vào nhau, ranh giới giữa tôi và Suzu biến mất."
1608 = "Bên trong những nếp gấp mềm mại đang nhúc nhích, có những hạt nhỏ li ti sần sùi, hoặc vướng víu cứng ngắc."
1611 = "Tôi nhận ra rằng, chính những chỗ lồi lõm cực kỳ nông trên bề mặt cánh cửa cùng sự ngọ nguậy của chúng, đang khuếch đại cảm giác bám dính và khoái cảm."
1614 = "Chính vì nó mong manh, nên mỗi ngày, mỗi đêm, mỗi giờ, mỗi giây—— chúng tôi lại trao nhau những lời nói, những tình cảm, và thề hẹn lại từ đầu."
1616 = "Mỗi khi âm đạo và Suzu run rẩy, từ phần tiếp xúc khít khao không một kẽ hở giữa hai bộ phận sinh dục, tinh dịch ban nãy lại trào ra và bắn tung tóe."
1618 = "Bởi vì so với tai, lưỡi hay cổ họng, lúc này toàn bộ tâm trí tôi——đã bị tước đoạt bởi đôi mắt."
1622 = "Mong sao sẽ mãi mãi, mãi mãi không thay đổi."
1625 = "Chuyển động, hơi thở, ngày càng nhanh và mạnh hơn."
1628 = "Phản ứng như vậy là quá đủ rồi."
1630 = "Từ dưới lên, từ trên xuống, Suzu vô cùng tham lam, khao khát như muốn cắn nuốt tất cả của tôi."
1632 = "Sau đó, chầm chậm—— ngước nhìn tôi, em lặng lẽ thốt ra những lời đầy sắc tình."
1634 = "Đôi má hồng hào. Âm đạo run rẩy vì sung sướng. Có vẻ như Suzu cũng đã hiểu được ý nghĩa câu nói của tôi——"
1641 = "Nếu dùng ngón tay bấu lấy thì chắc chắn sẽ bóc ra được ngay, nhưng như thế thì, chẳng còn gì thú vị nữa."
1645 = "Tất nhiên, dương vật thật của tôi, từ nãy đến giờ vẫn luôn bị cô bé của Suzu vắt kiệt."
1647 = "Dòng chất lỏng trắng đục tràn lên váy, vương vãi quanh khóe miệng, Suzu cố gắng dùng chiếc lưỡi ngắn của mình để hứng lấy, muốn nuốt trọn tất cả."
1651 = "Một khung cảnh có phần ngớ ngẩn khiến tôi thở phào nhẹ nhõm. ……Lúc này tôi mới nhận ra nãy giờ mình đã nín thở."
1657 = "Sự chệch nhịp tinh tế khiến chuyển động hông trở nên ngẫu nhiên, quy đầu bất ngờ cọ xát mạnh vào những phần sần sùi bên trong âm đạo của Suzu."
1662 = "Kết nối với nhau, dính chặt lấy nhau, dù chỉ có thể cử động một chút xíu, chúng tôi vẫn dồn ép lẫn nhau."
1663 = "Cảm giác bám dính, áp bách, hạnh phúc quá đỗi khủng khiếp, dù không cử động, khoái cảm vẫn làm não bộ tôi quay cuồng."
1672 = "Chỉ cần chọc nhẹ là lại phát ra âm thanh đáng yêu, cậu bé đang cương cứng giật nảy lên, hối thúc tôi mau mau sử dụng nó——"
1673 = "Giọng nói như thể chẳng hiểu gì cả, nhưng đâu đó, lại phảng phất ý cười."
1674 = "Đó là một điều ước mong manh đến nhường nào, cả tôi và Suzu đều hiểu rõ hơn ai hết qua chính cơ thể của mình."
1678 = "Ngài gọi tôi sao? Cậu bé vùng vằng, khiến cơ thể Suzu giật nảy lên."
1680 = "Vẫn giữ nguyên tư thế cắm sâu, tôi bế Suzu lên, để em ngồi lên đùi tôi và ôm trọn em vào lòng."
1682 = "Từng nếp gấp, từng chỗ lồi lõm hóa thành vô số ngón tay trẻ thơ, bám lấy cậu bé của tôi mà xoa nắn, nũng nịu với sức mạnh của một đứa trẻ khát sữa mẹ!"
1685 = "Từ thắt lưng trở xuống sung sướng đến mức như bị tê liệt."
1696 = "Hương vị và mùi tanh nồng của tinh dịch do chính mình bắn ra, lan tỏa từ miệng lên mũi, nhưng——"
1702 = "Lưỡi và khoang miệng, mồ hôi và mồ hôi, da thịt và da thịt, mùi hương và mùi hương, thở ra và hít vào."
1707 = "Khoái cảm mãnh liệt khi được bao bọc và mút mát—— nhanh hơn cả suy nghĩ, toàn bộ của tôi bùng nổ thành dòng trắng xóa!!"
1709 = "Giọng nói là thứ có thể làm rung chuyển cả xương cốt, da thịt—— tôi nhận ra sự thật đó từ dục vọng xuất tinh đang bị lôi tuột ra."
1714 = "Chỉ cần lơ là một giây là sẽ xuất tinh ngay lập tức—— tôi tự nhủ với bản thân như vậy, cố gắng kiềm chế để không bị cướp cò."
1716 = "Muốn nói rằng sắp ra rồi, sắp ra đến nơi rồi, nhưng không thể thốt nên lời. Thậm chí tôi còn chẳng biết mình có đang thở hay không nữa."
1729 = "Vừa nói, tôi vừa ép cậu bé đang cương cứng vào cửa âm đạo. Cửa âm đạo đang giật giật của Suzu, chiếc miệng nhỏ nhắn đáng yêu mà chỉ mình tôi biết——"
1733 = "Vừa áp sát vừa hôn, vừa đung đưa và chuyển động hông, Suzu khẽ run rẩy toàn thân đầy ngọt ngào để đáp lại tôi."
1740 = "Sự tồn tại dị biệt ấy, không chỉ biết nũng nịu ôm ấp, mà còn giống như chính bản thân Suzu vậy——"
1741 = "Một khoảnh khắc hạnh phúc tột cùng không gì sánh bằng, nhưng chúng tôi ——từ nay về sau, sẽ còn trải qua vô số lần như thế nữa."
1744 = "Còn chậm hơn cả tốc độ đi dạo của sên trần, của sâu đo. Cậu bé đang cương cứng của tôi từ, từ, tiến, vào."
1745 = "Ngay cả nhịp đập trái tim và sự cộng hưởng dội lại từ Suzu. Trong vô vàn lớp lồng ghép ấy, tôi và Suzu đang làm tình."
1748 = "Lượng vận động bằng không, nhưng mồ hôi vẫn tuôn ra đầm đìa khắp cơ thể, nhỏ giọt xuống như muốn được xích lại gần Suzu thêm chút nữa, muốn được hòa tan vào nhau."
1749 = "Dành rất nhiều, rất nhiều thời gian, Suzu từ từ tách cơ thể ra khỏi tôi."
1753 = "Nếu vậy thì phải làm một mạch——cái hông đang muốn lao tới theo bản năng, lại bị trói buộc bởi một dục vọng, một khao khát mãnh liệt hơn nữa."
1754 = "Núm vú đáng lẽ phải ở đó lại không thấy đâu."
1757 = "Suzu. Suzu. Suzu. Suzu. Suzu. Suzu. Suzu. Suzu. Chỉ duy nhất điều đó, lấp đầy toàn bộ con người tôi."
1758 = "Bất chợt cảm nhận mãnh liệt được sự \"nữ tính\", cậu bé đang cương cứng lại giật nảy lên một cái."
1759 = "Suzu chủ động lắc hông, thúc giục cậu bé của tôi chuyển động. Khoang miệng bị chiếc lưỡi xâm chiếm, nước bọt bị Suzu hút cạn."
1760 = "Suzu——đã dùng lưỡi. Cố gắng vươn chiếc lưỡi ngắn ngủi liếm lấy cậu bé đang cương cứng."
1761 = "Âm đạo của Suzu co rút lại như bị giật mình, siết chặt lấy cậu bé vốn đã bị ép chặt từ đầu của tôi."
1762 = "Suzu nín thở trong giây lát——tất nhiên đồng thời cũng siết chặt âm đạo. Sau đó, với nhịp thở dốc, em cất giọng hờn dỗi."
1763 = "Dù em đã cố gắng mút và nuốt đến vậy, dòng tinh dịch cuồn cuộn của tôi vẫn tràn ra khỏi khuôn miệng Suzu."
1764 = "Suzu và tôi, đang hòa quyện vào nhau. Cứ thế này trở thành một——một thể không bao giờ chia lìa——"
1765 = "Suzu túm lấy phần viền ngực của chiếc váy, lặng lẽ kéo nó sang một bên."
1766 = "Mặc kệ tất cả, Suzu vẫn đón nhận cậu bé cương cứng của tôi, mang đến cho tôi niềm hạnh phúc khi quy đầu nhô ra được bao bọc!"
1767 = "Suzu khẽ rên rỉ đau đớn, nhưng lại càng thè lưỡi ra thêm."
1768 = "Núm vú của Suzu đang làm biến dạng hình dáng của miếng dán ngực."
1769 = "Cảm giác núm vú đàn hồi của Suzu, đã bị xúc giác như vải của miếng dán ngực che phủ hoàn toàn."
1770 = "Núm vú của Suzu, núm vú đáng yêu ấy, đã bị giấu đi bởi một thứ gì đó giống như miếng dán màu da."
1771 = "Sâu trong cổ họng Suzu khẽ giật, toàn bộ nước bọt và hơi thở trong miệng tôi bị hút mạnh đi——!?"
1772 = "Khe hở của Suzu, cô bé của em—— đã lấp lánh và rỏ xuống những giọt sương đẫm ướt."
1773 = "Giọng Suzu cao vút lên. Nông, nhanh và lanh lảnh."
1774 = "Cửa âm đạo của Suzu siết chặt lấy, như muốn chia cắt quy đầu và thân cậu bé của tôi ra làm hai."
1775 = "Cánh mũi Suzu phập phồng, đôi mắt lờ đờ, ướt đẫm như tan chảy."
1776 = "Ánh mắt Suzu trong một khoảnh khắc, khẽ cúi nhìn cơ thể mình sau khi bị lột bỏ chiếc váy."
1777 = "Vừa phô bày hết cỡ cho Suzu đang tròn xoe mắt nhìn, tôi vừa chầm chậm, chầm chậm cởi quần dài, rồi đến quần lót."
1778 = "Tiếng gọi lớn bất ngờ của Suzu khiến tôi giật mình kêu lên, và điều đó lại làm Suzu giật mình theo."
1779 = "Hai má Suzu đỏ bừng, nhưng em vẫn ấp úng, cố gắng thốt nên lời."
1780 = "Chỉ là những lời nói tự nhiên của Suzu—— tôi muốn nghe nó mà không cần dẫn dắt, nên chỉ im lặng chờ đợi."
1810 = "Cả âm đạo và tử cung đều đang khao khát. Mút lấy quy đầu, siết chặt cậu bé, bám riết không chịu buông."
1811 = "Âm đạo và cậu bé, da thịt và da thịt, môi và môi, lưỡi và lưỡi. Dù toàn thân áp sát vào nhau đến thế, chúng tôi vẫn có sự chệch nhịp——"
1812 = "Một lực siết chặt mạnh mẽ, đồng thời Suzu quằn quại ngọt ngào, cất tiếng rên rỉ!"
1813 = "Đáp lại tiếng kêu, sự nhu động và co thắt của âm đạo cũng tăng nhịp điệu, đưa chuyển động lên một mức độ tàn bạo hơn nữa."
1816 = "Thực tế thì, việc quần áo bị lệch theo hướng này gần như là không thể xảy ra, nhưng sự chủ quan đó, mới chính là nguyên nhân lớn nhất dẫn đến tai nạn."
1824 = "Sự cô đơn khi dứt nụ hôn, ngay lập tức được lấp đầy bởi sự mềm mại đáng yêu áp sát vào."
1831 = "Hơi thở từ mũi trở nên gấp gáp. Nước dãi tuôn trào như dịch nhờn."
1832 = "Hơi thở rò rỉ từ mũi phả vào mặt tôi nóng rực đến mức như muốn làm bỏng da——chính vì thế, tôi thấy thật vui sướng và dễ chịu."
1834 = "Khi toàn bộ quy đầu đã nằm trọn bên trong, Suzu khẽ rùng mình, có lẽ là vì cơn sóng khoái cảm, em im lặng chịu đựng một lúc."
1835 = "Mắc vào đầu quy đầu, miếng dán ngực bị hất văng đi."
1836 = "Dùng phần đầu quy đầu từ từ hôn lên, rồi lại khẽ lùi ra. Chỉ đơn giản là lặp đi lặp lại hành động đó vô số lần."
1837 = "Ấn sâu quy đầu vào trong Suzu. Toàn bộ cậu bé đang cương cứng——được đón nhận vừa khít, chật ních."
