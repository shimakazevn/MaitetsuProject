1599 = "Một thất bại vô cùng đáng yêu, hơn nữa kết quả lại tốt đẹp, nhưng Suzu lại làm vẻ mặt trầm ngâm. Thế nên——"
1605 = "Run rẩy. Cơ thể mất hết sức lực. Khoái cảm quá đỗi mãnh liệt, khiến tôi thậm chí ngừng thở trong chốc lát."
1612 = "Bị cắn nhẹ quá sướng, tôi bật ra tiếng kêu khá lớn. Suzu chu môi chụt một cái, nhìn tôi bằng ánh mắt vui sướng."
1615 = "Đuôi câu vui sướng nảy lên, Suzu nũng nịu cọ cọ mũi vào ngực tôi——"
1616 = "Luyến tiếc mút nhũ hoa thật kêu rồi rời ra, cứ như thế Suzu, từ từ từ từ đưa đôi môi ấy——"
1626 = "Bị liếm, tôi bật ra tiếng kêu. Đôi mắt Suzu nheo lại cười gian xảo."
1628 = "Trong lúc tôi đang mải nghĩ ngợi linh tinh, Suzu lại tăng tốc. Lượng tinh dịch vừa rút xuống, chớp mắt đã dâng cao."
1637 = "Dùng môi kích thích nhũ hoa, chuyển động của Suzu hoàn toàn là đang đòi sữa. Đổi lại, bàn tay có chút lơ là hơn."
1638 = "Vừa đòi bú dòng sữa mẹ không thể nào chảy ra của Suzu, cũng có lúc tôi được bàn tay nhỏ bé của Suzu dẫn dắt như thế này."
1640 = "Bị mút nhũ hoa, bị lưỡi vờn quanh quầng vú—— trong lúc đó sự cương cứng vẫn liên tục được kích thích đều đặn——"
1642 = "Sự cương cứng đang xuất tinh lại tiếp tục bị những ngón tay của Suzu đùa giỡn——!!!!"
1644 = "Vô cùng tự nhiên——hay nói đúng hơn là cẩu thả. Giống như một con mèo. Suzu kéo khóa quần xuống, lôi sự cương cứng của tôi ra ngoài."
1647 = "Nhũ hoa, nhũ hoa đang bị mút mát. Suzu đang bú nhũ hoa của tôi hệt như một đứa trẻ sơ sinh."
1648 = "Từ đôi môi đang cố kìm nén nhịp thở mà rên rỉ, đầu lưỡi đỏ hồng lấp ló. Tôi muốn hôn, nhưng vướng đồ lót nên không thể tách chân em ấy ra để áp sát vào."
1649 = "Suzu dùng đầu lưỡi và đôi môi âu yếm tôi một cách tỉ mỉ. Ngay cả vết sẹo của \"vụ tai nạn ngày hôm đó\" vẫn còn in hằn trên ngực tôi."
1652 = "Giọng nói đáng yêu. Đã thư giãn, cảm giác của mèo đã trở lại, hay là âm thanh phát ra tự nhiên——dù là gì thì cũng thật đáng yêu."
1654 = "Thật đáng yêu. Suzu ấy đang cố gắng hết sức để trở thành một con mèo, hơn nữa còn hoàn thành nhiệm vụ một cách vô cùng xuất sắc."
1656 = "Đó không phải là ánh mắt đang nói đùa. Em ấy định bắt tôi mặc thật. Sự hiểu ra khiến tôi toát mồ hôi lạnh, não bộ hoạt động hết công suất."
1658 = "Khuôn mặt nhẹ nhõm. Đưa câu chuyện trở lại là một quyết định hoàn toàn chính xác. Vì quá đáng yêu, nên tôi cũng muốn đè em ấy ra ngay lập tức."
1660 = "Điều đó khiến tôi hạnh phúc. Nhờ hóa thân thành mèo, em ấy yêu thương cả vết sẹo mà bình thường hay lảng tránh ánh nhìn."
1673 = "Lực siết chặt nũng nịu vòi vĩnh, khiến tôi bất giác bật ra tiếng thở hắt. Thế nhưng Suzu, hoàn toàn không nhận ra điều đó mà cứ mải miết——"
1689 = "Khoái cảm hóa thành một đường thẳng đâm xuyên từ sự cương cứng đến tận não bộ. Tôi chỉ có thể đơn thuần như một con thú, liều mạng lắc hông."
1695 = "Vừa dừng hông lại là một giọng nói não nề. Suzu ngước nhìn tôi với đôi mắt ướt át như sắp khóc."
1699 = "Chuyển động hông theo một đường thẳng. Đâm sầm vào nơi sâu nhất của âm đạo, đóng dấu rồi lại lặp lại chuyển động bóc ra."
1700 = "Rã rời, toàn thân mất hết sức lực. Suzu cuối cùng cũng có vẻ mãn nguyện. Vắt kiệt toàn bộ tinh dịch, sự uể oải và an tâm bao trùm lấy tôi."
1704 = "Đè xuống, đúng hơn là đè nghiến xuống. Nhanh chóng kéo tuột quần lót ra, tước đi một chút tự do của đôi chân."
1705 = "Rút ra, nằm lăn ra bên cạnh, cuối cùng cũng được hôn, và vuốt tóc em ấy."
1707 = "Một cuộc ân ái ngập tràn và đầy thỏa mãn. Với suy nghĩ đó, đầu lưỡi của tôi cũng trở nên trơn tru hơn."
1710 = "Bị tai mèo, chuông và khuôn ngực cướp đi toàn bộ sự chú ý, cho đến khi Suzu lắc lư, tôi hoàn toàn không nhìn thấy nó."
1711 = "Vừa cọ xát vào những hạt nhỏ sần sùi bằng chuyển động nhỏ như đang lay động, vừa dùng đầu ngón tay liếm láp nhũ hoa đáng yêu hết lần này đến lần khác——"
1713 = "Than vãn rằng không thể trừng phạt được, định trêu chọc Suzu thêm một chút ——kế hoạch mong manh đó, tất cả chớp mắt bị thổi bay."
1714 = "Không thấy bóng dáng đâu. Chỉ nghe thấy tiếng nói từ bên kia vách ngăn. Hơn nữa giọng nói ấy, nghe có vẻ vô cùng bất an."
1716 = "Lấp lửng không giống Suzu chút nào. Cảm giác khác lạ nhanh chóng biến thành sự lo lắng."
1718 = "Trở thành kẻ ngốc. Toàn bộ lý trí tan chảy nhão nhoét, hóa thành tinh dịch phun trào."
1721 = "Tôi nhớ ra rồi. Không biết từ khi nào Hibiki đã cho xem cuốn tạp chí mua sắm……"
1722 = "Ực, tiếng nuốt nước bọt. Trong tích tắc, chuyển động của Suzu dừng lại."
1724 = "Trừng phạt nghiêm khắc như mong muốn. Mà không hề có chút ái 抚 nào……. Hừm."
1725 = "Giữ nguyên tư thế ép chặt và chuyển động hông, âu yếm bằng kích thích khoét sâu. Cứ thế va chạm từng chút một——"
1727 = "Quá đỗi kinh ngạc, và làm em ấy giật mình, có vẻ như tôi đã làm Suzu vấp chân."
1732 = "Đã kết nối được rồi. Giữ nguyên tai mèo. Trên cơ sở tôn trọng ý muốn của Suzu, làm Suzu thỏa mãn mà không làm tổn thương em ấy và tiến tới ân ái, con đường đó."
1735 = "Vì thế cố tình. Rút ra thật mạnh, thật mạnh cho đến sát mép quy đầu, Suzu bật ra tiếng kêu não nề."
1737 = "Mỗi lần Suzu lắc đầu, cửa âm đạo cũng lắc đầu theo. Vừa ngọt ngào ngậm lấy quy đầu, vừa liều mạng kéo vào sâu bên trong."
1741 = "Thậm chí không còn tâm trí đâu mà âu yếm nơi đó. Hướng tới xuất tinh, hướng tới xuất tinh, bằng những chuyển động thẳng tắp, chúng tôi liều mạng tăng tốc."
1743 = "Suzu nói nhanh thoăn thoắt không giống em ấy chút nào."
1746 = "Không có cảm giác dính chặt và ướt át, thay vào đó là cảm giác mượt mà ôm sát lấy làn da."
1749 = "Vì tôi làm em ấy giật mình nên mới ngã. Dù đã nói \"Không sao, cứ nói mọi chuyện đi\" vậy mà."
1750 = "Khi tôi dùng ngón tay trêu đùa nhũ hoa đáng yêu, Suzu cũng đáp lại từ bên trong âm đạo. Ngọt ngào run rẩy vòi vĩnh rằng nhũ hoa cũng thích nhưng hãy xuất tinh đi."
1753 = "Có lẽ đã thoát khỏi một cuộc khủng hoảng lớn. Sự căng thẳng kỳ lạ vụt tan biến."
1757 = "Đã phản ứng lại. Cả trái tim và cơ thể dốc toàn lực. Sự tấn công bất ngờ, quá đỗi đáng yêu——!?"
1769 = "Thế rồi không hiểu sao, lại cố tình thêm đuôi câu của mèo——!!"
1771 = "Tôi không ngu ngốc đến mức chỉ ra điều đó và phá hỏng khoảnh khắc này. Nếu Suzu là mèo, tôi sẽ đùa giỡn với sự đáng yêu đó cho đến khi thỏa mãn."
1772 = "Suzu khẽ giật mình co rúm người lại, đôi tai mèo cũng khẽ rung rinh."
1778 = "Dù vậy tôi vẫn liều mạng khoét sâu vào âm đạo đang co rút, nhu động, run rẩy và bám chặt lấy. Có lẽ vì quy đầu đang phình to ra, nên tôi cảm nhận rất rõ những hạt sần sùi bên trong âm đạo."
1780 = "Xuất tinh mất. Muốn xuất tinh. Muốn cứ thế này bị Suzu đùa giỡn. Khoái cảm tràn ra từ xác thịt, chớp mắt nhuộm kín não bộ!"
1782 = "Nếu nói xin lỗi, Suzu sẽ lại càng khép nép. Thế nên em ấy cũng dịu dàng mỉm cười đáp lại chủ đề tôi đã lảng tránh."
1783 = "Suzu đột nhiên khựng lại."
1784 = "Há miệng thật to, khoe cho tôi thấy đầu lưỡi đã ướt sũng nước bọt."
1785 = "Bị vắt……kiệt rồi. Tinh hoàn đau nhức. Đã trở thành trạng thái chân không. Phóng ra một lượng tinh dịch quá lớn cùng một lúc."
1795 = "Xuất tinh cạn kiệt. Lần này tinh hoàn đã hoàn toàn trống rỗng. Bên trong tôi giờ chẳng còn gì——ngoài chút suy nghĩ sót lại."
1796 = "Điều đó tức là hóa thành mèo, thể hiện ý muốn nũng nịu đòi hỏi——!"
1798 = "Có lẽ đã an tâm hơn, Suzu ló tai ra từ vách ngăn——"
1799 = "Hút lấy dòng nước dãi đang chảy ròng ròng, rồi nuốt ực. Suzu cũng rã rời, toàn thân mất hết sức lực."
1800 = "Bàn tay nhỏ bé của Suzu cuộn lại thành hình ống, với lực đạo như mọi khi, với nhiệt độ như mọi khi, nhưng lại mang đến cảm giác hoàn toàn khác biệt——"
1801 = "Khuôn mặt thật của Suzu ló ra rồi vội vàng trốn sau bóng dáng con mèo. Niềm vui sướng, sự yêu thương. Trong khoảnh khắc đó tăng lên gấp trăm lần"
1802 = "Suzu liếc mắt nhìn tôi. Như đang nũng nịu, hay như đang thử thách điều gì đó."
1803 = "Suzu đáng yêu nghiêng đầu,"
1804 = "Suzu, liếm láp rửa mặt. Dùng ngón tay lau tinh dịch của tôi, rồi dùng đầu lưỡi đỏ hồng liếm và nuốt."
1805 = "Suzu cũng đã không thể phát ra lời từ cổ họng nữa. Chỉ đều đặn phát ra những nốt nhạc khoái cảm đứt quãng."
1806 = "Cô bé nhỏ nhắn của Suzu, dễ dàng tiếp nhận tôi. Bên trong sền sệt, chín mọng, ướt át và run rẩy."
1807 = "Đôi mắt Suzu ướt át lờ đờ, cơ thể ửng đỏ. Nhờ thấu hiểu những lời nói nghiêm khắc, và lý do tại sao lại đưa về hình tượng mèo."
1808 = "Đôi mắt Suzu nheo lại trong tích tắc. Cứ như một chú mèo tìm thấy con chuột để đùa giỡn vậy."
1809 = "Suzu lộ rõ vẻ thất vọng. Vì thế, tôi cố kìm nén cảm giác muốn ôm chầm lấy sự đáng yêu, dũng cảm ấy."
1810 = "Suzu tự mình, mở rộng cô bé ra cho tôi xem. Dùng đầu ngón tay khẽ vuốt ve cái miệng đang giật giật đáng yêu đó."
1811 = "Suzu cởi đồ lót ra khỏi chân. Khoe chiếc đuôi đáng yêu một lần, rồi mỉm cười rạng rỡ."
1812 = "Leng keng, tiếng chuông lại vang lên. Suzu trượt ngón tay thon thả từ cổ lên đôi tai trên đỉnh đầu."
1831 = "Trong khoảnh khắc, lại hoạt động trở lại. Tinh hoàn run rẩy quằn quại, lượng tinh dịch tưởng chừng đã vắt kiệt chớp mắt dâng cao trở lại."
1897 = "（Phịch!!!!）"
1899 = "（Vuốt! Xoa nắn! Tuốt lượn! Vuốt ve!!）"
1901 = "（Không, đến lúc rồi sao——Nếu là dùng tay sóc lọ cho con bú thì còn đỡ…… Nhưng nói cách khác, việc đạt cực khoái nhờ cho bú bằng tay thì hơi）"
