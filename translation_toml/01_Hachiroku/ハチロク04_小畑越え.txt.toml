1434 = "「——Đổi lại, chúng ta có thể thực hiện khảo sát một cách kỹ lưỡng ạ. Vì đây là tuyến đường mà chúng ta sẽ làm nhiệm vụ sau này mà.」"
1440 = "「\"Lò trúng thưởng\"――sao. Lại có chuyện đó ư? \\x%lレイルロオド;#00ffc040;Railord%l;#; đáng lẽ phải là đại diện tiêu biểu của máy móc chính xác chứ.」"
1443 = "「……」"
1452 = "「……Dù không phải chị Mayami thì cũng vậy thôi ạ. Đối với phụ nữ con người, bất cẩn nhắc đến chuyện tuổi tác là một điều cấm kỵ đấy ạ.」"
1454 = "「……Ra là vậy.」"
1458 = "「……Ngài Soutetsu?」"
1461 = "「……Anh nói vậy thì―― đúng là như lời anh nói thật, nhưng mà――」"
1466 = "「……Mọi chức năng đều bình thường. Nhưng――do tình trạng xuống cấp nghiêm trọng, khuyến cáo mạnh mẽ nên kiểm tra toàn diện hàng năm, sao.」"
1468 = "「……Trông ông ấy có vẻ là người hòa nhã, nhưng có vẻ không được tinh tế cho lắm nhỉ.」"
1469 = "「……Anh đang lo lắng cho họ phải không ạ. Cả Đầu máy số 9, lẫn \\x%lレイルロオド;#00ffc040;Railord%l;#; Olivy.」"
1477 = "「……Đây cũng được coi là một chuyến công tác với tư cách là nhân viên của Đường sắt Ohito. Chúng ta phải tận dụng thời gian một cách có ý nghĩa nhất có thể.」"
1479 = "「……Trước câu hỏi của Olivy, anh Munakata đã trả lời thế nào?」"
1797 = "「Nếu được thì, xin mời.」"
1799 = "「Đồng thời với việc là máy móc chính xác, chúng em còn là những sản phẩm cơ mật mà ngay cả chính chúng em cũng không biết phần cốt lõi trong quá trình chế tạo ạ.」"
