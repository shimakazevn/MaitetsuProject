1866 = "「Dù là đồ vật nhưng cực kỳ quan trọng. Tuy nhiên, rốt cuộc vẫn chỉ là đồ vật. Đó có lẽ là nhận thức chung về \\x%lレイルロオド;#00ffc040;Railord%l;#; ạ.」"
