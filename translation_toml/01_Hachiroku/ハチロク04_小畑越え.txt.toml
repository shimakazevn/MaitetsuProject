2011 = "「Chà! Khoảng cách ngắn như vậy, lại còn đi theo đường thẳng. Đúng nghĩa là đi đường tắt luôn nhỉ.」"
2013 = "「Chỉ riêng việc đó thôi cũng đã tạo ra một gánh nặng rất lớn rồi. Việc kiểm tra kỹ lưỡng lại một lần nữa trước khi đưa ra đường chính là rất cần thiết ạ.」"
