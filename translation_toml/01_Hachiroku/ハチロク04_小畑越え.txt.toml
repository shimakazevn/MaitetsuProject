1802 = "「Ở Đường sắt Hoàng gia cũ, tại \\x%l機関区;#00ffc040;kho đầu máy%l;#; Trung tâm Hoàng gia, các \\x%lレイルロオド;#00ffc040;Railord%l;#; mẫu 8620, ngoại trừ chiếc đầu tiên thì đều được gọi theo số thứ tự Haro 1, Haro 2.」"
1807 = "「Nếu tuyến Hisatsu, và đoạn giữa Yatsushiro - Kumamoto được khôi phục, thì việc chạy chuyến tàu thẳng từ Kumamoto đến Ohito chắc sẽ thú vị lắm.」"
1809 = "「Nhưng mà, tôi không biết là Hachiroku lại sợ chị Mayami đến thế đấy.」"
1811 = "「Nghe có vẻ rất náo nhiệt và vui vẻ ạ.」"
1812 = "「Không, không phải là bị hỏng. Bề ngoài thì cô ấy vẫn tỏ ra vui vẻ và mạnh mẽ. Nhưng――」"
1814 = "「Không, tôi cũng hiểu được điểm mà giám đốc công ty cậu đang lo ngại. Cho dù có ngoan ngoãn tuân lệnh, nếu nó vẫn giữ tình cảm với Đường sắt Mikan――」"
1819 = "「Tôi nghe danh anh Migita đã lâu. Nghe nói anh là một người rất xuất sắc——à, tôi là Mima.」"
1823 = "「Ở Ohito đã làm phiền anh rồi. Tôi là \\x%l機関士;#00ffc040;lái tàu%l;#; đầu máy 8620 của Đường sắt Ohito. Migita Soutetsu.」"
1827 = "「Đó chính là phiên bản \\x%lレイルロオド;#00ffc040;Railord%l;#; của cái gọi là \"Lò trúng thưởng\" ạ. Thỉnh thoảng, sẽ có những đứa trẻ như vậy xuất hiện.」"
1829 = "「Đúng vậy. Việc quan sát kỹ lưỡng là rất quan trọng.」"
1831 = "「Đúng vậy. Nói hình dáng đẹp thì cũng đẹp thật, nhưng nói thế thì loài chim nào chẳng vậy.」"
1841 = "「Nhưng, có vẻ nó cũng cảm thấy kỳ lạ vì đợt kiểm tra ngoài dự kiến này, nên đã hỏi 'Có phải mình đã hết tuổi thọ rồi không'.」"
1844 = "「Ở Ohito, các người định để Đầu máy số 9 và Olivy――」"
1845 = "「Tôi hiểu vấn đề rồi. ……Hiểu thì hiểu, nhưng」"
1846 = "「Là chỗ đó sao.」"
1848 = "「Đúng vậy—— Nhưng Hachiroku chưa từng nhìn thấy hải âu sao?」"
1852 = "「Chà, điều đó thì đúng rồi. Mà này——\\x%l客車;#00ffc040;toa hành khách%l;#; và đầu máy này hình như là」"
