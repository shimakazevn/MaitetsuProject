69 = "\\x%lポイント;#00ffc040;Ghi đường sắt%l;#; đương nhiên đã chuyển hướng, dẫn đoàn tàu của chúng tôi đi vào một con đường khác—— hướng về phía \\x%lループ線;#00ffc040;đường ray vòng tròn%l;#;, chứ không phải hướng nhà ga lúc nãy."
1407 = "……Coi \\x%lレイルロオド;#00ffc040;Railord%l;#; là đồ vật. Cảm giác sai lệch về điều đó, đang dần phai nhạt."
1412 = "……Đầu máy hơi nước là một sinh vật sống. Câu nói này nghe như một lời sáo rỗng, nhưng nó lại là sự thật."
1428 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#; Olivy đang từ chối hầu hết các \\x%l共感;#00ffc040;cộng cảm%l;#;. Dù là ngoài giờ làm việc, nhưng đây là một tình trạng bất thường ạ.」"
