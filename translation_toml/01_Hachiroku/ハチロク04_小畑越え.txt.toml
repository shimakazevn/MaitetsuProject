2020 = "「Ừ, nhất định hai chúng ta sẽ cùng đi. Và ngoài chuyện đó ra, hãy thử đi du lịch gia đình nữa nhé.」"
2022 = "「À, Hachiroku cũng thấy vậy sao.」"
