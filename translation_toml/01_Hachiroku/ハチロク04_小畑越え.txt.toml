2061 = "「Nhiều năm qua, đầu máy số 9 chỉ chạy——à không, chỉ hoạt động \\x%l入換;#00ffc040;dồn toa%l;#;, nay lại vừa trải qua một chuyến đi dài đến Ohito.」"
2065 = "「Nhờ có việc chuyển nhượng, cả nó và tôi đều có thể quay lại tuyến chính. Toàn là chuyện tốt――nếu như các cậu có thể sử dụng nó một cách thành thạo.」"
2070 = "「Đậm chất \\x%lレイルロオド;#00ffc040;Railord%l;#; máy kéo hàng――chất phác, ít nói, siêng năng. Em nghĩ phần lớn họ đều mang lại ấn tượng như vậy ạ.」"
2072 = "「Tuổi thọ――」"
2074 = "「Olivy, bị hỏng rồi à?」"
2077 = "「Chị ấy cười sao ạ?」"
2079 = "「Vâng. Xin ngài hãy đưa em đi cùng. Đưa em đến vùng biển mà ngài Soutetsu muốn đến.」"
2081 = "「Chỉ còn lại phía Bắc——đoạn giữa Ohito và Yatsushiro thôi ạ. Sẽ thành hiện thực thôi, chỉ vài năm nữa, tuyến Hisatsu sẽ được khôi phục toàn tuyến.」"
2083 = "「Nếu nó có ý định muốn quay lại làm việc cho Đường sắt Mikan, thì có nguy cơ sẽ không thể phát huy hết khả năng ở Ohito.」"
2084 = "「Nếu hỏng hóc thì tôi cũng bó tay, còn nếu chỉ là đang dỗi, thì đó đã nằm ngoài quyền hạn của tôi rồi.」"
2086 = "「Nếu là nhìn ở cự ly gần, hay cố ý quan sát kỹ, thì em nghĩ là mình chưa từng thấy ạ.」"
2089 = "「Nếu Olivy coi chúng ta như người một nhà. Nếu chúng ta cũng có thể coi Olivy như người một nhà.」"
2091 = "「Nếu được, khi đó xin anh hãy đến đi thử một chuyến. Olivy――chắc chắn cũng sẽ rất vui đấy.」"
2093 = "「Cảnh tượng đó chắc hẳn là ngoạn mục lắm ạ.」"
2094 = "「'Nếu vậy, tôi muốn làm việc ở Ohito sớm ngày nào hay ngày đó' nó bảo thế――」"
2097 = "「Dù có phần ương bướng, nhưng là một cỗ máy ngoan ngoãn. Mẫu mã tuy đã cũ, nhưng tinh thần học hỏi rất cao.」"
2101 = "「Cho tôi xem với.」"
2102 = "「Ngại quá. Cảm ơn anh.」"
2111 = "「Đúng rồi. Còn một lời hứa nữa, đến giờ tôi vẫn chưa thực hiện được.」"
2112 = "「Ra vậy. Paulette không có kinh nghiệm làm việc ở Đường sắt Hoàng gia. Do đó, Đường sắt Ohito nằm ngoài vòng văn hóa đó sao.」"
2113 = "「Tôi chưa từng có kinh nghiệm làm việc đó. Vì \\x%lレイルロオド;#00ffc040;Railord%l;#; vốn là thứ phải tuân theo mệnh lệnh mà.」"
2115 = "「Điểm đó, tất nhiên là tôi hiểu.」"
2116 = "「Đúng vậy. Tất cả đều là hành động sau khi đã xác nhận và được sự đồng ý. Giờ mới mang khiếu nại đến――thú thật là tôi rất khó xử.」"
2117 = "「Đúng, là nó đấy. Có vẻ như bánh phồng tôm Shibaten đó, là món khoái khẩu của hải âu thì phải.」"
2120 = "「Đây này.」"
2121 = "「Giống như Đường sắt Mikan và Đường sắt Ohito đã kết nối với nhau, đường ray nhất định sẽ lại được kết nối rộng khắp một lần nữa.」"
2123 = "「Đúng vậy. Đó là hành vi có thể gây trở ngại an toàn, giống như việc đặt đá lên đường ray vậy.」"
2125 = "「Được đối xử đặc biệt đến thế sao. Ngay cả trong nền văn hóa coi \\x%lレイルロオド;#00ffc040;Railord%l;#; là đồ vật của Đường sắt Hoàng gia trước đây.」"
2130 = "「Là loài chim sống ở biển. Đúng không ạ?」"
2132 = "「Bầu không khí quả thực là như vậy nhỉ.」"
2134 = "「Giống như mấy cô nhân viên nữ vừa uống trà vừa buôn chuyện à?」"
2138 = "「Shimabara sao. Xa phết nhỉ. Chắc hẳn việc vận chuyển đã rất vất vả——」"
2163 = "「Từ Shimabara đến Kumamoto, nếu đi đường bộ thì bắt buộc phải đi vòng một vòng lớn qua Nagasaki và Saga, nhưng nếu đi đường biển thì——nhìn này.」"
2164 = "「840 là một con số cho thấy đây là cỗ máy sản xuất hàng loạt cực kỳ bình thường nhỉ. Hơn nữa, D51 cũng chẳng hiếm lạ gì trên toàn Hinomoto.」"
2175 = "「SL Ohito——Đơn giản, mạnh mẽ, và thoang thoảng hương thơm của hơi nước. Một cái tên rất tuyệt vời ạ.」"
2181 = "「Nói thẳng ra thì đúng là vậy. Do đó hôm nay, chúng tôi muốn hỏi thăm về tình hình của cô ấy trước khi chuyển nhượng cho Đường sắt Ohito.」"
2182 = "「Là đi làm việc ở Đường sắt Ohito――sao?」"
2184 = "「Chuyện gì vậy thưa ngài?」"
2186 = "「Ý ngài là sao ạ?」"
2188 = "「Không ngờ ngài Soutetsu lại không giữ lời hứa đấy—— Chuyến đi tàu không vui sao ạ?」"
2190 = "「Lần đầu tiên vượt đèo Okoba, không ngờ lại diễn ra theo cách này.」"
2191 = "「Chắc hẳn các cậu đã nhắm được \\x%lレイルロオド;#00ffc040;Railord%l;#; thay thế rồi chứ gì. Chỉ cần Đầu máy số 9 trong tình trạng tốt, những thứ khác không thành vấn đề, đã thỏa thuận vậy rồi mà.」"
2196 = "「Ý anh là bỏ qua chức danh phải không? Tôi hiểu rồi.」"
2197 = "「Chắc là vậy. Có lẽ——ông Taito đã định như thế.」"
2198 = "「Tôi muốn thực hiện lời hứa với Hibiki, và cũng muốn Hachiroku trải nghiệm niềm vui của một chuyến du lịch gia đình.」"
2200 = "「Em cũng nghĩ vậy ạ. Nếu chạy trên tuyến đường này, chúng ta cũng có thể đồng thời tiến hành khảo sát luôn.」"
2208 = "「Bình thường chúng em cũng không trao đổi \\x%l共感;#00ffc040;cộng cảm%l;#; quá sâu sắc, nhưng những \\x%l共感;#00ffc040;cộng cảm%l;#; thường ngày giống như con người tán gẫu thì vẫn có ạ.」"
2210 = "「Tôi cũng định như vậy.」"
2211 = "「Về phía chúng tôi, tất nhiên cũng định làm như vậy. Đó là lý do chúng tôi đến đây hỏi chuyện lần này.」"
2212 = "「'Khi nào hết sốt, anh sẽ cho Hibiki đi phà'. ……Dù tôi nghĩ chắc Hibiki cũng đã quên chuyện đó rồi.」"
2214 = "「Tôi và chị Mayami đã cùng nhau dỗ dành em ấy. Ngoắc tay hứa sẽ mua đồ thủy tinh và bánh bông lan Castella về làm quà——」"
2217 = "「Em là Hachiroku, \\x%lレイルロオド;#00ffc040;Railord%l;#; của ngài Soutetsu ạ. Là \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của 8620 thuộc Đường sắt Ohito ạ.」"
2223 = "「Tôi đã thảo luận với cấp trên, và báo cáo việc đó cho công ty cậu. Sau đó, giám đốc công ty cậu cũng rất hào hứng 'Nếu vậy thì nhất định phải làm'.」"
2226 = "「Tôi nghe nói rồi. Từ Giám đốc Hinai của công ty cậu. Nghe nói Olivy đang đóng kín \\x%l共感;#00ffc040;cộng cảm%l;#; đúng không.」"
2228 = "「Em nghĩ cách hiểu đó cũng không sai lệch nhiều lắm đâu ạ.」"
2231 = "「Hồi đó, chị Mayami cũng còn nhỏ tuổi! Ý em là vậy đó, thật mà.」"
2233 = "「Tôi mua một túi nhỏ theo lời ông Taito, bước ra boong tàu, và ngay khoảnh khắc mở túi ra theo lời ông ấy!」"
2234 = "「Tôi trả lời là để chuẩn bị chuyển nhượng cho Đường sắt Ohito. Thế là, nó――」"
2237 = "「Tôi hiểu rồi. Để tôi gọi \\x%l機関士;#00ffc040;lái tàu%l;#; từng sử dụng Olivy đến.」"
2240 = "「Điểm đó thì tôi hiểu. Hoàn toàn không có chuyện muốn hủy bỏ hợp đồng hay gì đâu.」"
2242 = "「'Tình trạng của mày thì mày phải rõ nhất chứ'. Rồi nó lại hỏi, 'Tại sao lại kiểm tra vào lúc này'.」"
2243 = "「Em nghe nói đây là toa xe của một chủ tàu thường hoạt động ở Shimatetsu——Đường sắt Shimabara ạ. Chắc hẳn \\x%l機関士;#00ffc040;lái tàu%l;#; chính là người đó.」"
2245 = "「Tôi cũng nghe nói vậy. Hiện tại Olivy chỉ đi theo tàu chứ chưa chính thức làm nhiệm vụ, nên tạm thời không có vấn đề gì, nhưng mà」"
2246 = "「Thứ mà tôi nhớ được là chim hải âu.」"
2249 = "「Vậy nên, đi thôi. Đi tàu, ra biển chơi.」"
2251 = "「Vì vậy, việc vượt núi sẽ mất khá nhiều thời gian ạ. Đổi lại, em sẽ có những giây phút ngọt ngào cùng ngài Soutetsu——」"
2253 = "「Được ông khen ngợi, em rất vinh hạnh. Xin cảm ơn ông ạ.」"
2257 = "「Nếu dùng Navi thì thời gian chẳng đủ để gọi là du lịch nữa. Như vậy thì quá lãng phí nhỉ.」"
2259 = "「Vì có tôm, sao.」"
2262 = "「Anh có nghĩ ra nguyên nhân nào khiến cô ấy dỗi không? Hinai của công ty chúng tôi, vì muốn tránh tình trạng này xảy ra, nên đã xin thêm thời gian」"
2263 = "「Lúc đó ngài khoảng bao nhiêu tuổi ạ? Và ngài đi cùng ai vậy?」"
2266 = "「Và Olivy đang từ chối mấy cuộc buôn chuyện đó?」"
2267 = "「Nếu vậy, anh cứ thế ra lệnh sao?」"
2268 = "「Vì thế, tôi nghĩ trước tiên phải xác nhận tình trạng hiện tại, nên việc đầu tiên là đưa nó đến chỗ kỹ sư \\x%lレイルロオド;#00ffc040;Railord%l;#; để kiểm tra.」"
2271 = "「Nếu bên nhận và đương sự đều hào hứng, thì bên này chỉ việc làm theo thôi. Vì vậy, tôi đã ra lệnh cho Olivy như thế.」"
2276 = "「Mặt trời lặn là để ngày mai lại mọc.」"
2284 = "「Đó là chuyến du lịch gia đình sao ạ?」"
2285 = "「Đúng vậy.」"
2287 = "「Là loại bánh kẹo hay quảng cáo trên TV đúng không ạ? Hình như là——'Không thể dừng lại, không thể cưỡng lại', phải không ạ?」"
2288 = "「Vâng ạ.」"
2290 = "「Vâng, nhưng vì là máy móc chính xác, sản phẩm cơ mật, lại còn là bộ phận an ninh đường sắt, nên chúng em được bảo vệ rất nghiêm ngặt đấy ạ?」"
2293 = "「Vâng, nhờ ơn mọi người mà nó đã đi vào hoạt động rồi. Chắc chắn nó sẽ trở thành một trong những nòng cốt của dự án SL Đại Kyushu.」"
2295 = "「Vâng. Chúng em dự định để họ chạy trên tuyến chính ạ.」"
2298 = "「Vâng, đúng vậy. Tôi là Migita Soutetsu, Trưởng phòng Vận tải kiêm \\x%l保線部長;#00ffc040;Trưởng bộ phận bảo trì đường ray%l;#;, kiêm \\x%l機関士;#00ffc040;lái tàu%l;#; của 8620 thuộc Đường sắt Ohito.」"
2300 = "「Vâng, tôi hiểu Hinai lo ngại chính xác là ở điểm đó.」"
2303 = "「Vâng. Ngài Soutetsu đi tàu mệt mỏi thế này mà lại để ngài đứng nói chuyện, lại còn không thèm mời lấy một ly trà nữa chứ.」"
2304 = "「Đúng vậy ạ. Để đạt được điều đó, và để không còn mối lo về sau. Chuyến khảo sát hôm nay cũng vậy.」"
2307 = "「Đúng vậy ạ. Từ đây sẽ là \\x%lスイッチバック;#00ffc040;đường vòng zigzag%l;#;. Là bước chuẩn bị để tiến vào \\x%lループ線;#00ffc040;đường ray vòng tròn%l;#; ạ.」"
2311 = "「Đúng vậy ạ. Nếu được xa xỉ hơn nữa, em cũng muốn được \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; kéo đi cơ.」"
2314 = "「Vậy sao ạ? Em cũng không hỏi chi tiết đến mức đó.」"
2316 = "「À. Chuyện đó tôi có nghe, cũng nhận được lệnh rồi. Bên này cũng định chuẩn bị kỹ lưỡng cho việc bàn giao.」"
2322 = "「Có \\x%lスイッチバック;#00ffc040;đường vòng zigzag%l;#; rồi lại còn \\x%lループ線;#00ffc040;đường ray vòng tròn%l;#; nữa. Đúng là một tuyến đường đồi núi khắc nghiệt thật.」"
2325 = "「Có một loại bánh kẹo tên là bánh phồng tôm Shibaten. Có thể mua từng túi nhỏ với giá vài đồng ở cửa hàng trên tàu.」"
2328 = "「Bản sao của tài liệu này cũng đã được gửi cho giám đốc công ty cậu. Mọi tình huống đều đã được xác nhận và đồng ý trước khi bàn giao.」"
2335 = "「Bảng hiệu, tháp quảng cáo――hay là idol! Gọi như vậy có được không ạ? Em nghe nói cô ấy đã được đối xử như vậy đấy ạ.」"
2336 = "「Đằng này lại bị DL kéo, mà \\x%l客車;#00ffc040;toa hành khách%l;#; lại là ghế dài dọc theo xe nữa chứ.」"
2339 = "「Kết quả kiểm tra, anh đã báo cho Olivy biết chưa?」"
2340 = "「Đúng là như vậy ạ. \\x%lレイルロオド;#00ffc040;Railord%l;#; về cơ bản chỉ là đồ vật. Đó là quy tắc ứng xử cơ bản của Đường sắt Hoàng gia cũ ạ.」"
2344 = "「Đúng vậy ạ. Thế nhưng, Ran đó thì―― từ hồi còn tại ngũ, phải nói thế nào cho đúng nhỉ……」"
2347 = "「Đúng vậy ạ. Dù chỉ là một vài điểm nhỏ—— nhưng tuyệt đối không thể lơ là bất kỳ điểm nào.」"
2348 = "「Chuyến đi này là để thu thập thông tin từ Đường sắt Mikan về tình hình của Olivy trước khi chuyển nhượng ạ.」"
2355 = "「Kiểm tra toàn diện hàng năm!」"
2366 = "「Ông Taito bảo 'Không, Soutetsu phải đi theo'. Tất nhiên là tôi phải tuân lệnh, nên Hibiki càng khóc to hơn.」"
2367 = "「Không sao đâu. Tôi hứa. Tôi sẽ mang theo lời lỡ miệng vừa rồi của Hachiroku xuống mồ.」"
2368 = "「Chưa?」"
2369 = "「Không, tôi đã gửi nó đến Omiya đàng hoàng. Kết quả kiểm tra thì, chà, vẫn như mọi khi.」"
2370 = "「Đúng vậy.」"
2377 = "「Đường biển——đi tàu thủy ạ.」"
2379 = "「Hải âu——ý ngài là」"
2380 = "「Tất cả cùng một lúc. Bọn hải âu lao thẳng về phía tôi——nhắm vào túi bánh. Thế là chị Mayami phấn khích tột độ luôn.」"
2383 = "「Nếu chỉ là một ước mơ nhỏ nhoi của em, thì em sẵn sàng đánh đổi ạ.」"
2386 = "「Dù có tung lung tung thì bánh phồng tôm cũng không rơi xuống boong tàu đâu. Bởi vì trước khi chạm đất, chắc chắn sẽ bị lũ hải âu đớp gọn một cách điệu nghệ.」"
2391 = "「Hửm?」"
2396 = "「Trong khoảng thời gian chưa gặp được ngài Soutetsu—— Em chỉ là một \\x%lレイルロオド;#00ffc040;Railord%l;#; bình thường thôi ạ.」"
2398 = "「Là công cụ đã sử dụng nhiều năm mà. Cũng có chút gắn bó.」"
2399 = "「Mà, đó là chuyện của công ty khác mà. Nhưng xét về chi phí vận chuyển, thì đường biển đương nhiên là lựa chọn duy nhất——à」"
2400 = "「Vì Olivy mà——」"
2401 = "「Hồi đó, chị Mayami cũng còn trẻ mà nhỉ.」"
2402 = "「Dù sao đi nữa, đầu máy hơi nước cũng là một sinh vật sống mà ạ.」"
2403 = "「Đó là một thời gian sau khi tôi được nhà Migita nhận nuôi. Nhưng lúc đó ——ừm, tôi nhớ hình như không có Hibiki.」"
2404 = "「Tất nhiên, lúc nào cũng có ngoại lệ ạ. Ví dụ như, Railord của D51 840——Ran.」"
2406 = "「Quả thực, chúng ta giống như đã kết hôn với đường sắt vậy. Không ngờ nó lại trở thành một ngành công nghiệp lụi tàn đến mức này.」"
2407 = "「Hiện tại thì, chỉ là hơi buồn một chút thôi ạ. Nhưng nếu như, nhỡ đâu đến cả \\x%l共感;#00ffc040;cộng cảm%l;#; liên quan đến công việc cũng bị đóng lại thì」"
2413 = "「Phu quân của em, vẫn luôn là một người không hiểu thiếu nữ tâm chút nào nhỉ?」"
2429 = "「Khi nào Olivy bắt đầu hoạt động trên tuyến chính, chúng tôi nhất định sẽ liên lạc với anh.」"
2438 = "「Tuyến đường núi quanh Okoba, ấn tượng đầu tiên của tôi là có vẻ hơi quá sức với 8620.」"
2439 = "「Người sử dụng Đầu máy số 9 lâu nhất là tôi được giao phụ trách. Tức là, để bắt Olivy tuân thủ mệnh lệnh.」"
2443 = "「Vẫn như mọi khi――nghĩa là sao?」"
2444 = "「Không hẳn là cười, mà là phấn khích ấy. Chị ấy la hét ầm ĩ, rồi tung bánh phồng tôm cho hải âu khắp nơi.」"
2450 = "「Nếu tự ý chạm vào hoặc làm hỏng \\x%lレイルロオド;#00ffc040;Railord%l;#;, sẽ rất dễ trở thành vụ án hình sự mà.」"
2454 = "「Ran là một \\x%lレイルロオド;#00ffc040;Railord%l;#; vô cùng thanh lịch và rực rỡ, đến mức không ai nghĩ cô ấy là \\x%lレイルロオド;#00ffc040;Railord%l;#; mẫu D51 ạ.」"
2458 = "「Là Nhà máy chế tạo toa xe Jutsusen phải không? Chỗ đó cũng đang hoạt động nhỉ.」"
2459 = "「Hình như——em ấy bị sốt. Hibiki đã khóc rất nhiều ……đúng rồi, tôi còn đề nghị 'Nếu vậy, con cũng sẽ ở lại'.」"
2460 = "「Đúng vậy ạ. Và theo như em thấy, Đường sắt Mikan có vẻ như vẫn kế thừa nguyên vẹn văn hóa của Đường sắt Hoàng gia cũ ạ.」"
2465 = "「Cũng được đấy, ý hay. Dù bây giờ cô ấy chỉ là người sống cùng nhà tạm thời thôi.」"
2466 = "「Để chị Mayami sắp xếp một ngày rảnh rỗi—— Còn việc làm nhiệm vụ thì nhờ ông Akai hoặc Đường sắt Mikan giúp đỡ.」"
2475 = "「Vài năm nữa――nếu may mắn, nó vẫn có thể chạy tiếp. Trên tuyến chính――chừng nào còn dùng được, mong các cậu hãy tận dụng tối đa.」"
2484 = "「Cũng phải thôi. Đi từ Hayato qua Kagoshima, Sendai rồi mới đến Yatsushiro, chặng đường dài như vậy mà cậu cũng đi được…… cậu thích đi tàu nhỉ.」"
2485 = "「Đây là Munakata. Là \\x%l機関士;#00ffc040;lái tàu%l;#; từng sử dụng Olivy.」"
2487 = "「Bị từ chối thì, mấy người gặp rắc rối gì.」"
2488 = "「Vậy sao.」"
2489 = "「Ái chà, ufufufu. Chắc chắn là vì có tôm ở trong đó rồi ạ.」"
2490 = "「Không. Bây giờ chị Mayami vẫn còn trẻ chán.」"
2491 = "「Còn một lời hứa nữa sao ạ?」"
2493 = "「Dạ——còn Olivy thì sao ạ?」"
2495 = "「Ở Ohito cũng có cựu kỹ quan Toro phải không? Vậy thì, môi trường bên đó tốt hơn cho cả Đầu máy số 9 và nó đấy.」"
2497 = "「Vậy sao.」"
2500 = "「Vậy thì, tôi cứ thẳng thắn mà nói nhé――」"
2505 = "「Tất nhiên rồi. Nếu không thì tôi đã chẳng kết hôn.」"
2506 = "「Đương nhiên rồi ạ. Em chỉ là một \\x%lレイルロオド;#00ffc040;Railord%l;#; bình thường——à, không.」"
2508 = "「Thì nhất định lúc đó tất cả chúng ta sẽ cùng đi. Một chuyến du lịch gia đình náo nhiệt và vui vẻ——có mặt đầy đủ mọi người.」"
2509 = "「Vậy tại sao. Lúc đó chị Mayami, lại phấn khích vì chim hải âu đến thế ạ?」"
2511 = "「Lúc đó chị Mayami, đã phấn khích như thế nào vậy ạ?」"
2512 = "「Vậy thì, hãy cùng cố gắng để SL Ohito được chạy nào. Dù thế nào cũng phải đưa tuyến Ohito - Hayato vào vận hành thương mại thành công.」"
2518 = "「Vâng, ví dụ như――」"
2519 = "「Chuyện đó cũng đã được thỏa thuận rõ ràng với giám đốc công ty cậu rồi.」"
2520 = "「Dự án SL toàn Đông Hinomoto được lập ra để bắt kịp dự án SL Đại Kyushu của ngài Soutetsu―― và cô ấy chính là bảng hiệu vàng của dự án đó ạ.」"
2523 = "「Cái phần 'rốt cuộc vẫn là đồ vật', tôi không hiểu lắm.」"
2524 = "「Cho nên——dù nói chuyện này hơi sớm, nhưng một ngày nào đó, chúng ta sẽ giao khu vực đó cho những đầu máy giỏi leo núi, còn chúng ta sẽ phụ trách đoạn Ohito - Kumamoto.」"
2525 = "「Ng, ngài Soutetsu!?」"
2526 = "「Ngài Soutetsu đã từng đi tàu thủy bao giờ chưa ạ?」"
2527 = "「Ngài Soutetsu?」"
2528 = "「\\x%lレイルロオド;#00ffc040;Railord%l;#; D51 nói chung không rực rỡ sao?」"
2531 = "「Xin lỗi ạ. Vì quá ngạc nhiên nên em lỡ buột miệng.」"
2532 = "「Chạy ngang qua——vậy là lúc làm nhiệm vụ sao.」"
2534 = "「!」"
2705 = "Một \\x%lレイルロオド;#00ffc040;Railord%l;#; bình thường. Chỉ là một món đồ."
2711 = "Nếu tháo các bộ phận ra một cách khinh suất, thì do sự hao mòn và biến dạng qua nhiều năm, thậm chí có thể không bao giờ lắp lại được như cũ nữa."
2714 = "Chắc hẳn em ấy rất ngạc nhiên. Hachiroku, người vẫn luôn giữ im lặng, buột miệng thốt lên."
2719 = "Không chỉ \"Đầu máy hơi nước là một sinh vật sống\", mà \\x%lレイルロオド;#00ffc040;Railord%l;#; cũng có sinh mệnh và hơi ấm của riêng mình."
2724 = "Nếu không thì, sao bây giờ, sau hơn 100 năm, nó vẫn có thể chạy ngon lành như vậy được."
2726 = "Nhưng mà, Hachiroku lúc đầu cũng chỉ là người sống cùng nhà tạm thời. Nhớ lại chuyện đó, thì không thể phủ nhận bất kỳ khả năng nào."
2728 = "Không phải thuyết phục, mà là bắt tuân thủ mệnh lệnh. Sự khác biệt căn bản về nhận thức, lại một lần nữa khiến tôi cảm nhận được ở đây."
2732 = "Đầu máy số 9 đã bước vào giai đoạn đại tu toàn diện."
2733 = "Tóm lại là Olivy đã cảm thấy 'Mình bị Đường sắt Mikan vứt bỏ'."
2736 = "Có lẽ em ấy không rành địa hình nơi đây, tôi bèn vẽ một bản đồ Kyushu đơn giản lên giấy nhớ cho em ấy xem."
2738 = "Vì vậy, những lời mời mọc mới tuôn ra thật tự nhiên."
2739 = "Có lẽ việc để chúng tôi chờ lâu như vậy, là do anh ấy bận chuẩn bị thứ này cũng nên."
2743 = "Một tờ tài liệu được đưa cho tôi."
2746 = "Hachiroku, tôi, rồi đến anh Munakata ngồi thành hàng, nhưng giữa tôi và anh Munakata có một khoảng trống cỡ một người."
2748 = "Ngón tay thô ráp vuốt ve cái cằm lởm chởm râu."
2750 = "Chúng tôi muốn đầu máy số 9 chạy trên tuyến Yui càng sớm càng tốt, để tôi và 8620 có thể chạy trên tuyến đường này."
2751 = "Ông ấy thực sự hiểu lầm, hay là đang giả vờ hiểu lầm để giữ thể diện cho tôi đây."
2754 = "Giọng điệu của anh ấy có vẻ lo lắng, điều đó khiến tôi phần nào cảm thấy nhẹ nhõm."
2758 = "Không phải Đầu máy số 9, mà là Olivy."
2762 = "Một kẻ trẻ người non dạ như tôi, có lẽ không đủ tư cách để nói điều này với một người đã dành cả đời cho đường sắt như ông ấy."
2767 = "Bình tĩnh nghĩ lại thì ngay cả tôi, cũng hoàn toàn không biết bình thường Hachiroku và Reina trao đổi \\x%l共感;#00ffc040;cộng cảm%l;#; gì với nhau."
2770 = "Thế nhưng, trong giọng nói của Hachiroku chỉ có sự tán thưởng hồn nhiên. Vậy thì tôi cũng chẳng cần phải bới móc chuyện đó lên làm gì."
2772 = "Việc Paulette hành động sau khi đã dự liệu trường hợp xấu nhất, với tư cách là một nhà quản lý, có lẽ là điều hiển nhiên."
2775 = "\\x%lレイルロオド;#00ffc040;Railord%l;#; được chế tạo tinh xảo. Sao. Lời khen thì tất nhiên là lời khen rồi, nhưng rõ ràng là ông ta coi cô ấy như một món đồ."
2788 = "Dù đã bị che mắt bởi vẻ ngoài và lời nói vui vẻ đó... Nhưng chắc chắn cô ấy không thể nào không bận tâm đến chuyện tuổi thọ được."
2789 = "Lát nữa phải nhờ Hachiroku đối chiếu lại mới được―― nhưng dù là một kẻ không nhạy bén với tâm lý người khác như tôi, nghe đến đây cũng có thể tưởng tượng ra."
2793 = "Hachiroku cũng có cùng suy nghĩ với tôi. Chỉ điều đó thôi cũng đủ khiến tôi thấy vui."
2795 = "Bàn tay Hachiroku vẽ ra những hình ảnh trong không trung."
2797 = "Lần đầu tiên vượt đèo Okoba, sẽ chỉ có hai chúng tôi, trong buồng lái của 8620. Đó từng là mong muốn của Hachiroku, nhưng——"
2799 = "Em ấy thè chiếc lưỡi nhỏ nhắn ra. Một biểu cảm tinh nghịch hiếm thấy."
2803 = "Hachiroku trơn tru chen ngang vào cuộc trò chuyện."
2804 = "Ngay cả giọng điệu tán thưởng của Hachiroku cũng thật thanh nhã. Chắc hẳn em ấy rất thích cô ấy."
2805 = "Một Hachiroku tinh tế như vậy mà lại không nhận ra bầu không khí xung quanh. Em ấy đã hoảng hốt đến mức đó sao——"
2807 = "Hachiroku khẽ nhắm mắt lại. Như đang mơ màng, em ấy tựa người vào tôi."
2810 = "Vẫn tựa sát vào tôi, Hachiroku ngước nhìn tôi. Chỉ vậy thôi cũng đủ khiến tôi thấy ấm áp. Thấy hạnh phúc."
2812 = "Hachiroku im lặng một chút để tìm từ ngữ."
2813 = "Bàn tay Hachiroku khẽ vỗ cánh."
2816 = "Tiếng hét của Hachiroku khiến những hành khách lác đác trong xe đồng loạt giật mình nhìn về phía chúng tôi."
2818 = "Nụ cười của Hachiroku như thêm phần ấm áp. Trở nên dịu dàng hơn nữa."
2819 = "Hachiroku hướng mắt ra ngoài cửa sổ. Vừa lúc tàu tiến vào ga Okoba."
2822 = "Hachiroku mở to mắt. Nhưng cơ thể em ấy vẫn nũng nịu tựa vào tôi."
2823 = "Nghe tôi nói nhỏ giọng, Hachiroku hơi nghiêng đầu với vẻ bất mãn."
2826 = "Hachiroku khẽ mỉm cười dịu dàng."
2827 = "Hachiroku mỉm cười hạnh phúc, và cọ má vào vai tôi trong một thoáng."
2829 = "Nói xong, hai má Hachiroku ửng đỏ lên."
2831 = "Hachiroku khẽ thốt lên một tiếng, rồi ngay lập tức ngậm miệng lại, nghiêm trang."
2834 = "Nói rồi, Hachiroku nhìn quanh bên trong toa xe."
2835 = "Hachiroku thở phào nhẹ nhõm một hơi dài, bầu không khí trong xe dường như cũng chùng xuống, bớt căng thẳng hơn."
2837 = "Dù sống ở Kyushu, nhưng Hachiroku rất hiếm khi ra khỏi tuyến Yui."
2838 = "Với vẻ mặt có phần cạn lời, Hachiroku khúc khích cười."
2841 = "Rằng có vô vàn những niềm vui, mà một kẻ sống không bằng chết như tôi hồi đó vẫn còn nhớ được."
2842 = "Lần này là tiến lên."
2850 = "Định chuẩn bị―― nhưng, đã không thể làm vậy."
2854 = "Chỉ cần nhìn phản ứng đó là đủ hiểu. Quả nhiên, ngoài cái tên này ra thì không thể là cái tên nào khác."
2855 = "Nếu có thể đưa tàu đến tận Kumamoto, thì đoạn đến Yatsushiro chỉ cần vận chuyển bằng xe đầu kéo là xong."
2859 = "Dù vậy, chúng tôi cũng đang bị ông Mototada hối thúc."
2874 = "Ánh mắt của những người xung quanh cũng lộ vẻ lo lắng không biết có chuyện gì, thật ngại quá."
2877 = "Đến mức cho dù hình bóng tôi và Michiko thời thơ ấu có bước xuống từ cầu thang đằng kia, cũng chẳng mang lại chút cảm giác sai lệch nào."
2879 = "Niềm vui ấy chắp cánh cho trí tưởng tượng của tôi bay xa."
2882 = "À——tôi nhớ mang máng rồi. Chắc hẳn đối với tôi lúc bấy giờ, đó là một sự kiện vô cùng đáng nhớ."
2883 = "Bên cạnh tôi, rất khẽ―― Hachiroku thở hắt ra như trút được gánh nặng."
2886 = "Một chuyến đi vượt núi nổi tiếng với phong cảnh hữu tình kéo dài hơn hai tiếng đồng hồ, thì quả thật tôi không khỏi thắc mắc tại sao lại dùng ghế dài dọc theo xe."
2892 = "Ánh mắt đầy tò mò của em ấy dần xua đi lớp sương mù trong ký ức tôi."
2895 = "Ngón tay thon thả đặt lên môi,"
2896 = "Cũng giống như thời gian riêng của hai người, chắc chắn Hachiroku cũng cảm thấy thời gian bên gia đình rất quan trọng và đáng quý."
2898 = "Muốn đổi chủ đề. Cách chuyển hướng câu chuyện cho thấy rõ mong muốn mãnh liệt đó."
2899 = "Là để Olivy không còn gì vương vấn, để cô ấy có thể nói lời chia tay đàng hoàng――đó hẳn là sự quan tâm xuất phát từ mong muốn như vậy."
2902 = "Cô ấy tằng hắng. Rất nghiêm túc. Thật đáng yêu."
2904 = "Giọng nói phấn khích của em ấy khiến tôi cũng thấy vui lây."
2906 = "Mắt em ấy mở to. Nhìn tôi chằm chằm, không chớp mắt."
2907 = "Biểu cảm hơi ngạc nhiên. Sau đó tan chảy thành một nụ cười."
2910 = "Nếu có thể bình tĩnh phán đoán với tư cách là một giám đốc, thì trước tiên đáng lẽ phải cẩn thận lắng nghe tình hình mới đúng."
2911 = "Tôi bắt đầu thấy hơi lo lắng, không biết Olivy, cũng là một \\x%lレイルロオド;#00ffc040;Railord%l;#;, đã bị đối xử như thế nào ở đây."
2917 = "Qua từng cử chỉ nhỏ nhặt, từng lời nói nhỏ nhẹ, cô ấy lại mang đến cho tôi những niềm vui mới."
2939 = "Anh Munakata không phản ứng gì trước lời xin lỗi của Hachiroku. Vậy thì nên nhanh chóng đổi chủ đề."
2940 = "Nét mặt như chiếc mặt nạ sắt của anh Munakata, hơi méo mó một chút."
2941 = "Lần này, anh Munakata trả lời rất tự nhiên. Những lời nói như bộc phát từ đáy lòng, Hachiroku cũng chỉ biết tiếp nhận."
2943 = "Anh Munakata cũng thản nhiên ngồi xuống băng ghế."
2946 = "Giọng của anh Munakata trở nên cứng rắn. Nếu nghe như tôi đang trách móc, thì đó không phải là ý định của tôi."
2948 = "Anh Munakata nhìn tôi. Ngón tay anh khẽ gãi má."
2949 = "Anh Munakata im lặng một thoáng. Có lẽ, đang tìm từ ngữ thích hợp."
2952 = "Là cà phê lon. Chỉ cho một mình tôi. Không có phần của Hachiroku, cũng không có phần của chính anh Munakata."
2953 = "Anh Munakata thở phào. Vẻ nghiêm nghị trên khuôn mặt vơi đi phần nào."
2959 = "Chở thẳng khách du lịch từ Kumamoto đến Ohito. Tàu tốc hành Ohito. Quả thực là một cái tên dễ hiểu và tuyệt vời."
2960 = "Một người kỳ cựu hơn tôi rất nhiều――tức là một \\x%l機関士;#00ffc040;lái tàu%l;#; tiền bối. Câu hỏi đó khiến tôi có chút bất ngờ. Nhưng……"
2962 = "Tôi cảm nhận sâu sắc rằng, những \\x%lレイルロオド;#00ffc040;Railord%l;#; đã vượt quá thời hạn sử dụng luôn bận tâm đến tuổi thọ của mình."
2970 = "Cách đối xử với \\x%lレイルロオド;#00ffc040;Railord%l;#; thuộc sở hữu của công ty hay cá nhân khác, đối với tôi, theo một nghĩa nào đó còn phải cẩn thận hơn cả với con người."
2972 = "Khung cảnh sân ga khiến người ta tự nhiên thốt lên từ \"cổ kính\"."
2992 = "Bị cảm giác sai lệch từ sự khác biệt văn hóa làm cho bối rối, tôi suýt quên mất một sự thật đơn giản như vậy, thật đáng xấu hổ."
2995 = "Tôi đang ngồi trên băng ghế cạnh Hachiroku, vội vàng hơi nhổm người lên."
2997 = "Tôi cũng nhớ rất rõ. Người này là \\x%l機関士;#00ffc040;lái tàu%l;#; đã đưa Olivy đến."
2999 = "Tôi vẫn nhớ rất rõ."
3005 = "Chúng tôi trao đổi danh thiếp. Nhìn chức danh thì ông ấy là Trưởng phòng Vận tải của Đường sắt Mikan."
3006 = "Chúng tôi đã chung sống với nhau 6 năm với tư cách là vợ chồng. Vậy mà, Hachiroku vẫn luôn cho tôi thấy những khía cạnh mới mẻ."
3008 = "Tôi hoàn toàn không để ý đến chuyện đó."
3010 = "Tôi nhớ ra rồi. Một chuyện mà tôi đã hoàn toàn quên mất."
3012 = "Ngược lại, tôi thấy hơi lạ là tại sao Hachiroku lại không bận tâm đến điều khiến tôi vướng mắc."
3017 = "Tôi giật mình. Bản thân tôi cũng là người lấy Suzu, lấy Hachiroku làm vợ."
3019 = "Nghĩ rằng để Hachiroku nói thì tốt hơn, tôi chờ em ấy lên tiếng——nhưng Hachiroku vẫn im lặng."
3021 = "Tôi sững người. Tôi hoàn toàn chưa từng nghĩ đến điều đó."
3023 = "Niềm vui của một chuyến du lịch gia đình—— Mà ông Taito đã định trao cho tôi——Nhưng đã mất đi vào ngày xảy ra tai nạn đó."
3025 = "Tôi dùng hai tay giả làm chim hải âu vỗ cánh phành phạch, ôm trọn lấy đầu Hachiroku."
3026 = "Gì chứ, nghe xong Hachiroku cũng phấn khích theo kìa, chỉ vậy thôi cũng đủ khiến tôi thấy vui rồi."
3029 = "Nhìn anh Munakata, nhìn Hachiroku, rồi lại dùng ánh mắt để hỏi, anh Munakata đã đáp lại bằng một cái gật đầu im lặng."
3030 = "Tôi đợi anh nói tiếp một lúc. Nhưng――chỉ có sự im lặng thêm nặng nề."
3032 = "Nghe em ấy nói vậy, suy nghĩ rằng \\x%lレイルロオド;#00ffc040;Railord%l;#; gần giống sinh vật hơn ――cảm nhận thực tế của tôi lại càng thêm mãnh liệt."
3034 = "Nghe tiếng gọi bất ngờ, tôi quay lại, thấy một người đàn ông khoảng 60 tuổi đang mỉm cười nhìn chúng tôi."
3036 = "Tôi khẽ gật đầu, nói \"Xin lỗi vì đã làm ồn\" một cách tự nhiên nhất có thể, mọi người cũng tự nhiên quay trở lại với việc riêng của mình."
3037 = "Tôi tự thấy câu trả lời của mình thật nửa vời, nhưng cũng đành chịu. Bởi vì đối với tôi lúc bấy giờ, làm gì có chuyện vui hay không vui."
3041 = "Vì vậy, hành khách không thể chạm vào \\x%lレイルロオド;#00ffc040;Railord%l;#;, và các doanh nghiệp đường sắt cũng không thể tùy tiện xử lý."
3044 = "Vì vậy nên tôi mới có thể nhớ lại như thế này. Có thể diễn đạt thành lời, và truyền đạt lại cho Hachiroku dù chỉ một chút."
3045 = "Chỗ này, để Hachiroku nói thì tốt hơn."
3056 = "Cựu kỹ quan Toro――nói cách khác, là ông chủ của Tororyu-yu sao."
3058 = "Thay thế. Và, những thứ khác không thành vấn đề. Nghe có vẻ là một cách diễn đạt khá tàn nhẫn, nhưng――"
3061 = "Đi từ chuyến sớm nhất buổi sáng đến chiều tối mới tới nơi. Quả nhiên cơ thể vẫn cảm thấy nặng nề, uể oải."
3063 = "Quả nhiên người đó là một kỹ sư được cả công ty khác biết đến sao."
3065 = "Vì đã có một vụ lộn xộn đẩy nhanh tiến độ hoàn toàn ngoài dự kiến, nên điểm đó là rất rõ ràng."
3070 = "Quả thực mỗi năm một lần là khá nhiều. \\x%lレイルロオド;#00ffc040;Railord%l;#; trong vòng 50 năm sau khi chế tạo chỉ cần kiểm tra toàn diện 8 năm một lần. Dù có vượt quá mức đó thì cũng là 4 năm một lần."
3072 = "Tôi không phải bận tâm chuyện đó. Nhưng trước khi tôi kịp nói, những lời khó chịu đã giáng xuống."
3074 = "Chỉ vậy thôi là đủ hiểu. Hachiroku đang mong muốn điều gì."
3076 = "Sau đó, gật đầu. Chỉ một lần duy nhất——thật sâu, thật mạnh."
3077 = "Nhưng Hachiroku không hề nhận ra. Em ấy chỉ tuyệt vọng nhìn tôi, như thể sắp bám chặt lấy tôi đến nơi."
3080 = "Nhưng tôi vẫn không kìm được mà thốt lên. Bởi vì tôi đến đây là để làm điều đó mà."
3082 = "Nhưng, lý do Paulette yêu cầu dành thời gian chuẩn bị, chắc chắn không phải vì lo lắng hiệu suất ở Ohito sẽ giảm sút."
3085 = "Tuy nói vậy, nhưng cũng chỉ là \"như tôi tưởng\" thôi."
3086 = "Nhưng, vẫn chưa đủ. Điểm hút khách nhất là gì, Hachiroku vì là chuyện của bản thân nên đã bỏ sót."
3090 = "Sinh ra là máy kéo hàng, nhưng lại bị dùng làm tháp quảng cáo―― Có lẽ ý muốn của chính Ran còn chẳng hề được đếm xỉa tới."
3102 = "Tạm thời thì, anh ấy cũng đang chiếu cố chúng tôi. Vậy thì, có lẽ phòng trưởng ga đang có khách sử dụng."
3104 = "Thấy Hachiroku cuống cuồng như vậy, tôi cũng chẳng có tâm trí đâu mà trêu chọc em ấy nữa."
3107 = "Thật ngoan quá, tôi cố gắng kìm nén cơn bốc đồng muốn ôm lấy và cọ má vào cô ấy vì đang ở trên tàu."
3116 = "Thôi chết, chữ \"thích\" đó không phải là \"thích thời gian ở bên Hachiroku\", mà là \"thích đi tàu đường dài\" sao——"
3127 = "Ông Mima nở một nụ cười gượng—— nheo mắt, lặng lẽ nhìn quanh ga Yatsushiro."
3132 = "Điều đó đáng quý đến nhường nào—— Tôi của bây giờ, đã có thể hiểu được."
3134 = "Và tôi cũng muốn trải nghiệm. Bằng trái tim và cơ thể của tôi hiện tại, sau khi đã được giải thoát nhờ gặp Hachiroku."
3136 = "Những thắc mắc của các kỹ sư trong quá trình đó, đã được giao lại cho tôi và Hachiroku."
3139 = "Lời phủ nhận với giọng điệu ngạc nhiên. Như thể muốn nói, tại sao lại phải báo."
3140 = "Nghe gọi là \"Phu quân\", tôi mới hiểu ra. Nếu coi đây là một chuyến du lịch cùng vợ——thì quả thật, tôi đúng là một kẻ vô tâm."
3141 = "Nghe cô ấy nói tôi mới nhận ra, ra là vậy."
3142 = "Nghe tôi nói, em ấy gật đầu thật sâu. Có vẻ như——trong quá khứ em ấy đã từng nếm mùi đau khổ vì chuyện này rồi."
3143 = "Đồng thời, tôi có cảm giác như mình đã hiểu ra đôi chút. Lý do Olivy yêu Đường sắt Mikan."
3150 = "Hoàn toàn không có hành khách nào lên hay xuống tàu. Nhưng lý do nhà ga này vẫn tồn tại, là bắt đầu từ đây——!"
3169 = "Nói đến đó, tôi chợt nhớ ra."
3170 = "Vừa nói xong. Tôi lập tức cảm thấy, không phải vậy sao. Chính vì coi là \"đồ vật\" nên mới có thể linh hoạt chuyển đổi mục đích sử dụng."
3171 = "Mà, đoạn đó lại phải dùng xe đầu kéo—— Việc tuyến đường vẫn chưa được khôi phục khiến tôi có cảm giác như gãi ngứa ngoài giày vậy."
3172 = "Trên khuôn mặt vô cảm như chiếc mặt nạ của anh Munakata, hiện lên vẻ gay gắt rõ rệt."
3173 = "Anh Munakata im lặng. Môi dưới khẽ cắn lại."
3174 = "Nói xong, ông Mima đi về phía sau nhà ga. Ông ấy vừa khuất bóng, Hachiroku liền cất giọng với vẻ ngán ngẩm."
3175 = "Trong lúc nói chuyện, đầu máy đã chạy lùi xong——"
3198 = "Nhưng, vì đó là kết luận được rút ra chỉ từ kiến thức thuần túy nên——"
3199 = "Con người thật của Paulette, không phải với tư cách giám đốc hay thị trưởng. Mà là khía cạnh của một người đam mê đường sắt, đã bộc lộ ra theo cách tồi tệ."
3200 = "Một sự im lặng kỳ lạ bao trùm. Nếu vậy thì tôi đành phải nói thôi."
3201 = "Ga khởi điểm của tuyến Hisatsu thời Teitetsu. Việc khôi phục toàn tuyến Hisatsu, 6 năm trước còn là một giấc mơ xa vời, nhưng——"
3202 = "Thẳng thắn hơn tôi tưởng."
3204 = "Tiếc là tôi vẫn không thể nhớ lại chi tiết. Chỉ có vài mảnh ký ức rời rạc lác đác hiện về."
3206 = "Nếu vậy, thì chỉ biết chạy trên đường ray—— Chứ chẳng bao giờ ra biển chơi đùa, hay lại gần chim hải âu."
3207 = "Vậy thì, tôi phải cho em ấy biết. Rằng bên ngoài đường ray, còn rất nhiều điều tuyệt vời."
3209 = "Từ đây trở đi, tôi nên tiếp quản thì hơn."
3215 = "Suzu vui vẻ——à không, trong tàu vẫn là nơi công cộng. Để không đi quá giới hạn, tôi tự nhắc nhở bản thân phải kiềm chế."
3226 = "Ghế dài dọc theo xe gợi nhớ đến Đế Đô nên tôi cũng không ghét. Nhưng đi từ Ohito qua đèo Okoba đến Hayato——"
3227 = "Mặc dù tôi đã hiểu được cách bố trí và khái niệm, nhưng những cử chỉ đáng yêu của cô ấy vẫn khiến tôi thích thú ngắm nhìn một lúc."
3230 = "Với lập trường của Hachiroku, em ấy không thể phản bác ý kiến của nhân viên công ty khác."
3240 = "(Dù coi là đồ vật――anh Munakata, Đường sắt Mikan, đã luôn đối xử vô cùng trân trọng với Đầu máy số 9 và Olivy)"
3245 = "(Hơn nữa――Olivy vẫn luôn hoạt động liên tục, là một \\x%lレイルロオド;#00ffc040;Railord%l;#; có tuổi đời còn cũ hơn cả Hachiroku)"
3249 = "(Tuy nói vậy nhưng tôi cũng đồng lõa. Trước chuyến tàu mới, \\x%lレイルロオド;#00ffc040;Railord%l;#; mới được mong đợi ――tôi cũng đã vô thức mà vui mừng quá đỗi sao)"
3251 = "（Vù）"

[selections]
