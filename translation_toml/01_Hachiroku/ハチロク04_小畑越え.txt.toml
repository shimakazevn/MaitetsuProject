1856 = "「Em nghĩ là vậy ạ. Cá tính, sự khác biệt giữa các cá thể, dù cùng chung mẫu mã ――có lẽ còn lớn hơn nhiều so với tưởng tượng của ngài Soutetsu đấy ạ.」"
1859 = "「Trong văn hóa của Đường sắt Hoàng gia cũ——à không, Hachiroku cũng từng kể cho tôi nghe rồi nhỉ.」"
1860 = "「Vậy sao.」"
