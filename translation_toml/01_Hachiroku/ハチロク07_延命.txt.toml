[script]
1588 = "――6 năm qua. Những thiết kế mà Hibiki tạo ra, đã thực sự kéo gần khoảng cách giữa chúng tôi và Điện xá Công chúa điện hạ một cách đáng kể."
1590 = "——Chỉ trong một thời gian ngắn, cô bé đã đưa cuộc trò chuyện đến tận lĩnh vực mà tôi vừa định từ bỏ vì nghĩ không thể hỏi lúc này."
1592 = "——Giả sử có bị từ chối đi chăng nữa, thì cơ chế là Hachiroku vẫn có thể nắm bắt được việc \"đã bị từ chối\"."
1603 = "……Khi được truyền đạt bí quyết sống khỏe, chúng tôi vô cùng ngạc nhiên vì sự đơn giản của nó."
1605 = "……Tôi nhìn vào tờ ghi chú lời khuyên của Điện xá Công chúa điện hạ."
1610 = "……Ở tình trạng được khuyến cáo kiểm tra toàn diện hàng năm, tức là, một \\x%lレイルロオド;#00ffc040;Railord%l;#; không có gì đảm bảo có thể hoạt động thêm bao nhiêu năm nữa."
1624 = "「Dành cho cả nghiên cứu \\x%lレイルロオド;#00ffc040;Railord%l;#; nữa đấy. Kufufu, quả thật luôn có những kẻ lập dị, dù là con người hay \\x%lレイルロオド;#00ffc040;Railord%l;#;」"
1627 = "「\\x%l共感;#00ffc040;Cộng cảm%l;#; cũng không được luôn? Vậy thì—— a! Bút đàm! Nè? Soutetsu, cho em mượn bút và giấy ghi chú đi.」"
1630 = "「——Ba năm một lần là giới hạn rồi. Dù vậy cũng sẽ ngốn một lượng lợi nhuận tương đối lớn.」"
1632 = "「——Nói thì dễ.」"
1634 = "「——Dù vậy. Tôi...」"
1635 = "「――Ừm」"
1638 = "「——Tôi là \\x%lレイルロオド;#00ffc040;Railord%l;#; của tàu điện tốc hành tối tân nhất. Làm sao có thể hỗ trợ lái \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; được.」"
1640 = "「——Tôi, đã mất thân chính rồi. Kíp lái. Chỉ còn lại cơ thể này thôi.」"
1643 = "「――Đơn giản đúng không? Ngày mai. Không, ngay từ hôm nay hãy thử ngay đi」"
1644 = "「——Em xin hỏi một câu ạ. Ngài Soutetsu đã bao giờ trả lương cho Navi chưa?」"
1662 = "「Chỉ là tên gọi tạm thôi. Một thứ không có tên chính thức―― Là 'thứ khiến \\x%lタブレット;#00ffc040;Thẻ bảng%l;#; trở thành \\x%lタブレット;#00ffc040;Thẻ bảng%l;#;'」"
1664 = "「'Đề xuất mạnh mẽ kiểm tra toàn diện hàng năm' nghĩa là――nếu không kiểm tra toàn diện hàng năm, thì việc 'vừa vặn qua' cũng sẽ trở nên bất khả thi đúng không」"
1667 = "「Chuyện về \"cô gái quấn băng gạc\", em cũng đã nghe nói từ trước rồi nên——」"
1670 = "「……」"
1685 = "「……Ra vậy.」"
1686 = "「……Ra là vậy. Thế à」"
1694 = "「……Khuôn mặt của tôi, đã bị hỏng rồi. Không thể biểu cảm được chút nào. Tôi không thể đảm nhiệm vai trò \\x%lレイルロオド;#00ffc040;Railord%l;#; của tàu du lịch được.」"
1697 = "「……Tôi, cho Kiyoharu. ——Vì, Kiyoharu.」"
1698 = "「……Có thể là vậy, nhưng cẩn thận vẫn hơn là điều chắc chắn」"
1701 = "「……Xin lỗi nhé. Tệ đến mức này thì, thậm chí còn chẳng thể thử nghiệm được. Điều ta có thể làm, chỉ là đưa ra những lời khuyên chung chung thôi」"
1703 = "「……Không thể hiểu nổi. Đầy rẫy vấn đề. Không cần phải suy nghĩ. Tôi không thể làm nhiệm vụ trên tàu được.」"
1706 = "「……Việc \\x%lレイルロオド;#00ffc040;Railord%l;#; được nhận lương, lại là chuyện chấn động đến mức khiến cô ấy phải gỡ bỏ sự kìm nén đó sao?」"
1710 = "「……Một việc quan trọng đến mức này, nếu tuyệt đối phải làm, thì cuối cùng, tôi nghĩ mình cũng sẽ phải ra lệnh thôi」"
1719 = "「……Về chuyện đó, cứ trực tiếp hỏi và xác nhận với chính chủ là được.」"
1720 = "「……Ra vậy, ừm. Đúng thế nhỉ. Hoàn toàn khác nhau. Khác nhau chỗ nào thì, Olivy không hiểu ngay được nhưng mà」"
1721 = "「……Xúm lại thuyết phục, để bắt người ta nghe lời, thì thà ra lệnh ngay từ đầu chẳng phải nhanh hơn sao?」"
1723 = "「…Tôi sẽ nhờ người khác giải thích. Soutetsu, Hibiki. Chị Mayami. Hachiroku, cả Reina nữa」"
1724 = "「……Đúng như lời anh Soutetsu nói. Kể cả sau khi nghỉ việc trên tàu, chị vẫn muốn Olivy tiếp tục làm việc.」"
2149 = "「Thật sự là giống nhau, sao ạ? Giữa việc ra lệnh vô cớ, và việc ra lệnh sau khi đã giải thích rõ ràng」"
2151 = "「Không phải. Đền chủ là chức danh chỉ người đứng đầu ngôi đền đó. Giống như, trưởng ga vậy.」"
2152 = "「Thật vinh hạnh cho chúng tôi ạ」"
2154 = "「Tìm cơ hội, đi gặp một lần thử xem sao. Sẽ có ích đấy? Cứ nói là do ta giới thiệu cũng không sao」"
2160 = "「Nhưng mà—— này? Olivy.」"
2161 = "「Nhưng mà, sao hôm nay sáng họp tối cũng họp vậy? Gộp lại luôn không phải tốt hơn sao?」"
2162 = "「Nhưng mà, cô đừng có gắng gượng quá nhé? Sáng họp, tối lại họp thì ai cũng mệt mỏi cả thôi ạ」"
2163 = "「Nhưng mà, cảm ơn đã hỏi ý kiến Olivy nha. Và, cảm ơn đã giải thích cho Olivy nữa」"
2168 = "「Đầu máy số 9 là SL sản xuất từ thời Minh Trị mà. Thao tác cực kỳ đơn giản. Với thông số kỹ thuật tối tân, chắc chắn cậu sẽ học được dễ dàng thôi.」"
2169 = "「Nghĩa là, xin hãy cho tôi thời gian giải thích, để Olivy hiểu và đồng tình――」"
2172 = "「Niiroku! Rất vui được gặp cậu! Xin chỉ giáo nha!!」"
2173 = "「Lõi――Lord?」"
2174 = "「Cái——」\\n「Ồ.」"
2177 = "「Cái gì thế này, là chuyện của Olivy sao!?」"
2182 = "「Hôm nay, mặc dù yêu cầu đường đột, nhưng vô cùng cảm ơn mọi người đã đến tham dự」"
2183 = "「Hôm nay, về kế hoạch vận hành sắp tới của \\x%lレイルロオド;#00ffc040;Railord%l;#; Olivy, tôi rất mong nhận được ý kiến đóng góp từ mọi người」"
2194 = "「Dù đang trong tình trạng được khuyến nghị kiểm tra toàn diện hàng năm, nhưng việc làm nhiệm vụ trên tàu suốt nhiều năm—— mà không qua kiểm tra, chị vẫn nghĩ là nên tránh.」"
2195 = "「Nhưng cho đến khi gặp nguy hiểm lần tiếp theo, thì vẫn được chạy trên tuyến chính đấy! Cả một cỗ máy tàn tạ như Olivy mà vẫn còn chạy được đó nha?」"
2197 = "「Ta cũng có tài trợ cho các nghiên cứu liên quan đến việc kéo dài tuổi thọ của \\x%lレイルロオド;#00ffc040;Railord%l;#; đấy? Dù sao thì, chuyện đó cũng liên quan đến chính bản thân ta mà」"
2203 = "「Bộ phận Cơ khí \\x%lレイルロオド;#00ffc040;Railord%l;#; Đường sắt Hoàng gia cũ ở Omiya―― Nay là Viện nghiên cứu \\x%lレイルロオド;#00ffc040;Railord%l;#; Omiya, ta đang đầu tư vốn vào đó」"
2206 = "「Này, đừng có tình tứ nữa, xem nhiệt độ đi~! Hachiroku mấy độ!? Olivy vừa tròn 40 độ đấy!」"
2209 = "「Xin chào. Olivy là \\x%lレイルロオド;#00ffc040;Railord%l;#; kiểu Mỹ, bạn là kiểu Hinomoto nhỉ? \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của xe nào vậy?」"
2212 = "「Cậu không có hứng thú sao? Được chạy lại vui lắm đó nha?」"
2214 = "「Olivy ấy nha, cũ hơn Niiroku rất nhiều, là hàng sản xuất ở Mỹ, về mặt hiệu suất thì hoàn toàn không thể so sánh được.」"
2216 = "「Đúng nghĩa là cô gái biển hiệu của Omiya đấy. Dù cứ để mặc đó, thì sớm muộn gì cũng có lúc chạm mặt thôi」"
2218 = "「Bí quyết sống khỏe…… sao ạ」"
2219 = "「Khả năng được khỏe mạnh! Dù chỉ một chút, dù chỉ tăng thêm 1% thôi, Olivy cũng muốn biết!!」"
2221 = "「Cũng đúng ha~. Nhưng hôm nay hết lịch làm việc trên tàu rồi, dư sức qua cầu mà!」"
2224 = "「Truyền đạt lại…… chính là, lưu giữ lại.」"
2228 = "「Hachiroku là…… hừm, 38 độ 4 sao」"
2231 = "「Hachiroku thì, nằm trong mức tiêu chuẩn của \\x%lレイルロオド;#00ffc040;Railord%l;#; \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;. Olivy cũng vậy, nhưng khá gần mức báo động rồi」"
2237 = "「Nghe em nói vậy, quả thực cũng có khả năng đó. Em hoàn toàn không nghĩ đến điều đó luôn.」"
2240 = "「Đừng nói là hàng năm, hai năm một lần cũng là không thể. Nếu xét đến việc bốn năm một lần còn có đợt kiểm tra toàn diện của Reina và Hachiroku nữa thì——」"
2242 = "「Nỗ lực thì có thể…… chứ xuất sắc thì tôi không dám nhận đâu ạ. Nếu là điều tôi có thể trả lời, xin ngài cứ hỏi」"
2245 = "「Xin cảm ơn ngài. Chúng tôi nhất định sẽ thực hành mỗi ngày」"
2246 = "「Xin cảm ơn nhã ý của ngài. Vậy thì chúng tôi nhất định sẽ đến thăm vào một ngày sớm nhất có thể ạ」"
2250 = "「Nghỉ việc—— Không còn có ích trên tàu nữa. Sau đó…… Olivy vẫn, có chỗ đứng sao?」"
2252 = "「Dù có làm theo thì vẫn có thể bị bệnh, bị thương và chết. Nhưng so với không làm gì, thì nó sẽ làm tăng xác suất được khỏe mạnh」"
2255 = "「Dù vậy—— cậu vẫn?」"
2256 = "「Dù vậy cậu vẫn cố tìm lý do sao? Để không phải chạy, để nhốt mình lại.」"
2257 = "「Ra là vậy—— Tôi đã hiểu lý do mình được gọi đến rồi.」"
2258 = "「Ra là vậy.」"
2262 = "「Lại đối xử như em bé rồi~」"
2266 = "「Nếu Olivy mong muốn điều đó.」"
2268 = "「Nhưng nếu vì lý do nào đó mà Olivy không muốn, tôi muốn trò chuyện, tìm hiểu lý do đó, và gỡ bỏ nó」"
2271 = "「Nhưng em—— chưa từng một lần, nhận được sự \\x%l共感;#00ffc040;cộng cảm%l;#; nào.」"
2273 = "「Nhưng mà——」"
2275 = "「Nhưng mà nè. Cứ như vậy mà không chạy nữa, chẳng phải rất phí phạm sao?」"
2278 = "「Nhưng mà. Cô bé đó, là \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của nguyên mẫu tàu điện tốc hành tối tân nhất thời bấy giờ cơ mà?」"
2281 = "「Cậu nhạy bén đấy, Migita. Ưm, không được rồi. Có vẻ như ta đã hơi lỡ lời quá đà rồi」"
2283 = "「Á!!」"
2284 = "「!」"
2285 = "「Kufufu」"
2286 = "「Kufufu, 'Bí quyết sống khỏe cho \\x%lレイルロオド;#00ffc040;Railord%l;#;' sao. Cái tên đơn giản dễ hiểu nhỉ. Ta sẽ lấy làm ứng cử viên cho lúc công bố chính thức」"
2291 = "「Và việc xác nhận với Olivy, tiếp nhận những thắc mắc đó, rồi mọi người cùng nói chuyện thế này, sau đó mới đưa ra mệnh lệnh」"
2292 = "「A!」"
2293 = "「!」\\n「A——」"
2296 = "「Dạ!? À, ừm thì」"
2297 = "「Hả!?」"
2299 = "「Hả!? A! Không phải ý đó đâu, Olivy.」"
2300 = "「Dạ?」"
2301 = "「Hả? Xin lỗi nha. Cậu không nói được à? Nên mới quấn băng gạc? Vậy thì, \\x%l共感;#00ffc040;cộng cảm%l;#; thì sao nhỉ?」"
2306 = "「Ủa? Sao vậy?」"
2307 = "「Wow! Đỉnh thật đấy!!」"
2308 = "「Hau…… ừm, ngài nói vậy, tôi thật ngại quá」"
2311 = "「Hừm~. Mọi người có vẻ khá bận rộn mà, linh hoạt ghê ha?」"
2312 = "「Ồ」"
2313 = "「!」"
2315 = "「Ôi, ra là vậy ạ」"
2316 = "「Ufufu~」"
2317 = "「!」"
2318 = "「A——」"
2319 = "「A, quả nhiên là vậy! Đúng mà ha, ra là thế!」"
2320 = "「A――nếu vậy, không lẽ…… lợi nhuận đó, được dùng cho nghiên cứu \\x%lレイルロオド;#00ffc040;Railord%l;#; sao?」"
2324 = "「A…… ư——」"
2325 = "「A……ư.」"
2327 = "「A…… Là chuyện sau khi chúng tôi rời đi trước sao ạ?」"
2328 = "「A」"
2329 = "「!」"
2330 = "「A! Ra vậy. Để biết cô gái đó có phải là \\x%lレイルロオド;#00ffc040;Railord%l;#; hay không, Hachiroku đã thử \\x%l共感;#00ffc040;cộng cảm%l;#; rồi đúng không?」"
2334 = "「A! Đúng vậy. Điểm này trong lúc khảo sát trước tôi không hề biết, nên tôi rất ngạc nhiên và cũng rất vui.」"
2337 = "「A! Quả thực, ví dụ như để phục vụ cho các cuộc thử nghiệm tuyệt mật, có khả năng cô ấy sở hữu chức năng không để người khác nắm bắt được sự tồn tại của mình.」"
2339 = "「A! Ý hay đó!! Vậy thì chị sẽ phụ trách chèo lái, với cả, trò chơi trên sông! Chị sẽ dạy em cách chơi đùa trên sông nữa!」"
2340 = "「A!?」"
2343 = "「A!? Xin cảm ơn ngài――hơn thế nữa, tôi xin lỗi. Chuyện nội bộ của chúng tôi đã làm mất thời gian quý báu của Điện xá Công chúa điện hạ――」"
2345 = "「A!? Cái đó――không phải, tôi, ừm thì」"
2346 = "「A!? Ngài Soutetsu, xin hãy đợi một chút ạ」"
2347 = "「A, nhìn cách \\x%l保線;#00ffc040;bảo trì đường ray%l;#; thì có vẻ đúng là vậy nhỉ. Nhưng mà, Hachiroku và Reina cũng là cựu binh mà?」"
2349 = "「À, kêu rồi kìa. Vậy để xem nhiệt độ thế nào nhé」"
2353 = "「A, này. Thế là xong rồi à?」"
2356 = "「Này, đến cả chuyện đó mà cũng hỏi ý Olivy sao!?」"
2358 = "「Ưm——. Ừ. Hiểu rồi. Sẽ chuyển lời.」"
2359 = "「Hừm. Nếu là \"trước đây\" thì thật may mắn.」"
2361 = "「Ừ. Nhưng mà――vì em vừa lau xong, nên có khả năng nhiệt độ đã tăng lên một chút đấy」"
2364 = "「Ừ. Nếu Hachiroku cũng có thể thử, bí quyết sống khỏe cho \\x%lレイルロオド;#00ffc040;Railord%l;#; đó, thì nhất định hãy cho chúng tôi cung cấp dữ liệu」"
2367 = "「Ừ. Sau đó, anh đã hỏi ý kiến những người muốn mời tham dự. Kết quả là, tối nay là thời điểm thuận tiện nhất」"
2368 = "「Ừm」"
2369 = "「Vâng!」"
2371 = "「Vâng! Tất nhiên bây giờ em biết là không phải vậy rồi. Mọi người cũng rất trân trọng Olivy mà.」"
2373 = "「Ừm. Trông cậy vào em, nhưng chị nghĩ bây giờ thì không sao đâu」"
2374 = "「Hửm?」"
2376 = "「Hửm? À, đền chủ Akai đó」"
2377 = "「Thử nghiệm là sao ạ?」\\n「Lời khuyên chung chung, có phải là lời khuyên về việc kéo dài tuổi thọ không ạ?」"
2379 = "「Fufu. Em ấy cũng nói vậy mà」"
2380 = "「Ufufu.」"
2382 = "「Ufufu, không có chi. Vậy thì, với tư cách là giám đốc Đường sắt Ohigawa――tôi hỏi lại lần nữa nhé?」"
2383 = "「Kufufu, ra là ta đã hơi cầm đèn chạy trước ô tô rồi. Đương nhiên, ta sẽ vui vẻ chờ đợi đến ngày đó」"
2386 = "「Hảả!? Kiểm tra toàn diện mà tốn nhiều tiền đến vậy sao!?」"
2387 = "「Ồ.」"
2390 = "「Hừm, vị đền chủ đó, từng là \\x%l運転士;#00ffc040;lái tàu%l;#; của Đường sắt Hoàng gia sao~」"
2393 = "「Lần tới Olivy! Hãy đến chơi chuyến đi thuyền trên sông Kuma nha! Để chào mừng, Nagi đại nhân đây sẽ đích thân chèo thuyền cho cậu!!」"
2395 = "「Đối với Olivy, hai việc đó hoàn toàn giống nhau sao? Những lời giải thích, những tâm tư ấy. Là vô nghĩa và vô giá trị sao」"
2399 = "「Việc kiểm tra toàn diện hàng năm được khuyến nghị cho quá trình vận hành của Olivy. Với tài sản hiện tại của Đường sắt Ohito thì không thể đáp ứng được.」"
2401 = "「Mọi người xong chưa~? Còn lâu không~?」"
2412 = "「Ừm, Olivy cũng không định làm thân đâu? Chỉ là nghĩ xem có thể nói chuyện công việc được không thôi.」"
2413 = "「Olivy cũng mới ốm dậy mà. Lo lắng hơi thái quá một chút, mong em thông cảm cho cô ấy」"
2414 = "「Olivy cũng đâu ngốc đến mức đó chứ. Ngay từ đầu em đã nghĩ mục tiêu của mọi người chỉ là Đầu máy số 9 thôi.」"
2415 = "「Thật không ngờ, Olivy có vẻ rất am hiểu nghệ thuật đối nhân xử thế nhỉ. Học ở đâu ra vậy?」"
2416 = "「Vì vậy, em sẽ cố gắng cho đến ngày làm nhiệm vụ cuối cùng! Olivy còn được lái thêm mấy năm nữa?」"
2417 = "「Dù Olivy nghỉ hưu không lên buồng lái nữa, nhưng vẫn có thể bảo dưỡng được mà? Chia việc ra là OK thôi!」"
2418 = "「Olivy cũng có kiến thức về kỹ thuật bảo trì đường ray mới nhất. Tôi cũng mong em có thể truyền đạt điều đó cho Đường sắt Ohito.」"
2419 = "「Những gì em muốn nói, chỉ có vậy thôi! Còn lại thì, Niiroku và đền chủ cứ suy nghĩ nhé?」"
2420 = "「Này, Olivy!?」"
2421 = "「Olivy, Reina? Chúng ta, hãy quay lại làm việc trước đi」"
2422 = "「Vâng, để ngài đợi lâu rồi ạ」"
2425 = "「Được thôi! Olivy sẽ truyền đạt tất cả! Sau khi nghỉ hưu! À không, kể cả trước khi nghỉ hưu—— ngay ngày mai cũng được!!」"
2426 = "「Vâng, em rõ rồi thưa ngài Soutetsu. Vậy thì Niiroku, hẹn khi khác gặp lại.」"
2430 = "「Nếu cậu nhất quyết không muốn làm nhiệm vụ trên tàu, thì \\x%l保線;#00ffc040;bảo trì đường ray%l;#; cũng được. Olivy—— muốn truyền đạt những gì mình biết, dù chỉ là một chút thôi!」"
2432 = "「Nếu không ai có thể truyền đạt được tầm quan trọng cho Olivy hiểu. Giả sử Olivy cứ mãi từ chối 'Không muốn'」"
2434 = "「Nếu vậy, với cái người tên Munakata đã truyền dạy những điều đó, ta cũng phải gửi lời cảm ơn mới được」"
2441 = "「Đền chủ?」"
2443 = "「Bố tôi hôm nay cũng không rảnh. Nhưng nếu có chuyện gì, bên này cũng có thể liên lạc trực tiếp qua điện thoại bất cứ lúc nào.」"
2444 = "「Thứ khiến \\x%lタブレット;#00ffc040;Thẻ bảng%l;#;――trở thành \\x%lタブレット;#00ffc040;Thẻ bảng%l;#;」"
2449 = "「Đúng vậy. Sau khi Olivy nghỉ làm ở buồng lái, sẽ cần người làm \\x%lレイルロオド;#00ffc040;Railord%l;#; cho đầu máy số 9.」"
2451 = "「Khi nhận được yêu cầu từ Điện xá Công chúa điện hạ, giả sử cô Paulette, không hỏi han gì Olivy mà cứ thế đáp ứng」"
2453 = "「Này, Nagi! Sao em lại nói chuyện đó lúc này chứ......」"
2455 = "「Sou-chan~, để em đợi lâu rồi~. Bọn chị, chuẩn bị xong rồi nha~」"
2460 = "「Ban đầu Olivy có hơi hờn dỗi một chút. Em nghĩ lúc làm nhiệm vụ trên tàu, chỉ cần \\x%l共感;#00ffc040;cộng cảm%l;#; những thứ cần thiết là đủ.」"
2463 = "「Là tên của đền chủ Akai ạ.」"
2465 = "「Là người phụ trách của Đền Akai Aso」"
2466 = "「Dù cho không thể làm nhiệm vụ trên tàu nữa, thì ngoài việc đó ra, chắc chắn cô ấy đã có dự định bóc lột sức lao động của Olivy đến cùng rồi.」"
2468 = "「Dù không làm việc trên tàu, nhưng 21 giờ chúng ta có cuộc họp khẩn cấp đấy ạ?」"
2470 = "「Cả chuyện bảo trì đường ray nữa nha! Em đã học được khi quan sát Munakata đó!」"
2472 = "「Công việc?」"
2486 = "「Tiếc là, anh cũng không biết」"
2487 = "「Dựa trên lời khuyên của Điện xá Công chúa điện hạ trong cuộc họp buổi sáng, Paulette đã quyết định phải tổ chức thêm một cuộc họp nữa」"
2490 = "「Đường sắt Ohito không giống như các công ty đường sắt khác, không có sự kế thừa kinh nghiệm từ thời Đường sắt Hoàng gia.」"
2495 = "「Sao thế Hachiroku?」"
2496 = "「Sao thế?」"
2502 = "「Để tránh gia đình xào xáo, mọi người đều phải giữ thể diện. Vì thế, không có gì bị lung lay cả. Cho dù ai có nói gì đi nữa」"
2506 = "「Em đã từng kể cho anh hai nghe rồi mà! Cả em và chị Kisaki đều đã gặp.」"
2508 = "「Tôi cũng vậy」"
2510 = "「Em cũng—— không có gì đặc biệt.」"
2513 = "「Tôi từng nghe nói việc chế tạo mới \\x%lレイルロオド;#00ffc040;Railord%l;#; là bất khả thi――hóa ra không phải do chi phí hay nhu cầu, mà là bất khả thi về mặt kỹ thuật sao ạ?」"
2515 = "「Tôi nghĩ làm vậy thì tốt hơn ạ. Thế nên, nếu Olivy cũng đồng ý」"
2520 = "「Đột ngột đến làm phiền mà cậu vẫn chịu nói chuyện, cảm ơn nhé. Nhờ cậu gửi lời hỏi thăm của chúng tôi đến đền chủ Akai.」"
2521 = "「Bọn anh cũng xong rồi! Sẽ ra ngay đây」"
2522 = "「Cô ấy muốn trau chuốt cho đến sát hạn chót ạ. Hibiki có nhắn là 'mong ngài hãy đợi đến lúc đó' ạ」"
2524 = "「Công ty chúng tôi đánh giá cao năng lực và kinh nghiệm của Olivy, việc kéo dài thời gian hoạt động được đánh giá là có lợi cho công ty」"
2525 = "「Tôi chỉ lộ diện vì lệnh của Kiyoharu thôi. Không có ý định làm thân đâu.」"
2529 = "「Tôi là. Niiroku. Từng là \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của tàu điện tốc hành nguyên mẫu Kuha 26 thuộc Đường sắt Hoàng gia cũ.」"
2532 = "「Kết quả kiểm tra lần trước của Olivy ở Omiya, tôi muốn để Điện xá Công chúa điện hạ xác nhận」"
2533 = "「Tôi là Hachiroku. \\x%lレイルロオド;#00ffc040;Railord%l;#; chuyên dụng của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; 8620 thuộc Đường sắt Ohito.」"
2538 = "「Tôi là Migita Soutetsu. Master của Hachiroku.」"
2539 = "「Tôi thì, không sao ạ」"
2541 = "「Ối chà」"
2542 = "「Vì tôi nghĩ rằng làm như vậy, sẽ tăng khả năng tìm ra phương pháp kéo dài tuổi thọ cho Olivy」"
2543 = "「Thấy chưa? Na-chan?」"
2546 = "「Thế nên—— tôi đã nói là mình không thể chạy được nữa rồi.」"
2548 = "「!!?」\\n「Trời ạ!」"
2550 = "「Thế nên…… thà rằng. Tập hợp tất cả mọi người lại cùng một lúc sao ạ?」"
2553 = "「Vì thế, đừng vội vàng, cứ bình tĩnh nghe cho đến cuối. Không sao đâu, chắc chắn sẽ không phải là chuyện xấu đâu.」"
2555 = "「Paulette đã phân vân mãi xem nên nói chuyện với ai theo thứ tự nào. ――Nên mới kéo dài đến tận hôm nay đấy」"
2558 = "「Vì vậy, em đã từ chối \\x%l共感;#00ffc040;cộng cảm%l;#; một cách rất quyết liệt—— Nhưng mà, việc từ chối \\x%l共感;#00ffc040;cộng cảm%l;#; thì đối phương vẫn có thể biết được.」"
2561 = "「Vậy nên. ――Hồ sơ kiểm tra của Olivy, để Điện xá Công chúa điện hạ xem qua, có được không?」"
2562 = "「Tiền lương, cũng có thể dùng cho Kiyoharu đó nha? Kiyoharu, chắc chắn sẽ rất vui đấy!?」"
2565 = "「Xin lỗi ạ. Dù là lo lắng thì cũng phải biết cách truyền đạt nhỉ. Tôi cứ lặp đi lặp lại cùng một sai lầm mãi thôi」"
2567 = "「Bye bye Niiroku! Cứ đến chơi bất cứ lúc nào nha~!」"
2571 = "「Theo lời đồn thì là vậy, nhưng mà……」"
2572 = "「Nghe nói là vậy ạ. Nghe đâu ngài ấy từng đảm nhiệm vị trí \\x%l運転士;#00ffc040;lái tàu%l;#; thử nghiệm cho nguyên mẫu tàu điện tốc hành.」"
2575 = "「Em cứ yên tâm. Paulette ấy à? Trông thế thôi chứ cô ấy là một nhà quản lý tài ba đấy.」"
2582 = "「Thì đúng là dễ mà? Mọi thứ đã được dọn sẵn rồi. Còn lại chỉ là chuyện chạy, hay không chạy thôi.」"
2583 = "「Đã rõ!」"
2585 = "「Vậy... sao?」"
2587 = "「Thấy chưa!? Vậy thì cũng giống nhau thôi!」"
2590 = "「Vâng. Do đó—— giả sử cô gái đó là \\x%lレイルロオド;#00ffc040;Railord%l;#; đi chăng nữa, thì liệu cô ấy có thể giúp ích cho việc làm nhiệm vụ trên tàu hay không.」"
2594 = "「Vâng. Từ Niiroku—— một luồng \\x%l共感;#00ffc040;cộng cảm%l;#; sắc bén yêu cầu chia sẻ thông tin.」"
2596 = "「Đúng vậy. Thực ra tôi nghĩ, nếu có thể mời cả ông Mototada và ông Seki đến dự thì là tốt nhất rồi——」"
2600 = "「Vâng. Bây giờ Olivy đã cho phép chúng ta \\x%l共感;#00ffc040;cộng cảm%l;#; đến tận vùng cảm xúc rồi ạ.」"
2604 = "「Vâng. Giống như Olivy đã từng làm trước đây, \\x%lレイルロオド;#00ffc040;Railord%l;#; cũng có thể đóng cửa \\x%l共感;#00ffc040;cộng cảm%l;#; ạ.」"
2606 = "「Đúng vậy」"
2608 = "「Đúng vậy, Olivy. Hôm nay, sau khi bàn bạc với Điện xá Công chúa điện hạ, tôi nghĩ tốt nhất là nên truyền đạt lại suy nghĩ của mình」"
2609 = "「Lúc nghỉ ngơi mà vượt quá 41 độ thì nên cho nghỉ phép, đúng không? Vậy thì, vẫn còn dư dả 1 độ lận, không sao đâu~」"
2612 = "「Từ Munakata đó! Những điều quan trọng mà Olivy biết, toàn bộ đều là học từ Munakata đấy」"
2614 = "「Vậy…… sao ạ? Nếu Điện xá Công chúa điện hạ đã nói thế, thì tôi không ý kiến gì nữa」"
2616 = "「Lúc đầu, tôi định nói chuyện riêng với Olivy. Nhưng nội dung muốn nói lại liên quan đến hoàn cảnh của người khác nữa」"
2629 = "「Đúng thế. Thu thập các cỗ máy \\x%l静態保存;#00ffc040;bảo quản tĩnh%l;#; còn tốt, thu hút khách tham quan và trưng bày, vừa truyền bá lịch sử đường sắt, vừa kiếm thêm nguồn vốn」"
2634 = "「Chính xác thì là, 'phương pháp giúp dễ dàng ngăn chặn tình trạng xấu đi' nhỉ? Nói theo ngôn ngữ loài người thì, giống như 'bí quyết sống khỏe' vậy」"
2641 = "「Không có gì ạ—— chỉ là lúc nãy Olivy lớn tiếng gọi 『Nói chuyện đi!』 qua \\x%l共感;#00ffc040;cộng cảm%l;#; thôi.」"
2643 = "「Không sao đâu, Olivy.」"
2644 = "「Không sao đâu! Nếu buồn ngủ thì Olivy sẽ ngủ, muốn về thì sẽ về mà」"
2645 = "「Không sao! Chỉ là hơi bất ngờ chút thôi. Được mọi người thảo luận cùng thế này, Olivy thấy vui lắm!」"
2646 = "「Không cần phải học. Kiyoharu vốn xuất thân là \\x%l機関士;#00ffc040;lái tàu%l;#; hơi nước.」"
2648 = "「Không cần thiết. Tôi, có thể nói chuyện.」"
2649 = "「Không hứng thú. Tôi chỉ làm nhiệm vụ trên tàu với Kiyoharu thôi.」"
2650 = "「Không có chuyện đó đâu! Không phải vô nghĩa, càng không thể nào là vô giá trị!」"
2651 = "「Đúng vậy.」"
2664 = "「Paulette ơi~. Reina cũng, làm vậy được không ạ~?」"
2668 = "「Làm gì có chuyện đó!」「Không phải vậy đâu!」\\n「Làm gì có chuyện như vậy chứ!」"
2670 = "「Kiyoharu?」"
2671 = "「Tại sao? Không làm nhiệm vụ được á? Vấn đề là gì vậy??」"
2673 = "「Đúng vậy. Cách chống lại Đại bãi bỏ, không chỉ dừng lại ở hình thức tiếp tục vận hành kinh doanh như chúng ta đâu」"
2675 = "「Và, cứ chạy như thế thì sẽ được nhận tiền lương đấy! Tiền lương, dùng vào việc gì cũng được luôn?」"
2679 = "「Ông nội và mọi người đi tham gia chuyến du lịch giải khuây của hiệp hội thuyền du lịch rồi. Nhưng mà, gọi điện lúc nào cũng được, ạ......」"
2681 = "「Reina cũng vậy đó ạ. Vì Reina là đứa trẻ của đường sắt khai thác mỏ mà.」"
2683 = "「Reina, lúc đó sẽ cố gắng nha~!」"
2686 = "「Hiểu và đồng tình?」"
2687 = "「Kẻ lập dị…… là sao ạ」"
2689 = "「Tất nhiên rồi. Em làm vậy thì công ty cũng được nhờ」"
2690 = "「Tất nhiên rồi. Vì đó là chuyện của chính bản thân Olivy mà」"
2691 = "「Tất nhiên là mong muốn rồi! Olivy phải làm gì đây!? Em có thể làm được gì?」"
2692 = "「Tất nhiên rồi!」"
2695 = "「Đúng vậy. Lời khuyên của ngài ấy cũng rất chất lượng. Cả chúng tôi và Đường sắt Ohito, đều nhận được sự giúp đỡ rất nhiều từ ngài ấy.」"
2696 = "「Thật sự, rất tốt」"
2697 = "「Thật sự, rất cảm ơn ngài! Tôi――sao nhỉ, nói thế nào đây, như được sáng mắt ra vậy」"
2700 = "「Đúng là khác thật! Được giải thích đàng hoàng, thì dù cùng là 'Vâng!' nhưng cảm giác hoàn toàn khác luôn!」"
2702 = "「Thật sao!? Vui quá! Có vẻ thú vị lắm đây!」"
2706 = "「Viện nghiên cứu, sao ạ?」"
2709 = "「Đúng là vậy đấy. Tiền lương của em, tôi cũng ủng hộ việc em nên tự do sử dụng.」"
2710 = "「Đền thờ? Sao người của đền thờ lại」"
2714 = "「Lúc này là sao?」"
2715 = "「Gì chứ, ta cứ mong đợi là cuối cùng cũng được chiêm ngưỡng bản thiết kế chính thức cơ đấy」"
2717 = "「Vì những lý do đó nên mới thành ra thế này. Làm em bất ngờ rồi, xin lỗi nha?」"
2719 = "「Thêm nữa, có khi tình cờ đúng lúc đó, cô ấy đi đâu đó xa đến mức không thể \\x%l共感;#00ffc040;cộng cảm%l;#; được thì sao.」"
2725 = "「Olivy có sự tích lũy về kinh nghiệm và kiến thức liên quan đến đường sắt mà chúng tôi không hề biết.」"
2726 = "「Thêm vào đó là Đại bãi bỏ. Hiện tại, ít nhất là trong nội bộ Hinomoto, nó đã trở thành một công nghệ hoàn toàn không thể tái hiện lại được nữa」"
2729 = "「Ông hiểu nhanh như vậy thì đỡ quá. Vậy thì—— lời đồn đó... Lời đồn về cô gái quấn băng gạc trong khuôn viên đền Akai Aso, quả nhiên là...」"
2736 = "「Thế thì. Về chuyện mà Hinai đã hỏi thăm」"
2739 = "「Nếu thấy lãng phí, ta đã ngắt lời rồi. Việc được tận mắt chứng kiến sự gắn kết bền chặt của tổ chức Đường sắt Ohigawa, cũng là một điều tốt」"
2742 = "「Nếu \\x%lレイルロオド;#00ffc040;Railord%l;#; thuộc hàng lâu đời nhất còn đang hoạt động đến chơi, thì chắc hẳn con bé đó cũng sẽ rất hứng thú đấy.」"
2745 = "「Kiểm tra toàn diện hàng năm, với tiềm lực vốn của Đường sắt Ohigawa thì không thể nào thực hiện được――ngươi biết chứ?」"
2746 = "「Lẽ nào là, \\x%l共感;#00ffc040;cộng cảm%l;#; sao?」"
2753 = "「Lời đồn về cô gái quấn băng gạc?」"
2754 = "「Nếu không gỡ bỏ được thì sao?」"
2757 = "「Nhỡ đâu dùng não quá nhiều lại bị sốt thì sao ạ? Để đề phòng, hay là chúng ta hoãn việc tham dự cuộc họp――」"
2759 = "「Nếu vậy thì…… xem nào, tôi sẽ thưa với Điện xá Công chúa điện hạ, 'Xin ngài thứ lỗi cho lúc này'」"
2760 = "「Nếu là chuyện tiền bạc thì... Dù chắc chắn là không đủ đâu, nhưng nếu vậy thì Olivy không cần nhận lương cũng được.」"
2761 = "「Đền Akai Aso, em đã cùng ngài Soutetsu đến thăm rất nhiều lần rồi đúng không ạ?」"
2767 = "「Nào. Ta đã xem qua tình trạng của Olivy rồi―― Đúng là ở trạng thái 'vừa vặn qua' kỳ kiểm tra theo luật định nhỉ」"
2770 = "「Đúng là vậy nhưng――đi hỏi \\x%lレイルロオド;#00ffc040;Railord%l;#; mấy chuyện đó, Đường sắt Ohigawa đúng là……」"
2772 = "「Có giận dỗi gì đâu mà thông cảm chứ~. Olivy biết Hachiroku chỉ lỡ lời thôi mà」"
2773 = "「Nào. Công nghệ chế tạo mới \\x%lレイルロオド;#00ffc040;Railord%l;#; hình người, vốn dĩ đã là một công nghệ có tính bảo mật cao」"
2775 = "「Cảm ơn em.」"
2776 = "「Cảm ơn mọi người.」"
2810 = "「Không――」"
2811 = "「Cái đó…… A, đúng rồi. Chẳng phải là \"đóng cửa cộng cảm\" sao?」"
2812 = "「Ừm…… ngài Soutetsu?」"
2813 = "「Đây không phải chuyện tôi có thể trả lời, mọi người hãy tự mình kiểm chứng tận mắt đi.」"
2814 = "「Điều đó chứng tỏ, họ rất coi trọng Đường sắt Ohigawa đấy」"
2815 = "「Chuyện đó là tất nhiên rồi. Nguy hiểm lắm mà.」"
2816 = "「Thế thì giúp ích nhiều lắm. Vậy, về khóa đào tạo kỹ thuật bảo trì đường ray, để sau chúng ta bàn bạc thêm nhé.」"
2817 = "「Vâng――tôi chỉ ghép lại từ những lời của Điện xá Công chúa điện hạ thôi ạ. Xin ngài cứ tùy ý sử dụng」"
2818 = "「Việc nào ra việc đó. Tiền lương thì em cứ giữ lấy, Olivy hãy dùng theo ý thích của mình đi.」"
2819 = "「Tạm thời vậy là được rồi mà? Soutetsu và Hachiroku, bây giờ còn chuyện gì muốn nói với Niiroku nữa không?」"
2820 = "「Vậy sao ạ~」"
2821 = "「Vậy sao! Thế Guji là tên đệm à?」"
2822 = "「Vậy sao! Tốt quá! Vậy, làm lại từ đầu nha~! Olivy là Olivy! Rất vui được gặp bạn!!」"
2823 = "「Vậy sao. Thế thì chẳng có vấn đề gì cả! Cũng không phải chuyện gấp gáp gì, cậu cứ suy nghĩ đi nhé.」"
2824 = "「Tài liệu lần này, tôi nghĩ nên để Điện xá Công chúa điện hạ xem qua」"
2825 = "「Vậy thì, ta sẽ chỉ cho 'Bí quyết sống khỏe cho \\x%lレイルロオド;#00ffc040;Railord%l;#;'. Gì chứ――đó là một phương pháp cực kỳ đơn giản và dễ dàng thôi」"
2827 = "「!」"
2828 = "「!!?」"
2829 = "「Không, tôi thì——」"
2833 = "「Em có ý kiến khác sao?」"
2834 = "「Vậy thì――」"
2839 = "「Ý ngài là dù có cố gắng tái tạo…… hay chế tạo mới \\x%lタブレット;#00ffc040;Thẻ bảng%l;#;, cũng không thể thực hiện được――đúng không ạ?」"
2844 = "「Đương nhiên cũng có những vấn đề đó. Nhưng về mặt kỹ thuật thuần túy, cũng bó tay. Hoàn toàn không thể tái tạo lại Lõi Lord được」"
2845 = "「Vậy thì, ta sẽ hỏi」"
2847 = "「Vậy ta sẽ chỉ cho nhé? Vừa hay, để chuẩn bị công bố thông tin rộng rãi, ta cũng đang muốn tăng thêm dữ liệu lâm sàng」"
2849 = "「Ông chú kia là ai vậy? Olivy mới gặp lần đầu đúng không?」"
2850 = "「Lõi Lord――là gì vậy ạ? Cái đó ấy」"
2852 = "「Giả sử nhé? Giả sử bây giờ, Olivy nói không chịu, thì lúc đó Paulette sẽ làm gì?」"
2854 = "「Vậy thì cậu làm nhiệm vụ cùng Kiyoharu đi? Để chú ấy học lái đầu máy hơi nước là được mà.」"
2856 = "「Vậy thì, về thôi. Hachiroku, Olivy.」"
2858 = "「Olivy cũng không nói gì nữa đâu~. Chuyện nhà người ta, thì không được chọc ngoáy vào mà~」"
2859 = "「Vậy thì, có thể cô ấy có chức năng mà Olivy hay Hachiroku không có!」"
2861 = "「Vậy sao」"
2863 = "「Vậy, chốt thế nha. Hẹn gặp lại nhé? Niiroku!」"
2864 = "「Vậy thì tốt quá.」"
2865 = "「Thế thì tuyệt quá nè!」"
2867 = "「Vậy thì cứ tỏ ra lạnh lùng luôn không được sao? Kiểu nhân vật cool ngầu, lạnh lùng ấy.」"
2869 = "「Vậy thì, rút ra nhé? Đừng có cắn đấy」"
2870 = "「Vậy thì, tiếp theo nhé? Vì đã nhận được sự đồng ý của Olivy, nên——」"
2874 = "「Đó…… có lẽ là một ý hay đấy. Nếu Fukami có thể đảm nhận vị trí \\x%l車掌;#00ffc040;trưởng tàu%l;#;, chắc chắn sẽ cân bằng lại được.」"
2877 = "「Vậy thì thật là――thật sự rất tốt ạ」"
2878 = "「Vậy thì, \"cô gái quấn băng gạc\" đó, là \\x%lレイルロオド;#00ffc040;Railord%l;#; của vị đền chủ đó hả?」"
2881 = "「Sao hả? Hinai. Kết quả kiểm tra lần trước của Olivy. Ta lấy về xem thử có được không?」"
2882 = "「Tôi biết. Kiyoharu đã kể cho tôi nghe rồi. Nói là hôm nay mọi người sẽ đến. Bảo tôi thử gặp xem sao.」"
2885 = "「Tetsureki――Bảo tàng Lịch sử Đường sắt ở Omiya!」"
2889 = "「Vui vẻ tiêu xài tiền lương để giải tỏa căng thẳng. Nếu chất lượng công việc nhờ đó mà tốt lên thì đây là một khoản đầu tư quá hời rồi.」"
2893 = "「Không thể khẳng định chắc chắn nhưng—— khả năng đó cũng không hề thấp đâu ạ.」"
2894 = "「Nếu vậy, các ngươi có thể dùng đôi mắt đã sáng tỏ đó xem qua chuyện khác được không? Hinai, Migita. Dành thêm chút thời gian nữa, có phiền không?」"
2895 = "「Ngài Soutetsu」"
2899 = "「Phương pháp quản lý của Hinai có rất nhiều điểm đáng khen ngợi, ta lại một lần nữa hiểu được điều đó, thật là có ý nghĩa」"
2900 = "「Nào, Hinai. Ta muốn hỏi một điều, với tư cách là một nhà quản lý khôn ngoan và xuất sắc như ngươi」"
2901 = "「Hinai, không sao đâu」"
2905 = "「Không đâu. Trong quá trình tiếp xúc với Olivy, tôi mới nhận ra. “Đường sắt” mà tôi biết, chỉ là một phần rất nhỏ bé mà thôi.」"
2911 = "「I see! Em hiểu rồi! Cảm ơn nha! Cậu giải thích giỏi ghê! Nè? Cậu tên gì vậy??」"
2913 = "「OK!」"
2915 = "「Ok! Vậy, Olivy muốn cung cấp dữ liệu đó! Làm vậy được không? Paulette?」"
2916 = "「A, ngài Soutetsu」"
2917 = "「Vâng, nhờ ngài ạ」"
2918 = "「Ngài cứ yên tâm ạ」"
2920 = "「~~~! Vâng!!!」"
3097 = "Niiroku bắt đầu run rẩy từng cơn, như thể không kìm nén được nữa."
3100 = "Cảm nhận được điều đó, tôi đã cất tiếng."
3104 = "Từ trong bóng tối, có người đang chăm chú nhìn về phía này. Khuôn mặt quấn kín băng gạc, có lẽ là——"
3106 = "Ba người ngay lập tức phủ nhận theo ba cách khác nhau. Khoảnh khắc nghe thấy điều đó, nụ cười của Olivy càng thêm rạng rỡ."
3111 = "Từ trên cao, vù vù, tiếng gió rít vang lên như cố ý để tôi nghe thấy."
3113 = "Niiroku—— và cả Hachiroku, đều nín thở."
3117 = "Bất chợt, giọng điệu của Olivy thay đổi. Trầm xuống."
3121 = "Chắc là trong vô thức. Hachiroku chạm vào chiếc \\x%lタブレット;#00ffc040;Thẻ bảng%l;#; trên cổ. \\x%lタブレット;#00ffc040;Thẻ bảng%l;#;…… quả thực là một thứ vô cùng khó định nghĩa."
3124 = "Chị Mayami thì thầm to nhỏ gì đó vào tai Nagi."
3129 = "Nhưng——"
3130 = "Nhưng, tôi không ngăn lại. Hachiroku cũng không có vẻ gì là sẽ ngăn cản."
3131 = "Vì vậy, cuối cùng tôi cũng hiểu ra."
3132 = "Nhưng đúng như lời Olivy nói, tôi cũng không nghĩ chúng tôi nên chọc ngoáy vào chuyện đó."
3135 = "Không, gần như chắc chắn rồi. Là một \\x%lレイルロオド;#00ffc040;Railord%l;#; trong \\x%l運転体;#00ffc040;kíp lái%l;#;."
3138 = "Đó cũng là điều mà Paulette đã vô cùng trăn trở, như cô ấy đã thổ lộ với Công chúa Tàu điện."
3141 = "Olivy đã đóng cửa \\x%l共感;#00ffc040;cộng cảm%l;#;, khép kín trái tim mình——"
3145 = "Niiroku, không còn phản bác nữa."
3148 = "Niiroku rơi vào im lặng. Đợi một lát—— Olivy cất lời một cách điềm đạm."
3149 = "Niiroku im lặng, cũng không vẫy tay chào lại. Nhưng mà, tôi tin tưởng."
3161 = "Có lẽ là vì giọng điệu quá đỗi thân mật với Điện xá Công chúa điện hạ."
3162 = "Nếu vậy, cô ấy đã hoàn toàn cắt đứt \\x%l共感;#00ffc040;cộng cảm%l;#; sao. Hay là bản thân khả năng cộng cảm đã bị hỏng——"
3166 = "Tình trạng đó, nhìn vào biểu hiện bây giờ, có lẽ đã được giải tỏa một cách tự nhiên từ lúc nào không hay."
3169 = "Paulette lắp bắp trong giây lát―― nhưng ngay sau đó gật đầu, lấy lại bình tĩnh."
3171 = "Bất chấp việc đang giữa cuộc họp trực tuyến, Paulette cuống cuồng hướng về phía Olivy――"
3172 = "Nhưng, Fukami là bậc thầy tiếp khách. Với tài ăn nói đó, chắc chắn con bé sẽ biến sự vô cảm thành điểm nhấn quyến rũ cho xem."
3174 = "Chỉ bằng một câu nói vừa rồi, chỉ bằng nụ cười rạng rỡ ấy, cũng đủ để truyền đạt rõ ràng đến Điện xá Công chúa điện hạ."
3181 = "Hachiroku lộ vẻ kinh ngạc. Nhưng, việc nhận được tiền lương thì sao đến giờ Hachiroku lại——!"
3184 = "Hachiroku chứng thực suy đoán của tôi, bằng những lời lẽ điềm đạm cùng một nụ cười."
3186 = "Hachiroku và Niiroku gần như đồng thời nhìn Olivy."
3188 = "Cả Hachiroku, Reina, và chính bản thân Olivy. Nếu vậy thì đó, có lẽ là chuyện hiển nhiên rồi."
3190 = "Hachiroku vội vàng giật lấy chiếc nhiệt kế, quay ngoắt lưng lại với tôi――"
3191 = "Hachiroku mỉm cười, Olivy cũng cười đáp lại."
3193 = "Khẽ gật đầu, Hachiroku gõ nhẹ 'cốc' lên trán mình. Rồi em ấy quay lại đối mặt trực tiếp với Olivy một lần nữa."
3204 = "Vẻ mặt tinh nghịch vừa mới hiện trên khóe môi lúc nãy, cũng đã biến mất tăm."
3215 = "Ra vậy, cũng có mối lo ngại như thế sao."
3224 = "Cô ấy cúi gầm khuôn mặt dưới lớp băng gạc, đứng bất động, chỉ lặng lẽ lắng nghe."
3228 = "À――cái này…… có lẽ bây giờ Olivy, đang liên tưởng, và nhớ lại."
3233 = "Khuôn mặt ỉu xìu vì lỡ lời của Nagi nhanh chóng lấy lại vẻ tươi sáng đầy sức sống."
3234 = "Bởi vì sợ hãi—— nên cứ nghĩ rằng nếu làm điều gì đó, nếu quyết định thật nhanh, thì có thể trốn thoát khỏi nỗi sợ ấy……"
3237 = "Trong một khoảnh khắc, tay Niiroku định cử động—— nhưng, cô ấy không làm gì cả, rồi lại hạ tay xuống vị trí cũ."
3242 = "Bị cuốn theo nụ cười của Olivy, những nụ cười cũng ngập tràn xung quanh. Một bầu không khí nhẹ nhõm, an tâm lan tỏa."
3259 = "Vẻ mặt nhẹ nhõm của Olivy, trở lại nghiêm túc."
3260 = "Olivy mỉm cười đưa tay phải ra. Nhưng Niiroku không có ý định bắt lấy tay cô bé."
3261 = "Những gì Olivy muốn truyền đạt. Phần quan trọng nhất trong đó, chắc chắn đã được thấu hiểu."
3262 = "Ánh mắt Olivy hướng về phía Kisaki."
3263 = "Với Olivy đang nghiêng đầu thắc mắc, Paulette nở nụ cười dịu dàng."
3264 = "Bắt gặp ánh mắt có vẻ khó hiểu của Olivy, Hachiroku khẽ lắc đầu."
3265 = "Nụ cười rạng rỡ. Olivy lúc này như chỉ chực nhảy cẫng lên."
3266 = "Phản bác lại lời của Hachiroku―― Olivy há hốc miệng chữ A, ngừng cử động."
3267 = "Gật đầu nhè nhẹ―― Olivy nhìn Paulette với vẻ hơi xấu hổ."
3268 = "Cười ahaha, Olivy ngơ ngác nghiêng đầu."
3269 = "Gật đầu thật mạnh với nụ cười tươi rạng rỡ. Olivy giữ nguyên nụ cười đó quay sang Hachiroku."
3270 = "Olivy vô cùng nhẹ nhàng đưa ra dự định của Paulette—— cũng là phương án mà chúng tôi đã đồng ý."
3271 = "Thấy Olivy ngạc nhiên cứng đờ người, Paulette cất giọng có vẻ áy náy."
3273 = "Chắc là trong lúc chúng tôi đang thuyết phục Olivy, cô ấy đã sắp xếp xong xuôi rồi."
3274 = "Biểu cảm của cô bé bỗng bừng sáng. Quả nhiên, giống hệt như chúng tôi—— giống hệt như chúng tôi thuở nhỏ."
3277 = "'Chuyện này đến đây là kết thúc', Cử chỉ đó đang thông báo một cách vô cùng hùng hồn và quả quyết."
3278 = "Em ấy nhắc nhở hoàn toàn chính xác. Lúc nãy đúng là chúng tôi đã quên mất hoàn cảnh mà tình tứ với nhau."
3282 = "Nghe vậy tôi chợt nhớ ra. Khi Olivy kể về Munakata—— Công chúa Tàu điện."
3283 = "Cạch, chiếc quạt gập lại."
3284 = "Nếu không có \\x%l車掌;#00ffc040;trưởng tàu%l;#;, \\x%lレイルロオド;#00ffc040;Railord%l;#; phải kiêm luôn việc tiếp khách, thì quả thực, vô cảm sẽ rất khó khăn."
3294 = "Ngay khi tiếng đóng cửa vang lên, ánh mắt của Điện xá Công chúa điện hạ vụt――nheo lại sắc lẹm như lưỡi dao."
3298 = "Nó không đơn thuần chỉ là phương tiện xác thực, khởi động, hay lưu trữ ký ức, tôi cũng cảm nhận rõ điều đó nhưng――"
3299 = "Ngay cả tôi, một người không có khả năng \\x%l共感;#00ffc040;cộng cảm%l;#;, cũng cảm nhận được sự hiện diện. Khá gần—— Chắc chắn, đang ở đây."
3301 = "Ngay lập tức, bên ngoài phạm vi camera có thể ghi hình, tiếng bước chân vội vã lùi xa dần."
3309 = "Thật đáng tiếc, Navi cũng chẳng có cách nào tiêu tiền—— Có lẽ tôi sẽ cung cấp cho cô ấy loại dầu cao cấp nhất hay gì đó tương tự vậy."
3310 = "Chuyển từ Đường sắt Mikan sang Đường sắt Ohigawa―― Quyết định của chính mình, vào ngày hôm đó."
3325 = "Câu nói bất giác thốt ra của tôi, được đáp lại bằng một tiếng cười khúc khích nhỏ."
3327 = "Dù qua lớp băng gạc dày cộp, tôi vẫn cảm nhận được sự dao động—— hay có lẽ là sự tức giận của Niiroku."
3330 = "Bất giác thốt lên tiếng thở dài thán phục, Hachiroku cũng gật đầu đồng tình với tôi."
3333 = "Tôi rút chiếc nhiệt kế em ấy đang ngậm trong miệng ra."
3334 = "Nếu vậy, đến lúc rút lui rồi."
3335 = "Tôi và Michiko cũng từng như vậy."
3337 = "Không chút khó khăn, chiếc nhiệt kế từ miệng Hachiroku chuyển sang tay tôi."
3340 = "Tôi cũng…… mải mê ngắm nhìn Olivy. Một nụ cười rạng rỡ và dịu dàng—— đẹp đẽ biết bao."
3341 = "Ngay khoảnh khắc đó, với vẻ mặt ngượng ngùng, Olivy thè lưỡi ra."
3344 = "Đúng lúc tôi định hỏi Hachiroku, thì lại bị Hachiroku hỏi ngược lại."
3346 = "Vì thế, tôi hoàn toàn đồng ý với đề xuất của Paulette. Không chỉ vậy, tôi còn mong đợi nhiều hơn thế."
3349 = "Lần này, cô ấy khẽ cúi đầu riêng với Olivy. Sau đó, Paulette điều chỉnh lại nét mặt, trở nên nghiêm túc."
3355 = "Việc cô ấy đã kìm nén, hay thậm chí cắt đứt hoàn toàn \\x%l共感;#00ffc040;cộng cảm%l;#; đến mức đó, thì đã đành một nhẽ——"
3363 = "Chắc là do bị hỏi quá đột ngột nên cô ấy luống cuống."
3374 = "Hướng về những người tham dự. Và có lẽ cũng là để cảm tạ sự quan tâm của những người không thể đến dự, Paulette cúi đầu thật sâu."
3375 = "Chắc Paulette cũng cảm nhận được điều đó, lời nói của cô ấy càng trở nên thận trọng hơn."
3376 = "Hừm! Gương mặt đang hừng hực khí thế của Reina, được Paulette xoa xoa, liền trở lại vẻ tươi cười ngay lập tức."
3377 = "Paulette nhìn thẳng vào một mình Olivy. Làm thế nào để truyền đạt câu nói này đây——."
3378 = "Giọng của Paulette cũng đầy nhẹ nhõm."
3379 = "Ánh mắt Paulette chuyển hướng. Phía trước ánh nhìn ấy, đền chủ Akai đang cười gượng."
3390 = "Cả Reina và Olivy đều ngơ ngác―― Chỉ có Paulette là hai mắt sáng rực rỡ."
3392 = "Không biết là có hiểu hay không, với nụ cười tủm tỉm như mọi khi, Reina đang ngoan ngoãn ngồi trên đùi Paulette."
3406 = "Tôi cứ tưởng đó là thể loại chuyện ma quái vớ vẩn nên đã bỏ ngoài tai... Nhưng suy luận từ nội dung cuộc nói chuyện giữa Paulette và đền chủ Akai thì——"
3407 = "Tất nhiên là có chuyện muốn hỏi. Nhưng—— nghĩ lại thì, không có gì có thể hỏi ngay lúc này cả."
3408 = "Nói thẳng thừng đến thế ngay trước mặt Olivy―― Tôi thoáng nghĩ vậy, nhưng không ai phản ứng gì."
3410 = "Một cú ném thẳng vào giữa trọng tâm. Thì ra đây là phong cách Mỹ sao, tôi bất giác có suy nghĩ lệch lạc như vậy."
3411 = "Có vẻ như, không phải là vấn đề về giọng điệu."
3412 = "Có lẽ cô bé đã sớm hiểu được, ai mới là người giữ két sắt của Đường sắt Ohito."
3417 = "À, quả nhiên là vậy. Tôi thầm nghĩ khi nhìn thấy ánh mắt ấy chuyển động. Olivy kính yêu \\x%l機関士;#00ffc040;Lái tàu%l;#; Munakata đến nhường nào――"
3428 = "Ngón tay Kisaki khẽ động, như thể đang gảy những hạt bàn tính trong tưởng tượng."
3438 = "\\x%lレイルロオド;#00ffc040;Railord%l;#; quấn băng gạc có lẽ cũng không ngờ tới điều này, dù không nhìn thấy biểu cảm nhưng có vẻ cô ấy đang rất bối rối."
3445 = "Nếu có thể giảm thiểu xác suất xảy ra những điều đó, dù chỉ một chút――"
3448 = "Bệnh tật và thương tích đối với \\x%lレイルロオド;#00ffc040;Railord%l;#;, chắc là hỏng hóc, hư hại nhỉ."
3451 = "Đặt những câu hỏi khá sâu sát, trực tiếp với Điện xá Công chúa điện hạ―― Đến mức độ được phép làm như vậy."
3452 = "Và đồng thời, tôi nhận ra cho đến nay――ngay cả tôi, chồng của Hachiroku, cũng chưa từng quan tâm đến sức khỏe của \\x%lレイルロオド;#00ffc040;Railord%l;#;."
3455 = "Lạch, cạch, lạch. Âm thanh đóng mở lặp đi lặp lại nhè nhẹ, như đang truyền tải một sự bực dọc nào đó."
3457 = "Nhanh ý nhận ra, Hachiroku dẫn Olivy và Reina ra ngoài."
3458 = "Giọng điệu của Hachiroku. Có vẻ như em ấy hoàn toàn không biết gì về chuyện này."
3459 = "Bị Fukami cản lại, Nagi lấy hai tay che miệng. Phía trước ánh mắt cô bé, Olivy đang cười gượng gạo."
3460 = "Nếu khả năng \\x%l共感;#00ffc040;cộng cảm%l;#; bị hỏng hóc, thì cũng giống như bị bịt mắt. Về mặt an ninh, không thể nào để cô ấy làm nhiệm vụ trên tàu được."
3468 = "Bị ngước nhìn bằng ánh mắt cầu cứu, tôi rất muốn nói cho em ấy câu trả lời nhưng――"
3470 = "Khi được hỏi, Hachiroku lại tỏ ra không giống mình ngày thường, cô khẽ gật đầu một cách vô cùng mơ hồ."
3474 = "Dùng khăn tay cẩn thận lau sạch chiếc nhiệt kế―― Cử chỉ đó, thật sự rất đáng yêu và dễ thương."
3479 = "Nói đến đó, Olivy bất chợt dừng lại. Ánh mắt ánh lên nét cười tủm tỉm, có chút tinh nghịch."
3480 = "Nụ cười khi nói ra điều đó, bắt đầu xịu xuống với tốc độ chóng mặt."
3490 = "Đền chủ Akai liếc nhìn chiếc đồng hồ treo tường, rồi đứng dậy."
3493 = "Nghe tiếng Paulette, Olivy nhìn quanh một vòng."
3506 = "Tiếng lầm bầm đó, là cảm xúc của chính Hachiroku, hay là \\x%l共感;#00ffc040;cộng cảm%l;#; đến từ Olivy, tôi cũng không thể biết được."
3508 = "Thật đáng ngạc nhiên."
3509 = "Một lời đồng ý quá đỗi dễ dàng."
3510 = "Trước mặt Paulette đang sững sờ kinh ngạc, Olivy thậm chí còn mỉm cười điềm tĩnh."
3511 = "Vừa nhắc Tào Tháo là Tào Tháo đến ngay. Nhìn sang Hachiroku và Olivy, cả hai đều mỉm cười gật đầu đáp lại."
3512 = "Giọng nói, khuôn mặt của Olivy, trong khoảnh khắc đó chợt cứng đờ."
3513 = "Chỉ còn biết thán phục. Olivy, không biết là có ý thức hay rất tự nhiên——"
3514 = "Sự ngạc nhiên, cảm động, hay một thứ cảm xúc nào khác đang bủa vây trong lòng cô ấy, tôi hoàn toàn không thể đoán biết được."
3518 = "Phản ứng đó, có lẽ là do ngài ấy đã nhận được \"sự cộng cảm ở mức độ cảm xúc\" từ Olivy chăng."
3520 = "Nếu vậy…… cứ làm theo đề xuất của Olivy, tạm thời rút lui lúc này cũng tốt."
3521 = "Nếu vậy, để không lặp lại sai lầm tương tự, chỉ cần truyền đạt một lời là đủ."
3522 = "Nếu vậy, 'chuyện nhà người ta', hay 'gia đình xào xáo' gì đó, mới là lý do khiến Paulette hoảng hốt chăng……?"
3525 = "Chiếc quạt xòe ra cái phạch, che đi khóe miệng của Điện xá Công chúa điện hạ."
3526 = "Dù là việc có vẻ đơn giản, nhưng Hachiroku khẽ nhắm mắt lại, hướng chiếc nhiệt kế về phía tôi."
3527 = "Dù lập trường hoàn toàn khác nhau, nhưng điểm chung là \"chỉ được vận hành trong những môi trường hạn chế\"."
3528 = "Dù đã nghe nói là \"chắc chắn sẽ hứng thú\", nhưng tôi không ngờ lại đến mức này——!!"
3531 = "Điện xá Công chúa điện hạ đã nghe kế hoạch vận hành Olivy từ Paulette, và dựa trên đó, ngài đã khuyên nên công bố sớm."
3532 = "Cạch, Điện xá Công chúa điện hạ khép quạt lại thật mạnh trong tích tắc, tạo ra một âm thanh khô khốc."
3533 = "Lạch cạch, lạch cạch, chiếc quạt của Điện xá Công chúa điện hạ nhịp nhàng gõ nhẹ."
3534 = "Nhận lấy tập tài liệu từ bàn tay vươn ra ngoài khung hình, Điện xá Công chúa điện hạ lật giở với tốc độ đáng kinh ngạc."
3535 = "Điện xá Công chúa điện hạ, bật cười vô cùng thích thú. Nhưng ngay sau đó, khóe miệng ngài đã bị chiếc quạt che khuất."
3536 = "Chỉ một khoảnh khắc――Điện xá Công chúa điện hạ nín thở."
3537 = "Xua đi nét u buồn thoáng hiện trong đôi mắt, ánh nhìn của Điện xá Công chúa điện hạ chuyển sang trái."
3538 = "Một cái quạt có vẻ đầy mãn nguyện. Đôi mắt của Điện xá Công chúa điện hạ khẽ――nheo lại."
3539 = "Chầm chậm, chiếc quạt mở ra. Khóe miệng bị che đi, chỉ có thể đoán được biểu cảm qua đôi mắt."
3540 = "Chiếc quạt nhỏ khẽ phe phẩy, mái tóc của Điện xá Công chúa điện hạ cũng đung đưa theo."
3553 = "\\x%lレイルロオド;#00ffc040;Railord%l;#; quấn băng gạc hoàn toàn không có phản ứng gì trước kích thích khiến cả Hachiroku cũng phải giật mình."
3560 = "\\x%lレイルロオド;#00ffc040;Railord%l;#; số hiệu đầu tiên của dòng máy sản xuất hàng loạt nội địa, và \\x%lレイルロオド;#00ffc040;Railord%l;#; đã liên tục làm việc trên tuyến đường sắt mỏ."
3567 = "（……Paulette và Olivy, có vẻ như đang hiểu ra điều gì đó nhưng――）"
3578 = "（Ra vậy…… Olivy, thực ra rất nhút nhát sao.）"
3580 = "（A—— nhắc mới nhớ, chuyện tuổi thọ các thứ làm mình quên béng mất……）"
3583 = "（À, chắc là xấu hổ vì dính đầy nước bọt đây mà）"
3584 = "（Bóp）"
3586 = "（Chỉ có thể để cô bé tự lo liệu thôi. Vì đây là—— công việc của Olivy mà.）"
3587 = "（Có lẽ ở đâu đó trong thâm tâm, tôi đã mặc định \\x%lレイルロオド;#00ffc040;Railord%l;#; là máy móc, là đồ vật―― chỉ cần giao cho việc bảo dưỡng kiểm tra là ổn thôi）"
3591 = "（Tít tít! Tít tít!）"
3594 = "（Vậy thì—— gặp được thì tốt rồi nhưng）"

[selections]
