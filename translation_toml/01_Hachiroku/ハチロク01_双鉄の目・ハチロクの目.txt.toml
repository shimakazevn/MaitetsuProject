2019 = "「Không ạ……Chỉ là em cảm thấy, thời đại thực sự đã thay đổi rồi. Bây giờ…… Từ lúc tỉnh dậy đến giờ, đây là lần em cảm nhận được điều đó rõ rệt nhất.」"
2020 = "「Đúng vậy. \\x%l機関士;#00ffc040;Người lái tàu%l;#; của tuyến đường sắt được sử dụng hàng ngày, thay vì là một con người, thì giống như một cỗ máy, hay một bối cảnh hơn.」"
2022 = "「Vâng. Vì vậy, nếu xét đến việc dùng làm \\x%l客車;#00ffc040;toa hành khách%l;#; nòng cốt cho du lịch, thì những phương tiện phế bỏ, dù có tìm thấy, e là cũng khó mà đáp ứng được.」"
2024 = "「Đúng vậy. ……Không chừng, dùng tiền mua đứt một \\x%l客車;#00ffc040;toa hành khách%l;#; có tình trạng tốt còn rẻ hơn ấy chứ.」"
2026 = "「Đúng vậy nha~. Là những bé bị để nguyên ở bãi phế liệu, hay bị bỏ mặc ở những công ty đường sắt đã ngừng hoạt động đó ạ.」"
2039 = "「Những chính sách mà Paulette kỳ vọng, làm như vậy, có khi lại dễ dàng tìm thấy manh mối hơn.」"
2040 = "「Là ảnh của ba Paulette sao. Ra là vậy, ông ấy thực sự rất yêu thích nhỉ.」"
2041 = "「Chắc những người bạn \\x%lまいてつ;#00ffc040;Maitetsu%l;#; của Paulette vẫn xem đấy. Nếu vậy thì, nó vẫn phù hợp với mục đích ban đầu, nhưng——」"
2044 = "「Tại sao?」"
2046 = "「Và, phần thân xe, tương ứng với nó sẽ là phần thân mình.」"
2047 = "「Ảnh……」"
2049 = "「Ba tôi, đã chụp rất nhiều ảnh. Của Ohimitera, và cả của đường sắt nữa.」"
2053 = "「Vậy là, mọi người đã đông đủ rồi nhỉ.」"
2054 = "「\\x%l台車;#00ffc040;Giá chuyển hướng%l;#; thì, ừm, bây giờ mọi người cứ tạm hiểu nó là phần gầm xe đi.」"
2056 = "「Không chỉ hai người, mà tôi muốn mượn trí tuệ của tất cả mọi người.」"
2058 = "「Nghe nói có thể chụp được 1000 hay 2000 tấm mà. Tôi cũng nghe bảo ảnh hỏng thì cứ xóa đi là xong——Hửm?」"
2060 = "「Quả là một bức ảnh tuyệt vời. Thế mà em——bây giờ mới được thấy lần đầu.」"
2062 = "「Có thể lắm! Kiểu như 『Nếu được sử dụng một cách đẹp đẽ như thế này』, 『Nếu được yêu thương nhiều như thế này』 ấy.」"
2065 = "「Ra là vậy. Toàn bộ phương tiện bị phế bỏ, không hẳn là sẽ bị tháo dỡ ngay lập tức nhỉ.」"
2066 = "「Đó mới là vấn đề.」"
2070 = "「Đã bị phế bỏ mà còn bị bỏ hoang trong thời gian dài thì—— \\x%l艤装;#00ffc040;Trang thiết bị nội ngoại thất%l;#; thì khỏi phải bàn, ngay cả bản thân phương tiện cũng sẽ bị hư hỏng phải không?」"
2072 = "「In-tơ-nét.」"
2075 = "「Nghĩ đến chuyện sau này thì hơi…… Có vẻ sẽ mang tiếng không tốt cho lắm.」"
2078 = "「Thêm vào đó, nếu 8620 có thể đi vào vận hành thương mại, thì gánh nặng của Kiha 07 và Reina, cũng sẽ được san sẻ.」"
2079 = "「Ý kiến của bọn em, sao ạ?」"
2082 = "「Và \\x%l艤装;#00ffc040;trang thiết bị nội ngoại thất%l;#; thì giống như quần áo hay phụ kiện vậy. Nên nếu là \\x%l客車;#00ffc040;toa hành khách%l;#; du lịch thì phần này cũng rất quan trọng.」"
2086 = "「Tôi nghĩ, có nhiều góc nhìn thì tốt hơn. Nếu muốn hiểu sâu hơn về Ohimitera.」"
2090 = "「Nếu coi đây là điểm nhấn du lịch, thì việc nâng cao chất lượng của \\x%l客車;#00ffc040;toa hành khách%l;#; là vô cùng quan trọng ạ.」"
2092 = "「Khuôn mặt và cuộc sống mà tôi nhìn thấy khi ở cùng Hibiki, sẽ trở thành \"những thứ họ muốn cho Hibiki thấy\" mà.」"
2093 = "「……Ngộ nhỡ, anh trai thực sự không có gu chụp ảnh. Thì việc chụp ảnh, việc quan sát để chụp, cũng rất có ích.」"
2095 = "「Nếu có tủ lạnh thì em đã có thể làm mát nó rồi.」"
2097 = "「Để những người như tôi cũng dễ dàng xem được thì…… Quả nhiên, vẫn phải dùng ấn phẩm giấy sao.」"
2105 = "「Nhân tiện, có thể coi các phương tiện đường sắt thông thường được cấu thành từ thân xe, \\x%l台枠;#00ffc040;khung gầm%l;#;, \\x%l台車;#00ffc040;giá chuyển hướng%l;#;, và \\x%l艤装;#00ffc040;trang thiết bị nội ngoại thất%l;#; ạ.」"
2107 = "「Đúng vậy nha~. Nếu thỉnh thoảng có người thay ca cho thì sẽ có thể thực hiện những đợt kiểm tra tốn nhiều thời gian đó ạ~.」"
2108 = "「Đúng vậy nhỉ, Reina.」"
2109 = "「Chị ấy bảo sẽ giới thiệu trên trang web chính thức của Đường sắt Ohito. Đợi chút, tìm kiếm cái là ra ngay ấy mà.」"
2110 = "「Nhắc mới nhớ, Hibiki cũng.」"
2112 = "「Ưm……Gisou, là gì. Vậy ạ?」"
2148 = "「Đó có lẽ……cũng là một cách. Nhưng mà, xác suất để những phương tiện bị bỏ hoang còn tồn tại cũng rất thấp.」"
2149 = "「Đó là——」"
2150 = "「Ưm……Hình như là.」"
2151 = "「Chuyện đó……tôi cũng, hiểu rõ mà——」"
2152 = "「Cỡ đó thì em hiểu! Nếu là \\x%l客車;#00ffc040;toa hành khách%l;#; thì chỗ hành khách ngồi chính là thân xe chứ gì.」"
2154 = "「Chuyện đó……」"
2155 = "「Về chuyện đó thì, vâng. Trong giới này cũng có những nhà sưu tập, và cũng có những công ty dự trữ sẵn phương tiện dự phòng mà.」"
2156 = "「Chà, ai biết được ạ? Trong tay em thì không còn tấm nào…… Nếu lái tàu Kiyomi vẫn còn sống, thì có lẽ vẫn còn giữ lại.」"
2157 = "「À, ừm……」"
2158 = "「Chuyện đó, là sao cơ……」"
2159 = "「Đang bảo dưỡng quan trọng mà. Đừng bận tâm đến tôi.」"
2160 = "「Cái gọi là máy tính bảng đó hả? Thứ đó ấy.」"
2161 = "「Tiền bưu điện chẳng phải rất phí sao ạ? Ngày nào chúng ta cũng gặp nhau mà.」"
2162 = "「Làm như vậy, sẽ có thể đáp ứng được mong muốn của Hibiki và Paulette. Vì thế, tôi cho rằng đó chính là con đường tốt nhất.」"
2163 = "「Ra vậy……Trường hợp đó, quả thực—— A! Có thể cũng có trường hợp ngược lại nữa.」"
2164 = "「Nếu vậy……Ví dụ như nhờ Reina đi cùng có lẽ cũng là một ý hay nhỉ.」"
2165 = "「Đây là——một bức ảnh tuyệt vời. Rốt cuộc là ai——A.」"
2166 = "「Tâm lý kiểu đó?」"
2167 = "「Chuyện này……là sao ạ? Với tư cách là một phương tiện quảng bá thông tin thì——」"
2168 = "「Ngài đã chụp……rất nhiều nhỉ.」"
2169 = "「Vậy là chốt chuyện rồi nha!」"
2171 = "「Ừm.」"
2172 = "「Ngoài ra, truyền tải cho ai ở đâu cũng…… rất quan trọng. Ạ. Chắc chắn vậy.」"
2178 = "「Nhưng mà, tiền nhiều thế thì đào đâu ra?」"
2179 = "「Vậy để truyền tải sức hấp dẫn—— Khi vẽ bảng hiệu, em luôn tâm niệm điều gì?」"
2181 = "「Mấy thứ đó, chắc chắn cũng chẳng mấy ai thèm ngó tới đâu.」"
2182 = "「Mô hình đó……thị trấn nơi \\x%lNゲージ;#00ffc040;N-gauge%l;#; đang chạy, chắc chắn, cũng được tạo ra như vậy nhỉ.」"
2185 = "「Vậy thì tốt rồi.」"
2187 = "「Nếu vậy thì, tốt quá. Không làm tăng gánh nặng cho Paulette, mà còn giúp ích cho việc quảng bá thông tin.」"
2193 = "「Vậy, phải làm thế nào, để truyền tải sức hấp dẫn của 8620 đây?」"
2197 = "「Vậy thì.」"
2199 = "「Hửm?」"
2200 = "「Những bức ảnh thời đó không còn giữ lại sao?」"
2202 = "「Vậy……dữ liệu ảnh đã gửi, Thị trưởng Paulette, sẽ xử lý thế nào ạ?」"
2203 = "「Chuyện đó tất nhiên là không sao.」"
2204 = "「Tất nhiên! Cũng không tốn nhiều công sức lắm đâu?」"
2205 = "「Vậy, đợi khi thành thạo hơn một chút, chúng ta hãy thử làm như vậy nhé.」"
2208 = "「Đơn giản thôi! Nếu đợt Đại bãi bỏ tuyến đã có rất nhiều thứ bị vứt bỏ, thì cứ nhặt những thứ bị vứt bỏ đó về là được chứ gì!」"
2209 = "「Nếu vậy, Daiwaku? Cái đó là——phần hông hả?」"
2210 = "「Vậy, vì mọi người đã tập trung đông đủ rồi—— Cậu Soutetsu. Nếu được, xin hãy tiếp tục câu chuyện ngày hôm qua.」"
2211 = "「A. Anh trai, sáng nay, gặp chị ấy à?」"
2216 = "「Đường sắt và ga tàu, mới chính là trung tâm của thị trấn. Thị trấn, được tạo nên từ những nhà ga.」"
2219 = "「Anh hai là…… muốn nhìn thấy bộ mặt thật không che đậy nhỉ.」"
2220 = "「Anh hai, vất vả rồi~. Nè, anh chụp được gì thế? Cho em xem với, cho em xem với.」"
2222 = "「Chị hai——khụ—— Chị ấy, không đến sao ạ?」"
2224 = "「Ngoài việc chờ các \\x%lまいてつ;#00ffc040;Maitetsu%l;#; nghỉ hưu ra, thì hoàn toàn không còn cách nào khác để có được \\x%l客車;#00ffc040;toa hành khách%l;#; sao ạ?」"
2230 = "「Tôi, tuy không phải là nhà sưu tập nhưng…… Tâm lý kiểu đó, biết đâu cũng có thể xảy ra nhỉ?」"
2231 = "「Ng, ngài Soutetsu!? Ngài có chụp những chỗ như thế này thì cũng.」"
2232 = "「Những ý kiến hay nguyện vọng đối với chính quyền thành phố—— Cậu Soutetsu, cậu định sẽ thu thập từ hiện trường đúng không?」"
2233 = "「Ngài Soutetsu, ngài xem chăm chú quá nhỉ.」"
2234 = "「Ngài Soutetsu! Ngài vất vả rồi!」"
2235 = "「Ngài Soutetsu, ngài vất vả rồi.」"
2241 = "『「Thật đó!」\\n「Dạ không, không có gì đâu ạ.」』"
2245 = "『「Hả?」\\n「Hả?」』"
2250 = "『「Đúng vậy ạ!」\\n「Đúng rồi đó nha~」』"
2377 = "Vừa mở đầu bằng kết luận, vài chiếc ghế đã kêu cạch một tiếng."
2381 = "Nhoáng một cái, đã xong bức phác họa của tôi. Mang một vẻ mặt, vô cùng bối rối."
2383 = "Một câu hỏi hết sức bâng quơ, nhưng lại khiến ngực tôi nhói đau."
2387 = "Nhưng, để không biểu lộ ra ngoài, tôi điều chỉnh nhịp thở và trấn tĩnh lại. Để không ai khác phải gánh chịu gánh nặng vô nghĩa này."
2389 = "Nhưng khi nhìn kỹ thế này, so với góc nghiêng lúc lái tàu, dáng vẻ hiện tại của Hachiroku lại càng đẹp hơn."
2392 = "Và rồi, nhờ Reina làm phó nháy."
2398 = "Em ấy vẽ \\x%l台車;#00ffc040;giá chuyển hướng%l;#;, thân xe, \\x%l艤装;#00ffc040;trang thiết bị nội ngoại thất%l;#; vào đó—— Rồi giơ tay lên cùng với cây bút chì."
2401 = "Hai lời nói hoàn toàn trái ngược đồng thời thốt ra từ miệng hai người, Nagi ngơ ngác nhìn Fukami."
2404 = "Vừa nói, mắt Hachiroku cũng nheo lại. Như thể đang nhìn về một nơi xa xăm."
2405 = "Hachiroku mở to mắt như đã hiểu ra. Reina cũng, gật đầu thật mạnh."
2408 = "Hachiroku giơ chiếc khăn bằng cả hai tay, ngước nhìn tôi."
2410 = "Có lẽ nghe quá đỗi kỳ lạ, nên Hachiroku nghiêng đầu thắc mắc."
2411 = "Có lẽ em ấy nghĩ giải thích ở đây sẽ nhanh hơn, hoặc đơn giản là chỉ muốn nói——"
2415 = "Lời nói bâng quơ của Hachiroku, khiến tôi thở phào nhẹ nhõm, như được cứu rỗi."
2416 = "Tiếng gọi của Hachiroku kéo tôi về thực tại."
2417 = "Vượt xa khỏi những gì được hỏi, lời giải thích của Hachiroku ngày càng đi sâu vào chi tiết."
2420 = "Một biểu cảm vô cùng đậm chất con người, pha lẫn giữa nụ cười gượng và sự hoài niệm, từ từ hiện lên trên khuôn mặt Hachiroku."
2422 = "Với vẻ mặt nghiêm trang, Hachiroku bổ sung cho những lời còn thiếu sót của tôi."
2423 = "Gật đầu, Hachiroku chầm chậm gật đầu."
2424 = "Ánh mắt Hachiroku, hướng về phía tôi."
2428 = "Vừa nói, Hachiroku vừa trả lại máy tính bảng cho Hibiki."
2432 = "Thêm một tấm nữa. Lần này Hachiroku không hề hay biết."
2434 = "Nói bằng giọng chuẩn bình tĩnh, Hibiki thoăn thoắt đưa bút trên cuốn phác thảo."
2435 = "Nhìn chằm chằm vào nó, một nơi nào đó trong tim tôi trở nên ấm áp—— Đồng thời, cũng cảm thấy nghẹt thở như bị đè nát lồng ngực."
2447 = "Câu hỏi vô cùng mộc mạc của Nagi, đã làm những lời nói đang tuôn trào của mọi người phải nghẹn lại."
2451 = "Đi xa—— Cửa ngõ đó, quả thực lúc nào cũng là nhà ga."
2454 = "Vừa đến gần khu vực lò hơi, chỉ thế thôi mồ hôi đã túa ra như tắm."
2455 = "Dùng chiếc khăn nhận được lau mồ hôi, Hachiroku ngay lập tức, lần này đưa cho tôi một chiếc khăn ướt đã vắt ráo."
2457 = "Vì có thêm toa xe động lực, nên chi phí để có được sẽ tăng lên."
2461 = "Ra là vậy, nếu ở đó thì có thể nghỉ xúc than——Nhưng mà. Chỉ trong vài phút mà vẽ được đến mức này, không, quả thực rất đáng nể."
2474 = "Tất cả các thiết bị phát ra sóng vô tuyến, Navi đều cực kỳ ghét——"
2475 = "\\x%lまいてつ;#00ffc040;Maitetsu%l;#;, dù có thực dụng đến mức nào đi chăng nữa nhưng xét cho cùng, nếu đó là một thế giới mang đậm màu sắc sở thích thì……"
2478 = "Dưới quyết tâm mới mẻ này mà nhìn lại, tôi không còn thấy nó \"chỉ là một món đồ chơi\" như trước nữa."
2480 = "Cách đó một chút, là bóng dáng Hibiki có lẽ đã dọn dẹp xong buồng lái. Em ấy mở cuốn phác thảo ra, cũng đang nhìn tôi."
2483 = "Có thể chụp được khung cảnh nhìn từ \\x%l運転台;#00ffc040;buồng lái%l;#;, mà không hề hy sinh một chút xíu nào sự an toàn."
2485 = "Trong lúc làm nhiệm vụ chạy thử, đương nhiên là tôi không chụp tấm nào, nhưng từ trước khi làm nhiệm vụ cho đến tận bây giờ, những lúc khác gần như đều có thể theo dõi qua ảnh."
2488 = "Trong đợt Đại bãi bỏ tuyến, hầu hết \\x%l客車;#00ffc040;toa hành khách%l;#; đều bị phế bỏ và tháo dỡ, những toa xe hiếm hoi còn sót lại, trước tiên là sẽ không bao giờ bị buông tay."
2495 = "Điều khiển \\x%lスクレイパー;#00ffc040;dao cạo xỉ than%l;#;, bắt đầu sột soạt cạo sạch vết dầu mỡ, ánh mắt em ấy ngay lập tức, chỉ còn tập trung vào công việc."
2497 = "Màu đen xỉn của vết dầu mỡ mang lại cảm giác nặng nề, lại làm cho làn da trắng ngần của Hachiroku tỏa sáng như ánh sáng trong đêm tối."
2500 = "Trèo lên trên \\x%l缶胴;#00ffc040;thân lò%l;#;, đánh bóng xong khu vực quanh ống khói, lòng bàn chân tôi như tê dại vì nóng, ngay cả việc trèo xuống cũng khó khăn."
2505 = "Và trong sự im lặng vừa bao trùm, Fukami lại một lần nữa, rụt rè giơ tay lên."
2506 = "Bên trong tấm sắt này, than đá đang cháy hừng hực. Nóng bức là điều hiển nhiên nhưng——"
2508 = "Địa điểm thì tôi nhận ra. Là đoạn dốc thoai thoải ngay trước ga bỏ hoang Asagiri."
2517 = "Tất nhiên, chắc chắn cô ấy cũng đang suy nghĩ, nhưng tôi không muốn phó mặc toàn bộ chuyện này cho Paulette."
2519 = "Dáng vẻ tràn đầy năng lượng của họ đã nhắc nhở tôi rằng, điều cần nhìn vào chỉ là hiện thực, và tương lai ở phía trước."
2523 = "Cảm giác thành tựu khi hoàn thành việc dọn dẹp, chỉ cần được như vậy thôi cũng đã dâng trào hơn nữa."
2526 = "Ra vậy——thảo nào——"
2527 = "\\x%l先輪;#00ffc040;Bánh dẫn hướng trước%l;#;, đúng như tên gọi, là bánh xe nằm ở vị trí đầu tiên, có kích thước tương đối nhỏ."
2536 = "Mô hình đường sắt chạy bằng điện, lúc nào cũng được trưng bày ở cửa hàng đường sắt."
2538 = "Truyền tải, sức hấp dẫn. Đó là điều mà từ trước đến nay, tôi chưa từng nghĩ đến nhiều——"
2548 = "Chụp từ góc chéo, cả mặt trước lẫn mặt bên, đều được thu gọn đẹp đẽ trong một bức ảnh."
2549 = "Lấy chiếc thẻ nhỏ từ máy ảnh ra, rồi cắm nó vào một khe hở trông như khe cắm——"
2558 = "Không phải thế. Tôi đâu có vướng mắc ở chỗ đó——"
2560 = "Giọng nói dịu dàng, cử chỉ ôn hòa. Paulette, nhẹ nhàng vuốt ve mái tóc của Reina."
2567 = "A không, ra là vậy."
2568 = "Đằng nào cũng không dùng được, nên việc tiếp xúc với sự tiện lợi của chúng, tôi vẫn luôn nửa ý thức tránh né."
2569 = "Với vẻ đầy tự tin, tôi đặt tay cái bộp lên chiếc mũ bảo hộ của Hachiroku."
2572 = "Về phía Hachiroku đang mang vẻ mặt hoảng hốt, tôi xua xua bàn tay đang cầm máy ảnh."
2574 = "Gu hay không thì tôi không rõ, nhưng tôi đã chụp được đúng như những gì mình muốn."
2575 = "Trông có vẻ thận trọng, lại như đang e sợ—— Nhưng đôi mắt lấp lánh sự háo hức, nhìn tôi."
2576 = "Về mặt trực giác thì có vẻ tôi đã hiểu, nhưng vẫn thấy mông lung thế nào ấy. Lát nữa phải chui xuống \\x%lピット;#00ffc040;hố kiểm tra%l;#; nhìn lên để xác nhận lại mới được."
2580 = "Ảnh của tôi thì không nói làm gì, nhưng tranh của Hibiki, để bị vùi lấp thì thật lãng phí."
2582 = "Tôi nhìn Hibiki, tìm kiếm một sự đánh giá."
2585 = "Với quyết tâm đó, tôi cứ thế đánh bóng."
2587 = "Vậy thì, giả sử tôi có thử làm thư ký đi chăng nữa, trong khía cạnh đó, chắc cũng chẳng giúp ích được gì nhiều——"
2588 = "Vì thế, chẳng ai bận tâm cả. Không ngụy trang, không đeo mặt nạ, có thể nhìn thấy dáng vẻ trần trụi nhất."
2590 = "Cảm giác dầu mỡ lấm lem bồ hóng dính nhơm nhớp vào tay, nhưng mấy thứ đó lát nữa rửa là sạch."
2592 = "\\x%l台車;#00ffc040;Giá chuyển hướng%l;#; và thân xe, là phần gầm và phần thân mình—— Khái quát chung chung thế này thì trình độ như chúng tôi mới dễ hiểu được."
2601 = "Rút máy ảnh ra, chụp tách một tấm. Hachiroku thoáng ngạc nhiên, nhưng cũng không cằn nhằn nữa."
2603 = "Cầm tấm vé được bố mẹ mua cho, cùng Michi bước qua cửa soát vé, rời khỏi thị trấn của mình, từng là một sự kiện vui vẻ."
2626 = "Hibiki gật gù rồi mở cuốn phác thảo ra."
2627 = "Hibiki và Nagi nhăn mặt, bên cạnh đó, Fukami cũng gật đầu lia lịa đồng tình với lời của Nagi."
2630 = "Hibiki, rất thông minh. Có lẽ không cần phải nói hết mọi chuyện ra——"
2632 = "Giơ tay thẳng tắp. Ánh mắt Hibiki hướng về phía Paulette."
2633 = "Ngón tay Hibiki lại nhẹ nhàng lướt đi, trên màn hình, một hình ảnh quen thuộc hiện lên."
2636 = "Hibiki làm một vẻ mặt vô cùng khó xử—— Nhưng rồi, cũng miễn cưỡng gật đầu."
2637 = "Nói với giọng điệu đùa cợt, Hibiki khẽ nhún vai, nhìn Paulette."
2641 = "Xoạt xoạt, cuốn phác thảo được lật mở."
2642 = "Nói rồi, Hibiki toét miệng, cười một cách tinh nghịch."
2644 = "Bắt gặp ánh mắt như muốn ăn tươi nuốt sống của Hibiki, tôi chợt nhớ ra."
2646 = "Hibiki với vẻ mặt hiểu ra vấn đề ngồi lại xuống ghế, Paulette hắng giọng nhẹ."
2651 = "Có lẽ vì đã có giao tiếp bằng \\x%l共感;#00ffc040;cộng cảm%l;#; chăng? Hachiroku không tỏ ra ngạc nhiên như lúc thấy máy ảnh."
2665 = "Có lẽ chính vì tình yêu, mà cả việc điều hành thành phố lẫn mô hình này, đều tràn ngập sự quan tâm tỉ mỉ đến từng chi tiết chăng."
2666 = "Vì thế nên, khu vực quanh lò hơi chỉ có con người mới làm được. Biết là vậy nhưng……vẫn nóng bức và khó chịu quá."
2668 = "Những công việc càng vất vả, thì hiệu quả của việc làm đến nơi đến chốn, không lơ là càng lớn."
2670 = "Dù đã vượt qua mức âm ấm, nóng cỡ nước đun sôi để nguội, nhưng vẫn ngấm sâu vào cơ thể."
2680 = "Bên cạnh Paulette đang gật đầu xác nhận \"Đúng là vậy\", Fukami rụt rè giơ tay lên."
2681 = "Có lẽ vì không nhìn nổi nữa, Paulette đã lên tiếng giải vây."
2682 = "A, tiếng lẩm bẩm kìm nén của Paulette."
2683 = "Giọng nói có vẻ khổ tâm."
2684 = "Tầm nhìn của Paulette, rộng hơn tôi rất nhiều. Ngay cả những lời ngắn gọn vừa rồi, cũng đã thể hiện rõ điều đó."
2685 = "Paulette, và Reina đang ngồi trên đùi cô ấy, hòa giọng cùng cái gật đầu của Nagi, thu hút sự chú ý của chúng tôi."
2686 = "Thoáng lộ vẻ ngạc nhiên trước lời của Nagi——"
2691 = "Để có thể mang theo mọi lúc, tôi đã mượn chiếc máy ảnh nhỏ và nhẹ nhất trong số những di vật của ba Paulette."
2697 = "Nhưng, chỉ có ánh mắt của Hibiki là không yên. Em ấy nhổm người lên khỏi ghế, dáo dác nhìn quanh."
2699 = "Hồi còn nhỏ, tôi hoàn toàn không có tâm trí thảnh thơi."
2701 = "Và rồi, kết quả của việc di chuyển đó—— Chắc chắn đã khiến thiệt hại của vụ tai nạn trở nên trầm trọng hơn."
2709 = "Reina có lẽ cảm thấy bất an, ngóc đầu lên, nhìn chằm chằm vào Paulette."
2712 = "Nghe vậy, Reina khẽ gật đầu."
2714 = "Khoảnh khắc cảm thấy hơi hiểu ra, mọi thứ đã được kết nối."
2717 = "Giọng nói cất lên cùng lúc, hai người nhìn nhau, Paulette khẽ đưa tay ra, ra hiệu mời đối phương nói trước."
2718 = "Tất nhiên, cả \\x%lナッパ服;#00ffc040;dịch vụ trang màu%l;#; lẫn cán của \\x%lスクレイパー;#00ffc040;dao cạo xỉ than%l;#; đều đã lấm lem bồ hóng và dầu mỡ, bẩn thỉu nhầy nhụa."
2720 = "Và đồng thời, tôi cũng cảm thấy rất vui."
2722 = "Kiểm tra lại vô số những đường nét được vẽ trên đó—— Đôi mắt ngước lên lần nữa, chứa đựng một tia sáng mạnh mẽ."
2725 = "Bình thường chắc em ấy dùng nhiều lắm, nên trong lúc nói chuyện, những ngón tay của Hibiki vẫn lướt thoăn thoắt."
2726 = "Có lẽ vì nói quá đúng trọng tâm, nên Hachiroku và Reina vốn đang hơi thu mình lại đồng loạt cất tiếng vui vẻ."
2733 = "Đến tôi còn thấy mông lung cơ mà."
2739 = "Cuốn phác thảo đã được gấp lại. Trên tay Hibiki, thay vào đó là một thứ màu đen và mỏng——"
2744 = "Chỉ có việc tích lũy những chi tiết nhỏ nhặt như vậy, mới có thể tạo nên vẻ đẹp tổng thể hoàn mỹ."
2746 = "Paulette thể hiện một cử chỉ nằm ở giữa việc \"nghiêng đầu\" và \"gật đầu\"."
2751 = "Như thể muốn nói \"Ra là vậy\", một giọng điệu và cái gật đầu có phần vi diệu."
2752 = "Nghe Hibiki nói, Hachiroku nhíu mày."
2753 = "Nghe vậy, Hibiki vội vàng giao máy tính bảng cho Hachiroku, rồi tự mình mở cuốn phác thảo ra."
2755 = "Vừa bước xuống, tôi ngay lập tức được chào đón bằng một chiếc khăn khô và nụ cười."
2759 = "Chủ trương của mình được chấp nhận. Được thấu hiểu. Cảm giác chân thực đó, khiến lời nói của tôi trôi chảy hơn."
2761 = "Nếu là phương tiện có tình trạng tốt, thì ngay từ đầu đã chẳng bị phế bỏ rồi——"
2777 = "Biểu cảm vẫn nghiêm trang như mọi khi, nhưng đôi má lại hơi ửng đỏ."
2779 = "Chắc em ấy từng bị bắt làm người mẫu, rồi phải chịu không ít khổ sở nhỉ?"
2783 = "——Để lau sạch bồ hóng, tôi liên tục dùng khăn khô lau chùi, trong lúc đó lỡ chạm vào da, tĩnh điện giật đau điếng."
2804 = "Sau khi chụp xong những thứ cần chụp, tôi cũng xắn tay vào phụ dọn dẹp."
2805 = "Nagi đứng dậy. Với khí thế như chuẩn bị vỗ tay ba nhịp kết thúc, nhưng còn quá sớm."
2806 = "Vừa nói, tôi vừa nhận lấy chiếc cốc."
2810 = "Quả thật, việc chà đạp lên sự gắn bó đó, có vẻ không phải là thượng sách cho lắm."
2813 = "Trước khi cái miệng chu lên của Hibiki kịp nói gì đó, tôi đã tiếp tục lời nói của mình."
2814 = "Chẳng mấy chốc, nó đã thành hình một logo ấm áp."
2815 = "Quay lại nhìn, thấy mắt Hachiroku đang tròn xoe."
2827 = "Tôi không nghĩ điều đó là xấu. Khuôn mặt mà một người đã hòa nhập và có được sự tin tưởng ở Ohimitera như Hibiki nhìn thấy."
2828 = "Bức ảnh có vẻ được chụp từ góc thấp, vừa mang nét đáng yêu đặc trưng của Kiha 07, vừa toát lên sự sống động và uy lực."
2829 = "Đó chắc chắn, là một khía cạnh tuyệt vời của Ohimitera, và là sức hấp dẫn nên truyền tải đến khách du lịch. Nhưng——"
2830 = "Nghe em ấy nói mới để ý, khác với những \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; khác, cái đó quả thực được thiết kế độc lập."
2832 = "Khi được xem lại thế này, đến tôi cũng thấy mình chụp nhiều vô tội vạ thật."
2833 = "Hachiroku khi làm công việc bảo dưỡng, trong dầu mỡ, bồ hóng và sức nóng, mang lại ấn tượng hơi nhem nhuốc——"
2836 = "Vừa nói, Hachiroku lại ngả người về phía \\x%l炭水車;#00ffc040;toa tiếp than nước%l;#; của \\x%l8620;#00ffc040;8620%l;#;."
2839 = "Thị trấn Ohimitera, không phải là không gian để tận hưởng, gần gũi hay sinh sống, mà là nơi để tôi tìm kiếm cơ hội chuộc tội dù chỉ là một chút."
2842 = "Haizz, thở dài. Rồi Hibiki chầm chậm, nhìn Hachiroku, rồi nhìn tôi."
2846 = "Sự xuất hiện của Nagi và Fukami, đã thổi bay những thắc mắc nhỏ nhoi và chút cảm thương nhạt nhòa."
2847 = "Thoăn thoắt trên cuốn phác thảo, Hibiki nối những đường nét lại với nhau."
2848 = "Dù cảm thấy có vẻ bất khả thi, nhưng tôi vẫn kỳ vọng rằng từ \\x%l客車;#00ffc040;toa hành khách%l;#; phía trước nhất, biết đâu có thể nhìn thấy điều gì đó."
2850 = "Dù Paulette từng hỏi 『Cái này được không ạ?』, nhưng chiếc máy ảnh này, tuy nhỏ mà có võ đấy."
2851 = "Xen lẫn nụ cười gượng như để che giấu sự xấu hổ, nhưng, ánh mắt ấy lại rất nghiêm túc."
2852 = "Giọng nói kìm nén, nhưng lại ánh lên niềm vui. Đôi gò má Paulette ửng hồng."
2853 = "Bị một mô hình cuốn hút, đâu phải là chuyện một người đàn ông trưởng thành nên làm——"
2865 = "(……Dù vậy vẫn cảm thấy hoài niệm thật đấy)"
2882 = "(Nhưng, chính vì vậy mới phải đánh bóng thật kỹ)"
2883 = "(Nhưng, phải làm quen thôi. Cả thể xác lẫn tâm hồn, dù từng chút một, cũng phải dần thích nghi——)"
2885 = "(Ra là vậy…… Quan sát để chụp ảnh, quả là một điều tuyệt vời)"
2887 = "(Chà——xát————Tách!)"
2889 = "(Phừng)"
2890 = "(Tách)"
2893 = "(Nhắc mới nhớ…… Nghe nói em ấy đã được xử lý để khó bị bám bẩn nhỉ)"
2894 = "(Phải biến 8620——biến nó, thành gương mặt đại diện cho Ohimitera)"
2905 = "(\\\\x%lNゲージ;#00ffc040;N-gauge%l;#;, gọi là vậy nhỉ)"
2906 = "(Những khoảnh khắc thế này, cũng thú vị thật)"
2907 = "(Bức này, quả thực rất đáng học hỏi. Hôm nào phải nhờ Paulette, cho xem thêm những bức ảnh khác mới được)"
2908 = "(Làm tỉ mỉ đến từng chi tiết nhỏ nhỉ. Mô hình thị trấn này……là mô phỏng theo Ohimitera ngày xưa sao?)"
2911 = "photo by kouzou hinai—— Được ghi rõ ở mép dưới bức ảnh."

[selections]
