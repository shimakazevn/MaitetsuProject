1715 = "「（Liếm————）——Chụt! Chụt—— Chụt! Chụt! Chụt! Phụt! Chụt!」"
1716 = "「（Liếm——liếm——liếm） Chụt! Phụt! Chụt! Phụt!」"
1718 = "「Vì thế……ưm. Chụt! Chụt! Chụt! Chụt!」"
1720 = "「~~~~~~~~ưm」"
1793 = "Chỉ đơn giản, là vậy thôi. Nghĩ vậy thấy lòng nhẹ nhõm hơn. Nụ cười của Suzu khiến tôi nghĩ như vậy, thật đáng yêu biết bao."
1794 = "Được khẳng định. Tất cả, bởi Suzu. Ngay cả khao khát ngu ngốc không bao giờ thành hiện thực, tất cả, trọn vẹn."
1798 = "Khi nhận ra điều đó, sự đáng yêu bỗng chốc biến thành sự quyến rũ. Tôi bỗng muốn kéo em ấy với bộ dạng ăn diện khác hẳn ngày thường vào chiếc nệm quen thuộc."
1801 = "Một khi đã nắm được manh mối, thì hai hình dáng ấy hoàn toàn khớp với nhau. Dù có thể nuốt trọn một lần, nhưng Suzu lại từ từ tận hưởng."
1807 = "Là niềm vui khi thấu hiểu, hay là sự hưng phấn tình dục? Suzu thở ra một hơi nóng hổi."
1809 = "Không biết là vô thức, hay đang cố gắng kiểm soát. Hông của Suzu rõ ràng đang vặn vẹo như muốn ăn lấy sự cương cứng."
1810 = "Không phải từ tôi, cũng không phải từ Suzu. Vô cùng tự nhiên, như hơi thở, quy đầu và cửa âm đạo xếp chồng lên nhau."
1816 = "Thế nhưng, sự cương cứng lại di chuyển. Mãi mà không khớp khít vào cửa âm đạo."
1817 = "Nhưng Suzu không bận tâm, chỉ dịu dàng nhìn tôi. Một giọng nói vô thanh truyền đến, như muốn bảo tôi bây giờ hãy nghỉ ngơi đi."
1827 = "Chỉ với sự thật ấy thôi cũng đủ làm bầy tinh binh sục sôi tột độ. Chúng đồng lòng yêu cầu muốn cứ thế mà chà đạp khoang miệng em ấy."
1834 = "Dù nhịp thở chưa ổn định, Suzu vẫn mỉm cười và cất lời."
1835 = "Đã ân ái không biết bao nhiêu lần, vậy mà đôi má ấy vẫn ửng đỏ. Sự đáng yêu ấy khiến trái tim, khiến những lời nói trở nên trôi chảy."
1836 = "（Mặc dù tôi cũng rất muốn cứ thế này mà trừng phạt em ấy—— nhưng tôi không muốn ân ái với Suzu trong khi em ấy vẫn còn hiểu lầm.）"
1837 = "Lý trí run rẩy trong sự bi quan lạnh lẽo trước điều không thể, nhưng cơ thể lại càng vui sướng trước sự đảo điên ấy, và vì thế mà run rẩy."
1844 = "Bộ phận sinh dục đã nôn sạch tinh dịch tuột khỏi âm đạo Suzu một cách khó coi. Cùng lúc đó, Suzu vô lực ngồi bệt xuống trên nó."
1851 = "Dù nhìn từ sau lưng cũng có thể thấy rõ. Suzu nuốt nước bọt cái ực."
1855 = "Suzu há to miệng, để nước bọt nhỏ ròng ròng xuống dương vật đang cương cứng. Rồi dùng đầu lưỡi liếm láp, dàn đều thứ nước bọt vừa nhỏ xuống."
1862 = "Ngay khoảnh khắc nghĩ đến \"máy móc\", cảm giác tội lỗi hóa thành khoái cảm, phình to ngay giữa trung tâm cơ thể tôi!!!!"
1868 = "Trong khoang miệng nhỏ bé nóng bỏng, sau khi bị liếm láp, mút mát, tôi lại bị đôi môi và sâu trong cổ họng tấn công không thương tiếc."
1870 = "Em ấy thè lưỡi ra, khoe trọn khoang miệng trống hoác cho tôi thấy. Cho tôi biết rằng em ấy đã nuốt sạch dòng tinh dịch cuồn cuộn như thác lũ."
1872 = "Những ngón tay lại một lần nữa, lần này với lực đạo không quá mạnh cũng không quá yếu, dùng lực đạo thấu hiểu tôi rõ nhất, bao bọc lấy sự cương cứng."
1874 = "Lực của những ngón tay mạnh hơn. Chuyển động lên xuống nhanh hơn. Dần dần——em ấy nhìn thấu ranh giới mong manh để không làm đê vỡ."
1876 = "Không hề nới lỏng chuyển động lên xuống của bàn tay, em ấy tiếp tục nhỏ thêm nước bọt. Dương vật và những ngón tay hòa quyện vào nhau sủi bọt, vang lên những âm thanh dâm đãng."
1878 = "Em ấy đổi hướng cơ thể. Chỉ bằng chuyển động đó, Suzu đã khóa chặt dục vọng dã thú của tôi."
1880 = "Em ấy cứ thế ngậm lấy mà nói, sự thay đổi nhỏ nhặt ấy càng làm khoái cảm thêm phần sắc nhọn."
1882 = "Quả thật vậy. Ân ái như mọi khi trong căn phòng quen thuộc. Nhưng hôm nay, chúng tôi đã có một trải nghiệm mới——một chuyến đi."
1884 = "Không hề kháng cự——thậm chí em ấy còn chủ động ngã vào người tôi một cách vui sướng. Hơi nóng hòa quyện khiến tôi cảm thấy hai trái tim cũng đang đồng điệu."
1886 = "Nụ cười, làm tan chảy. Thứ gì đó đen tối, ngu ngốc và đáng ghê tởm định làm tổ trong tim tôi."
1888 = "Nơi sung sướng. Nơi Suzu thích nhất. Chỉ lặp lại đơn điệu, Suzu nhảy múa hông rồi hạ xuống."
1890 = "Khoái cảm êm ái chảy vào từ màng nhĩ. Sự run rẩy thấm đẫm trái tim, dần dần làm tôi say đắm."
1892 = "Vì quá đáng yêu, nên tôi muốn trêu chọc một chút. Trái tim, làm đôi môi cũng nhẹ nhàng hơn."
1894 = "Chuyển động hông bắt đầu vội vã. Ái dịch không thể kìm nén liên tục làm ướt sự cương cứng của tôi."
1896 = "Lực nắm của những ngón tay khẽ nới lỏng. Ánh mắt dịu dàng cũng đổ dồn vào sự cương cứng vừa được giải phóng."
1898 = "Một giọng nói có chút ngơ ngác, nhưng lại pha lẫn sự vui sướng."
1899 = "Đột nhiên. Những ngón tay ấy dừng lại. Mất đi kích thích, sự cương cứng vì thế mà run rẩy quằn quại."
1901 = "Vòng eo thon thả của Suzu nhảy múa như đang vẽ số 8. Nũng nịu chuyển động vì muốn tôi cọ xát vào nơi sung sướng nhất."
1903 = "Ngay trước mắt tôi. Suzu tự tay kéo chiếc quần lót trắng muốt đang bao bọc lấy bờ mông tròn trịa xuống, quang cảnh ấy cướp đi cả ánh nhìn và ý thức của tôi."
1905 = "Giọng nói thầm thì. Phù——. Hơi thở mơn trớn tôi. Chỉ bấy nhiêu thôi, cũng đủ làm tôi dễ dàng ướt át."
1912 = "Chỉ với câu nói đó thôi, sự cương cứng cũng rung lên. Tôi cảm nhận được sự đan xen của nhiều cảm xúc: xấu hổ, tự hào và khiêm tốn."
1941 = "Nương theo chuyển động, tôi cũng chuyển động. Không, hông và cơ thể tự động di chuyển!"
1943 = "Vươn tay ra, xoa đầu em ấy. Nhiều lần. Nhiều lần. Nếu vậy có lẽ, trong khoảnh khắc đó, Suzu cũng, điều gì đó——"
1945 = "Chuyển động hoàn toàn hòa làm một. Chuyển động hoàn toàn hô ứng lẫn nhau. Nơi tuyệt vời nhất mà cả hai đều biết. Chỉ để khoét sâu vào nơi đó."
1948 = "Khi tôi cọ xát sự cương cứng đã lấy lại hoàn toàn độ cứng vào khe rãnh của Suzu, em ấy cất tiếng từ chối một cách đáng yêu."
1949 = "Chồng hông lên nhau. Hông của Suzu và tôi hoàn toàn khớp vào nhau. Ngay khi quy đầu của tôi cọ xát vào nơi sâu nhất, nó cũng bị mút chặt lấy."
1950 = "Theo lời giục giã, tôi nằm xuống mà không hề thay đồ. Ngay lập tức, tôi lại lo lắng không biết có làm bẩn ga trải giường hay không."
1953 = "Tôi muốn vươn tay ra, bắt lấy Suzu và ấn mạnh vào sự cương cứng. Tôi cố gắng kìm nén ham muốn đó, vì mong đợi một khoái cảm mãnh liệt hơn."
1956 = "Muốn chạm vào. Muốn vuốt ve. Muốn ấn vào. Nhưng ham muốn muốn Suzu chủ động làm cho tôi còn lớn hơn gấp nhiều lần."
1957 = "Hãy ân ái thôi. Hãy để bộ phận sinh dục hòa quyện vào nhau. Lời nói và mong muốn ấy, lại bị chặn lại bởi màn khẩu dâm sâu thẳm."
1958 = "Tôi nắm lấy cổ tay em ấy. Không phải là sự bối rối, mà là một giọng nói ngọt ngào. Là mùi cơ thể lẽ ra không tồn tại ở Suzu, nhưng lại chạm đến tận sâu trong tâm trí tôi."
1961 = "Thay vì chạm vào, tôi nhìn thẳng vào mắt em. Dùng ánh mắt âu yếm ve vuốt đôi mắt ướt át của Suzu."
1962 = "Không nói rõ là cái gì, tôi hơi nâng hông lên. Vết ửng đỏ trên cổ Suzu đậm thêm, ái dịch lại nhỏ giọt tràn ra."
1965 = "Âm thanh, bật ra. Dù đã khép chặt môi răng và cổ họng. Dù đã khép chặt nhưng vẫn trào ra."
1966 = "Tôi khẽ đặt tay lên sự cương cứng. Chỉ vậy thôi, chuyển động hông của Suzu cũng đã ổn định lại."
1968 = "Trong chuyến đi này tôi đã tích tụ nhiều tinh dịch đến thế sao—— Thế này thì bộ quần áo khó khăn lắm mới mặc của Suzu sẽ lấm lem hết mất——!"
1971 = "Lời nói tuôn ra một cách vô cùng tự nhiên dường như đã phá vỡ nhịp điệu của Suzu. Thật tội nghiệp, nhưng thế cũng đáng yêu."
1972 = "Vì thế tôi muốn vấy bẩn——muốn dùng những từ ngữ thô tục để làm em ấy xấu hổ. Bởi vì dù có nhuốm bùn nhơ đến đâu, tôi vẫn muốn yêu thương bông hoa nở trắng ngần ấy."
1975 = "Chính vì thế, lại càng trơn trượt. Hết lần này đến lần khác. Hết lần này đến lần khác. Khoái cảm ma sát nhẹ nhàng liên tục tích tụ âm ỉ trong tinh hoàn."
1998 = "Từ đôi môi vừa tấn công dồn dập, vắt kiệt tinh dịch của tôi, lại phát ra giọng nói êm đềm, dịu dàng như đang khuyên bảo một đứa trẻ không ngoan."
1999 = "Những điều định nói bỗng chốc bay biến. Vì Suzu quá đỗi yêu kiều, vậy mà lại cười một cách ngây thơ đến thế."
2005 = "Bản thân chuyến du lịch cũng rất vui, nhưng Suzu mới là điều tuyệt vời nhất. Tôi đã được tận hưởng trọn vẹn những biểu cảm hiếm thấy và cả bộ dạng ăn diện của em ấy."
2008 = "Toàn bộ quy đầu, chỉ mới bị cửa âm đạo nuốt vào một chút. Chỉ vậy thôi mà toàn thân Suzu đã run rẩy."
2009 = "Một hành động vô cùng dâm đãng, nhưng lại được tô điểm bằng nụ cười ngây thơ——!!"
2011 = "Nơi sâu nhất của Suzu——nơi chắc chắn là tử cung nếu là con người. Nhắm thẳng vào đó, tinh dịch của tôi được truyền vào."
2018 = "Suzu xinh đẹp mang kết cấu máy móc, đang rối bời và rên rỉ hệt như dã thú. Chính bàn tay này, cái hông này của tôi, đã làm Suzu phát cuồng đến nhường này."
2020 = "Đến mức phát ra những âm thanh ướt át thô tục——Suzu ấy đang say sưa, ngấu nghiến sự cương cứng của tôi."
2023 = "Phải rồi, đúng là tôi đã nói vậy. Nhưng ngay cả suy nghĩ đơn giản ấy cũng khó mà tập hợp lại được."
2026 = "Bờ mông trắng muốt, được bao bọc trong chiếc váy mặc đi chơi, đang nhảy múa. Nắm rõ chiều dài của sự cương cứng, em ấy nhảy múa ở ranh giới sát nút để không bị tuột ra."
2029 = "Cảm giác chinh phục, cảm giác ưu việt áp đảo, sục sôi phình to bên trong tôi, hòa lẫn vào tinh dịch."
2031 = "Sự cương cứng, được dẫn dắt ra bên ngoài. Khuôn mặt xinh đẹp của Suzu, và sự cương cứng thô kệch xếp ngang hàng nhau."
2035 = "Giọng nói, hơi thở chạm vào sự cương cứng, như dầu đổ thêm vào lửa, thiêu đốt ham muốn của tôi một cách dữ dội."
2037 = "Khe rãnh tuyệt đẹp cướp đi ánh nhìn của tôi, tràn ra dòng mật ngọt ngào. Sự cương cứng vừa phun trào tình dục mãnh liệt kia đang nhanh chóng hồi phục."
2042 = "Bùng nổ trắng xóa. Toàn bộ khoái cảm nhào nặn thành dòng chất lỏng trắng đục, lao thẳng một mạch như muốn thụ tinh cho sâu trong cổ họng Suzu."
2046 = "Kích thích mạnh mẽ như đánh úp bất ngờ vắt kiệt âm thanh từ cổ họng tôi. Lượng tinh dịch bên trong sự cương cứng cũng đang cuồn cuộn dâng cao."
2054 = "Nụ cười ngây thơ, rã rời."
2056 = "Phù——, lần này là một hơi thở có chủ ý. Một hơi thở ngọt ngào và đầy mê hoặc, nhằm thổi bùng ngọn lửa tình dục."
2060 = "Âm thanh va chạm của xác thịt trở nên đơn điệu, dần dần dồn dập hơn. Âm đạo vừa siết chặt vừa run rẩy, gần như co giật."
2081 = "Lưỡi, nước bọt, sâu trong cổ họng, đôi môi ôm trọn khoang miệng, em ấy sử dụng tất cả để tạo nhịp điệu nhanh chậm, tiếp tục tấn công không khoan nhượng."
2084 = "Âm đạo vặn vẹo bám chặt lấy, vòi vĩnh đòi tinh trùng. Dù vậy, nếu tôi rút ra, nó lại siết chặt lấy như không muốn buông tha."
2089 = "Đầu lưỡi Suzu thè ra liếm mép. Như thể đang nhắm vào con mồi, như thể đang quyến rũ tôi một cách đầy ma mị."
2094 = "Vẫn nằm đó ngước nhìn lên, đường cong trên cơ thể Suzu, như đang ngầm khẳng định một cách khiêm tốn rằng nó tuyệt đối không hề phẳng lì."
2096 = "Nếu vậy tôi muốn đáp lại khao khát đó. Tâm ý, chuyển động hóa thành dung nham, sục sôi trong âm nang."
2100 = "Tốc độ được thêm vào chuyển động hông. Bằng những cú nhấp thật lớn, thật lớn, Suzu tận hưởng toàn bộ sự cương cứng."
2101 = "Suzu khẳng định chắc nịch rằng, phong ấn——sealing của em ấy, không phải là \"bị mở ra\", mà là \"tự mở ra\"."
2102 = "Trong khi vẫn đè lên nhau, Suzu cựa quậy uốn éo cơ thể. Làn da mềm mại của em ấy cọ xát vào hình dáng của tôi hết lần này đến lần khác."
2103 = "Đầu ngón tay Suzu mạnh bạo di chuyển, bao trọn lấy sự cương cứng xấu xí của tôi. Bao trọn——hay đúng hơn là, ——cái này——khá, là, ——ư."
2104 = "Lời nói của Suzu cứ như thể bộ phận sinh dục cũng có ý chí vậy. Có lẽ bộ phận sinh dục ấy đến mức đó——"
2105 = "Đầu lưỡi của Suzu rời khỏi người tôi. Đôi môi nở một nụ cười mỉm——"
2106 = "Chạm——. Ngón tay trắng muốt của Suzu miết dọc theo hình dáng sự cương cứng của tôi. Theo đà miết đó, em ấy từ từ, chầm chậm kéo khóa quần xuống."
2107 = "Đầu Suzu khẽ chuyển động. Ánh mắt, hơi thở nóng rực đang trêu chọc sự cương cứng của tôi."
2108 = "Không phải giọng nói mà là hơi thở. Ngọt ngào. Là vô tình thốt ra, hay là đang cố che giấu để tỏ ra bình tĩnh đây."
2109 = "Chuyển động của Suzu trở nên đơn điệu. Chỉ để thúc giục tôi xuất tinh—— sự thẳng thừng, đơn giản, bạo lực, mang tính động vật và máy móc này——!?"
2110 = "Đột nhiên, chuyển động của Suzu dừng lại. Tôi vội vàng hé mắt nhìn, đôi mắt của Suzu ngập tràn niềm vui."
2111 = "Khóe miệng Suzu khẽ cười. Nhỏ hơn cả nụ cười, đầu lưỡi em ấy khẽ liếm."
2125 = "Lẫn trong khoái cảm từ bàn tay và màng nhĩ là những âm thanh ướt át. Tôi đang bị thấm ướt và hòa tan bởi tất cả những gì thuộc về Suzu."
2127 = "Sự kích thích mạnh mẽ mà tôi mòn mỏi chờ đợi, lại bao bọc lấy tôi theo một cách hoàn toàn không ngờ tới."
2130 = "Từ khe rãnh tuyệt đẹp của Suzu, dòng mật rỉ ra sền sệt, kích thích sự cương cứng của tôi như thể muốn làm quen."
2133 = "Cửa âm đạo và quy đầu vừa khớp vào nhau một chút, nhưng lại trơn tuột ngay lập tức. Suzu thở ra một hơi tiếc nuối, nhưng vẫn nói tiếp."
