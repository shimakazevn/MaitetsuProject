41 = "(Phịch)"
1090 = "\"Trưởng thành, và già đi\" ——Suy nghĩ vừa lóe lên, tôi đã cố nuốt ngược vào trong."
1096 = "Ảo giác ngu ngốc \"đã làm cho mang thai\". Cảm giác hạnh phúc áp đảo. Khao khát \"muốn làm cho mang thai\" có lẽ là cội nguồn của nó."
1097 = "\"Đã làm cho mang thai\" ——Ảo giác ngu ngốc, đáng ghê tởm, nhưng ngập tràn hạnh phúc. Lượng cảm xúc áp đảo giữa khoái cảm đó và sự chán ghét bản thân."
1098 = "\"Đã làm cho mang thai\" ——Ảo giác không thể nào xảy ra ấy, làm rung chuyển não bộ cùng với khoái cảm gần như buồn nôn."
1104 = "「——Ưm」"
1105 = "「——A」"
1110 = "「『Vô cùng nhỏ bé』…… sao ạ.」"
1112 = "「………………cứ thế bắn vào trong miệng em đi」"
1113 = "「……」"
1117 = "「……Có lẽ vậy.」"
1120 = "「——Làm anh cháy bỏng, làm anh khao khát. Rằng anh muốn em, muốn ôm lấy em. Đã khiến anh nóng bỏng và hưng phấn đến nhường này.」"
1121 = "「……Em. Muốn được thỏa mãn, và muốn thỏa mãn ngài. Em muốn ân ái với ngài Soutetsu——với anh」"
1123 = "「……Đẹp thật」"
1319 = "「Để đón nhận, nuốt trọn và hòa làm một. Chỉ vì mục đích đó. Chính em đã mong muốn như vậy, và tự mình mở ra」"
1320 = "「Không được, đâu——Suzu」"
1322 = "「Không.」"
1324 = "「Không thể theo ý muốn được sao?」"
1326 = "「Không chỉ linh hồn, mà cả trái tim, cơ thể, ngũ quan, hay sự ấm áp. Bằng tất cả những gì em có, ngài Soutetsu——ưm」"
1327 = "「Không, Suzu, em hiểu lầm rồi.」"
1331 = "「Để em đi tắm gội qua cho hết mồ hôi rồi sẽ chuẩn bị bữa cơm. Trong lúc đó, xin ngài hãy nghỉ ngơi dù chỉ một chút.」"
1337 = "「Thậm chí không có những đường cong tạo ra bóng tối, nếu là con người thì chắc là chưa trưởng thành, thế mà ngài lại hưng phấn cuồng nhiệt vì cơ thể này đến vậy.」"
1338 = "「Cứ yên tâm mà ra đi」"
1339 = "「Đúng……vậy. Ừm」"
1341 = "「Có vẻ như ngài Soutetsu đang mệt mỏi sâu sắc hơn một chút so với những gì ngài tự cảm nhận đấy ạ.」"
1353 = "「Thế nhưng, ngài biết không? Ngài Soutetsu」"
1354 = "「Cương cứng đến mức phát đau, nhưng đây tuyệt đối không phải là loại cương cứng do mệt mỏi đâu.」"
1355 = "「Hai người, cùng nhau, giống, nhau——ưm! Em, cũng, thấy điều này, là——thoải mái nhất」"
1358 = "「Cho dù có hỏng đi chăng nữa——anh nhất định, sẽ sửa lại cho em」"
1360 = "「Ngay cả những phần nông cạn không sâu sắc. Ngay cả những nơi mỏng manh, nhẹ nhàng và vô cùng đơn giản. Em vẫn luôn khao khát ngài Soutetsu không đổi thay」"
1361 = "「Là em đấy, Suzu. Cơ thể em khi anh ngước nhìn từ đây. Sức nóng của em, và cả mùi cơ thể lẽ ra không tồn tại——」"
1364 = "「Hay cho dù vẻ ngoài của em có khiếm khuyết đi chăng nữa. Chỉ cần đó là cơ thể chứa đựng linh hồn em——thì tôi vẫn sẽ hưng phấn như vậy thôi」"
1398 = "「Vì em muốn độc chiếm hương vị tình dục mà chỉ riêng em biết. Vì em muốn khoang miệng và cổ họng bị thiêu đốt bởi sự ngọt ngào của nước bọt trao nhau」"
1400 = "「Để có thể khiến ngài Soutetsu hưng phấn như vậy…… Em nghĩ vẻ ngoài của em không có sức hấp dẫn đến thế đâu ạ.」"
1402 = "「Cô bé của em, vẫn giống hệt như lần đầu tiên anh nhìn thấy. Vẫn cho anh thấy vẻ thanh khiết tột cùng không đổi thay」"
1403 = "「Vì dương vật của ngài Soutetsu rất là hư hỏng, nên để trừng phạt, em sẽ làm cho nó hơi đau một chút.」"
