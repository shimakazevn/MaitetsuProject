1511 = "「Ư hừ hừ, đương nhiên rồi ạ? Vì là của hai người mà. Vì là chuyến đi của ngài Soutetsu và em mà」"
1513 = "「Linh hồn của em, thứ mà anh yêu thương nhất, đây là một vỏ bọc vô cùng xinh đẹp, hoàn toàn hài hòa với nội tâm đó.」"
1515 = "「Vì em thích dáng vẻ đáng yêu của ngài khi bật ra tiếng rên rỉ dưới những ngón tay em. Vì em thích ánh mắt nũng nịu, khao khát nhiều hơn nữa của ngài」"
1516 = "「Trong mắt anh thì là vậy. Ngay cả những bóng đen vô cùng nhỏ bé được vẽ ra.」"
1525 = "「Vâ, ng——vâng——ưm! Ngài Soutetsu」"
1526 = "「Ư, ừm」"
1527 = "「Aa!」"
1529 = "「『Ngay cả』 những bóng đen vô cùng nhỏ bé, cũng có thể làm cho nó to và cứng đến nhường này cơ mà.」"
1531 = "「Nếu muốn tắm gội cho hết mồ hôi thì——」"
1534 = "「Vẻ ngoài sao.」"
1539 = "「Ừ, anh đang cương cứng.」"
1541 = "「Dù vậy, nhé? ——Tâm ý, vẫn hòa làm một. Chỉ để làm ngài Soutetsu vui sướng nhất——ưm!」"
1544 = "「Muốn mang hình dáng ngài Soutetsu mong muốn, dáng vẻ ngài mong muốn—— em, chỉ luôn, khao khát điều đó, mà thôi」"
1547 = "「Đúng không ạ, ư hừ hừ」"
1548 = "「Dương vật, của ngài, Soutetsu——với——ưm! Với, cô bé, của em, của em」"
1551 = "「Cơ thể khi ngước nhìn…… sao ạ?」"
1553 = "「Chắc chắn nó——cảm thấy vui sướng khi được tiếp tục tồn tại, dưới hình dáng mà ngài Soutetsu yêu thích——yêu thích nhất」"
1554 = "「Tôi không phải vì cơ thể em ít đường cong mà nảy sinh ham muốn. Giả sử. Cho dù cơ thể em có đường cong gợi cảm đến mức nào đi chăng nữa」"
1556 = "「Em cũng vậy—— Ngài Soutetsu, phu quân của em」"
1557 = "「Anh cũng vậy, Suzu. Thế nên——!!!?」"
1560 = "「Anh cũng vậy. Anh rất yêu em」"
1564 = "「Vì em muốn được hòa quyện sâu nhất cùng ngài Soutetsu. Vì em muốn được cảm nhận ngài Soutetsu ở khoảng cách gần nhất」"
1566 = "「Vì chúng ta là vợ chồng, là bạn đời, là đối tác. Cùng với em, như một người phụ nữ, anh muốn cả hai cùng nhau thay đổi」"
1567 = "「Hai người, cùng nhau, giống, nhau——a Để, trở nên, sung sướng, nhất——!」"
1568 = "「Hai người, cùng nhau. Giống như nhau」"
1570 = "「Em đã nói rồi mà? Bộ quần áo này, đã đưa chúng ta, đến một chuyến đi mới」"
1573 = "「Chắc là vậy rồi」"
1574 = "「Bộ phận sinh dục của em. Cô bé của em ấy. Đã đón nhận anh hết lần này đến lần khác và hoàn toàn mang hình dáng của anh」"
1576 = "「Tất nhiên rồi ạ」"
1578 = "「Mong muốn của anh là——mong muốn không bao giờ thay đổi là——cùng với em——」"
1579 = "「Thứ tôi yêu chính là bản thân sự tồn tại của em. Vì muốn được đến gần em hơn nữa——nên tôi mới khao khát em」"
1582 = "「Bản thân em, ngực em, miệng em, ngón tay, ngón chân em, mông em……cả cô bé, nữa……——」"
1583 = "「Em! Không——a ư——giới hạn, giới hạn rồi! っ——nhưng mà——cùng, cùng nhau, nhé, cùng nhau」"
1586 = "「Thế nên em mới khao khát, thèm muốn ngài Soutetsu một cách mãnh liệt và nông cạn đến thế này」"
1587 = "「Thế nên ngài Soutetsu, xin ngài cứ nằm im đó. Chúng ta đã nói là người đổ mồ hôi sẽ là em mà, đúng không?」"
1589 = "「Thế nên. Ưm…………——」"
1590 = "「Thế nên, Suzu」"
1592 = "「Ngài Soutetsu, trạng thái vùng kín của ngài lúc này—— Ngài đang dùng từ khác để ám chỉ nó đúng không ạ?」"
1593 = "「Lần tới ngài muốn mặc bộ quần áo nào, và muốn có chuyến đi mới như thế nào. Nhỉ? Ngài Soutetsu. Ngài đang nghĩ gì vậy?」"
1595 = "「Nếu vậy, Suzu. Hãy hiểu mong muốn của anh」"
1598 = "「Ngài nói rằng không phải do mệt mỏi. Nếu vậy thì, nhé? Xin phu quân, hãy cho thiếp biết đi ạ.」"
1599 = "「Dù bên trong đã thay đổi thành của một người phụ nữ——trưởng thành hoàn toàn, thành bộ phận sinh dục nữ dành riêng cho anh」"
1602 = "「Mặc dù vùng kín của ngài Soutetsu đang cứng, nóng, và căng tràn đến nhường này——」"
1604 = "「Là để đón nhận……thứ ở háng ngài Soutetsu—— dương vật của một người đàn ông, trưởng thành——và vĩ đại」"
1606 = "「Vâng. Ư hừ hừ. Thế nên em, bộ quần áo này. Em thích nó hơn ngày hôm qua rồi」"
1611 = "「Em cố tình làm đau đấy ạ.」"
1612 = "「Đó là bổn phận đương nhiên của một người vợ ạ.」"
1614 = "「Thật sự rất vui ngài nhỉ.」"
1619 = "「Nhỉ. Đương nhiên rồi. Vì là chuyến đi mà anh và em, cùng nhau trải qua mà」"
1620 = "「Ừ, tuy có hơi mệt một chút nhưng—— sự trọn vẹn này còn lớn hơn gấp nhiều, gấp chục lần sự mệt mỏi đó.」"
1623 = "「Nhưng mà, ngay cả vẻ bề ngoài, anh vẫn luôn, bị tan chảy và mê hoặc đấy.」"
1624 = "「Tất nhiên anh biết rất rõ, cơ thể của em—— Còn làm anh tan chảy hơn cả vẻ bề ngoài của nó.」"
1627 = "「Ngay cả khi ở trong ngôi nhà quen thuộc của ngài Soutetsu và em. Nó đã đưa chúng ta, đến một chuyến đi mới」"
1632 = "「Cương cứng…… do gì cơ ạ?」"
1635 = "「Cương cứng do mệt mỏi. Đôi khi sự mệt mỏi tột độ của cơ thể lại cưỡng ép sự cương cứng. Hiện tượng đó, người ta thường gọi là cương cứng do mệt mỏi.」"
1641 = "「Đúng là, ưm……cô bé, của em, là—— một thứ kỳ lạ không thể kiểm soát theo ý muốn của em」"
1642 = "「Đúng vậy, rất tuyệt——」"
1645 = "「Rốt cuộc là điều gì, đã khiến ngài Soutetsu, nhưng phấn đến nhường này——?」"
1646 = "「Cùng em trải qua năm tháng. Đón nhận tất cả những gì thời gian mang lại——」"
1648 = "「Anh đã có một trải nghiệm mới, một chuyến đi trong căn phòng này. Nếu em cũng vậy thì——」"
1652 = "「Cái đó…… ừm. Vùng kín của ngài, có vẻ như—— đang trở nên to và cứng thì phải.」"
1653 = "「Hãy cọ xát, đi ạ——Sâu nữa! Sâu nữa! Thật mạnh, đóng dấu——vào nơi, sâu nhất」"
1654 = "「Vậy thì tốt quá. Cảm ơn em.」"
