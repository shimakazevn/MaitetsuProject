2391 = "「Hừm?」"
2393 = "「Ồ」\\n「Chuyện như vậy!」"
2396 = "「A――」"
2398 = "「Ra vậy――đúng là dễ chịu thật. Vậy tôi không khách sáo đâu. Cảm ơn nhé」"
2399 = "「Trời đất ơi」"
2400 = "「Ôi!」"
2402 = "「Ồ, dùng bồn nước lạnh để hạ nhiệt――! Không lẽ cơ sở suối nước nóng này được xây dựng vì mục đích đó sao?」"
2404 = "「Ôi, vậy sao ạ? Ufufu, vậy thì tốt quá rồi ạ.」"
2407 = "「Khi xảy ra hư hỏng ở những bộ phận không thể phục hồi như khu vực trung tâm của hệ thống điều khiển hay vùng nhớ, nó sẽ ngắt kết nối để bảo vệ chúng khỏi sự bất thường.」"
2410 = "「Ở lĩnh vực đó, ý nghĩa của việc \\x%lレイルロオド;#00ffc040;Railord%l;#; mang hình dáng con người sẽ giảm đi. Vì thế, hướng nghiên cứu chuyển sang hình thức điều hướng cho Aircra――」"
2412 = "「Tôi đã thành thạo ở mức có thể đảm nhiệm công việc. Vì khi Paulette không thể lái, tôi sẽ thay thế cô ấy.」"
2416 = "「Chăn hè đây chăn hè đây.」"
2423 = "「Ủa?」"
2442 = "「Bé…… Olivy.」"
2443 = "「Cái đó có khi Olivy cũng muốn đi thử! Chuyến tàu du lịch siêu cao cấp do Hibiki thiết kế!」"
2444 = "「Olivy cũng chưa. Nhưng mà, vừa mới xảy ra sự cố xong, chắc là không nên cố quá ăn một lúc nhiều như thế đâu nhỉ?」"
2445 = "「Olivy không nghĩ sâu xa đến thế đâu, nhưng chắc đại khái ý tưởng cũng giống vậy đó」"
2446 = "「Olivy không ngờ, lại được Soutetsu bế kiểu công chúa thế này đâu nha~」"
2447 = "「Olivy thích cái này mà. Tự nhiên thấy vui vui.」"
2448 = "「Olivy. Đủ mát rồi mà~! Hơn nữa nhé? Phành phạch~」"
2449 = "「Olivy đã tỉnh lại rồi sao!」"
2450 = "「Đúng là vậy ạ. Không thể vận chuyển vật siêu nặng. Dễ bị ảnh hưởng bởi rối loạn địa từ, dễ bị ảnh hưởng bởi bão táp――đó là những điểm yếu ạ」"
2451 = "「Olivy biết mà~. Nếu không thì Olivy, đã chẳng làm mấy chuyện như thế này đâu~――liếm.」"
2452 = "「Con người hay đắp cái này, để 'không bị lạnh bụng' đúng không. Olivy từng nghe Akiho nói thế.」"
2453 = "「Được bế kiểu công chúa, thoải mái thật đó nha~, dễ chịu thật đó nha~. Olivy cảm thấy mình đã hiểu lý do tại sao mọi cô gái đều ao ước rồi đó~」"
2454 = "「Olivy thì không rành về Aerocraft lắm nhưng―― vì nó có điểm yếu nên đường sắt mới tồn tại được đúng không?」"
2455 = "「Bé Olivy, em có thấy nóng không?」"
2456 = "「Bé Olivy, em có muốn ăn gì không?」"
2457 = "「À ừm…… em luôn coi bé Olivy là tiền bối, và luôn dành cho chị sự kính trọng từ tận đáy lòng ạ.」"
2458 = "「Bé Olivy. Một lần nữa, mong chị giúp đỡ nhiều ạ.」"
2459 = "「Olivy. Chiếc quạt đó là để làm mát cho chính Olivy mà. Không cần phải quạt cho tôi đâu」"
2460 = "「Hạ nhiệt cho tình trạng phát sốt bất thường, và tiến hành các bước kiểm tra có thể làm hiện tại. ――Đến đó thì em cũng đã nhìn thấy rồi đúng không?」"
2463 = "「Là con gái của nhà Munakata đó! Dù đã đi lấy chồng rồi, nhưng là một cô bé siêu ngoan luôn!」"
2464 = "「Dạ」「Okay!」\\n「Em hiểu rồi ạ.」"
2466 = "「Vậy sao.」"
2467 = "「Chị hiểu rồi. Nào, 'A' đi.」"
2469 = "「Vâng.」"
2471 = "「Đã rõ thưa ngài Soutetsu!」"
2473 = "「Vâng ạ. Chị cầm cẩn thận kẻo rơi nhé――A!」"
2475 = "「Vâng, rất sẵn lòng ạ.」"
2477 = "「Vì ngài Soutetsu đã chỉ ra con đường, và kéo dài tuyến đường ray cho chúng em. Những tuyến đường ray được kéo dài đó, đang bắt đầu kết nối lại với nhau rồi ạ.」"
2478 = "「Nếu em muốn thì tôi chạy cũng được――nhưng có chuyện gì sao?」"
2480 = "「Nếu hoàn toàn không tính đến sự quen thuộc, thì là KiHa 07S. Vì là thao tác máy móc, nên chỉ cần lặp đi lặp lại theo sách hướng dẫn là có thể nắm vững kỹ thuật.」"
2483 = "「Nếu bây giờ, trong lúc đang được ngài Soutetsu bế mà chị nhận ra điều đó, thì em sẽ rất khó xử đấy ạ.」"
2485 = "「Vượt xa xe ô tô Aerocraft――ví dụ như nếu có một tuyến tàu điện siêu tốc nối liền Teiou và Ousaka với tốc độ 200km/h thì sao」"
2487 = "「Chị hay dậy sớm lắm nha. Có khi lại làm mọi người thức giấc mất thôi」"
2488 = "「Trẻ con á!?」"
2489 = "「Không sao hết! Olivy cũng dậy sớm mà」"
2498 = "「Đúng. Đồng thời, một hình thức đường sắt mới, chắc chắn từ nay về sau cũng sẽ cần thiết đấy」"
2499 = "「Xin lỗi nha, Soutetsu, cảm ơn cậu nhiều nha~」"
2500 = "「Đúng đúng. Bình tĩnh lại đi~. Olivy đâu có trách móc gì cậu đâu mà~――ngoạm.」"
2502 = "「Bé O bị ngất, là trong tình huống nào, và vì lý do gì vậy?」"
2504 = "「Chỉ còn lại phần ốc quế thôi nhỉ? Chị muốn ăn cái nào trước?」"
2506 = "「Chuyện đó…… ngài Soutetsu và em, với tư cách là vợ chồng, muốn trở thành cha mẹ của những đứa trẻ――về chuyện đó.」"
2508 = "「Câu hỏi lúc nãy của cậu. Nếu có ai đó nắm giữ câu trả lời cho câu hỏi đó thì――」"
2510 = "「Là thiết bị ngắt mạch điện ạ.」"
2512 = "「Tuổi thọ của Olivy, có thể kéo dài được. Nghe xong Olivy, vui quá nên đầu óc nóng bừng――rồi có vẻ ngất đi luôn」"
2513 = "「Chẳng được nghiên cứu đàng hoàng――ý là vậy đúng không?」"
2515 = "「Đếm trên đầu ngón tay thôi. Nếu muốn làm mấy chuyện đó thì tôi đã chẳng về ở ẩn rồi.」"
2518 = "「Toàn bộ Hinomoto thì bây giờ vẫn chưa thể ngay được…… nhưng ví dụ như, chỉ chạy vòng quanh Kyushu thôi thì――」"
2520 = "「Giải thích thế là chuẩn rồi. Lần này, nó hoạt động là để bảo vệ khu vực trung tâm khỏi tình trạng phát sốt bất thường đó.」"
2527 = "「Làm gì có chuyện ngu ngốc như vậy. Nói chung là, \\x%lレイルロオド;#00ffc040;Railord%l;#; bị quá nhiệt ấy à, nếu không phải trong cái thời đại này thì...」"
2530 = "「Kéo dài tuổi thọ á――Hả? Ể!? Chuyện đó là sao!?」"
2531 = "「Kéo dài tuổi thọ, là sao?」"
2543 = "「Kéo về là \\x%l力行;#00ffc040;chạy kéo tải%l;#;. Ở giữa là \\x%l惰行;#00ffc040;chạy quán tính%l;#;. Đẩy tới là \\x%lブレーキ;#00ffc040;phanh%l;#;. ――Nghe nói đó là thứ có thể thực hiện tất cả những thao tác đó chỉ bằng một tay cầm.」"
2547 = "「Đó là một ý tưởng tuyệt vời đấy ạ! Tôi tất nhiên là cực kỳ tán thành rồi」"
2548 = "「Lịch sử đã thực sự diễn ra…… Có vẻ như đang chứng minh rằng phán đoán đó là sai lầm.」"
2550 = "「Nhưng mà―― Đường sắt tự động lái thì có gì thú vị chứ?」"
2551 = "「Mấy người thông minh, sao lại phạm sai lầm như vậy chứ!? Đường sắt, phải có \\x%lレイルロオド;#00ffc040;Railord%l;#; mới đúng chứ」"
2553 = "「Sao cơ, em chưa từng ăn thử bao giờ à?」"
2554 = "「Vậy sao ạ?」"
2555 = "「Đúng là…… vậy nhỉ. Nếu không có bộ phận nào bị hỏng rõ ràng, thì bây giờ, thực sự chỉ có thể theo dõi thêm thôi.」"
2556 = "「Câu trả lời, là――cho câu hỏi nào ạ?」"
2560 = "「Kem tươi nhỉ, em hiểu rồi ạ. Có vị vani, dâu tây và socola, bé Olivy thích vị nào?」"
2561 = "「Vậy thì, những người chuyển sang Aerocraft cũng không có lỗi. Nếu chúng ta có thể――lát lại đường ray đưa họ về với đường sắt một lần nữa」"
2563 = "「Nghe vui quá nha~!」"
2564 = "「Em nghĩ nếu là một phần mở rộng của Kế hoạch Đại Kyushu SL thì có thể làm được. Đậm chất Kyushu――với thiết kế hội tụ tinh hoa của Kyushu」"
2565 = "「Anh nghĩ cũng nên để Paulette nghe chuyện này, nên chắc từ ngày mai mới liên lạc」"
2572 = "「Tôi không bận tâm đâu. Hay nói đúng hơn là――」"
2574 = "「Chính vì đó là điều mà mọi người khao khát, nên ý tưởng SL Đại Kyushu mới có thể lan truyền rộng rãi khắp Hinomoto như vậy ạ.」"
2575 = "「Tôi cũng đồng ý. Hachiroku, xin lỗi nhưng lấy tiền từ ví của tôi nhé.」"
2583 = "「Về hình mẫu nhân vật mà chúng ta nên cậy nhờ. Người đó, thay vì công nghệ mới, lại tận dụng đường sắt hiện có và \\x%lレイルロオド;#00ffc040;Railord%l;#;――」"
2585 = "「Người đã biết ngay từ đầu rằng, \\x%lレイルロオド;#00ffc040;Railord%l;#; chính là sợi dây kết nối con người và đường sắt lại với nhau.」"
2587 = "「Không phải là tối ưu hóa hệ thống đường sắt. Mà là con đường kéo dài trực tiếp mối liên kết giữa con người, đường sắt và \\x%lレイルロオド;#00ffc040;Railord%l;#;.」"
2589 = "「Em đâu có làm ầm ĩ!」"
2591 = "「Tôi nghĩ…… chắc em sẽ muốn xem cách người ta làm kem tươi……」"
2593 = "「Được chạm vào bàn tay bé nhỏ đó, cảm nhận được hơi ấm đó, ――Em cảm thấy mọi thứ trên cơ thể bé đều tròn trịa và mềm mại.」"
2594 = "「Chắc chắn sẽ cần đến công nghệ đó. Nhưng đương nhiên, không phải một sớm một chiều, một bước là tạo ra được ngay」"
2597 = "「Thế? Chiếc nào dễ lái hơn.」"
2599 = "「Nên là Olivy! Sẽ giúp hai người tìm cách! Như vậy thì đúng là fifty-fifty (năm mươi-năm mươi) rồi nhỉ?」"
2600 = "「Vì vậy, việc dùng bồn nước lạnh để hạ nhiệt độ xuống mức an toàn, chắc chắn là cách xử lý tối ưu nhất, em cũng hiểu điều đó ạ.」"
2603 = "「Thế nên phải phân chia công việc. Tất cả cùng ở đó theo dõi cũng chẳng ích gì. Lắng nghe mọi chuyện cẩn thận chắc chắn sẽ giúp ích được cho Olivy.」"
2605 = "「Nên mới nói là thử nghiệm ở những nơi chắc chắn thắng―― ở những nơi có thể thử nghiệm được đó hả」"
2607 = "「Vậy thưa bà chủ. Tình trạng của Olivy thế nào rồi?」"
2609 = "「Xin lỗi nha…… Olivy không biết phương pháp nào như thế cả. Nhưng mà――tại sao hai người lại muốn nuôi trẻ con vậy?」"
2613 = "「Bộ ngắt mạch sao.」"
2614 = "「Nếu vậy thì…… bà cũng hầu như không giao lưu gì với các kỹ sư khác sao?」"
2615 = "「Thế? Phương pháp gì cơ? Phương pháp làm gì?」"
2616 = "「Thế, Sou-chan.」"
2617 = "「Nhưng mà, để lát được đường ray đó thì mất mấy năm đây? Chắc tuổi thọ của chị cũng không kịp đợi đến lúc đó đâu」"
2618 = "「Vì vậy, chúng tôi đã nhờ ông chủ nhà tắm Tororyu-yu chẩn đoán, và trong lúc làm mát cho Olivy, đã hỏi về phương pháp kéo dài tuổi thọ」"
2620 = "「Dựa trên điều đó――lý do tại sao em lại có thái độ―― khiến chị nghĩ rằng em đang coi chị như em bé, là vì.」"
2626 = "「Hibiki, bình tĩnh nghe anh nói. Nói chung, anh sẽ kể lại theo trình tự」"
2633 = "「Vậy sao? Nhưng mà.」"
2634 = "「Vậy sao? Thế thì」"
2636 = "「Vậy sao. Bé O hạnh phúc thì? Chị cũng hạnh phúc.」"
2638 = "「Vì nghe nói về chuyện kéo dài tuổi thọ. Nên Olivy, hơi hưng phấn một chút」"
2641 = "「Của Hiroshima」\\n「Ôi! Ôi, chúng ta phải đi ngay thôi!」"
2643 = "「Vâng.」"
2644 = "「Vâng」\\n「Ừm」"
2646 = "「Vâng. Nếu bà không phiền.」"
2650 = "「Ra vậy. Chuyện đó――cũng đúng nhỉ.」"
2651 = "「Ra vậy.」"
2653 = "「Vậy sao? Olivy thì nghĩ điều đó không sai đâu」"
2654 = "「Thế thì em cũng muốn đi thử! Tốc độ 200km/h, em chỉ đơn thuần tò mò không biết cảnh sắc sẽ như thế nào thôi」"
2657 = "「Gối đây gối đây.」"
2658 = "「Muốn đi thử――đúng không, ừm. Nếu có thể khơi gợi được cảm giác đó bằng thiết kế, bằng hệ thống」"
2661 = "「Quả nhiên là em vẫn nên quay lại bên đó thì hơn.」"
2663 = "「Chính vì là trong cái thời đại đó. Để giúp ngành đường sắt sống sót, họ đã vắt óc suy nghĩ, cố gắng tìm ra một con đường.」"
2664 = "「Chính xác」"
2669 = "「Ví dụ như…… đúng rồi, làm thế này này?」"
2671 = "「Ví dụ như…… chạy một chuyến tàu du lịch vòng quanh siêu sang trọng như [Occident Express,3]Tàu tốc hành Phương Tây ở Hinomoto chẳng hạn」"
2679 = "「Không có gì đặc biệt đâu~. Olivy vẫn chưa được nhận lương nữa mà.」"
2680 = "「Đúng vậy. Tùy thuộc vào thời tiết và tình hình mỗi ngày, mà dù cùng một thao tác nhưng phản ứng lại hoàn toàn khác nhau. Vì thế chỉ có thể thành thạo qua thực hành.」"
2681 = "「Đúng vậy, nhưng để làm được thế, đương nhiên sẽ cần một số vốn khổng lồ」"
2685 = "「Kem tươi! Cẩn thận coi chừng rơi kìa!!」"
2687 = "「Việc thành thạo tốn nhiều công sức, thời gian và chi phí đào tạo nhân sự cũng tăng lên. Một hệ thống như vậy, làm sao có thể chống lại đại bãi bỏ tuyến, chống lại Aircra được.」"
2690 = "「Reina sẽ cố gắng chăm sóc cho chị ấy nha~」"
2694 = "「Có rất nhiều người đã suy nghĩ như vậy đấy. Họ cho rằng việc nâng cao hiệu suất thông qua điều khiển tập trung mới là con đường sống còn của ngành đường sắt.」"
2695 = "「Tất nhiên là được rồi, bé Olivy.」"
2696 = "「Tất nhiên là dâu tây rồi! A――――ngoạm! Ưm ưm ưm! Chua chua ngọt ngọt ngon quá đi~!」"
2701 = "「Điều đó là hiển nhiên rồi ạ. Đúng như lời ngài Soutetsu nói, \\x%l蒸機;#00ffc040;đầu máy hơi nước%l;#; là một sinh vật sống mà.」"
2704 = "「Nguyên nhân trực tiếp là ngắt mạch do quá nhiệt. Nguyên nhân gây quá nhiệt thì――hiện tại, chưa thể xác định được nhưng」"
2708 = "「Thấy chưa? Olivy thấy dễ chịu và vui lắm, nên cũng muốn đáp lễ mọi người!」"
2710 = "「Hibiki và Makura! Hai người đó đang lo lắng cho Olivy, nên Olivy muốn báo cáo cho họ biết thật nhanh!」"
2711 = "「Ngoan lắm」"
2713 = "「Thật sao!? Mong chờ quá đi~!」"
2714 = "「Thật sao!!?」"
2715 = "「Vậy luôn!?」"
2717 = "「Nếu làm được vậy thì lý tưởng quá. Đương nhiên, không chỉ dựa vào du lịch, mà còn phải kết hợp cả phát triển khu vực xung quanh thì mới thành hiện thực được」"
2720 = "「Đúng là vậy nhỉ.」"
2722 = "「Điều hướng cho Aircra――sao ạ.」"
2723 = "「Để sau cũng được ạ, ngài Soutetsu. Em đi mua ngay đây.」"
2728 = "「Vì tương lai của ngành đường sắt――vào cái thời đại mà Aircra lan rộng như cháy rừng, và cơn bão đại bãi bỏ tuyến đường sắt đang hoành hành dữ dội đó sao ạ?」"
2731 = "「Kết quả kiểm tra cho thấy, không có hỏng hóc nào đáng kể. Nhưng vì tình trạng phát sốt bất thường vẫn tiếp diễn, nên phải tiếp tục hạ nhiệt và theo dõi.」"
2733 = "「Và như thế, chắc chắn. Công nghệ mới sẽ mở ra tương lai cho đường sắt ạ」"
2736 = "「Đáng tiếc là, có vẻ như vậy」"
2737 = "「Là vậy đó, ra ngoài một chút đi.」"
2740 = "「Làm gì có chuyện đó chứ~! Olivy là \\x%lレイルロオド;#00ffc040;Railord%l;#; mà.」"
2750 = "「Em đã trải nệm xong rồi ạ.」"
2753 = "「Vậy, chúng ta cũng vào trong tiệm nhé?」"
2754 = "「Điều đó thì đúng rồi――nhưng bằng cách nào?」"
2755 = "「Chắc việc đó…… cũng khó ngang ngửa với việc, kéo dài tuổi thọ cho Olivy đó.」"
2756 = "「Về cảm giác lái thú vị thì 8620 áp đảo hoàn toàn. Cảm giác như đang điều khiển một sinh vật sống chứ không phải là máy móc vậy.」"
2760 = "「Đúng là vậy nhưng――」"
2761 = "「Cũng đúng ha. ……Nếu nghĩ đến chuyện kiếm tiền, thì bản thân tàu du lịch chắc vẫn còn nhiều điểm có thể phát triển thêm」"
2762 = "「Phiền thì không phiền. Nhưng mà――tôi cũng chẳng nghĩ ra điều gì có thể trả lời được.」"
2763 = "「Hệ thống điều khiển càng mang tính máy móc, phi cảm giác thì hiệu suất càng cao. Và thứ đẩy mạnh ý tưởng đó lên một bước nữa chính là――Bộ điều khiển trung tâm.」"
2764 = "「Cảm ơn Soutetsu nha! Cậu vừa gợi ý cho Olivy một chuyện rất hay đó. Khi nào nhận được lương, Olivy nhất định sẽ thử làm vậy!」"
2765 = "「Để hai người phải chờ lâu rồi ạ.」"
2773 = "「Đi thôi á, chờ chút đã! Olivy vẫn chưa được nhận kem tươi mà.」"
2776 = "「Phương pháp gì cơ? ――A」"
2793 = "「Cái đó…… nói thật thì, nghe có vẻ nhàn nhã nhỉ. Chắc chắn sẽ giảm thiểu đáng kể sự mệt mỏi về thể chất khi lái tàu.」"
2794 = "「Chút chuyện nhỏ ấy mà.」"
2795 = "「Chà, ai biết được nhỉ? Dù cho có lý do nào khác đi nữa, thì bé Olivy cứ đợi đến lúc cần nhận ra rồi hẵng nhận ra là được ạ.」"
2796 = "「Cái đó thì tôi không rõ…… nhưng những kẻ chuyển hướng sang bên kia, chắc cũng nghĩ rằng đường sắt sẽ cứ thế từ từ lụi tàn thôi.」"
2797 = "「Chuyện đó――là vì em. Vài ngày trước, em đã được tiếp xúc rất gần gũi, với em bé của một người bạn ngài Soutetsu, đó là lần đầu tiên trong đời em.」"
2798 = "「Không chỉ vậy, nhu cầu sử dụng cho công việc cũng sẽ quay lại. Loại chạy trên mặt đất―― Tốc độ hành trình trung bình của xe Aerocraft chỉ khoảng 60km/h thôi」"
2799 = "「Vậy sao~. Ưm~. Olivy nghĩ đó là một giấc mơ tuyệt vời đấy~. Nhưng mà…… nói thật thì, có vẻ rất khó khăn nhỉ~.」"
2800 = "「Ra vậy――bởi thế nên」"
2801 = "「Vậy sao.」"
2802 = "「Vậy sao, nếu thế thì!」"
2803 = "「Một đường sắt như vậy, không còn là đường sắt nữa. Đó chỉ đơn thuần là phương tiện để vận chuyển――để di chuyển thôi mà!」"
2804 = "「Vậy thì, dùng cái đó―― 'đường sắt hiện có'. Trang trải bằng doanh thu từ tàu du lịch」"
2805 = "「Nói vậy là sao?」"
2806 = "「Như vậy! Thật kỳ lạ!」"
2810 = "「Đâu chỉ có vậy thôi đâu~! Em từng được nhờ tư vấn thiết kế tàu rồi đó nha」"
2811 = "「Hừm?」"
2819 = "「Thế cũng không sao đâu ạ. Chỉ cần một chút thôi, thứ gì đó có thể dẫn đến manh mối cũng được.」"
2821 = "「Thế thì tiếp theo cho Olivy nữa nha! Olivy cũng muốn thử quạt xem sao!」"
2823 = "「Vậy thì, cứ nhắm vào những điểm có thể thắng đó, mà hướng tới tự động hóa là được thôi」"
2825 = "「Thế――tóm lại là bị làm sao ạ.」"
2826 = "「Nếu vậy thì, mỗi người năm phút. Chúng ta thay phiên nhau quạt nhé?」"
2830 = "「Đầu tiên, anh sẽ giải thích nội dung cuộc trò chuyện giữa chúng ta và \\x%l機関士;#00ffc040;Lái tàu%l;#; Munakata――\\x%l機関士;#00ffc040;Lái tàu%l;#; từng làm việc trên đầu máy số 9 ở Đường sắt Mikan」"
2833 = "「Nếu vậy thì, cứ giữ cho bụng không bị lạnh. Còn những chỗ khác thì làm mát đàng hoàng là được thôi mà.」"
2835 = "「Thế thì, hãy bắt tay giao ước nào! Soutetsu bây giờ đang bận tay rồi, nên là.」"
2837 = "「Vậy là quyết định rồi nhé!」"
2839 = "「Vậy thì! Nha! Kem tươi đi! Olivy luôn muốn được ăn thử món đó một lần cho biết đó!」"
2840 = "「Vì em nghĩ đó là tư thế tốt nhất, để hạn chế truyền nhiệt độ cơ thể của ngài Soutetsu sang cho bé Olivy ạ.」"
2842 = "「Nếu vậy, bà có biết ai không ạ? Những kỹ sư hay xưởng chế tạo có vẻ đang nghiên cứu sâu về việc phục hồi \\x%lレイルロオド;#00ffc040;Railord%l;#; ấy ạ.」"
2847 = "「Vậy thì, phải nối luôn phòng bên cạnh lại rồi~. Để em đi lấy nệm cho khách!」"
2848 = "「Nếu vậy…… nếu vậy thì em sẽ quạt sau chị Hibiki ạ.」"
2849 = "「Nếu vậy, giữa 8620 và KiHa 07S. Bỏ qua sự quen thuộc, thì chiếc nào dễ lái hơn?」"
2852 = "「Vậy thì! Nha? Mỗi loại một cái được không? Vani nè, và cả dâu tây nữa!」"
2853 = "「Nếu vậy. Thì đó. Hãy trả lời đúng như thế.」"
2855 = "「Với mọi người sao」"
2856 = "「Thế nên――nếu có \"chỗ nào hỏng\" có thể sửa được, thì cứ sửa đi là xong chuyện rồi――」"
2868 = "「Việc bán Aircra hóa đường sắt――những kẻ chuyển sang làm điều hướng cho Aircra, chắc hẳn đã coi đó là một lựa chọn quay về với những giá trị cơ bản.」"
2870 = "「Chị Hai, mỏi tay không? Nếu mỏi thì để em thay cho nhé.」"
2872 = "「Một phương pháp nào đó ngoài việc nhận nuôi…… hình thức nào cũng được. Miễn là có cách để chúng em có thể nuôi nấng một đứa trẻ.」"
2875 = "「Điều khiển tập trung……」"
2876 = "「Đáng tiếc là với cơ thể \\x%lレイルロオド;#00ffc040;Railord%l;#; này, thì việc mang thai là điều không thể――nhưng dù vậy.」"
2878 = "「KiHa 07S cũng có những đặc điểm riêng, nhưng thao tác thì dễ dàng hơn nhiều. Dù thế nào đi nữa, cảm giác vẫn là đang điều khiển máy móc.」"
2879 = "「Có vẻ không sao đâu, anh Soutetsu! Bên này cứ giao cho chúng tôi là được rồi.」"
2880 = "「Ngài Soutetsu」"
2881 = "「Điện xá Công chúa điện hạ!!」"
2884 = "「Nhắm đến giới siêu giàu, đẳng cấp cao―― Không, là tàu du lịch hạng siêu sang sao」"
2885 = "「Phương pháp để nhận nuôi một đứa trẻ. Hoặc là, ừm――nếu như có tồn tại.」"
2890 = "「Amazing!!」"
3044 = "Chỉ một hành động đã giải quyết vấn đề, đồng thời làm cho Olivy vô cùng thích thú."
3047 = "Gió. Mát quá. Đang tự hỏi tại sao, tôi đưa mắt nhìn sang thì――"
3051 = "Dù tuyến đường ray có dài bao xa đi chăng nữa, nếu không thể \\x%l接続;#00ffc040;kết nối chuyển tàu%l;#; với các tuyến hiện có, thì đối với chúng ta cũng coi như không."
3057 = "Nhưng chỉ cần nghe qua thôi cũng có thể suy đoán được mức độ này. Nếu đã có mặt mà vẫn không hiểu, thì chỉ có thể nói là do quá hoảng loạn mà thôi."
3058 = "Nhưng mà, ừm…… Thấy Olivy ăn ngon lành thế kia thì cũng tốt thôi, nhưng――"
3060 = "Tên gọi phổ biến là \\x%lダイコン;#00ffc040;điều khiển trực tiếp%l;#;. Là thiết bị điều khiển lái được áp dụng cho hệ thống lái của KiHa 07S."
3073 = "Quy mô vận hành càng mở rộng, thì việc nắm bắt tình hình và hỗ trợ phán đoán thông qua \\x%l共感;#00ffc040;cộng cảm%l;#; và chia sẻ thông tin càng trở nên quan trọng hơn."
3076 = "Có lẽ Olivy cũng nhận ra điều đó, nên dù hơi ngần ngại, em ấy vẫn há miệng thật to――"
3078 = "Nhưng, có một điều mà tôi biết rõ. Tôi cảm nhận được sâu sắc."
3080 = "Nhưng, đây không phải là chuyện có thể dễ dàng bỏ cuộc."
3086 = "Tiếng kêu của Hachiroku như thể đang tiếc nuối vì chậm chân hơn một bước."
3088 = "Hachiroku và chị Hibiki nhìn tôi bằng ánh mắt cầu cứu. Nhưng…… quyết định chuyện này quả thực khá khó khăn."
3091 = "Hachiroku cụp mắt xuống."
3093 = "Một giọng nói như đang cầu nguyện, như bị vắt kiệt. Tôi bất giác ôm lấy bờ vai của Hachiroku."
3095 = "Hachiroku cất lên một giọng nói dồn dập, như một tiếng hét."
3097 = "Hachiroku dứt khoát gạt bỏ thắc mắc của Hibiki."
3098 = "Hachiroku khẽ cựa quậy cơ thể rồi nhìn tôi. Trông thật là dễ thương."
3102 = "Dưới mái tóc mái bồng bềnh tung bay, nụ cười rạng rỡ đến mức khiến người ta phải ghen tị."
3103 = "Giọng nói của Hachiroku, tràn đầy sự tự tin."
3106 = "Nhận được sự đồng tình kèm nụ cười của Olivy, lời nói của Hachiroku càng thêm trôi chảy."
3107 = "Dù đang bối rối, và có lẽ cũng đang tự kiểm điểm bản thân, nhưng bàn tay đút kem của em ấy vẫn tiếp tục di chuyển một cách nhịp nhàng."
3108 = "Cái gật đầu chậm rãi ấy, cuối cùng cũng cho thấy dáng vẻ thường ngày của Hachiroku. Bà chủ cũng khẽ mỉm cười."
3111 = "Hachiroku mỉm cười. Trông thật hạnh phúc, và tràn đầy tự tin."
3112 = "Vừa nói, Hachiroku vừa tháo găng tay ra."
3116 = "Một khi Hachiroku đã quyết định thì em ấy sẽ không bao giờ nhượng bộ."
3117 = "Suy nghĩ của tôi đã truyền đến em ấy―― Không, không phải. Chính Hachiroku cũng có cùng suy nghĩ với tôi."
3119 = "Trước sự kinh ngạc tột độ của Olivy, Hachiroku vẫn không hề dao động. Em ấy coi phản ứng đó là một điều hiển nhiên."
3124 = "So với cõng hay bế bình thường, thì phạm vi tiếp xúc sẽ hẹp hơn."
3128 = "Cả bên ngoài lẫn bên trong chữ Xuyên, chứa đựng một dòng chảy còn lớn hơn nữa, một chữ Xuyên hệt như dòng sông Kuma."
3129 = "Sự kích thích hay hưng phấn quá mức có thể làm giảm tuổi thọ của Olivy―― Đó là lời khuyên mà tôi đã nhận được từ bà chủ nhà tắm Tororyu-yu."
3133 = "Những suy đoán nảy ra trong đầu tôi ngay khoảnh khắc nghe thấy từ đó đã được xác nhận, và trong lúc nói chuyện, Hachiroku có vẻ cũng đã bình tĩnh lại khá nhiều."
3138 = "Bệnh tật, thương tích――dù không có nguyên nhân rõ ràng nào như vậy, nhưng sự xuống cấp và hao mòn toàn diện đang cản trở mọi hoạt động của em ấy."
3140 = "Dù là tàu du lịch siêu cao cấp, hay tàu đi lại sử dụng công nghệ mới. Hay thậm chí là tàu điện siêu tốc thì cũng vậy. Đó là cái gốc rễ."
3142 = "Ra là vậy, không hổ danh là chị Mayami."
3143 = "\\x%lマスコン;#00ffc040;Điều khiển trung tâm%l;#;――ra là vậy, xét theo ý nghĩa đó thì đây quả là một thiết bị có thể đóng góp to lớn cho sự ổn định của việc kinh doanh."
3164 = "Tay phải cầm ly kem màu trắng, tay trái cầm ly kem màu hồng một cách cẩn thận, Hachiroku bước ra từ cửa hàng tiện lợi."
3167 = "Nhưng lại không có. Nếu vậy thì Olivy…… Nói theo kiểu con người, có lẽ đang ở trong tình trạng gần như lão hóa."
3169 = "Nhưng, Olivy vẫn đang nhìn chằm chằm vào tôi. Đã đến nước này rồi, thì chỉ còn cách nói thật thôi."
3178 = "Định hỏi, nhưng may mà tôi kịp nhận ra. Rằng rốt cuộc, ở một khía cạnh nào đó, tôi cũng đang coi Olivy như một đứa trẻ."
3180 = "Vì giọng nói vui sướng của Hachiroku, đã chỉ ra câu trả lời rồi."
3202 = "Khuôn mặt Olivy bừng sáng."
3203 = "Bật dậy! Olivy định nhảy dựng lên, nhưng ngay lập tức bị bàn tay của chị Mayami nhẹ nhàng, êm ái đặt nằm xuống."
3204 = "Ực một tiếng, Olivy nuốt nốt miếng ốc quế cuối cùng."
3205 = "Em ấy giật mình co người lại, tôi mới nhận ra tay phải mình đang định xoa đầu Olivy."
3206 = "Động tác quạt của Olivy dừng lại. Im lặng một chút――sau đó, những lời nhẹ nhàng tiếp nối."
3207 = "Đôi mắt Olivy sáng rực, hai má ửng hồng."
3208 = "Olivy đang bám chặt lấy chiếc chăn hè như một chú mèo con."
3209 = "Nở một nụ cười rạng rỡ. Olivy chìa tay ra."
3210 = "Olivy định ăn tiếp nhưng lại khựng lại. Vì em ấy đã ăn hết phần kem phía trên rồi."
3211 = "Trước lời nói và hành động của Olivy, Hachiroku thở phào nhẹ nhõm thấy rõ."
3212 = "Olivy khoanh tay trước ngực và trầm ngâm suy nghĩ."
3213 = "Trước câu trả lời đầy ẩn ý đó, Olivy nghiêng đầu thắc mắc."
3214 = "Nói xong, Olivy nở một nụ cười rạng rỡ."
3215 = "Olivy vừa cười khanh khách, vừa nhai rồm rộp―― như một con thú gặm nhấm nhỏ, thoáng chốc đã ăn hết phần ốc quế."
3216 = "Trước câu hỏi lặp lại không biết bao nhiêu lần đó, Olivy bật cười khúc khích, một nụ cười xen lẫn vẻ cạn lời."
3218 = "Đôi lông mày đang nhíu lại vẻ khó chịu của Hachiroku, bỗng nhướng lên vì kinh ngạc."
3221 = "Một cái bắt tay thật chặt."
3223 = "Lấy ra một chiếc khăn tay được ủi phẳng phiu, lau nhanh tay mình, rồi nhẹ nhàng nắm lấy tay Olivy."
3224 = "Là thì quá khứ. Một khoảng lặng ngắn――Một sự im lặng kéo dài."
3227 = "Đáng yêu quá đi mất. Ngây thơ hồn nhiên chính là như thế này đây."
3229 = "Lần này là một cái gật đầu mạnh mẽ và sâu sắc."
3231 = "Em ấy lặng lẽ, lắng nghe Hachiroku giải thích."
3233 = "Nếu không phải đang bế kiểu công chúa, thì tôi đã xoa đầu khen em ấy là một cô bé ngoan rồi."
3236 = "Tôi chỉ có thể nghĩ đến một người duy nhất. Kỹ sư nghiên cứu về việc \"kéo dài tuổi thọ cho \\x%lレイルロオド;#00ffc040;Railord%l;#;\"――"
3240 = "Nếu tập trung thông tin \\x%l共感;#00ffc040;cộng cảm%l;#; lại, thì việc vận hành mang tính điều khiển tổng quát――ví dụ như, có thể ra lệnh lái tàu trên phạm vi rộng chỉ từ một cứ điểm thu thập thông tin duy nhất."
3243 = "Nếu người đó mà không biết, thì ít nhất là ở Hinomoto này, tôi nghĩ sẽ chẳng có một ai biết cả."
3247 = "Đúng rồi. Không được để em ấy hưng phấn quá."
3248 = "Đúng vậy. Tất cả bắt đầu từ nơi ta đang đứng――từ dưới chân mình."
3255 = "Từ nhà tắm nữ, vang lên giọng của Paulette và Reina."
3269 = "Navi hóa Aerocraft cho \\x%lレイルロオド;#00ffc040;Railord%l;#;. Không ngờ Olivy lại tán thành điều đó――"
3271 = "Những câu chuyện nghe được từ ông chủ nhà tắm Tororyu-yu, có vẻ tôi đã sắp xếp và truyền đạt lại một cách mạch lạc, rõ ràng."
3276 = "Vừa đặt Olivy nằm xuống nệm, chị Hibiki đã nhanh thoăn thoắt đắp chăn hè lên bụng em ấy."
3280 = "Không hiểu lý do tại sao, nhưng chúng tôi vẫn nghe theo chỉ thị bước ra ngoài."
3281 = "Trải nệm xếp hàng ngang, ngủ theo hình chữ Xuyên (川). Không phải ba người, mà là chữ Xuyên năm người."
3282 = "Đang tự hỏi sao em ấy lại đột nhiên nói vậy, thì ra là thấy cửa hàng tiện lợi. Nếu đi qua đây vào giờ này, thì chỉ còn cách mua đồ ở máy bán hàng tự động thôi."
3288 = "Tôi chạy sóng vai cùng Hachiroku. Với một tốc độ không làm khó em ấy."
3290 = "Tôi và Hachiroku nhìn nhau. Ra vậy, nếu là như thế thì――"
3293 = "Gần như cùng lúc với cảm giác nhẹ nhõm, một giọng nói điềm tĩnh tiến lại gần."
3294 = "Niềm vui chầm chậm dâng lên. Từ sâu thẳm trong lòng cảm thấy thật ấm áp. Đường sắt là――Tuyến đường sắt là. Con đường kết nối những mối liên kết sao."
3298 = "Để giải tỏa sự hoảng loạn đó, tôi điềm tĩnh sắp xếp lại các sự thật, cuối cùng Hachiroku cũng cất lên một giọng điệu xấu hổ."
3299 = "Những chỗ mơ hồ, hay nhầm lẫn sự thật―― đã được Hachiroku và Olivy đỡ lời cho hết lần này đến lần khác."
3301 = "Cuối cùng tôi cũng hiểu ra. Vai trò của \\x%lレイルロオド;#00ffc040;Railord%l;#; không chỉ là hỗ trợ lái tàu."
3303 = "Nghe em ấy nói tôi mới nhớ ra. Đường sắt Mikan――hay nói đúng hơn là, các công ty đường sắt thông thường không hề trả lương cho \\x%lレイルロオド;#00ffc040;Railord%l;#;."
3305 = "Nghe vậy, tôi như bừng tỉnh ngộ."
3306 = "Tôi khẽ xoa đầu Hachiroku, bảo em ấy không sao đâu――. Ừm. Dù sao thì trước tiên cũng phải xác nhận tình hình đã."
3308 = "Tôi đang suy nghĩ xem nên giải thích thế nào. Trong khoảnh khắc im lặng ngắn ngủi đó, Olivy giơ tay lên \"Có\"."
3309 = "Lần này là, Hachiroku."
3327 = "Mặt Hibiki tái đi. Chắc em ấy đã liên kết chuyện ngất xỉu với chuyện tuổi thọ――rồi."
3329 = "Chị Hibiki hồi nhỏ cũng từng được chị Mayami, và cả tôi quạt cho như thế――"
3331 = "Tiếng hét lớn của Hibiki. Với khí thế như chực đứng bật dậy."
3333 = "Nhận được cái gật đầu nhè nhẹ của Hibiki, Olivy cũng lộ vẻ mặt vui mừng."
3335 = "Hibiki cứng đờ người. Hachiroku cũng chớp chớp mắt. Tôi cũng ngạc nhiên không kém."
3337 = "Ánh mắt của Hibiki giờ là ánh mắt của công việc―― ánh mắt của một nhà thiết kế."
3339 = "Chị Hibiki cuống cuồng định kéo chăn hè ra, nhưng chiếc chăn lại không nhúc nhích, cứ như bị khâu chặt vào nệm vậy."
3341 = "Mặc dù tôi đã nói như vậy, nhưng giọng điệu của Hachiroku lại đầy vẻ tự hào."
3343 = "Cơ hội được ăn thức ăn của con người vốn đã ít ỏi…… Ra vậy, đối với những món ăn chơi như thế này, thì việc chưa từng ăn qua cũng là lẽ tự nhiên thôi."
3346 = "Còn cách nào khác không――trước khi tôi kịp suy nghĩ, Hachiroku đã thay tôi hỏi."
3349 = "Vì không có sự đồng ý của Olivy, nên tôi đã không thể có mặt lúc kiểm tra."
3350 = "Đúng ngay cái điều mà tôi đang bận tâm, thì Olivy lại thản nhiên hỏi thẳng ra một cách rất nhẹ nhàng."
3355 = "Để Olivy dễ ăn hơn, tôi vừa điều chỉnh nhịp thở cho khớp với Hachiroku, vừa giảm tốc độ và bước đi thật chậm rãi."
3358 = "Và rồi, chậm rãi―― Em ấy vắt kiệt từng lời với vẻ mặt vô cùng xấu hổ."
3359 = "Rồi nhẹ nhàng buông tay ra, Olivy ngước nhìn tôi với vẻ mặt vô cùng vui sướng."
3361 = "Nhưng mà. Nhiệt độ cơ thể của Olivy hiện tại vẫn cao hơn tôi. Tôi lại hơi nghĩ rằng phạm vi tiếp xúc rộng hơn thì sẽ tốt hơn chứ――"
3364 = "Dù sao bây giờ, phải để Olivy nghỉ ngơi và bình tĩnh lại đã."
3367 = "Bởi vì sự sống động và đòi hỏi nhiều công sức chăm sóc đó, cũng chính là một trong những sức hấp dẫn lớn nhất của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;."
3371 = "Mệt mỏi là kẻ thù lớn nhất của sự tập trung, và thiếu tập trung sẽ dẫn đến tai nạn."
3378 = "Bà chủ nhà tắm Tororyu-yu nhắm mắt suy nghĩ một lúc, rồi từ từ lắc đầu."
3400 = "Để trở về ngôi nhà của chúng tôi."
3401 = "Bộ điều khiển trực tiếp."
3403 = "Có vẻ như em ấy rất khó đưa ra quyết định, dù đang được bế kiểu công chúa, đôi chân vẫn vùng vẫy liên hồi."
3404 = "Kiểu này thì phải suy nghĩ kỹ cách nói và cách truyền đạt rồi đây."
3405 = "Chắc hẳn câu nói đó đã khiến em ấy vô cùng bất ngờ."
3414 = "Chị ấy cười khúc khích, một nụ cười vô cùng mãn nguyện."
3415 = "Chị Mayami lại mỉm cười dịu dàng. Nhưng ngay sau đó, chị ấy nghiêm mặt lại và nhìn tôi."
3424 = "Mối liên kết. Ra là Hachiroku đã nhìn nhận ý tưởng SL Đại Kyushu theo cách đó sao."
3432 = "Như thể đang hoài niệm, hoặc như đang hối hận điều gì đó. Bà chủ nhà tắm Tororyu-yu cụp mắt xuống."
3433 = "Tôi hỏi, và nhận lại một sự im lặng ngắn ngủi."
3434 = "Bà chủ nhà tắm Tororyu-yu lặng lẽ gật đầu. Khóe miệng đang cất lời bỗng dịu lại."
3436 = "Ở những khía cạnh như thế này, em ấy thực sự rất người lớn. Chắc chắn là người lớn hơn cả tôi, và cả Hachiroku nữa."
3440 = "Hachiroku và Olivy đang vui vẻ đến thế này cơ mà. Nghĩ vậy thì, cái giá này quả thực là quá rẻ."
3453 = "Khi tôi hỏi thì mọi người đã bắt đầu di chuyển. Cả Hachiroku, tôi, và bà chủ nhà tắm Tororyu-yu."
3455 = "Nói xong, tôi mới chợt nhận ra. Olivy được sản xuất tại Mỹ, là hàng ngoại nhập, và còn lớn tuổi hơn cả Hachiroku."
3464 = "Bản thân từ đó thì tôi biết. Nhưng―― Có lẽ Hachiroku muốn giải thích để tự trấn an bản thân."
3465 = "Không được. Đối phương đâu phải Hachiroku hay Hibiki đâu chứ. Mà nói đúng hơn thì――"
3466 = "Rằng những tuyến đường ray mà Kế hoạch Đại Kyushu SL kết nối, nên được kéo dài về đâu, tấm bản đồ tuyến đường đó."
3470 = "Qua cuộc trò chuyện vừa rồi, tôi có cảm giác mình đã lờ mờ nhìn ra."
3479 = "Im lặng lắng nghe, quả nhiên là một quyết định đúng đắn."
3482 = "Chính vì vậy, tôi phải giải thích cho đàng hoàng. Cũng là để nhờ Hibiki và chị Mayami giúp đỡ."
3483 = "Nếu vậy thì, đây chính là câu trả lời đúng."
3488 = "Ba câu trả lời ngoan ngoãn theo ba kiểu khác nhau."
3489 = "Tôi cũng rất hiểu cảm giác tự hào đó của em ấy."
3492 = "Khó thành thạo, nói cách khác là bất tiện."
3498 = "Việc lái tàu có thể được thực hiện bởi một người duy nhất, \\x%lレイルロオド;#00ffc040;Railord%l;#; sẽ trở thành dạng điều hướng, chuyên biệt hóa vào khả năng \\x%l共感;#00ffc040;cộng cảm%l;#;."
3507 = "（Thật là――bình yên.）"
3509 = "（Bịch）"
3511 = "（Ra vậy…… Mối liên kết sao.）"
3512 = "（Phạch phạch）"
3513 = "（Phành phạch）"

[selections]
