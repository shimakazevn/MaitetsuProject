76 = "Railord là thiết bị bảo vệ an toàn quan trọng nhất, và do đó, cũng là một vật phẩm tiêu hao. ……Những lời Hachiroku từng nói lại hiện về rõ mồn một trong tâm trí tôi."
1550 = "――Vừa ra khỏi cửa, Hachiroku đã định quay lại, nhưng bị bà chủ chặn đứng."
1552 = "――Nhưng, nếu xét đến sự sống còn của ngành đường sắt, thì lời khẳng định không chút khoan nhượng của bà chủ mới là câu trả lời chính xác."
1567 = "……Ra là vậy. Cứ hoảng loạn với cái điệu bộ này, thì những người vốn dĩ đang bình tĩnh cũng chẳng thể nào bình tĩnh nổi."
1572 = "……Olivy không hề chen ngang nửa lời."
1573 = "……Không biết là em ấy có hiểu thật hay không, nhưng với giọng điệu giả ngây giả ngô đó thì tôi không thể nào đoán được."
1575 = "……Chà, nếu chỉ nhìn bộ dạng này thôi, thì việc bảo đừng coi em ấy như trẻ con quả là một yêu cầu hơi khó."
1577 = "……Chiếc quạt giấy được xưởng rượu Migita phân phát vào dịp lễ hội mùa hè. Vì năm nào cũng cùng một họa tiết, nên những ký ức cũng như được quạt tung lên."
1579 = "……Chưa kịp cản thì em ấy đã đi mất rồi."
1584 = "……Trong lúc nói, bản thân tôi, cũng nhận ra mình đang khá bối rối."
1586 = "……Dù chỉ là một chút hơi lạnh, nhưng cũng đủ làm đầu óc tôi tỉnh táo hẳn."
1592 = "「\\x%lマスコン;#00ffc040;Điều khiển trung tâm%l;#; có cơ chế rất đơn giản, kéo về thì nhanh, đẩy tới thì chậm lại.」"
1594 = "「――Vâng.」"
1596 = "「――Công nghệ mới, chỉ có thể thử nghiệm ở những mảng đó thôi ạ」"
1597 = "「――Đúng vậy, chắc chắn」"
1599 = "「――Được ban cho một sinh mệnh mới. Tiếp nối những đường ray sinh mệnh. Em đã hiểu được, đó là một điều tuyệt vời đến nhường nào.」"
1608 = "「'A'――ngoạm! Ưm――ưm! Ngon quá đi mất~!」"
1609 = "「……\"Chuyện cậu muốn hỏi\" là về cái đó à?」"
1612 = "「…………」"
1630 = "「……Dù không có chúng em, không có \\x%lレイルロオド;#00ffc040;Railord%l;#;. Chỉ cần con người và \\x%lマスコン;#00ffc040;điều khiển trung tâm%l;#; là đủ――A, không. Vì vậy nên.」"
1636 = "「……Nói ngược lại, chính vì Aerocraft đã lấy đi toàn bộ cái cảm giác 'muốn đi thử' đó, nên mới xảy ra Đại bãi bỏ」"
1638 = "「……Ngặt nỗi, thông tin của tôi cũ rích rồi.」"
1643 = "「……Vì vậy nên…… việc nghiên cứu về hình thức hiện tại của \\x%lレイルロオド;#00ffc040;Railord%l;#;, về cơ bản, đã bị gián đoạn rồi sao?」"
1646 = "「……Ra là vậy. Nên Hachiroku và Soutetsu, mới muốn có em bé.」"
1651 = "「……Đã có Paulette và Reina ở bên cạnh rồi. Nếu có chuyện gì, họ sẽ lập tức dùng \\x%l共感;#00ffc040;cộng cảm%l;#; báo cho chúng ta biết thôi.」"
1655 = "「……Kế hoạch Đại Kyushu SL cũng đã thành công, và đang mở rộng. Tất nhiên Olivy nghĩ đường sắt theo cách từ trước đến nay vẫn cần thiết, nhưng mà」"
1656 = "「……Mục tiêu cuối cùng, ra là vậy, cũng giống như Aircra. Trở thành tự động lái, không cần đến \\x%l運転士;#00ffc040;Lái tàu%l;#; nữa sao.」"
1660 = "「……Những vị khách nước ngoài đến Hakuta du lịch, có khi sẽ được mời đi tham quan toàn bộ Kyushu luôn đó nha」"
1664 = "「……Vậy, đó là con đường như thế nào?」"
1665 = "「……Những người thợ có tầm nhìn xa trông rộng, tất cả, đều chuyển hướng sang phát triển điều hướng cho Aircra hết rồi.」"
1667 = "「……Ngài Soutetsu. Chuyện đó―― Em có thể giải thích cho bé Olivy nghe được không ạ?」"
2106 = "「Người luôn một lòng tin tưởng vào sự phục hưng của đường sắt truyền thống, và không chỉ vậy, còn liên tục chứng minh điều đó bằng hành động――」"
2109 = "「Không đâu, dễ chịu lắm~! Nè nha, Olivy đang thấy vô cùng hạnh phúc luôn.」"
2111 = "「Không ăn nhanh là nó chảy mất đấy nhé? Nào, 'A' đi.」"
2113 = "「Cứ làm mát đi, làm mát đến khi hạ xuống nhiệt độ an toàn, thì bộ ngắt mạch sẽ được giải phóng thôi.」"
2115 = "「Không, trong trường hợp này thứ được đòi hỏi, không phải là sự thú vị, mà là tính thực dụng」"
2116 = "「Không đâu, đường sắt sẽ không lụi tàn.」"
2118 = "「Không nóng đâu~, Vì Hachiroku đã tốn bao công sức giúp em mà~」"
2119 = "「Không có chi!」"
2120 = "「Bỏ qua sự quen thuộc sao ạ.」"
2122 = "「Không được.」"
2128 = "「Nhưng mà――khi nào được nhận tháng lương đầu tiên, Olivy muốn tự mua và xem người ta làm ly kem tươi của chính mình cơ.」"
2129 = "「Nhưng mà…… nếu việc lái tàu được đơn giản hóa đến mức đó thì.」"
2130 = "「Nhưng, chính vì là \"trong cái thời đại này\", nên sự cần thiết của việc phục hồi \\x%lレイルロオド;#00ffc040;Railord%l;#; mới càng tăng cao đúng không?」"
2132 = "「Ông chủ nhà tắm Tororyu-yu, thông qua câu chuyện đó, đã chỉ cho chúng ta một cách nghịch lý」"
2133 = "「Đúng vậy nhỉ. Vì thế nên đại bãi bỏ tuyến mới không hề dừng lại, và ngành đường sắt, gần như đã bị diệt vong.」"
2136 = "「Không được, hôm nay cứ cẩn thận thì hơn.」"
2139 = "「Bộ điều khiển trung tâm――」"
2145 = "「Hay còn gọi là \\x%lマスコン;#00ffc040;điều khiển trung tâm%l;#;. Master Controller đó ạ.」"
2148 = "「――Nói cách khác, bán Aerocraft hóa đường sắt. Vì có quá nhiều người hướng tới mục tiêu đó, nên kỹ thuật kéo dài tuổi thọ cho \\x%lレイルロオド;#00ffc040;Railord%l;#; hiện tại thì」"
2152 = "「Cũng đúng. Dù tôi nghĩ ăn đồ lạnh để hạ nhiệt thì chắc không sao đâu, nhưng cẩn thận một chút vẫn hơn.」"
2154 = "「Biết đâu Olivy, lại biết một phương pháp tiếp cận nào đó mà chúng ta không biết.」"
2155 = "「Có thể là vậy, nhưng――」"
2166 = "「Sapporo, Sendai, Teiou, Nagoya, Ousaka, Kyoto, Hiroshima, Kagoshima! Olivy muốn đi vòng quanh thử xem sao!」"
2169 = "「Không chỉ vì tiền bạc hay danh vọng đâu. Cũng có rất nhiều người chọn con đường đó vì tương lai của ngành đường sắt đấy.」"
2172 = "「Ra là vậy, ehehe~」"
2174 = "「Như cậu đã nghe đấy. Chẳng có hỏng hóc gì đáng gọi là hỏng hóc cả, chỉ còn cách cứ ngâm lạnh như thế rồi theo dõi thêm thôi.」"
2176 = "「Cứ làm ầm ĩ lên như thế, thì nhiệt độ đáng lẽ giảm được cũng chẳng giảm nổi đâu.」"
2177 = "「Vậy á――tại sao?」"
2178 = "「Sao em lại nghĩ, đó không phải là sai lầm?」"
2180 = "「Nếu khó chọn đến vậy, thì thử hết cả ba luôn đi? Hai cái còn lại cứ coi như là quà thăm bệnh của tôi.」"
2181 = "「Akiho? Là ai――」"
2184 = "「Ơ kìa, cách nói chuyện nghe có vẻ ẩn ý thế nha~. A! Không lẽ, còn có lý do nào khác nữa sao??」"
2195 = "「Bình tĩnh lại đi, Hachiroku.」"
2196 = "「Bình tĩnh lại đi Hachiroku. Em đang hỏi lại những điều mà bà ấy vừa giải thích rồi đấy.」"
2197 = "「Thêm vào đó là tính đúng giờ. Về việc không bị chậm trễ, đường sắt vẫn có lợi thế hơn so với Aerocraft chạy trên mặt đất ạ」"
2201 = "「Đừng bận tâm, lúc khó khăn thì giúp đỡ lẫn nhau là chuyện đương nhiên mà.」"
2202 = "「Đừng lấy đi mà~」"
2203 = "「Chuyện tiền bạc thì không sao đâu ạ. Lần này coi như là quà thăm bệnh tặng cho bé Olivy.」"
2208 = "「Lúc cần nhận ra? Ý là không phải bây giờ sao??」"
2216 = "「Vội vàng quá nên anh trải luôn nệm ở phòng này rồi. Nếu Hibiki không phiền, anh sẽ sang phòng em ngủ」"
2220 = "「Ra là vậy sao.」"
2221 = "「Vốn dĩ đường sắt là phương tiện vận chuyển, di chuyển khối lượng lớn giữa các điểm cố định. Thế nên nó mới có thể bám rễ vững chắc như một phương tiện giao thông công cộng.」"
2230 = "「Nghịch lý là sao?」"
2232 = "「Nếu có thể, em muốn cùng ngài Soutetsu. Nuôi dưỡng và tiếp nối một mầm non tương lai bé nhỏ――em đã ước như vậy.」"
2234 = "「Nhưng mà, ở những mảng đó thì đường sắt vốn đã thắng rồi mà? Sao lại phải cất công tốn tiền để tự động hóa nữa chứ」"
2238 = "「Nhưng mà này, tốc độ 200km/h, không biết con người hay \\x%lレイルロオド;#00ffc040;Railord%l;#; hiện tại có thể lái an toàn được không nhỉ?」"
2241 = "「Nhưng mà, 'Ăn nhiều đồ lạnh quá sẽ bị đau bụng' đúng không!? Olivy thấy mấy bà mẹ hay nhắc nhở con cái như thế lắm nha?」"
2242 = "「Khoan, mấy người Soutetsu, có quan hệ với Điện xá Công chúa sao?」"
2243 = "「Thế nên, vì tính thực dụng không thắng nổi Aerocraft, đường sắt mới bị Đại bãi bỏ làm cho tơi tả đó thôi」"
