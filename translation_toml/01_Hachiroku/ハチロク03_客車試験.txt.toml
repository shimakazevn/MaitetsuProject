2032 = "「Vâng. Ạ. Nếu đột ngột đi ngược dòng nước,\\nthì sẽ có nguy cơ bị lật thuyền. Ạ.」"
2034 = "「Vâng. Ạ……」"
2036 = "「Vâng. Nhờ vậy mà khói đã hướng lên trên——\\nnhưng bị kẹp giữa tốc độ tàu và gió trên cao, nó đã bò dọc theo trần xe ạ.」"
2039 = "「Vâng, em nghĩ là nằm trong khả năng chế tạo của ông ấy ạ.」"
2041 = "「Vâng. Em cũng nghĩ vậy.\\nNhưng nếu khói đen lại tích tụ trong xe thì……」"
2042 = "「Vâng, chuẩn giờ ạ.\\nAnh Soutetsu càng lúc càng điêu luyện nha~」"
2044 = "「Vâng, thời em được chế tạo thì chưa có đâu ạ,\\nnhưng đến thời các em gái của em thì nó đã phát triển rất nhanh.」"
2050 = "「Sự hiện diện của cái bếp lò sưởi thật sự rất nổi bật.」"
2052 = "「Thú vị hay không thì chưa biết, nhưng có một thứ rất tinh tế đấy ạ.」"
2054 = "「Về chuyện đó——chúng ta có biện pháp này ạ.」"
2055 = "「Đúng thật…… nhỉ.」"
2056 = "「Không đâu…… thật bất ngờ——nếu là tuyến đường không có hầm này,\\nthì đó có thể là một phương án hay đấy ạ.」"
2058 = "「Bình thường chỗ của phụ lái đã hẹp sẵn rồi,\\nnếu bị khói đặc bao trùm thì sẽ chẳng thấy gì luôn á.」"
2062 = "「Đúng vậy ạ. Cả \\x%l8620;#00ffc040;8620%l;#; và \\x%lストーブ客車;#00ffc040;toa xe sưởi ấm%l;#;,\\nđều được trang bị ống khói dùng để xả khí ạ.」"
2064 = "「Có lẽ là vậy ạ.\\nNgoài ống khói ra thì không thể nghĩ ra đường nào khác để khói lọt vào được.」"
2067 = "「Ví dụ như, tạm thời tháo bếp lò sưởi ra,\\nrồi bịt kín lối ra của ống khói thì sao?」"
2070 = "「Không sao, cũng đến lúc rồi.\\nVừa trải qua sự cố, tất cả chúng ta đều đang mệt mỏi mà.」"
2071 = "「Đúng vậy đó nha~? Trông Reina thế này thôi chứ\\nkhỏe lắm đó ạ~」"
2076 = "「Chị Paulette, cái này.」"
2077 = "「Đây, Paulette, quạt và đá viên nha~」"
2080 = "「Chuẩn bị càng kỹ càng tốt mà.\\nChụp xong tôi sẽ quay lại làm việc ngay.」"
2090 = "「Để tôi gom ảnh lại rồi lát nữa mọi người cùng xem nhé.」"
2094 = "「Khói do cháy không hoàn toàn——đúng vậy ạ, nó rất nặng nên……\\ndù dùng quạt máy cũng không đuổi ra được, có khi còn bị tích tụ lại.」"
2096 = "「Reina sẽ cố gắng hết sức nha~!」"
2099 = "「Đây là lần đầu tiên Reina thấy \\x%lストーブ客車;#00ffc040;toa xe sưởi ấm%l;#; đó nha~」"
2103 = "「Reina! Đóng cửa sổ lại và giữ tư thế an toàn!\\nSau đó \\x%l共感;#00ffc040;cộng cảm%l;#;! Yêu cầu dừng khẩn cấp!」"
2106 = "「Reina, sao rồi?」"
2111 = "「Chị ngạc nhiên vì em hiểu nhanh thế đấy.\\nĐúng là \\x%l運転士;#00ffc040;người lái%l;#; thuyền có khác nha.」"
2113 = "「Tình trạng cháy không hoàn toàn xảy ra, khói làm cản trở tầm nhìn nghiêm trọng,\\nnên chúng em đã tăng công suất để kích hoạt \\x%lカマ;#00ffc040;lò hơi%l;#; ạ.」"
2119 = "「Thấy thì có thấy, nhưng không được thong thả ngắm như vầy đâu.\\nLúc làm nhiệm vụ mà có khói thì chỉ tổ vướng víu và nguy hiểm thôi á.」"
2121 = "「Xin lỗi em nhé.\\nTôi không bao giờ ngờ tới chuyện này lại xảy ra.」"
2123 = "「Thật là thú vị nha~.\\nA! ——Này, Paulette, nhìn kìa~」"
2126 = "「Những lúc như thế, khói cũng sẽ tràn vào bên cạnh \\x%l運転台;#00ffc040;buồng lái%l;#;,\\ncứ như bị bịt mắt luôn á.」"
2134 = "「Cửa sổ……」"
2137 = "「Đã đóng cửa sổ——Tư thế an toàn đã sẵn sàng!\\n\\x%l共感;#00ffc040;Cộng cảm%l;#; với Hachiroku——Yêu cầu dừng khẩn cấp!!」"
2143 = "「Gì cơ! Thế thì——」"
2145 = "「Khoan, đợi đã anh hai——anh trai.\\nCái vụ…… chảy ngược đó——có thể xảy ra sao?」"
2146 = "「Cuối cùng cũng đến lúc rồi nhỉ.」"
2147 = "「Cho xem với á!」"
2148 = "「Của hai em đây. Fukami, cả Nagi nữa.\\nCó đủ cho mọi người đấy.」"
2149 = "「Dù sao thì, trước tiên cứ từ từ nghỉ ngơi để lấy lại tinh thần đã.\\nĐặc biệt là Fukami, đừng cố quá nhé. Có chuyện gì thì gọi tôi ngay.」"
2153 = "「Đáng tin cậy thật đấy. Nhờ cả vào hai người.」"
2154 = "「Xem gì á, bên ngoài chứ đâu? Ngoài cửa sổ á.」"
2157 = "「Bịt mắt á…… nghe nguy hiểm quá.」"
2159 = "「SL cũng thú vị phết á!」"
2165 = "「Chuyện đó thì chúng tôi cũng vậy mà?\\nKéo hai toa hay ba toa thì cũng không khác nhau là mấy đâu.」"
2166 = "「Làm gì có chuyện đó!」"
2167 = "「Là thế này nha~. Dù đây là lần đầu tiên kéo \\x%l客車;#00ffc040;toa hành khách%l;#;,\\nnhưng anh ấy đã khởi hành đúng giờ mà không hề gây ra rung lắc nào đó ạ~」"
2174 = "「Đâu phải nhờ tôi——chút nào đâu.」"
2175 = "「Nhờ có anh Soutetsu,\\nmà chúng ta mới có được một \\x%l客車;#00ffc040;toa hành khách%l;#; tuyệt vời thế này nha~」"
2177 = "「Người bình thường, không được đi——chuyến chạy thử này. Em được đi.\\nLà vì, em nghĩ, chúng ta là đồng đội. Cho nên.」"
2178 = "「À, quan trọng hơn là——ừm,\\nNagi, cậu đang xem gì thế? Chăm chú vậy.」"
2179 = "「Dạ——lúc nãy——ừm, lúc tàu vừa khởi hành,\\nmới nhích đi một chút xíu mà hai chị đã bảo là 'Chuẩn giờ' ấy ạ.」"
2180 = "「À này…… anh Soutetsu.」"
2181 = "「Đúng vậy, xin lỗi em.」"
2182 = "「Đúng rồi nhỉ. Vậy thì tôi cũng,\\nsẽ không cố quá mà nghỉ ngơi cho hôm nay vậy.」"
2184 = "「Không phải ai đâu, cái đó——ừm——」"
2185 = "「Xin hãy coi hộp màu xanh phía trước là \\x%l8620;#00ffc040;8620%l;#;.\\nHộp màu đỏ phía sau là \\x%lストーブ客車;#00ffc040;toa xe sưởi ấm%l;#; ạ.」"
2187 = "「Cảm ơn——cảm, cảm ơn chị. Ạ……」"
2188 = "「Cảm ơn chị á.」"
2219 = "「Ừm…… tớ, vừa nãy——\\ncó lỡ nói ra tiếng không?」"
2220 = "「Chuyện đó, đã thành công mà nhỉ?」"
2221 = "「Về khoản đó thì đã có Hachiroku hỗ trợ rồi.\\nNên hai toa hay ba toa thì những việc tôi phải làm cũng không khác nhau là mấy.」"
2222 = "「Thế này rốt cuộc là sao á?\\nTại sao khói lại bay vào trong \\x%l客車;#00ffc040;toa hành khách%l;#; được á?」"
2224 = "「Cũng cần phải xác nhận xem\\ncấu trúc của bếp lò sưởi có dễ tháo ra không nữa ạ.」"
2225 = "「Như vậy ổn chứ, Paulette.」"
2226 = "「Mặt dưới của \\x%l客車;#00ffc040;toa hành khách%l;#; này, thú vị đến thế sao?」"
2228 = "「Thử nghiệm \\x%l客車;#00ffc040;toa hành khách%l;#; dù là người nhà thì cũng là chở người mà,\\nkhông được lơ là đâu đấy nha.」"
2230 = "「Làm thế này để đốt lửa trong \\x%lカマ;#00ffc040;lò hơi%l;#; cháy rực lên,\\ngiải quyết tình trạng cháy không hoàn toàn đó á!」"
2232 = "「Nếu vậy——nếu vậy! Em cũng, có trách nhiệm. Ạ.\\nNếu không thì, em sẽ bị ra rìa——buồn lắm. Ạ.」"
2234 = "「Thấy hai người lâu quá nên em mới đi gọi đấy.」"
2235 = "「Còn một phút nữa.」"
2236 = "「Có thứ tiện lợi như vậy luôn á?」"
2237 = "「Chưa——là góc nào cơ?」"
2239 = "「Trời mưa thì tính sao á?」"
2241 = "「Thứ đó, có thể lắp lên 8620 được không?」"
2242 = "「Vậy thì——\\nCách khác, là……」"
2244 = "「Vậy ngược lại, có lúc nào được phép mở cửa sổ không ạ?」"
2246 = "「Lúc đó——ừm, tại sao, chỉ mới nhích đi một chút. Mà hai chị.\\nLại biết là——anh Soutetsu. Lái giỏi. Vậy ạ?」"
2249 = "「Tất nhiên là sẽ chụp rồi.\\nNhưng mà, tấm này cũng là tấm nên chụp mà.」"
2250 = "「Nếu vậy thì đúng thật.\\nSẽ rất dễ dàng để lắp quạt máy đấy.」"
2251 = "「Nayuta là ai á?」"
2253 = "「Những viên nam châm đó là ống khói sao?」"
2256 = "「Thế, tính sao đây? Cứ để tự nhiên à?\\nHay là chụp kiểu ảnh lưu niệm?」"
2258 = "「Nếu khói trở nên đen và đặc,\\nthì nó sẽ bay vào từ cửa sổ mất thôi?」"
2259 = "「Thế, sao rồi. Hachiroku.」"
2261 = "「Đối phương là khói mà.\\nNếu không hàn kín lại thì e là……」"
2263 = "「Anh hai, Hachiroku. Chúng ta cũng về thôi.」"
2270 = "「Tôi bảo Fukami là 'đặc biệt' đừng cố quá——rồi mà?\\nTôi cũng không muốn những người khác phải cố sức đâu.」"
2271 = "「Anh Soutetsu, dạ——\\nCảm ơn anh hôm nay đã cho em đi cùng ạ……」"
2272 = "「Ngài Soutetsu. Ngài đã chụp đủ ảnh chưa ạ?」"
2276 = "「Dù là quạt máy cũng không đủ sức sao.」"
2277 = "「Quạt máy?」"
2278 = "「Tinh tế——là món quà của ngài Aki nhà Mouri sao?」"
2293 = "『「Xuất phát! Tiến lên!!」\\n「Xuất phát! Tiến lên!!」』"
2297 = "『「Ồ」\\n「Ái chà」』"
2458 = "Lần lượt trên hộp màu xanh và hộp màu đỏ——à."
2460 = "Dù tôi có quạt cho em ấy bao nhiêu đi chăng nữa,\\nkhuôn mặt em ấy vẫn đỏ bừng, mồ hôi cũng mãi chưa chịu ráo."
2462 = "Nên cũng đỡ phần nào."
2483 = "Ra là vậy, em nghĩ thầm."
2490 = "Một \\x%l客車;#00ffc040;toa hành khách%l;#; hiếm hoi lại được bảo dưỡng tốt.\\nChúng tôi gần như nhận được nó miễn phí, nên chẳng có lý do gì để phàn nàn cả."
2493 = "Nhìn đồng hồ mới nhận ra,\\nchưa gì đã còn chưa đầy mười phút nữa là đến giờ khởi hành."
2496 = "Để thay thế, họ đang lên kế hoạch khẩn cấp xây thêm\\nmột tuyến đường sắt để quay đầu gọi là \\x%l三角線;#00ffc040;đường tam giác%l;#;, nhưng——"
2508 = "Hai cuốn sách khổ nhỏ."
2509 = "Mắt tôi chỉ dán chặt vào đèn tín hiệu."
2512 = "Cả Hachiroku, Paulette, và ngay cả Hibiki\\ncũng đều bất lực cúi gầm mặt xuống."
2514 = "Hachiroku là búp bê, còn chị Hibiki là em gái.\\nVậy nên…… biết đâu, có lẽ nào——"
2516 = "Hachiroku mỉm cười đầy ẩn ý, \"Ufufu\"."
2518 = "Cô ấy tỏ vẻ ngạc nhiên khi bị chụp,\\nrồi bắt đầu dùng ngón tay nghịch phần đuôi tóc."
2520 = "Hachiroku dựng chúng lên ở phía trước bên trái và bên phải của chiếc hộp màu xanh,\\ntrông như những tấm che mắt."
2522 = "Một tờ khăn giấy được rút ra,\\ntừ phần ống khói của chiếc hộp màu xanh, lập tức rũ xuống và trôi sang ngang."
2524 = "Hachiroku bỗng nói nhanh hơn một chút."
2526 = "Giọng của Hachiroku vẫn như mọi khi.\\nĐược tiếp thêm sức mạnh từ đó, cơ thể tôi cũng chuyển động một cách quen thuộc."
2529 = "Nói xong, Hachiroku cau mày."
2530 = "Vừa nói, Hachiroku vừa mang theo một hộp khăn giấy."
2533 = "Gió lạnh lùa vào,\\ncảm giác như cổ họng được thông suốt."
2550 = "Nagi, Fukami, cùng với Reina và Paulette.\\nCác thành viên bên phía \\x%l客車;#00ffc040;toa hành khách%l;#; của chuyến chạy thử đều đã có mặt đông đủ."
2553 = "Từ cửa sổ, một cánh tay vẫy nhiệt tình."
2554 = "Nagi lập tức chạy vọt tới,\\nđỡ Fukami đứng lên rồi cẩn thận để em ấy ngồi lại xuống ghế."
2559 = "Không được, em định nói vậy——\\nMở cửa sổ ra thì——em nghĩ vậy, nhưng mà——"
2562 = "Rung lắc, dữ dội quá.\\nPhanh \\x%l非常;#00ffc040;khẩn cấp%l;#;, lại giật mạnh đến thế này sao——"
2569 = "Dù chỉ nhìn vào đèn tín hiệu,\\nnhưng tận sâu trong cơ thể, tôi vẫn cảm nhận được từng nhịp thời gian trên đồng hồ của Hachiroku."
2577 = "Chỉ nghe thôi mà ngực em cũng thắt lại đau đớn,\\nvà em bắt đầu cảm thấy ngày càng sợ hãi."
2580 = "Nếu chỉ có một đầu máy thì có thể quay về bằng cách lùi đơn giản——tức là chạy lùi,\\nnhưng nghe nói việc đẩy \\x%l客車;#00ffc040;toa hành khách%l;#; để lùi lại sẽ gây ra gánh nặng rất lớn."
2584 = "Chỉ khi nào đốt lò sưởi,\\nthì ống khói của \\x%l客車;#00ffc040;toa hành khách%l;#; mới nhả khói ra thôi——"
2587 = "Nhưng mà——em lại không hiểu lý do vì sao,\\nthật bực bội với bản thân vì chẳng biết gì về đường sắt cả."
2592 = "Đây là lần đầu tiên em nói chuyện đàng hoàng thế này,\\nem thấy chị Paulette, thực sự, là một người rất tốt."
2595 = "Oa——chị Paulette,\\ncũng có lúc cười tươi rói thế này cơ đấy."
2597 = "A——đồng hồ của chị Paulette, xịn quá.\\nMột chiếc đồng hồ bỏ túi màu vàng, rất đẹp——à không, ừm."
2598 = "A, lại nói lắp bắp rồi."
2601 = "À, thế này là đẹp rồi.\\nCứ chụp tự nhiên không cần dàn xếp gì cả là tốt nhất."
2604 = "Em cứ tưởng chị ấy là người có chức vụ cao nên sẽ hơi đáng sợ,\\nai dè lại thấy dễ thương cực kỳ luôn."
2605 = "Thấy em ấy không chịu nhìn vào mắt mình, tôi cứ tưởng em ấy giận lắm,\\nnhưng có vẻ không phải vậy."
2607 = "Xếp vài chiếc ghế lại thành giường, gối đầu lên đùi tôi,\\nFukami đang nằm nghỉ."
2609 = "Tôi đã thử phun rất nhiều khói và nước vào,\\nvà xác nhận trong kho đầu máy là chúng không lọt vào trong."
2611 = "Ngay khoảnh khắc Paulette định cúi đầu xin lỗi,\\nFukami bật dậy."
2617 = "Khó thở, quá.\\nKhói——cực kỳ, ngột ngạt——"
2618 = "Vậy là, những chuyện kỳ quặc……\\nchắc em chưa lỡ nói ra tiếng đâu——nhỉ?"
2621 = "Biết đâu, có lẽ nào, với xác suất một phần nghìn, một phần vạn——\\nhay một phần Hằng Hà Sa số……"
2622 = "Như cá gặp nước."
2628 = "Cuối cùng tôi cũng đã thực sự hiểu được ý nghĩa\\ncâu nói đùa \"Toa xe rất hợp với hai người\" của ngài Aki."
2637 = "Nghe tôi nói với giọng điệu hơi trêu chọc,\\nPaulette cũng gõ nhẹ lên đầu mình và đáp lại một cách hóm hỉnh."
2639 = "Cậu ấy kéo dãn áo ra,\\nrồi phành phạch quạt gió vào trong."
2641 = "Nagi nhận lấy đá và quạt rồi——oa!"
2643 = "Như thể trước mặt đang có khói,\\nNagi phẩy phẩy tay."
2645 = "Má Nagi, đỏ ửng và bẹt ra.\\nCó vẻ như cậu ấy đã áp chặt mặt vào cửa sổ."
2646 = "Nagi chạy đến, vỗ lưng cho em, nhưng mà——\\nCái này, khói…… nếu không hết thì——"
2649 = "Cậu ấy thở phào nhẹ nhõm rồi ngã khuỵu xuống."
2656 = "Vừa thở phào nhẹ nhõm một chút, thì nghe thấy tiếng 'xì, xì',\\nâm thanh của \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; vọng vào từ ngoài cửa sổ."
2659 = "——Căng thẳng quá hay lỏng lẻo quá đều không tốt."
2661 = "Lộ ra một chút áo ngực,\\nrãnh ngực cũng hiện rõ mồn một——thật đáng ghen tị."
2662 = "Nếu chụp từ đó, thì tất nhiên là……"
2671 = "Tuy ở Kyushu, nhưng Ohito lại là nơi có tuyết rơi vào mùa đông.\\nĐến lúc đó, chắc chắn cái bếp lò sưởi này sẽ phát huy tác dụng."
2679 = "Nếu tình hình là như vậy,\\nthì phải tìm cách giải quyết——nhưng mà…………"
2682 = "Tôi không kìm được mà lấy lại chiếc máy ảnh vừa cất đi.\\n\\x%l列車;#00ffc040;Tàu%l;#;——tôi thực sự cảm thấy cái tên này thật chí lý."
2685 = "Tôi chăm chú nhìn. Cố ý nhìn cho kỹ.\\nCó lẽ đây là lần đầu tiên kể từ vụ tai nạn đó, tôi tự nguyện nhìn thẳng vào nó."
2690 = "Vì đảm nhận những khu vực khác nhau, nên hôm nay tôi chưa chụp tấm nào cả."
2691 = "Nếu muốn chụp ảnh lưu niệm cho đội của chúng tôi,\\nthì tốt nhất là chụp ở \\x%l運転台;#00ffc040;buồng lái%l;#; sau khi chạy thử nghiệm thành công."
2694 = "Tôi kiểm tra lại sắc mặt của Fukami một lần nữa."
2696 = "Cả em và Nagi bình thường,\\nđều đi học bằng cách bắt tuyến Yui này đến Yui."
2697 = "Tôi và Hibiki thì dọn dẹp \\x%l火床;#00ffc040;buồng lửa%l;#; và kiểm tra đồng hồ trên \\x%l運転台;#00ffc040;buồng lái%l;#;.\\nHachiroku thì kiểm tra các bộ phận của hệ thống truyền động."
2701 = "Tôi nhận lại máy ảnh từ Hachiroku,\\nrồi cất vào túi đồng phục."
2702 = "Ánh mắt của Reina khi nhìn quanh toa xe đã cuốn hút tôi——\\nvà tôi thành thật cảm thấy \"Thật là đẹp\"."
2705 = "Mình thì chỉ được mỗi cái cao……\\nvậy mà vẫn chưa cần dùng đến áo ngực……"
2706 = "Cảm giác như tôi đã có thể cư xử bình tĩnh\\nmà không bị những ký ức về vụ tai nạn làm lay động."
2707 = "Anh Soutetsu——chắc chắn,\\nsẽ trở thành thư ký của chị Paulette, em đã nghĩ như vậy."
2711 = "Tôi cất máy ảnh vào túi."
2712 = "Cho nên…… à, em hiểu rồi——có lẽ vậy."
2713 = "Nên em đoán họ đang tăng tốc để sử dụng nhiều hơi nước,\\ntừ đó kích thích tạo ra nhiều hơi nước hơn."
2715 = "Cho nên, em. Lúc đó.\\nSau khi phục hồi \\x%l8620;#00ffc040;8620%l;#;, lúc mọi người bàn bạc xem nên làm gì tiếp theo."
2720 = "Do đó, chúng tôi nối thành \\x%l8620;#00ffc040;8620%l;#;-\\x%l客車;#00ffc040;toa hành khách%l;#;-\\x%lキハ07;#00ffc040;KiHa 07%l;#;, và lúc quay về ga Ohito,\\nsẽ nhờ \\x%lキハ07;#00ffc040;KiHa 07%l;#; kéo."
2726 = "Nếu bịt kín lối vào của ống khói, tức là hai đầu của chữ T——\\nĐề xuất đó, tuy nhiên, đã bị chặn lại từ trong trứng nước."
2732 = "Phải xếp thành hàng, kết nối với nhau, thì mới thành \"\\x%l列車;#00ffc040;Tàu%l;#;\"."
2741 = "Em cũng bắt chước kéo áo ra, rồi phành, phạch, phành, phạch.\\nOa——đúng thật này. Mát quá đi mất!"
2750 = "Hibiki chạy chậm lại gần."
2752 = "Từ trong bếp lò sưởi, rõ ràng không đốt gì cả,\\nnhưng khói trắng cứ cuồn cuộn cuồn cuộn bốc, ra………… sao?"
2753 = "Không biết có phải do ảo giác không——\\nnhưng trong một thoáng, tôi thấy Hachiroku như khẽ rùng mình, rồi mỉm cười gượng gạo."
2757 = "Trong kỳ nghỉ hè,\\nđúng là không có nhiều cơ hội đi tàu lắm, nhưng——"
2764 = "Nhờ hai chị vừa giải thích vừa dùng tay minh họa,\\nnên em rất dễ hiểu."
2767 = "Đen hơn em tưởng, cứ như mây mưa kéo đến gần vậy——\\nA! Em hiểu rồi. Cái gọi là \"khói bay thấp\" lúc nãy."
2772 = "Luồng khí, tốc độ, và tính chất của khói——\\nCó lẽ những yếu tố đó đã kết hợp với nhau một cách kỳ lạ."
2790 = "Chị Paulette cũng bắt chước Nagi,\\ncởi bớt cúc áo sơ mi rồi phành phạch quạt gió."
2791 = "Chị Paulette và bé Reina\\nvội vã chạy đến bên bếp lò sưởi!"
2792 = "Chị Paulette rất dịu dàng và dễ nói chuyện……\\nVới bầu không khí này, chắc em có thể mạnh dạn hỏi thử xem sao."
2793 = "Chị Paulette, đang mỉm cười\\nnhìn về phía chúng em."
2794 = "Chị Paulette liếc nhìn bé Reina một cái.\\nRồi mỉm cười gật đầu nhẹ nhàng."
2795 = "Lời của Paulette nhắc nhở tôi phải tập trung lại, nhưng lúc này,\\nđể giải tỏa sự căng thẳng của Fukami, tôi vẫn cố gắng mỉm cười hết mức có thể."
2796 = "Paulette ôm nhẹ lấy đầu Fukami,\\nvà em ấy thở ra một hơi dài \"Haaaa\"."
2801 = "Fukami cũng chỉ biết lắc đầu với vẻ đầy hối lỗi.\\nNếu vậy thì Reina——ơ…… à."
2803 = "Nhìn kiểu gì cũng thấy Fukami đang gồng mình hết cỡ,\\nnhưng có Nagi ở cùng, chắc em ấy sẽ sớm trở lại là Fukami bình thường thôi."
2805 = "Fukami cuống cuồng thu người lại\\nrồi bắt đầu lục lọi cái túi nhỏ."
2807 = "Sự ửng đỏ trên khuôn mặt em ấy dần nhạt đi, hơi thở gấp gáp cũng đều đặn trở lại.\\n……Có vẻ như em ấy đã bình tĩnh lại rồi."
2810 = "Ở ga Yui không có \\x%l転車台;#00ffc040;bàn quay đầu máy%l;#;."
2812 = "Để mọi người có thể yên tâm nghỉ ngơi, tôi cố gắng giữ thẳng lưng\\nvà rời khỏi cửa hàng đường sắt."
2813 = "Sao em không thể nói chuyện trôi chảy như lúc nói chuyện với Nagi chứ,\\nthật đáng ghét."
2814 = "Em muốn thở, muốn được dễ chịu hơn,\\nnên hướng về phía có gió, phía mát mẻ——"
2820 = "Không nói nên lời, em hít thở sâu——\\nBàn tay Nagi vẫn đang vỗ nhè nhẹ vào lưng em."
2831 = "Khói cuồn cuộn bay qua ngoài cửa sổ.\\nGần và rõ hơn lúc nãy rất nhiều."
2834 = "Khói, cứ cuồn cuộn,\\nlan ra từ bếp lò sưởi, tràn đến tận chỗ này——"
2835 = "Một khi luồng khói đã chui vào ống khói,\\nnó sẽ tiến thẳng vào bên trong \\x%l客車;#00ffc040;toa hành khách%l;#; mà không gặp bất kỳ trở ngại nào."
2837 = "Khói bay thấp là sao nhỉ, em vẫn chưa hiểu lắm.\\nNhưng em nghĩ chuyện này không hiểu cũng chẳng sao."
2842 = "Bé Reina cười tươi rạng rỡ gật đầu với em."
2844 = "Từ trong chiếc túi treo ở móc áo cạnh khung cửa sổ,\\nnhững chiếc quạt và túi nilon đựng đá viên được lấy ra."
2845 = "Nếu điều đó bị coi là chà đạp lên lòng tốt của ngài Aki,\\nthì tất nhiên, đó không phải là ý định của tôi."
2846 = "Có lẽ đã bỏ sót điểm này,\\nHachiroku lộ vẻ mặt \"Thôi chết\"."
2860 = "Nhìn dáng vẻ oai phong lẫm liệt của \\x%l8620;#00ffc040;8620%l;#; khi kéo theo \\x%l客車;#00ffc040;toa hành khách%l;#;,\\ntôi lại càng thấm thía điều đó."
2862 = "Trông thì mát thật đấy,\\nnhưng mà bụng, phơi hết ra ngoài rồi kìa——"
2868 = "Đúng thật.\\nKhói đã trắng hơn, có vẻ nhẹ hơn nên đang dần bay lên cao."
2870 = "Là do tôi đã quen dần với đường sắt,\\nhay là vì có mọi người ở bên cạnh……"
2871 = "Nói xong, Fukami ho sặc sụa.\\nTôi vội vàng vỗ nhẹ và đỡ lấy lưng em ấy, mồ hôi đã làm ướt đẫm cả áo."
2882 = "Quả thật, nhìn ra ngoài cửa sổ có thể thấy khói đang bay.\\nNhưng mà, nếu là SL thì lúc nào chẳng có khói bay——"
2886 = "Tờ khăn giấy thứ hai trượt dọc theo bề mặt hộp,\\ntiến thẳng từ trên hộp màu xanh về phía ống khói của hộp màu đỏ."
2888 = "À, không, phải rồi.\\nĐể giúp em ấy bớt căng thẳng——"
2890 = "Tiếng đường ray, tiếng bánh xe——nghe như tiếng la hét vậy."
2894 = "Còn Reina thì…… vừa quay sang đã bắt gặp ánh mắt cô bé,\\nvà nhận được một nụ cười hiền hòa, rạng rỡ."
2896 = "Bé Reina,\\ncười tươi rạng rỡ, bắt đầu giải thích cho em hiểu."
2898 = "Hachiroku cúi sát vào màn hình LCD phía sau,\\nnhanh nhẹn kiểm tra loạt ảnh vừa chụp hôm nay."
2901 = "Nghe Nagi nói có vẻ thích thú,\\nem cảm thấy hơi kỳ lạ."
2902 = "Nghe tiếng Fukami, tôi đưa mắt nhìn lại,\\nthấy mọi người đều đang háo hức nhìn về phía này."
2903 = "Nghe gọi, em nhìn thử, và…… giật mình."
2904 = "Qua lời Nagi, em hiểu ra \"khói đặc\" đeo bám dai dẳng đó\\nchính là khói do cháy không hoàn toàn."
2908 = "Đôi má em ấy ửng hồng khỏe mạnh,\\nnhìn bề ngoài thì có vẻ không sao, nhưng——"
2914 = "Trái ngược với vẻ tự tin tràn đầy của Reina và Paulette,\\nFukami lại tỏ ra bất an như cá nằm trên thớt."
2916 = "Nếu thiếu đi dù chỉ một chút sức lực của bất kỳ ai,\\nthì mọi chuyện đã chẳng thể diễn ra suôn sẻ đến thế này."
2918 = "Nếu không thì,\\ntôi đã chẳng thể cầm máy ảnh đi dạo quanh thế này. Nhưng——"
2925 = "Bị kéo lại, đẩy ngã, rồi bị đè chặt từ phía trên!"
2931 = "Nếu không được chị Paulette kéo ngã và giữ chặt,\\nem chắc chắn, đã bị ngã——và chắc chắn, đã bị thương."
2933 = "Ngực bự như chị Paulette mà còn làm vậy được,\\nthì mình có gì mà phải xấu hổ cơ chứ."
2941 = "Hầm đường sắt gì đó, dù có đi tàu……\\nthì em cũng chẳng để ý đến số lượng, hay thậm chí là có hay không nữa."
2947 = "Mồ hôi vã ra như tắm."
2954 = "Nấp sau bóng Fukami đang mải mê chỉnh tóc,\\nPaulette cũng lén lút lấy hộp phấn trang điểm ra soi."
2955 = "Không còn nhìn thấy khói từ cửa sổ nữa cũng hơi tiếc,\\nnhưng nếu điều này giúp lái tàu an toàn hơn thì tốt quá rồi."
2956 = "Tôi quay lại sân ga mà không ngoảnh lại,\\nđi ra xa một chút rồi thở hắt ra."
2967 = "Em cứ tự hỏi tại sao, thấy thật khó hiểu. Rất khó hiểu.\\nEm, đã suy nghĩ rất nhiều."
2968 = "Bầu không khí hoài niệm và mùi gỗ của \\x%l客車;#00ffc040;toa hành khách%l;#; này,\\ngiúp tôi không bị cạy vảy những ký ức cũ kỹ."
2970 = "Rồi im bặt.\\nĐột nhiên, mọi thứ trở nên tĩnh lặng."
2971 = "Vật đang chuyển động sẽ tiếp tục chuyển động,\\ncòn vật đang đứng yên sẽ tiếp tục đứng yên."
2972 = "Việc được khen ngợi, em vẫn chưa quen, cũng không giỏi ứng phó……\\nNhưng mà, quả nhiên là vẫn thấy vui."
2973 = "Vẫn còn dư gần hai mươi phút,\\nvà tôi cũng đã kiểm tra kỹ lưỡng phần việc của mình rồi."
2974 = "Vừa nói vậy, trong thâm tâm tôi,\\nđã loại bỏ hoàn toàn mọi phương án liên quan đến việc bịt kín ống khói."
2976 = "Nơi nền nhà kho đầu máy được đào sâu xuống\\nđể tiện cho việc kiểm tra bảo dưỡng từ ngay bên dưới——"
2978 = "Đã chụp nhiều như vậy rồi mà,\\ncó vẻ Hachiroku vẫn chưa quen với tiếng màn trập."
2979 = "Nếu là một \\x%l客車;#00ffc040;toa hành khách%l;#; có thể dùng được quạt máy,\\nthì không gì phù hợp và đáng quý hơn cho mùa hè ở Ohito."
2989 = "Rồi ngay sau đó,\\nNagi bật dậy như lò xo."
2990 = "Cạch, cạch,\\nLần này là những viên nam châm tròn được đặt lên."
2991 = "Một hộp, hai hộp.\\nCô ấy xếp chúng nằm dọc trên bàn."
2992 = "Nghe Hachiroku nói vậy,\\nPaulette cũng khẽ gật đầu."
2993 = "Dù chưa quen với việc bị chụp,\\nnhưng có vẻ cô ấy đã quen với thao tác xem lại ảnh rồi."
2994 = "Dù đã cố gắng không bước vào bên trong \\x%l客車;#00ffc040;toa hành khách%l;#;,\\nnhưng bị gọi đích danh một cách ngây thơ như vậy thì cũng không thể làm lơ được."
3004 = "Là nhờ Paulette, Hachiroku, Hibiki.\\nVà có lẽ là cả Reina, Nagi, Fukami, cùng với chị Mayami nữa."
3008 = "Người run lên là tôi mới đúng.\\nKhông phải vì sợ hãi, mà là vì phấn khích."
3010 = "Kéo một hồi \\x%l汽笛;#00ffc040;còi hơi nước%l;#;,\\ntôi dồn lực kéo tay gạt \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;#;!"
3014 = "（——Vù）"
3031 = "（Vừa tốt bụng, vừa là thị trưởng, lại là giám đốc……\\nLại còn xinh đẹp, dáng chuẩn nữa chứ……）"
3037 = "（Vậy mà…… anh Soutetsu lại quyết tâm làm \\x%l運転士;#00ffc040;người lái tàu%l;#;,\\nvà từ chối lời mời của chị Paulette.）"
3042 = "（Kịch!!）"
3043 = "（Soạt）"
3044 = "（A…… áo ngực.）"
3045 = "(Phành phạch…… phành phạch……)"
3046 = "（Tách）"
3047 = "（Tuuuuuuu!）"
3048 = "（……Bình tĩnh hơn mình nghĩ.）"
3051 = "（Quan trọng hơn là——chuyện lúc nãy——）"
3052 = "（Anh Soutetsu……\\nCó thể, đã có người trong mộng rồi…… cũng nên.）"

