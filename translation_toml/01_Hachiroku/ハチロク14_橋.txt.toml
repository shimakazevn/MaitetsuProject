1854 = "「Cảm ơn cậu. Vì đã cứu con gái tôi.」"
1855 = "「Quá nguy hiểm ạ! Một con người bằng xương bằng thịt sao có thể」"
1856 = "「Cây cầu của ngày hôm đó. Anh và em——」"
1867 = "「Không thể——đâu ạ—— Duy trì, việc lái tàu, các thứ——」"
1876 = "「Chuyện đó thì em đừng lo. Không chỉ có Hibiki, mà còn có cả Kisaki và Fukami nữa.」"
1877 = "「Có lẽ, đây chính là. Cuộc sống của một con người. Một cuộc sống khao khát được sống, và luôn muốn tiến về phía trước」"
1878 = "「Cái gì thế này.」"
1879 = "「Đó là điều tất nhiên rồi ạ, nhưng——」"
1880 = "「Michi——đã trao cho tôi, sinh mệnh này.」"
1881 = "「Lần này——đôi tay này—— Lần này chắc chắn——tuyệt đối, sẽ không buông tay đâu!」"
1882 = "「Đó là nhờ em đấy, Hachiroku.」"
1883 = "「Cả đồ ăn cứu trợ nữa——」"
1887 = "「Sinh mệnh đã giúp tôi——được gặp gỡ Hachiroku.」"
1890 = "「Sau vụ tai nạn đó, cho đến trước khi gặp em—— anh cũng chỉ là một tồn tại hoạt động nhằm hoàn thành mục đích của ai đó mà thôi」"
1891 = "「Vậy thì——bây giờ, ngài Soutetsu……」"
1892 = "「Nếu vậy, Hachiroku. Em là một người phụ nữ」"
1893 = "「Nếu vậy. Thì anh cũng từng là \"đồ vật\" nhỉ」"
1894 = "「Nước lò hơi bị tràn ra ạ. Nó cùng với hơi nước giãn nở ra, thoát ra ống khói với lực rất mạnh, và phun ra ngoài.」"
1898 = "「Mở cửa mở cửa mở cửa mở cửa! Ướt hết rồi ướt hết rồi ướt hết rồi!」"
1899 = "「Giới hạn 60.」"
1900 = "「Đúng là vậy. Nhưng anh muốn nhiều hơn thế. Anh——Anh——」"
1901 = "「Ngài Soutetsu」"
1902 = "「Ngài Soutetsu……——」"
1903 = "「Ngài Soutetsu. Không sao đâu ạ! Sẽ hết ngay thôi!」"
1904 = "「Ngài Soutetsu. Ngài đã vất vả rồi ạ」"
1905 = "「Ngài Soutetsu!?」"
1910 = "「!」"
1911 = "「!!!」"
1912 = "「!!?」"
1914 = "「!!? Ngài Soutetsu, xin hãy đổi chỗ cho em! Em sẽ」"
1915 = "「!?」"
1920 = "『\"Cảm ơn, và xin lỗi.\"\\n\"Cảm ơn, và xin lỗi.\"』"
1924 = "「!」\\n「!」"
2120 = "——Chỉ vì nghĩ sắp đến nơi rồi nên tôi đã chủ quan. Giờ tôi mới nhận ra sự nông nổi của bản thân."
2122 = "Thay vào khoảng trống đó là một cảm giác lâng lâng, pha trộn giữa sự mệt mỏi, uể oải và cả cảm giác thành tựu."
2123 = "Sau một tiếng \\x%l喚呼;#00ffc040;hô xác nhận%l;#;, tôi vặn mạnh van, Phụt! Hơi nước bị đẩy ra khỏi ống khói."
2128 = "Rồi cuối cùng. Tiếng động lạ cũng biến mất."
2131 = "Không chỉ vậy, ông ấy còn đặt cả tay trái lên, bắt tay theo kiểu kẹp chặt và lắc mạnh cánh tay."
2132 = "Không chỉ tôi, mà cả Hibiki, cả Nagi—— Dù ai làm phụ lái tàu đi chăng nữa, thì hiện tượng này cũng chưa từng xảy ra."
2134 = "Không giống như tôi và Michi ngày trước, không phải là hai nửa chia sẻ cùng một cơ thể."
2135 = "Quả không hổ là chị em. Nụ cười của Hibiki và chị Mayami thực sự rất giống nhau."
2137 = "Không phải là \\x%lレイルロオド;#00ffc040;Railord%l;#; và Master. Dù ở gần đến thế này vẫn là chưa đủ."
2140 = "Không phải vì bị ai đó sai bảo, cũng chẳng phải để hoàn thành mục đích nào cả. Chỉ đơn thuần là dục vọng của chính bản thân anh, khao khát mãnh liệt đến thế này."
2142 = "Không phải ai chủ động trước, mà cứ thế diễn ra một cách vô cùng tự nhiên."
2146 = "Lời xin lỗi, hay lời chào tạm biệt."
2148 = "Tôi biết là sẽ truyền đến được. Vì em ấy luôn sẵn sàng lắng nghe. Dù cho Hachiroku có đang sợ hãi co rúm lại đến mức nào đi chăng nữa."
2149 = "Không thể để em ấy đi được. Tôi sẽ không để em ấy đi."
2151 = "Vị trí biển báo, vị trí tín hiệu, vị trí đường ngang, vị trí ga bỏ hoang. Tôi đều nắm rõ——Kinh nghiệm đã thay thế cho tầm nhìn."
2157 = "Có lẽ vì vậy mà Hachiroku, đã nở một nụ cười bao dung và nói với tôi bằng giọng điệu chậm rãi."
2162 = "Một sự thật đơn giản đã chứng minh điều đó. Nếu đó là một lỗi thường gặp, thì càng chứng minh điều đó."
2165 = "Người cha và cô con gái vốn đang ngoảnh mặt đi, lại nhìn nhau cùng một lúc."
2176 = "Những lời lẽ nghiêm khắc, lại vang lên thật dịu dàng."
2178 = "Hai tay buông ra."
2180 = "Cúi gập người. Cúi đầu tạ ơn."
2182 = "Gật đầu mạnh một cái, ông Mototada xoay người, hướng về phía tôi."
2184 = "Nhưng—— Không phải cứ có khí thế là than sẽ cháy theo ý mình."
2186 = "Nhưng chắc chắn, quá khứ đó đã tạo nên hiện tại. Vì có vụ tai nạn đó, nên hai chúng tôi mới ở đây lúc này."
2187 = "Dù vậy, những ngón tay vẫn cử động không chút do dự. \\x%l加減弁;#00ffc040;Van tiết lưu hơi%l;#;. Phanh hãm. Điều khiển bằng đôi bàn tay đan vào nhau."
2189 = "Dù vậy, chúng tôi vẫn nhìn thấy dù không thể thấy. Cây cầu thứ tư trên sông Kuma——cây cầu sắt màu đỏ mỏng manh."
2194 = "Dù vậy tôi vẫn bật dậy ngay lập tức. Hachiroku đang——"
2195 = "Nhưng…… chạy tàu trong điều kiện thời tiết khắc nghiệt gần như không có tầm nhìn thế này, thì ngay cả ban ngày tôi cũng chưa từng trải qua bao giờ——!?"
2197 = "Ánh mắt ngăn cản đó, Nagi hoàn toàn không để tâm."
2200 = "Nhưng, nếu run rẩy, tôi sẽ chết. Vậy thì phải dùng lý trí để khống chế cơ thể."
2206 = "Việc tiến vào sân ga mục nát, có cảm giác chậm hơn mọi khi."
2210 = "Trận mưa trút xuống như tuyết lở, cùng hơi nước cuồn cuộn như mây, làm tán loạn ánh sáng của đèn pha trước."
2211 = "Chỉ điều đó thôi cũng đủ khiến tôi hạnh phúc, dù đang ở gần đến thế, tôi vẫn muốn hiểu thêm về Hachiroku, muốn được đến gần em ấy hơn nữa."
2227 = "Bàn tay ông Mototada hững hờ đặt lên bàn tay chúng tôi đang vươn ra."
2229 = "Một nụ cười và giọng điệu thoáng qua trên khóe môi trong chốc lát, rồi biến mất."
2231 = "Ánh mắt ông Mototada nhìn bao quát ra tận bên ngoài cổng soát vé. Người, người, và người."
2239 = "Ánh mắt ông Mototada tĩnh lặng ngước nhìn cơ thể bằng sắt của \\x%l8620;#00ffc040;8620%l;#;."
2243 = "Cả hai đều lộ vẻ mặt có chút ngượng ngùng—— Một lúc sau, ông Mototada hắng giọng một cách khoa trương."
2244 = "Cả hai cùng mỉm cười."
2247 = "Dù tôi biết rằng, Hachiroku cũng giống như mình."
2250 = "Hachiroku cũng lập tức, lấy chìa khóa cửa \\x%l客車;#00ffc040;toa hành khách%l;#; từ trong túi ra."
2253 = "Vẫn giữ nguyên tư thế lái tàu, vẫn không ngừng quan sát phía trước—— Hachiroku đang khóc nức nở."
2254 = "Hachiroku thậm chí còn ngừng quan sát phía trước, quay lại nhìn tôi và mỉm cười."
2258 = "Tiếng \\x%l喚呼;#00ffc040;hô xác nhận%l;#; rõ ràng của Hachiroku đã tiếp thêm cho tôi sức mạnh mới. Để vượt qua đoạn đường đến ga mỏ than bỏ hoang Jutsusen một cách an toàn——"
2262 = "Ưm, Hachiroku trầm ngâm suy nghĩ. Như mọi khi em ấy vẫn làm."
2263 = "Lời nói của Hachiroku như thể đang tự nhủ với bản thân. Nó cũng dần dần thấm vào trái tim tôi."
2265 = "Hachiroku đã đón nhận tất cả những gì tôi trút lên, và luôn chống đỡ cho tôi."
2268 = "Người đã dạy tôi điều đó chính là Hachiroku."
2272 = "Ưực. Cổ họng Hachiroku chuyển động."
2273 = "Đôi môi Hachiroku run rẩy. Sự run rẩy ấy nhanh chóng lan ra toàn thân, và truyền sang cả cơ thể tôi."
2275 = "Lưng Hachiroku giật thót trong giây lát. Có vẻ như em ấy đang gồng mình, cứng đờ một cách kỳ lạ."
2276 = "Bàn tay Hachiroku đã trả lời thay em. Siết chặt, thật chặt——vòng quanh cơ thể tôi."
2278 = "Đôi mắt Hachiroku đang nhìn tôi. Đang mong chờ một câu trả lời từ tôi."
2282 = "Cơ thể Hachiroku cứng đờ. Bắt đầu run lẩy bẩy vì sợ hãi."
2283 = "Hachiroku vẫn run rẩy không ngừng. Nước mắt đã tuôn rơi như một dòng sông."
2284 = "Câu nói mà Hachiroku thường hay nhắc tới. Và cũng là một sự thật hiển nhiên."
2286 = "Chỉ suy nghĩ trong một thoáng chốc, Hachiroku đưa ra câu trả lời trôi chảy."
2287 = "Khẽ gật đầu. Hachiroku hơi ngẩng cằm lên, nhắm nghiền đôi mắt."
2293 = "Bị gõ một cái rõ kêu."
2294 = "Sắp tiến vào đoạn dốc lên. \\x%l粘着力;#00ffc040;Lực bám đường%l;#;, chắc chắn là không đủ."
2330 = "Lại một âm thanh lạ khác——âm thanh kim loại. Âm thanh va chạm. Giống như tiếng mũi khoan nha khoa đang mài vào răng thép vậy——"
2332 = "Chỉ cần chở hành khách từ ga này đến ga khác. Cứ làm như mọi khi là vấn đề sẽ được giải quyết."
2334 = "Chỉ cần tìm kiếm, sẽ thấy ngay câu trả lời."
2337 = "Chỉ cần có than, lửa và nước, chỉ cần không bị tắt hơi, thì \\x%l8620;#00ffc040;8620%l;#; vẫn có thể tiến lên phía trước trên đường ray."
2347 = "Dù chỉ có hai người, chúng tôi vẫn làm tốt mà."
2353 = "Nuốt trôi thứ gì đó—— Thay vào đó, thốt ra những âm thanh đứt quãng."
2355 = "Nhưng khi về đến ga Ohito rồi, thì dù có hong khô đến mức nào đi nữa. Chắc chắn sẽ bị vắt kiệt sức thêm nữa thôi."
2361 = "Vết thương đã in hằn sẽ không bao giờ biến mất. Cả hiện tại và tương lai, mỗi khi có chuyện gì, nó sẽ lại rỉ máu."
2362 = "Vì sở hữu năng lực không bao giờ mắc lỗi, nên Hachiroku có vẻ đang rất bối rối."
2363 = "Vì chúng tôi biết, chúng tôi có hai người. Vì chúng tôi biết, chúng tôi có thể làm được."
2364 = "Bởi vì cuối cùng tôi cũng đã tin chắc rằng, trạng thái hiện tại của bản thân đang sống động đến nhường nào."
2365 = "Những người lo lắng, tụ tập lại đây, đang tràn ra từ nhà ga và nhìn chúng tôi."
2368 = "Sau vụ tai nạn đó. Từ \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; cho đến những người đồng đội. Từ tất cả những người đã cùng chung sống trong khoảng thời gian đó——"
2371 = "Hầu hết những người có mặt ở đó đều co rúm người lại và nhắm nghiền mắt—— Nhưng, người bị đánh lại không hề nhúc nhích."
2372 = "Cho đến khi bình an trở về ga Ohito, cứ thong thả nghỉ ngơi, sưởi ấm và hong khô người là được."
2374 = "Vì không có phụ lái tàu, tôi phải quay sang xúc than, nên người lái \\x%l8620;#00ffc040;8620%l;#; với tư cách là \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#;, chính là Hachiroku."
2379 = "Khoảnh khắc nhìn thấy điều đó, Nagi cúi gập đầu xuống."
2380 = "Và ở phía bên kia đường ray, gần như chắc chắn là, Hibiki và mọi người đang chờ chúng tôi đến cứu viện."
2394 = "Giọng nói không chút ngập ngừng ấy rơi thõng vào lòng tôi."
2396 = "Một giọng nói như đang thương xót, lại như đang ngập ngừng. Nghe có vẻ gì đó hơi sợ sệt."
2398 = "Chỉ dựa vào kinh nghiệm. Chỉ những gì đã tìm hiểu và tích lũy từ trước đến nay——!?"
2399 = "Cùng lúc với một tiếng kêu nhỏ phát ra, sự căng cứng trên lưng em ấy cũng biến mất."
2402 = "Đôi mắt đẫm lệ đó chắc chắn đang nhìn về quá khứ. Chúng tôi đã luôn bị ép buộc phải làm như vậy."
2404 = "Vài giây. Một sự im lặng như thể đang tìm kiếm từ ngữ."
2407 = "Tiếng khóc ấy. Đâm xuyên qua tôi. Cuối cùng, tôi cũng hiểu ra rằng, Hachiroku cũng giống như tôi."
2408 = "Sự quan tâm, lời an ủi. Truyền đến tôi thật ấm áp. Nếu vậy, sự tự trách…… sẽ chỉ là một sự nhõng nhẽo đơn thuần thôi."
2410 = "Phải khó khăn lắm mới bơm dầu lại được. Nếu lúc này mà chủ quan thì đúng là đồ ngốc."
2412 = "Nếu Hachiroku bị hỏng, thì có lẽ tôi cũng không thể bước tiếp được nữa."
2413 = "Nếu em ấy đã quên, thì tôi chỉ cần nhắc lại cho em ấy nhớ là được."
2416 = "Nếu làm \"như mọi khi\", thì tại sao tôi lại không xác nhận với Hachiroku trước khi cấp nước."
2418 = "Chỉ một cuộc đối thoại ngắn ngủi vậy thôi cũng khiến tôi nhẹ nhõm từ tận đáy lòng."
2421 = "Chắc chắn, nó đã nằm ở đó từ rất lâu rồi. Chỉ là do tôi sợ hãi, nên đã luôn ngoảnh mặt làm ngơ trước câu trả lời ấy."
2424 = "Chỉ cần tạo dựng lại một lần nữa là được, và nếu là chúng tôi, thì chắc chắn sẽ làm được."
2426 = "À, đúng rồi. Hachiroku cũng từng bị bỏ lại."
2429 = "Như thể vừa bừng tỉnh, em ấy chớp mắt liên tục vài cái."
2432 = "Kéo theo \\x%l客車;#00ffc040;toa hành khách%l;#; là vì mục đích này đây."
2435 = "Dù Nagi có muốn ngủ lại ở nơi kỳ quái nào đó, thì với ba người bọn họ, chắc chắn sẽ không để bị cuốn theo đâu."
2437 = "Dù là phía sau bức màn mưa lớn, dù tốc độ có khác mọi khi, nhưng tôi vẫn nhìn thấy rõ."
2439 = "Dù có thiếu phụ lái tàu, dù thời tiết có tồi tệ đến đâu, tôi cũng đã được chuẩn bị sẵn sàng để vượt qua――――hửm?"
2441 = "Cứ như thế, chúng tôi nắm tay nhau—— cả gia đình quây quần cùng bước về nhà."
2446 = "Đã bắt đầu giảm tốc rồi. Phần còn lại, nhờ quán tính——dù không làm gì, cũng sẽ đến nơi."
2449 = "Một âm thanh khô khốc. Đến mức như có thể cảm nhận được nỗi đau truyền đến."
2451 = "Xung đột vẫn xảy ra như thường, mọi người đều sống những ngày tháng theo cách riêng của mình."
2455 = "Theo dõi trạng thái thân xe một cách thích hợp, và đưa ra chỉ thị lái tối ưu nhất. Năng lực của \\x%l運転体;#00ffc040;kíp lái%l;#;, Hachiroku hiện tại không thể phát huy được."
2459 = "Nỗi đau khổ vì không thể cứu được, nỗi đau khổ vì đã để họ chết đi. Từ ngày hôm đó——em ấy vẫn luôn ôm giữ trong lòng."
2475 = "Âm thanh lạ! Ngay lập tức một màu đen che khuất tầm nhìn!?"
2480 = "Cố gắng dứt bỏ nhưng không thể dứt bỏ. Cố gắng lãng quên nhưng không thể lãng quên."
2482 = "Nước lò hơi sôi trào, phun ra từ ống khói với áp suất cao rồi rơi xuống, chắc hẳn đã rửa trôi sạch sẽ dầu bôi trơn ở bộ phận truyền động rồi."
2484 = "Tôi đã quá dựa dẫm. Đã quá nhõng nhẽo. Vào một Hachiroku nhỏ bé thế này."
2486 = "Không chỉ cảm thấy đó là một định nghĩa thỏa đáng, mà nó còn vang vọng và thấm sâu vào tận đáy lòng tôi."
2488 = "Nhưng, chúng tôi không sợ hãi. Cả tôi và Hachiroku, sẽ không sợ hãi nữa."
2489 = "Bị gió quật vào người, tôi mới hiểu được ý nghĩa của từ đó bằng chính cơ thể mình."
2498 = "Không phải một mình."
2499 = "Đang hòa làm một. Không chỉ đôi tay, không chỉ cơ thể, mà cả lời nói, cả trái tim."
2500 = "Nỗi đau của vết thương, chắc chắn là giống nhau. Nhưng Hachiroku chưa một lần nào cho tôi thấy sự đau khổ đó."
2501 = "Đôi tay cử động."
2502 = "Ước muốn của chúng tôi, đang hòa quyện vào nhau."
2503 = "Chúng tôi——trao nhau nụ hôn để hiến dâng cho nhau."
2505 = "Tôi đã thất bại. Cho quá nhiều nước rồi. Cứ tưởng làm như mọi khi là được, nhưng do ảnh hưởng của áp suất không khí——"
2506 = "Chỉ nghĩ đến những điều thực tế. Chỉ nghĩ đến hiện tại thôi."
2509 = "Tôi và Hachiroku nắm tay nhau."
2510 = "Nếu là huấn luyện thì tôi đã trải qua chạy tàu ban đêm nhiều lần rồi."
2514 = "Góc nghiêng của \\x%l整備体;#00ffc040;thân chính%l;#; vô cùng nghiêm nghị và căng thẳng, đẹp đến mức khiến tôi cảm thấy đáng sợ——"
2517 = "Tôi nén chặt cảm giác hối hận xuống tận đáy lòng, thu nhỏ nó lại mức tối đa."
2519 = "Không buông ra, cứ thế, tôi vươn thẳng tay về phía ông Mototada."
2520 = "Tôi đã nhiều lần. Rất nhiều lần, vô số lần nhận ra rằng, đó là điều tuyệt đối không thể dứt bỏ, cũng không thể lãng quên."
2525 = "Từng chút, từng chút một, tôi tiến lên. Chân không rời khỏi \\x%l歩き板;#00ffc040;bệ bước chân%l;#;, tôi nhích từng bước về phía trước."
2529 = "Từ từ, từ từ buông tay phải ra, mở cửa \\x%lオイルポンプ;#00ffc040;bơm dầu%l;#;, rồi đặt tay lên tay cầm bên trong."
2532 = "Một tay xoay tay cầm, xoay mãi——"
2534 = "Bàn tay đang nắm chặt \\x%l缶掴み棒;#00ffc040;tay vịn lò hơi%l;#;, đôi chân đang đạp trên \\x%l歩き板;#00ffc040;bệ bước chân%l;#;, cứ trượt đi. Trượt mãi."
2538 = "Việc chưa đến được ga cuối, việc không thể đi đến tận cùng——"
2541 = "Đã cẩn thận đến mức đó rồi, vậy mà suy nghĩ vẫn bị kéo về hướng tiêu cực."
2543 = "Tôi đang bối rối. Đến mức tự bản thân tôi cũng nhận ra điều đó."
2545 = "Tôi khao khát—— được sống đến nhường này."
2547 = "Nỗi đau đó lớn đến nhường nào, tôi là người hiểu rõ hơn ai hết."
2550 = "Tôi hiểu rõ sự thật đó sâu sắc hơn lúc nãy."
2551 = "Tôi lắc đầu mạnh hơn lúc nãy, hít một hơi thật sâu, và nắm chặt lại các ngón tay đang cầm xẻng xúc than."
2552 = "Không đợi em ấy nói hết câu, tôi liền lao mình ra \\x%l歩き板;#00ffc040;bệ bước chân%l;#;."
2556 = "Không thở nổi, hoa mắt chóng mặt. Cơ thể ướt sũng và lạnh toát, nặng trĩu vô cùng."
2558 = "Tôi nghĩ cuối cùng mình cũng đã biết, phải đối mặt với nỗi đau đó như thế nào."
2560 = "Cổ họng tôi chợt nhẹ nhõm hẳn. Chỉ một lời nói của Hachiroku đã xua tan đi sự bất an trong tôi."
2563 = "Bàn tay của tôi, và bàn tay của Hachiroku. Đan vào nhau, và cùng lúc cử động."
2564 = "Có vẻ tiếng mưa như thác đổ đã át đi, em ấy không nghe thấy. Tôi lớn giọng, gọi lại lần nữa."
2566 = "Tôi tựa hẳn người vào em ấy. Áp sát vào nhau. Trao đổi hơi ấm cơ thể giữa tôi và Hachiroku."
2568 = "Tôi ngã nhào vào buồng lái, đúng nghĩa đen."
2569 = "Cuối cùng, tôi cũng đã hiểu."
2570 = "Tôi tự nhiên nghĩ đến. Và nhớ lại."
2572 = "Bàn tay đang nắm lấy Hachiroku."
2573 = "Tôi xúc than ném vào nhẹ nhàng, rồi kiểm tra đồng hồ đo mực nước."
2574 = "Tình hình thực ra rất đơn giản, đầu óc tôi chợt bừng tỉnh."
2577 = "Hoặc có lẽ do sự mệt mỏi, mà tôi lại cảm thấy bận tâm đến điều đó một cách kỳ lạ."
2580 = "Thế nên, chúng tôi có thể làm được. Vì có hai người——nên mới có thể làm được."
2582 = "Nên anh mới muốn vượt qua. Vì có Hachiroku ở bên, nên anh mới có thể vượt qua được."
2584 = "Thế nên, tôi ôm chầm lấy em. Ôm chặt đến mức như muốn làm vỡ vụn cơ thể nhỏ bé của Hachiroku."
2585 = "Cả tay và chân khi quay lại buồng lái, vì thế mà càng trở nên thận trọng hơn——"
2589 = "Thế nên, tôi ôm em ấy từ phía sau. Ôm lấy em ấy, và dùng tay mình bao bọc lấy đôi tay của Hachiroku."
2590 = "Vì thế, để biến ước muốn đó thành hiện thực."
2603 = "Toàn bộ sức lực trong cơ thể như tan biến."
2609 = "Bây giờ, nếu Hachiroku sắp sụp đổ, thì lần này, tôi muốn là người chống đỡ."
2617 = "Hibiki và Fukami, cả hai cùng lúc cúi đầu."
2619 = "Bị chị Mayami dắt tay, Hibiki quay lại nhìn tôi và Hachiroku."
2627 = "Rõ ràng là làm giống như mọi khi, sao mực nước lại cao thế này—— Không!? Nó đang dâng lên đến tận miệng rồi!"
2633 = "Bức màn mưa lớn, sương mù và ánh sáng. Một khung cảnh huyền ảo, nhưng lại gần như che khuất hoàn toàn tầm nhìn."
2648 = "Những giọt nước mắt rơi lã chã xuống sàn, dù vậy em ấy vẫn đang điều khiển cần gạt \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;#;."
2656 = "Đập vào cửa sổ phía trước, là những giọt mưa đen ngòm!"
2658 = "Nỗi buồn vì không thể cứu được, nỗi buồn vì đã giết chết họ, sẽ không bao giờ biến mất trong suốt quãng đời còn lại."
2659 = "Không thể dứt bỏ. Không thể lãng quên. Sẽ không được tha thứ. Cũng không thể tha thứ."
2660 = "Không phải hối tiếc về những gì đã mất, cũng không phải ghen tị."
2667 = "Và rồi, một nụ cười. Rạng rỡ hơn mọi khi rất nhiều."
2668 = "Và bàn tay đó, đặt lên vai Kisaki."
2669 = "Rồi cô ấy chợt nhận ra điều gì đó, vội thẳng lưng lên, nhìn thẳng vào ông Mototada."
2670 = "Và rồi đã để họ chết. Không thể cứu được."
2671 = "Và rồi, mỗi bước tiến lên, tôi lại càng thấm thía."
2672 = "Rồi cúi gập người—— hướng về phía chúng tôi, cúi đầu tạ lỗi."
2674 = "Như thể bị ẩm vậy, nó cứ ỉu xìu, không chịu cháy bùng lên."
2678 = "Cảm giác an tâm khi tôi làm \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#; kết hợp với \\x%l運転体;#00ffc040;kíp lái%l;#; của Hachiroku—— cảm giác có thể hoàn toàn giao phó tấm lưng cho nhau, bây giờ không còn nữa."
2682 = "Dùng van \\x%l砂撒き;#00ffc040;phun cát%l;#; để xả cát ra, đồng thời khi \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; vượt qua nó, sẽ dùng nước xả để cuốn trôi cát đi."
2685 = "Em ấy chớp mắt liên tục nhiều lần. Rồi, gạt đi những giọt nước mắt."
2693 = "Chắc hẳn em ấy đã rất lo lắng. Hachiroku gật đầu hết lần này đến lần khác."
2701 = "Chị Mayami nắm lấy tay Hachiroku. Hibiki nắm lấy tay tôi."
2704 = "Khoảnh khắc đó, có thứ gì đó lao ra. Là Nagi. Thế kia thì ướt sũng mất thôi."
2720 = "Sau khi để lại một cái cúi chào nữa, Kisaki rời khỏi sân ga, những người tụ tập ở đó cũng mang khuôn mặt nhẹ nhõm và bắt đầu giải tán."
2722 = "Kisaki gật đầu. Với vẻ mặt thư giãn."
2723 = "Kisaki dùng ánh mắt ngăn cản Hibiki đang định lao ra."
2725 = "Chúng tôi đã tích lũy kinh nghiệm để có thể làm được như vậy. Tất cả đều do Hachiroku chỉ dạy, và bắt cơ thể tôi phải ghi nhớ."
2736 = "Cuối cùng tôi cũng đến được ngay sau tấm chắn khói. Nhưng, không được hoảng hốt. Hoảng hốt là chết."
2739 = "Phía sau em ấy, là Hibiki, Kisaki và Fukami. ——Quả nhiên là, mọi người đều ở đây."
2741 = "Và giờ đây, anh đang khao khát mãnh liệt, vô cùng mãnh liệt, muốn được cùng em đi xa hơn nữa, vượt qua cả nhà ga cuối cùng."
2742 = "Đường sắt. Và \\x%lエアクラ;#00ffc040;Aircra%l;#;. Đó cũng là những thứ chắc chắn có thể cộng tồn với nhau."
2746 = "Âm thanh không dừng lại. Thậm chí còn ngày càng lớn hơn——!"
2748 = "Nhờ có sự giúp đỡ của Kisaki, thực tế là, tình hình tài chính của Công ty Cổ phần Đường sắt Ohito đã được cải thiện đáng kể."
2752 = "Chỉ cần có thêm một đôi mắt và đôi tay của phụ lái tàu, thì trong tình huống này——tôi cũng không cảm thấy bất an đến thế."
2757 = "Khuôn mặt an tâm của ông Minokasa, trông như sắp khóc đến nơi——"
2760 = "Ông lão Minokasa buông lỏng nắm đấm, dùng bàn tay nhăn nheo xoa đầu Nagi."
2772 = "Chắc hẳn là dầu bắn ra cũng đã dính vào đó rồi."
2795 = "Michi đã đẩy tôi ra—— và trao sinh mệnh này vào bàn tay trống rỗng của tôi."
2797 = "Một thằng đàn ông to xác như tôi, lại không thể chịu đựng nổi sự bất an của chính mình—— và trút toàn bộ lên em ấy."
2800 = "Một âm thanh nhẹ nhàng đến mức ngỡ ngàng. Âm thanh đã từng nghe thấy ở một nơi xa xăm nào đó."
2801 = "Hachiroku khẽ cười khúc khích. Trông em ấy ấm áp hơn thường ngày."
2814 = "Phía sau tiếng mưa. Tiếng \\x%l喚呼;#00ffc040;hô xác nhận%l;#; nghe rất nhỏ và yếu ớt. Dù là \\x%l喚呼;#00ffc040;hô xác nhận%l;#; ở vị trí biển báo, nhưng có lẽ em ấy cũng không đọc được biển báo."
2816 = "Lần này, hướng về tất cả những người có mặt ở đó—— Ông Mototada cúi đầu còn sâu hơn lúc nãy."
2817 = "Đáng lẽ phải có luồng gió mạnh thổi qua——nhưng dù mở cửa lò, lửa trong \\x%lカマ;#00ffc040;lò hơi%l;#; vẫn không có khí thế như mọi khi."
2819 = "Khi đó, nhân sự cũng có thể được tăng cường."
2820 = "Và chắc chắn, tôi cùng Hachiroku cũng đang nở một nụ cười y hệt như vậy."
2821 = "Nếu cứ để thế này, \\x%l8620;#00ffc040;8620%l;#; sẽ bị kẹt động cơ và hỏng mất. Nếu vậy, chỉ còn một cách duy nhất."
2823 = "Phải gọi cảm xúc này, sự thôi thúc này là gì đây—— Khi vừa nghĩ đến, ngôn từ đã tự tuôn trào khỏi cổ họng."
2827 = "Dần hiện ra. Phía bên kia con dốc. Phía sau màn mưa."
2828 = "Sắc đỏ như đang tan chảy mờ ảo, mong manh…… đến mức tưởng như sắp sập xuống bất cứ lúc nào."
2831 = "Sự gắn kết và mối liên hệ giữa những người hàng xóm—— Tôi không nghĩ nó đặc biệt sâu đậm hay mạnh mẽ."
2840 = "Mùi sắt. Mùi dầu. Tiếng gió. Tiếng mưa. Cơ thể lạnh toát trong chớp mắt, lại nhớ về khoảnh khắc đó."
2841 = "Mùi sắt và tiếng \\x%lブラスト;#00ffc040;khí thải xi lanh%l;#;, cùng trận mưa lớn và cuồng phong, hóa thành những bàn tay lạnh lẽo vô hình, từ từ siết lấy cổ họng tôi."
2846 = "Phùuu, một tiếng thở dài, thật dài."
2848 = "Dù có chút ngượng ngùng, nhưng không hề xa cách. Quả nhiên là cha con, tôi thầm nghĩ."
2849 = "Dù khác với mọi khi, tôi đang làm phụ lái tàu, nhưng những việc cần làm, cơ thể tôi vẫn nhớ rất rõ."
2850 = "Dù mệt mỏi, nhưng lại trọn vẹn. Dù trọn vẹn, nhưng vẫn thấy thiếu thốn. Tôi khao khát một tồn tại mang tên Hachiroku đến nhức nhối."
2851 = "Tôi không muốn làm Hachiroku mất tập trung—— Dù nghĩ vậy, nhưng tôi không thể không trả lời."
2852 = "Nhưng với âm thanh lớn lần này, không một ai cau mày."
2854 = "Cách buồng lái chỉ vài mét. Bên phải \\x%l缶胴;#00ffc040;thân lò%l;#;, ngay sau tấm chắn khói——\\x%lオイルポンプ;#00ffc040;bơm dầu%l;#; nằm ở đó."
2859 = "Mưa không hề ngớt đi chút nào. Tầm nhìn gần như bị che khuất hoàn toàn."
2874 = "Cơm nắm, súp miso, khăn tắm và quần áo thay. Liên tục được đưa cho Hibiki và mọi người."
2879 = "Cơn mưa đen vẫn đang đập mạnh vào cửa sổ phía trước. Dù có cố nhìn cũng không thể thấy được gì."
2903 = "（Không）"
2904 = "（Từ trước đến nay, vẫn luôn như vậy—— Một cách vô thức…… tôi đã luôn tiếp tục làm như vậy.）"
2910 = "（Nhưng mà, thế này chẳng khác nào bịt mắt. Với \\x%l整備体;#00ffc040;thân chính%l;#; của Hachiroku, thì hiệu suất cảm biến quá kém.）"
2913 = "（Không nóng vội mà cứ tiến lên. Chỉ cần vậy thôi. ……Vượt qua được chỗ này, mọi thứ sẽ tốt đẹp lên ngay lập tức.）"
2916 = "（Vùuuu!!!!）"
2917 = "（Bộp!）"
2918 = "（Cọc cạch, cọc cạch, xình xịch, xình xịch——）"
2921 = "（A……）"
2922 = "（Bốp!!!）"
2923 = "（Két két két! Két két két két két két két!!）"
2924 = "（Két! Két két két két!）"
2925 = "（Phập）"
2926 = "（Bụp! Bụp! Xìiiiiiiiii!!）"
2927 = "（Để Hachiroku——đóng vai trò \\x%l機関士;#00ffc040;nhân viên cơ vụ%l;#;）"
2933 = "（Vì có tôi ở đó, nên Hachiroku…… đã không thể trút bỏ nỗi đau khổ về vụ tai nạn——）"
2934 = "（Mực nước——hửm?）"
2936 = "（Phập——Phập）"
2940 = "（Nếu \\x%lキハ07;#00ffc040;Kiha 07%l;#; có thể hoạt động thương mại trở lại, thì cả về mặt tài chính lẫn vận hành đều sẽ có khoảng dư dả lớn.）"
2946 = "（Điều này cũng giống vậy thôi. Chỉ cần, vượt qua là được.）"
2947 = "（Thế này thì——quả nhiên……）"
2948 = "（Đúng nghĩa đen là mò mẫm trong đêm tối rồi. Thế này thì）"

[selections]
