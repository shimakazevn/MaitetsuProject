1980 = "「Tôi là. \\x%lレイルロオド;#00ffc040;Railord%l;#; thử nghiệm. Của loại tàu điện tốc hành. Tiên tiến nhất thời đó. Vào cuối thời Teitetsu.」"
1982 = "「Cũng có thể. Và. Hachiroku cũng tiếp nhận được. Nhưng, chỉ là đang giả vờ như không biết thôi.」"
1985 = "「Vậy nên, chỉ cần hãm \\x%lブレーキ;#00ffc040;phanh%l;#; trễ hơn một chút thôi. Sự khác biệt chỉ có vậy. Còn lại tất cả! Cứ làm như mọi khi là được!」"
1989 = "「Vậy nên? Nhá? Olivy đã ngoan ngoãn rồi mà.」"
1991 = "「Vì vậy, hôm nay. Chỉ cần nhóm Hibiki-Nagi và Niiroku. Nếu mọi người có thể vận hành suôn sẻ, Olivy sẽ an tâm nghỉ hưu.」"
1992 = "「Thế nên, phải chăm sóc cẩn thận! Mức độ này thì có thể sửa ngay, nhưng không sửa là tàu sẽ dừng lại đó!」"
1995 = "「Thế nên những lúc Niiroku phải kiểm tra toàn diện, dù đã nghỉ hưu, chắc Olivy vẫn sẽ trực tiếp tham gia ca trực như bình thường thôi.」"
1996 = "「Vì thế. Những con số chi tiết. Sẽ trở nên vướng víu. Tôi nghĩ vậy. Cách lái của Hibiki. Là lái bằng mắt. Lái bằng mắt và cảm giác.」"
2005 = "「\\x%l機関士;#00ffc040;Lái tàu%l;#; Hibiki. Tôi. Xin phép. Đưa ra ý kiến.」"
2008 = "「Khả năng quan sát phía trước của Hibiki. Sự tập trung. Rất tuyệt vời. Cả các cần gạt nữa. Khi thao tác. Chỉ nhìn thoáng qua một chớp mắt.」"
2012 = "「Đã rõ.」"
2014 = "「Đã rõ. Tôi sẽ báo lại với Paulette.」"
2015 = "「Đã rõ.」"
2017 = "「Vậy…… sao.」"
2019 = "「Nếu là kết quả đậu rớt, thì đã được dán bên ngoài buồng lái rồi đấy?」"
2021 = "「Đúng không nào!!!」"
2022 = "「Đúng vậy! Nên xét về mặt thời gian thì nó cũng là 『\\x%l保線;#00ffc040;bảo trì đường ray%l;#;』 đó! Công việc bảo vệ đường ray, cứ liên tục, nối tiếp nhau thành một đường thẳng!!」"
2027 = "「Đúng vậy! Khi hoa anh đào nở, khi mùa xuân đến! Chắc chắn mọi thứ! Sẽ tuyệt vời hơn bây giờ nhiều!」"
2028 = "「Ừ. Tức là, 『Chính việc không lên tàu mới là bài học chỉ dẫn』.」"
2030 = "「Thế à? Vậy, Hachiroku và Olivy, đứng chéo nhau, sang đường ray bên kia nhé? Còn Soutetsu thì」"
2032 = "「Lúc Kiyoharu và tôi. Gặp Olivy. Olivy lúc đó. Sợ rằng. Sẽ hỏng bất cứ lúc nào.」"
2035 = "「Đúng vậy. Mẫu thử nghiệm. Có tính bảo mật cao. Lại là chiếc đầu tiên. Về mặt \\x%l共感;#00ffc040;cộng cảm%l;#;. Có thể làm được. Những điều mà các \\x%lレイルロオド;#00ffc040;Railord%l;#; khác không thể.」"
2037 = "「Vâng. Em cũng nghĩ đó là một đề xuất tuyệt vời ạ.」"
2040 = "「Vâng, đúng vậy ạ.」"
2041 = "「Tốc độ——32 km/h.」"
2044 = "「Đến giờ rồi.」"
2047 = "「Pha hãm \\x%lブレーキ;#00ffc040;phanh%l;#; cuối cùng là hạt sạn duy nhất, còn lại thì nhìn chung không có vấn đề gì.」"
2051 = "「Sao cơ? Dù có hoàn thành khóa hướng dẫn và nghỉ hưu. Thì Olivy, cũng chỉ chuyển sang làm nhân viên hợp đồng bán thời gian thôi mà——đúng không?」"
2052 = "「Chuyện gì vậy? \\x%l機関士;#00ffc040;Lái tàu%l;#; Migita Hibiki.」"
2058 = "「Thế Nagi đại nhân thì sao! Nagi đại nhân hôm nay thế nào hả!?」"
2060 = "「Nagi đại nhân đây, tự dưng thấy càng lúc càng vui quá đi mất!!」"
2062 = "「Nếu gây cản trở. Cho ca trực. Tôi định sẽ báo cáo ngay. Nhưng. Ca trực. Chưa một lần nào. Bị đình trệ.」"
2066 = "「Quả nhiên là chuyện đó buồn cười mà nhỉ! Cả Hachiroku lẫn Soutetsu đều đang cười tủm tủm kìa!」"
2071 = "「Cong vênh——Ra là vậy. \\x%l保線;#00ffc040;Bảo trì đường ray%l;#; có thể nói là việc liên tục điều chỉnh những cong vênh đó sao.」"
2078 = "「Áp suất xi-lanh ổn định. Mở \\x%lバイパス弁;#00ffc040;van bypass%l;#;, mở van xả nước xi-lanh, \\x%l逆転機;#00ffc040;cần đảo chiều%l;#;——\\x%l前進フルギア;#00ffc040;cài hết số tiến%l;#;!」"
2082 = "「Không?」"
2083 = "「Không có cố đâu~. Chỉ là nghĩ 'Navi bay tới rồi!' nên ra đón thôi mà~」"
2084 = "「Đúng vậy. Một nụ cười rạng rỡ và tươi sáng hơn hẳn lúc trước khi lên tàu.」"
2085 = "「Đúng đúng! Chỗ này nhô lên thì chỗ kia lõm xuống. Chỉ cần có tàu chạy qua là lớp đá nền chắc chắn sẽ bị cong vênh.」"
2086 = "「Đúng đúng! Như vậy thì chỗ đó sẽ thấp xuống, rồi cứ để nguyên trạng thái đó mà đầm chặt lại!」"
2095 = "「Mẫu thử nghiệm……」"
2100 = "「Hay là, thử suy nghĩ theo hướng ngược lại xem sao.」"
2102 = "「Chuyến từ Yui đi Ohitoyo có tỷ lệ lấp đầy là 65%. Nhẹ hơn mọi khi một chút. Thời tiết nắng ráo, tình trạng đường ray tốt.」"
2103 = "「Tất nhiên rồi~! Làm nhân viên hợp đồng thì, sẽ được bố trí theo ý thích của Olivy mà đúng không?」"
2104 = "「Tất nhiên rồi! Tất nhiên, em cứ nói đi!」"
2105 = "「Đã truyền đạt. Rõ rồi. Với lại——. 『Cô ấy ngủ say và yên bình đến mức không nỡ gọi dậy luôn』.」"
2107 = "「Chắc là vậy.」"
2109 = "「——Giá như tháng Tư đến sớm hơn thì tốt biết mấy. Như vậy, việc chăm sóc kéo dài tuổi thọ cho Olivy cũng sẽ càng thêm hiệu quả.」"
2111 = "「Biết là vậy, nhưng—— Nhưng mà! Hôm nay, Olivy đâu có trực tiếp lái đâu.」"
2115 = "「Chỉ trong thời gian ngắn mà đã phình lên đến mức có thể nhìn thấy bằng mắt thường. Quả nhiên không phải chuyện đùa đâu nhỉ.」"
2121 = "「Đúng vậy.」"
2122 = "「Quả thực, rất đáng mong đợi đấy. Lúc đó, tất nhiên chúng ta sẽ nhờ Olivy tham gia trực ca rồi.」"
2123 = "「Đúng vậy~! Nói thì là 『đầm chặt』. Nhưng thực tế là phải nới lỏng ra một chút, rồi mới đầm chặt lại đó~」"
2131 = "「Làm mát một chút mới vừa chứ? Sáng nay tận 41 độ lận mà.」"
2133 = "「Đến mức đó sao……」"
2134 = "「À, ra là vậy, là do \\x%l共感;#00ffc040;cộng cảm%l;#; sao? Thảo nào dạo đó Niiroku, thỉnh thoảng lại phát ra những tiếng rên rỉ đau đớn.」"
2142 = "「Chắc chắn là vậy rồi! Thế là ngon lành!」"
2150 = "「Hiện tại. Không tệ như một thời gian trước. Trái lại. Gần đây. Đã ổn định hơn khá nhiều.」"
2152 = "「Chỉ vì một ngày bị rút ngắn đi——không, dù chỉ là vài giờ, vài chục phút. Biết đâu sau này bạn sẽ phải hối hận tột cùng đấy?」"
2155 = "「Nới lỏng. Sao ạ? Theo như lời ngài Soutetsu nói thì, lớp đá nền là để 『đầm chặt』 mà, em nghĩ vậy.」"
2156 = "「Tôi cũng chỉ mới nhận ra——mới liên kết lại được mọi chuyện thôi. Nhưng——」"
2158 = "「Ghét ghê. Hơi cao rồi.」"
2162 = "「Cảm ơn nha! Mọi người vất vả rồi!!!」"
2167 = "「Hãm \\x%lブレーキ;#00ffc040;phanh%l;#; nhẹ. \\x%l逆転機;#00ffc040;Cần đảo chiều%l;#;, \\x%lミッドギア;#00ffc040;số trung tính%l;#;.」"
2171 = "「Vất vả rồi nha!」"
2191 = "「Chuyện đó để sau đi, từ ông lão đó, hoặc từ những người khác, có nghe ngóng được thông tin gì mới không?」"
2192 = "「Cái \"một thời gian trước\" đó là……」"
2193 = "「Chỉ cần giảm 0.1 độ nữa là vào ngưỡng an toàn rồi mà! Với lại hôm nay là ngày của nhóm Hibiki——」"
2194 = "「Làm gì có chuyện đó! Em cũng muốn Olivy được nghỉ ngơi thật nhiều chứ bộ! Nhưng mà.」"
2195 = "「Đây chính là——Giấy chứng nhận đậu của chúng ta.」"
2196 = "「Làm gì có! Nhiều cỡ này nè, cỡ này nèeeeeee!!」"
2197 = "「Vậy sao.」"
2198 = "「Vậy sao. Thế thì, em có thể truyền đạt qua \\x%l共感;#00ffc040;cộng cảm%l;#; là, 『Cứ để cô ấy ngủ đến giữa trưa đi』 được không?」"
2200 = "「Vậy sao.」"
2201 = "「Vậy ạ. Thế thì tốt quá.」"
2202 = "「Vậy thì. Tốt rồi.」"
2203 = "「Thế thì chúng tôi cũng an tâm rồi.」"
2204 = "「Tất nhiên rồi! Di chuyển sao cho điều chỉnh lại độ cong vênh của đường ray, làm lại từ đầu, rồi sau đó mới đầm chặt lại một lần nữa đó~」"
2205 = "「Này, Olivy? Đâu cần phải vội vàng quyết định chuyện nghỉ hưu ngay trong hôm nay đâu chứ?」"
2207 = "「Vụ đồng hồ tốc độ á! Nếu không có lời khuyên của Niiroku, chắc chắn tôi đã hoảng loạn luôn rồi.」"
2208 = "「Đồng hồ tốc độ?」"
2212 = "「Vào trạng thái \\x%l絶気;#00ffc040;cắt hơi%l;#; ạ.」"
2214 = "「Đường ngang! Có bóng người kìa!」"
2215 = "「Đường ngang! Có xe đang dừng kìa!」"
2217 = "「Cuốc chim, cái đầu thường dùng ấy. Nó dẹt và phẳng như cái xẻng đúng không?」"
2219 = "「Với lại nè? Lời nhắn từ Seki. Lát nữa ông ấy sẽ tự xin, nhưng mà bảo là ban đêm bắt đầu cần lò sưởi rồi đó.」"
2221 = "「Cái đó. Tôi không rõ. Đánh giá quá cao rồi.」"
2223 = "「Vậy thì, hôm nay chỉ còn cách nghỉ ngơi thôi.」"
2224 = "「Vậy thì, đi xử lý \\x%lバラスト;#00ffc040;đá ba-lát%l;#; một chút không?」"
2226 = "「Cái đó. Rất tốt. Nhiệt độ cơ thể. Được Kiyoharu đo cho. Chỉ vậy thôi. Đã cảm thấy. Như được bảo dưỡng rồi.」"
2228 = "「Olivy…… bây giờ—— Bây giờ cô ấy cũng đang giấu đi nỗi đau đớn đó sao?」"
2230 = "「Nếu vậy thì, ừm! Olivy hôm nay sẽ ngoan ngoãn! Cùng với Hachiroku, nằm nghỉ ngơi chờ mọi người về nha.」"
2231 = "「Vậy thì, làm lại lần nữa nha~!」"
2234 = "「Nếu vậy, em cũng sẽ giúp một tay ạ.」"
2237 = "「Vâng. Bọn em sẽ đợi ngài về.」"
2239 = "「Em sẽ cùng với Olivy ở lại cửa hàng đường sắt. Để chờ đợi đầu máy số 9 vào ga đúng giờ.」"
2240 = "「Vậy tôi nói. Đồng hồ tốc độ. Bình thường Hibiki. Hoàn toàn không nhìn. Đến mức ngạc nhiên.」"
2243 = "「Olivy lúc đó. Tràn ngập nỗi đau, và sự thống khổ. Nhưng bình thường, cô ấy che giấu. Rất khéo léo.」"
2246 = "「Đúng vậy đó~! Mấy cái lớp nền bê tông đang được nghiên cứu ấy, hoàn toàn là dựa trên ý tưởng đó luôn~」"
2248 = "「Nhưng mà, vậy là Olivy sẽ nghỉ hưu sao…… Nói thật thì, quả nhiên là buồn ghê.」"
2250 = "「Thế, sao rồi!!?」"
2252 = "「Vậy, bọn em.」"
2255 = "「Vậy, ừm——anh hai——à không, ừm, Giáo quan \\x%l機関士;#00ffc040;lái tàu%l;#; Migita Soutetsu.」"
2257 = "「Bơm nước lò hơi!」"
2260 = "「Vui vẻ. Hạnh phúc. Yêu thương. Sung sướng. Cô ấy rải rác. Rất nhiều, rất nhiều những thứ đó.」"
2261 = "「Đóーーーーng.」"
2263 = "「Cái gạt chướng ngại vật á. Chắc không tới 2 tháng nữa là xong rồi. Sẵn dịp nên em cũng muốn Olivy dùng thử xem sao.」"
2267 = "「Che giấu?」"
2268 = "「Sắc thu đang ngày một đậm nét. Thế nhưng, nhiệt độ trong buồng lái vẫn dư sức vượt ngưỡng 50 độ đấy.」"
2269 = "「Ngài đi cẩn thận nhé, ngài Soutetsu. Chúc ngài hôm nay cũng có một chuyến đi an toàn.」"
2270 = "「Soutetsu, sang phía bên kia đường ray đi. Làm chéo nhau nhé~!」"
2271 = "「Lái tàu tốt. Lắm. Tôi cũng không biết. Mình đã hỗ trợ được bao nhiêu. Nữa.」"
2275 = "「31 km/h.」"
2276 = "「38 độ 4. Vẫn dư sức nằm trong ngưỡng an toàn để hoạt động.」"
2278 = "「Đoàn tàu 901, BBQ Olivy. Vào ga suối nước nóng Ohitoyo lúc 1145——Đúng giờ!!!」"
2281 = "「Ok, hiểu rồi! Vậy thì, Soutetsu! Nhớ chăm sóc mấy đứa nhỏ cẩn thận nha!」"
2283 = "「Okay! Vậy, tôi sẽ làm mẫu cho Hachiroku xem, lúc đầu thì, cứ đứng đó xem một chút nhé.」"
2465 = "Trải qua một năm cẩn thận tỉ mỉ từng chút một, điều này dường như đã trở thành thói quen thường nhật rồi."
2467 = "Không thấy giọng nói vui vẻ của Olivy vang lên \"Bình thườ——ng\"."
2470 = "Không ổn, lỡ nói ra tiếng mất rồi."
2472 = "Chính là lúc hệ thống hợp tác tương trợ giữa Tiến sĩ Fushicho, Denshahime và ông chủ nhà tắm Tororyu-yu được hình thành."
2481 = "Không——Chính vì để không bỏ sót điều đó, mà chúng tôi mới tiếp tục giám sát liên tục sao."
2482 = "Không…… Khi giọng nói ấy kéo tôi ra khỏi tâm trạng lâng lâng, thì lý do Niiroku phản đối cũng không khó để tưởng tượng ra."
2483 = "Dù vậy, vì đây là địa điểm giám sát quan trọng nhất, nên mỗi ngày ít nhất tám tiếng. Phải có một người thay phiên nhau túc trực——A."
2484 = "Nhưng cái đó cứ bàn bạc với Olivy và Hachiroku, rồi sau đó gửi văn bản cũng được."
2485 = "Nếu được nhận lời tiễn biệt này, thì cỡ 4 năm 1 lần. Lâu lâu mới có cũng không tệ."
2490 = "……Lần đo nhiệt độ buổi trưa, nhiệt độ trong miệng Olivy đã giảm xuống còn 40.7 độ."
2492 = "Nhờ Navi đưa vội đến hiện trường sụt lún, thì thấy Olivy đang đứng thẫn thờ ở đó."
2496 = "Đầu máy số 9 và \\x%l客車;#00ffc040;toa hành khách%l;#; ngoan ngoãn bắt đầu giảm tốc."
2498 = "Đầu máy số 9 và Olivy. Đôi bạn đồng hành đã cùng nhau rong ruổi suốt hơn 100 năm. Nhận ra rằng ngày chia tay của họ vẫn còn rất xa."
2500 = "Thấy có gì buồn cười sao? Olivy cứ cười khúc khích, vẻ mặt rất vui vẻ."
2501 = "Có lẽ trực giác nhạy bén như động vật của Nagi đã hiểu rõ hơn chúng tôi, và cảm nhận được tình trạng của Olivy đang ở mức nguy kịch."
2505 = "Giọng nói của Niiroku vang lên đầy bất ngờ."
2506 = "Nét mặt Niiroku không hề thay đổi. Nhưng giọng nói——đã khẽ bật cười."
2508 = "Giọng nói bỗng trở nên dịu dàng."
2512 = "Trên tay mỗi người là máy ảnh, điện thoại thông minh. Họ tươi cười, muốn chụp một bức ảnh kỷ niệm cùng Olivy."
2513 = "Người, người và người."
2515 = "Rằng bên trong buồng lái ngày hôm nay, ai mới là đồng đội——là sự tồn tại mà em ấy có thể dựa dẫm vào."
2523 = "Đúng là xét về chức năng thì có thể gọi là căn cứ, nhưng nhìn bề ngoài thì giống căn cứ bí mật ——không, đúng hơn là gọi là túp lều thì hợp lý hơn."
2524 = "Vậy ra đêm qua, ông Seki đã ở lại để canh gác sao."
2531 = "Khoảng cách giữa Olivy và chúng tôi, tôi cảm nhận được là đã gần gũi đến mức đó rồi."
2533 = "Nhưng dù vậy, câu trả lời chỉ có một. Nếu bây giờ tôi muốn giảm bớt gánh nặng cho Hachiroku."
2535 = "Tuy nhiên đáng tiếc là, Đường sắt Ohito hiện tại, không có đủ nhân lực và tài chính để giám sát liên tục địa điểm này."
2537 = "Nhưng, sự cong vênh bị bỏ mặc chắc chắn sẽ kéo theo những cong vênh khác, và dần trở thành một vấn đề phức tạp, khó giải quyết."
2538 = "Nhưng ngay lập tức, tôi phủ nhận ảo giác đó. Với tôi bây giờ, tôi có thể khẳng định đó chỉ là ảo giác."
2541 = "Nhưng, đó chỉ là cảm giác khi lái 8620 đã ăn sâu vào cơ thể tôi. Còn cảm giác lái đầu máy số 9 thì tôi gần như chẳng có chút khái niệm nào."
2560 = "Hachiroku——Suzu chắc chắn cũng cảm thấy như vậy. Vì có niềm tin mãnh liệt đó nên tôi mới bất giác nghĩ thế."
2563 = "Rất đỗi nhẹ nhàng, êm ái. Hachiroku cũng lên tiếng ủng hộ."
2564 = "Hachiroku cũng lập tức đáp lời."
2566 = "Hachiroku đang nhìn chằm chằm một cách tò mò vào chiếc cuốc chim lấy từ túp lều bảo trì đường ray đưa cho, chợt ngẩng mặt lên."
2569 = "Hachiroku không chạy mà thong thả bước theo sau."
2570 = "Có lẽ Hachiroku cũng có cùng suy nghĩ với tôi. Hiếm khi thấy em ấy luống cuống rõ rệt thế này."
2573 = "Ánh mắt Hachiroku, vì có được kiến thức mới—— không, vì niềm vui sướng khi biến nó thành của mình, đang sáng lấp lánh."
2575 = "Một giọng nói điềm tĩnh."
2577 = "Lời lẽ hoàn toàn chính xác. Không có chỗ nào để phản bác."
2578 = "Nghe vậy, Hachiroku gật đầu thật sâu."
2581 = "Nói rồi, Hachiroku nhìn chằm chằm vào chiếc cuốc chim trong tay. Một đầu dẹt như cái xẻng, đầu kia thì nhọn hoắt."
2583 = "Như mọi khi, tôi cho em ấy ngậm nhiệt kế."
2589 = "Miệng thì nói đầy tự tin, nhưng nụ cười lại trông có vẻ khá ngượng ngùng."
2594 = "Nagi lên tiếng trước cả tôi. Khoảnh khắc đó, tôi chợt thấy lạnh sống lưng."
2596 = "Nagi rùng mình một cái thật mạnh, giống hệt một chú cún con vừa mới tắm xong."
2602 = "Lúc nãy, tôi lỡ buột miệng nói ra—— Nhưng đây là bài kiểm tra. Sự can thiệp của tôi càng ít càng tốt."
2607 = "Dù không ở cùng nhau, nhưng khi Olivy \\x%l保線;#00ffc040;bảo trì đường ray%l;#; ở đây, chắc chắn cô ấy cũng cảm nhận được điều đó."
2611 = "Nếu là cuối mùa hè năm ngoái…… Thì nhân chuyến viếng thăm của ông Munakata làm cơ hội——"
2625 = "Giọng nói kéo dài. Hibiki từ từ thao tác đóng hoàn toàn \\x%l加減弁;#00ffc040;van tiết lưu hơi%l;#;."
2627 = "Nhìn nè, Olivy cười, rồi xoay chiếc cuốc chim trong tay một vòng như chiếc gậy chỉ huy."
2630 = "Nhưng điều đó cũng đồng nghĩa với việc không có manh mối nào cả."
2631 = "Thế nhưng, dòng chảy quen thuộc bỗng chốc đứt đoạn."
2642 = "Cùng lúc đó, Nagi mở rồi đóng van chặn blower, cải thiện thông gió cho buồng khói."
2652 = "Giống như Hibiki, Nagi cũng đã hoàn toàn bình tĩnh. Trong tình huống này, con bé vẫn tập trung tốt vào công việc của mình."
2653 = "A——Hình như hơi sớm một chút thì phải. Một sự \\x%l減圧;#00ffc040;giảm áp%l;#; rất nhỏ để điều chỉnh."
2660 = "……A, quả nhiên là vậy. Cái thời Niiroku vẫn còn là \"Thiếu nữ quấn băng\"."
2663 = "Thật đáng kinh ngạc. Không ngờ Niiroku lại chủ động bắt chuyện với người khác ngoài \\x%l機関士;#00ffc040;lái tàu%l;#; Akai——"
2666 = "……Trở thành nơi giám sát khu vực này, căn cứ bảo trì đường ray được dựng lên vội vã."
2667 = "Một ca trực không có Hachiroku bên cạnh, tất nhiên là có chút bất an và cô đơn. Nhưng——"
2669 = "Đập để làm cứng, nới lỏng để xê dịch—— Lặp đi lặp lại cả hai việc đó chỉ bằng một chiếc cuốc chim."
2679 = "Olivy cũng đáp lại nụ cười của Hachiroku bằng một nụ cười."
2680 = "Olivy cười. Cười tươi rạng rỡ, vung cao chiếc cuốc chim lên."
2681 = "Bất cứ lúc nào, công việc của Olivy cũng đều chu đáo đến mức khiến Hachiroku phải khen ngợi."
2682 = "Trong nhóm này, Olivy có kỹ thuật cao nhất, nhưng sức lực lại yếu nhất."
2683 = "Olivy chạy lon ton tới."
2684 = "Olivy ngước mắt lên nhìn tôi."
2685 = "Olivy khẽ gật đầu."
2686 = "Đúng nghĩa đen là, 『bắt nhịp』."
2688 = "Cả hai đồng loạt hướng mắt ra ngoài cửa sổ nhìn về phía sân ga."
2690 = "Có lẽ góc độ suy nghĩ của cô ấy cũng đã thay đổi đôi chút. Sự phản hồi ấy giúp tôi cất lời trôi chảy hơn."
2693 = "Rồi, cô ấy cất cao giọng."
2694 = "Giọng nói bỗng chốc mất đi sức lực."
2695 = "Chắc hẳn là cô ấy rất vui và tự hào."
2698 = "Trong đầu thì hiểu rõ. Nhưng dù thế nào cũng vẫn muốn được tham gia ca trực."
2699 = "Nếu đội của Hibiki vượt qua bài kiểm tra hôm nay, Olivy sẽ hoàn thành toàn bộ công việc hướng dẫn. Nhưng, nếu vậy thì——"
2702 = "Việc Hachiroku đi cùng cũng là một sự bảo đảm vô cùng vững chắc—— Nên việc gạt bỏ cả sự bảo đảm ấy, mới thực sự kiểm chứng được năng lực thật sự."
2704 = "Nếu là một thông tin quan trọng như vậy, chắc chắn Hachiroku đã báo cáo cho tôi rồi."
2706 = "Nếu xử lý sớm, thì có thể khôi phục lại như không có chuyện gì xảy ra."
2711 = "Nhờ truyền đạt xong tôi cũng thấy nhẹ nhõm. Nếu nói đến nghỉ ngơi thì quả nhiên giấc ngủ là tốt nhất mà……"
2720 = "Bằng cách đâm cuốc chim vào \\x%lバラスト;#00ffc040;đá ba-lát%l;#;, làm tơi và xê dịch \\x%lバラスト;#00ffc040;đá ba-lát%l;#;, rồi lập tức vung lên."
2722 = "Kết quả điều tra sau khi đưa đội chuyên gia vào, nói thẳng ra thì chẳng khác nào công cốc."
2723 = "Tại sao cô ấy lại nghĩ rằng mình có thể yên tâm nghỉ hưu—— Tôi cảm giác mình đã hiểu được phần nào lý do đó."
2725 = "Vừa vào vị trí, Olivy liền vung cao chiếc cuốc chim lên."
2727 = "Từ những lời lẽ lộn xộn ấy, tôi cũng cảm nhận được rõ ràng khao khát mãnh liệt của Olivy."
2734 = "Như thể muốn truyền đến tận Kagoshima, đến tận Yatsushiro. Đến tận tai của anh Munakata vậy."
2738 = "Nhận được lời phủ định rõ ràng, tôi thở phào nhẹ nhõm. Đồng thời, tôi cũng tò mò về cơ sở của lời nói đó."
2750 = "Để không phủ nhận Niiroku đang mở lòng với mình, tôi chỉ ậm ừ đáp lại, nhưng chuyện đó là không thể nào."
2754 = "Nhận lấy nhiệt kế Olivy đưa cho——"
2755 = "Cuộc trò chuyện của chúng tôi cũng đang được theo dõi. Nếu Navi không lên tiếng đính chính, thì phép đo của Niiroku là chính xác."
2756 = "Nụ cười của Olivy rạng rỡ đến mức, người nhìn cũng muốn cười theo."
2759 = "Olivy và tôi đứng đối diện nhau qua đường ray, kẹp \\x%l枕木;#00ffc040;tà vẹt đường ray%l;#; ở giữa, và trong tư thế đó, cùng lúc đầm chặt xuống."
2762 = "Những ký ức và nhận thức đan xen vào nhau."
2764 = "Khi tôi nhẹ nhàng rút nhiệt kế ra khỏi miệng, Hachiroku cũng rất tự nhiên lau sạch bề mặt."
2765 = "Những tiếng rên rỉ đau đớn đó—— Niiroku và Akai Guuji, như muốn truyền đạt điều gì đó."
2767 = "Thấy tôi không trả lời, có lẽ Hibiki cũng đã nhớ ra."
2770 = "Trái tim tôi đập mạnh hơn hẳn, so với lúc phát hiện ra đồng hồ tốc độ bị hỏng."
2772 = "Tôi liếc nhìn Hachiroku, em ấy lập tức gật đầu đáp lại."
2773 = "Ngay lập tức, hai má Olivy phồng lên."
2776 = "Cứ tưởng Olivy ngồi xổm xuống, ai dè cô ấy vươn người bật nhảy thật cao, tung chiếc mũ lên không trung."
2778 = "Thế nên, tôi thấy lo lắng. Việc xung quanh hoàn toàn không có dấu hiệu bất thường nào."
2780 = "Vì thế, Olivy cũng đồng ý. Đồng ý là vậy——nhưng hai má vẫn cứ phồng lên."
2782 = "Do đó, theo như lời hứa, tôi đã để cô ấy giám sát ở đây, nhưng——"
2783 = "Thế nên, tôi áp sát tai xuống đường ray, nhìn kỹ vào địa điểm được chỉ——thì."
2785 = "Thế nên, nếu xoay vòng bốn lần để tôi vào vị trí của Olivy, thì sẽ giữ được sự cân bằng tốt nhất."
2790 = "Việc hướng dẫn đã hoàn tất, xét đến việc kéo dài tuổi thọ cho Olivy, thì việc đảm nhận công việc trên \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; là hoàn toàn không được khuyến khích."
2792 = "Còn lại, chỉ cần dừng tại ga suối nước nóng Ohitoyo nữa thôi. ……Quá trình chỉ dẫn dài đằng đẵng của Olivy cũng sẽ hoàn toàn khép lại."
2802 = "Chéo nhau."
2803 = "Nếu vậy, tôi cũng muốn trân trọng cảm xúc của Olivy. Nghĩ vậy, lời nói tự nhiên tuôn trào."
2805 = "Nếu vậy thì. Chẳng còn gì phải lo lắng nữa."
2808 = "Dù vậy, khao khát đó vẫn không ngừng cháy bỏng."
2828 = "Tiếng \\x%l喚呼;#00ffc040;hô xác nhận%l;#; chi tiết khác hẳn ngày thường, chắc là do căng thẳng vì đang trong bài kiểm tra."
2829 = "Thao tác dừng tàu được thực hiện nhanh gọn, Hibiki lấy chiếc đồng hồ đường sắt của mình ra từ túi áo ngực."
2835 = "Hibiki dang rộng hai tay hết cỡ, duỗi thẳng tắp cho đến tận đầu ngón tay."
2837 = "Hibiki khẽ hít sâu một hơi."
2839 = "Thấy Hibiki vui vẻ quá đỗi, tôi bỗng muốn trêu chọc con bé một chút."
2842 = "Nụ cười của Hibiki lại thay đổi. Sự an tâm, niềm vui sướng lan tỏa khắp khuôn mặt con bé."
2843 = "Giọng Hibiki nghe rất căng thẳng. Cũng phải thôi. Bình thường chúng tôi đâu có để ý chi tiết đến từng 1 km/h như vậy."
2845 = "Hibiki mỉm cười. Ánh mắt vẫn không hề xao nhãng, nhưng con bé vẫn nở một nụ cười rạng rỡ đặc trưng của mình."
2847 = "Sự căng thẳng trên khuôn mặt Hibiki tan biến, nụ cười dần trở nên mềm mại, trở lại là khuôn mặt của Hibiki khi ở nhà."
2848 = "Hibiki giật mình chớp mắt một cái, nhưng ngay lập tức quay lại tập trung nhìn về phía trước."
2854 = "Đến mức sẵn sàng đặt lên bàn cân với khoảng thời gian bên ông Munakata vào mùa xuân tới mà cô ấy đã mong ngóng bấy lâu. Cô ấy coi trọng ca trực hôm nay, coi trọng việc bàn giao công việc đến nhường nào."
2860 = "Từ cách nói chuyện của một người hoàn toàn xa lạ mà lại liên tưởng đến tôi."
2862 = "Giọng nói pha lẫn sự căng thẳng của Hibiki khiến cảm giác sai sai kia trở nên rõ ràng."
2864 = "Tự lừa dối bản thân, quên đi nỗi đau, chịu đựng sự thống khổ, tôi chợt cảm thấy đó có lẽ là một khổ nhục kế."
2869 = "Paulette không thể nào phớt lờ chuyện đó, mà ra lệnh cho Olivy đảm nhận công việc hay đi cùng tàu được."
2874 = "Từ Ohitoyo đi Hayato. Quay đầu lại, hoàn thành chuyến đi từ Hayato về Ohitoyo thì trời cũng sẩm tối."
2875 = "Thấy Olivy đã đồng ý với đề xuất của chúng tôi và hoàn toàn bình tĩnh lại, tôi mới thở phào nhẹ nhõm."
2877 = "Lý do mà Hachiroku từng kinh ngạc thốt lên \"Thậm chí không thể cảm nhận được sự tồn tại\", cuối cùng cũng đã sáng tỏ."
2878 = "Tất nhiên là vẫn còn vài điểm nhỏ cần cải thiện phải chỉ ra."
2882 = "Nhìn thấy Olivy, nghe thấy giọng cô ấy, những hành khách đang bắt đầu tản đi lại tụ tập lại."
2883 = "——Và rồi, Hibiki kéo \\x%lブレーキ;#00ffc040;phanh%l;#;. Chậm hơn một nhịp so với thường lệ."
2886 = "Nhìn nụ cười ấm áp của Hachiroku, đôi mắt tôi ngập tràn niềm vui. Và rồi, đôi tai tôi cũng nhanh chóng đón nhận."
2889 = "Tiếng \\x%l汽笛;#00ffc040;còi hơi nước%l;#; cảnh báo cực kỳ ngắn. Đoạn này cũng dễ dàng vượt qua."
2899 = "Việc xác nhận tại hiện trường nhẹ nhàng hơn nhiều so với trực ca, nếu kiểm tra lại mà ở ngưỡng an toàn thì cũng chẳng có lý do gì để ngăn cản."
2902 = "Những khuôn mặt háo hức muốn chụp ảnh cùng đầu máy số 9, người thì selfie, người thì nhờ người xung quanh chụp hộ."
2904 = "Lần đầu tiên, buồng lái đầu máy số 9 không có Olivy, bình thường Olivy đã phải nhường nào――――?"
2906 = "Đầu máy số 9 gắn gạt chướng ngại vật, và Olivy đứng trước đó. ——Không biết nụ cười của cô ấy lúc đó sẽ rạng rỡ đến nhường nào nhỉ."
2909 = "Đôi mắt vẫn dán chặt về phía trước, dần trở nên tĩnh lặng và điềm tĩnh."
2914 = "Tôi cẩn thận giữ phần đuôi nhiệt kế, trong suốt một phút."
2915 = "Sau đó con bé lại đưa mắt nhìn quanh sân ga một lần nữa, rồi ngơ ngác nhìn tôi với vẻ mặt khó hiểu."
2916 = "Đáp lại tiếng hô đó, ánh mắt Nagi, và cả ánh mắt Niiroku, nhanh chóng kiểm tra các đồng hồ đo."
2917 = "Những viên đá dăm bị đâm tơi ra, bay lả tả theo chuyển động tự nhiên của chiếc cuốc chim."
2921 = "Nhận được sự xác nhận từ Niiroku, nụ cười của Hibiki nở rộ rạng rỡ."
2922 = "Khoảnh khắc nghe thấy con số, một nỗi bất an trào dâng. Theo phản xạ, tôi cảm thấy tốc độ đó là quá chậm."
2923 = "Khoảnh khắc nghe đến hai chữ \"nghỉ hưu\", tôi chợt nhận ra sự thiếu hiểu biết của mình."
2924 = "Chỉ nghe vậy thôi mà tôi cũng thấy vui lây. Hình ảnh đó hiện lên ngay trong tâm trí tôi."
2925 = "Vừa nghe xong, một nỗi bất an trào dâng trong tôi, nhưng cũng vì thế, tôi đã hiểu ra vấn đề."
2926 = "Nghe tôi hỏi, Olivy lại lắc đầu quầy quậy, nhưng lần này thì trông có vẻ yếu ớt."
2927 = "Nghe vậy, Olivy lắc đầu quầy quậy."
2928 = "Sau đó nhìn kỹ lại lần nữa, cái đầu dẹt như cái xẻng đó, chính là đầu chủ yếu được sử dụng trong việc \"đầm chặt lớp đá nền\"."
2933 = "Những biểu hiện như vậy, ít nhất là tôi không hề nhận ra——!!"
2935 = "Nếu chỉ vì thiếu đi \"một phút\" đó, mà ông Munakata và Olivy lỡ mất cơ hội đoàn tụ thì sao——"
2936 = "Vừa lẩm nhẩm bài hát bắt nhịp được các công nhân bảo trì đường ray truyền tai nhau, Olivy và tôi vừa phối hợp nhịp nhàng——"
2944 = "Nghe nói vậy nhìn lại thì thấy có gì đó sai sai. Nhưng với tôi bây giờ, chỉ nhìn lướt qua thì không thể thấy được mức độ sai lệch."
2962 = "Một lời nhắc nhở nhẹ nhàng——nhưng lại vô cùng nặng nề. Đến cả tôi cũng không khỏi rùng mình khi nghĩ đến."
2963 = "Niiroku khẽ rùng mình một cái."
2964 = "Nói rồi cười. Olivy chỉ tay về phía bên kia đường ray."
2971 = "Vì là một người vợ hiền thục nên không nói ra miệng, nhưng ánh mắt vui vẻ của Suzu—— à không, của Hachiroku, khiến tôi có cảm giác như em ấy đang nói vậy."
2977 = "Về điểm đó, tôi hoàn toàn đồng ý."
2978 = "Đây chính là đội ngũ do Olivy bồi dưỡng. Đây là những gì Olivy gửi gắm sao."
2979 = "Olivy khẽ nghiêng đầu thắc mắc."
2980 = "Kim đồng hồ tốc độ là dạng cơ——chủ yếu xử lý bằng cảm giác thị giác. Thế nên nếu cứ bị ám ảnh bởi những con số chi tiết, thì đối với người như tôi lại càng——"
2982 = "Kim đồng hồ tốc độ vẫn vậy, không có dấu hiệu nhúc nhích. Nhưng tốc độ giảm này là hoàn toàn chính xác."
2983 = "Không hề giảm xuống. Kim đồng hồ tốc độ hoàn toàn——không nhúc nhích chút nào từ nãy đến giờ."
2992 = "Ngay cả tôi còn nghĩ vậy, thì đối với Olivy chắc chắn càng sâu sắc hơn."
2994 = "Thì điều đó cũng đồng nghĩa với việc, sẽ làm tăng gánh nặng cho Olivy."
2995 = "Nhìn nụ cười rạng rỡ ấy, tôi chợt nghĩ trong thoáng chốc. Phải chăng Olivy thích \\x%l保線;#00ffc040;bảo trì đường ray%l;#; hơn là làm nhân viên trên tàu."
3012 = "Trong tích tắc, tôi và Hachiroku vô thức chạm mắt nhau, rồi thở phào nhẹ nhõm."
3013 = "Cùng với một chấn động cực kỳ nhẹ, đoàn tàu chầm chậm dừng lại——tất cả \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; đều đứng yên."
3015 = "Với tốc độ giảm mượt mà, đoàn tàu từ từ tiến vào sân ga. Phần còn lại chỉ là nới lỏng lực hãm, tránh để tốc độ giảm quá nhanh——"
3016 = "Che giấu, hay nói đúng hơn là……"
3017 = "Chỉ qua âm sắc ấy, đã truyền đạt thông điệp \"Xin hãy bình tĩnh lại\"."
3018 = "Thật sự rất biết ơn và vui mừng, nhưng nghĩ đến tuổi tác của ông ấy, cảm giác có lỗi lại lấn át hơn."
3019 = "Dù rất vui, nhưng nói thật lòng thì, tôi không muốn để Hachiroku phải gánh vác công việc bảo trì đường ray—— một công việc lao động chân tay đơn thuần."
3020 = "Dù nghĩ rằng không cần thiết phải làm đến mức đó, nhưng cũng không thể lấy lý do mỏng manh ấy để từ chối được."
3021 = "Dù biết là còn quá sớm để chìm đắm trong sự đa cảm, nhưng tôi không thể ngăn những dòng suy nghĩ ấy trào dâng."
3022 = "Dù hiện tượng phình lên vẫn còn, nhưng chúng tôi chỉ có thể chữa cháy tạm thời. ……Liệu tình trạng này sẽ còn kéo dài bao nhiêu năm nữa đây."
3029 = "Niềm vui khi hoàn thành công việc và sự sung sướng khi được khen ngợi, đang hòa quyện vào nhau một cách tuyệt đẹp."
3030 = "Nếu thuận lợi thì sáng nay sẽ nghỉ hưu. Nhưng chiều nay, lại muốn có ngày làm việc đầu tiên với tư cách là nhân viên hợp đồng."
3047 = "Cao. Thật cao. Cao vút. Như thể hòa tan vào bầu trời xanh thẳm."
3051 = "Đôi má phồng, cái miệng chu ra, cũng đồng thời xẹp xuống."
3052 = "（……Đừng vội. Sẽ ổn thôi. Đến đây rồi thì Navi cũng đang hỗ trợ từ trên không trung mà.）"
3066 = "（Nhưng mà, ừm——cảm giác cũng không tệ chút nào.）"
3067 = "（A, quả nhiên là vậy.）"
3068 = "（Tu!）"
3069 = "（Phập） （Phập）"
3070 = "（Ư——）"
3072 = "（Sao thế này…… cảm giác có gì đó sai sai——a）"
3074 = "（A——）"
3075 = "（Phập） （Phập）"
3076 = "（Phập） （Phập）"
3078 = "（Tít tít tít, tít tít tít, tít tít tít）"
3081 = "（Một chặng đường dài——nhưng ngẫm lại cứ như một chớp mắt.）"

