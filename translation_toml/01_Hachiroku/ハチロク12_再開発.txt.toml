2313 = "「Cái đó chỉ là yếu tố cực kỳ nhỏ thôi.」"
2316 = "「Muộn hơn tôi nghĩ——à, không, nếu đi từ Ohitoyo\\nthì qua cầu xong, phải vượt qua một đoạn dốc thoai thoải mới tới ga nhỉ.」"
2317 = "「Đúng vậy. Không phải hội đồng, mà là biến toàn bộ người dân thành đồng minh.\\nKhông có công việc kinh doanh nào tồn tại được nếu bị người dân ghét bỏ cả.」"
2318 = "「Đúng vậy. Thế nên.」"
2319 = "「Đúng vậy. Tuy nhiên, để làm được điều đó cần có thời gian.\\nNhững nỗ lực tích lũy từng chút một, chính vì nó âm thầm nên rất khó để lan tỏa.」"
2320 = "「Không, anh chỉ đang tự kiểm điểm vì dừng tàu hơi sớm thôi.\\nQuan trọng hơn là, em đi cẩn thận nhé?」"
2327 = "「Paulette.\\nNếu có cột mốc nào vừa vặn để dừng tàu thì chỉ tôi với.」"
2332 = "「Urakami đã bị gọi về rồi. Có vẻ như trong vài ngày tới,\\ncông ty Aero-Craftech sẽ cử một người phụ trách khác đến.」"
2334 = "「Tuyệt vời! Anh hai——ưm, anh trai.」"
2338 = "「Vậy nên, anh hai——à không, anh trai.\\nƯm, bọn em, nếu được thì.」"
2345 = "「Sự phát triển rồi sẽ có lúc dừng lại, nhưng xung đột thì vẫn mãi tồn tại.\\nMột tương lai như vậy, em không nghĩ là phù hợp với Ohitoyo đâu.」"
2346 = "「Hội đồng thành phố hiện tại cực kỳ có thiện cảm với Công ty Đường sắt Ohitoyo.\\nNếu đưa ra một dự luật tái phát triển khả thi, khả năng cao sẽ được thông qua.」"
2347 = "「Có vẻ như mọi người đã có một buổi khảo sát đầy ý nghĩa nhỉ.」"
2350 = "「Em thấy đây là một phương án rất thú vị ạ.」"
2351 = "「Không có sao, thật sự đấy.」"
2360 = "「Quả thật là hơi nóng——nhưng có lẽ chỉ là do sự kết hợp đơn thuần giữa nhiệt độ, tình trạng \\x%l踏面;#00ffc040;mặt lăn bánh xe%l;#;,\\nvà ảnh hưởng từ việc gọt lại \\x%lフランジ;#00ffc040;gờ bánh xe%l;#; thôi ạ.」"
2364 = "「Ở cấp độ nhân viên thì bầu không khí từ bỏ việc mời gọi đang khá mạnh.\\nNhưng——Giám đốc vẫn chưa từ bỏ việc mời gọi nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;.」"
2369 = "「Đợi \\x%l8620;#00ffc040;8620%l;#; hoạt động trở lại,\\nReina muốn nhờ mọi người đại tu động cơ ngay luôn đó ạ~」"
2370 = "「Thôi, giờ cứ tạm gác lại, phải hoàn thành công việc được giao đã.」"
2375 = "「Bọn em ngủ lại đây——để tiếp tục khảo sát, có được không ạ?」"
2377 = "「Khảo sát gì vậy ạ?」"
2378 = "「Ngài Soutetsu có thể——\\nchạm vào, và tự mình xác nhận được không ạ?」"
2381 = "「Thành lập công ty cổ phần cùng các công ty đường sắt khác——\\nCả về mặt vốn lẫn uy tín, đó là điều bắt buộc phải không.」"
2396 = "「Nếu là gợi ý cho ngài Soutetsu thì...」"
2399 = "「Dù vậy, cũng không thể để Hachiroku lại một mình được.」"
2400 = "「Chuyện đó, thì đúng là…… vậy, nhưng.」"
2401 = "「Đúng vậy. Không chỉ thế,\\nnếu khảo sát thực địa, biết đâu lại nảy ra phương án mới.」"
2402 = "「Chính xác.」"
2403 = "「Việc khảo sát thế nào rồi?」"
2407 = "「C-Của ngài đây ạ.」"
2408 = "「Ngài muốn mua vé đi đến đâu ạ?」"
2409 = "「Từ ga Hachiroku đến ga Soutetsu, một người lớn,\\ncho tôi một vé tốc hành không thời hạn nhé.」"
2410 = "「Cảm ơn.\\nVậy thì, tấm vé này là quà tặng cho Hachiroku đấy.」"
2413 = "「Cảm xúc của hội đồng và cảm xúc của người dân là hai thứ khác nhau. Ra khỏi khu vực quanh ga\\nthì người dân——đúng rồi, khoảng một nửa vẫn chưa tin tưởng vào đường sắt.」"
2414 = "「Để mọi người đợi lâu rồi.」"
2415 = "「Để ngài đợi lâu rồi, ngài Soutetsu.」"
2428 = "「Ý nghĩa lắm luôn! Cực kỳ vui luôn á!!」"
2431 = "「Tụi em đi nha!」"
2432 = "「Nhà ga sao, ra là vậy.\\nNếu đã tái phát triển thì cũng phải tái sử dụng nhà ga nữa mà.」"
2460 = "「Về chuyện đó, em vốn đã hiểu rõ rồi ạ.」"
2461 = "「Không phải đi chơi đâu. Nghịch ngợm là bị thương đấy nhé?」"
2462 = "「Phần nhô ra này chính là \\x%lフランジ;#00ffc040;gờ bánh xe%l;#;. Nhờ có nó\\nmà tàu mới khó bị trật bánh khi vào cua.」"
2464 = "「À…… Ở giai đoạn đầu chạy thử,\\ntôi muốn tránh việc chạy một mạch đến Yui.」"
2465 = "「Để xem nào——Tôi chưa quyết định điểm đến cụ thể.」"
2466 = "「Tuyệt quá. Cho tôi một vé nhé.」"
2467 = "「Cách cầm là như thế này ạ,\\ndùng ngón cái và ngón trỏ kẹp phần trên——」"
2468 = "「Chà, ai biết được. Nhưng——nói cực đoan thì,\\nđối với người đó, giữ được 50 năm có lẽ là quá đủ rồi.」"
2469 = "「Chà, ai biết được. Cũng có thể do tôi biết quá rõ về ông ta,\\nnên mới đánh giá quá cao không chừng.」"
2470 = "「Sao nhỉ? Em đã tiến hành kiểm tra theo chỉ thị,\\nvà ghi lại số liệu rồi, nhưng ý nghĩa của chúng thì em chịu ạ.」"
2471 = "「Cũng giống như lý do tôi ủng hộ Kế hoạch Grand Kyushu SL thôi.\\nOhitoyo là một vùng đất đắc địa để nhắm đến khu vực trung tâm Kyushu mà.」"
2472 = "「Bản kế hoạch này là vì mục đích đó sao.」"
2473 = "「Thế này thì——khó mà biết được nhỉ.」"
2474 = "「Vậy sao, Hachiroku cũng không hiểu à.\\nTôi cũng thế.」"
2475 = "「Như vầy hả, hừm.」"
2476 = "「Vậy là từ giờ,\\nchúng ta có thể qua lại thăm nhau rồi ngài nhỉ?」"
2477 = "「Nếu vậy, buồng lái sẽ có thêm hai người nữa sao.」"
2478 = "「Nơi này thì sao ạ?」"
2479 = "「Chỗ này, em có thấy phần nhô ra trên \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; không?」"
2481 = "「Đến cả anh Fuchi của nhà sản xuất cũng phải hết lời khen ngợi em\\nđúng là chiếc xe đầu tiên cơ mà.」"
2483 = "「Với lại, 07S dạo này cũng phải chịu tải khá lớn,\\nhơn nữa hiện tại các kỹ thuật viên cũng đang ở đây nên——」"
2484 = "「Xin ngài hãy đợi thêm một chút nữa thôi ạ.」"
2486 = "「Thế——\\nĐánh giá của Hachiroku thì sao?」"
2488 = "「Khu vực đó là đất công——\\nMọi người có biết đó là đất thuộc sở hữu của thành phố Ohitoyo không?」"
2492 = "「Chuyện đó?\\n……À, lúc được Thị trưởng Paulette gọi đến ấy ạ?」"
2493 = "「Người đó lại cho rằng thế là tốt. Xung đột, hay đôi khi là sự thù ghét,\\nquả thực có thể thúc đẩy sự phát triển và trưởng thành.」"
2494 = "「Chuyện đó——」"
2496 = "「Vậy thì, tạm thời nhờ mọi người như thế nhé?」"
2498 = "「Mong muốn của chị Kisaki, anh có thể thực hiện được không?」"
2500 = "「Nếu vậy, sau khi dừng tàu tại ga mỏ than Jutsusen và kiểm tra xong các bộ phận,\\nmọi người có thể khảo sát luôn nhà ga được không?」"
2502 = "「Vậy, nhờ mọi người sắp xếp càng sớm càng tốt nhé.\\nTôi sẽ ưu tiên lịch trình này lên hàng đầu.」"
2503 = "「Nếu vậy, chỉ cần lấy lại lòng tin là được.」"
2506 = "「Nghe nói trong giới hâm mộ đường sắt, có những người được gọi là người mê tuyến đường bỏ hoang——\\nNhưng có vẻ tôi không thể trở thành người như vậy được rồi.」"
2508 = "「Nếu chỉ đến ga bỏ hoang mỏ than Jutsusen, thì nên chạy tiếp đến Yui rồi vòng lại,\\nhay là chạy lùi về Ohitoyo…… cách nào sẽ tốt hơn ạ.」"
2509 = "「Quan tâm, và chăm sóc……」"
2511 = "「Anh hai, Hachiroku, cho em hỏi một xíu được không?」"
2513 = "「Anh hai, sao vậy?」"
2514 = "「Cũng không phải là không được——nhưng sẽ khá chật chội đấy ạ.」"
2515 = "「Có lẽ đây là minh chứng cho việc——\\nmỏ than Jutsusen từng một thời hưng thịnh.」"
2516 = "「Ng-Ngài Soutetsu?」"
2517 = "「Ngài Soutetsu.」"
2518 = "「Ngài Soutetsu——Ngài có thể \\x%l入鋏;#00ffc040;bấm vé%l;#; cho tấm vé này được không ạ?」"
2520 = "「Ngài Soutetsu? Mời ngài vào đây ạ.」"
2523 = "「Cảm ơn mọi người.\\nĐược vậy thì bên tôi cũng yên tâm.」"
2524 = "「Cảm ơn mọi người. Một buổi thảo luận thật ý nghĩa.\\nAnh Soutetsu, và mọi người. Từ nay mong được giúp đỡ nhiều hơn.」"
2528 = "「Rất hoan nghênh. Tuyến xuôi dòng sông Kuma——nói thế này thì hơi kỳ,\\nnhưng tôi đánh giá rất cao năng lực của các em khi đã không để nó bị dẹp bỏ.」"
2529 = "「Trước tiên, chúng ta sẽ mang dữ liệu chạy thử và \\x%l8620;#00ffc040;8620%l;#;\\ntrở lại cho các kỹ thuật viên xem xét.」"
2537 = "「!」"
2538 = "「!!?」"
2539 = "「\\x%l台枠;#00ffc040;Khung gầm%l;#; của 58623. Với cái này, chúng ta có thể sử dụng lâu dài——\\nvà trân trọng nó.」"
2550 = "『「!?」\\n「Cái gì!」』"
2721 = "Kế hoạch này vừa kế thừa kỹ thuật bảo dưỡng, vừa kết hợp làm cơ sở tham quan du lịch,\\nđồng thời đóng vai trò làm phương tiện dự phòng cho các xe đang vận hành thực tế."
2723 = "Có vẻ em ấy hơi thẫn thờ một chút,\\nnhưng khuôn mặt quay lại nhìn tôi vẫn là Hachiroku thường ngày."
2724 = "Tôi còn chưa dứt lời, hai cô phụ lái tàu đã tranh nhau\\nnhảy từ buồng lái xuống sân ga."
2727 = "Dù vậy, đây cũng chỉ là kiến thức phòng hờ cho chắc ăn thôi."
2732 = "Không hề cảm thấy buồn nôn hay chóng mặt,\\nhiện tại tôi chỉ thấy hoàn toàn sảng khoái."
2736 = "50 năm…… Đó có lẽ là khoảng thời gian mà Kisaki dự đoán,\\ncho phần đời còn lại của người đó——Houshou Mototada."
2741 = "Miễn sao không bị chạy lố đà,\\ntôi sẽ thao tác với sự an toàn là ưu tiên hàng đầu."
2745 = "Chỉ có tờ giấy \"Thông báo\" chắc là thông báo bỏ hoang ga,\\nđã bị bong tróc một nửa, chỉ còn trơ trọi lại chữ \"báo\" mà thôi."
2767 = "Cả hai cùng thốt lên vì kinh ngạc,\\nrồi nhường nhau nói tiếp khiến không gian rơi vào im lặng trong thoáng chốc."
2769 = "Hachiroku cũng hiểu ngay lập tức."
2774 = "Hachiroku ngồi xổm bên cạnh đường ray,\\nchỉ vào phần bên trong của \\x%l動輪;#00ffc040;bánh xe chủ động%l;#;."
2778 = "Nghe tôi nói vậy,\\nHachiroku liền đặt tay lên \\x%l動輪;#00ffc040;bánh xe chủ động%l;#;."
2781 = "Hiện tại Hachiroku đang có phong độ rất tốt, đặc biệt là lần đầu tiên này,\\ntôi không nên làm gì thừa thãi, cứ để Hachiroku tính toán thì hơn——"
2783 = "Hachiroku khẽ dang rộng hai tay,\\nvà lặp lại lời tôi như thể đang nghiền ngẫm."
2786 = "Như muốn trốn chạy,\\nHachiroku vội vàng nhảy xuống khỏi buồng lái."
2788 = "Hachiroku khẽ đặt lòng bàn tay lên tay tôi.\\nKhông chút do dự, tôi nắm chặt lấy bàn tay ấy."
2789 = "Bàn tay Hachiroku nắm lấy tay tôi."
2790 = "Hachiroku là một đồ vật, là một \\x%lレイルロオド;#00ffc040;Railord%l;#;——\\nNhưng đồng thời, em ấy cũng chắc chắn đang sống."
2794 = "Chỉ cần nghe thấy tiếng động Hachiroku đang khảo sát bên trong,\\nlòng tôi đã trở nên mềm mại và ấm áp đến nhường này."
2796 = "Không thấy Hachiroku chỉ thị gì.\\nVậy là muốn tôi tự phán đoán đây mà."
2801 = "Hachiroku đưa mắt nhìn quanh buồng lái,\\nrồi nhẹ nhàng vuốt ve tay cầm \\x%l逆転機;#00ffc040;cần đảo chiều%l;#;."
2804 = "Ánh mắt Hachiroku lần lượt lướt qua Kisaki, Hibiki,\\nNagi và Fukami."
2806 = "Hachiroku lộ vẻ hơi căng thẳng,\\ntừ từ hít một hơi thật sâu."
2808 = "Đôi má Hachiroku bỗng chốc đỏ ửng lên."
2809 = "Nhận được sự hướng dẫn tận tình chu đáo——\\nNhưng việc \\x%l入鋏;#00ffc040;bấm vé%l;#; chỉ diễn ra trong chớp mắt."
2813 = "Hachiroku nhìn chằm chằm vào tôi.\\nÁnh mắt và cả bàn tay em ấy đều không hề rời đi."
2815 = "Hachiroku khẽ bật nhảy một cái."
2817 = "Đang háo hức định quay lại nhà ga bỏ hoang——\\nthì bước chân em ấy đột ngột xoay ngược lại."
2818 = "Hachiroku cắm cúi viết gì đó lên tờ giấy trên tay."
2819 = "Gật đầu.\\nÁnh mắt Hachiroku nhìn tôi lại ánh lên chút xót xa."
2828 = "Tiếp theo là Fukami, Nagi và Kisaki.\\nNhìn ra sân ga, bóng dáng Hachiroku đã không còn."
2833 = "Kìm soát vé tuột khỏi tay rơi xuống.\\nNhưng tôi chẳng màng đến việc nhặt nó lên."
2836 = "Việc cải tạo bộ giới hạn tốc độ cũng cần được kiểm tra lại ảnh hưởng,\\nvà quả thực con bé đã phải chịu tải khá nhiều."
2839 = "Giả sử, mười năm nữa trôi qua mà không có bất kỳ biện pháp nào——\\nMôi trường đường sắt lúc đó chắc chắn sẽ còn tồi tệ hơn bây giờ rất nhiều."
2853 = "Khác với hầu hết các ga bỏ hoang trên tuyến Yui,\\nnhà ga này được xây dựng khá kiên cố."
2854 = "Dù không trực tiếp chạm tay vào \\x%l8620;#00ffc040;8620%l;#;, nhưng qua việc nấu ăn, dọn dẹp hay xử lý giấy tờ,\\nchúng tôi vẫn luôn được mọi người hỗ trợ."
2859 = "Ưm, thật là……\\nSao tự dưng thấy ngại ngùng thế này."
2860 = "À——Có vẻ là giấy viết vé thủ công.\\nNgày xưa người ta dùng loại này sao."
2863 = "À, lại vòi vĩnh rồi.\\nMà chắc chắn cũng chẳng phải chuyện gì tốt đẹp."
2865 = "Lựa chọn linh kiện, đánh bóng kỹ lưỡng, tra dầu cẩn thận——\\nChính những tích lũy nhỏ nhặt đó đã làm thay đổi cảm giác lái."
2867 = "Trong mắt một người dễ dãi như Hibiki, hay người không có kinh nghiệm như Kisaki\\nthì có vẻ là tuyệt vời, nhưng với Hachiroku thì——"
2868 = "Ở bên trong nhà ga, Hachiroku\\nđang cặm cụi một mình thực hiện các bài kiểm tra được giao."
2874 = "Tâm lý đối kháng với Houshou Mototada, người vừa là cha vừa là Giám đốc ngân hàng,\\ncó lẽ đã ảnh hưởng rất lớn đến cô ấy."
2876 = "Khuôn mặt em ấy, có chút cứng đờ."
2878 = "Đôi mắt xanh liếc nhìn Reina.\\nReina vui vẻ gật đầu."
2879 = "Dáng vẻ vội vã đó——tình hình có lẽ\\ncòn cấp bách hơn cả những gì chúng tôi nhận thức."
2882 = "Nếu tôi là một du khách,\\nchắc tôi sẽ chẳng cảm nhận được chút phong vị lữ hành nào từ nhà ga này."
2884 = "Nếu buông bỏ mà nó vẫn ở lại, thì cũng tốt.\\nNếu buông bỏ mà nó rời xa, thì cũng chẳng sao."
2886 = "Bắt chước em ấy, tôi cũng nhún vai một cái."
2887 = "Hoàn toàn không hiểu nổi. Thậm chí còn chẳng cảm thấy buồn bã mấy.\\nNếu buộc phải kể ra một thứ khiến tôi thấy chút xót xa thì——"
2892 = "Giao kìm soát vé vào tay tôi, em ấy đón lấy tấm vé bằng cả hai tay,\\nrồi thở hắt ra một hơi đầy hạnh phúc."
2893 = "Sau khi nhìn đồng hồ và \\x%l喚呼;#00ffc040;hô xác nhận%l;#;,\\nHachiroku ngước lên nhìn tôi với khuôn mặt rạng rỡ."
2901 = "Dù là chạy thử đi chăng nữa,\\nnhưng tôi có cảm giác em ấy kiểm tra quá lỏng lẻo thì phải——"
2903 = "Vừa dứt lời chào hỏi,\\nKisaki liền vội vã rời đi."
2915 = "Xây dựng nhà tưởng niệm kết hợp với cơ sở bảo dưỡng cải tạo, thực hiện bảo dưỡng ở mức độ cao hơn lưu tĩnh,\\nđể có thể vận hành bất cứ lúc nào——nói cách khác là bảo tồn các SL ở trạng thái bán động."
2926 = "Công ty Đường sắt Ohitoyo hiện tại,\\nđặc biệt là về mảng \\x%l保線;#00ffc040;bảo trì đường ray%l;#;, phụ thuộc rất lớn vào tình nguyện viên."
2933 = "Tôi cảm thấy một sự thỏa mãn hết sức giản đơn——\\nNhưng có lẽ, về mặt xấu, chúng tôi cũng có chung suy nghĩ."
2940 = "Mong muốn được thấy \\x%l8620;#00ffc040;8620%l;#; lăn bánh——\\nCảm xúc đó đã ngập tràn khắp xưởng đầu máy."
2948 = "Đánh giá xong rồi.\\nĐáng lẽ chúng tôi cũng phải nhanh chóng đi kiểm tra các bộ phận mới phải."
2950 = "Tôi cảm thấy mình đã có thể buông bỏ\\nthứ mà tôi luôn nắm chặt bấy lâu nay."
2957 = "Cùng lúc với \\x%l喚呼;#00ffc040;hô xác nhận%l;#;, tôi thao tác \\x%l自弁;#00ffc040;van hãm tự động%l;#;."
2959 = "Thấy vui vui,\\ntôi cũng tự nhiên hùa theo trò chơi đóng giả của em ấy."
2961 = "Tất nhiên là chúng tôi cũng sẽ đuổi theo sau để kiểm tra các bộ phận,\\nnhưng trước đó, trong lúc cảm giác lái vẫn còn, có một việc khác cần phải làm."
2965 = "Tôi cùng Hachiroku bước ra ngoài."
2967 = "Tôi và Hibiki là anh em mà,\\nnên dư sức đoán được bằng trực giác."
2968 = "Nghe tôi hỏi, Paulette lập tức gật đầu đáp."
2970 = "Tôi bất giác nghĩ như vậy.\\nDù thế nào đi nữa."
2971 = "Nếu nhìn nhận theo cách đó,\\nthì tôi cũng đành phải đồng ý."
2973 = "Tôi bế Hachiroku đặt vào buồng lái.\\nNgay sau đó, có tiếng lạch cạch đổi \\x%lタブレット;#00ffc040;thẻ bảng%l;#;."
2977 = "Tôi lấy bàn tay trái cong vào trong làm đường ray,\\nnắm đấm phải dựng ngón cái lên làm \\x%l列車;#00ffc040;tàu%l;#; rồi trượt đi."
2982 = "Cứ thế để em ấy dẫn dắt, tôi đặt tay lên ngực Hachiroku.\\nThật ấm áp. Thật mềm mại."
2983 = "Chắc tôi hơi quá đà rồi,\\ntôi dừng tay lại và đội mũ lại cho em ấy."
2985 = "Cơ thể tôi nóng ran lên.\\nNhịp đập mãnh liệt của chính tôi, dường như cũng truyền cả sang Hachiroku."
2986 = "Là điều không thể nào, và tôi cũng chẳng muốn làm."
2988 = "Tay tôi đưa ra, một cách tự nhiên."
2990 = "Nếu tôi đứng gần quan sát, có thể em ấy sẽ bị phân tâm.\\nVì đây là việc hoàn toàn không quen thuộc, nên chắc em ấy muốn tập trung——"
2991 = "Bằng cử động của tay,\\ntôi mô phỏng lại cảnh \\x%lフランジ;#00ffc040;gờ bánh xe%l;#; ma sát khi vào cua."
2993 = "Phương án của Paulette,\\ncó vẻ rất hợp lý và không hề dư thừa."
2998 = "Tôi dùng lý trí và tình cảm gạt phăng đi suy nghĩ vừa thoáng qua trong đầu."
2999 = "Tôi đã cắt hơi, phanh cũng đã đưa về \\x%l運転位置;#00ffc040;vị trí chạy tàu%l;#;."
3002 = "Bị đoán trúng tim đen sao——\\nLời của Kisaki khiến Paulette phải nín thở."
3011 = "Dù chúng tôi thỉnh thoảng cũng làm việc này,\\nnhưng quả nhiên thành phẩm của thợ chuyên nghiệp vẫn khác bọt."
3014 = "Đứng giữa không gian đó, Hachiroku vừa bấm kìm soát vé lách cách,\\nvừa ngước lên nhìn tôi bằng ánh mắt đầy háo hức."
3017 = "Còn lại chỉ cần xử lý các bước dừng đỗ——"
3018 = "Còn lại cứ để quán tính lo——a, chết tiệt."
3021 = "Vừa mới chuyển sang \\x%l整備体;#00ffc040;thân chính%l;#; và bước xuống buồng lái,\\nHachiroku lại một mình đi vào nhà ga bỏ hoang."
3040 = "Hibiki, Kisaki, Nagi và Fukami."
3042 = "Cùng với giọng nói lớn, con bé rướn người tới."
3043 = "Hibiki khẽ gật đầu,\\nrồi ngước lên nhìn tôi bằng đôi mắt nũng nịu."
3046 = "Giọng điệu phấn khởi ấy làm tôi suýt thì thở phào nhẹ nhõm.\\nNhưng, cũng không thể cứ thế mà lơ là được."
3047 = "Là Nagi.\\nĐược cứu rồi."
3051 = "Tàu đã dừng lại cách vị trí quy định đến tận hai mét."
3054 = "Một nhà ga bằng gỗ, thạch cao và sắt.\\nĐúng chuẩn hình ảnh nhà ga đường sắt thời xưa——thời \\x%l大詔;#00ffc040;Đại Chiếu%l;#;."
3057 = "Hachiroku cũng lên tiếng đồng tình với lời nói hết sức ngây thơ của Reina."
3058 = "Không có chỉ thị, cũng không bị nhắc nhở về việc dừng sai vị trí."
3065 = "Paulette lộ vẻ mặt áy náy,\\nnhưng trong giọng nói lại không hề có sự do dự."
3066 = "Có tiếng nuốt nước bọt khẽ vang lên.\\nGiọng Paulette bắt đầu mang vẻ thận trọng hơn mức bình thường."
3067 = "Paulette vỗ tay cái bốp."
3070 = "Đoạn đường chạy thử nên được kéo dài dần dần,\\nđến ga bỏ hoang mỏ than Jutsusen là vừa đẹp."
3073 = "Để chắc ăn, tôi cẩn thận xác nhận lại phía trước,\\nrồi điều chỉnh lại vị trí dừng tàu cho chuẩn xác."
3074 = "Dù có bao nhiêu sự quan tâm, chăm sóc và nhiệt huyết đi chăng nữa, nếu không được định hướng đúng đắn,\\nthì cũng thành vô ích…… thậm chí còn có thể gây hại."
3076 = "Nhưng, lớp ván ốp ngoài có lẽ từng rất đẹp khi còn hoạt động,\\nnay đã bám đầy bụi bẩn, trông vô cùng rẻ tiền."
3080 = "Nghe vậy, tôi liền đưa tấm vé vừa nhận ra."
3084 = "Trễ một nhịp, cảm giác giảm tốc dần trở nên rõ rệt."
3088 = "Bởi vì hiện tại, chúng tôi gần như đã phản bội lại\\nnhững kỳ vọng được thổi bùng lên từ chuyến \\x%l列車;#00ffc040;tàu%l;#; BBQ."
3090 = "Tôi vẫn chưa muốn cho tàu chạy đường dài,\\ncũng không thể bỏ mặc \\x%l8620;#00ffc040;8620%l;#; để đi theo Kisaki khảo sát được."
3095 = "Chắc là đi thẳng từ ngân hàng đến.\\nHoushou Kisaki trong bộ âu phục, vừa ngồi xuống đã bắt đầu nói."
3098 = "Nhìn Hachiroku tinh nghịch nhún vai,\\ntôi chợt cảm thấy một sự đồng cảm kỳ lạ."
3099 = "Tôi đưa tay ra,\\nHachiroku lại mỉm cười."
3109 = "Khi không có Kisaki ở đây, Hibiki lại nói giọng Kumamoto tự nhiên."
3111 = "Kisaki gật đầu mạnh một cái, như thể muốn nói cuối cùng mọi người cũng hiểu."
3113 = "Thấy vậy, Kisaki liền nói tiếp."
3114 = "Kisaki gật đầu nhẹ,\\nvà nhún vai với điệu bộ hơi kịch tính."
3117 = "Nói rồi, Kisaki nhìn Hibiki như muốn thúc giục."
3121 = "Đợi một chút, lại \\x%l階段;#00ffc040;nhả phanh từng nấc%l;#; thêm lần nữa——\\nTấm biển báo dừng rỉ sét đang chầm chậm tiến lại gần."
3130 = "Và chặng đường ghi trên vé là,\\ntừ ga Soutetsu đến ga Hachiroku."
3131 = "Và rồi Hachiroku,\\ncất tiếng cười trong trẻo ngập tràn hạnh phúc."
3132 = "Sau đó, chuyển \\x%l単弁;#00ffc040;van hãm đơn%l;#; sang hãm nhẹ."
3135 = "Tôi được phân công đi vòng quanh bên ngoài nhà ga,\\nđể kiểm tra những thứ mà mắt người có thể nhận ra, nhưng——"
3137 = "Trước câu hỏi tự nhiên ấy,\\ntôi chợt nghĩ có lẽ mình đã suy nghĩ quá nhiều, tâm trạng cũng dịu đi đôi chút."
3138 = "Lại là một câu hỏi ngây thơ của Reina.\\nNgay cả Kisaki cũng phải giãn nét mặt căng thẳng ra một chút."
3139 = "Lời nói đó khiến tôi cảm thấy như đã hiểu ra phần nào.\\nLý do mà Kisaki lại nhanh chóng đứng về phía chúng tôi như vậy——"
3140 = "Nghe có vẻ hơi đa cảm,\\nnhưng nó cũng phản ánh một sự thật hiển nhiên."
3142 = "Nhân lực có khả năng hướng dẫn và giám sát việc đó,\\nhiện tại cũng vô cùng hạn chế."
3145 = "Việc tôi đặc biệt cảm nhận rõ tình trạng \\x%l保線;#00ffc040;bảo trì đường ray%l;#; kém, ngược lại,\\ncó thể là do tình trạng \\x%l動輪;#00ffc040;bánh xe chủ động%l;#; tốt hơn bình thường."
3148 = "Mặt ai nấy đều hơi lấm lem,\\nnhưng lại nở những nụ cười rạng rỡ và đầy sức sống."
3152 = "Cảm giác của tôi đã được chứng thực qua ánh mắt của Hachiroku."
3157 = "Tự do: Tàu tốc hành　Số lượng: 1 người lớn\\nThời hạn: Không giới hạn"
3158 = "So với lúc phục chế, lần này——dù là những chỉ thị Hachiroku đưa ra,\\nhay câu trả lời cho các câu hỏi, cả về số lượng lẫn độ chính xác đều khác biệt một trời một vực."
3160 = "Giá như có Hachiroku ở bên cạnh. Và có thể trò chuyện cùng nhau\\nthì sự trống trải này, chắc chắn sẽ tan biến trong chớp mắt."
3161 = "Nếu không có chuyện mời gọi nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#;,\\nchắc chắn phần sâu thẳm trong tôi vẫn sẽ tiếp tục sống trong sự chết lặng."
3179 = "Giá mà đi theo nhóm Hibiki,\\nthì có khi còn làm được một cuộc khảo sát có ý nghĩa hơn——"
3182 = "Thấy tôi hỏi vặn lại ngay lập tức,\\nHachiroku cũng gật đầu tỏ vẻ hài lòng."
3193 = "Những việc cần làm đã rõ ràng,\\nkhông còn chỗ cho sự do dự nữa."
3194 = "Giọng điệu của cô ấy cố tình nhấn mạnh chữ “Cá nhân tôi”.\\nLàm dấy lên sự nghi ngờ một cách tự nhiên."
3195 = "Bước xuống sàn, Hachiroku\\nchuyển \\x%lタブレット;#00ffc040;thẻ bảng%l;#; sang \\x%l整備体;#00ffc040;thân chính%l;#;."
3201 = "Càng nhìn, càng tìm hiểu,\\ntôi càng cảm thấy."
3205 = "Bên trong nhà ga, trông không tệ chút nào.\\nĐâu chỉ không tệ——mà là quá tuyệt vời."
3206 = "Tôi nhẹ nhàng nhấc mũ của Hachiroku lên,\\nvà thỏa thích vuốt ve mái tóc mềm mại của em ấy."
3207 = "Vừa nghĩ vậy, tôi chợt thấy bối rối.\\nRốt cuộc, tôi đã được cứu khỏi cái gì cơ chứ."
3228 = "Một cử chỉ trẻ con không giống em ấy chút nào,\\nnhưng nhìn nụ cười rạng rỡ trên khuôn mặt em, tôi lại thấy nó thật hợp."
3229 = "Sự ngại ngùng này không chỉ của riêng tôi——\\nNhận ra điều đó thực sự khiến tôi rất vui."
3230 = "Không ổn rồi."
3231 = "Đây là chuyến chạy thử đầu tiên đến ga bỏ hoang Kawamura sau khi hoàn tất việc thay \\x%l台枠;#00ffc040;khung gầm%l;#;.\\nChỉ với quãng đường ngắn ngủi 4.4km, màn thử thách thực sự giờ mới bắt đầu."
3233 = "Chắc là đã kiểm tra xong phía bên kia thân xe rồi.\\nHachiroku và Nagi vừa vặn quay lại."
3234 = "Tấm vé vốn chỉ là trò chơi đóng giả,\\nnay đã hóa thành bảo vật nhờ nụ cười của Hachiroku."
3235 = "Thế này là ổn."
3236 = "Đã bao nhiêu năm rồi tôi mới lại làm mấy trò thế này nhỉ."
3237 = "Điều này quả thực rất quý giá——\\nDù hơi muộn màng, nhưng tôi cũng đã cảm nhận được."
3238 = "Đó đáng ra phải là lời tôi nói mới đúng.\\nBởi vì có Hachiroku ở bên cạnh tôi——"
3239 = "Nghe vậy, tôi cũng thấy có lý."
3242 = "Tiến hành \\x%l階段;#00ffc040;nhả phanh từng nấc%l;#;,\\nđể làm cho tốc độ giảm dần một cách êm ái."
3246 = "Chọn thời điểm này——cũng rất hợp lý.\\nBuồng lái có hơi chật chội một chút cũng chẳng sao."
3247 = "Vẫn bộ trang phục thường ngày, nhưng đứng trên sân khấu này, trông em ấy hệt như một nhân viên nhà ga.\\nThật đáng yêu. Vô cùng hợp với em ấy."
3248 = "Vừa nói, Kisaki vừa lấy tài liệu từ trong túi ra và bắt đầu phát."
3266 = "Hachiroku thở hắt ra vẻ hài lòng.\\nĐôi gò má em ửng hồng."
3267 = "Một tiếng kêu nhỏ.\\nKèm theo tiếng hít thở sâu."
3268 = "Dù biết là vậy,\\nnhưng hiểu là một chuyện, trong lòng vẫn thấy có chút cô đơn."
3269 = "Dù là vé do chính tay mình làm ra,\\nnhưng Hachiroku lại nhìn nó như một món bảo vật."
3270 = "Tuy ngại ngùng, nhưng lại vô cùng hạnh phúc.\\nÀ, không, nếu vậy thì, niềm vui này——"
3271 = "Dù hơi e ngại đoạn dốc lên,\\nnhưng nếu thiếu đà thì cứ tăng thêm là được."
3285 = "Hachiroku trong thân chính, vừa làm điệu bộ phủi bụi,\\ncuối cùng cũng bước ra khỏi nhà ga bỏ hoang."
3290 = "（……Hôm nay, mình bị bắt chờ hơi nhiều nhỉ.）"
3301 = "（Không tệ——tốt lắm, cứ giữ nguyên thế này.）"
3303 = "（Kéét）"
3307 = "（Cộc! Cộc!）"
3308 = "（Kịch!）"
3309 = "（Hửm!?）"
3310 = "（A——）"
3311 = "（Lạch cạch）"
3312 = "（Tách!）"
3313 = "（Tách）"
3316 = "（Quả nhiên là, hơi sớm sao?）"

