2404 = "「Đúng vậy. Việc phương án này trở thành hiện thực, đã được xác định chắc chắn.」"
2406 = "「Đó không chỉ là em bé của riêng em và tôi. Mà là em bé được chào đón ở nhà Migita. Nhất định, chúng ta sẽ mang lại hạnh phúc cho bé.」"
2412 = "「Thực tế, Đường sắt Ohito trong 6 năm qua, luôn đạt mức tăng trưởng trên 5% so với năm trước, lợi nhuận kinh doanh tiếp tục tăng trưởng cực kỳ thuận lợi.」"
2413 = "「Nh, nhỏ quá——nhẹ quá——lại còn ấm áp nữa, ng, ngài Soutetsu——bé Mayu, em——」"
2417 = "「Bé Mayu, vừa rồi——ợ. Ưm—— Có sao không ạ? Bụng bé có vấn đề gì không.」"
2419 = "「Bé Mayu, em hiểu rồi nhỉ. Không còn đưa dây tua rua lên miệng nữa rồi.」"
2420 = "「Bé Hachiroku——à không, bé Suzu. Sou-chan, em phải trân trọng con bé đấy nhé?」"
2421 = "「Vậy nhỉ.」"
2422 = "「Là Hachiroku đã giúp bé ợ hơi đấy. Nhờ cái nôi bằng cánh tay, hay sự rung lắc khi cô di chuyển cơ thể.」"
2425 = "「Đúng rồi——ngài làm rất tốt. Ưm……vậy thì, cô Urakami.」"
2426 = "「Khỏi số phận……mà con bé không thể nào thay đổi được, chắc vậy.」"
2428 = "「Nếu có thay đổi thì cứ theo đó mà hành động.」"
2443 = "「Nếu được vậy thì tốt quá.」"
2445 = "「Giúp một tay……là sao ạ, rốt cuộc, là chuyện gì vậy?」"
2454 = "「Vâng, nhất định rồi.」"
2456 = "「Không sao không sao! Hôm nay em, cứ vẽ suốt thôi! Nên phải vận động cơ thể một chút mới được! Kiểu vậy đó.」"
2467 = "「Việc khôi phục tuyến đường sắt bị bãi bỏ đầu tiên của Đường sắt Ohito——Về cách xử lý đoạn Ohimitera-Hayato, cuối cùng có hai phương án được giữ lại.」"
2468 = "「Tuyến Yunoi của Đường sắt Ohito, khi so sánh với các tuyến khác, có một lợi thế áp đảo trong việc thu hút \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;.」"
2474 = "「Tâm trạng tồi tệ——nghe giọng thì chẳng giống thế chút nào.」"
2477 = "「Thế nào……rồi ạ? Bé có, thích……không?」"
2483 = "「Gì vậy, sao thế. Tôi, đã làm gì Hachiroku à?」"
2484 = "「Gì vậy. Sao thế.」"
2485 = "「Sao thế? Tôi, lại lỡ lời nói điều gì không hay sao?」"
2486 = "「Sao vậy, Hachiroku. Nếu thấy vui thì cứ thoải mái bộc lộ ra đi chứ?」"
2487 = "「Sao vậy? Hachiroku.」"
2491 = "「Chúng tôi mới phải cảm ơn. Cảm ơn cô vì đã cho chúng tôi bế bé Mayu, cảm ơn cô rất nhiều. Nào, chúng ta đi thôi ngài Soutetsu.」"
2493 = "「Chúng tôi cũng vậy, cảm ơn ông vì khoảng thời gian ý nghĩa này.」"
2494 = "「Đúng như ông đã chỉ ra. Đường sắt Ohito là nơi khởi nguồn của dự án này, mặc dù là trung tâm, nhưng lại bị chậm chân.」"
2496 = "「Ôi! Tam đoạn luận, bé Mayu vừa mới! Bắt chước giọng của ngài Soutetsu đấy!!」"
2497 = "「Đúng vậy ạ. Thời còn ở Teitetsu, em hầu như không trực tiếp tiếp xúc với hành khách.」"
2500 = "「Chuyện đó——về mặt lý thuyết thì đúng là vậy ạ.」"
2503 = "「Đáng yêu. Rất thích. Buồn buồn. Mềm xốp. Phải chia tay bé——rất, cô đơn. Đến mức đau lòng.」"
2504 = "「Có vẻ như lúc nãy tôi chưa vỗ ợ hơi cho bé đủ. Lúc cho bé uống sữa ấy.」"
2507 = "「Vì, vì em, mà ngài lại.」"
2508 = "「Hoàn toàn không hiểu. ——Nhưng trông có vẻ bé đang nghịch nó với vẻ thích thú.」"
2510 = "「Không, em cũng không thấy mệt mỏi gì.」"
2512 = "「Những khoảnh khắc như vậy, tôi cũng muốn, được trải qua cùng Suzu. Vì thế đây chắc chắn, là mong ước——không, là mục tiêu của chúng ta.」"
2515 = "「Lúc mới gặp nhau, làm sao ngờ được chúng ta lại trở thành vợ chồng chứ. Chuyện đó có nằm mơ, cả hai cũng chưa từng nghĩ đến.」"
2516 = "「Chúng ta là gia đình. Dù có chuyện gì cũng có thể hỗ trợ lẫn nhau. Và điều đó, đối với em bé, chắc chắn cũng giống như vậy.」"
2517 = "「Em hay lo xa quá đấy. Cô dâu đáng yêu của tôi.」"
2519 = "「Tôi nghe nói bàn tay của Railord có thể làm những công việc tinh xảo hơn cả con người mà—— Hơn nữa, cô sẽ cẩn thận bế bé đúng không?」"
2521 = "「Cảm ơn vì bữa ăn!」"
2524 = "「Tôi, có vẻ hơi mệt rồi. Muốn ngủ sớm. Em, đi tắm trước đi.」"
2525 = "「Em là một \\x%lレイルロオド;#00ffc040;Railord%l;#; rất, rất cũ rồi.」"
2530 = "「Tôi biết. Rằng em là một \\x%lレイルロオド;#00ffc040;Railord%l;#;. Nhưng chúng ta, vẫn có thể trở thành vợ chồng, thành gia đình như thế này mà.」"
2534 = "「Em vẫn luôn trân trọng em ấy, chẳng lẽ còn chưa đủ sao.」"
2536 = "「Tôi đã nhận được báo cáo. Nếu chạy thẳng đoạn Yunoi-Hayato, thì gánh nặng cho 8620 sẽ quá lớn——đó là lý do từ bỏ phải không.」"
2539 = "「Liệu em có thể đáp lại mong muốn của ngài Soutetsu hay không—— Chính bản thân em, cũng không biết được điều đó ạ.」"
2541 = "「Em rất——vui ạ. Nhưng——nhưng mà, ngài Soutetsu.」"
2542 = "「Tôi từng đọc được ở đâu đó trong sách. Hình như là, nếu cho bé nắm thứ gì đó trong tay thì bé sẽ bình tĩnh lại.」"
2545 = "「Thế nên mới là vợ chồng. Thế nên, mới là gia đình.」"
2547 = "「Thế nên bây giờ——đừng nghĩ ngợi gì cả, cứ yên lặng ngủ đi.」"
2548 = "「Ừm, vì thế nên cô mới giúp tôi một tay đấy.」"
2549 = "「Thế nên tôi mới bảo em bình tĩnh. Tôi cũng không biết, nhưng cứ giữ nụ cười đi. Có lẽ tiếng 『Nga——n』 đó không mang ý nghĩa xấu đâu.」"
2552 = "「Cho tôi nghe, suy nghĩ của Suzu đi. Cảm xúc chân thật của em——tôi, muốn cùng em chia sẻ nó.」"
2555 = "「Bye bye, nhỉ. Nếu có duyên, chúng ta hãy gặp lại nhé.」"
2558 = "「Tam đoạn luận sao.」"
2560 = "「Nói cách khác——đối với việc chạy \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;, nó cực kỳ dễ dàng. Dù hiệu suất có kém cỏi đến đâu, thì ở đây vẫn có thể chạy được.」"
2570 = "「Nếu anh đã hiểu ra chỗ đó rồi, thì chắc chắn sẽ ổn thôi!!」"
2571 = "「Hiểu rồi.」"
2574 = "「Đúng vậy nhỉ? Mayu. Nào, nói 『Bye bye』 với chị Hachiroku đi con.」"
2576 = "「Vậy sao ạ? Nếu thế em, sẽ phụ giúp việc khác.」"
2577 = "「Vậy sao? Nếu thế thì.」"
2579 = "「Vâng. Sau khi vui mừng và an tâm, em cảm thấy rất buồn ngủ. Chắc hôm nay, cảm xúc của em đã xáo trộn quá nhiều rồi.」"
2582 = "「Vâng. Phải kết hợp giữa \\x%lスイッチバック;#00ffc040;đường vòng zigzag%l;#; và \\x%lループ線;#00ffc040;đường ray vòng tròn%l;#; thì mới có thể leo lên hết được. Đó là một đỉnh cao hiểm trở đến mức đó.」"
2584 = "「Chúc ngài ngủ ngon——lão gia. Ngài Soutetsu mà em yêu nhất.」"
2587 = "「Ngủ ngon nhé, Sou-chan.」"
2588 = "「Ngủ ngon nhé, chị Mayami. Ngủ ngon nhé, Hibiki. Hẹn ngày mai gặp lại.」"
2590 = "「Ngủ ngon nhé, Suzu.」"
2592 = "「Ngủ ngon nhé, anh hai.」"
2594 = "「Thứ gì đó——A, đúng rồi! Ngài Soutetsu! Cái này——dây tua rua vàng của em.」"
2596 = "「Chắc vậy. Tôi cũng thế.」"
2604 = "「Cơ hội hiếm có đấy. Hachiroku. Hãy cẩn thận bế bé đi.」"
2606 = "「Dự án SL Đại Kyushu, đã đánh trúng vào tâm lý chạy theo trào lưu đó.」"
2608 = "「Chúng tôi đang lên kế hoạch như vậy. Thực tế thì, vì vẫn chưa chạy thử, nên không thể loại trừ khả năng sẽ phát sinh các vấn đề khác.」"
2610 = "「Đánh trúng——nghĩa là.」"
2612 = "「Mỗi lần cho uống sữa—— đều phải vỗ ợ hơi……sao ạ?」"
2614 = "「Các chiến dịch như 『Steam Locomotion』 hay 『Chuyến đi tuyệt vời・Joukigen』 đặc biệt trúng mánh lớn nhỉ.」"
2617 = "「Không, không đâu, không có lời nào không hay cả, dù chỉ một câu. Nhưng……nhưng mà——em——e, em.」"
2618 = "「Không, hoàn toàn không ạ! Nếu có bất kỳ dấu hiệu bất thường nào, em sẽ báo cho ngài Soutetsu đầu tiên.」"
2619 = "「Vâng——」"
2620 = "「Vâng.」"
2621 = "「Đúng rồi. Và Mayu vẫn chưa thể tự mình ợ hơi được.」"
2622 = "「Không sao đâu? Tôi muốn nghe ý kiến thẳng thắn của em.」"
2633 = "「Urakami! Chúc mừng cô!! Thật là, thật là một chuyện tuyệt vời!」"
2635 = "「Urakami, cô—— đã làm mẹ rồi nhỉ!!!」"
2636 = "「Vì không biết sẽ ra sao—— Chắc chắn là, để hỗ trợ lẫn nhau.」"
2637 = "「Không thể thay đổi được? ——Rốt cuộc là chuyện gì chứ————!!!」"
2639 = "「Nhưng mà, mức tăng trưởng của các công ty cùng ngành lân cận trong 3 kỳ gần đây đều là hai con số đấy! Bị bỏ lại phía sau, không phải là phép ẩn dụ hay gì đâu, mà là hiện thực đó.」"
2640 = "「Chăm em bé chắc mệt rồi đúng không. Hôm nay thôi đi. Em nghỉ ngơi sớm đi.」"
2645 = "「Tất nhiên là gia đình rồi! Hachiroku——Suzu cũng vậy. Cho nên——em muốn anh bảo vệ chị ấy.」"
2646 = "「Tất nhiên là, tiếng ợ vừa rồi.」"
2647 = "「Tất nhiên rồi. Phải nói là, đó mới là vinh hạnh đấy. Được vòng tay đã vực dậy Ohimitera bế cơ mà.」"
2648 = "「Bảo vệ——Tất nhiên, dù có chuyện gì xảy ra, tôi cũng sẽ bảo vệ Suzu đến cùng. Nhưng mà, rốt cuộc hai người đang bảo tôi bảo vệ em ấy khỏi cái gì.」"
2650 = "「Mặc dù tiềm lực đã bị suy giảm đáng kể, nhưng với thành tích và độ tin cậy vượt trội, các công ty này đã liên tiếp tham gia vào việc tận dụng \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#;, kết quả là...」"
2655 = "「Hay quá. Tuyệt vời thật đấy. Hachiroku chắc chắn, rất hợp với bé Mayu nhỉ.」"
2660 = "「Trực tiếp, nghĩa là sao?」"
2662 = "「Ngay cả ở Ohimitera cũng đang phát quảng cáo trên tivi mà. Ở Đông Hinomoto hay Shikoku, có vẻ như đầu máy hơi nước cũng đang được đánh giá cao trở lại.」"
2665 = "「Hiểu chuyện gì cơ.」"
2666 = "「Tr, trông có vẻ vậy.」"
2668 = "「Có được không?」"
2670 = "「Tuyệt vời thật đấy.」"
2672 = "「Một khoảng thời gian, vô cùng vui vẻ. Cứ như là một giấc mơ vậy—— Không, chắc chắn. Đó chỉ là một khoảnh khắc, của một giấc mơ thôi.」"
2674 = "「Thật là ngốc nghếch——không, người ngốc là tôi mới phải. Chẳng hề mảy may suy nghĩ đến cảm nhận của Suzu đối với trẻ con……」"
2676 = "「Thật là một em bé thông minh. Fufu, quả không hổ danh là con của cô Urakami.」"
2678 = "「Xin lỗi em nhé. 『Nếu thấy vui thì cứ thoải mái bộc lộ ra đi』—— Đã nói những lời như vậy. Mà chẳng hề thấu hiểu tâm trạng của Suzu.」"
2681 = "「Gì cơ! Thật là đáng chúc mừng!!」"
2682 = "「Vậy sao ạ? Nếu ngài Soutetsu đã nói thế. Vậy thì em, xin phép đi tắm trước nhé?」"
2689 = "「Lần đầu tiên, được tiếp xúc gần gũi như vậy. Em cảm thấy thế nào về em bé?」"
2691 = "「Mệt……thì cũng không đến mức đó ạ——」"
2693 = "「Tóm lại, vì đó là một nơi hiểm trở như vậy, nên nếu chạy một mạch từ Yunoi đến Hayato, e là sẽ quá sức.」"
2697 = "「Tất nhiên rồi ạ. Em sẽ bế bé một cách cẩn thận nhất có thể. Còn thận trọng và trân trọng hơn cả việc thay kính ống thủy sáng nữa.」"
2701 = "「Nếu là giấc mơ, thì hãy thử tìm cách biến nó thành hiện thực xem.」"
2703 = "「Làm hai người giật mình sao? Xin lỗi nhé.」"
2705 = "「Bảo bối 8620 mà hỏng hóc thì phiền phức lắm. Tôi không có ý kiến gì về nhận định đó, cũng như kết luận được đưa ra.」"
2706 = "「Mayu.」"
2710 = "「Dự án đang được đón nhận rộng rãi. Việc khôi phục tuyến đường sắt ở các nơi cũng rất thuận lợi. Mặc dù vậy——chỉ có Ohimitera là bị bỏ lại phía sau.」"
2718 = "「Được người như em bế mà cũng không sợ hãi. Thực sự là, đáng yêu quá——」"
2719 = "「Phải trân trọng bé Suzu đấy nhé. Sou-chan.」"
2721 = "「Không biết hôm nay sẽ chết, hay ngày mai sẽ chết, ai cũng vậy cả thôi. Cả tôi, Hibiki, hay chị Mayami cũng thế.」"
2723 = "「Này, nếu được thì—— Cho tôi thưởng thức cà phê của Giám đốc chi nhánh sau một thời gian dài được không?」"
2724 = "「Đúng vậy ạ. ……Nếu là lần đầu tiên được chiêm ngưỡng khung cảnh đó, em mong muốn được ngắm nhìn nó từ buồng lái của 8620, cùng với ngài Soutetsu.」"
2725 = "「Đúng vậy ạ. Đoạn Ohimitera-Hayato. Đặc biệt là khu vực quanh ga Okoba, là nơi có địa hình hiểm trở vang danh khắp Hinomoto.」"
2728 = "「À ừm——cô Urakami. Có thể cho ngài Soutetsu, bế bé Mayu một chút được không ạ.」"
2729 = "「Cảm ơn em——bé Mayu.」"
2730 = "「Cảm ơn hai người. Nhờ vậy mà tôi đã nhận ra sự thiếu hiểu biết của bản thân, và không bị sự nhận ra đó làm cho suy sụp, mà có thể hướng về phía trước.」"
2731 = "「Tôi cho phép. Cứ để bé chạm vào đi. Đối phương là em bé thì tôi cũng không ghen đâu.」"
2761 = "「Chuyện đó……đúng là vậy ạ.」"
2762 = "「Người tốt là, cả ngài Soutetsu nữa cơ? Bởi vì ngài Soutetsu và bé Mayu, cũng rất hợp nhau mà.」"
2763 = "「Tôi cũng có tìm hiểu rồi. Hình như, nó được xếp vào một trong ba khung cảnh qua cửa sổ tàu đẹp nhất Hinomoto phải không?」"
2764 = "「Em buồn ngủ rồi à.」"
2765 = "「Không phải vì Suzu. Mà là vì chúng ta.」"
2766 = "「Chuyện đó thì tôi biết rõ rồi. Nếu không, tôi đã chẳng hợp tác hay đầu tư.」"
2767 = "「Chuyện đó thì.」"
2768 = "「Đó là——」"
2769 = "「Đây là——một nụ cười rạng rỡ.」"
2770 = "「Ưm……」"
2771 = "「Không có gì đâu. Chẳng có gì cả. Cảm xúc của Suzu, không có gì là tôi không muốn đón nhận hết.」"
2772 = "「Giọng nói này!」"
2773 = "「Dù đồng phục thường xuyên được giặt giũ cẩn thận, nhưng cũng không sạch đến mức có thể ngậm vào miệng đâu.」"
2775 = "「Về mặt lý thuyết, là vậy đúng không? Cả nỗi lo của Suzu cũng thế. Hay là, không lẽ em đang có chỗ nào không khỏe thật.」"
2776 = "「Sao thế——là sao, anh hai, anh không hiểu gì hết à?」"
2777 = "「Không hiểu gì hết trơn! Thật không thể tin nổi! Hachiroku đáng thương quá đi!!」"
2778 = "「Đừng gọi là Giám đốc chi nhánh nữa, Urakami——à mà, bây giờ là……họ của chồng cô nhỉ?」"
2779 = "「Nếu vậy, em đã vô tình—— giúp đỡ cho sức khỏe của bé Mayu rồi nhỉ.」"
2782 = "「Và rồi, động thái mà cậu chưa hề thông báo cho ngân hàng đó, hôm nay lại được tiết lộ ở đây. Có nghĩa là.」"
2783 = "「Vậy, xin thất lễ.」"
2785 = "「Đó là địa thế. Độ chênh lệch độ cao cực kỳ nhỏ. Số lượng hầm là không. Nếu phải kể đến đặc trưng thì chỉ có số lượng cầu nhiều, một tuyến đường bằng phẳng.」"
2787 = "「Vậy, cảm giác thế nào?」"
2790 = "「Vậy, chúng tôi xin phép. Kisaki, cô Urakami.」"
2791 = "「Nếu vậy, hãy cùng mong ước đi. Cả hai chúng ta. Mong ước được chào đón một đứa trẻ——một thành viên mới trong gia đình.」"
2792 = "「Tôi hỏi lại lần nữa. Lý do là gì? Dự án được đón nhận, vậy tại sao Ohimitera lại bị chậm chân.」"
2794 = "「Vậy thì, những gì em cảm nhận được. Em sẽ cứ thế, thành thật nói ra nhé?」"
2797 = "「Vậy thì tôi yên tâm rồi. Hãy dùng tay làm nôi nhé—— Đúng rồi, giỏi lắm. Trước khi bế, hãy nói chuyện với bé nhé.」"
2799 = "「Và Hibiki, tất nhiên cũng là hạng nhất rồi.」"
2801 = "「Vậy là đầu máy nào」「Tức là đầu máy dư thừa đó sẽ chạy tuyến Yunoi. Còn 8620 sẽ chạy đoạn Ohimitera-Hayato đúng không?」"
2804 = "「Suzu.」"
2805 = "「Suzu mới phải——」"
2809 = "「Vì là mối quan hệ giữa anh hai và Hachiroku mà. Dù có chuyện gì xảy ra thì cuối cùng, cũng sẽ ổn thỏa theo cách tốt đẹp nhất thôi!」"
2811 = "「Chị hai! Đừng nói chuyện đó nữa! Em cũng, y chang vậy mà!」"
2814 = "「Sự phát triển của Aircra đã giúp con người không còn gặp khó khăn trong việc di chuyển nữa—— Vì thế, đối với những 『Chuyến đi』, họ bắt đầu tìm kiếm nhiều thứ hơn là chỉ đơn thuần di chuyển.」"
2815 = "「Những cú hit ở các nơi đó, đã lan rộng đến Nagotetsu và Đường sắt Toukyou—— Những doanh nghiệp đường sắt lớn đã sống sót qua đợt Đại bãi bỏ tuyến.」"
2816 = "「Gần như là chính xác. Không chỉ vậy, các Maitetsu ở khắp nơi, cũng đang lần lượt được đưa vào dự án của các công ty.」"
2817 = "「Mà, chị thì đối với chuyện vợ chồng, chắc chắn là hoàn——toàn không hiểu gì đâu.」"
2818 = "「Nói là khách nhưng cũng chỉ có cậu Soutetsu và Hachiroku thôi. Vào đi. Cũng đâu phải người lạ gì.」"
2819 = "「Ngài Soutetsu, mừng ngài đã về.」"
2820 = "「Ngài Soutetsu? Khi bế, ngài dùng tay phải làm nôi nhé.」"
2821 = "「Ngài Soutetsu?」"
2822 = "「Ngài Soutetsu? Ngài nghe thấy không? Bé Mayu và em, có vẻ rất hợp nhau đấy ạ.」"
2824 = "「Không. Chúng tôi vẫn luôn tiến hành các biện pháp đối phó.」"
2826 = "「D51 840 của Đường sắt Takasaki. Tàu Tiểu thư của Đường sắt Iyokan. Cả hai đều là những \\x%l蒸気機関車;#00ffc040;đầu máy hơi nước%l;#; tham quan vô cùng tuyệt vời.」"
2836 = "\"(Ợ)\""
2837 = "\"(Cười toe toét)\""
2839 = "「Dòng 8620 lấy sự đa năng từ sự bình phàm làm vũ khí. Tuyến đồi núi tất nhiên vẫn có thể chạy được——nhưng tuyệt đối không thể gọi là sở trường ạ.」"
3030 = "Hoàn toàn trái ngược với một Hibiki đầy cảm xúc, chị Mayami lại rất điềm tĩnh."
3032 = "Tại sao vậy nhỉ. Hachiroku—— trông có vẻ như đang liều mạng kìm nén tiếng reo vui sướng."
3033 = "Không phải vì bối rối hay sợ hãi, mà là vì hạnh phúc."
3034 = "Phải chăng bé đang tận hưởng cảm giác mềm mại tuyệt vời từ làn da của Hachiroku? Bé vừa nắm mở bàn tay liên tục, vừa vui vẻ đùa nghịch."
3042 = "Ngay lập tức, Kisaki thở hắt ra một hơi dài."
3046 = "Lạnh lùng như băng——từ đó chợt lóe lên trong đầu tôi."
3049 = "Cả hai, đều được gọi là giấc mơ. Suzu có lẽ, đang coi nó là vế trước——"
3050 = "Nhưng mà, tôi đâu thể ôm em ấy trước mặt người khác, rồi xoa đầu hay cọ má được."
3054 = "Quả thật đó là, một vấn đề không thể né tránh."
3057 = "Đỡ lấy sức nặng của đứa bé chỉ bằng đôi tay mình, Hachiroku có vẻ như đã trở nên bối rối."
3071 = "Vừa nói, ông Mototada đã nhổm dậy khỏi ghế."
3073 = "Tập tài liệu dày cộp bị ông Mototada đập mạnh xuống bàn."
3074 = "Ông Mototada trừng mắt nhìn tôi chằm chằm. Bên cạnh ông ấy, Kisaki mang một vẻ mặt có phần ra vẻ điềm tĩnh."
3076 = "Đột nhiên, với động tác chậm rãi, ông Mototada trải báo cáo kinh doanh ra bàn."
3081 = "Cúi gập người, chào một cái."
3084 = "Lại một lần nữa, á khẩu. Khuôn mặt dần dần, lần này đỏ bừng đến tận cổ."
3086 = "Chỉ nói được đến đó rồi im bặt. Mặt đỏ bừng, Hachiroku run rẩy."
3088 = "Hachiroku quay lại. Với nụ cười công nghiệp hoàn hảo——chính vì thế, lại càng thêm nổi bật."
3089 = "Lẩm bẩm như đang nghiền ngẫm. Hachiroku say sưa, nhắm mắt lại như đang mơ."
3093 = "Hachiroku khẽ nhìn tôi. Tất nhiên, tôi gật đầu."
3094 = "Mỉm cười đáp lại nụ cười của bé Mayu, giữ nguyên vẻ mặt đó, Hachiroku cười tươi nhìn tôi."
3096 = "Về phía bàn tay nhỏ xíu của bé Mayu, Hachiroku rụt rè, đưa má mình lại gần."
3098 = "Và rồi, đông cứng lại."
3100 = "Làn da của Hachiroku chạm vào cánh tay tôi, bé Mayu chầm chậm được chuyển sang tay tôi——"
3103 = "Y như những gì vừa được cô Urakami chỉ dạy lúc nãy, Hachiroku hướng dẫn lại cho tôi với vẻ mặt như một người đầy kinh nghiệm."
3104 = "Hachiroku có vẻ như đã nhẹ nhõm hơn, nói ra thắc mắc mà em ấy đã nuốt vào trong lúc nãy."
3107 = "Hachiroku, với giọng đè nén kể lại chuyện về bé Mayu, chị Mayami và Hibiki thì mỉm cười đáp lại——"
3109 = "Ngay khi Hachiroku vừa khuất bóng, chị Mayami và Hibiki, cùng lúc nhìn chằm chằm vào tôi."
3111 = "Hachiroku căng thẳng đến cứng đờ người, nhưng vẫn bế ngang đúng như được dạy——dùng cánh tay làm gối cho bé Mayu."
3113 = "Hachiroku mỉm cười, trông có vẻ hạnh phúc từ tận đáy lòng. Tôi cũng, tự nhiên mỉm cười theo."
3115 = "Hachiroku cũng, trở lại như bình thường rồi. Với vẻ mặt nghiêm trang, em ấy nhón gấu váy cúi chào."
3116 = "Giọng nói, rộn rã. Cuối cùng thì, niềm vui cũng bộc lộ ra một cách chân thật."
3119 = "Tình cảm của Hachiroku tất nhiên là khiến tôi rất vui. Tôi cũng mong ước như vậy."
3123 = "Gần như chắc chắn em ấy định nói \"đáng yêu\", nhưng đến đó, không hiểu sao Hachiroku lại nuốt lời vào trong."
3124 = "Nghe nói vậy, tôi cũng lờ mờ có cảm giác như thế."
3125 = "Ánh mắt Hachiroku, nhìn bé Mayu trong một khoảnh khắc ngắn ngủi."
3127 = "Sự căng thẳng tột độ của Hachiroku, chỉ bằng một câu nói, đã tan biến ngay lập tức."
3128 = "Mắt Hachiroku cũng tròn xoe."
3132 = "Âm lượng lớn đến mức khiến Kisaki và cô Urakami đang trò chuyện sôi nổi, cũng bất giác ngừng lời."
3137 = "Vừa rồi——vừa rồi, đứa bé này—— bé Mayu——"
3142 = "Ra là vậy, là chuyện đó sao."
3168 = "Để kìm nén cảm giác muốn ôm em ấy vào lòng, bây giờ trước mắt, phải tập trung vào ông Mototada đã."
3169 = "Không nói nên lời."
3172 = "Như đang nhảy nhót vì vui sướng, tươi sáng và rạng rỡ—— A, đúng rồi. Đây là giọng nói đang 『Hân hoan』."
3174 = "Tôi hỏi thẳng không chút e dè."
3175 = "A, đúng vậy. Vui vẻ đến mức nụ cười tự nhiên tuôn trào."
3183 = "Trong bóng tối dễ dàng buông xuống, một giọng nói dịu dàng, nhẹ nhàng thắp sáng."
3189 = "Nắm ngược lại tay tôi."
3191 = "Cứ thế chầm chậm nhìn bé Mayu, bé Mayu cũng nhìn thẳng lại Hachiroku."
3193 = "Ánh mắt thẳng thắn đến mức, khiến tôi cảm thấy——có chút đáng sợ."
3195 = "Đáng yêu thật. Tôi hiểu cảm giác Hachiroku bị mê hoặc rồi."
3197 = "Tôi hơi ngạc nhiên vì không ngờ em ấy lại khao khát đến vậy—— Nếu thế, tôi lại càng muốn biến nó thành hiện thực."
3200 = "Định mệnh không thể sinh con của \\x%lレイルロオド;#00ffc040;Railord%l;#;, em ấy lo sợ rằng, có thể tôi sẽ để tâm đến điều đó."
3203 = "Cảm giác muốn làm cho bé vui vẻ đến mức nào cũng được, muốn mang lại cho bé nhiều hạnh phúc hơn nữa."
3205 = "Khá là thông minh đấy. Đến mức khiến người ta nghĩ bé đã hiểu được lời Hachiroku nói."
3207 = "Nếu chỉ tiếp xúc theo kiểu đó, thì việc tiếp xúc với trẻ con, chắc chắn là điều không thể rồi."
3211 = "Sự dịu dàng của mỗi người trong hai chị em, theo những cách khác nhau hòa quyện lại, dần dần thấm vào lòng tôi."
3224 = "Giọng của hai cha con Houshou chồng lên nhau, Kisaki bỏ lửng câu nói giữa chừng. Nếu vậy thì người tôi nên trả lời, có lẽ là câu hỏi của người cha."
3226 = "Đáp lại lời chào của tôi bằng một nụ cười, ông Mototada sải bước ra khỏi cửa phòng Giám đốc chi nhánh."
3230 = "Tất nhiên, dù rất đáng yêu và khiến người ta mỉm cười—— Nhưng đồng thời tôi cũng cảm thấy hơi kỳ lạ, tại sao lại đến mức đó chứ."
3232 = "Khoảnh khắc tay và má chạm vào nhau, khuôn mặt Hachiroku như tan chảy ngay lập tức."
3237 = "\\x%l機関区;#00ffc040;Khu đầu máy%l;#; Teio."
3248 = "Vô tâm cũng vừa phải thôi chứ. Cứ tưởng là đang quan tâm đến Suzu, nhưng thực ra lại làm điều ngược lại."
3253 = "Sinh mệnh nhỏ bé ôm trong vòng tay, đáng yêu đến lạ thường, khiến tôi cảm thấy nó là một thứ không thể thay thế."
3255 = "Cố tình nói với giọng điệu đùa giỡn, tôi lau đi những giọt nước mắt còn đọng trên khóe mi em."
3258 = "Thở phào nhẹ nhõm. Câu hỏi này tôi đã lường trước được rồi."
3259 = "Thở phào nhẹ nhõm. Muốn chia sẻ cảm giác đó, tôi lại vuốt ve em ấy."
3262 = "Nhắm mắt lại."
3265 = "Sự yếu kém vốn dĩ đã có từ đầu rồi."
3267 = "Lời định nói \"Chắc là ngẫu nhiên thôi\" đã đến tận đầu lưỡi, tôi vội vàng nuốt lại."
3268 = "Sự tương thích giữa tôi và Hachiroku là cao nhất. Vậy, nếu Hachiroku và bé Mayu rất hợp nhau thì——"
3271 = "Sợi dây tua rua vàng rủ xuống từ cầu vai phải của Hachiroku, tôi túm phần đuôi của nó lại, đặt vào tay bé Mayu——"
3273 = "Tôi cúi người xuống, cho vừa với độ cao cánh tay của Hachiroku."
3274 = "Một giọng điệu hốt hoảng chưa từng thấy."
3277 = "Tôi thử nhìn sang tìm sự trợ giúp, nhưng cô Urakami đã hoàn toàn, bước vào chế độ trò chuyện vui vẻ với Kisaki."
3279 = "Tư thế này không tốt lắm. Tôi đang ở tư thế nửa đứng nửa ngồi. Bây giờ thì hoàn toàn không sao, nhưng để lâu sẽ mỏi lắm đây."
3281 = "Muốn em ấy bình tĩnh lại, tôi dùng tay còn trống chậm rãi vuốt ve Suzu."
3282 = "Đứng dậy."
3283 = "Tôi dừng lại một nhịp, suy nghĩ xem cách diễn đạt nào là khéo léo nhất."
3284 = "Cuối cùng tôi cũng hiểu, đã xâu chuỗi được rồi. Khi đã xâu chuỗi lại, tôi cảm thấy xấu hổ vì bản thân đã không nhận ra."
3286 = "Tôi và Hachiroku nhìn nhau, rồi cả hai, cùng quay đầu lại nhìn về phía trước."
3288 = "Nếu thực sự chưa chuẩn bị gì cả, thì ánh mắt đó sẽ khiến người ta xấu hổ đến mức muốn bỏ chạy. Nhưng——"
3289 = "Trong chăn, có lẽ Suzu đã thả lỏng cơ thể. Mùi xà phòng thoang thoảng lan tỏa, dễ dàng khiến tôi cảm thấy hạnh phúc."
3292 = "Dù sao đi nữa, đây cũng là chuyện phải đối mặt. Nếu vậy thì hãy sớm cùng nhau chia sẻ vấn đề này."
3294 = "Suzu dùng những từ ngữ đơn lẻ—— những gì em ấy cảm nhận được, cứ thế chân thực, thốt ra từ miệng."
3296 = "Dù nghĩ là không cần nói cũng hiểu, nhưng để xác nhận lẫn nhau, tôi vẫn sẽ giải thích."
3298 = "Chính vì vậy, tôi hiểu. Tôi có thể thành thật tin tưởng họ."
3299 = "Cái gọi là \"sự nhạy bén\", trước cả ngôn ngữ hay trí tuệ, có lẽ là một loại tố chất thuộc về lĩnh vực cảm giác."
3308 = "Cô Urakami khi rời khỏi công việc, đối với Hachiroku, chắc chắn đã công nhận em ấy một cách tích cực ở một khía cạnh nào đó."
3309 = "Tôi thấy cũng không cần phải vội vã như vậy, nhưng Hachiroku lại có vẻ bồn chồn một cách kỳ lạ."
3313 = "Việc từ bỏ tương lai, sẽ làm tổn thương và gây đau buồn cho những người xung quanh, và hơn ai hết là chính bản thân mình đến nhường nào."
3314 = "Vì vậy tôi nhẹ nhàng vuốt ve mí mắt em ấy, để em nhắm mắt lại lúc này."
3316 = "Về chuyện đó thì tôi có thể hiểu được, nên bây giờ trước mắt cứ tìm cách để Hachiroku đi nghỉ ngơi đã."
3320 = "Hibiki đột nhiên đứng dậy, vỗ bốp! vào lưng tôi."
3323 = "Lại nữa rồi. Sao Hibiki và chị Mayami cứ xa cách thế nào ấy. Nhìn là biết ngay, họ đang giữ ý với Hachiroku."
3329 = "Quả nhiên, sự bất an có tính lây lan sao, bé Mayu vốn đang vui vẻ, cũng dần dần, dần dần——"
3334 = "Chính vì là chuyện không thể làm gì được, nên tôi muốn nói chuyện thẳng thắn với Suzu."
3337 = "Tình mẹ thật vĩ đại."
3349 = "Đứa bé mà cô Urakami đang bế, có lẽ bị giật mình bởi khí thế đó, nên cất tiếng khóc nhỏ."
3351 = "Cô Urakami, đang mỉm cười."
3354 = "Tay cô Urakami từ từ di chuyển, trao đứa bé——bé Mayu vào vòng tay Hachiroku."
3357 = "Vừa nói, cô Urakami vừa cử động ngón tay trước mặt bé Mayu. Bé Mayu mở to đôi mắt tròn xoe, thích thú nhìn theo."
3359 = "Những giọt nước mắt, lã chã rơi từ đôi mắt Suzu."
3365 = "Nhưng, không thể kìm nén được mà lọt ra ngoài."
3367 = "Nhưng nơi khóe mắt ấy—— lại rơm rớm những giọt lệ mỏng manh."
3369 = "Nếu bỏ lỡ dòng chảy này, cơ hội này, thì rõ ràng là sẽ ngày càng khó hỏi hơn."
3373 = "Chắc hẳn họ đã hiểu được tâm trạng của tôi. Cả chị Mayami và Hibiki đều dứt khoát tiễn tôi đi."
3376 = "Quả không hổ danh là cha con nhà Houshou. Hiểu vấn đề nhanh nhạy không chê vào đâu được. Nhưng mà, lỡ có hiểu lầm gì thì rắc rối."
3385 = "Chị Mayami vô cùng điềm tĩnh, dùng lời nói thúc đẩy tôi."
3387 = "Chị Mayami, cúi đầu trước tôi. Hibiki cũng, làm theo, cúi đầu thật sâu."
3391 = "Ngay lúc bé Mayu định cho dây tua rua vào miệng mút, trong khoảnh khắc ngàn cân treo sợi tóc, tôi kéo luôn cả bàn tay nhỏ xíu của bé lại."
3402 = "Soạt—— Kisaki giơ tay phải lên."
3403 = "Khi Kisaki ngoan ngoãn thừa nhận, Hachiroku cũng vui vẻ gật đầu, rồi nhìn tôi với vẻ muốn được khen ngợi."
3406 = "Trước lời nhận xét thẳng thắn của Hachiroku, Kisaki cũng gật đầu. Quả thật, tôi chưa từng nghe thấy giọng điệu này bao giờ."
3413 = "Đến cả vinh hạnh luôn. Quả là một sự cảm động mãnh liệt."
3416 = "Hơn nữa, họ còn đùa giỡn với tôi. Để tôi không bị suy sụp, họ đã quan tâm đến cả tôi nữa."
3418 = "Khi tôi tắm xong, Suzu đã trải chăn nệm xong xuôi. Vừa chui vào chăn, em ấy liền vui vẻ nép sát vào người tôi."
3424 = "Rồi Hachiroku lặng lẽ, rời khỏi phòng khách và đi về phía phòng tắm."
3425 = "Sau đó em ấy ngước nhìn khuôn mặt tôi—— với ánh mắt ngập tràn niềm vui như muốn hỏi, phải làm sao đây."
3426 = "Thay cho câu trả lời bằng lời nói, những ngón tay đan vào nhau, Suzu nắm lại tay tôi thật chặt, không một kẽ hở."
3428 = "Giọng nói nũng nịu của bé Mayu. Bước chân của Hachiroku giật thót dừng lại."
3430 = "Vừa dứt lời, lông mày ông Mototada liền nhíu lại đầy vẻ khó chịu."
3431 = "Suzu nín thở, có vẻ như đang bối rối. Vì vậy, tôi nắm chặt lấy tay em ấy trong chăn."
3432 = "Bị chị Mayami gọi là \"Suzu\", tôi bất giác thẳng lưng lên. Vì đó là cái tên do tôi đặt——cái tên để gọi vợ tôi."
3436 = "Nếu lấy đó làm cái cớ, thì ngay từ đầu, chúng tôi thậm chí còn chẳng thể hồi sinh được 8620."
3438 = "Nếu đó là những lời nói vì nghĩ cho tôi, thì dù nó có ra sao, tôi cũng sẽ dốc toàn lực đón nhận."
3439 = "Nếu dùng lời lẽ hoa mỹ, thì chắc chắn, điều gì đó sẽ thay đổi."
3442 = "Nếu tỏ ra phấn khích, nếu để tôi cảm nhận được em ấy thích trẻ con——"
3443 = "Nếu không có quyết tâm tuyệt đối mang lại hạnh phúc cho đứa bé, thì vợ chồng chúng ta, không có tư cách để chào đón con cái."
3447 = "Rõ ràng là thích dây tua rua, thích ngón tay đến thế, nhưng bé Mayu bây giờ, trong mắt chỉ còn mỗi mẹ thôi."
3449 = "Bé Mayu cười toe toét trông rất vui vẻ."
3452 = "Bé Mayu vặn vẹo cơ thể có vẻ sốt ruột. Nếu vậy thì tôi khẽ buông tay bé ra——"
3453 = "Có phải bé cảm thấy kỳ lạ vì điều đó không? Ngón tay bé Mayu vươn tới."
3456 = "Là tiếng ợ. Thật sự rất đáng yêu. Nhưng Hachiroku lại cứng đờ người với vẻ mặt kinh ngạc."
3457 = "Sợi dây tua rua vàng rời khỏi tay bé Mayu, cánh tay bé vươn theo, đuổi bắt lấy nó."
3458 = "Bị bàn tay bé Mayu vỗ bép bép vào má—— Hachiroku, toàn thân đã đỏ bừng lên."
3460 = "Bàn tay bé Mayu, một cách dễ dàng, buông ngón tay Hachiroku ra."
3462 = "Chuyện bé Mayu ợ hơi cũng vậy—— Và cả chuyện cô Urakami gọi Hachiroku với hậu tố \"chan\" nữa."
3473 = "Việc khen ngợi hết lời cứ để sau đã, bây giờ trước mắt, phải tập trung lại vào ông Mototada."
3475 = "Nếu vậy thì, nhưng không may là tôi cũng chưa từng chăm sóc một đứa bé nhỏ thế này…… một đứa bé còn chưa đầy một tuổi bao giờ——!"
3485 = "Có lẽ cơ thể chuyển động theo nhịp thở của Hachiroku mang lại cảm giác dễ chịu, nhưng bé Mayu lại ngoan ngoãn nằm yên với vẻ mặt thoải mái——"
3486 = "Lực siết lấy tay tôi mạnh hơn."
3487 = "Nói rồi, Hachiroku hít thở sâu. Hai lần, ba lần."
3492 = "Chầm chậm chầm chậm, hết lần này đến lần khác—— Và rồi đến một lúc, không còn nghe thấy tiếng nấc nữa."
3504 = "Cơ, cơ mà, này!"
3505 = "Không, được tin tưởng thì vui thật đấy, nhưng Hachiroku vẫn chưa hoàn toàn bình tĩnh lại."
3506 = "Hơn ai hết, tôi biết rõ điều đó."
3507 = "Giọng nói này. Cách nói chuyện này. Chắc chắn không sai. Chắc chắn không sai nhưng……tôi không thể kết nối được, cũng không thể phản ứng lại."
3508 = "Có lẽ là hành động gần như theo phản xạ. Hachiroku đưa ngón tay ra phía trước bàn tay bé."
3509 = "Nếu vậy thì, tốt rồi."
3510 = "Chắc hẳn là âm thanh vô tình lọt ra ngoài. Suzu—— Không, dù đối phương là ông Mototada và Kisaki, thì đây vẫn là trước mặt người khác."
3511 = "Thật là, một bữa ăn kỳ lạ. Mặc dù người khơi mào câu chuyện là tôi nhưng……"
3514 = "Đến cả Kisaki cũng reo lên, đứng dậy với giọng điệu hân hoan."
3517 = "Báo cáo kinh doanh của các công ty tham gia dự án—— Mặc dù nội dung trong đó, toàn là những con số tăng trưởng."
3518 = "Bàn tay chầm chậm vươn tới đó, dường như muốn chạm vào má Hachiroku——"
3520 = "Các chuyến tàu nội đô và tàu đường dài tấp nập vào ra không ngớt, đúng nghĩa là trái tim của Teitetsu."
3521 = "Ánh mắt lạnh lẽo."
3524 = "Dùng bàn tay đó ôm chặt lấy cô Urakami, vùi nụ cười ngập tràn hạnh phúc vào ngực mẹ."
3525 = "Giấc mơ khi ngủ. Giấc mơ vẽ ra khi thức."
3531 = "Bàn tay Suzu, nắm lấy tay tôi, đan mười ngón tay vào nhau."
3532 = "Lã chã lã chã. Nước mắt Suzu không ngừng rơi. Thậm chí còn dữ dội hơn."
3533 = "Bàn tay Suzu, vẫn áp vào lòng bàn tay tôi rồi nới lỏng ra."
3538 = "Vui sướng, thích thú, hạnh phúc—— Chỉ nhìn thoáng qua cũng biết, nhưng em ấy lại không chịu bộc lộ niềm vui đó ra."
3554 = "Tại sao vậy nhỉ, em ấy liều mạng kìm nén tiếng cười——"
3555 = "Lúc được Hachiroku hay tôi bế, bé Mayu hầu như vẫn luôn nở nụ cười."
3556 = "Dù lại nắm chặt sợi dây tua rua vàng như một chiếc bùa hộ mệnh——"
3557 = "Tôi chậm mất một nhịp mới hiểu ra."
3558 = "Tôi chần chừ một thoáng không biết có nên nói hay không, nhưng ngay lập tức xua tan đi sự yếu đuối đó."
3559 = "Thời gian quả thực là gấp gáp, nhưng vẫn nằm trong phạm vi không bị trễ."
3561 = "Không lẽ, không lẽ cô Urakami đó——"
3563 = "Cô Urakami, người vẫn luôn theo dõi cuộc trò chuyện của chúng tôi, quay người về phía Kisaki."
3572 = "\"(Hửm?)\""
3573 = "\"(Nắm chặt!)\""
3575 = "(Nắm chặt)"
3576 = "\"(Bép bép)\""
3577 = "\"(Chạm)\""

[selections]
