2211 = "「May mắn là sự xáo trộn do việc thay đổi đầu máy xe lửa hầu như không xảy ra. Khảo sát về việc dùng \\x%lキハ07;#00ffc040;Kiha 07%l;#; kéo tàu cũng cho thấy mức độ hài lòng rất cao.」"
2213 = "「Xin lỗi ngài. Em có chút chuyện muốn nói ạ.」"
2215 = "「Hãy nghĩ về chiếc thang dùng để sửa mái nhà—— hai thanh dọc của chiếc thang đó, nếu coi là những tấm thép dày và rộng theo chiều dọc thì có lẽ sẽ dễ hiểu hơn ạ.」"
2218 = "「Hibiki——」"
2219 = "「Nippon Sharyo?」"
2221 = "「Vâng.」"
2223 = "「Ừ. Quan trọng nhất. Vì nó cũng gắn kết với em mà.」"
2225 = "「Ừ. Chúng ta cũng không thể nhờ vả ngài Aki đến mức đó được.」"
2228 = "「Là việc bảo tồn \\x%l列車;#00ffc040;đoàn tàu%l;#; trong trạng thái không hoạt động đó ạ. Biến nó thành món đồ kỷ niệm trang trí, và trân trọng nó đó ạ.」"
2230 = "「Vâng. Sự biến dạng của \\x%l台枠;#00ffc040;khung gầm%l;#; sẽ không còn là vấn đề nữa.」"
2234 = "「Vâng. Họ chỉ giữ lại bộ phận \\x%l電車;#00ffc040;tàu điện%l;#; và hiện tại vẫn—— Do đó.」"
2239 = "「Đúng vậy ạ. Lực tác động ngang mà \\x%l先台車;#00ffc040;giá chuyển hướng trước%l;#; không thể hấp thụ hết, sẽ được hấp thụ bằng cách uốn cong chính bản thân \\x%l台枠;#00ffc040;khung gầm%l;#; ạ.」"
2241 = "「Đúng vậy ạ. Ngài Soutetsu chính là người đứng đầu, là trung tâm.」"
2242 = "「Vâng, có chuyện đó ạ.」"
2244 = "「Không đùa đâu. Tải lên chưa đầy nửa tháng, đã có mười hai vạn lượt xem rồi đấy.」"
2247 = "「Vậy sao ạ.」"
2248 = "「Vậy sao ạ.」"
2250 = "「Là 58623 thưa ngài Soutetsu. Dù chưa từng gặp mặt trực tiếp, nhưng đó là đứa em gái đã chạy ở Shikoku ạ.」"
2256 = "「Trong trường hợp xấu nhất—— khi thực sự không thể sửa chữa được nữa, thú thật tôi nghĩ đó là cách tốt nhất trong những tình huống tồi tệ nhất.」"
2259 = "「Video của chúng ta…… mà lại có nhiều người xem đến vậy sao ạ?」"
2260 = "「Có rất nhiều người, những người tài giỏi và tuyệt vời—— đang tiếp thêm sức mạnh cho cỗ máy đó.」"
2267 = "「Khung gầm dạng tấm thì, à ừm, đại loại là thế này. Hãy tưởng tượng thân xe sẽ đặt lên trên cái này.」"
2268 = "「Khung gầm dạng tấm nghe nói từ thời đó đã rất khó ổn định chất lượng rồi…… Vào cuối thời kỳ \\x%l帝鉄;#00ffc040;Đường sắt Hoàng gia%l;#;, hầu hết đã được thay thế bằng khung gầm dạng thanh đấy.」"
2270 = "「Cái thứ gọi là khung gầm dạng tấm này—— lúc gặp những khúc cua gấp chẳng hạn, chẳng phải nó được thiết kế với tiền đề là có thể uốn cong sao?」"
2276 = "「Quả nhiên, sẽ thành ra như vậy sao.」"
2281 = "「Nói một cách khái quát thì, mười hai vạn người, thông qua mạng internet, đã xem đoạn video của chúng ta.」"
2289 = "「Như Hachiroku đã nói, 8620 có các cỗ máy cùng loại—— có rất nhiều chị em cùng dòng 8620.」"
2297 = "「Ví dụ như biến \\x%l石造機関庫;#00ffc040;xưởng đầu máy bằng đá%l;#; thành một nơi giống như nhà lưu niệm SL—— rồi biến \\x%l列車;#00ffc040;đoàn tàu%l;#; BBQ và 8620 thành hai đặc sản nổi tiếng luôn sao?」"
2302 = "「Tất nhiên là tốt hơn việc không có chút manh mối nào rồi. Nhưng mà——」"
2303 = "「Đúng vậy—— Nguy cơ vật thể lạ hay sự cố bất thường dẫn đến hỏng \\x%l台枠;#00ffc040;khung gầm%l;#;, từ đó gây ra tai nạn, hiện tại là quá cao.」"
2305 = "「Chính xác. Việc di chuyển bằng xe rơ-moóc không thể tránh khỏi chấn động, và sự chấn động đó có thể đẩy sự biến dạng của \\x%l台枠;#00ffc040;khung gầm%l;#; đến mức chí mạng.」"
2307 = "「Ừ.」"
2308 = "「Đúng vậy, rồi nghĩ rằng 『Thật đáng tiếc』 khi ra về, chắc chắn sẽ thấy rất tệ—— chị nghĩ vậy, nếu là chị.」"
2316 = "「Thị trưởng Paulette…… đã nói là sẽ xin tiền trợ cấp của thành phố cho Đường sắt Ohito nhưng mà.」"
2320 = "「Mức độ hài lòng cao là vì, khách hàng họ tự điều chỉnh lại tâm lý của mình đó thôi.」"
2321 = "「Để việc sửa chữa \\x%l台枠;#00ffc040;khung gầm%l;#; dù diễn biến ra sao cũng có thể ứng phó, cô ấy đã vạch sẵn rất nhiều đường hướng rồi.」"
2322 = "「Để biến thời gian bên em trở nên hạnh phúc hơn nữa. Tôi muốn chỉ nhìn vào khoảnh khắc này thôi.」"
2324 = "「Tại sao?」"
2325 = "「Tại sao chứ? Cứ như \\x%l客車;#00ffc040;toa hành khách%l;#;, vận chuyển bằng xe rơ-moóc là xong chuyện mà.」"
2327 = "「Tại sao, lại do nhiều nhà sản xuất, vậy ạ?」"
2333 = "「Reina cũng bất ngờ lắm đó nha! Mới trước đây thôi, chị ấy toàn hay quên.」"
2334 = "「Này, Reina!」"
2343 = "「Tất nhiên, sẽ thành thế này.」"
2345 = "「Tất nhiên rồi.」"
2348 = "「Nếu là bến thuyền thì có trà đó. Biết thế khỏi mua đồ uống là được rồi.」"
2349 = "「Hiện tại, sự biến dạng của \\x%l台枠;#00ffc040;khung gầm%l;#; vẫn chưa đến mức chí mạng. Nếu độ rung dọc ở mức nhẹ—— thì vẫn có thể chịu đựng được việc vận hành kinh doanh.」"
2356 = "「Những người đã xem đoạn video này. Những người đã đọc bản tin buồng lái. Tuyệt đối, đều muốn lên \\x%l列車;#00ffc040;đoàn tàu%l;#; BBQ cùng với 8620.」"
2360 = "「Thích ghê, được đổi cho nhau. Nè anh hai. Chúng ta cũng đổi cho nhau đi?」"
2367 = "「Thật sự…… đúng là vậy ạ.」"
2368 = "「Khá nhiều…… đấy ạ, xe bảo tồn dòng 8620.」"
2372 = "「Chị Kisaki đã dạy em rồi. Để nghĩ rằng sự lựa chọn của mình không hề sai lầm, con người sẽ tự điều chỉnh lại phán đoán của mình.」"
2377 = "「Chờ đã anh hai, đó là—— cái gì? Chuyện gì vậy?」"
2382 = "「Tóm, tóm lại! Là thế này!!」"
2383 = "「Trụ sở chính? Công ty vẫn còn tồn tại sao ạ?」"
2386 = "「Bụng, đói rồi nhỉ.」"
2390 = "「Có chứ. Nếu làm vậy, dù hình thức có chút thay đổi, chúng ta vẫn không phải gỡ bỏ hai tấm biển hiệu là 8620 và \\x%l列車;#00ffc040;đoàn tàu%l;#; BBQ.」"
2398 = "「Anh đang nghĩ nếu làm được như vậy. Nhưng mà, giả sử có cỗ máy nào phù hợp với điều kiện đó không đã.」"
2400 = "「SL, chỉ khi chạy mới có ý nghĩa ạ.」"
2402 = "「Ông Minokasa.」"
2405 = "「Đổi cho nhau, nghĩa là hoán đổi. Tức là」"
2406 = "「Cảm ơn em…… À ừm, vậy thì, chị lấy phần cơm cuộn trứng này được không?」"
2407 = "「Cảm ơn cậu. Vậy đi ha.」"
2412 = "「Bọn em mua về rồi đây~!」"
2414 = "「Ưu thế của 8620 với tư cách là cỗ máy số hiệu đầu tiên, chính là cảm giác thoải mái khi ngồi trên xe, nhờ được chế tạo vô cùng cẩn thận tỉ mỉ ạ.」"
2422 = "「Từ chức thị trưởng—— để tập trung vào vị trí giám đốc Đường sắt Ohito sao ạ?」"
2432 = "「Chuyện đó——」"
2433 = "「Chuyện đó—— thưa ngài Soutetsu. Em nghĩ là, sẽ khá khó khăn đấy ạ.」"
2434 = "「Đây là…… Hả!? Đùa sao, đã mười hai vạn lượt xem rồi á.」"
2435 = "「Không phải mệnh lệnh. Chỉ là một mong muốn thôi.」"
2436 = "「Chuyện nhỏ. Thế này nè.」"
2437 = "「Là một nhà sản xuất toa xe đường sắt ạ. Các em gái của tôi được chế tạo bởi nhiều nhà sản xuất khác nhau như Teikoku, Hitachi, Kawasaki, Sogo——」"
2446 = "「Thế, là sao cơ?」"
2449 = "「Vậy thì, phần còn lại tớ sẽ lấy nha. Rồi mỗi đứa đổi cho nhau một cái là được.」"
2450 = "「Tớ thì…… à ừm, cá bào, được không?」"
2452 = "「Nếu vậy——」"
2453 = "「Vậy thì—— Nếu bàn bạc với ngài Aki.」"
2454 = "「Nếu vậy—— có ai không. Về phương án sửa chữa \\x%l台枠;#00ffc040;khung gầm%l;#;—— Ai có ý kiến hay thì——」"
2456 = "「Vậy thì…… 8620—— sẽ ra sao, ạ?」"
2457 = "「Nếu vậy, đến bến thuyền ăn cho thoải mái thì sao ạ? Ạ. Giờ nghỉ trưa, chúng ta, cũng có nhiều thời gian. Mà.」"
2458 = "「Người đứng đầu trong số đó, chính là tôi nhỉ.」"
2459 = "「Vậy thì tôi sẽ, tiếp tục vun đắp hiện tại hạnh phúc này cùng với em.」"
2461 = "「Vậy, bắt đầu từ chị Hibiki nha.」"
2462 = "「Vậy, tớ lấy cái giăm bông với cà chua nha.」"
2465 = "「Chuyện lớn…… Quả đúng là vậy ạ.」"
2472 = "「Ngoại trừ Hachiroku, còn 686 cỗ máy nữa—— có lẽ, nhưng mà—— trong số đó, hẳn cũng có những cỗ máy đang được \\x%l静態保存;#00ffc040;lưu tĩnh%l;#;.」"
2475 = "「Được thôi được thôi.」"
2476 = "「Được thôi được thôi!」"
2477 = "「Tuy có hơi sớm. Bữa trưa, tính sao đây nhỉ.」"
2478 = "「Dù đây là một ví dụ cực đoan và khái quát, nhưng vấn đề mà 8620 đang gặp phải hiện tại chính là như thế này.」"
2479 = "「Ngài Soutetsu—— Em có thể xin phép nằm cạnh ngài được không ạ?」"
2480 = "「Cả ngài Soutetsu cũng vậy sao ạ?」"
2481 = "「Ngài Soutetsu thấy, an tâm—— sao ạ?」"
2482 = "「Ngài Soutetsu?」"
2487 = "「Nếu là \\x%l電車;#00ffc040;tàu điện%l;#; thì—— Ngài Aki, công chúa nhà Mouri sao?」"
2489 = "「Khi nào cần đến sức của Hachiroku và anh Soutetsu, tôi sẽ nhờ cậy đấy.」"
2494 = "「\\x%l静態保存;#00ffc040;Lưu tĩnh%l;#;……」"
2497 = "「Trước tiên, chúng ta nhất định phải có được \\x%l台枠;#00ffc040;khung gầm%l;#; cho 8620—— để nó có thể chạy lại một lần nữa!」"
2501 = "「!」"
2502 = "「!?」"
2503 = "「28651, 48640, 48674, 48696, 58623.」"
2505 = "「58623 đang được \\x%l静態保存;#00ffc040;lưu tĩnh%l;#; tại trụ sở chính của Nippon Sharyo—— ở Nagoya.」"
2506 = "「58623!」"
2507 = "「\\x%l台枠;#00ffc040;Khung gầm%l;#; của 8620 là khung gầm dạng tấm—— với chiều dọc là thép tấm cán nóng dày 25mm—— Tức là cấu trúc lấy chiều cao để tạo độ cứng cáp ạ.」"
2513 = "「Nếu 8620 đến lúc cạn kiệt tuổi thọ—— dù chỉ là một bộ \\x%l動輪;#00ffc040;bánh xe chủ động%l;#;, hay trở thành một phần của cỗ máy khác, tôi cũng sẽ mong nó tiếp tục chạy.」"
2515 = "「???」"
2516 = "「\\x%l列車;#00ffc040;Đoàn tàu%l;#; BBQ, là thứ phải có 8620 mới trọn vẹn.」"
2517 = "「\\x%l列車;#00ffc040;Đoàn tàu%l;#; BBQ thì \\x%l客車;#00ffc040;toa hành khách%l;#; mới là nhân vật chính…… Có vẻ như phần lớn khách du lịch đều hiểu điều đó nhỉ.」"
2529 = "『「A!」\\n「A!」』"
2688 = "Với khuôn mặt vô cùng đau khổ, Paulette giơ bàn tay trắng trẻo của mình lên."
2693 = "Một lát sau, Reina, cất lên những lời nói chậm rãi hơn thường ngày."
2694 = "Một lúc sau, với vẻ rụt rè."
2696 = "Nhưng—— ra vậy. Đây là làm nũng sao. Tôi, đang làm nũng với Hachiroku à."
2708 = "Và rồi, là những nụ cười. Hibiki, và cả tôi nữa, đều đang cười."
2710 = "Nhưng—— tôi không định lảng tránh điều đó nữa. Bởi vì đôi mắt của Hachiroku, chỉ đang kiếm tìm sự thật."
2713 = "Nhưng nụ cười ấy chợt mờ đi, như thể tan biến mất."
2714 = "Nhưng, sự mộc mạc đó cũng cho thấy con bé chưa hoàn toàn hiểu hết nội dung báo cáo đánh giá của Hachiroku."
2715 = "Nhưng nghe xong điều đó, Paulette vẫn giữ nguyên vẻ mặt bối rối."
2716 = "“Bản thân việc là cỗ máy số hiệu đầu tiên”, đối với đại đa số khách du lịch, sẽ chẳng mang lại giá trị gì."
2727 = "Nhưng dù vậy, Nagi vẫn nghiêng đầu đầy vẻ khó hiểu."
2728 = "Hai tấm thép dài dày 25mm được đặt thẳng đứng song song với nhau, giữa các tấm thép đó được kết nối bằng nhóm các tấm thép như thanh giằng ngang hay giá đỡ giãn nở phía trước."
2731 = "Hachiroku cũng nhanh chóng gói hộp bento lại, và gật đầu với tôi."
2733 = "Hachiroku cũng vậy—— Hachiroku bây giờ thì không nói làm gì, nhưng nếu là Hachiroku hồi mới gặp nhau thì……"
2735 = "Sự ngây thơ của Reina, được Hachiroku bao dung đón nhận."
2738 = "Có vẻ như ánh mắt của Hachiroku không dõi theo Paulette kỹ càng như khi cô ấy nhìn tôi hay \\x%l8620;#00ffc040;8620%l;#;."
2741 = "Hachiroku mỉm cười. Mùi hương ngọt ngào lại mơn trớn mũi tôi."
2744 = "Hachiroku từ từ ngước lên nhìn tôi. Giống như giọng nói, đôi mắt cô ấy cũng không hề có chút sức sống."
2745 = "Hachiroku ôm lấy tôi."
2747 = "Hachiroku cố gắng giải thích một cách dễ hiểu hơn."
2749 = "Tiếng reo hò! Hachiroku như chỉ chực nhảy cẫng lên."
2751 = "Với tình hình hiện tại, những lời đó chẳng khác nào tự dồn mình vào chân tường, nhưng Hachiroku vẫn nói ra mà không chút do dự."
2754 = "Hachiroku gật đầu một cách nhẹ nhàng nhưng—— Với tình hình hiện tại, việc xoay sở số tiền lên đến hàng trăm triệu quả là vô cùng khó khăn."
2755 = "Bầu không khí bao trùm lấy Hachiroku vô cùng nặng nề."
2756 = "Hachiroku dùng ánh mắt dò hỏi."
2761 = "Thời gian của Hachiroku và tôi là khác nhau. Dù sinh mệnh của tôi kết thúc, chắc chắn Hachiroku vẫn sẽ tiếp tục hoạt động."
2762 = "Giọng nói của Hachiroku, đầy vẻ hoài niệm và tự hào."
2763 = "Ánh mắt Hachiroku nhìn thẳng vào tôi."
2765 = "Hachiroku nhắm mắt lại vẻ đầy dễ chịu, rồi cất giọng vô cùng điềm đạm."
2766 = "Hachiroku khẽ gật đầu, một mùi hương ngọt ngào thoang thoảng mơn trớn mũi tôi."
2770 = "Cấu trúc của \\x%l台枠;#00ffc040;khung gầm%l;#; dạng tấm mà Hachiroku đã giải thích bằng bản vẽ và lời nói, nhưng có lẽ Nagi vẫn chưa thể hình dung ra được."
2773 = "Được chiếu sáng bởi nụ cười của Hachiroku, tựa như ánh mặt trời—— một nụ cười vô cùng thuần khiết, ngây thơ không chút tì vết."
2774 = "Hachiroku há hốc miệng ngạc nhiên."
2776 = "Phồng, má Hachiroku phồng lên. Tôi dùng ngón tay chọc cho xẹp lép."
2779 = "Những người khác đều mang vẻ mặt vô cùng nghiêm trọng, chỉ lặng lẽ ngồi đó."
2786 = "Thái độ của Nagi khiến tôi có cảm giác như đang được khao vậy. Tất nhiên là tiền thì do tôi trả rồi."
2787 = "Câu hỏi của Nagi vô cùng mộc mạc và thẳng thắn."
2792 = "Phần còn lại của tôi là—— Mì Ý Napolitan à. Cũng chẳng có cảm giác thèm ăn đặc biệt gì, thôi thì cũng không tệ."
2796 = "Ra là vậy, có lý lắm. Master trước đây của Hachiroku—— hình như là lái tàu Kiyomi."
2808 = "Cuộc trò chuyện giữa tôi và Hachiroku đã làm phiền họ sao—— Hai người có vẻ hơi luống cuống, bắt đầu ăn tiếp."
2810 = "Việc nhìn thấy hình dáng cụ thể có tác dụng lớn đến vậy sao. Cuối cùng, Nagi và Fukami cũng gật gù đồng ý."
2813 = "Hachiroku cất giọng nói tĩnh lặng xen vào, khi Nagi và Fukami gật đầu với vẻ mặt nghiêm túc."
2816 = "Đã trở thành một người gắn bó. Và cũng thực tâm mong muốn được gắn bó sâu sắc hơn nữa."
2817 = "Trái ngược với hai cô bé đang thèm ăn, từ bên cạnh tôi vẫn chưa nghe thấy âm thanh nhai than đá sảng khoái quen thuộc."
2820 = "A, cả Fukami cũng vậy sao. Nếu vậy có lẽ những người khác cũng không hiểu."
2826 = "Vốn dĩ da cô ấy đã trắng, nên hai má nhanh chóng ửng đỏ hình bàn tay."
2827 = "Giữa hai chiếc điều khiển đặt song song, tôi đặt ba cục pin thành hình chiếc thang."
2829 = "Ở gần Rail Shop cũng có chút ngượng ngùng, nên chúng tôi cứ thế đi thẳng một mạch, nhưng mà——"
2834 = "Màu xanh đó, có lẽ vì phấn khích và hy vọng, đang lấp lánh rực rỡ, chói lòa."
2835 = "Những chiếc điều khiển mất đi điểm tựa, thật thảm hại, bị hộp khăn giấy đè bẹp dí."
2838 = "Có vẻ như cô ấy đã xâu chuỗi được vấn đề. Khuôn mặt Paulette bừng sáng!"
2841 = "Không phải ở dưới chân như mọi khi, mà là ngay bên cạnh—— nơi hai khuôn mặt kề sát nhau."
2843 = "Cô ấy khẽ \"A\" một tiếng yếu ớt."
2844 = "Một giọng nói đầy nhiệt huyết. Cô ấy gật đầu thật sâu, như đang ngẫm nghĩ lại chính lời nói của mình."
2846 = "Một tiếng thở hắt ra như nhẹ nhõm, như thấu hiểu. Nhưng nghe cũng có chút gì đó cô đơn."
2849 = "Đôi mắt ấy chan chứa ánh sáng dịu dàng, dịu dàng và đầy hoài niệm."
2850 = "Tôi cảm nhận được sức thuyết phục không thể chối cãi từ điều đó—— Chính vì thế, tôi không thể không hỏi."
2852 = "Tôi dùng tay nhẹ nhàng vuốt ve mái tóc cô ấy, đầu cô ấy liền dụi sát vào tay tôi."
2855 = "Cử chỉ làm nũng ngây thơ đó, thật đáng yêu và đáng mến làm sao."
2856 = "Bị khẳng định như vậy, tôi không thể không thừa nhận rằng cô ấy nói đúng."
2857 = "Một nụ cười nhàn nhã, trông thật hạnh phúc."
2858 = "Nếu nói muốn đổi \\x%l台枠;#00ffc040;khung gầm%l;#; của \\x%l8620;#00ffc040;8620%l;#; bằng của xe khác, chắc chắn cô ấy sẽ lườm tôi cháy máy để bày tỏ sự bất mãn cho xem."
2863 = "Sau này, mỗi nhà sản xuất đều thể hiện cá tính riêng, và thêm vào những cải tiến độc đáo của riêng mình, nhưng mà……"
2866 = "Sự an tâm đó chuyển thành sự thong dong, mở rộng tầm nhìn của tôi."
2870 = "Sau khi kiểm tra kỹ lưỡng tình trạng hiện tại của \\x%l8620;#00ffc040;8620%l;#;, Hachiroku đưa ra báo cáo đánh giá. Nội dung chi tiết đó khiến tôi nhận ra mức độ nghiêm trọng của vấn đề."
2875 = "Dù đặt lên trên, khung gầm dạng tấm mô phỏng bằng điều khiển vẫn không hề lung lay dù chỉ một chút."
2877 = "Dù tôi đã nói vậy, nhưng vẻ mặt của Paulette vẫn không khá hơn."
2886 = "Âm thanh hơi nước làm quay \\x%l動輪;#00ffc040;bánh xe chủ động%l;#;. Bên trong \\x%lカマ;#00ffc040;lò hơi%l;#;, những hòn than đang cháy đỏ rực."
2905 = "Có cảm giác như mùi dầu gội, cũng có cảm giác đó là mùi hương của riêng Hachiroku."
2908 = "Tôi không thể nói ngay những lời tiếp theo."
2910 = "Vừa nói tôi vừa đứng bật dậy."
2912 = "Khi tôi nhắm mắt xuôi tay trước. Tôi không muốn em phải bị thiêu rụi cùng tôi."
2913 = "Tôi ôm lấy Hachiroku. Khẽ chạm trán vào trán cô ấy, rồi cứ thế nhẹ nhàng đặt một nụ hôn."
2919 = "Nhóm ở lại Rail Shop, và nhóm đi ra ngoài."
2920 = "Đoạn video của chúng tôi, của chúng ta. Video quảng bá \\x%l列車;#00ffc040;đoàn tàu%l;#; BBQ của \\x%l8620;#00ffc040;8620%l;#;."
2922 = "Tôi cất lời, và cũng đặt hy vọng vào ông Minokasa, người vẫn luôn lặng lẽ đọc tài liệu Hachiroku chuẩn bị từ đầu đến giờ."
2924 = "Điều đó thật đáng mừng, thật đáng biết ơn, nhưng đồng thời, quả thực cũng khiến tôi cảm thấy tiếc nuối."
2927 = "Tôi không nghĩ rằng mối quan hệ tin tưởng giữa cô ấy và Hachiroku lại nông cạn hơn mối quan hệ giữa tôi và Hachiroku đâu."
2930 = "Tôi liếc nhìn, Hachiroku vẫn đang mở hộp bento chứa than đá đặt trên đùi, bất động."
2931 = "Tôi mượn hai chiếc điều khiển từ Paulette, rồi dựng đứng chúng lên, để cạnh dài vuông góc với mặt bàn."
2933 = "Vì muốn làm vậy nên tôi vươn tay ra, luồn những ngón tay vào mái tóc óng ả của cô ấy."
2934 = "Tôi cảm nhận được những ánh nhìn. Hibiki và Fukami đầy vẻ lo lắng——"
2936 = "Định nhờ Reina giải thích thì lại bị hỏi ngược lại. Paulette và đền chủ Akai thì cứ chờ mãi chẳng chịu nói gì——"
2939 = "Tôi ngoan ngoãn làm theo đề xuất của Fukami."
2942 = "“Đa năng, nhưng cũng vì thế mà trở nên bình phàm” Bây giờ tôi mới chợt nhớ lại những gì được viết trong sách."
2944 = "Tôi dùng tay làm nghiêng hai chiếc điều khiển đang dựng thẳng đứng song song, tạo thành hình chữ V ngược (bát - ハ)."
2945 = "Tôi dùng ánh mắt dẫn dắt ánh nhìn của cô ấy, hướng về phía máy tính bảng của Hibiki."
2947 = "Tôi, tất nhiên là muốn gật đầu. Muốn gật đầu nhưng—— hiện thực không thể di dời con tàu đã không cho phép điều đó."
2949 = "Dù tôi đã nói thật những gì mình nghĩ, nhưng Hachiroku vẫn nghiêng đầu bối rối."
2950 = "Trước câu hỏi vô cùng thẳng thắn, tôi cũng đưa ra câu trả lời chân thành."
2952 = "Tôi gật đầu, Hachiroku liền chui vào trong chăn."
2954 = "Chính vì thế, người duy nhất mà tôi cảm thấy sự im lặng có phần khác biệt——"
2956 = "Vì thế nên liên tục được gia công bên ngoài."
2957 = "Vì thế, không còn cách nào khác, tôi đành truyền đạt lại những gì mình nghe được."
2965 = "Tôi buông tay ra."
2982 = "Một giọng nói gay gắt không giống Hibiki chút nào. Giọng Kumamoto bộc lộ hoàn toàn."
2984 = "Hibiki vừa lau tay bằng khăn tay vừa tiến lại gần. Có lẽ con bé vừa đi vệ sinh."
2987 = "Cái gật đầu mạnh mẽ của Hibiki và Nagi. Nhưng—— phản ứng chỉ có vậy."
2988 = "Cô bé đang bám víu vào tôi. Hibiki đang tuyệt vọng—— với ánh mắt mà ngay cả những ngày thơ ấu tôi cũng chưa từng thấy."
2991 = "Hibiki thao tác trên máy tính bảng. Trên màn hình, một đoạn video bắt đầu phát."
2992 = "Phần cơm cuộn trứng của Hibiki, bị chiếc thìa nhựa chia làm hai nửa."
2994 = "Ánh mắt Hibiki hướng về phía Nagi và Fukami."
2996 = "Dáng vẻ đầy cảm xúc của Hibiki, khiến tôi liên tưởng đến một mèo mẹ đang bảo vệ mèo con."
2999 = "Tôi định nói đùa vì quá ngượng, nhưng lại bị cô ấy đáp lại bằng một vẻ mặt vô cùng nghiêm túc."
3017 = "Paulette lẩm bẩm như nói một mình, nhẹ nhàng bù đắp cho sự thiếu hụt kiến thức của tôi."
3018 = "Khẽ hít một hơi. Ánh mắt Paulette lấy lại vẻ lý trí thường ngày."
3019 = "Paulette và đền chủ Akai, về cơ bản đã bày tỏ sự tán thành."
3020 = "Paulette lúc này đang dán mắt vào màn hình."
3021 = "Paulette gật đầu thật sâu. Rồi cái đầu vừa gật ấy từ từ nghiêng đi một góc khó hiểu."
3022 = "Paulette dùng hai tay, vỗ bộp vào hai bên má mình."
3023 = "Paulette đỏ bừng mặt cúi gằm xuống. Đền chủ Akai dường như cũng vội lảng tránh ánh mắt của tôi."
3024 = "Hibiki giật mình nín thở. Bởi giọng nói của Paulette nghe đau khổ đến tột cùng."
3027 = "Fukami chọn set bánh mì sandwich, còn Nagi chọn phần cơm nắm thập cẩm."
3030 = "Khoảnh khắc này, khoảnh khắc này. Nhiều lần, nhiều lần nữa—— vun đắp nhiều nhất có thể."
3031 = "Để giải thích cặn kẽ hơn nữa, tôi cũng thử vắt óc suy nghĩ."
3032 = "Không thể trả lời. Dù thế nào đi nữa."
3034 = "Cảnh đó chuyển sang ngọn lửa của chiếc lò sưởi, chồng chéo lên hình ảnh miếng thịt đang nướng, mỡ nhỏ giọt."
3041 = "Reina thở phào một tiếng như đã an tâm."
3049 = "Bằng cơ thể nhỏ bé, mỏng manh ấy—— nhưng vẫn dịu dàng bao bọc lấy tôi."
3050 = "Họ là những người đã tiếp tục gồng gánh bộ phận nay đã bị giải thể đó, cho đến tận giây phút cuối cùng."
3051 = "Thông qua sự liên kết, chuỗi \\x%l共感;#00ffc040;cộng cảm%l;#;, động thái của các em gái, chắc chắn Hachiroku vẫn luôn dõi theo."
3056 = "Vì bình thường cô ấy nói rất trôi chảy, nên tôi vô tình nghĩ rằng trình độ tiếng Hinomoto của Paulette cũng ngang bằng mình."
3060 = "Như thể ngưng tụ toàn bộ không khí nơi đây, tiếng \"A\" nặng trĩu—— của chị Mayami vang lên."
3076 = "Việc không thể trả lời đó, sẽ đẩy vận mệnh của \\x%l8620;#00ffc040;8620%l;#; đi theo hướng không mong muốn——"
3080 = "Khoảnh khắc nghe thấy, sức lực trên vai tôi như trút hết, khiến tôi nhận ra nãy giờ mình đã căng thẳng đến mức nào."
3082 = "Làm nũng, đây là lần đầu tiên trong đời tôi nhận được đánh giá như vậy."
3083 = "Kể từ khi phát hiện vấn đề, tôi và Hachiroku đã vắt óc suy nghĩ đến tuyệt vọng, nhưng vẫn không nghĩ ra diệu kế nào……"
3087 = "Nếu chỉ kinh doanh trong phạm vi tuyến Yui, gánh nặng lên \\x%l8620;#00ffc040;8620%l;#; sẽ được giữ ở mức tối thiểu."
3090 = "Nếu cứ chắp vá duy trì như vậy, thì thêm hai năm nữa—— cũng có thể vắt kiệt sức nó cho đến khi hao mòn hoàn toàn. Nhưng……"
3095 = "Bộp một tiếng, giọng nói của ông Minokasa vang lên. Giữa sự im lặng nặng nề, một giọng nói nhẹ nhàng vang lên như một tiếng lăn tròn."
3096 = "Hy vọng mỏng manh của tôi trước sự chỉ ra của ông Minokasa, dường như đã bị đè bẹp, trở nên nhỏ bé hơn nữa."
3110 = "Bị nhìn như vậy—— chỉ bị nhìn thôi, mà không hiểu sao nhịp tim tôi lại đập nhanh hơn."
3125 = "Giọng điệu cũng trở về…… vẻ thận trọng như mọi khi."
3126 = "Nói xong, Paulette chăm chú nhìn Hachiroku, rồi lại nhìn sang tôi."
3127 = "Đưa vị nghị sĩ lão thành thuộc phe phản đối thu hút nhà máy \\x%lエアクラ;#00ffc040;Aircra%l;#; lên làm thị trưởng nhiệm kỳ tới—— Theo hướng đó, phe phản đối đã hoàn toàn đoàn kết lại."
3137 = "Giọng nói của đền chủ Akai đã xua tan đi sự bất an đang len lỏi trong tôi."
3140 = "Thân xe thì—— tạm thời dùng hộp khăn giấy là được rồi."
3151 = "Toàn bộ chi phí liên quan, tất nhiên sẽ do chúng tôi—— hay nói đúng hơn là Công ty Cổ phần Đường sắt Ohito gánh vác."
3152 = "Những gì tôi mong muốn ở \\x%l8620;#00ffc040;8620%l;#;, chắc chắn, tôi cũng mong muốn điều tương tự ở Hachiroku."
3154 = "Đó là tác phẩm do bạn của Hibiki—— một người bán chuyên đang làm thêm công việc quay phim tại một trung tâm tiệc cưới ở Kumamoto, làm ra——"
3155 = "Có lẽ như vậy là đã hiểu rồi. Nhưng để chắc chắn, tôi giải thích thêm một chút."
3156 = "Cảm giác ngột ngạt như bị bít lối tiến thoái lưỡng nan——"
3157 = "Và Paulette cùng đền chủ Akai thì với ánh mắt điềm tĩnh. Có lẽ họ đang chăm chú để nhìn thấu lời nói của tôi."
3159 = "Khả năng sản xuất hàng loạt cực kỳ xuất sắc—— Nhìn từ góc độ ngược lại, cũng có nghĩa là không có điểm gì nổi trội."
3166 = "\\x%lキハ07;#00ffc040;Kiha 07%l;#; chắc chắn cũng là một toa xe đáng yêu và đầy sức hút, nhưng \\x%l8620;#00ffc040;8620%l;#; mới chính là bảng hiệu vàng cho sự phục hưng du lịch của Ohito——"
3167 = "Dù không hề bàn bạc trước, nhưng có vẻ như đã chia thành hai phe, một phe đã từ bỏ việc sửa chữa \\x%l8620;#00ffc040;8620%l;#; và phe kia thì không cam tâm từ bỏ."
3169 = "Dù phải đi bộ một đoạn mới đến bến thuyền, nhưng gió sông thổi mạnh táp vào mặt lại mang đến cảm giác dễ chịu."
3170 = "Đối với một kẻ chỉ biết có hiện tại như tôi, việc nghĩ đến tương lai quả thực chỉ là vô ích."
3178 = "\\x%l静態保存;#00ffc040;Lưu tĩnh%l;#; thì có vẻ không giúp ích gì cho việc chấn hưng du lịch. Còn cách sửa chữa \\x%l台枠;#00ffc040;khung gầm%l;#; thì cũng không tìm thấy."
3180 = "Những người đã \\x%l静態保存;#00ffc040;lưu tĩnh%l;#; 58623, là các kỹ sư tình nguyện của bộ phận hơi nước thuộc Nippon Sharyo——"
3181 = "Hai người rất am hiểu về đường sắt cùng lên tiếng đồng tình. Không ai đưa ra ý kiến phản đối."
3184 = "Trước câu hỏi đầy vẻ hưng phấn của Hibiki, Hachiroku trả lời với vẻ đầy tự hào."
3197 = "（Xình xịch, xình xịch, xình xịch, xình xịch）"
3198 = "（A——）"
3199 = "（Bốp!）"

[selections]
