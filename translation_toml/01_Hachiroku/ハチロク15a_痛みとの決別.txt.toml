2027 = "「Chắc chắn, em sẽ sắp xếp ổn thỏa. Vì thế, xin ngài Soutetsu hãy——」"
2028 = "「Cố chịu đựng thêm một chút nhé. Anh nhất định sẽ quay lại. Anh sẽ đưa người đến cứu viện nhanh nhất có thể」"
2029 = "「Tôi sẽ cố gắng điều chỉnh theo hướng đó. Không——nhất định tôi sẽ làm được!!」"
2031 = "「Cảm ơn cô. Dù tôi bây giờ, đối với cô, chẳng còn là \\x%l機関士;#00ffc040;người lái tàu%l;#; hay gì nữa」"
2035 = "「Về điểm đó, tôi cho rằng không có vấn đề gì」"
2037 = "「Em sẽ hỏi ngay đây. Anh đợi chút nhé」"
2038 = "「Tôi bất ngờ vì cô đã học hỏi về \\x%l保線;#00ffc040;bảo trì đường ray%l;#; nghiêm túc đến mức nào. Và còn truyền đạt lại một cách chính xác cho mọi người ở Đường sắt Ohito nữa chứ」"
2041 = "「Vì thế, em sẽ!」"
2044 = "「Vì thế, chuyến tàu——phải, cho chạy, mới được. Đúng như, biểu đồ chạy tàu——dù thế, nào đi nữa」"
2045 = "「Vì thế, xin ngài Soutetsu hãy. Đưa ra phán đoán và chỉ thị tốt nhất của ngài」"
2048 = "「Điện thoại?」"
2049 = "「Không, có chuyện đó đâu! Olivy, dù được sản xuất tại [メリケン,2]Mỹ, dù anh không phải là Master, hay \\x%lレイルロオド;#00ffc040;Railord%l;#;, đi chăng nữa」"
2053 = "「Yên tâm đi. Không có thiệt hại về người」"
2057 = "「Hàng cứu trợ?」"
2060 = "「Nếu để đầu máy số 9 kéo đoàn tàu chở cả hàng cứu trợ—— Thì chẳng phải chúng ta có thể làm thêm điều gì đó nữa sao?」"
2063 = "「Hibi, ki, đã——xuống nhà, trước, mất, rồi. Chị Mayami——đã chuẩn bị, xong xuôi——bữa sáng, rồi——」"
2068 = "「Chào buổi sáng——ờm——đúng rồi!? Tình hình! Tình hình \\x%l保線;#00ffc040;bảo trì đường ray%l;#;, sao rồi?」"
2070 = "「Chào buổi sáng. Olivy」"
2071 = "「Em hiểu rồi」"
2073 = "Phải làm sao bây giờ. Khi không có lấy một manh mối nào, tôi chẳng còn cách nào khác ngoài việc tiếp tục gọi tên bé ấy."
2075 = "「Đúng, không? Nguyên nhân, đã rõ ràng, rồi—— Nên việc khắc phục, tuyệt đối, sẽ kịp, mà!」"
2078 = "「Đúng vậy ạ. Vô cùng——đẹp đẽ. Đẹp đẽ, mạnh mẽ——nhưng vẫn, rất đáng yêu」"
2079 = "「Đúng vậy. Tất nhiên, hiện tại đây chỉ là suy luận, nhưng nếu nghĩ theo hướng đó thì hoàn toàn hợp lý」"
2080 = "「Đúng vậy」"
2081 = "「Vâng. Đang kết nối với Tiến sĩ Fushicho ạ」"
2084 = "「Đúng vậy. Đầu tiên là trong trường hợp cho tàu chạy——việc khắc phục điểm sụt lún cũng có khả năng chỉ là biện pháp sơ cứu tạm thời」"
2085 = "「Vâng」"
2086 = "「Cả phương án cho tàu chạy trên tuyến đường bầu trời, và phương án ngừng chạy đúng không ạ?」"
2088 = "「『Khả năng xảy ra nổ hơi nước lần nữa tại cùng một địa điểm, được suy đoán là rất thấp』——sao?」"
2091 = "「Đã lâu không gặp, Olivy」"
2093 = "「Sắp đến rồi ạ, vì có cả 8620 làm \\x%l補機;#00ffc040;đầu máy phụ%l;#; đẩy phía sau nữa ạ」"
2097 = "「Ra, vậy……Ehehe, là Soutetsu, đã gọi anh đến nhỉ」"
2100 = "「Ví dụ như, biến nó thành chuyến tàu giải nghệ của \\x%lレイルロオド;#00ffc040;Railord%l;#; Olivy, người đã chạy suốt hơn 100 năm từ thời \\x%l明智;#00ffc040;Meiji%l;#;——chẳng hạn?」"
2105 = "「Xin ngài hãy lo cho bé Olivy, thay vì lo cho em. Hãy lo cho tuyến đường sắt mà bé Olivy đang cố gắng bảo vệ này」"
2107 = "「Bóng bay?」"
2113 = "Tôi tự nhủ. Đúng hơn là, tự nói với chính mình. Để bản thân không bao giờ tuyệt vọng."
2114 = "「Đúng. ……Vụ nổ, đó, làm nứt, lớp đá nền. Từ chỗ, nứt, hơi nước, chắc chắn, đã phun ra」"
2115 = "「Đúng, vậy đó. ——Quả, nhiên」"
2116 = "「Ừ, đúng thế. Tôi nhận được yêu cầu từ Đường sắt Ohito. Họ muốn tôi giám sát và đánh giá các biện pháp khắc phục sự cố sụt lún」"
2117 = "「Vâng. Là em đây. Olivy」"
2124 = "「Paulette. Việc điều tra nguyên nhân thảm họa sẽ mất khoảng bao lâu」"
2129 = "「Tuyến Yui cứ giao cho em. Reina có thể chạy thay bao nhiêu chuyến cũng được ạ」"
2135 = "「Hiện tại chưa có đủ thông tin để khẳng định là an toàn. Vì thế, anh không thể trả lời ngay lúc này được」"
2136 = "「Nó không nằm ở độ sâu nông đến mức có thể khoan tới được. Việc hình thành túi hơi nước, và đẩy toàn bộ bề mặt lên là」"
2141 = "「Tất nhiên, vẫn phải xác nhận lại với người thiết kế là Hibiki」"
2142 = "「Cô có sẵn dụng cụ tự bảo trì ở đó không?」"
2148 = "「Nghe nói ống nước bị đứt, đường lên núi bị cấm qua lại hoàn toàn. Nước giếng cũng không thể dùng được nữa. Vì thế——」"
2150 = "「Đúng là, tuyến đường bầu trời khó khăn lắm mới bắt đầu ổn định, nếu bị coi là 『tuyến đường phải dừng vì núi lửa phun trào』 thì sẽ chí mạng lắm」"
2152 = "「Trực thăng!?」"
2157 = "Bởi vì trân trọng từng giây từng phút lúc này, mới là con đường duy nhất để cứu bé Olivy."
2163 = "「Sau đó hơi nước thoát ra, quả bóng bay xẹp lép, nên chỗ bị đẩy lên mới lún xuống nhỉ」"
2166 = "「Ha——a——gi——kua——ga!!」"
2171 = "「Dậy——đi——nào——Oli, vy. Ngài Soutetsu——chị Mayami——Hibiki, đang đợi đó」"
2172 = "「Cảm ơn chị rất nhiều. Anh thấy sao? Soutetsu」"
2178 = "「[じくじゅう,1]Tải trọng trục!! Nhẹ hơn 8620 rất nhiều!! Đầu máy số 9! Cứ cho đầu máy số 9 chạy là được mà!!!」"
2187 = "「Ý kiến hay đó! Nếu đầu máy số 9 không qua được đèo Yadake, thì cứ dùng 8620 làm \\x%l補機;#00ffc040;đầu máy phụ%l;#; là xong!」"
2189 = "「Chuyện đó thì……À, không! Là bộ gạt vật cản! Bộ gạt vật cản của đầu máy số 9 đang cào tuyết dọn đường——」"
2190 = "Vì thế, tôi gạt phăng đi nỗi bất an đang bủa vây. Dùng lời nói, dùng hy vọng, làm chiếc ô che chắn."
2191 = "「Hừm」"
2192 = "「Vậy, sao」"
2193 = "「Nhưng, chắc chắn là sắp đến rồi ạ. Vì là ngài Soutetsu đích thân ra tay mà. Chắc chắn, sắp đến rồi――――A!」"
2194 = "「Vậy thì, Hachiroku——hãy làm, đôi mắt, của Olivy, nhé? Hãy quan sát thật kỹ, toàn bộ tình hình, rồi, báo lại cho chị」"
2197 = "Không ngờ lại có liên lạc sớm đến vậy, à không! Dù sao thì cũng phải nghe máy đã."
2199 = "「Tất nhiên là em luôn mang theo bên mình ạ!」"
2201 = "「Nếu vậy, việc chạy đúng theo biểu đồ cũng có khả năng thực hiện được. Nhân tiện, Hachiroku thì sao」"
2203 = "「Vậy thì, bao gồm cả phần trọng lượng tăng thêm đó, chúng ta cũng hãy chờ phán đoán của chuyên gia xem sao」"
2205 = "「Nếu chuyện đó xảy ra……lại phải bỏ tuyến sao? Tuyến đường khó khăn lắm mới khôi phục, mới nối lại được mà」"
2206 = "「Hừm. Nếu là nguyên nhân cản trở việc khởi động lại của cô Olivy, dù dùng phương pháp loại trừ, nhưng có lẽ tôi đã xác định được rồi」"
2209 = "「Những cuộc khảo sát liên tục của em, đã trở thành lời cảnh báo. Khu vực đó đã chủ động sơ tán sớm với lý do 『Trời có tuyết, cứ đề phòng cho chắc』」"
2210 = "「Vì thế, anh muốn Suzu cố gắng theo dõi tình trạng này càng lâu càng tốt. Nhưng, nếu thấy quá sức thì phải dừng lại ngay nhé」"
2212 = "「Về hoạt động của núi lửa, anh đã nhận được những nhận định sau đây. Tất nhiên, đây chỉ là tin nhanh, chưa phải là thông tin chính thức——」"
2214 = "「Bộ gạt vật cản……Ra vậy. Cuối cùng thì, cũng lắp vào rồi nhỉ」"
2216 = "「Anh hai, điện thoại! Ai gọi vậy!?」"
2223 = "「À không, hiện trường sụt lún vẫn——A」"
2227 = "「Trực thăng cứu nạn của tỉnh Kumamoto——Đang trên đường đến thành phố Kirishima—— Để khắc phục đường ray——A! Chở theo cả chú Seki nữa!!」"
2228 = "「Nhưng, họ đang tiến lên một cách vững chắc. Cùng với đầu máy số 9, và 8620—— Dù chỉ nhích từng chút một, như đang bám sát mặt đất mà trườn lên」"
2229 = "「Hiện tại, dù chưa có quyết định chính thức nào, nhưng vẫn có khả năng tàu sẽ chạy đúng theo biểu đồ」"
2230 = "「Ngài, Sou, tetsu——sẽ——với vẻ mặt, vui vẻ, đem đến——loại than đá, hảo hạng nhất——」"
2231 = "「Soutetsu」"
2232 = "「Ngài, Soutetsu——cũng——đang đợi—— Oli, vy——đó——」"
2233 = "「Ngài Soutetsu, đã để ngài phải đợi lâu」"
2234 = "「Soutetsu, bên đó, sao rồi? Tình hình tai nạn, chi tiết, đã nắm được, bao nhiêu, rồi?」"
2236 = "「Về thảm họa thứ cấp kèm theo vụ nổ này. Hoặc là, nguy cơ xảy ra nổ/phun trào lần nữa, nhờ em hỏi luôn nhé」"
2239 = "「Sắp đến rồi ạ, Olivy. Chắc chắn——sắp đến rồi」"
2241 = "「!」"
2242 = "「!!!」"
2245 = "「(Hộc……hộc……)」"
2247 = "「8620……cũng——có thể, chạy, được—— Nên, cho em, bốn, tiếng——tiếng nữa……thôi」"
2248 = "「Cả 8620 nữa sao? Tuyệt quá, hoành tráng, quá nhỉ——」"
2251 = "「Là \\x%l共感;#00ffc040;cộng cảm%l;#; từ Navi! Hình ảnh từ camera và dữ liệu tổng hợp, em sẽ truyền cho cả Olivy——!」"
2256 = "「~~~!!!!」"
2390 = "「Tiến sĩ Fushicho!」"
2393 = "Sợi dây xích mang tên tâm niệm từng hành hạ bé Olivy, giờ đây, đang nâng đỡ tôi, nâng đỡ bé Olivy. Nâng đỡ cả hai chúng tôi."
2398 = "Dù mong muốn có mãnh liệt đến đâu, cũng không bao giờ đánh mất tầm quan trọng của việc đảm bảo an toàn."
2399 = "Ngài Soutetsu dứt khoát buông tay ra. Tôi cố kìm nén cảm giác cô đơn trong lòng."
2405 = "Ngài Soutetsu ôm trọn lấy tôi, khi tôi đang ôm bé Olivy trong tay."
2414 = "Đầu tiên là Hibiki, Nagi và Reina. Tiếp theo là Paulette Kisaki, Niiroku—— Cuối cùng là chị Mayami và cả Thầy cúng Akai."
2416 = "Chỉ điều đó thôi cũng đã tiếp thêm cho tôi một sức mạnh to lớn. Giọng nói, từng câu chữ của ngài Soutetsu, đã bao bọc lấy sự bất an trong tôi."
2419 = "Hachiroku đang—— khóc, dù không rơi một giọt nước mắt."
2430 = "Trực giác của Nagi thật đáng nể. Hoàn toàn không có sự khác biệt về mặt nội dung so với lời giải thích từ các chuyên gia."
2434 = "Thậm chí đến cả tên ngài Munakata, bé ấy cũng không phản ứng—— Không, là trong tình trạng không thể phản ứng."
2441 = "Không phải là biến dạng, mà là sụt lún sao—— Ngay khi nghĩ vậy, một hình ảnh hiện lên trong đầu tôi."
2442 = "Ra vậy, kết nối \\x%l共感;#00ffc040;cộng cảm%l;#; mật thiết sao."
2444 = "「Á!?」"
2463 = "——Dù có lặp lại bao nhiêu thao tác đi chăng nữa, bé Olivy vẫn không hề nhúc nhích dù chỉ một chút."
2465 = "Nhưng——nhưng tôi hiểu rõ. Nếu buông tay khỏi kết nối này, tôi sẽ sợ hãi, và không bao giờ có thể quay lại được nữa."
2466 = "「Nếu không có em, công việc khắc phục sự cố sẽ không thể tiến hành được. Chúng ta, rất cần có Olivy đấy」"
2471 = "Nhưng tôi cũng có những kinh nghiệm mà bản thân đã tích lũy được. Tuyệt đối không thể làm lung lay nguyên tắc \"An toàn là sứ mệnh lớn nhất\"."
2472 = "Nhưng, làm gì có thời gian mà che giấu chứ—— Cả sự ghen tị nhỏ nhoi này——hãy mang lại cuộc sống thường ngày cho bé Olivy!"
2474 = "Nhưng, tôi có trách nhiệm. Trách nhiệm vận hành tàu một cách an toàn——trong trạng thái an toàn nhất."
2481 = "Vì là vợ chồng, nên dù qua giọng nói đang cố tỏ ra bình tĩnh, tôi vẫn cảm nhận được rõ ràng."
2483 = "Chắc chắn chú Seki và mọi người sẽ thay thế bé Olivy, trở thành những đôi bàn tay tuyệt vời nhất."
2489 = "Vì Olivy—— Chỉ vì điều đó, mọi người đang cùng nhau nối lại đường ray."
2491 = "Mọi người đều gật đầu. Đồng tình với tôi."
2502 = "Tình trạng của Olivy nghiêm trọng đến mức nào. Và Hachiroku trân trọng khoảnh khắc này đến nhường nào."
2503 = "Khuôn mặt nhỏ nhắn của bé Olivy vẫn còn đang ngơ ngác, rồi mỉm cười ngại ngùng."
2504 = "Sự mệt mỏi. Sâu thẳm. Sâu thẳm. Sâu thẳm. ——Olivy đã kiệt sức đến mức không thể cứu vãn."
2505 = "Cảm nhận được. Đang tuôn trào. Bé Olivy. Tất cả của tôi, cũng đang truyền đến bé Olivy."
2506 = "Bé Olivy định giơ tay lên—— Nhưng không thể đưa lên tới vai, đành phải hạ xuống."
2507 = "Chỉ một nhịp. Trong khoảng trống khi giọng nói ngắt quãng, sự mệt mỏi đậm đặc rỉ ra."
2508 = "Để bé Olivy cầm lại ống nghe, tôi tiến về phía hiện trường sụt lún."
2510 = "Em ấy đang cố gắng hết sức để hoàn thành nhiệm vụ quan trọng nhất, ưu tiên nhất. Nếu vậy, anh cũng phải đáp lại bằng cách dốc hết sức mình."
2512 = "Giọng nói của Olivy dù đau đớn, nhưng lại như muốn cắn xé. Khí phách quá đỗi mạnh mẽ ấy khiến tôi giật mình trong chốc lát."
2518 = "「Đây là việc mà ngài Munakata đã giao phó mà. Olivy sẽ ổn thôi. Chắc chắn, em ấy sẽ hoàn thành được」"
2520 = "Dù có bị ghét bỏ, nhưng vì sự an toàn—— Đây chính là hình mẫu lý tưởng của một nhân viên đường sắt, của một \\x%lレイルロオド;#00ffc040;Railord%l;#;. Nhưng——"
2530 = "Nhiệm vụ mà bé Olivy được giao phó. Dù thế nào đi nữa, cũng phải hoàn thành cho bằ——!!?"
2538 = "Bởi vì chúng tôi, những \\x%lレイルロオド;#00ffc040;Railord%l;#;. Chắc chắn được tạo ra, là vì mục đích đó."
2539 = "「……Từ trạng thái đang hoạt động mà lại sập nguồn ngay lập tức sao. Tình trạng này vô cùng nghiêm trọng đấy」"
2540 = "Căn cứ bảo trì đường ray được mở rộng cũng là vì mục đích đó. Phát hiện sớm, xử lý sớm."
2541 = "Sự chuẩn bị đang phát huy tác dụng một cách thích hợp—— Tất cả những điều đó, đều do Olivy và ngài Munakata mang lại."
2542 = "Với tư cách là phương tiện giao thông công cộng, hay phương tiện du lịch, \"Khôi phục lòng tin vào đường sắt\"."
2547 = "Ngay khoảnh khắc tôi nhận ra, một luồng \\x%l共感;#00ffc040;cộng cảm%l;#; giả lập chỉ có thông tin mà không có cảm xúc——giống hệt như ô tô Aircra——được gửi đến."
2549 = "Chắc hẳn ngài Soutetsu hoặc ngài Paulette đã liên lạc với cô ấy. Thật là một sự hỗ trợ vững chắc biết bao——"
2550 = "Cố gắng để giọng nói không run rẩy. Nuốt những lời muốn nói vào trong, rồi đặt ống nghe xuống. Tuyệt đối không được lãng phí khoảng thời gian quý giá của Olivy."
2553 = "「A!」"
2556 = "Nhưng, không có tiếng trả lời——thậm chí chẳng có lấy một chút phản ứng nào. Dù tôi có khẽ thử kết nối \\x%l共感;#00ffc040;cộng cảm%l;#;, cũng chẳng nhận lại được hồi đáp."
2558 = "Tôi chỉnh lại tư thế ngón tay, giơ tay chào. Sau đó, đặt chiếc điện thoại di động vào tay bé Olivy."
2560 = "Chị, lúc nào cũng, ghen tị, với em, đó!!!"
2561 = "Tôi, tưởng tượng, ra chiếc dùi, đục đá—— Loại than đá, được đập nhỏ, đó——"
2564 = "Đường ray, mặt đất bị biến dạng, Tôi nhớ lại cảnh tượng nhìn thấy khoảnh khắc đỡ Olivy dậy."
2566 = "Không chút do dự, tôi kết nối sâu vào trong."
2567 = "Tôi không tự tin rằng mình đang bình tĩnh. Nhưng trong thâm tâm, cũng có một phần trong tôi đang gào thét rằng đây là phán đoán lý trí."
2570 = "Hít một hơi—— Tôi quay lại với ống nghe, với Olivy."
2573 = "Sâu bên trong tôi, thứ bảo vệ chính bản thân tôi, không ngừng yêu cầu ngắt kết nối \\x%l共感;#00ffc040;cộng cảm%l;#;."
2575 = "Sự tập trung, hình ảnh tưởng tượng, ngay lập tức bị xé toạc thành từng mảnh. Dù vậy, tôi tuyệt đối——tuyệt đối không cự tuyệt cơn đau này."
2577 = "Không được hoảng hốt. Tuyệt đối không được khóc. Nếu để lộ ra những điều đó——"
2580 = "Tiếng điện thoại lại reo lên, khiến tôi giật mình trong chốc lát. Nhưng Paulette vẫn với động tác thường ngày, nhấc ống nghe lên."
2581 = "Tôi đọc to những điểm chính trong tờ giấy ghi chú mà Paulette đưa cho."
2585 = "Tiến vào nơi sâu thẳm nhất trong \\x%l共感;#00ffc040;cộng cảm%l;#; của bé Olivy, nơi mà bình thường tuyệt đối không bao giờ bước vào——!!?"
2587 = "Vì thế, tôi tuyệt vọng tưởng tượng. Vẽ ra trong tâm trí. Buổi sáng thường ngày. Ngôi nhà thường ngày."
2590 = "Đã hòa làm một. Tâm trí, đã hòa làm một."
2592 = "Khi tôi truyền đạt lại nguyên văn ý kiến từ các chuyên gia, từng người một——bắt đầu gật đầu đáp lại."
2596 = "Đôi cánh tay đang ôm bé ấy của tôi nóng rát như muốn bỏng dù đã qua lớp đồng phục. Để đối phó với mức nhiệt cao thế này, có lẽ không còn cách nào khác ngoài việc làm mát."
2600 = "Nếu vậy, việc mà tôi có thể làm—— chỉ có duy nhất một cách này thôi."
2602 = "Nếu vậy, đành kìm nén sự nóng vội, giải thích ở đây có lẽ lại là con đường ngắn nhất."
2613 = "Hibiki nhanh chóng vẽ một sơ đồ lên cuốn sổ phác thảo."
2615 = "Hibiki gật đầu. Vô cùng mạnh mẽ."
2617 = "Chỉ trong vài phút gọi điện ngắn ngủi, đôi bàn tay không đeo găng của ngài ấy đã đỏ ửng cả lên."
2621 = "Khi chị Mayami nhẹ nhàng phá vỡ sự im lặng đó, người lập tức hưởng ứng là Nagi."
2630 = "Là tiếng điện thoại. Chiếc điện thoại mà ngài Soutetsu đã giao cho tôi——"
2636 = "Paulette lập tức lấy bản vẽ thiết kế ra, Niiroku cũng lao vào bắt đầu tính toán như hổ đói."
2637 = "Paulette khẽ huých vai gọi tôi, rồi cho tôi xem tờ giấy ghi chú trên tay."
2646 = "Ngài Soutetsu đưa cho tôi chiếc điện thoại di động dùng cho công việc, rồi chạy vội về phía căn cứ bảo trì đường ray."
2652 = "Tôi ý thức được rằng, bản thân mình là một đồ vật."
2657 = "Cơn đau đâm xuyên và nhân lên ở tận cùng đáy lòng tôi, vừa bùng nổ phình to, vừa ra lệnh duy nhất một điều."
2659 = "Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau Đau"
2660 = "「Việc liên tục cự tuyệt mệnh lệnh sẽ trở thành một gánh nặng và cơn đau vô cùng khắc nghiệt. Vì thế, cô Olivy đã bị vắt kiệt sức lực đến mức giới hạn——」"
2663 = "Điểm hạ cánh được yêu cầu là——Phía sau căn cứ bảo trì đường ray. Bãi đất bằng phẳng mà Navi hay hạ cánh có lẽ là thích hợp nhất."
2670 = "Dù là con dốc 30.3 phần nghìn của đèo Yadake phủ đầy tuyết trắng, chúng ta, nhất định sẽ vượt qua và đến được đích."
2675 = "Gió——Một cơn cuồng phong bất ngờ ập xuống từ trên cao—— Hả!!?"
2677 = "Ngực tôi nhói đau. Không phải của bé Olivy, mà là của chính bản thân tôi."
2679 = "Một âm thanh ngắn ngủi, khẽ lọt ra. Giống như tiếng nói, lại giống như tiếng thở hắt ra."
2684 = "Việc tôi an ủi Hachiroku, hay để Hachiroku an ủi tôi——đợi đến khi mọi chuyện kết thúc cũng được."
2686 = "Cơn đau đó. Cơn đau dữ dội đó, là một thiết bị an toàn không thể thiếu. Là lời cảnh báo cuối cùng để ngăn chặn việc đột ngột ngừng hoạt động."
2690 = "Và Hachiroku, hơn ai hết, hiểu được tâm trạng của tôi."
2692 = "Chúng tôi là \\x%lレイルロオド;#00ffc040;Railord%l;#;. Là những tồn tại gánh vác sự an toàn của đường sắt. Do đó, cấu tạo vốn dĩ không cho phép xảy ra việc đột ngột ngừng hoạt động."
2695 = "Nếu vậy, việc \\x%l共感;#00ffc040;cộng cảm%l;#; đến mức đó là——"
2698 = "Bởi vì hiện tại, chúng ta vẫn chỉ đang lê từng bước chân vô cùng yếu ớt, chậm chạp tiến lên mà thôi."
2700 = "Dù vô cùng thông minh, nhưng Kisaki lại đang lộ vẻ mặt khó hiểu."
2716 = "\\x%l共感;#00ffc040;Cộng cảm%l;#;, và——bằng cách chấp nhận, bằng cách chia sẻ Dù chỉ một chút thôi, nếu có thể giảm bớt gánh nặng cho bé Olivy!"
2727 = "Không biết sẽ gây ra ảnh hưởng xấu thế nào đến bé Olivy đang nằm bất tỉnh trong vòng tay tôi."
2728 = "Cùng với lời nói, bé Olivy trở lại là bé Olivy, và tôi trở lại là chính tôi."
2731 = "Đọc xong, một sự im lặng bao trùm trong chốc lát, một sự im lặng vô cùng thận trọng——"
2746 = "「Em cố chịu đựng thêm chút nữa nhé? Chắc chắn, em sẽ khỏe lại ngay thôi」"
2747 = "Thật là một tâm niệm đẹp đẽ làm sao. Sự thuần khiết của bé Olivy dành cho ngài Munakata——"
2748 = "Vượt qua cả ngôn từ, vang vọng trực tiếp vào sâu bên trong \\x%lタブレット;#00ffc040;Tablet%l;#;, 『Dừng lại』 『Hãy đảm bảo an toàn』."
2750 = "Nếu được như vậy, sẽ chẳng còn bất kỳ trở ngại nào nữa."
2751 = "Tôi nên nói gì đây. À không, chẳng cần phải suy nghĩ nữa."
2752 = "「Thứ cản trở cô Olivy khởi động lại, có lẽ là nỗi sợ hãi đối với 『cơn đau dùng để ngăn chặn việc ngừng hoạt động tức thời』」"
2753 = "「『Việc cần phải làm』 mà cô Hachiroku vừa nhắc tới lúc nãy. Có lẽ chính điều đó đã gây ra một cơn đau liên tục không thể có trong tình trạng bình thường」"
2756 = "Nếu vậy, Olivy có thể vừa nằm nghỉ ngơi, vừa tiếp tục chỉ huy hiện trường."
2757 = "Nhất định chúng ta sẽ nối lại đường ray. Để đưa một người quan trọng, đến nơi mà họ mong muốn——"
2761 = "Cơn sốt kéo dài dằng dặc, cùng với việc cố gắng hoạt động quá sức—— đã ăn mòn bé Olivy quá sâu."
2764 = "Cản trở việc ngừng hoạt động—— Cơn đau dành cho việc đó, có thể nói là, cơn đau sâu thẳm nhất."
2769 = "Dù vẫn đang kết nối \\x%l共感;#00ffc040;cộng cảm%l;#;, nhưng cơn đau đã biến mất hoàn toàn. Cứ như có phép màu vậy——à không, không phải thế."
2771 = "Tôi muốn khen ngợi, muốn an ủi em ấy. Nhưng đó không phải là nhiệm vụ của tôi, và bây giờ cũng chưa phải lúc."
2773 = "「Em sẽ đợi ngài, ngài Soutetsu」"
2774 = "「Chúc ngài thượng lộ bình an. Ngài đi cẩn thận nhé」"
2775 = "「……」"
2776 = "Ngài Soutetsu cúp máy."
2777 = "Lời nói của ngài Soutetsu, những gì ngài Munakata đã gửi gắm——"
2782 = "Ngay từ tiếng nói đầu tiên, đã là Olivy. Dù giọng nói yếu ớt, nhưng vẫn là Olivy của ngày thường."
2786 = "Giọng nói mạnh mẽ như hét lên của Hibiki và Nagi. Những giọng nói điềm tĩnh——ngay lập tức hưởng ứng theo."
2796 = "(Cạch)"
2797 = "（Phập! Phập!!）"
2799 = "(Chỉ một chút nữa thôi, một chút nữa thôi, Olivy)"
2802 = "（Nếu có một \\x%lレイルロオド;#00ffc040;Railord%l;#; có thể \\x%l共感;#00ffc040;cộng cảm%l;#; mật thiết ở bên cạnh. Chính điều đó đã là một sự đảm bảo an toàn rồi——）"

[selections]
